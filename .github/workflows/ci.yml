name: CI

# Fast validation on every pull request, so config/content/test failures surface
# before merge instead of only at deploy time. This workflow never deploys — it has no
# Pages permissions, uploads no artifact, and has no deploy job (deploy-pages.yml owns
# deployment, on push to main only).

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        # No LFS: the static build only references audio by path, so the pointer files
        # are enough to validate — skipping the fetch keeps PR checks fast.

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm -C web install --frozen-lockfile

      - name: Assert exercises.md/solutions.md are in sync with exercises.yml
        run: npx --yes tsx build/gen-exercises.ts --all --check

      - name: Check single-choice answer-letter balance
        run: npx --yes tsx build/check-answer-balance.ts --all

      - name: Check answers do not spell alternatives inline
        run: npx --yes tsx build/check-answer-alternatives.ts --all

      - name: Validate vocab.yml and assert no needsReview markers remain
        run: npx --yes tsx build/import-vocab.ts --all --check

      - name: Typecheck
        run: pnpm -C web typecheck

      - name: Run unit tests
        run: pnpm -C web test

      - name: Build (validates Astro content collections)
        run: pnpm -C web build
