name: Deploy site

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'A1/**'
      - 'A2/**'
      - 'B1/**'
      - 'B2/**'
      - 'C1/**'
      - 'docs/web/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - run: git lfs pull

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm -C web install --frozen-lockfile

      - name: Assert exercises.md/solutions.md are in sync with exercises.yml
        run: npx --yes tsx build/gen-exercises.ts --all --check

      - run: pnpm -C web build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
