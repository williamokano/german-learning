name: CI & Deploy

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'A1/**'
      - 'A2/**'
      - 'B1/**'
      - 'B2/**'
      - 'C1/**'
      - 'docs/web/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Per-ref so a PR's check run and a main deploy never cancel each other.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Real audio (LFS) is only needed to publish; PR builds validate fine with the
          # pointer files, so skip the fetch to keep pull-request checks fast.
          lfs: ${{ github.event_name != 'pull_request' }}

      - if: github.event_name != 'pull_request'
        run: git lfs pull

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - run: pnpm -C web install --frozen-lockfile

      - name: Assert exercises.md/solutions.md are in sync with exercises.yml
        run: npx --yes tsx build/gen-exercises.ts --all --check

      - name: Validate vocab.yml and assert no needsReview markers remain
        run: npx --yes tsx build/import-vocab.ts --all --check

      - name: Run unit tests
        run: pnpm -C web test

      - run: pnpm -C web build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
