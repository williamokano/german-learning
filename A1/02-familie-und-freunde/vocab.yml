# Reviewed from A1/02 lesson.md §4 Wortschatz.
# Note: the parser dropped the family table (columns: Maskulin | Feminin | Plural;
# no der/die/das header → "non-gender table") and the numbers 20–1000 table (same
# reason). It also mis-routed the 8 predicative adjectives to pos:other (bare
# lowercase word path). Every entry below was added by hand from §4. Tag taxonomy
# mirrors the A1/03 pilot + A1/01 vocab (issue #337).
#
# Section headers in lesson.md:
#   Die Familie                — 30 nouns (9 masc + 9 fem + 6 plural-only + 4 single-cell + 2 split forms)
#   Die Zahlen 20–1000         — 12 numbers
#   Useful adjectives          — 8 predicative adjectives
#   Possessivpronomen & Adjektive (Hörtext, §8)  — skipped (separate section, not §4)
