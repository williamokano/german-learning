  # ── Die Zahlen 20–1000 ─────────────────────────────────────────────────────
  # pos: number; no article, no plural. Compound numbers 21+ written as one
  # word (ein-und-zwan-zig pattern). Parenthesised "ein" in 100/1000 is optional.
  - de: zwanzig
    article: null
    plural: null
    en: twenty
    pos: number
    tags: [number]
    core: true
  - de: einundzwanzig
    article: null
