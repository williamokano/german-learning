lesson: A1/02
title: "A1 · Lektion 2 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna zeigt Bruno ein Foto."
        answer: true
        why: 'Bruno fragt: „Anna, ist das deine Familie auf dem Foto?" — Anna zeigt ihm das Foto.'
      - q: "Auf dem Foto sind Annas Eltern."
        answer: true
        why: 'Anna sagt: „Das sind meine Eltern" — die Eltern sind auf dem Foto.'
      - q: "Annas Schwester heißt Claudia."
        answer: false
        why: "Annas Schwester heißt Lena; Claudia ist die Mutter."
      - q: "Annas Oma ist dreiundachtzig Jahre alt."
        answer: true
        why: 'Anna sagt: „Das ist meine Oma Erika. Sie ist dreiundachtzig."'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen and decide: Richtig (R) oder Falsch (F)?"
    items:
      - { q: "Herr Steinmeyer hat zwei Kinder.", answer: false, why: "Herr Steinmeyer hat eine Tochter, nicht zwei Kinder." }
      - q: "Seine Tochter heißt Sofia."
        answer: true
        why: 'Herr Steinmeyer sagt: „Sie heißt Sofia."'
      - { q: "Frau Weber ist verheiratet.", answer: false, why: "Frau Weber ist geschieden, nicht verheiratet." }
      - q: "Herr Steinmeyers Frau kommt aus Salzburg."
        answer: true
        why: 'Herr Steinmeyer sagt: „Meine Frau kommt auch aus Österreich, aus Salzburg."'

  - id: H2
    block: H
    type: single-choice
    title: "Aussprache-Check"
    instructions: "Höre den Hör-zu-Clip und wähle die passende Antwort."
    instructionsEn: "Listen to the Hör zu clip and choose the matching answer."
    items:
      - q: "Hör zu 1 (Familie) — who is the father of your mother?"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "der Bruder" }
          - { key: b, text: "der Großvater" }
          - { key: c, text: "der Onkel" }
        answer: b
        why: "the father of your mother = your mother's father = der Großvater."
      - q: "Hör zu 1 (Familie) — your mother's sister is …"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "die Tante" }
          - { key: b, text: "die Schwester" }
          - { key: c, text: "die Großmutter" }
        answer: a
        why: "Mutter's sister = die Tante (not die Schwester, which is your sister)."
      - q: "Hör zu 2 (Zahlen 20–100) — what comes after fünfzig?"
        audio: hoerzu2.mp3
        options:
          - { key: a, text: "vierzig" }
          - { key: b, text: "sechzig" }
          - { key: c, text: "achtzig" }
        answer: b
        why: "fünfzig → sechzig → siebzig (the regular tens pattern)."
      - q: "Hör zu 2 (Zahlen 20–100) — what's the number siebzig?"
        audio: hoerzu2.mp3
        options:
          - { key: a, text: "60" }
          - { key: b, text: "70" }
          - { key: c, text: "80" }
        answer: b
        why: "siebzig = 70."
      - q: "Hör zu 3 (Possessivpronomen) — which word means \"my\"?"
        audio: hoerzu3.mp3
        options:
          - { key: a, text: "mein" }
          - { key: b, text: "dein" }
          - { key: c, text: "sein" }
        answer: a
        why: "ich → mein (the \"I\" form of the possessive)."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre den Text und fülle die Lücken. Drei Wörter passen nicht."
    instructionsEn: "Listen to the text and fill in the gaps. Three words do not fit."
    text: |
      Das ist Familie {1}. Der Vater heißt {2}. Er kommt aus
      Deutschland, aus {3}. Die Mutter heißt Maria. Sie kommt aus
      Österreich, aus Wien. Sie haben zwei Kinder: einen Sohn und eine
      Tochter. Der Sohn heißt Max — er ist {4} Jahre alt und ledig. Die
      Tochter heißt Lisa — sie ist {5} und hat ein Kind. Die
      Großmutter heißt {6} und wohnt auch in München.
    bank: [Bergmann, Eva, Helmut, München, Thomas, verheiratet, Leipzig, zwanzig, zwölf]
    answers:
      "1": Bergmann
      "2": Thomas
      "3": München
      "4": zwanzig
      "5": verheiratet
      "6": Eva

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Mama kommt am Wochenende"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Nachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Hallo Anna, hier ist Mama. Ich rufe an wegen dem Wochenende. Wir möchten dich am Samstag besuchen. Wir kommen mit dem Zug um vierzehn Uhr an. Dein Vater und ich haben eine Überraschung für dich. Dein Bruder kommt auch mit. Bitte ruf mich zurück, damit ich weiß, ob der Termin passt. Vielen Dank und bis Samstag!"
    notes: "**Chunk alert (forward-reference):** The transcript uses several structures from later lessons — *anrufen* (L5: separable), *möchten … besuchen* (L3: möchten + infinitive), *mit dem Zug* (L8: mit + Dat), *ankommen* (L5: separable), *mitkommen* (L5: separable), *zurückrufen* (L10: imperative + L5 separable), *damit … ob … passt* (A2/03: subordinate clauses). Read the message as a fixed chunk for now."
    items:
      - q: "Wessen Nachricht ist das?"
        options:
          - { key: a, text: "Von Mama." }
          - { key: b, text: "Von Anna." }
          - { key: c, text: "Von Oma." }
        answer: a
        why: 'Hallo Anna, hier ist Mama.'
      - q: "Wann möchte die Familie kommen?"
        options:
          - { key: a, text: "Am Freitag." }
          - { key: b, text: "Am Samstag." }
          - { key: c, text: "Am Sonntag." }
        answer: b
        why: 'Wir möchten dich am Samstag besuchen.'
      - q: "Womit kommt die Familie?"
        options:
          - { key: a, text: "Mit dem Auto." }
          - { key: b, text: "Mit dem Zug." }
          - { key: c, text: "Mit dem Bus." }
        answer: b
        why: 'Wir kommen mit dem Zug um vierzehn Uhr an.'
      - q: "Wer kommt mit?"
        options:
          - { key: a, text: "Der Bruder." }
          - { key: b, text: "Die Schwester." }
          - { key: c, text: "Der Opa." }
        answer: a
        why: 'Dein Bruder kommt auch mit.'

