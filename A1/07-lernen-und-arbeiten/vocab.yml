# Reviewed from A1/07 lesson.md §4 Wortschatz. Hand-written: the parser dropped
# the bulk (Wortschatz here uses four 2-column and one 3-column tables whose
# headers — "Beruf (m) | Beruf (f) | English", "German | English" — don't match
# the 3-gender pattern, plus an inline-bold verb list the parser doesn't
# recognise in this layout). Every entry below was added by hand.
