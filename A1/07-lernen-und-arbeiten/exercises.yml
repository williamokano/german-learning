  - id: B3
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
    instructions: "Each sentence has exactly one mistake. The wrong/missing word is shown as a gap — write the correct form."
    text: |
      1. Ich muss heute {1}. (arbeite → Infinitiv!)
      2. {2} du Arzt werden? (Will → du-Form)
      3. Du darfst hier {3} rauchen. (zweimal „du" — einmal reicht)
      4. Er muss das Formular nicht {4}. (Infinitiv fehlt)
      5. Ich bin {5} Lehrer. (kein Artikel nach sein!)
      6. Wir wollen den Kurs {6}. (anmelde → Infinitiv)
      7. Sie muss früher {7}. (aufgehst → falsches Verb)
      8. Darf ich kurz {8}? (kein „Sie" am Ende!)
      9. Bruno will Programmierer {9}. (Satzklammer: Infinitiv ans Ende)
      10. Ihr dürft nicht laut sein — hier {10} man leise arbeiten. (musst → man = er/sie/es)
    answers:
      "1": arbeiten
      "2": Willst
      "3": nicht
      "4": ausfüllen
      "5": "—"
      "6": anmelden
      "7": aufhören
      "8": fragen
      "9": werden
      "10": muss

