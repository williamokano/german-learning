lesson: A1/07
title: "A1 · Lektion 7 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog A (informell) — Im Büro"
    audio: dialog1_a.mp3
    instructions: "Listen and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Bruno muss um acht Uhr im Büro sein."
        answer: true
        why: 'Bruno sagt: „Ich muss um acht Uhr im Büro sein."'
      - q: "Anna muss auch um acht Uhr arbeiten."
        answer: false
        why: "Anna arbeitet von neun bis fünf, nicht um acht."
      - q: "Anna will heute Abend einen Computerkurs machen."
        answer: false
        why: "Der Kurs ist morgen — heute Abend will Anna lernen."
      - q: "Bruno will auch den Kurs machen."
        answer: true
        why: 'Bruno sagt: „Darf ich auch mitmachen? Dann will ich heute noch den Kurs buchen."'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog B (formell) — Im Büro"
    audio: dialog1_b.mp3
    instructions: "Listen and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Frau Yilmaz sagt, Anna muss das Meeting vorbereiten."
        answer: true
        why: 'Frau Yilmaz sagt: „Sie müssen heute das Meeting vorbereiten."'
      - q: "Das Meeting fängt um neun Uhr an."
        answer: false
        why: "Das Meeting fängt um zehn Uhr an, nicht um neun."
      - q: "Herr Brandt darf heute früher gehen."
        answer: true
        why: 'Frau Yilmaz sagt: „Herr Brandt darf heute früher gehen — er hat einen Arzttermin."'
      - q: "Anna will das Meeting morgen vorbereiten."
        answer: false
        why: 'Anna sagt: „Ich beginne sofort." (nicht morgen)'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Marias Arbeitstag"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 6 missing words. Two words are not needed."
    text: |
      Maria arbeitet als {1} in einem {2} in München. Sie muss
      morgens um {3} Uhr aufstehen. Die Arbeit fängt um halb acht an und
      endet um {4} Uhr. Am Nachmittag muss sie noch {5}. Sie
      will später gern {6} arbeiten.
    bank: [Verkäuferin, Geschäft, sechs, achtzehn, einkaufen, Teilzeit, Vollzeit, Lehrerin]
    answers:
      "1": Verkäuferin
      "2": Geschäft
      "3": sechs
      "4": achtzehn
      "5": einkaufen
      "6": Teilzeit

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht vom Computerkurs"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Nachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Hallo Anna, hier ist Maria. Ich rufe an wegen dem Computerkurs am Montag. Der Kurs fängt leider erst um neunzehn Uhr an, nicht um achtzehn Uhr. Du musst deinen Laptop mitbringen. Du darfst auch eine Freundin mitbringen — der Kurs hat noch freie Plätze. Bitte ruf mich zurück, wenn du Fragen hast. Vielen Dank!"
    items:
      - q: "Wessen Nachricht ist das?"
        options:
          - { key: a, text: "Von Anna." }
          - { key: b, text: "Von Maria." }
          - { key: c, text: "Von Bruno." }
        answer: b
        why: '„Hallo Anna, hier ist Maria."'
      - q: "Worum geht es in der Nachricht?"
        options:
          - { key: a, text: "Um einen Computerkurs." }
          - { key: b, text: "Um einen Sprachkurs." }
          - { key: c, text: "Um einen Yogakurs." }
        answer: a
        why: '„Ich rufe an wegen dem Computerkurs am Montag."'
      - q: "Wann fängt der Kurs an?"
        options:
          - { key: a, text: "Um achtzehn Uhr." }
          - { key: b, text: "Um neunzehn Uhr." }
          - { key: c, text: "Um zwanzig Uhr." }
        answer: b
        why: '„Der Kurs fängt leider erst um neunzehn Uhr an, nicht um achtzehn Uhr."'
      - q: "Was soll Anna mitbringen?"
        options:
          - { key: a, text: "Einen Laptop." }
          - { key: b, text: "Ein Buch." }
          - { key: c, text: "Einen Ausweis." }
        answer: a
        why: '„Du musst deinen Laptop mitbringen."'

