      — Wirklich? Du {6} auch mitkommen — wir lernen bei mir zu Hause.
      — Super! Darf ich meine Kollegin {7} mitbringen?
      — Natürlich! Aber ihr {8} pünktlich um sieben Uhr da sein.
    answers:
