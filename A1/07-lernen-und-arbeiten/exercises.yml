  - id: B8
    block: B
    type: free-write
    title: "Antworten mit Modalverben"
    prompt: "Answer each question using the cue given in brackets. Write a full sentence."
    stimulus: |
      1. Was musst du heute machen? (das Meeting vorbereiten)
      2. Was will Anna werden? (Ärztin)
      3. Darf man hier rauchen? (nein)
      4. Muss ich früh aufstehen? (ja, um sieben Uhr)
      5. Was will Bruno lernen? (Programmieren)
      6. Dürfen die Schüler ihr Handy benutzen? (nein, im Unterricht)
      7. Was wollen wir nächstes Jahr machen? (einen Sprachkurs in Deutschland)
      8. Muss Herr Brandt heute kommen? (nein — Arzttermin)
    model: |
      1. Ich muss das Meeting vorbereiten.
      2. Anna will Ärztin werden.
      3. Nein, du darfst hier nicht rauchen. / Nein, hier darf man nicht rauchen.
      4. Ja, du musst um sieben Uhr aufstehen.
      5. Bruno will Programmieren lernen.
      6. Nein, die Schüler dürfen ihr Handy im Unterricht nicht benutzen.
      7. Wir wollen nächstes Jahr einen Sprachkurs in Deutschland machen.
      8. Nein, Herr Brandt muss heute nicht kommen — er hat einen Arzttermin.

