  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "`müssen nicht` oder `dürfen nicht`?"
    instructions: "Prohibition → dürfen nicht. No obligation → müssen nicht."
    text: |
      1. Du {1} nicht lügen. (prohibition)
      2. Ich {2} nicht arbeiten — heute ist Feiertag. (no obligation)
      3. Hier {3} man nicht parken. (prohibition)
      4. Du {4} nicht früh aufstehen — der Kurs beginnt um zehn. (no obligation)
      5. Im Krankenhaus {5} man nicht laut sein. (prohibition)
      6. Sie {6} das nicht machen — der Chef hat es verboten. (prohibition)
      7. Wir {7} heute nicht in die Schule — es gibt keinen Unterricht. (no obligation)
      8. Du {8} nicht alles wissen! (no obligation)
    answers:
      "1": darfst
      "2": muss
      "3": darf
      "4": musst
      "5": darf
      "6": dürfen
      "7": müssen
      "8": musst

  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "Satzklammer: put the sentence together"
    instructions: "Rewrite as a full sentence. Keep the modal in position 2, infinitive at the end. Example: *ich / müssen / heute / arbeiten* → *Ich muss heute arbeiten.*"
    text: |
      1. ich / wollen / Deutsch / lernen → {1}
      2. du / müssen / die Hausaufgaben / machen → {2}
      3. Anna / dürfen / hier / parken → {3}
      4. wir / wollen / das Formular / ausfüllen → {4}
      5. ihr / müssen / pünktlich / sein → {5}
      6. Bruno / dürfen / nicht / rauchen → {6}
      7. sie (she) / wollen / Programmiererin / werden → {7}
      8. Sie (formal) / müssen / das Formular / ausfüllen → {8}
    answers:
      "1": "Ich will Deutsch lernen."
      "2": "Du musst die Hausaufgaben machen."
      "3": "Anna darf hier parken."
      "4": "Wir wollen das Formular ausfüllen."
      "5": "Ihr müsst pünktlich sein."
      "6": "Bruno darf nicht rauchen."
      "7": "Sie will Programmiererin werden."
      "8": "Sie müssen das Formular ausfüllen."

