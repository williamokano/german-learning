lesson: A1/04
title: "A1 · Lektion 4 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog A: Die neue Wohnung"
    audio: dialog1_a.mp3
    instructions: "Höre und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen and decide: True (R) or False (F)?"
    items:
      - q: "Anna zeigt Bruno ihre neue Wohnung."
        answer: true
        why: 'Anna sagt: „Komm rein! Das ist meine neue Wohnung."'
      - q: "Die Wohnung hat vier Zimmer."
        answer: false
        why: "Die Wohnung hat drei Zimmer (nicht vier)."
      - q: "Es gibt einen Balkon — er ist groß."
        answer: false
        why: "Der Balkon ist klein (nicht groß)."
      - q: "Die Miete ist 850 Euro im Monat."
        answer: true
        why: 'Anna bestätigt „850 Euro im Monat."'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog B: Am Telefon"
    audio: dialog1_b.mp3
    instructions: "Höre und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen and decide: True (R) or False (F)?"
    items:
      - q: "Bruno fragt wegen einer Wohnungsanzeige an."
        answer: true
        why: "Bruno ruft wegen einer Wohnungsanzeige an."
      - q: "Die Wohnung hat drei Zimmer."
        answer: false
        why: "Die Wohnung hat zwei Zimmer (nicht drei)."
      - q: "Es gibt einen Garten, aber keinen Balkon."
        answer: true
        why: '„Nein, aber es gibt einen Garten."'
      - q: "Die Wohnung kostet 700 Euro."
        answer: true
        why: '„700 Euro."'

  - id: H2
    block: H
    type: single-choice
    title: "Aussprache-Check (Hör zu 1–3)"
    instructions: "Höre die drei Aussprache-Clips und wähle das passende Wort."
    instructionsEn: "Listen to the three Aussprache clips and pick the matching word."
    items:
      - q: "Hör zu 1 (Räume) — wo kochst du?"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "das Bad" }
          - { key: b, text: "die Küche" }
          - { key: c, text: "der Flur" }
        answer: b
        why: "you cook in the kitchen (die Küche)."
      - q: "Hör zu 1 (Räume) — wo schläfst du?"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "das Wohnzimmer" }
          - { key: b, text: "das Bad" }
          - { key: c, text: "das Schlafzimmer" }
        answer: c
        why: "you sleep in the bedroom (das Schlafzimmer)."
      - q: "Hör zu 2 (Möbel) — worauf sitzt du am Tisch?"
        audio: hoerzu2.mp3
        options:
          - { key: a, text: "der Stuhl" }
          - { key: b, text: "das Sofa" }
          - { key: c, text: "der Schrank" }
        answer: a
        why: "the thing you sit on at a table is a chair (der Stuhl)."
      - q: "Hör zu 3 (Farben) — the sky is …"
        audio: hoerzu3.mp3
        options:
          - { key: a, text: "grün" }
          - { key: b, text: "blau" }
          - { key: c, text: "gelb" }
        answer: b
        why: "the sky is blue (blau)."
      - q: "Hör zu 3 (Farben) — opposite of *weiß* is …"
        audio: hoerzu3.mp3
        options:
          - { key: a, text: "grau" }
          - { key: b, text: "schwarz" }
          - { key: c, text: "braun" }
        answer: b
        why: "the opposite of weiß is schwarz."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre den Hörtext und fülle die 6 Lücken mit Wörtern aus dem Kasten. Zwei Wörter passen nicht."
    instructionsEn: "Listen to the Hörtext and fill the 6 gaps with words from the bank. Two words are not needed."
    text: |
      Anna wohnt jetzt in einer neuen Wohnung in Berlin. Die Wohnung hat
      drei Zimmer: ein {1}, ein Schlafzimmer und eine kleine {2}.
      Es gibt auch ein Bad mit einem {3}. Im Wohnzimmer stehen ein
      großes, braunes Sofa und ein {4}. Anna findet die Wohnung
      {5} — aber ein bisschen {6}!
    bank: [Wohnzimmer, Küche, Balkon, Schreibtisch, schön, teuer, Garten, hell]
    answers:
      "1": Wohnzimmer
      "2": Küche
      "3": Balkon
      "4": Schreibtisch
      "5": schön
      "6": teuer

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Neue Wohnung im Haus"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Achtung, eine Durchsage. Liebe Mieterinnen und Mieter, in unserem Haus gibt es eine neue Wohnung. Die Wohnung hat zwei Zimmer, eine Küche und ein Bad. Es gibt auch einen kleinen Balkon. Die Miete ist sechshundert Euro im Monat. Die Besichtigung ist am Samstag um elf Uhr. Bitte rufen Sie uns an, wenn Sie die Wohnung sehen wollen. Vielen Dank."
    items:
      - q: "Was gibt es im Haus?"
        options:
          - { key: a, text: "Ein neues Geschäft." }
          - { key: b, text: "Eine neue Wohnung." }
          - { key: c, text: "Einen Aufzug." }
        answer: b
        why: '„in unserem Haus gibt es eine neue Wohnung."'
      - q: "Was hat die Wohnung?"
        options:
          - { key: a, text: "Drei Zimmer." }
          - { key: b, text: "Zwei Zimmer." }
          - { key: c, text: "Ein Zimmer." }
        answer: b
        why: '„Die Wohnung hat zwei Zimmer, eine Küche und ein Bad."'
      - q: "Was gibt es noch?"
        options:
          - { key: a, text: "Einen Garten." }
          - { key: b, text: "Eine Garage." }
          - { key: c, text: "Einen Balkon." }
        answer: c
        why: '„Es gibt auch einen kleinen Balkon."'
      - q: "Wann ist die Besichtigung?"
        options:
          - { key: a, text: "Am Samstag um elf Uhr." }
          - { key: b, text: "Am Sonntag um zehn Uhr." }
          - { key: c, text: "Am Freitag um vierzehn Uhr." }
        answer: a
        why: '„Die Besichtigung ist am Samstag um elf Uhr."'

