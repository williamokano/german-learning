# Reviewed from A1/04 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
#
# Parser gap (consistent with A1/01, A1/03): the "Die Räume" table at §4.1 uses an
# empty header (`| | | |`) rather than a `| der (m) | die (f) | das (n) |` header,
# so the gender-table extractor skips it and only logs a warning. All 15 room
# nouns below were added by hand. The Möbel table (§4.2) IS a gender table and the
# parser captured it correctly, but it dropped umlaut plurals (–e → "Schranke"
# instead of "Schränke") — every noun below carries a hand-verified plural.
#
# The parser also routed every bare-lowercase word (adjectives, colors) through
# `pos: other` (needsReview: "confirm part of speech") and merged each opposite
# pair into a single `pos: phrase` entry ("hell ↔ dunkel"). The hand pass splits
# every pair into two `pos: adjective` entries and re-types the colors as
# [color, adjective]. All `needsReview` flags and `reviewNote` hints are cleared.
lesson: A1/04

