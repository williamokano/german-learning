  # ── Im Gesundheitswesen — nouns (healthcare setting) ───────────────────────
  # Arzt / Ärztin are gender pairs, modelled the same way as A1/01 Personennationalität.
  - de: Arzt
    article: der
    plural: Ärzte
    en: doctor (male)
    pos: noun
    tags: [healthcare, concrete]
    core: true
  - de: Ärztin
    article: die
    plural: Ärztinnen
    en: doctor (female)
    pos: noun
    tags: [healthcare, concrete]
    core: true
  - de: Krankenhaus
    article: das
    plural: Krankenhäuser
    en: hospital
    pos: noun
    tags: [healthcare, concrete]
    core: true
  - de: Apotheke
    article: die
    plural: Apotheken
    en: pharmacy
    pos: noun
    tags: [healthcare, concrete]
    core: true
    example: "Ich gehe in die Apotheke."
  # Rezept = BOTH "prescription" AND "cooking recipe" (das Rezept is one of those
  # elegant polysemes — context disambiguates). Gloss keeps both senses.
  - de: Rezept
    article: das
    plural: Rezepte
    en: prescription; recipe (cooking)
    pos: noun
    tags: [healthcare, concrete]
    core: true
  - de: Tablette
    article: die
    plural: Tabletten
    en: tablet; pill
    pos: noun
    tags: [healthcare, concrete]
    core: true
    example: "Nehmen Sie diese Tabletten dreimal täglich."
  - de: Medizin
    article: die
    plural: Medikamente
    en: medicine (the drug itself)
    pos: noun
    tags: [healthcare, concrete]
    core: true
    example: "Anna bringt Bruno die Medizin."
  - de: Termin
    article: der
    plural: Termine
    en: appointment
    pos: noun
    tags: [healthcare, concrete]
    core: true
  # Krankenversicherung is abstract (you can't touch it) → no concrete tag.
  - de: Krankenversicherung
    article: die
    plural: Krankenversicherungen
    en: health insurance
    pos: noun
    tags: [healthcare]
    core: true

  # ── Verben ─────────────────────────────────────────────────────────────────
  # weh tun and schlafen carry the ⚠️ marker in lesson §4 (irregular / idiom).
  # Verbs that are listed as reflexive in §4 (sich fühlen, sich ausruhen) are stored
  # as bare infinitives with a usage note in the example; the lemma shape is what
  # the deck needs to recall. Separable verbs keep the | spelling from the lesson.
  - de: weh tun
    article: null
    plural: null
    en: to hurt; to ache
    pos: verb
    tags: [verb]
    core: true
    example: "Mein Kopf tut weh. (plural: tun)"
  - de: fühlen
    article: null
    plural: null
    en: "to feel (reflexive: sich fühlen)"
    pos: verb
    tags: [verb]
    core: true
    example: "Ich fühle mich nicht gut."
  - de: auf|machen
    article: null
    plural: null
    en: to open (separable)
    pos: verb
    tags: [verb]
    core: true
    example: "Mach den Mund auf!"
  - de: zu|machen
    article: null
    plural: null
    en: to close (separable)
    pos: verb
    tags: [verb]
    core: true
  - de: aus|ruhen
    article: null
    plural: null
    en: "to rest (reflexive separable: sich ausruhen)"
    pos: verb
    tags: [verb]
    core: true
    example: "Ruh dich aus!"
  - de: schlafen
    article: null
    plural: null
    en: to sleep
    pos: verb
    tags: [verb]
    core: true
    example: "du schläfst, er schläft (irregular like fahren, L6)."
  - de: husten
    article: null
    plural: null
    en: to cough
    pos: verb
    tags: [verb]
    core: true
  - de: nehmen
    article: null
    plural: null
    en: to take (a pill)
    pos: verb
    tags: [verb]
    core: true
    example: "Nimm diese Tabletten!"
  - de: schreiben
    article: null
    plural: null
    en: to write (a prescription)
    pos: verb
    tags: [verb]
    core: true
  - de: untersuchen
    article: null
    plural: null
    en: to examine
    pos: verb
    tags: [verb]
    core: true
