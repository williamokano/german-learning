# Reviewed from A1/10 lesson.md §4 Wortschatz.
# Note: the importer dropped the body-parts table — §4 advertises it with a plain
# two-column "German | English" header (no der/die/das), so it is classified as a
# non-gender table and skipped. Every entry below was added by hand from §4.
# Tag taxonomy mirrors the A1/03 / A1/01 / A1/02 pilots (issue #337).
#
# Section headers in lesson.md:
#   Der Körper (body parts)              — 20 nouns
#   Krankheiten und Symptome (illnesses) — 6 mass nouns + 6 plural-only pain-compounds + 3 adjectives
#   Im Gesundheitswesen (healthcare)     — 8 nouns (Arzt/Ärztin as separate articles)
#   Verben (verbs)                       — 10 verbs (incl. separable + reflexive + 2 irregular ⚠️)
lesson: A1/10

entries:
