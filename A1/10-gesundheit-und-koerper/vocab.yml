  # ── Krankheiten und Symptome — singular mass nouns ─────────────────────────
  # All uncountable nouns used in the singular only (no plural). Tagged [symptom]
  # (not concrete — they are conditions/states, not picturable objects).
  - de: Erkältung
    article: die
    plural: Erkältungen
    en: cold
    pos: noun
    tags: [symptom]
    core: true
    example: "Ich habe eine Erkältung."
  - de: Grippe
    article: die
    plural: null
    en: flu
    pos: noun
    tags: [symptom]
    core: true
  - de: Husten
    article: der
    plural: null
    en: cough
    pos: noun
    tags: [symptom]
    core: true
    example: "Ich habe Husten."
  - de: Schnupfen
    article: der
    plural: null
    en: runny nose; head cold
    pos: noun
    tags: [symptom]
    core: true
  - de: Fieber
    article: das
    plural: null
    en: fever
    pos: noun
    tags: [symptom]
    core: true
    example: "Ich habe 38 Grad Fieber."
  # Schmerzen (plural-only noun = "pain" in general; the singular "Schmerz" exists
  # in formal/poetic use but is not taught at A1).
  - de: Schmerzen
    article: die
    plural: null
    en: pain (plural only)
    pos: noun
    tags: [symptom]
    core: true
    example: "Ich habe Schmerzen."

  # ── Krankheiten und Symptome — plural-only compound *-schmerzen ─────────────
