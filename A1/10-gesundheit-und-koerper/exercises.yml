  - id: C2
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1"
    instructions: "Wähle die richtige Option (a, b oder c) für jede Lücke."
    instructionsEn: "Choose the correct option (a, b, or c) for each gap."
    items:
      - q: "Guten Tag! Ich (1) ______ Schmerzen in meinem Rücken. — Good day! I (have) pain in my back."
        options:
          - { key: a, text: "habe" }
          - { key: b, text: "bin" }
          - { key: c, text: "nehme" }
        answer: a
        why: "ich-Form von haben: habe."
      - q: "Mein Arzt (2) ______ , ich soll viel (3) ______ und nicht arbeiten. — My doctor says I should sleep a lot and not work."
        options:
          - { key: a, text: "sagt" }
          - { key: b, text: "meint" }
          - { key: c, text: "sollen" }
        answer: a
        why: "sagt = says (3rd-person present of sagen); both sagt and meint are natural."
      - q: "(see above) — infinitive after modal `soll`: (3) ______"
        options:
          - { key: a, text: "schlafen" }
          - { key: b, text: "Schlaf" }
          - { key: c, text: "schläfst" }
        answer: a
        why: "Infinitiv nach Modal `soll`: schlafen."
      - q: "Er hat mir ein Rezept (4) ______. — He has given me a prescription."
        options:
          - { key: a, text: "gegeben" }
          - { key: b, text: "schreiben" }
          - { key: c, text: "geschrieben" }
        answer: a
        why: "Partizip II für Perfekt: gegeben (hat … gegeben)."
      - q: "Ich gehe jetzt in die (5) ______. — I'm going to the (pharmacy) now."
        options:
          - { key: a, text: "Krankenhaus" }
          - { key: b, text: "Apotheke" }
          - { key: c, text: "Rezept" }
        answer: b
        why: "In die Apotheke = to the pharmacy (to pick up the Rezept)."
      - q: "Was kostet das — (6) ______ ich eine Krankenversicherung? — How much does that cost — (do) I have health insurance?"
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "habe" }
          - { key: c, text: "darf" }
        answer: b
        why: "habe ich eine Krankenversicherung? = do I have insurance? (checking eligibility)."

