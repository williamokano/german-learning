      - q: 'Anna sagt: „Geh zum Arzt!" — Anna says: "Go to the doctor!"'
        answer: true
        why: 'Anna sagt: „Du siehst schlecht aus! Geh zum Arzt!"'
      - q: "Bruno hat einen Termin um 14 Uhr. — Bruno has an appointment at 2 pm."
        answer: false
        why: "Der Termin ist um 15 Uhr, nicht 14 Uhr."
      - q: "Der Arzt sagt, Bruno soll ins Krankenhaus. — The doctor says Bruno should go to the hospital."
        answer: false
        why: 'Der Arzt sagt: „Bleiben Sie zu Hause" — kein Krankenhaus.'
      - q: "Bruno trinkt zu Hause Tee mit Honig. — At home, Bruno drinks tea with honey."
        answer: true
        why: "Bruno trinkt zu Hause Tee mit Honig."

