lesson: A1/10
title: "A1 · Lektion 10 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Beim Arzt"
    audio: dialog1.mp3
    instructions: "Höre und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen and decide: True (R) or False (F)?"
    items:
      - q: "Der Patient hat Halsschmerzen und Kopfschmerzen. — The patient has a sore throat and a headache."
        answer: true
        why: 'Der Patient sagt: „Ich habe Halsschmerzen und Kopfschmerzen."'
      - q: "Der Arzt sagt, der Patient soll ins Krankenhaus. — The doctor says the patient should go to the hospital."
        answer: false
        why: 'Der Arzt sagt: „Ruhen Sie sich aus" — kein Krankenhaus.'
      - q: "Der Arzt schreibt dem Patienten ein Rezept. — The doctor writes the patient a prescription."
        answer: true
        why: 'Der Arzt sagt: „Ich schreibe Ihnen ein Rezept."'
      - q: "Der Patient hat 38,5 Grad Fieber. — The patient has a fever of 38.5 degrees."
        answer: true
        why: 'Der Patient sagt: „38,5 Grad."'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog Hör-Check: In der Apotheke"
    audio: dialog2.mp3
    instructions: "Höre und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen and decide: True (R) or False (F)?"
    items:
      - q: "Anna kauft Tabletten ohne Rezept. — Anna buys tablets without a prescription."
        answer: true
        why: "Anna hat kein Rezept und sucht etwas ohne Rezept."
      - q: "Anna soll die Tabletten dreimal täglich nehmen. — Anna should take the tablets three times a day."
        answer: true
        why: 'Die Apothekerin sagt: „Nehmen Sie zwei Tabletten, dreimal täglich."'
      - q: "Die Tabletten kosten fünfzehn Euro. — The tablets cost fifteen euros."
        answer: false
        why: "Die Tabletten kosten sieben Euro neunzig, nicht fünfzehn Euro."
      - q: "Anna darf die Tabletten nicht bei Magenschmerzen nehmen. — Anna is not allowed to take the tablets when she has a stomachache."
        answer: false
        why: 'Die Apothekerin sagt: „Ja, aber essen Sie vorher etwas" — Anna darf sie nehmen.'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Hör zu und fülle die Lücken. Zwei Wörter passen nicht."
    instructionsEn: "Listen and fill in the gaps. Two words do not fit."
    text: |-
      Yuki fühlt sich heute nicht {1}. Ihr {2} tut weh und sie hat {3}.
      Sie ruft Bruno an und fragt: „Was soll ich {4}?" Bruno sagt: „Trink viel Tee und
      bleib zu {5}!" Yuki fragt: „Soll ich zum Arzt {6}?" Bruno antwortet: „Ja, geh morgen zum Arzt."
      Yuki trinkt Tee und {7} den ganzen Tag.
    bank: [Arzt, gehen, gut, Hals, Husten, machen, schläft, Tabletten, Hause]
    answers:
      "1": gut
      "2": Hals
      "3": Husten
      "4": machen
      "5": Hause
      "6": gehen
      "7": schläft

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage in der Apotheke"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Achtung, eine Durchsage. Liebe Kundinnen und Kunden, die Apotheke im Hauptbahnhof hat heute bis zwanzig Uhr geöffnet. Unsere Öffnungszeiten am Sonntag sind von zehn bis achtzehn Uhr. Wir bieten auch einen kostenlosen Blutdruckmess-Service an. Ab nächster Woche haben wir auch einen Grippeimpf-Service. Kommen Sie einfach vorbei — wir beraten Sie gern. Vielen Dank und bleiben Sie gesund."
    items:
      - q: "Wo ist die Apotheke? — Where is the pharmacy?"
        options:
          - { key: a, text: "Im Stadtzentrum." }
          - { key: b, text: "Im Hauptbahnhof." }
          - { key: c, text: "Im Einkaufszentrum." }
        answer: b
        why: '„die Apotheke im Hauptbahnhof hat heute bis zwanzig Uhr geöffnet."'
      - q: "Bis wann hat die Apotheke heute geöffnet? — Until when is the pharmacy open today?"
        options:
          - { key: a, text: "Bis achtzehn Uhr." }
          - { key: b, text: "Bis neunzehn Uhr." }
          - { key: c, text: "Bis zwanzig Uhr." }
        answer: c
        why: '„die Apotheke im Hauptbahnhof hat heute bis zwanzig Uhr geöffnet."'
      - q: "Welchen Service bietet die Apotheke jetzt schon an? — Which service does the pharmacy already offer?"
        options:
          - { key: a, text: "Einen Zahnarzt-Service." }
          - { key: b, text: "Einen Blutdruckmess-Service." }
          - { key: c, text: "Einen Grippeimpf-Service." }
        answer: b
        why: '„Wir bieten auch einen kostenlosen Blutdruckmess-Service an."'
      - q: "Welchen Service bietet die Apotheke ab nächster Woche an? — Which service will the pharmacy offer starting next week?"
        options:
          - { key: a, text: "Einen Grippeimpf-Service." }
          - { key: b, text: "Einen Blutdruckmess-Service." }
          - { key: c, text: "Einen Zahnarzt-Service." }
        answer: a
        why: '„Ab nächster Woche haben wir auch einen Grippeimpf-Service."'

