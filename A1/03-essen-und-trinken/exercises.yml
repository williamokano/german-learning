lesson: A1/03
title: "A1 · Lektion 3 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1
    block: H
    type: true-false
    title: "Dialog Hör-Check"
    instructions: |-
      🎧 **Dialog A:** [dialog1_a.mp3](audio/dialog1_a.mp3)
      🎧 **Dialog B:** [dialog1_b.mp3](audio/dialog1_b.mp3)

      Listen to both dialogs and decide: richtig (R) oder falsch (F)?
    items:
      - { q: "Anna bestellt einen Kaffee und ein Stück Apfelkuchen.", answer: true, why: 'Anna sagt: „Ich möchte einen Kaffee und ein Stück Apfelkuchen, bitte."' }
      - { q: "Bruno möchte Orangensaft.", answer: true, why: 'Bruno fragt nach Orangensaft und bestätigt „Ja, bitte" zum Angebot „Ein Glas Orangensaft".' }
      - { q: "Im Supermarkt kauft Bruno Käse, Brot und Wasser.", answer: true, why: 'Bruno kauft „den Gouda, das Schwarzbrot und eine Flasche Wasser" — Käse, Brot, Wasser.' }
      - { q: "Bruno bezahlt zusammen mit Anna.", answer: false, why: "Sie bezahlen getrennt (separately), not zusammen." }

  - id: H2
    block: H
    type: single-choice
    title: "Aussprache-Check"
    instructions: "Listen to the Hör zu clips in lesson.md (Wortschatz → 🔊 Aussprache) and pick the matching answer."
    items:
      - q: "Hör zu 1 (Lebensmittel) — which one is a fruit?"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "Brot" }
          - { key: b, text: "Banane" }
          - { key: c, text: "Käse" }
        answer: b
        why: "Banane is a fruit; Brot = bread, Käse = cheese."
      - q: "Hör zu 1 (Lebensmittel) — which one is bread for breakfast?"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "Brötchen" }
          - { key: b, text: "Wurst" }
          - { key: c, text: "Tomate" }
        answer: a
        why: "Brötchen = small bread roll, breakfast classic; Wurst = sausage, Tomate = tomato."
      - q: "Hör zu 2 (Getränke) — which one is alcoholic?"
        audio: hoerzu2.mp3
        options:
          - { key: a, text: "Kaffee" }
          - { key: b, text: "Tee" }
          - { key: c, text: "Bier" }
        answer: c
        why: "Bier is alcoholic; Kaffee and Tee are hot drinks."
      - q: "Hör zu 3 (Verben) — 'kosten' means …"
        audio: hoerzu3.mp3
        options:
          - { key: a, text: "to buy" }
          - { key: b, text: "to cost" }
          - { key: c, text: "to pay" }
        answer: b
        why: "kosten = to cost; kaufen = to buy, zahlen = to pay."
      - q: "Hör zu 4 (Mengen) — which one is for a drink?"
        audio: hoerzu4.mp3
        options:
          - { key: a, text: "Stück" }
          - { key: b, text: "Tasse" }
          - { key: c, text: "Kilo" }
        answer: b
        why: "Tasse = cup, used for coffee/tea; Stück = piece, Kilo = kilogram."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Anna ist im Café Central. Sie hat {1} und Durst. Sie möchte einen {2} und ein Stück {3}. Der Kaffee kostet zwei Euro fünfzig, der Kuchen kostet drei Euro neunzig. Das macht {4} Euro {5}. Anna isst und trinkt gern im Café — der Kuchen {6} super!
    bank: [Hunger, Kaffee, Apfelkuchen, sechs, vierzig, schmeckt, Durst, sieben, isst]
    answers:
      "1": Hunger
      "2": Kaffee
      "3": Apfelkuchen
      "4": sechs
      "5": vierzig
      "6": schmeckt

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Angebote im Supermarkt"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Achtung, eine Durchsage. Liebe Kundinnen und Kunden, heute gibt es frische Brötchen im Angebot — sechs Stück für nur zwei Euro. Auch der Käse ist heute zwanzig Prozent billiger. Obst und Gemüse sind auch heute besonders frisch. Unsere Öffnungszeiten heute: bis zwanzig Uhr. Kommen Sie bald und finden Sie unsere Angebote. Vielen Dank für Ihren Besuch."
    items:
      - q: "Was gibt es heute im Angebot?"
        options:
          - { key: a, text: "Frische Brötchen." }
          - { key: b, text: "Frisches Brot." }
          - { key: c, text: "Frische Kuchen." }
        answer: a
        why: '„heute gibt es frische Brötchen im Angebot."'
      - q: "Wie viel kosten sechs Brötchen?"
        options:
          - { key: a, text: "Einen Euro." }
          - { key: b, text: "Zwei Euro." }
          - { key: c, text: "Drei Euro." }
        answer: b
        why: '„sechs Stück für nur zwei Euro."'
      - q: "Was ist auch zwanzig Prozent billiger?"
        options:
          - { key: a, text: "Der Käse." }
          - { key: b, text: "Das Obst." }
          - { key: c, text: "Das Gemüse." }
        answer: a
        why: '„Auch der Käse ist heute zwanzig Prozent billiger."'
      - q: "Bis wann hat der Supermarkt heute geöffnet?"
        options:
          - { key: a, text: "Bis achtzehn Uhr." }
          - { key: b, text: "Bis neunzehn Uhr." }
          - { key: c, text: "Bis zwanzig Uhr." }
        answer: c
        why: '„Unsere Öffnungszeiten heute: bis zwanzig Uhr."'

