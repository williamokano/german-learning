      2. Zusammen oder getrennt? (together)
      3. Was isst du zum Frühstück? (Müsli + Joghurt)
      4. Was trinkst du morgens? (Kaffee)
      5. Haben Sie Bier? (no)
      6. Was kostet die Schokolade? (1,99 €)
      7. Isst du Fleisch? (no — use kein!)
      8. Was brauchen wir? (Eier, Milch, Brot)
    model: |
      1. Ich möchte einen Kaffee und ein Stück Apfelkuchen(, bitte).
      2. Zusammen, bitte.
      3. Ich esse Müsli mit Joghurt.
      4. Ich trinke (morgens) Kaffee.
      5. Nein, wir haben kein Bier. / Nein, leider nicht.
      6. Sie kostet einen Euro neunundneunzig. / Ein Euro neunundneunzig.
      7. Nein, ich esse kein Fleisch.
      8. Wir brauchen Eier, Milch und Brot.

