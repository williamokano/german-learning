      — Gut, dann {3} ich den Käse.
      — Sonst noch {4}?
      — Ja, ich brauche noch {5} Liter Milch und eine {6} Wasser.
      — Gern. Das {7} sechs Euro zwanzig.
      — Hier bitte.
      — Danke, auf {8}!
    answers:
