  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog: Im Café"
    text: |
      — Guten Tag! Was {1} Sie, bitte?
      — Ich {2} einen Kaffee und {3} Stück Kuchen, bitte.
      — Gern. Und Sie?
      — Ich nehme {4} Tee.
      — {5} Sie auch Orangensaft?
      — Ja, natürlich.
      — Dann ein {6} Orangensaft, bitte.
      *(später)*
      — Wir möchten {7}, bitte!
      — Zusammen oder {8}?
    answers:
      "1": möchten
      "2":
        - möchte
        - nehme
      "3": ein
      "4": einen
      "5": Haben
      "6": Glas
      "7": zahlen
      "8": getrennt

