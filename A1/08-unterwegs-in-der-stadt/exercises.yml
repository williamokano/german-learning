lesson: A1/08
title: "A1 · Lektion 8 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog 1: Nach dem Weg fragen"
    audio: dialog1.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - q: "Bruno fragt eine Frau auf der Straße nach dem Bahnhof. — Bruno asks a woman on the street for directions to the train station."
        answer: true
        why: 'Bruno fragt: „Entschuldigung, wo ist der Bahnhof, bitte?"'
      - q: "Die Frau sagt: Fahren Sie mit dem Bus! — The woman says: Take the bus!"
        answer: false
        why: 'Die Frau sagt: „Fahren Sie mit der U-Bahn", nicht mit dem Bus.'
      - q: "Die Haltestelle ist geradeaus und dann die erste Straße links. — The stop is straight ahead and then the first street on the left."
        answer: true
        why: '„Gehen Sie hier geradeaus, dann die erste Straße links."'
      - q: "Bruno fährt mit der Linie 5 und steigt am Dom aus. — Bruno takes line 5 and gets off at the cathedral."
        answer: false
        why: "Bruno steigt am Bahnhof aus, nicht am Dom."

  - id: H1b
    block: H
    type: true-false
    title: "Dialog 2: Wie komme ich zum Museum?"
    audio: dialog2.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - q: "Anna möchte zum Museum Ludwig fahren. — Anna wants to go to the Museum Ludwig."
        answer: true
        why: 'Anna sagt: „Ich möchte morgen zum Museum Ludwig."'
      - q: "Sie muss am Dom umsteigen. — She has to change at the cathedral."
        answer: false
        why: "Anna muss nicht umsteigen; sie steigt am Dom aus (nicht um)."
      - q: "Die Fahrt dauert eine halbe Stunde. — The trip takes half an hour."
        answer: false
        why: "Die Fahrt dauert eine Viertelstunde (15 Minuten), nicht eine halbe Stunde."
      - q: "Jonas kommt am Abend mit Anna ins Museum. — Jonas comes to the museum with Anna in the evening."
        answer: false
        why: "Jonas muss zur Arbeit; sie essen erst am Abend zusammen (nicht Museum)."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill the gaps with the words from the box. Two words are not needed."
    text: |-
      Maria möchte am {1} zum Park gehen. Sie wohnt in der
      {2}, und der Park ist weit. Sie fährt mit dem {3} — sie
      nimmt die Linie 5 und steigt am {4} um. Von dort geht sie zu
      Fuß zum Park: {5} und dann die erste Straße links. Der Weg
      dauert zwanzig {6}.
    bank: [Sonntag, Stadtmitte, Bus, Bahnhof, geradeaus, Minuten, Fahrrad, rechts]
    answers:
      "1": Sonntag
      "2": Stadtmitte
      "3": Bus
      "4": Bahnhof
      "5": geradeaus
      "6": Minuten

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Zugfahrt von Gleis 7 auf Gleis 9"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Achtung, eine Durchsage. Liebe Fahrgäste, der ICE 502 von Berlin nach München fährt heute nicht von Gleis 7, sondern von Gleis 9. Die Abfahrt ist um vierzehn Uhr dreißig. Wir bitten Sie, zum neuen Gleis zu gehen. Der Zug hat eine Verspätung von zehn Minuten. Fahrgäste mit Reservierung finden ihre Plätze wie üblich. Vielen Dank für Ihr Verständnis."
    items:
      - q: "Welcher Zug hat eine Verspätung? — Which train is delayed?"
        options:
          - { key: a, text: "Der ICE 205." }
          - { key: b, text: "Der RE 502." }
          - { key: c, text: "Der ICE 502." }
        answer: c
        why: '„der ICE 502 von Berlin nach München fährt heute nicht von Gleis 7, sondern von Gleis 9."'
      - q: "Von welchem Gleis fährt der Zug heute ab? — From which platform does the train leave today?"
        options:
          - { key: a, text: "Von Gleis 8." }
          - { key: b, text: "Von Gleis 9." }
          - { key: c, text: "Von Gleis 7." }
        answer: b
        why: '„sondern von Gleis 9."'
      - q: "Wann fährt der Zug ab? — When does the train leave?"
        options:
          - { key: a, text: "Um vierzehn Uhr dreißig." }
          - { key: b, text: "Um dreizehn Uhr dreißig." }
          - { key: c, text: "Um fünfzehn Uhr dreißig." }
        answer: a
        why: '„Die Abfahrt ist um vierzehn Uhr dreißig."'
      - q: "Wie viel Verspätung hat der Zug? — How much delay does the train have?"
        options:
          - { key: a, text: "Zehn Minuten." }
          - { key: b, text: "Fünf Minuten." }
          - { key: c, text: "Fünfzehn Minuten." }
        answer: a
        why: '„Der Zug hat eine Verspätung von zehn Minuten."'

