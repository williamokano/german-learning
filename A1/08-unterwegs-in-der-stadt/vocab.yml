# Reviewed from A1/08 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
#
# Section headers in lesson.md:
#   Verkehrsmittel (means of transport) — 8 nouns (der/die/das) + 1 phrase (zu Fuß)
#   Verkehrsinfrastruktur                — 6 nouns (Bahnhof, Haltestelle, Flughafen, Fahrkarte, Fahrt, Linie)
#   In der Stadt (city places)           — 18 nouns (incl. Post no-pl + Bank split from the parser's
#                                         merged "Post (no pl.) die Bank" row; Museum plural Museen
#                                         added by hand because the parser can't extract a "Museen" suffix)
#   Richtungen (directions)             — 5 adverbs (geradeaus/links/rechts/direkt) + 1 adjective
#                                         (weit) + 1 preposition (bis) + 1 phrase (da vorne / da hinten)
#   Verben (verbs)                      — 5 trennbare Verben (ein|steigen, aus|steigen, um|steigen,
#                                         ab|fahren, an|kommen) + 6 regular verbs (dauern, warten,
#                                         nehmen, fahren, gehen, suchen)
