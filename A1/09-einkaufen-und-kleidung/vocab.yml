# Reviewed from A1/09 lesson.md §4 Wortschatz.
# Bootstrapped with build/import-vocab.ts; the parser captured 47 entries (39
# needsReview). The human review pass cleans up:
#   - all English glosses (parser left every noun blank, only filled a few parentheticals)
#   - the 12 Farben (colors), which the parser mis-routed to pos: other (bare
#     lowercase token path) — they are adjectives and live under tags: [color, adjective]
#   - two bold-chunk separable verbs (anprobieren, einpacken): the lesson formats
#     these as "**anprobieren** (to try on) ⚠️ separable" so the trailing word
#     "separable" blocks the paren-at-end regex, leaving en: "" and pos: other.
#     Resolved to pos: verb with the A1/08 pipe convention (an|probieren, ein|packen)
#   - three stray prose chunks the parser caught as vocab rows (the §4 "die Hose
#     and die Jeans are singular…" warning, the §4 "Color names in German are
#     adjectives…" warning, the §4 "Kleidungsgrößen: 36 – 38 – 40 – 42 – 44 – 46"
#     sizes block) — dropped, these are notes not lemmas
#   - das Tuch, which the lesson gives as "das Tuch, –er (Tücher)" — the parser
#     captured the lemma but dropped the plural; restored to Tücher
#
# Sections in lesson.md:
#   Kleidung (clothes)                       — 21 nouns from the 3-gender table
#   Farben (colors)                          — 12 predicative color adjectives
#   Accessoires und Materialien              — 5 accessory nouns + 5 material phrases
#   Größen und Zahlen fürs Einkaufen         — skipped (sizing reference, not vocab lemmas)
#   Verben rund ums Einkaufen                — 10 verbs (2 separable + 8 regular)
