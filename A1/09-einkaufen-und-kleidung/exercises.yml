lesson: A1/09
title: "A1 · Lektion 9 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog 1: Im Kaufhaus"
    audio: dialog1.mp3
    instructions: "Höre und entscheide: richtig (R) oder falsch (F)?"
    instructionsEn: "Listen and decide: true (R) or false (F)?"
    items:
      - q: "Anna sucht eine rote Jacke. — Anna is looking for a red jacket."
        answer: false
        why: 'Anna sagt „Ich suche eine Jacke" (ohne Farbe). Die Verkäuferin sagt, die Jacke ist rot.'
      - q: "Die Jacke passt Anna gut. — The jacket fits Anna well."
        answer: true
        why: 'Die Verkäuferin sagt: „Die Jacke steht Ihnen sehr gut! Und sie passt Ihnen perfekt."'
      - q: "Anna findet die Jacke zu teuer und kauft sie nicht. — Anna finds the jacket too expensive and doesn't buy it."
        answer: false
        why: 'Anna kauft die Jacke. Sie sagt: „Ja, ich finde sie schön. Ich nehme sie!"'
      - q: "Die Verkäuferin sagt, die Jacke steht Anna sehr gut. — The saleswoman says the jacket suits Anna very well."
        answer: true
        why: 'Die Verkäuferin sagt: „Die Jacke steht Ihnen sehr gut!"'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog 2: Im Sportgeschäft"
    audio: dialog2.mp3
    instructions: "Höre und entscheide: richtig (R) oder falsch (F)?"
    instructionsEn: "Listen and decide: true (R) or false (F)?"
    items:
      - q: "Bruno sucht Sportschuhe. — Bruno is looking for sports shoes."
        answer: true
        why: 'Bruno sagt: „Ich suche Sportschuhe."'
      - q: "Bruno probiert die Schuhe in Größe 42 an. — Bruno tries on the shoes in size 42."
        answer: false
        why: "Bruno probiert die Schuhe in Größe 43 an, nicht 42."
      - q: "Die teuren Schuhe kosten neunundneunzig Euro. — The expensive shoes cost ninety-nine euros."
        answer: true
        why: 'Der Verkäufer sagt: „Die kosten neunundneunzig Euro."'
      - q: "Bruno kauft am Ende keine Schuhe. — In the end, Bruno doesn't buy any shoes."
        answer: false
        why: 'Bruno kauft die günstigeren Schuhe für fünfundvierzig Euro. Er sagt: „Den nehme ich!"'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre und fülle die 5 fehlenden Wörter ein. Drei Wörter im Kasten werden nicht gebraucht."
    instructionsEn: "Listen and fill in the 5 missing words. Three words in the box are not needed."
    text: |-
      Bruno sucht ein {1} für seine Mutter.
      Er geht in ein {2} und findet eine schöne Tasche.
      Die Tasche ist aus {3} und {4} fünfundsechzig Euro.
      Die Tasche {5} Bruno sehr — er kauft sie und bezahlt mit Karte.
    bank: [Geschenk, Leder, Modegeschäft, Tasche, kostet, gefällt, passt, kauft]
    answers:
      "1": Geschenk
      "2": Modegeschäft
      "3": Leder
      "4": kostet
      "5": gefällt

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Sommerschlussverkauf im Kaufhaus"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Achtung, eine Durchsage. Liebe Kundinnen und Kunden, unser Kaufhaus hat heute einen großen Sommerschlussverkauf. Alle Sommerkleider sind jetzt fünfzig Prozent günstiger. Auch die Schuhe sind zwanzig Prozent billiger. Die neuen Winterjacken sind ab heute auch da. Der Schlussverkauf gilt nur bis achtzehn Uhr und nur heute. Kommen Sie bald und finden Sie Ihr Lieblingsstück. Vielen Dank für Ihren Besuch."
    items:
      - q: "Was ist heute im Kaufhaus? — What's happening at the department store today?"
        options:
          - { key: a, text: "Ein Sommerschlussverkauf." }
          - { key: b, text: "Eine Modenschau." }
          - { key: c, text: "Eine Eröffnung." }
        answer: a
        why: '„unser Kaufhaus hat heute einen großen Sommerschlussverkauf."'
      - q: "Wie viel Prozent billiger sind die Sommerkleider? — How many percent cheaper are the summer dresses?"
        options:
          - { key: a, text: "Zwanzig Prozent." }
          - { key: b, text: "Dreißig Prozent." }
          - { key: c, text: "Fünfzig Prozent." }
        answer: c
        why: '„Alle Sommerkleider sind jetzt fünfzig Prozent günstiger."'
      - q: "Was ist auch günstiger? — What else is on sale?"
        options:
          - { key: a, text: "Die Mäntel." }
          - { key: b, text: "Die Schuhe." }
          - { key: c, text: "Die Hemden." }
        answer: b
        why: '„Auch die Schuhe sind zwanzig Prozent billiger."'
      - q: "Bis wann gilt der Schlussverkauf? — Until when does the sale last?"
        options:
          - { key: a, text: "Bis heute achtzehn Uhr." }
          - { key: b, text: "Bis morgen." }
          - { key: c, text: "Bis nächste Woche." }
        answer: a
        why: '„Der Schlussverkauf gilt nur bis achtzehn Uhr und nur heute."'

