# Reviewed from A1/06 lesson.md §4 Wortschatz.
# Bootstrapped with build/import-vocab.ts; the parser captured 57 entries (46
# needsReview). The human review pass cleans up:
#   - all English glosses (parser left them blank except for a few parentheticals)
#   - two umlaut plurals the parser dropped (Fahrrad → Fahrräder, Schwimmbad → Schwimmbäder)
#   - bare-lowercase verbs/adjectives the parser mis-routed to pos: other (now split
#     into the correct verb entries; bare adjectives get pos: adjective)
#   - the verb chunk "Fußball / Tennis / Karten spielen" → three phrase entries
#   - five prose lines the parser mis-recognised as vocab:
#       * "Also: der Freund, -e / die Freundin, -nen (L2) · das Kino, -s und der Film, -e (L5)"
#       * "Adjectives: kalt ↔ warm"
#       * "schön ↔ schlecht"
#       * "Winter — die Jahreszeit, -en"
#       * "Always with im: im Sommer, im Winter (like am Montag, L5)"
#     The L2/L5 references and connector pairs were dropped; only the lemma words
#     remain. "die Jahreszeit" was promoted to its own noun entry (with the plural
#     Jahreszeiten).
#
# Sections in lesson.md:
#   Hobbys und Sport — 17 nouns in a 3-gender table
#   Aktivitäten      — verb chunks and bare infinitives (verbs and chunks split below)
#   Das Wetter       — 7 nouns + 3 weather verbs
#   Adjectives       — 7 weather/quality adjectives
#   Die Jahreszeiten — 4 seasons + Jahreszeit
