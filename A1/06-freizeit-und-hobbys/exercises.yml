  - id: B7
    block: B
    type: free-write
    title: "Answer with the cues"
    prompt: "Answer each question using the cue given in brackets. Write a full sentence."
    stimulus: |
      1. Was machst du gern in deiner Freizeit? (lesen + Musik hören)
      2. Kannst du Ski fahren? (no)
      3. Wie ist das Wetter heute? (sun + warm)
      4. Was liest du am liebsten? (Krimis)
      5. Gehen wir am Samstag schwimmen? (yes — good idea!)
      6. Kommst du mit ins Kino? (no — no time)
      7. Was spielt dein Bruder? (Gitarre)
      8. Wann triffst du deine Freunde? (am Wochenende)
    model: |
      1. Ich lese gern und (ich) höre Musik.
      2. Nein, ich kann nicht Ski fahren. / Nein, leider nicht.
      3. Die Sonne scheint und es ist warm.
