lesson: A1/06
title: "A1 · Lektion 6 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog 1: Was machst du gern?"
    audio: dialog1.mp3
    instructions: "Höre und entscheide: richtig (R) oder falsch (F)?"
    instructionsEn: "Listen and decide: true (R) or false (F)?"
    items:
      - q: "Bruno spielt gern Fußball. — Bruno likes playing football."
        answer: true
        why: 'Bruno sagt: „Ich spiele gern Fußball!"'
      - q: "Anna geht auch gern ins Schwimmbad. — Anna also likes going to the pool."
        answer: false
        why: 'Anna geht nur „im Sommer" schwimmen — sie sagt nie „gern".'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog 2: Das Wetter ist schlecht"
    audio: dialog2.mp3
    instructions: "Höre und entscheide: richtig (R) oder falsch (F)?"
    instructionsEn: "Listen and decide: true (R) or false (F)?"
    items:
      - q: "Im zweiten Dialog regnet es. — In the second dialog it is raining."
        answer: true
        why: 'Bruno: „Es regnet und es ist windig."'
      - q: "Am Ende gehen Anna und Bruno ins Kino. — At the end Anna and Bruno go to the movies."
        answer: false
        why: 'Anna „kann heute nicht" (sie trifft ihre Schwester) — nur Bruno geht ins Kino.'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre und fülle jede Lücke mit einem Wort aus dem Kasten. Drei Wörter werden nicht gebraucht."
    instructionsEn: "Listen and fill each gap with one word from the bank. Three words are not needed."
    text: |
      Am {1} spielt Bruno gern {2} im Park. Manchmal spielt er auch mit
      Anna Tennis. Am {3} geht er schwimmen — das {4} ist im Park.
      Anna sieht lieber fern oder hört {5}. Am {6} kochen sie zusammen
      und essen Pizza.
    bank: [Samstag, Fußball, Sonntag, Schwimmbad, Musik, Abend, Tennis, Freitag, Kino]
    answers:
      "1": Samstag
      "2": Fußball
      "3": Sonntag
      "4": Schwimmbad
      "5": Musik
      "6": Abend

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Einladung zum Yoga-Kurs"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Nachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: 'Hallo Anna, hier ist Tom. Ich rufe an wegen dem Yoga-Kurs am Samstag. Der Kurs fängt um zehn Uhr morgens im Sportstudio „aktiv" an. Du brauchst nur bequeme Kleidung und eine Matte. Der Kurs kostet fünfzehn Euro pro Stunde. Du kannst auch ohne Anmeldung kommen. Bitte ruf mich zurück, wenn du mitmachen willst! Vielen Dank!'
    items:
      - q: "Wessen Nachricht ist das? — Whose message is this?"
        options:
          - { key: a, text: "Von Anna." }
          - { key: b, text: "Von Tom." }
          - { key: c, text: "Von Maria." }
        answer: b
        why: 'Hallo Anna, hier ist Tom.'
      - q: "Worum geht es? — What is it about?"
        options:
          - { key: a, text: "Um einen Yoga-Kurs." }
          - { key: b, text: "Um einen Computerkurs." }
          - { key: c, text: "Um einen Sprachkurs." }
        answer: a
        why: '„Ich rufe an wegen dem Yoga-Kurs am Samstag."'
      - q: "Was soll Anna mitbringen? — What should Anna bring?"
        options:
          - { key: a, text: "Eine Matte und bequeme Kleidung." }
          - { key: b, text: "Einen Laptop." }
          - { key: c, text: "Ein Buch." }
        answer: a
        why: '„Du brauchst nur bequeme Kleidung und eine Matte."'
      - q: "Was kostet der Kurs pro Stunde? — How much does the course cost per hour?"
        options:
          - { key: a, text: "Zehn Euro." }
          - { key: b, text: "Fünfzehn Euro." }
          - { key: c, text: "Zwanzig Euro." }
        answer: b
        why: '„Der Kurs kostet fünfzehn Euro pro Stunde."'

