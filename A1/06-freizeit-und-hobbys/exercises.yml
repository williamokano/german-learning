  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Build the bracket"
    instructions: "Bilde die Sätze mit \"können\". Das zweite Verb steht am ENDE als Infinitiv! Beispiel: Ich schwimme gut. → Ich kann gut schwimmen."
    instructionsEn: "Rewrite with `können`. The second verb goes to the END as an infinitive! Example: Ich schwimme gut. → Ich kann gut schwimmen."
    text: |
      1. Ich schwimme gut. → {1}
      2. Er kocht sehr gut. → {2}
      3. Wir spielen Tennis. → {3}
      4. Anna fährt Rad. → {4}
      5. Du singst gut. → {5}
      6. Lena tanzt sehr gut. → {6}
      7. Ihr spielt Gitarre. → {7}
      8. Ich stehe nicht früh auf. → {8} ⚠️ (separable!)
    answers:
      "1": "Ich kann gut schwimmen."
      "2": "Er kann sehr gut kochen."
      "3": "Wir können Tennis spielen."
      "4": "Anna kann Rad fahren."
      "5": "Du kannst gut singen."
      "6": "Lena kann sehr gut tanzen."
      "7": "Ihr könnt Gitarre spielen."
      "8": "Ich kann nicht früh aufstehen."

