      — Ich komme aus Deutschland, aus Köln. Aber ich {5} jetzt in Bonn.
      — Welche Sprachen {6} du?
      — Italienisch, Englisch und ein {7} Deutsch.
      — Super! {8} bald!
    bank: [heißt, Hallo, kommst, komme, wohne, sprichst, bisschen, Bis]
    answers:
      "1": heißt
      "2": Hallo
      "3": kommst
      "4": komme
      "5": wohne
      "6": sprichst
      "7": bisschen
      "8": Bis

