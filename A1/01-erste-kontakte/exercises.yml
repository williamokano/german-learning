lesson: A1/01
title: "A1 · Lektion 1 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1
    block: H
    type: single-choice
    title: "Aussprache-Check"
    instructions: "Höre den Clip und wähle die passende Antwort."
    instructionsEn: "Listen to the clip and choose the correct answer."
    items:
      - q: "Begrüßungen — was sagst du am Morgen?"
        audio: hoerzu1.mp3
        options:
          - { key: a, text: "Guten Abend" }
          - { key: b, text: "Guten Morgen" }
          - { key: c, text: "Gute Nacht" }
        answer: b
        why: "Guten Morgen sagt man bis ca. 10–11 Uhr."
      - q: "Verabschiedungen — was sagst du am Abend vor dem Schlafen?"
        audio: hoerzu2.mp3
        options:
          - { key: a, text: "Auf Wiedersehen" }
          - { key: b, text: "Gute Nacht" }
          - { key: c, text: "Bis morgen" }
        answer: b
        why: "Gute Nacht sagt man nur vor dem Schlafen."
      - q: "Zahlen 0–10 — welche Zahl kommt nach vier?"
        audio: hoerzu4.mp3
        options:
          - { key: a, text: "fünf" }
          - { key: b, text: "sechs" }
          - { key: c, text: "sieben" }
        answer: a
        why: "vier → fünf → sechs."
      - q: "Zahlen 11–20 — welche Zahl ist zwölf?"
        audio: hoerzu5.mp3
        options:
          - { key: a, text: "10" }
          - { key: b, text: "12" }
          - { key: c, text: "14" }
        answer: b
        why: "zwölf = 12 (unregelmäßige Schreibweise)."
      - q: "W-Fragewörter — welches Fragewort fragt nach der Herkunft?"
        audio: hoerzu3.mp3
        options:
          - { key: a, text: "Wo" }
          - { key: b, text: "Wer" }
          - { key: c, text: "Woher" }
        answer: c
        why: "woher (Herkunft → aus), wo (Ort → in)."

  - id: H2a
    block: H
    type: true-false
    title: "Dialog A (informell) — Im Deutschkurs"
    instructions: "Höre den Dialog und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen to the dialogue and decide: True (R) or False (F)?"
    audio: dialog1_a.mp3
    items:
      - q: "Anna kommt aus Deutschland."
        answer: false
        why: "Anna kommt aus Russland (Jaroslawl), nicht aus Deutschland."
      - q: "Bruno wohnt in Berlin."
        answer: true
        why: 'Bruno sagt: "Ich wohne auch in Berlin."'
      - q: "Bruno spricht nur Englisch."
        answer: false
        why: "Bruno spricht Portugiesisch, Englisch und ein bisschen Deutsch."

  - id: H2b
    block: H
    type: true-false
    title: "Dialog B (formell) — Frau Weber und Herr Steinmeyer"
    instructions: "Höre den Dialog und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen to the dialogue and decide: True (R) or False (F)?"
    audio: dialog1_b.mp3
    items:
      - q: "Herr Steinmeyer heißt Friedrich."
        answer: true
        why: 'Er sagt: "Ich heiße Friedrich Steinmeyer."'
      - q: "Herr Steinmeyer kommt aus Deutschland."
        answer: false
        why: "Er kommt aus Österreich, aus Salzburg."
      - q: "Frau Weber buchstabiert ihren eigenen Namen."
        answer: false
        why: 'Frau Weber bittet Herrn Steinmeyer: "Buchstabieren Sie bitte." Er buchstabiert S-T-E-I-N-M-E-Y-E-R.'
      - q: "Frau Weber fragt nach Herrn Steinmeyers Herkunft."
        answer: true
        why: 'Frau Weber fragt: "Woher kommen Sie, Herr Steinmeyer?"'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    instructions: "Höre den Text und fülle die Lücken mit Wörtern aus dem Kasten."
    instructionsEn: "Listen to the text and fill in the gaps with words from the box."
    audio: hoertext.mp3
    text: |
      Hallo! Ich {1} Yuki Tanaka. Ich {2} aus Japan, aus Osaka. Ich
      wohne jetzt in Berlin und {3} Deutsch. Ich {4} Japanisch,
      Englisch und ein bisschen Deutsch. Mein Deutschkurs ist {5} — wir
      sind {6} Studenten im Kurs.
    bank: [heiße, komme, lerne, spreche, super, zwanzig]
    answers:
      "1": heiße
      "2": komme
      "3": lerne
      "4": spreche
      "5": super
      "6": zwanzig

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anruf von Petra"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the voice message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Hallo, hier ist Petra. Ich bin deine neue Kollegin aus dem Deutschkurs. Bitte ruf mich zurück, wenn du Zeit hast. Ich möchte mich gerne mit dir treffen. Wir können zusammen einen Kaffee trinken. Meine Nummer ist vier-sieben-eins-eins. Vielen Dank und bis bald!'
    items:
      - q: "Warum ruft Petra an?"
        options:
          - { key: a, text: "Sie hat ein neues Buch." }
          - { key: b, text: "Sie möchte sich mit der Person treffen." }
          - { key: c, text: "Sie hat eine Prüfung." }
        answer: b
        why: '„Ich möchte mich gerne mit dir treffen".'
      - q: "Wo lernt Petra die Person kennen?"
        options:
          - { key: a, text: "Im Büro." }
          - { key: b, text: "Im Deutschkurs." }
          - { key: c, text: "Im Park." }
        answer: b
        why: '„Ich bin deine neue Kollegin aus dem Deutschkurs".'
      - q: "Was möchten sie zusammen machen?"
        options:
          - { key: a, text: "Ins Kino gehen." }
          - { key: b, text: "Einen Kaffee trinken." }
          - { key: c, text: "Einen Spaziergang." }
        answer: b
        why: '„Wir können zusammen einen Kaffee trinken".'
      - q: "Was ist Petras Telefonnummer?"
        options:
          - { key: a, text: "Eins-zwei-drei." }
          - { key: b, text: "Vier-fünf-sechs." }
          - { key: c, text: "Vier-sieben-eins-eins." }
        answer: c
        why: '„Meine Nummer ist vier-sieben-eins-eins".'

