        odd: 2
        why: "Tschüss is a farewell, not a greeting."
      - items: [Deutsch, Spanien, Englisch, Türkisch]
        odd: 1
        why: "Spanien is a country, not a language."
      - items: [wohnen, kommen, heißen, Land]
        odd: 3
        why: "Land is a noun, not a verb."
      - items: [du, Sie, ich, und]
