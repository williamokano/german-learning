  - id: C2
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 (multiple choice)"
    instructions: "Wähle die richtige Option (a, b oder c) für jede Lücke."
    instructionsEn: "Choose the correct option (a, b, or c) for each gap."
    items:
      - q: "Guten Tag! (1) ____ Name ist Petra Lang."
        options:
          - { key: a, text: "Mein" }
          - { key: b, text: "Ich" }
          - { key: c, text: "Meine" }
        answer: a
        why: "Name ist maskulin → Mein (kein Endung im Nominativ)."
      - q: "Ich komme (2) ____ Österreich"
        options:
          - { key: a, text: "in" }
          - { key: b, text: "aus" }
          - { key: c, text: "von" }
        answer: b
        why: "Herkunft = aus."
      - q: "…und wohne (3) ____ Wien."
        options:
          - { key: a, text: "in" }
          - { key: b, text: "aus" }
          - { key: c, text: "nach" }
        answer: a
        why: "Wohnort = in."
      - q: "Ich (4) ____ Deutsch und Englisch."
        options:
          - { key: a, text: "spreche" }
          - { key: b, text: "sprichst" }
          - { key: c, text: "sprechen" }
        answer: a
        why: "ich-Form: ich spreche."
      - q: 'Im Büro sagen alle Frau Lang und (5) ______, aber meine Freunde sagen du.'
        options:
          - { key: a, text: "du" }
          - { key: b, text: "Sie" }
          - { key: c, text: "ihr" }
        answer: b
        why: "Formelle Anrede im Büro = Sie."
      - q: "Mein Kollege Tom (6) ____ aus den USA."
        options:
          - { key: a, text: "kommen" }
          - { key: b, text: "kommst" }
          - { key: c, text: "kommt" }
        answer: c
        why: "er/sie/es-Form: kommt."

