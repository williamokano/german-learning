  - id: A8
    block: A
    type: free-write
    title: "Substitution drill"
    prompt: "Rewrite the sentence with the new subject."
    stimulus: |
      Example: Ich wohne in Berlin. (du) → Du wohnst in Berlin.

      1. Ich wohne in Berlin. (du)
      2. Du kommst aus Italien. (er)
      3. Er spricht Englisch. (wir)
      4. Wir heißen Müller. (ihr)
      5. Ihr seid im Kurs A1. (ich)
      6. Sie sind aus der Schweiz. (du)
      7. Ich spreche ein bisschen Deutsch. (Frau Lang)
      8. Du bist sehr nett. (ihr)
    model: |
      1. Du wohnst in Berlin.
      2. Er kommt aus Italien.
      3. Wir sprechen Englisch.
      4. Ihr heißt Müller.
      5. Ich bin im Kurs A1.
      6. Du bist aus der Schweiz.
      7. Frau Lang spricht ein bisschen Deutsch.
      8. Ihr seid sehr nett.

  - id: A9
