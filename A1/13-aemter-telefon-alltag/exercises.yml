  - id: A10
    block: A
    type: free-write
    title: "Substitution drill: `Könnten Sie` + dative pronoun"
    prompt: "Rewrite each sentence, replacing the underlined indirect object with the correct dative pronoun. Write the full new sentence."
    stimulus: |
      1. Könnten Sie Frau Lang das Formular schicken?
      2. Könnten Sie den Kindern helfen?
      3. Könnten Sie Bruno und Anna den Termin bestätigen?
      4. Könnten Sie mir und meiner Kollegin Bescheid geben?
      5. Könnten Sie mir den Wohnungsgebernachweis ausstellen? — (already a pronoun — keep as is)
    model: |
      1. Könnten Sie ihr das Formular schicken?
      2. Könnten Sie ihnen helfen?
      3. Könnten Sie ihnen den Termin bestätigen?
      4. Könnten Sie uns Bescheid geben?
      5. Könnten Sie mir den Wohnungsgebernachweis ausstellen?

  - id: A11
    block: A
    type: gap-text
    listLayout: true
    title: "E-mail formulaic phrases: formal or informal?"
    instructions: "Mark each phrase F (formal) or I (informal). Bonus: write the other register version below the gap."
    text: |
      1. Sehr geehrte Frau Müller, → {1}
      2. Lieber Tom, → {2}
      3. Mit freundlichen Grüßen → {3}
      4. Viele Grüße → {4}
      5. Vielen Dank im Voraus. → {5}
      6. Könnten Sie mir bitte helfen? → {6}
    answers:
      "1": F
      "2": I
      "3": F
      "4": I
      "5":
        - F
        - I
      "6": F

