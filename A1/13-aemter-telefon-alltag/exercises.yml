lesson: A1/13
title: "A1 · Lektion 13 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Telefonat Bürgeramt"
    audio: dialog1_a.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - { q: "Anna ruft das Bürgeramt an, um sich anzumelden.", answer: true, why: 'Anna says: „Ich möchte mich anmelden. Welche Dokumente brauche ich?"' }
      - { q: "Anna braucht einen Personalausweis und einen Reisepass.", answer: false, why: 'Anna braucht Personalausweis **oder** Reisepass, nicht beides.' }
      - { q: "Der Termin dauert ungefähr eine Stunde.", answer: false, why: "Der Termin dauert etwa zwanzig Minuten, nicht eine Stunde." }
      - { q: "Anna möchte den Termin online buchen.", answer: true, why: 'Anna says: „Ja, gerne." when asked about online booking.' }

  - id: H1b
    block: H
    type: true-false
    title: "Dialog Hör-Check: Eine Verabredung ändern"
    audio: dialog1_c.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - { q: "Bruno ruft Anna an.", answer: true, why: 'Bruno: „Hallo, Anna! Hier ist Bruno."' }
      - { q: "Bruno hat einen Arzttermin.", answer: true, why: 'Bruno says: „Ich habe einen Termin beim Arzt."' }
      - { q: "Anna und Bruno treffen sich um drei Uhr.", answer: false, why: "Sie treffen sich um fünf Uhr, nicht um drei Uhr." }
      - { q: "Bruno sagt, der neue Termin passt ihm gut.", answer: true, why: 'Bruno: „Ja, das passt. Bis dann!"' }

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Anmeldung in Berlin"
    audio: hoertext.mp3
    instructions: "Höre den Text und fülle die Lücken. Achtung: Zwei Wörter passen nicht!"
    instructionsEn: "Listen to the text and fill in the gaps. Note: two words do not fit!"
    text: |
      Anna ist nach {1} gezogen. Sie muss sich beim {2} {3}. Zuerst ruft sie das Bürgeramt an und macht einen Termin. Sie braucht ihren {4} und einen {5}. Den Wohnungsgebernachweis bekommt sie von ihrem Vermieter, Herrn Keller. Der Termin ist am {6} um zehn Uhr.
    bank: [Berlin, Bürgeramt, anmelden, Personalausweis, Wohnungsgebernachweis, Montag, Reisepass, Dienstag]
    answers:
      "1": Berlin
      "2": Bürgeramt
      "3": anmelden
      "4": Personalausweis
      "5": Wohnungsgebernachweis
      "6": Montag

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage im Bürgeramt"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Achtung, eine Durchsage. Liebe Bürgerinnen und Bürger, das Bürgeramt öffnet heute ausnahmsweise erst um zehn Uhr. Grund ist eine Fortbildung der Mitarbeiter. Wir bitten um Ihr Verständnis. Bitte informieren Sie sich über die neuen Öffnungszeiten auf unserer Webseite. Termine können Sie weiterhin online buchen. Vielen Dank für Ihre Geduld."
    items:
      - q: "Was ist das für eine Durchsage?"
        options:
          - { key: a, text: "Vom Supermarkt." }
          - { key: b, text: "Vom Bürgeramt." }
          - { key: c, text: "Vom Bahnhof." }
        answer: b
        why: '„das Bürgeramt öffnet heute ausnahmsweise erst um zehn Uhr."'
      - q: "Wann öffnet das Bürgeramt heute?"
        options:
          - { key: a, text: "Um acht Uhr." }
          - { key: b, text: "Um neun Uhr." }
          - { key: c, text: "Um zehn Uhr." }
        answer: c
        why: '„das Bürgeramt öffnet heute ausnahmsweise erst um zehn Uhr."'
      - q: "Warum öffnet das Bürgeramt später?"
        options:
          - { key: a, text: "Wegen einer Fortbildung." }
          - { key: b, text: "Wegen eines Feiertags." }
          - { key: c, text: "Wegen einer Reparatur." }
        answer: a
        why: '„Grund ist eine Fortbildung der Mitarbeiter."'
      - q: "Wie kann man einen Termin buchen?"
        options:
          - { key: a, text: "Nur telefonisch." }
          - { key: b, text: "Online." }
          - { key: c, text: "Nur persönlich." }
        answer: b
        why: '„Termine können Sie weiterhin online buchen."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Case recap: Nominativ or Akkusativ?"
    instructions: "Label each noun as N (Nominativ) or A (Akkusativ), then write the correct article. Each item has two gaps."
    text: |
      1. {1} Sachbearbeiterin (f) fragt. (N / A: {2})
      2. Ich brauche {3} Personalausweis (m). (N / A: {4})
      3. {5} Formular (n) ist fertig. (N / A: {6})
      4. Bruno bucht {7} Termin (m). (N / A: {8})
      5. {9} Beamtin (f) hilft mir. (N / A: {10})
      6. Hast du {11} Reisepass (m) dabei? (N / A: {12})
      7. {13} Warteraum (m) ist groß. (N / A: {14})
      8. Wir schicken {15} E-Mail (f). (N / A: {16})
    answers:
      "1": Die
      "2": N
      "3": einen
      "4": A
      "5": Das
      "6": N
      "7": einen
      "8": A
      "9": Die
      "10": N
      "11": einen
      "12": A
      "13": Der
      "14": N
      "15": eine
      "16": A

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Dative articles: dem, der, einem, einer"
    instructions: "Fill the gap with the correct dative article (definite or indefinite as indicated)."
    text: |
      1. Bruno wartet an {1} Schalter (m, def.).
      2. Ich arbeite bei {2} Arztpraxis (f, def.).
      3. Sie fahren mit {3} Bus (m, indef.).
      4. Wir kommen von {4} Bürgeramt (n, def.).
      5. Er wohnt gegenüber von {5} Rathaus (n, def.).
      6. Ich gehe zu {6} Termin (m, indef.).
      7. Sie kommt aus {7} Türkei (f, def.). (die Türkei)
      8. Er spricht mit {8} Beamtin (f, def.).
      9. Wir fahren zu {9} Ausländerbehörde (f, def.).
      10. Ich gehe nach {10} Amt (n, indef.).
    answers:
      "1": dem
      "2": der
      "3": einem
      "4": dem
      "5": dem
      "6": einem
      "7": der
      "8": der
      "9": der
      "10": einem

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Dative personal pronouns"
    instructions: "Rewrite, replacing the underlined noun with a dative personal pronoun."
    text: |
      1. Könnten Sie {1} (der Frau) helfen?
      2. Ich schicke {2} (Herrn Keller) das Formular.
      3. Die Beamtin gibt {3} (Bruno) den Ausweis.
      4. Der Termin passt {4} (Anna) gut.
      5. Kannst du {5} (mir) die Adresse geben? — already a pronoun
      6. Das ist zu schwierig für {6} (die Kinder, pl.).
      7. Könnten Sie {7} (mir und meiner Frau) helfen?
    answers:
      "1": ihr
      "2": ihm
      "3": ihm
      "4": ihr
      "5": "—"
      "6": ihnen
      "7": uns

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Separable verbs: anrufen, ausfüllen, ausstellen, anmelden"
    instructions: "Fill in the correct form of the separable verb. Follow the Satzklammer rule (conjugated verb in position 2, prefix at the end)."
    text: |
      1. Ich {1} das Bürgeramt {2}. (anrufen, ich)
      2. Bitte {3} Sie das Formular {4}. (ausfüllen, Sie-imperative)
      3. {5} du dich beim Bürgeramt {6}? (anmelden, du — present)
      4. Der Vermieter {7} den Nachweis {8}. (ausstellen, er)
      5. Wir {9} morgen das Amt {10}. (anrufen, wir)
      6. Bruno {11} das Formular schnell {12}. (ausfüllen, er)
      7. Wann {13} Sie sich {14}? (anmelden, Sie — present)
      8. Die Beamtin {15} sofort den Ausweis {16}. (ausstellen, sie = she)
    answers:
      "1": rufe
      "2": an
      "3": füllen
      "4": aus
      "5": Meldest
      "6": an
      "7": stellt
      "8": aus
      "9": rufen
      "10": an
      "11": füllt
      "12": aus
      "13": melden
      "14": an
      "15": stellt
      "16": aus

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Separable verbs in the Perfekt"
    instructions: "Rewrite each sentence in the Perfekt. Remember: ge- goes between the prefix and the stem."
    text: |
      1. Ich rufe das Bürgeramt an. → Ich habe das Bürgeramt {1}.
      2. Du füllst das Formular aus. → Du hast das Formular {2}.
      3. Er meldet sich an. → Er hat sich {3}.
      4. Wir rufen den Arzt an. → Wir haben den Arzt {4}.
      5. Anna stellt den Nachweis aus. → Anna hat den Nachweis {5}.
      6. Ihr füllt die Formulare aus. → Ihr habt die Formulare {6}.
    answers:
      "1": angerufen
      "2": ausgefüllt
      "3": angemeldet
      "4": angerufen
      "5": ausgestellt
      "6": ausgefüllt

  - id: A6
    block: A
    type: free-write
    title: "`Könnten Sie …?` (polite request) — transformation drill"
    prompt: "Transform each direct request into a polite `Könnten Sie …?` request. Write the full transformed sentence."
    stimulus: |
      1. Schicken Sie mir das Formular.
      2. Helfen Sie mir bitte.
      3. Wiederholen Sie das.
      4. Stellen Sie den Nachweis aus.
      5. Geben Sie mir den Ausweis.
      6. Buchstabieren Sie Ihren Namen.
    model: |
      1. Könnten Sie mir das Formular schicken?
      2. Könnten Sie mir bitte helfen?
      3. Könnten Sie das bitte wiederholen?
      4. Könnten Sie den Nachweis ausstellen?
      5. Könnten Sie mir den Ausweis geben?
      6. Könnten Sie Ihren Namen buchstabieren?

