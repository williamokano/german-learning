  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Mixed article drill: Nominativ / Akkusativ / Dativ"
    instructions: "Choose the correct article (definite: der/die/das/den/dem; or as prompted)."
    text: |
      1. {1} Termin (m, Nom.) beginnt um neun Uhr.
      2. Ich brauche {2} Reisepass (m, Akk., indef.).
      3. Sie gibt {3} Beamten (m, Dat., def.) die Dokumente.
      4. Das Formular ist für {4} Anmeldung (f, Akk., def.).
      5. Er wartet bei {5} Schalter (m, Dat., def.).
      6. {6} Sachbearbeiterin (f, Nom.) ist sehr freundlich.
      7. Wir fahren mit {7} Bus (m, Dat., indef.).
      8. Hast du {8} Unterschrift (f, Akk., def.) vergessen?
      9. Ich gehe zu {9} Ausländerbehörde (f, Dat., def.).
      10. {10} Wohnungsgebernachweis (m, Nom.) ist fertig.
    answers:
      "1": Der
      "2": einen
      "3": dem
      "4": die
      "5":
        - dem
        - am
      "6": Die
      "7": einem
      "8": die
      "9": zur
