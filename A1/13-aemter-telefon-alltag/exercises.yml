  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen: Am Telefon"
    instructions: "Fill in the gaps with one word each."
    text: |
      — Bürgeramt Mitte, guten {1}.
      — Guten Tag! Mein {2} ist Petra Sommer. Ich {3} eine Frage.
      — Ja, gerne. Was kann ich für Sie {4}?
      — Ich möchte mich {5}. Welche Dokumente brauche ich?
      — Sie brauchen Ihren Personalausweis und {6} Wohnungsgebernachweis.
      — Und wie lange {7} der Termin?
      — Ungefähr zwanzig Minuten. Möchten Sie online einen Termin {8}?
      — Ja, gerne. Vielen {9}!
      — Auf {10}!
    answers:
      "1": Tag
      "2": Name
      "3": habe
      "4": tun
      "5": anmelden
      "6": einen
      "7": dauert
      "8": buchen
      "9": Dank
      "10": Wiederhören

