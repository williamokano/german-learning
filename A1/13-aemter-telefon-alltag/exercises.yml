      — Es tut mir leid, er ist gerade {3}. Kann ich Ihnen helfen?
      — Ich habe am Freitag einen {4}. Ich kann leider nicht {5}.
      — Möchten Sie eine Nachricht {6}?
      — Ja, bitte. Könnten Sie {7} sagen, dass ich {8} wieder anrufe?
      — Natürlich. Auf {9}!
      — Auf Wiederhören!
