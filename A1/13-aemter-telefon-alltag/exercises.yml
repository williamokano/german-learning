      "9": Wiederhören

  - id: B3
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
    instructions: "Each sentence has exactly one mistake. The wrong word is shown as a gap — write the correct form."
    text: |
      1. Könnten Sie mir das Formular {1}? (schickt → ?)
      2. Ich rufe das Bürgeramt morgen {2}. (an → prefix to end)
      3. Bruno meldet sich gestern beim Bürgeramt {3}. (an → ?)
      4. Die Beamtin gibt {4} Formular Bruno. (dem → Akkusativ)
      5. Ich habe einen Termin {5} Dienstag. (an → am)
      6. Bitte füllen Sie das Formular {6}. (ein → aus)
      7. Er hat das Amt {7}. (angeruft → ?)
      8. Könnten Sie bitte {8} helfen? (mich → mir)
      9. Ich brauche {9} Reisepass. (der → den)
      10. Sie wohnt seit {10} 1. Oktober in der Mozartstraße. (den → dem)
    answers:
      "1": schicken
      "2": an
      "3": an
      "4": das
      "5": am
      "6": aus
      "7": angerufen
      "8": mir
      "9": den
      "10": dem

