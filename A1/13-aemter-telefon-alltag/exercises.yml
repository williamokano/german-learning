    block: A
    type: gap-text
    listLayout: true
    title: "Numbers: dates (revision from L12)"
    instructions: "Write the date in words (spoken form: *am … ten/sten*)."
    text: |
      1. 1.3. → am {1}
      2. 8.11. → am {2}
      3. 15.4. → am {3}
      4. 23.10. → am {4}
      5. 31.12. → am {5}
      6. 2.7. → am {6}
    answers:
