#
# Tag taxonomy follows A1/01 + A1/02 + A1/03: single thematic tag plus `concrete`
# for picturable nouns. Verbs get `[verb]`. Abstract metadata nouns (Name, Adresse,
# Datum, Nationalität, Gebühr, Anmeldung, Betreff) skip `concrete` — they are info
# concepts, not objects you can pick up.
