# Reviewed from A1/13 lesson.md §4 Wortschatz.
# Note: no draft existed — the importer found nothing parseable. Every entry
# was added by hand.
#
# Section headers in lesson.md §4:
#   Ämter und Institutionen        — 12 nouns
#   Dokumente und Formulare        — 12 nouns (incl. weak-noun der Name, irregular plural das Datum)
#   Telefon und E-Mail             — 9 nouns (incl. der Betreff with no plural)
