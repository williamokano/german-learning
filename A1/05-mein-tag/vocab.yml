    core: true
  - de: Donnerstag
    article: der
    plural: null
    en: Thursday
    pos: noun
    tags: [time, concrete, day]
    core: true
  - de: Freitag
    article: der
    plural: null
    en: Friday
    pos: noun
    tags: [time, concrete, day]
    core: true
  - de: Samstag
    article: der
    plural: null
    en: Saturday
    pos: noun
    tags: [time, concrete, day]
    core: true
    example: "Hast du am Samstag Zeit?"
  - de: Sonntag
    article: der
    plural: null
    en: Sunday
