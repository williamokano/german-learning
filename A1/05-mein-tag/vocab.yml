# Reviewed from A1/05 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts
# and then hand-corrected — the parser (wortschatz-parser.ts) drops non-3-gender
# tables (the §4.4 Tageszeiten noun↔adverb map was lost entirely), misroutes bare
# separable tokens (auf|stehen, ein|kaufen, …) to pos:other because they aren't
# bolded in source (only the double-bold "Chunks:" line was caught), concatenates
# the four "Chunks:" into a single token ("**schlafen gehen** …"), mangles "früh
# ↔ spät" into one phrase, and folds the four frequency adverbs into one line.
# Every entry below was filled by hand from §4. Tag taxonomy mirrors A1/03 + A1/01:
#   [time] for measurement/category nouns, [time, concrete] for the noun-of-a-day,
#   [verb] for routine verbs, [chunk] for inseparable verb phrases, [frequency] for
#   frequency adverbs.
lesson: A1/05

entries:
  # ── Tagesablauf-Verben (daily routine verbs) ────────────────────────────────
  # Separable verbs are written with | in the source (auf|stehen) as a teaching
  # device for §6.1; the lemma is the clean infinitive (aufstehen) and the example
  # illustrates the bracket: "Ich stehe um sieben auf." Separability is conveyed by
  # the example sentence, not in `tags`, so this list stays comparable to A1/03.
  - de: aufstehen
    article: null
    plural: null
    en: to get up
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Ich stehe um halb sieben auf."
  - de: aufwachen
    article: null
    plural: null
    en: to wake up
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Ich wache um sechs Uhr auf."
  - de: einkaufen
    article: null
    plural: null
    en: to shop
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Anna kauft am Samstag ein."
  - de: anrufen
    article: null
    plural: null
    en: to call
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Ich rufe meine Eltern an."
  - de: anfangen
    article: null
    plural: null
    en: to start
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Der Film fängt um acht an."
  - de: aufräumen
    article: null
    plural: null
    en: to tidy up
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Bruno räumt seine Wohnung auf."
  - de: fernsehen
    article: null
    plural: null
    en: to watch TV
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Ich sehe abends manchmal fern."
  - de: mitkommen
    article: null
    plural: null
    en: to come along
    pos: verb
    tags: [verb, motion]
    core: true
    example: "Kommst du mit?"
  - de: ausgehen
    article: null
    plural: null
    en: to go out
    pos: verb
    tags: [verb, motion]
    core: true
    example: "Wir gehen am Samstag aus."
  - de: duschen
    article: null
    plural: null
    en: to shower
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Anna duscht am Morgen."
  - de: frühstücken
    article: null
    plural: null
    en: to have breakfast
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Ich frühstücke um halb sieben."
  - de: arbeiten
    article: null
    plural: null
    en: to work
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Anna arbeitet von acht bis fünf."
  - de: kochen
    article: null
    plural: null
    en: to cook
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Bruno kocht am Abend."
  - de: machen
    article: null
    plural: null
    en: to do
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Was machst du am Wochenende?"
  - de: schlafen
    article: null
    plural: null
    en: to sleep
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Bruno schläft am Samstag lange."
  - de: lernen
    article: null
    plural: null
    en: to learn
    pos: verb
    tags: [verb, routine]
    core: true
    example: "Ich lerne jeden Abend Deutsch."
  - de: beginnen
    article: null
    plural: null
    en: to begin
    pos: verb
