  # ── Chunks (verb phrases, learned as units) ─────────────────────────────────
  # These pair a motion verb with a destination noun — teach them as one chunk.
  # Mirror A1/03 phrase style: pos: phrase, core: false so they don't double-count
  # against the headword verbs above.
  - de: schlafen gehen
    article: null
    plural: null
    en: to go to sleep
    pos: phrase
    tags: [chunk, verb]
    core: false
    example: "Ich gehe um elf schlafen."
  - de: zu Mittag essen
    article: null
    plural: null
    en: to have lunch
    pos: phrase
    tags: [chunk, verb]
    core: false
    example: "Anna isst zu Mittag um halb eins."
  - de: zu Abend essen
    article: null
    plural: null
    en: to have dinner
    pos: phrase
    tags: [chunk, verb]
    core: false
    example: "Wir essen zu Abend um acht."
  - de: ins Kino gehen
    article: null
    plural: null
    en: to go to the movies
    pos: phrase
    tags: [chunk, verb]
    core: false
    example: "Wir gehen am Samstag ins Kino."
  - de: zur Arbeit gehen
    article: null
    plural: null
    en: to go to work
    pos: phrase
    tags: [chunk, verb]
    core: false
    example: "Bruno geht um acht zur Arbeit."

  # ── Die Zeit (time vocabulary) ──────────────────────────────────────────────
  # Both senses of "die Uhr" (clock / o'clock) are intentional; the lesson's Lerntipp
  # highlights that double meaning. `plural: null` for die Zeit (mass noun).
  - de: Uhr
    article: die
    plural: Uhren
    en: clock
    pos: noun
    tags: [time, concrete]
    core: true
    example: "Es ist acht Uhr."
  - de: Stunde
    article: die
    plural: Stunden
    en: hour
    pos: noun
    tags: [time]
    core: true
    example: "Ich arbeite acht Stunden am Tag."
  - de: Minute
    article: die
    plural: Minuten
    en: minute
    pos: noun
    tags: [time]
    core: true
    example: "Es ist fünf Minuten nach sieben."
  - de: Zeit
    article: die
    plural: null
    en: time
    pos: noun
    tags: [time]
    core: true
    example: "Hast du am Samstag Zeit?"
  - de: Mittagspause
