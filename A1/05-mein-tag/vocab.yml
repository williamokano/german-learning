    pos: noun
    tags: [place, concrete]
    core: true
    example: "Wir gehen ins Kino."

  # ── Adjektive (antonym pair from the §4 Zeit group) ────────────────────────
  # früh & spät work as both adjective ("der frühe Morgen") and adverb ("früh
  # aufstehen"); we model them as adjectives so the -s adverb form (morgens etc.)
  # below isn't a homograph collision.
  - de: früh
    article: null
    plural: null
    en: early
    pos: adjective
    tags: [time, adjective]
    core: true
    example: "Ich stehe früh auf."
  - de: spät
    article: null
    plural: null
    en: late
    pos: adjective
    tags: [time, adjective]
    core: true
    example: "Bruno steht am Samstag spät auf."

  # ── Wochentage (days of the week — all masculine, used with `am`) ──────────
  - de: Montag
    article: der
    plural: null
    en: Monday
    pos: noun
    tags: [time, concrete, day]
    core: true
    example: "Am Montag habe ich einen Kurs."
  - de: Dienstag
    article: der
    plural: null
