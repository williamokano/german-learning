  # ── Tageszeiten (parts of day — nouns) ─────────────────────────────────────
  # All masculine except die Nacht. Tag/Abend/Morgen take `am`; Nacht takes `in der`
  # — the lesson's Lerntipp flags the exception.
  - de: Morgen
    article: der
    plural: Morgen
    en: morning
    pos: noun
    tags: [time, concrete]
    core: true
    example: "Am Morgen dusche ich."
  - de: Vormittag
    article: der
    plural: Vormittage
    en: late morning
    pos: noun
    tags: [time, concrete]
    core: true
    example: "Am Vormittag lerne ich."
  - de: Mittag
    article: der
    plural: Mittage
    en: noon
    pos: noun
    tags: [time, concrete]
    core: true
    example: "Am Mittag esse ich zu Mittag."
  - de: Nachmittag
    article: der
    plural: Nachmittage
    en: afternoon
    pos: noun
    tags: [time, concrete]
    core: true
    example: "Am Nachmittag rufe ich meine Eltern an."
  - de: Abend
    article: der
    plural: Abende
    en: evening
    pos: noun
    tags: [time, concrete]
    core: true
    example: "Am Abend koche ich."
  - de: Nacht
    article: die
    plural: Nächte
    en: night
    pos: noun
    tags: [time, concrete]
    core: true
    example: "In der Nacht schlafe ich."

  # ── Tageszeiten (parts of day — adverbs, -s form) ──────────────────────────
  # The -s form turns the noun into an adverbial that replaces am/in der + noun:
  # "am Morgen" → "morgens"; "in der Nacht" → "nachts". Listed separately so the
  # noun/adverb pair is searchable by either form.
  - de: morgens
    article: null
    plural: null
    en: in the morning
    pos: adverb
    tags: [time, adverb]
    core: true
    example: "Ich stehe morgens um sieben auf."
  - de: vormittags
    article: null
    plural: null
    en: in the late morning
    pos: adverb
    tags: [time, adverb]
    core: true
  - de: mittags
    article: null
    plural: null
    en: at noon
    pos: adverb
    tags: [time, adverb]
    core: true
  - de: nachmittags
    article: null
    plural: null
    en: in the afternoon
    pos: adverb
    tags: [time, adverb]
    core: true
  - de: abends
    article: null
    plural: null
    en: in the evening
    pos: adverb
    tags: [time, adverb]
    core: true
    example: "Abends sehe ich nicht fern."
  - de: nachts
    article: null
    plural: null
    en: at night
    pos: adverb
    tags: [time, adverb]
    core: true

  # ── Häufigkeit (frequency adverbs) ─────────────────────────────────────────
  # The four words of the "scale" in the lesson's Lerntipp: immer → oft → manchmal → nie.
  - de: immer
    article: null
    plural: null
    en: always
    pos: adverb
    tags: [frequency]
    core: true
    example: "Ich stehe immer um sechs auf."
  - de: oft
    article: null
    plural: null
    en: often
    pos: adverb
    tags: [frequency]
    core: true
  - de: manchmal
    article: null
    plural: null
    en: sometimes
    pos: adverb
    tags: [frequency]
    core: true
    example: "Manchmal rufe ich meine Eltern an."
  - de: nie
    article: null
    plural: null
    en: never
    pos: adverb
    tags: [frequency]
    core: true
    example: "Bruno kocht nie."
