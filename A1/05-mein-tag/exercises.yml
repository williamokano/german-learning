lesson: A1/05
title: "A1 · Lektion 5 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog A: Annas Tag"
    audio: dialog1_a.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - q: "Anna steht um 6:30 Uhr auf."
        answer: true
        why: 'Anna sagt: „Um halb sieben — also um 6:30 Uhr."'
      - q: "Annas Arbeit fängt um neun Uhr an."
        answer: false
        why: "Annas Arbeit fängt um acht Uhr an, nicht um neun."
      - q: "Die Mittagspause ist von halb eins bis halb zwei."
        answer: true
        why: "Die Mittagspause ist von halb eins bis halb zwei."
      - q: "Am Abend sieht Anna immer fern."
        answer: false
        why: 'Am Abend kocht Anna oder sieht fern — „immer" ist zu stark.'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog B: Pläne am Telefon"
    audio: dialog1_b.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - q: "Anna fragt Bruno: Hast du am Samstag Zeit?"
        answer: true
        why: 'Anna fragt: „Hast du am Samstag Zeit?"'
      - q: "Der Film fängt um halb acht an."
        answer: false
        why: "Der Film fängt um acht Uhr an, nicht um halb acht."
      - q: "Anna ruft Bruno am Samstagmorgen noch einmal an."
        answer: true
        why: 'Anna sagt: „Ich rufe dich am Samstagmorgen noch einmal an."'
      - q: "Bruno und Anna gehen am Sonntag ins Kino."
        answer: false
        why: "Sie gehen am Samstag ins Kino, nicht am Sonntag."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre den Text und fülle die Lücken. Zwei Wörter passen nicht."
    instructionsEn: "Listen to the text and fill in the gaps. Two words are not needed."
    text: |
      Yuki steht um halb acht auf und frühstückt {1} — nur Kaffee und ein
      Brötchen. Ihr Deutschkurs {2} um neun Uhr an. Von neun bis halb eins
      lernt sie Deutsch. Die {3} ist von halb eins bis zwei. Am
      Nachmittag {4} Yuki ein oder ruft ihre Freunde an. Abends lernt sie oft
      Vokabeln, und um {5} elf geht sie schlafen.
    bank: [schnell, fängt, Mittagspause, kauft, halb, arbeitet, früh]
    answers:
      "1": schnell
      "2": fängt
      "3": Mittagspause
      "4": kauft
      "5": halb

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachrichten am Morgen"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Nachrichten. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the messages. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Guten Morgen und herzlich willkommen zu den Nachrichten. Heute ist Dienstag, der fünfzehnte April. Das Wetter in Berlin: am Morgen ist es kalt, vier Grad. Am Nachmittag wird es wärmer, bis zu zwölf Grad. Am Abend regnet es vielleicht. Im Straßenverkehr gibt es heute keine größeren Probleme. Vergessen Sie nicht: morgen ist Feiertag. Genießen Sie Ihren Tag!"
    items:
      - q: "Welcher Tag ist heute?"
        options:
          - { key: a, text: "Dienstag, der fünfzehnte April." }
          - { key: b, text: "Mittwoch, der sechzehnte April." }
          - { key: c, text: "Montag, der vierzehnte April." }
        answer: a
        why: '„Heute ist Dienstag, der fünfzehnte April."'
      - q: "Wie ist das Wetter am Morgen?"
        options:
          - { key: a, text: "Kalt." }
          - { key: b, text: "Sonnig." }
          - { key: c, text: "Warm." }
        answer: a
        why: '„am Morgen ist es kalt, vier Grad."'
      - q: "Was gibt es im Verkehr?"
        options:
          - { key: a, text: "Viele Staus." }
          - { key: b, text: "Keine größeren Probleme." }
          - { key: c, text: "Eine Sperrung." }
        answer: b
        why: '„Im Straßenverkehr gibt es heute keine größeren Probleme."'
      - q: "Was soll man nicht vergessen?"
        options:
          - { key: a, text: "Der Einkauf." }
          - { key: b, text: "Der Termin beim Arzt." }
          - { key: c, text: "Der Feiertag morgen." }
        answer: c
        why: '„Vergessen Sie nicht: morgen ist Feiertag."'

