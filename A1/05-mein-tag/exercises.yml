      6. Ich {11} am Sonntag mein Zimmer {12}. (aufräumen)
      7. {13} ihr am Freitag {14}? (ausgehen)
      8. Er {15} um sechs Uhr {16}. (aufwachen)
      9. {17} Sie {18}? (mitkommen)
      10. Du {19} nie {20}. (einkaufen)
