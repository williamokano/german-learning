# Reviewed from A1/11 lesson.md §4 Wortschatz.
# The parser captured only the 15-row Nomen table ("der/die/das" header) and
# dropped every other §4 sub-table because none of them advertises a der/die/das
# header — the parser classifies them as "non-gender tables" and skips them.
# Manually added below: 11 Freizeitaktivitäten verbs, 7 Verben-mit-sein verbs,
# 11 Zeitausdrücke (adverbs + prepositional phrases), and 8 Adjektive. The
# 15 nouns were taken from the parser draft after filling `en` and resolving
# tags. Tag taxonomy mirrors the A1/03 pilot + A1/01/A1/02 reviewed vocab
# (issue #337). One entry per lemma: Partizip-II forms (gekauft, gekommen…)
# are properties of the verb form, NOT separate vocab entries — glossed as
# infinitives ("to play", "to come") per the lesson's English column.
#
# Section headers in lesson.md:
#   Freizeitaktivitäten (leisure activities)       — 11 verbs (haben-Perfekt)
#   Verben mit `sein` (motion & change of state)   — 7 verbs (sein-Perfekt)
#   Nomen zum Thema Freizeit und Urlaub            — 15 nouns
#   Zeitausdrücke (time expressions)               — 11 adverbs/phrases
#   Adjektive zur Beschreibung                     — 8 adjective stems
lesson: A1/11

