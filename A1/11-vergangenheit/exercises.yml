  - id: C2
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1"
    instructions: "Wähle die richtige Option (a, b oder c) für jede Lücke."
    instructionsEn: "Choose the correct option (a, b, or c) for each gap."
    items:
      - q: "Ich (1) ____ dir von meinem Wochenende erzählen."
        options:
          - { key: a, text: "möchte" }
          - { key: b, text: "muss" }
          - { key: c, text: "kann" }
        answer: a
        why: '"Ich möchte dir … erzählen" — the natural fit for "I want to tell you".'
      - q: "Am Samstag (2) ____ ich mit Anna ins Konzert gegangen."
        options:
          - { key: a, text: "habe" }
          - { key: b, text: "hat" }
          - { key: c, text: "bin" }
        answer: c
        why: "`gehen` takes `sein`."
      - q: "Das Konzert (3) ____ super!"
        options:
          - { key: a, text: "wurde" }
          - { key: b, text: "war" }
          - { key: c, text: "hat" }
        answer: b
        why: 'Simple past description of state: „war". `hat` needs a Partizip II after it.'
      - q: "Danach (4) ____ wir in einem Restaurant gegessen."
        options:
          - { key: a, text: "sind" }
          - { key: b, text: "haben" }
          - { key: c, text: "hatten" }
        answer: b
        why: "`essen` takes `haben` (wir-form)."
      - q: "Ich (5) ____ Pasta und Anna hat Fisch genommen."
        options:
          - { key: a, text: "habe gegessen" }
          - { key: b, text: "bin gegessen" }
          - { key: c, text: "habe geessen" }
        answer: a
        why: "ich-form + `haben` + correct Partizip II `gegessen`."
      - q: "Am Sonntag (6) ____ ich lange geschlafen — bis 11 Uhr!"
        options:
          - { key: a, text: "bin" }
          - { key: b, text: "habe" }
          - { key: c, text: "hatte" }
        answer: b
        why: "`schlafen` takes `haben`; `bin` is the classic learner error here."

