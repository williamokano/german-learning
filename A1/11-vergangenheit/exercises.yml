    title: "Kurze Ansage: Marias Wochenende"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Nachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Hallo Anna, hier ist Maria. Ich rufe an wegen meinem Wochenende. Ich bin am Samstag ins Museum gegangen und habe dort eine tolle Ausstellung gesehen. Am Nachmittag habe ich im Café Kaffee getrunken und ein Buch gelesen. Am Sonntag bin ich mit meinem Freund spazieren gegangen. Wir haben den ganzen Tag im Park verbracht. Bitte ruf mich zurück, damit ich dir mehr erzählen kann. Vielen Dank!"
