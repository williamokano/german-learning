    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - q: "Bruno ist am Samstag ins Kino gegangen."
        answer: true
        why: 'Bruno sagt: „Ich bin am Samstag ins Kino gegangen."'
      - q: "Am Sonntag hat Bruno Fußball gespielt."
        answer: true
        why: 'Bruno sagt: „Ich habe lange geschlafen, und dann habe ich Fußball gespielt."'
      - q: "Anna hat einen Freund besucht."
        answer: false
        why: "Anna hat eine Freundin besucht (weiblich) — nicht einen Freund."

  - id: H1b
    block: H
    type: true-false
    title: "Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen and decide: richtig (R) oder falsch (F)?"
    items:
      - q: "Frau Weber ist im Englischen Garten spazieren gegangen."
        answer: true
        why: 'Frau Weber sagt: „bin spazieren gegangen" im Englischen Garten.'
      - q: "Das Wetter war schlecht."
        answer: false
        why: 'Frau Weber sagt: „Das Wetter war herrlich" — nicht schlecht.'

