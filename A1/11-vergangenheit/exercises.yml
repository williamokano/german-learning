          - { key: b, text: "Sie hat Wein getrunken." }
          - { key: c, text: "Sie hat Kuchen gegessen." }
        answer: a
        why: '„Am Nachmittag habe ich im Café Kaffee getrunken."'
      - q: "Was hat Maria am Sonntag gemacht?"
        options:
          - { key: a, text: "Sie hat ein Buch gelesen." }
          - { key: b, text: "Sie ist im Park spazieren gegangen." }
          - { key: c, text: "Sie hat Fußball gespielt." }
        answer: b
        why: '„Am Sonntag bin ich mit meinem Freund spazieren gegangen. Wir haben den ganzen Tag im Park verbracht."'

