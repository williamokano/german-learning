lesson: A1/12
title: "A1 · Lektion 12 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A today, B tomorrow, C and D after that.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog A (informell): Anna und Bruno"
    audio: dialog1_a.mp3
    instructions: "Listen and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Annas Geburtstag ist am dreizehnten Mai. — Anna's birthday is on the thirteenth of May."
        answer: true
        why: 'Anna sagt: „Mein Geburtstag ist am dreizehnten Mai."'
      - q: "Die Party findet am Sonntag, dem fünfzehnten Mai, statt. — The party takes place on Sunday, the fifteenth of May."
        answer: true
        why: 'Bruno kann am Samstag (14.) nicht kommen. Anna schlägt den Fünfzehnten vor; Bruno sagt „Ja, das passt! Ich komme gern." → Die Party findet am Sonntag, dem fünfzehnten Mai, statt.'
      - q: "Bruno hat am Samstag schon einen Termin. — Bruno already has an appointment on Saturday."
        answer: true
        why: 'Bruno sagt: „Den vierzehnten — das geht leider nicht. Ich habe einen Termin."'
      - q: "Am Ende des Dialogs schickt Anna Bruno eine Einladung. — At the end of the dialog, Anna sends Bruno an invitation."
        answer: true
        why: 'Anna sagt: „Ich schicke dir eine Einladung."'

  - id: H1b
    block: H
    type: true-false
    title: "Dialog B (formell): Frau Weber beim Arzt"
    audio: dialog1_b.mp3
    instructions: "Listen and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Frau Weber ruft die Praxis Dr. Bauer an. — Mrs. Weber is calling Dr. Bauer's practice."
        answer: false
        why: 'Die Praxis ist „Praxis Dr. Hoffmann", nicht Dr. Bauer.'
      - q: "Der angebotene Termin ist am Mittwoch, dem achtzehnten Oktober. — The offered appointment is on Wednesday, the eighteenth of October."
        answer: true
        why: 'Die Sprechstundenhilfe sagt: „Passt Ihnen Mittwoch, der achtzehnte Oktober?"'
      - q: "Der Termin ist um zehn Uhr dreißig. — The appointment is at ten thirty."
        answer: true
        why: 'Die Sprechstundenhilfe sagt: „Um 10 Uhr 30."'
      - q: 'Frau Weber sagt „Auf Wiedersehen" am Ende. — Mrs. Weber says "Auf Wiedersehen" at the end.'
        answer: false
        why: 'Am Telefon sagt man „Auf Wiederhören", nicht „Auf Wiedersehen".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre den Text und fülle die Lücken. Zwei Wörter sind zu viel."
    instructionsEn: "Listen to the text and fill in the gaps. Two words are not needed."
    text: |
      Bruno ruft Yuki {1}. Er möchte sie zur Geburtstagsfeier {2}.
      Yukis Geburtstag ist am {3} Juli. Bruno fragt: „Hast du am {4} Zeit?"
      Yuki sagt: „Der zweite Juli passt mir leider nicht. Ich habe einen {5}."
      Bruno schlägt den {6} Juli vor. Yuki sagt: „Ja, der vierte passt gut!"
      Bruno freut sich und {7} ihr eine Einladung.
    bank: [an, dritten, einladen, einzuladen, fünften, schickt, Samstag, Termin, vierten]
    answers:
      "1": an
      "2": einladen
      "3": dritten
      "4": Samstag
      "5": Termin
      "6": vierten
      "7": schickt

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Lisa sagt ein Treffen ab"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Nachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript liest."
    instructionsEn: "Listen to the message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript."
    transcript: "Hallo Anna, hier ist Lisa. Ich rufe an wegen unseres Treffens am Samstag. Leider muss ich unser Treffen am achtzehnten Oktober absagen — ich habe einen Arzttermin bekommen. Können wir uns vielleicht am Sonntag, dem neunzehnten Oktober, um fünfzehn Uhr treffen? Bitte ruf mich zurück, damit ich weiß, ob der neue Termin passt. Vielen Dank und bis bald!"
    items:
      - q: "Wessen Nachricht ist das? — Whose message is this?"
        options:
          - { key: a, text: "Von Lisa." }
          - { key: b, text: "Von Anna." }
          - { key: c, text: "Von ihrer Schwester." }
        answer: a
        why: 'Hallo Anna, hier ist Lisa.'
      - q: "Was muss Lisa absagen? — What does Lisa have to cancel?"
        options:
          - { key: a, text: "Den Arzttermin." }
          - { key: b, text: "Das Konzert am Sonntag." }
          - { key: c, text: "Das Treffen am achtzehnten Oktober." }
        answer: c
        why: '„Leider muss ich unser Treffen am achtzehnten Oktober absagen."'
      - q: "Wann schlägt Lisa ein neues Treffen vor? — When does Lisa suggest a new meeting?"
        options:
          - { key: a, text: "Am Samstag um fünfzehn Uhr." }
          - { key: b, text: "Am Sonntag um fünfzehn Uhr." }
          - { key: c, text: "Am Montag um fünfzehn Uhr." }
        answer: b
        why: '„Können wir uns vielleicht am Sonntag, dem neunzehnten Oktober, um fünfzehn Uhr treffen?"'
      - q: "Was soll Anna tun? — What should Anna do?"
        options:
          - { key: a, text: "Zurückrufen." }
          - { key: b, text: "Eine SMS schicken." }
          - { key: c, text: "Ins Krankenhaus gehen." }
        answer: a
        why: '„Bitte ruf mich zurück, damit ich weiß, ob der neue Termin passt."'

