  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out (6 Gruppen)"
    instructions: "Cross out the word that doesn't fit and say why."
    groups:
      - items: [Januar, März, Sommer, Oktober]
        odd: 2
        why: "Sommer is a season, not a month"
      - items: [Geburtstag, Weihnachten, Ostern, Kalender]
        odd: 3
        why: "Kalender is an object, not a celebration/holiday"
      - items: [am, im, um, weil]
        odd: 3
        why: "weil is a subordinating conjunction, not a preposition"
      - items: [feiern, einladen, gratulieren, schlafen]
        odd: 3
        why: "schlafen (to sleep) is unrelated to celebrating or inviting"
      - items: [Einladung, Termin, Geschenk, regnen]
        odd: 3
        why: "regnen (to rain) is a weather verb, not an event/object"
      - items: [erst, zweit, dritt, siebzehn]
        odd: 3
        why: "siebzehn is a cardinal number; the others are ordinal stems"

