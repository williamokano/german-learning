  - id: C2
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 (6 Lücken, je 3 Optionen)"
    instructions: "Wähle die richtige Option (a, b oder c) für jede Lücke."
    instructionsEn: "Choose the correct option (a, b, or c) for each gap."
    items:
      - q: "ich (1) ______ dich herzlich zu meiner Geburtstagsfeier ein. — I (1) ______ you warmly to my birthday party."
        options:
          - { key: a, text: "laden" }
          - { key: b, text: "lädst" }
          - { key: c, text: "lade" }
        answer: c
        why: "ich-form of einladen; the separable prefix ein appears later, so the stem is lade."
      - q: "Die Party findet (2) ______ Samstag, (3) ______ achten März, statt. — The party takes place (2) ______ Saturday, (3) ______ eighth of March."
        options:
          - { key: a, text: "am" }
          - { key: b, text: "im" }
          - { key: c, text: "um" }
        answer: a
        why: "specific day of the week → am."
      - q: '... Samstag, (3) ______ achten März, statt. — ... Saturday, (3) ______ eighth of March.'
        options:
          - { key: a, text: "dem" }
          - { key: b, text: "der" }
          - { key: c, text: "des" }
        answer: a
        why: 'am Samstag, dem achten März — the date after a day name takes dative → dem.'
      - q: "(4) ______ beginnt die Feier um 20 Uhr. — (4) ______ the celebration starts at 8 pm."
        options:
          - { key: a, text: "Er" }
          - { key: b, text: "Sie" }
          - { key: c, text: "Es" }
        answer: c
        why: "impersonal subject: Es beginnt um 20 Uhr."
      - q: "Bitte sag mir (5) ______ Bescheid, ob du kommen (6) ______. — Please let me know (5) ______ whether you can come (6) ______."
        options:
          - { key: a, text: "bitte" }
          - { key: b, text: "gern" }
          - { key: c, text: "schon" }
        answer: a
        why: "polite request: sag mir bitte Bescheid."
      - q: "... ob du kommen (6) ______. — ... whether you can come (6) ______."
        options:
          - { key: a, text: "kann" }
          - { key: b, text: "kannst" }
          - { key: c, text: "können" }
        answer: b
        why: "du-form of können: kannst."

