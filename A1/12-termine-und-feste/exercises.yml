      - items: [Geburtstag, Party, Einladung, Supermarkt]
        odd: 3
        why: "not a celebration or event (Supermarkt = supermarket)"
      - items: [Weihnachten, Ostern, Silvester, Montag]
        odd: 3
        why: "not a holiday (Montag = a weekday)"
      - items: [im, am, um, weil]
        odd: 3
        why: "not a temporal preposition (weil = subordinating conjunction)"
      - items: [Januar, März, Sommer, Oktober]
        odd: 2
        why: "not a month (Sommer = a season)"
      - items: [feiern, einladen, gratulieren, kaufen]
        odd: 3
        why: "not a celebration/socializing verb (kaufen = to buy)"
      - items: [vor, nach, herzlich, während]
