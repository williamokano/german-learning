    answers:
      "1": "je nach"
      "2": "Je nachdem"
      "3": "Je"
      "4": "desto"
      "5": "je nach"
      "6": "Je"
      "7": "umso"
      "8": "Je nachdem"
      "9": "je nach"
      "10": "Je"

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

