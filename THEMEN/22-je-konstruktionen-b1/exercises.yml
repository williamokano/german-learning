    notes: "5–6 von 6 richtig und alle A/B/C-Übungen sauber gelöst? Dann sitzen die drei je-Strukturen. Für den formelleren Gebrauch (je nach Sachlage, je nachdem in längeren Sätzen) mach weiter mit dem B2-Set."
