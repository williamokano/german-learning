    items:
      - q: "___ regelmäßiger du lernst, desto schneller machst du Fortschritte."
        options: [{ key: a, text: "Desto" }, { key: b, text: "Wenn" }, { key: c, text: "Je" }]
        answer: c
        why: "Erster Teil → Je + Komparativ."
      - q: "Je mehr Wörter du kennst, ___ leichter verstehst du Texte."
        options: [{ key: a, text: "je" }, { key: b, text: "desto" }, { key: c, text: "so" }]
