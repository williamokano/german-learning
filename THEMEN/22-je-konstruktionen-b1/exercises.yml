lesson: "EX/22-je-konstruktionen-b1"
title: "je … desto, je nachdem, je nach — B1"
topic: "Je-Konstruktionen"
level: B1
intro: >
  Drei Strukturen mit je, die man leicht verwechselt. je … desto/umso +
  Komparativ drückt eine Wechselbeziehung aus (Je mehr ich lerne, desto
  besser verstehe ich es.): Der je-Teil ist ein Nebensatz mit Verb am
  Ende, der desto/umso-Teil hat Verb-Zweit — desto + Komparativ steht auf
  Position 1, dann kommt das Verb. je nachdem, ob / wie / wann / wer …
  ist eine Nebensatz-Konjunktion (es kommt darauf an) und hat das Verb
  am Ende; allein stehend heißt Je nachdem. so viel wie das hängt davon
  ab. je nach ist dagegen eine Präposition mit Dativ und steht vor einem
  Nomen ohne Verb: je nach Wetter, je nach Situation. Blocks: A
  Basistraining → B Vertiefung → C Sprachbausteine → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: order
    title: "je … desto / umso — Satzbau"
    instructions: "Bring die Kacheln in die richtige Reihenfolge. Der je-Teil endet mit dem Verb; der desto/umso-Teil beginnt mit desto/umso + Komparativ, dann folgt das Verb."
    instructionsEn: "Put the tiles in order. The je-clause ends with its verb; the desto/umso-clause starts with desto/umso + comparative, then the verb."
    items:
      - tiles: ["Je mehr Sport", "ich", "mache,", "desto fitter", "fühle", "ich mich."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Je mehr Sport ich mache, desto fitter fühle ich mich."
      - tiles: ["Je länger", "der Winter", "dauert,", "umso mehr", "freue", "ich mich auf den Frühling."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Je länger der Winter dauert, umso mehr freue ich mich auf den Frühling."
      - tiles: ["Je besser", "du", "dich vorbereitest,", "desto ruhiger", "bist", "du in der Prüfung."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Je besser du dich vorbereitest, desto ruhiger bist du in der Prüfung."
      - tiles: ["Je weniger", "ich", "schlafe,", "desto schlechter", "kann", "ich mich konzentrieren."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Je weniger ich schlafe, desto schlechter kann ich mich konzentrieren. (Modalverb: kann auf Position 2, Infinitiv am Ende.)"
      - tiles: ["Je öfter", "man", "eine Sprache spricht,", "umso sicherer", "wird", "man."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Je öfter man eine Sprache spricht, umso sicherer wird man."

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "je nach, je nachdem oder desto/umso?"
    instructions: "Ergänze je nach (+ Nomen), je nachdem (+ Nebensatz) oder desto/umso (2. Teil der Wechselbeziehung)."
    instructionsEn: "Fill in je nach (+ noun), je nachdem (+ clause), or desto/umso (second half of the je … construction)."
    text: |
      1. {1} Wetter machen wir eine Radtour oder wir bleiben zu Hause.
      2. {2}, ob es regnet, machen wir eine Radtour oder wir bleiben zu Hause.
      3. Je mehr Gemüse du isst, {3} gesünder lebst du.
      4. {4} Saison kosten die Erdbeeren mehr oder weniger.
      5. {5}, wie viel Zeit ich habe, koche ich selbst oder bestelle etwas.
      6. Je weniger Zucker man isst, {6} besser ist es für die Zähne.
      7. Die Preise sind {7} Anbieter sehr unterschiedlich.
      8. {8}, wen du fragst, bekommst du eine andere Antwort.
    answers:
      "1": "Je nach"
      "2": "Je nachdem"
      "3": ["desto", "umso"]
      "4": "Je nach"
      "5": "Je nachdem"
      "6": ["desto", "umso"]
      "7": "je nach"
      "8": "Je nachdem"

  - id: A3
    block: A
    type: order
    title: "je nachdem — Nebensatz mit Verb am Ende"
    instructions: "Bring die Kacheln in die richtige Reihenfolge. Nach je nachdem, ob/wie/… steht das Verb am Ende des Nebensatzes; danach beginnt der Hauptsatz mit dem Verb (Verb-Zweit)."
    instructionsEn: "Put the tiles in order. After je nachdem, ob/wie/… the verb goes to the end of the clause; the main clause then starts with its verb (verb-second)."
    items:
      - tiles: ["Je nachdem,", "wie das Wetter", "ist,", "gehen", "wir wandern oder ins Kino."]
        answer: [0, 1, 2, 3, 4]
        note: "Je nachdem, wie das Wetter ist, gehen wir wandern oder ins Kino."
      - tiles: ["Je nachdem,", "ob ich Frühschicht", "habe,", "stehe", "ich um fünf oder um acht auf."]
        answer: [0, 1, 2, 3, 4]
        note: "Je nachdem, ob ich Frühschicht habe, stehe ich um fünf oder um acht auf."
      - tiles: ["Je nachdem,", "wie viel Geld", "übrig ist,", "fahren", "wir in den Urlaub oder bleiben hier."]
        answer: [0, 1, 2, 3, 4]
        note: "Je nachdem, wie viel Geld übrig ist, fahren wir in den Urlaub oder bleiben hier."
      - tiles: ["Der Preis ändert sich,", "je nachdem,", "wie früh", "man", "bucht."]
        answer: [0, 1, 2, 3, 4]
        note: "Der Preis ändert sich, je nachdem, wie früh man bucht. (je nachdem kann auch hinten stehen.)"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Mein Arbeitsweg"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter bleiben übrig."
    instructionsEn: "Fill the 8 gaps with the words from the box. Two words are left over."
    text: |
      Wie ich zur Arbeit komme, hängt vom Tag ab. {1} Wetter fahre ich
      mit dem Rad oder mit der Bahn. {2} früher ich losfahre, {3} leerer
      sind die Straßen. {4}, ob ich einen Termin habe, nehme ich das Auto
      oder den Bus. {5} mehr Leute im Homeoffice bleiben, {6} entspannter
      wird der Verkehr. Die Fahrtzeit ist {7} Uhrzeit sehr verschieden.
      {8}, wie voll die Bahn ist, stehe ich oder finde einen Sitzplatz.
    bank: ["Je nach", "Je", "desto", "Je nachdem", "Je", "umso", "je nach", "Je nachdem", "wenn", "obwohl"]
    answers:
      "1": "Je nach"
      "2": "Je"
      "3": "desto"
      "4": "Je nachdem"
      "5": "Je"
      "6": "umso"
      "7": "je nach"
      "8": "Je nachdem"

  - id: B2
    block: B
    type: single-choice
    title: "je / desto / umso / je nach / je nachdem?"
    instructions: "Wähle die richtige Lösung (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "___ mehr man übt, desto leichter wird es."
        options: [{ key: a, text: "Desto" }, { key: b, text: "Je" }, { key: c, text: "So" }]
        answer: b
        why: "Erster Teil der Wechselbeziehung → Je + Komparativ."
      - q: "Je mehr man übt, ___ leichter wird es."
        options: [{ key: a, text: "je" }, { key: b, text: "als" }, { key: c, text: "desto" }]
        answer: c
        why: "Zweiter Teil → desto (oder umso) + Komparativ."
      - q: "___ Jahreszeit gibt es anderes Obst."
        options: [{ key: a, text: "Je nach" }, { key: b, text: "Je nachdem" }, { key: c, text: "Je" }]
        answer: a
        why: "Vor einem Nomen (Jahreszeit) → je nach + Dativ."
      - q: "___, ob es billiger ist, kaufe ich frisch oder tiefgekühlt."
        options: [{ key: a, text: "Je nach" }, { key: b, text: "Je" }, { key: c, text: "Je nachdem" }]
        answer: c
        why: "Vor einem Nebensatz mit ob → je nachdem."
      - q: "Frage: Kommst du mit ins Schwimmbad? — Kurzantwort: ___"
        options: [{ key: a, text: "Je nachdem." }, { key: b, text: "Je nach." }, { key: c, text: "Je mehr." }]
        answer: a
        why: "Die Kurzantwort Je nachdem. bedeutet: das hängt davon ab."
      - q: "Die Miete ist ___ Stadtteil sehr unterschiedlich."
        options: [{ key: a, text: "je nachdem" }, { key: b, text: "je nach" }, { key: c, text: "je" }]
        answer: b
        why: "Vor dem Nomen Stadtteil → je nach + Dativ."
      - q: "Je später der Zug kommt, ___ voller ist der Bahnsteig."
        options: [{ key: a, text: "desto" }, { key: b, text: "je" }, { key: c, text: "wenn" }]
        answer: a
        why: "Zweiter Teil → desto/umso."
      - q: "___, wie das Meeting läuft, bin ich um sechs oder erst um acht zu Hause."
        options: [{ key: a, text: "Je nach" }, { key: b, text: "Je nachdem" }, { key: c, text: "Je" }]
        answer: b
        why: "Vor dem Nebensatz mit wie → je nachdem, Verb (läuft) am Ende."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
