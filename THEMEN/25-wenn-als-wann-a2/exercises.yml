      ersten Mal allein etwas geschafft habe. {9} Freunde mich fragen,
      {10} das war, sage ich: an einem Freitagnachmittag.
    bank: ["Als", "wann", "Als", "wenn", "Als", "wenn", "Als", "wann", "Wenn", "wann", "weil", "dass", "obwohl"]
    answers:
