        why: "Wiederholte Handlung in der Vergangenheit → (immer) wenn."
      - q: "Ich habe vergessen, ___ der Zug abfährt."
        options: [{ key: a, text: "als" }, { key: b, text: "wenn" }, { key: c, text: "wann" }]
