    instructionsEn: "Fill the 10 gaps. Three words in the box are left over."
    text: |
      {1} ich mit der Schule fertig war, habe ich ein Praktikum gemacht.
      Ich erinnere mich genau, {2} mein erster Tag war: ein Montag im
