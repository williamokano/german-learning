lesson: "EX/25-wenn-als-wann-a2"
title: "wenn, als, wann — A2"
topic: "wenn / als / wann"
level: A2
intro: >
  Drei Wörter, die im Deutschen streng getrennt sind, im Englischen aber
  oft alle "when" heißen. als = ein einmaliges Ereignis in der
  Vergangenheit (Als ich zehn war, sind wir umgezogen.). wenn = etwas,
  das sich wiederholt (immer wenn …) oder eine Bedingung / ein Zeitpunkt
  in Gegenwart und Zukunft (Wenn ich Zeit habe, rufe ich dich an.). wann
  = das Fragewort, direkt (Wann kommst du?) und indirekt (Ich weiß
  nicht, wann er kommt.). wenn und als sind Nebensatz-Konjunktionen: das
  Verb steht am Ende. Blocks: A Basistraining → B Vertiefung → C
  Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "wenn, als oder wann?"
    instructions: "Ergänze wenn, als oder wann."
    instructionsEn: "Fill in wenn, als, or wann."
    text: |
      1. {1} ich ein Kind war, hatten wir einen Hund.
      2. {2} kommt der nächste Bus?
      3. Immer {3} es regnet, nehme ich den Bus.
      4. {4} ich gestern nach Hause kam, war niemand da.
      5. Weißt du, {5} der Film anfängt?
      6. {6} ich Zeit habe, besuche ich meine Oma.
      7. {7} wir in Berlin ankamen, hat es geschneit.
      8. Ich rufe dich an, {8} ich fertig bin.
    answers:
      "1": "Als"
      "2": "Wann"
      "3": "wenn"
      "4": "Als"
      "5": "wann"
      "6": "Wenn"
      "7": "Als"
      "8": "wenn"

  - id: A2
    block: A
    type: categorize
    title: "Einmal, wiederholt oder Frage?"
    instructions: "Ordne jeden Satz der richtigen Gruppe zu."
    instructionsEn: "Sort each sentence into the correct group."
    buckets:
      - { key: als, label: "als — einmal in der Vergangenheit" }
      - { key: wenn, label: "wenn — wiederholt / Bedingung / Zukunft" }
      - { key: wann, label: "wann — (indirekte) Frage" }
    tokens:
      - { text: "Als ich 18 wurde, habe ich den Führerschein gemacht.", bucket: als }
      - { text: "Als der Krieg zu Ende war, kam mein Opa zurück.", bucket: als }
      - { text: "Als wir uns kennenlernten, wohnte ich in Köln.", bucket: als }
      - { text: "Immer wenn ich Kaffee trinke, kann ich nicht schlafen.", bucket: wenn }
      - { text: "Wenn das Wetter schön ist, gehen wir spazieren.", bucket: wenn }
      - { text: "Ruf mich an, wenn du angekommen bist.", bucket: wenn }
      - { text: "Kannst du mir sagen, wann die Bank aufmacht?", bucket: wann }
      - { text: "Ich weiß nicht, wann der Zug fährt.", bucket: wann }
      - { text: "Wann hast du Geburtstag?", bucket: wann }

  - id: A3
    block: A
    type: order
    title: "Nebensatz mit als / wenn — Verb am Ende"
    instructions: "Bring die Kacheln in die richtige Reihenfolge. Nach als und wenn steht das Verb am Ende des Nebensatzes."
    instructionsEn: "Put the tiles in order. After als and wenn the verb goes to the end of the clause."
    items:
      - tiles: ["Als", "ich", "klein", "war,", "hatte ich Angst vor Hunden."]
        answer: [0, 1, 2, 3, 4]
        note: "Als ich klein war, hatte ich Angst vor Hunden."
      - tiles: ["Wenn", "ich", "am Wochenende", "frei habe,", "schlafe ich lange."]
        answer: [0, 1, 2, 3, 4]
        note: "Wenn ich am Wochenende frei habe, schlafe ich lange."
      - tiles: ["Ich freue mich,", "wenn", "du", "mich", "besuchst."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich freue mich, wenn du mich besuchst."
      - tiles: ["Als", "der Film", "zu Ende", "war,", "sind alle gegangen."]
        answer: [0, 1, 2, 3, 4]
        note: "Als der Film zu Ende war, sind alle gegangen."

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein Umzug"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter bleiben übrig."
    instructionsEn: "Fill the 8 gaps with the words from the box. Two words are left over."
    text: |
      {1} ich acht Jahre alt war, sind wir nach Hamburg gezogen. Ich
      weiß noch, {2} der Umzugswagen kam: früh am Morgen. {3} wir alles
      eingeladen hatten, haben wir uns von den Nachbarn verabschiedet.
      Meine Mutter hat gesagt: "Ruf an, {4} wir angekommen sind." Heute
      besuche ich meine alte Straße, {5} ich in der Nähe bin. Und immer
      {6} ich alte Fotos sehe, muss ich an diesen Tag denken. Manchmal
      fragen mich Freunde, {7} das genau war. {8} ich das erzähle,
      lächeln alle.
    bank: ["Als", "wann", "Als", "wenn", "wenn", "wenn", "wann", "Wenn", "weil", "dass"]
    answers:
      "1": "Als"
      "2": "wann"
      "3": "Als"
      "4": "wenn"
      "5": "wenn"
      "6": "wenn"
      "7": "wann"
      "8": "Wenn"

  - id: B2
    block: B
    type: single-choice
    title: "Warum wenn, als oder wann?"
    instructions: "Wähle die richtige Lösung (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "___ ich gestern aufwachte, schien die Sonne."
        options: [{ key: a, text: "Wenn" }, { key: b, text: "Als" }, { key: c, text: "Wann" }]
        answer: b
        why: "Einmaliges Ereignis in der Vergangenheit → als."
      - q: "___ ich morgens aufwache, trinke ich zuerst einen Tee."
        options: [{ key: a, text: "Als" }, { key: b, text: "Wann" }, { key: c, text: "Wenn" }]
        answer: c
        why: "Etwas, das sich jeden Tag wiederholt → wenn."
      - q: "Ich weiß nicht, ___ der Supermarkt heute schließt."
        options: [{ key: a, text: "wann" }, { key: b, text: "als" }, { key: c, text: "wenn" }]
        answer: a
        why: "Indirekte Frage → wann."
      - q: "___ meine Großeltern jung waren, gab es noch kein Internet."
        options: [{ key: a, text: "Wenn" }, { key: b, text: "Wann" }, { key: c, text: "Als" }]
        answer: c
        why: "Ein Zeitraum / Zustand in der Vergangenheit, einmal → als."
      - q: "___ hast du das letzte Mal Urlaub gemacht?"
        options: [{ key: a, text: "Wann" }, { key: b, text: "Als" }, { key: c, text: "Wenn" }]
        answer: a
        why: "Direkte Frage → Wann."
      - q: "___ es im Sommer heiß ist, gehen wir oft schwimmen."
        options: [{ key: a, text: "Als" }, { key: b, text: "Wenn" }, { key: c, text: "Wann" }]
        answer: b
        why: "Wiederholung (jeden Sommer) → wenn."
      - q: "___ ich zum ersten Mal in Deutschland war, konnte ich kein Wort Deutsch."
        options: [{ key: a, text: "Als" }, { key: b, text: "Wenn" }, { key: c, text: "Wann" }]
        answer: a
        why: "Einmaliges Ereignis in der Vergangenheit → als."
      - q: "Kannst du mir sagen, ___ der Kurs beginnt?"
        options: [{ key: a, text: "als" }, { key: b, text: "wann" }, { key: c, text: "wenn" }]
        answer: b
        why: "Indirekte Frage → wann."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
