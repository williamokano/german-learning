      - q: "___ war eigentlich dein letzter Arbeitstag?"
        options: [{ key: a, text: "Als" }, { key: b, text: "Wenn" }, { key: c, text: "Wann" }]
        answer: c
        why: "Direkte Frage → Wann."
      - q: "___ das Erdbeben kam, waren wir gerade im Kino."
