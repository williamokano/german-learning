        answer: a
        why: "mit + Dativ, der Blick → mit so einem Blick."
      - q: "Es gab ___ viele Vorspeisen, dass wir das Hauptgericht fast nicht mehr geschafft haben."
        options: [{ key: a, text: "solche" }, { key: b, text: "so" }, { key: c, text: "so eine" }]
        answer: b
        why: "so viele + Nomen → so."

  - id: C2
