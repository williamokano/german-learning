      - q: "Wir hatten so einen netten Kellner, ___ wir extra Trinkgeld gaben."
        options: [{ key: a, text: "dass" }, { key: b, text: "weil" }, { key: c, text: "obwohl" }]
        answer: a
        why: "Folge → dass."
      - q: "___ Portion schaffe ich nie allein."
        options: [{ key: a, text: "So ein" }, { key: b, text: "So einen" }, { key: c, text: "So eine" }]
        answer: c
        why: "die Portion (feminin, Nominativ) → So eine."
      - q: "Die Musik war ___ laut, dass wir uns anschreien mussten."
        options: [{ key: a, text: "so eine" }, { key: b, text: "so" }, { key: c, text: "solche" }]
        answer: b
        why: "so + Adjektiv (laut) → so."
      - q: "Mit ___ Blick auf den Fluss schmeckt sogar das einfache Essen gut."
