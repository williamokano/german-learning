    bank: ["so ein", "so", "dass", "so", "dass", "so", "dass", "so einen", "So ein", "so", "solche", "weil", "so eine"]
    answers:
      "1": "so ein"
      "2": "so"
      "3": "dass"
      "4": "so"
      "5": "dass"
      "6": "so"
      "7": "dass"
      "8": "so einen"
      "9": "So ein"
      "10": "so"

