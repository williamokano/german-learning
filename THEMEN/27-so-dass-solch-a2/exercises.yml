    instructions: "Wähle für jede Lücke die richtige Lösung (a, b oder c)."
    instructionsEn: "Choose the correct option for each gap (a, b, or c)."
    items:
      - q: "Das Lokal war ___ voll, dass wir keinen Platz bekamen."
        options: [{ key: a, text: "so ein" }, { key: b, text: "solches" }, { key: c, text: "so" }]
        answer: c
        why: "so + Adjektiv → so."
      - q: "___ langen Abend hatten wir schon lange nicht mehr."
        options: [{ key: a, text: "So ein" }, { key: b, text: "So einen" }, { key: c, text: "So eine" }]
        answer: b
        why: "Akkusativ, der Abend → So einen langen Abend."
      - q: "Der Nachtisch sah ___ gut aus, dass alle einen bestellten."
        options: [{ key: a, text: "so ein" }, { key: b, text: "solch" }, { key: c, text: "so" }]
        answer: c
