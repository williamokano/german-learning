    notes: "5–6 von 6 richtig und alle A/B/C-Übungen sauber gelöst? Merke: so + Adjektiv + , dass = Folge; so ein- + Nomen = solch ein (Artikel-Deklination). Für solch- (dekliniert) und sodass vs. so … dass geht es im B1-Set weiter."
