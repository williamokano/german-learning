lesson: "EX/01-personalpronomen-a2"
title: "Personalpronomen: Nominativ, Akkusativ, Dativ — A2"
topic: "Personalpronomen (Nominativ, Akkusativ, Dativ)"
level: A2
intro: >
  Standalone drill set, not tied to any lesson. Builds on the A1 set: mixed
  cases inside connected text (not isolated pairs), a matching puzzle, two
  Sprachbausteine exam-style exercises, and a final review with three
  two-pronoun sentences (Akkusativ before Dativ). Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    skill: case-endings
    title: "Ein Tag mit Tim"
    instructions: "Ergänze die richtigen Personalpronomen im Text."
    instructionsEn: "Fill in the correct personal pronouns as you read the story."
    text: |
      Tim hat einen neuen Job. Seine Chefin heißt Frau Berger. {1} findet Tim
      sehr freundlich. Am ersten Arbeitstag zeigt Frau Berger {2} das Büro.
      Tim hat viele Fragen, und seine Kollegen helfen {3} gern. Nach der
      Arbeit ruft Tim seine Eltern an. {4} freuen sich sehr über die guten
      Neuigkeiten. Tims Freundin Lea wartet schon zu Hause. Als er ankommt,
      umarmt er {5}. „Wie war dein Tag?", fragt {6}. Tim erzählt {7} alles
      über den neuen Job. Am Ende sagt Lea: „Ich bin stolz auf {8}!"
    answers:
      "1": sie
      "2": ihm
      "3": ihm
      "4": sie
      "5": sie
      "6": sie
      "7": ihr
      "8": dich

  - id: A2
    block: A
    type: single-choice
    title: "Welcher Fall passt?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c) — pay attention to which case the verb needs."
    items:
      - q: "Der Kaffee ist fertig. Trinkst du ___ mit mir?"
        options: [{ key: a, text: "ihn" }, { key: b, text: "ihm" }, { key: c, text: "er" }]
        answer: a
        why: "trinken + Akkusativ; der Kaffee ist maskulin → ihn."
      - q: "Meine Oma ist krank. Wir besuchen ___ im Krankenhaus."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihr" }, { key: c, text: "ihnen" }]
        answer: a
        why: "besuchen + Akkusativ → sie."
      - q: "Der Film hat mir gut gefallen. ___ hat auch dir gefallen, oder?"
        options: [{ key: a, text: "Er" }, { key: b, text: "Ihn" }, { key: c, text: "Ihm" }]
        answer: a
        why: "Subjekt von gefallen (Nominativ); der Film ist maskulin → Er."
      - q: "Die Nachbarn sind neu hier. Wir zeigen ___ die Stadt."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihnen" }, { key: c, text: "ihr" }]
        answer: b
        why: "zeigen + Dativ; Nachbarn = Plural → ihnen."
      - q: "Ich habe die Prüfung bestanden! Gratulierst du ___?"
        options: [{ key: a, text: "mich" }, { key: b, text: "mir" }, { key: c, text: "ich" }]
        answer: b
        why: "gratulieren + Dativ → mir."
      - q: "Das Baby weint. Die Mutter nimmt ___ auf den Arm."
        options: [{ key: a, text: "es" }, { key: b, text: "ihm" }, { key: c, text: "sie" }]
        answer: a
        why: "nehmen + Akkusativ; das Baby ist neutrum → es."

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein Geschenk für die Schwester"
    instructions: "Fülle die 10 Lücken mit den Wörtern aus dem Kasten."
    instructionsEn: "Fill the 10 gaps using the words in the box."
    text: |
      Sara ruft ihren Freund Mehmet an. „Hallo Mehmet, hier ist Sara. Kannst
      du {1} kurz helfen?" — „Klar, worum geht es?", fragt Mehmet. „Meine
      Schwester hat morgen Geburtstag, und ich habe noch kein Geschenk für
      {2}." Mehmet überlegt. „Schenk {3} doch ein Buch! Sie liest gern,
      oder?" — „Stimmt! Ich rufe {4} später an und frage {5}, was sie sich
      wünscht." Am nächsten Tag besucht Sara ihre Schwester. Sie bringt {6}
      das Buch mit. Ihre Schwester freut sich sehr: „Danke, das gefällt {7}
      total gut!" Sara lacht: „Mehmet hat {8} die Idee gegeben. Du solltest
      {9} auch mal danken!" Am Abend ruft die Schwester Mehmet an: „Das war
      wirklich nett von {10}."
    bank: [mir, sie, ihr, sie, sie, ihr, mir, mir, ihm, dir, dich, euch]
    answers:
      "1": mir
      "2": sie
      "3": ihr
      "4": sie
      "5": sie
      "6": ihr
      "7": mir
      "8": mir
      "9": ihm
      "10": dir

  - id: B2
    block: B
    type: matching
    title: "Sätze und Pronomen verbinden"
    instructions: "Ordne jedem Satzanfang das richtige Pronomen zu."
    instructionsEn: "Match each sentence to the pronoun that correctly fills its gap."
    left:
      - { key: "1", text: "Meine Schwester sucht mich. Sie hat ___ gefunden." }
      - { key: "2", text: "Du hast morgen Geburtstag. Ich schenke ___ ein Buch." }
      - { key: "3", text: "Mein Vater hat einen neuen Hund. Ich finde ___ süß." }
      - { key: "4", text: "Meine Tante wohnt allein. Ich schreibe ___ oft Briefe." }
      - { key: "5", text: "Unsere Nachbarn mögen uns. Sie besuchen ___ oft." }
      - { key: "6", text: "Die Gäste sind müde. Wir bringen ___ Kaffee." }
    right:
      - { key: a, text: "ihr" }
      - { key: b, text: "mich" }
      - { key: c, text: "ihnen" }
      - { key: d, text: "dir" }
      - { key: e, text: "ihn" }
      - { key: f, text: "uns" }
    answers:
      "1": b
      "2": d
      "3": e
      "4": a
      "5": f
      "6": c

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Annas Umzug"
    instructions: "Choose the correct word for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Anna zieht nach Köln um. ___ hat dort eine neue Wohnung gefunden."
        options: [{ key: a, text: "Sie" }, { key: b, text: "Ihr" }, { key: c, text: "Ihnen" }]
        answer: a
        why: "Subjekt (Nominativ) → Sie."
      - q: "Die Wohnung gefällt ___ sehr gut."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihr" }, { key: c, text: "ihre" }]
        answer: b
        why: "gefallen + Dativ → ihr."
      - q: "Annas beste Freundin Nina hilft ___ beim Umzug."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihr" }, { key: c, text: "ihren" }]
        answer: b
        why: "helfen + Dativ → ihr."
      - q: "Anna dankt ___ für die Hilfe und lädt sie zum Essen ein."
        options: [{ key: a, text: "ihr" }, { key: b, text: "sie" }, { key: c, text: "ihre" }]
        answer: a
        why: "danken + Dativ → ihr."
      - q: "Die neuen Nachbarn sind sehr freundlich. Anna trifft ___ oft im Treppenhaus."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihnen" }, { key: c, text: "ihr" }]
        answer: a
        why: "treffen + Akkusativ; Nachbarn = Plural → sie."
      - q: "Ein Nachbar, Herr Klein, lädt Anna zum Kaffee ein. Anna besucht ___ am Sonntag."
        options: [{ key: a, text: "er" }, { key: b, text: "ihm" }, { key: c, text: "ihn" }]
        answer: c
        why: "besuchen + Akkusativ → ihn."
      - q: "Herr Klein erzählt Anna viel über die Stadt. Das interessiert ___ sehr."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihr" }, { key: c, text: "sich" }]
        answer: a
        why: "interessieren + Akkusativ; Anna ist feminin → sie."
      - q: "Am Ende ruft Anna ihre Eltern an und erzählt ___ von ihrem neuen Leben."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihnen" }, { key: c, text: "ihr" }]
        answer: b
        why: "erzählen + Dativ; Eltern = Plural → ihnen."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Ein Brief an die Familie (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Liebe Mama, lieber Papa, ich schreibe {1} aus meiner neuen Stadt! Die
      Wohnung gefällt {2} sehr gut, auch wenn sie klein ist. Meine Kollegin
      Julia hat {3} beim Einzug geholfen — ich bin {4} sehr dankbar. Am
      Wochenende habe ich meinen alten Schulfreund Ben getroffen. Ich habe
      {5} seit Jahren nicht gesehen! Er hat {6} viel über sein neues Leben
      erzählt. Meine neuen Nachbarn sind auch sehr nett. Ich habe {7} schon
      zum Kaffee eingeladen. Papa, kannst du {8} bitte meine alten Bücher
      schicken? Ich vermisse {9} beide sehr, aber es geht mir gut. Ruft {10}
      bald an!
    bank: [EUCH, MIR, MIR, IHR, IHN, MIR, SIE, MIR, EUCH, MICH, DICH, UNS, IHM]
    answers:
      "1": EUCH
      "2": MIR
      "3": MIR
      "4": IHR
      "5": IHN
      "6": MIR
      "7": SIE
      "8": MIR
      "9": EUCH
      "10": MICH

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung: zwei Pronomen im Satz"
    instructions: "Ergänze die richtigen Personalpronomen. Sätze 3–5 haben zwei Lücken."
    instructionsEn: "Fill in the pronouns. Sentences 3–5 each need two pronoun objects — remember: the Akkusativ pronoun always comes before the Dativ pronoun (Ich gebe ihn ihr, not Ich gebe ihr ihn)."
    text: |
      1. Ich habe ein Problem. Kannst du {1} helfen?
      2. Das ist meine neue Katze. Ich habe {2} letzte Woche bekommen.
      3. Ich habe einen neuen Roman gekauft. Meine Schwester möchte {3} lesen. Ich gebe {4} {5}.
      4. Mein Kollege braucht den Bericht. Ich schicke {6} {7} per E-Mail.
      5. Die Kinder wünschen sich ein Haustier. Die Eltern schenken {8} {9} zu Weihnachten.
    answers:
      "1": mir
      "2": sie
      "3": ihn
      "4": ihn
      "5": ihr
      "6": ihn
      "7": ihm
      "8": es
      "9": ihnen
    notes: "Sätze 3–5: erst das Akkusativ-Pronomen (ihn/ihn/es), dann das Dativ-Pronomen (ihr/ihm/ihnen)."

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich brauche deine Hilfe. Kannst du ___ morgen anrufen?"
        options: [{ key: a, text: "mich" }, { key: b, text: "mir" }, { key: c, text: "ich" }]
        answer: a
        why: "anrufen + Akkusativ → mich."
      - q: "Die Blumen sind für meine Mutter. Ich schenke ___ Rosen."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihr" }, { key: c, text: "ihren" }]
        answer: b
        why: "schenken + Dativ → ihr."
      - q: "Wo sind meine Schlüssel? Hast du ___ gesehen?"
        options: [{ key: a, text: "sie" }, { key: b, text: "ihnen" }, { key: c, text: "ihr" }]
        answer: a
        why: "sehen + Akkusativ; Schlüssel = Plural → sie."
      - q: "Unsere Gäste kommen bald. Wir zeigen ___ das Haus."
        options: [{ key: a, text: "sie" }, { key: b, text: "ihnen" }, { key: c, text: "ihr" }]
        answer: b
        why: "zeigen + Dativ; Gäste = Plural → ihnen."
      - q: "Das Konzert war super. ___ hat mir sehr gut gefallen."
        options: [{ key: a, text: "Es" }, { key: b, text: "Ihm" }, { key: c, text: "Sie" }]
        answer: a
        why: "Subjekt von gefallen (Nominativ); das Konzert ist neutrum → Es."
      - q: "Ich habe morgen ein Vorstellungsgespräch. Wünsch ___ Glück!"
        options: [{ key: a, text: "mich" }, { key: b, text: "mir" }, { key: c, text: "ich" }]
        answer: b
        why: "wünschen + Dativ → mir."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B1-Version. Weniger als 5? Schau dir Block A und B noch einmal an."
