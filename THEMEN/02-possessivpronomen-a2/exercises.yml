lesson: "EX/02-possessivpronomen-a2"
title: "Possessivartikel in allen Fällen: Nominativ, Akkusativ, Dativ — A2"
topic: "Possessivpronomen (mein, dein, sein, ihr, unser, euer, Ihr)"
level: A2
intro: >
  Standalone drill set, not tied to any lesson. Builds on the A1 set
  (Nominativ) by working through the full ein-Wörter case endings:
  maskulin -en (Akk) / -em (Dat), feminin -er (Dat), Plural -en (Dat).
  Blocks: A Basistraining (the full table, then Dativ) → B Vertiefung
  (Akkusativ, then mixed contrasts) → C Sprachbausteine → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "mein in allen Fällen"
    instructions: "Ergänze die Tabelle mit der richtigen Form von mein."
    instructionsEn: "Complete the table with the correct form of mein."
    columns: ["", "Nominativ", "Akkusativ", "Dativ"]
    rows:
      - label: "der Bruder"
        cells: [{ gap: 1, answer: "mein Bruder" }, { gap: 2, answer: "meinen Bruder" }, { gap: 3, answer: "meinem Bruder" }]
      - label: "die Schwester"
        cells: [{ gap: 4, answer: "meine Schwester" }, { gap: 5, answer: "meine Schwester" }, { gap: 6, answer: "meiner Schwester" }]
      - label: "das Kind"
        cells: [{ gap: 7, answer: "mein Kind" }, { gap: 8, answer: "mein Kind" }, { gap: 9, answer: "meinem Kind" }]
      - label: "die Eltern (Pl.)"
        cells: [{ gap: 10, answer: "meine Eltern" }, { gap: 11, answer: "meine Eltern" }, { gap: 12, answer: "meinen Eltern" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Dativ: -em, -er, -en"
    instructions: "Ergänze den Possessivartikel im Dativ."
    instructionsEn: "Fill in the possessive in the Dativ case."
    text: |
      1. Ich helfe {1} Bruder bei den Hausaufgaben.
      2. Das ist Tom. Er dankt {2} Mutter für das Geschenk.
      3. Wir schreiben {3} Eltern eine Postkarte.
      4. Das ist Julia. Das Auto gehört {4} Onkel.
      5. Das ist Ben. Das Geschenk gefällt {5} Freundin sehr.
      6. Könnt ihr {6} Kindern helfen?
    answers:
      "1": meinem
      "2": seiner
      "3": unseren
      "4": ihrem
      "5": seiner
      "6": euren

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Wir packen für den Urlaub"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten (Akkusativ)."
    instructionsEn: "Fill the 8 gaps using the words in the box (Akkusativ)."
    text: |
      Morgen fliegen wir in den Urlaub. Ich packe {1} Koffer. Zuerst nehme
      ich {2} Kamera mit — ich will viele Fotos machen. Mein Bruder sucht
      {3} Sonnenbrille, findet sie aber nicht. Meine Schwester packt {4}
      Bücher ein. Wir dürfen auch {5} Handys mitnehmen. Mama sagt:
      „Vergesst nicht {6} Pässe!" Papa hat schon {7} Tickets gedruckt. Am
      Flughafen zeigen wir {8} Ausweise.
    bank: [meinen, meine, seine, ihre, unsere, eure, seine, unsere, deine, ihren]
    answers:
      "1": meinen
      "2": meine
      "3": seine
      "4": ihre
      "5": unsere
      "6": eure
      "7": seine
      "8": unsere

  - id: B2
    block: B
    type: single-choice
    title: "Nominativ, Akkusativ oder Dativ?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "___ Handy ist neu."
        options: [{ key: a, text: "Mein" }, { key: b, text: "Meinen" }, { key: c, text: "Meinem" }]
        answer: a
        why: "Subjekt (Nominativ); Handy ist neutrum → mein."
      - q: "Ich suche ___ Handy."
        options: [{ key: a, text: "mein" }, { key: b, text: "meinen" }, { key: c, text: "meinem" }]
        answer: a
        why: "Akkusativ; neutrum bekommt keine Endung → mein."
      - q: "Ich telefoniere mit ___ Handy."
        options: [{ key: a, text: "mein" }, { key: b, text: "meinem" }, { key: c, text: "meinen" }]
        answer: b
        why: "mit + Dativ; neutrum im Dativ → meinem."
      - q: "___ Schwester wohnt in Berlin."
        options: [{ key: a, text: "Mein" }, { key: b, text: "Meine" }, { key: c, text: "Meinen" }]
        answer: b
        why: "Subjekt (Nominativ); Schwester ist feminin → meine."
      - q: "Ich rufe ___ Schwester an."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinem" }]
        answer: a
        why: "Akkusativ; feminin bleibt -e → meine."
      - q: "Ich schreibe ___ Schwester eine E-Mail."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "Dativ; feminin bekommt -er → meiner."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Ein Besuch bei den Großeltern"
    instructions: "Choose the correct word for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Ich besuche ___ Großeltern jedes Jahr."
        options: [{ key: a, text: "mein" }, { key: b, text: "meine" }, { key: c, text: "meinen" }]
        answer: b
        why: "Akkusativ Plural → meine."
      - q: "Sie wohnen mit ___ Hund auf dem Land."
        options: [{ key: a, text: "ihrem" }, { key: b, text: "ihren" }, { key: c, text: "ihre" }]
        answer: a
        why: "mit + Dativ; Hund ist maskulin → ihrem."
      - q: "Meine Oma zeigt mir immer ___ Garten."
        options: [{ key: a, text: "ihr" }, { key: b, text: "ihre" }, { key: c, text: "ihren" }]
        answer: c
        why: "Akkusativ; Garten ist maskulin → -en → ihren."
      - q: "Mein Opa erzählt ___ Enkeln gern Geschichten."
        options: [{ key: a, text: "seine" }, { key: b, text: "seinen" }, { key: c, text: "sein" }]
        answer: b
        why: "Dativ Plural → seinen."
      - q: "Ich helfe ___ Oma oft in der Küche."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "helfen + Dativ; feminin → meiner."
      - q: "Am Abend sitzen wir alle in ___ Wohnzimmer."
        options: [{ key: a, text: "ihr" }, { key: b, text: "ihrem" }, { key: c, text: "ihre" }]
        answer: b
        why: "Dativ; Wohnzimmer ist neutrum → ihrem."
      - q: "Die Kinder spielen mit ___ Spielzeug."
        options: [{ key: a, text: "ihrem" }, { key: b, text: "ihren" }, { key: c, text: "ihre" }]
        answer: a
        why: "Dativ; Spielzeug ist neutrum → ihrem (die Endung richtet sich nach dem Nomen, nicht nach dem Plural-Besitzer)."
      - q: "Am Ende bedanken wir uns bei ___ Familie für den schönen Tag."
        options: [{ key: a, text: "ihre" }, { key: b, text: "ihrer" }, { key: c, text: "ihren" }]
        answer: b
        why: "bei + Dativ; Familie ist feminin → ihrer."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Im Restaurant (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Wir gehen mit {1} Freunden ins Restaurant. Mein Mann liest {2}
      Speisekarte genau durch, bevor er bestellt. Ich rufe {3} Schwester
      an, um sie auch einzuladen, aber sie isst schon mit {4} Kollegen.
      Nach dem Essen bezahlt mein Mann {5} Rechnung mit {6} Kreditkarte.
      Wir geben {7} Kellner ein Trinkgeld. Die Kinder haben {8} Eis noch
      nicht aufgegessen. Am Ende bedanken wir uns bei {9} Gastgeberin für
      den schönen Abend und laden {10} Freunde für nächste Woche wieder
      ein.
    bank: [UNSEREN, SEINE, MEINE, IHREN, SEINE, SEINER, UNSEREM, IHR, UNSERER, UNSERE, DEINE, EUREM, IHRES]
    answers:
      "1": UNSEREN
      "2": SEINE
      "3": MEINE
      "4": IHREN
      "5": SEINE
      "6": SEINER
      "7": UNSEREM
      "8": IHR
      "9": UNSERER
      "10": UNSERE

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung: alle Fälle"
    instructions: "Ergänze die richtigen Possessivartikel. Satz 7 hat einen schwachen Nomen (Kollege -> Kollegen)."
    instructionsEn: "Fill in the possessives across all three cases. Sentence 7 uses a weak noun (Kollege -> Kollegen)."
    text: |
      1. {1} Auto ist kaputt.
      2. Ich fahre mit {2} Auto in die Werkstatt.
      3. Der Mechaniker repariert {3} Auto.
      4. Meine Schwester leiht mir {4} Auto.
      5. Ich danke {5} Schwester für die Hilfe.
      6. Wir kaufen {6} Eltern ein Geschenk.
      7. Kennst du {7} neuen Kollegen?
    answers:
      "1": Mein
      "2": meinem
      "3": mein
      "4": ihr
      "5": meiner
      "6": unseren
      "7": meinen
    notes: "Satz 7: Kollege ist ein schwacher Nomen (der Kollege, den/dem/des Kollegen) — im Akkusativ bekommen sowohl der Possessivartikel als auch das Nomen die Endung -en."

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "___ Tasche ist neu."
        options: [{ key: a, text: "Mein" }, { key: b, text: "Meine" }, { key: c, text: "Meinen" }]
        answer: b
        why: "Nominativ; Tasche ist feminin → Meine."
      - q: "Ich habe ___ Tasche im Zug vergessen."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinem" }]
        answer: a
        why: "Akkusativ; feminin bleibt -e → meine."
      - q: "Was ist in ___ Tasche?"
        options: [{ key: a, text: "deine" }, { key: b, text: "deiner" }, { key: c, text: "deinen" }]
        answer: b
        why: "in + Dativ; feminin bekommt -er → deiner."
      - q: "Er hilft ___ Kindern bei der Hausaufgabe."
        options: [{ key: a, text: "seine" }, { key: b, text: "seinen" }, { key: c, text: "sein" }]
        answer: b
        why: "helfen + Dativ Plural → seinen."
      - q: "Wir besuchen ___ Freunde in Berlin."
        options: [{ key: a, text: "unser" }, { key: b, text: "unseren" }, { key: c, text: "unsere" }]
        answer: c
        why: "Akkusativ Plural → unsere."
      - q: "Das Geschenk ist für ___ Mutter."
        options: [{ key: a, text: "dein" }, { key: b, text: "deine" }, { key: c, text: "deinen" }]
        answer: b
        why: "für + Akkusativ; feminin bleibt -e → deine."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B1-Version. Weniger als 5? Schau dir Block A noch einmal an."
