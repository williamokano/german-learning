lesson: "EX/06-nebensatzkonnektoren-a2"
title: "Nebensätze mit weil, dass, wenn — A2"
topic: "Nebensatzkonnektoren"
level: A2
intro: >
  Standalone drill set, not tied to any lesson. A Nebensatzkonnektor
  (weil, dass, wenn …) sends the finite verb to the END of its clause.
  weil gives a reason, dass reports a statement/fact, wenn is
  conditional or repeated-temporal ("whenever/if"). If the Nebensatz
  comes FIRST, the main clause verb jumps right after the comma
  (subject and verb swap places). Blocks: A Basistraining (word order,
  then connector choice) → B Vertiefung → C Sprachbausteine → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: order
    title: "Wortstellung im Nebensatz"
    instructions: "Bring die Wörter in die richtige Reihenfolge — das Verb steht am Ende des Nebensatzes."
    instructionsEn: "Put the tiles in the right order — the finite verb goes to the end of the Nebensatz."
    items:
      - tiles: ["Ich bleibe zu Hause,", "weil", "ich", "krank", "bin."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich bleibe zu Hause, weil ich krank bin."
      - tiles: ["Ich glaube,", "dass", "er", "Recht", "hat."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich glaube, dass er Recht hat."
      - tiles: ["Wenn", "es", "regnet,", "bleibe", "ich", "zu Hause."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Wenn es regnet, bleibe ich zu Hause. — Nebensatz zuerst: Verb + Subjekt tauschen im Hauptsatz."
      - tiles: ["Er sagt,", "dass", "er", "müde", "ist."]
        answer: [0, 1, 2, 3, 4]
        note: "Er sagt, dass er müde ist."
      - tiles: ["Ich lerne Deutsch,", "weil", "ich", "nach Berlin", "ziehen möchte."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich lerne Deutsch, weil ich nach Berlin ziehen möchte."
      - tiles: ["Wenn", "ich", "Zeit habe,", "rufe", "ich", "dich an."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Wenn ich Zeit habe, rufe ich dich an."

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "weil, dass oder wenn?"
    instructions: "Ergänze den richtigen Konnektor."
    instructionsEn: "Fill in the correct connector."
    text: |
      1. Ich bin müde, {1} ich schlecht geschlafen habe.
      2. Ich weiß, {2} du Recht hast.
      3. {3} ich Zeit habe, gehe ich schwimmen.
      4. Sie sagt, {4} sie morgen kommt.
      5. Wir bleiben drinnen, {5} es kalt ist.
      6. {6} die Sonne scheint, gehen wir spazieren.
    answers:
      "1": weil
      "2": dass
      "3": Wenn
      "4": dass
      "5": weil
      "6": Wenn

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Besuch von meiner Schwester"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Ich bin heute glücklich, {1} ich eine gute Nachricht bekommen
      habe. Meine Schwester hat mir geschrieben, {2} sie bald zu Besuch
      kommt. {3} sie ankommt, hole ich sie vom Bahnhof ab. Ich freue
      mich, {4} wir uns lange nicht gesehen haben. Sie hat gesagt, {5}
      sie zwei Wochen bleiben möchte. {6} sie hier ist, zeige ich ihr
      die Stadt. Ich hoffe, {7} das Wetter schön bleibt. Meine Eltern
      freuen sich auch, {8} sie ihre Tochter sehen.
    bank: [weil, dass, wenn, weil, dass, wenn, dass, weil, obwohl, ob]
    answers:
      "1": weil
      "2": dass
      "3": wenn
      "4": weil
      "5": dass
      "6": wenn
      "7": dass
      "8": weil

  - id: B2
    block: B
    type: single-choice
    title: "Grund, Aussage oder Bedingung?"
    instructions: "Wähle den richtigen Konnektor (a, b oder c)."
    instructionsEn: "Choose the correct connector (a, b, or c)."
    items:
      - q: "Ich kann nicht kommen, ___ ich krank bin."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: a
        why: "Grund → weil."
      - q: "Ich denke, ___ das eine gute Idee ist."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage/Meinung → dass."
      - q: "___ ich nach Hause komme, koche ich immer."
        options: [{ key: a, text: "Weil" }, { key: b, text: "Dass" }, { key: c, text: "Wenn" }]
        answer: c
        why: "Wiederholte Bedingung ('jedes Mal, wenn') → Wenn."
      - q: "Er ist traurig, ___ sein Hund krank ist."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: a
        why: "Grund → weil."
      - q: "Es ist schön, ___ du hier bist."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage → dass."
      - q: "___ es schneit, fahre ich Ski."
        options: [{ key: a, text: "Weil" }, { key: b, text: "Dass" }, { key: c, text: "Wenn" }]
        answer: c
        why: "Bedingung → Wenn."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Mein Umzug"
    instructions: "Choose the correct connector for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Ich ziehe um, ___ meine neue Wohnung größer ist."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: a
        why: "Grund → weil."
      - q: "Ich hoffe, ___ der Umzug schnell geht."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage → dass."
      - q: "___ ich die neue Wohnung sehe, freue ich mich."
        options: [{ key: a, text: "Weil" }, { key: b, text: "Dass" }, { key: c, text: "Wenn" }]
        answer: c
        why: "Bedingung/Zeitpunkt → Wenn."
      - q: "Meine Freunde helfen mir, ___ sie Zeit haben."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: c
        why: "'immer wenn sie Zeit haben' → wenn."
      - q: "Ich weiß, ___ der Umzug anstrengend wird."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage → dass."
      - q: "Ich bin nervös, ___ so viel zu organisieren ist."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: a
        why: "Grund → weil."
      - q: "___ alles gepackt ist, rufe ich den Umzugswagen."
        options: [{ key: a, text: "Weil" }, { key: b, text: "Dass" }, { key: c, text: "Wenn" }]
        answer: c
        why: "Zeitpunkt → Wenn."
      - q: "Ich bin froh, ___ die neue Wohnung näher am Zentrum liegt."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage → dass."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Ein Telefonat mit der Oma (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Ich rufe meine Oma an, {1} ich sie vermisse. Sie freut sich immer,
      {2} ich anrufe. Sie erzählt mir, {3} es ihr gut geht. Ich sage
      ihr, {4} ich sie bald besuchen werde. {5} ich Zeit habe, fahre ich
      am Wochenende zu ihr. Sie fragt mich, {6} ich gesund esse. Ich
      antworte, {7} ich viel Gemüse esse. {8} sie das hört, ist sie
      zufrieden. Ich weiß, {9} sie sich Sorgen macht. Am Ende sage ich,
      {10} ich sie liebe.
    bank: [WEIL, WENN, DASS, DASS, WENN, OB, DASS, WENN, DASS, DASS, OBWOHL, DAMIT, ALS]
    answers:
      "1": WEIL
      "2": WENN
      "3": DASS
      "4": DASS
      "5": WENN
      "6": OB
      "7": DASS
      "8": WENN
      "9": DASS
      "10": DASS
    notes: "Satz 6: 'fragen, ob …' — ob leitet eine indirekte Ja/Nein-Frage ein und funktioniert wie weil/dass/wenn (Verb ans Ende)."

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: order
    title: "Zwei Sätze zu einem verbinden"
    instructions: "Verbinde die zwei Sätze mit dem passenden Konnektor. Bring die Wörter in die richtige Reihenfolge."
    items:
      - tiles: ["Ich bin müde,", "weil", "ich", "schlecht", "geschlafen habe."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich bin müde. Ich habe schlecht geschlafen. → Ich bin müde, weil ich schlecht geschlafen habe."
      - tiles: ["Ich weiß,", "dass", "er", "morgen", "kommt."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich weiß etwas. Er kommt morgen. → Ich weiß, dass er morgen kommt."
      - tiles: ["Wenn", "es", "regnet,", "bleibe", "ich", "zu Hause."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Es regnet. Ich bleibe zu Hause. → Wenn es regnet, bleibe ich zu Hause."
      - tiles: ["Ich bin froh,", "dass", "du", "da", "bist."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich bin froh. Du bist da. → Ich bin froh, dass du da bist."
      - tiles: ["Wenn", "ich", "Hunger habe,", "esse", "ich", "etwas."]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Ich habe Hunger. Ich esse etwas. → Wenn ich Hunger habe, esse ich etwas."

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct connector (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich lerne Deutsch, ___ ich nach Deutschland ziehen möchte."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: a
        why: "Grund → weil."
      - q: "Ich glaube, ___ es morgen regnet."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage → dass."
      - q: "___ ich Geld habe, kaufe ich mir ein neues Auto."
        options: [{ key: a, text: "Weil" }, { key: b, text: "Dass" }, { key: c, text: "Wenn" }]
        answer: c
        why: "Bedingung → Wenn."
      - q: "Ich bin traurig, ___ mein Freund wegzieht."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: a
        why: "Grund → weil."
      - q: "Er hat mir gesagt, ___ er verheiratet ist."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: b
        why: "Aussage → dass."
      - q: "Ich rufe dich an, ___ ich ankomme."
        options: [{ key: a, text: "weil" }, { key: b, text: "dass" }, { key: c, text: "wenn" }]
        answer: c
        why: "Zeitpunkt → wenn."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B1-Version (obwohl/trotzdem, deshalb/darum). Weniger als 5? Schau dir Block A noch einmal an."
