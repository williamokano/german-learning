lesson: "EX/12-modalverben-a1"
title: "Modalverben: Präsens und Bedeutung — A1"
topic: "Modalverben"
level: A1
intro: >
  Standalone drill set, not tied to any lesson. The six modal verbs —
  können, müssen, wollen, sollen, dürfen, möchten (from mögen) — are all
  irregular in the singular (ich/er-sie-es have no ending and often a
  different vowel: ich kann, not ich könne) and always push the main verb
  to the end as a bare infinitive: Ich kann gut schwimmen. This set
  drills the forms first, then the meaning differences: können = ability,
  müssen = necessity, dürfen = permission, wollen = desire, sollen =
  someone else's expectation, möchten = a polite want. Blocks:
  A Basistraining → B Vertiefung → C Sprachbausteine → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Präsens: können, müssen, wollen"
    instructions: "Ergänze die Tabelle."
    instructionsEn: "Complete the table."
    columns: ["", "können", "müssen", "wollen"]
    rows:
      - label: "ich"
        cells: [{ gap: 1, answer: "kann" }, { gap: 2, answer: "muss" }, { gap: 3, answer: "will" }]
      - label: "du"
        cells: [{ gap: 4, answer: "kannst" }, { gap: 5, answer: "musst" }, { gap: 6, answer: "willst" }]
      - label: "er/sie/es"
        cells: [{ gap: 7, answer: "kann" }, { gap: 8, answer: "muss" }, { gap: 9, answer: "will" }]
      - label: "wir"
        cells: [{ gap: 10, answer: "können" }, { gap: 11, answer: "müssen" }, { gap: 12, answer: "wollen" }]
      - label: "ihr"
        cells: [{ gap: 13, answer: "könnt" }, { gap: 14, answer: "müsst" }, { gap: 15, answer: "wollt" }]
      - label: "sie/Sie"
        cells: [{ gap: 16, answer: "können" }, { gap: 17, answer: "müssen" }, { gap: 18, answer: "wollen" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Welches Modalverb passt?"
    instructions: "Ergänze das passende Modalverb in der richtigen Form."
    instructionsEn: "Fill in the appropriate modal verb in the correct form."
    text: |
      1. Ich {1} sehr gut schwimmen.
      2. Wir {2} morgen früh aufstehen.
      3. {3} ich das Fenster öffnen?
      4. Er {4} unbedingt nach Berlin fahren.
      5. Der Arzt sagt, ich {5} mehr Wasser trinken.
      6. {6} du mir bitte helfen?
      7. Ich {7} gern einen Kaffee.
    answers:
      "1": kann
      "2": müssen
      "3": Darf
      "4": will
      "5": soll
      "6": Kannst
      "7": möchte

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein Tag im Büro"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Ich {1} jeden Morgen um sieben Uhr aufstehen. Im Büro {2} ich
      viele E-Mails schreiben. Mein Chef sagt, ich {3} pünktlich sein.
      In der Pause {4} ich Kaffee trinken. Ich {5} sehr gut mit Zahlen
      umgehen. Am liebsten {6} ich früher nach Hause gehen. Aber ich
      {7} noch die Präsentation fertig machen. Heute Abend {8} ich
      endlich ausruhen.
    bank: [muss, muss, soll, darf, kann, kann, möchte, muss, will, musst]
    answers:
      "1": muss
      "2": muss
      "3": soll
      "4": darf
      "5": kann
      "6": möchte
      "7": muss
      "8": kann

  - id: B2
    block: B
    type: single-choice
    title: "Welche Bedeutung passt?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Im Schwimmbad ___ man nicht rauchen."
        options: [{ key: a, text: "darf" }, { key: b, text: "muss" }, { key: c, text: "kann" }]
        answer: a
        why: "Verbot → nicht dürfen."
      - q: "Ich habe kein Auto, deshalb ___ ich mit dem Bus fahren."
        options: [{ key: a, text: "will" }, { key: b, text: "muss" }, { key: c, text: "darf" }]
        answer: b
        why: "Notwendigkeit → müssen."
      - q: "___ du mir bitte das Salz geben?"
        options: [{ key: a, text: "Sollst" }, { key: b, text: "Musst" }, { key: c, text: "Kannst" }]
        answer: c
        why: "Höfliche Bitte → können."
      - q: "Der Lehrer sagt, wir ___ die Hausaufgaben bis Montag machen."
        options: [{ key: a, text: "sollen" }, { key: b, text: "dürfen" }, { key: c, text: "können" }]
        answer: a
        why: "Erwartung einer anderen Person → sollen."
      - q: "Er ___ unbedingt Schauspieler werden, das ist sein großer Traum."
        options: [{ key: a, text: "muss" }, { key: b, text: "will" }, { key: c, text: "darf" }]
        answer: b
        why: "Starker Wunsch → wollen."
      - q: "___ ich reinkommen?"
        options: [{ key: a, text: "Muss" }, { key: b, text: "Will" }, { key: c, text: "Darf" }]
        answer: c
        why: "Erlaubnis erfragen → dürfen."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Regeln in der Schule"
    instructions: "Choose the correct modal verb for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "In der Schule ___ man pünktlich sein."
        options: [{ key: a, text: "muss" }, { key: b, text: "darf" }, { key: c, text: "will" }]
        answer: a
        why: "Regel → müssen."
      - q: "Die Schüler ___ während des Unterrichts nicht mit dem Handy spielen."
        options: [{ key: a, text: "müssen" }, { key: b, text: "dürfen" }, { key: c, text: "wollen" }]
        answer: b
        why: "Verbot → nicht dürfen."
      - q: "___ ich auf die Toilette gehen?"
        options: [{ key: a, text: "Muss" }, { key: b, text: "Will" }, { key: c, text: "Darf" }]
        answer: c
        why: "Erlaubnis erfragen → dürfen."
      - q: "Die Lehrerin sagt, wir ___ das Buch bis morgen lesen."
        options: [{ key: a, text: "sollen" }, { key: b, text: "dürfen" }, { key: c, text: "können" }]
        answer: a
        why: "Erwartung der Lehrerin → sollen."
      - q: "Ich ___ sehr gut Mathe, das ist mein Lieblingsfach."
        options: [{ key: a, text: "muss" }, { key: b, text: "kann" }, { key: c, text: "will" }]
        answer: b
        why: "Fähigkeit → können."
      - q: "Am Wochenende ___ wir nicht lernen, wir haben frei."
        options: [{ key: a, text: "dürfen" }, { key: b, text: "sollen" }, { key: c, text: "müssen" }]
        answer: c
        why: "müssen nicht = keine Notwendigkeit."
      - q: "Ich ___ unbedingt die Prüfung bestehen."
        options: [{ key: a, text: "darf" }, { key: b, text: "will" }, { key: c, text: "muss" }]
        answer: b
        why: "Starker Wunsch → wollen."
      - q: "___ du mir bei den Hausaufgaben helfen?"
        options: [{ key: a, text: "Kannst" }, { key: b, text: "Sollst" }, { key: c, text: "Darfst" }]
        answer: a
        why: "Bitte → können."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Regeln zu Hause (Wortbank)"
    instructions: "Fill the 10 gaps. Two words in the box are not needed."
    text: |
      In unserer Familie gibt es klare Regeln. Ich {1} jeden Tag mein
      Zimmer aufräumen. Meine Schwester {2} keine lauten Spiele nach
      22 Uhr spielen. Wir {3} alle beim Abendessen helfen. Meine
      Eltern sagen, ich {4} mehr Sport machen. Am Wochenende {5} ich
      länger schlafen. Mein Bruder {6} sein Handy erst nach den
      Hausaufgaben benutzen. Ich {7} sehr gut kochen, das macht mir
      Spaß. Wir {8} vor dem Essen keine Süßigkeiten essen. Wir {9}
      auch unsere Freunde einladen, wenn wir wollen. Heute {10} ich
      endlich fernsehen!
    bank: [muss, darf, darf, darf, müssen, soll, kann, kann, dürfen, dürfen, willst, sollt]
    answers:
      "1": muss
      "2": darf
      "3": müssen
      "4": soll
      "5": kann
      "6": darf
      "7": kann
      "8": dürfen
      "9": dürfen
      "10": darf

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das passende Modalverb."
    text: |
      1. Ich {1} nicht schwimmen, ich habe es nie gelernt.
      2. {2} ich hier parken?
      3. Wir {3} um acht Uhr im Büro sein.
      4. Er {4} Arzt werden, das ist sein Traum.
      5. Der Trainer sagt, wir {5} mehr trainieren.
      6. {6} du mir helfen, das Sofa zu tragen?
      7. Ich {7} gern ein Stück Kuchen.
    answers:
      "1": kann
      "2": Darf
      "3": müssen
      "4": will
      "5": sollen
      "6": Kannst
      "7": möchte

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich ___ nicht gut Englisch sprechen."
        options: [{ key: a, text: "kann" }, { key: b, text: "darf" }, { key: c, text: "will" }]
        answer: a
        why: "Fähigkeit (negiert) → können."
      - q: "___ wir hier fotografieren?"
        options: [{ key: a, text: "Müssen" }, { key: b, text: "Dürfen" }, { key: c, text: "Wollen" }]
        answer: b
        why: "Erlaubnis erfragen → dürfen."
      - q: "Die Ärztin sagt, ich ___ mehr schlafen."
        options: [{ key: a, text: "darf" }, { key: b, text: "kann" }, { key: c, text: "soll" }]
        answer: c
        why: "Erwartung/Rat der Ärztin → sollen."
      - q: "Er ___ unbedingt das Spiel gewinnen."
        options: [{ key: a, text: "will" }, { key: b, text: "muss" }, { key: c, text: "darf" }]
        answer: a
        why: "Starker Wunsch → wollen."
      - q: "Wir ___ jeden Tag Hausaufgaben machen."
        options: [{ key: a, text: "dürfen" }, { key: b, text: "müssen" }, { key: c, text: "können" }]
        answer: b
        why: "Notwendigkeit → müssen."
      - q: "___ du mir bitte das Buch geben?"
        options: [{ key: a, text: "Musst" }, { key: b, text: "Sollst" }, { key: c, text: "Kannst" }]
        answer: c
        why: "Höfliche Bitte → können."
    notes: "5–6 von 6 richtig? Die sechs Modalverben (können, müssen, wollen, sollen, dürfen, möchten) und ihre Bedeutungen sitzen sicher."
