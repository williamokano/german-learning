lesson: "EX/26-erst-schon-noch-b1"
title: "erst und schon — die feineren Bedeutungen — B1"
topic: "erst / schon / noch"
level: B1
intro: >
  Aufbauend auf dem A2-Set. erst wenn / erst als = nicht früher als
  (Erst als ich zu Hause war, merkte ich den Fehler.). gerade erst =
  vor ganz kurzer Zeit (Ich bin gerade erst angekommen.). erst mal =
  zunächst (Ich muss erst mal nachdenken.). erst recht = jetzt umso
  mehr (Wenn du das verbietest, mache ich es erst recht.). Bei schon:
  schon mal = irgendwann einmal (Warst du schon mal in Wien?), schon
  immer = seit jeher (Ich wollte schon immer …), immer noch = betont
  weiter andauernd. Und der Klassiker erst vs. nur: erst bei Zeit und
  Fortschritt (Es ist erst drei Uhr.), nur bei reiner Menge (Ich habe
  nur drei Euro.). Blocks: A Basistraining → B Vertiefung → C
  Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "erst wenn, erst als, gerade erst, erst mal, erst recht"
    instructions: "Ergänze die passende Wendung mit erst."
    instructionsEn: "Fill in the right expression with erst."
    text: |
      1. {1} ich aus dem Haus ging, fiel mir auf, dass ich den Herd
         angelassen hatte.
      2. Ruf mich nicht jede Stunde an. Ich melde mich, {2} ich das
         Ergebnis habe.
      3. — Kaffee? — Nein danke, ich habe {3} einen getrunken, vor fünf
         Minuten.
      4. Bevor wir über den Urlaub reden: Ich muss {4} diese E-Mail
         schreiben.
      5. Die anderen haben gelacht, aber das hat ihn {5} angespornt —
         jetzt will er es unbedingt schaffen.
    answers:
      "1": "Erst als"
      "2": "erst wenn"
      "3": "gerade erst"
      "4": "erst mal"
      "5": "erst recht"

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "erst oder nur?"
    instructions: "Ergänze erst (Zeit / Fortschritt) oder nur (reine Menge / Einschränkung)."
    instructionsEn: "Fill in erst (time / progress) or nur (pure quantity / restriction)."
    text: |
      1. Wir sind {1} bei Seite 40 von 300 — das dauert noch.
      2. Der Eintritt kostet {2} zwei Euro, das ist billig.
      3. Es ist {3} Mittwoch, das Wochenende ist weit weg.
      4. Im Kurs sind {4} sechs Leute, mehr haben sich nicht angemeldet.
      5. Ich bin {5} seit einem Jahr in Deutschland.
      6. Von zehn Aufgaben habe ich {6} drei geschafft.
    answers:
      "1": "erst"
      "2": "nur"
      "3": "erst"
      "4": "nur"
      "5": "erst"
      "6": "erst"

  - id: A3
    block: A
    type: order
    title: "erst wenn / erst als — Satzbau"
    instructions: "Bring die Kacheln in die richtige Reihenfolge. erst wenn / erst als leitet einen Nebensatz ein (Verb am Ende); danach steht im Hauptsatz das Verb auf Position 2."
    instructionsEn: "Put the tiles in order. erst wenn / erst als starts a subordinate clause (verb at end); the main clause then has the verb in position 2."
    items:
      - tiles: ["Erst als", "der Zug", "abfuhr,", "sah ich", "meinen Koffer auf dem Bahnsteig."]
        answer: [0, 1, 2, 3, 4]
        note: "Erst als der Zug abfuhr, sah ich meinen Koffer auf dem Bahnsteig."
      - tiles: ["Erst wenn", "die Kinder", "schlafen,", "habe ich", "Zeit für mich."]
        answer: [0, 1, 2, 3, 4]
        note: "Erst wenn die Kinder schlafen, habe ich Zeit für mich."
      - tiles: ["Ich unterschreibe", "den Vertrag", "erst,", "wenn", "mein Anwalt ihn gelesen hat."]
        answer: [0, 1, 2, 3, 4]
        note: "Ich unterschreibe den Vertrag erst, wenn mein Anwalt ihn gelesen hat."
      - tiles: ["Erst als", "ich", "die Rechnung", "sah,", "verstand ich den Fehler."]
        answer: [0, 1, 2, 3, 4]
        note: "Erst als ich die Rechnung sah, verstand ich den Fehler."

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein später Anfang"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter bleiben übrig."
    instructionsEn: "Fill the 8 gaps with the words from the box. Two words are left over."
    text: |
      Ich habe {1} immer Musik gemacht, aber Klavier lernen wollte ich
      lange nicht. {2} als ich vierzig wurde, habe ich mich angemeldet.
      Am Anfang übte ich {3} zehn Minuten am Tag, mehr ging nicht.
      Meine Lehrerin sagte, ich solle {4} die Grundlagen üben, alles
      andere komme später. {5} recht wollte ich weitermachen, als ein
      Freund meinte, dafür sei ich zu alt. Nach einem Jahr konnte ich
      {6} keine schweren Stücke, aber einfache Lieder schon. Jetzt spiele
      ich {7} seit zwei Jahren und übe fast täglich. Ich habe {8}
      gestern ein neues Stück angefangen — es lief überraschend gut.
    bank: ["schon", "Erst", "nur", "erst mal", "Erst", "noch", "schon", "erst", "immer", "gerade"]
    answers:
      "1": "schon"
      "2": "Erst"
      "3": "nur"
      "4": "erst mal"
      "5": "Erst"
      "6": "noch"
      "7": "schon"
      "8": "erst"

  - id: B2
    block: B
    type: single-choice
    title: "Bedeutung erkennen"
    instructions: "Wähle die richtige Lösung (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Ich bin ___ angekommen, gib mir fünf Minuten zum Ankommen."
        options: [{ key: a, text: "schon immer" }, { key: b, text: "gerade erst" }, { key: c, text: "erst recht" }]
        answer: b
        why: "vor ganz kurzer Zeit → gerade erst."
      - q: "— Warst du ___ in Griechenland? — Ja, zweimal."
        options: [{ key: a, text: "erst mal" }, { key: b, text: "noch mal" }, { key: c, text: "schon mal" }]
        answer: c
        why: "Frage nach einer Erfahrung irgendwann → schon mal."
      - q: "Ich wollte ___ Pilotin werden, seit ich ein Kind war."
        options: [{ key: a, text: "schon immer" }, { key: b, text: "erst recht" }, { key: c, text: "gerade erst" }]
        answer: a
        why: "seit jeher → schon immer."
      - q: "___ ich den Brief zu Ende gelesen hatte, verstand ich die Aufregung."
        options: [{ key: a, text: "Erst wenn" }, { key: b, text: "Schon als" }, { key: c, text: "Erst als" }]
        answer: c
        why: "einmaliges Ereignis in der Vergangenheit, nicht früher als → erst als."
      - q: "Sag es niemandem — sonst reden ___ alle darüber."
        options: [{ key: a, text: "erst recht" }, { key: b, text: "gerade erst" }, { key: c, text: "schon mal" }]
        answer: a
        why: "dann umso mehr → erst recht."
      - q: "Es ist ___ halb sechs, wir müssen uns nicht beeilen."
        options: [{ key: a, text: "nur" }, { key: b, text: "erst" }, { key: c, text: "schon" }]
        answer: b
        why: "Zeitpunkt, früher als gedacht → erst."
      - q: "Das Zimmer kostet ___ 30 Euro pro Nacht, ein guter Preis."
        options: [{ key: a, text: "nur" }, { key: b, text: "erst" }, { key: c, text: "noch" }]
        answer: a
        why: "reine Menge / Preis → nur."
      - q: "Nach zwei Stunden Arbeit bin ich ___ bei der Hälfte."
        options: [{ key: a, text: "nur" }, { key: b, text: "erst" }, { key: c, text: "schon nicht" }]
        answer: b
        why: "Fortschritt, weniger als erhofft → erst."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

