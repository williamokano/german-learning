    bank: ["gerade", "schon", "Erst", "erst", "erst", "noch", "erst", "schon", "noch nicht", "erst", "nur", "immer", "schon mal"]
    answers:
      "1": "gerade"
      "2": "schon"
      "3": "Erst"
      "4": "erst"
      "5": "erst"
      "6": "noch"
      "7": "erst"
      "8": "schon"
      "9": "noch nicht"
