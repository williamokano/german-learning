lesson: "EX/14-konjunktiv2-a2"
title: "Konjunktiv II: Höfliche Bitten und Wünsche — A2"
topic: "Konjunktiv II"
level: A2
intro: >
  Standalone drill set, not tied to any lesson. Konjunktiv II softens a
  request or expresses a wish instead of stating a plain fact: Kannst
  du helfen? (direct) sounds blunter than Könntest du helfen? (polite).
  Four forms cover almost everything at this level: würde + Infinitiv
  (the all-purpose polite form: Ich würde gern kommen), könnte (a
  polite ability/request: Könntest du...?), hätte (a polite want: Ich
  hätte gern einen Kaffee), and wäre (a wish/reaction: Das wäre schön!).
  Blocks: A Basistraining → B Vertiefung → C Sprachbausteine →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "würde, hätte, wäre"
    instructions: "Ergänze die Tabelle."
    instructionsEn: "Complete the table."
    columns: ["", "würde (machen)", "hätte", "wäre"]
    rows:
      - label: "ich"
        cells: [{ gap: 1, answer: "würde machen" }, { gap: 2, answer: "hätte" }, { gap: 3, answer: "wäre" }]
      - label: "du"
        cells: [{ gap: 4, answer: "würdest machen" }, { gap: 5, answer: "hättest" }, { gap: 6, answer: "wärst" }]
      - label: "er/sie/es"
        cells: [{ gap: 7, answer: "würde machen" }, { gap: 8, answer: "hätte" }, { gap: 9, answer: "wäre" }]
      - label: "wir"
        cells: [{ gap: 10, answer: "würden machen" }, { gap: 11, answer: "hätten" }, { gap: 12, answer: "wären" }]
      - label: "ihr"
        cells: [{ gap: 13, answer: "würdet machen" }, { gap: 14, answer: "hättet" }, { gap: 15, answer: "wärt" }]
      - label: "sie/Sie"
        cells: [{ gap: 16, answer: "würden machen" }, { gap: 17, answer: "hätten" }, { gap: 18, answer: "wären" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Höflich fragen und wünschen"
    instructions: "Ergänze die richtige Konjunktiv-II-Form."
    instructionsEn: "Fill in the correct Konjunktiv-II form."
    text: |
      1. {1} du mir bitte helfen?
      2. Ich {2} gern einen Kaffee.
      3. {3} du Zeit für mich?
      4. Wenn ich Zeit {4}, würde ich kommen.
      5. Ich {5} gern nach Deutschland reisen.
      6. Das {6} schön!
    answers:
      "1": Könntest
      "2": hätte
      "3": Hättest
      "4": hätte
      "5": würde
      "6": wäre

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Im Restaurant"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Guten Tag! {1} Sie uns bitte die Speisekarte bringen? Ich {2}
      gern das Schnitzel. Meine Frau {3} lieber den Salat nehmen. {4}
      Sie uns auch Wasser bringen? Wir {5} gern draußen sitzen. {6}
      das möglich? Ich {7} noch eine Frage. Das {8} sehr freundlich
      von Ihnen.
    bank: [Könnten, hätte, hätte, würde, Würden, würden, Wäre, wäre, könnten, hätten]
    answers:
      "1": Könnten
      "2": hätte
      "3": würde
      "4": Würden
      "5": würden
      "6": Wäre
      "7": hätte
      "8": wäre

  - id: B2
    block: B
    type: single-choice
    title: "Höfliche Bitte, Wunsch oder Irrealis?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "___ Sie mir bitte helfen?"
        options: [{ key: a, text: "Könnten" }, { key: b, text: "Waren" }, { key: c, text: "Sind" }]
        answer: a
        why: "Höfliche Bitte → könnte."
      - q: "Ich ___ gern mehr Zeit."
        options: [{ key: a, text: "bin" }, { key: b, text: "hätte" }, { key: c, text: "war" }]
        answer: b
        why: "Wunsch → hätte gern."
      - q: "Wenn ich reich ___, würde ich reisen."
        options: [{ key: a, text: "bin" }, { key: b, text: "hätte" }, { key: c, text: "wäre" }]
        answer: c
        why: "Irrealer Bedingungssatz → wäre."
      - q: "___ du mir bitte das Salz geben?"
        options: [{ key: a, text: "Würdest" }, { key: b, text: "Bist" }, { key: c, text: "Hast" }]
        answer: a
        why: "Höfliche Bitte → würde."
      - q: "Das ___ toll!"
        options: [{ key: a, text: "ist" }, { key: b, text: "wäre" }, { key: c, text: "war" }]
        answer: b
        why: "Wunsch/Reaktion → wäre."
      - q: "Wenn ich Zeit ___, käme ich mit."
        options: [{ key: a, text: "habe" }, { key: b, text: "bin" }, { key: c, text: "hätte" }]
        answer: c
        why: "Irrealer Bedingungssatz → hätte."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Im Hotel"
    instructions: "Choose the correct Konjunktiv-II form for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "___ Sie mir bitte ein Zimmer zeigen?"
        options: [{ key: a, text: "Könnten" }, { key: b, text: "Waren" }, { key: c, text: "Hatten" }]
        answer: a
        why: "Höfliche Bitte → könnte."
      - q: "Ich ___ gern ein Zimmer mit Meerblick."
        options: [{ key: a, text: "bin" }, { key: b, text: "hätte" }, { key: c, text: "war" }]
        answer: b
        why: "Wunsch → hätte gern."
      - q: "___ das möglich?"
        options: [{ key: a, text: "Ist" }, { key: b, text: "War" }, { key: c, text: "Wäre" }]
        answer: c
        why: "Höfliche Nachfrage → wäre."
      - q: "___ Sie uns bitte das Frühstück bringen?"
        options: [{ key: a, text: "Würden" }, { key: b, text: "Sind" }, { key: c, text: "Waren" }]
        answer: a
        why: "Höfliche Bitte → würde."
      - q: "Wir ___ auch gern einen späten Check-out."
        options: [{ key: a, text: "sind" }, { key: b, text: "hätten" }, { key: c, text: "waren" }]
        answer: b
        why: "Wunsch → hätte gern."
      - q: "Das ___ sehr freundlich."
        options: [{ key: a, text: "ist" }, { key: b, text: "war" }, { key: c, text: "wäre" }]
        answer: c
        why: "Höfliche Reaktion → wäre."
      - q: "___ Sie noch einen Moment Zeit?"
        options: [{ key: a, text: "Sind" }, { key: b, text: "Hätten" }, { key: c, text: "Waren" }]
        answer: b
        why: "Höfliche Bitte → hätte."
      - q: "Ich ___ gern noch eine Frage."
        options: [{ key: a, text: "hätte" }, { key: b, text: "bin" }, { key: c, text: "war" }]
        answer: a
        why: "Wunsch → hätte gern."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Beim Friseur (Wortbank)"
    instructions: "Fill the 10 gaps. Two words in the box are not needed."
    text: |
      {1} Sie mir bitte die Haare schneiden? Ich {2} sie gern nicht zu
      kurz. {3} das möglich? Ich {4} auch gern eine neue Farbe. {5}
      Sie mir einen Vorschlag machen? Das {6} interessant. Ich {7}
      gern einen Termin nächste Woche. {8} das für Sie in Ordnung?
      Wir {9} auch gern einen Kaffee, wenn möglich. Das {10} sehr nett
      von Ihnen.
    bank: [Könnten, hätte, hätte, hätte, Wäre, Wäre, Würden, wäre, wäre, hätten, könnten, wären]
    answers:
      "1": Könnten
      "2": hätte
      "3": Wäre
      "4": hätte
      "5": Würden
      "6": wäre
      "7": hätte
      "8": Wäre
      "9": hätten
      "10": wäre

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze die richtige Konjunktiv-II-Form."
    text: |
      1. {1} Sie mir bitte helfen?
      2. Ich {2} gern ein Glas Wasser.
      3. Wenn ich Zeit {3}, würde ich kommen.
      4. Das {4} schön!
      5. {5} du mir das Buch geben?
      6. Wir {6} gern draußen sitzen.
    answers:
      "1": Könnten
      "2": hätte
      "3": hätte
      "4": wäre
      "5": Würdest
      "6": würden

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "___ Sie mir bitte die Uhrzeit sagen?"
        options: [{ key: a, text: "Könnten" }, { key: b, text: "Waren" }, { key: c, text: "Sind" }]
        answer: a
