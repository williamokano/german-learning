      - q: "Ich ___ gern mehr Urlaub."
        options: [{ key: a, text: "bin" }, { key: b, text: "hätte" }, { key: c, text: "war" }]
        answer: b
        why: "Wunsch → hätte gern."
      - q: "Wenn ich mehr Geld ___, würde ich reisen."
        options: [{ key: a, text: "bin" }, { key: b, text: "habe" }, { key: c, text: "hätte" }]
        answer: c
        why: "Irrealer Bedingungssatz → hätte."
      - q: "___ du mir bitte helfen?"
        options: [{ key: a, text: "Würdest" }, { key: b, text: "Bist" }, { key: c, text: "Hast" }]
