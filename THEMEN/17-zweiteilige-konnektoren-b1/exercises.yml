lesson: "EX/17-zweiteilige-konnektoren-b1"
title: "Zweiteilige Konnektoren — B1"
topic: "Zweiteilige Konnektoren"
level: B1
intro: >
  Standalone drill set, not tied to any lesson. Five connectors always
  come in two parts, one before each item being linked: sowohl … als
  auch (both … and), nicht nur … sondern auch (not only … but also),
  entweder … oder (either … or), weder … noch (neither … nor), zwar …
  aber (indeed/it's true … but). Most behave like normal coordinating
  conjunctions — no change to word order. weder … noch is the
  exception: when it links two full clauses, the clause after noch
  gets Verb-Subjekt-Inversion (Er hat weder Zeit, noch hat er Lust),
  unlike aber/oder/sondern in the same position. Blocks: A Basistraining
  → B Vertiefung → C Sprachbausteine → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Die fünf Konnektorenpaare"
    instructions: "Ergänze den vollständigen Beispielsatz."
    instructionsEn: "Fill in the whole example sentence."
    columns: ["Konnektor", "Beispielsatz"]
    rows:
      - label: "nicht nur … sondern auch"
        cells: [{ gap: 1, answer: "Er ist nicht nur klug, sondern auch fleißig." }]
      - label: "sowohl … als auch"
        cells: [{ gap: 2, answer: "Sie spricht sowohl Deutsch als auch Englisch." }]
      - label: "entweder … oder"
        cells: [{ gap: 3, answer: "Wir fahren entweder mit dem Auto oder mit dem Zug." }]
      - label: "weder … noch"
        cells: [{ gap: 4, answer: "Er hat weder Zeit noch Lust." }]
      - label: "zwar … aber"
        cells: [{ gap: 5, answer: "Das Wetter ist zwar kalt, aber sonnig." }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Der zweite Teil des Konnektors"
    instructions: "Ergänze den zweiten Teil des Konnektors."
    instructionsEn: "Fill in the second half of the connector."
    text: |
      1. Sie ist nicht nur intelligent, {1} auch sehr freundlich.
      2. Wir gehen sowohl ins Kino {2} auch ins Museum.
      3. Du kannst entweder Tee {3} Kaffee bestellen.
      4. Er hat weder Geld {4} Zeit.
      5. Das Essen ist zwar teuer, {5} sehr lecker.
      6. Sowohl meine Mutter {6} auch mein Vater kommen zur Feier.
    answers:
      "1": sondern
      "2": als
      "3": oder
      "4": noch
      "5": aber
      "6": als

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Meine Traumreise"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Ich möchte sowohl Berge {1} auch das Meer sehen. Ich habe
      entweder Zeit im Sommer {2} im Winter. Weder das Wetter {3} das
      Budget spielen eine große Rolle. Zwar ist die Reise teuer, {4}
      sie lohnt sich. Ich möchte nicht nur reisen, {5} auch neue
      Menschen kennenlernen. Sowohl meine Freunde {6} auch meine
      Familie unterstützen mich. Entweder buche ich einen Flug {7}
      eine Zugfahrkarte. Weder Regen {8} Kälte können mich aufhalten.
    bank: [als, als, oder, oder, noch, noch, aber, sondern, und, dann]
    answers:
      "1": als
      "2": oder
      "3": noch
      "4": aber
      "5": sondern
      "6": als
      "7": oder
      "8": noch

  - id: B2
    block: B
    type: single-choice
    title: "Inversion nach weder…noch"
    instructions: "Wähle die richtige Fortsetzung (a, b oder c)."
    instructionsEn: "Choose the correct continuation (a, b, or c)."
    items:
      - q: "Er hat weder Zeit,"
        options: [{ key: a, text: "noch hat er Lust." }, { key: b, text: "noch er hat Lust." }, { key: c, text: "noch Lust hat er." }]
        answer: a
        why: "Nach 'noch' (zwei Sätze verbunden): Inversion, Verb vor Subjekt."
      - q: "Sie kommt zwar später,"
        options: [{ key: a, text: "aber bleibt sie lange." }, { key: b, text: "aber sie bleibt lange." }, { key: c, text: "aber lange sie bleibt." }]
        answer: b
        why: "Nach 'aber' keine Inversion, normale Satzstellung."
      - q: "Wir gehen nicht ins Kino,"
        options: [{ key: a, text: "sondern bleiben wir zu Hause." }, { key: b, text: "sondern zu Hause wir bleiben." }, { key: c, text: "sondern wir bleiben zu Hause." }]
        answer: c
        why: "Nach 'sondern' keine Inversion."
      - q: "Du kannst kommen,"
        options: [{ key: a, text: "oder du bleibst zu Hause." }, { key: b, text: "oder bleibst du zu Hause." }, { key: c, text: "oder zu Hause bleibst du." }]
        answer: a
        why: "Nach 'oder' keine Inversion."
      - q: "Er spielt weder Fußball,"
        options: [{ key: a, text: "noch er spielt Tennis." }, { key: b, text: "noch spielt er Tennis." }, { key: c, text: "noch Tennis er spielt." }]
        answer: b
        why: "Nach 'noch' (zwei Sätze verbunden): Inversion, Verb vor Subjekt."
      - q: "Sie ist nicht nur klug,"
        options: [{ key: a, text: "sondern ist sie auch fleißig." }, { key: b, text: "sondern auch fleißig sie ist." }, { key: c, text: "sondern sie ist auch fleißig." }]
        answer: c
        why: "Nach 'sondern' keine Inversion."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Die Wohnungssuche"
    instructions: "Choose the correct second half of the connector (a, b, or c). The sentences form one short story."
    items:
      - q: "Die Wohnung ist sowohl günstig, ___ zentral gelegen."
        options: [{ key: a, text: "als auch" }, { key: b, text: "sondern auch" }, { key: c, text: "oder" }]
        answer: a
        why: "sowohl … als auch."
      - q: "Sie ist nicht nur groß, ___ auch hell."
        options: [{ key: a, text: "oder" }, { key: b, text: "sondern" }, { key: c, text: "als auch" }]
        answer: b
        why: "nicht nur … sondern auch."
      - q: "Wir können entweder heute besichtigen ___ morgen."
        options: [{ key: a, text: "noch" }, { key: b, text: "aber" }, { key: c, text: "oder" }]
        answer: c
        why: "entweder … oder."
      - q: "Der Vermieter hat weder geantwortet, ___ zurückgerufen."
        options: [{ key: a, text: "noch" }, { key: b, text: "oder" }, { key: c, text: "aber" }]
        answer: a
        why: "weder … noch."
      - q: "Die Miete ist zwar hoch, ___ die Lage ist perfekt."
        options: [{ key: a, text: "sondern" }, { key: b, text: "aber" }, { key: c, text: "noch" }]
        answer: b
        why: "zwar … aber."
      - q: "Wir haben sowohl das Bad ___ auch die Küche besichtigt."
        options: [{ key: a, text: "oder" }, { key: b, text: "noch" }, { key: c, text: "als" }]
        answer: c
        why: "sowohl … als auch."
      - q: "Der Vertrag ist weder unterschrieben, ___ bestätigt."
        options: [{ key: a, text: "noch" }, { key: b, text: "aber" }, { key: c, text: "sondern" }]
        answer: a
        why: "weder … noch."
      - q: "Am Ende war die Wohnung nicht nur schön, ___ auch bezahlbar."
        options: [{ key: a, text: "oder" }, { key: b, text: "sondern" }, { key: c, text: "als auch" }]
        answer: b
        why: "nicht nur … sondern auch."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Meine Traumreise, Teil 2 (Wortbank)"
    instructions: "Fill the 10 gaps. Two words in the box are not needed."
    text: |
      Ich möchte sowohl Berge {1} auch das Meer sehen. Ich habe
      entweder Zeit im Sommer {2} im Winter. Weder das Wetter {3} das
      Budget spielen eine große Rolle. Zwar ist die Reise teuer, {4}
      sie lohnt sich. Ich möchte nicht nur reisen, {5} auch neue
      Menschen kennenlernen. Sowohl meine Freunde {6} auch meine
      Familie unterstützen mich. Entweder buche ich einen Flug {7}
      eine Zugfahrkarte. Weder Regen {8} Kälte können mich aufhalten.
      Zwar bin ich aufgeregt, {9} auch ein bisschen nervös. Nicht nur
      die Reise selbst, {10} auch die Vorbereitung macht Spaß.
    bank: [als, als, oder, oder, noch, noch, aber, aber, sondern, sondern, und, dann]
    answers:
      "1": als
      "2": oder
      "3": noch
      "4": aber
      "5": sondern
      "6": als
      "7": oder
      "8": noch
      "9": aber
      "10": sondern

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze den zweiten Teil des Konnektors."
    text: |
      1. Sie spricht sowohl Deutsch {1} auch Französisch.
      2. Wir haben weder Zeit {2} Geld.
      3. Er ist zwar müde, {3} zufrieden.
      4. Ich nehme entweder den Bus {4} das Fahrrad.
      5. Das Buch ist nicht nur spannend, {5} auch lehrreich.
      6. Sowohl der Chef {6} auch die Kollegen loben die Arbeit.
    answers:
      "1": als
      "2": noch
      "3": aber
      "4": oder
      "5": sondern
      "6": als

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct second half (a, b, or c). This is your final check for this set."
    items:
      - q: "Sie ist sowohl freundlich, ___ hilfsbereit."
        options: [{ key: a, text: "als auch" }, { key: b, text: "sondern auch" }, { key: c, text: "oder" }]
        answer: a
        why: "sowohl … als auch."
      - q: "Er ist nicht nur nett, ___ auch lustig."
        options: [{ key: a, text: "oder" }, { key: b, text: "sondern" }, { key: c, text: "als auch" }]
        answer: b
        why: "nicht nur … sondern auch."
      - q: "Wir fahren entweder mit dem Zug ___ mit dem Auto."
        options: [{ key: a, text: "noch" }, { key: b, text: "aber" }, { key: c, text: "oder" }]
        answer: c
        why: "entweder … oder."
      - q: "Sie hat weder angerufen, ___ geschrieben."
        options: [{ key: a, text: "noch" }, { key: b, text: "oder" }, { key: c, text: "aber" }]
        answer: a
        why: "weder … noch."
      - q: "Das Essen ist zwar einfach, ___ lecker."
        options: [{ key: a, text: "sondern" }, { key: b, text: "aber" }, { key: c, text: "noch" }]
        answer: b
        why: "zwar … aber."
      - q: "Wir besuchen sowohl das Museum ___ auch den Park."
        options: [{ key: a, text: "oder" }, { key: b, text: "noch" }, { key: c, text: "als" }]
        answer: c
        why: "sowohl … als auch."
    notes: "5–6 von 6 richtig? Die fünf zweiteiligen Konnektoren (sowohl…als auch, nicht nur…sondern auch, entweder…oder, weder…noch, zwar…aber) sitzen jetzt sicher."
