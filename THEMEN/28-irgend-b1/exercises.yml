lesson: "EX/28-irgend-b1"
title: "irgendwelche, irgendwoher, nicht irgendein — B1"
topic: "irgend-"
level: B1
intro: >
  Aufbauend auf dem A2-Set. irgendwelche ist der Plural (und die Form
  für nicht zählbare Nomen) von irgendein-: Hast du irgendwelche
  Fragen? Gibt es irgendwelche Probleme? Die wo-Reihe: irgendwo (Ort),
  irgendwohin (Ziel, Bewegung), irgendwoher (Herkunft). nicht irgendein
  betont, dass etwas Besonderes gemeint ist: Das ist nicht irgendein
  Wein — das ist ein Barolo. Und irgendein- statt ein- betont, dass es
  egal ist welches: Gib mir irgendein Buch. Blocks: A Basistraining → B
  Vertiefung → C Sprachbausteine → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

