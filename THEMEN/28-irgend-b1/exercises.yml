      2. Gibt es {2} Grund, warum das nicht geht?
      3. Falls {3} Probleme auftreten, ruf mich sofort an.
      4. Ich brauche {4} Stift, meiner schreibt nicht mehr.
      5. Hat der Arzt {5} Bedenken geäußert?
      6. Nimm {6} freien Platz, sie sind alle gleich gut.
