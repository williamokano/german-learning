    block: A
    type: gap-text
    listLayout: true
    title: "irgendwo, irgendwohin oder irgendwoher?"
    instructions: "Ergänze irgendwo (Ort: wo?), irgendwohin (Ziel: wohin?) oder irgendwoher (Herkunft: woher?)."
    instructionsEn: "Fill in irgendwo (place: where?), irgendwohin (goal: where to?), or irgendwoher (origin: where from?)."
    text: |
      1. Der Zug ist voll — lass uns {1} anders einen Sitzplatz suchen.
      2. Ich kenne dieses Lied {2}, ich komme nur nicht drauf.
      3. Am Sonntag will ich {3} raus, egal wohin, Hauptsache weg.
      4. Deine Schlüssel liegen bestimmt {4} in der Wohnung.
      5. Es zieht — der kalte Luftzug kommt {5}.
      6. Nach der Arbeit fahren wir noch {6}, vielleicht an den See.
    answers:
      "1": "irgendwo"
      "2": "irgendwoher"
      "3": "irgendwohin"
      "4": "irgendwo"
      "5": "irgendwoher"
      "6": "irgendwohin"

