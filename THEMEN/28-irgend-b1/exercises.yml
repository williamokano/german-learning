      - q: "Gib mir bitte irgendein Blatt Papier. — Gemeint ist:"
        options: [{ key: a, text: "Ich brauche ein ganz bestimmtes Blatt." }, { key: b, text: "Ich brauche kein Blatt." }, { key: c, text: "Es ist egal, welches Blatt." }]
        answer: c
        why: "irgendein betont: die Auswahl ist egal."
      - q: "Sie sucht nicht irgendeine Wohnung, sie will genau diese. — Das heißt:"
        options: [{ key: a, text: "Sie hat eine ganz bestimmte Wohnung im Sinn." }, { key: b, text: "Ihr ist jede Wohnung recht." }, { key: c, text: "Sie sucht keine Wohnung." }]
        answer: a
        why: "nicht irgendeine = nicht eine beliebige, sondern eine spezielle."
      - q: "Ruf einfach irgendwann an. — Das heißt:"
        options: [{ key: a, text: "Ruf zu einer festen Uhrzeit an." }, { key: b, text: "Ruf besser nicht an." }, { key: c, text: "Der Zeitpunkt ist mir egal." }]
        answer: c
        why: "irgendwann = zu einem beliebigen Zeitpunkt."
      - q: "Das war nicht irgendein Spiel, es ging um den Titel. — Gemeint ist:"
        options: [{ key: a, text: "Das Spiel war besonders wichtig." }, { key: b, text: "Das Spiel war unwichtig." }, { key: c, text: "Es gab kein Spiel." }]
        answer: a
        why: "nicht irgendein = ein besonderes, bedeutsames."
      - q: "Nimm irgendwelche Schuhe, wir gehen nur kurz raus. — Das heißt:"
        options: [{ key: a, text: "Nimm die guten Schuhe." }, { key: b, text: "Welche Schuhe ist egal." }, { key: c, text: "Zieh keine Schuhe an." }]
        answer: b
        why: "irgendwelche (Plural) = beliebige."

