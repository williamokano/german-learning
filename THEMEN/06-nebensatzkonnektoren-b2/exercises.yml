      lernt daraus. Je öfter man übt, {7} leichter wird es. Man kann
      auch Filme schauen, {8} man neue Wörter lernt. Am Ende hast du
      Erfolg, {9} du konsequent dranbleibst. Ich werde weitermachen,
      {10} ich krank werde.
    bank: [DESTO, INDEM, SODASS, FALLS, "ES SEI DENN", FALLS, DESTO, INDEM, SOFERN, "ES SEI DENN", OBWOHL, DAMIT, WEIL]
    answers:
      "1": DESTO
      "2": INDEM
      "3": SODASS
      "4": FALLS
      "5": "ES SEI DENN"
      "6": FALLS
      "7": DESTO
      "8": INDEM
      "9": SOFERN
      "10": "ES SEI DENN"

