lesson: "EX/21-infinitivgruppen-b1"
title: "Infinitivgruppen mit Komma — B1"
topic: "Infinitivgruppen mit Komma"
level: B1
intro: >
  Neben um…zu und ohne…zu kommt (an)statt…zu dazu: eine Alternative zu
  etwas anderem — Statt Auto zu fahren, nehme ich das Fahrrad.
  Wichtig auf diesem Niveau: Eine Infinitivgruppe ist nur möglich,
  wenn Haupt- und Nebensatz dasselbe Subjekt haben (Er hofft, die
  Prüfung zu bestehen.) — bei unterschiedlichem Subjekt bleibt der
  dass-Satz nötig (Er hofft, dass seine Tochter die Prüfung
  besteht.). Auch bei reflexiven und trennbaren Verben steht zu
  weiterhin zwischen Vorsilbe und Verbstamm bzw. direkt vor dem
  Infinitiv: sich zu entscheiden, vorzubereiten. Blocks: A
  Basistraining → B Vertiefung → C Sprachbausteine → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Verb → zu-Infinitiv (reflexiv und trennbar)"
    instructions: "Ergänze den zu-Infinitiv."
    instructionsEn: "Fill in the zu-infinitive."
    columns: ["Verb", "zu-Infinitiv"]
    rows:
      - label: "sich entscheiden"
        cells: [{ gap: 1, answer: "sich zu entscheiden" }]
      - label: "aufhören"
        cells: [{ gap: 2, answer: "aufzuhören" }]
      - label: "vorbereiten"
        cells: [{ gap: 3, answer: "vorzubereiten" }]
      - label: "teilnehmen"
        cells: [{ gap: 4, answer: "teilzunehmen" }]
      - label: "zurückrufen"
        cells: [{ gap: 5, answer: "zurückzurufen" }]
      - label: "sich verabschieden"
        cells: [{ gap: 6, answer: "sich zu verabschieden" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "um, ohne oder statt?"
    instructions: "Ergänze um, ohne oder Statt/Anstatt."
    instructionsEn: "Fill in um, ohne, or Statt/Anstatt."
    text: |
      1. {1} Auto zu fahren, nehme ich lieber das Fahrrad.
      2. Ich gehe joggen, {2} fit zu bleiben.
      3. Er kaufte das Handy, {3} die Bewertungen zu lesen.
      4. {4} zu Hause zu bleiben, gehen wir spazieren.
      5. Sie lernt jeden Abend, {5} die Prüfung zu bestehen.
      6. Er verließ das Meeting, {6} sich zu entschuldigen.
    answers:
      "1": Statt
      "2": um
      "3": ohne
      "4": Statt
      "5": um
      "6": ohne

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Die Bewerbung"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Ich habe mich entschieden, die Stelle zu wechseln, {1} mehr
      Verantwortung zu übernehmen. {2} weiter im alten Job zu
      bleiben, bewerbe ich mich woanders. Ich bereite mich gut vor,
      {3} im Gespräch zu überzeugen. Ich rufe den Personaler zurück,
      {4} einen Termin zu vereinbaren. Ich nehme mir Zeit, {5} alle
      Fragen zu beantworten, {6} nervös zu wirken. Am Ende entscheide
      ich mich, das Angebot anzunehmen, {7} lange zu zögern. Ich
      bleibe optimistisch, {8} aufzugeben.
    bank: [um, um, um, um, Statt, ohne, ohne, ohne, wegen, obwohl]
    answers:
      "1": um
      "2": Statt
      "3": um
      "4": um
      "5": um
      "6": ohne
      "7": ohne
      "8": ohne

  - id: B2
    block: B
    type: single-choice
    title: "Welcher Satz ist richtig?"
    instructions: "Wähle die richtige Kombination (a, b oder c)."
    instructionsEn: "Choose the correct combination (a, b, or c)."
    items:
      - q: "Ich bleibe zu Hause. Ich gehe nicht ins Kino."
        options:
          - { key: a, text: "Ich bleibe zu Hause statt ins Kino zu gehen." }
          - { key: b, text: "Ich bleibe zu Hause, statt ins Kino zu gehen." }
          - { key: c, text: "Ich bleibe zu Hause, statt ins Kino gehen zu." }
        answer: b
        why: "Komma vor statt, zu direkt vor dem Infinitiv gehen."
      - q: "Er nahm die Abkürzung. Er fragte nicht nach dem Weg."
        options:
          - { key: a, text: "Er nahm die Abkürzung, ohne nach dem Weg fragen zu." }
          - { key: b, text: "Er nahm die Abkürzung ohne nach dem Weg zu fragen." }
          - { key: c, text: "Er nahm die Abkürzung, ohne nach dem Weg zu fragen." }
        answer: c
        why: "Komma vor ohne, zu direkt vor dem Infinitiv fragen."
      - q: "Sie meldete sich früh an. Sie wollte einen Platz sichern."
        options:
          - { key: a, text: "Sie meldete sich früh an, um einen Platz zu sichern." }
          - { key: b, text: "Sie meldete sich früh an, um einen Platz sichern zu." }
          - { key: c, text: "Sie meldete sich früh an um einen Platz zu sichern." }
        answer: a
        why: "Komma vor um, zu direkt vor dem Infinitiv sichern."
      - q: "Er kündigte den Vertrag. Er informierte den Anbieter nicht."
        options:
          - { key: a, text: "Er kündigte den Vertrag ohne den Anbieter zu informieren." }
          - { key: b, text: "Er kündigte den Vertrag, ohne den Anbieter zu informieren." }
          - { key: c, text: "Er kündigte den Vertrag, ohne den Anbieter informieren zu." }
        answer: b
        why: "Komma vor ohne, zu direkt vor dem Infinitiv informieren."
      - q: "Wir nehmen den Zug. Wir nehmen nicht das Flugzeug."
        options:
          - { key: a, text: "Wir nehmen den Zug, statt das Flugzeug nehmen zu." }
          - { key: b, text: "Wir nehmen den Zug statt das Flugzeug zu nehmen." }
          - { key: c, text: "Wir nehmen den Zug, statt das Flugzeug zu nehmen." }
        answer: c
        why: "Komma vor statt, zu direkt vor dem Infinitiv nehmen."
      - q: "Ich lese den Vertrag genau. Ich möchte alle Details verstehen."
        options:
          - { key: a, text: "Ich lese den Vertrag genau, um alle Details zu verstehen." }
          - { key: b, text: "Ich lese den Vertrag genau, um alle Details verstehen zu." }
          - { key: c, text: "Ich lese den Vertrag genau um alle Details zu verstehen." }
        answer: a
        why: "Komma vor um, zu direkt vor dem Infinitiv verstehen."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Infinitivgruppe oder dass-Satz?"
    instructions: "Wähle die richtige Umformung (a, b oder c) — achte auf das Subjekt in Haupt- und Nebensatz."
    items:
      - q: "Original: Er hofft, dass er die Prüfung besteht."
        options:
          - { key: a, text: "Er hofft, dass sie die Prüfung besteht." }
          - { key: b, text: "Er hofft, die Prüfung zu bestehen." }
          - { key: c, text: "Er hofft, dass er zu bestehen." }
        answer: b
        why: "Gleiches Subjekt (er/er) → Infinitivgruppe möglich."
      - q: "Original: Sie möchte, dass ihr Sohn die Prüfung besteht."
        options:
          - { key: a, text: "Sie möchte, ihren Sohn die Prüfung zu bestehen." }
          - { key: b, text: "Sie möchte, die Prüfung zu bestehen." }
          - { key: c, text: "Sie möchte, dass ihr Sohn die Prüfung besteht." }
        answer: c
        why: "Unterschiedliches Subjekt (sie / ihr Sohn) → keine Infinitivgruppe möglich, der dass-Satz bleibt nötig."
      - q: "Original: Ich verspreche, dass ich pünktlich komme."
        options:
          - { key: a, text: "Ich verspreche, pünktlich zu kommen." }
          - { key: b, text: "Ich verspreche, dass du pünktlich kommst." }
          - { key: c, text: "Ich verspreche, pünktlich kommen zu." }
        answer: a
        why: "Gleiches Subjekt (ich/ich) → Infinitivgruppe möglich, zu direkt vor dem Infinitiv kommen."
      - q: "Original: Die Eltern hoffen, dass ihre Tochter das Studium schafft."
        options:
          - { key: a, text: "Die Eltern hoffen, das Studium zu schaffen." }
          - { key: b, text: "Die Eltern hoffen, dass ihre Tochter das Studium schafft." }
          - { key: c, text: "Die Eltern hoffen, ihre Tochter das Studium zu schaffen." }
        answer: b
        why: "Unterschiedliches Subjekt (Eltern / Tochter) → der dass-Satz bleibt nötig."
      - q: "Original: Er plant, dass er nächstes Jahr umzieht."
        options:
          - { key: a, text: "Er plant, dass wir nächstes Jahr umziehen." }
          - { key: b, text: "Er plant, nächstes Jahr umziehen zu." }
          - { key: c, text: "Er plant, nächstes Jahr umzuziehen." }
        answer: c
        why: "Gleiches Subjekt (er/er) → Infinitivgruppe möglich; umzuziehen mit zu zwischen Vorsilbe und Verbstamm."
      - q: "Original: Wir freuen uns, dass unsere Freunde uns besuchen."
        options:
          - { key: a, text: "Wir freuen uns, dass unsere Freunde uns besuchen." }
          - { key: b, text: "Wir freuen uns, uns zu besuchen." }
          - { key: c, text: "Wir freuen uns, unsere Freunde zu besuchen." }
        answer: a
        why: "Unterschiedliches Subjekt (wir / unsere Freunde) → der dass-Satz bleibt nötig, sonst ändert sich die Bedeutung."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine — Die Wohnungssuche (Wortbank)"
    instructions: "Fill the 8 gaps. Two words in the box are not needed."
    text: |
      Ich suche schon lange eine neue Wohnung, {1} näher am
      Stadtzentrum zu wohnen. {2} weiter zu warten, rufe ich sofort
      bei jeder Anzeige an. Ich bereite alle Unterlagen vor, {3} bei
      der Besichtigung zu überzeugen. Ich schaue mir die Wohnung
      genau an, {4} etwas zu übersehen. Ich entscheide mich schnell,
      {5} lange zu zögern. Ich unterschreibe den Vertrag, {6} ihn
      vorher genau durchzulesen — das war ein Fehler. Ich hätte ihn
      besser durchlesen sollen, {7} später Probleme zu vermeiden.
      Beim nächsten Mal werde ich mir mehr Zeit nehmen, {8} keinen
      Fehler mehr zu machen.
    bank: [um, um, um, um, Statt, ohne, ohne, ohne, wegen, trotz]
    answers:
      "1": um
      "2": Statt
      "3": um
      "4": ohne
      "5": ohne
      "6": ohne
      "7": um
      "8": um

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze um, ohne, statt oder den zu-Infinitiv."
    text: |
      1. Ich melde mich für den Kurs an, {1} mein Deutsch zu verbessern.
      2. {2} zu Hause zu bleiben, gehe ich lieber spazieren.
      3. Er verließ die Besprechung, {3} sich zu verabschieden.
      4. Ich habe beschlossen, den Job {4}.
      5. Wir bereiten uns gut vor, {5} bei der Prüfung zu überzeugen.
      6. Er kündigte, {6} eine neue Stelle zu haben.
    answers:
      "1": um
      "2": Statt
      "3": ohne
      "4": "zu wechseln"
      "5": um
      "6": ohne

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Kombination (a, b oder c). Das ist dein letzter Check für dieses Set."
    items:
      - q: "Sie fährt mit dem Rad zur Arbeit. Sie fährt nicht mit dem Auto."
        options:
          - { key: a, text: "Sie fährt mit dem Rad zur Arbeit statt mit dem Auto zu fahren." }
          - { key: b, text: "Sie fährt mit dem Rad zur Arbeit, statt mit dem Auto zu fahren." }
          - { key: c, text: "Sie fährt mit dem Rad zur Arbeit, statt mit dem Auto fahren zu." }
        answer: b
        why: "Komma vor statt, zu direkt vor dem Infinitiv fahren."
      - q: "Er verließ den Raum. Er schaltete das Licht nicht aus."
        options:
          - { key: a, text: "Er verließ den Raum, ohne das Licht ausschalten zu." }
          - { key: b, text: "Er verließ den Raum ohne das Licht auszuschalten." }
          - { key: c, text: "Er verließ den Raum, ohne das Licht auszuschalten." }
        answer: c
        why: "Komma vor ohne, und bei trennbaren Verben steht zu zwischen Vorsilbe und Verbstamm: auszuschalten."
      - q: "Ich rufe beim Kundenservice an. Ich möchte eine Frage klären."
        options:
          - { key: a, text: "Ich rufe beim Kundenservice an, um eine Frage zu klären." }
          - { key: b, text: "Ich rufe beim Kundenservice an, um eine Frage klären zu." }
          - { key: c, text: "Ich rufe beim Kundenservice an um eine Frage zu klären." }
        answer: a
        why: "Komma vor um, zu direkt vor dem Infinitiv klären."
      - q: "Original: Er hofft, dass er die Stelle bekommt."
        options:
          - { key: a, text: "Er hofft, dass sie die Stelle bekommt." }
          - { key: b, text: "Er hofft, die Stelle zu bekommen." }
          - { key: c, text: "Er hofft, die Stelle bekommen zu." }
        answer: b
        why: "Gleiches Subjekt (er/er) → Infinitivgruppe möglich."
      - q: "Original: Die Firma hofft, dass die neuen Kollegen sich gut einleben."
        options:
          - { key: a, text: "Die Firma hofft, sich gut einzuleben." }
          - { key: b, text: "Die Firma hofft, die neuen Kollegen einzuleben." }
          - { key: c, text: "Die Firma hofft, dass die neuen Kollegen sich gut einleben." }
        answer: c
        why: "Unterschiedliches Subjekt (Firma / Kollegen) → der dass-Satz bleibt nötig."
      - q: "Ich lese den Vertrag zweimal. Ich will sicher sein."
        options:
          - { key: a, text: "Ich lese den Vertrag zweimal, um sicher zu sein." }
          - { key: b, text: "Ich lese den Vertrag zweimal, um sicher sein zu." }
          - { key: c, text: "Ich lese den Vertrag zweimal um sicher zu sein." }
        answer: a
        why: "Komma vor um, zu direkt vor dem Infinitiv sein."
    notes: "5–6 von 6 richtig? Infinitivgruppen mit um…zu (Zweck), ohne…zu (ohne dass etwas passiert) und (an)statt…zu (Alternative) — immer mit Komma abgetrennt, nur bei gleichem Subjekt in Haupt- und Nebensatz möglich, sonst bleibt der dass-Satz nötig — sitzen jetzt sicher."
