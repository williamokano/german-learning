lesson: "EX/21-infinitivgruppen-a2"
title: "Infinitivgruppen mit Komma — A2"
topic: "Infinitivgruppen mit Komma"
level: A2
intro: >
  Infinitivgruppen mit um…zu und ohne…zu beschreiben den Zweck (um)
  oder das Fehlen einer Handlung (ohne) — das Subjekt in Haupt- und
  Nebensatz muss dabei immer gleich sein. Die Infinitivgruppe steht
  immer mit Komma vom Hauptsatz abgetrennt: Ich lerne Deutsch, um
  einen guten Job zu finden. Bei trennbaren Verben steht zu zwischen
  Vorsilbe und Verbstamm: anzurufen, aufzuräumen, einzukaufen.
  Blocks: A Basistraining → B Vertiefung → C Sprachbausteine → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Verb → zu-Infinitiv (trennbare Verben)"
    instructions: "Ergänze den zu-Infinitiv. Bei trennbaren Verben steht zu zwischen Vorsilbe und Verbstamm."
    instructionsEn: "Fill in the zu-infinitive. For separable verbs, zu goes between the prefix and the verb stem."
    columns: ["Verb", "zu-Infinitiv"]
    rows:
      - label: "anrufen"
        cells: [{ gap: 1, answer: "anzurufen" }]
      - label: "aufräumen"
        cells: [{ gap: 2, answer: "aufzuräumen" }]
      - label: "einkaufen"
        cells: [{ gap: 3, answer: "einzukaufen" }]
      - label: "fernsehen"
        cells: [{ gap: 4, answer: "fernzusehen" }]
      - label: "mitkommen"
        cells: [{ gap: 5, answer: "mitzukommen" }]
      - label: "weggehen"
        cells: [{ gap: 6, answer: "wegzugehen" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "um oder ohne?"
    instructions: "Ergänze um oder ohne."
    instructionsEn: "Fill in um or ohne."
    text: |
      1. Ich lerne jeden Tag Deutsch, {1} die Prüfung zu bestehen.
      2. Er verließ die Party, {2} sich zu verabschieden.
      3. Wir sparen Geld, {3} eine Reise zu machen.
      4. Sie ging einkaufen, {4} eine Einkaufsliste zu schreiben.
      5. Ich rufe meine Mutter an, {5} ihr von der Prüfung zu erzählen.
      6. Er aß das Brötchen, {6} sich vorher die Hände zu waschen.
    answers:
      "1": um
      "2": ohne
      "3": um
      "4": ohne
      "5": um
      "6": ohne

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Mein Samstag"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Am Samstag gehe ich früh joggen, {1} fit zu bleiben. Danach gehe
      ich einkaufen, {2} zuerst eine Liste zu schreiben. Ich habe vor,
      meine Freundin {3} und sie zum Kaffee {4}. Sie sagt sofort zu,
      {5} lange zu überlegen. Am Nachmittag treffen wir uns im Park,
      {6} zusammen Fahrrad zu fahren. Ich versuche, jeden Tag früh
      {7}. Am Abend gehe ich früh ins Bett, {8} am nächsten Tag nicht
      müde zu sein.
    bank: [um, um, um, ohne, ohne, anzurufen, einzuladen, aufzustehen, aufzuräumen, fernzusehen]
    answers:
      "1": um
      "2": ohne
      "3": anzurufen
      "4": einzuladen
      "5": ohne
      "6": um
      "7": aufzustehen
      "8": um

  - id: B2
    block: B
    type: single-choice
    title: "Welcher Satz ist richtig?"
    instructions: "Wähle die richtige Kombination (a, b oder c)."
    instructionsEn: "Choose the correct combination (a, b, or c)."
    items:
      - q: "Ich lerne Deutsch. Ich möchte in Deutschland arbeiten."
        options:
          - { key: a, text: "Ich lerne Deutsch um in Deutschland zu arbeiten." }
          - { key: b, text: "Ich lerne Deutsch, um in Deutschland zu arbeiten." }
          - { key: c, text: "Ich lerne Deutsch, um in Deutschland arbeiten zu." }
        answer: b
        why: "Die Infinitivgruppe steht mit Komma; zu bleibt direkt vor dem Infinitiv."
      - q: "Sie ruft ihre Mutter an. Sie möchte ihr von der Prüfung erzählen."
        options:
          - { key: a, text: "Sie ruft ihre Mutter an, um ihr von der Prüfung erzählen zu." }
          - { key: b, text: "Sie ruft ihre Mutter an um ihr von der Prüfung zu erzählen." }
          - { key: c, text: "Sie ruft ihre Mutter an, um ihr von der Prüfung zu erzählen." }
        answer: c
        why: "Komma vor um, und zu erzählen bleibt zusammen am Ende."
      - q: "Wir sparen Geld. Wir wollen ein Auto kaufen."
        options:
          - { key: a, text: "Wir sparen Geld, um ein Auto zu kaufen." }
          - { key: b, text: "Wir sparen Geld, um ein Auto kaufen zu." }
          - { key: c, text: "Wir sparen Geld um ein Auto zu kaufen." }
        answer: a
        why: "Komma vor um, zu direkt vor dem Infinitiv kaufen."
      - q: "Ich putze meine Zähne. Ich benutze keine Zahnpasta."
        options:
          - { key: a, text: "Ich putze meine Zähne ohne Zahnpasta zu benutzen." }
          - { key: b, text: "Ich putze meine Zähne, ohne Zahnpasta zu benutzen." }
          - { key: c, text: "Ich putze meine Zähne, ohne Zahnpasta benutzen zu." }
        answer: b
        why: "ohne + zu-Infinitiv braucht ebenfalls das Komma davor."
      - q: "Er geht zur Arbeit. Er frühstückt nicht."
        options:
          - { key: a, text: "Er geht zur Arbeit, ohne frühstücken zu." }
          - { key: b, text: "Er geht zur Arbeit ohne zu frühstücken." }
          - { key: c, text: "Er geht zur Arbeit, ohne zu frühstücken." }
        answer: c
        why: "Komma vor ohne, zu direkt vor dem Infinitiv frühstücken."
      - q: "Er verließ das Haus. Er sagte nichts."
        options:
          - { key: a, text: "Er verließ das Haus, ohne etwas zu sagen." }
          - { key: b, text: "Er verließ das Haus, ohne etwas sagen zu." }
          - { key: c, text: "Er verließ das Haus ohne etwas zu sagen." }
        answer: a
        why: "ohne etwas zu sagen — zu bleibt direkt vor dem Infinitiv sagen."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine — Vor der Prüfung"
    instructions: "Wähle die richtige Kombination (a, b oder c). Die Sätze bilden eine kurze Geschichte."
    items:
      - q: "Original: Ich stehe früh auf. Ich will vor der Prüfung noch lernen."
        options:
          - { key: a, text: "Ich stehe früh auf um vor der Prüfung noch zu lernen." }
          - { key: b, text: "Ich stehe früh auf, um vor der Prüfung noch zu lernen." }
          - { key: c, text: "Ich stehe früh auf, um vor der Prüfung noch lernen zu." }
        answer: b
        why: "um + zu-Infinitiv drückt den Zweck aus, immer mit Komma abgetrennt."
      - q: "Original: Ich gehe aus dem Haus. Ich vergesse mein Buch nicht."
        options:
          - { key: a, text: "Ich gehe aus dem Haus, ohne mein Buch vergessen zu." }
          - { key: b, text: "Ich gehe aus dem Haus ohne mein Buch zu vergessen." }
          - { key: c, text: "Ich gehe aus dem Haus, ohne mein Buch zu vergessen." }
        answer: c
        why: "ohne + zu-Infinitiv bedeutet, dass etwas nicht passiert — hier: das Buch nicht vergessen."
      - q: "Original: Ich fahre mit dem Bus. Ich spare Zeit."
        options:
          - { key: a, text: "Ich fahre mit dem Bus, um Zeit zu sparen." }
          - { key: b, text: "Ich fahre mit dem Bus, um Zeit sparen zu." }
          - { key: c, text: "Ich fahre mit dem Bus um Zeit zu sparen." }
        answer: a
        why: "um + zu-Infinitiv drückt den Zweck aus."
      - q: "Original: Ich betrete den Raum. Ich grüße niemanden."
        options:
          - { key: a, text: "Ich betrete den Raum ohne jemanden zu grüßen." }
          - { key: b, text: "Ich betrete den Raum, ohne jemanden zu grüßen." }
          - { key: c, text: "Ich betrete den Raum, ohne jemanden grüßen zu." }
        answer: b
        why: "In der Infinitivgruppe steht jemanden statt niemanden — die Verneinung liegt schon in ohne."
      - q: "Original: Ich lese die Fragen genau. Ich verstehe die Aufgabe richtig."
        options:
          - { key: a, text: "Ich lese die Fragen genau, um die Aufgabe richtig verstehen zu." }
          - { key: b, text: "Ich lese die Fragen genau um die Aufgabe richtig zu verstehen." }
          - { key: c, text: "Ich lese die Fragen genau, um die Aufgabe richtig zu verstehen." }
        answer: c
        why: "Komma vor um, zu direkt vor dem Infinitiv verstehen."
      - q: "Original: Ich gebe die Prüfung ab. Ich kontrolliere sie nicht noch einmal."
        options:
          - { key: a, text: "Ich gebe die Prüfung ab, ohne sie noch einmal zu kontrollieren." }
          - { key: b, text: "Ich gebe die Prüfung ab, ohne sie noch einmal kontrollieren zu." }
          - { key: c, text: "Ich gebe die Prüfung ab ohne sie noch einmal zu kontrollieren." }
        answer: a
        why: "Komma vor ohne, zu direkt vor dem Infinitiv kontrollieren."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine — Der Umzug (Wortbank)"
    instructions: "Fill the 8 gaps. Two words in the box are not needed."
    text: |
      Ich ziehe in eine neue Stadt, {1} näher bei der Arbeit zu
      wohnen. Ich packe meine Sachen sorgfältig, {2} etwas zu
      vergessen. Ich rufe eine Umzugsfirma an, {3} einen Termin zu
      vereinbaren. Ich räume die alte Wohnung auf, {4} sie sauber zu
      übergeben. Ich verabschiede mich von den Nachbarn, {5} traurig
      zu sein. Ich freue mich darauf, bald neue Leute {6}. Ich
      versuche, mich schnell {7}. Ich hoffe, dort schnell neue
      Freunde {8}.
    bank: [um, um, um, ohne, ohne, kennenzulernen, einzuleben, "zu finden", aufzuräumen, anzurufen]
    answers:
      "1": um
      "2": ohne
      "3": um
      "4": um
      "5": ohne
      "6": kennenzulernen
      "7": einzuleben
      "8": "zu finden"

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze um, ohne oder den zu-Infinitiv."
    text: |
      1. Ich mache Sport, {1} gesund zu bleiben.
      2. Er verließ das Zimmer, {2} die Tür zu schließen.
      3. Ich habe vor, morgen früh {3}.
      4. Wir fahren in den Urlaub, {4} uns zu erholen.
      5. Sie las das Buch, {5} eine Pause zu machen.
      6. Ich übe jeden Tag, {6} besser zu werden.
    answers:
      "1": um
      "2": ohne
      "3": aufzustehen
      "4": um
      "5": ohne
      "6": um

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Kombination (a, b oder c). Das ist dein letzter Check für dieses Set."
    items:
      - q: "Ich gehe zum Arzt. Ich möchte mich untersuchen lassen."
        options:
          - { key: a, text: "Ich gehe zum Arzt um mich untersuchen zu lassen." }
          - { key: b, text: "Ich gehe zum Arzt, um mich untersuchen zu lassen." }
          - { key: c, text: "Ich gehe zum Arzt, um mich untersuchen lassen zu." }
        answer: b
        why: "Komma vor um, zu direkt vor dem Infinitiv lassen."
      - q: "Sie verließ das Café. Sie bezahlte nicht."
        options:
          - { key: a, text: "Sie verließ das Café, ohne bezahlen zu." }
          - { key: b, text: "Sie verließ das Café ohne zu bezahlen." }
          - { key: c, text: "Sie verließ das Café, ohne zu bezahlen." }
        answer: c
        why: "Komma vor ohne, zu direkt vor dem Infinitiv bezahlen."
      - q: "Ich rufe meinen Freund an. Ich möchte ihn zur Party einladen."
        options:
          - { key: a, text: "Ich rufe meinen Freund an, um ihn zur Party einzuladen." }
          - { key: b, text: "Ich rufe meinen Freund an, um ihn zur Party einladen zu." }
          - { key: c, text: "Ich rufe meinen Freund an um ihn zur Party einzuladen." }
        answer: a
        why: "Bei trennbaren Verben steht zu zwischen Vorsilbe und Verbstamm: einzuladen."
      - q: "Wir gehen früh schlafen. Wir wollen morgen fit sein."
        options:
          - { key: a, text: "Wir gehen früh schlafen um morgen fit zu sein." }
          - { key: b, text: "Wir gehen früh schlafen, um morgen fit zu sein." }
          - { key: c, text: "Wir gehen früh schlafen, um morgen fit sein zu." }
        answer: b
        why: "Komma vor um, zu direkt vor dem Infinitiv sein."
      - q: "Er aß das Sandwich. Er wusch sich vorher nicht die Hände."
        options:
          - { key: a, text: "Er aß das Sandwich, ohne die Hände waschen zu." }
          - { key: b, text: "Er aß das Sandwich ohne sich die Hände zu waschen." }
          - { key: c, text: "Er aß das Sandwich, ohne sich die Hände zu waschen." }
        answer: c
        why: "Komma vor ohne, zu direkt vor dem Infinitiv waschen."
      - q: "Ich packe meine Tasche. Ich möchte nichts vergessen."
        options:
          - { key: a, text: "Ich packe meine Tasche, um nichts zu vergessen." }
          - { key: b, text: "Ich packe meine Tasche, um nichts vergessen zu." }
          - { key: c, text: "Ich packe meine Tasche um nichts zu vergessen." }
        answer: a
        why: "Komma vor um, zu direkt vor dem Infinitiv vergessen."
    notes: "5–6 von 6 richtig? Infinitivgruppen mit um…zu (Zweck) und ohne…zu (ohne dass etwas passiert) — immer mit Komma vom Hauptsatz abgetrennt, und bei trennbaren Verben steht zu zwischen Vorsilbe und Verbstamm (anzurufen, aufzuräumen) — sitzen jetzt sicher."
