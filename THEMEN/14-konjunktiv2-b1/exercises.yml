    bank: [wäre, wäre, wäre, wäre, würde, würde, würde, würden, würden, hätte, hätten, käme]
    answers:
      "1": wäre
      "2": würde
      "3": würden
      "4": wäre
      "5": würde
      "6": würden
      "7": hätte
      "8": würde
      "9": wäre
      "10": wäre

