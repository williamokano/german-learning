lesson: "EX/26-erst-schon-noch-a2"
title: "schon, noch, noch nicht, nicht mehr, erst — A2"
topic: "erst / schon / noch"
level: A2
intro: >
  Kleine Wörter, große Wirkung. schon = früher als erwartet / bereits
  (Bist du schon fertig?). Das Gegenteil ist noch nicht (Nein, noch
  nicht.). noch = etwas dauert an (Er schläft noch.). Das Gegenteil ist
  nicht mehr / kein … mehr (Er schläft nicht mehr. / Ich habe keine Zeit
  mehr.). erst = später als erwartet oder nur so wenig (Es ist erst acht
  Uhr. / Ich bin erst seit einer Woche hier.). Merke das Gegensatzpaar:
  schon ↔ noch nicht und noch ↔ nicht mehr. Blocks: A Basistraining → B
  Vertiefung → C Sprachbausteine → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "schon, noch, noch nicht oder nicht mehr?"
    instructions: "Ergänze schon, noch, noch nicht oder nicht mehr."
    instructionsEn: "Fill in schon, noch, noch nicht, or nicht mehr."
    text: |
      1. — Bist du fertig? — Ja, ich bin {1} fertig.
      2. — Bist du fertig? — Nein, {2}.
      3. Es ist spät, aber die Kinder schlafen {3} nicht.
      4. Früher habe ich geraucht, aber jetzt rauche ich {4}.
      5. — Hast du das Buch gelesen? — Nein, ich habe es {5} nicht gelesen.
      6. Wir müssen uns beeilen, wir haben {6} zehn Minuten.
      7. Meine Oma wohnt {7} in ihrem Haus, sie ist in ein Heim gezogen.
      8. — Hast du {8} gegessen? — Ja, vor einer Stunde.
    answers:
      "1": "schon"
      "2": "noch nicht"
      "3": "noch"
      "4": "nicht mehr"
      "5": "noch"
      "6": "noch"
      "7": "nicht mehr"
      "8": "schon"

  - id: A2
    block: A
    type: matching
    title: "Frage und Antwort"
    instructions: "Ordne jeder Frage die passende Antwort zu."
    instructionsEn: "Match each question to the fitting answer."
    left:
      - { key: "1", text: "Ist der Bus schon weg?" }
      - { key: "2", text: "Arbeitest du noch bei der Firma Meyer?" }
