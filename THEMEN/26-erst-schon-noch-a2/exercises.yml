      - { key: "b", text: "Ja, er ist gerade abgefahren." }
      - { key: "c", text: "Nein, noch nicht. Die Kellnerin kommt gleich." }
      - { key: "d", text: "Nein, die ist leider alle. Wir haben keine mehr." }
    answers:
      "1": "b"
      "2": "a"
      "3": "c"
      "4": "d"

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "schon oder erst?"
    instructions: "Ergänze schon (viel / spät / mehr als erwartet) oder erst (wenig / früh / weniger als erwartet)."
    instructionsEn: "Fill in schon (a lot / late / more than expected) or erst (little / early / less than expected)."
    text: |
      1. Steh auf! Es ist {1} zehn Uhr, du verschläfst!
      2. Warum bist du schon wach? Es ist doch {2} sechs Uhr.
      3. Ich lerne {3} seit zwei Monaten Deutsch, mehr nicht.
      4. Er ist {4} sein ganzes Leben in dieser Stadt.
      5. Der Film hat {5} angefangen, wir sind zu spät.
      6. Wart noch, der Film fängt {6} um acht an.
    answers:
      "1": "schon"
      "2": "erst"
      "3": "erst"
      "4": "schon"
      "5": "schon"
      "6": "erst"

