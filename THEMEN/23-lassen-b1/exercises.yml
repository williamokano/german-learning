  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Lösung (a, b oder c). Das ist dein Abschlusscheck für dieses Set."
    instructionsEn: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Perfekt: Sie ___ ihr Kleid ändern ___."
        options: [{ key: a, text: "hat … gelassen" }, { key: b, text: "ist … lassen" }, { key: c, text: "hat … lassen" }]
        answer: c
        why: "Kausatives lassen → haben + Ersatzinfinitiv lassen."
      - q: "Ich ___ mein Handy zu Hause ___ und musste zurückfahren."
        options: [{ key: a, text: "habe … gelassen" }, { key: b, text: "habe … lassen" }, { key: c, text: "bin … gelassen" }]
        answer: a
        why: "Vollverb zurücklassen → habe … gelassen."
      - q: "Bedeutungsgleich mit: Der Termin kann nicht verschoben werden."
        options: [{ key: a, text: "Der Termin lässt nicht verschieben." }, { key: b, text: "Der Termin lässt sich nicht verschoben." }, { key: c, text: "Der Termin lässt sich nicht verschieben." }]
        answer: c
        why: "können + Passiv → sich lassen + Infinitiv (mit sich)."
      - q: "Meine Nachbarin ___ ihren Hund jeden Morgen im Park frei laufen."
        options: [{ key: a, text: "lässt" }, { key: b, text: "lasst" }, { key: c, text: "gelassen" }]
        answer: a
        why: "3. Person Singular Präsens → lässt; Bedeutung zulassen."
      - q: "___ uns endlich anfangen!"
        options: [{ key: a, text: "Lässt" }, { key: b, text: "Lass" }, { key: c, text: "Gelassen" }]
        answer: b
        why: "Aufforderung: Lass uns / Lasst uns + Infinitiv."
      - q: "Wir ___ letztes Jahr ein neues Bad einbauen ___."
        options: [{ key: a, text: "haben … lassen" }, { key: b, text: "haben … gelassen" }, { key: c, text: "hatten … gelassen" }]
        answer: a
        why: "Kausativ im Perfekt → haben … Ersatzinfinitiv lassen."
    notes: "5–6 von 6 richtig und alle A/B/C-Übungen sauber gelöst? Dann sitzen die vier Bedeutungen von lassen und der Unterschied gelassen (Vollverb) / lassen (Ersatzinfinitiv). Verwandtes Set: THEMEN 13 (Passiv und Passiversatz)."
