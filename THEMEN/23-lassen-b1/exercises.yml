lesson: "EX/23-lassen-b1"
title: "lassen — die vier Bedeutungen — B1"
topic: "lassen"
level: B1
intro: >
  Ein Verb, vier Aufgaben. 1) lassen = zurücklassen / vergessen: Ich
  habe den Schlüssel zu Hause gelassen. (Perfekt: hat gelassen). 2)
  lassen = erlauben / zulassen: Meine Eltern lassen mich nicht allein
  reisen. (lassen + Akkusativ + Infinitiv ohne zu). 3) lassen =
  veranlassen: Ich lasse mir die Haare schneiden. — jemand anderes
  macht es für mich. 4) sich lassen + Infinitiv = Passiversatz: Das
  Fenster lässt sich nicht öffnen. = kann nicht geöffnet werden.
  Wichtig im Perfekt: hat den Schlüssel gelassen (Vollverb, mit ge-)
  gegenüber hat das Auto reparieren lassen (Ersatzinfinitiv, ohne
  ge-). Dazu: Lass uns … / Lasst uns … = Aufforderung. Konjugation:
  ich lasse, du lässt, er/sie/es lässt, wir/sie lassen, ihr lasst;
  Präteritum ließ. Blocks: A Basistraining → B Vertiefung → C
  Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Welche Bedeutung von lassen?"
    instructions: "Ordne jeden Satz der richtigen Bedeutung zu."
    instructionsEn: "Sort each sentence by the meaning of lassen it uses."
    buckets:
      - { key: zuruecklassen, label: "zurücklassen / vergessen" }
      - { key: erlauben, label: "erlauben / zulassen" }
      - { key: veranlassen, label: "veranlassen (jemand anderes macht es)" }
      - { key: passiversatz, label: "sich lassen = kann … werden" }
    tokens:
      - { text: "Ich habe meinen Regenschirm im Bus gelassen.", bucket: zuruecklassen }
      - { text: "Lass die schwere Tasche einfach hier.", bucket: zuruecklassen }
      - { text: "Wo hast du die Autoschlüssel gelassen?", bucket: zuruecklassen }
      - { text: "Meine Mutter lässt mich nicht allein in die Stadt.", bucket: erlauben }
      - { text: "Lass mich bitte ausreden.", bucket: erlauben }
      - { text: "Der Lehrer lässt uns das Wörterbuch benutzen.", bucket: erlauben }
      - { text: "Ich lasse mir die Haare schneiden.", bucket: veranlassen }
      - { text: "Wir lassen die Heizung reparieren.", bucket: veranlassen }
      - { text: "Sie lässt sich ein Kleid nähen.", bucket: veranlassen }
      - { text: "Das Fenster lässt sich nicht öffnen.", bucket: passiversatz }
      - { text: "Der Fleck lässt sich leicht entfernen.", bucket: passiversatz }
      - { text: "Das Problem lässt sich lösen.", bucket: passiversatz }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Form von lassen"
    instructions: "Ergänze die richtige Form: lasse, lässt, lassen, lasst, ließ (Präteritum) oder gelassen / lassen (Perfekt)."
    instructionsEn: "Fill in the right form: lasse, lässt, lassen, lasst, ließ (past), or gelassen / lassen (perfect)."
    text: |
      1. Ich {1} mir morgen beim Friseur die Haare schneiden.
      2. {2} du mich bitte kurz telefonieren?
      3. Meine Eltern {3} mich nicht allein in den Urlaub fahren.
      4. Er {4} gerade sein Fahrrad reparieren.
      5. Gestern {5} ich meinen Ausweis zu Hause. (Präteritum)
      6. Wir haben die Wohnung neu streichen {6}. (Perfekt)
      7. Ich habe meinen Schirm im Zug {7}. (Perfekt)
      8. Dieser Satz {8} sich leicht erklären.
    answers:
      "1": "lasse"
      "2": "Lässt"
      "3": "lassen"
      "4": "lässt"
      "5": "ließ"
      "6": "lassen"
      "7": "gelassen"
      "8": "lässt"

  - id: A3
    block: A
    type: order
    title: "Satzbau mit lassen"
    instructions: "Bring die Kacheln in die richtige Reihenfolge. Im Perfekt steht statt gelassen der Ersatzinfinitiv lassen am Satzende."
    instructionsEn: "Put the tiles in order. In the perfect the causative uses the replacement infinitive lassen at the end, not gelassen."
    items:
      - tiles: ["Ich", "lasse", "mir", "die Haare schneiden."]
        answer: [0, 1, 2, 3]
        note: "Ich lasse mir die Haare schneiden."
      - tiles: ["Wir", "haben", "das Auto", "reparieren", "lassen."]
        answer: [0, 1, 2, 3, 4]
        note: "Wir haben das Auto reparieren lassen. (Ersatzinfinitiv lassen, nicht gelassen.)"
      - tiles: ["Lass", "uns", "morgen", "ins Kino gehen!"]
        answer: [0, 1, 2, 3]
        note: "Lass uns morgen ins Kino gehen!"
      - tiles: ["Der Chef", "lässt", "uns", "heute früher", "nach Hause gehen."]
        answer: [0, 1, 2, 3, 4]
        note: "Der Chef lässt uns heute früher nach Hause gehen."
      - tiles: ["Das", "lässt", "sich", "leider", "nicht ändern."]
        answer: [0, 1, 2, 3, 4]
        note: "Das lässt sich leider nicht ändern."

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Die Wohnung renovieren"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter bleiben übrig."
    instructionsEn: "Fill the 8 gaps with the words from the box. Two words are left over."
    text: |
      Nächste Woche {1} wir endlich die alte Wohnung renovieren. Die
      Renovierung haben wir von einer Firma machen {2}. Die Wände {3}
      sich leicht streichen, aber das Bad ist schwierig. Zuerst {4} der
      Chef seine Leute die Möbel abdecken. Er sagt, man müsse
      realistisch bleiben — nicht alles {5} sich in zwei Tagen machen.
      Am ersten Abend habe ich aus Versehen das Fenster offen {6}. Zum
      Glück {7} sich der Wasserschaden reparieren. Am Ende sagt der
      Chef: {8} uns das nächste Mal früher anfangen.
    bank: ["lassen", "lassen", "lassen", "lässt", "lässt", "gelassen", "lässt", "Lasst", "ließ", "gelassen"]
    answers:
      "1": "lassen"
      "2": "lassen"
      "3": "lassen"
      "4": "lässt"
      "5": "lässt"
      "6": "gelassen"
      "7": "lässt"
      "8": "Lasst"

  - id: B2
    block: B
    type: single-choice
    title: "Bedeutung und Form unterscheiden"
    instructions: "Wähle die richtige Lösung (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Perfekt von: Ich lasse das Auto reparieren."
        options: [{ key: a, text: "Ich habe das Auto reparieren gelassen." }, { key: b, text: "Ich habe das Auto reparieren lassen." }, { key: c, text: "Ich habe das Auto repariert lassen." }]
        answer: b
        why: "Kausatives lassen im Perfekt → Ersatzinfinitiv lassen, kein ge-."
      - q: "Perfekt von: Ich lasse den Schlüssel im Büro."
        options: [{ key: a, text: "Ich habe den Schlüssel im Büro lassen." }, { key: b, text: "Ich habe den Schlüssel im Büro gelasst." }, { key: c, text: "Ich habe den Schlüssel im Büro gelassen." }]
        answer: c
        why: "lassen als Vollverb (zurücklassen) → Partizip gelassen."
      - q: "Bedeutungsgleich mit: Das Gerät kann leicht bedient werden."
        options: [{ key: a, text: "Das Gerät lässt sich leicht bedienen." }, { key: b, text: "Das Gerät lässt leicht bedienen." }, { key: c, text: "Das Gerät lässt sich leicht bedient." }]
        answer: a
        why: "können + Passiv → sich lassen + Infinitiv. Das reflexive sich ist Pflicht."
      - q: "Welcher Satz bedeutet, dass jemand anderes die Arbeit macht?"
        options: [{ key: a, text: "Ich repariere mein Fahrrad." }, { key: b, text: "Ich kann mein Fahrrad reparieren." }, { key: c, text: "Ich lasse mein Fahrrad reparieren." }]
        answer: c
        why: "lassen = veranlassen: die Werkstatt repariert, nicht ich selbst."
      - q: "Lass uns gehen! bedeutet:"
        options: [{ key: a, text: "Wir sollten (jetzt) gehen." }, { key: b, text: "Erlaube mir zu gehen." }, { key: c, text: "Vergiss uns hier nicht." }]
        answer: a
        why: "Lass uns / Lasst uns + Infinitiv = gemeinsame Aufforderung (englisch: let's)."
      - q: "Ergänze: Das Problem ___ sich bestimmt lösen."
        options: [{ key: a, text: "lasst" }, { key: b, text: "lässt" }, { key: c, text: "ließ" }]
        answer: b
        why: "3. Person Singular Präsens → lässt (mit Umlaut)."
      - q: "Meine Chefin lässt mich am Freitag im Homeoffice arbeiten. lassen heißt hier:"
        options: [{ key: a, text: "erlauben" }, { key: b, text: "veranlassen" }, { key: c, text: "vergessen" }]
        answer: a
        why: "Sie erlaubt es mir — lassen + Akkusativ + Infinitiv im Sinne von zulassen."
      - q: "Welche Perfektform ist richtig? Sie hat sich ein Kleid nähen ___."
        options: [{ key: a, text: "gelassen" }, { key: b, text: "lassen" }, { key: c, text: "genäht" }]
        answer: b
        why: "Kausatives lassen → Ersatzinfinitiv lassen am Ende."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Ein Umzug"
    instructions: "Wähle für jede Lücke die richtige Lösung (a, b oder c)."
    instructionsEn: "Choose the correct option for each gap (a, b, or c)."
    items:
      - q: "Für den Umzug ___ wir eine Firma kommen."
        options: [{ key: a, text: "lasst" }, { key: b, text: "ließt" }, { key: c, text: "lassen" }]
        answer: c
        why: "1. Person Plural Präsens → lassen."
      - q: "Die schweren Kisten ___ sich zu zweit besser tragen."
        options: [{ key: a, text: "lässt" }, { key: b, text: "lassen" }, { key: c, text: "gelassen" }]
        answer: b
        why: "Subjekt Kisten (Plural) → lassen; sich lassen = können getragen werden."
      - q: "Den alten Schrank haben wir in der Wohnung ___."
        options: [{ key: a, text: "lassen" }, { key: b, text: "gelasst" }, { key: c, text: "gelassen" }]
        answer: c
        why: "Vollverb zurücklassen im Perfekt → gelassen."
      - q: "___ uns eine Pause machen, bevor wir weitermachen."
        options: [{ key: a, text: "Lasst" }, { key: b, text: "Lässt" }, { key: c, text: "Ließ" }]
        answer: a
        why: "Aufforderung an mehrere Personen: Lasst uns + Infinitiv."
      - q: "Der Vermieter ___ uns die Wände streichen, aber nicht bohren."
        options: [{ key: a, text: "lasst" }, { key: b, text: "gelassen" }, { key: c, text: "lässt" }]
        answer: c
        why: "3. Person Singular Präsens, Bedeutung erlauben → lässt."
      - q: "Die Waschmaschine haben wir vom Techniker anschließen ___."
        options: [{ key: a, text: "gelassen" }, { key: b, text: "lassen" }, { key: c, text: "angeschlossen" }]
        answer: b
        why: "Kausatives lassen im Perfekt → Ersatzinfinitiv lassen."
      - q: "Ob das Sofa durch die Tür passt, ___ sich schwer sagen."
        options: [{ key: a, text: "lässt" }, { key: b, text: "lasst" }, { key: c, text: "lassen" }]
        answer: a
        why: "Unpersönliches es … lässt sich sagen → 3. Person Singular lässt."
      - q: "Gestern ___ der Nachbar uns seinen Transporter benutzen."
        options: [{ key: a, text: "lässt" }, { key: b, text: "ließ" }, { key: c, text: "gelassen" }]
        answer: b
        why: "Präteritum von lassen → ließ."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Beim Fahrradladen (Wortbank)"
    instructions: "Fülle die 10 Lücken. Drei Wörter im Kasten bleiben übrig."
    instructionsEn: "Fill the 10 gaps. Three words in the box are left over."
    text: |
      Mein Fahrrad macht komische Geräusche, also {1} ich es heute
      reparieren. Der Mechaniker sagt, die Bremsen {2} sich noch
      einstellen, aber die Kette ist kaputt. Das kann ich nicht selbst,
      deshalb {3} ich die Werkstatt die Arbeit machen. Letzte Woche habe
      ich mein altes Rad einfach im Keller {4}, das war ein Fehler. Der
      Mechaniker meint: {5} uns lieber gleich alles prüfen. Er {6} mich
      kurz zusehen, wie er arbeitet. Ein neuer Sattel {7} sich schnell
      montieren. Früher {8} mein Vater sein Rad nie reparieren — er hat
      alles selbst gemacht. Am Ende habe ich den alten Sattel doch dort
      {9}. Solche Reparaturen {10} sich zum Glück meistens günstig
      erledigen.
    bank: ["lasse", "lasse", "lassen", "gelassen", "Lasst", "lässt", "lässt", "ließ", "gelassen", "lassen", "ließen", "lasst", "gelasst"]
    answers:
      "1": "lasse"
      "2": "lassen"
      "3": "lasse"
      "4": "gelassen"
      "5": "Lasst"
      "6": "lässt"
      "7": "lässt"
      "8": "ließ"
      "9": "gelassen"
      "10": "lassen"

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: order
    title: "Wiederholung: Satzbau"
    instructions: "Bring die Kacheln in die richtige Reihenfolge."
