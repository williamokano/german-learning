lesson: "EX/12-modalverben-b2"
title: "Modalverben: Subjektive Bedeutung — B2"
topic: "Modalverben"
level: B2
intro: >
  Standalone drill set, not tied to any lesson. Beyond their everyday
  (objektiv) meanings, the modal verbs have a second, subjektiv use for
  guesses, hearsay, and claims — same modal, no object case involved,
  just a different degree of certainty: müssen = a near-certain
  inference (Er muss zu Hause sein — the light is on), dürfte = a
  cautious assumption, können/könnte = a bare possibility, sollen =
  hearsay ("people say" — Er soll reich sein), wollen = a claim the
  speaker doubts (Er will das nicht gewusst haben), mögen = a
  concession (Er mag Recht haben). To talk about the past, the main verb
  becomes Infinitiv II (Partizip II + haben/sein): Er muss krank
  gewesen sein. Blocks: A Basistraining → B Vertiefung →
  C Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Gegenwart (Infinitiv I) und Vergangenheit (Infinitiv II)"
    instructions: "Ergänze den ganzen Satz mit dem passenden Modalverb."
    instructionsEn: "Fill in the whole sentence with the appropriate modal verb."
    columns: ["", "Gegenwart (Infinitiv I)", "Vergangenheit (Infinitiv II)"]
    rows:
      - label: "müssen (starke Vermutung)"
        cells: [{ gap: 1, answer: "Er muss krank sein." }, { gap: 2, answer: "Er muss krank gewesen sein." }]
      - label: "sollen (Gerücht)"
        cells: [{ gap: 3, answer: "Er soll reich sein." }, { gap: 4, answer: "Er soll reich gewesen sein." }]
      - label: "können (Möglichkeit)"
        cells: [{ gap: 5, answer: "Er kann Recht haben." }, { gap: 6, answer: "Er kann Recht gehabt haben." }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Welches Modalverb passt zur Vermutung?"
    instructions: "Ergänze das passende Modalverb (subjektive Bedeutung)."
    instructionsEn: "Fill in the appropriate modal verb (subjective meaning)."
    text: |
      1. Das Licht ist an. Sie {1} zu Hause sein. (starke Vermutung)
      2. Ich bin nicht sicher, aber sie {2} zu Hause sein. (vorsichtige Vermutung)
      3. Sie {3} zu Hause sein, aber vielleicht ist sie auch einkaufen. (Möglichkeit)
      4. Er {4} sehr talentiert sein, das sagen alle Kritiker. (Gerücht)
      5. Sie {5} die Wahrheit gesagt haben, aber ich zweifle daran. (Behauptung)
      6. Das {6} nicht wahr sein! (Unmöglichkeit)
    answers:
      "1": muss
      "2": dürfte
      "3": könnte
      "4": soll
      "5": will
      "6": kann

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Der neue Kollege"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Der neue Kollege ist sehr mysteriös. Er {1} früher bei einer
      großen Firma gearbeitet haben, das erzählt man sich. Er {2} sehr
      klug sein, seine Ideen sind immer gut. Er {3} aus dem Ausland
      kommen, sein Akzent klingt fremd. Niemand weiß es genau, aber er
      {4} auch einfach nur schüchtern sein. Er {5} den Chef schon
      lange gekannt haben, das behauptet er jedenfalls. Das Gerücht
      {6} nicht stimmen, so viele Zufälle gibt es nicht. Ich bin
      sicher: er {7} bald befördert werden. Jedenfalls {8} er ein
      interessanter neuer Kollege sein.
    bank: [soll, muss, könnte, mag, will, kann, dürfte, dürfte, würde, möchte]
    answers:
      "1": soll
      "2": muss
      "3": könnte
      "4": mag
      "5": will
      "6": kann
      "7": dürfte
      "8": dürfte

  - id: B2
    block: B
    type: single-choice
    title: "Objektiv oder subjektiv? — Welches Modalverb passt?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "(Ich bin fast sicher) Das Restaurant ___ schon geschlossen sein, es ist nach Mitternacht."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "mag" }]
        answer: a
        why: "Starke Vermutung → müssen."
      - q: "(Das hört man so) Das neue Restaurant ___ fantastisch sein."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "könnte" }]
        answer: b
        why: "Gerücht → sollen."
      - q: "(Es ist nur eine Möglichkeit) Er ___ noch im Büro sein, ich bin nicht sicher."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "könnte" }]
        answer: c
        why: "Möglichkeit → können/könnte."
      - q: "(Er behauptet es, aber ich glaube es nicht ganz) Er ___ das Spiel ohne Hilfe gewonnen haben."
        options: [{ key: a, text: "will" }, { key: b, text: "muss" }, { key: c, text: "mag" }]
        answer: a
        why: "Bezweifelte Behauptung → wollen."
      - q: "(Es ist unmöglich) Das ___ nicht wahr sein!"
        options: [{ key: a, text: "will" }, { key: b, text: "kann" }, { key: c, text: "soll" }]
        answer: b
        why: "Unmöglichkeit → nicht können."
      - q: "(Vorsichtige Vermutung) Sie ___ schon angekommen sein."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "dürfte" }]
        answer: c
        why: "Vorsichtige Vermutung → dürfte."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Das verschwundene Gemälde"
    instructions: "Choose the correct modal verb for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Das Gemälde ___ letzte Woche gestohlen worden sein."
        options: [{ key: a, text: "soll" }, { key: b, text: "muss" }, { key: c, text: "mag" }]
        answer: a
        why: "Gerücht → sollen."
      - q: "Die Polizei sagt, der Dieb ___ die Alarmanlage gekannt haben."
        options: [{ key: a, text: "soll" }, { key: b, text: "muss" }, { key: c, text: "könnte" }]
        answer: b
        why: "Starke Schlussfolgerung aus Beweisen → müssen."
      - q: "Es ___ auch ein Insider gewesen sein, das schließt niemand aus."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "könnte" }]
        answer: c
        why: "Möglichkeit → können/könnte."
      - q: "Der Museumsdirektor ___ von nichts gewusst haben, so behauptet er."
        options: [{ key: a, text: "will" }, { key: b, text: "muss" }, { key: c, text: "soll" }]
        answer: a
        why: "Bezweifelte Behauptung → wollen."
      - q: "Das ___ eigentlich nicht passieren können, die Sicherheit war doch so gut."
        options: [{ key: a, text: "soll" }, { key: b, text: "dürfte" }, { key: c, text: "will" }]
        answer: b
        why: "Vorsichtige Erwartung → dürfte."
      - q: "Die Ermittler ___ bald eine Spur finden."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "dürfte" }]
        answer: c
        why: "Vorsichtige Erwartung → dürfte."
      - q: "Manche sagen, das Gemälde ___ nie echt gewesen sein."
        options: [{ key: a, text: "muss" }, { key: b, text: "mag" }, { key: c, text: "will" }]
        answer: b
        why: "Zugeständnis/Möglichkeit → mögen."
      - q: "Am Ende ___ die Wahrheit ans Licht kommen."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "mag" }]
        answer: a
        why: "Unausweichlichkeit → müssen."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Gerüchte im Büro (Wortbank)"
    instructions: "Fill the 10 gaps. Two words in the box are not needed."
    text: |
      Im Büro gibt es viele Gerüchte. Die neue Chefin {1} sehr streng
      sein, das erzählen alle. Sie {2} schon viel Erfahrung haben, ihr
      Lebenslauf ist beeindruckend. Manche sagen, sie {3} früher bei
      einem großen Konzern gearbeitet haben. Sie {4} auch einfach nur
      ehrgeizig sein, das wäre auch möglich. Ein Kollege {5} sie schon
      persönlich kennen, das behauptet er. Das {6} aber nicht stimmen,
      er kennt doch niemanden aus dem Vorstand. Wir {7} es bald
      erfahren, das Meeting ist ja morgen. Jedenfalls {8} sie eine
      interessante neue Chefin sein. Das {9} man wohl erst mit der
      Zeit sehen. Aber ganz ehrlich: {10} das wirklich so wichtig sein?
    bank: [soll, soll, muss, muss, kann, mag, mag, will, dürfte, dürfte, sollte, könnte]
    answers:
      "1": soll
      "2": muss
      "3": soll
      "4": mag
      "5": will
      "6": kann
      "7": dürfte
      "8": dürfte
      "9": muss
      "10": mag

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das passende Modalverb (subjektive Bedeutung)."
    text: |
      1. Er {1} zu Hause sein, das Licht brennt.
      2. Sie {2} schon angekommen sein, aber ich bin nicht ganz sicher.
      3. Das Konzert {3} fantastisch gewesen sein, das hört man überall.
      4. Er {4} die Wahrheit gesagt haben, aber ich habe Zweifel.
      5. Das {5} auch Zufall sein.
      6. Sie {6} Recht haben, das ist durchaus möglich.
    answers:
      "1": muss
      "2": dürfte
      "3": soll
      "4": will
      "5": kann
      "6": mag

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Das Auto ___ schon zehn Jahre alt sein, es sieht aber noch neu aus."
        options: [{ key: a, text: "dürfte" }, { key: b, text: "soll" }, { key: c, text: "mag" }]
        answer: a
        why: "Vorsichtige Vermutung → dürfte."
      - q: "Die Show ___ letztes Jahr ein großer Erfolg gewesen sein, das erzählt jeder."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "könnte" }]
        answer: b
        why: "Gerücht → sollen."
      - q: "Er ___ auch krank sein, das würde die Absage erklären."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "könnte" }]
        answer: c
        why: "Möglichkeit → können/könnte."
      - q: "Sie ___ das Projekt allein fertiggestellt haben, aber ich glaube, ihr Team hat geholfen."
        options: [{ key: a, text: "will" }, { key: b, text: "muss" }, { key: c, text: "mag" }]
        answer: a
        why: "Bezweifelte Behauptung → wollen."
      - q: "Das ___ kein Zufall sein, dafür passiert es zu oft."
        options: [{ key: a, text: "will" }, { key: b, text: "kann" }, { key: c, text: "soll" }]
        answer: b
        why: "Unmöglichkeit → nicht können."
      - q: "Er ___ inzwischen zu Hause sein, die Fahrt dauert nicht lange."
        options: [{ key: a, text: "muss" }, { key: b, text: "soll" }, { key: c, text: "dürfte" }]
        answer: c
        why: "Vorsichtige Vermutung → dürfte."
    notes: "5–6 von 6 richtig? Die subjektive Bedeutung der Modalverben (Vermutung, Gerücht, Behauptung) sitzt jetzt sicher."
