lesson: "EX/03-deklination-a2"
title: "Artikeldeklination in allen Fällen (mit Genitiv-Vorschau) — A2"
topic: "Deklination in allen Fällen (Nominativ, Akkusativ, Dativ, Genitiv)"
level: A2
intro: >
  Standalone drill set, not tied to any lesson. Consolidates der/die/das
  and ein/eine/ein across all four cases in one place, including the
  Dativ Plural -n rule (die Kinder -> den Kindern) and a first look at
  the Genitiv (des Mannes, der Frau). Blocks: A Basistraining (the full
  table, then indefinite article) → B Vertiefung (Dativ Plural, then
  Genitiv) → C Sprachbausteine → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "Der bestimmte Artikel in allen Fällen"
    instructions: "Ergänze die Tabelle."
    instructionsEn: "Complete the table."
    columns: ["", "maskulin", "feminin", "neutral", "Plural"]
    rows:
      - label: "Nom."
        cells: [{ gap: 1, answer: "der Mann" }, { gap: 2, answer: "die Frau" }, { gap: 3, answer: "das Kind" }, { gap: 4, answer: "die Leute" }]
      - label: "Akk."
        cells: [{ gap: 5, answer: "den Mann" }, { gap: 6, answer: "die Frau" }, { gap: 7, answer: "das Kind" }, { gap: 8, answer: "die Leute" }]
      - label: "Dat."
        cells: [{ gap: 9, answer: "dem Mann" }, { gap: 10, answer: "der Frau" }, { gap: 11, answer: "dem Kind" }, { gap: 12, answer: "den Leuten" }]
      - label: "Gen."
        cells: [{ gap: 13, answer: "des Mannes" }, { gap: 14, answer: "der Frau" }, { gap: 15, answer: "des Kindes" }, { gap: 16, answer: "der Leute" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Der unbestimmte Artikel: ein, eine, ein"
    instructions: "Ergänze die richtige Form von ein."
    instructionsEn: "Fill in the correct form of ein."
    text: |
      1. Ich habe {1} Bruder.
      2. Er kauft {2} Auto.
      3. Wir suchen {3} Wohnung.
      4. Ich gebe {4} Freund mein Buch.
      5. Sie hilft {5} Frau im Rollstuhl.
      6. {6} Kind schmeckt die Suppe nicht.
    answers:
      "1": einen
      "2": ein
      "3": eine
      "4": einem
      "5": einer
      "6": Einem

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Die Lehrerin (Dativ Plural)"
    instructions: "Fülle die 8 Lücken. Denk an die Dativ-Plural-Regel: -n am Ende, außer das Wort endet schon auf -n oder -s."
    instructionsEn: "Fill the 8 gaps — remember the Dativ Plural rule: add -n, unless the word already ends in -n or -s."
    text: |
      Die Lehrerin hilft {1}. Sie gibt {2} neue Bücher. Nach {3} geht sie
      nach Hause. Sie spricht mit {4} über die Prüfung. Am Wochenende
      trifft sie sich mit {5}. Sie erzählt {6} von ihrer Arbeit. Sie
      winkt {7} freundlich zu, wenn sie im Treppenhaus sind. Am Abend
      schreibt sie {8} noch eine Nachricht.
    bank: [den Schülern, den Kindern, den Stunden, den Eltern, den Freunden, den Kollegen, den Nachbarn, den Eltern]
    answers:
      "1": den Schülern
      "2": den Kindern
      "3": den Stunden
      "4": den Eltern
      "5": den Freunden
      "6": den Kollegen
      "7": den Nachbarn
      "8": den Eltern

  - id: B2
    block: B
    type: single-choice
    title: "Genitiv-Vorschau: des, der, des, der"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Das Auto ___ Lehrers ist neu."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv maskulin → des; das Nomen bekommt -s (Lehrers)."
      - q: "Die Tasche ___ Frau ist rot."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Genitiv feminin → der; das Nomen bleibt unverändert."
      - q: "Das Spielzeug ___ Kindes liegt im Garten."
        options: [{ key: a, text: "des" }, { key: b, text: "dem" }, { key: c, text: "der" }]
        answer: a
        why: "Genitiv neutrum → des; Kind bekommt -es (leichter auszusprechen als Kinds)."
      - q: "Die Namen ___ Leute sind mir bekannt."
        options: [{ key: a, text: "die" }, { key: b, text: "den" }, { key: c, text: "der" }]
        answer: c
        why: "Genitiv Plural → der."
      - q: "Der Titel ___ Buches ist interessant."
        options: [{ key: a, text: "des" }, { key: b, text: "dem" }, { key: c, text: "der" }]
        answer: a
        why: "Genitiv neutrum → des; Buch bekommt -es."
      - q: "Die Farbe ___ Autos gefällt mir."
        options: [{ key: a, text: "des" }, { key: b, text: "dem" }, { key: c, text: "der" }]
        answer: a
        why: "Genitiv neutrum → des; Auto bekommt nur -s (endet schon auf Vokal)."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Ein Tag in der Stadt"
    instructions: "Choose the correct word for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "___ Stadt hat viele Parks."
        options: [{ key: a, text: "Die" }, { key: b, text: "Der" }, { key: c, text: "Das" }]
        answer: a
        why: "Nominativ feminin → Die."
      - q: "Ich besuche ___ Museum."
        options: [{ key: a, text: "der" }, { key: b, text: "die" }, { key: c, text: "das" }]
        answer: c
        why: "Akkusativ neutrum → das."
      - q: "Wir fahren mit ___ Bus in die Stadt."
        options: [{ key: a, text: "den" }, { key: b, text: "dem" }, { key: c, text: "der" }]
        answer: b
        why: "mit + Dativ maskulin → dem."
      - q: "Am Ende ___ Straße steht ein altes Gebäude."
        options: [{ key: a, text: "der" }, { key: b, text: "die" }, { key: c, text: "den" }]
        answer: a
        why: "Genitiv feminin → der."
      - q: "Ich kaufe ___ Postkarte für meine Oma."
        options: [{ key: a, text: "ein" }, { key: b, text: "eine" }, { key: c, text: "einen" }]
        answer: b
        why: "Akkusativ feminin → eine."
      - q: "Ich spreche mit ___ Verkäufer im Laden."
        options: [{ key: a, text: "ein" }, { key: b, text: "einen" }, { key: c, text: "einem" }]
        answer: c
        why: "mit + Dativ maskulin → einem."
      - q: "Das Zentrum ___ Stadt ist immer voll."
        options: [{ key: a, text: "der" }, { key: b, text: "die" }, { key: c, text: "den" }]
        answer: a
        why: "Genitiv feminin → der."
      - q: "Am Abend gehen wir zu ___ Konzert."
        options: [{ key: a, text: "ein" }, { key: b, text: "einem" }, { key: c, text: "eine" }]
        answer: b
        why: "zu + Dativ neutrum → einem."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Der Tag eines Bäckers (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      {1} Bäcker steht jeden Morgen um vier Uhr auf. Er bereitet {2} Teig
      für {3} frische Brot vor. Zuerst hilft er {4} Kollegen beim
      Aufheizen {5} Ofens. Dann öffnet er {6} Tür {7} Bäckerei. Der Duft
      {8} frischen Brotes zieht durch {9} ganze Straße. Um sechs Uhr
      begrüßt er {10} ersten Kunden.
    bank: [DER, DEN, DAS, DEM, DES, DIE, DER, DES, DIE, DEN, EINE, EINEM, DIESER]
    answers:
      "1": DER
      "2": DEN
      "3": DAS
      "4": DEM
      "5": DES
      "6": DIE
      "7": DER
      "8": DES
      "9": DIE
      "10": DEN

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung: alle vier Fälle"
    instructions: "Ergänze den richtigen bestimmten Artikel."
    instructionsEn: "Fill in the correct definite article, in all four cases."
    text: |
      1. {1} Mann trägt einen Koffer.
      2. Ich sehe {2} Frau am Bahnhof.
      3. Wir geben {3} Kind ein Eis.
      4. Die Tür {4} Hauses ist blau.
      5. {5} Kinder spielen im Park.
      6. Ich helfe {6} Kindern beim Aufräumen.
      7. Die Mutter {7} Kinder ist Lehrerin.
    answers:
      "1": Der
      "2": die
      "3": dem
      "4": des
      "5": Die
      "6": den
      "7": der

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "___ Auto steht vor dem Haus."
        options: [{ key: a, text: "Der" }, { key: b, text: "Die" }, { key: c, text: "Das" }]
        answer: c
        why: "Nominativ neutrum → Das."
      - q: "Ich kaufe ___ Brot."
        options: [{ key: a, text: "ein" }, { key: b, text: "einen" }, { key: c, text: "eine" }]
        answer: a
        why: "Akkusativ neutrum → ein."
      - q: "Sie spricht mit ___ Lehrer."
        options: [{ key: a, text: "den" }, { key: b, text: "dem" }, { key: c, text: "der" }]
        answer: b
        why: "mit + Dativ maskulin → dem."
      - q: "Das ist das Auto ___ Nachbarn."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv maskulin → des (Nachbar ist ein schwacher Nomen: des Nachbarn)."
      - q: "Ich sehe ___ Kinder im Garten."
        options: [{ key: a, text: "der" }, { key: b, text: "die" }, { key: c, text: "den" }]
        answer: b
        why: "Akkusativ Plural → die."
      - q: "Wir danken ___ Eltern für die Hilfe."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "den" }]
        answer: c
        why: "danken + Dativ Plural → den."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B1-Version (Genitiv vertieft, n-Deklination). Weniger als 5? Schau dir Block A noch einmal an."
