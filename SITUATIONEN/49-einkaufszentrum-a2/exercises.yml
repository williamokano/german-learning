      — Direkt hier am Eingang, Sie können nicht {4} vorbei.
      (später, in der Umkleide)
      — Diese Hose ist leider zu {5}. Hätten Sie sie auch eine
      Nummer {6}?
      — Klar, ich {7} kurz nach.
      — Vielen Dank, das wäre super.
      — Hier, bitte {8}.
      — Perfekt, die {9} viel besser.
      — Dann {10} ich sie Ihnen gleich an der Kasse ein.
