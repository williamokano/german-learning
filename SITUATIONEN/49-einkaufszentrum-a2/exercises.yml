  - id: B2
    block: B
    type: single-choice
    title: "Höflich im Einkaufszentrum"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du weißt nicht, in welchem Stock ein Geschäft ist. — You don't know which floor a store is on."
        options:
          - { key: a, text: "Entschuldigung, wo finde ich das Sportgeschäft?" }
          - { key: b, text: "Wo ist irgendein Geschäft?" }
          - { key: c, text: "Zeigen Sie mir sofort den Weg." }
        answer: a
        why: "Eine konkrete, höfliche Frage bringt die schnellste und genaueste Antwort."
      - q: "Die Hose in der Umkleide ist zu eng. — The trousers in the fitting room are too tight."
        options:
          - { key: a, text: "Diese Hose ist schlecht gemacht." }
          - { key: b, text: "Hätten Sie die auch eine Nummer größer?" }
          - { key: c, text: "Ich kaufe sie trotzdem." }
        answer: b
        why: "Eine höfliche Frage nach einer anderen Größe ist der direkte Weg zu einer Lösung."
      - q: "Du möchtest dich mit jemandem im Zentrum verabreden. — You want to arrange to meet someone at the mall."
        options:
          - { key: a, text: "Wir finden uns schon irgendwie." }
          - { key: b, text: "Ruf einfach an, wenn du da bist, ohne Ort." }
          - { key: c, text: "Wir treffen uns am besten am Brunnen im Erdgeschoss." }
        answer: c
        why: "Ein konkreter Treffpunkt verhindert, dass man sich in einem großen Zentrum verpasst."
      - q: "Du möchtest wissen, ob der Parkschein noch gültig ist. — You want to know if your parking ticket is still valid."
        options:
          - { key: a, text: "Können Sie mir sagen, bis wann der Parkschein gilt?" }
          - { key: b, text: "Parkscheine interessieren mich nicht." }
          - { key: c, text: "Ich parke einfach ohne Schein." }
        answer: a
        why: "Eine konkrete Nachfrage verhindert eine unerwartete Strafe beim Verlassen des Parkhauses."
      - q: "Ein Verkäufer fragt, ob er dir helfen kann. — A salesperson asks if they can help you."
        options:
          - { key: a, text: "Nein, gehen Sie weg." }
          - { key: b, text: "Danke, ich schaue erst mal nur." }
          - { key: c, text: "Das geht Sie nichts an." }
        answer: b
        why: "Eine freundliche, kurze Antwort ist die übliche Reaktion, auch wenn man noch keine Hilfe braucht."
      - q: "Du hast dich im Zentrum verlaufen und findest den Ausgang nicht. — You've gotten lost in the mall and can't find the exit."
        options:
          - { key: a, text: "Am Info-Point oder bei einem Mitarbeiter nach dem Weg fragen." }
          - { key: b, text: "Einfach ziellos weiterlaufen." }
          - { key: c, text: "Aufgeben und dich hinsetzen." }
        answer: a
        why: "Nachzufragen ist der schnellste Weg, sich wieder zurechtzufinden."

