  - id: B4
    block: B
    type: true-false
    title: "Den Wegweiser und die Parkregeln lesen"
    instructions: |
      > **Einkaufszentrum Nordpark — Übersicht**
      >
      > - **Erdgeschoss:** Info-Point, Supermarkt, Drogerie.
      > - **1. Stock:** Mode, Schuhe.
      > - **2. Stock:** Sport, Elektronik.
      > - **Untergeschoss:** Parkhaus, Foodcourt.
      > - Öffnungszeiten: **Mo–Sa 9–20 Uhr**, sonntags geschlossen.
      > - **Parken:** die ersten **2 Stunden kostenlos**, danach **1 € pro
      >   Stunde**. Parkschein **vor der Ausfahrt am Kassenautomaten
      >   entwerten**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Der Info-Point befindet sich im Erdgeschoss. — The info point is on the ground floor."
        answer: true
        why: "So steht es ausdrücklich in der Übersicht."
      - q: "Sportartikel gibt es im ersten Stock. — Sports items are on the first floor."
        answer: false
        why: "Sport ist im zweiten Stock, im ersten Stock gibt es Mode und Schuhe."
      - q: "Der Foodcourt liegt im Untergeschoss. — The food court is in the basement."
        answer: true
        why: "„Untergeschoss: Parkhaus, Foodcourt.“"
      - q: "Das Zentrum hat auch sonntags geöffnet. — The mall is also open on Sundays."
        answer: false
        why: "Sonntags ist geschlossen."
      - q: "Die ersten zwei Stunden Parken sind kostenlos. — The first two hours of parking are free."
        answer: true
        why: "„Die ersten 2 Stunden kostenlos.“"
      - q: "Der Parkschein muss vor der Einfahrt entwertet werden. — The parking ticket must be validated before entering."
        answer: false
        why: "Der Parkschein wird vor der Ausfahrt entwertet, nicht vor der Einfahrt."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas nicht nach Plan läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du hast deinen Parkschein verloren. — You've lost your parking ticket."
        options:
          - { key: a, text: "Am Kassenautomaten oder beim Personal nach einer Lösung fragen." }
          - { key: b, text: "Einfach ohne Ticket durch die Schranke fahren." }
          - { key: c, text: "Das Auto stehen lassen." }
        answer: a
        why: "Meist gibt es eine Regelung für verlorene Parkscheine — nachfragen ist der richtige erste Schritt."
      - q: "Auch die größere Nummer passt noch nicht. — Even the bigger size still doesn't fit."
        options:
          - { key: a, text: "Die Hose trotzdem kaufen." }
          - { key: b, text: "Nach einer anderen Größe oder einem ähnlichen Modell fragen." }
          - { key: c, text: "Wortlos gehen." }
        answer: b
        why: "Weiter nachzufragen ist normal, bis die passende Größe oder ein Alternativmodell gefunden ist."
      - q: "Das Geschäft, das du suchst, hat schon geschlossen. — The store you're looking for has already closed."
        options:
          - { key: a, text: "Laut an die Tür klopfen." }
          - { key: b, text: "Vor der Tür warten, bis jemand öffnet." }
          - { key: c, text: "Am Info-Point nach den Öffnungszeiten fragen und einen anderen Tag planen." }
        answer: c
        why: "Die Öffnungszeiten zu klären hilft, den nächsten Besuch besser zu planen."
      - q: "Ihr habt euch im Zentrum aus den Augen verloren. — You've lost sight of each other in the mall."
        options:
          - { key: a, text: "Zum vereinbarten Treffpunkt gehen oder anrufen." }
          - { key: b, text: "Ziellos durch das Zentrum laufen." }
          - { key: c, text: "Allein nach Hause fahren." }
        answer: a
        why: "Ein vereinbarter Treffpunkt oder ein Anruf ist die schnellste Lösung."
      - q: "An der Kasse ist eine sehr lange Schlange. — There's a very long queue at the checkout."
        options:
          - { key: a, text: "Sich vordrängeln." }
          - { key: b, text: "Warten oder eine andere Kasse suchen." }
          - { key: c, text: "Die Ware einfach dalassen und gehen." }
        answer: b
        why: "Warten oder eine freiere Kasse suchen ist die einzig faire Lösung."
      - q: "Du merkst an der Kasse, dass dein Portemonnaie fehlt. — At the checkout you notice your wallet is missing."
        options:
          - { key: a, text: "Ruhig erklären und fragen, ob du die Ware kurz zurücklegen lassen kannst." }
          - { key: b, text: "Einfach mit der Ware weggehen." }
          - { key: c, text: "In Panik geraten und nichts sagen." }
        answer: a
        why: "Eine ruhige, ehrliche Erklärung ist die einfachste Lösung für diese unangenehme Situation."

