  - id: D2
    block: D
    type: free-write
    title: "Suchen, Anprobieren, Parken"
    prompt: "Schreib drei Teile: das Geschäft finden und anprobieren, ein Problem mit dem Parkschein und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du gehst mit einem Freund / einer Freundin ins Einkaufszentrum.
      Ihr sucht ein Sportgeschäft, probiert etwas an, und merkst später
      auf dem Weg zum Auto, dass der Parkschein weg ist.

      Beim Suchen und Anprobieren müssen vorkommen:
      1. am Info-Point nach dem Sportgeschäft fragen
      2. eine Hose anprobieren
      3. um eine andere Größe bitten

      Beim Problem müssen vorkommen:
      4. merken, dass der Parkschein fehlt
      5. zurück ins Zentrum gehen und nachfragen
      6. ruhig erklären, was passiert ist

      In der Lösung müssen vorkommen:
      7. eine Lösung für das fehlende Ticket erfahren
      8. euch für die Hilfe bedanken
      9. den Parkschein oder Ersatz entwerten
      10. gemeinsam zum Auto zurückgehen
    use:
      - "Wechselpräpositionen: „im zweiten Stock“, „am Info-Point“"
      - "höfliche Bitte: „Hätten Sie …?“"
      - "Modalverb: „Ich muss den Parkschein entwerten.“"
    selfCheck:
      - "Steht bei den Wechselpräpositionen der richtige Fall?"
      - "Ist die Bitte um eine andere Größe höflich formuliert?"
      - "Klingt die Erklärung zum fehlenden Parkschein ruhig, nicht panisch?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Suchen und Anprobieren**

      Ich: Entschuldigung, wo finde ich das Sportgeschäft?
      Info-Point: Das ist im zweiten Stock, gleich neben der Rolltreppe.
      (Im Geschäft)
      Ich: Diese Hose ist leider zu klein. Hätten Sie sie auch eine Nummer größer?
      Verkäuferin: Klar, ich schaue kurz nach.
      Verkäuferin: Hier, bitte probieren.
      Ich: Perfekt, die passt viel besser.

      **Das Problem**

      (Auf dem Weg zum Auto)
      Ich: Warte, wo ist mein Parkschein? Ich finde ihn nicht mehr.
      Freund: Lass uns zurück zum Info-Point gehen und nachfragen.
      Ich: Guten Tag, ich habe meinen Parkschein verloren — können Sie mir helfen?
      Mitarbeiter: Kein Problem, das kommt öfter vor. Ich zeige Ihnen, wie es geht.

      **Die Lösung**

      Mitarbeiter: Sie können am Kassenautomaten „Parkschein verloren“ auswählen und die Kennzeichennummer eingeben.
      Ich: Ah, super, das hätte ich nicht gewusst. Vielen Dank für die Hilfe.
      Mitarbeiter: Gern geschehen. Danach entwerten Sie den neuen Beleg wie gewohnt.
      Freund: Gut, dann können wir jetzt endlich zum Auto zurückgehen.
      Ich: Ja, und nächstes Mal passe ich besser auf den Parkschein auf.
