lesson: "SIT/49-einkaufszentrum-a2"
title: "Im Einkaufszentrum — A2"
topic: "Im Einkaufszentrum"
category: "Einkaufen"
level: A2
summary: "Ein Geschäft finden, in der Umkleide eine andere Größe erbitten, den Parkschein entwerten — und was tun, wenn man sich verläuft oder verliert."
intro: >
  Ein Einkaufszentrum ist groß genug, dass man sich leicht verläuft:
  welches Geschäft, welches Stockwerk, wo war noch mal der Info-Point?
  Dieses Set übt die Orientierung im Zentrum, das Gespräch in der
  Umkleide, wenn eine Größe nicht passt, und das Parken — inklusive dem
  Parkschein, der vor dem Verlassen entwertet werden muss. Grammatik
  nach Bedarf: Wechselpräpositionen (in, auf, zu), höfliche Bitten mit
  Konjunktiv II, Ordnungszahlen bei Stockwerken. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

