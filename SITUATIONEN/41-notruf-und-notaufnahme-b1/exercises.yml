lesson: "SIT/41-notruf-und-notaufnahme-b1"
title: "Notruf und Notaufnahme — B1"
topic: "Im Notfall"
category: "Sport & Gesundheit"
level: B1
summary: "112 oder 116 117, den Notruf strukturiert absetzen, in der Notaufnahme warten, Triage verstehen, Aufnahme und Entlassung."
intro: >
  Im Notfall auf Deutsch zu sprechen ist die Situation, auf die man sich
  am wenigsten vorbereitet und die am schlechtesten improvisiert wird.
  Dabei ist der Notruf streng strukturiert: Wo ist es passiert, was ist
  passiert, wie viele Betroffene, welche Verletzungen — und dann warten,
  bis die Leitstelle das Gespräch beendet. Genauso wichtig ist die
  Vorfrage: 112 ist der Rettungsdienst für echte Notfälle, 116 117 der
  ärztliche Bereitschaftsdienst für alles, was bis morgen nicht warten
  kann, aber kein Notfall ist. In der Notaufnahme entscheidet dann nicht
  die Reihenfolge, sondern die Triage. Grammatik nach Bedarf: Perfekt
  und Präteritum im Bericht, Passiv, indirekte Fragen, Konjunktiv II.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

