      - { text: "Verdacht auf Herzinfarkt", bucket: notruf }
      - { text: "starke Ohrenschmerzen nachts", bucket: bereitschaft }
      - { text: "eine Überweisung brauchen", bucket: praxis }
      - { text: "bewusstlose Person", bucket: notruf }
