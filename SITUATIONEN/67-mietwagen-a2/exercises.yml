lesson: "SIT/67-mietwagen-a2"
title: "Mietwagen abholen und Schaden melden — A2"
topic: "Mietwagen abholen und Schaden melden"
category: "Unterwegs"
level: A2
summary: "Den Mietwagen abholen, die Versicherung klären, das Auto vor der Fahrt prüfen — und was tun, wenn ein Schaden auftaucht oder die Rückgabe sich verzögert."
intro: >
  Bevor der Mietwagen die Auffahrt verlässt, gibt es einiges zu klären:
  den Mietvertrag unterschreiben, sich für oder gegen die
  Vollkaskoversicherung entscheiden, und das Auto gemeinsam mit der
  Vermietung auf vorhandene Schäden prüfen. Dieses Set übt genau das —
  den Wagen abholen, einen Kratzer im Übergabeprotokoll vermerken, und
  was zu tun ist, wenn bei der Abholung oder Rückgabe etwas schiefgeht.
  Grammatik nach Bedarf: Perfekt im Bericht, höfliche Fragen,
  Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
