  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Abholung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Wir {1} den Mietwagen um zehn Uhr abholen. (Modalverb, wir-Form)
      2. {2} Sie mir das Übergabeprotokoll zeigen? (können, Sie-Form)
      3. Ich {3} schon den Kratzer fotografiert. (haben, Perfekt)
      4. {4} wir die Vollkaskoversicherung dazubuchen? (sollen, wir-Form)
      5. Falls der Tank nicht voll {5}, zahlen wir extra. (sein, Präsens)
      6. Die Mitarbeiterin {6} uns das Auto gleich zeigen. (werden, Futur I)
      7. Wir {7} schon den Mietvertrag unterschrieben. (haben, Perfekt)
      8. {8} ich den Schaden sofort melden? (müssen, ich-Form)
    answers:
      "1": müssen
      "2": Können
      "3": habe
      "4": Sollen
      "5": ist
      "6": wird
      "7": haben
      "8": Muss

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Wir mieten das Auto bei einer bekannten {1}. (die Firma, bei der man ein Auto mietet)
      2. Bei der Abholung füllen wir gemeinsam das {2} aus. (das Dokument über den Zustand des Autos)
      3. Mit der {3} sind fast alle Schäden abgedeckt. (die Versicherung gegen fast alle Schäden)
      4. Bei einem Schaden zahlen wir nur die {4}. (der Betrag, den man selbst zahlen muss)
      5. Wir notieren den {5} bei der Abholung genau. (wie voll der Tank ist)
      6. Bei der {6} vergleichen wir den Zustand mit dem Protokoll. (das Zurückbringen des Mietwagens)
    answers:
      "1": Autovermietung
      "2": Übergabeprotokoll
      "3": Vollkaskoversicherung
      "4": Selbstbeteiligung
      "5": Tankfüllstand
      "6": Rückgabe

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beim Abholen des Mietwagens"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, wir möchten unseren {1} abholen, die Reservierung
      läuft auf Schmidt.
      — Einen Moment, ich hole den {2} und Sie unterschreiben ihn
      bitte.
      — Gerne. Was ist eigentlich mit der {3} — ist die schon
      inklusive?
      — Nein, die können Sie gegen Aufpreis dazubuchen, dann sinkt
      Ihre {4} auf null.
      — Gut, dann nehmen wir die.
      (bei der Fahrzeugübergabe)
      — Bevor wir losfahren, sollten wir das Auto kurz {5}.
      — Guter Punkt — schauen Sie, hier vorne ist schon ein {6}!
      — Stimmt, das {7} ich sofort im Übergabeprotokoll.
      — Und wie ist eigentlich der {8}?
      — Der Tank ist randvoll, das steht auch hier.
      — Perfekt, dann können wir {9}.
      — Vergessen Sie bei der {10} nicht, den Tank wieder
      aufzufüllen!
    bank: [MIETWAGEN, MIETVERTRAG, VOLLKASKOVERSICHERUNG, SELBSTBETEILIGUNG, BEGUTACHTEN, KRATZER, VERMERKE, TANKFÜLLSTAND, LOSFAHREN, RÜCKGABE, ABHOLSTATION, KILOMETERSTAND, ZUSATZFAHRER, KAUTION]
    answers:
      "1": MIETWAGEN
      "2": MIETVERTRAG
      "3": VOLLKASKOVERSICHERUNG
      "4": SELBSTBETEILIGUNG
      "5": BEGUTACHTEN
      "6": KRATZER
      "7": VERMERKE
      "8": TANKFÜLLSTAND
      "9": LOSFAHREN
      "10": RÜCKGABE

  - id: B2
    block: B
    type: single-choice
    title: "Abholen und Prüfen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest den reservierten Mietwagen abholen. — You want to pick up the reserved rental car."
        options:
          - { key: a, text: "Wir kommen einfach vorbei, ohne Reservierung." }
          - { key: b, text: "Wir möchten unseren Mietwagen abholen, die Reservierung läuft auf Schmidt." }
          - { key: c, text: "Autos interessieren mich nicht." }
        answer: b
        why: "Ein konkreter Hinweis auf Name und Reservierung beschleunigt die Abholung."
      - q: "Du möchtest wissen, ob die Vollkaskoversicherung schon inklusive ist. — You want to know if full coverage insurance is already included."
        options:
          - { key: a, text: "Versicherungen sind mir egal." }
          - { key: b, text: "Ich zahle sowieso alles selbst." }
          - { key: c, text: "Ist die Vollkaskoversicherung schon inklusive?" }
        answer: c
        why: "Eine direkte Frage klärt sofort, ob zusätzliche Kosten entstehen."
      - q: "Du entdeckst bei der Übergabe einen vorhandenen Kratzer. — You notice an existing scratch during the handover."
        options:
          - { key: a, text: "Das sollten wir sofort im Übergabeprotokoll vermerken." }
          - { key: b, text: "Kratzer sind doch nicht so wichtig." }
          - { key: c, text: "Wir sagen einfach nichts und fahren los." }
        answer: a
        why: "Ein sofortiger Vermerk schützt vor Ärger bei der Rückgabe."
      - q: "Du möchtest wissen, wie hoch die Selbstbeteiligung bei einem Schaden ist. — You want to know how high the deductible is in case of damage."
        options:
          - { key: a, text: "Selbstbeteiligung interessiert mich nicht." }
          - { key: b, text: "Wie hoch ist die Selbstbeteiligung bei einem Schaden?" }
          - { key: c, text: "Schäden zahle ich sowieso nie." }
        answer: b
        why: "Eine klare Frage zur Selbstbeteiligung vermeidet spätere Überraschungen."
      - q: "Du möchtest sicherstellen, dass der Tankfüllstand korrekt notiert wird. — You want to make sure the fuel level is correctly noted."
        options:
          - { key: a, text: "Der Tank interessiert mich nicht." }
          - { key: b, text: "Ich fülle den Tank sowieso nie auf." }
          - { key: c, text: "Ist der Tankfüllstand schon im Protokoll notiert?" }
        answer: c
        why: "Eine kurze Nachfrage sichert einen korrekten Eintrag im Protokoll."
      - q: "Du möchtest wissen, wo du das Auto bei der Rückgabe abgeben musst. — You want to know where to return the car."
        options:
          - { key: a, text: "Wo genau soll ich das Auto bei der Rückgabe abgeben?" }
          - { key: b, text: "Rückgabe ist mir zu kompliziert." }
          - { key: c, text: "Ich stelle das Auto einfach irgendwo ab." }
        answer: a
        why: "Eine klare Frage zum Rückgabeort vermeidet Missverständnisse."

