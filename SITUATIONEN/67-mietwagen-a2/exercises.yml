  - id: D2
    block: D
    type: free-write
    title: "Abholen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: den Mietwagen abholen und die Versicherung klären, ein Problem mit einem entdeckten Kratzer, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr holt einen reservierten Mietwagen ab und entscheidet euch für
      die Vollkaskoversicherung. Bei der Übergabe entdeckt ihr einen
      Kratzer, der offensichtlich schon vorher da war.

      Beim Abholen müssen vorkommen:
      1. den Mietwagen an der Abholstation abholen
      2. nach der Vollkaskoversicherung fragen
      3. den Mietvertrag unterschreiben

      Beim Problem müssen vorkommen:
      4. das Auto vor der Abfahrt begutachten
      5. einen vorhandenen Kratzer entdecken
      6. den Kratzer sofort im Übergabeprotokoll vermerken

      In der Lösung müssen vorkommen:
      7. den Tankfüllstand ebenfalls notieren
      8. beruhigt losfahren
      9. das Auto pünktlich zurückgeben
      10. sich über die problemlose Rückgabe freuen
    use:
      - "höfliche Frage: „Ist die Vollkaskoversicherung schon inklusive?“"
      - "Nebensatz mit falls: „Falls der Tank nicht voll ist, …“"
      - "Perfekt: „Wir haben den Kratzer vermerkt.“"
    selfCheck:
      - "Wird die Versicherungsfrage klar gestellt?"
      - "Klingt die Reaktion auf den Kratzer ruhig und sorgfältig?"
      - "Wird der Tankfüllstand ebenfalls erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Abholen**

      Ich: Guten Tag, wir möchten unseren Mietwagen abholen, die Reservierung läuft auf uns.
      Mitarbeiterin: Einen Moment, ich hole den Mietvertrag. Ist die Vollkaskoversicherung schon inklusive?
      Ich: Nein, aber wir buchen sie gerne dazu.
      Mitarbeiterin: Gut, dann sinkt Ihre Selbstbeteiligung auf null.

      **Das Problem**

      Freund: Bevor wir losfahren, sollten wir das Auto kurz begutachten.
      Ich: Guter Punkt — schau mal, hier vorne ist schon ein Kratzer!
      Freund: Stimmt, das vermerken wir sofort im Übergabeprotokoll.

      **Die Lösung**

      Ich: Und wie ist eigentlich der Tankfüllstand?
      Mitarbeiterin: Der Tank ist randvoll, das steht auch hier.
      Ich: Perfekt, dann können wir beruhigt losfahren.
      (eine Woche später)
      Ich: Wir haben das Auto pünktlich zurückgegeben, und alles hat problemlos geklappt!
