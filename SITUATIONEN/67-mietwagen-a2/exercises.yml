    type: categorize
    title: "Abholen, prüfen oder zurückgeben?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: abholen, label: "Abholen" }
      - { key: pruefen, label: "Prüfen" }
      - { key: zurueckgeben, label: "Zurückgeben" }
    tokens:
      - { text: "den Mietvertrag unterschreiben", bucket: abholen }
      - { text: "den Führerschein zeigen", bucket: abholen }
      - { text: "die Versicherung wählen", bucket: abholen }
      - { text: "die Schlüssel entgegennehmen", bucket: abholen }
      - { text: "das Auto von außen begutachten", bucket: pruefen }
      - { text: "einen vorhandenen Kratzer fotografieren", bucket: pruefen }
      - { text: "das Übergabeprotokoll ausfüllen", bucket: pruefen }
      - { text: "den Tankfüllstand notieren", bucket: pruefen }
      - { text: "den Tank auffüllen", bucket: zurueckgeben }
      - { text: "das Auto an der Abholstation zurückbringen", bucket: zurueckgeben }
      - { text: "das Übergabeprotokoll vergleichen", bucket: zurueckgeben }
      - { text: "die Endabrechnung erhalten", bucket: zurueckgeben }

