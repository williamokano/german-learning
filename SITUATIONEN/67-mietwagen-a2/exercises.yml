  - id: B4
    block: B
    type: true-false
    title: "Die Mietwagen-Infos lesen"
    instructions: |
      > **Info — Mietwagen**
      >
      > - **Übergabeprotokoll:** jeder vorhandene Schaden sollte
      >   **vor der Abfahrt** dokumentiert werden.
      > - **Vollkaskoversicherung:** meist **gegen Aufpreis**
      >   buchbar, senkt die Selbstbeteiligung oft auf null.
      > - **Tankregelung:** das Auto wird oft **voll übernommen und
      >   voll zurückgegeben**.
      > - **Zusatzfahrer:** müssen meist **vorab angemeldet**
      >   werden.
      > - **Mindestalter:** oft **ab 21 oder 25 Jahren**, je nach
      >   Fahrzeugklasse.
      > - **Rückgabe:** eine verspätete Rückgabe kann eine
      >   **zusätzliche Gebühr** kosten.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein vorhandener Schaden sollte vor der Abfahrt im Protokoll dokumentiert werden. — An existing defect should be documented in the report before departure."
        answer: true
        why: "So steht es ausdrücklich in den Mietwagen-Infos."
      - q: "Die Vollkaskoversicherung ist immer automatisch im Preis inklusive. — Full coverage insurance is always automatically included in the price."
        answer: false
        why: "Sie ist meist gegen Aufpreis buchbar, nicht automatisch inklusive."
      - q: "Das Auto wird oft voll übernommen und voll zurückgegeben. — The car is often handed over full and returned full."
        answer: true
        why: "„Tankregelung: das Auto wird oft voll übernommen und voll zurückgegeben.“"
      - q: "Ein Zusatzfahrer darf spontan ohne Anmeldung mitfahren. — An additional driver may ride along spontaneously without registration."
        answer: false
        why: "Zusatzfahrer müssen meist vorab angemeldet werden."
      - q: "Das Mindestalter für einen Mietwagen liegt bei manchen Fahrzeugklassen bei 21 oder 25 Jahren. — The minimum age for a rental car is 21 or 25 for some vehicle classes."
        answer: true
        why: "„Mindestalter: oft ab 21 oder 25 Jahren, je nach Fahrzeugklasse.“"
      - q: "Eine verspätete Rückgabe hat grundsätzlich keine Konsequenzen. — A late return has no consequences at all."
        answer: false
        why: "Sie kann eine zusätzliche Gebühr kosten."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Mietwagen etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Beim Abholen ist der reservierte Mietwagen nicht verfügbar. — The reserved rental car isn't available at pickup."
        options:
          - { key: a, text: "Einfach ohne Auto wieder nach Hause fahren." }
          - { key: b, text: "Nach einer gleichwertigen Alternative fragen." }
          - { key: c, text: "Laut am Schalter schimpfen, ohne nach Alternativen zu fragen." }
        answer: b
        why: "Eine Nachfrage nach einer gleichwertigen Alternative löst das Problem meist schnell."
      - q: "Ein Schaden am Auto wird erst nach der Abfahrt entdeckt. — Damage to the car is only discovered after departure."
        options:
          - { key: a, text: "Weiterfahren und den Schaden ignorieren." }
          - { key: b, text: "Den Schaden erst bei der Rückgabe erwähnen." }
          - { key: c, text: "Sofort anhalten, fotografieren und die Autovermietung informieren." }
        answer: c
        why: "Sofortiges Dokumentieren und Melden schützt vor späteren Missverständnissen."
      - q: "Bei der Rückgabe behauptet die Autovermietung einen neuen Schaden, den man nicht verursacht hat. — At return, the rental company claims a new defect you didn't cause."
        options:
          - { key: a, text: "Auf das eigene Übergabeprotokoll und die Fotos verweisen." }
          - { key: b, text: "Den Schaden einfach kommentarlos bezahlen." }
          - { key: c, text: "Sich streiten, ohne Beweise vorzulegen." }
        answer: a
        why: "Das eigene Protokoll und Fotos sind der beste Beweis gegen eine falsche Behauptung."
      - q: "Der Tank ist bei der Abholung nicht ganz voll, obwohl es vereinbart war. — The tank isn't quite full at pickup, although it was agreed."
        options:
          - { key: a, text: "Einfach losfahren, ohne etwas zu sagen." }
          - { key: b, text: "Das sofort im Protokoll vermerken lassen." }
          - { key: c, text: "Den fehlenden Sprit selbst stillschweigend akzeptieren." }
        answer: b
        why: "Ein sofortiger Vermerk verhindert, dass man später dafür bezahlen muss."
      - q: "Die gebuchte Vollkaskoversicherung wurde nicht korrekt eingetragen. — The booked full coverage insurance wasn't entered correctly."
        options:
          - { key: a, text: "Die falsche Buchung einfach akzeptieren." }
          - { key: b, text: "Wortlos das Auto stehen lassen und gehen." }
          - { key: c, text: "Freundlich, aber bestimmt auf die Buchung verweisen und korrigieren lassen." }
        answer: c
        why: "Ein Verweis auf die ursprüngliche Buchung führt meist zu einer schnellen Korrektur."
      - q: "Man kommt zur Rückgabe später als vereinbart. — You'll return the car later than agreed."
        options:
          - { key: a, text: "Die Autovermietung rechtzeitig vorher informieren." }
          - { key: b, text: "Einfach zu spät kommen, ohne Bescheid zu geben." }
          - { key: c, text: "Das Auto woanders abstellen und nichts sagen." }
        answer: a
        why: "Eine rechtzeitige Information vermeidet zusätzliche Probleme bei der Rückgabe."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der reservierte Mietwagen war leider nicht {1}. (nicht zu bekommen)
      2. Wir haben den Schaden sofort {2}. (mit der Kamera festgehalten, Partizip)
      3. Wir haben auf unser eigenes Übergabeprotokoll {3}. (hingewiesen, Partizip)
      4. Der Tank war bei der Abholung nicht ganz {4}. (komplett gefüllt)
      5. Die Vollkaskoversicherung wurde falsch {5}. (im System festgehalten, Partizip)
      6. Wir haben die Verspätung rechtzeitig {6}. (Bescheid gegeben, Partizip)
    answers:
      "1": verfügbar
      "2": fotografiert
      "3": verwiesen
      "4": voll
      "5": eingetragen
      "6": mitgeteilt

