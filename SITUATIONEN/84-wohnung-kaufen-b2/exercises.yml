  - id: D2
    block: D
    type: free-write
    title: "Besichtigen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: die Eigentumswohnung besichtigen und die Finanzierung besprechen, ein Problem, weil die erste Bank ablehnt, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr besichtigt eine Eigentumswohnung und geht danach zur Bank,
      um die Finanzierung zu besprechen. Überraschend lehnt die Bank
      die Finanzierung ab.

      Beim Besichtigen müssen vorkommen:
      1. die Eigentumswohnung ansehen
      2. nach dem Hausgeld fragen
      3. den Energieausweis einsehen

      Beim Problem müssen vorkommen:
      4. erfahren, dass die Bank ablehnt
      5. sich nach dem Grund erkundigen
      6. bei einer zweiten Bank ein Angebot einholen

      In der Lösung müssen vorkommen:
      7. von der zweiten Bank eine Zusage bekommen
      8. einen Notartermin vereinbaren
      9. den Kaufvertrag unterschreiben
      10. sich über den gelungenen Kauf freuen
    use:
      - "höfliche Frage: „Können Sie uns den Energieausweis zeigen?“"
      - "Nebensatz mit falls: „Falls die Kaufnebenkosten höher sind, …“"
      - "Perfekt: „Wir haben die Eintragung beantragt.“"
    selfCheck:
      - "Wird die Besichtigung klar beschrieben?"
      - "Klingt die Reaktion auf die Ablehnung ruhig und lösungsorientiert?"
      - "Wird der Notartermin als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Besichtigen**

      Ich: Guten Tag, wir würden uns gerne die Eigentumswohnung ansehen, die zum Verkauf steht.
      Makler: Gerne, hier ist auch gleich der Energieausweis.
      Ich: Danke, und wie hoch ist das monatliche Hausgeld?
      Makler: Etwa 250 Euro.

      **Das Problem**

      (bei der ersten Bank)
      Bank 1: Leider müssen wir die Finanzierung ablehnen.
      Ich: Das überrascht mich, aber dann fragen wir einfach bei einer anderen Bank nach.
      (bei der zweiten Bank)
      Bank 2: Wir können Ihnen ein gutes Angebot machen.

      **Die Lösung**

      Ich: Perfekt, dann vereinbaren wir gleich einen Notartermin.
      (beim Notar)
      Notar: Dann gehen wir jetzt den Kaufvertrag durch.
      Ich: Endlich geschafft — was für ein aufregender Tag!
