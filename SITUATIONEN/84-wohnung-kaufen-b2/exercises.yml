  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Besichtigen, finanzieren, beurkunden"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, wir würden uns gerne die {1} ansehen, die zum
      Verkauf steht.
      — Natürlich, kommen Sie mit. Hier ist übrigens auch gleich
      der {2}, falls Sie den Energieverbrauch sehen möchten.
      — Danke, das interessiert uns sehr. Und wie hoch ist
      eigentlich das monatliche {3}?
      — Etwa 250 Euro, das deckt die Instandhaltung und
      Verwaltung.
      (bei der Bank)
      — Guten Tag, wir möchten die {4} für den Kauf einer
      Eigentumswohnung besprechen.
      — Gerne. Haben Sie schon eine Vorstellung von den {5}?
      — Ungefähr, aber wir sind uns bei der {6} noch unsicher.
      — Die liegt in der Regel bei etwa sechs Prozent des
      Kaufpreises.
      — Gut zu wissen, danke.
      (beim Notar)
      — Guten Tag, wir sind heute wegen des {7} hier.
      — Perfekt, dann gehen wir gleich den Kaufvertrag durch.
      Nach der Unterschrift {8} ich die Eintragung ins {9}.
      — Wie lange dauert das ungefähr?
      — Meistens ein paar Wochen. Ich {10} Sie, sobald alles
      erledigt ist.
