lesson: "SIT/84-wohnung-kaufen-b2"
title: "Eine Wohnung kaufen — B2"
topic: "Eine Wohnung kaufen"
category: "Einkaufen"
level: B2
summary: "Eine Eigentumswohnung besichtigen, die Finanzierung mit der Bank klären, den Notartermin wahrnehmen — und was tun, wenn die Bank ablehnt oder sich die Grundbucheintragung verzögert."
intro: >
  Der Kauf einer Eigentumswohnung braucht Vorbereitung: die Wohnung
  besichtigen, die Finanzierung mit der Bank klären, die
  Kaufnebenkosten und die Grunderwerbsteuer einplanen, und am Ende den
  Notartermin wahrnehmen. Dieses Set übt genau das — besichtigen,
  finanzieren, kaufen, und was zu tun ist, wenn die Bank die
  Finanzierung ablehnt oder sich die Grundbucheintragung verzögert.
  Grammatik nach Bedarf: Perfekt und Passiv im Bericht, Nebensätze mit
  falls. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

