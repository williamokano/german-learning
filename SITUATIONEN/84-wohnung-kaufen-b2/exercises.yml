    answers:
      "1": EIGENTUMSWOHNUNG
      "2": ENERGIEAUSWEIS
      "3": HAUSGELD
      "4": FINANZIERUNG
      "5": KAUFNEBENKOSTEN
      "6": GRUNDERWERBSTEUER
      "7": NOTARTERMINS
      "8": BEANTRAGE
      "9": GRUNDBUCH
      "10": INFORMIERE

  - id: B2
    block: B
    type: single-choice
    title: "Besichtigen und Finanzieren"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest eine inserierte Eigentumswohnung besichtigen. — You want to view an advertised condo."
        options:
          - { key: a, text: "Eigentumswohnungen interessieren mich nicht." }
          - { key: b, text: "Wir würden uns gerne die Eigentumswohnung ansehen, die zum Verkauf steht." }
          - { key: c, text: "Ich kaufe sowieso nur Häuser." }
        answer: b
        why: "Eine höfliche, konkrete Anfrage ist der übliche Einstieg bei der Besichtigung."
      - q: "Du möchtest wissen, wie hoch das monatliche Hausgeld ist. — You want to know the monthly maintenance fee."
        options:
          - { key: a, text: "Hausgeld interessiert mich nicht." }
          - { key: b, text: "Kosten sind mir egal." }
          - { key: c, text: "Wie hoch ist eigentlich das monatliche Hausgeld?" }
        answer: c
        why: "Eine direkte Frage klärt die laufenden Kosten der Eigentumswohnung."
      - q: "Du möchtest bei der Bank die Finanzierung besprechen. — You want to discuss financing with the bank."
        options:
          - { key: a, text: "Wir möchten die Finanzierung für den Kauf einer Eigentumswohnung besprechen." }
          - { key: b, text: "Finanzierung ist mir zu kompliziert." }
          - { key: c, text: "Ich zahle sowieso alles bar." }
        answer: a
        why: "Eine klare Aussage ist der übliche Einstieg beim Bankgespräch."
      - q: "Du möchtest wissen, wie hoch die Grunderwerbsteuer ist. — You want to know how high the property transfer tax is."
        options:
          - { key: a, text: "Steuern interessieren mich nicht." }
          - { key: b, text: "Wie hoch ist eigentlich die Grunderwerbsteuer?" }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig diese wichtige Nebenkostenposition."
      - q: "Du bist beim Notartermin und möchtest den Kaufvertrag durchgehen. — You're at the notary appointment and want to go through the contract."
        options:
          - { key: a, text: "Verträge interessieren mich nicht." }
          - { key: b, text: "Das eilt doch nicht." }
          - { key: c, text: "Dann gehen wir gleich den Kaufvertrag durch." }
        answer: c
        why: "Ein direkter Vorschlag ist der übliche Beginn des Notartermins."
      - q: "Du möchtest wissen, wie lange die Grundbucheintragung dauert. — You want to know how long the land register entry takes."
        options:
          - { key: a, text: "Wie lange dauert die Eintragung ins Grundbuch ungefähr?" }
          - { key: b, text: "Das Grundbuch interessiert mich nicht." }
          - { key: c, text: "Ich frage da lieber nicht nach." }
        answer: a
        why: "Eine direkte Frage klärt, wann der Kauf endgültig abgeschlossen ist."

