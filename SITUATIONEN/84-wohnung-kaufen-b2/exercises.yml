  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Wohnungskauf lesen"
    instructions: |
      > **Info — Eine Wohnung kaufen**
      >
      > - **Kaufnebenkosten:** liegen meist zwischen **10 und 15
      >   Prozent** des Kaufpreises.
      > - **Grunderwerbsteuer:** je nach Bundesland zwischen **3,5
      >   und 6,5 Prozent**.
      > - **Notartermin:** ist beim Immobilienkauf **gesetzlich
      >   vorgeschrieben**.
      > - **Grundbucheintragung:** dauert oft **mehrere Wochen**.
      > - **Hausgeld:** deckt unter anderem **Instandhaltung und
      >   Verwaltung**.
      > - **Energieausweis:** muss dem Käufer **spätestens bei der
      >   Besichtigung** vorgelegt werden.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Kaufnebenkosten liegen meist zwischen 10 und 15 Prozent des Kaufpreises. — Closing costs are usually between 10 and 15 percent of the purchase price."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Wohnungskauf."
      - q: "Die Grunderwerbsteuer ist in ganz Deutschland exakt gleich hoch. — The property transfer tax is exactly the same everywhere in Germany."
        answer: false
        why: "Sie liegt je nach Bundesland zwischen 3,5 und 6,5 Prozent, nicht überall gleich."
      - q: "Ein Notartermin ist beim Immobilienkauf gesetzlich vorgeschrieben. — A notary appointment is legally required for a property purchase."
        answer: true
        why: "„Notartermin: ist beim Immobilienkauf gesetzlich vorgeschrieben.“"
      - q: "Die Grundbucheintragung ist meist noch am selben Tag abgeschlossen. — The land register entry is usually completed the same day."
        answer: false
        why: "Sie dauert oft mehrere Wochen, nicht nur einen Tag."
      - q: "Das Hausgeld deckt unter anderem Instandhaltung und Verwaltung. — The maintenance fee covers upkeep and administration, among other things."
        answer: true
        why: "„Hausgeld: deckt unter anderem Instandhaltung und Verwaltung.“"
      - q: "Der Energieausweis muss erst nach dem Einzug vorgelegt werden. — The energy certificate only needs to be shown after moving in."
        answer: false
        why: "Er muss spätestens bei der Besichtigung vorgelegt werden, nicht erst nach dem Einzug."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Wohnungskauf etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die Bank lehnt die Finanzierung überraschend ab. — The bank unexpectedly rejects the financing."
        options:
          - { key: a, text: "Sofort den Kauf komplett aufgeben." }
          - { key: b, text: "Bei mehreren anderen Banken Angebote einholen." }
          - { key: c, text: "Sich mit einem viel zu hohen Zinssatz zufriedengeben." }
        answer: b
        why: "Mehrere Angebote zu vergleichen erhöht die Chance auf eine passende Finanzierung."
      - q: "Beim Notartermin fällt ein Fehler im Kaufvertrag auf. — An error in the contract is noticed at the notary appointment."
        options:
          - { key: a, text: "Den Fehler ignorieren und trotzdem unterschreiben." }
          - { key: b, text: "Den Notartermin wortlos verlassen." }
          - { key: c, text: "Den Fehler sofort ansprechen und die Beurkundung verschieben lassen." }
        answer: c
        why: "Ein sofort angesprochener Fehler verhindert einen fehlerhaften Vertrag."
      - q: "Die tatsächlichen Kaufnebenkosten sind höher als ursprünglich berechnet. — The actual closing costs are higher than originally calculated."
        options:
          - { key: a, text: "Die Finanzierung mit der Bank neu durchrechnen." }
          - { key: b, text: "Den Kauf trotzdem ohne Anpassung durchziehen." }
          - { key: c, text: "Die höheren Kosten einfach ignorieren." }
        answer: a
        why: "Eine neue Berechnung mit der Bank sichert eine solide Finanzierung."
      - q: "Die Eintragung ins Grundbuch verzögert sich erheblich. — The land register entry is significantly delayed."
        options:
          - { key: a, text: "Einfach endlos weiter warten, ohne nachzufragen." }
          - { key: b, text: "Beim Grundbuchamt höflich nach dem Bearbeitungsstand fragen." }
          - { key: c, text: "Den Kauf für gescheitert erklären." }
        answer: b
        why: "Eine höfliche Nachfrage klärt meist schnell, woran die Verzögerung liegt."
      - q: "Nach dem Einzug zeigt sich ein Mangel, der beim Kauf nicht sichtbar war. — After moving in, a defect appears that wasn't visible at purchase."
        options:
          - { key: a, text: "Den Mangel selbst bezahlen, ohne nachzufragen." }
          - { key: b, text: "Den Verkäufer beschuldigen, ohne die Rechtslage zu prüfen." }
          - { key: c, text: "Prüfen, ob eine Gewährleistung besteht." }
        answer: c
        why: "Eine Prüfung der Gewährleistung klärt, ob der Verkäufer haftet."
      - q: "Das Hausgeld wird plötzlich deutlich erhöht. — The maintenance fee is suddenly raised significantly."
        options:
          - { key: a, text: "Sich die Begründung in der Eigentümerversammlung genau erklären lassen." }
          - { key: b, text: "Die Erhöhung kommentarlos akzeptieren." }
          - { key: c, text: "Sofort ausziehen, ohne nachzufragen." }
        answer: a
        why: "Eine genaue Erklärung in der Eigentümerversammlung klärt, ob die Erhöhung gerechtfertigt ist."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die Bank hat die Finanzierung überraschend {1}. (nicht genehmigt, Partizip)
      2. Beim Notartermin ist ein Fehler {2}. (bemerkt worden, Partizip)
      3. Die Kaufnebenkosten waren höher als ursprünglich {3}. (kalkuliert, Partizip)
      4. Die Eintragung ins Grundbuch hat sich erheblich {4}. (später als geplant, Partizip)
      5. Nach dem Einzug haben wir einen Mangel {5}. (gefunden, Partizip)
      6. Das Hausgeld wurde plötzlich deutlich {6}. (höher gesetzt, Partizip)
    answers:
      "1": abgelehnt
      "2": aufgefallen
      "3": berechnet
      "4": verzögert
      "5": entdeckt
      "6": erhöht

