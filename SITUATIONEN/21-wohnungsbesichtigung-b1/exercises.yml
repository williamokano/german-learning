lesson: "SIT/21-wohnungsbesichtigung-b1"
title: "Wohnungsbesichtigung — B1"
topic: "Eine Wohnung besichtigen"
category: "Wohnen & Nachbarschaft"
level: B1
summary: "Das Inserat lesen, einen Termin machen, bei der Besichtigung die richtigen Fragen stellen und danach nachfassen."
intro: >
  Zwanzig Leute, zwanzig Minuten, eine Wohnung: Bei einer Besichtigung
  entscheidet sich in kurzer Zeit, ob du in die engere Auswahl kommst.
  Dabei geht es um zwei Dinge gleichzeitig — du musst selbst
  herausfinden, was das Inserat verschweigt (Nebenkosten, Heizung,
  Kaution, Küche, Renovierung), und du musst als Mieterin oder Mieter
  überzeugen, ohne dich anzubiedern. Danach kommt das Nachfassen: eine
  kurze Mail, die Unterlagen, und die Absage, die du höflich
  beantwortest. Grammatik nach Bedarf: indirekte Fragen, Konjunktiv II,
  Passiv und Relativsätze. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

