    type: categorize
    title: "Ansprechen, zuhören oder lösen?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: ansprechen, label: "Ansprechen" }
      - { key: zuhoeren, label: "Zuhören" }
      - { key: loesen, label: "Lösen" }
    tokens:
      - { text: "den Konflikt offen ansprechen", bucket: ansprechen }
      - { text: "um ein Vier-Augen-Gespräch bitten", bucket: ansprechen }
      - { text: "konkrete Beispiele nennen", bucket: ansprechen }
      - { text: "die eigene Sichtweise erklären", bucket: ansprechen }
      - { text: "der anderen Person zuhören", bucket: zuhoeren }
      - { text: "Verständnis zeigen", bucket: zuhoeren }
      - { text: "Rückfragen stellen", bucket: zuhoeren }
      - { text: "die Perspektive der Kollegin nachvollziehen", bucket: zuhoeren }
      - { text: "gemeinsam eine Lösung suchen", bucket: loesen }
      - { text: "einen Kompromiss finden", bucket: loesen }
      - { text: "die Zusammenarbeit verbessern", bucket: loesen }
      - { text: "das Ergebnis schriftlich festhalten", bucket: loesen }

