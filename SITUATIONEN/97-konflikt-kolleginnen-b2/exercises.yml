  - id: D2
    block: D
    type: free-write
    title: "Ansprechen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: einen Konflikt mit einer Kollegin ansprechen, ein Problem, weil sie zuerst defensiv reagiert, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du sprichst einen Konflikt mit deiner Kollegin an, weil du dich
      bei der letzten Präsentation kritisiert gefühlt hast. Sie
      reagiert zuerst sehr defensiv.

      Beim Ansprechen müssen vorkommen:
      1. um ein Vier-Augen-Gespräch bitten
      2. den Konflikt offen ansprechen
      3. ein konkretes Beispiel nennen

      Beim Problem müssen vorkommen:
      4. eine defensive Reaktion bekommen
      5. sich kurz unsicher fühlen
      6. ruhig bleiben

      In der Lösung müssen vorkommen:
      7. der Kollegin zuhören
      8. ein Missverständnis aufklären
      9. einen Kompromiss finden
      10. sich über die Klärung freuen
    use:
      - "höfliche Frage: „Können wir kurz unter vier Augen sprechen?“"
      - "Perfekt: „Ich habe meine Sichtweise erklärt.“"
      - "Futur I: „Wir werden in Zukunft ehrlicher miteinander reden.“"
    selfCheck:
      - "Wird das Ansprechen des Konflikts klar beschrieben?"
      - "Klingt die Reaktion auf die defensive Antwort realistisch?"
      - "Wird der Kompromiss als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Ansprechen**

      Ich: Können wir kurz unter vier Augen sprechen?
      Ich spreche den Konflikt offen an und nenne ein konkretes Beispiel.

      **Das Problem**

      Meine Kollegin reagiert zuerst sehr defensiv.
      Ich fühle mich kurz unsicher, bleibe aber ruhig.
      Ich höre ihr aufmerksam zu.

      **Die Lösung**

      Wir merken, dass es nur ein Missverständnis war.
      Wir finden gemeinsam einen guten Kompromiss.
      Wir werden in Zukunft ehrlicher miteinander reden.
      Ich freue mich sehr über die Klärung.
