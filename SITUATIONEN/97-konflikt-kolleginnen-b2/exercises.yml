lesson: "SIT/97-konflikt-kolleginnen-b2"
title: "Konflikt mit Kolleginnen ansprechen — B2"
topic: "Konflikt mit Kolleginnen ansprechen"
category: "Arbeit & Studium"
level: B2
summary: "Einen Konflikt mit einer Kollegin unter vier Augen ansprechen, konkrete Beispiele nennen und der anderen Sichtweise zuhören — und was tun, wenn die Reaktion defensiv ausfällt oder das Gespräch eskaliert."
intro: >
  Ein Konflikt im Team klärt sich selten von allein: um ein Gespräch
  unter vier Augen bitten, den Konflikt offen ansprechen und konkrete
  Beispiele nennen. Dieses Set übt genau das — ansprechen, zuhören,
  lösen, und was zu tun ist, wenn die Kollegin defensiv reagiert oder
  das Gespräch eskaliert. Grammatik nach Bedarf: Modalverben, Perfekt
  und Futur I. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn
  es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

