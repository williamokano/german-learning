  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Konflikt vorbereiten"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} gestern ein Gespräch mit meiner Kollegin gesucht. (haben, Perfekt)
      2. {2} wir kurz unter vier Augen sprechen? (können, wir-Form)
      3. Man {3} Konflikte möglichst früh ansprechen. (sollen, Präsens)
      4. {4} das Missverständnis schon geklärt worden? (sein, Perfekt Passiv)
      5. Falls die Situation weiter angespannt {5}, sollten wir die Teamleitung einbeziehen. (sein, Präsens)
      6. Meine Kollegin {6} sich das sicher noch einmal überlegen. (werden, Futur I)
      7. Ich {7} schon meine Sichtweise erklärt. (haben, Perfekt)
      8. {8} wir gemeinsam eine Lösung finden? (können, wir-Form)
    answers:
      "1": habe
      "2": Können
      "3": soll
      "4": Ist
      "5": ist
      "6": wird
      "7": habe
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte den {1} offen ansprechen. (die Meinungsverschiedenheit zwischen zwei Personen)
      2. Ich glaube, das war nur ein {2}. (eine falsche Interpretation einer Aussage)
      3. Deine {3} war für mich schwer nachzuvollziehen. (die Bewertung eines Verhaltens)
      4. Ich hätte gern ein ehrliches {4} von dir. (die Rückmeldung zu einer Leistung)
      5. Mir ist eine gute {5} im Team sehr wichtig. (das gemeinsame Arbeiten)
      6. Am Ende haben wir einen guten {6} gefunden. (eine Lösung, bei der beide nachgeben)
    answers:
      "1": Konflikt
      "2": Missverständnis
      "3": Kritik
      "4": Feedback
      "5": Zusammenarbeit
      "6": Kompromiss

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Ansprechen, klären, vereinbaren"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (im Besprechungsraum)
      — Danke, dass du dir Zeit für dieses {1} nimmst.
      — Gerne, worum geht es dir?
      — Ich möchte einen {2} zwischen uns ansprechen, der mich seit
      ein paar Wochen beschäftigt.
      — Okay, erzähl mir mehr.
      — Bei der letzten Präsentation hatte ich das Gefühl, dass du
      meine Arbeit vor dem Team {3} hast.
      — Das tut mir leid, das war nicht meine Absicht.
      — Ich glaube, das war vielleicht nur ein {4}.
      — Kann sein. Kannst du mir ein Beispiel nennen?
      — Klar, als du gesagt hast, die Analyse sei „nicht ganz
      durchdacht“.
      — Ah, ich verstehe. Das war als konstruktives {5} gemeint,
      nicht als Vorwurf.
      — Das erklärt einiges, danke für die Klärung.
      — Mir ist unsere {6} sehr wichtig, deshalb bin ich froh, dass
      wir das ansprechen.
      — Mir auch. Lass uns einen {7} finden, wie wir in Zukunft
      Feedback geben.
      — Gute Idee. Sollen wir dafür feste Regeln {8}?
      — Ja, das {9} uns beiden helfen.
      — Perfekt, ich {10} mich, dass wir das geklärt haben.
    bank: [GESPRÄCH, KONFLIKT, STREIT, KRITISIERT, VORWURF, MISSVERSTÄNDNIS, ENTSCHULDIGUNG, FEEDBACK, TEAMLEITUNG, ZUSAMMENARBEIT, KOMPROMISS, VEREINBAREN, WIRD, FREUE]
    answers:
      "1": GESPRÄCH
      "2": KONFLIKT
      "3": KRITISIERT
      "4": MISSVERSTÄNDNIS
      "5": FEEDBACK
      "6": ZUSAMMENARBEIT
      "7": KOMPROMISS
      "8": VEREINBAREN
      "9": WIRD
      "10": FREUE

  - id: B2
    block: B
    type: single-choice
    title: "Ansprechen und erklären"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst deiner Kollegin sagen, dass du einen Konflikt ansprechen möchtest. — You want to tell your colleague you'd like to address a conflict."
        options:
          - { key: a, text: "Konflikte interessieren mich nicht." }
          - { key: b, text: "Ich möchte einen Konflikt zwischen uns ansprechen." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg in ein solches Gespräch."
      - q: "Du willst wissen, ob ihr gemeinsam eine Lösung finden könnt. — You want to know if you can find a solution together."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Können wir gemeinsam eine Lösung finden?" }
        answer: c
        why: "Eine direkte Frage öffnet den Weg zu einer gemeinsamen Lösung."
      - q: "Du willst deiner Kollegin erklären, wie du die Situation erlebt hast. — You want to explain to your colleague how you experienced the situation."
        options:
          - { key: a, text: "Ich hatte das Gefühl, dass meine Arbeit kritisiert wurde." }
          - { key: b, text: "Situationen interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine Ich-Botschaft erklärt die eigene Sichtweise, ohne Vorwürfe zu machen."
      - q: "Du willst wissen, ob ihr feste Regeln für Feedback vereinbaren könnt. — You want to know if you can agree on fixed rules for feedback."
        options:
          - { key: a, text: "Regeln interessieren mich nicht." }
          - { key: b, text: "Sollen wir feste Regeln für Feedback vereinbaren?" }
          - { key: c, text: "Das ist mir egal, Hauptsache wir reden nicht mehr darüber." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig einen gemeinsamen Umgang für die Zukunft."
      - q: "Du willst wissen, wie deine Kollegin ihre Kritik eigentlich gemeint hat. — You want to know how your colleague actually meant her criticism."
        options:
          - { key: a, text: "Kritik interessiert mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie hast du deine Kritik eigentlich gemeint?" }
        answer: c
        why: "Eine direkte Frage klärt Missverständnisse am schnellsten."
      - q: "Du willst dich dafür bedanken, dass sie sich Zeit für das Gespräch genommen hat. — You want to thank her for taking the time for the conversation."
        options:
          - { key: a, text: "Danke, dass du dir Zeit für dieses Gespräch nimmst." }
          - { key: b, text: "Gespräche interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Ein höflicher Dank ist der übliche Einstieg in ein klärendes Gespräch."

  - id: B3
    block: B
    type: order
    title: "Sätze zum Konflikt bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "einen", "Konflikt", "ansprechen"]
        answer: [0, 1, 2, 3, 4]
        note: "höfliche Aussage, Infinitiv am Ende"
      - tiles: ["Können", "wir", "kurz", "unter", "vier", "Augen", "sprechen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "höfliche Frage mit Modalverb"
      - tiles: ["Wir", "suchen", "gemeinsam", "eine", "Lösung"]
        answer: [0, 1, 2, 3, 4]
        note: "Aussage, Verb an Position 2"
      - tiles: ["Morgen", "werden", "wir", "feste", "Regeln", "vereinbaren"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Futur I, Zeitangabe an Position 1, Verb an Position 2"
      - tiles: ["Wie", "hast", "du", "das", "eigentlich", "gemeint", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "W-Frage im Perfekt"
      - tiles: ["Ich", "habe", "schon", "meine", "Sichtweise", "erklärt"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Konflikt lesen"
    instructions: |
      > **Info — Konflikt mit Kolleginnen ansprechen**
      >
      > - **Timing:** Konflikte sollte man **möglichst früh** und
      >   **nicht vor der ganzen Gruppe** ansprechen.
      > - **Ich-Botschaften:** wirken **weniger vorwurfsvoll** als
      >   direkte Anschuldigungen.
      > - **Zuhören:** die Sichtweise der anderen Person **ernst
      >   nehmen**, bevor man reagiert.
      > - **Konkrete Beispiele:** helfen, **Missverständnisse zu
      >   klären**.
      > - **Vier-Augen-Gespräch:** ist meist **besser geeignet** als
      >   eine Diskussion vor dem ganzen Team.
      > - **Ergebnis:** eine **gemeinsame Vereinbarung** hilft, den
      >   Konflikt langfristig zu lösen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Konflikte sollte man möglichst früh und nicht vor der ganzen Gruppe ansprechen. — Conflicts should be addressed as early as possible and not in front of the whole group."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Konflikt."
      - q: "Direkte Anschuldigungen wirken weniger vorwurfsvoll als Ich-Botschaften. — Direct accusations sound less accusatory than I-statements."
        answer: false
        why: "Ich-Botschaften wirken weniger vorwurfsvoll als direkte Anschuldigungen."
      - q: "Man sollte die Sichtweise der anderen Person ernst nehmen, bevor man reagiert. — You should take the other person's perspective seriously before reacting."
        answer: true
        why: "„Zuhören: die Sichtweise der anderen Person ernst nehmen, bevor man reagiert.“"
      - q: "Konkrete Beispiele machen Missverständnisse eher noch größer. — Concrete examples make misunderstandings even bigger."
        answer: false
        why: "Konkrete Beispiele helfen, Missverständnisse zu klären, nicht sie zu vergrößern."
      - q: "Ein Vier-Augen-Gespräch ist meist besser geeignet als eine Diskussion vor dem ganzen Team. — A one-on-one conversation is usually better suited than a discussion in front of the whole team."
        answer: true
        why: "„Vier-Augen-Gespräch: ist meist besser geeignet als eine Diskussion vor dem ganzen Team.“"
      - q: "Eine gemeinsame Vereinbarung ist für die langfristige Lösung nicht wichtig. — A joint agreement isn't important for a long-term solution."
        answer: false
        why: "Eine gemeinsame Vereinbarung hilft, den Konflikt langfristig zu lösen."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Konfliktgespräch etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ihre Kollegin reagiert im Gespräch sehr defensiv. — Your colleague reacts very defensively in the conversation."
        options:
          - { key: a, text: "Sofort noch lauter werden." }
          - { key: b, text: "Ruhig bleiben und die eigene Sichtweise sachlich wiederholen." }
          - { key: c, text: "Das Gespräch sofort abbrechen." }
        answer: b
        why: "Ruhe und Sachlichkeit wirken deeskalierend auf eine defensive Reaktion."
      - q: "Das Gespräch eskaliert und wird immer emotionaler. — The conversation escalates and becomes increasingly emotional."
        options:
          - { key: a, text: "Einfach weiter streiten, bis jemand nachgibt." }
          - { key: b, text: "Sich beleidigt zurückziehen, ohne etwas zu sagen." }
          - { key: c, text: "Eine kurze Pause vorschlagen und später ruhiger weiterreden." }
        answer: c
        why: "Eine Pause gibt beiden Seiten Zeit, sich zu beruhigen."
      - q: "Ihre Kollegin bestreitet, dass der Vorfall überhaupt passiert ist. — Your colleague denies that the incident even happened."
        options:
          - { key: a, text: "Ruhig konkrete Beispiele und Fakten nennen." }
          - { key: b, text: "Laut werden, um sie zu überzeugen." }
          - { key: c, text: "Das Thema sofort fallen lassen." }
        answer: a
        why: "Konkrete Beispiele machen den Vorfall nachvollziehbar."
      - q: "Eine dritte Kollegin mischt sich ungefragt in das Gespräch ein. — A third colleague uninvitedly interjects in the conversation."
        options:
          - { key: a, text: "Sie einfach ignorieren und weitermachen." }
          - { key: b, text: "Höflich darum bitten, das Gespräch unter vier Augen fortzusetzen." }
          - { key: c, text: "Das Gespräch sofort beenden." }
        answer: b
        why: "Eine höfliche Bitte schützt den vertraulichen Rahmen des Gesprächs."
      - q: "Der Konflikt betrifft eigentlich das ganze Team, nicht nur euch zwei. — The conflict actually affects the whole team, not just the two of you."
        options:
          - { key: a, text: "Es weiter nur unter euch zwei besprechen." }
          - { key: b, text: "So tun, als würde es nur euch betreffen." }
          - { key: c, text: "Vorschlagen, das Thema auch im Team zu besprechen." }
        answer: c
        why: "Ein Team-Thema profitiert von einer Besprechung im ganzen Team."
      - q: "Trotz mehrerer Gespräche findet ihr keine gemeinsame Lösung. — Despite several conversations, you can't find a common solution."
        options:
          - { key: a, text: "Die Teamleitung als neutrale Vermittlung einbeziehen." }
          - { key: b, text: "Den Konflikt einfach ignorieren und hoffen, dass er verschwindet." }
          - { key: c, text: "Die Zusammenarbeit komplett verweigern." }
        answer: a
        why: "Eine neutrale Vermittlung kann bei festgefahrenen Konflikten weiterhelfen."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Meine Kollegin hat im Gespräch sehr defensiv {1}. (sich verhalten, Partizip)
      2. Das Gespräch ist leider {2}. (außer Kontrolle geraten, Partizip)
      3. Meine Kollegin hat den Vorfall komplett {3}. (verneint, Partizip)
      4. Eine dritte Person hat sich ungefragt {4}. (dazwischengedrängt, Partizip)
      5. Der Konflikt hat sich als Team-Thema {5}. (gezeigt, Partizip)
      6. Trotz mehrerer Gespräche haben wir keine Lösung {6}. (erreicht, Partizip)
    answers:
      "1": reagiert
      "2": eskaliert
      "3": bestritten
      "4": eingemischt
      "5": herausgestellt
      "6": gefunden

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
