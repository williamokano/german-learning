      - { text: "die Hose", bucket: kleidung }
      - { text: "die Naht", bucket: passform }
      - { text: "der Gutschein", bucket: kasse }
      - { text: "das Hemd", bucket: kleidung }
      - { text: "der Reißverschluss", bucket: passform }
      - { text: "die Rückgabefrist", bucket: kasse }
