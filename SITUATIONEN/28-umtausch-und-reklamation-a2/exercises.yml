lesson: "SIT/28-umtausch-und-reklamation-a2"
title: "Kleidung: anprobieren, umtauschen, reklamieren — A2"
topic: "Umtausch und Reklamation"
category: "Einkaufen"
level: A2
summary: "Größe und Umkleide, umtauschen ohne Grund, Gutschein statt Geld — und der Unterschied zur echten Reklamation."
intro: >
  Zwei Dinge werden im Laden dauernd verwechselt. Das eine ist der
  Umtausch: Die Hose passt nicht, sie ist aber in Ordnung — dafür gibt
  es kein Recht, sondern nur die Kulanz des Ladens, meist mit Frist und
  oft nur als Gutschein. Das andere ist die Reklamation: Die Naht geht
  nach zweimal Tragen auf — das ist ein Mangel, und dafür gibt es ein
  Recht. Wer die zwei Wörter auseinanderhält, bekommt im Laden sehr
  unterschiedliche Antworten. Dazu kommt der Alltag davor: Größe
  finden, Umkleide, „steht Ihnen gut“ höflich abwehren. Grammatik nach
  Bedarf: Komparativ, Adjektivendungen, Perfekt und Konjunktiv II für
  Bitten. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

