      - { key: b, text: "Du suchst die Umkleidekabine." }
      - { key: c, text: "Die Ware ist in Ordnung, du willst sie trotzdem nicht." }
      - { key: d, text: "Die Ware hat einen Mangel." }
      - { key: e, text: "Du fragst nach Erstattung statt Gutschein." }
      - { key: f, text: "Du fragst nach der Rückgabefrist." }
      - { key: g, text: "Du wehrst höflich Beratung ab." }
      - { key: h, text: "Du willst es später holen." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Passt es? Adjektive und Komparativ"
    instructions: "Ergänze die passende Form."
    instructionsEn: "Fill in the fitting form."
    text: |
      1. Die Hose ist mir zu {1} — haben Sie eine Nummer größer? (nicht weit genug)
      2. Der Pullover ist etwas zu {2}, die Ärmel gehen über die Hände. (nicht kurz genug)
      3. Haben Sie das in einer {3} Farbe? (Komparativ von dunkel)
      4. Das Hemd sitzt {4} als das andere. (Komparativ von gut)
      5. Ich hätte gern ein {5} Modell. (Komparativ von schlicht, unbestimmter Artikel, Neutrum)
      6. Die Jacke ist mir zu {6}, ich schwitze darin. (nicht kühl genug)
    answers:
      "1": eng
      "2": lang
      "3": dunkleren
      "4": besser
      "5": schlichteres
      "6": warm

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Umtausch oder Reklamation?"
    instructions: "Ergänze das passende Verb oder Substantiv."
    instructionsEn: "Fill in the fitting verb or noun."
    text: |
      1. Die Hose ist heil, sie passt nur nicht — ich will sie {1}. (tauschen, mit um-)
      2. Die Naht ist nach zweimal Tragen aufgegangen — das ist ein {2}. (Fehler an der Ware)
      3. Bei einem Mangel kann ich {3}. (sich beschweren, Fachwort mit rekla-)
      4. Ohne {4} nimmt der Laden nichts zurück. (Papier von der Kasse)
      5. Statt Geld bekomme ich oft nur einen {5}. (Guthaben für den Laden)
      6. Die {6} beträgt 30 Tage. (Zeit, in der man zurückgeben darf)
    answers:
      "1": umtauschen
      "2": Mangel
      "3": reklamieren
      "4": Kassenbon
      "5": Gutschein
      "6": Rückgabefrist

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Zwei Wege zur Kasse"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      *(erster Besuch)*
      — Kann ich Ihnen helfen?
      — Danke, ich {1} mich erst mal um. … Doch, eine Frage: Haben Sie
      die Hose eine Nummer {2}?
      — In Schwarz ja. Wo möchten Sie anprobieren? Die {3} ist
      hinten rechts.
      — Danke. … Die passt. Wie lange ist die {4}?
      — 30 Tage, mit {5}. Heben Sie ihn gut auf.
      *(zwei Wochen später)*
      — Guten Tag, ich möchte diese Hose {6}. Sie ist ungetragen,
      hier ist der Bon.
      — Kein Problem. Möchten Sie etwas anderes, oder soll ich Ihnen
      einen {7} ausstellen?
      — Bekomme ich das Geld {8}?
      — Bei Umtausch ohne Grund nur einen Gutschein — bei einem
      {9} sieht es anders aus.
      — Verstehe. Dann noch etwas: Bei dem Pullover ist nach zweimal
      Tragen die {10} aufgegangen. Den möchte ich reklamieren.
      — Das ist etwas anderes, den schauen wir uns an.
    bank: [SCHAUE, GRÖSSER, UMKLEIDE, RÜCKGABEFRIST, KASSENBON, UMTAUSCHEN, GUTSCHEIN, ZURÜCK, MANGEL, NAHT, KLEINER, ETIKETT, FLECK, KASSE]
    answers:
      "1": SCHAUE
      "2": GRÖSSER
      "3": UMKLEIDE
      "4": RÜCKGABEFRIST
      "5": KASSENBON
      "6": UMTAUSCHEN
      "7": GUTSCHEIN
      "8": ZURÜCK
      "9": MANGEL
      "10": NAHT

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Eine Verkäuferin fragt, ob sie helfen kann, du willst allein schauen. — A sales assistant offers help; you want to browse alone."
        options:
          - { key: a, text: "Danke, ich schaue mich erst mal um — ich melde mich, wenn ich etwas brauche." }
          - { key: b, text: "Nein." }
          - { key: c, text: "Lassen Sie mich in Ruhe." }
        answer: a
        why: "Ablehnen und die Tür offen lassen — so wirst du weder bedrängt noch unhöflich."
      - q: "Die Hose sitzt nicht, du willst eine andere Größe. — The trousers don't fit and you want another size."
        options:
          - { key: a, text: "Die ist zu klein." }
          - { key: b, text: "Die Hose ist mir zu eng — haben Sie die eine Nummer größer?" }
          - { key: c, text: "Das ist keine 38." }
        answer: b
        why: "Problem und Wunsch in einem Satz; „zu eng“ sagt außerdem mehr als „zu klein“."
      - q: "Du bringst eine ungetragene Jacke zurück. — You bring back an unworn jacket."
        options:
          - { key: a, text: "Ich will mein Geld." }
          - { key: b, text: "Die gefällt mir nicht mehr." }
          - { key: c, text: "Ich möchte diese Jacke umtauschen, sie ist ungetragen. Hier ist der Kassenbon." }
        answer: c
        why: "Das Wort „umtauschen“ plus Bon und Zustand — damit ist alles gesagt, was der Laden wissen muss."
      - q: "Der Reißverschluss ist nach einer Woche kaputt. — The zip broke after a week."
        options:
          - { key: a, text: "Ich möchte die Jacke reklamieren: Der Reißverschluss ist nach einer Woche kaputtgegangen." }
          - { key: b, text: "Ich möchte die Jacke umtauschen." }
          - { key: c, text: "Die Jacke ist schlecht." }
        answer: a
        why: "Das ist ein Mangel, kein Umtausch — mit dem richtigen Wort bekommst du eine ganz andere Antwort."
      - q: "Man bietet dir einen Gutschein an, du willst Geld. — You're offered a voucher but want your money."
        options:
          - { key: a, text: "Gutscheine nehme ich nicht." }
          - { key: b, text: "Bei einem Mangel hätte ich lieber die Erstattung — geht das?" }
          - { key: c, text: "Das ist doch dasselbe." }
        answer: b
        why: "Freundlich fragen und den Grund nennen: beim Mangel stehen die Chancen gut, beim Umtausch nicht."
      - q: "Die Verkäuferin sagt, es steht dir gut, du bist unsicher. — The assistant says it suits you; you're not sure."
        options:
          - { key: a, text: "Finde ich nicht." }
          - { key: b, text: "Danke — ich überlege es mir noch und komme eventuell nachher wieder." }
          - { key: c, text: "Dann nehme ich es." }
        answer: b
        why: "Höflich Zeit nehmen, ohne dich zu rechtfertigen — und ohne etwas zu kaufen, das du nicht willst."

  - id: B3
    block: B
    type: order
    title: "Sätze im Laden bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Haben", "Sie", "das", "eine", "Nummer", "größer", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Ja/Nein-Frage: Verb an Position 1"
      - tiles: ["Die", "Hose", "ist", "mir", "zu", "eng"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "„mir zu eng“ — der Dativ sagt, für wen"
      - tiles: ["Ich", "möchte", "diese", "Jacke", "umtauschen"]
        answer: [0, 1, 2, 3, 4]
        note: "Modalverb an Position 2, Infinitiv am Ende"
      - tiles: ["Der", "Reißverschluss", "ist", "nach", "einer", "Woche", "kaputtgegangen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Perfekt mit sein, Partizip am Ende"
      - tiles: ["Wie", "lange", "ist", "die", "Rückgabefrist", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "W-Frage: Fragewort, dann Verb"
      - tiles: ["Bekomme", "ich", "das", "Geld", "zurück", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "zurückbekommen: zurück steht am Satzende"

  - id: B4
    block: B
    type: true-false
    title: "Die Rückgabebedingungen lesen"
    instructions: |
      > **Modehaus Kern — Rückgabe und Reklamation**
      >
      > - **Umtausch** ungetragener Ware **innerhalb von 30 Tagen**,
      >   nur mit **Kassenbon** und **Originaletikett**.
      > - Beim Umtausch ohne Grund erhalten Sie einen **Gutschein**;
      >   eine Auszahlung ist nicht möglich.
      > - **Reduzierte Ware** ist vom Umtausch **ausgeschlossen** —
      >   gesetzliche Rechte bei Mängeln bleiben davon **unberührt**.
      > - **Unterwäsche und Bademode** nehmen wir aus hygienischen
      >   Gründen **nicht** zurück.
      > - Bei einem **Mangel** wenden Sie sich bitte an die
      >   Information — dort wird geprüft, ob repariert, ersetzt oder
      >   erstattet wird.
      > - **Online gekaufte Ware** kann in der Filiale zurückgegeben
      >   werden; die **Erstattung** erfolgt dann auf das
      >   ursprüngliche Zahlungsmittel.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ohne Kassenbon nimmt der Laden ungetragene Ware zurück. — Without a receipt the shop takes back unworn goods."
        answer: false
        why: "„nur mit Kassenbon und Originaletikett“."
      - q: "Beim Umtausch ohne Grund gibt es kein Bargeld. — For a change of mind there's no cash refund."
        answer: true
        why: "„eine Auszahlung ist nicht möglich“ — es gibt einen Gutschein."
      - q: "Bei reduzierter Ware hat man auch bei einem Mangel keine Rechte. — With sale goods you have no rights even for a defect."
        answer: false
        why: "„gesetzliche Rechte bei Mängeln bleiben davon unberührt“."
      - q: "Einen Badeanzug kann man zurückbringen. — You can bring back a swimsuit."
        answer: false
        why: "Bademode wird aus hygienischen Gründen nicht zurückgenommen."
      - q: "Bei einem Mangel geht man zur Information. — For a defect you go to the information desk."
        answer: true
        why: "„Bei einem Mangel wenden Sie sich bitte an die Information.“"
      - q: "Online gekaufte Ware muss man online zurückschicken. — Goods bought online have to be returned online."
        answer: false
        why: "Sie kann in der Filiale zurückgegeben werden."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es schwierig wird"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du hast den Kassenbon verloren, die Ware ist ungetragen. — You lost the receipt; the item is unworn."
        options:
          - { key: a, text: "Ich habe den Bon leider verloren — geht es vielleicht über die Kartenabrechnung? Ich habe mit Karte gezahlt." }
          - { key: b, text: "Das muss auch so gehen." }
          - { key: c, text: "Dann behalte ich es eben." }
        answer: a
        why: "Bei Kartenzahlung ist der Kauf im System — das ist der übliche Ersatz für den Bon."
      - q: "Man sagt dir, reduzierte Ware sei vom Umtausch ausgeschlossen — dabei hat sie einen Mangel. — You're told sale goods can't be returned, but the item is faulty."
        options:
          - { key: a, text: "Das ist illegal." }
          - { key: b, text: "Verstehe, das gilt für den Umtausch. Hier geht es aber um einen Mangel — die Naht ist aufgegangen." }
          - { key: c, text: "Dann eben nicht." }
        answer: b
        why: "Den Unterschied ruhig benennen: der Ausschluss betrifft den Umtausch, nicht den Mangel."
      - q: "Die Frist ist seit zwei Tagen abgelaufen. — The deadline passed two days ago."
        options:
          - { key: a, text: "Das ist doch egal." }
          - { key: b, text: "Ich weiß, die 30 Tage sind knapp vorbei — wäre trotzdem ein Gutschein möglich?" }
          - { key: c, text: "Nichts sagen und es versuchen." }
        answer: b
        why: "Den eigenen Fehler benennen und um Kulanz bitten — genau so bekommt man sie manchmal."
      - q: "In der Umkleide fällt dir ein Fleck auf der Ware auf. — In the fitting room you notice a stain."
        options:
          - { key: a, text: "Nichts sagen und trotzdem nehmen." }
          - { key: b, text: "Es zurückhängen und gehen." }
          - { key: c, text: "Hier ist ein Fleck — haben Sie das Teil noch mal, oder geht da etwas beim Preis?" }
        answer: c
        why: "Zwei Möglichkeiten anbieten: neues Teil oder Nachlass — beides ist im Laden üblich."
      - q: "Die Verkäuferin sagt, sie könne nichts machen. — The assistant says she can't do anything."
        options:
          - { key: a, text: "Ich will die Geschäftsführung sprechen!" }
          - { key: b, text: "Ich verstehe, dass Sie das nicht entscheiden können — wen könnte ich denn fragen?" }
          - { key: c, text: "Sie wollen nur nicht." }
        answer: b
        why: "Sie entlasten und nach der zuständigen Person fragen — das öffnet die Tür, ohne jemanden anzugreifen."
      - q: "Du hast online gekauft und willst in der Filiale zurückgeben. — You bought online and want to return in store."
        options:
          - { key: a, text: "Das habe ich online gekauft, geht das trotzdem hier?" }
          - { key: b, text: "Ich möchte das zurückgeben — hier ist die Bestellnummer, ich habe online gekauft." }
          - { key: c, text: "Ich schicke es zurück." }
        answer: b
        why: "Bestellnummer gleich mitliefern — dann findet die Kasse den Vorgang sofort."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die Ware ist heil, ich will sie nur {1}. (zurückgeben und tauschen)
      2. Die Naht ist auf — das ist ein {2}. (Fehler an der Ware)
      3. Ohne {3} geht der Umtausch meistens nicht. (Papier von der Kasse)
      4. Statt Geld bekomme ich einen {4}. (Guthaben für den Laden)
      5. {5} Ware ist oft vom Umtausch ausgeschlossen. (im Preis heruntergesetzt)
      6. Die {6} erfolgt auf das ursprüngliche Zahlungsmittel. (Geld zurück)
    answers:
      "1": umtauschen
      "2": Mangel
      "3": Kassenbon
      "4": Gutschein
      "5": Reduzierte
      "6": Erstattung

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Haben Sie das eine Nummer {1}? (bigger)
      2. Die Hose ist mir zu {2}. (tight)
      3. Wo ist die {3}? (fitting room)
      4. Ich möchte das {4}. (exchange — change of mind)
      5. Ich möchte das {5}. (make a complaint — defect)
      6. Das ist ein {6}. (defect)
      7. Hier ist der {7}. (receipt)
      8. Wie lange ist die {8}? (return period)
      9. Bekomme ich das Geld {9}? (back)
      10. Statt Geld gibt es einen {10}. (voucher)
      11. {11} Ware ist oft ausgeschlossen. (reduced / sale)
      12. Der Reißverschluss ist {12}. (broke — kaputtgehen, Partizip)
    answers:
      "1": größer
      "2": eng
      "3": Umkleide
      "4": umtauschen
      "5": reklamieren
      "6": Mangel
      "7": Kassenbon
      "8": Rückgabefrist
      "9": zurück
      "10": Gutschein
      "11": Reduzierte
      "12": kaputtgegangen

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: einmal Umtausch, einmal Reklamation"
    prompt: "Schreib zwei Gespräche im selben Laden. Zusammen 16–20 Sätze."
    stimulus: |
      Vor drei Wochen hast du eine Hose und einen Pullover gekauft. Die
      Hose ist ungetragen, sie gefällt dir nur nicht mehr. Beim Pullover
      ist nach zweimal Tragen die Naht aufgegangen. Den Kassenbon hast
      du für die Hose, für den Pullover nicht — du hast aber mit Karte
      gezahlt.

      Gespräch 1 — die Hose:
      1. sagen, was du willst, und den Zustand nennen
      2. den Bon zeigen
      3. nach Geld statt Gutschein fragen
      4. die Antwort annehmen
      5. nach der Frist fragen, falls du den Gutschein nutzen willst

      Gespräch 2 — der Pullover:
      6. das richtige Wort benutzen und den Mangel beschreiben
      7. sagen, wann und wie es passiert ist
      8. das Problem mit dem fehlenden Bon lösen
      9. fragen, was jetzt passiert
      10. dich verabschieden
    use:
      - "Sie-Form durchgehend"
      - "`Ich möchte … umtauschen.` vs. `Ich möchte … reklamieren.`"
      - "Perfekt: `Die Naht ist aufgegangen.`"
      - "`Bekomme ich das Geld zurück?`"
    selfCheck:
      - "Benutzt Gespräch 1 umtauschen und Gespräch 2 reklamieren?"
      - "Beschreibst du den Mangel konkret (was, nach wie langer Zeit)?"
      - "Steht im Perfekt das Partizip am Satzende?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Gespräch 1 — die Hose**

      Ich: Guten Tag. Ich möchte diese Hose umtauschen — sie ist ungetragen, das Etikett ist noch dran.
      Verkäuferin: Kein Problem. Haben Sie den Kassenbon?
      Ich: Ja, hier. Der Kauf war vor drei Wochen.
      Verkäuferin: Passt, die 30 Tage laufen noch. Möchten Sie etwas anderes, oder soll ich Ihnen einen Gutschein ausstellen?
      Ich: Bekomme ich das Geld zurück?
      Verkäuferin: Beim Umtausch ohne Grund leider nicht, nur einen Gutschein.
      Ich: Verstehe, dann nehme ich den Gutschein. Wie lange ist der gültig?
      Verkäuferin: Drei Jahre, der Betrag steht drauf.
      Ich: Sehr gut, danke.

      **Gespräch 2 — der Pullover**

      Ich: Und dann hätte ich noch eine Sache: Diesen Pullover möchte ich reklamieren.
      Verkäuferin: Was ist damit?
      Ich: Ich habe ihn zweimal getragen und normal gewaschen, danach ist die Naht an der Schulter aufgegangen.
      Verkäuferin: Haben Sie dafür auch den Bon?
      Ich: Den habe ich leider verloren — ich habe aber mit Karte gezahlt, geht es vielleicht über die Abrechnung?
      Verkäuferin: Das schauen wir uns an. Ich brauche kurz Ihre Karte für die Suche.
      Ich: Gern. Und was passiert dann — wird das repariert oder ersetzt?
      Verkäuferin: Das entscheidet die Information. Meistens gibt es Ersatz, wenn das Modell noch da ist.
      Ich: Alles klar. Vielen Dank für Ihre Hilfe!
      Verkäuferin: Gern, einen schönen Tag noch.
