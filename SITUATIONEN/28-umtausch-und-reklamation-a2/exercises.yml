      - { key: "2", text: "Wo kann ich das anprobieren?" }
      - { key: "3", text: "Ich möchte das umtauschen." }
      - { key: "4", text: "Ich möchte das reklamieren." }
      - { key: "5", text: "Bekomme ich das Geld zurück?" }
      - { key: "6", text: "Wie lange habe ich Zeit?" }
      - { key: "7", text: "Danke, ich schaue mich erst mal um." }
      - { key: "8", text: "Können Sie mir das zurücklegen?" }
    right:
