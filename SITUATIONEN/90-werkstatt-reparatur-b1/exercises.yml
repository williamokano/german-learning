  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Diagnose, Freigabe, Abholung"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (in der Werkstatt)
      — Guten Tag, mein Auto macht seit ein paar Tagen komische
      Geräusche.
      — Lassen Sie uns kurz eine {1} machen, dann wissen wir mehr.
      (nach der Untersuchung)
      — Wir haben die Ursache gefunden: Die Bremsscheiben sind stark
      abgenutzt.
      — Oh je, wie teuer wird das ungefähr?
      — Ich mache Ihnen gleich einen {2}.
      — Danke. Und wie lange dauert die {3}?
      — Das kann bis zu zwei Tage dauern, weil wir ein {4} bestellen
      müssen.
      — Bekomme ich in der Zeit einen {5}?
      — Ja, klar, den können Sie gleich am Empfang abholen.
      — Gut. Bevor Sie anfangen, möchte ich aber den Preis noch mit
      meiner Versicherung klären.
      — Kein Problem, wir {6} erst an, wenn Sie uns Bescheid geben.
      (zwei Tage später)
      — Guten Tag, ist mein Auto fertig?
      — Ja, wir haben alles {7} und getestet.
      — Super. Ist eigentlich noch {8} auf die neuen Teile?
      — Ja, zwei Jahre auf das Material.
      — Dann kann ich das Auto ja {9}?
      — Genau, hier ist die {10}, bitte einmal unterschreiben.
    bank: [DIAGNOSE, KOSTENVORANSCHLAG, INSPEKTION, REPARATUR, ÖLWECHSEL, ERSATZTEIL, TÜV, LEIHWAGEN, FANGEN, ANZAHLUNG, AUSGETAUSCHT, GARANTIE, ABHOLEN, RECHNUNG]
    answers:
      "1": DIAGNOSE
      "2": KOSTENVORANSCHLAG
      "3": REPARATUR
      "4": ERSATZTEIL
      "5": LEIHWAGEN
      "6": FANGEN
      "7": AUSGETAUSCHT
      "8": GARANTIE
      "9": ABHOLEN
      "10": RECHNUNG

  - id: B2
    block: B
    type: single-choice
    title: "Diagnose und Freigabe"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Werkstatt sagen, dass dein Auto komische Geräusche macht. — You want to tell the garage your car is making strange noises."
        options:
          - { key: a, text: "Autos interessieren mich nicht." }
          - { key: b, text: "Mein Auto macht seit ein paar Tagen komische Geräusche." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg beim Melden eines Problems."
      - q: "Du willst wissen, wie teuer die Reparatur ungefähr wird. — You want to know roughly how expensive the repair will be."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Wie teuer wird die Reparatur ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig die zu erwartenden Kosten."
      - q: "Du willst der Werkstatt sagen, dass du den Preis erst mit deiner Versicherung klären möchtest. — You want to tell the garage you want to check the price with your insurance first."
        options:
          - { key: a, text: "Ich möchte den Preis erst mit meiner Versicherung klären." }
          - { key: b, text: "Versicherungen interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Aussage verhindert, dass ohne Freigabe repariert wird."
      - q: "Du willst wissen, ob du während der Reparatur einen Leihwagen bekommst. — You want to know if you'll get a loaner car during the repair."
        options:
          - { key: a, text: "Leihwagen interessieren mich nicht." }
          - { key: b, text: "Bekomme ich während der Reparatur einen Leihwagen?" }
          - { key: c, text: "Das ist mir egal, ich nehme einfach den Bus." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig die Mobilität während der Reparatur."
      - q: "Du willst wissen, wie lange die Reparatur ungefähr dauert. — You want to know roughly how long the repair will take."
        options:
          - { key: a, text: "Zeit interessiert mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie lange dauert die Reparatur ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt die zeitliche Planung."
      - q: "Du willst wissen, ob es Garantie auf die neuen Teile gibt. — You want to know if there's a warranty on the new parts."
        options:
          - { key: a, text: "Ist eigentlich noch Garantie auf die neuen Teile?" }
          - { key: b, text: "Garantien interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine direkte Frage klärt, was bei einem späteren Mangel gilt."

