  - id: D2
    block: D
    type: free-write
    title: "Diagnose, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: das Auto zur Werkstatt bringen und die Diagnose bekommen, ein Problem, weil das Ersatzteil nicht rechtzeitig da ist, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du bringst dein Auto wegen seltsamer Geräusche in die Werkstatt.
      Die Diagnose ergibt, dass ein Ersatzteil gebraucht wird, das aber
      nicht rechtzeitig ankommt.

      Bei der Diagnose müssen vorkommen:
      1. das Auto in die Werkstatt bringen
      2. die Geräusche beschreiben
      3. den Kostenvoranschlag bekommen

      Beim Problem müssen vorkommen:
      4. erfahren, dass das Ersatzteil fehlt
      5. sich über die Verzögerung ärgern
      6. nach einem Leihwagen fragen

      In der Lösung müssen vorkommen:
      7. einen Leihwagen bekommen
      8. auf das Ersatzteil warten
      9. das Auto abholen
      10. die Rechnung prüfen
    use:
      - "höfliche Frage: „Können Sie mir bitte einen Kostenvoranschlag machen?“"
      - "Perfekt: „Ich habe das Auto in die Werkstatt gebracht.“"
      - "Futur I: „Der Meister wird mich anrufen, sobald es fertig ist.“"
    selfCheck:
      - "Wird die Diagnose klar beschrieben?"
      - "Klingt die Reaktion auf die Verzögerung realistisch?"
      - "Wird die Abholung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Diagnose**

      Ich bringe mein Auto wegen komischer Geräusche in die Werkstatt.
      Der Meister macht eine Diagnose und findet die Ursache.
      Ich: Können Sie mir bitte einen Kostenvoranschlag machen?

      **Das Problem**

      Meister: Leider fehlt uns noch ein Ersatzteil.
      Ich: Das ärgert mich, aber okay. Bekomme ich in der Zeit einen Leihwagen?
      Meister: Ja, natürlich.

      **Die Lösung**

      Ich hole den Leihwagen ab und warte auf das Ersatzteil.
      Ein paar Tage später ruft mich der Meister an: Das Auto ist fertig!
      Ich hole das Auto ab und prüfe die Rechnung genau.
      Alles stimmt, und ich bin froh, dass alles geklappt hat.
