lesson: "SIT/90-werkstatt-reparatur-b1"
title: "Größere Reparatur in der Werkstatt — B1"
topic: "Größere Reparatur in der Werkstatt"
category: "Unterwegs"
level: B1
summary: "Die Diagnose verstehen, einen Kostenvoranschlag verlangen, die Reparatur freigeben und das Auto mit Garantie abholen — und was tun, wenn die Rechnung höher ausfällt oder ein Ersatzteil fehlt."
intro: >
  Eine größere Reparatur in der Werkstatt läuft in mehreren Schritten:
  die Diagnose abwarten, einen Kostenvoranschlag verlangen, die
  Reparatur freigeben und am Ende mit Garantie abholen. Dieses Set
  übt genau das — diagnostizieren, reparieren, abholen, und was zu
  tun ist, wenn die Rechnung höher ausfällt oder ein Ersatzteil
  fehlt. Grammatik nach Bedarf: Modalverben, Perfekt und Futur I.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

