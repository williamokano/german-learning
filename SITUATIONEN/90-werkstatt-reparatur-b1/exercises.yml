  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Reparatur planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} das Auto gestern in die Werkstatt gebracht. (haben, Perfekt)
      2. {2} Sie mir bitte einen Kostenvoranschlag machen? (können, Sie-Form)
      3. Man {3} die Reparatur erst freigeben, wenn der Preis feststeht. (sollen, Präsens)
      4. {4} das Ersatzteil schon bestellt worden? (sein, Perfekt Passiv)
