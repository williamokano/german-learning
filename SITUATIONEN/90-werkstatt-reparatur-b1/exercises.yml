  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur Reparatur lesen"
    instructions: |
      > **Info — Größere Reparatur in der Werkstatt**
      >
      > - **Kostenvoranschlag:** sollte man sich vor größeren
      >   Reparaturen **immer geben lassen**.
      > - **Ersatzteile:** müssen bei bestimmten Marken manchmal
      >   **extra bestellt** werden.
      > - **Garantie:** gilt oft nur bei einer **autorisierten
      >   Werkstatt**.
      > - **Leihwagen:** wird **nicht automatisch** gestellt, man
      >   sollte danach fragen.
      > - **Versicherung:** bei manchen Reparaturen lohnt es sich,
      >   **vorher** mit ihr zu sprechen.
      > - **Rechnung:** sollte man **vor der Zahlung genau prüfen**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Vor größeren Reparaturen sollte man sich immer einen Kostenvoranschlag geben lassen. — Before major repairs you should always get a cost estimate."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur Reparatur."
      - q: "Ersatzteile sind bei jeder Marke sofort verfügbar. — Spare parts are immediately available for every brand."
        answer: false
        why: "Bei bestimmten Marken müssen sie manchmal extra bestellt werden."
      - q: "Eine Garantie gilt oft nur bei einer autorisierten Werkstatt. — A warranty often only applies at an authorized garage."
        answer: true
        why: "„Garantie: gilt oft nur bei einer autorisierten Werkstatt.“"
      - q: "Ein Leihwagen wird automatisch und ohne Nachfrage gestellt. — A loaner car is provided automatically without asking."
        answer: false
        why: "Er wird nicht automatisch gestellt, man sollte danach fragen."
      - q: "Bei manchen Reparaturen lohnt es sich, vorher mit der Versicherung zu sprechen. — For some repairs it's worth talking to the insurance first."
        answer: true
        why: "„Versicherung: bei manchen Reparaturen lohnt es sich, vorher mit ihr zu sprechen.“"
      - q: "Die Rechnung muss man nicht genau prüfen, sie stimmt immer. — You don't need to check the bill closely, it's always correct."
        answer: false
        why: "Man sollte die Rechnung vor der Zahlung genau prüfen."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Reparatur etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die tatsächliche Rechnung ist viel höher als der Kostenvoranschlag. — The actual bill is much higher than the cost estimate."
        options:
          - { key: a, text: "Einfach klaglos bezahlen." }
          - { key: b, text: "Die Werkstatt nach dem Grund für die Abweichung fragen." }
          - { key: c, text: "Die Rechnung ignorieren und nicht bezahlen." }
        answer: b
        why: "Eine Nachfrage klärt, ob die höheren Kosten gerechtfertigt sind."
      - q: "Das bestellte Ersatzteil kommt nicht rechtzeitig an. — The ordered spare part doesn't arrive in time."
        options:
          - { key: a, text: "Das Auto trotzdem ohne das Teil abholen." }
          - { key: b, text: "Die Werkstatt wechseln, ohne nachzufragen." }
          - { key: c, text: "Höflich nach einem neuen Liefertermin fragen." }
        answer: c
        why: "Eine höfliche Nachfrage klärt schnell den neuen Zeitplan."
      - q: "Nach der Reparatur macht das Auto immer noch das gleiche Geräusch. — After the repair, the car still makes the same noise."
        options:
          - { key: a, text: "Zur Werkstatt zurückfahren und auf einer Nachbesserung bestehen." }
          - { key: b, text: "Das Geräusch einfach ignorieren." }
          - { key: c, text: "Eine ganz neue Werkstatt ohne Erklärung aufsuchen." }
        answer: a
        why: "Eine Nachbesserung bei derselben Werkstatt ist meist der schnellste Weg."
      - q: "Es ist gerade kein Leihwagen verfügbar. — No loaner car is available right now."
        options:
          - { key: a, text: "Zu Fuß nach Hause gehen, ohne nachzufragen." }
          - { key: b, text: "Nach einer Alternative wie einem Mietwagen oder öffentlichen Verkehrsmitteln fragen." }
          - { key: c, text: "Sofort eine schlechte Bewertung schreiben." }
        answer: b
        why: "Eine Nachfrage nach Alternativen löst das Mobilitätsproblem am schnellsten."
      - q: "Die Werkstatt hat ohne Ihre Freigabe schon repariert. — The garage already did the repair without your approval."
        options:
          - { key: a, text: "Das einfach so hinnehmen." }
          - { key: b, text: "Sofort das Auto woanders reparieren lassen." }
          - { key: c, text: "Die Werkstatt darauf ansprechen und die Situation klären." }
        answer: c
        why: "Ein klärendes Gespräch zeigt, wer für die ungefragte Reparatur aufkommt."
      - q: "Die Werkstatt lehnt die Garantie für ein defektes Teil ab. — The garage rejects the warranty for a defective part."
        options:
          - { key: a, text: "Schriftlich Widerspruch einlegen und eine Begründung verlangen." }
          - { key: b, text: "Die Ablehnung einfach akzeptieren." }
          - { key: c, text: "Das Auto sofort verkaufen." }
        answer: a
        why: "Ein schriftlicher Widerspruch mit Begründung kann die Entscheidung noch ändern."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die Rechnung war deutlich höher als im Kostenvoranschlag {1}. (notiert, Partizip)
      2. Das Ersatzteil ist leider noch nicht {2}. (nicht eingetroffen, Partizip)
      3. Das Geräusch ist nach der Reparatur nicht {3}. (nicht weg, Partizip)
