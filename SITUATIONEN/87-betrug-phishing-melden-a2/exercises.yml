  - id: D2
    block: D
    type: free-write
    title: "Die E-Mail, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: eine verdächtige E-Mail bekommen und aus Versehen deine Daten eingeben, das Problem, dass Geld von deinem Konto abgebucht wird, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du bekommst eine E-Mail, die aussieht wie von deiner Bank, und
      gibst aus Versehen deine Daten ein. Kurz danach entdeckst du
      eine unbekannte Abbuchung auf deinem Konto.

      Bei der E-Mail müssen vorkommen:
      1. eine verdächtige E-Mail bekommen
      2. auf den Link klicken
      3. die Daten eingeben

      Beim Problem müssen vorkommen:
      4. eine unbekannte Abbuchung entdecken
      5. sich sehr erschrecken
      6. sofort die Bank anrufen

      In der Lösung müssen vorkommen:
      7. die Karte sperren lassen
      8. eine Anzeige bei der Polizei erstatten
      9. eine Rückbuchung beantragen
      10. das Passwort ändern
    use:
      - "höfliche Frage: „Können Sie mir bitte die Karte sperren?“"
      - "Perfekt: „Ich habe auf den Link geklickt.“"
      - "Futur I: „Morgen werde ich Anzeige erstatten.“"
    selfCheck:
      - "Wird die verdächtige E-Mail klar beschrieben?"
      - "Klingt die Reaktion auf die Abbuchung realistisch?"
      - "Wird die Rückbuchung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Die E-Mail**

      Ich bekomme eine E-Mail, die aussieht wie von meiner Bank.
      Ich klicke auf den Link und gebe meine Daten ein.
      Erst später merke ich, dass etwas nicht stimmt.

      **Das Problem**

      Ich: Auf meinem Konto ist plötzlich Geld weg!
      (am Telefon mit der Bank)
      Ich: Ich habe eine unbekannte Abbuchung entdeckt. Können Sie mir bitte die Karte sperren?
      Bank: Das tut uns leid, wir kümmern uns sofort darum.

      **Die Lösung**

      Bank: Wir sperren die Karte jetzt.
      Ich: Morgen werde ich außerdem Anzeige bei der Polizei erstatten.
      Bank: Gut, und beantragen Sie bitte auch eine Rückbuchung.
      Ich: Mache ich, und mein Passwort ändere ich auch gleich.
