lesson: "SIT/87-betrug-phishing-melden-a2"
title: "Betrug und Phishing melden — A2"
topic: "Betrug und Phishing melden"
category: "Geld & Verträge"
level: A2
summary: "Eine verdächtige Phishing-Mail erkennen, die Bank informieren, die Karte sperren lassen und Anzeige bei der Polizei erstatten — und was tun, wenn schon Geld vom Konto abgebucht wurde."
intro: >
  Eine Phishing-Mail sieht oft aus wie eine echte Nachricht von der
  Bank — und kann teuer werden, wenn man auf den Link klickt und
  Daten eingibt. Dieses Set übt genau das — eine verdächtige
  Nachricht erkennen, die Bank informieren, die Karte sperren lassen,
  und was zu tun ist, wenn schon Geld abgebucht wurde. Grammatik nach
  Bedarf: Modalverben, Perfekt und Futur I. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Erkennen, melden oder schützen?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: erkennen, label: "Erkennen" }
      - { key: melden, label: "Melden" }
      - { key: schuetzen, label: "Schützen" }
    tokens:
      - { text: "eine verdächtige E-Mail erkennen", bucket: erkennen }
      - { text: "den Absender genau prüfen", bucket: erkennen }
      - { text: "einen falschen Link bemerken", bucket: erkennen }
      - { text: "eine unbekannte Überweisung entdecken", bucket: erkennen }
      - { text: "die Bank sofort informieren", bucket: melden }
      - { text: "die Karte sperren lassen", bucket: melden }
      - { text: "eine Anzeige bei der Polizei erstatten", bucket: melden }
      - { text: "die Phishing-Mail weiterleiten", bucket: melden }
      - { text: "die PIN niemals weitergeben", bucket: schuetzen }
      - { text: "ein neues Passwort wählen", bucket: schuetzen }
      - { text: "die Kontoauszüge regelmäßig prüfen", bucket: schuetzen }
      - { text: "eine Rückbuchung beantragen", bucket: schuetzen }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "die Phishing-Mail" }
      - { key: "2", text: "der Betrug" }
      - { key: "3", text: "die Überweisung" }
      - { key: "4", text: "die Kartensperrung" }
      - { key: "5", text: "der Absender" }
      - { key: "6", text: "die Anzeige" }
      - { key: "7", text: "die PIN" }
      - { key: "8", text: "die Rückbuchung" }
    right:
      - { key: a, text: "eine gefälschte E-Mail, die Daten stehlen will" }
      - { key: b, text: "die absichtliche Täuschung, um Geld zu bekommen" }
      - { key: c, text: "das Senden von Geld auf ein anderes Konto" }
      - { key: d, text: "das Blockieren einer gestohlenen oder missbrauchten Karte" }
      - { key: e, text: "die Person oder Adresse, von der eine Nachricht kommt" }
      - { key: f, text: "die offizielle Meldung einer Straftat bei der Polizei" }
      - { key: g, text: "der geheime Zahlencode für Karte oder Konto" }
      - { key: h, text: "die Rückerstattung einer falschen oder betrügerischen Zahlung" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Betrug melden"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} gestern eine verdächtige E-Mail bekommen. (haben, Perfekt)
      2. {2} du den Absender schon geprüft? (haben, Perfekt)
      3. Man {3} niemals seine PIN weitergeben. (dürfen, Präsens)
      4. {4} Sie mir bitte die Karte sperren? (können, Sie-Form)
      5. Falls eine Überweisung verdächtig {5}, sollte man die Bank informieren. (sein, Präsens)
      6. Die Bank {6} den Schaden vermutlich zurückerstatten. (werden, Futur I)
      7. Ich {7} schon Anzeige bei der Polizei erstattet. (haben, Perfekt)
      8. {8} die Karte schon gesperrt worden? (sein, Perfekt Passiv)
    answers:
      "1": habe
      "2": Hast
      "3": darf
      "4": Können
      "5": ist
      "6": wird
      "7": habe
      "8": Ist

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe eine gefälschte {1} bekommen, die aussieht wie von meiner Bank. (eine gefälschte E-Mail, die Daten stehlen will)
      2. So ein {2} kann sehr viel Geld kosten. (die absichtliche Täuschung, um Geld zu bekommen)
      3. Auf meinem Konto steht eine {3}, die ich nie gemacht habe. (das Senden von Geld auf ein anderes Konto)
      4. Nach dem Diebstahl habe ich sofort eine {4} beantragt. (das Blockieren der Karte)
      5. Der {5} der E-Mail sah verdächtig aus. (die Adresse, von der eine Nachricht kommt)
      6. Ich habe bei der Bank eine {6} für die falsche Zahlung beantragt. (die Rückerstattung einer falschen Zahlung)
    answers:
      "1": Phishing-Mail
      "2": Betrug
      "3": Überweisung
      "4": Kartensperrung
      "5": Absender
      "6": Rückbuchung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Telefon mit der Bank-Hotline"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (am Telefon mit der Bank-Hotline)
      — Guten Tag, ich glaube, ich bin Opfer von {1} geworden.
      — Das tut mir leid. Was genau ist passiert?
      — Ich habe eine {2} bekommen, die aussah wie von Ihrer Bank.
      — Haben Sie auf einen Link geklickt oder Daten eingegeben?
      — Ja, leider habe ich meine {3} eingegeben.
      — Das ist sehr wichtig zu wissen. Wir sperren die Karte sofort.
      Können Sie mir noch die {4} der falschen Überweisung nennen?
      — Ja, es waren ungefähr 800 Euro.
      — Gut, wir prüfen das sofort. Ich veranlasse eine {5}.
      — Vielen Dank. Muss ich auch zur Polizei gehen?
      — Ja, das empfehlen wir. Erstatten Sie am besten eine {6}.
      — Mache ich gleich morgen früh.
      — Und ändern Sie bitte auch Ihr {7} für das Online-Banking.
      — Gut, das mache ich sofort.
      — Prüfen Sie in Zukunft immer den {8} genau, bevor Sie auf
      einen Link klicken.
      — Das werde ich machen.
      — Wenn Sie unsicher sind, {9} Sie uns lieber vorher an.
      — Gute Idee, danke für den Rat.
      — Wir {10} Sie, sobald die Rückbuchung bearbeitet ist.
    bank: [NACHRICHT, BETRUG, KREDITKARTE, PIN, VERSICHERUNG, SUMME, RÜCKBUCHUNG, RECHNUNG, ANZEIGE, PASSWORT, GUTHABEN, ABSENDER, RUFEN, INFORMIEREN]
    answers:
      "1": BETRUG
      "2": NACHRICHT
      "3": PIN
      "4": SUMME
      "5": RÜCKBUCHUNG
      "6": ANZEIGE
      "7": PASSWORT
      "8": ABSENDER
      "9": RUFEN
      "10": INFORMIEREN

  - id: B2
    block: B
    type: single-choice
    title: "Melden und schützen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Bank sagen, dass du Opfer von Betrug geworden bist. — You want to tell the bank you've been the victim of fraud."
        options:
          - { key: a, text: "Betrug interessiert mich nicht." }
          - { key: b, text: "Ich glaube, ich bin Opfer von Betrug geworden." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg beim Melden von Betrug."
      - q: "Du willst wissen, ob du sofort deine Karte sperren lassen solltest. — You want to know if you should block your card right away."
        options:
          - { key: a, text: "Karten interessieren mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Sollte ich meine Karte sofort sperren lassen?" }
        answer: c
        why: "Eine direkte Frage klärt schnell, ob eine Sperrung nötig ist."
      - q: "Du willst der Bank die verdächtige E-Mail weiterleiten. — You want to forward the suspicious email to the bank."
        options:
          - { key: a, text: "Ich leite Ihnen die verdächtige E-Mail gleich weiter." }
          - { key: b, text: "E-Mails interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Ankündigung hilft der Bank, die Phishing-Mail zu prüfen."
      - q: "Du willst wissen, ob du wegen des Betrugs auch zur Polizei musst. — You want to know if you also need to go to the police because of the fraud."
        options:
          - { key: a, text: "Polizei interessiert mich nicht." }
          - { key: b, text: "Muss ich wegen des Betrugs auch zur Polizei gehen?" }
          - { key: c, text: "Das ist mir egal, Hauptsache die Karte ist gesperrt." }
        answer: b
        why: "Eine direkte Frage klärt, ob zusätzlich eine Anzeige nötig ist."
      - q: "Du willst wissen, wie lange die Rückbuchung ungefähr dauert. — You want to know how long the chargeback will roughly take."
        options:
          - { key: a, text: "Rückbuchungen interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie lange dauert die Rückbuchung ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt, wann das Geld wieder auf dem Konto ist."
      - q: "Du willst der Bank sagen, dass du dein Passwort schon geändert hast. — You want to tell the bank you've already changed your password."
        options:
          - { key: a, text: "Ich habe mein Passwort für das Online-Banking schon geändert." }
          - { key: b, text: "Passwörter interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Aussage zeigt der Bank, dass du schon vorsorglich gehandelt hast."

  - id: B3
    block: B
    type: order
    title: "Sätze zum Betrug melden bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "bin", "Opfer", "von", "Betrug", "geworden"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt mit sein, Partizip am Ende"
      - tiles: ["Haben", "Sie", "auf", "einen", "Link", "geklickt", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Ja/Nein-Frage im Perfekt"
      - tiles: ["Wir", "sperren", "die", "Karte", "sofort"]
        answer: [0, 1, 2, 3, 4]
        note: "Aussage, Verb an Position 2"
      - tiles: ["Morgen", "werde", "ich", "Anzeige", "bei", "der", "Polizei", "erstatten"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Futur I, Zeitangabe an Position 1, Verb an Position 2"
      - tiles: ["Wie", "lange", "dauert", "die", "Rückbuchung", "eigentlich", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "W-Frage mit Verb an Position 2"
      - tiles: ["Ich", "habe", "mein", "Passwort", "sofort", "geändert"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zu Betrug und Phishing lesen"
    instructions: |
      > **Info — Betrug und Phishing**
      >
      > - **PIN:** Banken fragen **niemals** per E-Mail oder Telefon
      >   nach der PIN.
      > - **Bei Verdacht:** sofort die Karte über die europaweite
      >   Sperr-Hotline **116 116** sperren lassen.
      > - **Anzeige:** auch bei Online-Betrug sollte man Anzeige bei
      >   der Polizei erstatten.
      > - **Rückbuchung:** ist **nicht immer garantiert**, hängt vom
      >   Einzelfall ab.
      > - **Verdächtige E-Mails:** nicht beantworten, sondern an die
      >   Bank **weiterleiten**.
      > - **Passwort:** ein sicheres Passwort sollte man **regelmäßig
      >   ändern**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Banken fragen manchmal per E-Mail nach der PIN. — Banks sometimes ask for the PIN by email."
        answer: false
        why: "Banken fragen niemals per E-Mail oder Telefon nach der PIN."
      - q: "Bei Verdacht auf Phishing sollte man sofort die Karte sperren lassen. — If phishing is suspected, you should block the card immediately."
        answer: true
        why: "So steht es ausdrücklich in den Infos zu Betrug und Phishing."
      - q: "Eine Anzeige bei der Polizei lohnt sich nur bei sehr hohen Beträgen. — Reporting to the police is only worthwhile for very high amounts."
        answer: false
        why: "Auch bei Online-Betrug sollte man unabhängig von der Höhe Anzeige erstatten."
      - q: "Eine Rückbuchung ist immer zu 100 Prozent garantiert. — A chargeback is always 100 percent guaranteed."
        answer: false
        why: "Sie ist nicht immer garantiert, sondern hängt vom Einzelfall ab."
      - q: "Verdächtige E-Mails sollte man an die Bank weiterleiten statt sie zu beantworten. — Suspicious emails should be forwarded to the bank instead of being answered."
        answer: true
        why: "„Verdächtige E-Mails: nicht beantworten, sondern an die Bank weiterleiten.“"
      - q: "Ein sicheres Passwort sollte man regelmäßig ändern. — A secure password should be changed regularly."
        answer: true
        why: "„Passwort: ein sicheres Passwort sollte man regelmäßig ändern.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Betrug etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Sie haben schon auf einen Phishing-Link geklickt und Ihre Daten eingegeben. — You've already clicked a phishing link and entered your data."
        options:
          - { key: a, text: "Einfach abwarten, ob etwas passiert." }
          - { key: b, text: "Sofort die Bank anrufen und die Karte sperren lassen." }
          - { key: c, text: "Die E-Mail löschen und nichts weiter unternehmen." }
        answer: b
        why: "Ein sofortiger Anruf verhindert oft größeren Schaden."
      - q: "Sie entdecken eine unbekannte Abbuchung auf Ihrem Kontoauszug. — You discover an unknown withdrawal on your bank statement."
        options:
          - { key: a, text: "Die Abbuchung einfach ignorieren." }
          - { key: b, text: "Selbst versuchen, das Geld zurückzuholen." }
          - { key: c, text: "Die Bank informieren und eine Rückbuchung beantragen." }
        answer: c
        why: "Nur die Bank kann eine Rückbuchung für eine unbekannte Abbuchung veranlassen."
      - q: "Am Telefon meldet sich jemand, der angeblich von Ihrer Bank ist und nach Ihrer PIN fragt. — Someone on the phone claims to be from your bank and asks for your PIN."
        options:
          - { key: a, text: "Auflegen und die Bank über die offizielle Nummer selbst anrufen." }
          - { key: b, text: "Sofort die PIN am Telefon nennen." }
          - { key: c, text: "Der Person alle Kontodaten geben." }
        answer: a
        why: "Echte Banken fragen niemals am Telefon nach der PIN."
      - q: "Sie bekommen eine SMS mit einem Link von einer unbekannten Nummer. — You receive a text with a link from an unknown number."
        options:
          - { key: a, text: "Sofort auf den Link klicken, um zu sehen, was es ist." }
          - { key: b, text: "Den Link nicht anklicken und die SMS löschen oder melden." }
          - { key: c, text: "Die Nummer zurückrufen und Daten geben." }
        answer: b
        why: "Ein unbekannter Link sollte nie angeklickt werden."
      - q: "Ihre Kreditkarte wird im Ausland plötzlich gesperrt und Sie wissen nicht, warum. — Your credit card suddenly gets blocked abroad and you don't know why."
        options:
          - { key: a, text: "Einfach eine neue Karte kaufen." }
          - { key: b, text: "Die Sperrung ignorieren." }
          - { key: c, text: "Die Bank-Hotline anrufen und nach dem Grund fragen." }
        answer: c
        why: "Ein Anruf klärt schnell, ob die Sperrung wegen Betrugsverdachts erfolgte."
      - q: "Ihre Rückbuchung wird von der Bank abgelehnt. — Your chargeback is rejected by the bank."
        options:
          - { key: a, text: "Schriftlich Widerspruch einlegen und eine Begründung verlangen." }
          - { key: b, text: "Den Verlust einfach akzeptieren." }
          - { key: c, text: "Die Bank wechseln, ohne nachzufragen." }
        answer: a
        why: "Ein schriftlicher Widerspruch mit Begründung kann die Entscheidung noch ändern."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe leider auf den Phishing-Link {1}. (angeklickt, Partizip)
      2. Auf meinem Konto habe ich eine unbekannte Abbuchung {2}. (bemerkt, Partizip)
      3. Am Telefon habe ich sofort {3}. (das Gespräch beendet, Partizip)
      4. Die verdächtige SMS habe ich sofort {4}. (entfernt, Partizip)
      5. Meine Kreditkarte wurde im Ausland plötzlich {5}. (blockiert, Partizip)
      6. Meine Rückbuchung wurde leider {6}. (nicht akzeptiert, Partizip)
    answers:
      "1": geklickt
      "2": entdeckt
      "3": aufgelegt
      "4": gelöscht
      "5": gesperrt
      "6": abgelehnt

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
