lesson: "SIT/27-auf-einem-konzert-b1"
title: "Auf einem Konzert — B1"
topic: "Konzertabend"
category: "Freizeit & Kultur"
level: B1
summary: "Tickets besorgen, Einlass und Garderobe, Platz und Sichtlinie, jemanden im Getümmel verlieren und hinterher darüber reden."
intro: >
  Ein Konzertabend ist eine Kette kleiner Verhandlungen. Erst die
  Tickets: ausverkauft, Zweitmarkt, personalisiert oder nicht. Dann der
  Einlass mit Taschenkontrolle und Bändchen. Drinnen geht es um den
  Platz, die Sicht und die Frage, ob jemand kurz tauschen würde. Wenn
  du in Begleitung bist, verlierst du sie garantiert einmal und musst
  ohne Netz einen Treffpunkt ausmachen. Und hinterher redest du
  darüber — und dafür braucht es mehr als „war gut“. Grammatik nach
  Bedarf: Konjunktiv II für höfliche Bitten, Vergleiche, Nebensätze
  mit obwohl und als, Perfekt und Präteritum im Bericht. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

