  - id: B4
    block: B
    type: true-false
    title: "Die Kassen-Infos lesen"
    instructions: |
      > **Info — Krankenkasse**
      >
      > - **Anmeldung:** bei neuer Stelle **innerhalb von 2 Wochen**
      >   über den Arbeitgeber.
      > - **Bindungsfrist:** mindestens **18 Monate** bei derselben
      >   Kasse.
      > - **Kündigungsfrist:** in der Regel **2 Monate zum
      >   Monatsende**.
      > - **Sonderkündigungsrecht:** bei einer **Beitragserhöhung**
      >   sofort möglich.
      > - **Familienversicherung:** kostenlos, wenn der Ehepartner
      >   **wenig oder gar nicht verdient**.
      > - **Gesundheitskarte:** wird nach der Anmeldung
      >   **automatisch zugeschickt**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man muss sich innerhalb von zwei Wochen bei der neuen Stelle anmelden. — You must register within two weeks of starting a new job."
        answer: true
        why: "So steht es ausdrücklich in den Kassen-Infos."
      - q: "Die Bindungsfrist beträgt in der Regel nur einen Monat. — The minimum commitment period is usually only one month."
        answer: false
        why: "Sie beträgt mindestens 18 Monate, nicht einen Monat."
      - q: "Die Kündigungsfrist beträgt normalerweise zwei Monate zum Monatsende. — The notice period is usually two months to the end of the month."
        answer: true
        why: "„Kündigungsfrist: in der Regel 2 Monate zum Monatsende.“"
      - q: "Bei einer Beitragserhöhung gibt es kein Sonderkündigungsrecht. — There is no special right of termination when contributions increase."
        answer: false
        why: "Bei einer Beitragserhöhung ist ein Sonderkündigungsrecht gerade vorgesehen."
      - q: "Die Familienversicherung ist immer kostenpflichtig, unabhängig vom Einkommen des Partners. — Family co-insurance always costs money, regardless of the partner's income."
        answer: false
        why: "Sie ist kostenlos, wenn der Ehepartner wenig oder gar nicht verdient."
      - q: "Die Gesundheitskarte wird nach der Anmeldung automatisch zugeschickt. — The health card is sent automatically after registration."
        answer: true
        why: "„Gesundheitskarte: wird nach der Anmeldung automatisch zugeschickt.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Krankenkasse etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die alte Kasse bestätigt die Kündigung nicht rechtzeitig. — The old insurer doesn't confirm the cancellation in time."
        options:
          - { key: a, text: "Einfach abwarten, ohne nachzufragen." }
          - { key: b, text: "Schriftlich bei der alten Kasse nachfragen und den Kündigungsnachweis verlangen." }
          - { key: c, text: "Sofort bei einer dritten Kasse einen neuen Antrag stellen." }
        answer: b
        why: "Eine schriftliche Nachfrage sorgt für einen belastbaren Nachweis der Kündigung."
      - q: "Die Mitgliedsbescheinigung kommt nicht rechtzeitig beim Arbeitgeber an. — The membership certificate doesn't reach the employer in time."
        options:
          - { key: a, text: "Den Arbeitgeber einfach nicht informieren." }
          - { key: b, text: "Abwarten und nichts weiter unternehmen." }
          - { key: c, text: "Bei der Kasse nach einer schnelleren Zusendung fragen, z. B. per E-Mail." }
        answer: c
        why: "Eine schnellere Zusendung, etwa per E-Mail, löst das Zeitproblem meist sofort."
      - q: "Der Zusatzbeitrag wird erhöht, ohne dass man informiert wurde. — The supplementary contribution is raised without prior notice."
        options:
          - { key: a, text: "Sich bei der Kasse nach dem Sonderkündigungsrecht erkundigen." }
          - { key: b, text: "Den höheren Beitrag stillschweigend akzeptieren." }
          - { key: c, text: "Die Kasse sofort ohne Nachfrage wechseln, ohne die Fristen zu prüfen." }
        answer: a
        why: "Eine Beitragserhöhung löst meist ein Sonderkündigungsrecht aus, das man nutzen sollte."
      - q: "Die Familienversicherung wird abgelehnt, weil das Einkommen zu hoch war. — Family co-insurance is refused because the income was too high."
        options:
          - { key: a, text: "Die Ablehnung einfach so hinnehmen." }
          - { key: b, text: "Nach den genauen Einkommensgrenzen fragen und Alternativen prüfen." }
          - { key: c, text: "Ärgerlich bei der Kasse anrufen und auflegen." }
        answer: b
        why: "Die genauen Grenzen zu erfragen zeigt, ob Alternativen wie eine eigene Versicherung nötig sind."
      - q: "Die neue Gesundheitskarte kommt nicht an. — The new health card doesn't arrive."
        options:
          - { key: a, text: "Einfach ohne Karte zum Arzt gehen und hoffen, dass es klappt." }
          - { key: b, text: "Abwarten, bis die Karte irgendwann von selbst ankommt." }
          - { key: c, text: "Bei der Kasse nachfragen und eine Ersatzkarte beantragen." }
        answer: c
        why: "Eine Nachfrage bei der Kasse ist der direkteste Weg zu einer Ersatzkarte."
      - q: "Man hat versehentlich die Bindungsfrist noch nicht erfüllt. — You accidentally haven't yet completed the minimum commitment period."
        options:
          - { key: a, text: "Bei der Kasse nach dem genauen Ablaufdatum der Bindungsfrist fragen." }
          - { key: b, text: "Trotzdem sofort kündigen, ohne nachzufragen." }
          - { key: c, text: "Die Bindungsfrist einfach ignorieren." }
        answer: a
        why: "Das genaue Ablaufdatum zu erfragen verhindert eine ungültige Kündigung."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die alte Kasse hat die Kündigung nicht rechtzeitig {1}. (schriftlich zugesagt, Partizip)
      2. Die Bescheinigung ist beim Arbeitgeber nicht rechtzeitig {2}. (dort angelangt, Partizip)
      3. Der Beitrag wurde {3}, ohne dass man informiert wurde. (höher gemacht, Partizip)
      4. Die Familienversicherung wurde {4}, weil das Einkommen zu hoch war. (nicht genehmigt, Partizip)
      5. Die neue Gesundheitskarte ist nicht {5}. (dort eingetroffen, Partizip)
      6. Die Bindungsfrist war noch nicht {6}. (zu Ende, Partizip)
    answers:
      "1": bestätigt
      "2": eingetroffen
      "3": erhöht
      "4": abgelehnt
      "5": angekommen
      "6": abgelaufen

