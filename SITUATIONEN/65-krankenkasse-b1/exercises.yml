lesson: "SIT/65-krankenkasse-b1"
title: "Krankenkasse: anmelden und wechseln — B1"
topic: "Krankenkasse: anmelden und wechseln"
category: "Behörden & Formelles"
level: B1
summary: "Sich bei einer neuen Krankenkasse anmelden, die Familie mitversichern, die Kasse wechseln — und was tun, wenn der Zusatzbeitrag steigt oder die Bescheinigung nicht ankommt."
intro: >
  Bei einer neuen Stelle muss man sich innerhalb von zwei Wochen bei
  einer Krankenkasse anmelden, und wer wechseln möchte, muss
  Bindungsfrist, Kündigungsfrist und Zusatzbeitrag im Blick behalten.
  Dieses Set übt genau das: sich anmelden, die Familie mitversichern,
  die Kasse wechseln, und was zu tun ist, wenn der Beitrag steigt oder
  eine Bescheinigung nicht rechtzeitig ankommt. Grammatik nach Bedarf:
  Perfekt im Bericht, Passiv mit Modalverb, Nebensätze mit falls.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht
  → D Wiederholung. Answers in solutions.md.
exercises:

