  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Anmeldung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mich innerhalb von zwei Wochen bei der neuen Kasse anmelden. (Modalverb, ich-Form)
      2. {2} Sie mir eine Mitgliedsbescheinigung ausstellen? (können, Sie-Form)
      3. Ich {3} schon die Kündigung eingereicht. (haben, Perfekt)
      4. {4} wir den Zusatzbeitrag vorher vergleichen? (sollen, wir-Form)
      5. Falls der Beitrag {5}, kann man sonderkündigen. (steigen, Präsens)
      6. Die neue Kasse {6} sich um die Kündigung bei der alten kümmern. (werden, Futur I)
      7. Wir {7} schon die Familienversicherung beantragt. (haben, Perfekt)
      8. {8} ich die Bindungsfrist schon erfüllt? (haben, ich-Form Perfekt)
    answers:
