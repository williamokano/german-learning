    type: gap-bank
    title: "Bei der neuen Kasse und beim Wechsel"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich habe eine neue Stelle angetreten und brauche
      eine {1} für meinen Arbeitgeber.
      — Kein Problem, ich stelle Ihnen die gleich aus. Sind Sie schon
      bei uns {2}?
      — Ja, seit letzter Woche. Können Sie auch meine Frau über die
      {3} mitversichern?
      — Klar, dafür brauche ich nur ihre Daten.
      (Telefonat bei der alten Kasse)
      — Guten Tag, ich möchte zu einer anderen Krankenkasse {4}.
      — Kein Problem, dafür gilt bei uns eine {5} von 18 Monaten —
      die haben Sie erfüllt.
      — Gut, und wie lange ist die {6}?
      — Zwei Monate zum Monatsende.
      — Perfekt. Ich habe auch gehört, dass Ihr {7} gerade gestiegen
      ist — gilt da nicht ein {8}?
      — Stimmt, dann können Sie tatsächlich sofort außerordentlich
      kündigen.
      — Super, dann schicke ich Ihnen die Kündigung noch heute per
      {9}.
      — Alles klar, die neue Kasse kümmert sich dann um den {10}.
    bank: [MITGLIEDSBESCHEINIGUNG, ANGEMELDET, FAMILIENVERSICHERUNG, WECHSELN, BINDUNGSFRIST, KÜNDIGUNGSFRIST, ZUSATZBEITRAG, SONDERKÜNDIGUNGSRECHT, POST, KASSENWECHSEL, GESUNDHEITSKARTE, BEITRAGSSATZ, VERSICHERTENNUMMER, LEISTUNGSKATALOG]
    answers:
      "1": MITGLIEDSBESCHEINIGUNG
      "2": ANGEMELDET
      "3": FAMILIENVERSICHERUNG
      "4": WECHSELN
      "5": BINDUNGSFRIST
      "6": KÜNDIGUNGSFRIST
      "7": ZUSATZBEITRAG
      "8": SONDERKÜNDIGUNGSRECHT
      "9": POST
      "10": KASSENWECHSEL

  - id: B2
    block: B
    type: single-choice
    title: "Anmelden und wechseln"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest bei der neuen Krankenkasse eine Mitgliedsbescheinigung für den Arbeitgeber anfordern. — You want to request a membership certificate for your employer."
        options:
          - { key: a, text: "Bescheinigungen brauche ich sowieso nicht." }
          - { key: b, text: "Können Sie mir eine Mitgliedsbescheinigung für meinen Arbeitgeber ausstellen?" }
          - { key: c, text: "Stellen Sie mir irgendein Dokument aus." }
        answer: b
        why: "Eine konkrete, höfliche Bitte nennt genau, welches Dokument gebraucht wird."
      - q: "Du möchtest wissen, ob deine Familie über dich mitversichert werden kann. — You want to know whether your family can be co-insured through you."
        options:
          - { key: a, text: "Familie interessiert mich nicht." }
          - { key: b, text: "Versicherung ist Privatsache." }
          - { key: c, text: "Kann meine Familie über mich mitversichert werden?" }
        answer: c
        why: "Eine direkte Frage klärt sofort, ob die Familienversicherung möglich ist."
      - q: "Du möchtest zu einer anderen Krankenkasse wechseln. — You want to switch to a different health insurance provider."
        options:
          - { key: a, text: "Ich möchte zu einer anderen Krankenkasse wechseln." }
          - { key: b, text: "Kassen sind mir alle gleich." }
          - { key: c, text: "Wechseln ist mir zu kompliziert." }
        answer: a
        why: "Eine klare Aussage ist der übliche Einstieg beim Kassenwechsel."
      - q: "Du möchtest fragen, wie lange die Kündigungsfrist ist. — You want to ask how long the notice period is."
        options:
          - { key: a, text: "Fristen interessieren mich nicht." }
          - { key: b, text: "Wie lange ist die Kündigungsfrist bei Ihnen?" }
          - { key: c, text: "Ich kündige einfach, wann ich will." }
        answer: b
        why: "Eine konkrete Frage zur Frist hilft bei der Planung des Wechsels."
      - q: "Der Zusatzbeitrag deiner Kasse ist plötzlich gestiegen. — Your insurer's supplementary contribution has suddenly increased."
        options:
          - { key: a, text: "Beiträge sind mir egal." }
          - { key: b, text: "Das ist wohl so, da kann man nichts machen." }
          - { key: c, text: "Gilt da nicht ein Sonderkündigungsrecht?" }
        answer: c
        why: "Eine Beitragserhöhung löst häufig ein Sonderkündigungsrecht aus, das man nutzen kann."
      - q: "Du möchtest wissen, ob die Bindungsfrist schon erfüllt ist. — You want to know whether the minimum commitment period is already over."
        options:
          - { key: a, text: "Habe ich die Bindungsfrist schon erfüllt?" }
          - { key: b, text: "Bindungsfristen interessieren mich nicht." }
          - { key: c, text: "Ich wechsle sowieso nie die Kasse." }
        answer: a
        why: "Eine direkte Nachfrage klärt sicher, ob ein Wechsel schon möglich ist."

