  - id: D2
    block: D
    type: free-write
    title: "Anmelden, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: sich bei einer neuen Kasse anmelden und die Familie mitversichern, ein Problem mit dem Zusatzbeitrag, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du hast eine neue Stelle angetreten und meldest dich bei einer
      neuen Krankenkasse an. Kurz danach erfährst du, dass deine alte
      Kasse den Zusatzbeitrag erhöht hat, ohne dich zu informieren.

      Beim Anmelden müssen vorkommen:
      1. eine Mitgliedsbescheinigung für den Arbeitgeber anfordern
      2. die Familie über die Familienversicherung mitversichern
      3. nach der Gesundheitskarte fragen

      Beim Problem müssen vorkommen:
      4. von der Beitragserhöhung der alten Kasse erfahren
      5. sich nach dem Sonderkündigungsrecht erkundigen
      6. die Kündigungsfrist bei der alten Kasse prüfen

      In der Lösung müssen vorkommen:
      7. die Kündigung schriftlich einreichen
      8. eine Bestätigung von der alten Kasse bekommen
      9. bei der neuen Kasse den Kassenwechsel abschließen
      10. sich über den niedrigeren Beitrag freuen
    use:
      - "höfliche Bitte: „Können Sie mir eine Mitgliedsbescheinigung ausstellen?“"
      - "Passiv mit Modalverb: „Kann meine Familie mitversichert werden?“"
      - "Nebensatz mit falls: „Falls der Beitrag steigt, …“"
    selfCheck:
      - "Wird die Anmeldung bei der neuen Kasse klar beschrieben?"
      - "Klingt die Reaktion auf die Beitragserhöhung sachlich und informiert?"
      - "Wird die Kündigungsfrist bzw. das Sonderkündigungsrecht erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Anmelden**

      Ich: Guten Tag, ich habe eine neue Stelle angetreten und brauche eine Mitgliedsbescheinigung für meinen Arbeitgeber.
      Sachbearbeiterin: Kein Problem, ich stelle Ihnen die gleich aus. Kann ich auch Ihre Familie über die Familienversicherung mitversichern?
      Ich: Ja, gerne. Und wann bekomme ich die Gesundheitskarte?
      Sachbearbeiterin: Die wird automatisch zugeschickt, in etwa zwei Wochen.

      **Das Problem**

      (ein paar Tage später)
      Ich: Ich habe gehört, dass meine alte Kasse den Zusatzbeitrag erhöht hat — gilt da nicht ein Sonderkündigungsrecht?
      Freund: Stimmt, dann kannst du sofort außerordentlich kündigen, ohne die normale Kündigungsfrist abzuwarten.

      **Die Lösung**

      Ich: Guten Tag, ich möchte wegen der Beitragserhöhung außerordentlich kündigen.
      Alte Kasse: Das ist völlig in Ordnung, ich schicke Ihnen die Bestätigung noch heute per Post.
      Ich: Vielen Dank! Die neue Kasse kümmert sich dann um den Rest des Kassenwechsels.
      Freund: Perfekt, und am Ende zahlst du sogar weniger — nicht schlecht!
