lesson: "SIT/59-umzug-organisieren-a2"
title: "Umzug organisieren — A2"
topic: "Umzug organisieren"
category: "Wohnen & Nachbarschaft"
level: A2
summary: "Einen Umzugswagen mieten, Freunde um Hilfe bitten, sich ummelden — und was tun, wenn am Umzugstag etwas schiefgeht."
intro: >
  Ein Umzug braucht Planung: einen Umzugswagen mieten, genug helfende
  Hände organisieren, und danach die neue Adresse überall melden.
  Dieses Set übt genau das — Freunde höflich um Hilfe bitten, den
  Umzugswagen reservieren, sich beim Bürgeramt ummelden, und was zu
  tun ist, wenn am Umzugstag etwas nicht klappt. Grammatik nach
  Bedarf: Perfekt im Bericht, höfliche Bitten mit Konjunktiv II,
  Nebensätze mit falls. Blocks: A Wortschatz & Redemittel → B Dialoge →
  C Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

