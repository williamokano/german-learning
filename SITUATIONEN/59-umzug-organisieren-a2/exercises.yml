  - id: D2
    block: D
    type: free-write
    title: "Planen, Helfen, ein Problem lösen"
    prompt: "Schreib drei Teile: Freunde um Hilfe bitten und den Wagen mieten, ein Problem am Umzugstag, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du ziehst nächsten Samstag um. Du bittest zwei Freunde um Hilfe
      und mietest einen Umzugswagen. Am Umzugstag passt das Sofa nicht
      durch die Tür.

      Beim Planen müssen vorkommen:
      1. einen Freund höflich um Hilfe bitten
      2. die ungefähre Anzahl der Kartons nennen
      3. den Umzugswagen mieten

      Am Umzugstag müssen vorkommen:
      4. merken, dass das Sofa nicht durch die Tür passt
      5. gemeinsam nach einer Lösung suchen
      6. eine Alternative ausprobieren

      In der Lösung müssen vorkommen:
      7. das Sofa erfolgreich hineinbekommen
      8. euch bei den Helfern bedanken
      9. Pizza für alle bestellen
      10. euch über den gelungenen Umzug freuen
    use:
      - "höfliche Bitte: „Hättest du Zeit, …?“"
      - "Nebensatz mit falls: „Falls es regnet, …“"
      - "Perfekt: „Wir haben es geschafft.“"
    selfCheck:
      - "Ist die Bitte um Hilfe höflich formuliert?"
      - "Klingt die Reaktion auf das Sofa-Problem ruhig und lösungsorientiert?"
      - "Wird der Dank an die Helfer am Ende erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Planen**

      Ich: Hey, ich ziehe nächsten Samstag um. Hättest du Zeit, mir zu helfen?
      Freund: Klar, gerne! Wie viele Kartons habt ihr?
      Ich: So etwa fünfzehn, plus ein Sofa und einen Schrank.
      (Beim Verleih)
      Ich: Ich möchte einen Umzugswagen für Samstag mieten, den ganzen Tag.

      **Am Umzugstag**

      Freund: Warte, das Sofa passt nicht durch die Tür.
      Ich: Stimmt, lass uns überlegen — vielleicht geht es über den Balkon.
      Freund: Gute Idee, probieren wir das.

      **Die Lösung**

      Freund: Geschafft, es passt gerade so!
      Ich: Vielen Dank euch allen, ohne euch hätten wir das nicht geschafft.
      Freund: Gern, das war doch selbstverständlich.
      Ich: Als Dank gibt es jetzt Pizza für alle.
      Freund: Perfekt, ein gelungener Umzugstag!
