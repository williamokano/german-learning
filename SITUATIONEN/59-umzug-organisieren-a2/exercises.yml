  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Freunde um Hilfe bitten und den Wagen mieten"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hey, ich {1} nächsten Samstag um. Hättest du Zeit, mir zu
      {2}?
      — Klar, gerne! Wie viele {3} habt ihr?
      — So etwa fünfzehn, plus ein Sofa und einen Schrank.
      — Kein Problem, ich {4} um neun Uhr da.
      — Super, danke dir! Als Dank gibt es {5} für alle.
      (beim Verleih)
      — Guten Tag, ich möchte einen Umzugswagen für Samstag {6}.
      — Für welche {7} brauchen Sie ihn?
      — Von morgens bis abends, also den ganzen Tag.
      — Gut, dann {8} ich Ihnen den größeren Wagen.
      — Perfekt, und wie viel {9} das ungefähr?
      — Etwa siebzig Euro, {10} Kilometer.
    bank: [ZIEHE, HELFEN, KARTONS, BIN, PIZZA, MIETEN, DAUER, EMPFEHLE, KOSTET, INKLUSIVE, WOHNUNG, TRAGEN, GRÖSSE, EXTRA]
    answers:
      "1": ZIEHE
      "2": HELFEN
      "3": KARTONS
      "4": BIN
      "5": PIZZA
      "6": MIETEN
      "7": DAUER
      "8": EMPFEHLE
      "9": KOSTET
      "10": INKLUSIVE

  - id: B2
    block: B
    type: single-choice
    title: "Höflich um Hilfe bitten"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einen Freund um Hilfe beim Umzug bitten. — You want to ask a friend for help moving."
        options:
          - { key: a, text: "Hättest du Zeit, mir beim Umzug zu helfen?" }
          - { key: b, text: "Du hilfst mir am Samstag, klar?" }
          - { key: c, text: "Hilfe brauche ich sowieso nicht." }
        answer: a
        why: "Eine höfliche Frage lässt der Person die Möglichkeit, frei zu entscheiden."
      - q: "Du möchtest wissen, wie viele Kartons deine Freunde einplanen sollen. — You want your friends to know roughly how many boxes there are."
        options:
          - { key: a, text: "Kartons zählen ist mir zu anstrengend." }
          - { key: b, text: "So etwa fünfzehn, plus ein Sofa und einen Schrank." }
          - { key: c, text: "Wir haben halt Zeug." }
        answer: b
        why: "Eine ungefähre, konkrete Angabe hilft den Helfenden, sich vorzubereiten."
      - q: "Du möchtest einen Umzugswagen mieten. — You want to rent a moving van."
        options:
          - { key: a, text: "Geben Sie mir sofort einen Wagen." }
          - { key: b, text: "Wagen sind mir egal." }
          - { key: c, text: "Ich möchte einen Umzugswagen für Samstag mieten." }
        answer: c
        why: "Eine höfliche, konkrete Anfrage ist der übliche Einstieg beim Verleih."
      - q: "Du möchtest dich bei den Helfern bedanken. — You want to thank your helpers."
        options:
          - { key: a, text: "Vielen Dank euch allen, ohne euch hätten wir das nicht geschafft." }
          - { key: b, text: "Na, das war ja selbstverständlich." }
          - { key: c, text: "Nichts sagen und einfach gehen." }
        answer: a
        why: "Ein herzlicher Dank ist die übliche und angemessene Reaktion nach so viel Hilfe."
      - q: "Du möchtest fragen, wie lange die Anmietung des Wagens dauern darf. — You want to ask how long you can keep the rented van."
        options:
          - { key: a, text: "Dauer ist mir egal." }
          - { key: b, text: "Für welche Dauer kann ich den Wagen mieten?" }
          - { key: c, text: "Ich bringe ihn zurück, wann ich will." }
        answer: b
        why: "Eine klare Frage zur Mietdauer verhindert spätere Zusatzkosten."
      - q: "Ein Nachbar fragt, warum ein Halteverbotsschild vor dem Haus steht. — A neighbour asks why there's a no-parking sign outside."
        options:
          - { key: a, text: "Das geht Sie nichts an." }
          - { key: b, text: "Keine Ahnung, das war schon immer da." }
          - { key: c, text: "Wir ziehen am Samstag um und brauchen den Platz für den Umzugswagen." }
        answer: c
        why: "Eine kurze, freundliche Erklärung ist eine höfliche Reaktion auf die Nachfrage eines Nachbarn."

