  - id: B4
    block: B
    type: true-false
    title: "Die Umzugs-Checkliste lesen"
    instructions: |
      > **Checkliste — Umzug organisieren**
      >
      > - **Umzugswagen:** mindestens **eine Woche vorher** reservieren.
      > - **Ummeldung:** innerhalb von **zwei Wochen** nach dem Umzug
      >   beim Bürgeramt erledigen.
      > - **Nachsendeauftrag:** kann für **6 oder 12 Monate**
      >   eingerichtet werden.
      > - **Halteverbotsschild:** mindestens **48 Stunden vorher**
      >   aufstellen, sonst ungültig.
      > - **Helfer:** rechtzeitig fragen, am besten **zwei bis drei
      >   Wochen vorher**.
      > - Nach dem Umzug: **Zählerstände** von Strom und Gas notieren.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Der Umzugswagen sollte mindestens eine Woche vorher reserviert werden. — The van should be reserved at least a week ahead."
        answer: true
        why: "So steht es ausdrücklich in der Checkliste."
      - q: "Die Ummeldung muss erst nach zwei Monaten erfolgen. — Re-registration only needs to happen after two months."
        answer: false
        why: "Sie muss innerhalb von zwei Wochen erfolgen, nicht zwei Monaten."
      - q: "Der Nachsendeauftrag kann für sechs oder zwölf Monate eingerichtet werden. — The mail forwarding can be set up for six or twelve months."
        answer: true
        why: "„Nachsendeauftrag: kann für 6 oder 12 Monate eingerichtet werden.“"
      - q: "Das Halteverbotsschild ist auch ohne Vorlauf sofort gültig. — The no-parking sign is valid immediately, without advance notice."
        answer: false
        why: "Es muss mindestens 48 Stunden vorher aufgestellt werden, sonst ist es ungültig."
      - q: "Helfer sollte man erst am Umzugstag selbst fragen. — Helpers should only be asked on the day of the move itself."
        answer: false
        why: "Am besten zwei bis drei Wochen vorher fragen."
      - q: "Nach dem Umzug sollte man die Zählerstände notieren. — After the move, meter readings should be noted."
        answer: true
        why: "„Nach dem Umzug: Zählerstände von Strom und Gas notieren.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn am Umzugstag etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Der reservierte Umzugswagen ist plötzlich nicht verfügbar. — The reserved van is suddenly unavailable."
        options:
          - { key: a, text: "Sofort beim Verleih nach einer Alternative fragen." }
          - { key: b, text: "Den Umzug spontan komplett absagen." }
          - { key: c, text: "Nichts tun und hoffen, dass sich das Problem von selbst löst." }
        answer: a
        why: "Eine schnelle Nachfrage nach einer Alternative rettet meist den Zeitplan."
      - q: "Ein Helfer sagt kurzfristig ab. — A helper cancels at short notice."
        options:
          - { key: a, text: "Sich beim Helfer beschweren." }
          - { key: b, text: "Kurz in der Gruppe fragen, ob jemand anderes einspringen kann." }
          - { key: c, text: "Alles allein tragen wollen." }
        answer: b
        why: "Eine schnelle Nachfrage in der Gruppe findet oft doch noch Ersatz."
      - q: "Ein Sofa passt nicht durch die Tür. — A sofa doesn't fit through the door."
        options:
          - { key: a, text: "Das Sofa mit Gewalt hineinzwängen." }
          - { key: b, text: "Das Sofa einfach draußen stehen lassen." }
          - { key: c, text: "Gemeinsam überlegen, ob es über den Balkon oder in Einzelteilen geht." }
        answer: c
        why: "Alternative Wege zu prüfen ist sicherer als das Möbelstück oder die Tür zu beschädigen."
      - q: "Der reservierte Parkplatz für den Umzugswagen ist zugeparkt. — The reserved parking spot for the van is blocked."
        options:
          - { key: a, text: "Die Polizei oder das Ordnungsamt informieren, damit abgeschleppt werden kann." }
          - { key: b, text: "Den Wagen irgendwo mitten auf der Straße stehen lassen." }
          - { key: c, text: "Den Umzug einfach verschieben." }
        answer: a
        why: "Bei einem gültigen Halteverbot kann das Ordnungsamt das blockierende Auto abschleppen lassen."
      - q: "Du hast vergessen, dich rechtzeitig ummelden zu lassen. — You forgot to re-register your address on time."
        options:
          - { key: a, text: "So schnell wie möglich einen Termin beim Bürgeramt vereinbaren." }
          - { key: b, text: "Es einfach nicht mehr machen." }
          - { key: c, text: "Warten, bis jemand danach fragt." }
        answer: a
        why: "Schnell nachzuholen ist der beste Weg, ein mögliches Bußgeld zu vermeiden."
      - q: "Ein Möbelstück wird beim Tragen leicht beschädigt. — A piece of furniture gets slightly damaged while being carried."
        options:
          - { key: a, text: "Den Schaden ansehen, gemeinsam entscheiden, wie ernst er ist, und ruhig bleiben." }
          - { key: b, text: "Dem Helfer laut die Schuld geben." }
          - { key: c, text: "Weiterarbeiten, als wäre nichts passiert." }
        answer: a
        why: "Ruhig zu bleiben und den Schaden gemeinsam einzuschätzen ist die vernünftigste Reaktion."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der reservierte Umzugswagen war plötzlich nicht {1}. (nicht zu bekommen)
      2. Ein Helfer hat kurzfristig {2}. (nicht mehr kommen können, Perfekt)
      3. Das Sofa {3} nicht durch die Tür. (die richtige Größe haben)
      4. Der Parkplatz für den Wagen war {4}. (mit einem anderen Auto besetzt)
      5. Ich habe vergessen, mich rechtzeitig {5}. (die neue Adresse melden, Infinitiv)
      6. Ein Möbelstück wurde beim Tragen leicht {6}. (kaputtgemacht, Partizip)
    answers:
      "1": verfügbar
      "2": abgesagt
      "3": passte
      "4": zugeparkt
      "5": umzumelden
      "6": beschädigt

