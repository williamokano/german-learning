  - id: B4
    block: B
    type: true-false
    title: "Die Buchhandlungs-Infos lesen"
    instructions: |
      > **Info — Buchhandlung**
      >
      > - **Bestellung:** ein vergriffenes Buch kann meist innerhalb
      >   von **3–4 Werktagen** geliefert werden.
      > - **Geschenkverpackung:** in vielen Buchhandlungen
      >   **kostenlos**.
      > - **Leseprobe:** liegt oft schon **im Laden aus** oder online
      >   verfügbar.
      > - **Signierte Exemplare:** nur bei besonderen **Lesungen oder
      >   Events** erhältlich.
      > - **Rückgabe:** unbeschädigte Bücher können meist
      >   **innerhalb von 14 Tagen** zurückgegeben werden.
      > - **Mitgliedskarte:** viele Buchhandlungen bieten einen
      >   **Rabatt für Stammkunden**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein vergriffenes Buch kann meist innerhalb von drei bis vier Werktagen geliefert werden. — An out-of-stock book can usually be delivered within three to four working days."
        answer: true
        why: "So steht es ausdrücklich in den Buchhandlungs-Infos."
      - q: "Geschenkverpackung kostet in den meisten Buchhandlungen extra. — Gift wrapping costs extra in most bookshops."
        answer: false
        why: "Sie ist in vielen Buchhandlungen kostenlos, nicht kostenpflichtig."
      - q: "Signierte Exemplare bekommt man jederzeit, ganz ohne besonderen Anlass. — Signed copies are available anytime, without a special occasion."
        answer: false
        why: "Sie gibt es nur bei besonderen Lesungen oder Events."
      - q: "Unbeschädigte Bücher können meist innerhalb von 14 Tagen zurückgegeben werden. — Undamaged books can usually be returned within 14 days."
        answer: true
        why: "„Rückgabe: unbeschädigte Bücher können meist innerhalb von 14 Tagen zurückgegeben werden.“"
      - q: "Eine Leseprobe liegt oft schon im Laden aus. — A sample excerpt is often already available in the shop."
        answer: true
        why: "„Leseprobe: liegt oft schon im Laden aus oder online verfügbar.“"
      - q: "Eine Mitgliedskarte bringt in der Regel keinerlei Vorteile. — A membership card usually brings no benefits at all."
        answer: false
        why: "Sie bringt meist einen Rabatt für Stammkunden."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Buchkauf etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Das gewünschte Buch ist überall vergriffen. — The desired book is out of stock everywhere."
        options:
          - { key: a, text: "Das Buch einfach vergessen und nie wieder lesen." }
          - { key: b, text: "Nach einer anderen Ausgabe oder einem Antiquariat fragen." }
          - { key: c, text: "Sich bei der Buchhandlung laut beschweren, ohne nach Alternativen zu fragen." }
        answer: b
        why: "Ein Antiquariat oder eine andere Ausgabe ist oft eine gute Alternative bei einem vergriffenen Buch."
      - q: "Ein bestelltes Buch kommt viel später als angekündigt an. — An ordered book arrives much later than announced."
        options:
          - { key: a, text: "Einfach endlos weiter warten, ohne nachzufragen." }
          - { key: b, text: "Die Bestellung sofort stornieren, ohne nachzufragen." }
          - { key: c, text: "Höflich in der Buchhandlung nach dem Stand der Bestellung fragen." }
        answer: c
        why: "Eine höfliche Nachfrage klärt meist schnell, woran es liegt."
      - q: "Das gelieferte Buch hat einen Druckfehler oder fehlende Seiten. — The delivered book has a printing error or missing pages."
        options:
          - { key: a, text: "Es zur Buchhandlung zurückbringen und umtauschen." }
          - { key: b, text: "Die fehlenden Seiten einfach ignorieren." }
          - { key: c, text: "Das Buch trotzdem behalten und nichts sagen." }
        answer: a
        why: "Ein Umtausch ist bei einem defekten Exemplar die naheliegende Lösung."
      - q: "Man hat aus Versehen das falsche Buch gekauft. — You accidentally bought the wrong book."
        options:
          - { key: a, text: "Das falsche Buch einfach behalten." }
          - { key: b, text: "Es innerhalb der Rückgabefrist unbeschädigt zurückbringen." }
          - { key: c, text: "Es verschenken, auch wenn es das falsche ist." }
        answer: b
        why: "Eine rechtzeitige, unbeschädigte Rückgabe löst das Problem am einfachsten."
      - q: "Die gewünschte Geschenkverpackung ist gerade nicht verfügbar. — The desired gift wrapping isn't available right now."
        options:
          - { key: a, text: "Ohne Verpackung gehen und sich ärgern." }
          - { key: b, text: "Das Geschenk einfach so übergeben, ohne zu fragen." }
          - { key: c, text: "Freundlich nach einer Alternative fragen, z. B. selbst verpacken." }
        answer: c
        why: "Eine freundliche Nachfrage nach einer Alternative findet meist eine Lösung."
      - q: "Eine online bestellte Leseprobe funktioniert nicht. — An online-ordered sample excerpt doesn't work."
        options:
          - { key: a, text: "Die Buchhandlung kontaktieren und um Hilfe bitten." }
          - { key: b, text: "Die Leseprobe einfach vergessen." }
          - { key: c, text: "Sich online öffentlich beschweren, ohne die Buchhandlung zu kontaktieren." }
        answer: a
        why: "Der direkte Kontakt zur Buchhandlung löst technische Probleme meist am schnellsten."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Das Buch war überall {1}. (nicht mehr erhältlich)
      2. Die Bestellung ist viel später als angekündigt {2}. (dort eingetroffen, Partizip)
      3. Das gelieferte Buch hatte einen {3}. (Fehler beim Drucken)
