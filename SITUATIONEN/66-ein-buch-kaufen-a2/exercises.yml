  - id: D2
    block: D
    type: free-write
    title: "Suchen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: dich beraten lassen und ein Format wählen, ein Problem mit einem vergriffenen Buch, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du suchst ein Geschenk für deine Schwester in einer Buchhandlung.
      Du lässt dich beraten und wählst zwischen Taschenbuch und
      gebundener Ausgabe. In einer zweiten Buchhandlung ist das
      eigentlich gewünschte Buch leider vergriffen.

      Beim Suchen müssen vorkommen:
      1. nach einer Empfehlung fragen
      2. nach einer aktuellen Neuerscheinung fragen
      3. zwischen Taschenbuch und gebundener Ausgabe wählen

      Beim Problem müssen vorkommen:
      4. erfahren, dass das gewünschte Buch vergriffen ist
      5. nach einer Bestellung fragen
      6. die Lieferzeit erfragen

      In der Lösung müssen vorkommen:
      7. das Buch bestellen
      8. sich benachrichtigen lassen, sobald es da ist
      9. das Buch pünktlich abholen
      10. sich über das gelungene Geschenk freuen
    use:
      - "höfliche Frage: „Können Sie mir etwas empfehlen?“"
      - "Nebensatz mit falls: „Falls das Buch nicht vorrätig ist, …“"
      - "Perfekt: „Ich habe die Leseprobe gelesen.“"
    selfCheck:
      - "Wird nach einer Empfehlung gefragt?"
      - "Klingt die Reaktion auf das vergriffene Buch ruhig und lösungsorientiert?"
      - "Wird die Benachrichtigung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Suchen**

      Ich: Guten Tag, ich suche ein Geschenk für meine Schwester. Können Sie mir etwas empfehlen?
      Verkäuferin: Gerne, haben Sie eine aktuelle Neuerscheinung im Kopf?
      Ich: Nein, aber gibt es das Buch auch als gebundene Ausgabe?
      Verkäuferin: Ja, beides ist da.

      **Das Problem**

      (in der zweiten Buchhandlung)
      Ich: Guten Tag, ich suche „Der Sommer der Wale" — haben Sie das noch?
      Verkäufer: Leider ist das gerade vergriffen, aber ich kann es für Sie bestellen.
      Ich: Wie lange dauert die Lieferzeit ungefähr?
      Verkäufer: Etwa drei bis vier Werktage.

      **Die Lösung**

      Ich: Gut, dann bestelle ich es. Können Sie mich benachrichtigen, sobald es da ist?
      Verkäufer: Natürlich, gerne per E-Mail.
      (vier Tage später)
      Verkäufer: Ihr Buch ist angekommen!
      Ich: Perfekt, meine Schwester wird sich riesig freuen!
