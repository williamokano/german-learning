  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "In der Buchhandlung"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich suche ein Geschenk für meine Schwester. Können
      Sie mir etwas {1}?
      — Gerne, was liest sie denn am liebsten?
      — Vor allem Krimis. Haben Sie eine aktuelle {2}?
      — Ja, dieser hier ist erst letzte Woche erschienen und sehr
      beliebt.
      — Perfekt. Gibt es den auch als {3} Ausgabe, oder nur als
      Taschenbuch?
      — Beides — welche Ausgabe möchten Sie?
      — Ich nehme die gebundene Ausgabe, die wirkt {4} als Geschenk.
      — Gute Wahl. Möchten Sie vorher noch eine {5} lesen?
      — Nein, danke, das reicht mir schon.
      (am nächsten Tag, andere Buchhandlung)
      — Guten Tag, ich suche „Der Sommer der Wale" — haben Sie das
      noch?
      — Leider ist das gerade {6}, aber ich kann es für Sie {7}.
      — Wie lange dauert die {8} ungefähr?
      — Etwa drei bis vier Werktage.
      — Gut, dann {9} ich es. Können Sie mich {10}, sobald es da
      ist?
      — Natürlich, gerne per E-Mail.
    bank: [EMPFEHLEN, NEUERSCHEINUNG, GEBUNDENE, HOCHWERTIGER, LESEPROBE, VERGRIFFEN, BESTELLEN, LIEFERZEIT, NEHME, BENACHRICHTIGEN, TASCHENBUCH, SIGNIERT, RATGEBER, GESCHENKPAPIER]
    answers:
      "1": EMPFEHLEN
      "2": NEUERSCHEINUNG
      "3": GEBUNDENE
      "4": HOCHWERTIGER
      "5": LESEPROBE
      "6": VERGRIFFEN
      "7": BESTELLEN
      "8": LIEFERZEIT
      "9": NEHME
      "10": BENACHRICHTIGEN

  - id: B2
    block: B
    type: single-choice
    title: "Beraten lassen und wählen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest dich in der Buchhandlung beraten lassen. — You want advice at the bookshop."
        options:
          - { key: a, text: "Bücher interessieren mich nicht." }
          - { key: b, text: "Können Sie mir etwas empfehlen?" }
          - { key: c, text: "Ich finde das schon alleine." }
        answer: b
        why: "Eine höfliche, direkte Bitte um Empfehlung ist der übliche Einstieg in der Buchhandlung."
      - q: "Du möchtest wissen, ob es eine aktuelle Neuerscheinung gibt. — You want to know if there's a current new release."
        options:
          - { key: a, text: "Neuerscheinungen interessieren mich nicht." }
          - { key: b, text: "Neue Bücher sind mir zu teuer." }
          - { key: c, text: "Haben Sie eine aktuelle Neuerscheinung von diesem Autor?" }
        answer: c
        why: "Eine konkrete Frage nach einer Neuerscheinung führt direkt zum Ziel."
      - q: "Du möchtest zwischen Taschenbuch und gebundener Ausgabe wählen. — You want to choose between paperback and hardcover."
        options:
          - { key: a, text: "Gibt es das Buch auch als gebundene Ausgabe?" }
          - { key: b, text: "Ausgaben sind mir alle gleich." }
          - { key: c, text: "Ich nehme einfach irgendeine." }
        answer: a
        why: "Eine konkrete Nachfrage klärt, welche Ausgaben verfügbar sind."
      - q: "Du möchtest vor dem Kauf eine Leseprobe lesen. — You want to read a sample before buying."
        options:
          - { key: a, text: "Leseproben interessieren mich nicht." }
          - { key: b, text: "Kann ich vorher kurz reinlesen?" }
          - { key: c, text: "Ich kaufe sowieso blind." }
        answer: b
        why: "Eine kurze Nachfrage ist der übliche Weg zu einer Leseprobe."
      - q: "Die Verkäuferin sagt, das gewünschte Buch ist vergriffen. — The seller says the desired book is out of stock."
        options:
          - { key: a, text: "Dann eben nicht." }
          - { key: b, text: "Das ist mir egal." }
          - { key: c, text: "Können Sie es für mich bestellen?" }
        answer: c
        why: "Eine Nachfrage zur Bestellung ist die naheliegende Lösung bei einem vergriffenen Buch."
      - q: "Du möchtest wissen, wie lange die Lieferzeit für ein bestelltes Buch ist. — You want to know the delivery time for an ordered book."
        options:
          - { key: a, text: "Wie lange dauert die Lieferzeit ungefähr?" }
          - { key: b, text: "Ich warte einfach, wie lange es dauert." }
          - { key: c, text: "Lieferzeiten interessieren mich nicht." }
        answer: a
        why: "Eine direkte Frage zur Lieferzeit hilft bei der Planung des Geschenks."

