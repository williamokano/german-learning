      5. Die gewünschte Geschenkverpackung war nicht {5}. (nicht vorhanden)
      6. Die online bestellte Leseprobe hat nicht {6}. (nicht richtig gearbeitet)
    answers:
      "1": vergriffen
      "2": angekommen
      "3": Druckfehler
      "4": gekauft
      "5": verfügbar
      "6": funktioniert

