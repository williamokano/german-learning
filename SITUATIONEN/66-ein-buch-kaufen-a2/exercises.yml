lesson: "SIT/66-ein-buch-kaufen-a2"
title: "Ein Buch kaufen — A2"
topic: "Ein Buch kaufen"
category: "Einkaufen"
level: A2
summary: "Sich in der Buchhandlung beraten lassen, zwischen Taschenbuch und gebundener Ausgabe wählen — und was tun, wenn das gewünschte Buch vergriffen ist."
intro: >
  Ein Buch als Geschenk zu finden braucht manchmal etwas Beratung: nach
  einem Genre fragen, eine Neuerscheinung entdecken, zwischen
  Taschenbuch und gebundener Ausgabe wählen — und geduldig bleiben, wenn
  das gewünschte Buch gerade vergriffen ist. Dieses Set übt genau das:
  sich beraten lassen, eine Leseprobe lesen, ein Buch bestellen, und was
  zu tun ist, wenn beim Kauf etwas schiefgeht. Grammatik nach Bedarf:
  Perfekt im Bericht, höfliche Fragen, Nebensätze mit falls. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

