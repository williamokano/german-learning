      - { key: "2", text: "die Leihfrist" }
      - { key: "3", text: "die Verlängerung" }
      - { key: "4", text: "die Vormerkung" }
      - { key: "5", text: "die Mahngebühr" }
      - { key: "6", text: "der Lesesaal" }
      - { key: "7", text: "die Fernleihe" }
      - { key: "8", text: "die Signatur" }
    right:
      - { key: a, text: "Wie lange du ein Buch behalten darfst." }
      - { key: b, text: "Die Karte, mit der du ausleihen kannst." }
      - { key: c, text: "Was du zahlst, wenn du zu spät zurückgibst." }
      - { key: d, text: "Wenn du dir ein ausgeliehenes Buch reservierst." }
      - { key: e, text: "Mehr Zeit für ein Buch, das du noch brauchst." }
      - { key: f, text: "Die Nummer, mit der du das Buch im Regal findest." }
