lesson: "SIT/12-bibliothek-a2"
title: "In der Bibliothek — A2"
topic: "In der Bibliothek"
category: "Freizeit & Kultur"
level: A2
summary: "Ausweis beantragen, ausleihen und verlängern, den Lesesaal nutzen — und reagieren, wenn die Frist abgelaufen oder das Buch beschädigt ist."
intro: >
  Die Stadtbibliothek ist einer der günstigsten Orte zum Deutschlernen —
  und einer der ersten, an denen man einen Ausweis beantragen kann, ohne
  dass es kompliziert wird. Dieses Set übt das Praktische: anmelden,
  ausleihen, verlängern, vormerken, im Lesesaal arbeiten. Grammatik nach
  Bedarf: trennbare Verben (ausleihen, zurückgeben, verlängern,
  vormerken), Zeitangaben mit „bis“ und „innerhalb von“, höfliche
  Fragen. Block C: Frist abgelaufen, Buch beschädigt, Ausweis vergessen.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

