  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Trennbare Verben in der Bibliothek"
    instructions: "Ergänze das Verb in der richtigen Form. Achte auf die Vorsilbe."
    instructionsEn: "Fill in the verb in the correct form. Watch the prefix."
    text: |
      1. Ich {1} drei Bücher {2}. (ausleihen)
      2. {3} Sie die Bücher bitte bis Freitag {4}. (zurückgeben)
      3. Kann ich die Leihfrist online {5}? (verlängern — kein trennbares Verb)
      4. Ich {6} mir den neuen Roman {7}. (vormerken)
      5. Die Bibliothek {8} um zehn Uhr {9}. (aufmachen)
      6. Bitte {10} Sie Ihren Ausweis mit. (mitbringen)
    answers:
      "1": leihe
      "2": aus
      "3": Geben
      "4": zurück
      "5": verlängern
      "6": merke
      "7": vor
      "8": macht
      "9": auf
      "10": bringen

