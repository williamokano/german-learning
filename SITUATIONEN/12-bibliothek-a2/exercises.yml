  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "An der Theke: Ausweis beantragen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich möchte einen Bibliotheks{1} beantragen.
      — Gern. Haben Sie einen {2} und eine Meldebescheinigung dabei?
      — Den Ausweis ja, die Meldebescheinigung nicht. Reicht mein
      {3}?
      — Ja, wenn Ihre Adresse darauf steht. Der Ausweis {4} ein Jahr
      und kostet 15 Euro.
      — Und für Studierende?
      — Dann sind es 8 Euro. Haben Sie eine {5}?
      — Ja, hier. Wie viele Bücher darf ich {6}?
      — Bis zu zwanzig, die {7} beträgt vier Wochen.
      — Kann ich {8} auch online?
      — Ja, zweimal, über Ihr Online-Konto. Bitte {9} Sie Ihre
      Bücher rechtzeitig zurück — sonst fallen {10} an.
    bank: [AUSWEIS, PERSONALAUSWEIS, MELDEFORMULAR, GILT, STUDIENBESCHEINIGUNG, AUSLEIHEN, LEIHFRIST, VERLÄNGERN, GEBEN, MAHNGEBÜHREN, WOHER, LESEN, KAUFEN, BRINGEN]
    answers:
      "1": AUSWEIS
      "2": PERSONALAUSWEIS
      "3": MELDEFORMULAR
      "4": GILT
      "5": STUDIENBESCHEINIGUNG
      "6": AUSLEIHEN
      "7": LEIHFRIST
      "8": VERLÄNGERN
      "9": GEBEN
      "10": MAHNGEBÜHREN

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du suchst ein bestimmtes Buch. — You're looking for a particular book."
        options:
          - { key: a, text: "Wo sind die Bücher?" }
          - { key: b, text: "Entschuldigung, haben Sie „Der Vorleser“ von Bernhard Schlink?" }
          - { key: c, text: "Ich brauche ein Buch." }
        answer: b
        why: 'Titel und Autor nennen — damit findet die Auskunft das Buch in Sekunden.'
      - q: "Das Buch ist ausgeliehen. — The book is on loan."
        options:
          - { key: a, text: "Könnte ich es vormerken lassen?" }
          - { key: b, text: "Wann kommt es zurück?" }
          - { key: c, text: "Dann kaufe ich es." }
        answer: a
        why: 'Vormerken ist der eingebaute Weg — du wirst benachrichtigt, sobald es zurück ist.'
      - q: "Du brauchst ein Buch länger. — You need a book for longer."
        options:
          - { key: a, text: "Ich behalte es einfach." }
          - { key: b, text: "Kann ich die Leihfrist verlängern?" }
          - { key: c, text: "Ich gebe es später zurück." }
        answer: b
        why: 'Verlängern ist kostenlos und geht meist online — einfach behalten kostet Gebühren.'
      - q: "Im Lesesaal klingelt dein Handy. — Your phone rings in the reading room."
        options:
          - { key: a, text: "Kurz leise sprechen." }
          - { key: b, text: "Sofort stumm schalten und zum Telefonieren hinausgehen." }
          - { key: c, text: "Das Gespräch wegdrücken und weiterarbeiten." }
        answer: b
        why: 'Im Lesesaal wird nicht telefoniert — hinausgehen ist die einzige akzeptierte Lösung.'
      - q: "Du willst wissen, ob es das Buch auch als Hörbuch gibt. — You want to know if the book is available as an audiobook."
        options:
          - { key: a, text: "Gibt es den Titel auch als Hörbuch?" }
          - { key: b, text: "Haben Sie was zum Hören?" }
          - { key: c, text: "Ich lese nicht gern." }
        answer: a
        why: 'Konkret nach dem Format fragen — Bibliotheken haben oft beides plus E-Book.'
      - q: "Ein Buch aus einer anderen Stadt wäre nötig. — A book from another city would be needed."
        options:
          - { key: a, text: "Dann fahre ich dorthin." }
          - { key: b, text: "Wäre eine Fernleihe möglich?" }
          - { key: c, text: "Dann geht es nicht." }
        answer: b
        why: 'Die Fernleihe holt Bücher aus anderen Bibliotheken — gegen eine kleine Gebühr.'

  - id: B3
    block: B
    type: order
    title: "Sätze in der Bibliothek bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "einen", "Bibliotheksausweis", "beantragen"]
        answer: [0, 1, 2, 3, 4]
        note: "Modalverb an Position 2, Infinitiv am Ende"
      - tiles: ["Kann", "ich", "die", "Leihfrist", "online", "verlängern", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Ja/Nein-Frage, Infinitiv am Ende"
      - tiles: ["Ich", "leihe", "drei", "Bücher", "aus"]
        answer: [0, 1, 2, 3, 4]
        note: "Trennverb aus·leihen: aus am Ende"
      - tiles: ["Könnte", "ich", "das", "Buch", "vormerken", "lassen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Zwei Infinitive am Ende: vormerken lassen"
      - tiles: ["Die", "Bücher", "sind", "bis", "zum", "14.", "Juni", "ausgeliehen"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Zustandspassiv: sind … ausgeliehen"
      - tiles: ["Bitte", "geben", "Sie", "die", "Bücher", "rechtzeitig", "zurück"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Imperativ mit Sie, zurück am Satzende"

  - id: B4
    block: B
    type: true-false
    title: "Die Benutzungsordnung lesen"
    instructions: |
      > **Stadtbibliothek — Benutzung auf einen Blick**
      >
      > **Ausweis**
      > - Jahresgebühr: 15 € · ermäßigt (Studierende, Azubis): 8 €
      > - Kinder und Jugendliche bis 18: kostenlos
      > - Mitzubringen: Personalausweis oder Reisepass mit Meldeadresse
      >
      > **Ausleihe**
      > - bis zu 20 Medien gleichzeitig
      > - Leihfrist: 4 Wochen, zweimal verlängerbar
      > - DVDs und Zeitschriften: 1 Woche, nicht verlängerbar
      >
      > **Gebühren**
      > - Mahngebühr ab dem ersten Tag der Überschreitung: 0,50 € pro
      >   Medium und Woche
      > - Ersatz bei Verlust: Wiederbeschaffungswert plus 10 € Bearbeitung
      >
      > Öffnungszeiten: Mo–Fr 10:00–19:00, Sa 10:00–14:00. Der Lesesaal
      > schließt jeweils eine halbe Stunde früher.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Eine Studentin zahlt 8 € im Jahr. — A student pays €8 a year."
        answer: true
        why: "„ermäßigt (Studierende, Azubis): 8 €“."
      - q: "Eine DVD kann man zweimal verlängern. — You can renew a DVD twice."
        answer: false
        why: "„DVDs und Zeitschriften: 1 Woche, nicht verlängerbar“."
      - q: "Zwei Bücher, eine Woche zu spät, kosten 1,00 €. — Two books, one week late, cost €1.00."
        answer: true
        why: "0,50 € pro Medium und Woche × 2 Medien."
      - q: "Am Samstag ist der Lesesaal bis 14:00 Uhr offen. — On Saturday the reading room is open until 14:00."
        answer: false
        why: "Der Lesesaal schließt eine halbe Stunde früher, also um 13:30 Uhr."
      - q: "Ein 16-Jähriger zahlt die ermäßigte Gebühr. — A 16-year-old pays the reduced fee."
        answer: false
        why: "Bis 18 ist es kostenlos, nicht ermäßigt."
      - q: "Bei Verlust zahlt man nur den Preis des Buches. — If you lose a book you only pay its price."
        answer: false
        why: "Wiederbeschaffungswert plus 10 € Bearbeitungsgebühr."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Der Ernstfall"
    instructions: "Was machst oder sagst du? Wähle a, b oder c."
    instructionsEn: "What do you do or say? Choose a, b, or c."
    items:
      - q: "Die Frist ist seit zwei Wochen abgelaufen. — The loan period expired two weeks ago."
        options:
          - { key: a, text: "Bücher zurückbringen, die Gebühr zahlen und ab jetzt die Erinnerungsmail aktivieren." }
          - { key: b, text: "Warten, bis eine Mahnung kommt." }
          - { key: c, text: "Die Bücher anonym in den Rückgabekasten werfen." }
        answer: a
        why: 'Die Gebühr wächst pro Woche. Zurückbringen stoppt sie sofort — und die Erinnerungsmail verhindert die Wiederholung.'
      - q: "Ein Buch ist beschädigt zurückgekommen — von dir. — A book came back damaged, by you."
        options:
          - { key: a, text: "Nichts sagen und hoffen." }
          - { key: b, text: "Es an der Theke ansprechen und fragen, wie der Schaden geregelt wird." }
          - { key: c, text: "Selbst kleben und zurückgeben." }
        answer: b
        why: 'Selbst reparieren macht es meist schlimmer. Ansprechen ist billiger als ein später entdeckter Schaden.'
      - q: "Du hast das Buch verloren. — You've lost the book."
        options:
          - { key: a, text: "Ein neues Exemplar kaufen und einfach abgeben." }
          - { key: b, text: "Den Verlust melden und nach dem Wiederbeschaffungswert fragen." }
          - { key: c, text: "Warten." }
        answer: b
        why: 'Die Bibliothek entscheidet, ob ein Ersatzexemplar akzeptiert wird — vorher fragen erspart doppelte Kosten.'
      - q: "Du hast deinen Ausweis vergessen. — You've forgotten your library card."
        options:
          - { key: a, text: "Nichts ausleihen." }
          - { key: b, text: "Den Ausweis einer Freundin nehmen." }
          - { key: c, text: "Fragen, ob es mit Personalausweis oder der Ausweisnummer geht." }
        answer: c
        why: 'Meist reicht ein Lichtbildausweis oder die Nummer — fremde Ausweise sind nicht erlaubt.'
      - q: "Jemand telefoniert laut im Lesesaal. — Someone is talking loudly on the phone in the reading room."
        options:
          - { key: a, text: "Freundlich darauf hinweisen oder das Personal ansprechen." }
          - { key: b, text: "Auch laut werden." }
          - { key: c, text: "Den Platz wechseln." }
        answer: a
        why: 'Ein kurzer Hinweis reicht meistens. Dafür gibt es im Zweifel das Personal.'
      - q: "Das vorgemerkte Buch ist da, aber du bist im Urlaub. — Your reserved book has arrived but you're on holiday."
        options:
          - { key: a, text: "Anrufen und fragen, ob die Abholfrist verlängert werden kann." }
          - { key: b, text: "Nichts tun, es wartet schon." }
          - { key: c, text: "Die Vormerkung löschen." }
        answer: a
        why: 'Vorgemerkte Bücher werden nach wenigen Tagen weitergegeben — ein Anruf sichert es dir.'

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Die {1} ist leider schon abgelaufen. (wie lange man das Buch behalten darf)
      2. Dann fallen {2} an. (Kosten bei zu später Rückgabe)
      3. Ich möchte das Buch {3}. (reservieren, trennbar)
      4. Kann ich die Frist noch {4}? (mehr Zeit bekommen)
      5. Ich habe das Buch leider {5}. (nicht mehr finden können)
      6. Was ist der {6}? (was ein Ersatz kosten würde)
      7. Im {7} bitte nicht telefonieren. (Raum zum Arbeiten)
      8. Könnten Sie das Buch per {8} bestellen? (aus einer anderen Bibliothek)
    answers:
      "1": Leihfrist
      "2": Mahngebühren
      "3": vormerken
      "4": verlängern
      "5": verloren
      "6": Wiederbeschaffungswert
      "7": Lesesaal
      "8": Fernleihe

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    notes: "10+ / 12 → du kommst in der Bibliothek klar. Unter 10: Block A und B4 noch einmal."
    instructions: "Ergänze die Lücken."
    instructionsEn: "Fill in the gaps."
    text: |
      **Wortschatz (5 Punkte):**
      1. Die Karte zum Ausleihen: der {1}
      2. Wie lange du das Buch behalten darfst: die {2}
      3. Kosten bei zu später Rückgabe: die {3}
      4. Ein Buch aus einer anderen Bibliothek bestellen: die {4}
      5. Der ruhige Raum zum Arbeiten: der {5}

      **Trennbare Verben (4 Punkte):**
      6. Ich {6} drei Bücher aus. (ausleihen)
      7. Bitte geben Sie die Bücher rechtzeitig {7}. (zurückgeben)
      8. Ich {8} mir den Roman vor. (vormerken)
      9. Die Bibliothek macht um zehn Uhr {9}. (aufmachen)

      **Redemittel (3 Punkte):**
      10. „Kann ich die Leihfrist online {10}?"
      11. „Könnte ich das Buch {11} lassen?"
      12. „Wäre eine {12} möglich?"
    answers:
      "1": Bibliotheksausweis
      "2": Leihfrist
      "3": Mahngebühr
      "4": Fernleihe
      "5": Lesesaal
      "6": leihe
      "7": zurück
      "8": merke
      "9": auf
      "10": verlängern
      "11": vormerken
      "12": Fernleihe

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: erster Besuch in der Bibliothek"
    prompt: "Schreib den Dialog an der Theke und danach eine kurze E-Mail. 12–16 Sätze."
    stimulus: |
      Deine Situation:

      Du gehst zum ersten Mal in die Stadtbibliothek. Du bist Studentin,
      hast Personalausweis und Studienbescheinigung dabei. Du suchst
      „Der Vorleser“ von Bernhard Schlink — das Buch ist ausgeliehen.

      Teil 1 — der Dialog an der Theke: Ausweis beantragen, nach dem
      Buch fragen, es vormerken lassen, nach der Leihfrist fragen.
      Teil 2 — zwei Wochen später eine E-Mail an die Bibliothek: Die
      Frist für ein anderes Buch läuft am Freitag ab, du hast online
      schon zweimal verlängert und brauchst es noch eine Woche.
    use:
      - "`Ich möchte einen Bibliotheksausweis beantragen.`"
      - "`Könnte ich das Buch vormerken lassen?`"
      - "Sie-Form in beiden Teilen"
      - "trennbare Verben mit der Vorsilbe am Satzende"
    selfCheck:
      - "Hast du in Teil 1 nach BEIDEM gefragt — Vormerkung und Leihfrist?"
      - "Nennst du in der E-Mail den Titel und das Fristdatum?"
      - "Steht bei den trennbaren Verben die Vorsilbe am Satzende?"
      - "Ist die E-Mail formell (Anrede und Schlussformel)?"
    model: |
      **Teil 1 — an der Theke**

      Ich: Guten Tag, ich möchte einen Bibliotheksausweis beantragen.
      Mitarbeiterin: Gern. Haben Sie einen Personalausweis dabei?
      Ich: Ja, hier. Ich bin Studentin — hier ist meine Studienbescheinigung.
      Mitarbeiterin: Dann kostet der Ausweis 8 Euro im Jahr.
      Ich: In Ordnung. Haben Sie „Der Vorleser“ von Bernhard Schlink?
      Mitarbeiterin: Der Titel ist leider gerade ausgeliehen.
      Ich: Könnte ich das Buch vormerken lassen?
      Mitarbeiterin: Natürlich. Sie bekommen eine E-Mail, sobald es zurück ist.
      Ich: Vielen Dank. Und wie lang ist die Leihfrist?
      Mitarbeiterin: Vier Wochen, zweimal verlängerbar über Ihr Online-Konto.
      Ich: Super, danke für die Auskunft.

      **Teil 2 — E-Mail zwei Wochen später**

      Sehr geehrte Damen und Herren,

      ich habe das Buch „Die Vermessung der Welt“ ausgeliehen; die
      Leihfrist läuft am Freitag, dem 26.06.2026, ab. Über mein
      Online-Konto habe ich bereits zweimal verlängert, sodass eine
      weitere Verlängerung dort nicht mehr möglich ist.

      Ich benötige das Buch noch etwa eine Woche für eine Hausarbeit.
      Wäre eine einmalige Verlängerung bis zum 03.07.2026 möglich?

      Meine Ausweisnummer lautet 4471203.

      Mit freundlichen Grüßen
      Lena Fischer
