lesson: "SIT/53-sich-beschweren-a2"
title: "Sich höflich beschweren — A2"
topic: "Sich höflich beschweren"
category: "Soziales"
level: A2
summary: "Ein Anliegen ruhig und sachlich vorbringen — im Geschäft, beim Nachbarn, unter Kolleginnen — ohne unhöflich oder ohnmächtig zu wirken."
intro: >
  Sich zu beschweren ist keine Konfrontation, sondern eine Fähigkeit:
  sachlich beschreiben, was passiert ist, kurz sagen, was einen stört,
  und konkret formulieren, was man sich wünscht. Dieses Set übt genau
  diesen Aufbau, quer durch mehrere Alltagssituationen — im Geschäft,
  beim Nachbarn, unter Kolleginnen — statt in nur einer. Grammatik nach
  Bedarf: Perfekt im Bericht, Nebensätze mit dass, höfliche Bitten mit
  Konjunktiv II. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn
  es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Beschreiben, Gefühl oder Bitte?"
    instructions: "Sortiere die 12 Sätze nach ihrer Funktion in einer Beschwerde."
    instructionsEn: "Sort the 12 sentences by their function in a complaint."
    buckets:
      - { key: beschreiben, label: "Sachlich beschreiben" }
      - { key: gefuehl, label: "Gefühl ausdrücken" }
      - { key: bitte, label: "Bitte formulieren" }
    tokens:
      - { text: "Ich habe vor zwei Tagen dieses Gerät gekauft.", bucket: beschreiben }
      - { text: "Das ärgert mich ein bisschen.", bucket: gefuehl }
      - { text: "Könnten Sie das bitte prüfen?", bucket: bitte }
      - { text: "Seit letzter Woche höre ich abends laute Musik.", bucket: beschreiben }
      - { text: "Das macht mir das Einschlafen schwer.", bucket: gefuehl }
      - { text: "Wäre es möglich, nach 22 Uhr leiser zu sein?", bucket: bitte }
      - { text: "Die Rechnung stimmt nicht mit meiner Bestellung überein.", bucket: beschreiben }
      - { text: "Das verunsichert mich ein wenig.", bucket: gefuehl }
      - { text: "Könnten Sie die Rechnung bitte korrigieren?", bucket: bitte }
      - { text: "Das Paket ist beschädigt angekommen.", bucket: beschreiben }
      - { text: "Das ist wirklich schade.", bucket: gefuehl }
      - { text: "Wäre ein Umtausch möglich?", bucket: bitte }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "die Beschwerde" }
      - { key: "2", text: "reklamieren" }
      - { key: "3", text: "das Anliegen" }
      - { key: "4", text: "die Kulanz" }
      - { key: "5", text: "sachlich" }
      - { key: "6", text: "der Ton" }
      - { key: "7", text: "eskalieren" }
      - { key: "8", text: "nachvollziehbar" }
    right:
      - { key: a, text: "sagen, dass etwas nicht in Ordnung ist" }
      - { key: b, text: "eine Ware wegen eines Mangels zurückbringen oder melden" }
      - { key: c, text: "das, worum es einem geht — der Grund für das Gespräch" }
      - { key: d, text: "eine freiwillige Lösung, ohne dazu verpflichtet zu sein" }
      - { key: e, text: "ruhig, bei den Fakten bleibend, nicht emotional" }
      - { key: f, text: "wie etwas klingt oder gesagt wird" }
      - { key: g, text: "sich verschlimmern, größer werden" }
      - { key: h, text: "verständlich, gut zu verstehen" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Ein Anliegen vorbringen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. {1} ich kurz etwas ansprechen? (dürfen, ich-Form)
      2. Das Gerät {2} schon nach zwei Tagen kaputt. (sein, Präteritum)
      3. Ich {3} die Rechnung genau geprüft. (haben, Perfekt)
      4. {4} Sie das bitte noch einmal überprüfen? (können, Sie-Form)
      5. Das {5} mich ehrlich gesagt ein bisschen. (stören, Präsens)
      6. {6} es möglich, das zu korrigieren? (sein, Konjunktiv II — wäre)
      7. Ich {7} Verständnis für die Situation. (haben, Präsens)
      8. Wir {8} das Problem gemeinsam lösen. (Modalverb, wir-Form)
    answers:
      "1": Darf
      "2": war
      "3": habe
      "4": Können
      "5": stört
      "6": Wäre
      "7": habe
      "8": können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte kurz ein {1} ansprechen. (der Grund für das Gespräch)
      2. Ich bleibe lieber {2}, statt emotional zu werden. (ruhig, bei den Fakten)
      3. Der Verkäufer hat mir aus {3} das Geld zurückgegeben. (freiwillige Lösung ohne Pflicht)
      4. Bitte {4} Sie diesen Artikel, wenn Sie einen Mangel finden. (bei einem Mangel zurückgeben)
      5. Wenn niemand reagiert, kann das Problem schnell {5}. (größer werden)
      6. Ihr Ärger ist gut {6} — das würde mich auch stören. (verständlich)
    answers:
      "1": Anliegen
      "2": sachlich
      "3": Kulanz
      "4": reklamieren
      "5": eskalieren
      "6": nachvollziehbar

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beim Nachbarn wegen Lärm"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Entschuldigung, hätten Sie kurz {1}?
      — Klar, was gibt's?
      — Seit letzter Woche höre ich abends laute {2} aus Ihrer
      Wohnung.
      — Oh, das ist mir gar nicht {3}.
      — Das macht mir das Einschlafen ein bisschen {4}.
      — Das tut mir leid, das war nicht meine {5}.
      — Kein Problem, ich wollte es nur kurz {6}.
      — Wäre es {7}, nach 22 Uhr etwas leiser zu sein?
      — Klar, das mache ich {8} gern.
      — Vielen Dank, das ist wirklich {9} von Ihnen.
      — Gern, und danke, dass Sie es {10} angesprochen haben.
    bank: [ZEIT, MUSIK, AUFGEFALLEN, SCHWER, ABSICHT, ANSPRECHEN, MÖGLICH, SELBSTVERSTÄNDLICH, NETT, RUHIG, LAUT, GELD, BESCHWERDE, STREIT]
    answers:
      "1": ZEIT
      "2": MUSIK
      "3": AUFGEFALLEN
      "4": SCHWER
      "5": ABSICHT
      "6": ANSPRECHEN
      "7": MÖGLICH
      "8": SELBSTVERSTÄNDLICH
      "9": NETT
      "10": RUHIG

  - id: B2
    block: B
    type: single-choice
    title: "Den richtigen Ton treffen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Im Restaurant wurde dir das falsche Gericht gebracht. — At the restaurant, you were served the wrong dish."
        options:
          - { key: a, text: "Entschuldigung, ich glaube, das ist nicht, was ich bestellt habe." }
          - { key: b, text: "Das ist ja wohl nicht Ihr Ernst!" }
          - { key: c, text: "Egal, ich esse es trotzdem." }
        answer: a
        why: "Ein freundlicher, sachlicher Hinweis führt am schnellsten zur Korrektur."
      - q: "Du hast ein defektes Gerät gekauft und bringst es zurück. — You bought a faulty device and return it."
        options:
          - { key: a, text: "Ihr Laden verkauft nur Schrott." }
          - { key: b, text: "Ich habe dieses Gerät vor zwei Tagen gekauft, und es funktioniert leider nicht." }
          - { key: c, text: "Ich sage nichts und werfe es einfach weg." }
        answer: b
        why: "Fakten nennen, ohne zu übertreiben, führt am ehesten zu einer Lösung."
      - q: "Ein Kollege hat dir versehentlich eine wichtige Aufgabe nicht weitergegeben. — A colleague accidentally didn't pass on an important task."
        options:
          - { key: a, text: "Das ist typisch für dich, immer dasselbe." }
          - { key: b, text: "Nichts sagen und die Aufgabe einfach liegen lassen." }
          - { key: c, text: "Mir ist aufgefallen, dass ich die Info zur Aufgabe nicht bekommen habe — können wir kurz klären, wie das passiert ist?" }
        answer: c
        why: "Den Fokus auf das Ereignis statt auf die Person zu legen wirkt konstruktiv, nicht anklagend."
      - q: "Eine Freundin hat einen Termin mit dir zweimal ohne Absage verpasst. — A friend has missed a meetup with you twice without cancelling."
        options:
          - { key: a, text: "Mir ist aufgefallen, dass wir uns zweimal verpasst haben — ist alles in Ordnung bei dir?" }
          - { key: b, text: "Du bist einfach unzuverlässig." }
          - { key: c, text: "Nichts mehr mit ihr verabreden." }
        answer: a
        why: "Eine offene, nicht anklagende Frage lässt Raum für eine ehrliche Antwort."
      - q: "Die Rechnung im Café stimmt nicht mit deiner Bestellung überein. — The bill at the café doesn't match your order."
        options:
          - { key: a, text: "Sie wollen mich wohl betrügen." }
          - { key: b, text: "Entschuldigung, ich glaube, hier stimmt etwas nicht — könnten Sie das prüfen?" }
          - { key: c, text: "Einfach zahlen, um keinen Ärger zu machen." }
        answer: b
        why: "Ein höflicher Hinweis mit Bitte um Prüfung ist der direkte Weg zur Korrektur."
      - q: "Du möchtest jemandem sagen, dass dich etwas gestört hat, ohne die Stimmung zu ruinieren. — You want to tell someone something bothered you without ruining the mood."
        options:
          - { key: a, text: "Du machst das immer falsch." }
          - { key: b, text: "Einfach schmollen, ohne etwas zu sagen." }
          - { key: c, text: "Kann ich kurz etwas ansprechen, das mich beschäftigt?" }
        answer: c
        why: "Um Erlaubnis zu bitten, etwas anzusprechen, öffnet das Gespräch, statt es zu belasten."

  - id: B3
    block: B
    type: order
    title: "Sätze für eine höfliche Beschwerde bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Darf", "ich", "kurz", "etwas", "ansprechen", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "höfliche Frage vor dem eigentlichen Anliegen"
      - tiles: ["Das", "Gerät", "war", "schon", "nach", "zwei", "Tagen", "kaputt"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "sachliche Beschreibung im Präteritum"
      - tiles: ["Das", "stört", "mich", "ehrlich", "gesagt", "ein", "bisschen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Gefühl ausdrücken, moderat formuliert"
      - tiles: ["Könnten", "Sie", "das", "bitte", "noch", "einmal", "überprüfen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Konjunktiv-II-Bitte, Infinitiv am Ende"
      - tiles: ["Wäre", "es", "möglich", ",", "leiser", "zu", "sein", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Konjunktiv-II-Frage, höfliche Bitte"
      - tiles: ["Ich", "habe", "Verständnis", "für", "die", "Situation"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Verständnis zeigen entschärft den Ton"

  - id: B4
    block: B
    type: true-false
    title: "Den Ratgeberartikel lesen"
    instructions: |
      > **So beschwerst du dich richtig**
      >
      > - **Erst beschreiben, dann fühlen, dann bitten:** Was ist
      >   passiert? Was macht das mit dir? Was wünschst du dir?
      > - Sprich über das **Ereignis**, nicht über die **Person** — „das
      >   hat mich gestört“ statt „du bist immer so“.
      > - **Übertreibungen** wie „immer“ oder „nie“ machen ein Gespräch
      >   schneller emotional, nicht klarer.
      > - Eine **konkrete Bitte** am Ende gibt dem Gegenüber etwas, worauf
      >   es reagieren kann.
      > - **Zeitpunkt wählen:** ein ruhiger Moment ist besser als
      >   zwischen Tür und Angel.
      > - Wenn nichts passiert, darfst du **höflich nachfragen** — das
      >   ist kein zweites Mal unhöflich.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man sollte zuerst beschreiben, dann das Gefühl nennen, dann bitten. — You should first describe, then name the feeling, then ask."
        answer: true
        why: "So steht es ausdrücklich im Artikel."
      - q: "Man soll besser über die Person sprechen als über das Ereignis. — It's better to talk about the person than the event."
        answer: false
        why: "Der Artikel rät, über das Ereignis zu sprechen, nicht über die Person."
      - q: "Wörter wie „immer“ oder „nie“ machen ein Gespräch klarer. — Words like 'always' or 'never' make a conversation clearer."
        answer: false
        why: "Übertreibungen machen es emotionaler, nicht klarer."
      - q: "Eine konkrete Bitte am Ende ist hilfreich. — A concrete request at the end is helpful."
        answer: true
        why: "„Eine konkrete Bitte am Ende gibt dem Gegenüber etwas, worauf es reagieren kann.“"
      - q: "Der Zeitpunkt für das Gespräch spielt keine Rolle. — The timing of the conversation doesn't matter."
        answer: false
        why: "Ein ruhiger Moment wird ausdrücklich empfohlen."
      - q: "Nachzufragen, wenn nichts passiert, ist unhöflich. — Following up when nothing happens is impolite."
        answer: false
        why: "Höfliches Nachfragen ist laut Artikel ausdrücklich erlaubt."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn die Beschwerde nicht gut ankommt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die andere Person wird sofort defensiv und fühlt sich angegriffen. — The other person immediately gets defensive and feels attacked."
        options:
          - { key: a, text: "Ruhig bleiben und klarstellen, dass es dir um die Sache geht, nicht um Vorwürfe." }
          - { key: b, text: "Noch lauter werden." }
          - { key: c, text: "Sofort das Gespräch abbrechen." }
        answer: a
        why: "Ruhe und eine Klarstellung nehmen der Situation die Schärfe."
      - q: "Du hast dich beschwert, aber niemand reagiert. — You complained, but no one reacts."
        options:
          - { key: a, text: "Sofort aufgeben." }
          - { key: b, text: "Nach ein paar Tagen höflich noch einmal nachfragen." }
          - { key: c, text: "Laut werden, um Aufmerksamkeit zu bekommen." }
        answer: b
        why: "Höfliches Nachfragen ist völlig legitim, wenn sich nichts tut."
      - q: "Du merkst, dass du dich bei der falschen Person beschwert hast. — You realize you complained to the wrong person."
        options:
          - { key: a, text: "So tun, als wäre nichts gewesen." }
          - { key: b, text: "Die Person trotzdem weiter beschuldigen." }
          - { key: c, text: "Dich entschuldigen und nach der richtigen Ansprechperson fragen." }
        answer: c
        why: "Eine kurze Entschuldigung und die Frage nach der richtigen Person klärt das Missverständnis."
      - q: "Dein Anliegen wird völlig falsch verstanden und als Angriff aufgefasst. — Your point is completely misunderstood and taken as an attack."
        options:
          - { key: a, text: "Ruhig erklären, dass das nicht deine Absicht war." }
          - { key: b, text: "Beleidigt sein und nichts mehr sagen." }
          - { key: c, text: "Die Absicht bestätigen, um nicht schwach zu wirken." }
        answer: a
        why: "Eine ruhige Klarstellung der eigenen Absicht kann das Missverständnis meist auflösen."
      - q: "Ein Kollege reagiert unangemessen scharf auf deine sachliche Bemerkung. — A colleague reacts inappropriately sharply to your factual remark."
        options:
          - { key: a, text: "Genauso scharf zurückreagieren." }
          - { key: b, text: "Vor anderen Kollegen darüber reden." }
          - { key: c, text: "Ruhig bleiben und das Gespräch für später vertagen." }
        answer: c
        why: "Ein Gespräch zu vertagen verhindert eine unnötige Eskalation."
      - q: "Du merkst, dass deine eigene Beschwerde übertrieben war. — You realize your own complaint was exaggerated."
        options:
          - { key: a, text: "Das offen zugeben und dich kurz entschuldigen." }
          - { key: b, text: "So tun, als hättest du es nicht so gemeint." }
          - { key: c, text: "Auf der Übertreibung beharren." }
        answer: a
        why: "Einen eigenen Fehler zuzugeben zeigt Größe und beruhigt die Situation."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die andere Person wurde sofort {1} und fühlte sich angegriffen. (in Abwehrhaltung)
      2. Ich habe mich beschwert, aber niemand hat {2}. (reagieren, Perfekt)
      3. Ich habe mich leider bei der falschen {3} beschwert. (die zuständige Person)
      4. Mein Anliegen wurde als {4} aufgefasst. (ein Vorwurf, eine Attacke)
      5. Der Kollege hat unangemessen {5} reagiert. (mit viel Schärfe)
      6. Meine eigene Beschwerde war im Nachhinein etwas {6}. (zu stark ausgedrückt)
    answers:
      "1": defensiv
      "2": reagiert
      "3": Ansprechperson
      "4": Angriff
      "5": scharf
      "6": übertrieben

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. {1} ich kurz etwas ansprechen? (may — dürfen)
      2. Das Gerät {2} schon nach zwei Tagen kaputt. (was)
      3. {3} Sie das bitte noch einmal überprüfen? (could — können)
      4. Das {4} mich ehrlich gesagt ein bisschen. (bothers)
      5. {5} es möglich, das zu korrigieren? (would it be)
      6. Ich möchte kurz ein {6} ansprechen. (a matter / issue)
      7. Ich bleibe lieber {7}, statt emotional zu werden. (factual)
      8. Bitte {8} Sie diesen Artikel, wenn Sie einen Mangel finden. (make a complaint about — Infinitiv)
      9. Die andere Person wurde sofort {9}. (defensive)
      10. Ich habe mich beschwert, aber niemand hat {10}. (reacted — Partizip)
      11. Ich habe mich bei der falschen {11} beschwert. (contact person)
      12. Mein Anliegen wurde als {12} aufgefasst. (attack)
      13. Der Kollege hat unangemessen {13} reagiert. (sharply)
      14. Meine eigene Beschwerde war etwas {14}. (exaggerated)
    answers:
      "1": Darf
      "2": war
      "3": Könnten
      "4": stört
      "5": Wäre
      "6": Anliegen
      "7": sachlich
      "8": reklamieren
      "9": defensiv
      "10": reagiert
      "11": Ansprechperson
      "12": Angriff
      "13": scharf
      "14": übertrieben

  - id: D2
    block: D
    type: free-write
    title: "Ansprechen, Missverständnis, Klärung"
    prompt: "Schreib drei Teile: ein Anliegen ansprechen, ein kleines Missverständnis und die Klärung. Zusammen 16–20 Sätze."
    stimulus: |
      Du hast ein Gerät gekauft, das nach zwei Tagen kaputtgegangen ist.
      Der Verkäufer reagiert zuerst etwas genervt, weil er denkt, du
      machst ihm Vorwürfe.

      Beim Ansprechen müssen vorkommen:
      1. höflich um einen Moment Zeit bitten
      2. sachlich beschreiben, was passiert ist
      3. ein Gefühl vorsichtig ausdrücken

      Im Missverständnis müssen vorkommen:
      4. merken, dass der Verkäufer sich angegriffen fühlt
      5. klarstellen, dass es dir nicht um Vorwürfe geht
      6. Verständnis für seine Seite zeigen

      In der Klärung müssen vorkommen:
      7. eine konkrete Bitte formulieren (Reparatur oder Umtausch)
      8. eine Lösung vom Verkäufer bekommen
      9. dich für die Lösung bedanken
      10. freundlich auseinandergehen
    use:
      - "höfliche Bitte: „Darf ich …?“, „Könnten Sie …?“"
      - "Gefühl moderat ausdrücken: „Das stört mich ein bisschen.“"
      - "Nebensatz mit dass: „Ich möchte klarstellen, dass …“"
    selfCheck:
      - "Folgt die Beschwerde dem Aufbau: beschreiben, fühlen, bitten?"
      - "Klingt der Ton sachlich, nicht anklagend?"
      - "Wird das Missverständnis ruhig aufgelöst, nicht eskaliert?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Das Anliegen ansprechen**

      Ich: Entschuldigung, hätten Sie kurz Zeit? Ich habe dieses Gerät vor zwei Tagen gekauft, und es funktioniert leider nicht mehr.
      Verkäufer: Ach, das ist ja ärgerlich.
      Ich: Ja, das stört mich ehrlich gesagt ein bisschen, weil ich es eigentlich dringend brauche.

      **Das Missverständnis**

      Verkäufer (etwas genervt): Wir prüfen alle Geräte, bevor sie verkauft werden, das kann eigentlich nicht sein.
      Ich: Das glaube ich Ihnen gern — mir geht es nicht darum, jemandem die Schuld zu geben, sondern eine Lösung zu finden.
      Verkäufer: Ah, verstehe, Entschuldigung, ich dachte, Sie machen mir Vorwürfe.

      **Die Klärung**

      Ich: Wäre ein Umtausch oder eine Reparatur möglich?
      Verkäufer: Ein Umtausch ist kein Problem, ich hole Ihnen gleich ein neues Gerät.
      Ich: Das wäre super, vielen Dank.
      Verkäufer: Gern, und entschuldigen Sie die kurze Verwirrung vorhin.
      Ich: Kein Problem, ich verstehe das gut. Schönen Tag noch!
