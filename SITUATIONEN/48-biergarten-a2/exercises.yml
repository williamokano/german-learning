  - id: B2
    block: B
    type: single-choice
    title: "Höflich am fremden Tisch"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Alle Tische sind voll, außer einer mit einer fremden Gruppe. — All tables are full except one with a group of strangers."
        options:
          - { key: a, text: "Sich einfach ungefragt dazusetzen." }
          - { key: b, text: "Entschuldigung, ist hier noch frei?" }
          - { key: c, text: "Woanders essen gehen." }
        answer: b
        why: "Kurz zu fragen ist die übliche Höflichkeit, auch wenn das Teilen von Tischen im Biergarten normal ist."
      - q: "Du bist unsicher, ob du am Tisch bestellen musst oder selbst holen kannst. — You're unsure whether to order at the table or fetch things yourself."
        options:
          - { key: a, text: "Ist das hier Selbstbedienung oder mit Bedienung?" }
          - { key: b, text: "Einfach abwarten, bis jemand kommt." }
          - { key: c, text: "Laut nach einem Kellner rufen." }
        answer: a
        why: "Eine kurze Frage klärt sofort, wie hier bestellt wird."
      - q: "Die Tischnachbarin fragt, ob ihr öfter herkommt. — Your table neighbour asks if you come here often."
        options:
          - { key: a, text: "Eigentlich zum ersten Mal, aber es gefällt uns richtig gut." }
          - { key: b, text: "Das geht dich nichts an." }
          - { key: c, text: "Nicht antworten." }
        answer: a
        why: "Ein kurzes, freundliches Gespräch mit Tischnachbarn ist im Biergarten Teil des Erlebnisses."
      - q: "Du möchtest wissen, wo man den Pfandkrug zurückgibt. — You want to know where to return the deposit mug."
        options:
          - { key: a, text: "Wisst ihr, wo man den Krug zurückgibt?" }
          - { key: b, text: "Den Krug einfach mitnehmen." }
          - { key: c, text: "Den Krug irgendwo stehen lassen." }
        answer: a
        why: "Eine kurze Frage an die Tischnachbarn oder das Personal klärt das schnell."
      - q: "Auf dem Volksfest verliert ihr euch kurz aus den Augen. — You briefly lose each other at the fair."
        options:
          - { key: a, text: "Sofort in Panik geraten." }
          - { key: b, text: "Einen Treffpunkt vereinbaren, zum Beispiel am Riesenrad." }
          - { key: c, text: "Warten, bis der andere von selbst zurückkommt." }
        answer: b
        why: "Ein klarer Treffpunkt ist die einfachste Lösung, um sich in der Menge wiederzufinden."
      - q: "Ein Tischnachbar bietet dir ein Stück von seiner Brotzeit an. — A table neighbour offers you a piece of their snack."
        options:
          - { key: a, text: "Gern, vielen Dank, das ist sehr nett!" }
          - { key: b, text: "Nein, das brauche ich nicht." }
          - { key: c, text: "Einfach ignorieren." }
        answer: a
        why: "Ein solches Angebot freundlich anzunehmen ist im Biergarten die übliche Reaktion."

