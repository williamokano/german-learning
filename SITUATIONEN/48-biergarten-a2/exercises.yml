  - id: B4
    block: B
    type: true-false
    title: "Den Aushang im Biergarten lesen"
    instructions: |
      > **Biergarten Waldwiese — Hinweise für Gäste**
      >
      > - **Selbstbedienungsbereich** (Bierbänke ohne Tischdecke): eigene
      >   Brotzeit **erlaubt**, Getränke bitte nur vom Stand.
      > - **Bereich mit Bedienung** (Tischdecke): Speisen und Getränke
      >   bitte **nur beim Kellner** bestellen, keine eigene Verpflegung.
      > - Für den **Pfandkrug** zahlt man **2 €**, Rückgabe an der
      >   Pfandstelle.
      > - Der Biergarten ist **familienfreundlich** — ein Spielplatz
      >   befindet sich im hinteren Bereich.
      > - Bei Regen bleiben die Tische **überdacht** geöffnet.
      > - Ruhezeit ab **22 Uhr**, danach nur noch leise Gespräche.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Im Selbstbedienungsbereich darf man eigenes Essen mitbringen. — In the self-service area, you may bring your own food."
        answer: true
        why: "So steht es ausdrücklich im Aushang."
      - q: "Im Bereich mit Bedienung darf man auch eigene Brotzeit mitbringen. — In the service area, you may also bring your own snacks."
        answer: false
        why: "Dort gilt: keine eigene Verpflegung, nur beim Kellner bestellen."
      - q: "Für den Pfandkrug zahlt man zwei Euro. — The deposit for the mug is two euros."
        answer: true
        why: "„Für den Pfandkrug zahlt man 2 €.“"
      - q: "Es gibt keinen Spielplatz für Kinder. — There is no playground for children."
        answer: false
        why: "Ein Spielplatz befindet sich im hinteren Bereich."
      - q: "Bei Regen schließt der Biergarten sofort. — In rain, the beer garden closes immediately."
        answer: false
        why: "Die überdachten Tische bleiben bei Regen geöffnet."
      - q: "Ab 22 Uhr gilt Ruhezeit. — Quiet hours start at 10 pm."
        answer: true
        why: "„Ruhezeit ab 22 Uhr, danach nur noch leise Gespräche.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn im Trubel etwas passiert"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Es gibt keinen freien Platz mehr an keinem Tisch. — There isn't a free spot at any table."
        options:
          - { key: a, text: "Höflich an einem Tisch fragen, ob noch ein bisschen Platz ist." }
          - { key: b, text: "Einfach stehen bleiben und warten." }
          - { key: c, text: "Den Biergarten sofort verlassen." }
        answer: a
        why: "Eine kurze, freundliche Frage findet oft doch noch einen Platz, besonders an langen Bierbanktischen."
      - q: "Ihr habt vergessen, den Pfandkrug zurückzugeben, und seid schon draußen. — You forgot to return the deposit mug and are already outside."
        options:
          - { key: a, text: "Den Krug einfach behalten." }
          - { key: b, text: "Noch einmal zurückgehen und den Krug abgeben." }
          - { key: c, text: "So tun, als wäre nichts passiert." }
        answer: b
        why: "Zurückzugehen ist unkompliziert und man bekommt das Pfand zurück."
      - q: "Du hast versehentlich etwas Bier auf den Tischnachbarn geschüttet. — You accidentally spilled some beer on your table neighbour."
        options:
          - { key: a, text: "So tun, als wäre nichts gewesen." }
          - { key: b, text: "Die Schuld auf jemand anderen schieben." }
          - { key: c, text: "Dich sofort entschuldigen und fragen, ob du helfen kannst." }
        answer: c
        why: "Eine sofortige Entschuldigung mit Hilfsangebot ist die angemessene Reaktion."
      - q: "Auf dem Volksfest habt ihr eure Freunde in der Menge verloren. — At the fair, you've lost your friends in the crowd."
        options:
          - { key: a, text: "Zum vereinbarten Treffpunkt gehen oder anrufen." }
          - { key: b, text: "Ziellos durch die Menge laufen." }
          - { key: c, text: "Einfach alleine nach Hause gehen." }
        answer: a
        why: "Ein vereinbarter Treffpunkt oder ein Anruf ist die schnellste Lösung."
      - q: "Die Schlange für ein Fahrgeschäft ist sehr lang. — The queue for a ride is very long."
        options:
          - { key: a, text: "Sich vordrängeln." }
          - { key: b, text: "Warten oder ein anderes Fahrgeschäft mit kürzerer Schlange wählen." }
          - { key: c, text: "Sich lautstark beschweren." }
        answer: b
        why: "Warten oder ausweichen ist die einzig faire Lösung bei einer langen Schlange."
      - q: "Du merkst zu spät, dass du im Bereich mit Bedienung eigene Brotzeit ausgepackt hast. — You realize too late that you unpacked your own snacks in the service area."
        options:
          - { key: a, text: "Einfach weiteressen." }
          - { key: b, text: "Behaupten, es sei nicht deine Brotzeit." }
          - { key: c, text: "Dich entschuldigen und die Brotzeit wieder wegpacken." }
        answer: c
        why: "Eine kurze Entschuldigung und das Wegpacken lösen das Missverständnis unkompliziert."

