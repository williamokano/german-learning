  - id: D2
    block: D
    type: free-write
    title: "Am Tisch, auf dem Fest, wieder zusammen"
    prompt: "Schreib drei Teile: sich einen Tisch teilen und bestellen, sich auf dem Volksfest kurz verlieren, und das Wiedertreffen. Zusammen 16–20 Sätze."
    stimulus: |
      Du gehst mit einem Freund / einer Freundin in den Biergarten. Ihr
      setzt euch an einen Tisch mit einer fremden Gruppe. Später geht
      ihr zusammen aufs Volksfest, wo ihr euch kurz in der Menge
      verliert.

      Am Tisch müssen vorkommen:
      1. höflich fragen, ob noch Platz ist
      2. fragen, ob es Selbstbedienung oder mit Bedienung ist
      3. eine Maß und eine Brotzeit bestellen oder holen
      4. kurz mit der Tischnachbarin oder dem Tischnachbarn plaudern

      Auf dem Volksfest müssen vorkommen:
      5. ein Fahrgeschäft oder die Losbude erwähnen
      6. merken, dass ihr euch verloren habt
      7. einen Treffpunkt vereinbaren oder anrufen

      Beim Wiedertreffen müssen vorkommen:
      8. euch erleichtert wiederfinden
      9. erzählen, was in der Zwischenzeit passiert ist
      10. gemeinsam entscheiden, was ihr als Nächstes macht
    use:
      - "höfliche Frage: „Ist hier noch frei?“"
      - "reflexives Verb: „Wir holen uns eine Maß.“"
      - "indirekte Frage: „Wisst ihr, wo …?“"
    selfCheck:
      - "Ist die Frage nach dem Platz höflich formuliert?"
      - "Wird der Unterschied zwischen Selbstbedienung und Bedienung klar?"
      - "Klingt das Verlieren und Wiederfinden nachvollziehbar, nicht dramatisch?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Am Tisch**

      Ich: Entschuldigung, ist hier noch frei?
      Tischnachbarin: Ja, klar, setzt euch ruhig hin.
      Ich: Danke! Ist das hier Selbstbedienung oder mit Bedienung?
      Tischnachbarin: Selbstbedienung, ihr könnt euch am Stand was holen.
      Freund: Dann holen wir uns eine Maß und eine Brotzeit.
      Tischnachbarin: Kommt ihr öfter hierher?
      Ich: Eigentlich zum ersten Mal, aber es gefällt uns richtig gut.

      **Auf dem Volksfest**

      (Später, auf dem Volksfest)
      Freund: Lass uns zur Losbude gehen, ich will unbedingt was gewinnen.
      Ich: Gut, ich schau mir kurz das Riesenrad an und komme gleich nach.
      (Nach einer Weile)
      Ich: Warte, wo bist du? Ich sehe dich nicht mehr in der Menge.
      Freund: Lass uns am Riesenrad treffen, in zehn Minuten.

      **Das Wiedertreffen**

      Ich: Da bist du ja! Ich hatte schon kurz Sorge.
      Freund: Alles gut, ich war einfach in der Losbuden-Schlange stecken geblieben.
      Ich: Hast du was gewonnen?
      Freund: Nein, aber es hat trotzdem Spaß gemacht. Sollen wir jetzt noch eine Runde Karussell fahren?
      Ich: Gute Idee, aber danach brauche ich unbedingt noch eine Maß.
