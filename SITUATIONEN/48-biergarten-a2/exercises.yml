lesson: "SIT/48-biergarten-a2"
title: "Biergarten und Volksfest — A2"
topic: "Biergarten und Volksfest"
category: "Essen & Trinken"
level: A2
summary: "Sich einen Tisch mit Fremden teilen, in der Selbstbedienung oder am Tisch bestellen, den Pfandkrug zurückgeben — und der Trubel auf dem Volksfest."
intro: >
  Im Biergarten sitzt man mit Fremden am selben Tisch, das ist normal
  und kein Grund zur Verlegenheit. Wichtiger ist der Unterschied
  zwischen Selbstbedienung — dort darf man sogar eigene Brotzeit
  mitbringen — und dem Bereich mit Bedienung, wo man am Tisch bestellt.
  Dazu der Pfandkrug, der am Ende zurückgegeben wird, und auf dem
  Volksfest noch mehr Trubel: Fahrgeschäfte, eine Losbude, verlorene
  Freunde in der Menge. Grammatik nach Bedarf: höfliche Fragen mit
  Konjunktiv II, Wechselpräpositionen, einfache Vergangenheit im
  Bericht. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

