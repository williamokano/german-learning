lesson: "SIT/77-missverstaendnis-klaeren-a2"
title: "Sich entschuldigen und ein Missverständnis klären — A2"
topic: "Sich entschuldigen und ein Missverständnis klären"
category: "Soziales"
level: A2
summary: "Sich bei einem Freund entschuldigen, ein Missverständnis aufklären, um Verzeihung bitten — und was tun, wenn der andere zunächst kühl reagiert oder nicht reden möchte."
intro: >
  Ein dummes Missverständnis kann schnell zu Ärger zwischen Freunden
  führen — meist hilft nur ein ehrliches Gespräch: sich entschuldigen,
  erklären, wie es wirklich gemeint war, und um Verzeihung bitten.
  Dieses Set übt genau das — sich aussprechen, ein Missverständnis
  klären, und was zu tun ist, wenn der andere zunächst kühl reagiert
  oder gerade nicht reden möchte. Grammatik nach Bedarf: Perfekt im
  Bericht, höfliche Fragen, Nebensätze mit falls. Blocks: A Wortschatz
  & Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

