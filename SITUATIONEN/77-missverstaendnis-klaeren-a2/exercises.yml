  - id: D2
    block: D
    type: free-write
    title: "Entschuldigen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: dich entschuldigen und das Missverständnis erklären, ein Problem, weil der Freund zunächst kühl reagiert, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Wegen einer missverständlichen Nachricht hast du dich mit einem
      Freund gestritten. Du bittest ihn um ein Gespräch und
      entschuldigst dich. Zunächst reagiert er aber noch ziemlich
      kühl.

      Beim Entschuldigen müssen vorkommen:
      1. um ein Gespräch bitten
      2. sich für die Nachricht entschuldigen
      3. das Missverständnis erklären

      Beim Problem müssen vorkommen:
      4. merken, dass der Freund noch kühl reagiert
      5. geduldig bleiben
      6. noch einmal klarer erklären, wie es gemeint war

      In der Lösung müssen vorkommen:
      7. um Verzeihung bitten
      8. eine Entschuldigung annehmen
      9. sich wieder vertragen
      10. sich über die gelungene Versöhnung freuen
    use:
      - "höfliche Bitte: „Können wir uns kurz aussprechen?“"
      - "Nebensatz mit falls: „Falls es ein Missverständnis gibt, …“"
      - "Perfekt: „Wir haben uns wieder vertragen.“"
    selfCheck:
      - "Wird die Entschuldigung klar und konkret formuliert?"
      - "Klingt die Reaktion auf die kühle Antwort geduldig?"
      - "Wird die Versöhnung am Ende erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Entschuldigen**

      Ich: Hey, können wir uns kurz aussprechen? Ich möchte mich bei dir entschuldigen.
      Freund: Okay, was ist denn los?
      Ich: Ich glaube, da gab es ein Missverständnis wegen meiner Nachricht.

      **Das Problem**

      Freund: (eher zurückhaltend) Naja, ich war schon ziemlich verletzt davon.
      Ich: Das verstehe ich. Das war überhaupt nicht so gemeint — das kam total unabsichtlich so raus.
      Freund: Hm, okay.

      **Die Lösung**

      Ich: Kannst du mir das verzeihen?
      Freund: Ja, jetzt, wo du es erklärt hast, verstehe ich es viel besser.
      Ich: Puh, ich bin so erleichtert, dass wir uns wieder vertragen haben!
      Freund: Ich auch — lass uns das mit einem Kaffee feiern.
