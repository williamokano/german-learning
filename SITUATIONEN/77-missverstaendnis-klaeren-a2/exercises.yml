  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Entschuldigen lesen"
    instructions: |
      > **Info — Sich entschuldigen**
      >
      > - **Ehrliche Entschuldigung:** nennt konkret, **was falsch
      >   war**, statt allgemein zu bleiben.
      > - **Zeitpunkt:** am besten **so bald wie möglich**, aber
      >   nicht mitten im Streit.
      > - **Zuhören:** genauso wichtig wie das eigene **Erklären**.
      > - **Wiedergutmachung:** eine kleine Geste zeigt, dass es
      >   **ernst gemeint** ist.
      > - **Verzeihen:** braucht manchmal **Zeit**, das sollte man
      >   respektieren.
      > - **Nach der Versöhnung:** das Thema **nicht wieder
      >   aufwärmen**, wenn es geklärt ist.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Eine ehrliche Entschuldigung nennt konkret, was falsch war. — An honest apology names specifically what went wrong."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Entschuldigen."
      - q: "Man sollte sich am besten mitten im lautesten Streit entschuldigen. — The best time to apologize is right in the middle of the loudest argument."
        answer: false
        why: "Am besten so bald wie möglich, aber gerade nicht mitten im Streit."
      - q: "Zuhören ist genauso wichtig wie das eigene Erklären. — Listening is just as important as explaining your own side."
        answer: true
        why: "„Zuhören: genauso wichtig wie das eigene Erklären.“"
      - q: "Eine kleine Geste zur Wiedergutmachung ist überflüssig und wirkt unnötig. — A small gesture of amends is superfluous and unnecessary."
        answer: false
        why: "Sie zeigt gerade, dass die Entschuldigung ernst gemeint ist."
      - q: "Verzeihen braucht manchmal Zeit, das sollte man respektieren. — Forgiving sometimes takes time, and that should be respected."
        answer: true
        why: "„Verzeihen: braucht manchmal Zeit, das sollte man respektieren.“"
      - q: "Nach einer Versöhnung sollte man das Thema regelmäßig wieder aufwärmen. — After making up, the topic should be regularly brought up again."
        answer: false
        why: "Es sollte gerade nicht wieder aufgewärmt werden, wenn es geklärt ist."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Klären des Missverständnisses etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Der Freund reagiert zunächst kühl auf die Entschuldigung. — The friend initially reacts coolly to the apology."
        options:
          - { key: a, text: "Sofort beleidigt reagieren und das Gespräch abbrechen." }
          - { key: b, text: "Geduldig bleiben und ihm Zeit zum Nachdenken geben." }
          - { key: c, text: "Die Entschuldigung wütend zurückziehen." }
        answer: b
        why: "Geduld und Zeit geben den Raum, den eine ehrliche Verarbeitung manchmal braucht."
      - q: "Beim Gespräch kommt ein weiteres, bisher unausgesprochenes Problem zur Sprache. — During the talk, another unspoken issue comes up."
        options:
          - { key: a, text: "Das neue Thema einfach ignorieren." }
          - { key: b, text: "Sofort das Gespräch beenden." }
          - { key: c, text: "Ruhig auch dieses Thema ansprechen, statt es zu ignorieren." }
        answer: c
        why: "Ein offenes Ansprechen aller Themen führt zu einer echten Klärung."
      - q: "Man merkt, dass die eigene Entschuldigung selbst missverständlich war. — You notice your own apology was itself confusing."
        options:
          - { key: a, text: "Die Entschuldigung noch einmal klarer und konkreter wiederholen." }
          - { key: b, text: "Einfach aufgeben und nichts mehr sagen." }
          - { key: c, text: "Dem anderen die Schuld geben, dass er es falsch verstanden hat." }
        answer: a
        why: "Eine klarere Wiederholung stellt sicher, dass die Botschaft wirklich ankommt."
      - q: "Der andere möchte im Moment gar nicht reden. — The other person doesn't want to talk right now."
        options:
          - { key: a, text: "Trotzdem sofort auf ein Gespräch bestehen." }
          - { key: b, text: "Den Wunsch respektieren und zu einem späteren Zeitpunkt fragen." }
          - { key: c, text: "Beleidigt sein und das Thema komplett fallen lassen." }
        answer: b
        why: "Den Wunsch nach Abstand zu respektieren zeigt echten Respekt für den anderen."
      - q: "Man ist sich unsicher, ob die Entschuldigung überhaupt angenommen wurde. — You're unsure whether the apology was even accepted."
        options:
          - { key: a, text: "Einfach davon ausgehen, dass alles gut ist." }
          - { key: b, text: "Das Thema nie wieder ansprechen, aus Angst vor der Antwort." }
          - { key: c, text: "Freundlich nachfragen, ob wirklich alles geklärt ist." }
        answer: c
        why: "Eine freundliche Nachfrage schafft Klarheit, statt im Ungewissen zu bleiben."
      - q: "Nach der Versöhnung wird das alte Thema doch wieder aufgewärmt. — After reconciling, the old topic is brought up again anyway."
        options:
          - { key: a, text: "Ruhig daran erinnern, dass man sich doch schon ausgesprochen hat." }
          - { key: b, text: "Sofort wieder wütend werden." }
          - { key: c, text: "Das alte Thema kommentarlos weiter diskutieren, ohne es anzusprechen." }
        answer: a
        why: "Eine ruhige Erinnerung an die bereits erfolgte Klärung verhindert einen neuen Streit."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
