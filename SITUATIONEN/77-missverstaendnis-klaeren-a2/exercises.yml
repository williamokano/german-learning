  - id: B2
    block: B
    type: single-choice
    title: "Entschuldigen und Aufklären"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest dich bei einem Freund entschuldigen. — You want to apologize to a friend."
        options:
          - { key: a, text: "Entschuldigungen interessieren mich nicht." }
          - { key: b, text: "Ich möchte mich bei dir entschuldigen." }
          - { key: c, text: "Ich habe sowieso nichts falsch gemacht." }
        answer: b
        why: "Eine direkte, ehrliche Entschuldigung ist der beste Einstieg ins Gespräch."
      - q: "Du vermutest, dass ein Missverständnis der Grund für den Streit war. — You suspect a misunderstanding caused the argument."
        options:
          - { key: a, text: "Missverständnisse gibt es bei mir nie." }
          - { key: b, text: "Das ist doch egal, warum wir uns gestritten haben." }
          - { key: c, text: "Ich glaube, da gab es ein Missverständnis zwischen uns." }
        answer: c
        why: "Diese Vermutung offen anzusprechen öffnet den Weg zur Klärung."
      - q: "Dein Freund war verletzt von einer Nachricht. — Your friend was hurt by a message."
        options:
          - { key: a, text: "Das tut mir leid, das war überhaupt nicht so gemeint." }
          - { key: b, text: "Das ist doch nicht so schlimm, stell dich nicht an." }
          - { key: c, text: "Gefühle interessieren mich nicht." }
        answer: a
        why: "Mitgefühl und eine klare Erklärung nehmen dem Missverständnis die Schärfe."
      - q: "Du möchtest erklären, dass etwas unabsichtlich passiert ist. — You want to explain that something happened unintentionally."
        options:
          - { key: a, text: "Absicht oder nicht, ist doch egal." }
          - { key: b, text: "Das kam total unabsichtlich raus, ich wollte dich nicht verletzen." }
          - { key: c, text: "Ich erkläre mich sowieso nie." }
        answer: b
        why: "Eine klare Erklärung der Absichtslosigkeit hilft, das Missverständnis aufzuklären."
      - q: "Du möchtest um Verzeihung bitten. — You want to ask for forgiveness."
        options:
          - { key: a, text: "Verzeihen interessiert mich nicht." }
          - { key: b, text: "Du musst mir sowieso nichts verzeihen." }
          - { key: c, text: "Kannst du mir das verzeihen?" }
        answer: c
        why: "Eine direkte Bitte um Verzeihung ist der ehrlichste Weg zur Versöhnung."
      - q: "Ihr habt euch ausgesprochen und wieder vertragen. — You've talked it out and made up."
        options:
          - { key: a, text: "Ich bin so erleichtert, dass wir uns wieder vertragen haben." }
          - { key: b, text: "Das war doch nicht der Rede wert." }
          - { key: c, text: "Versöhnung interessiert mich nicht." }
        answer: a
        why: "Erleichterung über die gelungene Versöhnung ist eine natürliche und passende Reaktion."

