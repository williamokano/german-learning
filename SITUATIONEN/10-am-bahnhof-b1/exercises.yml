  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Schalter: der Anschluss ist weg"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Abend, wie kann ich helfen?
      — Mein Zug hatte 70 Minuten {1} und ich habe meinen {2}
      nach Kassel verpasst.
      — Das tut mir leid. Zeigen Sie mir bitte Ihre {3}?
      — Hier. Es ist ein Sparpreis-Ticket.
      — Bei einer Verspätung von über 20 Minuten entfällt die {4}.
      Sie dürfen also einen anderen Zug nehmen.
      — Und wann fährt der nächste?
      — Heute leider nicht mehr. Der nächste geht morgen um 5:48 Uhr.
      — Und wo soll ich {5}?
      — Ab 60 Minuten Verspätung {6} die Bahn die Hotelkosten, wenn
      die Weiterfahrt erst am nächsten Tag möglich ist. {7} Sie
      unbedingt die Rechnung auf.
      — Bekomme ich auch Geld {8}?
      — Ab 60 Minuten 25 Prozent des Fahrpreises. Den {9} stellen
      Sie online oder mit diesem {10}.
    bank: [VERSPÄTUNG, ANSCHLUSS, FAHRKARTE, ZUGBINDUNG, ÜBERNACHTEN, ÜBERNIMMT, HEBEN, ZURÜCK, ANTRAG, FORMULAR, WOHER, GLEIS, KAUFEN, WARTEN]
    answers:
      "1": VERSPÄTUNG
      "2": ANSCHLUSS
      "3": FAHRKARTE
      "4": ZUGBINDUNG
      "5": ÜBERNACHTEN
      "6": ÜBERNIMMT
      "7": HEBEN
      "8": ZURÜCK
      "9": ANTRAG
      "10": FORMULAR

  - id: B2
    block: B
    type: single-choice
    title: "Was gilt, was sagst du?"
    instructions: "Wähle die richtige Antwort."
    instructionsEn: "Choose the correct answer."
    items:
      - q: "Dein Zug ist 65 Minuten zu spät. Wie viel bekommst du zurück? — Your train is 65 minutes late. How much do you get back?"
        options:
          - { key: a, text: "Den vollen Fahrpreis." }
          - { key: b, text: "25 Prozent des Fahrpreises." }
          - { key: c, text: "Nichts, das ist zu wenig Verspätung." }
        answer: b
        why: 'Ab 60 Minuten 25 %, ab 120 Minuten 50 %. Unter 60 Minuten gibt es keine Entschädigung.'
      - q: "Du hast ein Sparpreis-Ticket und dein Zug hat 30 Minuten Verspätung. — You have a saver ticket and your train is 30 minutes late."
        options:
          - { key: a, text: "Du musst warten und genau diesen Zug nehmen." }
          - { key: b, text: "Du musst ein neues Ticket kaufen." }
          - { key: c, text: "Die Zugbindung entfällt — du darfst einen anderen Zug nehmen." }
        answer: c
        why: 'Ab 20 Minuten absehbarer Verspätung entfällt die Zugbindung. Das ist die wichtigste Regel für Sparpreis-Tickets.'
      - q: "Die Weiterfahrt ist erst am nächsten Morgen möglich. — You can only travel on the next morning."
        options:
          - { key: a, text: "Die Bahn übernimmt in der Regel die Hotelkosten — Rechnung aufheben." }
          - { key: b, text: "Du musst das Hotel selbst zahlen." }
          - { key: c, text: "Du musst am Bahnhof warten." }
        answer: a
        why: 'Ab 60 Minuten Verspätung und wenn die Weiterfahrt erst am Folgetag geht, trägt die Bahn die Übernachtung — mit Beleg.'
      - q: "Du willst am Schalter einen neuen Anschluss. — You want a new connection at the counter."
        options:
          - { key: a, text: "Mein Zug war zu spät." }
          - { key: b, text: "Ich habe den Anschluss nach Kassel verpasst. Welche Verbindung könnten Sie mir noch anbieten?" }
          - { key: c, text: "Was mache ich jetzt?" }
        answer: b
        why: 'Sagen, was passiert ist, und konkret nach einer Alternative fragen — so bekommst du eine Verbindung statt Mitleid.'
      - q: "Der Schaffner sagt, dein Ticket gelte nicht in diesem Zug. — The conductor says your ticket isn't valid in this train."
        options:
          - { key: a, text: "Das ist mir egal." }
          - { key: b, text: "Ich steige aus." }
          - { key: c, text: "Mein ursprünglicher Zug hatte über 20 Minuten Verspätung, damit entfällt die Zugbindung." }
        answer: c
        why: 'Die Regel ruhig benennen. Schaffner kennen sie — man muss sie nur nennen.'
      - q: "Wie beantragst du die Entschädigung? — How do you claim compensation?"
        options:
          - { key: a, text: "Mit dem Fahrgastrechte-Formular, mit Ticket und Belegen, online oder per Post." }
          - { key: b, text: "Am Schalter bar auszahlen lassen." }
          - { key: c, text: "Beim Schaffner im Zug." }
        answer: a
        why: 'Der Anspruch läuft über das Formular plus Nachweise — nicht über die Kasse am Bahnhof.'

  - id: B3
    block: B
    type: order
    title: "Sätze am Bahnhof bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "habe", "meinen", "Anschluss", "in", "Fulda", "verpasst"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Perfekt: habe … verpasst"
      - tiles: ["Welche", "Verbindung", "könnten", "Sie", "mir", "anbieten", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Konjunktiv II als höfliche Frage, Infinitiv am Ende"
      - tiles: ["Bei", "über", "20", "Minuten", "Verspätung", "entfällt", "die", "Zugbindung"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Verb an Position 2 nach der Zeitangabe"
      - tiles: ["Der", "Zug", "fährt", "heute", "von", "Gleis", "8", "ab"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Trennverb ab·fahren: ab am Ende"
      - tiles: ["Ich", "möchte", "eine", "Entschädigung", "beantragen"]
        answer: [0, 1, 2, 3, 4]
        note: "Modalverb an Position 2, Infinitiv am Ende"
      - tiles: ["Könnten", "Sie", "mir", "das", "bitte", "schriftlich", "bestätigen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Höfliche Bitte: Infinitiv am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Fahrgastrechte lesen"
    instructions: |
      > **Fahrgastrechte im Fernverkehr — Kurzübersicht**
      >
      > **Entschädigung bei Verspätung am Zielort**
      > - ab 60 Minuten: 25 % des Fahrpreises
      > - ab 120 Minuten: 50 % des Fahrpreises
      >
      > **Zugbindung**
      > Ist bereits am Abfahrtsbahnhof eine Verspätung von mehr als
      > 20 Minuten absehbar, entfällt die Zugbindung. Sie können einen
      > anderen Zug nutzen.
      >
      > **Übernachtung**
      > Ist die Weiterfahrt erst am Folgetag möglich, werden angemessene
      > Kosten für Übernachtung und Transfer übernommen. Belege sind
      > beizufügen.
      >
      > Hinweis: Beträge unter 4,00 € werden nicht ausgezahlt.
      > Anträge sind innerhalb eines Jahres nach der Reise zu stellen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Bei 45 Minuten Verspätung bekommt man 25 % zurück. — With a 45-minute delay you get 25 % back."
        answer: false
        why: "Erst ab 60 Minuten."
      - q: "Bei 2,5 Stunden Verspätung sind es 50 %. — With a 2.5-hour delay it's 50 %."
        answer: true
        why: "120 Minuten sind erreicht — also 50 %."
      - q: "Ein Ticket für 12 € bringt bei 60 Minuten Verspätung eine Auszahlung. — A €12 ticket pays out after a 60-minute delay."
        answer: false
        why: "25 % von 12 € sind 3,00 € — unter der 4-Euro-Grenze."
      - q: "Die Zugbindung entfällt schon vor der Abfahrt, wenn 25 Minuten Verspätung absehbar sind. — The train restriction lapses before departure if a 25-minute delay is foreseeable."
        answer: true
        why: "„bereits am Abfahrtsbahnhof … mehr als 20 Minuten absehbar“."
      - q: "Hotelkosten werden ohne Beleg erstattet. — Hotel costs are reimbursed without a receipt."
        answer: false
        why: "„Belege sind beizufügen.“"
      - q: "Man kann den Antrag auch zwei Jahre später noch stellen. — You can still claim two years later."
        answer: false
        why: "„innerhalb eines Jahres nach der Reise“."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Der Ernstfall"
    instructions: "Was machst oder sagst du? Wähle a, b oder c."
    instructionsEn: "What do you do or say? Choose a, b, or c."
    items:
      - q: "Es ist 23 Uhr, kein Schalter offen, kein Zug mehr. — It's 11 pm, no counter open, no more trains."
        options:
          - { key: a, text: "Am Bahnhof warten." }
          - { key: b, text: "Hotel selbst buchen, Rechnung und Verspätungsnachweis aufheben und später einreichen." }
          - { key: c, text: "Ein Taxi nach Hause nehmen, egal was es kostet." }
        answer: b
        why: 'Selbst buchen und belegen ist der vorgesehene Weg — ohne Belege gibt es später nichts.'
      - q: "Du brauchst einen Nachweis über die Verspätung. — You need proof of the delay."
        options:
          - { key: a, text: "Ein Foto von der Anzeigetafel machen." }
          - { key: b, text: "Sich die Verspätung vom Zugpersonal oder am Schalter bestätigen lassen." }
          - { key: c, text: "Nichts, das steht im System." }
        answer: b
        why: 'Die schriftliche Bestätigung ist der Beleg, den das Formular verlangt. Ein Foto hilft zusätzlich, ersetzt sie aber nicht.'
      - q: "Dein Antrag wird abgelehnt, obwohl der Zug 80 Minuten zu spät war. — Your claim is refused although the train was 80 minutes late."
        options:
          - { key: a, text: "Akzeptieren." }
          - { key: b, text: "Nochmal denselben Antrag schicken." }
          - { key: c, text: "Schriftlich widersprechen, Verspätungsnachweis beifügen und auf die Ankunftszeit am Zielort verweisen." }
        answer: c
        why: 'Entscheidend ist die Verspätung am ZIEL, nicht unterwegs — dieser Punkt klärt die meisten Ablehnungen.'
      - q: "Der Ersatzbus fährt ab, aber dein Koffer ist noch im Zug. — The replacement bus is leaving but your suitcase is still on the train."
        options:
          - { key: a, text: "Sofort das Zugpersonal ansprechen, bevor der Zug weiterfährt." }
          - { key: b, text: "Später beim Fundbüro fragen." }
          - { key: c, text: "Den Bus verpassen und im Zug bleiben." }
        answer: a
        why: 'Solange der Zug steht, ist es lösbar. Danach wird daraus ein Fundsachen-Fall über Wochen.'
      - q: "Du hast eine Reservierung, aber jemand sitzt auf deinem Platz. — You have a reservation but someone is in your seat."
        options:
          - { key: a, text: "Entschuldigung, ich glaube, das ist mein reservierter Platz — hier ist meine Reservierung." }
          - { key: b, text: "Stehen bleiben und nichts sagen." }
          - { key: c, text: "Sofort den Schaffner rufen." }
        answer: a
        why: 'Freundlich mit dem Beleg in der Hand — meist reicht das und niemand muss den Schaffner holen.'
      - q: "Die Strecke ist gesperrt, es gibt Schienenersatzverkehr. — The line is closed, there's a rail replacement bus."
        options:
          - { key: a, text: "Auf den nächsten Zug warten." }
          - { key: b, text: "Nach dem Abfahrtsort des Ersatzbusses fragen und die zusätzliche Fahrzeit einplanen." }
          - { key: c, text: "Ein eigenes Ticket für den Bus kaufen." }
        answer: b
        why: 'Der Ersatzbus ist im Ticket enthalten. Wichtig ist nur, wo er abfährt und wie lange er braucht.'

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Ich hätte gern eine {1} über die Verspätung. (schriftlicher Beleg)
      2. Bei über 20 Minuten Verspätung {2} die Zugbindung. (nicht mehr gelten)
      3. Ich möchte eine {3} beantragen. (Geld zurück)
      4. Die Bahn {4} die Hotelkosten. (bezahlen, formell)
      5. Bitte {5} Sie die Belege bei. (mitschicken)
      6. Ich {6} der Ablehnung. (nicht einverstanden sein, formell)
      7. Zwischen Fulda und Kassel fährt ein {7}. (Bus statt Bahn)
      8. Entscheidend ist die Ankunftszeit am {8}. (wo die Reise endet)
    answers:
      "1": Bestätigung
      "2": entfällt
      "3": Entschädigung
      "4": übernimmt
      "5": fügen
      "6": widerspreche
      "7": Schienenersatzverkehr
      "8": Zielort

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    notes: "11+ / 14 → du bekommst dein Geld zurück. Unter 11: Block B4 und C noch einmal."
    instructions: "Ergänze die Lücken."
    instructionsEn: "Fill in the gaps."
    text: |
      **Die Regeln (4 Punkte):**
      1. Ab {1} Minuten Verspätung gibt es 25 % zurück.
      2. Ab {2} Minuten sind es 50 %.
      3. Ab mehr als {3} Minuten absehbarer Verspätung entfällt die Zugbindung.
      4. Entscheidend ist die Verspätung am {4}, nicht unterwegs.

      **Wortschatz (5 Punkte):**
      5. Der Zug, in den du umsteigst: der {5}
      6. Geld zurück bei Verspätung: die {6}
      7. Bus statt Bahn bei Streckensperrung: der {7}
      8. Deine Ansprüche bei Verspätung: die {8}
      9. Der gebuchte Platz im Zug: die {9}

      **Redemittel (5 Punkte):**
      10. Am Schalter: „Welche Verbindung {10} Sie mir anbieten?“
      11. Beleg: „Ich hätte gern eine {11} über die Verspätung.“
      12. Antrag: „Ich möchte eine Entschädigung {12}.“
      13. Anlagen: „Bitte {13} Sie die Belege bei.“
      14. Ablehnung: „Ich {14} der Ablehnung.“
    answers:
      "1": "60"
      "2": "120"
      "3": "20"
      "4": Zielort
      "5": Anschlusszug
      "6": Entschädigung
      "7": Schienenersatzverkehr
      "8": Fahrgastrechte
      "9": Sitzplatzreservierung
      "10": könnten
      "11": Bestätigung
      "12": beantragen
      "13": fügen
      "14": widerspreche

  - id: D2
    block: D
    type: free-write
    title: "Antrag auf Entschädigung"
    prompt: "Schreib den Antrag an den Fahrgastrechte-Service. 10–14 Sätze."
    stimulus: |
      Deine Reise:

      12.07.2026, ICE 573, Frankfurt Hbf → Kassel-Wilhelmshöhe
      Planmäßige Ankunft: 20:14 Uhr
      Tatsächliche Ankunft: am nächsten Morgen, 07:52 Uhr

      Der ICE hatte 70 Minuten Verspätung. In Fulda hast du den
      Anschluss verpasst; es fuhr kein Zug mehr. Du hast im Hotel
      übernachtet (95 Euro) und bist morgens weitergefahren.
      Fahrpreis: 89 Euro. Belege: Hotelrechnung und Fahrkarte.

      Du willst: die Verspätung schildern, die Entschädigung beantragen
      und die Erstattung der Hotelkosten verlangen.
    use:
      - "Zugnummer, Datum und Strecke im ersten Absatz"
      - "Perfekt für den Ablauf"
      - "`Ich beantrage hiermit …`"
      - "`Die Belege füge ich bei.`"
    selfCheck:
      - "Stehen Zugnummer, Datum, Strecke UND beide Ankunftszeiten im Antrag?"
      - "Hast du geplante und tatsächliche Ankunft gegenübergestellt?"
      - "Hast du BEIDES beantragt — Entschädigung und Hotelkosten?"
      - "Hast du die Belege erwähnt?"
    model: |
      Sehr geehrte Damen und Herren,

      am 12.07.2026 bin ich mit dem ICE 573 von Frankfurt Hauptbahnhof
      nach Kassel-Wilhelmshöhe gefahren. Die planmäßige Ankunft war um
      20:14 Uhr.

      Der ICE hatte bereits ab Frankfurt 70 Minuten Verspätung. Dadurch
      habe ich in Fulda meinen Anschluss verpasst. Ein weiterer Zug nach
      Kassel fuhr an diesem Abend nicht mehr, sodass eine Weiterfahrt erst
      am folgenden Morgen möglich war. Ich bin schließlich am 13.07.2026
      um 07:52 Uhr am Zielort angekommen.

      Für die Übernachtung habe ich ein Hotel in Fulda gebucht; die Kosten
      belaufen sich auf 95,00 Euro.

      Ich beantrage hiermit die Entschädigung nach den Fahrgastrechten.
