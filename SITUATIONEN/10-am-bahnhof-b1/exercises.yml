lesson: "SIT/10-am-bahnhof-b1"
title: "Am Bahnhof: Verspätung und Fahrgastrechte — B1"
topic: "Am Bahnhof"
category: "Unterwegs"
level: B1
summary: "Ticket kaufen, Anzeigen und Durchsagen verstehen — und bei Verspätung oder verpasstem Anschluss die Entschädigung tatsächlich bekommen."
intro: >
  Ein Ticket kaufen kann jeder. Interessant wird es, wenn der Zug 70
  Minuten zu spät ist, der Anschluss weg ist und niemand am Schalter
  steht. Dann zählt, ob du die Fahrgastrechte kennst und den Antrag
  richtig ausfüllst. Grammatik nach Bedarf: Passiv und Nominalstil in
  Durchsagen („wird bereitgestellt“, „mit einer Verspätung von“),
  Konjunktiv II für höfliche Bitten, Perfekt für den Ablauf. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

