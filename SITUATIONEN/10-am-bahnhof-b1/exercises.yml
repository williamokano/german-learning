    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jeden Begriff (1–10) seiner Erklärung (a–j) zu."
    instructionsEn: "Match each term (1–10) with its explanation (a–j)."
    left:
      - { key: "1", text: "der Anschlusszug" }
      - { key: "2", text: "das Gleis" }
      - { key: "3", text: "die Fahrgastrechte" }
      - { key: "4", text: "die Zugbindung" }
      - { key: "5", text: "der Fahrplanwechsel" }
      - { key: "6", text: "die Entschädigung" }
      - { key: "7", text: "der Schienenersatzverkehr" }
      - { key: "8", text: "die Sitzplatzreservierung" }
      - { key: "9", text: "die Durchsage" }
      - { key: "10", text: "das Sparpreis-Ticket" }
    right:
      - { key: a, text: "Der Zug, in den du danach umsteigen musst." }
      - { key: b, text: "Wo der Zug hält — die Nummer steht auf der Anzeige." }
      - { key: c, text: "Bus statt Bahn, wenn die Strecke gesperrt ist." }
      - { key: d, text: "Die Regel, dass du genau diesen Zug nehmen musst." }
      - { key: e, text: "Geld zurück, wenn der Zug zu spät war." }
      - { key: f, text: "Die Ansage über Lautsprecher im Bahnhof oder Zug." }
      - { key: g, text: "Deine Ansprüche bei Verspätung und Ausfall." }
      - { key: h, text: "Ein günstiges Ticket, das nur für einen bestimmten Zug gilt." }
      - { key: i, text: "Der Tag, an dem die neuen Fahrpläne gelten." }
      - { key: j, text: "Der bestimmte Platz, den du im Voraus buchst." }
    answers:
      "1": a
      "2": b
      "3": g
      "4": d
      "5": i
      "6": e
      "7": c
      "8": j
      "9": f
      "10": h

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Durchsagen verstehen"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. „Der ICE 573 nach München hat voraussichtlich 40 Minuten {1}.“
      2. „Der Zug {2} heute von Gleis 8 statt Gleis 3.“
      3. „Bitte beachten Sie die {3} Wagenreihung.“
      4. „Der Anschlusszug nach Nürnberg wird {4}.“
      5. „Wegen einer Streckensperrung {5} zwischen Fulda und Kassel Busse.“
      6. „Wir bitten um Ihr {6} für die Unannehmlichkeiten.“
      7. „Der Zug endet hier. Bitte {7} Sie alle aus.“
      8. „Bitte {8} Sie Ihre Fahrkarten bereit.“
    answers:
