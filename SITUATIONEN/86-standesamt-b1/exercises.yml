lesson: "SIT/86-standesamt-b1"
title: "Standesamt — B1"
topic: "Standesamt"
category: "Behörden & Formelles"
level: B1
summary: "Die Eheschließung beim Standesamt anmelden, die nötigen Dokumente vorlegen und nach der Trauung die Heiratsurkunde bekommen — und was tun, wenn ein Dokument fehlt oder nicht übersetzt ist."
intro: >
  Vor der Hochzeit muss man beim Standesamt einiges erledigen: die
  Eheschließung anmelden, die Geburtsurkunde und die
  Ledigkeitsbescheinigung vorlegen, einen Trautermin vereinbaren und
  nach der Trauung die Heiratsurkunde abholen. Dieses Set übt genau
  das — anmelden, Dokumente vorlegen, heiraten, und was zu tun ist,
  wenn ein Dokument fehlt oder eine ausländische Urkunde noch nicht
  übersetzt ist. Grammatik nach Bedarf: Modalverben, Perfekt und Futur
  I. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

