  - id: B2
    block: B
    type: single-choice
    title: "Höflich mit Nachbarn sprechen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einen Waschtermin tauschen. — You want to swap a laundry slot."
        options:
          - { key: a, text: "Könnten wir vielleicht tauschen? Es würde mir sehr helfen." }
          - { key: b, text: "Ich brauche Ihren Termin, geben Sie ihn mir." }
          - { key: c, text: "Warum haben Sie den Termin überhaupt?" }
        answer: a
        why: "Die Konjunktiv-II-Frage mit Begründung ist die höfliche Form für so eine Bitte unter Nachbarn."
      - q: "Ein Nachbar hört nach 22 Uhr laute Musik. — A neighbour is playing loud music after 10 pm."
        options:
          - { key: a, text: "Sofort die Polizei rufen." }
          - { key: b, text: "Freundlich anklopfen und auf die Ruhezeit hinweisen." }
          - { key: c, text: "Laute Musik zurückspielen." }
        answer: b
        why: "Ein direktes, freundliches Gespräch löst die meisten Ruhezeit-Konflikte, bevor sie eskalieren."
      - q: "Du hast die Kehrwoche vergessen. — You forgot your cleaning-duty week."
        options:
          - { key: a, text: "So tun, als wäre nichts gewesen." }
          - { key: b, text: "Dich entschuldigen und das Treppenhaus nachträglich putzen." }
          - { key: c, text: "Den Nachbarn die Schuld geben." }
        answer: b
        why: "Eine kurze Entschuldigung und die Nacharbeit sind hier die einfachste Lösung."
      - q: "Du bist unsicher, in welche Tonne eine Verpackung gehört. — You're unsure which bin a package belongs in."
        options:
          - { key: a, text: "Einfach in die nächste Tonne werfen." }
          - { key: b, text: "Kurz einen Nachbarn oder die Hausordnung fragen." }
          - { key: c, text: "Die Verpackung im Hausflur liegen lassen." }
        answer: b
        why: "Nachfragen verhindert falsch sortierten Müll — die Hausordnung oder ein Nachbar hilft meist schnell weiter."
      - q: "Du möchtest am Sonntag ein Regal aufbauen, das etwas laut ist. — You want to assemble a shelf on Sunday, which will be a bit noisy."
        options:
          - { key: a, text: "Kurz bei den direkten Nachbarn Bescheid geben, dass es etwas lauter wird." }
          - { key: b, text: "Einfach anfangen, ohne etwas zu sagen." }
          - { key: c, text: "Es auf Montagnacht verschieben." }
        answer: a
        why: "Ein kurzer Hinweis vorab wird meist als rücksichtsvoll verstanden, auch wenn kurzer Lärm am Sonntag nicht grundsätzlich verboten ist."
      - q: "Ein neuer Nachbar fragt dich nach den wichtigsten Regeln im Haus. — A new neighbour asks you about the house's main rules."
        options:
          - { key: a, text: "Ruhezeiten, Mülltrennung und den Waschplan kurz erklären." }
          - { key: b, text: "Sagen, dass es keine Regeln gibt." }
          - { key: c, text: "Auf die Hausverwaltung verweisen und nichts weiter sagen." }
        answer: a
        why: "Eine kurze, freundliche Einführung erspart dem neuen Nachbarn spätere Missverständnisse."

