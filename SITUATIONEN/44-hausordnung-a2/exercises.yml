lesson: "SIT/44-hausordnung-a2"
title: "Hausordnung im Alltag — A2"
topic: "Hausordnung"
category: "Wohnen & Nachbarschaft"
level: A2
summary: "Ruhezeiten, Mülltrennung, Waschplan und Treppenhausreinigung — die kleinen Regeln, die das Zusammenleben im Haus regeln."
intro: >
  Die Hausordnung hängt meist im Treppenhaus und wird trotzdem selten
  gelesen — bis etwas dagegen verstößt: die Waschmaschine läuft nach 22
  Uhr, der falsche Müll landet in der falschen Tonne, oder die
  Treppenhausreinigung wird vergessen. Dieses Set übt den Alltag rund
  um die Hausordnung: die Regeln verstehen, den Waschplan lesen und
  buchen, sich mit Nachbarn höflich absprechen, wenn etwas
  schiefgelaufen ist. Grammatik nach Bedarf: Modalverben (dürfen,
  müssen, sollen), Zeitangaben, höfliche Bitten mit Konjunktiv II.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

