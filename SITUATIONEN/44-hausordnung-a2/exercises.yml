  - id: D2
    block: D
    type: free-write
    title: "Waschplan, Kehrwoche, Nachbarn"
    prompt: "Schreib drei Teile: das Gespräch über den Waschtermin, ein kleines Missverständnis und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du möchtest deinen Waschtermin am Samstag mit einem Nachbarn
      tauschen, weil Familie zu Besuch kommt. Später merkst du, dass ihr
      diese Woche auch die Kehrwoche habt und sie fast vergessen hättet.

      Im Gespräch über den Waschtermin müssen vorkommen:
      1. höflich fragen, ob ein Tausch möglich ist
      2. den Grund kurz nennen
      3. dich für die Hilfe bedanken

      Im Missverständnis müssen vorkommen:
      4. merken, dass die Kehrwoche fast vergessen wurde
      5. dich bei den Nachbarn dafür entschuldigen
      6. erklären, warum es passiert ist

      In der Lösung müssen vorkommen:
      7. das Treppenhaus noch am selben Tag putzen
      8. einem Nachbarn Bescheid geben, dass es jetzt erledigt ist
      9. über die Ruhezeiten sprechen, damit es beim nächsten Mal klarer ist
      10. euch für die nächste Kehrwoche eine Erinnerung vornehmen
    use:
      - "höfliche Bitte: „Könnten wir …?“"
      - "Modalverben: dürfen, müssen, sollen"
      - "Perfekt bei Entschuldigungen: „Wir haben es vergessen.“"
    selfCheck:
      - "Ist die Bitte um den Tausch höflich formuliert?"
      - "Steht bei den Modalverben der Infinitiv wirklich am Satzende?"
      - "Klingt die Entschuldigung ehrlich, ohne die Schuld auf andere zu schieben?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Das Gespräch über den Waschtermin**

      Ich: Hallo, ich habe eine Frage zum Waschplan. Sie haben sich für Samstag eingetragen — könnten wir vielleicht tauschen?
      Nachbar: Warum, brauchen Sie den Termin dringend?
      Ich: Ja, meine Familie kommt am Wochenende zu Besuch, und ich muss vorher noch Bettwäsche waschen.
      Nachbar: Kein Problem, ich steige auf Sonntag um.
      Ich: Das ist sehr nett von Ihnen, vielen Dank.

      **Das Missverständnis**

      (Am nächsten Tag)
      Ich: Moment, diese Woche ist doch unsere Kehrwoche! Das hätten wir fast vergessen.
      Nachbar: Oh nein, stimmt. Das Treppenhaus sieht wirklich nicht sauber aus.
      Ich: Es tut mir leid, das war mein Fehler — ich hatte den Plan gar nicht mehr angeschaut.
      Nachbar: Kein Problem, lass uns das einfach jetzt machen.

      **Die Lösung**

      Ich: Ich hole den Besen, du machst die Treppe?
      Nachbar: Gut, in einer halben Stunde sind wir fertig.
      (später)
      Ich: So, fertig! Ich sage kurz den anderen Nachbarn Bescheid, dass es erledigt ist.
      Nachbar: Gute Idee. Und lass uns beim nächsten Mal früher auf den Plan schauen — vielleicht schreiben wir uns eine Erinnerung.
      Ich: Guter Plan. Und übrigens: wegen der Ruhezeiten — ich putze morgen erst nach 15 Uhr, falls das okay ist.
      Nachbar: Passt, kein Problem.
