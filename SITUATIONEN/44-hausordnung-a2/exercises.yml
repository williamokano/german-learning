  - id: B4
    block: B
    type: true-false
    title: "Den Aushang im Treppenhaus lesen"
    instructions: |
      > **Hausordnung — wichtige Punkte**
      >
      > - **Ruhezeiten:** Mittagsruhe **13–15 Uhr**, Nachtruhe **22–7
      >   Uhr**. Laute Geräte und Musik bitte nur außerhalb dieser
      >   Zeiten.
      > - **Waschküche:** Bitte in den **Waschplan im Keller**
      >   eintragen. Nach **20 Uhr** läuft keine Maschine mehr.
      > - **Mülltrennung:** Biomüll (braun), Restmüll (grau),
      >   Verpackungen (gelb), Papier (blau). Sperrmüll bitte nicht
      >   einfach neben die Tonnen stellen, sondern **anmelden**.
      > - **Kehrwoche:** Der Plan hängt im Hausflur. Bei Verhinderung
      >   bitte **rechtzeitig tauschen**.
      > - **Fahrräder** bitte im Fahrradkeller abstellen, nicht im
      >   Treppenhaus.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Mittagsruhe dauert von 13 bis 15 Uhr. — Quiet hours at midday run from 1 to 3 pm."
        answer: true
        why: "So steht es ausdrücklich im Aushang."
      - q: "Nach 21 Uhr darf noch gewaschen werden. — Laundry is still allowed after 9 pm."
        answer: false
        why: "Nach 20 Uhr läuft keine Maschine mehr."
      - q: "Sperrmüll darf man einfach neben die Tonnen stellen. — Bulky waste may simply be placed next to the bins."
        answer: false
        why: "Sperrmüll muss angemeldet werden, nicht einfach danebengestellt."
      - q: "Der Waschplan hängt im Keller. — The laundry schedule hangs in the basement."
        answer: true
        why: "„Bitte in den Waschplan im Keller eintragen.“"
      - q: "Fahrräder dürfen im Treppenhaus stehen. — Bicycles may stand in the stairwell."
        answer: false
        why: "Fahrräder gehören in den Fahrradkeller, nicht ins Treppenhaus."
      - q: "Bei Verhinderung soll man die Kehrwoche rechtzeitig tauschen. — If unavailable, the cleaning week should be swapped in time."
        answer: true
        why: "„Bei Verhinderung bitte rechtzeitig tauschen.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es Ärger im Haus gibt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ein Nachbar hat deinen Waschtermin einfach genommen. — A neighbour simply took your laundry slot."
        options:
          - { key: a, text: "Laut im Treppenhaus schimpfen." }
          - { key: b, text: "Ruhig ansprechen und auf den Eintrag im Waschplan hinweisen." }
          - { key: c, text: "Die Wäsche des Nachbarn aus der Maschine nehmen." }
        answer: b
        why: "Ein ruhiger Hinweis auf den Plan klärt das Missverständnis meist sofort, ohne Streit."
      - q: "Du hast versehentlich Restmüll in die Biotonne geworfen. — You accidentally threw regular waste into the compost bin."
        options:
          - { key: a, text: "Es beim nächsten Mal besser trennen und, falls möglich, kurz korrigieren." }
          - { key: b, text: "So tun, als wäre nichts passiert." }
          - { key: c, text: "Sich bei der Hausverwaltung entschuldigen, obwohl niemand etwas gemerkt hat." }
        answer: a
        why: "Kleine Fehler beim Trennen passieren — wichtig ist, es beim nächsten Mal richtig zu machen."
      - q: "Ihr habt eure Kehrwoche komplett vergessen. — You completely forgot your cleaning-duty week."
        options:
          - { key: a, text: "Abwarten, ob es jemand merkt." }
          - { key: b, text: "Euch entschuldigen und das Treppenhaus so schnell wie möglich nachputzen." }
          - { key: c, text: "Behaupten, ihr wart nicht dran." }
        answer: b
        why: "Eine schnelle Entschuldigung mit sofortiger Nacharbeit ist die einfachste Lösung."
      - q: "Ein Nachbar bohrt sonntags mitten am Nachmittag. — A neighbour is drilling on Sunday afternoon."
        options:
          - { key: a, text: "Sofort die Hausverwaltung anrufen." }
          - { key: b, text: "Kurz anklopfen und freundlich fragen, wie lange es noch dauert." }
          - { key: c, text: "Zur Vergeltung selbst laut Musik hören." }
        answer: b
        why: "Kurzer Lärm am Sonntagnachmittag ist meist toleriert; eine freundliche Nachfrage klärt, ob es bald vorbei ist."
      - q: "Du bekommst eine Beschwerde, weil du am Samstagabend Gäste hattest. — You get a complaint for having guests over on Saturday evening."
        options:
          - { key: a, text: "Dich entschuldigen, falls es wirklich zu laut war, und beim nächsten Mal früher Bescheid geben." }
          - { key: b, text: "Die Beschwerde ignorieren." }
          - { key: c, text: "Zurückschreiben, dass Gäste immer erlaubt sind." }
        answer: a
        why: "Gäste sind erlaubt, solange es nicht zu laut wird — eine kurze Entschuldigung und Rücksicht beim nächsten Mal beruhigt die Lage."
      - q: "Im Hausflur liegt schon seit Tagen Sperrmüll von jemand anderem. — Bulky waste from someone else has been sitting in the hallway for days."
        options:
          - { key: a, text: "Selbst einfach entsorgen, ohne nachzufragen." }
          - { key: b, text: "Die Hausverwaltung informieren, damit die Abholung angemeldet wird." }
          - { key: c, text: "Nichts sagen und den Sperrmüll liegen lassen." }
        answer: b
        why: "Die Hausverwaltung kann die Abholung anmelden — das ist der richtige Weg, nicht die eigene Entsorgung."

