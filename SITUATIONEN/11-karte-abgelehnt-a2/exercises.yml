      - { text: "die EC-Karte", bucket: karte }
      - { text: "die Karte wird abgelehnt", bucket: problem }
      - { text: "die Münze", bucket: bar }
      - { text: "die PIN", bucket: karte }
      - { text: "das Konto ist gesperrt", bucket: problem }
      - { text: "das Kleingeld", bucket: bar }
      - { text: "die Kreditkarte", bucket: karte }
      - { text: "der Automat behält die Karte", bucket: problem }
      - { text: "das Wechselgeld", bucket: bar }
      - { text: "der Kontostand", bucket: karte }
      - { text: "das Portemonnaie ist weg", bucket: problem }

  - id: A2
