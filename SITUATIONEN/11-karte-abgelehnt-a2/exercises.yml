        odd: 3
        why: "PIN gehört zur Karte, nicht zum Bargeld."
      - items: ["abheben", "einzahlen", "überweisen", "vergessen"]
        odd: 3
        why: "Die anderen drei sind Bankgeschäfte."
      - items: ["die EC-Karte", "die Kreditkarte", "die Kundenkarte", "der Geldautomat"]
        odd: 3
        why: "Der Geldautomat ist ein Gerät, keine Karte."
      - items: ["gesperrt", "abgelehnt", "eingezogen", "gekauft"]
        odd: 3
        why: "Die anderen drei beschreiben Probleme mit der Karte."
      - items: ["die Bank", "die Sparkasse", "die Filiale", "die Apotheke"]
