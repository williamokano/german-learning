      "2": e
      "3": a
      "4": c
      "5": h
      "6": d
      "7": g
      "8": f

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Modalverben in der Notlage"
    instructions: "Ergänze das passende Modalverb in der richtigen Form."
    instructionsEn: "Fill in the fitting modal verb in the correct form."
    text: |
      1. {1} ich mit Karte zahlen? (Erlaubnis erfragen)
      2. Hier {2} man leider nur bar zahlen. (Zwang)
      3. {3} Sie es bitte noch einmal versuchen? (höfliche Bitte)
      4. Ich {4} die Karte sperren lassen. (Absicht)
      5. Am Sonntag {5} man in Deutschland kaum irgendwo Geld abheben. (Möglichkeit)
      6. {6} ich hier meine PIN eingeben? (Erlaubnis erfragen)
    answers:
      "1": Kann
      "2": muss
      "3": Könnten
      "4": möchte
      "5": kann
      "6": Darf

  - id: A4
