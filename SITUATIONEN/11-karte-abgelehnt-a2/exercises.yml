    type: matching
    title: "Was sagst du wann?"
    instructions: "Ordne jede Situation (1–8) dem passenden Satz (a–h) zu."
    instructionsEn: "Match each situation (1–8) with the fitting sentence (a–h)."
    left:
      - { key: "1", text: "Die Karte funktioniert nicht." }
      - { key: "2", text: "Du hast nicht genug Bargeld dabei." }
      - { key: "3", text: "Du suchst einen Geldautomaten." }
      - { key: "4", text: "Der Automat hat deine Karte behalten." }
      - { key: "5", text: "Du hast dein Portemonnaie vergessen." }
      - { key: "6", text: "Du willst wissen, ob Karte geht." }
      - { key: "7", text: "Du hast nur einen großen Schein." }
      - { key: "8", text: "Du willst die Karte sperren lassen." }
    right:
      - { key: a, text: "Wo ist hier der nächste Geldautomat?" }
      - { key: b, text: "Entschuldigung, die Karte geht nicht. Kann ich bar zahlen?" }
      - { key: c, text: "Der Automat hat meine Karte eingezogen. An wen wende ich mich?" }
      - { key: d, text: "Kann ich mit Karte zahlen?" }
      - { key: e, text: "Ich habe leider nicht genug dabei. Können Sie zwei Sachen wieder abziehen?" }
