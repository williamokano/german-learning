lesson: "SIT/11-karte-abgelehnt-a2"
title: "Karte abgelehnt, Automat streikt — A2"
topic: "Wenn das Geld klemmt"
category: "Wenn etwas schiefgeht"
level: A2
summary: "Die Karte wird abgelehnt, der Automat behält sie, du hast kein Bargeld dabei — was du in dem Moment sagst und tust."
intro: >
  Deutschland und das Bargeld: Genau dann, wenn du keins dabeihast,
  steht „Nur Barzahlung“ an der Kasse. Dieses Set übt die kleinen
  Notfälle rund ums Bezahlen — Karte abgelehnt, Automat schluckt die
  Karte, Portemonnaie vergessen, Konto gesperrt. Es geht weniger um
  Grammatik als um die Sätze, die dich aus der Situation bringen, ohne
  dass es peinlich wird. Grammatik nach Bedarf: Modalverben (können,
  müssen, dürfen), höfliche Bitten und Perfekt. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Womit bezahlt man das?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: bar, label: "Bargeld" }
      - { key: karte, label: "Karte & Konto" }
      - { key: problem, label: "Wenn es klemmt" }
    tokens:
