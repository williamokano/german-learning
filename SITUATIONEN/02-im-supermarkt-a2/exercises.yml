lesson: "SIT/02-im-supermarkt-a2"
title: "Im Supermarkt und an der Kasse — A2"
topic: "Im Supermarkt"
category: "Einkaufen"
level: A2
summary: "Etwas finden, an der Theke bestellen, Pfand zurückgeben — und weiterkommen, wenn die Karte abgelehnt wird."
intro: >
  Einkaufen im deutschen Supermarkt: etwas finden, nach Mengen fragen,
  Pfand zurückgeben — und an der Kasse schnell genug sein. Der Block C
  ist der wichtigste: die Karte wird abgelehnt, du hast keinen Chip für
  den Einkaufswagen, du stehst in der falschen Schlange. Grammatik nach
  Bedarf: Akkusativ, Mengenangaben ohne Artikel, trennbare Verben
  (einkaufen, einpacken, zurückgeben) und höfliche Fragen mit Konjunktiv II
  als feste Wendung. Blocks: A Wortschatz & Redemittel → B Dialoge →
  C Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

