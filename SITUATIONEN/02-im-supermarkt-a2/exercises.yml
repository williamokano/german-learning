  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Dialog: an der Käsetheke"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, was {1} es sein?
      — Guten Tag. Ich {2} gern 200 Gramm Gouda.
      — Am {3} oder in Scheiben?
      — In Scheiben, bitte. Und wie {4} kostet der Bergkäse?
      — Zwei Euro {5} 100 Gramm.
      — Dann nehme ich {6} 150 Gramm davon.
      — Gern. {7} noch etwas?
      — Nein, danke, das {8} alles.
      — Bitte schön, hier ist Ihr {9}.
      — Vielen Dank. Wo kann ich die Flaschen {10}?
    bank: [DARF, HÄTTE, STÜCK, VIEL, PRO, AUCH, SONST, IST, ZETTEL, ZURÜCKGEBEN, WOHER, KILO, TÜTE, PASSEND]
    answers:
      "1": DARF
      "2": HÄTTE
      "3": STÜCK
      "4": VIEL
      "5": PRO
      "6": AUCH
      "7": SONST
      "8": IST
      "9": ZETTEL
      "10": ZURÜCKGEBEN

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die Variante, die im deutschen Supermarkt am besten passt."
    instructionsEn: "Choose the variant that fits best in a German supermarket."
    items:
      - q: "Du suchst die Nudeln und fragst eine Mitarbeiterin. — You're looking for pasta and ask a shop assistant."
        options:
          - { key: a, text: "Wo sind Nudeln?" }
          - { key: b, text: "Entschuldigung, wo finde ich die Nudeln?" }
          - { key: c, text: "Nudeln, bitte." }
        answer: b
        why: "„Entschuldigung, wo finde ich …?“ ist die normale höfliche Frage im Laden."
      - q: "Die Kassiererin fragt „Haben Sie es passend?“ — The cashier asks if you have exact change."
        options:
          - { key: a, text: "Nein, tut mir leid, nur einen Fünfziger." }
          - { key: b, text: "Was bedeutet passend?" }
          - { key: c, text: "Ja, das passt." }
        answer: a
        why: "„Passend“ heißt: das genaue Kleingeld. Man antwortet mit dem Schein, den man hat."
      - q: "Du willst 300 Gramm Aufschnitt an der Theke. — You want 300 g of cold cuts at the counter."
        options:
          - { key: a, text: "Geben Sie mir Aufschnitt." }
          - { key: b, text: "300 Gramm Aufschnitt." }
          - { key: c, text: "Ich hätte gern 300 Gramm Aufschnitt, bitte." }
        answer: c
        why: "Mit „Ich hätte gern … , bitte“ klingt die Bestellung höflich statt nach Befehl."
      - q: "Du hast nur drei Artikel, vor dir steht jemand mit einem vollen Wagen. — You have three items; the person ahead has a full trolley."
        options:
          - { key: a, text: "Ich bin schneller als Sie." }
          - { key: b, text: "Entschuldigung, dürfte ich vielleicht vor? Ich habe nur drei Sachen." }
          - { key: c, text: "Lassen Sie mich durch." }
        answer: b
        why: "„Dürfte ich vielleicht vor?“ ist die höfliche Bitte — und man nennt den Grund."
      - q: "Die Kassiererin sagt „Das macht 23,80.“ Du hast einen 50-Euro-Schein. — The cashier says €23.80. You have a €50 note."
        options:
          - { key: a, text: "Kein Kleingeld." }
          - { key: b, text: "Nur das hier." }
          - { key: c, text: "Geht auch ein Fünfziger?" }
        answer: c
        why: "Kurz und üblich: fragen, ob der große Schein in Ordnung ist."
      - q: "Du willst wissen, ob der Laden am Sonntag offen ist. — You want to know if the shop opens on Sunday."
        options:
          - { key: a, text: "Haben Sie sonntags geöffnet?" }
          - { key: b, text: "Sonntag offen?" }
          - { key: c, text: "Ist Sonntag Arbeit?" }
        answer: a
        why: "„Haben Sie … geöffnet?“ ist die Standardfrage nach Öffnungszeiten."

  - id: B3
    block: B
    type: order
    title: "Sätze im Supermarkt bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "kaufe", "am", "Samstag", "ein"]
        answer: [0, 1, 2, 3, 4]
        note: "Trennverb ein·kaufen: ein an letzter Stelle"
      - tiles: ["Wo", "finde", "ich", "die", "Milch", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "W-Frage: Fragewort, dann Verb"
      - tiles: ["Können", "Sie", "mir", "helfen", "?"]
        answer: [0, 1, 2, 3, 4]
        note: "Ja/Nein-Frage mit Modalverb: Infinitiv am Ende"
      - tiles: ["Die", "Flaschen", "gebe", "ich", "am", "Automaten", "zurück"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Objekt an Position 1 → Verb bleibt an Position 2, zurück am Ende"
      - tiles: ["Ich", "habe", "meinen", "Einkaufszettel", "vergessen"]
        answer: [0, 1, 2, 3, 4]
        note: "Perfekt: habe … vergessen"
      - tiles: ["Dürfte", "ich", "vielleicht", "vor", "?"]
        answer: [0, 1, 2, 3, 4]
        note: "Höfliche Bitte: Konjunktiv II an Position 1"

  - id: B4
    block: B
    type: true-false
    title: "Aushang am Eingang"
    instructions: |
      > **REWE Arcaden — Wichtige Hinweise**
      > Öffnungszeiten: Mo–Sa 7:00–22:00 Uhr. Sonntags geschlossen.
      > Einkaufswagen nur mit 1-Euro-Chip. Chips an der Information.
      > Leergut-Automat: rechts neben dem Eingang, bis 21:30 Uhr.
      > Kasse 1 ist unsere Expresskasse: bis 10 Artikel.
      > Wir akzeptieren EC-Karte und Bargeld. Kreditkarte leider nicht.
      >
      > Frischetheke: Mo–Fr bis 20:00 Uhr, Sa bis 18:00 Uhr.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Am Sonntag kann man hier einkaufen. — You can shop here on Sunday."
        answer: false
        why: "„Sonntags geschlossen.“"
      - q: "Für den Einkaufswagen braucht man eine Münze oder einen Chip. — You need a coin or a chip for the trolley."
        answer: true
        why: "„Einkaufswagen nur mit 1-Euro-Chip.“"
      - q: "Um 21:45 Uhr kann man noch Pfandflaschen zurückgeben. — At 21:45 you can still return deposit bottles."
        answer: false
        why: "Der Leergut-Automat läuft nur bis 21:30 Uhr."
      - q: "Mit 15 Artikeln darf man an Kasse 1. — With 15 items you may use checkout 1."
        answer: false
        why: "Expresskasse: bis 10 Artikel."
      - q: "Man kann mit Kreditkarte zahlen. — You can pay by credit card."
        answer: false
        why: "„Kreditkarte leider nicht.“ — nur EC-Karte und Bargeld."
      - q: "Samstags schließt die Frischetheke früher als werktags. — On Saturdays the fresh counter closes earlier than on weekdays."
        answer: true
        why: "Mo–Fr bis 20:00, Sa nur bis 18:00 Uhr."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "An der Kasse geht etwas schief"
    instructions: "Was sagst du? Wähle a, b oder c."
    instructionsEn: "What do you say? Choose a, b, or c."
    items:
      - q: "Deine Karte wird abgelehnt, die Schlange ist lang. — Your card is declined and the queue is long."
        options:
          - { key: a, text: "Ihre Maschine ist kaputt." }
          - { key: b, text: "Entschuldigung, könnten Sie es noch einmal versuchen? Sonst zahle ich bar." }
          - { key: c, text: "Das kann nicht sein." }
        answer: b
        why: "Ruhig bleiben, einen zweiten Versuch vorschlagen und gleich eine Alternative nennen."
      - q: "Du hast nicht genug Bargeld dabei. — You don't have enough cash on you."
        options:
          - { key: a, text: "Ich habe leider nicht genug dabei. Können Sie den Joghurt und die Schokolade wieder abziehen?" }
          - { key: b, text: "Ich gehe schnell weg." }
          - { key: c, text: "Ich zahle morgen." }
        answer: a
        why: "„Wieder abziehen“ (stornieren) ist die normale Lösung: Artikel zurückgeben und weniger zahlen."
      - q: "Der Preis an der Kasse ist höher als am Regal. — The price at the till is higher than on the shelf."
        options:
          - { key: a, text: "Sie betrügen mich." }
          - { key: b, text: "Am Regal stand 1,99 €. Könnten Sie das bitte prüfen?" }
          - { key: c, text: "Das ist zu teuer." }
        answer: b
        why: "Fakt nennen (der Preis am Regal) und höflich um Prüfung bitten."
      - q: "Du hast keinen Chip und keine Münze für den Einkaufswagen. — You have no chip or coin for the trolley."
        options:
          - { key: a, text: "Ich nehme den Wagen einfach so." }
          - { key: b, text: "Entschuldigung, könnten Sie mir einen Euro wechseln?" }
          - { key: c, text: "Der Wagen ist kaputt." }
        answer: b
        why: "„Könnten Sie mir … wechseln?“ — an der Information oder bei anderen Kunden."
      - q: "Du merkst zu Hause, dass der Joghurt abgelaufen ist. — At home you notice the yoghurt is past its date."
        options:
          - { key: a, text: "Ich werfe ihn weg." }
          - { key: b, text: "Ich rufe die Polizei." }
          - { key: c, text: "Ich gehe mit dem Kassenbon zurück und tausche ihn um." }
        answer: c
        why: "Mit Kassenbon umtauschen ist das übliche Vorgehen — deshalb den Bon aufheben."
      - q: "Die Kassiererin scannt einen Artikel zweimal. — The cashier scans an item twice."
        options:
          - { key: a, text: "Entschuldigung, ich glaube, die Milch ist doppelt drauf." }
          - { key: b, text: "Passen Sie besser auf!" }
          - { key: c, text: "Das stimmt nicht." }
        answer: a
        why: "„Ich glaube, … ist doppelt drauf“ nennt das Problem freundlich und konkret."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter fürs Problem"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Meine Karte wurde {1}. Ich versuche es noch einmal. (nicht akzeptiert, Partizip II)
      2. Können Sie die zwei Artikel bitte wieder {2}? (vom Bon nehmen)
      3. Am Regal {3} 1,99 € — an der Kasse sind es 2,49 €. (stehen, Präteritum)
      4. Ich möchte den Joghurt {4}, hier ist der Kassenbon. (gegen einen neuen tauschen)
      5. Den {5} bitte aufheben — ohne ihn geht kein Umtausch. (der Beleg von der Kasse)
      6. Der Joghurt ist seit gestern {6}. (nicht mehr haltbar)
      7. Die leeren Flaschen bringe ich zum {7}. (Automat für Pfand)
      8. Für den Einkaufswagen brauche ich einen {8} oder ein Euro-Stück. (kleine Marke)
    answers:
      "1": abgelehnt
      "2":
        - "abziehen"
        - "stornieren"
      "3": stand
      "4": umtauschen
      "5": Kassenbon
      "6": abgelaufen
      "7": Leergutautomaten
      "8": Chip

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    notes: "11+ / 14 → du kommst an der Kasse klar. Unter 11: Block A und C noch einmal."
    instructions: "Ergänze die Lücken."
    instructionsEn: "Fill in the gaps."
    text: |
      **Redemittel (6 Punkte):**
      1. Etwas suchen: „Entschuldigung, wo {1} ich die Nudeln?"
      2. An der Theke bestellen: „Ich {2} gern 200 Gramm Gouda."
      3. Vorlassen bitten: „{3} ich vielleicht vor? Ich habe nur drei Sachen."
      4. Nach den Öffnungszeiten fragen: „Haben Sie sonntags {4}?"
      5. Karte abgelehnt: „Könnten Sie es noch einmal {5}?"
      6. Preisfehler melden: „Am Regal {6} 1,99 €."

      **Wortschatz (5 Punkte):**
      7. eine {7} Milch (1 Liter, aus Papier)
      8. der Beleg von der Kasse: der {8}
      9. nicht mehr haltbar: {9}
      10. Geld für leere Flaschen: das {10}
      11. Kasse für wenige Artikel: die {11}

      **Trennbare Verben (3 Punkte):**
      12. Ich {12} am Samstag ein. (einkaufen)
      13. Ich gebe die Flaschen {13}. (zurückgeben)
      14. An der Kasse packe ich alles selbst {14}. (einpacken)
    answers:
      "1": finde
      "2": hätte
      "3": Dürfte
      "4": geöffnet
      "5": versuchen
      "6": stand
      "7": Packung
      "8": Kassenbon
      "9": abgelaufen
      "10": Pfand
      "11": Expresskasse
      "12": kaufe
      "13": zurück
      "14": ein

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: Einkauf mit Zwischenfall"
    prompt: "Schreib den Dialog: Du kaufst ein, an der Kasse geht etwas schief, du löst es. 12–16 Sätze."
    stimulus: |
      Du bist der Kunde. Schreib beide Rollen (Kunde und Kassiererin).

      Diese Schritte müssen vorkommen:
      1. eine Mitarbeiterin nach einem Produkt fragen
      2. an der Frischetheke eine Menge bestellen
      3. an der Kasse: „Haben Sie eine Kundenkarte?“ beantworten
      4. die Karte wird abgelehnt
      5. eine Lösung vorschlagen (zweiter Versuch ODER bar zahlen ODER Artikel abziehen)
      6. nach dem Leergutautomaten fragen
      7. sich verabschieden
    use:
      - "`Entschuldigung, wo finde ich …?`"
      - "`Ich hätte gern … Gramm …`"
      - "`Könnten Sie …?` für die höfliche Bitte"
      - "Sie-Form für das Personal"
    selfCheck:
      - "Steht bei den trennbaren Verben die Vorsilbe am Satzende?"
      - "Hast du eine Mengenangabe ohne Artikel benutzt (200 Gramm Gouda, nicht 200 Gramm von dem Gouda)?"
      - "Hast du durchgehend Sie benutzt?"
      - "Kommen alle 7 Schritte vor?"
    model: |
      Kunde: Entschuldigung, wo finde ich die Nudeln?
      Mitarbeiterin: In Gang 4, gleich neben dem Reis.
      Kunde: Vielen Dank.
      (an der Frischetheke)
      Verkäufer: Guten Tag, was darf es sein?
      Kunde: Ich hätte gern 200 Gramm Gouda, in Scheiben bitte.
      Verkäufer: Gern. Sonst noch etwas?
      Kunde: Nein danke, das ist alles.
      (an der Kasse)
      Kassiererin: Haben Sie eine Kundenkarte?
      Kunde: Nein, leider nicht.
      Kassiererin: Das macht 24,60 Euro.
      Kunde: Mit Karte, bitte.
      Kassiererin: Tut mir leid, die Karte wurde abgelehnt.
      Kunde: Entschuldigung, könnten Sie es noch einmal versuchen? Sonst zahle ich bar.
      Kassiererin: Jetzt hat es geklappt. Danke.
      Kunde: Eine Frage noch: Wo kann ich die Flaschen zurückgeben?
      Kassiererin: Der Leergutautomat ist rechts neben dem Eingang.
      Kunde: Super, vielen Dank. Schönen Tag noch!
      Kassiererin: Danke, Ihnen auch. Auf Wiederhören — äh, auf Wiedersehen!
