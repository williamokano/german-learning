    type: gap-text
    listLayout: true
    title: "Trennbare Verben beim Einkaufen"
    instructions: "Ergänze das Verb in der richtigen Form. Achte auf die trennbare Vorsilbe."
    instructionsEn: "Fill in the verb in the correct form. Watch the separable prefix."
    text: |
      1. Ich {1} jeden Samstag im Supermarkt {2}. (einkaufen)
      2. {3} Sie die Flaschen bitte {4}? (zurückgeben)
      3. An der Kasse {5} ich meine Sachen selbst {6}. (einpacken)
      4. Der Markt {7} um sieben Uhr {8}. (aufmachen)
      5. Wir {9} das Angebot {10}. (mitnehmen)
    answers:
