lesson: "SIT/07-auslaenderbehoerde-b1"
title: "Bei der Ausländerbehörde — B1"
topic: "Bei der Ausländerbehörde"
category: "Behörden & Formelles"
level: B1
summary: "Termin bekommen, Unterlagen zusammenstellen, den Aufenthaltstitel verlängern — und reagieren, wenn eine Unterlage fehlt oder der Titel abläuft."
intro: >
  Die Behörde, bei der ein fehlendes Blatt Papier einen Termin kostet,
  auf den man Monate gewartet hat. Deshalb liegt der Schwerpunkt auf
  zwei Dingen: die Unterlagenliste wirklich verstehen und schriftlich
  nachfragen können. Dazu das Vokabular — Aufenthaltstitel,
  Verlängerung, Fiktionsbescheinigung, Verpflichtungserklärung — und
  das Passiv und der Nominalstil, in denen Behörden schreiben. Block C
  ist der Ernstfall: Unterlage fehlt, kein Termin vor Ablauf, Antrag
  abgelehnt. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jeden Begriff (1–10) seiner Erklärung (a–j) zu."
    instructionsEn: "Match each term (1–10) with its explanation (a–j)."
    left:
      - { key: "1", text: "der Aufenthaltstitel" }
      - { key: "2", text: "die Verlängerung" }
      - { key: "3", text: "die Fiktionsbescheinigung" }
      - { key: "4", text: "die Meldebescheinigung" }
      - { key: "5", text: "der Nachweis über den Lebensunterhalt" }
      - { key: "6", text: "die Niederlassungserlaubnis" }
      - { key: "7", text: "die Verpflichtungserklärung" }
      - { key: "8", text: "das Sprachzertifikat" }
      - { key: "9", text: "die Blaue Karte EU" }
      - { key: "10", text: "der Termin zur Vorsprache" }
    right:
      - { key: a, text: "Der unbefristete Aufenthalt — er läuft nicht mehr ab." }
      - { key: b, text: "Die Erlaubnis, in Deutschland zu leben, meist befristet." }
      - { key: c, text: "Das Papier, das gilt, solange über deinen Antrag noch entschieden wird." }
      - { key: d, text: "Der Beleg, dass du genug Geld zum Leben hast — Gehaltsabrechnungen, Arbeitsvertrag." }
      - { key: e, text: "Wenn dein Titel bald abläuft und du ihn weiterlaufen lassen willst." }
      - { key: f, text: "Der Aufenthaltstitel für Fachkräfte mit Hochschulabschluss und Mindestgehalt." }
      - { key: g, text: "Der Nachweis vom Bürgeramt, dass du hier gemeldet bist." }
      - { key: h, text: "Die Zusage einer Person, für die Kosten eines Gastes aufzukommen." }
      - { key: i, text: "Der persönliche Termin, zu dem du in die Behörde kommen musst." }
      - { key: j, text: "Das Papier über dein Sprachniveau, z. B. B1." }
    answers:
      "1": b
      "2": e
      "3": c
      "4": g
      "5": d
      "6": a
      "7": h
      "8": j
      "9": f
      "10": i

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Behördendeutsch auflösen"
    instructions: "Ergänze das Verb, das den Nominalausdruck auflöst."
    instructionsEn: "Fill in the verb that resolves the nominal expression."
    text: |
      1. „nach Vorlage aller Unterlagen" → sobald Sie alle Unterlagen {1}
      2. „bei Ablauf des Titels" → wenn der Titel {2}
      3. „zur Bearbeitung Ihres Antrags" → damit wir Ihren Antrag {3} können
      4. „unter Vorlage des Reisepasses" → indem Sie den Reisepass {4}
      5. „nach Prüfung der Voraussetzungen" → nachdem wir die Voraussetzungen {5} haben
      6. „bei Nichterscheinen zum Termin" → wenn Sie nicht zum Termin {6}
      7. „zur Vermeidung von Verzögerungen" → damit sich nichts {7}
      8. „nach Eingang der Gebühr" → sobald die Gebühr {8}
    answers:
      "1": vorlegen
      "2": abläuft
      "3": bearbeiten
      "4": vorlegen
      "5": geprüft
      "6": erscheinen
      "7": verzögert
      "8": eingeht

  - id: A3
    block: A
    type: categorize
    title: "Wer schreibt so: Behörde oder Antragsteller?"
    instructions: "Sortiere die Formulierungen."
    instructionsEn: "Sort the phrasings."
    buckets:
      - { key: amt, label: "Behörde" }
      - { key: person, label: "Antragsteller/in" }
    tokens:
      - { text: "Ihr Antrag befindet sich derzeit in Bearbeitung.", bucket: amt }
      - { text: "Ich möchte meinen Aufenthaltstitel verlängern lassen.", bucket: person }
      - { text: "Die Unterlagen sind vollständig vorzulegen.", bucket: amt }
      - { text: "Könnten Sie mir mitteilen, welche Unterlagen noch fehlen?", bucket: person }
      - { text: "Eine Terminvergabe erfolgt ausschließlich online.", bucket: amt }
      - { text: "Mein Titel läuft am 30.09. ab. Ich habe aber erst im November einen Termin.", bucket: person }
      - { text: "Über Ihren Antrag wird nach Aktenlage entschieden.", bucket: amt }
      - { text: "Ich bitte um eine Fiktionsbescheinigung, bis über meinen Antrag entschieden ist.", bucket: person }
      - { text: "Bitte erscheinen Sie persönlich zum vereinbarten Termin.", bucket: amt }
      - { text: "Leider konnte ich den Termin krankheitsbedingt nicht wahrnehmen.", bucket: person }

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv im Behördentext"
    instructions: "Ergänze die Passivform."
    instructionsEn: "Fill in the passive form."
    text: |
      1. Der Antrag {1} zurzeit {2}. (bearbeiten — Präsens Passiv)
      2. Die Unterlagen {3} vollständig {4}. (einreichen — Präsens Passiv)
      3. Der Termin {5} online {6}. (vergeben — Präsens Passiv)
      4. Über den Antrag {7} in vier Wochen {8}. (entscheiden — Präsens Passiv)
      5. Die Gebühr {9} bei der Vorsprache {10}. (bezahlen — Präsens Passiv)
    answers:
      "1": wird
      "2": bearbeitet
      "3": werden
      "4": eingereicht
      "5": wird
      "6": vergeben
      "7": wird
      "8": entschieden
      "9": wird
      "10": bezahlt

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Schalter: Verlängerung beantragen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag. Was kann ich für Sie tun?
      — Guten Tag. Ich möchte meinen Aufenthaltstitel {1} lassen.
      — Haben Sie einen {2}?
      — Ja, um 10:30 Uhr auf den Namen Yilmaz.
      — Gut. Bitte legen Sie Ihren {3} und den alten Titel vor.
      — Hier, bitte.
      — Danke. Ich brauche außerdem die {4} vom Bürgeramt und einen
      {5} über Ihren Lebensunterhalt.
      — Die Meldebescheinigung habe ich dabei, und hier sind meine
      letzten drei {6}.
      — Sehr gut. Ihr {7} ist unbefristet?
      — Ja, seit Januar.
      — Dann {8} wir den Antrag auf. Die {9} beträgt 100 Euro.
      — Kann ich mit Karte {10}?
    bank: [VERLÄNGERN, TERMIN, REISEPASS, MELDEBESCHEINIGUNG, NACHWEIS, GEHALTSABRECHNUNGEN, ARBEITSVERTRAG, NEHMEN, GEBÜHR, ZAHLEN, WOHER, ANTRAG, PRÜFEN, BAR]
    answers:
      "1": VERLÄNGERN
      "2": TERMIN
      "3": REISEPASS
      "4": MELDEBESCHEINIGUNG
      "5": NACHWEIS
      "6": GEHALTSABRECHNUNGEN
      "7": ARBEITSVERTRAG
      "8": NEHMEN
      "9": GEBÜHR
      "10": ZAHLEN

  - id: B2
    block: B
    type: single-choice
    title: "Formell genug?"
    instructions: "Welche Formulierung passt gegenüber der Behörde?"
    instructionsEn: "Which phrasing works with the authority?"
    items:
      - q: "Du schreibst per E-Mail und kennst niemanden namentlich. — You're writing by e-mail and know nobody by name."
        options:
          - { key: a, text: "Hallo, kurze Frage:" }
          - { key: b, text: "Sehr geehrte Damen und Herren," }
          - { key: c, text: "Liebe Ausländerbehörde," }
        answer: b
        why: 'Standardanrede ohne Namen. Alles andere wirkt bei einer Behörde unpassend.'
      - q: "Dein Titel läuft ab, bevor du einen Termin bekommst. — Your permit expires before you can get an appointment."
        options:
          - { key: a, text: "Ich habe keinen Termin bekommen, das ist Ihr Problem." }
          - { key: b, text: "Mein Aufenthaltstitel läuft am 30.09.2026 ab. Der nächste freie Termin ist erst im November. Ich bitte um eine Fiktionsbescheinigung." }
          - { key: c, text: "Was soll ich jetzt machen?" }
        answer: b
        why: 'Datum, Problem und die konkrete Bitte in drei Sätzen — die Fiktionsbescheinigung ist genau für diesen Fall da.'
      - q: "Du willst wissen, welche Unterlagen fehlen. — You want to know which documents are missing."
        options:
          - { key: a, text: "Schicken Sie mir eine Liste." }
          - { key: b, text: "Was fehlt noch?" }
          - { key: c, text: "Könnten Sie mir bitte mitteilen, welche Unterlagen noch fehlen?" }
        answer: c
        why: '„Könnten Sie mir bitte mitteilen, …“ plus indirekte Frage — die höfliche Standardform.'
      - q: "Du kannst den Termin nicht wahrnehmen. — You can't make the appointment."
        options:
          - { key: a, text: "Ich komme nicht." }
          - { key: b, text: "Leider kann ich den Termin am 14.07. nicht wahrnehmen. Ich bitte um einen neuen Termin." }
          - { key: c, text: "Der Termin passt mir nicht." }
        answer: b
        why: 'Absagen, Datum nennen und gleich um einen Ersatztermin bitten — sonst verfällt der Vorgang.'
      - q: "Du reichst fehlende Papiere nach. — You're submitting missing papers."
        options:
          - { key: a, text: "Anbei reiche ich die fehlenden Unterlagen nach. Mein Aktenzeichen lautet 2026/4711." }
          - { key: b, text: "Hier sind die Sachen." }
          - { key: c, text: "Ich schicke Ihnen das jetzt." }
        answer: a
        why: 'Ohne Aktenzeichen findet die Behörde deinen Vorgang nicht — es gehört in jede Nachricht.'
      - q: "Du schließt die E-Mail ab. — You're closing the e-mail."
        options:
          - { key: a, text: "Liebe Grüße" }
          - { key: b, text: "Viele Grüße" }
          - { key: c, text: "Mit freundlichen Grüßen" }
        answer: c
        why: 'Formelle Schlussformel. „Liebe Grüße“ wäre privat, „Viele Grüße“ zu locker für einen Antrag.'

  - id: B3
    block: B
    type: gap-text
    listLayout: true
    title: "E-Mail an die Behörde: die Bausteine"
    instructions: "Ergänze die fehlenden Wörter."
    instructionsEn: "Fill in the missing words."
    text: |
      Sehr geehrte Damen und Herren,

      mein Aufenthaltstitel {1} am 30.09.2026 ab. Mein {2} lautet
      2026/4711.

      Über das Online-Portal habe ich versucht, einen Termin zu
      {3}. Der nächste freie Termin ist jedoch erst am 12.11.2026.

      Ich {4} Sie daher um eine Fiktionsbescheinigung, damit mein
      Aufenthalt bis zur Entscheidung {5} bleibt.

      Alle erforderlichen Unterlagen {6} ich dieser E-Mail bei.

      Für Rückfragen {7} ich Ihnen gern zur {8}.

      Mit freundlichen Grüßen
      Akin Yilmaz
    answers:
      "1": läuft
      "2": Aktenzeichen
      "3": vereinbaren
      "4": bitte
      "5": rechtmäßig
      "6": füge
      "7": stehe
      "8": Verfügung

  - id: B4
    block: B
    type: true-false
    title: "Das Einladungsschreiben lesen"
    instructions: |
      > **Ausländerbehörde der Stadt — Terminbestätigung**
      > Aktenzeichen: 2026/4711
      > Herrn Akin Yilmaz
      >
      > Termin: Dienstag, 14.07.2026, 10:30 Uhr, Zimmer 214
      >
      > Bitte bringen Sie zur Vorsprache mit:
      > - gültiger Reisepass (Original)
      > - bisheriger Aufenthaltstitel
      > - aktuelle Meldebescheinigung (nicht älter als drei Monate)
      > - Nachweis über den Lebensunterhalt (Arbeitsvertrag und die
      >   letzten drei Gehaltsabrechnungen)
      > - ein aktuelles biometrisches Passfoto
      >
      > Die Gebühr in Höhe von 100,00 € ist bei der Vorsprache zu
      > entrichten. Es werden ausschließlich EC-Karte und Bargeld
      > akzeptiert.
      >
      > Bei Nichterscheinen ohne Absage verfällt der Termin. Eine Absage
      > ist spätestens 24 Stunden vorher per E-Mail mitzuteilen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Eine Kopie des Reisepasses reicht aus. — A copy of the passport is enough."
        answer: false
        why: "„gültiger Reisepass (Original)“."
      - q: "Eine Meldebescheinigung von Januar ist im Juli noch gültig. — A registration certificate from January is still valid in July."
        answer: false
        why: "„nicht älter als drei Monate“ — Januar bis Juli sind sechs."
      - q: "Man kann die Gebühr mit Kreditkarte zahlen. — You can pay the fee by credit card."
        answer: false
        why: "„ausschließlich EC-Karte und Bargeld“."
      - q: "Wer absagt, muss das mindestens einen Tag vorher tun. — Anyone cancelling must do so at least a day in advance."
        answer: true
        why: "„spätestens 24 Stunden vorher“."
      - q: "Es müssen drei Gehaltsabrechnungen mitgebracht werden. — Three payslips must be brought along."
        answer: true
        why: "„die letzten drei Gehaltsabrechnungen“."
      - q: "Wer ohne Absage nicht kommt, bekommt automatisch einen neuen Termin. — Anyone who doesn't show up without cancelling automatically gets a new appointment."
        answer: false
        why: "„Bei Nichterscheinen ohne Absage verfällt der Termin.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Der Ernstfall"
    instructions: "Was machst oder schreibst du? Wähle a, b oder c."
    instructionsEn: "What do you do or write? Choose a, b, or c."
    items:
      - q: "Dein Titel läuft in vier Wochen ab, der erste freie Termin ist in drei Monaten. — Your permit expires in four weeks; the first free slot is in three months."
        options:
          - { key: a, text: "Schriftlich die Verlängerung beantragen und um eine Fiktionsbescheinigung bitten — vor Ablauf." }
          - { key: b, text: "Auf den Termin warten." }
          - { key: c, text: "Ohne Termin hingehen und warten." }
        answer: a
        why: 'Entscheidend ist, dass der Antrag VOR Ablauf eingeht. Dann gilt der Aufenthalt weiter, auch ohne Termin.'
      - q: "Beim Termin fehlt eine Gehaltsabrechnung. — At the appointment one payslip is missing."
        options:
          - { key: a, text: "Sagen, dass es nicht so wichtig ist." }
          - { key: b, text: "Fragen, ob du sie nachreichen kannst, und dir sagen lassen, an welche Adresse und bis wann." }
          - { key: c, text: "Einen neuen Termin machen." }
        answer: b
        why: 'Nachreichen ist fast immer möglich — man muss nur wissen, wohin und bis wann.'
      - q: "Du wirst krank und kannst den Termin nicht wahrnehmen. — You fall ill and can't make the appointment."
        options:
          - { key: a, text: "Einfach nicht hingehen." }
          - { key: b, text: "Am Tag danach anrufen." }
          - { key: c, text: "Spätestens 24 Stunden vorher per E-Mail absagen und um einen neuen Termin bitten." }
        answer: c
        why: 'Ohne fristgerechte Absage verfällt der Termin — und der nächste ist Monate entfernt.'
      - q: "Auf deine E-Mail kommt seit sechs Wochen keine Antwort. — There's been no answer to your e-mail for six weeks."
        options:
          - { key: a, text: "Noch einmal schreiben, auf die erste E-Mail mit Datum verweisen und um eine Eingangsbestätigung bitten." }
          - { key: b, text: "Täglich anrufen." }
          - { key: c, text: "Abwarten." }
        answer: a
        why: 'Höflich nachfassen mit Datum und Aktenzeichen — und um Bestätigung bitten, dass der Vorgang angekommen ist.'
      - q: "Dein Antrag wird abgelehnt. — Your application is rejected."
        options:
          - { key: a, text: "Sofort das Land verlassen." }
          - { key: b, text: "Die Rechtsbehelfsbelehrung im Bescheid lesen und die Frist notieren; bei Bedarf Beratung suchen." }
          - { key: c, text: "Den Bescheid ignorieren." }
        answer: b
        why: 'Im Bescheid steht, wie lange du Zeit hast, dich zu wehren. Diese Frist ist das Erste, was zählt.'
      - q: "Du verstehst einen Satz im Bescheid nicht. — You don't understand a sentence in the decision."
        options:
          - { key: a, text: "Raten und hoffen." }
          - { key: b, text: "Bei der Behörde anrufen und um eine Erläuterung bitten — die Frist läuft aber weiter." }
          - { key: c, text: "Warten, bis jemand erklärt." }
        answer: b
        why: 'Nachfragen ist richtig, hält aber keine Frist an. Beides parallel: fragen und die Frist im Blick behalten.'

  - id: C2
    block: C
    type: order
    title: "Formelle Sätze bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Mein", "Aufenthaltstitel", "läuft", "am", "30.09.2026", "ab"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Trennverb ab·laufen: ab am Satzende"
      - tiles: ["Ich", "bitte", "um", "eine", "Fiktionsbescheinigung"]
        answer: [0, 1, 2, 3, 4]
        note: "bitten um + Akkusativ"
      - tiles: ["Könnten", "Sie", "mir", "mitteilen", ",", "welche", "Unterlagen", "fehlen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Indirekte Frage: Verb am Ende"
      - tiles: ["Die", "Unterlagen", "reiche", "ich", "bis", "Freitag", "nach"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Objekt an Position 1, Verb an Position 2, nach am Ende"
      - tiles: ["Leider", "kann", "ich", "den", "Termin", "nicht", "wahrnehmen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Modalverb an Position 2, Infinitiv am Ende"
      - tiles: ["Mein", "Aktenzeichen", "lautet", "2026/4711"]
        answer: [0, 1, 2, 3]
        note: "Verb an Position 2"

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    notes: "11+ / 14 → du kommst mit der Behörde klar. Unter 11: Block A und B noch einmal."
    instructions: "Ergänze die Lücken."
    instructionsEn: "Fill in the gaps."
    text: |
      **Wortschatz (5 Punkte):**
      1. Die Erlaubnis, hier zu leben: der {1}
      2. Das Papier, solange über den Antrag entschieden wird: die {2}
      3. Der unbefristete Aufenthalt: die {3}
      4. Der Nachweis vom Bürgeramt: die {4}
      5. Die Nummer, unter der dein Vorgang läuft: das {5}

      **Formelle Redemittel (5 Punkte):**
      6. Anrede ohne Namen: „Sehr geehrte {6} und Herren,"
      7. Bitte: „Ich {7} um eine Fiktionsbescheinigung."
      8. Nachfrage: „Könnten Sie mir bitte {8}, welche Unterlagen fehlen?"
      9. Absage: „Leider kann ich den Termin nicht {9}."
      10. Schlussformel: „Mit {10} Grüßen"

      **Behördendeutsch (4 Punkte):**
      11. „nach Vorlage aller Unterlagen" → sobald Sie alle Unterlagen {11}
      12. „bei Ablauf des Titels" → wenn der Titel {12}
      13. „bei Nichterscheinen zum Termin" → wenn Sie nicht zum Termin {13}
      14. „nach Eingang der Gebühr" → sobald die Gebühr {14}
    answers:
      "1": Aufenthaltstitel
      "2": Fiktionsbescheinigung
      "3": Niederlassungserlaubnis
      "4": Meldebescheinigung
      "5": Aktenzeichen
      "6": Damen
      "7": bitte
      "8": mitteilen
      "9": wahrnehmen
      "10": freundlichen
      "11": vorlegen
      "12": abläuft
      "13": erscheinen
      "14": eingeht

  - id: D2
    block: D
    type: free-write
    title: "E-Mail an die Ausländerbehörde"
    prompt: "Schreib die vollständige E-Mail als formellen Text. 10–14 Sätze."
    stimulus: |
      Deine Situation:

      Aktenzeichen: 2026/4711
      Dein Aufenthaltstitel läuft am 30.09.2026 ab.

      Über das Online-Portal bekommst du erst am 12.11.2026 einen Termin
      — also nach Ablauf. Du hast alle Unterlagen zusammen bis auf die
      Meldebescheinigung; die bekommst du nächste Woche vom Bürgeramt.

      Du willst: die Verlängerung schriftlich beantragen, um eine
      Fiktionsbescheinigung bitten, und ankündigen, dass die
      Meldebescheinigung nachkommt.
    use:
      - "`Sehr geehrte Damen und Herren,`"
      - "Aktenzeichen im ersten Absatz"
      - "`Ich bitte um …`"
      - "`… reiche ich nach.`"
      - "`Mit freundlichen Grüßen`"
    selfCheck:
      - "Stehen Aktenzeichen UND Ablaufdatum in der E-Mail?"
      - "Ist klar, warum du schreibst statt zum Termin zu kommen?"
      - "Hast du gesagt, welche Unterlage fehlt und wann sie kommt?"
      - "Sind Anrede und Schlussformel formell?"
    model: |
      Sehr geehrte Damen und Herren,

      mein Aufenthaltstitel läuft am 30.09.2026 ab. Hiermit beantrage ich
      dessen Verlängerung. Mein Aktenzeichen lautet 2026/4711.

      Über das Online-Portal habe ich versucht, einen Termin zur Vorsprache
      zu vereinbaren. Der nächste freie Termin ist jedoch erst am
      12.11.2026 und liegt damit nach Ablauf meines Titels. Aus diesem
      Grund stelle ich den Antrag schriftlich.

      Ich bitte Sie zugleich um eine Fiktionsbescheinigung, damit mein
      Aufenthalt bis zur Entscheidung über den Antrag rechtmäßig bleibt.

      Die erforderlichen Unterlagen — Kopie des Reisepasses, bisheriger
