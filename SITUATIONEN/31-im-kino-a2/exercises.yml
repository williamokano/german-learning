lesson: "SIT/31-im-kino-a2"
title: "Im Kino — A2"
topic: "Kinoabend"
category: "Freizeit & Kultur"
level: A2
summary: "Sich verabreden, Karten und Plätze, OmU oder synchronisiert, Snacks — und was man hinterher über den Film sagt."
intro: >
  Ein Kinobesuch beginnt nicht im Kino, sondern mit einer Verabredung:
  Wann kannst du, welcher Film, welche Uhrzeit. Dann kommt die Kasse
  mit Reihe, Platz und der Frage, die in Deutschland wirklich zählt —
  Originalfassung mit Untertiteln oder synchronisiert. Drinnen geht es
  um Snacks, den richtigen Platz und darum, jemanden höflich zu bitten,
  leise zu sein. Und hinterher will jemand wissen, wie du den Film
  fandest. Grammatik nach Bedarf: Vorschläge mit wollen wir und
  sollen, Zeitangaben, Meinung mit finden und weil. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

