  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Verabreden und Karten kaufen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Du, {1} wir am Freitag ins Kino?
      — Gern! Welchen Film?
      — Den neuen. Es gibt eine {2} um 20:15 und eine um 22:30.
      — Die {3} nehme ich lieber, halb elf ist zu spät.
      — Okay. OmU oder {4}?
      — OmU, ich will die Originalstimmen hören.
      *(an der Kasse)*
      — Zweimal für 20:15, bitte. Gibt es eine {5}?
      — Mit Studentenausweis 8 € statt 12. Wo möchten Sie {6}?
      — {7} 9 oder 10, Mitte, wenn möglich.
      — 9 ist noch komplett frei. Wie lange geht der Film? Zwei Stunden
      zehn — der Saal ist heute wegen {8} etwas später wieder frei.
      — Gut zu wissen. Und eine große Tüte {9}, salzig.
      — Macht zusammen 22,50 €. Saal 3, {10} ist rechts.
      — Danke schön!
    bank: [WOLLEN, VORSTELLUNG, FRÜHERE, SYNCHRONISIERT, ERMÄSSIGUNG, SITZEN, REIHE, ÜBERLÄNGE, POPCORN, EINGANG, SPÄTERE, KARTE, PLATZ, LEINWAND]
    answers:
      "1": WOLLEN
      "2": VORSTELLUNG
      "3": FRÜHERE
      "4": SYNCHRONISIERT
      "5": ERMÄSSIGUNG
      "6": SITZEN
      "7": REIHE
      "8": ÜBERLÄNGE
      "9": POPCORN
      "10": EINGANG

  - id: B2
    block: B
    type: single-choice
    title: "Wie sagst du das?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst jemanden ins Kino einladen. — You want to invite someone to the cinema."
        options:
          - { key: a, text: "Kommst du mit ins Kino?" }
          - { key: b, text: "Ich gehe Freitag ins Kino." }
          - { key: c, text: "Wollen wir Freitag ins Kino? Es läuft der neue Film, um 20:15 oder 22:30." }
        answer: c
        why: "Tag, Film und zwei Uhrzeiten — daraus wird eine Verabredung statt einer Idee."
      - q: "An der Kasse willst du gute Plätze. — At the box office you want good seats."
        options:
          - { key: a, text: "Gute Plätze, bitte." }
          - { key: b, text: "Egal wo." }
          - { key: c, text: "Reihe 9 oder 10, Mitte, wenn noch etwas frei ist." }
        answer: c
        why: "Reihe und Position konkret nennen — „gut“ heißt für jeden etwas anderes."
      - q: "Du willst den Film auf Englisch mit Untertiteln sehen. — You want the film in English with subtitles."
        options:
          - { key: a, text: "Auf Englisch, bitte." }
          - { key: b, text: "Die OmU-Vorstellung, bitte — Original mit Untertiteln." }
          - { key: c, text: "Nicht auf Deutsch." }
        answer: b
        why: "OmU ist das Kürzel, das auf jedem deutschen Kinoprogramm steht."
      - q: "Hinter dir reden zwei Leute laut. — Two people behind you are talking loudly."
        options:
          - { key: a, text: "Entschuldigung, könnten Sie bitte etwas leiser sein?" }
          - { key: b, text: "Ruhe!" }
          - { key: c, text: "Sich umdrehen und schauen." }
        answer: a
        why: "Bitte statt Befehl — im dunklen Saal reicht ein ruhiger Satz fast immer."
      - q: "Jemand sitzt auf deinem Platz. — Someone is in your seat."
        options:
          - { key: a, text: "Sie sitzen falsch." }
          - { key: b, text: "Entschuldigung, ich glaube, das ist mein Platz — Reihe 9, Platz 12?" }
          - { key: c, text: "Sich woanders hinsetzen." }
        answer: b
        why: "Die Platznummer gleich nennen: dann ist in fünf Sekunden klar, wer sich vertan hat."
      - q: "Jemand fragt hinterher, wie du den Film fandest. — Someone asks how you found the film."
        options:
          - { key: a, text: "Ich fand ihn gut, weil die Bilder toll waren — nur das Ende war mir zu schnell." }
          - { key: b, text: "Ganz gut." }
          - { key: c, text: "Ging so." }
        answer: a
        why: "Ein Lob und ein Einwand, beide begründet — daraus entsteht ein Gespräch."

  - id: B3
    block: B
    type: order
    title: "Sätze rund um den Kinoabend bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Wollen", "wir", "am", "Freitag", "ins", "Kino", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Vorschlag mit wollen wir; ins = in das (Richtung)"
      - tiles: ["Wir", "treffen", "uns", "um", "halb", "acht", "vor", "dem", "Kino"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "halb acht = 19:30; vor + Dativ"
      - tiles: ["Ich", "fand", "den", "Film", "gut"]
        answer: [0, 1, 2, 3, 4]
        note: "Präteritum von finden — bei Meinungen üblich"
      - tiles: ["Mir", "hat", "vor", "allem", "der", "Anfang", "gefallen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "gefallen mit Dativ; Partizip am Ende"
      - tiles: ["Entschuldigung", ",", "könnten", "Sie", "bitte", "etwas", "leiser", "sein", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Konjunktiv II könnten, Infinitiv am Ende"
      - tiles: ["Das", "Ende", "war", "mir", "zu", "schnell"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "„mir zu …“ — der Dativ sagt, für wen"

  - id: B4
    block: B
    type: true-false
    title: "Das Kinoprogramm lesen"
    instructions: |
      > **Kino am Park — Freitag**
      >
      > | Film | Zeit | Fassung | Saal |
      > |---|---|---|---|
      > | Der lange Sommer | 17:30 | **synchronisiert** | 1 |
      > | Der lange Sommer | 20:15 | **OmU** | 3 |
      > | Der lange Sommer | 22:30 | OmU | 3 |
      > | Kinderkino: Mia | 15:00 | synchronisiert | 2 |
      >
      > **Eintritt 12 €**, ermäßigt (Studierende, Azubis, ab 65)
      > **8 €**. **Überlängenzuschlag 1,50 €** ab 150 Minuten.
      >
      > **Dienstag ist Kinotag:** alle Vorstellungen **7 €**.
      >
      > Werbung und Vorschau **ca. 15 Minuten** vor Filmbeginn.
      >
      > **Reservierungen** verfallen **20 Minuten** vor Beginn.
      >
      > Mitgebrachte Speisen und Getränke sind **nicht gestattet**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Um 17:30 läuft der Film auf Deutsch. — At 5:30 pm the film runs in German."
        answer: true
        why: "Die 17:30-Vorstellung ist die synchronisierte Fassung."
      - q: "Wer die Originalfassung will, muss abends kommen. — Anyone wanting the original version has to come in the evening."
        answer: true
        why: "OmU läuft nur um 20:15 und 22:30."
      - q: "Der Film beginnt pünktlich zur angegebenen Zeit. — The film starts exactly at the listed time."
        answer: false
        why: "Vorher laufen etwa 15 Minuten Werbung und Vorschau."
      - q: "Eine Studentin zahlt dienstags 8 €. — A student pays €8 on Tuesdays."
        answer: false
        why: "Dienstags kosten alle Vorstellungen 7 €."
      - q: "Wer um 20:10 kommt, hat seine Reservierung sicher. — Arriving at 8:10 pm keeps your reservation safe."
        answer: false
        why: "Reservierungen verfallen 20 Minuten vor Beginn, also um 19:55."
      - q: "Eigenes Popcorn darf man mitbringen. — You may bring your own popcorn."
        answer: false
        why: "„Mitgebrachte Speisen und Getränke sind nicht gestattet.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn der Abend hakt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Deine Verabredung sagt zwei Stunden vorher ab. — Your date cancels two hours before."
        options:
          - { key: a, text: "Kein Problem — gehen wir nächste Woche? Dienstag ist Kinotag, da ist es billiger." }
          - { key: b, text: "Danke auch." }
          - { key: c, text: "Nicht antworten." }
        answer: a
        why: "Absage annehmen und gleich neu vorschlagen — dann kippt der Plan nicht ganz."
      - q: "Du hast die falsche Fassung gebucht — synchronisiert statt OmU. — You booked the dubbed version by mistake."
        options:
          - { key: a, text: "Trotzdem reingehen." }
          - { key: b, text: "An der Kasse fragen, ob ein Umtausch auf die 20:15-Vorstellung möglich ist." }
          - { key: c, text: "Die Karte wegwerfen." }
        answer: b
        why: "Vor Beginn ist ein Tausch auf eine spätere Vorstellung meistens kein Problem — fragen kostet nichts."
      - q: "Der Ton fällt nach zehn Minuten aus. — The sound fails after ten minutes."
        options:
          - { key: a, text: "Warten." }
          - { key: b, text: "Laut rufen." }
          - { key: c, text: "Rausgehen und es an der Kasse melden — je früher, desto eher wird neu gestartet." }
        answer: c
        why: "Das Kino merkt es oft nicht sofort; wer Bescheid sagt, bekommt eher einen Neustart oder einen Gutschein."
      - q: "Die Bitte um Ruhe wird ignoriert. — Your request for quiet is ignored."
        options:
          - { key: a, text: "Lauter werden." }
          - { key: b, text: "Kurz rausgehen und dem Personal Bescheid geben." }
          - { key: c, text: "Den Abend abschreiben." }
        answer: b
        why: "Beim zweiten Mal ist es Sache des Personals — ein Streit im Saal stört alle anderen zusätzlich."
      - q: "Du kommst zwanzig Minuten zu spät. — You arrive twenty minutes late."
        options:
          - { key: a, text: "Leise reingehen, hinten stehen bleiben, bis die Augen sich gewöhnt haben, dann zum Platz." }
          - { key: b, text: "Mit dem Handy leuchten." }
          - { key: c, text: "Auf einem freien Platz vorn sitzen bleiben." }
        answer: a
        why: "Handylicht im dunklen Saal stört am meisten; kurz warten löst das Problem von selbst."
      - q: "Ihr seid uneinig über den Film. — You disagree about the film."
        options:
          - { key: a, text: "Du hast keinen Geschmack." }
          - { key: b, text: "Ich fand ihn zu lang — aber die Musik gebe ich dir, die war stark." }
          - { key: c, text: "Egal." }
        answer: b
        why: "Widersprechen und trotzdem etwas zugeben — so bleibt es ein Gespräch."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich will die {1} mit Untertiteln sehen. (nicht die deutsche Fassung)
      2. Die {2} um 20:15 ist noch frei. (der einzelne Termin im Kino)
      3. Mit Studentenausweis gibt es eine {3}. (billiger)
      4. Ab 150 Minuten kommt ein {4} dazu. (Aufpreis für lange Filme)
      5. Vor dem Film läuft 15 Minuten {5}. (Reklame)
      6. Ich glaube, das ist mein {6} — Reihe 9. (Sitzplatz)
    answers:
      "1": Originalfassung
      "2": Vorstellung
      "3": Ermäßigung
      "4": Überlängenzuschlag
      "5": Werbung
      "6": Platz

