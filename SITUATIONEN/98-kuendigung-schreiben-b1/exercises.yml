    block: A
    type: categorize
    title: "Schreiben, übergeben oder abschließen?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: schreiben, label: "Schreiben" }
      - { key: uebergeben, label: "Übergeben" }
      - { key: abschliessen, label: "Abschließen" }
    tokens:
      - { text: "die Kündigung formulieren", bucket: schreiben }
      - { text: "die Kündigungsfrist beachten", bucket: schreiben }
      - { text: "das Datum korrekt angeben", bucket: schreiben }
      - { text: "die Kündigung unterschreiben", bucket: schreiben }
      - { text: "die Kündigung persönlich abgeben", bucket: uebergeben }
      - { text: "eine Kündigungsbestätigung verlangen", bucket: uebergeben }
      - { text: "den Nachfolger einarbeiten", bucket: uebergeben }
      - { text: "die Übergabe dokumentieren", bucket: uebergeben }
      - { text: "den Resturlaub nehmen", bucket: abschliessen }
      - { text: "ein Arbeitszeugnis anfordern", bucket: abschliessen }
      - { text: "die Firmensachen zurückgeben", bucket: abschliessen }
      - { text: "sich von den Kollegen verabschieden", bucket: abschliessen }

  - id: A2
    block: A
