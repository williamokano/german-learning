lesson: "SIT/98-kuendigung-schreiben-b1"
title: "Kündigung schreiben — B1"
topic: "Kündigung schreiben"
category: "Arbeit & Studium"
level: B1
summary: "Eine Kündigung schriftlich einreichen, die Kündigungsfrist und den letzten Arbeitstag klären und die Übergabe planen — und was tun, wenn der Erhalt nicht bestätigt wird oder die Frist falsch berechnet wurde."
intro: >
  Eine Kündigung schreiben heißt mehr als nur ein Datum unter einen
  Brief setzen: die Kündigungsfrist beachten, die Kündigung
  persönlich übergeben und am Ende Resturlaub, Arbeitszeugnis und
  Übergabe klären. Dieses Set übt genau das — schreiben, übergeben,
  abschließen, und was zu tun ist, wenn der Erhalt nicht bestätigt
  wird oder die Frist falsch berechnet wurde. Grammatik nach Bedarf:
  Modalverben, Perfekt und Futur I. Blocks: A Wortschatz & Redemittel
  → B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

