lesson: "SIT/24-in-der-apotheke-a2"
title: "In der Apotheke — A2"
topic: "In der Apotheke"
category: "Sport & Gesundheit"
level: A2
summary: "Rezept einlösen, sich ohne Rezept beraten lassen, die Dosierung verstehen und fragen, wenn etwas nicht da ist."
intro: >
  Die Apotheke ist der Ort, an dem du am schnellsten Deutsch brauchst,
  wenn es dir schlecht geht. Dabei sind es immer dieselben Gespräche:
  Du löst ein Rezept ein und zahlst die Zuzahlung. Du beschreibst
  Beschwerden und lässt dich zu einem rezeptfreien Mittel beraten. Du
  fragst nach, wie oft und wie lange du etwas nehmen sollst. Und
  manchmal ist das Medikament nicht lieferbar, dann geht es um ein
  anderes Präparat oder um Bestellen und Abholen. Grammatik nach
  Bedarf: Beschwerden mit Dativ (mir tut … weh), Mengen und Zeitangaben,
  Modalverben und höfliche Fragen. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Form, Beschwerde oder Papier?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: form, label: "Darreichungsform" }
      - { key: beschwerde, label: "Beschwerden" }
      - { key: papier, label: "Papier & Kasse" }
    tokens:
      - { text: "die Tablette", bucket: form }
      - { text: "die Halsschmerzen", bucket: beschwerde }
      - { text: "das Rezept", bucket: papier }
      - { text: "der Hustensaft", bucket: form }
      - { text: "der Ausschlag", bucket: beschwerde }
      - { text: "die Zuzahlung", bucket: papier }
      - { text: "die Salbe", bucket: form }
      - { text: "das Fieber", bucket: beschwerde }
      - { text: "die Versichertenkarte", bucket: papier }
      - { text: "das Nasenspray", bucket: form }
      - { text: "der Durchfall", bucket: beschwerde }
      - { text: "der Beipackzettel", bucket: papier }

  - id: A2
    block: A
    type: matching
    title: "Frage und Antwort am Tresen"
    instructions: "Ordne jeder Frage eine passende Antwort zu."
    instructionsEn: "Match each question with a fitting answer."
    left:
      - { key: "1", text: "Haben Sie ein Rezept dabei?" }
      - { key: "2", text: "Wogegen brauchen Sie etwas?" }
      - { key: "3", text: "Nehmen Sie sonst noch Medikamente?" }
      - { key: "4", text: "Vertragen Sie Ibuprofen?" }
      - { key: "5", text: "Darf es die große Packung sein?" }
      - { key: "6", text: "Wie oft soll ich das nehmen?" }
      - { key: "7", text: "Ist das rezeptfrei?" }
      - { key: "8", text: "Wann bekomme ich es?" }
    right:
      - { key: a, text: "Ja, hier, und meine Versichertenkarte." }
      - { key: b, text: "Gegen Halsschmerzen und Husten." }
      - { key: c, text: "Nur eine Tablette gegen Bluthochdruck." }
      - { key: d, text: "Ja, das habe ich schon oft genommen." }
      - { key: e, text: "Nein danke, die kleine reicht." }
      - { key: f, text: "Dreimal täglich, jeweils nach dem Essen." }
      - { key: g, text: "Ja, dafür brauchen Sie kein Rezept." }
      - { key: h, text: "Ich bestelle es, morgen früh ist es da." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Beschwerden beschreiben"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Mir {1} der Hals weh. (wehtun, 3. Person Singular)
      2. Ich habe seit drei Tagen {2}. (Temperatur über 38 Grad)
      3. Meine Nase ist {3}. (man bekommt keine Luft)
      4. Ich habe starke {4}. (der Kopf schmerzt)
      5. Mir ist {5}. (man muss vielleicht brechen)
      6. Ich habe einen {6} am Arm. (rote Stellen auf der Haut)
      7. Ich {7} mich seit gestern schlapp. (fühlen, ich-Form)
      8. Ich habe mich am Fuß {8}. (verletzen, Perfekt-Partizip)
    answers:
      "1": tut
      "2": Fieber
      "3": verstopft
      "4": Kopfschmerzen
      "5": übel
      "6": Ausschlag
      "7": fühle
      "8": verletzt

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Dosierung: wie oft, wie viel, wie lange"
    instructions: "Ergänze die Zeit- oder Mengenangabe."
    instructionsEn: "Fill in the time or quantity expression."
    text: |
      1. Nehmen Sie {1} täglich eine Tablette. (3 ×)
      2. Bitte {2} dem Essen einnehmen. (danach)
      3. Zwischen zwei Tabletten sollten mindestens sechs {3} liegen. (Zeiteinheit)
      4. Nehmen Sie es höchstens drei {4} lang. (Zeiteinheit — kürzer als eine Woche)
      5. Für Kinder {5} 12 Jahren ist es nicht geeignet. (jünger als)
      6. Tragen Sie die Salbe {6} dünn auf. (2 ×)
    answers:
      "1": dreimal
      "2": nach
      "3": Stunden
      "4": Tage
      "5": unter
      "6": zweimal

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Erkältet am Tresen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, was kann ich für Sie tun?
      — Guten Tag. Ich brauche etwas {1} Halsschmerzen und Husten.
      — Seit wann haben Sie die Beschwerden?
      — Seit drei Tagen. Und ich habe leichtes {2}, 38,2.
      — Nehmen Sie sonst noch {3}?
      — Nein, nichts.
      — Dann kann ich Ihnen Lutschtabletten und einen {4} geben.
      Ibuprofen {5} Sie?
      — Ja, das habe ich schon oft genommen.
      — Gut. Nehmen Sie {6} täglich eine Tablette, immer nach dem
      Essen. Und höchstens drei {7} lang.
      — Alles klar. Ist das {8}?
      — Ja, dafür brauchen Sie kein Rezept.
      — Und wenn das Fieber bleibt?
      — Wenn es nach drei Tagen nicht besser wird, gehen Sie bitte zum
      {9}. Lesen Sie auch den {10} — vor allem wegen der
      Nebenwirkungen.
      — Mache ich, danke!
    bank: [GEGEN, FIEBER, MEDIKAMENTE, HUSTENSAFT, VERTRAGEN, DREIMAL, TAGE, REZEPTFREI, ARZT, BEIPACKZETTEL, REZEPT, SALBE, WOCHEN, ZWEIMAL]
    answers:
      "1": GEGEN
      "2": FIEBER
      "3": MEDIKAMENTE
      "4": HUSTENSAFT
      "5": VERTRAGEN
      "6": DREIMAL
      "7": TAGE
      "8": REZEPTFREI
      "9": ARZT
      "10": BEIPACKZETTEL

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du kommst mit einem Rezept vom Arzt. — You come in with a prescription."
        options:
          - { key: a, text: "Guten Tag, ich möchte dieses Rezept einlösen." }
          - { key: b, text: "Hier, bitte." }
          - { key: c, text: "Ich brauche das." }
        answer: a
        why: "„Ein Rezept einlösen“ ist genau das Verb dafür — der Rest des Gesprächs läuft danach von selbst."
      - q: "Du willst etwas ohne Rezept und weißt nicht, was. — You want something without a prescription and don't know what."
        options:
          - { key: a, text: "Was gibt es denn so?" }
          - { key: b, text: "Ich brauche etwas gegen Halsschmerzen — was können Sie mir empfehlen?" }
          - { key: c, text: "Geben Sie mir das Beste." }
        answer: b
        why: "Beschwerde nennen und um eine Empfehlung bitten: dafür ist die Beratung da."
      - q: "Du verstehst die Dosierung nicht ganz. — You don't quite understand the dosage."
        options:
          - { key: a, text: "Okay." }
          - { key: b, text: "Steht ja im Beipackzettel." }
          - { key: c, text: "Entschuldigung, wie oft am Tag soll ich das nehmen — und vor oder nach dem Essen?" }
        answer: c
        why: "Zwei konkrete Fragen statt einer vagen — genau die zwei Dinge, die man zu Hause vergisst."
      - q: "Du nimmst schon ein anderes Medikament. — You're already taking another medicine."
        options:
          - { key: a, text: "Ich nehme schon eine Tablette gegen Bluthochdruck — passt das zusammen?" }
          - { key: b, text: "Ich nehme sonst nichts." }
          - { key: c, text: "Nichts sagen." }
        answer: a
        why: "Wechselwirkungen sind der Hauptgrund für die Frage nach anderen Medikamenten — sag es von dir aus."
      - q: "Die große Packung ist dir zu teuer. — The large pack is too expensive for you."
        options:
          - { key: a, text: "Das ist Wucher." }
          - { key: b, text: "Gibt es das auch in einer kleineren Packung oder als günstigeres Präparat?" }
          - { key: c, text: "Ich kaufe es woanders." }
        answer: b
        why: "Nach Packungsgröße und Alternativpräparat fragen — beides ist völlig üblich."
      - q: "Es ist Sonntag und alles hat zu. — It's Sunday and everything is closed."
        options:
          - { key: a, text: "Bis Montag warten." }
          - { key: b, text: "In die Klinik fahren." }
          - { key: c, text: "Den Notdienst suchen — welche Apotheke heute Notdienst hat, steht online und an jeder Apothekentür." }
        answer: c
        why: "Der Apotheken-Notdienst ist genau dafür da; die Liste hängt an jeder Tür."

  - id: B3
    block: B
    type: order
    title: "Sätze in der Apotheke bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "dieses", "Rezept", "einlösen"]
        answer: [0, 1, 2, 3, 4]
        note: "Modalverb an Position 2, Infinitiv am Ende"
      - tiles: ["Ich", "brauche", "etwas", "gegen", "Halsschmerzen"]
        answer: [0, 1, 2, 3, 4]
        note: "gegen + Akkusativ — die Standardformel für Beschwerden"
      - tiles: ["Mir", "tut", "seit", "drei", "Tagen", "der", "Hals", "weh"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "wehtun mit Dativ: mir — und weh steht am Satzende"
      - tiles: ["Wie", "oft", "soll", "ich", "das", "nehmen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "W-Frage mit Modalverb, Infinitiv am Ende"
      - tiles: ["Nehmen", "Sie", "dreimal", "täglich", "eine", "Tablette"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Sie-Imperativ: Verb zuerst, dann Sie"
      - tiles: ["Passt", "das", "mit", "meinen", "anderen", "Medikamenten", "zusammen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Trennverb zusammen·passen: zusammen am Satzende"

  - id: B4
    block: B
    type: true-false
    title: "Den Beipackzettel lesen"
    instructions: |
      > **Grippal akut 400 mg — Kurzinformation**
      >
      > **Anwendungsgebiete:** leichte bis mäßig starke Schmerzen,
      > Fieber.
      >
      > **Dosierung Erwachsene:** 1 Tablette bis zu **3-mal täglich**,
      > Abstand mindestens **6 Stunden**. Tageshöchstdosis **3
      > Tabletten**.
      >
      > **Nicht anwenden bei:** Kindern **unter 12 Jahren**,
      > Magengeschwür, im **letzten Drittel der Schwangerschaft**.
      >
      > **Einnahme:** mit reichlich Wasser, **nach** einer Mahlzeit.
      >
      > **Ohne ärztlichen Rat nicht länger als 3 Tage** bei Fieber und
      > nicht länger als 4 Tage bei Schmerzen anwenden.
      >
      > **Häufige Nebenwirkungen:** Magenbeschwerden, Übelkeit.
      >
      > Wechselwirkung mit blutverdünnenden Mitteln möglich — bitte
      > Rücksprache halten.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man darf höchstens drei Tabletten am Tag nehmen. — You may take at most three tablets a day."
        answer: true
        why: "„Tageshöchstdosis 3 Tabletten.“"
      - q: "Zwei Tabletten kurz hintereinander sind in Ordnung. — Two tablets in quick succession are fine."
        answer: false
        why: "Der Abstand muss mindestens 6 Stunden betragen."
      - q: "Ein zehnjähriges Kind darf das Mittel nehmen. — A ten-year-old may take this medicine."
        answer: false
        why: "Nicht anwenden bei Kindern unter 12 Jahren."
      - q: "Man nimmt die Tablette am besten auf nüchternen Magen. — It's best taken on an empty stomach."
        answer: false
        why: "„Einnahme … nach einer Mahlzeit.“"
      - q: "Bei Fieber sollte man nach drei Tagen zum Arzt. — With fever you should see a doctor after three days."
        answer: true
        why: "„Ohne ärztlichen Rat nicht länger als 3 Tage bei Fieber.“"
      - q: "Wer Blutverdünner nimmt, sollte vorher fragen. — Anyone on blood thinners should ask first."
        answer: true
        why: "„Wechselwirkung mit blutverdünnenden Mitteln möglich — bitte Rücksprache halten.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es nicht glattgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Das Medikament ist nicht lieferbar. — The medicine is out of stock."
        options:
          - { key: a, text: "Gibt es ein anderes Präparat mit demselben Wirkstoff — oder wann kann ich es abholen?" }
          - { key: b, text: "Dann gehe ich woandershin." }
          - { key: c, text: "Wie kann das sein?" }
        answer: a
        why: "Wirkstoffgleiches Präparat oder Bestellung — das sind genau die zwei möglichen Lösungen."
      - q: "Du hast die Versichertenkarte vergessen. — You forgot your insurance card."
        options:
          - { key: a, text: "Ich habe meine Karte vergessen — kann ich sie nachreichen oder erst mal privat zahlen?" }
          - { key: b, text: "Ich habe sie zu Hause." }
          - { key: c, text: "Geht das auch ohne?" }
        answer: a
        why: "Zwei Lösungen anbieten — nachreichen oder privat zahlen und später abrechnen."
      - q: "Nach zwei Tagen geht es dir schlechter statt besser. — After two days you're worse, not better."
        options:
          - { key: a, text: "Die Dosis erhöhen." }
          - { key: b, text: "Zum Arzt gehen und sagen, was du genommen hast und wie lange." }
          - { key: c, text: "Ein zweites Mittel dazunehmen." }
        answer: b
        why: "Selbst mehr oder etwas dazu nehmen ist der häufigste Fehler; der Arzt braucht dafür deine Angaben."
      - q: "Du verträgst das Mittel nicht — dir wird übel. — You can't tolerate the medicine; you feel sick."
        options:
          - { key: a, text: "Weiter nehmen, das gibt sich." }
          - { key: b, text: "Absetzen und nichts sagen." }
          - { key: c, text: "In die Apotheke zurückgehen: „Mir ist davon übel geworden — gibt es eine Alternative?“" }
        answer: c
        why: "Übelkeit steht als häufige Nebenwirkung im Beipackzettel; die Apotheke kennt die Alternativen."
      - q: "Der Arzt hat auf dem Rezept etwas Unleserliches geschrieben. — The doctor wrote something illegible on the prescription."
        options:
          - { key: a, text: "Selbst raten." }
          - { key: b, text: "Die Apotheke klärt das direkt mit der Praxis — frag, ob sie dort anrufen können." }
          - { key: c, text: "Ein neues Rezept holen." }
        answer: b
        why: "Rückfragen bei der Praxis sind Alltag in der Apotheke und gehen meistens in fünf Minuten."
      - q: "Du sollst 5 € Zuzahlung leisten und weißt nicht, warum. — You're asked for €5 and don't know why."
        options:
          - { key: a, text: "Ich zahle nicht." }
          - { key: b, text: "Darf ich fragen, wofür die 5 € sind? Ist das die gesetzliche Zuzahlung?" }
          - { key: c, text: "Das war letztes Mal nicht so." }
        answer: b
        why: "Freundlich nach dem Grund fragen — meistens ist es die gesetzliche Zuzahlung, manchmal ein Aufpreis."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte dieses Rezept {1}. (gegen Medikament tauschen)
      2. Das Mittel ist zurzeit nicht {2}. (nicht auf Lager)
      3. Gibt es ein Präparat mit demselben {3}? (die wirksame Substanz)
      4. Die gesetzliche {4} beträgt 5 €. (Eigenanteil des Patienten)
      5. Häufige {5} sind Übelkeit und Magenbeschwerden. (unerwünschte Wirkungen)
      6. Am Sonntag hilft der {6}. (Apotheke außerhalb der Öffnungszeiten)
    answers:
      "1": einlösen
      "2": lieferbar
      "3": Wirkstoff
      "4": Zuzahlung
      "5": Nebenwirkungen
      "6": Notdienst

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Ich möchte dieses Rezept {1}. (redeem)
      2. Ich brauche etwas {2} Halsschmerzen. (for / against)
      3. Mir {3} der Kopf weh. (hurts)
      4. Ich habe seit gestern {4}. (a temperature)
      5. Ist das {5}? (available without prescription)
      6. Nehmen Sie {6} täglich eine Tablette. (three times)
      7. Bitte {7} dem Essen einnehmen. (after)
      8. Was können Sie mir {8}? (recommend)
      9. Häufige {9} sind Übelkeit. (side effects)
      10. Das Mittel ist nicht {10}. (in stock)
      11. Die {11} beträgt 5 €. (statutory co-payment)
      12. Am Sonntag hilft der {12}. (emergency pharmacy service)
    answers:
      "1": einlösen
      "2": gegen
      "3": tut
      "4": Fieber
      "5": rezeptfrei
      "6": dreimal
      "7": nach
      "8": empfehlen
      "9": Nebenwirkungen
      "10": lieferbar
      "11": Zuzahlung
      "12": Notdienst

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: zwei Besuche in der Apotheke"
    prompt: "Schreib zwei Gespräche: der erste Besuch und der zweite drei Tage später. Zusammen 16–20 Sätze."
    stimulus: |
      Du bist seit drei Tagen erkältet: Halsschmerzen, Husten, 38,2 °C.
      Du nimmst schon eine Tablette gegen Bluthochdruck. Drei Tage
      später ist das Fieber weg, aber dir wird von den Tabletten übel.

      Besuch 1:
      1. begrüßen und die Beschwerden nennen
      2. sagen, seit wann
      3. das andere Medikament von dir aus erwähnen
      4. nach der Dosierung fragen — wie oft und wann
      5. fragen, ob es rezeptfrei ist
      6. fragen, was du tun sollst, wenn es nicht besser wird

      Besuch 2:
      7. sagen, was besser und was schlechter geworden ist
      8. die Nebenwirkung nennen
      9. nach einer Alternative fragen
      10. dich bedanken und verabschieden
    use:
      - "Sie-Form durchgehend"
      - "`Ich brauche etwas gegen …`"
      - "`Mir tut … weh.` (Dativ)"
      - "`Wie oft soll ich das nehmen?`"
      - "`Passt das mit meinen anderen Medikamenten zusammen?`"
    selfCheck:
      - "Hast du bei `wehtun` den Dativ benutzt (mir, nicht ich)?"
      - "Steht nach `gegen` der Akkusativ?"
      - "Nennst du in Besuch 2 klar, was besser und was schlechter ist?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Besuch 1**

      Ich: Guten Tag. Ich brauche etwas gegen Halsschmerzen und Husten.
      Apothekerin: Seit wann haben Sie die Beschwerden?
      Ich: Seit drei Tagen. Mir tut der Hals weh, und ich habe 38,2 Fieber.
      Apothekerin: Nehmen Sie sonst noch Medikamente?
      Ich: Ja, eine Tablette gegen Bluthochdruck. Passt das zusammen?
      Apothekerin: Das geht, aber nehmen Sie die Schmerztabletten nur kurz. Ich gebe Ihnen Lutschtabletten und einen Hustensaft.
      Ich: Wie oft soll ich die Tabletten nehmen — und vor oder nach dem Essen?
      Apothekerin: Dreimal täglich eine, immer nach dem Essen, mit mindestens sechs Stunden Abstand.
      Ich: Ist das rezeptfrei?
      Apothekerin: Ja, dafür brauchen Sie kein Rezept.
      Ich: Und wenn es nicht besser wird?
      Apothekerin: Wenn das Fieber nach drei Tagen bleibt, gehen Sie bitte zum Arzt.
      Ich: Alles klar, vielen Dank!

      **Besuch 2, drei Tage später**

      Ich: Guten Tag. Das Fieber ist weg, aber mir ist von den Tabletten jedes Mal übel geworden.
      Apothekerin: Das ist eine häufige Nebenwirkung. Haben Sie sie nach dem Essen genommen?
      Ich: Ja, immer. Trotzdem war mir schlecht.
      Apothekerin: Dann setzen Sie sie ab. Gegen die Halsschmerzen bleiben die Lutschtabletten, die sind gut verträglich.
      Ich: Gibt es eine Alternative mit einem anderen Wirkstoff?
      Apothekerin: Ja, Paracetamol wäre eine Möglichkeit — das ist magenfreundlicher.
      Ich: Sehr gut, das nehme ich. Vielen Dank für die Beratung!
      Apothekerin: Gern, gute Besserung!
