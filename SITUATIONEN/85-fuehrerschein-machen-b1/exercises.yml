lesson: "SIT/85-fuehrerschein-machen-b1"
title: "Führerschein machen — B1"
topic: "Führerschein machen"
category: "Unterwegs"
level: B1
summary: "Sich bei der Fahrschule anmelden, Sehtest und Erste-Hilfe-Kurs machen, Fahrstunden nehmen und die Theorie- und die praktische Prüfung bestehen — und was tun, wenn man bei einer Prüfung durchfällt."
intro: >
  Der Weg zum Führerschein hat viele Stationen: sich bei der Fahrschule
  anmelden, den Sehtest und den Erste-Hilfe-Kurs machen, den
  Theorieunterricht besuchen, Fahrstunden nehmen und am Ende zwei
  Prüfungen bestehen. Dieses Set übt genau das — anmelden, üben,
  prüfen, und was zu tun ist, wenn man bei der Theorie- oder der
  praktischen Prüfung durchfällt. Grammatik nach Bedarf: Modalverben,
  Perfekt und Futur I. Blocks: A Wortschatz & Redemittel → B Dialoge →
  C Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

