  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Führerschein planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mich zuerst bei der Fahrschule anmelden. (müssen, ich-Form)
      2. {2} du schon den Sehtest gemacht? (haben, Perfekt)
      3. Für den Führerschein {3} man einen Erste-Hilfe-Kurs. (brauchen, Präsens)
      4. {4} wir heute eine Fahrstunde nehmen? (können, wir-Form)
      5. Der Fahrlehrer {5} mir die Verkehrsschilder erklärt. (haben, Perfekt)
      6. Nächste Woche {6} ich die Theorieprüfung ablegen. (werden, Futur I)
      7. {7} du die praktische Prüfung schon bestanden? (haben, Perfekt)
      8. Ohne Führerschein {8} man in Deutschland nicht Auto fahren. (dürfen, Präsens)
    answers:
      "1": muss
      "2": Hast
      "3": braucht
      "4": Können
      "5": hat
      "6": werde
      "7": Hast
      "8": darf

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte den Führerschein machen und melde mich bei der {1} an. (die Schule, in der man das Autofahren lernt)
      2. Mein {2} zeigt mir, wie man richtig einparkt. (die Person, die das Fahren unterrichtet)
      3. Morgen mache ich den {3}, um zu prüfen, ob ich gut genug sehe. (der Test fürs Sehen)
      4. Im {4} lerne ich, wie man bei einem Unfall hilft. (der Kurs zur Ersten Hilfe)
      5. Die {5} dauert 45 Minuten und kostet ungefähr 50 Euro. (eine einzelne Übungsfahrt)
      6. Zuerst muss ich die {6} bestehen, bevor ich Fahrstunden im Straßenverkehr nehmen darf. (der schriftliche Test zu den Verkehrsregeln)
    answers:
      "1": Fahrschule
      "2": Fahrlehrer
      "3": Sehtest
      "4": Erste-Hilfe-Kurs
      "5": Fahrstunde
      "6": Theorieprüfung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Anmelden, lernen, prüfen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich möchte mich für den Führerschein bei Ihrer {1}
      anmelden.
      — Gerne, haben Sie schon einen {2} gemacht?
      — Nein, noch nicht. Wo kann ich den machen?
      — Beim Augenarzt oder Optiker. Und haben Sie schon einen
      Erste-Hilfe-Kurs besucht?
      — Ja, den habe ich letzte Woche gemacht.
      — Perfekt. Dann brauche ich noch ein {3} und Ihren
      Personalausweis.
      (Theorieunterricht)
      — Wann beginnt der {4}?
      — Nächsten Montag um 18 Uhr. Sie müssen mindestens 14 {5}
      besuchen.
      — Und wie viele Fahrstunden brauche ich, bevor ich die Prüfung
      machen darf?
      — Das ist unterschiedlich, meistens zwischen 15 und 25.
      (nach einigen Wochen)
      — Ich fühle mich bereit für die {6}.
      — Gut, dann {7} ich Ihnen einen Termin beim TÜV.
      — Und wann kann ich die praktische Prüfung machen?
      — Erst nach der bestandenen Theorieprüfung.
      — Wie lange dauert eine einzelne {8}?
      — 45 Minuten.
      — Was kostet eigentlich die ganze {9}?
      — Das hängt von der Anzahl der Fahrstunden ab, aber rechnen Sie
      mit 1500 bis 2500 Euro.
      — Und wann bekomme ich dann endlich meinen {10}?
      — Direkt nach der bestandenen praktischen Prüfung.
    bank: [FAHRSCHULE, THEORIEPRÜFUNG, PASSFOTO, FAHRZEUG, SEHTEST, VERSICHERUNG, THEORIEUNTERRICHT, BUCHE, KENNZEICHEN, FAHRSTUNDE, THEORIESTUNDEN, WERKSTATT, AUSBILDUNG, FÜHRERSCHEIN]
    answers:
      "1": FAHRSCHULE
      "2": SEHTEST
      "3": PASSFOTO
      "4": THEORIEUNTERRICHT
      "5": THEORIESTUNDEN
      "6": THEORIEPRÜFUNG
      "7": BUCHE
      "8": FAHRSTUNDE
      "9": AUSBILDUNG
      "10": FÜHRERSCHEIN

  - id: B2
    block: B
    type: single-choice
    title: "Anmelden und lernen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst wissen, was du brauchst, bevor der Theorieunterricht beginnt. — You want to know what you need before theory class starts."
        options:
          - { key: a, text: "Der Führerschein interessiert mich nicht." }
          - { key: b, text: "Was brauche ich, bevor ich mit dem Theorieunterricht beginnen kann?" }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: b
        why: "Eine direkte Frage klärt, welche Unterlagen und Termine vorher nötig sind."
      - q: "Du willst wissen, wie viele Fehlerpunkte bei der Theorieprüfung erlaubt sind. — You want to know how many error points are allowed on the theory exam."
        options:
          - { key: a, text: "Fehlerpunkte interessieren mich nicht." }
          - { key: b, text: "Ich frage da lieber nicht nach." }
          - { key: c, text: "Wie viele Fehlerpunkte darf ich bei der Theorieprüfung höchstens haben?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig, wie streng die Prüfung bewertet wird."
      - q: "Du willst wissen, wo die praktische Prüfung stattfindet. — You want to know where the practical exam takes place."
        options:
          - { key: a, text: "Wo findet eigentlich die praktische Prüfung statt?" }
          - { key: b, text: "Das ist mir egal, Hauptsache ich bestehe." }
          - { key: c, text: "Prüfungen interessieren mich nicht." }
        answer: a
        why: "Eine direkte Frage klärt, wie die Prüfungssituation genau aussieht."
      - q: "Du bist bei der Theorieprüfung durchgefallen und willst wissen, was jetzt passiert. — You failed the theory exam and want to know what happens now."
        options:
          - { key: a, text: "Prüfungen interessieren mich sowieso nicht mehr." }
          - { key: b, text: "Kann ich die Prüfung nach einer Wartezeit wiederholen?" }
          - { key: c, text: "Dann gebe ich den Führerschein eben auf." }
        answer: b
        why: "Eine ruhige Nachfrage klärt die nächsten Schritte nach einer nicht bestandenen Prüfung."
      - q: "Du willst wissen, wer dich bei der praktischen Prüfung begleitet. — You want to know who accompanies you during the practical exam."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich fahre da lieber ganz allein hin." }
          - { key: c, text: "Wer begleitet mich eigentlich bei der praktischen Prüfung?" }
        answer: c
        why: "Eine direkte Frage klärt, wer während der Fahrt im Auto sitzt."
      - q: "Du willst wissen, wie lange eine Fahrstunde meistens dauert. — You want to know how long a driving lesson usually lasts."
        options:
          - { key: a, text: "Wie lange dauert eine Fahrstunde eigentlich meistens?" }
          - { key: b, text: "Fahrstunden interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine direkte Frage klärt frühzeitig, wie die Fahrstunden zeitlich geplant sind."

  - id: B3
    block: B
    type: order
    title: "Sätze zum Führerschein bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "mich", "bei", "der", "Fahrschule", "anmelden"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "höfliche Aussage, Infinitiv am Ende"
      - tiles: ["Haben", "Sie", "schon", "einen", "Sehtest", "gemacht", "?"]
