        note: "Ja/Nein-Frage im Perfekt"
      - tiles: ["Für", "den", "Führerschein", "braucht", "man", "einen", "Erste-Hilfe-Kurs"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Aussage mit man, Verb an Position 2"
      - tiles: ["Nächste", "Woche", "werde", "ich", "die", "Theorieprüfung", "ablegen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Futur I, Zeitangabe an Position 1, Verb an Position 2"
      - tiles: ["Wie", "viele", "Fehlerpunkte", "darf", "ich", "höchstens", "haben", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "W-Frage mit Modalverb"
      - tiles: ["Ich", "bin", "bei", "der", "ersten", "Prüfung", "durchgefallen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Perfekt mit sein, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Führerschein lesen"
    instructions: |
      > **Info — Führerschein machen**
      >
      > - **Mindestalter:** mit **Begleitetem Fahren** ab **17
      >   Jahren**, ohne Begleitung ab 18 Jahren.
      > - **Voraussetzungen:** vor der Anmeldung braucht man einen
      >   **Sehtest** und einen **Erste-Hilfe-Kurs**.
      > - **Theorieprüfung:** hat **30 Fragen**, bestanden ist man mit
      >   **maximal 10 Fehlerpunkten**.
      > - **Theorieunterricht:** mindestens **14 Theoriestunden** vor
      >   der Prüfung.
      > - **Kosten:** die ganze Ausbildung kostet oft zwischen **1500
      >   und 2500 Euro**.
      > - **Gültigkeit:** der deutsche Führerschein gilt **EU-weit**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man darf den Führerschein mit Begleitetem Fahren schon mit 17 Jahren machen. — You can get a license with accompanied driving already at 17."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Führerschein."
      - q: "Der Erste-Hilfe-Kurs ist erst nach der praktischen Prüfung nötig. — The first aid course is only needed after the practical exam."
        answer: false
        why: "Er ist schon vor der Anmeldung nötig, nicht erst danach."
      - q: "Bei der Theorieprüfung darf man höchstens 10 Fehlerpunkte haben. — On the theory exam you may have at most 10 error points."
        answer: true
        why: "„Theorieprüfung: […] bestanden ist man mit maximal 10 Fehlerpunkten.“"
      - q: "Man braucht keinen Sehtest, wenn man schon eine Brille trägt. — You don't need an eye test if you already wear glasses."
        answer: false
        why: "Der Sehtest ist für alle Pflicht, unabhängig von einer Brille."
      - q: "Die ganze Fahrausbildung kostet in der Regel nur etwa 200 Euro. — The whole driving education usually costs only about 200 euros."
        answer: false
        why: "Sie kostet oft zwischen 1500 und 2500 Euro, nicht nur 200 Euro."
      - q: "Der deutsche Führerschein gilt in der ganzen EU. — The German driver's license is valid across the whole EU."
        answer: true
        why: "„Gültigkeit: der deutsche Führerschein gilt EU-weit.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Führerschein etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du bist bei der Theorieprüfung durchgefallen. — You failed the theory exam."
        options:
          - { key: a, text: "Man verliert automatisch alle bisherigen Fahrstunden." }
          - { key: b, text: "Man kann die Prüfung nach einer Wartezeit erneut ablegen." }
          - { key: c, text: "Man muss von vorne mit dem Sehtest beginnen." }
        answer: b
        why: "Eine nicht bestandene Theorieprüfung kann nach einer Wartezeit wiederholt werden."
      - q: "Bei der praktischen Prüfung machst du einen schweren Fehler und fällst durch. — You make a serious mistake during the practical exam and fail."
        options:
          - { key: a, text: "Der Führerschein wird trotzdem ausgestellt." }
          - { key: b, text: "Man darf es nie wieder versuchen." }
          - { key: c, text: "Man muss weitere Fahrstunden nehmen und die Prüfung wiederholen." }
        answer: c
        why: "Nach einer nicht bestandenen praktischen Prüfung übt man weiter und wiederholt sie."
      - q: "Du bestehst den Sehtest ohne Brille nicht. — You don't pass the eye test without glasses."
        options:
          - { key: a, text: "Eine Brille oder Kontaktlinsen tragen und den Test wiederholen." }
          - { key: b, text: "Den Führerschein trotzdem ohne Sehtest beantragen." }
          - { key: c, text: "Auf den Führerschein ganz verzichten." }
        answer: a
        why: "Mit Sehhilfe kann der Sehtest problemlos wiederholt und bestanden werden."
      - q: "Du wirst krank und kannst eine geplante Fahrstunde nicht wahrnehmen. — You get sick and can't make a scheduled driving lesson."
        options:
          - { key: a, text: "Einfach nicht erscheinen, ohne Bescheid zu geben." }
          - { key: b, text: "Rechtzeitig bei der Fahrschule absagen." }
          - { key: c, text: "Die Fahrstunde von einer Freundin machen lassen." }
        answer: b
        why: "Eine rechtzeitige Absage vermeidet unnötige Kosten und Missverständnisse."
      - q: "Du verpasst aus Versehen den Termin für die Theorieprüfung. — You accidentally miss the appointment for the theory exam."
        options:
          - { key: a, text: "Die Anmeldung bei der Fahrschule komplett neu machen." }
          - { key: b, text: "Ein Jahr warten, bevor man es erneut versuchen darf." }
          - { key: c, text: "Einen neuen Termin vereinbaren und eventuell eine Gebühr zahlen." }
        answer: c
        why: "Ein verpasster Termin lässt sich meist gegen eine Gebühr neu vereinbaren."
      - q: "Du verlierst deinen frisch ausgestellten Führerschein. — You lose your freshly issued driver's license."
        options:
          - { key: a, text: "Den Verlust bei der Führerscheinstelle melden und einen Ersatz beantragen." }
          - { key: b, text: "Einfach ohne Führerschein weiterfahren." }
          - { key: c, text: "Eine neue Theorieprüfung ablegen." }
        answer: a
        why: "Nur eine Meldung bei der Führerscheinstelle ermöglicht einen offiziellen Ersatz."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich bin bei der Theorieprüfung leider {1}. (nicht bestanden, Partizip)
      2. Bei der praktischen Prüfung habe ich einen Fehler {2}. (verursacht, Partizip)
      3. Ohne Brille habe ich den Sehtest nicht {3}. (geschafft, Partizip)
      4. Die Fahrstunde habe ich rechtzeitig {4}. (storniert, Partizip)
      5. Den Termin beim TÜV habe ich aus Versehen {5}. (nicht wahrgenommen, Partizip)
      6. Meinen Führerschein habe ich leider {6}. (nicht mehr gefunden, Partizip)
    answers:
      "1": durchgefallen
      "2": gemacht
      "3": bestanden
      "4": abgesagt
      "5": verpasst
      "6": verloren

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Ich {1} mich zuerst bei der Fahrschule anmelden. (must)
      2. Ich brauche einen {2}, bevor ich die Theorieprüfung mache. (eye test)
      3. Vor der Anmeldung besuche ich einen {3}. (first aid course)
      4. Mein {4} zeigt mir, wie man einparkt. (driving instructor)
      5. Die {5} dauert meistens 45 Minuten. (driving lesson)
      6. Ich lerne die Verkehrsschilder im {6}. (theory class)
      7. Bei der {7} darf ich höchstens 10 Fehlerpunkte haben. (theory exam)
      8. Nach dem Theorieunterricht {8} ich viele Fahrstunden. (need — Präsens)
      9. Die {9} findet im echten Straßenverkehr statt. (practical exam)
      10. Ich bin bei der ersten Prüfung leider {10}. (failed — Partizip)
      11. Beim zweiten Versuch habe ich sie {11}. (passed — Partizip)
      12. Endlich bekomme ich meinen {12}. (driver's license)
      13. Der Führerschein {13} in der ganzen EU. (is valid — gelten, Präsens)
      14. Die ganze {14} kostet oft über 1500 Euro. (training)
    answers:
      "1": muss
      "2": Sehtest
      "3": Erste-Hilfe-Kurs
      "4": Fahrlehrer
      "5": Fahrstunde
      "6": Theorieunterricht
      "7": Theorieprüfung
      "8": brauche
      "9": praktische Prüfung
      "10": durchgefallen
      "11": bestanden
      "12": Führerschein
      "13": gilt
      "14": Ausbildung

  - id: D2
    block: D
    type: free-write
    title: "Anmelden, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: sich bei der Fahrschule anmelden und die ersten Fahrstunden nehmen, ein Problem, weil du bei der Theorieprüfung durchfällst, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du meldest dich bei einer Fahrschule an, machst den Sehtest und
      den Erste-Hilfe-Kurs und nimmst Fahrstunden. Überraschend fällst
      du bei der ersten Theorieprüfung durch.

      Bei der Anmeldung müssen vorkommen:
      1. sich bei der Fahrschule anmelden
      2. den Sehtest machen
      3. den Erste-Hilfe-Kurs besuchen

      Beim Problem müssen vorkommen:
      4. bei der Theorieprüfung durchfallen
      5. sich über das Ergebnis ärgern
      6. den Fahrlehrer um Rat fragen

      In der Lösung müssen vorkommen:
      7. noch einmal für die Theorieprüfung lernen
      8. die Theorieprüfung bestehen
      9. die praktische Prüfung machen
      10. den Führerschein bekommen
    use:
      - "höfliche Frage: „Können Sie mir noch ein paar Tipps geben?“"
      - "Perfekt: „Ich bin leider durchgefallen.“"
      - "Futur I: „Nächste Woche werde ich die Prüfung wiederholen.“"
    selfCheck:
      - "Wird die Anmeldung klar beschrieben?"
      - "Klingt die Reaktion auf das Durchfallen realistisch?"
      - "Wird die bestandene Prüfung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Anmelden**

      Ich: Guten Tag, ich möchte mich für den Führerschein anmelden.
      Fahrschule: Gerne, haben Sie schon einen Sehtest gemacht?
      Ich: Ja, und den Erste-Hilfe-Kurs habe ich auch schon besucht.

      **Das Problem**

      (nach der Theorieprüfung)
      Ich: Ich bin leider durchgefallen, das ärgert mich sehr.
      Fahrlehrer: Das ist nicht schlimm, viele fallen beim ersten Mal durch.
      Ich: Können Sie mir noch ein paar Tipps geben?

      **Die Lösung**

