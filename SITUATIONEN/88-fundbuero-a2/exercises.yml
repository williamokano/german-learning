lesson: "SIT/88-fundbuero-a2"
title: "Fundbüro — A2"
topic: "Fundbüro"
category: "Wenn etwas schiefgeht"
level: A2
summary: "Einen verlorenen Gegenstand beim Fundbüro melden, ihn genau beschreiben, eine Verlustanzeige ausfüllen und ihn später mit Ausweis und Abholschein abholen — und was tun, wenn er noch nicht gefunden wurde."
intro: >
  Wer im Zug oder Bus etwas verliert, landet oft beim Fundbüro: den
  Verlust melden, den Gegenstand genau beschreiben, eine
  Verlustanzeige ausfüllen und später mit Ausweis und Abholschein
  abholen. Dieses Set übt genau das — melden, beschreiben, abholen,
  und was zu tun ist, wenn der Gegenstand noch nicht gefunden wurde.
  Grammatik nach Bedarf: Modalverben, Perfekt und Futur I. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

