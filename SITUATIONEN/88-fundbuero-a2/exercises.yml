      - { text: "besondere Merkmale erwähnen", bucket: beschreiben }
      - { text: "ein Foto zeigen", bucket: beschreiben }
      - { text: "einen Abholschein bekommen", bucket: abholen }
      - { text: "die Fundsache abholen", bucket: abholen }
      - { text: "die Aufbewahrungsfrist beachten", bucket: abholen }
      - { text: "eine Gebühr bezahlen", bucket: abholen }

