    instructionsEn: "Fill in the verb in the perfect tense."
    text: |
      1. Ich {1} letzte Woche krank {2}. (sein)
      2. Wir {3} Kapitel drei {4}. (durchnehmen)
      3. Der Dozent {5} die Folien schon hochgeladen. (haben — Hilfsverb)
      4. {6} du zur Übung {7}? (gehen)
