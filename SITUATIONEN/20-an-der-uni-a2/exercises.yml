  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Bitten und Vorschläge"
    instructions: "Ergänze das Modalverb oder die Form."
    instructionsEn: "Fill in the modal verb or the form."
    text: |
      1. {1} du mir kurz deine Notizen schicken? (können, du-Form)
      2. {2} wir zusammen für die Klausur lernen? (wollen, wir-Form)
      3. {3} ich mich hier hinsetzen? (dürfen, ich-Form)
      4. Wir {4} das Referat bis Freitag fertig haben. (müssen, wir-Form)
      5. {5} du morgen mitkommen? (mögen im Konjunktiv: höfliches Angebot)
      6. Ich {6} gern in deine Lerngruppe kommen. (würden, ich-Form)
    answers:
