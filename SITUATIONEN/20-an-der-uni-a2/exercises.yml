lesson: "SIT/20-an-der-uni-a2"
title: "An der Uni: Alltagsgespräche — A2"
topic: "Uni-Alltag"
category: "Arbeit & Studium"
level: A2
summary: "Ist der Platz frei, in welchem Raum, was war letzte Woche dran, leihst du mir deine Notizen — die kurzen Gespräche zwischen den Veranstaltungen."
intro: >
  Nicht die Immatrikulation und nicht die Prüfungsordnung: die Gespräche
  auf dem Flur, im Seminarraum und in der Mensa. Ist der Platz noch
  frei? In welchem Raum ist die Vorlesung? Ich war letzte Woche krank —
  was habt ihr gemacht? Kannst du mir deine Notizen schicken? Wollen wir
  zusammen für die Klausur lernen? Dazu die Momente, in denen es
  klemmt: du hast eine Abgabe verpasst, du verstehst die Aufgabe nicht,
  in der Gruppe macht einer nichts. Grammatik nach Bedarf: du-Form,
  Perfekt für das, was passiert ist, Modalverben für Bitten und
  Vorschläge. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

