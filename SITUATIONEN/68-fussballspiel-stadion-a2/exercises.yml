lesson: "SIT/68-fussballspiel-stadion-a2"
title: "Ein Fußballspiel im Stadion — A2"
topic: "Ein Fußballspiel im Stadion"
category: "Freizeit & Kultur"
level: A2
summary: "Tickets kaufen, zwischen Stehplatz und Sitzplatz wählen, die Mannschaft anfeuern — und was tun, wenn das Ticket beim Einlass nicht funktioniert oder der Platz besetzt ist."
intro: >
  Ein Stadionbesuch braucht ein bisschen Planung: rechtzeitig Tickets
  kaufen, die Anstoßzeit im Blick behalten, sich für Stehplatz oder
  Sitzplatz entscheiden — und ruhig bleiben, falls das Ticket beim
  Einlass mal nicht funktioniert. Dieses Set übt genau das: Tickets
  besorgen, durch die Einlasskontrolle gehen, die Mannschaft anfeuern,
  und was zu tun ist, wenn beim Stadionbesuch etwas schiefgeht.
  Grammatik nach Bedarf: Perfekt im Bericht, höfliche Fragen,
  Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Vor dem Spiel, im Stadion oder danach?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: vorher, label: "Vor dem Spiel" }
      - { key: stadion, label: "Im Stadion" }
      - { key: danach, label: "Nach dem Spiel" }
    tokens:
      - { text: "Tickets online kaufen", bucket: vorher }
      - { text: "die Anstoßzeit prüfen", bucket: vorher }
      - { text: "einen Fanschal kaufen", bucket: vorher }
      - { text: "sich mit Freunden treffen", bucket: vorher }
      - { text: "durch die Einlasskontrolle gehen", bucket: stadion }
      - { text: "den eigenen Platz suchen", bucket: stadion }
      - { text: "die Mannschaft anfeuern", bucket: stadion }
      - { text: "ein Tor bejubeln", bucket: stadion }
      - { text: "das Stadion verlassen", bucket: danach }
      - { text: "über das Ergebnis diskutieren", bucket: danach }
      - { text: "nach Hause fahren", bucket: danach }
      - { text: "das nächste Spiel planen", bucket: danach }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "der Fanblock" }
      - { key: "2", text: "die Anstoßzeit" }
      - { key: "3", text: "der Stehplatz" }
      - { key: "4", text: "anfeuern" }
      - { key: "5", text: "ein Tor schießen" }
      - { key: "6", text: "die Halbzeitpause" }
      - { key: "7", text: "das Unentschieden" }
      - { key: "8", text: "die Einlasskontrolle" }
    right:
      - { key: a, text: "der Bereich im Stadion für die Fans einer Mannschaft" }
      - { key: b, text: "der Zeitpunkt, zu dem das Spiel beginnt" }
      - { key: c, text: "der Platz im Stadion ohne Sitzgelegenheit" }
      - { key: d, text: "die eigene Mannschaft laut unterstützen" }
      - { key: e, text: "einen Treffer erzielen" }
      - { key: f, text: "die Pause zwischen den beiden Spielhälften" }
      - { key: g, text: "ein Ergebnis ohne Sieger" }
      - { key: h, text: "die Sicherheitskontrolle am Stadioneingang" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Stadionbesuch planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Wir {1} die Tickets rechtzeitig kaufen. (Modalverb, wir-Form)
      2. {2} du mir sagen, wann die Anstoßzeit ist? (können, du-Form)
      3. Ich {3} schon die Tickets bestellt. (haben, Perfekt)
      4. {4} wir Stehplätze oder Sitzplätze nehmen? (sollen, wir-Form)
      5. Falls unsere Mannschaft ein Tor {5}, jubeln alle. (schießen, Präsens)
      6. Der Fanblock {6} die Mannschaft die ganze Zeit anfeuern. (werden, Futur I)
      7. Wir {7} schon ein Tor bejubelt. (haben, Perfekt)
      8. {8} ich meinen Fanschal mitnehmen? (sollen, ich-Form)
    answers:
      "1": müssen
      "2": Kannst
      "3": habe
      "4": Sollen
      "5": schießt
      "6": wird
      "7": haben
      "8": Soll

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Unsere Plätze sind mitten im {1}. (der Bereich für Fans einer Mannschaft)
      2. Die {2} ist um 15:30 Uhr. (der Zeitpunkt, zu dem das Spiel beginnt)
      3. Wir haben {3} gekauft, die sind günstiger als Sitzplätze. (Plätze ohne Sitzgelegenheit)
      4. Während der {4} kaufen wir uns etwas zu essen. (die Pause zwischen den Spielhälften)
      5. Nach neunzig Minuten endete das Spiel mit einem {5}. (ein Ergebnis ohne Sieger)
      6. Vor dem Stadion gibt es eine strenge {6}. (die Sicherheitskontrolle am Eingang)
    answers:
      "1": Fanblock
      "2": Anstoßzeit
      "3": Stehplätze
      "4": Halbzeitpause
      "5": Unentschieden
      "6": Einlasskontrolle

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Tickets besorgen und im Stadion"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hey, hast du schon {1} für das Spiel am Samstag?
      — Noch nicht, wann ist eigentlich die {2}?
      — Um 15:30 Uhr. Wollen wir {3} oder Sitzplätze nehmen?
      — Stehplätze, das ist im {4} viel lauter!
      (am Stadion)
      — Zeig mal deine Karte, wir müssen durch die {5}.
      — Kein Problem, ich habe alles dabei.
      — Schau, unsere Mannschaft {6} gerade ein Tor!
      — Ja! Jetzt müssen wir sie richtig {7}!
      — In der {8} holen wir uns noch was zu essen.
      — Gute Idee. Am Ende steht es leider {9} — schade.
      — Macht nichts, das nächste Spiel {10} bestimmt besser.
    bank: [TICKETS, ANSTOSSZEIT, STEHPLÄTZE, FANBLOCK, EINLASSKONTROLLE, SCHIESST, ANFEUERN, HALBZEITPAUSE, UNENTSCHIEDEN, WIRD, SCHIEDSRICHTER, VERLÄNGERUNG, TRIKOT, ELFMETER]
    answers:
      "1": TICKETS
      "2": ANSTOSSZEIT
      "3": STEHPLÄTZE
      "4": FANBLOCK
      "5": EINLASSKONTROLLE
      "6": SCHIESST
      "7": ANFEUERN
      "8": HALBZEITPAUSE
      "9": UNENTSCHIEDEN
      "10": WIRD

  - id: B2
    block: B
    type: single-choice
    title: "Tickets und Plätze"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest wissen, ob dein Freund schon Tickets hat. — You want to know whether your friend already has tickets."
        options:
          - { key: a, text: "Tickets interessieren mich nicht." }
          - { key: b, text: "Hast du schon Tickets für das Spiel am Samstag?" }
          - { key: c, text: "Ich gehe sowieso nie ins Stadion." }
        answer: b
        why: "Eine direkte Frage klärt sofort, ob schon Tickets vorhanden sind."
      - q: "Du möchtest wissen, wann die Anstoßzeit ist. — You want to know the kickoff time."
        options:
          - { key: a, text: "Zeiten sind mir egal." }
          - { key: b, text: "Ich komme, wann ich will." }
          - { key: c, text: "Wann ist eigentlich die Anstoßzeit?" }
        answer: c
        why: "Eine konkrete Frage zur Anstoßzeit hilft bei der Planung."
      - q: "Du möchtest zwischen Stehplätzen und Sitzplätzen wählen. — You want to choose between standing and seated tickets."
        options:
          - { key: a, text: "Wollen wir Stehplätze oder Sitzplätze nehmen?" }
          - { key: b, text: "Plätze sind mir alle gleich." }
          - { key: c, text: "Ich setze mich einfach irgendwohin." }
        answer: a
        why: "Eine klare Frage klärt frühzeitig die Wahl der Plätze."
      - q: "Am Eingang wirst du zur Einlasskontrolle gebeten. — You're asked to go through the entry check."
        options:
          - { key: a, text: "Ich zeige meine Karte nicht." }
          - { key: b, text: "Kein Problem, ich habe alles dabei." }
          - { key: c, text: "Kontrollen interessieren mich nicht." }
        answer: b
        why: "Eine kooperative Antwort macht den Einlass schnell und unkompliziert."
      - q: "Deine Mannschaft schießt ein Tor. — Your team scores a goal."
        options:
          - { key: a, text: "Tore sind mir egal." }
          - { key: b, text: "Ich klatsche vielleicht kurz." }
          - { key: c, text: "Jetzt müssen wir sie richtig anfeuern!" }
        answer: c
        why: "Ein Tor ist der perfekte Moment, die Mannschaft laut anzufeuern."
      - q: "Das Spiel endet unentschieden. — The game ends in a draw."
        options:
          - { key: a, text: "Macht nichts, das nächste Spiel wird bestimmt besser." }
          - { key: b, text: "Unentschieden ist das Schlimmste, was es gibt." }
          - { key: c, text: "Dann gehe ich nie wieder ins Stadion." }
        answer: a
        why: "Eine gelassene Reaktion passt besser zu einem normalen Spielergebnis."

  - id: B3
    block: B
    type: order
    title: "Sätze im Stadion bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Hast", "du", "schon", "Tickets", "für", "das", "Spiel", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Ja/Nein-Frage im Perfekt"
      - tiles: ["Wann", "ist", "eigentlich", "die", "Anstoßzeit", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "W-Frage mit sein"
      - tiles: ["Wollen", "wir", "Stehplätze", "oder", "Sitzplätze", "nehmen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Frage mit Modalverb, Infinitiv am Ende"
      - tiles: ["Falls", "unsere", "Mannschaft", "ein", "Tor", "schießt", ",", "jubeln", "alle"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Nebensatz mit falls, Hauptsatz mit Verb an Position 2"
      - tiles: ["Jetzt", "müssen", "wir", "sie", "richtig", "anfeuern"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Hauptsatz mit Modalverb, Infinitiv am Ende"
      - tiles: ["Wir", "haben", "schon", "ein", "Tor", "bejubelt"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Stadion-Infos lesen"
    instructions: |
      > **Info — Stadionbesuch**
      >
      > - **Tickets:** am besten **online im Voraus** kaufen, an der
      >   Tageskasse oft ausverkauft.
      > - **Einlass:** meist **eine Stunde vor Anstoß**,
      >   Taschenkontrolle möglich.
      > - **Getränke und Essen:** eigene Flaschen sind oft **nicht
      >   erlaubt**, im Stadion erhältlich.
      > - **Fanschal und Trikot:** viele kaufen sie **vor dem
      >   Stadion** an Ständen.
      > - **Verlängerung:** gibt es nur bei **Pokalspielen**, nicht
      >   in der regulären Liga.
      > - **Nach dem Spiel:** die Ausgänge können **stark
      >   überfüllt** sein, etwas Geduld einplanen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Tickets sollte man am besten online im Voraus kaufen. — Tickets should best be bought online in advance."
        answer: true
        why: "So steht es ausdrücklich in den Stadion-Infos."
      - q: "Der Einlass beginnt meist erst direkt beim Anstoß. — Entry usually only starts right at kickoff."
        answer: false
        why: "Er beginnt meist schon eine Stunde vor Anstoß, nicht erst dann."
      - q: "Eigene Getränkeflaschen sind im Stadion meist erlaubt. — Bringing your own drink bottles is usually allowed in the stadium."
        answer: false
        why: "Sie sind oft nicht erlaubt, Getränke gibt es im Stadion zu kaufen."
      - q: "Fanschal und Trikot kann man oft vor dem Stadion an Ständen kaufen. — Fan scarves and jerseys can often be bought at stands outside the stadium."
        answer: true
        why: "„Fanschal und Trikot: viele kaufen sie vor dem Stadion an Ständen.“"
      - q: "Eine Verlängerung gibt es auch bei ganz normalen Ligaspielen. — Extra time also happens in ordinary league games."
        answer: false
        why: "Verlängerung gibt es nur bei Pokalspielen, nicht in der regulären Liga."
      - q: "Nach dem Spiel können die Ausgänge stark überfüllt sein. — After the game, the exits can be very crowded."
        answer: true
        why: "„Nach dem Spiel: die Ausgänge können stark überfüllt sein.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Stadionbesuch etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die Tickets sind schon ausverkauft. — The tickets are already sold out."
        options:
          - { key: a, text: "Einfach zu Hause bleiben und nichts unternehmen." }
          - { key: b, text: "Nach einem Wiederverkauf oder einer Warteliste fragen." }
          - { key: c, text: "Ohne Ticket versuchen, sich hineinzuschmuggeln." }
        answer: b
        why: "Ein Wiederverkauf oder eine Warteliste ist der sichere und legale Weg zu einem Ticket."
      - q: "Beim Einlass funktioniert das digitale Ticket nicht. — The digital ticket doesn't work at entry."
        options:
          - { key: a, text: "Einfach umdrehen und nach Hause gehen." }
          - { key: b, text: "Laut schimpfen, ohne dem Personal etwas zu zeigen." }
          - { key: c, text: "Ruhig bleiben und dem Personal das Problem zeigen." }
        answer: c
        why: "Ruhe und ein klarer Hinweis auf das Problem lösen es meist schnell."
      - q: "Der eigene Platz ist bereits von jemand anderem besetzt. — Your own seat is already occupied by someone else."
        options:
          - { key: a, text: "Freundlich das Personal um Klärung bitten." }
          - { key: b, text: "Sich einfach mit der anderen Person streiten." }
          - { key: c, text: "Sich irgendwo anders hinsetzen, ohne zu fragen." }
        answer: a
        why: "Das Personal kann den Platzkonflikt am schnellsten und fairsten klären."
      - q: "Es beginnt während des Spiels stark zu regnen. — It starts raining heavily during the game."
        options:
          - { key: a, text: "Trotzdem ohne Schutz stundenlang im Regen bleiben." }
          - { key: b, text: "Eine Regenjacke anziehen oder sich unterstellen." }
          - { key: c, text: "Sofort das Stadion verlassen, ohne es zu versuchen." }
        answer: b
        why: "Regenjacke oder Unterstellen ist die praktikabelste Lösung, um weiterzuschauen."
      - q: "Man verliert in der Menge kurzzeitig seine Freunde. — You briefly lose your friends in the crowd."
        options:
          - { key: a, text: "Panisch durch die Menge rennen." }
          - { key: b, text: "Einfach allein nach Hause fahren." }
          - { key: c, text: "An einem vereinbarten Treffpunkt warten." }
        answer: c
        why: "Ein vereinbarter Treffpunkt ist der zuverlässigste Weg, sich wiederzufinden."
      - q: "Nach dem Spiel sind alle Ausgänge extrem überfüllt. — After the game, all exits are extremely crowded."
        options:
          - { key: a, text: "Geduldig warten, statt zu drängeln." }
          - { key: b, text: "Sich rücksichtslos nach vorne drängeln." }
          - { key: c, text: "In Panik laut schreien." }
        answer: a
        why: "Geduld ist bei überfüllten Ausgängen die sicherste Reaktion."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die Tickets waren leider schon {1}. (nichts mehr übrig, Partizip)
      2. Das digitale Ticket hat beim Einlass nicht {2}. (nicht richtig gearbeitet)
      3. Der Platz war schon {3}. (von jemandem eingenommen, Partizip)
      4. Wir haben uns bei Regen {4}. (Schutz gesucht, Partizip)
      5. Wir haben unsere Freunde kurz aus den Augen {5}. (nicht mehr gesehen, Partizip)
      6. Am Ausgang haben wir geduldig {6}. (nicht gedrängelt, Partizip)
    answers:
      "1": ausverkauft
      "2": funktioniert
      "3": besetzt
      "4": untergestellt
      "5": verloren
      "6": gewartet

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Wir {1} die Tickets rechtzeitig kaufen. (must)
      2. {2} du mir sagen, wann die Anstoßzeit ist? (could — können)
      3. Ich {3} schon die Tickets bestellt. (have — Perfekt)
      4. Unsere Plätze sind mitten im {4}. (fan section)
      5. Die {5} ist um 15:30 Uhr. (kickoff time)
      6. Wir haben {6} gekauft. (standing spots)
      7. Während der {7} kaufen wir uns etwas zu essen. (halftime break)
      8. Nach neunzig Minuten endete das Spiel mit einem {8}. (draw)
      9. Vor dem Stadion gibt es eine strenge {9}. (entry check)
      10. Die Tickets waren leider schon {10}. (sold out — Partizip)
      11. Das digitale Ticket hat beim Einlass nicht {11}. (worked — Partizip)
      12. Der Platz war schon {12}. (occupied)
      13. Wir haben uns bei Regen {13}. (took shelter — Partizip)
      14. Am Ausgang haben wir geduldig {14}. (waited — Partizip)
    answers:
      "1": müssen
      "2": Könntest
      "3": habe
      "4": Fanblock
      "5": Anstoßzeit
      "6": Stehplätze
      "7": Halbzeitpause
      "8": Unentschieden
      "9": Einlasskontrolle
      "10": ausverkauft
      "11": funktioniert
      "12": besetzt
      "13": untergestellt
      "14": gewartet

  - id: D2
    block: D
    type: free-write
    title: "Planen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: Tickets kaufen und Plätze wählen, ein Problem beim Einlass, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du gehst mit einem Freund zu einem Fußballspiel. Ihr kauft
      Stehplatztickets und trefft euch pünktlich vor dem Stadion. Beim
      Einlass funktioniert dein digitales Ticket plötzlich nicht.

      Beim Planen müssen vorkommen:
      1. nach Tickets für das Spiel fragen
      2. die Anstoßzeit erfragen
      3. sich für Stehplätze entscheiden

      Beim Problem müssen vorkommen:
      4. merken, dass das digitale Ticket nicht funktioniert
      5. ruhig bleiben und dem Personal das Problem zeigen
      6. eine Lösung mit dem Personal finden

      In der Lösung müssen vorkommen:
      7. endlich durch die Einlasskontrolle gehen
      8. die Mannschaft im Fanblock anfeuern
      9. ein Tor gemeinsam bejubeln
      10. sich über den gelungenen Stadionbesuch freuen
    use:
      - "höfliche Frage: „Hast du schon Tickets?“"
      - "Nebensatz mit falls: „Falls unsere Mannschaft ein Tor schießt, …“"
      - "Perfekt: „Wir haben ein Tor bejubelt.“"
    selfCheck:
      - "Wird die Ticketfrage klar gestellt?"
      - "Klingt die Reaktion auf das defekte Ticket ruhig und lösungsorientiert?"
      - "Wird das Anfeuern im Fanblock erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Planen**

      Ich: Hey, hast du schon Tickets für das Spiel am Samstag?
      Freund: Noch nicht, wann ist eigentlich die Anstoßzeit?
      Ich: Um 15:30 Uhr. Wollen wir Stehplätze nehmen?
      Freund: Ja, das ist im Fanblock viel lauter!

      **Das Problem**

      (am Stadion)
      Ich: Moment, mein digitales Ticket funktioniert nicht!
      Freund: Bleib ruhig, zeig es einfach dem Personal.
      Mitarbeiter: Kein Problem, ich prüfe das kurz manuell für Sie.

      **Die Lösung**

      Mitarbeiter: Alles geklärt, Sie können durch.
      Ich: Endlich geschafft! Jetzt müssen wir unsere Mannschaft aber richtig anfeuern.
      Freund: Schau, sie schießt gerade ein Tor!
      Ich: Wir haben es rechtzeitig geschafft — was für ein gelungener Tag!
