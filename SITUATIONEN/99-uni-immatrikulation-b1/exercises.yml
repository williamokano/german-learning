  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Immatrikulation vorbereiten"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mich letzte Woche immatrikuliert. (haben, Perfekt)
      2. {2} Sie mir bitte eine Studienbescheinigung ausstellen? (können, Sie-Form)
      3. Man {3} sich jedes Semester zurückmelden. (müssen, Präsens)
      4. {4} der BAföG-Antrag schon bearbeitet worden? (sein, Perfekt Passiv)
      5. Falls ein Leistungsnachweis {5}, kann ich nicht zur Prüfung zugelassen werden. (fehlen, Präsens)
      6. Das Prüfungsamt {6} mir die Noten rechtzeitig mitteilen. (werden, Futur I)
      7. Ich {7} schon meinen BAföG-Antrag gestellt. (haben, Perfekt)
      8. {8} Sie mir bitte die Prüfungsordnung erklären? (können, Sie-Form)
    answers:
      "1": habe
      "2": Können
      "3": muss
      "4": Ist
      "5": fehlt
      "6": wird
      "7": habe
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Für die {1} brauche ich meinen Schulabschluss. (die offizielle Einschreibung)
      2. Beim {2} melde ich mich für die Prüfung an. (die Stelle für Prüfungsanmeldung)
      3. Ich habe einen {3} gestellt, um mein Studium zu finanzieren. (der Antrag auf staatliche Förderung)
      4. Für die Kindergeldstelle brauche ich eine {4}. (der Nachweis der Einschreibung)
      5. Die {5} für das nächste Semester habe ich schon erledigt. (die Bestätigung für das nächste Semester)
      6. Ich brauche noch einen {6} aus dem letzten Seminar. (der Beleg für eine Studienleistung)
    answers:
      "1": Immatrikulation
      "2": Prüfungsamt
      "3": BAföG-Antrag
      "4": Studienbescheinigung
      "5": Rückmeldung
      "6": Leistungsnachweis

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Einschreiben, prüfen, finanzieren"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (im Studierendensekretariat)
      — Guten Tag, ich möchte mich für das Studium {1}.
      — Gerne, haben Sie schon alle Unterlagen dabei?
      — Ja, hier ist mein Schulabschluss und der Zulassungsbescheid.
      — Perfekt, dann trage ich Sie jetzt ein. Brauchen Sie auch
      eine {2}?
      — Ja, bitte, ich brauche sie für die Kindergeldstelle.
      — Kein Problem, die bekommen Sie gleich.
      (beim Prüfungsamt)
      — Guten Tag, ich möchte mich für die Prüfung in Statistik
      {3}.
      — Gerne. Haben Sie schon alle nötigen {4} eingereicht?
      — Ich glaube schon, aber können Sie das bitte noch einmal
      prüfen?
      — Klar, einen Moment. Ja, es fehlt noch der Nachweis aus dem
      Praktikum.
      — Oh, den reiche ich sofort nach.
      — Gut, dann steht der {5} nichts mehr im Weg.
      (beim BAföG-Amt)
      — Guten Tag, ich möchte einen {6} stellen.
      — Gerne, dafür brauche ich Ihre {7} und die
      Einkommensnachweise Ihrer Eltern.
      — Hier, bitte.
      — Danke, ich {8} Ihren Antrag jetzt.
      — Wie lange dauert die Bearbeitung ungefähr?
      — Meistens vier bis sechs Wochen.
      — Gut zu wissen. Ich {9} mich schon auf die finanzielle
      Unterstützung.
      — Das verstehe ich gut, das Studium ist ja nicht billig. Ich
      {10} Ihnen viel Erfolg im Studium.
    bank: [IMMATRIKULIEREN, STUDIENBESCHEINIGUNG, SEMESTERTICKET, ANMELDEN, RÜCKMELDUNG, LEISTUNGSNACHWEISE, EXMATRIKULATION, PRÜFUNG, BAFÖG-ANTRAG, STUDIENGEBÜHR, KONTOVERBINDUNG, PRÜFE, FREUE, WÜNSCHE]
    answers:
      "1": IMMATRIKULIEREN
      "2": STUDIENBESCHEINIGUNG
      "3": ANMELDEN
      "4": LEISTUNGSNACHWEISE
      "5": PRÜFUNG
      "6": BAFÖG-ANTRAG
      "7": KONTOVERBINDUNG
      "8": PRÜFE
      "9": FREUE
      "10": WÜNSCHE

  - id: B2
    block: B
    type: single-choice
    title: "Einschreiben und anmelden"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst dem Studierendensekretariat sagen, dass du dich für das Studium einschreiben möchtest. — You want to tell the registrar's office you'd like to enroll in the program."
        options:
          - { key: a, text: "Studiengänge interessieren mich nicht." }
          - { key: b, text: "Ich möchte mich für das Studium immatrikulieren." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg bei der Einschreibung."
      - q: "Du willst wissen, wie lange die Bearbeitung deines BAföG-Antrags dauert. — You want to know how long processing your BAföG application takes."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Wie lange dauert die Bearbeitung meines BAföG-Antrags ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig die finanzielle Planung."
      - q: "Du willst dem Prüfungsamt sagen, dass du dich für die Prüfung in Statistik anmelden möchtest. — You want to tell the exam office you'd like to register for the statistics exam."
        options:
          - { key: a, text: "Ich möchte mich für die Prüfung in Statistik anmelden." }
          - { key: b, text: "Prüfungen interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Aussage ist der übliche Einstieg bei der Prüfungsanmeldung."
      - q: "Du willst wissen, ob du auch eine Studienbescheinigung bekommen kannst. — You want to know if you can also get a certificate of enrollment."
        options:
          - { key: a, text: "Bescheinigungen interessieren mich nicht." }
          - { key: b, text: "Kann ich auch eine Studienbescheinigung bekommen?" }
          - { key: c, text: "Das ist mir egal, Hauptsache ich bin eingeschrieben." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig, ob die Bescheinigung mitausgestellt wird."
      - q: "Du willst wissen, ob dir noch ein Leistungsnachweis fehlt. — You want to know if you're still missing a proof of academic performance."
        options:
          - { key: a, text: "Nachweise interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Fehlt mir noch ein Leistungsnachweis?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig, ob die Anmeldung vollständig ist."
      - q: "Du willst dem Prüfungsamt sagen, dass du den fehlenden Nachweis sofort nachreichst. — You want to tell the exam office you'll submit the missing document right away."
        options:
          - { key: a, text: "Den reiche ich sofort nach." }
          - { key: b, text: "Nachweise interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Zusage zeigt, dass die Anmeldung schnell vervollständigt wird."

  - id: B3
    block: B
    type: order
    title: "Sätze zur Immatrikulation bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "mich", "für", "das", "Studium", "immatrikulieren"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "höfliche Aussage, Infinitiv am Ende"
      - tiles: ["Haben", "Sie", "schon", "alle", "Unterlagen", "dabei", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Ja/Nein-Frage im Präsens"
      - tiles: ["Wir", "tragen", "Sie", "jetzt", "ein"]
        answer: [0, 1, 2, 3, 4]
        note: "trennbares Verb, Vorsilbe am Ende"
      - tiles: ["Nächste", "Woche", "werde", "ich", "mich", "zurückmelden"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Futur I, Zeitangabe an Position 1, Verb an Position 2"
      - tiles: ["Wie", "lange", "dauert", "die", "Bearbeitung", "eigentlich", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "W-Frage mit Verb an Position 2"
      - tiles: ["Ich", "habe", "schon", "meinen", "BAföG-Antrag", "gestellt"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur Immatrikulation lesen"
    instructions: |
      > **Info — Uni: Immatrikulation, Prüfungsamt, BAföG**
      >
      > - **Immatrikulation:** braucht meist **Schulabschluss und
      >   Zulassungsbescheid**.
      > - **Rückmeldung:** muss jedes Semester **fristgerecht**
      >   erfolgen, sonst droht die Exmatrikulation.
      > - **BAföG:** wird **abhängig vom Einkommen der Eltern**
      >   geprüft, nicht automatisch gewährt.
      > - **Studienbescheinigung:** wird oft für **Kindergeld oder
      >   Versicherung** gebraucht.
      > - **Leistungsnachweise:** müssen oft **vor der
      >   Prüfungsanmeldung** vollständig vorliegen.
      > - **Prüfungsordnung:** legt die genauen **Regeln für
      >   Prüfungen** im Studiengang fest.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Für die Immatrikulation braucht man meist Schulabschluss und Zulassungsbescheid. — Enrollment usually requires a school diploma and admission letter."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur Immatrikulation."
      - q: "Die Rückmeldung ist freiwillig und hat keine Konsequenzen. — Re-registration is voluntary and has no consequences."
        answer: false
        why: "Sie muss fristgerecht erfolgen, sonst droht die Exmatrikulation."
      - q: "BAföG wird abhängig vom Einkommen der Eltern geprüft, nicht automatisch gewährt. — BAföG is assessed based on the parents' income, not automatically granted."
        answer: true
        why: "„BAföG: wird abhängig vom Einkommen der Eltern geprüft, nicht automatisch gewährt.“"
      - q: "Eine Studienbescheinigung wird nie für Kindergeld oder Versicherung gebraucht. — A certificate of enrollment is never needed for child benefit or insurance."
        answer: false
        why: "Sie wird oft für Kindergeld oder Versicherung gebraucht."
      - q: "Leistungsnachweise müssen oft vor der Prüfungsanmeldung vollständig vorliegen. — Proof of academic performance often has to be complete before exam registration."
        answer: true
        why: "„Leistungsnachweise: müssen oft vor der Prüfungsanmeldung vollständig vorliegen.“"
      - q: "Die Prüfungsordnung hat keinerlei Bedeutung für die Prüfungen im Studiengang. — The examination regulations have no relevance to exams in the program."
        answer: false
        why: "Sie legt die genauen Regeln für Prüfungen im Studiengang fest."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Immatrikulation etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Sie haben die Frist zur Rückmeldung knapp verpasst. — You just barely missed the deadline for re-registration."
        options:
          - { key: a, text: "Einfach nichts tun und hoffen, dass es niemand merkt." }
          - { key: b, text: "Sofort beim Studierendensekretariat nachfragen, ob eine Nachfrist möglich ist." }
          - { key: c, text: "Das Studium komplett abbrechen." }
        answer: b
        why: "Eine schnelle Nachfrage klärt, ob eine Nachfrist noch möglich ist."
      - q: "Kurz vor der Prüfungsanmeldung fehlt Ihnen noch ein Leistungsnachweis. — Right before exam registration, you're still missing a proof of academic performance."
        options:
          - { key: a, text: "Sich für die Prüfung trotzdem einfach anmelden." }
          - { key: b, text: "Die Prüfung ganz auslassen." }
          - { key: c, text: "Den fehlenden Nachweis schnellstmöglich nachreichen." }
        answer: c
        why: "Ein schnelles Nachreichen sichert die Zulassung zur Prüfung."
      - q: "Ihr BAföG-Antrag wird abgelehnt. — Your BAföG application is rejected."
        options:
          - { key: a, text: "Den Ablehnungsgrund prüfen und gegebenenfalls Widerspruch einlegen." }
          - { key: b, text: "Sofort das Studium abbrechen." }
          - { key: c, text: "Den Bescheid einfach ignorieren." }
        answer: a
        why: "Eine Prüfung des Ablehnungsgrunds zeigt, ob ein Widerspruch sinnvoll ist."
      - q: "Ihre Studienbescheinigung wurde mit einem falschen Namen ausgestellt. — Your certificate of enrollment was issued with the wrong name."
        options:
          - { key: a, text: "Die falsche Bescheinigung einfach so verwenden." }
          - { key: b, text: "Beim Studierendensekretariat um eine Korrektur bitten." }
          - { key: c, text: "Sich die Bescheinigung selbst korrigieren." }
        answer: b
        why: "Eine Bitte um Korrektur beim Sekretariat ist der offizielle und richtige Weg."
      - q: "Sie haben aus Versehen einen Prüfungstermin verpasst. — You accidentally missed an exam date."
        options:
          - { key: a, text: "Es einfach so lassen, wie es ist." }
          - { key: b, text: "Sich beim Prüfungsamt beschweren, ohne den Grund zu nennen." }
          - { key: c, text: "Beim Prüfungsamt nach einem Nachholtermin fragen und den Grund erklären." }
        answer: c
        why: "Eine Erklärung mit Nachfrage nach einem Nachholtermin ist der richtige Weg."
      - q: "Sie werden aus Versehen exmatrikuliert. — You're accidentally de-registered."
        options:
          - { key: a, text: "Sofort beim Studierendensekretariat den Fehler klären lassen." }
          - { key: b, text: "Sich ein neues Studium suchen." }
          - { key: c, text: "Es einfach so hinnehmen." }
        answer: a
        why: "Eine sofortige Klärung beim Sekretariat korrigiert den Fehler am schnellsten."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe die Frist zur Rückmeldung leider knapp {1}. (nicht eingehalten, Partizip)
      2. Kurz vor der Anmeldung hat mir noch ein Leistungsnachweis {2}. (nicht vorgelegen, Partizip)
      3. Mein BAföG-Antrag wurde leider {3}. (nicht genehmigt, Partizip)
      4. Meine Studienbescheinigung wurde mit einem falschen Namen {4}. (herausgegeben, Partizip)
      5. Ich habe aus Versehen einen Prüfungstermin {5}. (nicht wahrgenommen, Partizip)
      6. Ich bin aus Versehen {6} worden. (aus der Uni entfernt, Partizip)
    answers:
      "1": versäumt
      "2": gefehlt
      "3": abgelehnt
      "4": ausgestellt
      "5": verpasst
      "6": exmatrikuliert

