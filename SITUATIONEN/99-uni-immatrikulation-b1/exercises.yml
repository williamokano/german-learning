    type: categorize
    title: "Einschreiben, prüfen oder finanzieren?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: einschreiben, label: "Einschreiben" }
      - { key: pruefen, label: "Prüfen" }
      - { key: finanzieren, label: "Finanzieren" }
    tokens:
      - { text: "sich immatrikulieren", bucket: einschreiben }
      - { text: "Unterlagen einreichen", bucket: einschreiben }
      - { text: "die Studienbescheinigung beantragen", bucket: einschreiben }
