lesson: "SIT/99-uni-immatrikulation-b1"
title: "Uni: Immatrikulation, Prüfungsamt, BAföG — B1"
topic: "Uni: Immatrikulation, Prüfungsamt, BAföG"
category: "Arbeit & Studium"
level: B1
summary: "Sich an der Uni immatrikulieren, sich beim Prüfungsamt für Prüfungen anmelden und einen BAföG-Antrag stellen — und was tun, wenn ein Leistungsnachweis fehlt oder die Rückmeldung knapp verpasst wird."
intro: >
  Ein Studium beginnt mit viel Verwaltung: sich immatrikulieren, sich
  beim Prüfungsamt für Prüfungen anmelden und einen BAföG-Antrag
  stellen, um das Studium zu finanzieren. Dieses Set übt genau das —
  einschreiben, prüfen, finanzieren, und was zu tun ist, wenn ein
  Leistungsnachweis fehlt oder die Rückmeldung knapp verpasst wird.
  Grammatik nach Bedarf: Modalverben, Perfekt und Futur I. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

