  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Kontrolle und der Unfall"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Die Polizei {1} mich gestern kontrolliert. (haben, Perfekt)
      2. {2} Sie mir bitte Ihren Führerschein zeigen? (können, Sie-Form)
      3. Man {3} bei einem Unfall immer die Unfallstelle sichern. (sollen, Präsens)
      4. {4} schon ein Unfallbericht ausgefüllt worden? (sein, Perfekt Passiv)
      5. Falls jemand verletzt {5}, muss man sofort die Rettung rufen. (sein, Präsens)
      6. Der Polizist {6} den Alkoholtest gleich hier machen. (werden, Futur I)
      7. Ich {7} schon die Versicherungskarte gezeigt. (haben, Perfekt)
      8. {8} Sie mir bitte die Fahrzeugpapiere zeigen? (können, Sie-Form)
    answers:
      "1": hat
      "2": Können
      "3": soll
      "4": Ist
      "5": ist
      "6": wird
      "7": habe
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Bei einer {1} müssen Sie den Führerschein zeigen. (die Überprüfung durch die Polizei)
      2. Nach dem Unfall habe ich sofort die {2} gesichert. (der Ort des Unfalls)
      3. Ich habe einen {3} für die Versicherung ausgefüllt. (das Protokoll über den Unfall)
      4. Der Polizist wollte einen {4} bei mir machen. (die Prüfung auf Alkohol)
      5. Ich habe das {5} auf die Straße gestellt. (das Warnzeichen)
      6. Bitte zeigen Sie mir Ihre {6}. (der Nachweis über die Kfz-Versicherung)
    answers:
      "1": Verkehrskontrolle
      "2": Unfallstelle
      "3": Unfallbericht
      "4": Alkoholtest
      "5": Warndreieck
      "6": Versicherungskarte

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Kontrolle und Unfall an einem Tag"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (Verkehrskontrolle)
      — Guten Tag, das ist eine {1}. Bitte Ihren Führerschein und
      die {2}.
      — Hier, bitte.
      — Danke. Ich muss auch kurz einen {3} machen, das ist bei uns
      Routine.
      — Kein Problem.
      — Alles in Ordnung, Sie können weiterfahren.
      (kurz danach, ein kleiner Unfall)
      — Oh nein, ich bin gerade in ein anderes Auto gefahren!
      — Bleiben Sie ruhig. Stellen Sie zuerst das {4} auf.
      — Mache ich sofort.
      — Ist jemand verletzt?
      — Nein, zum Glück nicht.
      — Gut, dann {5} wir die Unfallstelle und tauschen die Daten
      aus.
      — Ich zeige Ihnen gleich meine {6}.
      — Danke. Machen wir auch ein paar Fotos für den {7}?
      — Ja, gute Idee.
      — Sollen wir die Polizei {8}?
      — Bei so einem kleinen Schaden ist das nicht unbedingt nötig.
      — Gut, dann {9} wir noch schnell die Kontaktdaten und die
      Adressen.
      — Perfekt. Ich {10} Ihnen dann meinen Versicherungsnachweis
      per E-Mail.
    bank: [VERKEHRSKONTROLLE, FAHRZEUGPAPIERE, GESCHWINDIGKEIT, ALKOHOLTEST, BUSSGELD, WARNDREIECK, SICHERN, VERSICHERUNGSKARTE, ABSCHLEPPWAGEN, UNFALLBERICHT, ZEUGE, RUFEN, NOTIEREN, SCHICKE]
    answers:
      "1": VERKEHRSKONTROLLE
      "2": FAHRZEUGPAPIERE
      "3": ALKOHOLTEST
      "4": WARNDREIECK
      "5": SICHERN
      "6": VERSICHERUNGSKARTE
      "7": UNFALLBERICHT
      "8": RUFEN
      "9": NOTIEREN
      "10": SCHICKE

  - id: B2
    block: B
    type: single-choice
    title: "Kontrolle und Unfall"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Polizei bei der Verkehrskontrolle deinen Führerschein zeigen. — You want to show the police your license during the traffic stop."
        options:
          - { key: a, text: "Führerscheine interessieren mich nicht." }
          - { key: b, text: "Hier ist mein Führerschein, bitte." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare, höfliche Aussage ist der übliche Ablauf bei einer Verkehrskontrolle."
      - q: "Du willst wissen, ob ihr bei dem kleinen Unfall die Polizei rufen müsst. — You want to know if you need to call the police for the small accident."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Müssen wir bei diesem kleinen Schaden die Polizei rufen?" }
        answer: c
        why: "Eine direkte Frage klärt, ob eine polizeiliche Meldung nötig ist."
      - q: "Du willst der anderen Person nach dem Unfall sagen, dass niemand verletzt ist. — You want to tell the other person after the accident that no one is hurt."
        options:
          - { key: a, text: "Zum Glück ist niemand verletzt." }
          - { key: b, text: "Verletzungen interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Aussage beruhigt die Situation nach dem Schreck."
      - q: "Du willst wissen, ob du zuerst das Warndreieck aufstellen sollst. — You want to know if you should put up the warning triangle first."
        options:
          - { key: a, text: "Warndreiecke interessieren mich nicht." }
          - { key: b, text: "Soll ich zuerst das Warndreieck aufstellen?" }
          - { key: c, text: "Das ist mir egal, Hauptsache ich fahre weiter." }
        answer: b
        why: "Eine direkte Frage klärt den sicheren nächsten Schritt."
      - q: "Du willst wissen, ob ihr für den Unfallbericht auch Fotos machen sollt. — You want to know if you should also take photos for the accident report."
        options:
          - { key: a, text: "Fotos interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Sollen wir auch ein paar Fotos für den Unfallbericht machen?" }
        answer: c
        why: "Eine direkte Frage sichert gute Beweise für die Versicherung."
      - q: "Du willst der anderen Person deine Versicherungskarte zeigen. — You want to show the other person your insurance card."
        options:
          - { key: a, text: "Ich zeige Ihnen gleich meine Versicherungskarte." }
          - { key: b, text: "Versicherungen interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Ankündigung erleichtert den geordneten Datenaustausch."

  - id: B3
    block: B
    type: order
    title: "Sätze zur Kontrolle und zum Unfall bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
