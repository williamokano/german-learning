      - { text: "die Polizei rufen", bucket: melden }
      - { text: "einen Unfallbericht ausfüllen", bucket: melden }
      - { text: "Zeugen notieren", bucket: melden }
      - { text: "das Warndreieck aufstellen", bucket: sichern }
