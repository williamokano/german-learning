lesson: "SIT/91-verkehrskontrolle-unfall-b1"
title: "Verkehrskontrolle und Unfall melden — B1"
topic: "Verkehrskontrolle und Unfall melden"
category: "Unterwegs"
level: B1
summary: "Bei einer Verkehrskontrolle Führerschein und Papiere zeigen, nach einem Unfall die Unfallstelle sichern und die Daten austauschen — und was tun, wenn der Führerschein fehlt oder der Unfallgegner nicht mitmacht."
intro: >
  Eine Verkehrskontrolle und ein kleiner Unfall können am selben Tag
  passieren: Führerschein und Fahrzeugpapiere zeigen, vielleicht
  einen Alkoholtest machen, und nach einem Unfall die Unfallstelle
  sichern, Daten austauschen und den Unfallbericht ausfüllen. Dieses
  Set übt genau das — kontrolliert werden, einen Unfall melden, sich
  sichern, und was zu tun ist, wenn der Führerschein fehlt oder der
  Unfallgegner nicht mitmacht. Grammatik nach Bedarf: Modalverben,
  Perfekt und Futur I. Blocks: A Wortschatz & Redemittel → B Dialoge
  → C Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

