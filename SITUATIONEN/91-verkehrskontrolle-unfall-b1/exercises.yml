        note: "Ja/Nein-Frage mit sein"
      - tiles: ["Ich", "habe", "die", "Versicherungskarte", "schon", "gezeigt"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur Kontrolle und zum Unfall lesen"
    instructions: |
      > **Info — Verkehrskontrolle und Unfall melden**
      >
      > - **Verkehrskontrolle:** man muss **Führerschein und
      >   Fahrzeugpapiere** vorzeigen.
      > - **Unfall:** bei Verletzten oder größerem Schaden muss man
      >   **immer die Polizei** rufen.
      > - **Warndreieck:** sollte man bei jedem Unfall **auf der
      >   Straße** aufstellen.
      > - **Alkoholtest:** die Polizei **darf ihn verlangen** bei
      >   einer Verkehrskontrolle.
      > - **Unfallbericht:** hilft der Versicherung, den Schaden
      >   **schneller zu klären**.
      > - **Fotos:** sind bei einem Unfall ein **guter Beweis** für
      >   die Versicherung.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Bei einer Verkehrskontrolle muss man Führerschein und Fahrzeugpapiere vorzeigen. — At a traffic stop you must show your license and vehicle documents."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur Kontrolle."
      - q: "Bei Verletzten muss man die Polizei nicht rufen. — You don't need to call the police when someone is injured."
        answer: false
        why: "Bei Verletzten oder größerem Schaden muss man immer die Polizei rufen."
      - q: "Ein Warndreieck sollte man bei jedem Unfall auf der Straße aufstellen. — A warning triangle should be set up on the road at every accident."
        answer: true
        why: "„Warndreieck: sollte man bei jedem Unfall auf der Straße aufstellen.“"
      - q: "Die Polizei darf bei einer Verkehrskontrolle keinen Alkoholtest verlangen. — The police are not allowed to request a breathalyzer test at a traffic stop."
        answer: false
        why: "Die Polizei darf ihn bei einer Verkehrskontrolle verlangen."
      - q: "Ein Unfallbericht hilft der Versicherung, den Schaden schneller zu klären. — An accident report helps the insurance settle the claim faster."
        answer: true
        why: "„Unfallbericht: hilft der Versicherung, den Schaden schneller zu klären.“"
      - q: "Fotos vom Unfall sind für die Versicherung völlig nutzlos. — Photos of the accident are completely useless for the insurance."
        answer: false
        why: "Fotos sind bei einem Unfall ein guter Beweis für die Versicherung."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Kontrolle oder dem Unfall etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Sie haben Ihren Führerschein bei der Kontrolle vergessen. — You forgot your license for the traffic stop."
        options:
          - { key: a, text: "Einfach weiterfahren, als wäre nichts." }
          - { key: b, text: "Der Polizei ehrlich sagen, dass Sie ihn zu Hause vergessen haben." }
          - { key: c, text: "Einen falschen Ausweis zeigen." }
        answer: b
        why: "Ehrlichkeit ist der einzig sichere Weg, das offen zu klären."
      - q: "Der Unfallgegner weigert sich, seine Daten auszutauschen. — The other driver refuses to exchange their information."
        options:
          - { key: a, text: "Einfach wegfahren." }
          - { key: b, text: "Die Person laut beschimpfen." }
          - { key: c, text: "Die Polizei rufen, damit die Daten offiziell aufgenommen werden." }
        answer: c
        why: "Die Polizei kann die nötigen Daten notfalls offiziell aufnehmen."
      - q: "Der andere Fahrer fährt nach dem Unfall einfach weg. — The other driver simply drives away after the accident."
        options:
          - { key: a, text: "Sich das Kennzeichen merken und sofort die Polizei rufen." }
          - { key: b, text: "Nichts tun und den Schaden selbst bezahlen." }
          - { key: c, text: "Dem Auto gefährlich hinterherfahren." }
        answer: a
        why: "Das Kennzeichen hilft der Polizei, die Fahrerflucht aufzuklären."
      - q: "Der Alkoholtest zeigt einen leicht positiven Wert. — The breathalyzer shows a slightly positive result."
        options:
          - { key: a, text: "Der Polizei widersprechen und den Test verweigern." }
          - { key: b, text: "Ruhig bleiben und die weiteren Anweisungen der Polizei befolgen." }
          - { key: c, text: "Sofort wegfahren." }
        answer: b
        why: "Ruhiges Verhalten ist in dieser Situation der sicherste Weg."
      - q: "Sie sind sich mit dem Unfallgegner über die Schuldfrage nicht einig. — You and the other driver disagree about who's at fault."
        options:
          - { key: a, text: "Sich laut streiten, bis jemand nachgibt." }
          - { key: b, text: "Sofort selbst die volle Schuld übernehmen." }
          - { key: c, text: "Die Situation sachlich dokumentieren und die Versicherungen entscheiden lassen." }
        answer: c
        why: "Eine sachliche Dokumentation überlässt die Klärung den zuständigen Stellen."
      - q: "Ein wichtiger Zeuge verschwindet, bevor Sie seine Daten notieren konnten. — An important witness leaves before you could note their details."
        options:
          - { key: a, text: "Sich möglichst genau an das Aussehen und die Aussage erinnern und es notieren." }
          - { key: b, text: "Den Vorfall einfach vergessen." }
          - { key: c, text: "Sich einen Zeugen ausdenken." }
        answer: a
        why: "Eine genaue Notiz zur Erinnerung ist besser als gar keine Angabe."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe meinen Führerschein leider zu Hause {1}. (nicht dabei, Partizip)
      2. Der Unfallgegner hat seine Daten nicht {2}. (nicht weitergegeben, Partizip)
      3. Der andere Fahrer ist einfach {3}. (nicht geblieben, Partizip)
      4. Der Alkoholtest ist leicht positiv {4}. (ergeben, Partizip)
      5. Wir haben uns über die Schuldfrage nicht {5}. (nicht übereingekommen, Partizip)
      6. Der Zeuge ist leider schon {6}. (nicht mehr da, Partizip)
    answers:
      "1": vergessen
      "2": ausgetauscht
      "3": weggefahren
      "4": ausgefallen
      "5": geeinigt
      "6": verschwunden

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
