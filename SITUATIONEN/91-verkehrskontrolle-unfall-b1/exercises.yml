  - id: D2
    block: D
    type: free-write
    title: "Kontrolle, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: eine Verkehrskontrolle erleben, ein Problem, weil du kurz danach einen kleinen Unfall hast, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Die Polizei kontrolliert dich auf der Straße. Kurz danach fährst
      du aus Versehen in ein anderes Auto.

      Bei der Kontrolle müssen vorkommen:
      1. den Führerschein zeigen
      2. die Fahrzeugpapiere zeigen
      3. einen Alkoholtest machen

      Beim Problem müssen vorkommen:
      4. in ein anderes Auto fahren
      5. sich sehr erschrecken
      6. das Warndreieck aufstellen

      In der Lösung müssen vorkommen:
      7. die Unfallstelle sichern
      8. die Versicherungskarte zeigen
      9. Fotos machen
      10. die Kontaktdaten austauschen
    use:
      - "höfliche Frage: „Können Sie mir bitte Ihren Führerschein zeigen?“"
      - "Perfekt: „Ich habe das Warndreieck aufgestellt.“"
      - "Futur I: „Ich werde den Unfallbericht morgen abschicken.“"
    selfCheck:
      - "Wird die Kontrolle klar beschrieben?"
      - "Klingt die Reaktion auf den Unfall realistisch?"
      - "Wird der Datenaustausch als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Verkehrskontrolle**

      Polizist: Guten Tag, das ist eine Verkehrskontrolle. Können Sie mir bitte Ihren Führerschein zeigen?
      Ich: Natürlich, hier sind auch gleich die Fahrzeugpapiere.
      Polizist: Danke, ich muss noch kurz einen Alkoholtest machen.
      Ich: Kein Problem.

      **Das Problem**

      Kurz danach fahre ich aus Versehen in ein anderes Auto.
      Ich erschrecke mich sehr, aber ich stelle sofort das Warndreieck auf.

      **Die Lösung**

      Ich sichere die Unfallstelle und zeige der anderen Person meine Versicherungskarte.
      Wir machen ein paar Fotos für den Unfallbericht.
      Wir tauschen die Kontaktdaten aus.
      Ich werde den Unfallbericht morgen abschicken.
