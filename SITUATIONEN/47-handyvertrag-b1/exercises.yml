lesson: "SIT/47-handyvertrag-b1"
title: "Handyvertrag abschließen — B1"
topic: "Handyvertrag abschließen"
category: "Geld & Verträge"
level: B1
summary: "Im Laden den passenden Tarif finden, Laufzeit und Datenvolumen vergleichen, die alte Nummer mitnehmen — und was tun, wenn die Rechnung nicht stimmt."
intro: >
  Ein Handyvertrag klingt nach einer kleinen Entscheidung, hat aber
  viele Details: Datenvolumen, Laufzeit, Kündigungsfrist, und ob die
  alte Nummer mitgenommen werden kann. Dieses Set übt das Gespräch im
  Laden — Tarife vergleichen, Fragen stellen, sich entscheiden — und
  den Alltag danach: eine zu hohe Rechnung, eine verpasste
  Kündigungsfrist, ein Problem mit dem Empfang. Grammatik nach Bedarf:
  Komparativ beim Vergleichen, Nebensätze mit dass/wenn, höfliche
  Bitten mit Konjunktiv II. Blocks: A Wortschatz & Redemittel → B
  Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Tarif, Vertrag oder Nummer?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: tarif, label: "Der Tarif" }
      - { key: vertrag, label: "Der Vertrag" }
      - { key: nummer, label: "Die Nummer" }
    tokens:
      - { text: "das Datenvolumen", bucket: tarif }
      - { text: "die Laufzeit", bucket: vertrag }
      - { text: "die Rufnummernmitnahme", bucket: nummer }
      - { text: "die Flatrate", bucket: tarif }
      - { text: "die Kündigungsfrist", bucket: vertrag }
      - { text: "der alte Anbieter", bucket: nummer }
      - { text: "die monatliche Grundgebühr", bucket: tarif }
      - { text: "unterschreiben", bucket: vertrag }
      - { text: "die Portierung", bucket: nummer }
      - { text: "das Roaming", bucket: tarif }
      - { text: "die Mindestvertragslaufzeit", bucket: vertrag }
      - { text: "die Vorwahl", bucket: nummer }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "der Tarif" }
      - { key: "2", text: "das Datenvolumen" }
      - { key: "3", text: "die Laufzeit" }
      - { key: "4", text: "die Rufnummernmitnahme" }
      - { key: "5", text: "die Kündigungsfrist" }
      - { key: "6", text: "der Anbieter" }
      - { key: "7", text: "die SIM-Karte" }
      - { key: "8", text: "die Grundgebühr" }
    right:
      - { key: a, text: "das Angebot mit bestimmten Leistungen und einem Preis" }
      - { key: b, text: "die Menge an mobilem Internet pro Monat" }
      - { key: c, text: "die Zeit, für die der Vertrag mindestens gilt" }
      - { key: d, text: "die alte Nummer beim neuen Anbieter weiter nutzen" }
      - { key: e, text: "die Zeit, die man vor der Kündigung einhalten muss" }
      - { key: f, text: "die Firma, bei der man den Vertrag hat" }
      - { key: g, text: "die kleine Karte mit der Telefonnummer im Handy" }
      - { key: h, text: "der feste monatliche Preis, unabhängig von der Nutzung" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Tarife vergleichen"
    instructions: "Ergänze die Komparativform."
    instructionsEn: "Fill in the comparative form."
    text: |
      1. Dieser Tarif hat {1} Datenvolumen als der andere. (viel, Komparativ)
      2. Die Laufzeit ist bei diesem Anbieter {2} als bei dem anderen. (kurz, Komparativ)
      3. Ohne Vertragsbindung ist die Kündigungsfrist {3}. (kurz, Superlativ)
      4. Dieser Tarif ist {4} als der mit Gerät. (günstig, Komparativ)
      5. Der Empfang ist hier draußen {5} als in der Stadt. (schlecht, Komparativ)
      6. Von allen drei Anbietern ist dieser der {6}. (gut, Superlativ)
      7. Mit mehr Datenvolumen wird der Tarif natürlich {7}. (teuer, Komparativ)
      8. Die Rufnummernmitnahme dauert oft {8} als gedacht. (lang, Komparativ)
    answers:
      "1": mehr
      "2": kürzer
      "3": am kürzesten
      "4": günstiger
      "5": schlechter
      "6": beste
      "7": teurer
      "8": länger

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Wie viel {1} habe ich pro Monat für mobiles Internet? (die Menge an Daten)
      2. Der Vertrag hat eine {2} von 24 Monaten. (die Mindestzeit)
      3. Ich möchte meine alte Nummer {3}. (beim neuen Anbieter weiterbehalten)
      4. Die {4} beträgt drei Monate zum Vertragsende. (die Zeit vor der Kündigung)
      5. Ohne Gerät zahle ich nur die {5}. (der feste monatliche Preis)
      6. Im Ausland ist {6} oft teurer als zu Hause. (die Handynutzung im Ausland)
    answers:
      "1": Datenvolumen
      "2": Laufzeit
      "3": mitnehmen
      "4": Kündigungsfrist
      "5": Grundgebühr
      "6": Roaming

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beratung im Handyladen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich suche einen neuen {1}.
      — Gerne, wie viel Datenvolumen brauchen Sie ungefähr im {2}?
      — Ich streame viel, vielleicht 20 {3}.
      — Dann würde ich Ihnen diesen Tarif {4}, mit 25 GB und
      Telefonflat.
      — Und wie lange ist die {5}?
      — 24 Monate, oder ohne Vertragsbindung {6} teurer.
      — Ich möchte meine alte Nummer gern {7}.
      — Kein Problem, das machen wir automatisch über die {8}.
      — Wie lange {9} das ungefähr?
      — Meist ein bis zwei {10}.
    bank: [ANBIETER, TARIF, MONAT, GIGABYTE, EMPFEHLEN, LAUFZEIT, DAFÜR, MITNEHMEN, PORTIERUNG, DAUERT, WOCHEN, GERÄT, RECHNUNG, EMPFANG]
    answers:
      "1": TARIF
      "2": MONAT
      "3": GIGABYTE
      "4": EMPFEHLEN
      "5": LAUFZEIT
      "6": DAFÜR
      "7": MITNEHMEN
      "8": PORTIERUNG
      "9": DAUERT
      "10": WOCHEN

  - id: B2
    block: B
    type: single-choice
    title: "Im Handyladen fragen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du weißt noch nicht genau, wie viel Datenvolumen du brauchst. — You're not sure how much data you need."
        options:
          - { key: a, text: "Was würden Sie mir empfehlen, wenn ich viel streame?" }
          - { key: b, text: "Geben Sie mir einfach den teuersten Tarif." }
          - { key: c, text: "Datenvolumen ist mir egal." }
        answer: a
        why: "Eine offene Frage nach einer Empfehlung nutzt das Fachwissen der Beratung, statt zu raten."
      - q: "Du möchtest wissen, wie lange der Vertrag mindestens läuft. — You want to know the minimum contract length."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Wie lange muss ich mich mindestens binden?" }
          - { key: c, text: "Ich unterschreibe einfach." }
        answer: b
        why: "Die Laufzeit vorher zu klären verhindert spätere Überraschungen."
      - q: "Du möchtest deine alte Nummer behalten. — You want to keep your old number."
        options:
          - { key: a, text: "Eine neue Nummer ist mir auch recht." }
          - { key: b, text: "Ich kümmere mich selbst um die Nummer." }
          - { key: c, text: "Ich möchte meine alte Nummer gern mitnehmen." }
        answer: c
        why: "Die Rufnummernmitnahme klar anzusprechen sorgt dafür, dass sie eingeleitet wird."
      - q: "Der Verkäufer erklärt einen Tarif sehr schnell und du verstehst nicht alles. — The salesperson explains a plan very fast and you don't follow everything."
        options:
          - { key: a, text: "Könnten Sie das noch einmal langsamer erklären?" }
          - { key: b, text: "Einfach nicken und hoffen, dass es passt." }
          - { key: c, text: "Den Laden verlassen." }
        answer: a
        why: "Eine höfliche Bitte um Wiederholung ist besser, als etwas Unverstandenes zu unterschreiben."
      - q: "Du möchtest den Vertrag noch nicht sofort unterschreiben. — You don't want to sign the contract right away."
        options:
          - { key: a, text: "Einfach nichts sagen und trotzdem unterschreiben." }
          - { key: b, text: "Könnte ich mir das noch einmal in Ruhe überlegen?" }
          - { key: c, text: "Sofort ablehnen, ohne einen Grund zu nennen." }
        answer: b
        why: "Um Bedenkzeit zu bitten ist völlig normal, bevor man einen längerfristigen Vertrag unterschreibt."
      - q: "Du fragst nach den Kosten, wenn du im Ausland telefonierst. — You ask about costs when calling abroad."
        options:
          - { key: a, text: "Ich telefoniere sowieso nie im Ausland." }
          - { key: b, text: "Roaming interessiert mich nicht." }
          - { key: c, text: "Was kostet Roaming außerhalb der EU?" }
        answer: c
        why: "Eine konkrete Frage nach den Roaming-Kosten verhindert eine böse Überraschung auf der Rechnung."

  - id: B3
    block: B
    type: order
    title: "Sätze im Handyladen bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "suche", "einen", "neuen", "Tarif", "mit", "viel", "Datenvolumen"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "mit + Dativ für die Beschreibung"
      - tiles: ["Wie", "lange", "muss", "ich", "mich", "mindestens", "binden", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "reflexives Verb, Infinitiv am Ende"
      - tiles: ["Ich", "möchte", "meine", "alte", "Nummer", "gern", "mitnehmen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "trennbares Verb, Infinitiv am Ende"
      - tiles: ["Dieser", "Tarif", "ist", "günstiger", "als", "der", "mit", "Gerät"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Vergleich mit als"
      - tiles: ["Könnten", "Sie", "mir", "das", "noch", "einmal", "erklären", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Konjunktiv-II-Bitte, Infinitiv am Ende"
      - tiles: ["Was", "kostet", "Roaming", "außerhalb", "der", "EU", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Präposition außerhalb + Genitiv"

  - id: B4
    block: B
    type: true-false
    title: "Den Tarifvergleich lesen"
    instructions: |
      > **Tarifvergleich — drei Angebote**
      >
      > | Tarif | Datenvolumen | Laufzeit | Preis/Monat |
      > |---|---|---|---|
      > | Basic | 5 GB | 24 Monate | 15 € |
      > | Plus | 15 GB | 24 Monate | 22 € |
      > | Flex | 10 GB | **ohne Vertragsbindung** | 28 € |
      >
      > - Bei **Flex** ist die Kündigungsfrist nur **1 Monat**, dafür ist
      >   der monatliche Preis höher.
      > - Bei **Basic** und **Plus** beträgt die Kündigungsfrist **3
      >   Monate** zum Vertragsende.
      > - Rufnummernmitnahme ist bei **allen drei Tarifen kostenlos**.
      > - Roaming in der EU ist bei allen Tarifen **inklusive**, außerhalb
      >   der EU kostet es extra.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Plus hat mehr Datenvolumen als Basic. — Plus has more data than Basic."
        answer: true
        why: "15 GB gegenüber 5 GB."
      - q: "Flex hat eine feste Laufzeit von 24 Monaten. — Flex has a fixed term of 24 months."
        answer: false
        why: "Flex läuft ohne Vertragsbindung."
      - q: "Bei Basic und Plus beträgt die Kündigungsfrist drei Monate. — For Basic and Plus, the notice period is three months."
        answer: true
        why: "So steht es ausdrücklich im Vergleich."
      - q: "Die Rufnummernmitnahme kostet bei Flex extra. — Number porting costs extra with Flex."
        answer: false
        why: "Rufnummernmitnahme ist bei allen drei Tarifen kostenlos."
      - q: "Roaming außerhalb der EU ist bei allen Tarifen inklusive. — Roaming outside the EU is included in all plans."
        answer: false
        why: "Außerhalb der EU kostet Roaming extra."
      - q: "Flex ist der teuerste der drei Tarife pro Monat. — Flex is the most expensive of the three plans per month."
        answer: true
        why: "28 € gegenüber 15 € und 22 €."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas mit dem Vertrag nicht stimmt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Deine alte Nummer wurde nach drei Wochen immer noch nicht übernommen. — Your old number still hasn't been ported after three weeks."
        options:
          - { key: a, text: "Beim Anbieter nachfragen, woran es liegt." }
          - { key: b, text: "Einfach warten, ohne nachzufragen." }
          - { key: c, text: "Eine ganz neue Nummer akzeptieren." }
        answer: a
        why: "Eine Nachfrage klärt, ob es ein technisches Problem gibt oder ob etwas fehlt."
      - q: "Die Rechnung ist deutlich höher als erwartet. — The bill is noticeably higher than expected."
        options:
          - { key: a, text: "Einfach zahlen, ohne nachzuschauen." }
          - { key: b, text: "Die Rechnung genau prüfen und beim Anbieter nach dem Grund fragen." }
          - { key: c, text: "Den Vertrag sofort kündigen, ohne nachzufragen." }
        answer: b
        why: "Erst prüfen, dann nachfragen — vielleicht ist es ein einmaliger Fehler oder ungeplantes Roaming."
      - q: "Du hast die Kündigungsfrist knapp verpasst. — You've just missed the notice period."
        options:
          - { key: a, text: "Den Vertrag einfach nicht mehr bezahlen." }
          - { key: b, text: "Annehmen, dass gar nichts mehr geht." }
          - { key: c, text: "Trotzdem beim Anbieter nachfragen, ob eine Ausnahme möglich ist." }
        answer: c
        why: "Nachfragen kostet nichts — manchmal gibt es eine Kulanzlösung, auch wenn es keine Garantie gibt."
      - q: "Der Empfang zu Hause ist sehr schlecht. — Reception at home is very poor."
        options:
          - { key: a, text: "Es einfach hinnehmen." }
          - { key: b, text: "Beim Anbieter nach der Netzabdeckung an deiner Adresse fragen." }
          - { key: c, text: "Sofort ohne Nachfrage den Anbieter wechseln." }
        answer: b
        why: "Der Anbieter kann prüfen, ob es an der Netzabdeckung liegt und ob es Alternativen gibt."
      - q: "Im Vertrag steht eine Zusatzleistung, die du nie bestellt hast. — The contract lists an add-on you never ordered."
        options:
          - { key: a, text: "Einfach weiterzahlen." }
          - { key: b, text: "Ohne Nachfrage sofort kündigen." }
          - { key: c, text: "Freundlich beim Anbieter nachfragen und um Korrektur bitten." }
        answer: c
        why: "Ein freundlicher Hinweis führt meist schnell zur Korrektur des Fehlers."
      - q: "Du möchtest den Vertrag fristgerecht kündigen, weißt aber nicht genau, wie. — You want to cancel on time but aren't sure how."
        options:
          - { key: a, text: "Frühzeitig beim Anbieter nach dem genauen Kündigungsweg fragen." }
          - { key: b, text: "Bis zum letzten Tag warten." }
          - { key: c, text: "Einfach die SIM-Karte wegwerfen." }
        answer: a
        why: "Früh nachzufragen gibt genug Zeit, die Kündigung form- und fristgerecht einzureichen."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Meine alte Nummer wurde noch nicht {1}. (übertragen zum neuen Anbieter)
      2. Die {2} war diesen Monat viel höher als sonst. (das Dokument mit dem zu zahlenden Betrag)
      3. Ich habe die {3} leider knapp verpasst. (die Zeit vor der Kündigung)
      4. Der {4} zu Hause ist leider sehr schlecht. (die Signalstärke fürs Telefonieren)
      5. Im Vertrag steht eine {5}, die ich nie bestellt habe. (ein zusätzlicher Service)
      6. Ich möchte den Vertrag {6} kündigen. (rechtzeitig, innerhalb der Frist)
    answers:
      "1": portiert
      "2": Rechnung
      "3": Kündigungsfrist
      "4": Empfang
      "5": Zusatzleistung
      "6": fristgerecht

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Dieser Tarif hat {1} Datenvolumen als der andere. (more)
      2. Die Laufzeit ist bei diesem Anbieter {2} als bei dem anderen. (shorter)
      3. Wie viel {3} habe ich pro Monat? (data volume)
      4. Der Vertrag hat eine {4} von 24 Monaten. (contract term)
      5. Ich möchte meine alte Nummer {5}. (take with me)
      6. Die {6} beträgt drei Monate. (notice period)
      7. Ohne Gerät zahle ich nur die {7}. (base fee)
      8. Im Ausland ist {8} oft teurer. (using your phone abroad)
      9. Wie lange muss ich mich mindestens {9}? (commit — Infinitiv)
      10. Meine alte Nummer wurde noch nicht {10}. (ported — Partizip)
      11. Die {11} war diesen Monat viel höher. (the bill)
      12. Ich habe die Kündigungsfrist knapp {12}. (missed — Partizip)
      13. Der {13} zu Hause ist sehr schlecht. (reception)
      14. Im Vertrag steht eine {14}, die ich nie bestellt habe. (add-on)
    answers:
      "1": mehr
      "2": kürzer
      "3": Datenvolumen
      "4": Laufzeit
      "5": mitnehmen
      "6": Kündigungsfrist
      "7": Grundgebühr
      "8": Roaming
      "9": binden
      "10": portiert
      "11": Rechnung
      "12": verpasst
      "13": Empfang
      "14": Zusatzleistung

  - id: D2
    block: D
    type: free-write
    title: "Beraten lassen, Rechnung prüfen, klären"
    prompt: "Schreib drei Teile: die Beratung im Laden, ein Problem mit der Rechnung und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du gehst in einen Handyladen und wählst einen neuen Tarif mit
      Rufnummernmitnahme. Zwei Monate später ist die Rechnung deutlich
      höher als erwartet.

      In der Beratung müssen vorkommen:
      1. sagen, wie viel Datenvolumen du ungefähr brauchst
      2. nach der Laufzeit fragen
      3. um die Rufnummernmitnahme bitten

      Im Problem müssen vorkommen:
      4. merken, dass die Rechnung höher ist als erwartet
      5. die Rechnung genau ansehen
      6. beim Anbieter anrufen und höflich nach dem Grund fragen

      In der Lösung müssen vorkommen:
      7. erfahren, was den höheren Betrag verursacht hat
      8. um eine Korrektur bitten, falls es ein Fehler war
      9. dich für die Klärung bedanken
      10. für die Zukunft besser auf die Rechnung achten
    use:
      - "Komparativ beim Vergleichen: „günstiger“, „mehr Datenvolumen“"
      - "höfliche Bitte: „Könnten Sie …?“"
      - "Nebensatz mit dass: „Ich habe gesehen, dass …“"
    selfCheck:
      - "Ist die Frage nach der Laufzeit klar formuliert?"
      - "Steht der Komparativ beim Vergleich der Tarife richtig?"
      - "Klingt die Nachfrage zur Rechnung höflich, nicht vorwurfsvoll?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Die Beratung im Laden**

      Ich: Guten Tag, ich suche einen neuen Tarif. Ich streame viel, vielleicht brauche ich 20 Gigabyte im Monat.
      Verkäufer: Dann würde ich Ihnen diesen Tarif empfehlen, mit 25 GB und Telefonflat.
      Ich: Und wie lange ist die Laufzeit?
      Verkäufer: 24 Monate, ohne Vertragsbindung wäre es etwas teurer.
      Ich: Ich möchte meine alte Nummer gern mitnehmen.
      Verkäufer: Kein Problem, das machen wir automatisch über die Portierung.

      **Das Problem mit der Rechnung**

      (Zwei Monate später)
      Ich: Diese Rechnung ist ja viel höher als sonst — das habe ich so nicht erwartet.
      (Ich schaue mir die Rechnung genau an und rufe an.)
      Ich: Guten Tag, ich habe gesehen, dass meine Rechnung diesen Monat deutlich höher ist. Könnten Sie mir sagen, woran das liegt?
      Mitarbeiterin: Einen Moment, ich schaue nach.

      **Die Lösung**

      Mitarbeiterin: Es sieht so aus, als wäre versehentlich eine Zusatzleistung aktiviert worden, die Sie nicht bestellt haben.
      Ich: Könnten Sie das bitte korrigieren?
      Mitarbeiterin: Natürlich, ich storniere das sofort und die Differenz wird Ihnen gutgeschrieben.
      Ich: Vielen Dank für die schnelle Klärung.
      Mitarbeiterin: Gern geschehen, und entschuldigen Sie die Unannehmlichkeiten.
      Ich: Kein Problem, ich schaue ab jetzt einfach genauer auf die Rechnung.
