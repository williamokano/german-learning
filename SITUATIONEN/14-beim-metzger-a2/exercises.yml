lesson: "SIT/14-beim-metzger-a2"
title: "Beim Metzger — A2"
topic: "Beim Metzger"
category: "Essen & Trinken"
level: A2
summary: "Fleischsorten und Schnitte, Menge und Dicke, einschweißen lassen — und was man sagt, wenn es gerade aus ist."
intro: >
  An der Theke wird nicht gezeigt, sondern gesagt: welche Sorte, welcher
  Schnitt, wie viel, wie dick, wie verpackt. Genau das übt dieses Set —
  plus die kleinen Gespräche, die dazugehören: eine Empfehlung erfragen,
  nach der Zubereitung fragen, hören, dass etwas heute aus ist, und
  etwas anderes nehmen. Grammatik nach Bedarf: Mengenangaben ohne
  Artikel, Komparativ (dünner, dicker, magerer), höfliche Bitten.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

