      - { text: "der Schweinebraten", bucket: schwein }
      - { text: "die Putenschnitzel", bucket: gefluegel }
      - { text: "das Gulasch vom Rind", bucket: rind }
      - { text: "der Schinken", bucket: schwein }
      - { text: "die Hähnchenkeule", bucket: gefluegel }
      - { text: "die Rinderbrühe", bucket: rind }
      - { text: "die Bratwurst", bucket: schwein }
      - { text: "das Entenbrustfilet", bucket: gefluegel }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Menge, Schnitt, Verpackung"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Ich hätte gern 300 {1} Hackfleisch. (Gewichtseinheit)
      2. Bitte vier {2} Schnitzel. (einzelne Stücke)
      3. Können Sie es etwas {3} schneiden? (nicht so dick)
      4. Bitte {4} Sie es mir ein. (luftdicht verpacken)
      5. Ein {5} Bratwürste, bitte. (zwei Stück zusammen)
      6. Nehmen Sie lieber das {6} Fleisch, das ist weniger fett. (mager)
      7. Darf es ein bisschen {7} sein? (etwas über der gewünschten Menge)
      8. Bitte alles {8} verpacken. (getrennt, nicht zusammen)
    answers:
      "1": Gramm
      "2": Stück
      "3": dünner
      "4": schweißen
      "5": Paar
      "6": magere
      "7": mehr
      "8": einzeln

  - id: A3
    block: A
