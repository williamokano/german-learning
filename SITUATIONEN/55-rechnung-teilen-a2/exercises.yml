lesson: "SIT/55-rechnung-teilen-a2"
title: "Die Rechnung: zusammen oder getrennt? — A2"
topic: "Die Rechnung teilen"
category: "Essen & Trinken"
level: A2
summary: "Mit Freunden entscheiden, ob man zusammen oder getrennt zahlt, den Anteil berechnen, Trinkgeld geben — und was tun, wenn beim Teilen etwas nicht aufgeht."
intro: >
  Am Ende eines Essens mit Freunden kommt fast immer diese Frage:
  zusammen oder getrennt? Beides ist völlig normal, aber die Formeln
  dafür muss man kennen — genau wie das Rechnen des eigenen Anteils und
  das Trinkgeld. Dieses Set übt das Gespräch am Tisch, wenn die Rechnung
  kommt, und was zu tun ist, wenn jemand kein Bargeld hat oder die Karte
  nicht funktioniert. Grammatik nach Bedarf: Nebensätze mit ob,
  Präpositionen bei Geldbeträgen, höfliche Vorschläge mit Konjunktiv
  II. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

