  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Wenn die Rechnung kommt"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. {1} wir zusammen oder getrennt zahlen? (wollen, wir-Form)
      2. Ich {2} nur einen Salat gehabt. (haben, Perfekt)
      3. {3} wir den Betrag einfach durch vier teilen? (können, wir-Form)
      4. Jeder {4} für seine eigene Bestellung. (zahlen, Präsens)
      5. Ich {5} das Trinkgeld schon mit eingerechnet. (haben, Perfekt)
      6. {6} du mir zehn Euro wechseln? (können, du-Form)
      7. Wir {7} den Betrag großzügig aufgerundet. (haben, Perfekt)
      8. {8} ich dir das Geld später überweisen? (dürfen, ich-Form)
    answers:
      "1": Wollen
      "2": habe
      "3": Können
      "4": zahlt
      "5": habe
      "6": Kannst
      "7": haben
      "8": Darf

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Sollen wir {1} zahlen, jeder für sich? (Gegenteil von zusammen)
      2. Mein {2} beträgt ungefähr fünfzehn Euro. (der Teil, den ich zahle)
      3. Für den Kellner geben wir noch etwas {3} dazu. (die Extra-Zahlung als Dank)
      4. Wir {4} den Betrag einfach unter uns vieren. (den Betrag verteilen)
      5. Der {5} für den ganzen Tisch beträgt sechzig Euro. (die Summe von allem)
      6. Kannst du mir die {6} für die Buchhaltung geben? (der Beleg über die Zahlung)
    answers:
      "1": getrennt
      "2": Anteil
      "3": Trinkgeld
      "4": teilen
      "5": Gesamtbetrag
      "6": Quittung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Tisch, wenn die Rechnung kommt"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Möchten Sie zusammen oder {1} zahlen?
      — Getrennt, bitte, wir sind zu {2}.
      — Kein Problem, ich {3} das gleich für jeden einzeln.
      — Ich hatte nur die {4} und ein Wasser.
      — Und ich hatte zusätzlich noch das {5}.
      — Dann {6} dein Anteil etwas mehr.
      — Kein Problem, ich {7} noch etwas Trinkgeld dazu.
      — Sehr {8}, vielen Dank.
      — Können wir mit Karte {9}?
      — Ja, natürlich, hier ist das {10}.
    bank: [GETRENNT, VIERT, RECHNE, SUPPE, DESSERT, KOSTET, GEBE, NETT, ZAHLEN, TERMINAL, BARGELD, RABATT, TRINKGELD, GESAMT]
    answers:
      "1": GETRENNT
      "2": VIERT
      "3": RECHNE
      "4": SUPPE
      "5": DESSERT
      "6": KOSTET
      "7": GEBE
      "8": NETT
      "9": ZAHLEN
      "10": TERMINAL

  - id: B2
    block: B
    type: single-choice
    title: "Höflich über die Rechnung sprechen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Der Kellner fragt, wie ihr bezahlen möchtet. — The waiter asks how you'd like to pay."
        options:
          - { key: a, text: "Möchten wir zusammen oder getrennt zahlen?" }
          - { key: b, text: "Das entscheiden Sie doch." }
          - { key: c, text: "Bezahlen interessiert mich nicht." }
        answer: a
        why: "Die Frage direkt an die Gruppe zurückzugeben klärt schnell, wie bezahlt wird."
      - q: "Du möchtest vorschlagen, den Betrag gleichmäßig zu teilen. — You want to suggest splitting the amount evenly."
        options:
          - { key: a, text: "Rechnet das selbst aus." }
          - { key: b, text: "Könnten wir den Betrag einfach durch vier teilen?" }
          - { key: c, text: "Mir ist es egal, wer wie viel zahlt." }
        answer: b
        why: "Ein konkreter Vorschlag macht das Aufteilen einfach und vermeidet lange Diskussionen."
      - q: "Du hattest weniger bestellt als die anderen. — You ordered less than the others."
        options:
          - { key: a, text: "Ich zahle trotzdem den vollen Anteil, ohne etwas zu sagen." }
          - { key: b, text: "Das ist mir zu kompliziert, ich zahle gar nichts." }
          - { key: c, text: "Ich hatte nur einen Salat, mein Anteil ist also etwas kleiner." }
        answer: c
        why: "Kurz zu erklären, was man hatte, ist der übliche Weg, den eigenen Anteil zu klären."
      - q: "Du möchtest wissen, ob ihr mit Karte zahlen könnt. — You want to know if you can pay by card."
        options:
          - { key: a, text: "Können wir mit Karte zahlen?" }
          - { key: b, text: "Karten interessieren mich nicht." }
          - { key: c, text: "Ich zahle sowieso nie mit Karte." }
        answer: a
        why: "Eine kurze Frage klärt, welche Zahlungsarten möglich sind."
      - q: "Du möchtest jemandem etwas Bargeld wechseln. — You want to change some cash for someone."
        options:
          - { key: a, text: "Wechselgeld ist mir egal." }
          - { key: b, text: "Kannst du mir zehn Euro wechseln?" }
          - { key: c, text: "Frag jemand anderen." }
        answer: b
        why: "Eine direkte, freundliche Bitte ist der einfachste Weg, an Wechselgeld zu kommen."
      - q: "Eine Freundin möchte für alle zahlen, aber die Gruppe möchte lieber teilen. — A friend wants to pay for everyone, but the group prefers to split."
        options:
          - { key: a, text: "Na gut, wenn du unbedingt willst." }
          - { key: b, text: "Nein, das kommt nicht infrage." }
          - { key: c, text: "Das ist total lieb von dir, aber lass uns lieber teilen." }
        answer: c
        why: "Das Angebot zu würdigen und trotzdem freundlich beim Teilen zu bleiben ist eine höfliche Lösung."

