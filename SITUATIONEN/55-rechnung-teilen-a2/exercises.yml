      5. Eine Person hat darauf {5}, für alle zu zahlen. (fest darauf bestehen)
      6. Am Ende blieb ein kleiner {6} übrig. (der übrige Betrag)
    answers:
      "1": Portemonnaie
      "2": abgelehnt
      "3": einig
      "4": verrechnet
      "5": bestanden
      "6": Rest

