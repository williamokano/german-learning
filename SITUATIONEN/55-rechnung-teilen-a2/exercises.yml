  - id: D2
    block: D
    type: free-write
    title: "Zahlen, ein Problem, eine Lösung"
    prompt: "Schreib drei Teile: die Entscheidung zusammen oder getrennt, ein kleines Problem und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du bist mit drei Freunden essen. Als die Rechnung kommt, wollt ihr
      getrennt zahlen. Dabei merkt ihr, dass jemand sein Portemonnaie
      vergessen hat.

      Bei der Entscheidung müssen vorkommen:
      1. den Kellner nach zusammen oder getrennt fragen
      2. euch für getrennt entscheiden
      3. euren jeweiligen Anteil nennen

      Beim Problem müssen vorkommen:
      4. merken, dass jemand kein Portemonnaie hat
      5. anbieten, kurz auszulegen
      6. sich einig werden, wann das Geld zurückkommt

      In der Lösung müssen vorkommen:
      7. den Gesamtbetrag noch einmal überprüfen
      8. Trinkgeld dazugeben
      9. mit Karte oder bar bezahlen
      10. euch für den schönen Abend bedanken
    use:
      - "höfliche Frage: „Möchten wir …?“"
      - "Nebensatz mit ob: „Ich bin nicht sicher, ob …“"
      - "trennbares Verb: „Ich gebe noch etwas dazu.“"
    selfCheck:
      - "Ist die Frage nach zusammen oder getrennt klar formuliert?"
      - "Klingt die Reaktion auf das fehlende Portemonnaie locker, nicht dramatisch?"
      - "Wird das Trinkgeld am Ende erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Die Entscheidung**

      Kellner: Möchten Sie zusammen oder getrennt zahlen?
      Ich: Getrennt, bitte, wir sind zu viert.
      Kellner: Kein Problem, ich rechne das gleich für jeden einzeln.
      Freund 1: Ich hatte nur die Suppe und ein Wasser.
      Ich: Und ich hatte zusätzlich noch das Dessert.

      **Das Problem**

      Freundin: Oh nein, ich glaube, ich habe mein Portemonnaie zu Hause vergessen.
      Ich: Kein Problem, ich lege für dich aus, du gibst es mir einfach nächste Woche zurück.
      Freundin: Das ist total lieb von dir, danke!

      **Die Lösung**

      Ich: Lass uns kurz den Gesamtbetrag überprüfen, bevor wir zahlen.
      Freund 1: Stimmt so, alles passt.
      Ich: Dann geben wir noch etwas Trinkgeld dazu.
      Kellner: Können Sie mit Karte zahlen, oder lieber bar?
      Ich: Mit Karte, bitte. Vielen Dank für den schönen Abend!
