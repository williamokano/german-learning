  - id: B4
    block: B
    type: true-false
    title: "Den Hinweis auf der Speisekarte lesen"
    instructions: |
      > **Restaurant Lindenblick — Hinweis zur Bezahlung**
      >
      > - Getrennte Rechnungen sind **bei Gruppen bis 6 Personen**
      >   möglich, bitte vorher Bescheid geben.
      > - Bei **mehr als 6 Personen** wird nur eine Gesamtrechnung
      >   erstellt.
      > - Trinkgeld ist **freiwillig**, üblich sind **5–10 %** der
      >   Rechnungssumme.
      > - **Kartenzahlung** ist ab **10 Euro** möglich, darunter bitte
      >   bar zahlen.
      > - Die **Quittung** wird auf Wunsch **zusätzlich zum Bon**
      >   ausgestellt.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Getrennte Rechnungen sind bei Gruppen bis sechs Personen möglich. — Split bills are possible for groups of up to six."
        answer: true
        why: "So steht es ausdrücklich im Hinweis."
      - q: "Bei mehr als sechs Personen gibt es trotzdem getrennte Rechnungen. — With more than six people, separate bills are still given."
        answer: false
        why: "Bei mehr als 6 Personen wird nur eine Gesamtrechnung erstellt."
      - q: "Trinkgeld ist verpflichtend. — Tipping is mandatory."
        answer: false
        why: "Trinkgeld ist freiwillig."
      - q: "Kartenzahlung ist ab zehn Euro möglich. — Card payment is possible from ten euros."
        answer: true
        why: "„Kartenzahlung ist ab 10 Euro möglich.“"
      - q: "Unter zehn Euro muss man bar zahlen. — Under ten euros you must pay cash."
        answer: true
        why: "„Darunter bitte bar zahlen.“"
      - q: "Eine Quittung gibt es nur automatisch, ohne dass man fragen muss. — A receipt is only given automatically, without asking."
        answer: false
        why: "Die Quittung wird nur auf Wunsch zusätzlich zum Bon ausgestellt."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Teilen etwas nicht aufgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Jemand hat sein Portemonnaie vergessen. — Someone forgot their wallet."
        options:
          - { key: a, text: "Kurz für die Person auslegen und sich später zurückzahlen lassen." }
          - { key: b, text: "Die Person soll draußen warten, bis jemand Geld holt." }
          - { key: c, text: "Sie soll gar nicht mitessen." }
        answer: a
        why: "Kurz auszulegen ist unter Freunden völlig normal, solange klar ist, dass es zurückgezahlt wird."
      - q: "Die Karte wird beim Teilen der Rechnung plötzlich abgelehnt. — The card is suddenly declined while splitting the bill."
        options:
          - { key: a, text: "Einfach ohne Bezahlung gehen." }
          - { key: b, text: "Es noch einmal versuchen oder nach einer anderen Zahlungsart fragen." }
          - { key: c, text: "In Panik geraten." }
        answer: b
        why: "Ein zweiter Versuch oder eine Alternative löst das Problem meist schnell."
      - q: "Ihr seid euch nicht einig, wer was bestellt hatte. — You disagree about who ordered what."
        options:
          - { key: a, text: "Einfach den Betrag gleichmäßig teilen und streiten." }
          - { key: b, text: "Den Kellner beschuldigen." }
          - { key: c, text: "Gemeinsam ruhig auf der Rechnung nachschauen." }
        answer: c
        why: "Ein Blick auf die Rechnung klärt das Missverständnis meist schnell und ohne Streit."
      - q: "Der Kellner hat sich beim Zusammenzählen offensichtlich verrechnet. — The waiter has clearly miscounted the total."
        options:
          - { key: a, text: "Freundlich darauf hinweisen und um eine Korrektur bitten." }
          - { key: b, text: "Einfach den falschen Betrag zahlen." }
          - { key: c, text: "Laut werden." }
        answer: a
        why: "Ein freundlicher Hinweis führt am schnellsten zur Korrektur eines Rechenfehlers."
      - q: "Eine Person besteht darauf, für alle zu zahlen, obwohl die anderen lieber teilen möchten. — One person insists on paying for everyone, though the others prefer to split."
        options:
          - { key: a, text: "Sich streiten, wer zahlt." }
          - { key: b, text: "Das Angebot wortlos ignorieren." }
          - { key: c, text: "Sich bedanken und anbieten, beim nächsten Mal zu zahlen." }
        answer: c
        why: "Ein Dank mit dem Angebot, beim nächsten Mal zu zahlen, ist eine höfliche, praktische Lösung."
      - q: "Beim Teilen bleibt am Ende ein Betrag übrig, der zu niemandem passt. — After splitting, there's a leftover amount that doesn't fit anyone."
        options:
          - { key: a, text: "Vorschlagen, den Rest als zusätzliches Trinkgeld zu geben." }
          - { key: b, text: "Streiten, wer den Rest zahlt." }
          - { key: c, text: "Den Kellner den Rest raten lassen." }
        answer: a
        why: "Einen kleinen Rest als Trinkgeld zu geben ist die unkomplizierteste Lösung."

  - id: C2
