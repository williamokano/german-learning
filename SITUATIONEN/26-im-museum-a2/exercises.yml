    type: gap-text
    listLayout: true
    title: "dürfen und müssen im Museum"
    instructions: "Ergänze das Modalverb in der richtigen Form."
    instructionsEn: "Fill in the modal verb in the correct form."
    text: |
      1. {1} ich hier fotografieren? (dürfen, ich-Form)
      2. Große Taschen {2} in das Schließfach. (müssen, Plural)
      3. Man {3} die Bilder nicht anfassen. (dürfen, man-Form, verneint)
      4. {4} wir die Jacken abgeben? (müssen, wir-Form)
      5. Kinder unter sechs {5} umsonst rein. (dürfen, Plural)
      6. Im Museumscafé {6} man auch ohne Ticket sitzen. (dürfen, man-Form)
    answers:
      "1": Darf
      "2": müssen
      "3": darf
      "4": Müssen
      "5": dürfen
      "6": darf

  - id: A4
