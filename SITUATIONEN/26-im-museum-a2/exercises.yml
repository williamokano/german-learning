    listLayout: true
    title: "Den Weg im Haus beschreiben"
    instructions: "Ergänze die Präposition oder das fehlende Wort."
    instructionsEn: "Fill in the preposition or the missing word."
    text: |
      1. Die Impressionisten sind {1} ersten Stock. (in + dem, kurz)
      2. Gehen Sie die Treppe {2}. (nach oben)
      3. Dann {3} rechts, Saal 12. (Richtung)
      4. Die Garderobe ist {4} Erdgeschoss, gleich {5} dem Eingang. (in + dem, kurz / daneben)
      5. Der Museumsshop ist {6} Ausgang. (an + dem, kurz)
      6. Die Sonderausstellung ist {7} anderen Gebäude, über den Hof. (in + dem)
    answers:
