    block: A
    type: categorize
    title: "Kasse, Garderobe oder Ausstellung?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: kasse, label: "An der Kasse" }
      - { key: garderobe, label: "An der Garderobe" }
      - { key: ausstellung, label: "In der Ausstellung" }
    tokens:
      - { text: "die Eintrittskarte", bucket: kasse }
      - { text: "das Schließfach", bucket: garderobe }
      - { text: "das Gemälde", bucket: ausstellung }
      - { text: "die Ermäßigung", bucket: kasse }
      - { text: "der Bügel", bucket: garderobe }
      - { text: "die Skulptur", bucket: ausstellung }
      - { text: "der Studentenausweis", bucket: kasse }
      - { text: "der Rucksack", bucket: garderobe }
      - { text: "das Schild", bucket: ausstellung }
      - { text: "der Audioguide", bucket: kasse }
      - { text: "die Nummer", bucket: garderobe }
      - { text: "die Sonderausstellung", bucket: ausstellung }

  - id: A2
