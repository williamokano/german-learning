      - { key: "2", text: "Ist die Sonderausstellung im Preis enthalten?" }
      - { key: "3", text: "Muss ich den Rucksack abgeben?" }
      - { key: "4", text: "Darf ich hier fotografieren?" }
      - { key: "5", text: "Wo geht es zu den Impressionisten?" }
      - { key: "6", text: "Gibt es eine Führung?" }
      - { key: "7", text: "Wie lange haben Sie heute auf?" }
      - { key: "8", text: "Wo ist die Toilette?" }
