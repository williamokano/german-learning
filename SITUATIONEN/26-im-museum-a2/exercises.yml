lesson: "SIT/26-im-museum-a2"
title: "Im Museum — A2"
topic: "Museumsbesuch"
category: "Freizeit & Kultur"
level: A2
summary: "Ticket und Ermäßigung, Garderobe und Audioguide, fotografieren dürfen, sich zurechtfinden und über das Gesehene reden."
intro: >
  Ein Museumsbesuch besteht aus drei kurzen Gesprächen und einem langen
  Schweigen. An der Kasse geht es um Ticket, Ermäßigung und Audioguide.
  An der Garderobe um Rucksack, Jacke und Schließfach. Und im
  Ausstellungsraum um die Fragen, die man dem Aufsichtspersonal
  stellt: Darf ich fotografieren? Wo geht es zur Sonderausstellung? Wie
  lange haben Sie noch auf? Dazwischen redest du mit deiner Begleitung
  darüber, was dir gefällt und was nicht — und genau dafür brauchst du
  ein paar Sätze mehr als „schön“. Grammatik nach Bedarf: dürfen und
  müssen, Wegbeschreibung mit Dativ, Meinung äußern mit weil.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

