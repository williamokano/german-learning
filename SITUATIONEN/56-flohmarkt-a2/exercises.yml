lesson: "SIT/56-flohmarkt-a2"
title: "Auf dem Flohmarkt handeln — A2"
topic: "Auf dem Flohmarkt handeln"
category: "Einkaufen"
level: A2
summary: "Den Zustand einer Sache prüfen, nach dem Preis fragen, freundlich handeln und sich auf einen Preis einigen."
intro: >
  Auf dem Flohmarkt gehört Handeln dazu — niemand nimmt es übel, wenn
  man nach einem besseren Preis fragt, solange es freundlich bleibt.
  Dieses Set übt genau das: den Zustand einer Sache prüfen, nach dem
  Preis fragen, ein Gegenangebot machen, sich einigen. Dazu, was zu tun
  ist, wenn ein Mangel erst zu Hause auffällt oder der Verkäufer gar
  nicht verhandeln will. Grammatik nach Bedarf: Komparativ beim
  Verhandeln, höfliche Fragen mit Konjunktiv II, Nebensätze mit wenn.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Fragen, Zustand oder Verhandeln?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: fragen, label: "Fragen" }
      - { key: zustand, label: "Zustand prüfen" }
      - { key: verhandeln, label: "Verhandeln" }
    tokens:
      - { text: "Was kostet das?", bucket: fragen }
      - { text: "der Kratzer", bucket: zustand }
      - { text: "der Preisnachlass", bucket: verhandeln }
      - { text: "Funktioniert das noch?", bucket: fragen }
      - { text: "gebraucht", bucket: zustand }
      - { text: "ein Gegenangebot machen", bucket: verhandeln }
      - { text: "Ist da noch was drin?", bucket: fragen }
      - { text: "der Riss im Stoff", bucket: zustand }
      - { text: "sich einigen", bucket: verhandeln }
      - { text: "Woher haben Sie das?", bucket: fragen }
      - { text: "der fehlende Knopf", bucket: zustand }
      - { text: "das letzte Angebot", bucket: verhandeln }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "handeln" }
      - { key: "2", text: "der Preisnachlass" }
      - { key: "3", text: "der Zustand" }
      - { key: "4", text: "gebraucht" }
      - { key: "5", text: "der Kratzer" }
      - { key: "6", text: "sich einigen" }
      - { key: "7", text: "das letzte Angebot" }
      - { key: "8", text: "der Stand" }
    right:
      - { key: a, text: "über den Preis verhandeln" }
      - { key: b, text: "wie viel man vom Preis abzieht" }
      - { key: c, text: "wie gut oder schlecht etwas erhalten ist" }
      - { key: d, text: "nicht neu, schon einmal benutzt" }
      - { key: e, text: "eine kleine Beschädigung auf der Oberfläche" }
      - { key: f, text: "gemeinsam zu einem Ergebnis kommen" }
      - { key: g, text: "der niedrigste Preis, den man noch bietet" }
      - { key: h, text: "der kleine Tisch mit den Waren zum Verkauf" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Nach dem Preis fragen und handeln"
    instructions: "Ergänze die Komparativform oder das Modalverb."
    instructionsEn: "Fill in the comparative form or the modal verb."
    text: |
      1. {1} Sie mir einen besseren Preis machen? (können, Sie-Form)
      2. Zehn Euro sind mir zu {2}, wie wäre es mit sieben? (viel, Komparativ)
      3. Dieser Kratzer macht die Lampe {3} wert. (wenig, Komparativ)
      4. {4} wir uns auf acht Euro einigen? (können, wir-Form)
      5. Das ist mein {5} Angebot, mehr geht nicht. (gut, Superlativ)
      6. Ich {6} noch etwas nachdenken, bevor ich kaufe. (müssen)
      7. Ohne den Kratzer wäre die Vase {7} wert. (viel, Komparativ)
      8. {8} Sie das noch etwas günstiger machen? (können, Sie-Form)
    answers:
      "1": Können
      "2": teuer
      "3": weniger
      "4": Können
      "5": bestes
      "6": muss
      "7": mehr
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der {1} für diesen Teppich ist ziemlich gut. (wie gut etwas erhalten ist)
      2. Auf der Vase ist ein kleiner {2}. (eine kleine Beschädigung)
      3. Wäre ein {3} von zwei Euro möglich? (die Preisminderung)
      4. Am {4} nebenan gibt es alte Bücher. (der kleine Tisch mit den Waren)
      5. Nach kurzem Verhandeln haben wir uns {5}. (gemeinsam zu einem Ergebnis gekommen)
      6. Das ist mein letztes {6}, mehr geht nicht. (das, was man anbietet)
    answers:
      "1": Zustand
      "2": Kratzer
      "3": Preisnachlass
      "4": Stand
      "5": geeinigt
      "6": Angebot

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Flohmarktstand"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Was {1} diese Lampe?
      — Zehn Euro, sie ist noch in gutem {2}.
      — Darf ich sie mir kurz {3}?
      — Klar, bitte sehr.
      — Hier ist ein kleiner {4}, sehen Sie?
      — Stimmt, den hatte ich gar nicht {5}.
      — Wären fünf Euro in Ordnung?
      — Das ist mir etwas zu {6}, wie wäre es mit acht?
      — Könnten wir uns bei sieben {7}?
      — Einverstanden, {8} wir uns bei sieben.
      — Super, hier ist das Geld, vielen {9}.
      — Gern, und {10} Tag noch!
    bank: [KOSTET, ZUSTAND, ANSEHEN, KRATZER, BEMERKT, WENIG, TREFFEN, EINIGEN, DANK, SCHÖNEN, GEBRAUCHT, REPARIEREN, RABATT, ANGEBOT]
    answers:
      "1": KOSTET
      "2": ZUSTAND
      "3": ANSEHEN
      "4": KRATZER
      "5": BEMERKT
      "6": WENIG
      "7": TREFFEN
      "8": EINIGEN
      "9": DANK
      "10": SCHÖNEN

  - id: B2
    block: B
    type: single-choice
    title: "Höflich handeln"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest wissen, was etwas kostet. — You want to know what something costs."
        options:
          - { key: a, text: "Was kostet diese Lampe?" }
          - { key: b, text: "Geben Sie mir einen Preis." }
          - { key: c, text: "Preise interessieren mich nicht." }
        answer: a
        why: "Eine einfache, direkte Frage ist am Flohmarktstand völlig normal."
      - q: "Du möchtest den Gegenstand genauer prüfen, bevor du kaufst. — You want to inspect the item more closely before buying."
        options:
          - { key: a, text: "Ich nehme sie einfach, ohne hinzuschauen." }
          - { key: b, text: "Darf ich sie mir kurz ansehen?" }
          - { key: c, text: "Zeigen Sie mir sofort alle Mängel." }
        answer: b
        why: "Höflich um einen genaueren Blick zu bitten ist beim Handeln völlig üblich."
      - q: "Du möchtest ein niedrigeres Preisangebot machen. — You want to make a lower offer."
        options:
          - { key: a, text: "Das ist viel zu teuer, unverschämt!" }
          - { key: b, text: "Ich zahle, was Sie wollen." }
          - { key: c, text: "Wären fünf Euro in Ordnung?" }
        answer: c
        why: "Ein konkretes, höfliches Gegenangebot ist der Standardweg beim Handeln."
      - q: "Der Verkäufer schlägt einen Preis vor, der dir noch zu hoch ist. — The seller suggests a price that's still too high for you."
        options:
          - { key: a, text: "Könnten wir uns bei sieben treffen?" }
          - { key: b, text: "Vergessen Sie's, das lohnt sich nicht." }
          - { key: c, text: "Dann eben nicht, und weggehen ohne ein Wort." }
        answer: a
        why: "Ein weiteres, moderates Gegenangebot hält das Gespräch freundlich und konstruktiv."
      - q: "Ihr habt euch auf einen Preis geeinigt. — You've agreed on a price."
        options:
          - { key: a, text: "Na endlich, das hat lange gedauert." }
          - { key: b, text: "Super, hier ist das Geld, vielen Dank." }
          - { key: c, text: "Ich überlege es mir noch mal." }
        answer: b
        why: "Ein freundlicher Abschluss mit Dank ist der übliche Schritt nach der Einigung."
      - q: "Du möchtest den Verkäufer fragen, woher ein Gegenstand kommt. — You want to ask the seller where an item is from."
        options:
          - { key: a, text: "Herkunft interessiert mich nicht." }
          - { key: b, text: "Das sieht sowieso gestohlen aus." }
          - { key: c, text: "Woher haben Sie das denn?" }
        answer: c
        why: "Eine freundliche Nachfrage zur Herkunft ist normaler Smalltalk beim Stöbern."

  - id: B3
    block: B
    type: order
    title: "Sätze beim Handeln bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Was", "kostet", "diese", "Lampe", "?"]
        answer: [0, 1, 2, 3, 4]
        note: "kurze Frage, Verb an Position 2"
      - tiles: ["Darf", "ich", "sie", "mir", "kurz", "ansehen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "höfliche Bitte, trennbares Verb am Ende"
      - tiles: ["Wären", "fünf", "Euro", "in", "Ordnung", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Konjunktiv-II-Frage, höfliches Gegenangebot"
      - tiles: ["Könnten", "wir", "uns", "bei", "sieben", "treffen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "reflexives Verb, Infinitiv am Ende"
      - tiles: ["Ohne", "den", "Kratzer", "wäre", "die", "Vase", "mehr", "wert"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Konjunktiv II, hypothetischer Vergleich"
      - tiles: ["Hier", "ist", "das", "Geld", ",", "vielen", "Dank"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "freundlicher Abschluss des Handels"

  - id: B4
    block: B
    type: true-false
    title: "Den Aushang am Flohmarkteingang lesen"
    instructions: |
      > **Flohmarkt Stadtplatz — Hinweise für Besucher**
      >
      > - Standgebühr für Verkäufer: **10 € pro Tag**, Käufer haben
      >   **freien Eintritt**.
      > - Der Markt öffnet um **8 Uhr**, letzter Einlass **13 Uhr**.
      > - **Handeln ist ausdrücklich erwünscht** — die meisten Preise
      >   sind Verhandlungssache.
      > - **Keine Rückgabe:** Ware wird „wie gesehen“ verkauft, bitte
      >   vorher genau prüfen.
      > - **Bargeld** ist üblich, manche Stände akzeptieren auch
      >   mobiles Bezahlen.
      > - Bei **Streit** zwischen Käufer und Verkäufer hilft das
      >   Standpersonal am Infopunkt.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Käufer müssen Eintritt zahlen. — Buyers must pay admission."
        answer: false
        why: "Käufer haben freien Eintritt, nur Verkäufer zahlen die Standgebühr."
      - q: "Der Markt öffnet um acht Uhr. — The market opens at eight."
        answer: true
        why: "So steht es ausdrücklich im Aushang."
      - q: "Handeln ist unerwünscht. — Haggling is unwelcome."
        answer: false
        why: "Handeln ist ausdrücklich erwünscht."
      - q: "Man kann Ware nach dem Kauf zurückgeben. — Goods can be returned after purchase."
        answer: false
        why: "Es gibt keine Rückgabe, die Ware wird „wie gesehen“ verkauft."
      - q: "Alle Stände akzeptieren nur Bargeld. — All stalls only accept cash."
        answer: false
        why: "Manche Stände akzeptieren auch mobiles Bezahlen."
      - q: "Bei Streit hilft das Standpersonal am Infopunkt. — In case of dispute, stall staff at the info point help."
        answer: true
        why: "„Bei Streit … hilft das Standpersonal am Infopunkt.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es beim Handeln nicht rundläuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Der Verkäufer will überhaupt nicht mit sich verhandeln lassen. — The seller won't negotiate at all."
        options:
          - { key: a, text: "Den Preis akzeptieren oder freundlich weiterziehen." }
          - { key: b, text: "Lauter werden, um ihn zu überzeugen." }
          - { key: c, text: "Die Ware einfach mitnehmen, ohne zu zahlen." }
        answer: a
        why: "Nicht jeder Verkäufer verhandelt — den Preis zu akzeptieren oder weiterzuziehen ist die einzig faire Reaktion."
      - q: "Du hast kein passendes Kleingeld dabei. — You don't have the right change."
        options:
          - { key: a, text: "Einfach mehr zahlen, ohne zu fragen." }
          - { key: b, text: "Fragen, ob der Verkäufer wechseln kann." }
          - { key: c, text: "Den Kauf ohne Erklärung abbrechen." }
        answer: b
        why: "Nach Wechselgeld zu fragen ist unkompliziert und meist kein Problem."
      - q: "Zu Hause fällt dir ein Mangel auf, den du vorher nicht gesehen hast. — At home you notice a defect you didn't see before."
        options:
          - { key: a, text: "Zurück zum Stand gehen und laut Geld zurückverlangen." }
          - { key: b, text: "Den Verkäufer online schlechtmachen." }
          - { key: c, text: "Es als Teil des Flohmarkt-Risikos akzeptieren, da es keine Rückgabe gibt." }
        answer: c
        why: "Auf dem Flohmarkt gilt meist „gekauft wie gesehen“ — den Mangel zu akzeptieren ist realistisch."
      - q: "Ein anderer Käufer greift nach derselben Sache wie du. — Another buyer reaches for the same item as you."
        options:
          - { key: a, text: "Freundlich fragen, wer zuerst da war." }
          - { key: b, text: "Die Sache einfach wegreißen." }
          - { key: c, text: "Laut streiten." }
        answer: a
        why: "Eine freundliche Klärung, wer zuerst war, verhindert unnötigen Streit."
      - q: "Der Verkäufer sagt, die Sache sei schon verkauft, obwohl sie noch daliegt. — The seller says the item is already sold, even though it's still there."
        options:
          - { key: a, text: "Das akzeptieren und dich woanders umsehen." }
          - { key: b, text: "Darauf bestehen, dass du sie trotzdem bekommst." }
          - { key: c, text: "Die Sache einfach nehmen und Geld hinlegen." }
        answer: a
        why: "Die Entscheidung des Verkäufers zu akzeptieren ist die einzig höfliche Reaktion."
      - q: "Du bereust den Kauf schon kurz nachdem du bezahlt hast. — You regret the purchase shortly after paying."
        options:
          - { key: a, text: "Freundlich fragen, ob eine Rückgabe ausnahmsweise möglich ist, aber mit Nein rechnen." }
          - { key: b, text: "Das Geld einfach zurückfordern." }
          - { key: c, text: "Die Sache wütend zurückwerfen." }
        answer: a
        why: "Freundlich zu fragen kostet nichts, aber eine Rückgabe ist auf dem Flohmarkt selten garantiert."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der Verkäufer wollte {1} nicht mit sich verhandeln lassen. (gar nicht, absolut nicht)
      2. Ich hatte leider kein passendes {2} dabei. (kleine Münzen zum Wechseln)
      3. Zu Hause ist mir ein {3} aufgefallen, den ich vorher nicht gesehen hatte. (ein Fehler an der Ware)
      4. Ein anderer {4} griff nach derselben Sache wie ich. (die Person, die kauft)
      5. Der Verkäufer sagte, die Sache sei schon {5}. (an jemand anderen gegangen)
      6. Ich {6} den Kauf schon kurz danach. (im Nachhinein leidtun)
    answers:
      "1": überhaupt
      "2": Kleingeld
      "3": Mangel
      "4": Käufer
      "5": verkauft
      "6": bereute

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. {1} Sie mir einen besseren Preis machen? (could)
      2. Zehn Euro sind mir zu {2}. (too much)
      3. {3} wir uns auf acht Euro einigen? (can we)
      4. Das ist mein {4} Angebot. (best — Superlativ)
      5. Der {5} für diesen Teppich ist gut. (condition)
      6. Auf der Vase ist ein kleiner {6}. (scratch)
      7. Wäre ein {7} von zwei Euro möglich? (discount)
      8. Am {8} nebenan gibt es alte Bücher. (stall)
      9. Wir haben uns {9}. (agreed — Partizip)
      10. Der Verkäufer wollte {10} nicht verhandeln. (at all)
      11. Ich hatte kein passendes {11} dabei. (small change)
      12. Zu Hause ist mir ein {12} aufgefallen. (defect)
      13. Ein anderer {13} griff nach derselben Sache. (buyer)
      14. Ich {14} den Kauf schon kurz danach. (regretted)
    answers:
      "1": Können
      "2": teuer
      "3": Können
      "4": bestes
      "5": Zustand
      "6": Kratzer
      "7": Preisnachlass
      "8": Stand
      "9": geeinigt
      "10": überhaupt
      "11": Kleingeld
      "12": Mangel
      "13": Käufer
      "14": bereute

  - id: D2
    block: D
    type: free-write
    title: "Ansehen, Verhandeln, Einigen"
    prompt: "Schreib drei Teile: den Gegenstand ansehen, verhandeln und euch einigen. Zusammen 16–20 Sätze."
    stimulus: |
      Du interessierst dich für eine alte Lampe auf einem
      Flohmarktstand. Sie hat einen kleinen Kratzer, den du beim
      Verhandeln erwähnst.

      Beim Ansehen müssen vorkommen:
      1. nach dem Preis fragen
      2. um einen genaueren Blick bitten
      3. den Kratzer bemerken und erwähnen

      Beim Verhandeln müssen vorkommen:
      4. ein niedrigeres Gegenangebot machen
      5. auf eine Reaktion des Verkäufers eingehen
      6. ein zweites, moderateres Angebot machen

      Bei der Einigung müssen vorkommen:
      7. euch auf einen Preis einigen
      8. bezahlen
      9. euch für den fairen Preis bedanken
      10. euch freundlich verabschieden
    use:
      - "höfliche Frage: „Darf ich …?“, „Wären … in Ordnung?“"
      - "Komparativ: „etwas günstiger“, „mehr wert“"
      - "Konjunktiv II bei Angeboten: „Könnten wir uns bei … treffen?“"
    selfCheck:
      - "Ist die erste Preisfrage klar und höflich formuliert?"
      - "Wird der Kratzer sachlich erwähnt, nicht als Vorwurf?"
      - "Bleibt der Ton beim Verhandeln freundlich?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Ansehen**

      Ich: Was kostet diese Lampe?
      Verkäufer: Zehn Euro, sie ist noch in gutem Zustand.
      Ich: Darf ich sie mir kurz ansehen?
      Verkäufer: Klar, bitte sehr.
      Ich: Hier ist ein kleiner Kratzer, sehen Sie?
      Verkäufer: Stimmt, den hatte ich gar nicht bemerkt.

      **Verhandeln**

      Ich: Wären fünf Euro in Ordnung?
      Verkäufer: Das ist mir etwas zu wenig, wie wäre es mit acht?
      Ich: Könnten wir uns bei sieben treffen?
      Verkäufer: Einverstanden, einigen wir uns bei sieben.

      **Einigung**

      Ich: Super, hier ist das Geld, vielen Dank.
      Verkäufer: Gern, und schönen Tag noch!
      Ich: Ihnen auch, danke für den fairen Preis.
      Verkäufer: Kommen Sie gerne wieder vorbei.
