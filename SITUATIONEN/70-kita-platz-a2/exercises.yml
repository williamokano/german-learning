      4. Für unser Kind suchen wir einen {4}. (childcare spot)
      5. Weil alle Plätze belegt sind, stehen wir auf der {5}. (waiting list)
      6. Beim {6} lernen wir die Kita-Leitung kennen. (get-to-know meeting)
