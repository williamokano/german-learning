lesson: "SIT/70-kita-platz-a2"
title: "Kita-Platz beantragen — A2"
topic: "Kita-Platz beantragen"
category: "Behörden & Formelles"
level: A2
summary: "Einen Kita-Gutschein beantragen, sich auf eine Warteliste setzen lassen, das Kennenlerngespräch führen — und was tun, wenn kein Platz frei ist oder die Eingewöhnung schwerfällt."
intro: >
  Ein Kita-Platz braucht Vorlauf: beim Jugendamt einen Kita-Gutschein
  beantragen, sich bei mehreren Kitas anmelden, ein Kennenlerngespräch
  vereinbaren und die Eingewöhnungszeit einplanen. Dieses Set übt genau
  das — nach einem freien Platz fragen, den gewünschten
  Betreuungsumfang klären, und was zu tun ist, wenn alle Kitas
  ausgebucht sind oder die Eingewöhnung schwerfällt. Grammatik nach
  Bedarf: Perfekt im Bericht, höfliche Fragen, Nebensätze mit falls.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Anmelden, kennenlernen oder eingewöhnen?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: anmelden, label: "Anmelden" }
      - { key: kennenlernen, label: "Kennenlernen" }
      - { key: eingewoehnen, label: "Eingewöhnen" }
    tokens:
      - { text: "sich beim Jugendamt informieren", bucket: anmelden }
      - { text: "einen Kita-Gutschein beantragen", bucket: anmelden }
      - { text: "die Anmeldung ausfüllen", bucket: anmelden }
      - { text: "auf die Warteliste kommen", bucket: anmelden }
      - { text: "einen Termin für ein Kennenlerngespräch vereinbaren", bucket: kennenlernen }
      - { text: "die Kita besichtigen", bucket: kennenlernen }
      - { text: "Fragen zum Betreuungsumfang stellen", bucket: kennenlernen }
      - { text: "die Erzieherinnen kennenlernen", bucket: kennenlernen }
      - { text: "die Eingewöhnungszeit einplanen", bucket: eingewoehnen }
      - { text: "das Kind langsam gewöhnen", bucket: eingewoehnen }
      - { text: "in der Nähe bleiben", bucket: eingewoehnen }
      - { text: "sich langsam verabschieden", bucket: eingewoehnen }

  - id: A2
