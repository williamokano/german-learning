      "2": Terminumfrage
      "3": Budget
      "4": wäre
      "5": Anzahlung
      "6": Mietwagen
      "7": damit
      "8": wenn
      "9": Falls
      "10": Nebensaison
      "11": Sobald
      "12": Stornierung

  - id: D2
    block: D
    type: free-write
    title: "Die Nachricht in die Gruppe"
    prompt: "Schreib zwei Nachrichten an die Reisegruppe: die Planungsnachricht und, nach der Reise, die Abrechnung. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr seid zu fünft und wollt im Mai eine Woche wegfahren. Das
      Ferienhaus kostet in der Nebensaison 1.800 € plus 90 €
      Endreinigung; die Anzahlung von 20 % legst du aus. Eine Person
      hat ein deutlich kleineres Budget.

      Nachricht 1 — die Planung:
      1. zwei bis drei konkrete Termine vorschlagen
      2. eine Frist für die Rückmeldung setzen
      3. das Budget offen ansprechen
      4. die Unterkunft vorschlagen und begründen
      5. Aufgaben verteilen — mit Namen
      6. sagen, wie die Anzahlung läuft

      Nachricht 2 — die Abrechnung:
      7. die Gesamtkosten nennen
      8. den Anteil pro Person ausrechnen
      9. sagen, wer schon gezahlt hat und wer nicht
      10. um Rückmeldung bei Unstimmigkeiten bitten, mit Frist
    use:
      - "du-/ihr-Form in der Gruppe"
      - "`Wie wäre es mit …?` und `Das wäre …`"
      - "`damit`, `falls`, `sobald`"
      - "konkrete Zahlen und Daten in beiden Nachrichten"
    selfCheck:
      - "Steht in Nachricht 1 eine echte Frist mit Datum?"
      - "Hast du nach `damit`, `falls` und `sobald` das Verb ans Ende gestellt?"
      - "Nennt Nachricht 2 Gesamtbetrag UND Anteil pro Person?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Nachricht 1 — die Planung**

      Hallo zusammen! Damit es diesmal wirklich klappt, mache ich es
      konkret.

      Termine: Wie wäre es mit der ersten oder zweiten Maiwoche? Beide
      liegen in der Nebensaison, da ist es 25 % billiger. Ich schicke
      gleich eine Terminumfrage rum — bitte tragt euch bis Freitag ein,
      danach buche ich.

      Geld: Sagt mir bitte ehrlich euren Rahmen. Ich rechne mit rund
      400 € pro Person plus Anreise. Falls das für jemanden zu viel ist,
      schreibt mir kurz privat, dann suchen wir gemeinsam etwas anderes.

      Unterkunft: Ich würde ein Haus statt Hotel vorschlagen — dann
      können wir auch mal selbst kochen, und das drückt die Kosten
      spürbar.

      Aufgaben: Ich mache die Unterkunft, Lena die Anreise, Jonas die
      Verpflegung. Passt das so?

      Die Anzahlung von 20 % lege ich aus, sobald der Termin steht. Ihr
      überweist mir euren Anteil dann innerhalb einer Woche.

      **Nachricht 2 — die Abrechnung**

      So, die Abrechnung, damit niemand nachrechnen muss.

      Gesamt: Haus 1.800 €, Endreinigung 90 €, Verpflegung 245 €,
      Mietwagen für den einen Ausflug 140 €. Zusammen 2.275 €.

      Das sind 455 € pro Person. Anzahlung habt ihr alle schon gezahlt
      (je 72 €), es bleiben also 383 € pro Person offen. Lena und Jonas
      haben schon überwiesen, danke!

      Die Kaution von 300 € kommt laut Vertrag innerhalb von 14 Tagen
      zurück — die schicke ich euch anteilig weiter, sobald sie da ist.

      Falls jemand eine Position anders sieht, schreibt mir bis Sonntag,
      ich habe alle Belege. Es war ein richtig guter Urlaub — machen wir
      das wieder!
