  - id: B4
    block: B
    type: true-false
    title: "Das Preisverzeichnis lesen"
    instructions: |
      > **Stadtsparkasse — Girokonto Basis**
      >
      > | | |
      > |---|---|
      > | Kontoführung | **4,90 €/Monat** |
      > | bei monatlichem Gehaltseingang ab 1.200 € | **0 €** |
      > | Girocard | inklusive |
      > | Kreditkarte | 29 €/Jahr |
      >
      > - **Bargeld** an eigenen Automaten und im Verbund **kostenlos**,
      >   an Fremdautomaten **4,50 € pro Abhebung**.
      > - **Überweisungen online kostenlos**, am Schalter **1,50 €**.
      > - **Dispozinsen 11,9 %** p. a. Der Rahmen wird nach **drei
      >   Gehaltseingängen** festgelegt.
      > - **Kartensperre** rund um die Uhr über **116 116**, kostenlos.
      > - Widerspruch gegen eine **Lastschrift** bis **8 Wochen** nach
      >   Belastung.
      > - **Kontoauszüge** online kostenlos, gedruckt **0,50 €** pro
      >   Seite.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Wer 1.500 € Gehalt bekommt, zahlt keine Kontoführungsgebühr. — Someone earning €1,500 pays no account fee."
        answer: true
        why: "Ab 1.200 € monatlichem Gehaltseingang kostet die Kontoführung 0 €."
      - q: "Abheben ist überall kostenlos. — Withdrawing cash is free everywhere."
        answer: false
        why: "An Fremdautomaten kostet es 4,50 € pro Abhebung."
      - q: "Eine Überweisung am Schalter kostet extra. — A transfer at the counter costs extra."
        answer: true
        why: "Am Schalter 1,50 €; online kostenlos."
      - q: "Den Dispo bekommt man sofort bei der Eröffnung. — You get the overdraft immediately when opening the account."
        answer: false
        why: "Der Rahmen wird erst nach drei Gehaltseingängen festgelegt."
      - q: "Eine Lastschrift kann man noch nach sechs Wochen zurückgeben. — A direct debit can still be reversed after six weeks."
        answer: true
        why: "Der Widerspruch ist bis 8 Wochen nach Belastung möglich."
      - q: "Die Kartensperre kostet eine Gebühr. — Blocking the card costs a fee."
        answer: false
        why: "„Kartensperre rund um die Uhr über 116 116, kostenlos.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es ums Geld geht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Auf dem Kontoauszug steht eine Abbuchung, die du nicht kennst. — There's a debit on your statement you don't recognise."
        options:
          - { key: a, text: "Erst prüfen, ob es ein Abo ist, dann bei der Bank widersprechen — das geht bis acht Wochen nach der Belastung." }
          - { key: b, text: "Sofort das Konto kündigen." }
          - { key: c, text: "Abwarten, ob es zurückkommt." }
        answer: a
        why: "Die Acht-Wochen-Frist ist dein Recht; sehr oft steckt aber ein vergessenes Abo dahinter."
      - q: "Deine Karte steckt im Automaten fest. — Your card is stuck in the machine."
        options:
          - { key: a, text: "Am Automaten bleiben, sofort sperren lassen und der Bank sagen, welcher Automat es war." }
          - { key: b, text: "Nach Hause gehen und morgen fragen." }
          - { key: c, text: "Versuchen, sie herauszuziehen." }
        answer: a
        why: "Erst weggehen, wenn gesperrt ist — sonst kann jemand die Karte mit deiner PIN benutzen."
      - q: "Du bist ins Minus gerutscht und siehst hohe Zinsen. — You've slipped into overdraft and see high interest."
        options:
          - { key: a, text: "Weiter im Dispo bleiben." }
          - { key: b, text: "Bei der Bank nach einem Ratenkredit fragen — der ist meist deutlich günstiger als der Dispo." }
          - { key: c, text: "Das Konto wechseln." }
        answer: b
        why: "Fast 12 % Dispozinsen sind teuer; ein Ratenkredit kostet meist weniger als die Hälfte."
      - q: "Man verlangt bei der Eröffnung Papiere, die du nicht hast. — At the opening you're asked for documents you don't have."
        options:
          - { key: a, text: "Es woanders versuchen." }
          - { key: b, text: "Fragen, ob eine andere Bescheinigung reicht und ob du sie nachreichen kannst." }
          - { key: c, text: "Ohne Papiere darauf bestehen." }
        answer: b
        why: "Oft geht auch eine andere Bescheinigung — und Nachreichen ist meistens möglich."
      - q: "Du verstehst den Berater nicht, weil er sehr schnell spricht. — You don't follow the adviser because he speaks fast."
        options:
          - { key: a, text: "Unterschreiben und zu Hause lesen." }
          - { key: b, text: "Nicken." }
          - { key: c, text: "Entschuldigung, könnten Sie das langsamer erklären? Bei Geldsachen möchte ich sichergehen, dass ich alles verstehe." }
        answer: c
        why: "Nichts unterschreiben, was du nicht verstanden hast — die Begründung macht die Bitte selbstverständlich."
      - q: "Dir wird ein Produkt angeboten, das du nicht brauchst. — You're offered a product you don't need."
        options:
          - { key: a, text: "Danke, das brauche ich im Moment nicht. Erst mal nur das Girokonto, bitte." }
          - { key: b, text: "Zustimmen, um höflich zu sein." }
          - { key: c, text: "Ich muss darüber nachdenken." }
        answer: a
        why: "Freundlich und klar ablehnen; „darüber nachdenken“ verlängert das Gespräch nur."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Für die Miete richte ich einen {1} ein. (immer derselbe Betrag)
      2. Für den Strom erteile ich ein {2}. (die Firma holt das Geld)
      3. Bitte {3} Sie meine Karte sofort. (unbrauchbar machen)
      4. Diese Abbuchung habe ich nicht {4}. (in Auftrag gegeben)
      5. Der {5} kostet fast 12 % Zinsen. (Rahmen fürs Minus)
      6. Die {6} kostet 4,90 € im Monat. (Preis für das Konto)
    answers:
      "1": Dauerauftrag
      "2": Lastschriftmandat
      "3": sperren
      "4": veranlasst
      "5": Dispo
      "6": Kontoführung

