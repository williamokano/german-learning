  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Die Kontoeröffnung"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich möchte ein {1} eröffnen.
      — Gern. Haben Sie Ihren Ausweis und eine {2} dabei?
      — Ja, Ausweis und die Meldebescheinigung vom Bürgeramt.
      — Perfekt, damit machen wir die {3}. Was kostet das Konto? — Bei
      Gehaltseingang nichts, sonst 4,90 € {4}.
      — Und wie hoch ist der {5}?
      — Das legen wir nach drei Gehaltseingängen fest.
      — Verstehe. Wann bekomme ich die {6}?
      — In etwa fünf Werktagen. Karte und {7} kommen getrennt, aus
      Sicherheitsgründen.
      — Alles klar. Ich möchte außerdem die Miete jeden Monat
      überweisen — geht das automatisch?
      — Dafür richten wir einen {8} ein. Für Strom und Handy ist eine
      {9} praktischer, da holen die Firmen den Betrag selbst.
      — Gut. Und {10} kann ich das später selbst ändern?
      — Alles im Online-Banking, die Zugangsdaten kommen mit der Post.
    bank: [GIROKONTO, MELDEBESCHEINIGUNG, LEGITIMATION, MONATLICH, DISPO, KARTE, PIN, DAUERAUFTRAG, LASTSCHRIFT, WO, IBAN, GEBÜHR, WANN, KONTO]
    answers:
      "1": GIROKONTO
      "2": MELDEBESCHEINIGUNG
      "3": LEGITIMATION
      "4": MONATLICH
      "5": DISPO
      "6": KARTE
      "7": PIN
      "8": DAUERAUFTRAG
      "9": LASTSCHRIFT
      "10": WO

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst ein Konto eröffnen. — You want to open an account."
        options:
          - { key: a, text: "Ich brauche ein Konto." }
          - { key: b, text: "Guten Tag, ich möchte ein Girokonto eröffnen. Was brauchen Sie von mir?" }
          - { key: c, text: "Kann ich hier Geld einzahlen?" }
        answer: b
        why: "Das Wort „Girokonto“ plus die Frage nach den Unterlagen bringt das Gespräch in einem Satz auf Kurs."
      - q: "Du willst wissen, was das Konto kostet. — You want to know what the account costs."
        options:
          - { key: a, text: "Ist das kostenlos?" }
          - { key: b, text: "Was kostet die Kontoführung monatlich — und gibt es Bedingungen dafür?" }
          - { key: c, text: "Ich will nichts zahlen." }
        answer: b
        why: "Nach den Bedingungen zu fragen ist der Punkt: „kostenlos“ gilt fast immer nur mit Gehaltseingang."
      - q: "Du willst die Miete jeden Monat automatisch zahlen. — You want to pay the rent automatically each month."
        options:
          - { key: a, text: "Ich richte einen Dauerauftrag ein — immer derselbe Betrag zum Ersten." }
          - { key: b, text: "Ich gebe eine Lastschrift." }
          - { key: c, text: "Ich überweise jeden Monat neu." }
        answer: a
        why: "Fester Betrag zum festen Termin: das ist genau der Dauerauftrag, nicht die Lastschrift."
      - q: "Der Stromanbieter soll den Betrag selbst holen. — The electricity provider should collect the amount itself."
        options:
          - { key: a, text: "Dauerauftrag." }
          - { key: b, text: "Ich erteile ein Lastschriftmandat — der Betrag ändert sich ja jedes Jahr." }
          - { key: c, text: "Überweisung." }
        answer: b
        why: "Wechselnde Beträge gehören zur Lastschrift; ein Dauerauftrag müsste jedes Mal angepasst werden."
      - q: "Du verstehst einen Begriff nicht. — You don't understand a term."
        options:
          - { key: a, text: "Ja, verstehe." }
          - { key: b, text: "Können Sie mir erklären, was genau ein Dispokredit ist?" }
          - { key: c, text: "Das ist mir zu kompliziert." }
        answer: b
        why: "Beim Geld ist Nachfragen wichtiger als anderswo — ein Dispo kostet zweistellige Zinsen."
      - q: "Deine Karte ist weg. — Your card is gone."
        options:
          - { key: a, text: "Morgen in die Filiale gehen." }
          - { key: b, text: "Erst zu Hause suchen." }
          - { key: c, text: "Sofort sperren lassen — über die Bank oder den Sperr-Notruf 116 116." }
        answer: c
        why: "Sperren geht rund um die Uhr und kostet nichts; Suchen kann man danach immer noch."

