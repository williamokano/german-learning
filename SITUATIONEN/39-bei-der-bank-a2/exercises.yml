lesson: "SIT/39-bei-der-bank-a2"
title: "Bei der Bank: Konto eröffnen — A2"
topic: "Konto und Karte"
category: "Geld & Verträge"
level: A2
summary: "Girokonto eröffnen, Unterlagen und Legitimation, Karte und PIN, Gebühren verstehen, Dauerauftrag einrichten und Karte sperren."
intro: >
  Ohne Girokonto geht in Deutschland wenig: Miete, Gehalt, Strom und
  Handy laufen darüber. Das Gespräch bei der Kontoeröffnung ist
  überschaubar, aber es hat seine eigenen Wörter — Legitimation,
  Kontoführungsgebühr, Dispo, Dauerauftrag, Lastschrift. Wichtig ist,
  dass du den Unterschied zwischen den beiden Zahlungsarten verstehst:
  Beim Dauerauftrag schickst du selbst regelmäßig denselben Betrag,
  bei der Lastschrift holt sich der andere das Geld. Dazu die Fälle,
  die jeder einmal hat: Karte weg, PIN vergessen, eine Abbuchung, die
  nicht stimmt. Grammatik nach Bedarf: Passiv, indirekte Fragen,
  Modalverben. Blocks: A Wortschatz & Redemittel → B Dialoge →
  C Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

