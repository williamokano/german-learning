      "8": Nachzahlung
      "9": Guthaben
      "10": geantwortet
      "11": verweigert
      "12": angewendet
      "13": bezahlt
      "14": widersprochen

  - id: D2
    block: D
    type: free-write
    title: "Prüfen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: die Abrechnung prüfen und Belegeinsicht verlangen, ein Problem mit einem falschen Verteilerschlüssel, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du bekommst die Nebenkostenabrechnung und musst 340 Euro
      nachzahlen. Nach der Belegeinsicht entdeckst du, dass der
      Verteilerschlüssel für die Gartenpflege eindeutig falsch
      angewendet wurde.

      Beim Prüfen müssen vorkommen:
      1. die Abrechnung erhalten und die Nachzahlung bemerken
      2. Einsicht in die Belege verlangen
      3. die Belege im Detail durchgehen

      Beim Problem müssen vorkommen:
      4. den falschen Verteilerschlüssel entdecken
      5. schriftlich widersprechen
      6. eine Frist zur Korrektur setzen

      In der Lösung müssen vorkommen:
      7. eine Antwort vom Vermieter bekommen
      8. die korrigierte Abrechnung erhalten
      9. eine niedrigere Nachzahlung feststellen
      10. sich über die erfolgreiche Korrektur freuen
    use:
      - "höfliche Bitte: „Können Sie mir Einsicht in die Belege gewähren?“"
      - "Konjunktiv II im Passiv: „Falls ein Fehler gefunden würde, …“"
      - "Perfekt: „Wir haben einen Widerspruch eingereicht.“"
    selfCheck:
      - "Wird die Prüfung der Abrechnung klar beschrieben?"
      - "Klingt die Reaktion auf den Fehler sachlich und bestimmt?"
      - "Wird die korrigierte Abrechnung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Prüfen**

      Ich: Ich habe die Nebenkostenabrechnung bekommen — ich soll 340 Euro nachzahlen, das kommt mir hoch vor.
      Freund: Hast du schon Einsicht in die Belege verlangt?
      Ich: Noch nicht, das mache ich gleich morgen.

      **Das Problem**

      (nach der Belegeinsicht)
      Ich: Ich habe die Belege geprüft, und der Verteilerschlüssel für die Gartenpflege ist eindeutig falsch berechnet.
      Freund: Dann solltest du schriftlich widersprechen und eine Frist setzen.
      Ich: Genau, das mache ich noch heute.

      **Die Lösung**

      (drei Wochen später)
      Vermieter: Sie haben recht, wir haben die Abrechnung korrigiert.
      Ich: Und wie hoch ist die Nachzahlung jetzt?
      Vermieter: Nur noch 90 Euro statt 340 Euro.
      Ich: Perfekt, ich bin so froh, dass sich das Nachfragen gelohnt hat!
