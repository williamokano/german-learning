lesson: "SIT/83-gratulieren-kondolieren-a2"
title: "Gratulieren und kondolieren — A2"
topic: "Gratulieren und kondolieren"
category: "Soziales"
level: A2
summary: "Zum Geburtstag gratulieren, sich für gute Neuigkeiten freuen, bei einem Trauerfall kondolieren — und was tun, wenn man die richtigen Worte nicht sofort findet."
intro: >
  Ob Geburtstag oder Trauerfall — die passenden Worte zu finden ist
  nicht immer leicht: herzlich gratulieren, sich mit jemandem freuen,
  oder bei einem Trauerfall einfühlsam kondolieren. Dieses Set übt
  genau das — zu freudigen Anlässen gratulieren, bei einem Trauerfall
  die Anteilnahme ausdrücken, und was zu tun ist, wenn man unsicher
  ist, was man sagen soll. Grammatik nach Bedarf: Perfekt im Bericht,
  höfliche Fragen, Nebensätze mit falls. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

