  - id: D2
    block: D
    type: free-write
    title: "Gratulieren, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: einem Freund zum Geburtstag gratulieren und einem Kollegen kondolieren, ein Problem, weil du unsicher bist, was du sagen sollst, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du gratulierst einem Freund herzlich zum Geburtstag. Kurz
      danach erfährst du, dass der Großvater eines Kollegen gestorben
      ist, und bist dir unsicher, was du sagen sollst.

      Beim Gratulieren müssen vorkommen:
      1. herzlich zum Geburtstag gratulieren
      2. ein kleines Geschenk überreichen
      3. sich für die guten Neuigkeiten des Freundes freuen

      Beim Problem müssen vorkommen:
      4. vom Trauerfall des Kollegen erfahren
      5. unsicher sein, was man sagen soll
      6. sich Zeit nehmen, um die richtigen Worte zu finden

      In der Lösung müssen vorkommen:
      7. dem Kollegen das Beileid aussprechen
      8. die eigene Anteilnahme zeigen
      9. Hilfe anbieten
      10. sich darüber freuen, dass die Worte gut ankamen
    use:
      - "höfliche Frage: „Kannst du mir helfen, die Karte auszusuchen?“"
      - "Nebensatz mit falls: „Falls jemand einen nahen Menschen verliert, …“"
      - "Perfekt: „Wir haben unser Beileid ausgesprochen.“"
    selfCheck:
      - "Wird die Gratulation herzlich formuliert?"
      - "Klingt die Unsicherheit beim Kondolieren nachvollziehbar?"
      - "Wird die Anteilnahme am Ende klar ausgedrückt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Gratulieren**

      Ich: Herzlichen Glückwunsch zum Geburtstag! Ich habe dir eine kleine Kleinigkeit mitgebracht.
      Freund: Oh, vielen Dank, das ist aber lieb von dir!
      Ich: Ich freue mich auch total für dich wegen deines neuen Jobs.

      **Das Problem**

      (ein paar Tage später)
      Ich: Ich habe gehört, dass der Großvater von Tom gestorben ist. Ich weiß gar nicht, was ich sagen soll.
      Kollegin: Nimm dir einfach Zeit, ehrliche Worte reichen völlig.
      Ich: Gut, dann versuche ich es.

      **Die Lösung**

      Ich: Tom, ich möchte dir mein Beileid aussprechen. Meine Anteilnahme gilt deiner ganzen Familie.
      Tom: Das ist sehr freundlich von dir, danke.
      Ich: Falls du Hilfe brauchst, melde dich einfach.
      Tom: Das mache ich — deine Worte haben mir wirklich gutgetan.
