  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Gratulieren und Kondolieren lesen"
    instructions: |
      > **Info — Gratulieren und kondolieren**
      >
      > - **Geburtstagsglückwünsche:** am besten **am Tag selbst**,
      >   spätestens innerhalb einer Woche.
      > - **Beileid:** sollte **möglichst bald** nach dem Trauerfall
      >   ausgesprochen werden.
      > - **Beileidskarte:** wirkt persönlicher, wenn sie
      >   **handschriftlich** geschrieben ist.
      > - **Worte:** einfache, ehrliche Worte sind oft
      >   **wirkungsvoller** als lange Reden.
      > - **Trauerfeier:** ein Besuch ist eine schöne Geste, aber
      >   **keine Pflicht**.
      > - **Nach der Beerdigung:** weiterhin **Kontakt halten**
      >   hilft der trauernden Familie oft am meisten.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Geburtstagsglückwünsche sollten am besten am Tag selbst kommen, spätestens innerhalb einer Woche. — Birthday wishes should ideally come on the day itself, at the latest within a week."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Gratulieren."
      - q: "Beileid sollte man am besten erst nach mehreren Monaten aussprechen. — Condolences should ideally be offered only after several months."
        answer: false
        why: "Es sollte möglichst bald nach dem Trauerfall ausgesprochen werden, nicht erst Monate später."
      - q: "Eine handschriftliche Beileidskarte wirkt persönlicher. — A handwritten sympathy card feels more personal."
        answer: true
        why: "„Beileidskarte: wirkt persönlicher, wenn sie handschriftlich geschrieben ist.“"
      - q: "Lange, kunstvolle Reden sind bei einem Trauerfall immer wirkungsvoller als einfache, ehrliche Worte. — Long, elaborate speeches are always more effective than simple, honest words at a funeral."
        answer: false
        why: "Einfache, ehrliche Worte sind oft wirkungsvoller als lange Reden."
      - q: "Ein Besuch der Trauerfeier ist eine Pflicht, die man unbedingt erfüllen muss. — Attending the funeral is a duty that must absolutely be fulfilled."
        answer: false
        why: "Er ist eine schöne Geste, aber keine Pflicht."
      - q: "Nach der Beerdigung weiterhin Kontakt zu halten hilft der trauernden Familie oft am meisten. — Staying in touch after the funeral often helps the grieving family the most."
        answer: true
        why: "„Nach der Beerdigung: weiterhin Kontakt halten hilft der trauernden Familie oft am meisten.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Gratulieren oder Kondolieren etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Man vergisst, rechtzeitig zum Geburtstag zu gratulieren. — You forget to congratulate someone on their birthday in time."
        options:
          - { key: a, text: "Einfach gar nichts mehr sagen, aus Scham." }
          - { key: b, text: "Sich ehrlich entschuldigen und trotzdem noch herzlich gratulieren." }
          - { key: c, text: "So tun, als hätte man es gar nicht vergessen." }
        answer: b
        why: "Eine ehrliche Entschuldigung mit nachträglicher Gratulation wird meist gut aufgenommen."
      - q: "Man findet einfach keine passenden Worte für ein Kondolenzschreiben. — You simply can't find the right words for a condolence letter."
        options:
          - { key: a, text: "Lieber gar nichts schreiben, aus Angst vor den falschen Worten." }
          - { key: b, text: "Eine unpersönliche Standardkarte ohne eigene Worte kaufen." }
          - { key: c, text: "Einfache, ehrliche Worte wählen statt nach der perfekten Formulierung zu suchen." }
        answer: c
        why: "Einfache, ehrliche Worte kommen meist besser an als eine perfekt gesuchte Formulierung."
      - q: "Man ist sich unsicher, ob ein Kondolenzbesuch gerade willkommen ist. — You're unsure whether a condolence visit is currently welcome."
        options:
          - { key: a, text: "Vorher freundlich nachfragen, ob ein Besuch passt." }
          - { key: b, text: "Einfach unangemeldet vorbeikommen." }
          - { key: c, text: "Aus Unsicherheit lieber gar nichts unternehmen." }
        answer: a
        why: "Eine freundliche Nachfrage zeigt Rücksicht auf die Situation der trauernden Person."
      - q: "Eine Geburtstagskarte kommt aus Versehen viel zu spät an. — A birthday card accidentally arrives much too late."
        options:
          - { key: a, text: "Die Karte gar nicht mehr übergeben, aus Verlegenheit." }
          - { key: b, text: "Sich für die Verspätung entschuldigen und die Karte trotzdem übergeben." }
          - { key: c, text: "So tun, als wäre die Karte pünktlich gewesen." }
        answer: b
        why: "Eine kurze Entschuldigung mit der verspäteten Karte wirkt ehrlich und sympathisch."
      - q: "Man weiß nicht, ob man bei einem Trauerfall überhaupt etwas sagen soll. — You don't know whether to say anything at all in a case of bereavement."
        options:
          - { key: a, text: "Aus Unsicherheit lieber ganz schweigen." }
          - { key: b, text: "Das Thema komplett vermeiden." }
          - { key: c, text: "Kurz die eigene Anteilnahme ausdrücken, auch ohne viele Worte." }
        answer: c
        why: "Auch wenige, ehrliche Worte der Anteilnahme werden meist sehr geschätzt."
      - q: "Man merkt, dass die eigene Gratulation etwas unbeholfen klang. — You notice your own congratulations sounded a bit awkward."
        options:
          - { key: a, text: "Es locker nehmen, die Geste zählt mehr als die perfekte Formulierung." }
          - { key: b, text: "Sich den ganzen Tag darüber ärgern." }
          - { key: c, text: "Die Gratulation am liebsten zurücknehmen." }
        answer: a
        why: "Die gute Absicht zählt meist mehr als eine perfekte Formulierung."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
