    answers:
      "1": GLÜCKWUNSCH
      "2": KLEINIGKEIT
      "3": FREUE
      "4": BEILEID
      "5": TRAUERFALL
      "6": ANTEILNAHME
      "7": BEILEIDSKARTE
      "8": SAGEN
      "9": BRAUCHT
      "10": MACHE

  - id: B2
    block: B
    type: single-choice
    title: "Gratulieren und Anteilnahme zeigen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einem Freund zum Geburtstag gratulieren. — You want to congratulate a friend on their birthday."
        options:
          - { key: a, text: "Geburtstage interessieren mich nicht." }
          - { key: b, text: "Herzlichen Glückwunsch zum Geburtstag!" }
          - { key: c, text: "Ach, schon wieder ein Jahr älter." }
        answer: b
        why: "Eine herzliche Gratulation ist die übliche, freundliche Reaktion auf einen Geburtstag."
      - q: "Du möchtest dich für den neuen Job eines Freundes freuen. — You want to express your joy about a friend's new job."
        options:
          - { key: a, text: "Jobs interessieren mich nicht." }
          - { key: b, text: "Das ist doch nichts Besonderes." }
          - { key: c, text: "Ich freue mich total für dich, dass du diesen tollen neuen Job bekommen hast." }
        answer: c
        why: "Eine herzliche Mitfreude ist die passende Reaktion auf gute Neuigkeiten."
      - q: "Du möchtest einem Kollegen dein Beileid aussprechen. — You want to offer your condolences to a colleague."
        options:
          - { key: a, text: "Ich möchte dir mein Beileid aussprechen." }
          - { key: b, text: "Beileid ist mir zu förmlich." }
          - { key: c, text: "Das interessiert mich eigentlich nicht." }
        answer: a
        why: "Ein direkt ausgesprochenes Beileid ist die übliche und einfühlsame Reaktion."
      - q: "Du möchtest deine Anteilnahme ausdrücken. — You want to express your sympathy."
        options:
          - { key: a, text: "Anteilnahme ist mir zu kompliziert." }
          - { key: b, text: "Meine Anteilnahme gilt deiner ganzen Familie." }
          - { key: c, text: "Das geht mich doch nichts an." }
        answer: b
        why: "Eine ausgesprochene Anteilnahme zeigt echtes Mitgefühl mit der ganzen Familie."
      - q: "Du möchtest wissen, ob eine Beileidskarte oder ein persönliches Gespräch besser passt. — You want to know whether a sympathy card or a personal conversation is better."
        options:
          - { key: a, text: "Karten interessieren mich nicht." }
          - { key: b, text: "Das ist mir völlig egal." }
          - { key: c, text: "Soll ich euch eine Beileidskarte schicken, oder möchtest du das lieber persönlich sagen?" }
        answer: c
        why: "Eine rücksichtsvolle Nachfrage lässt der trauernden Person die Wahl."
      - q: "Ein Freund bietet dir seine Hilfe an. — A friend offers you their help."
        options:
          - { key: a, text: "Das mache ich, danke dir." }
          - { key: b, text: "Hilfe brauche ich sowieso nicht." }
          - { key: c, text: "Das interessiert mich nicht." }
        answer: a
        why: "Eine dankbare Annahme des Angebots ist die freundliche und passende Antwort."

