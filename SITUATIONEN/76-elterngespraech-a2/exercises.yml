lesson: "SIT/76-elterngespraech-a2"
title: "In der Schule: Elterngespräch, Entschuldigung, Klassenfahrt — A2"
topic: "In der Schule: Elterngespräch, Entschuldigung, Klassenfahrt"
category: "Arbeit & Studium"
level: A2
summary: "Ein Elterngespräch führen, Fehlzeiten entschuldigen, die Einverständniserklärung für die Klassenfahrt unterschreiben — und was tun, wenn ein Termin nicht passt oder das Kind plötzlich nicht mitfahren möchte."
intro: >
  Der Schulalltag der Kinder bringt auch für Eltern einiges mit sich:
  ein Elterngespräch vereinbaren, eine Entschuldigung für Fehlzeiten
  schreiben, die Einverständniserklärung für die Klassenfahrt
  unterschreiben. Dieses Set übt genau das — im Elterngespräch über
  Fehlzeiten und Noten sprechen, die Klassenfahrt organisieren, und was
  zu tun ist, wenn ein Termin nicht passt oder das Kind plötzlich nicht
  mitfahren möchte. Grammatik nach Bedarf: Perfekt im Bericht, höfliche
  Fragen, Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Vor dem Gespräch, im Gespräch oder rund um die Klassenfahrt?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: vorher, label: "Vor dem Gespräch" }
      - { key: gespraech, label: "Im Gespräch" }
      - { key: klassenfahrt, label: "Rund um die Klassenfahrt" }
    tokens:
      - { text: "einen Termin für ein Elterngespräch vereinbaren", bucket: vorher }
      - { text: "sich Notizen machen", bucket: vorher }
      - { text: "Fragen vorbereiten", bucket: vorher }
      - { text: "pünktlich erscheinen", bucket: vorher }
      - { text: "über die Fehlzeiten sprechen", bucket: gespraech }
      - { text: "nach den Noten fragen", bucket: gespraech }
      - { text: "Sorgen ansprechen", bucket: gespraech }
      - { text: "gemeinsam eine Lösung finden", bucket: gespraech }
      - { text: "die Einverständniserklärung unterschreiben", bucket: klassenfahrt }
      - { text: "den Kostenbeitrag überweisen", bucket: klassenfahrt }
      - { text: "die Packliste durchgehen", bucket: klassenfahrt }
      - { text: "das Kind am Bus verabschieden", bucket: klassenfahrt }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
