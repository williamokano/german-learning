      - { key: "2", text: "die Entschuldigung" }
      - { key: "3", text: "die Klassenfahrt" }
      - { key: "4", text: "die Einverständniserklärung" }
      - { key: "5", text: "die Klassenlehrerin" }
      - { key: "6", text: "die Fehlzeit" }
      - { key: "7", text: "der Elternsprechtag" }
      - { key: "8", text: "das Zeugnis" }
    right:
