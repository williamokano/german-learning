      "2": möchten
      "3": viert
      "4": Könnten
      "5": Terrasse
      "6": gebucht
      "7": verschieben
      "8": stornieren
      "9": Warteliste
      "10": System
      "11": klein
      "12": später
      "13": ["No-Show-Gebühr", "Nichterscheinensgebühr"]
      "14": drinnen

  - id: D2
    block: D
    type: free-write
    title: "Reservieren, umbuchen, ankommen"
    prompt: "Schreib drei Teile: das erste Reservierungsgespräch, den Anruf zur Umbuchung und das Gespräch beim Ankommen. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr reserviert am Montag telefonisch einen Tisch für vier Personen,
      Freitagabend, 19 Uhr, auf den Namen Keller. Am Donnerstag merkt ihr,
      dass ihr zu sechst kommt und die Uhrzeit auf 20 Uhr verschieben
      müsst. Am Freitag kommt ihr an und der Tisch ist im System nur für
      vier Personen eingetragen.

      Im ersten Gespräch müssen vorkommen:
      1. höflich einen Tisch für vier Personen erbitten
      2. Uhrzeit und Datum nennen
      3. den Namen für die Reservierung buchstabieren
      4. drinnen oder draußen wählen

      Im Anruf zur Umbuchung müssen vorkommen:
      5. sagen, dass sich die Personenzahl geändert hat
      6. höflich um eine neue Uhrzeit bitten
      7. eine Bestätigung der Änderung erfragen

      Beim Ankommen müssen vorkommen:
      8. ruhig auf den Fehler im System hinweisen
      9. Namen und ursprüngliche Angaben wiederholen
      10. sich für eine Lösung bedanken
    use:
      - "höfliche Bitten: „Ich hätte gern …“, „Könnten Sie …?“"
      - "Modalverben: möchten, können, müssen"
      - "Perfekt bei Rückfragen: „Wir haben letzte Woche reserviert.“"
      - "Nebensatz mit falls: „Falls sich etwas ändert, rufen wir an.“"
    selfCheck:
      - "Ist die erste Bitte höflich formuliert (hätte gern / möchte)?"
      - "Steht der Infinitiv bei den Modalverben wirklich am Satzende?"
      - "Klingt der Hinweis auf den Fehler beim Ankommen ruhig, nicht vorwurfsvoll?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Das erste Reservierungsgespräch**

      Restaurant: Restaurant Lindenhof, guten Tag.
      Ich: Guten Tag, ich hätte gern einen Tisch für vier Personen, für Freitagabend um 19 Uhr.
      Restaurant: Sehr gern. Auf welchen Namen darf ich reservieren?
      Ich: Keller, K-E-L-L-E-R.
      Restaurant: Möchten Sie drinnen oder auf der Terrasse sitzen?
      Ich: Wenn möglich, drinnen am Fenster.
      Restaurant: Kein Problem, ich trage Sie ein.

      **Der Anruf zur Umbuchung**

      Ich: Guten Tag, ich habe für Freitag um 19 Uhr auf den Namen Keller reserviert. Wir sind jetzt leider zu sechst statt zu viert.
      Restaurant: Kein Problem, ich schaue nach einem größeren Tisch. Passt Ihnen weiterhin 19 Uhr?
      Ich: Könnten wir stattdessen auf 20 Uhr verschieben? Das würde besser passen.
      Restaurant: Gerne, ich ändere das. Für sechs Personen, 20 Uhr, auf den Namen Keller.
      Ich: Können Sie mir das kurz bestätigen? Vielen Dank.

      **Beim Ankommen**

      Ich: Guten Abend, wir haben für 20 Uhr auf den Namen Keller reserviert, für sechs Personen.
      Personal: Einen Moment — hier steht leider nur ein Tisch für vier Personen.
      Ich: Das ist merkwürdig, wir hatten am Donnerstag telefonisch auf sechs Personen geändert. Vielleicht ist das nicht übernommen worden.
      Personal: Entschuldigung, das prüfen wir sofort. Wir stellen Ihnen zwei Tische zusammen.
      Ich: Das wäre super, vielen Dank für die schnelle Lösung.
