lesson: "SIT/42-tisch-reservieren-a2"
title: "Tisch reservieren und umbuchen — A2"
topic: "Tisch reservieren"
category: "Essen & Trinken"
level: A2
summary: "Telefonisch einen Tisch reservieren, auf den Namen buchen, umbuchen, stornieren — und was tun, wenn beim Ankommen etwas nicht stimmt."
intro: >
  Einen Tisch zu reservieren ist unkompliziert, bis etwas dazwischenkommt:
  Ihr werdet mehr, die Uhrzeit passt plötzlich nicht mehr, oder ihr müsst
  ganz absagen. Dieses Set übt genau das — telefonisch reservieren, auf
  den Namen buchen, umbuchen und stornieren, dazu die kleinen Reibungen,
  die dabei entstehen: der Tisch ist nicht im System, die Reservierung
  war für eine andere Uhrzeit, ihr kommt zu spät. Grammatik nach Bedarf:
  Modalverben (können, möchten), höfliche Konjunktiv-II-Bitten (Könnten
  Sie …?, Wäre es möglich …?), Nebensätze mit falls/ob. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

