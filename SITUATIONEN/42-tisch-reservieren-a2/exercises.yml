      - { text: "Haben Sie noch einen Tisch frei, wir haben nicht reserviert.", bucket: tuer }
      - { text: "Ich fülle das Formular auf der Webseite aus.", bucket: online }
      - { text: "Auf welchen Namen darf ich die Reservierung notieren?", bucket: telefon }
      - { text: "Wir sind spontan vorbeigekommen.", bucket: tuer }
      - { text: "Ich wähle die Uhrzeit im Buchungssystem aus.", bucket: online }
      - { text: "Guten Tag, ich würde gern einen Tisch reservieren.", bucket: telefon }
      - { text: "Können wir warten, bis ein Tisch frei wird?", bucket: tuer }
      - { text: "Ich bekomme eine Bestätigung per E-Mail.", bucket: online }
      - { text: "Für wie viele Personen soll ich reservieren?", bucket: telefon }
      - { text: "Gibt es noch Plätze an der Theke?", bucket: tuer }
      - { text: "Ich klicke auf „Reservierung bestätigen“.", bucket: online }

