  - id: B4
    block: B
    type: true-false
    title: "Die Liefer-Infos lesen"
    instructions: |
      > **Info — Lieferung und Aufbau**
      >
      > - **Liefertermin:** wird **mindestens 3 Werktage vorher**
      >   telefonisch bestätigt.
      > - **Aufbauservice:** kostet zusätzlich **49 Euro**, inklusive
      >   Anfahrt.
      > - **Reklamation:** ein Schaden muss **innerhalb von 48 Stunden**
      >   nach Lieferung gemeldet werden.
      > - **Ersatzlieferung:** dauert in der Regel **5 bis 7 Werktage**.
      > - **Aufzug:** wenn vorhanden, wird er von den Lieferanten
      >   genutzt — sonst wird bis zur **3. Etage** kostenlos getragen.
      > - **Lieferschein:** sollte erst nach kurzer **Prüfung der Ware**
      >   unterschrieben werden.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Der Liefertermin wird mindestens drei Werktage vorher telefonisch bestätigt. — The delivery date is confirmed by phone at least three working days ahead."
        answer: true
        why: "So steht es ausdrücklich in den Liefer-Infos."
      - q: "Der Aufbauservice ist im Kaufpreis inklusive und kostet nichts extra. — Assembly is included in the price and costs nothing extra."
        answer: false
        why: "Er kostet zusätzlich 49 Euro, inklusive Anfahrt."
      - q: "Ein Schaden muss innerhalb von 48 Stunden nach der Lieferung gemeldet werden. — A defect must be reported within 48 hours of delivery."
        answer: true
        why: "„Reklamation: ein Schaden muss innerhalb von 48 Stunden nach Lieferung gemeldet werden.“"
      - q: "Eine Ersatzlieferung dauert normalerweise nur ein bis zwei Tage. — A replacement delivery usually only takes one or two days."
        answer: false
        why: "Sie dauert in der Regel 5 bis 7 Werktage, nicht ein bis zwei Tage."
      - q: "Ohne Aufzug wird bis zur dritten Etage kostenlos getragen. — Without an elevator, carrying is free up to the third floor."
        answer: true
        why: "„Sonst wird bis zur 3. Etage kostenlos getragen.“"
      - q: "Der Lieferschein sollte man unterschreiben, ohne die Ware anzusehen. — The delivery slip should be signed without looking at the goods."
        answer: false
        why: "Er sollte erst nach kurzer Prüfung der Ware unterschrieben werden."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei Lieferung und Aufbau etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die Lieferung kommt trotz vereinbartem Termin nicht. — Delivery doesn't arrive despite the agreed date."
        options:
          - { key: a, text: "Die Bestellung wütend stornieren, ohne nachzufragen." }
          - { key: b, text: "Sofort beim Kundendienst nachfragen, wo die Lieferung bleibt." }
          - { key: c, text: "Einfach weiter warten, ohne nachzufragen." }
        answer: b
        why: "Eine schnelle Nachfrage klärt meist sofort, was los ist."
      - q: "Das gelieferte Möbelstück hat die falsche Farbe. — The delivered piece is the wrong color."
        options:
          - { key: a, text: "Es trotzdem behalten und nichts sagen." }
          - { key: b, text: "Das Möbelstück selbst umlackieren." }
          - { key: c, text: "Beim Möbelhaus den Fehler melden und den Umtausch klären." }
        answer: c
        why: "Den Fehler zu melden ist der einzige Weg zu einem passenden Ersatz."
      - q: "Der Aufbauservice erscheint nicht zum vereinbarten Termin. — The assembly service doesn't show up at the agreed time."
        options:
          - { key: a, text: "Beim Kundendienst nachfragen, wo der Aufbauservice bleibt." }
          - { key: b, text: "Das Möbelstück einfach unmontiert stehen lassen für immer." }
          - { key: c, text: "Selbst versuchen, alles ohne Anleitung zu improvisieren." }
        answer: a
        why: "Eine Nachfrage beim Kundendienst klärt schnell, wann der Service tatsächlich kommt."
      - q: "Beim Aufbau fehlen mehrere Schrauben. — Several screws are missing during assembly."
        options:
          - { key: a, text: "Irgendwelche anderen Schrauben aus der Werkzeugkiste nehmen." }
          - { key: b, text: "Beim Kundendienst nach den fehlenden Teilen fragen." }
          - { key: c, text: "Den Schrank ohne die fehlenden Schrauben instabil aufstellen." }
        answer: b
        why: "Die passenden Ersatzteile anzufragen ist sicherer als mit falschen Schrauben zu improvisieren."
      - q: "Das Sofa ist beim Transport stark beschädigt. — The sofa is badly damaged during transport."
        options:
          - { key: a, text: "Den Schaden ignorieren und das Sofa trotzdem benutzen." }
          - { key: b, text: "Sich beim Fahrer laut beschweren und ihn beschimpfen." }
          - { key: c, text: "Den Schaden sofort dokumentieren und fotografieren." }
        answer: c
        why: "Fotos als Beweis erleichtern die Reklamation beim Kundendienst erheblich."
      - q: "Die Ersatzlieferung dauert länger als angekündigt. — The replacement delivery takes longer than announced."
        options:
          - { key: a, text: "Nach einer Woche höflich beim Kundendienst nachfragen." }
          - { key: b, text: "Nichts tun und einfach weiter warten, egal wie lange." }
          - { key: c, text: "Sofort eine schlechte Bewertung im Internet schreiben, ohne nachzufragen." }
        answer: a
        why: "Eine höfliche Nachfrage ist meist wirkungsvoller als eine sofortige Beschwerde ohne Kontaktversuch."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die Lieferung kam trotz Termin nicht — wir haben beim Kundendienst {1}. (nachgefragt, Partizip)
      2. Das Möbelstück hatte die falsche {2}. (nicht die bestellte, sondern eine andere)
      3. Der Aufbauservice ist nicht {3}. (gekommen, Partizip)
      4. Beim Aufbau haben mehrere {4} gefehlt. (kleine Metallteile zum Befestigen)
      5. Das Sofa wurde beim Transport stark {5}. (kaputtgemacht, Partizip)
      6. Wir haben den Schaden sofort {6}. (mit der Kamera festgehalten, Partizip)
    answers:
      "1": nachgefragt
      "2": Farbe
      "3": erschienen
      "4": Schrauben
      "5": beschädigt
      "6": fotografiert

  # ── Block D — Wiederholung ────────────────────────────────────────────────

