  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Lieferung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Wir {1} noch einen Liefertermin vereinbaren. (Modalverb, wir-Form)
      2. {2} Sie mir sagen, wann die Möbel geliefert werden? (können, Sie-Form)
      3. Ich {3} schon die Anzahlung geleistet. (haben, Perfekt)
      4. {4} wir den Aufbauservice dazubuchen? (sollen, wir-Form)
      5. Falls das Sofa nicht {5}, schicken wir es zurück. (passen, Präsens)
      6. Der Kundendienst {6} sich morgen bei uns melden. (werden, Futur I)
      7. Die Lieferanten {7} das Möbelstück beschädigt. (haben, Perfekt)
      8. {8} ich den Schaden sofort reklamieren? (müssen, ich-Form)
    answers:
      "1": müssen
      "2": Können
      "3": habe
      "4": Sollen
      "5": passt
      "6": wird
      "7": haben
      "8": Muss

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Wir vereinbaren mit dem Möbelhaus einen {1}. (der Tag, an dem geliefert wird)
      2. Damit die Möbel gleich zusammengebaut werden, buchen wir den {2}. (der Service zum Zusammenbauen)
      3. Beim Auspacken entdecken wir einen {3} auf der Tischplatte. (kleiner Schaden auf der Oberfläche)
      4. Wir {4} den Schaden sofort beim Kundendienst. (sich offiziell beschweren, wir-Form)
      5. Das Möbelhaus schickt uns als Ersatz eine {5}. (kommt, wenn ein beschädigtes Teil ersetzt wird)
      6. Vor der Lieferung haben wir schon eine {6} geleistet. (ein Teil des Preises im Voraus)
    answers:
      "1": Liefertermin
      "2": Aufbauservice
      "3": Kratzer
      "4": reklamieren
      "5": Ersatzlieferung
      "6": Anzahlung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Bei der Lieferung und beim Kundendienst"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, wir liefern heute Ihr neues Sofa. Könnten Sie bitte
      den {1} unterschreiben?
      — Natürlich, einen Moment ... Oh, hier ist ein {2} auf der
      Armlehne!
      — Das tut mir leid. Ich {3} das sofort im System.
      — Und wie geht es jetzt weiter?
      — Wir schicken Ihnen eine {4}. Das dauert etwa eine Woche.
      (am Telefon, beim Kundendienst)
      — Guten Tag, ich möchte einen {5} für nächste Woche
      vereinbaren.
      — Gerne, welcher Tag {6} Ihnen am besten?
      — Dienstag wäre ideal.
      — In Ordnung. Möchten Sie auch den {7} dazubuchen?
      — Ja bitte, dann wird der Schrank gleich {8}.
      — Perfekt, das {9} extra 49 Euro, {10} Anfahrt.
    bank: [LIEFERSCHEIN, KRATZER, VERMERKE, ERSATZLIEFERUNG, LIEFERTERMIN, PASST, AUFBAUSERVICE, MONTIERT, KOSTET, INKLUSIVE, ANZAHLUNG, KUNDENDIENST, GARANTIE, VERPACKUNG]
    answers:
      "1": LIEFERSCHEIN
      "2": KRATZER
      "3": VERMERKE
      "4": ERSATZLIEFERUNG
      "5": LIEFERTERMIN
      "6": PASST
      "7": AUFBAUSERVICE
      "8": MONTIERT
      "9": KOSTET
      "10": INKLUSIVE

  - id: B2
    block: B
    type: single-choice
    title: "Liefertermin, Aufbau und Reklamation"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest den Liefertermin telefonisch vereinbaren. — You want to arrange the delivery date by phone."
        options:
          - { key: a, text: "Termine sind mir egal." }
          - { key: b, text: "Ich möchte einen Liefertermin für nächste Woche vereinbaren." }
          - { key: c, text: "Liefern Sie einfach, wann Sie wollen." }
        answer: b
        why: "Eine klare, höfliche Anfrage ist der übliche Einstieg beim Möbelhaus."
      - q: "Du entdeckst beim Auspacken einen Kratzer auf dem neuen Tisch. — You notice a scratch on the new table while unpacking."
        options:
          - { key: a, text: "Ach, das ist doch nicht so schlimm, ich sage nichts." }
          - { key: b, text: "Ich schicke den Tisch einfach zurück, ohne etwas zu sagen." }
          - { key: c, text: "Ich reklamiere den Schaden sofort beim Kundendienst." }
        answer: c
        why: "Ein Schaden sollte sofort gemeldet werden, damit er dokumentiert und ersetzt werden kann."
      - q: "Der Lieferant bringt das Möbelstück und möchte, dass du unterschreibst. — The delivery person wants you to sign for it."
        options:
          - { key: a, text: "Ich prüfe die Ware kurz und unterschreibe dann den Lieferschein." }
          - { key: b, text: "Ich unterschreibe, ohne die Ware zu prüfen." }
          - { key: c, text: "Ich weigere mich, überhaupt etwas zu unterschreiben." }
        answer: a
        why: "Eine kurze Prüfung vor der Unterschrift schützt dich, falls schon etwas beschädigt ist."
      - q: "Du möchtest wissen, ob der Aufbauservice zusätzlich kostet. — You want to know whether assembly costs extra."
        options:
          - { key: a, text: "Ich baue das sowieso selbst auf." }
          - { key: b, text: "Kostet der Aufbauservice extra?" }
          - { key: c, text: "Kosten sind mir egal." }
        answer: b
        why: "Eine klare Frage zu den Kosten vermeidet spätere Überraschungen auf der Rechnung."
      - q: "Der Kundendienst bietet dir eine Ersatzlieferung an. — Customer service offers you a replacement delivery."
        options:
          - { key: a, text: "Nein, ich will gar nichts mehr von Ihnen." }
          - { key: b, text: "Das dauert mir zu lange, vergessen Sie es." }
          - { key: c, text: "Gut, wie lange dauert die Ersatzlieferung ungefähr?" }
        answer: c
        why: "Eine konkrete Nachfrage zur Dauer hilft dir bei der weiteren Planung."
      - q: "Du möchtest fragen, ob die Lieferanten den Aufzug im Haus benutzen können. — You want to ask whether the delivery team can use the building's elevator."
        options:
          - { key: a, text: "Können Sie den Aufzug benutzen, oder ist Treppensteigen nötig?" }
          - { key: b, text: "Der Aufzug interessiert mich nicht." }
          - { key: c, text: "Tragen Sie es einfach irgendwie hoch." }
        answer: a
        why: "Eine frühzeitige Frage zum Aufzug erspart Missverständnisse am Liefertag."

  - id: B3
    block: B
    type: order
    title: "Sätze beim Möbelkauf bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "einen", "Liefertermin", "für", "nächste", "Woche", "vereinbaren"]
