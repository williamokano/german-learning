  - id: D2
    block: D
    type: free-write
    title: "Bestellen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: den Liefertermin vereinbaren und den Aufbauservice buchen, ein Problem bei der Lieferung, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du hast einen neuen Schrank gekauft. Du vereinbarst den
      Liefertermin und buchst den Aufbauservice dazu. Bei der Lieferung
      entdeckst du einen Kratzer auf der Tür des Schranks.

      Beim Planen müssen vorkommen:
      1. einen Liefertermin für nächste Woche vereinbaren
      2. fragen, ob der Aufbauservice extra kostet
      3. den Aufbauservice dazubuchen

      Bei der Lieferung müssen vorkommen:
      4. den Lieferschein kurz prüfen
      5. einen Kratzer auf der Schranktür entdecken
      6. den Schaden sofort dokumentieren

      In der Lösung müssen vorkommen:
      7. beim Kundendienst reklamieren
      8. eine Ersatzlieferung angeboten bekommen
      9. sich über die schnelle Lösung freuen
      10. den Schrank am Ende erfolgreich aufgebaut sehen
    use:
      - "höfliche Bitte: „Ich möchte einen Liefertermin vereinbaren.“"
      - "Nebensatz mit falls: „Falls das Sofa nicht passt, …“"
      - "Perfekt: „Wir haben es geschafft.“"
    selfCheck:
      - "Wird der Liefertermin höflich und konkret vereinbart?"
      - "Klingt die Reaktion auf den Kratzer ruhig und lösungsorientiert?"
      - "Wird die Reklamation beim Kundendienst erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Planen**

      Ich: Guten Tag, ich möchte einen Liefertermin für nächste Woche vereinbaren.
      Verkäufer: Gerne, welcher Tag passt Ihnen am besten?
      Ich: Dienstag wäre ideal. Kostet der Aufbauservice extra?
      Verkäufer: Ja, das kostet 49 Euro, inklusive Anfahrt.
      Ich: Gut, dann buchen wir den Aufbauservice dazu.

      **Bei der Lieferung**

      Lieferant: Könnten Sie bitte den Lieferschein unterschreiben?
      Ich: Einen Moment, ich prüfe erst kurz die Ware ... Hier ist ein Kratzer auf der Schranktür!
      Lieferant: Das tut mir leid, ich fotografiere den Schaden sofort.

      **Die Lösung**

      Ich: Ich reklamiere den Schaden beim Kundendienst.
      Kundendienst: Wir schicken Ihnen eine Ersatzlieferung, das dauert etwa eine Woche.
      Ich: Vielen Dank, das ging ja schnell und unkompliziert.
      (eine Woche später)
      Ich: Der Schrank steht endlich fertig aufgebaut im Zimmer — perfekt!
