lesson: "SIT/61-moebelhaus-a2"
title: "Möbelhaus: Lieferung und Aufbau — A2"
topic: "Möbelhaus: Lieferung und Aufbau"
category: "Wohnen & Nachbarschaft"
level: A2
summary: "Einen Liefertermin vereinbaren, den Aufbauservice buchen — und was tun, wenn ein Möbelstück beschädigt ankommt."
intro: >
  Ein neues Sofa oder ein neuer Schrank ist bestellt — jetzt braucht es
  einen Liefertermin, vielleicht den Aufbauservice dazu, und einen klaren
  Kopf, falls beim Auspacken ein Kratzer auftaucht. Dieses Set übt genau
  das: den Liefertermin vereinbaren, den Lieferschein prüfen und
  unterschreiben, und beim Kundendienst reklamieren, wenn etwas
  schiefgeht. Grammatik nach Bedarf: Perfekt im Bericht, höfliche Fragen
  mit Konjunktiv II, Nebensätze mit falls. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

