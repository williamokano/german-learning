lesson: "SIT/15-hausverwaltung-alltag-a2"
title: "Hausverwaltung und Hausmeister im Alltag — A2"
topic: "Verwaltung und Hausmeister"
category: "Wohnen & Nachbarschaft"
level: A2
summary: "Etwas ist kaputt, jemand kommt zum Ablesen, darf ein Hund einziehen, kommt der Partner mit in den Vertrag — die normalen Mietfragen."
intro: >
  Nicht der Einbruch und nicht der Anwalt: die ganz normalen Mietfragen.
  Der Abfluss ist verstopft, die Dunstabzugshaube brummt, jemand kündigt
  das Ablesen des Wasserzählers an, du willst wissen, ob ein Hund
  erlaubt ist oder ob dein Partner mit in den Vertrag kann. Der
  Hausmeister regelt die kleinen Sachen, die Verwaltung die
  vertraglichen. Grammatik nach Bedarf: Perfekt für „was ist passiert",
  Modalverben für Erlaubnis (dürfen), höfliche Bitten, Termine
  vereinbaren. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Hausmeister oder Verwaltung?"
    instructions: "Wen sprichst du an? Sortiere die 12 Anliegen."
    instructionsEn: "Who do you contact? Sort the 12 matters."
    buckets:
      - { key: hausmeister, label: "Hausmeister" }
      - { key: verwaltung, label: "Hausverwaltung" }
    tokens:
      - { text: "Die Glühbirne im Keller ist kaputt.", bucket: hausmeister }
      - { text: "Darf mein Partner in den Mietvertrag?", bucket: verwaltung }
      - { text: "Der Abfluss in der Küche ist verstopft.", bucket: hausmeister }
      - { text: "Ich möchte die Wohnung kündigen.", bucket: verwaltung }
      - { text: "Die Haustür schließt nicht richtig.", bucket: hausmeister }
      - { text: "Ist ein Hund in der Wohnung erlaubt?", bucket: verwaltung }
      - { text: "Der Müllraum ist voll.", bucket: hausmeister }
      - { text: "Die Nebenkostenabrechnung stimmt nicht.", bucket: verwaltung }
      - { text: "Ich brauche einen zweiten Schlüssel für den Keller.", bucket: hausmeister }
      - { text: "Wann wird die Miete erhöht?", bucket: verwaltung }
      - { text: "Im Treppenhaus ist eine Lampe defekt.", bucket: hausmeister }
      - { text: "Ich hätte gern eine Mietbescheinigung.", bucket: verwaltung }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Was ist kaputt?"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Der {1} in der Küche ist verstopft. (wo das Wasser abläuft)
      2. Die {2} in der Küche brummt sehr laut. (über dem Herd)
      3. Die {3} im Bad tropft. (wo das Wasser rauskommt)
      4. Die {4} wird nicht mehr richtig warm. (macht die Wohnung warm)
      5. Der {5} im Flur funktioniert nicht mehr. (Gerät für Rauch an der Decke)
      6. Das {6} an der Kellertür klemmt. (wo der Schlüssel reinkommt)
      7. Im Bad ist {7} an der Wand. (schwarze Flecken durch Feuchtigkeit)
      8. Die {8} im Treppenhaus ist durchgebrannt. (gibt Licht)
    answers:
      "1": Abfluss
      "2": Dunstabzugshaube
      "3": Armatur
      "4": Heizung
      "5": Rauchmelder
      "6": Schloss
      "7": Schimmel
      "8": Glühbirne
    cues:
      "3": "oder: der Wasserhahn"

  - id: A3
    block: A
    type: matching
    title: "Frage und Antwort"
    instructions: "Ordne jede Frage (1–8) der passenden Antwort (a–h) zu."
    instructionsEn: "Match each question (1–8) with the fitting answer (a–h)."
    left:
      - { key: "1", text: "Wann könnten Sie vorbeikommen?" }
      - { key: "2", text: "Darf ich einen Hund halten?" }
      - { key: "3", text: "Kann mein Partner mit in den Vertrag?" }
      - { key: "4", text: "Muss ich zu Hause sein?" }
      - { key: "5", text: "Wer zahlt die Reparatur?" }
      - { key: "6", text: "Darf ich die Wände streichen?" }
      - { key: "7", text: "Wie lange ist die Kündigungsfrist?" }
      - { key: "8", text: "Bekomme ich einen zweiten Schlüssel?" }
    right:
      - { key: a, text: "Kleintiere ja, für einen Hund brauchen Sie unsere Zustimmung." }
      - { key: b, text: "Donnerstag zwischen 9 und 12 — passt das?" }
      - { key: c, text: "Ja, gegen eine Gebühr von 25 Euro." }
      - { key: d, text: "Ja, aber Sie müssen beim Auszug wieder weiß streichen." }
      - { key: e, text: "Drei Monate zum Monatsende." }
      - { key: f, text: "Bei normalem Verschleiß der Vermieter." }
      - { key: g, text: "Ja, oder jemand mit Schlüssel — wir brauchen Zugang zur Wohnung." }
      - { key: h, text: "Das geht, wir brauchen aber eine Selbstauskunft von ihm." }
    answers:
      "1": b
      "2": a
      "3": h
      "4": g
      "5": f
      "6": d
      "7": e
      "8": c

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Erlaubnis mit „dürfen“"
    instructions: "Ergänze die richtige Form von „dürfen“."
    instructionsEn: "Fill in the correct form of „dürfen“."
    text: |
      1. {1} ich in der Wohnung einen Hund halten?
      2. Kinder {2} im Hof spielen, aber nicht nach 20 Uhr.
      3. Man {3} sonntags keine Wäsche in der Waschküche waschen.
      4. {4} wir den Balkon mit einer Markise ausstatten?
      5. Ich {5} laut Vertrag nicht untervermieten.
      6. {6} ich am Wochenende bohren?
    answers:
      "1": Darf
      "2": dürfen
      "3": darf
      "4": Dürfen
      "5": darf
      "6": Darf

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Anruf beim Hausmeister: der Abfluss"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hausmeisterservice Berger, guten Tag.
      — Guten Tag, Yilmaz, Musterstraße 12, dritter {1}.
      Bei mir ist der Abfluss in der Küche {2}.
      — Seit wann denn?
      — Seit gestern Abend. Das Wasser {3} gar nicht mehr ab.
      — Haben Sie schon etwas {4}?
      — Ja, ich habe es mit einer Saugglocke {5}, aber ohne Erfolg.
      — Gut, dann komme ich vorbei. {6} Donnerstag zwischen 9 und 12?
      — Am Donnerstag arbeite ich. {7} es auch nachmittags?
      — Ab 15 Uhr hätte ich noch Zeit.
      — Perfekt. Muss ich zu Hause {8}?
      — Ja, ich brauche {9} zur Wohnung.
      — Alles klar, ich bin da. Vielen {10}.
    bank: [STOCK, VERSTOPFT, LÄUFT, VERSUCHT, PROBIERT, PASST, GEHT, SEIN, ZUGANG, DANK, WOHER, KELLER, KOMMEN, WASSER]
    answers:
      "1": STOCK
      "2": VERSTOPFT
      "3": LÄUFT
      "4": VERSUCHT
      "5": PROBIERT
      "6": PASST
      "7": GEHT
      "8": SEIN
      "9": ZUGANG
      "10": DANK

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du meldest einen Schaden am Telefon. Womit fängst du an? — You're reporting a problem by phone. How do you start?"
        options:
          - { key: a, text: "Bei mir ist was kaputt." }
          - { key: b, text: "Yilmaz, Musterstraße 12, dritter Stock. Bei mir ist der Abfluss in der Küche verstopft." }
          - { key: c, text: "Können Sie mal vorbeikommen?" }
        answer: b
        why: 'Name, Adresse, Stockwerk, Problem — in dieser Reihenfolge. Danach muss niemand nachfragen.'
      - q: "Der vorgeschlagene Termin passt dir nicht. — The suggested appointment doesn't suit you."
        options:
          - { key: a, text: "Da kann ich nicht." }
          - { key: b, text: "Am Donnerstag arbeite ich. Ginge es auch nachmittags oder an einem anderen Tag?" }
          - { key: c, text: "Kommen Sie einfach vorbei." }
        answer: b
        why: 'Absagen und im selben Satz Alternativen anbieten — sonst dauert die Terminsuche drei Anrufe.'
      - q: "Du willst wissen, ob ein Hund erlaubt ist. — You want to know if a dog is allowed."
        options:
          - { key: a, text: "Ich hole mir einen Hund." }
          - { key: b, text: "Hunde sind doch erlaubt, oder?" }
          - { key: c, text: "Ich würde gern einen Hund halten. Brauche ich dafür Ihre Zustimmung?" }
        answer: c
        why: 'Für Hunde und Katzen braucht es meist die Zustimmung des Vermieters — vorher fragen, nicht hinterher.'
      - q: "Dein Partner soll mit in den Mietvertrag. — Your partner should be added to the tenancy."
        options:
          - { key: a, text: "Ich möchte meinen Partner in den Mietvertrag aufnehmen lassen. Welche Unterlagen brauchen Sie?" }
          - { key: b, text: "Mein Partner wohnt jetzt hier." }
          - { key: c, text: "Kann er einfach einziehen?" }
        answer: a
        why: 'Die Aufnahme ist ein formaler Vorgang mit Unterlagen — gleich danach fragen spart eine Runde.'
      - q: "Jemand kündigt an, den Wasserzähler abzulesen. — Someone announces a water meter reading."
        options:
          - { key: a, text: "Das brauche ich nicht." }
          - { key: b, text: "Kann ich einen anderen Termin bekommen? Am angekündigten Tag bin ich nicht da." }
          - { key: c, text: "Ich lese selbst ab." }
        answer: b
        why: 'Beim Ablesen muss jemand da sein. Einen Ersatztermin erfragen ist normal — Ignorieren führt zur Schätzung.'
      - q: "Der Hausmeister ist da und du willst noch etwas erwähnen. — The caretaker is there and you want to mention something else."
        options:
          - { key: a, text: "Nichts sagen, dafür extra anrufen." }
          - { key: b, text: "Wenn Sie schon da sind: Im Bad tropft auch die Armatur. Könnten Sie kurz schauen?" }
          - { key: c, text: "Ihn bitten, alles zu reparieren." }
        answer: b
        why: '„Wenn Sie schon da sind“ ist die übliche Wendung — kleine Sachen erledigt er meist gleich mit.'

  - id: B3
    block: B
    type: order
    title: "Sätze bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Der", "Abfluss", "in", "der", "Küche", "ist", "verstopft"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Verb an Position 2"
      - tiles: ["Ich", "habe", "es", "mit", "einer", "Saugglocke", "probiert"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Perfekt: habe … probiert"
      - tiles: ["Ginge", "es", "auch", "am", "Nachmittag", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Konjunktiv II als höfliche Frage"
      - tiles: ["Darf", "ich", "in", "der", "Wohnung", "einen", "Hund", "halten", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Modalverb an Position 1, Infinitiv am Ende"
      - tiles: ["Ich", "möchte", "meinen", "Partner", "in", "den", "Mietvertrag", "aufnehmen", "lassen"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Zwei Infinitive am Ende: aufnehmen lassen"
      - tiles: ["Muss", "ich", "beim", "Ablesen", "zu", "Hause", "sein", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Modalverb an Position 1, Infinitiv am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Den Aushang im Hausflur lesen"
    instructions: |
      > **Hausverwaltung Berger & Partner — Ankündigung**
      > Musterstraße 12
      >
      > **Ablesung der Wasserzähler**
      > Dienstag, 07.07.2026, zwischen 8:00 und 14:00 Uhr.
      > Bitte sorgen Sie dafür, dass die Wohnung zugänglich ist. Sind Sie
      > verhindert, hinterlegen Sie den Schlüssel bei einer Nachbarin oder
      > vereinbaren Sie unter 030 / 55 44 33 einen Ersatztermin.
      > Bei zweimaliger Nichtanwesenheit wird der Verbrauch geschätzt;
      > die Kosten des dritten Termins trägt die Mietpartei.
      >
      > **Prüfung der Rauchmelder**
      > Im selben Termin. Bitte Möbel unter den Meldern freihalten.
      >
      > **Kleinreparaturen**
      > Meldungen bitte an den Hausmeister: 0170 / 22 33 444,
      > Mo–Fr 7:00–16:00. Außerhalb dieser Zeiten nur in Notfällen
      > (Wasserrohrbruch, Stromausfall im ganzen Haus).

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man muss beim Ablesen nicht selbst da sein. — You don't have to be there yourself for the reading."
        answer: true
        why: "Man kann den Schlüssel bei einer Nachbarin hinterlegen."
      - q: "Wer zweimal nicht da ist, zahlt den dritten Termin selbst. — Whoever misses twice pays for the third appointment."
        answer: true
        why: "„die Kosten des dritten Termins trägt die Mietpartei“."
      - q: "Die Rauchmelder werden an einem anderen Tag geprüft. — The smoke detectors are checked on a different day."
        answer: false
        why: "„Im selben Termin.“"
      - q: "Einen tropfenden Wasserhahn meldet man samstags beim Hausmeister. — You report a dripping tap to the caretaker on Saturday."
        answer: false
        why: "Nur Mo–Fr 7:00–16:00; samstags nur echte Notfälle."
      - q: "Ein Wasserrohrbruch um 22 Uhr ist ein Notfall. — A burst pipe at 10 pm is an emergency."
        answer: true
        why: "„Wasserrohrbruch“ steht ausdrücklich als Notfall."
      - q: "Vor dem Termin muss man unter den Rauchmeldern Platz machen. — Before the appointment you have to clear space under the detectors."
        answer: true
        why: "„Bitte Möbel unter den Meldern freihalten.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Kleine Reibereien"
    instructions: "Was machst oder sagst du? Wähle a, b oder c."
    instructionsEn: "What do you do or say? Choose a, b, or c."
    items:
      - q: "Der Handwerker kommt nicht zum vereinbarten Termin. — The tradesman doesn't turn up."
        options:
          - { key: a, text: "Beim Hausmeister anrufen und kurz schriftlich festhalten, dass niemand da war." }
          - { key: b, text: "Weiter warten." }
          - { key: c, text: "Selbst einen Handwerker bestellen." }
        answer: a
        why: 'Anrufen klärt es meist sofort — und die kurze Notiz hilft, falls die Sache sich zieht.'
      - q: "Du hast nach zwei Wochen keine Antwort auf deine Schadensmeldung. — Two weeks on there's no answer to your report."
        options:
          - { key: a, text: "Noch einmal anrufen." }
          - { key: b, text: "Kurz schriftlich nachfassen, mit Datum der ersten Meldung." }
          - { key: c, text: "Die Miete kürzen." }
        answer: b
        why: 'Schriftlich mit Datum ist der Unterschied zwischen „ich habe angerufen“ und einem nachweisbaren Vorgang.'
      - q: "Der Hausmeister sagt, für den Schimmel bist du selbst verantwortlich. — The caretaker says the mould is your own fault."
        options:
          - { key: a, text: "Widersprechen und streiten." }
          - { key: b, text: "Selbst überstreichen." }
          - { key: c, text: "Fotos machen, den Fall schriftlich der Verwaltung melden und um eine Begutachtung bitten." }
        answer: c
        why: 'Schimmel ist zu wichtig für ein Türgespräch. Fotos plus schriftliche Meldung bringen es auf die richtige Ebene.'
      - q: "Du bist beim Ablesetermin nicht da und hast es vergessen. — You forgot to be there for the meter reading."
        options:
          - { key: a, text: "Abwarten, ob sich jemand meldet." }
          - { key: b, text: "Von selbst anrufen und einen neuen Termin vereinbaren, bevor der zweite verstreicht." }
          - { key: c, text: "Den Zählerstand per Foto schicken." }
        answer: b
        why: 'Nach dem zweiten verpassten Termin wird geschätzt und der dritte kostet — vorher anrufen ist billiger.'
      - q: "Die Wohnung ist zu kalt, die Heizung läuft aber. — The flat is too cold although the heating is on."
        options:
          - { key: a, text: "Einen Heizlüfter kaufen." }
          - { key: b, text: "Temperatur mehrmals messen, notieren und dem Hausmeister die Werte nennen." }
          - { key: c, text: "Nichts sagen, im Winter ist das so." }
        answer: b
        why: 'Gemessene Werte machen aus „mir ist kalt“ eine Meldung, auf die jemand reagieren kann.'
      - q: "Du ziehst aus und willst wissen, was du renovieren musst. — You're moving out and want to know what to redecorate."
        options:
          - { key: a, text: "Vorher schriftlich fragen und sich den Zustand bei der Übergabe protokollieren lassen." }
          - { key: b, text: "Alles neu streichen, sicher ist sicher." }
          - { key: c, text: "Nichts machen und die Kaution abwarten." }
        answer: a
        why: 'Das Übergabeprotokoll entscheidet später über die Kaution — vorher fragen und alles festhalten lassen.'

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Ich möchte einen {1} melden. (etwas ist kaputt)
      2. Passt Ihnen Donnerstag? Sonst {2} wir einen anderen Termin. (ausmachen)
      3. Ich brauche {3} zur Wohnung — jemand muss da sein. (hineinkommen können)
      4. Ich habe den Termin leider {4}. (nicht daran gedacht)
      5. Bei der Übergabe wird ein {5} geschrieben. (Dokument über den Zustand)
      6. Ich möchte meinen Partner in den Mietvertrag {6} lassen. (dazunehmen)
      7. Für einen Hund brauche ich Ihre {7}. (Erlaubnis, formell)
      8. Die {8} bekomme ich nach dem Auszug zurück. (Geld, das man am Anfang zahlt)
    answers:
      "1": Schaden
      "2": vereinbaren
      "3": Zugang
      "4": vergessen
      "5": Übergabeprotokoll
      "6": aufnehmen
      "7": Zustimmung
      "8": Kaution

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    notes: "10+ / 12 → du regelst deine Mietsachen selbst. Unter 10: Block A und B2 noch einmal."
    instructions: "Ergänze die Lücken."
    instructionsEn: "Fill in the gaps."
    text: |
      **Was ist kaputt (4 Punkte):**
      1. Wo das Wasser abläuft: der {1}
      2. Über dem Herd: die {2}
      3. Gerät an der Decke gegen Rauch: der {3}
      4. Schwarze Flecken durch Feuchtigkeit: der {4}

      **Redemittel (5 Punkte):**
      5. Am Telefon zuerst: Name, Adresse, {5} und Problem.
      6. Termin ablehnen: „Ginge es auch am {6}?"
      7. Erlaubnis: „{7} ich in der Wohnung einen Hund halten?"
      8. Vertrag: „Ich möchte meinen Partner {8} lassen."
      9. Nebenbei: „Wenn Sie schon da sind: Könnten Sie kurz {9}?"

      **Wichtige Wörter (3 Punkte):**
      10. Der Handwerker braucht {10} zur Wohnung.
      11. Beim Auszug wird ein {11} geschrieben.
      12. Das Geld vom Anfang bekommst du am Ende zurück: die {12}
    answers:
      "1": Abfluss
      "2": Dunstabzugshaube
      "3": Rauchmelder
      "4": Schimmel
      "5": Stockwerk
      "6": Nachmittag
      "7": Darf
      "8": aufnehmen
      "9": schauen
      "10": Zugang
      "11": Übergabeprotokoll
      "12": Kaution

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: eine Woche Mietalltag"
    prompt: "Schreib ein Telefonat und eine kurze E-Mail. 14–18 Sätze."
    stimulus: |
      Deine Situation:

      Musterstraße 12, dritter Stock. Seit gestern ist der Abfluss in der
      Küche verstopft; mit der Saugglocke ging es nicht. Außerdem tropft
      im Bad die Armatur. Am Donnerstag arbeitest du bis 14 Uhr.

      Für nächsten Monat: Dein Partner soll mit in den Mietvertrag, und
      ihr überlegt, einen Hund zu holen.

      Teil 1 — das Telefonat mit dem Hausmeister: Schaden melden, Termin
      finden, die tropfende Armatur nebenbei erwähnen.
      Teil 2 — die E-Mail an die Hausverwaltung: Partner in den Vertrag,
      Frage nach dem Hund.
    use:
      - "Name, Adresse und Stockwerk am Anfang des Anrufs"
      - "`Ginge es auch …?` für den Ersatztermin"
      - "`Wenn Sie schon da sind: …`"
      - "`Darf ich …?` für die Erlaubnis"
      - "du-Form nirgends — beides ist Sie"
    selfCheck:
      - "Nennst du im Anruf Name, Adresse UND Stockwerk?"
      - "Hast du beim Termin eine Alternative angeboten, statt nur abzusagen?"
      - "Fragst du in der E-Mail nach den nötigen Unterlagen für die Vertragsaufnahme?"
      - "Ist die E-Mail formell, das Telefonat aber normal gesprochen?"
    model: |
      **Teil 1 — Telefonat mit dem Hausmeister**

      Hausmeister: Hausmeisterservice Berger, guten Tag.
      Ich: Guten Tag, Yilmaz, Musterstraße 12, dritter Stock. Bei mir ist
      der Abfluss in der Küche verstopft.
      Hausmeister: Seit wann denn?
      Ich: Seit gestern Abend. Ich habe es mit einer Saugglocke probiert,
      aber das Wasser läuft gar nicht mehr ab.
      Hausmeister: Passt Ihnen Donnerstag zwischen 9 und 12?
      Ich: Am Donnerstag arbeite ich bis 14 Uhr. Ginge es auch am Nachmittag?
      Hausmeister: Ab 15 Uhr hätte ich Zeit.
      Ich: Perfekt, da bin ich da. Und wenn Sie schon da sind: Im Bad
      tropft die Armatur. Könnten Sie kurz schauen?
      Hausmeister: Mache ich. Bis Donnerstag.

      **Teil 2 — E-Mail an die Hausverwaltung**

      Sehr geehrte Damen und Herren,

      ich wohne seit 2024 in der Musterstraße 12, dritter Stock links.

      Ich möchte meinen Partner in den Mietvertrag aufnehmen lassen.
      Könnten Sie mir bitte mitteilen, welche Unterlagen Sie dafür
      benötigen und wie lange die Bearbeitung dauert?

      Außerdem würden wir gern einen Hund halten. Brauche ich dafür Ihre
      Zustimmung, und wenn ja, wie beantrage ich sie?

      Für Rückfragen stehe ich Ihnen gern zur Verfügung.

      Mit freundlichen Grüßen
      Akin Yilmaz
