  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Führungszeugnis lesen"
    instructions: |
      > **Info — Führungszeugnis**
      >
      > - **Beantragung:** kann man **online oder persönlich** beim
      >   Bürgeramt stellen.
      > - **Gebühr:** beträgt in der Regel **13 Euro**.
      > - **Verwendungszweck:** muss man bei der Beantragung
      >   **immer angeben**.
      > - **Bearbeitungszeit:** liegt meist zwischen **einer und
      >   zwei Wochen**.
      > - **Eintragungen:** kleinere Vergehen erscheinen oft
      >   **nicht** im einfachen Führungszeugnis.
      > - **Gültigkeit:** sollte bei der Vorlage **nicht älter als
      >   drei Monate** sein.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein Führungszeugnis kann man online oder persönlich beantragen. — A certificate of good conduct can be applied for online or in person."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Führungszeugnis."
      - q: "Die Gebühr für das Führungszeugnis beträgt meist über 50 Euro. — The fee for the certificate is usually over 50 euros."
        answer: false
        why: "Sie beträgt in der Regel 13 Euro, nicht über 50 Euro."
      - q: "Den Verwendungszweck muss man bei der Beantragung immer angeben. — You must always state the purpose when applying."
        answer: true
        why: "„Verwendungszweck: muss man bei der Beantragung immer angeben.“"
      - q: "Die Bearbeitung dauert normalerweise mehrere Monate. — Processing normally takes several months."
        answer: false
        why: "Sie liegt meist zwischen einer und zwei Wochen, nicht mehreren Monaten."
      - q: "Kleinere Vergehen erscheinen oft nicht im einfachen Führungszeugnis. — Minor offenses often don't appear in the basic certificate."
        answer: true
        why: "„Eintragungen: kleinere Vergehen erscheinen oft nicht im einfachen Führungszeugnis.“"
      - q: "Ein Führungszeugnis ist unbegrenzt lange gültig, egal wie alt es ist. — A certificate is valid indefinitely, no matter how old it is."
        answer: false
        why: "Es sollte bei der Vorlage nicht älter als drei Monate sein."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Führungszeugnis etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ihr Führungszeugnis kommt nicht rechtzeitig vor dem Bewerbungstermin an. — Your certificate doesn't arrive in time for your job interview."
        options:
          - { key: a, text: "Den Bewerbungstermin einfach verpassen." }
          - { key: b, text: "Beim Bundesamt für Justiz nach dem Bearbeitungsstand fragen." }
          - { key: c, text: "Sich ein gefälschtes Dokument besorgen." }
        answer: b
        why: "Eine Nachfrage klärt schnell, wann mit dem Dokument zu rechnen ist."
      - q: "Sie merken, dass eine falsche Adresse eingetragen wurde. — You notice the wrong address was entered."
        options:
          - { key: a, text: "Nichts tun und einfach warten." }
          - { key: b, text: "Sich beim Bürgeramt beschweren, ohne die Adresse zu korrigieren." }
          - { key: c, text: "Das Bürgeramt sofort kontaktieren und die Adresse korrigieren lassen." }
        answer: c
        why: "Eine sofortige Korrektur verhindert, dass das Dokument an die falsche Adresse geht."
      - q: "Im Führungszeugnis steht eine Eintragung, mit der Sie nicht gerechnet haben. — The certificate shows an entry you didn't expect."
        options:
          - { key: a, text: "Sich in Ruhe informieren, was diese Eintragung genau bedeutet." }
          - { key: b, text: "Das Dokument sofort vernichten." }
          - { key: c, text: "Die Eintragung einfach ignorieren." }
        answer: a
        why: "Eine ruhige Klärung zeigt, was die Eintragung tatsächlich bedeutet."
      - q: "Sie haben den Online-Antrag versehentlich falsch ausgefüllt. — You accidentally filled out the online application incorrectly."
        options:
          - { key: a, text: "Es einfach so lassen, wie es ist." }
          - { key: b, text: "Das Bürgeramt kontaktieren und um eine Korrektur bitten." }
          - { key: c, text: "Einen komplett neuen Ausweis beantragen." }
        answer: b
        why: "Eine schnelle Korrektur verhindert Verzögerungen bei der Bearbeitung."
      - q: "Die Gebühr wurde versehentlich doppelt abgebucht. — The fee was accidentally charged twice."
        options:
          - { key: a, text: "Das Geld einfach abschreiben." }
          - { key: b, text: "Sich beim Amt laut beschweren, ohne Belege vorzulegen." }
          - { key: c, text: "Höflich um eine Rückerstattung des doppelten Betrags bitten." }
        answer: c
        why: "Eine höfliche Bitte mit Beleg führt meist schnell zur Rückerstattung."
      - q: "Das Dokument geht offenbar auf dem Postweg verloren. — The document apparently gets lost in the mail."
        options:
          - { key: a, text: "Beim Bürgeramt nach einer erneuten Zustellung fragen." }
          - { key: b, text: "Einfach ohne Führungszeugnis zur Bewerbung gehen." }
          - { key: c, text: "Sich das Dokument von einer anderen Person ausleihen." }
        answer: a
        why: "Eine erneute Zustellung ist die einzig verlässliche Lösung."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
