  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Das Führungszeugnis beantragen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} gestern einen Antrag gestellt. (haben, Perfekt)
      2. {2} Sie mir bitte den Verwendungszweck erklären? (können, Sie-Form)
      3. Man {3} den Personalausweis zum Bürgeramt mitbringen. (müssen, Präsens)
      4. {4} das Führungszeugnis schon verschickt worden? (sein, Perfekt Passiv)
      5. Falls eine Eintragung {5}, kann sich das auf die Bewerbung auswirken. (vorliegen, Präsens)
      6. Das Bundesamt {6} das Führungszeugnis per Post schicken. (werden, Futur I)
      7. Ich {7} schon die Gebühr bezahlt. (haben, Perfekt)
      8. {8} Sie mir bitte den Antrag erklären? (können, Sie-Form)
    answers:
