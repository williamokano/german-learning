lesson: "SIT/92-fuehrungszeugnis-b1"
title: "Führungszeugnis — B1"
topic: "Führungszeugnis"
category: "Behörden & Formelles"
level: B1
summary: "Ein Führungszeugnis beim Bürgeramt beantragen, den Verwendungszweck angeben und die Gebühr bezahlen — und was tun, wenn es nicht rechtzeitig ankommt oder eine unerwartete Eintragung darin steht."
intro: >
  Für viele Stellen braucht man ein Führungszeugnis: einen Antrag
  stellen, den Personalausweis vorlegen, den Verwendungszweck angeben
  und die Gebühr bezahlen. Dieses Set übt genau das — beantragen,
  angeben, erhalten, und was zu tun ist, wenn das Dokument nicht
  rechtzeitig ankommt oder eine unerwartete Eintragung darin steht.
  Grammatik nach Bedarf: Modalverben, Perfekt und Futur I. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

