      "2": Antrag
      "3": Bürgeramt
      "4": Gebühr
      "5": Eintragung
      "6": Verwendungszweck

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beantragen und erhalten"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (am Schalter im Bürgeramt)
      — Guten Tag, ich möchte ein {1} beantragen.
      — Gerne, haben Sie Ihren {2} dabei?
      — Ja, hier ist er.
      — Danke. Wofür brauchen Sie das Dokument? Das ist der {3}.
      — Für eine neue Stelle als Erzieher.
      — Gut, das trage ich gleich ein. Wohin soll das
      Führungszeugnis {4} werden?
      — An meine eigene Adresse, bitte.
      — Alles klar. Dann brauche ich noch die {5} von 13 Euro.
      — Hier, bitte.
      — Vielen Dank. Ich {6} jetzt den Antrag.
      — Wie lange dauert es ungefähr, bis es ankommt?
      — Meistens ein bis zwei Wochen.
      (zwei Wochen später)
      — Es ist endlich {7}! Ich öffne es gleich.
      — Und, gibt es eine {8}?
      — Nein, zum Glück nicht, es ist völlig sauber.
      — Perfekt, dann kannst du es deinem neuen Arbeitgeber {9}.
      — Genau, das {10} ich gleich morgen ab.
    bank: [FÜHRUNGSZEUGNIS, PERSONALAUSWEIS, MELDEBESCHEINIGUNG, VERWENDUNGSZWECK, REISEPASS, ZUGESTELLT, GEBÜHR, STEUERNUMMER, BEARBEITE, ANGEKOMMEN, VORSTRAFE, EINTRAGUNG, GEBEN, GEBE]
    answers:
      "1": FÜHRUNGSZEUGNIS
      "2": PERSONALAUSWEIS
      "3": VERWENDUNGSZWECK
      "4": ZUGESTELLT
      "5": GEBÜHR
      "6": BEARBEITE
      "7": ANGEKOMMEN
      "8": EINTRAGUNG
      "9": GEBEN
      "10": GEBE

  - id: B2
    block: B
    type: single-choice
    title: "Beantragen und angeben"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst dem Sachbearbeiter sagen, dass du ein Führungszeugnis beantragen möchtest. — You want to tell the clerk you'd like to apply for a certificate of good conduct."
        options:
          - { key: a, text: "Führungszeugnisse interessieren mich nicht." }
          - { key: b, text: "Ich möchte ein Führungszeugnis beantragen." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg bei der Beantragung."
      - q: "Du willst wissen, wie lange es dauert, bis das Führungszeugnis ankommt. — You want to know how long it takes for the certificate to arrive."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Wie lange dauert es ungefähr, bis das Führungszeugnis ankommt?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig den Zeitrahmen."
      - q: "Du willst dem Sachbearbeiter sagen, wofür du das Führungszeugnis brauchst. — You want to tell the clerk what you need the certificate for."
        options:
          - { key: a, text: "Ich brauche es für eine neue Stelle als Erzieher." }
          - { key: b, text: "Verwendungszwecke interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Angabe des Verwendungszwecks ist bei der Beantragung nötig."
      - q: "Du willst wissen, wie hoch die Gebühr für das Führungszeugnis ist. — You want to know how much the fee for the certificate is."
        options:
          - { key: a, text: "Gebühren interessieren mich nicht." }
          - { key: b, text: "Wie hoch ist eigentlich die Gebühr für das Führungszeugnis?" }
          - { key: c, text: "Das ist mir egal, Hauptsache ich bekomme es." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig die Kosten."
      - q: "Du willst wissen, ob du den Personalausweis mitbringen musst. — You want to know if you need to bring your ID card."
        options:
          - { key: a, text: "Ausweise interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Muss ich meinen Personalausweis mitbringen?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig die nötigen Unterlagen."
      - q: "Du willst dem Sachbearbeiter sagen, dass er das Dokument an deine eigene Adresse schicken soll. — You want to tell the clerk to send the document to your own address."
        options:
          - { key: a, text: "Bitte schicken Sie das Dokument an meine eigene Adresse." }
          - { key: b, text: "Adressen interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Angabe verhindert Missverständnisse bei der Zustellung."

