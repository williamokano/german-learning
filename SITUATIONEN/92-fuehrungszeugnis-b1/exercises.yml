      5. Die Gebühr wurde versehentlich doppelt {5}. (zweimal berechnet, Partizip)
      6. Das Dokument ist auf dem Postweg leider {6}. (weg, Partizip)
    answers:
      "1": angekommen
      "2": eingetragen
      "3": entdeckt
      "4": ausgefüllt
      "5": abgebucht
      "6": verlorengegangen

