lesson: "SIT/63-physiotherapie-a2"
title: "Physiotherapie: Rezept, Termine, Übungen — A2"
topic: "Physiotherapie: Rezept, Termine, Übungen"
category: "Sport & Gesundheit"
level: A2
summary: "Die Verordnung beim Arzt holen, Termine vereinbaren, Übungen zu Hause wiederholen — und was tun, wenn ein Termin ausfällt oder die Schmerzen bleiben."
intro: >
  Nach der Verordnung vom Arzt beginnt die eigentliche Arbeit: Termine
  bei der Physiotherapeutin vereinbaren, die Übungen aus der Praxis zu
  Hause wiederholen, und geduldig bleiben, auch wenn mal ein Termin
  ausfällt oder eine Übung wehtut. Dieses Set übt genau das: die
  Verordnung erfragen, die Zuzahlung klären, mit der Physiotherapeutin
  über Fortschritte sprechen, und was zu tun ist, wenn etwas
  schiefgeht. Grammatik nach Bedarf: Perfekt im Bericht, höfliche
  Fragen, Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Vor der Behandlung, in der Praxis oder zu Hause?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: vorher, label: "Vor der Behandlung" }
      - { key: praxis, label: "In der Praxis" }
      - { key: zuhause, label: "Zu Hause" }
    tokens:
      - { text: "die Verordnung vom Arzt holen", bucket: vorher }
      - { text: "einen Termin vereinbaren", bucket: vorher }
      - { text: "die Krankenkasse nach der Zuzahlung fragen", bucket: vorher }
      - { text: "die Zuzahlung einplanen", bucket: vorher }
      - { text: "die verspannten Muskeln massieren lassen", bucket: praxis }
      - { text: "Übungen mit der Physiotherapeutin machen", bucket: praxis }
      - { text: "die Beweglichkeit testen lassen", bucket: praxis }
      - { text: "einen Folgetermin ausmachen", bucket: praxis }
      - { text: "die Übungen selbstständig wiederholen", bucket: zuhause }
      - { text: "die Muskeln vorsichtig dehnen", bucket: zuhause }
      - { text: "die Schmerzen beobachten", bucket: zuhause }
      - { text: "das Rezept verlängern lassen", bucket: zuhause }

