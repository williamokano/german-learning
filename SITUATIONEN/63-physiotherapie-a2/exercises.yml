      2. {2} Sie mir einen Termin für nächste Woche geben? (could — können)
      3. Ich {3} schon drei Behandlungen gehabt. (have — Perfekt)
      4. Für die Physiotherapie brauche ich eine {4}. (referral)
      5. Jede Sitzung nennt man eine {5}. (treatment session)
