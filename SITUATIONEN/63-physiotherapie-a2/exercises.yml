      12. Die Übung hat mir richtig {12}. (hurt — Partizip)
      13. Die Krankenkasse hat die Kosten nicht mehr {13}. (covered — Partizip)
      14. Nach mehreren Behandlungen hat sich noch nichts {14}. (improved — Partizip)
    answers:
      "1": muss
      "2": Könnten
      "3": habe
      "4": Verordnung
      "5": Behandlung
      "6": verspannt
      "7": dehnen
      "8": Folgetermin
      "9": verlängern
      "10": ausgefallen
      "11": abgelaufen
      "12": wehgetan
      "13": übernommen
      "14": verbessert

  - id: D2
    block: D
    type: free-write
    title: "Planen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: die Verordnung holen und einen Termin vereinbaren, ein Problem während der Behandlung, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Dein Rücken schmerzt seit Wochen. Du holst dir eine Verordnung
      beim Arzt und vereinbarst einen Termin bei der Physiotherapeutin.
      Bei der zweiten Behandlung tut eine der Übungen plötzlich richtig
      weh.

      Beim Planen müssen vorkommen:
      1. den Arzt um ein Rezept bitten
      2. nach der Zuzahlung fragen
      3. einen Termin in der Praxis vereinbaren

      Während der Behandlung müssen vorkommen:
      4. merken, dass eine Übung wehtut
      5. der Physiotherapeutin sofort Bescheid sagen
      6. gemeinsam die Übung anpassen

      In der Lösung müssen vorkommen:
      7. die angepasste Übung ohne Schmerzen ausführen
      8. die Übungen zu Hause täglich wiederholen
      9. einen Folgetermin ausmachen
      10. sich über die spürbare Besserung freuen
    use:
      - "höfliche Bitte: „Können Sie mir ein Rezept ausstellen?“"
      - "Nebensatz mit falls: „Falls die Schmerzen zunehmen, …“"
      - "Perfekt: „Die Übungen haben mir geholfen.“"
    selfCheck:
      - "Wird der Arzt höflich um das Rezept gebeten?"
      - "Klingt die Reaktion auf die schmerzende Übung ruhig und offen?"
      - "Wird der Folgetermin am Ende erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Planen**

      Ich: Guten Tag, mein Rücken schmerzt seit Wochen. Können Sie mir ein Rezept für Physiotherapie ausstellen?
      Arzt: Natürlich, ich schreibe Ihnen eine Verordnung für sechs Behandlungen.
      Ich: Muss ich dafür eine Zuzahlung leisten?
      Arzt: Ja, meistens zehn Prozent der Kosten.
      (in der Praxis)
      Ich: Ich möchte einen Termin für Physiotherapie vereinbaren.
      Physiotherapeutin: Passt Ihnen Dienstag um 15 Uhr?

      **Das Problem**

      Ich: Autsch, diese Übung tut mir richtig weh!
      Physiotherapeutin: Sag mir sofort Bescheid, wenn etwas schmerzt — wir passen sie an.
      Ich: Danke, das ist deutlich angenehmer.

      **Die Lösung**

      Physiotherapeutin: Sehr gut, diese Version machen Sie ab jetzt täglich zu Hause.
      Ich: Mache ich, die Übungen haben mir schon jetzt geholfen.
      Physiotherapeutin: Können wir gleich einen Folgetermin ausmachen?
      Ich: Ja, gerne — ich merke schon eine spürbare Besserung!
