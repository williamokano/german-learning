  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Behandlung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} noch eine Verordnung vom Arzt holen. (Modalverb, ich-Form)
      2. {2} Sie mir einen Termin für nächste Woche geben? (können, Sie-Form)
      3. Ich {3} schon drei Behandlungen gehabt. (haben, Perfekt)
      4. {4} wir mit den Dehnübungen beginnen? (sollen, wir-Form)
      5. Falls die Schmerzen {5}, sage ich sofort Bescheid. (zunehmen, Präsens)
      6. Die Physiotherapeutin {6} mir neue Übungen zeigen. (werden, Futur I)
      7. Die Übungen {7} mir schon geholfen. (haben, Perfekt)
      8. {8} ich die Übungen auch am Wochenende machen? (müssen, ich-Form)
    answers:
      "1": muss
      "2": Können
      "3": habe
      "4": Sollen
      "5": zunehmen
      "6": wird
      "7": haben
      "8": Muss

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Für die Physiotherapie brauche ich eine {1} vom Arzt. (das Rezept für die Behandlung)
      2. Jede einzelne Sitzung bei der Physiotherapeutin nennt man eine {2}. (der Fachbegriff für die einzelne Sitzung)
      3. Meine Muskeln im Rücken sind stark {3}. (schmerzhaft angespannt)
      4. Zu Hause soll ich die Muskeln vorsichtig {4}. (langsam strecken)
      5. Am Ende der Behandlung vereinbaren wir gleich einen {5}. (der nächste Termin)
      6. Weil die Schmerzen noch nicht weg sind, lasse ich das Rezept {6}. (eine neue Verordnung bekommen, Infinitiv)
    answers:
      "1": Verordnung
      "2": Behandlung
      "3": verspannt
      "4": dehnen
      "5": Folgetermin
      "6": verlängern

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beim Arzt und in der Physiopraxis"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, mein Rücken schmerzt seit Wochen. Können Sie mir
      ein {1} für Physiotherapie ausstellen?
      — Natürlich, ich schreibe Ihnen eine {2} für sechs Behandlungen.
      — Muss ich dafür eine {3} bezahlen?
      — Ja, meistens zehn Prozent der Kosten.
      (in der Physiopraxis)
      — Guten Tag, ich habe eine Verordnung und möchte einen {4}
      vereinbaren.
      — Kein Problem, passt Ihnen Dienstag um 15 Uhr?
      — Ja, gut.
      (bei der ersten Behandlung)
      — Ihre Rückenmuskeln sind stark {5}. Ich zeige Ihnen ein paar
      {6} zum Selbermachen.
      — Wie oft soll ich die zu Hause wiederholen?
      — Am besten täglich, dann werden die Muskeln nach und nach {7}.
      — Und wann sehen wir uns wieder?
      — Am Ende der Sitzung machen wir gleich einen {8} aus.
      — Reichen die sechs Behandlungen, oder muss ich das Rezept {9}
      lassen?
      — Das sehen wir dann — falls nötig, {10} ich Ihnen zu einem
      neuen Arztbesuch.
    bank: [REZEPT, VERORDNUNG, ZUZAHLUNG, TERMIN, VERSPANNT, ÜBUNGEN, LOCKERER, FOLGETERMIN, VERLÄNGERN, RATE, MASSAGE, SCHMERZTABLETTE, KRANKENSCHEIN, WARTEZIMMER]
    answers:
      "1": REZEPT
      "2": VERORDNUNG
      "3": ZUZAHLUNG
      "4": TERMIN
      "5": VERSPANNT
      "6": ÜBUNGEN
      "7": LOCKERER
      "8": FOLGETERMIN
      "9": VERLÄNGERN
      "10": RATE

  - id: B2
    block: B
    type: single-choice
    title: "Beim Arzt und in der Praxis"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest den Arzt um ein Rezept für Physiotherapie bitten. — You want to ask the doctor for a referral to physiotherapy."
        options:
          - { key: a, text: "Rezepte interessieren mich nicht." }
          - { key: b, text: "Können Sie mir ein Rezept für Physiotherapie ausstellen?" }
          - { key: c, text: "Schreiben Sie mir irgendwas auf." }
        answer: b
        why: "Eine konkrete, höfliche Bitte ist der übliche Weg zu einem Rezept."
      - q: "Du möchtest wissen, ob du eine Zuzahlung leisten musst. — You want to know whether you have to pay a co-payment."
        options:
          - { key: a, text: "Zahlen ist mir egal." }
          - { key: b, text: "Kosten kümmern mich nicht." }
          - { key: c, text: "Muss ich für die Behandlung eine Zuzahlung leisten?" }
        answer: c
        why: "Eine klare Frage zu den Kosten vermeidet spätere Überraschungen."
      - q: "Du möchtest in der Praxis einen Termin vereinbaren. — You want to arrange an appointment at the practice."
        options:
          - { key: a, text: "Ich möchte einen Termin für Physiotherapie vereinbaren." }
          - { key: b, text: "Termine sind mir zu kompliziert." }
          - { key: c, text: "Ich komme einfach vorbei, wann ich will." }
        answer: a
        why: "Eine höfliche, konkrete Anfrage ist der übliche Einstieg am Empfang."
      - q: "Die Physiotherapeutin fragt, ob du die Übungen zu Hause gemacht hast. — The physiotherapist asks whether you did the exercises at home."
        options:
          - { key: a, text: "Übungen mache ich sowieso nie." }
          - { key: b, text: "Ja, ich habe sie jeden Tag wiederholt." }
          - { key: c, text: "Das interessiert mich nicht." }
        answer: b
        why: "Eine ehrliche, konkrete Antwort hilft der Physiotherapeutin, die Behandlung anzupassen."
      - q: "Du möchtest fragen, ob das Rezept verlängert werden kann. — You want to ask whether the referral can be extended."
        options:
          - { key: a, text: "Verlängern ist mir zu kompliziert." }
          - { key: b, text: "Rezepte sind mir egal." }
          - { key: c, text: "Kann das Rezept für weitere Behandlungen verlängert werden?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig, ob mehr Behandlungen möglich sind."
      - q: "Du möchtest einen Folgetermin ausmachen. — You want to set up a follow-up appointment."
        options:
          - { key: a, text: "Können wir gleich einen Folgetermin ausmachen?" }
          - { key: b, text: "Termine mache ich nie im Voraus." }
          - { key: c, text: "Ich rufe vielleicht irgendwann mal an." }
        answer: a
        why: "Den Folgetermin gleich zu vereinbaren spart beiden Seiten Zeit und Aufwand."

  - id: B3
    block: B
    type: order
    title: "Sätze bei der Physiotherapie bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Können", "Sie", "mir", "ein", "Rezept", "für", "Physiotherapie", "ausstellen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "höfliche Frage, Infinitiv am Ende"
      - tiles: ["Ich", "möchte", "einen", "Termin", "für", "Physiotherapie", "vereinbaren"]
