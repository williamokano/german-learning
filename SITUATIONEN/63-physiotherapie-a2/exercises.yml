        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Praxis-Infos lesen"
    instructions: |
      > **Info — Physiotherapie**
      >
      > - **Verordnung:** meist für **6 Behandlungen** gültig, danach
      >   neu verordnen lassen.
      > - **Zuzahlung:** in der Regel **10 % der Kosten** plus
      >   **10 Euro pro Verordnung**.
      > - **Termin:** sollte **innerhalb von 14 Tagen** nach
      >   Ausstellung der Verordnung beginnen.
      > - **Hausaufgaben:** die gezeigten Übungen sollten **täglich**
      >   wiederholt werden.
      > - **Verpasster Termin:** sollte **mindestens 24 Stunden
      >   vorher** abgesagt werden.
      > - **Folgetermin:** wird meistens **am Ende jeder Sitzung**
      >   vereinbart.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Eine Verordnung gilt meist für sechs Behandlungen. — A referral is usually valid for six sessions."
        answer: true
        why: "So steht es ausdrücklich in den Praxis-Infos."
      - q: "Die Zuzahlung beträgt normalerweise fünfzig Prozent der Kosten. — The co-payment is usually fifty percent of the costs."
        answer: false
        why: "Sie beträgt in der Regel 10 % der Kosten, nicht 50 %."
      - q: "Die Behandlung sollte innerhalb von 14 Tagen nach der Verordnung beginnen. — Treatment should start within 14 days of the referral."
        answer: true
        why: "„Termin: sollte innerhalb von 14 Tagen nach Ausstellung der Verordnung beginnen.“"
      - q: "Die Übungen sollten nur einmal im Monat wiederholt werden. — The exercises should only be repeated once a month."
        answer: false
        why: "Sie sollten täglich wiederholt werden, nicht einmal im Monat."
      - q: "Ein verpasster Termin darf man auch noch am selben Tag kurzfristig absagen. — A missed appointment can be cancelled at short notice on the same day."
        answer: false
        why: "Er sollte mindestens 24 Stunden vorher abgesagt werden."
      - q: "Der Folgetermin wird meistens am Ende jeder Sitzung vereinbart. — The follow-up appointment is usually arranged at the end of each session."
        answer: true
        why: "„Folgetermin: wird meistens am Ende jeder Sitzung vereinbart.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Physiotherapie etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Der Termin bei der Physiotherapeutin fällt kurzfristig aus. — The physiotherapy appointment is cancelled at short notice."
        options:
          - { key: a, text: "Einfach nicht mehr zur Praxis gehen." }
          - { key: b, text: "Sofort nach einem Ersatztermin fragen." }
          - { key: c, text: "Laut in der Praxis schimpfen." }
        answer: b
        why: "Eine schnelle Nachfrage nach einem Ersatztermin hält die Behandlung auf Kurs."
      - q: "Die Verordnung ist schon abgelaufen, aber die Schmerzen sind noch da. — The referral has already expired, but the pain remains."
        options:
          - { key: a, text: "Einfach ohne Verordnung weiter zur Physiotherapie gehen." }
          - { key: b, text: "Die Schmerzen ignorieren." }
          - { key: c, text: "Einen neuen Termin beim Arzt für eine Folgeverordnung machen." }
        answer: c
        why: "Eine neue Verordnung beim Arzt ist der korrekte Weg zu weiteren Behandlungen."
      - q: "Eine Übung tut beim Ausführen richtig weh. — An exercise really hurts while doing it."
        options:
          - { key: a, text: "Sofort der Physiotherapeutin Bescheid sagen." }
          - { key: b, text: "Trotz starker Schmerzen einfach weitermachen." }
          - { key: c, text: "Die Übung heimlich auslassen, ohne etwas zu sagen." }
        answer: a
        why: "Schmerzen sofort zu melden hilft, die Übung sicher anzupassen."
      - q: "Die Krankenkasse übernimmt die Kosten plötzlich nicht mehr. — The health insurance suddenly stops covering the costs."
        options:
          - { key: a, text: "Die Behandlung sofort komplett abbrechen." }
          - { key: b, text: "Bei der Krankenkasse nachfragen und den Grund klären." }
          - { key: c, text: "Einfach nicht mehr bezahlen." }
        answer: b
        why: "Eine Nachfrage bei der Krankenkasse klärt meist schnell, woran es liegt."
      - q: "Du kannst einen vereinbarten Termin nicht wahrnehmen. — You can't make a scheduled appointment."
        options:
          - { key: a, text: "Einfach nicht erscheinen, ohne Bescheid zu geben." }
          - { key: b, text: "Den Termin ignorieren und hoffen, dass es niemand merkt." }
          - { key: c, text: "Rechtzeitig in der Praxis anrufen und absagen." }
        answer: c
        why: "Rechtzeitiges Absagen ist höflich und vermeidet mögliche Ausfallgebühren."
      - q: "Nach mehreren Behandlungen hat sich noch nichts verbessert. — After several sessions, nothing has improved yet."
        options:
          - { key: a, text: "Mit der Physiotherapeutin offen über die fehlende Besserung sprechen." }
          - { key: b, text: "Einfach weitermachen, ohne etwas zu sagen." }
          - { key: c, text: "Die Behandlung ohne Erklärung abbrechen." }
        answer: a
        why: "Ein offenes Gespräch hilft, die Behandlung bei Bedarf anzupassen."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der Termin ist kurzfristig {1}. (nicht stattgefunden, Partizip)
      2. Die Verordnung war schon {2}. (nicht mehr gültig)
      3. Die Übung hat mir richtig {3}. (Schmerzen verursacht, Partizip)
      4. Die Krankenkasse hat die Kosten plötzlich nicht mehr {4}. (bezahlt, Partizip)
      5. Ich habe den Termin rechtzeitig {5}. (storniert, Partizip)
      6. Nach mehreren Behandlungen hat sich noch nichts {6}. (besser geworden, Partizip)
    answers:
      "1": ausgefallen
      "2": abgelaufen
      "3": wehgetan
      "4": übernommen
      "5": abgesagt
      "6": verbessert

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
