      - tiles: ["Muss", "ich", "für", "die", "Behandlung", "eine", "Zuzahlung", "leisten", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Frage mit Modalverb, Infinitiv am Ende"
      - tiles: ["Falls", "die", "Schmerzen", "zunehmen", ",", "sage", "ich", "sofort", "Bescheid"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Nebensatz mit falls, Hauptsatz mit Verb an Position 2"
      - tiles: ["Können", "wir", "gleich", "einen", "Folgetermin", "ausmachen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Frage mit Modalverb, trennbares Verb am Ende"
      - tiles: ["Die", "Übungen", "haben", "mir", "schon", "geholfen"]
