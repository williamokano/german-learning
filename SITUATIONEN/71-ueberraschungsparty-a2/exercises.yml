lesson: "SIT/71-ueberraschungsparty-a2"
title: "Eine Überraschungsparty planen — A2"
topic: "Eine Überraschungsparty planen"
category: "Soziales"
level: A2
summary: "Heimlich eine Party organisieren, die Gästeliste erstellen, Aufgaben verteilen — und was tun, wenn ein Gast fast das Geheimnis verrät oder zu früh ankommt."
intro: >
  Eine gute Überraschungsparty braucht Absprache: die Gästeliste
  erstellen, Aufgaben verteilen, einen glaubwürdigen Vorwand finden,
  um die gefeierte Person aus dem Haus zu locken — und das Ganze bis
  zum letzten Moment geheim halten. Dieses Set übt genau das: die Party
  heimlich planen, Aufgaben verteilen, und was zu tun ist, wenn ein
  Gast fast das Geheimnis verrät oder zu früh ankommt. Grammatik nach
  Bedarf: Perfekt im Bericht, höfliche Fragen, Nebensätze mit falls.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

