      5. Die Deko war noch nicht ganz {5}. (komplett)
      6. Der Kuchen ist beim Transport leider {6}. (beschädigt worden, Partizip)
    answers:
      "1": verraten
      "2": funktioniert
      "3": angekommen
      "4": gemerkt
      "5": fertig
      "6": kaputtgegangen

