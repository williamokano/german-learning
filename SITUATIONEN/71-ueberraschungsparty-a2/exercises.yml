      - { text: "die Aufgaben verteilen", bucket: planen }
      - { text: "einen Vorwand ausdenken", bucket: planen }
      - { text: "Einladungen heimlich verschicken", bucket: vorbereiten }
      - { text: "die Dekoration kaufen", bucket: vorbereiten }
      - { text: "einen Kuchen backen", bucket: vorbereiten }
      - { text: "das Geheimnis bewahren", bucket: vorbereiten }
      - { text: "die gefeierte Person ablenken", bucket: amtag }
