  - id: B4
    block: B
    type: true-false
    title: "Die Party-Infos lesen"
    instructions: |
      > **Info — Überraschungsparty**
      >
      > - **Planung:** am besten **mindestens zwei Wochen vorher**
      >   beginnen.
      > - **Gästeliste:** enge Freunde und Familie **rechtzeitig**
      >   informieren.
      > - **Geheimhaltung:** keine Hinweise in **sozialen Medien**
      >   posten.
      > - **Vorwand:** sollte **glaubwürdig, aber unauffällig** sein.
      > - **Ankunftszeit:** die Gäste sollten **mindestens 15
      >   Minuten vorher** da sein.
      > - **Nach der Überraschung:** ein Gruppenfoto ist eine schöne
      >   **Erinnerung**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Mit der Planung sollte man am besten mindestens zwei Wochen vorher beginnen. — Planning should ideally start at least two weeks in advance."
        answer: true
        why: "So steht es ausdrücklich in den Party-Infos."
      - q: "Hinweise zur Party dürfen problemlos in sozialen Medien gepostet werden. — Hints about the party can safely be posted on social media."
        answer: false
        why: "Es sollen gerade keine Hinweise in sozialen Medien gepostet werden."
      - q: "Der Vorwand sollte glaubwürdig, aber unauffällig sein. — The pretext should be believable but unobtrusive."
        answer: true
        why: "„Vorwand: sollte glaubwürdig, aber unauffällig sein.“"
      - q: "Die Gäste sollten erst nach der gefeierten Person ankommen. — Guests should arrive only after the guest of honour."
        answer: false
        why: "Sie sollten mindestens 15 Minuten vorher da sein, nicht danach."
      - q: "Ein Gruppenfoto nach der Überraschung ist eine schöne Erinnerung. — A group photo after the surprise is a nice memory."
        answer: true
        why: "„Nach der Überraschung: ein Gruppenfoto ist eine schöne Erinnerung.“"
      - q: "Die enge Familie muss bei einer Überraschungsparty nicht rechtzeitig informiert werden. — Close family doesn't need to be informed in time for a surprise party."
        answer: false
        why: "Enge Freunde und Familie sollten rechtzeitig informiert werden."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Überraschungsparty etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ein Gast verrät versehentlich das Geheimnis. — A guest accidentally gives away the secret."
        options:
          - { key: a, text: "Einfach die ganze Party absagen." }
          - { key: b, text: "Schnell einen glaubwürdigen Plan B finden." }
          - { key: c, text: "Dem Gast laut Vorwürfe machen, ohne eine Lösung zu suchen." }
        answer: b
        why: "Ein schneller Plan B rettet die Überraschung oft noch."
      - q: "Der Vorwand, um die Person aus dem Haus zu locken, funktioniert nicht. — The pretext to lure the person out doesn't work."
        options:
          - { key: a, text: "Die Person einfach den ganzen Tag zu Hause lassen." }
          - { key: b, text: "In Panik geraten und nichts mehr sagen." }
          - { key: c, text: "Ruhig einen spontanen neuen Grund finden." }
        answer: c
        why: "Ein spontaner, glaubwürdiger neuer Grund rettet die Situation meist."
      - q: "Ein wichtiger Gast kommt viel zu früh an. — An important guest arrives much too early."
        options:
          - { key: a, text: "Den Gast schnell und unauffällig irgendwo verstecken." }
          - { key: b, text: "Den Gast einfach wieder nach Hause schicken." }
          - { key: c, text: "Die ganze Überraschung sofort verraten." }
        answer: a
        why: "Ein schnelles, unauffälliges Verstecken rettet die Überraschung am ehesten."
      - q: "Die Person merkt schon vor der Ankunft, dass etwas nicht stimmt. — The person already notices something is off before arriving."
        options:
          - { key: a, text: "Stur weiter so tun, als wäre nichts." }
          - { key: b, text: "Die Wahrheit zugeben und trotzdem die Feier genießen." }
          - { key: c, text: "Die Party sofort absagen, sobald sie etwas ahnt." }
        answer: b
        why: "Ehrlichkeit rettet die Stimmung meist besser als ein verzweifeltes Weiterlügen."
      - q: "Die Dekoration ist noch nicht fertig, obwohl die Gäste schon da sind. — The decorations aren't finished even though guests have already arrived."
        options:
          - { key: a, text: "Die Gäste einfach draußen warten lassen, ohne etwas zu sagen." }
          - { key: b, text: "Die Deko komplett weglassen." }
          - { key: c, text: "Die Gäste gemeinsam kurz mit anpacken lassen." }
        answer: c
        why: "Gemeinsames Anpacken macht aus der Not schnell eine lustige Aktion."
      - q: "Der Kuchen geht beim Transport kaputt. — The cake gets damaged during transport."
        options:
          - { key: a, text: "Gelassen bleiben und schnell eine Alternative organisieren." }
          - { key: b, text: "Die Party deswegen komplett absagen." }
          - { key: c, text: "Sich den ganzen Abend über den Kuchen ärgern." }
        answer: a
        why: "Gelassenheit und eine schnelle Alternative retten die Feier am besten."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ein Gast hat versehentlich das Geheimnis {1}. (ausgeplaudert, Partizip)
      2. Der Vorwand hat leider nicht {2}. (nicht richtig gewirkt)
      3. Ein Gast ist viel zu früh {3}. (dort eingetroffen, Partizip)
