  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Party planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Wir {1} die Party heimlich planen. (Modalverb, wir-Form)
      2. {2} du mir bei der Gästeliste helfen? (können, du-Form)
      3. Ich {3} schon alle Einladungen verschickt. (haben, Perfekt)
      4. {4} wir noch einen guten Vorwand finden? (müssen, wir-Form)
      5. Falls sie etwas {5}, müssen wir schnell reagieren. (merken, Präsens)
      6. Jeder Gast {6} sich pünktlich verstecken. (werden, Futur I)
      7. Wir {7} schon die Aufgaben verteilt. (haben, Perfekt)
      8. {8} ich das Geheimnis wirklich bewahren? (können, ich-Form)
    answers:
      "1": müssen
      "2": Kannst
      "3": habe
      "4": Müssen
      "5": merkt
      "6": wird
      "7": haben
      "8": Kann

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Wir organisieren für sie eine {1}, ohne dass sie etwas ahnt. (eine Party, von der die gefeierte Person nichts weiß)
      2. Wir planen alles ganz {2}, damit nichts vorher rauskommt. (ohne dass es jemand merkt)
      3. Zuerst erstellen wir die {3} mit allen Namen. (die Liste der eingeladenen Personen)
      4. Am Tag selbst müssen wir sie geschickt {4}. (jemanden beschäftigen, damit er nichts merkt)
      5. Dafür brauchen wir einen guten {5}, um sie aus dem Haus zu locken. (ein erfundener Grund)
      6. Zum Schluss kümmern wir uns noch um die {6} im Raum. (der Schmuck für die Feier)
    answers:
      "1": Überraschungsparty
      "2": heimlich
      "3": Gästeliste
      "4": ablenken
      "5": Vorwand
      "6": Dekoration

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Die Party planen und Aufgaben verteilen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hey, ich möchte für Lisa eine {1} organisieren, machst du
      mit?
      — Klar, total gerne! Wer steht denn schon auf der {2}?
      — Bisher zehn Leute, aber ich schreibe die Einladungen ganz
      {3}.
      — Gut, und wer {4} die Deko und den Kuchen?
      — Das {5} ich.
      — Passt. Aber wie bekommen wir Lisa unauffällig aus dem Haus?
      — Ich denke mir einen {6} aus, zum Beispiel ein angebliches
      Treffen.
      — Gute Idee! Und wer sorgt dafür, dass sie so lange {7}
      bleibt, bis alle da sind?
      — Das übernehme ich, ich lade sie zum Kaffee ein.
      — Perfekt, dann müssen wir jetzt nur noch das {8} bewahren.
      — Genau, keiner darf ihr auch nur ein Wort {9}.
      — Ich freue mich schon total auf ihre {10}, wenn alle
      „Überraschung“ rufen!
    bank: [ÜBERRASCHUNGSPARTY, GÄSTELISTE, HEIMLICH, ORGANISIERT, ÜBERNEHME, VORWAND, ABGELENKT, GEHEIMNIS, VERRATEN, REAKTION, LUFTBALLONS, GESCHENKE, KERZEN, EINLADUNGSKARTEN]
    answers:
      "1": ÜBERRASCHUNGSPARTY
      "2": GÄSTELISTE
      "3": HEIMLICH
      "4": ORGANISIERT
      "5": ÜBERNEHME
      "6": VORWAND
      "7": ABGELENKT
      "8": GEHEIMNIS
      "9": VERRATEN
      "10": REAKTION

  - id: B2
    block: B
    type: single-choice
    title: "Planen und Aufgaben verteilen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einen Freund fragen, ob er bei der Überraschungsparty mitmacht. — You want to ask a friend if they'll help with the surprise party."
        options:
          - { key: a, text: "Partys interessieren mich nicht." }
          - { key: b, text: "Ich möchte für Lisa eine Überraschungsparty organisieren, machst du mit?" }
          - { key: c, text: "Mach das doch einfach allein." }
        answer: b
        why: "Eine direkte, freundliche Frage ist der übliche Einstieg bei der Planung."
      - q: "Du möchtest wissen, wer schon auf der Gästeliste steht. — You want to know who's already on the guest list."
        options:
          - { key: a, text: "Gästelisten sind mir zu kompliziert." }
          - { key: b, text: "Gäste sind mir egal." }
          - { key: c, text: "Wer steht denn schon auf der Gästeliste?" }
        answer: c
        why: "Eine direkte Nachfrage klärt schnell den aktuellen Stand der Gästeliste."
      - q: "Du möchtest sicherstellen, dass alles heimlich bleibt. — You want to make sure everything stays secret."
        options:
          - { key: a, text: "Keiner darf ihr auch nur ein Wort verraten." }
          - { key: b, text: "Wir können es ihr ruhig schon vorher sagen." }
          - { key: c, text: "Geheimnisse interessieren mich nicht." }
        answer: a
        why: "Eine klare Absprache zur Geheimhaltung ist bei einer Überraschungsparty entscheidend."
      - q: "Du brauchst einen Vorwand, um die gefeierte Person aus dem Haus zu locken. — You need a pretext to lure the guest of honour out of the house."
        options:
          - { key: a, text: "Vorwände sind mir zu kompliziert." }
          - { key: b, text: "Ich denke mir einen guten Vorwand aus." }
          - { key: c, text: "Wir sagen ihr einfach die Wahrheit." }
        answer: b
        why: "Ein guter Vorwand ist der Schlüssel, um die Person unauffällig wegzulocken."
      - q: "Ihr müsst die Aufgaben für die Party verteilen. — You need to divide up the party tasks."
        options:
          - { key: a, text: "Aufgaben interessieren mich nicht." }
          - { key: b, text: "Ich mache sowieso nichts." }
          - { key: c, text: "Wer kümmert sich um die Deko und den Kuchen?" }
        answer: c
        why: "Eine klare Frage zur Aufgabenverteilung sorgt für eine gut organisierte Party."
      - q: "Die Party ist vorbei, und alle sind begeistert von der Reaktion. — The party is over, and everyone is thrilled by the reaction."
        options:
          - { key: a, text: "Ihre Reaktion war einfach unbezahlbar!" }
          - { key: b, text: "Reaktionen interessieren mich nicht." }
          - { key: c, text: "Das war doch nichts Besonderes." }
        answer: a
        why: "Eine begeisterte Reaktion auf die gelungene Überraschung ist der schönste Lohn für die Planung."

