  - id: D2
    block: D
    type: free-write
    title: "Planen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: die Party planen und Aufgaben verteilen, ein Problem, weil ein Gast fast das Geheimnis verrät, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du planst mit einem Freund eine Überraschungsparty für Lisa. Ihr
      verteilt die Aufgaben und denkt euch einen Vorwand aus. Kurz vor
      der Party hätte ein Gast fast das Geheimnis verraten.

      Beim Planen müssen vorkommen:
      1. einen Freund fragen, ob er mitmacht
      2. die Gästeliste erstellen
      3. die Aufgaben verteilen

      Beim Problem müssen vorkommen:
      4. merken, dass ein Gast fast etwas verraten hätte
      5. schnell reagieren
      6. das Geheimnis retten

      In der Lösung müssen vorkommen:
      7. Lisa mit dem Vorwand aus dem Haus locken
      8. alle Gäste rechtzeitig verstecken
      9. laut „Überraschung“ rufen
      10. sich über ihre Reaktion freuen
    use:
      - "höfliche Frage: „Machst du mit?“"
      - "Nebensatz mit falls: „Falls sie etwas merkt, …“"
      - "Perfekt: „Wir haben die Aufgaben verteilt.“"
    selfCheck:
      - "Wird die Aufgabenverteilung klar beschrieben?"
      - "Klingt die Reaktion auf den fast verratenen Geheimnis ruhig und schnell?"
      - "Wird der Vorwand als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Planen**

      Ich: Ich möchte für Lisa eine Überraschungsparty organisieren, machst du mit?
      Freund: Klar, total gerne! Wer steht denn schon auf der Gästeliste?
      Ich: Bisher zehn Leute. Und wer kümmert sich um die Deko und den Kuchen?
      Freund: Das übernehme ich.

      **Das Problem**

      (kurz vor der Party)
      Ich: Warte, Tom hat Lisa fast erzählt, dass wir etwas planen!
      Freund: Bleib ruhig, ich lenke sie sofort mit einer anderen Frage ab.
      Ich: Puh, das war knapp.

      **Die Lösung**

      Freund: Ich denke mir jetzt schnell einen guten Vorwand aus, um sie aus dem Haus zu locken.
      Ich: Gute Idee, dann können wir in Ruhe alles vorbereiten.
      (später)
      Ich: Überraschung! Habt ihr ihre Reaktion gesehen?
      Freund: Unbezahlbar! Die Party ist perfekt gelungen.
