lesson: "SIT/79-falsch-geparkt-a2"
title: "Falsch geparkt: Knöllchen und Abschleppdienst — A2"
topic: "Falsch geparkt: Knöllchen und Abschleppdienst"
category: "Unterwegs"
level: A2
summary: "Ein Knöllchen entdecken, das Bußgeld verstehen, Einspruch einlegen — und was tun, wenn das Auto sogar abgeschleppt wurde."
intro: >
  Ein Strafzettel an der Windschutzscheibe ist ärgerlich, aber meist
  gut zu lösen: das Bußgeld prüfen, bei Unklarheiten Einspruch
  einlegen, und im schlimmsten Fall den Abschleppdienst kontaktieren.
  Dieses Set übt genau das — ein Knöllchen entdecken, dagegen
  vorgehen, und was zu tun ist, wenn das Auto abgeschleppt wurde.
  Grammatik nach Bedarf: Perfekt und Passiv im Bericht, Nebensätze mit
  falls. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

