      "3": HALTEVERBOT
      "4": EINSPRUCH
      "5": FRIST
      "6": BEWEIS
      "7": ABGESCHLEPPT
      "8": ABSCHLEPPDIENST
      "9": NENNEN
      "10": KOSTET

  - id: B2
    block: B
    type: single-choice
    title: "Das Knöllchen und der Einspruch"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du entdeckst einen Strafzettel an der Windschutzscheibe. — You discover a ticket on the windshield."
        options:
          - { key: a, text: "Strafzettel interessieren mich nicht." }
          - { key: b, text: "Oh nein, an der Windschutzscheibe klebt ein Knöllchen!" }
          - { key: c, text: "Das ignoriere ich einfach." }
        answer: b
        why: "Eine spontane Reaktion auf das entdeckte Knöllchen ist völlig natürlich."
      - q: "Du möchtest wissen, wie hoch das Bußgeld ist. — You want to know how high the fine is."
        options:
          - { key: a, text: "Bußgelder sind mir egal." }
          - { key: b, text: "Geld interessiert mich nicht." }
          - { key: c, text: "Wie hoch ist das Bußgeld?" }
        answer: c
        why: "Eine direkte Frage klärt sofort die Höhe des Bußgelds."
      - q: "Du möchtest gegen den Strafzettel Einspruch einlegen. — You want to file an objection against the ticket."
        options:
          - { key: a, text: "Sollen wir dagegen Einspruch einlegen?" }
          - { key: b, text: "Einspruch ist mir zu kompliziert." }
          - { key: c, text: "Wir zahlen einfach kommentarlos." }
        answer: a
        why: "Eine Nachfrage zum Einspruch ist der übliche erste Schritt bei Unklarheiten."
      - q: "Du möchtest als Beweis ein Foto vom Parkschild machen. — You want to take a photo of the sign as evidence."
        options:
          - { key: a, text: "Beweise interessieren mich nicht." }
          - { key: b, text: "Machst du noch ein Foto vom Schild als Beweis?" }
          - { key: c, text: "Fotos sind sowieso nutzlos." }
        answer: b
        why: "Ein Foto als Beweis stärkt einen möglichen Einspruch erheblich."
      - q: "Du entdeckst, dass euer Auto abgeschleppt wurde. — You discover your car has been towed."
        options:
          - { key: a, text: "Abgeschleppt zu werden ist mir egal." }
          - { key: b, text: "Das Auto ist bestimmt einfach gestohlen." }
          - { key: c, text: "Warte, unser Auto ist weg — ist das etwa abgeschleppt worden?" }
        answer: c
        why: "Eine erste Vermutung zum Abschleppen ist naheliegend, bevor man weiter reagiert."
      - q: "Du möchtest beim Abschleppdienst nach der Abholadresse fragen. — You want to ask the towing service for the pickup address."
        options:
          - { key: a, text: "Können Sie uns die Abholadresse nennen?" }
          - { key: b, text: "Adressen interessieren mich nicht." }
          - { key: c, text: "Ich rate einfach, wo das Auto sein könnte." }
        answer: a
        why: "Eine direkte Frage nach der Adresse ist der schnellste Weg zum Auto."

