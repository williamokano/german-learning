  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Knöllchen lesen"
    instructions: |
      > **Info — Knöllchen und Abschleppdienst**
      >
      > - **Einspruchsfrist:** meist **zwei Wochen** ab Ausstellung
      >   des Strafzettels.
      > - **Bußgeld:** je nach Verstoß zwischen **10 und 100 Euro**.
      > - **Abschleppen:** droht vor allem bei **Behinderung
      >   anderer** (z. B. im Halteverbot).
      > - **Abholgebühr:** kann schnell **über 150 Euro** kosten.
      > - **Foto als Beweis:** hilft besonders, wenn das
      >   **Parkschild schlecht sichtbar** war.
      > - **Verwarnung:** bei geringen Beträgen ist oft **keine
      >   Anhörung** nötig.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Einspruchsfrist beträgt meist zwei Wochen ab Ausstellung des Strafzettels. — The objection period is usually two weeks from when the ticket was issued."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Knöllchen."
      - q: "Das Bußgeld liegt bei jedem Parkverstoß immer bei genau 500 Euro. — The fine for every parking violation is always exactly 500 euros."
        answer: false
        why: "Es liegt je nach Verstoß zwischen 10 und 100 Euro, nicht immer bei 500 Euro."
      - q: "Abschleppen droht vor allem, wenn andere behindert werden, etwa im Halteverbot. — Towing is mainly a risk when others are obstructed, such as in a no-stopping zone."
        answer: true
        why: "„Abschleppen: droht vor allem bei Behinderung anderer (z. B. im Halteverbot).“"
      - q: "Die Abholgebühr für ein abgeschlepptes Auto liegt meist bei nur 5 Euro. — The pickup fee for a towed car is usually only 5 euros."
        answer: false
        why: "Sie kann schnell über 150 Euro kosten, nicht nur 5 Euro."
      - q: "Ein Foto als Beweis hilft besonders, wenn das Parkschild schlecht sichtbar war. — A photo as evidence helps especially when the sign was poorly visible."
        answer: true
        why: "„Foto als Beweis: hilft besonders, wenn das Parkschild schlecht sichtbar war.“"
      - q: "Bei einer einfachen Verwarnung mit geringem Betrag ist meist eine förmliche Anhörung nötig. — A simple warning with a small amount usually requires a formal hearing."
        answer: false
        why: "Bei geringen Beträgen ist oft keine Anhörung nötig."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Knöllchen etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Man ist sich sicher, dass das Parkschild kaum sichtbar war. — You're sure the parking sign was barely visible."
        options:
          - { key: a, text: "Einfach kommentarlos zahlen, ohne etwas zu dokumentieren." }
          - { key: b, text: "Fotos machen und diese als Beweis dem Einspruch beilegen." }
          - { key: c, text: "Sich nur mündlich beim Ordnungsamt beschweren." }
        answer: b
        why: "Fotos als Beweis stützen den Einspruch am wirksamsten."
      - q: "Das Auto wurde abgeschleppt, aber man findet die Abholadresse nicht heraus. — The car was towed, but you can't find the pickup address."
        options:
          - { key: a, text: "Das Auto als gestohlen melden, ohne nachzufragen." }
          - { key: b, text: "Einfach abwarten, bis sich jemand meldet." }
          - { key: c, text: "Bei der örtlichen Polizei nach dem Verbleib des Autos fragen." }
        answer: c
        why: "Die Polizei kennt meist den Abschleppdienst und kann die Adresse nennen."
      - q: "Die Einspruchsfrist ist schon fast abgelaufen. — The objection deadline is almost over."
        options:
          - { key: a, text: "Den Einspruch sofort einreichen, notfalls unvollständig mit Nachreichung." }
          - { key: b, text: "Die Frist einfach verstreichen lassen." }
          - { key: c, text: "Erst noch tagelang überlegen, bevor man handelt." }
        answer: a
        why: "Ein sofortiger, notfalls vorläufiger Einspruch sichert das Recht auf Prüfung."
      - q: "Der Abschleppdienst verlangt eine ungewöhnlich hohe Gebühr. — The towing service demands an unusually high fee."
        options:
          - { key: a, text: "Die hohe Gebühr kommentarlos bezahlen." }
          - { key: b, text: "Nach der genauen Kostenaufstellung fragen." }
          - { key: c, text: "Sich weigern, überhaupt etwas zu zahlen." }
        answer: b
        why: "Eine genaue Kostenaufstellung klärt, ob die Gebühr wirklich gerechtfertigt ist."
      - q: "Man bekommt ein zweites Knöllchen für denselben Parkvorgang. — You receive a second ticket for the same parking incident."
        options:
          - { key: a, text: "Beide Zettel einfach ignorieren." }
          - { key: b, text: "Beide Bußgelder kommentarlos bezahlen." }
          - { key: c, text: "Beide Zettel vergleichen und gegebenenfalls gegen die doppelte Ausstellung vorgehen." }
        answer: c
        why: "Ein Vergleich beider Zettel klärt, ob tatsächlich doppelt kassiert wurde."
      - q: "Man erkennt erst später, dass der Strafzettel für ein fremdes Auto war. — You later realize the ticket was for a different car."
        options:
          - { key: a, text: "Dies sofort schriftlich der Behörde mitteilen." }
          - { key: b, text: "Den Strafzettel einfach wegwerfen und nichts sagen." }
          - { key: c, text: "Für das fremde Auto kommentarlos bezahlen." }
        answer: a
        why: "Eine sofortige schriftliche Mitteilung klärt den Irrtum offiziell."

