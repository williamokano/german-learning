  - id: D2
    block: D
    type: free-write
    title: "Entdecken, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: das Knöllchen entdecken und Einspruch überlegen, ein Problem, weil das Auto abgeschleppt wurde, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr entdeckt ein Knöllchen an der Windschutzscheibe und überlegt,
      ob ihr Einspruch einlegen sollt. Am nächsten Tag stellt ihr
      fest, dass euer Auto sogar abgeschleppt wurde.

      Beim Entdecken müssen vorkommen:
      1. das Knöllchen an der Windschutzscheibe finden
      2. die Höhe des Bußgelds prüfen
      3. über einen Einspruch nachdenken

      Beim Problem müssen vorkommen:
      4. merken, dass das Auto weg ist
      5. vermuten, dass es abgeschleppt wurde
      6. den Abschleppdienst anrufen

      In der Lösung müssen vorkommen:
      7. die Abholadresse erfragen
      8. die Abholgebühr bezahlen
      9. das Auto wieder abholen
      10. sich über den letztlich glimpflichen Ausgang freuen
    use:
      - "höfliche Frage: „Wie hoch ist das Bußgeld?“"
      - "Nebensatz mit falls: „Falls das Auto abgeschleppt wird, …“"
      - "Perfekt: „Wir haben das Knöllchen entdeckt.“"
    selfCheck:
      - "Wird das Entdecken des Knöllchens klar beschrieben?"
      - "Klingt die Reaktion auf das abgeschleppte Auto ruhig und lösungsorientiert?"
      - "Wird die Abholung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Entdecken**

      Ich: Oh nein, an der Windschutzscheibe klebt ein Knöllchen! Wie hoch ist das Bußgeld?
      Freund: 25 Euro. Sollen wir dagegen Einspruch einlegen?
      Ich: Vielleicht, das Schild war ja wirklich kaum zu sehen.

      **Das Problem**

      (am nächsten Tag)
      Ich: Warte, unser Auto ist weg — ist das etwa abgeschleppt worden?
      Freund: Sieht ganz so aus. Wir müssen den Abschleppdienst anrufen.
      Ich: Guten Tag, unser Auto wurde wohl abgeschleppt, können Sie uns die Abholadresse nennen?

      **Die Lösung**

      Abschleppdienst: Natürlich, hier ist die Adresse. Die Abholung kostet zusätzlich 180 Euro.
      Ich: Autsch, aber gut, dass wir es überhaupt gefunden haben.
      Freund: Stimmt, hätte auch viel schlimmer ausgehen können.
      Ich: Da hast du recht — Hauptsache, das Auto ist wieder da!
