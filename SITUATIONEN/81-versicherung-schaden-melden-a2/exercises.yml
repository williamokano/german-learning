  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur Schadenmeldung lesen"
    instructions: |
      > **Info — Schaden melden**
      >
      > - **Meldefrist:** ein Schaden sollte **innerhalb einer
      >   Woche** gemeldet werden.
      > - **Beweise:** Fotos und ggf. Zeugen erleichtern die
      >   **Bearbeitung erheblich**.
      > - **Gutachter:** wird meist erst **bei größeren Schäden**
      >   eingeschaltet.
      > - **Selbstbeteiligung:** ist im Vertrag **individuell
      >   festgelegt**.
      > - **Erstattung:** erfolgt meist **innerhalb von zwei bis
      >   drei Wochen**.
      > - **Schadensnummer:** sollte bei **jedem weiteren Kontakt**
      >   angegeben werden.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein Schaden sollte innerhalb einer Woche gemeldet werden. — A claim should be reported within a week."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur Schadenmeldung."
      - q: "Fotos und Zeugen spielen bei der Bearbeitung überhaupt keine Rolle. — Photos and witnesses play no role at all in processing."
        answer: false
        why: "Sie erleichtern die Bearbeitung erheblich, statt keine Rolle zu spielen."
      - q: "Ein Gutachter wird meist erst bei größeren Schäden eingeschaltet. — An assessor is usually only called in for larger claims."
        answer: true
        why: "„Gutachter: wird meist erst bei größeren Schäden eingeschaltet.“"
      - q: "Die Selbstbeteiligung ist bei allen Verträgen exakt gleich hoch. — The deductible is exactly the same for every contract."
        answer: false
        why: "Sie ist im Vertrag individuell festgelegt, nicht bei allen gleich."
      - q: "Die Erstattung erfolgt meist innerhalb von zwei bis drei Wochen. — Reimbursement usually happens within two to three weeks."
        answer: true
        why: "„Erstattung: erfolgt meist innerhalb von zwei bis drei Wochen.“"
      - q: "Die Schadensnummer braucht man nur beim allerersten Kontakt, danach nie wieder. — The claim number is only needed for the very first contact, never again after that."
        answer: false
        why: "Sie sollte bei jedem weiteren Kontakt angegeben werden."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Schadenmeldung etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Die Versicherung reagiert nicht auf die Schadenmeldung. — The insurer doesn't respond to the claim."
        options:
          - { key: a, text: "Einfach abwarten, ohne nachzufragen." }
          - { key: b, text: "Nach ein paar Tagen höflich telefonisch nachfassen." }
          - { key: c, text: "Sofort eine schlechte Bewertung schreiben, ohne nachzufragen." }
        answer: b
        why: "Ein höflicher Anruf nach ein paar Tagen klärt meist schnell, woran es liegt."
      - q: "Der Gutachter schätzt die Schadenhöhe deutlich niedriger als erwartet ein. — The assessor estimates the damage much lower than expected."
        options:
          - { key: a, text: "Die niedrige Schätzung einfach akzeptieren." }
          - { key: b, text: "Sich beim Gutachter laut beschweren, ohne Alternativen zu prüfen." }
          - { key: c, text: "Ein zweites, unabhängiges Gutachten einholen." }
        answer: c
        why: "Ein zweites Gutachten liefert eine objektive Vergleichsgrundlage."
      - q: "Die Versicherung lehnt die Deckung ab und beruft sich auf eine unklare Vertragsklausel. — The insurer refuses coverage, citing an unclear clause."
        options:
          - { key: a, text: "Die Klausel genau prüfen und schriftlich Widerspruch einlegen." }
          - { key: b, text: "Die Ablehnung kommentarlos hinnehmen." }
          - { key: c, text: "Sich nur mündlich beschweren, ohne die Klausel zu prüfen." }
        answer: a
        why: "Eine genaue Prüfung mit schriftlichem Widerspruch ist der wirksamste Weg."
      - q: "Man hat die Schadensnummer verloren. — You've lost the claim number."
        options:
          - { key: a, text: "Ohne Nummer einfach gar nichts mehr unternehmen." }
          - { key: b, text: "Die Versicherung anrufen und die Nummer erneut erfragen." }
          - { key: c, text: "Sich eine beliebige Nummer ausdenken." }
        answer: b
        why: "Ein Anruf klärt die Nummer schnell und unkompliziert."
      - q: "Die Erstattung dauert deutlich länger als angekündigt. — Reimbursement takes much longer than announced."
        options:
          - { key: a, text: "Einfach endlos weiter warten, ohne nachzufragen." }
          - { key: b, text: "Die Schadenmeldung komplett zurückziehen." }
          - { key: c, text: "Freundlich nach dem Bearbeitungsstand fragen." }
        answer: c
        why: "Eine freundliche Nachfrage klärt meist schnell, woran die Verzögerung liegt."
      - q: "Man merkt erst später, dass ein Teil des Schadens gar nicht gemeldet wurde. — You later realize part of the damage was never reported."
        options:
          - { key: a, text: "Den fehlenden Teil so schnell wie möglich nachmelden." }
          - { key: b, text: "Den fehlenden Teil einfach vergessen." }
          - { key: c, text: "Nichts mehr unternehmen, weil es schon zu spät ist." }
        answer: a
        why: "Ein schnelles Nachmelden stellt sicher, dass auch dieser Teil abgedeckt wird."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Die Versicherung hat auf die Schadenmeldung nicht {1}. (nicht geantwortet, Partizip)
      2. Der Gutachter hat die Schadenhöhe niedriger {2}. (bewertet, Partizip)
      3. Die Versicherung hat die Deckung {3}. (nicht genehmigt, Partizip)
      4. Ich habe die Schadensnummer {4}. (nicht mehr gefunden, Partizip)
      5. Die Erstattung hat sich deutlich {5}. (später als geplant, Partizip)
      6. Ich habe einen Teil des Schadens gar nicht {6}. (der Versicherung mitgeteilt, Partizip)
    answers:
      "1": reagiert
      "2": eingeschätzt
      "3": abgelehnt
      "4": verloren
      "5": verzögert
      "6": gemeldet

  # ── Block D — Wiederholung ────────────────────────────────────────────────

