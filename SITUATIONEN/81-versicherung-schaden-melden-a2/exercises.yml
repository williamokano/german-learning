lesson: "SIT/81-versicherung-schaden-melden-a2"
title: "Versicherung: Schaden melden — A2"
topic: "Versicherung: Schaden melden"
category: "Geld & Verträge"
level: A2
summary: "Einen Schaden bei der Versicherung melden, die Schadensnummer notieren, nach der Deckung fragen — und was tun, wenn die Erstattung sich verzögert oder die Deckung abgelehnt wird."
intro: >
  Ein Schaden ist ärgerlich genug — die Meldung bei der Versicherung
  sollte deshalb möglichst reibungslos laufen: die Schadenmeldung
  ausfüllen, die Versicherungspolice bereithalten, die Schadensnummer
  notieren. Dieses Set übt genau das — einen Schaden melden, nach der
  Deckung und Selbstbeteiligung fragen, und was zu tun ist, wenn die
  Erstattung sich verzögert oder die Versicherung die Deckung ablehnt.
  Grammatik nach Bedarf: Perfekt und Passiv im Bericht, Nebensätze mit
  falls. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

