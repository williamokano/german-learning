    type: gap-bank
    title: "Bei der Versicherung"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich möchte einen {1} melden, der letzte Woche
      entstanden ist.
      — Kein Problem, haben Sie schon eine {2} ausgefüllt?
      — Noch nicht, können Sie mir dabei helfen?
      — Gerne. Haben Sie Ihre {3} zur Hand?
      — Ja, einen Moment ... hier ist sie.
      — Gut, dann erfasse ich das gleich. Sie bekommen dafür eine
      {4}.
      — Danke. Und wie geht es dann weiter?
      — Ein {5} wird sich den Schaden ansehen und die Höhe
      schätzen.
      — Verstehe. Und was genau übernimmt eigentlich die {6}?
      — Das hängt von Ihrem Vertrag ab, das prüfen wir gleich für
      Sie.
      — Muss ich noch eine {7} zahlen?
      — Ja, laut Vertrag liegt die bei 150 Euro.
      — Okay, gut zu wissen. Wann {8} ich mit der Erstattung
      rechnen?
      — In der Regel innerhalb von zwei bis drei Wochen.
      — Perfekt, vielen Dank, das {9} mir sehr!
      — Gern geschehen, wir {10} uns bei Ihnen, sobald es
      Neuigkeiten gibt.
    bank: [SCHADEN, SCHADENMELDUNG, VERSICHERUNGSPOLICE, SCHADENSNUMMER, GUTACHTER, DECKUNG, SELBSTBETEILIGUNG, KANN, HILFT, MELDEN, TARIF, HAFTPFLICHT, HAUSRAT, VERTRAG]
    answers:
      "1": SCHADEN
      "2": SCHADENMELDUNG
      "3": VERSICHERUNGSPOLICE
      "4": SCHADENSNUMMER
      "5": GUTACHTER
      "6": DECKUNG
      "7": SELBSTBETEILIGUNG
      "8": KANN
      "9": HILFT
      "10": MELDEN

  - id: B2
    block: B
    type: single-choice
    title: "Melden und Klären"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einen Schaden bei der Versicherung melden. — You want to report a claim to the insurance company."
        options:
          - { key: a, text: "Schäden interessieren mich nicht." }
          - { key: b, text: "Ich möchte einen Schaden melden, der letzte Woche entstanden ist." }
          - { key: c, text: "Ich melde sowieso nie etwas." }
        answer: b
        why: "Eine klare, konkrete Meldung ist der übliche Einstieg bei der Versicherung."
      - q: "Du möchtest wissen, ob du bei der Schadenmeldung Hilfe bekommst. — You want to know whether you can get help filing the claim."
        options:
          - { key: a, text: "Hilfe brauche ich sowieso nicht." }
          - { key: b, text: "Formulare fülle ich sowieso nie aus." }
          - { key: c, text: "Können Sie mir bei der Schadenmeldung helfen?" }
        answer: c
        why: "Eine direkte Bitte um Hilfe ist beim ersten Kontakt völlig normal."
      - q: "Du möchtest wissen, was die Versicherung tatsächlich übernimmt. — You want to know what the insurance actually covers."
        options:
          - { key: a, text: "Was genau übernimmt eigentlich die Deckung?" }
          - { key: b, text: "Deckung interessiert mich nicht." }
          - { key: c, text: "Das ist mir egal, Hauptsache irgendetwas wird bezahlt." }
        answer: a
        why: "Eine konkrete Frage zur Deckung klärt frühzeitig, was übernommen wird."
      - q: "Du möchtest wissen, wie hoch die Selbstbeteiligung ist. — You want to know how high the deductible is."
        options:
          - { key: a, text: "Selbstbeteiligung interessiert mich nicht." }
          - { key: b, text: "Muss ich noch eine Selbstbeteiligung zahlen?" }
          - { key: c, text: "Kosten sind mir egal." }
        answer: b
        why: "Eine direkte Frage zur Selbstbeteiligung vermeidet spätere Überraschungen."
      - q: "Du möchtest wissen, wann du mit der Erstattung rechnen kannst. — You want to know when to expect reimbursement."
        options:
          - { key: a, text: "Erstattungen interessieren mich nicht." }
          - { key: b, text: "Ich warte einfach unbegrenzt." }
          - { key: c, text: "Wann kann ich mit der Erstattung rechnen?" }
        answer: c
        why: "Eine direkte Frage zur Erstattung hilft bei der eigenen Planung."
      - q: "Die Versicherung hat dir schnell geholfen. — The insurer helped you quickly."
        options:
          - { key: a, text: "Vielen Dank, das hilft mir sehr!" }
          - { key: b, text: "Das war doch nichts Besonderes." }
          - { key: c, text: "Hilfe interessiert mich nicht." }
        answer: a
        why: "Ein herzlicher Dank ist die passende Reaktion auf schnelle, gute Hilfe."

  - id: B3
    block: B
    type: order
    title: "Sätze zur Schadenmeldung bauen"
