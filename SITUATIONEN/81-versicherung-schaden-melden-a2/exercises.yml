  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Meldung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} den Schaden sofort melden. (Modalverb, ich-Form)
      2. {2} Sie mir bei der Schadenmeldung helfen? (können, Sie-Form)
      3. Ich {3} schon Fotos vom Schaden gemacht. (haben, Perfekt)
      4. {4} wir einen Gutachter bestellen? (müssen, wir-Form)
      5. Falls der Schaden größer {5}, brauchen wir einen Gutachter. (sein, Präsens)
      6. Die Versicherung {6} sich innerhalb weniger Tage melden. (werden, Futur I)
      7. Wir {7} schon die Schadensnummer bekommen. (haben, Perfekt)
      8. {8} die Deckung schon geklärt worden? (sein, Perfekt Passiv)
    answers:
      "1": muss
      "2": Können
      "3": habe
      "4": Müssen
      "5": ist
      "6": wird
      "7": haben
      "8": Ist

