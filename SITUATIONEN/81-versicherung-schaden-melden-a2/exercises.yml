        note: "Nebensatz mit falls, Hauptsatz mit Verb an Position 2"
      - tiles: ["Muss", "ich", "noch", "eine", "Selbstbeteiligung", "zahlen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Frage mit Modalverb, Infinitiv am Ende"
      - tiles: ["Wir", "haben", "schon", "die", "Schadensnummer", "bekommen"]
