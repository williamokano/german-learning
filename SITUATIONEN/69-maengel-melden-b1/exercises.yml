      "2": Können
      "3": habe
      "4": Können
      "5": behoben
      "6": wird
      "7": haben
      "8": Ist

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ein Defekt in der Wohnung heißt offiziell ein {1}. (ein Problem oder Defekt in der Wohnung)
