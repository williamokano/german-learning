lesson: "SIT/69-maengel-melden-b1"
title: "Mängel melden: Heizung, Schimmel, Wasserschaden — B1"
topic: "Mängel melden: Heizung, Schimmel, Wasserschaden"
category: "Wohnen & Nachbarschaft"
level: B1
summary: "Einen Mangel schriftlich melden, eine Frist setzen, Beweisfotos schicken — und was tun, wenn der Vermieter nicht reagiert oder die Heizung mitten im Winter ausfällt."
intro: >
  Schimmel an der Wand, ein Wasserschaden im Keller oder eine
  ausgefallene Heizung — solche Mängel sollten schriftlich gemeldet
  werden, am besten mit Fotos und einer klaren Frist zur Behebung.
  Dieses Set übt genau das: einen Mangel melden, eine Frist setzen, mit
  einer möglichen Mietminderung drohen, und was zu tun ist, wenn der
  Vermieter nicht reagiert oder ein Notfall wie ein Heizungsausfall im
  Winter auftritt. Grammatik nach Bedarf: Passiv im Bericht, Perfekt,
  Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

