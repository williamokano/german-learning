  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Meldung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} den Mangel schriftlich melden. (Modalverb, ich-Form)
      2. {2} Sie mir eine Frist zur Behebung setzen? (können, Sie-Form)
      3. Ich {3} schon Beweisfotos gemacht. (haben, Perfekt)
      4. {4} wir die Miete mindern? (können, wir-Form)
      5. Falls der Schaden nicht {5} wird, mindern wir die Miete. (beheben, Partizip)
      6. Der Vermieter {6} sich um die Reparatur kümmern. (werden, Futur I)
      7. Wir {7} schon die Mängelanzeige geschickt. (haben, Perfekt)
      8. {8} der Schimmel schon entfernt worden? (sein, Perfekt Passiv)
    answers:
