      "5": Mängelanzeige
      "6": Mietminderung
      "7": Schimmel
      "8": Wasserschaden
      "9": Beweisfoto
      "10": geantwortet
      "11": ausgebreitet
      "12": gegeben
      "13": ausgefallen
      "14": gekommen

  - id: D2
    block: D
    type: free-write
    title: "Melden, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: mehrere Mängel schriftlich melden und eine Frist setzen, ein Problem, weil der Vermieter nicht reagiert, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du entdeckst Schimmel im Bad und eine ausgefallene Heizung. Du
      meldest beides schriftlich und setzt eine Frist von zwei Wochen.
      Der Vermieter reagiert danach zunächst nicht.

      Beim Melden müssen vorkommen:
      1. den Vermieter über die Mängel informieren
      2. Beweisfotos machen und mitschicken
      3. eine Frist von zwei Wochen setzen

      Beim Problem müssen vorkommen:
      4. merken, dass die Frist ohne Reaktion verstrichen ist
      5. den Vermieter erneut kontaktieren
      6. mit einer Mietminderung drohen

      In der Lösung müssen vorkommen:
      7. eine Antwort vom Vermieter bekommen
      8. den Handwerker ins Haus lassen
      9. die Reparatur überprüfen
      10. sich über die endlich behobenen Mängel freuen
    use:
      - "höfliche Bitte: „Können Sie mir eine Frist setzen?“"
      - "Passiv: „Falls der Schaden nicht behoben wird, …“"
      - "Perfekt: „Wir haben die Mängelanzeige geschickt.“"
    selfCheck:
      - "Wird die Mängelmeldung klar und sachlich beschrieben?"
      - "Klingt die Reaktion auf die ausbleibende Antwort bestimmt, aber sachlich?"
      - "Wird die Mietminderung als mögliche Konsequenz erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Melden**

      Ich: Guten Tag, ich möchte Ihnen ein paar Mängel in meiner Wohnung melden — Schimmel im Bad und eine ausgefallene Heizung.
      Vermieter: Oh, das tut mir leid. Haben Sie schon Beweisfotos gemacht?
      Ich: Ja, ich schicke Ihnen die gleich. Können Sie mir eine Frist setzen?
      Vermieter: Sagen wir zwei Wochen.

      **Das Problem**

      (drei Wochen später)
      Ich: Guten Tag, die Frist ist leider ohne Reaktion verstrichen.
      Vermieter: Entschuldigung, das ist mir durchgerutscht.
      Ich: Falls es noch länger dauert, muss ich über eine Mietminderung nachdenken.

      **Die Lösung**

      Vermieter: Das verstehe ich, ich kümmere mich sofort um einen Handwerker.
      Ich: Danke, das erleichtert mich sehr.
      (eine Woche später)
      Ich: Der Handwerker war da, und Schimmel und Heizung sind endlich behoben — was für eine Erleichterung!
