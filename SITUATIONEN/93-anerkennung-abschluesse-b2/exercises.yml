  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Anerkennung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} letzte Woche den Antrag auf Anerkennung gestellt. (haben, Perfekt)
      2. {2} Sie mir bitte erklären, welche Unterlagen ich brauche? (können, Sie-Form)
      3. Man {3} die Zeugnisse beglaubigt übersetzen lassen. (müssen, Präsens)
      4. {4} die Gleichwertigkeit schon geprüft worden? (sein, Perfekt Passiv)
      5. Falls die Gleichwertigkeit nicht vollständig {5}, brauche ich eine Nachqualifizierung. (vorliegen, Präsens)
      6. Die Anerkennungsstelle {6} mir den Bescheid schriftlich schicken. (werden, Futur I)
      7. Ich {7} schon alle Unterlagen eingereicht. (haben, Perfekt)
      8. {8} Sie mir bitte den Unterschied erklären? (können, Sie-Form)
    answers:
      "1": habe
      "2": Können
      "3": muss
      "4": Ist
      "5": vorliegt
      "6": wird
      "7": habe
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte die {1} meines ausländischen Abschlusses beantragen. (die offizielle Bestätigung der Gültigkeit)
      2. Mein {2} in Informatik wurde in meinem Heimatland erworben. (das Zeugnis über die Ausbildung)
      3. Die Behörde prüft die {3} mit dem deutschen System. (der Vergleich mit dem deutschen Abschluss)
      4. Für die {4} brauche ich mein Originalzeugnis. (die Einschätzung des Zeugnisses)
      5. Ich habe eine {5} meines Zeugnisses machen lassen. (die amtlich bestätigte Übersetzung)
      6. Falls nötig, mache ich eine {6}. (die zusätzliche Ausbildung)
    answers:
      "1": Anerkennung
      "2": Abschluss
      "3": Gleichwertigkeit
      "4": Zeugnisbewertung
      "5": beglaubigte Übersetzung
      "6": Nachqualifizierung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beantragen, prüfen, nachqualifizieren"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (bei der Anerkennungsstelle)
      — Guten Tag, ich möchte die {1} meines Studienabschlusses
      beantragen.
      — Gerne. Wo haben Sie Ihren {2} erworben?
      — In Brasilien, ich habe dort Ingenieurwissenschaften
      studiert.
      — Gut, dann brauche ich Ihre Zeugnisse mit einer {3}.
      — Die habe ich schon machen lassen, hier sind sie.
      — Danke. Wir prüfen jetzt die {4} mit dem deutschen
      Abschluss.
      — Wie lange dauert diese Prüfung ungefähr?
      — Meistens zwischen drei und vier Monaten.
      (nach vier Monaten)
      — Guten Tag, ich habe eine Frage zu meinem Antrag.
      — Ihre {5} ist fertig. Ihr Abschluss ist leider nicht
      vollständig gleichwertig.
      — Oh, was bedeutet das für mich?
      — Sie {6} eine Nachqualifizierung machen, zum Beispiel einen
      {7}.
      — Und wie lange dauert so ein Lehrgang?
      — Das ist unterschiedlich, aber meist sechs bis zwölf Monate.
      — Verstehe. Kann ich in der Zeit trotzdem schon in meinem
      Beruf {8}?
      — Teilweise, das hängt von der Branche ab. Am besten {9} ich
      Ihnen die genauen Details noch einmal schriftlich.
      — Das wäre super, vielen Dank für Ihre {10}.
    bank: [ANERKENNUNG, ABSCHLUSS, DIPLOM, ÜBERSETZUNG, BERUFSERFAHRUNG, GLEICHWERTIGKEIT, PRAKTIKUM, ZEUGNISBEWERTUNG, MÜSSEN, ANPASSUNGSLEHRGANG, SPRACHKURS, ARBEITEN, SCHICKE, GEDULD]
    answers:
      "1": ANERKENNUNG
      "2": ABSCHLUSS
      "3": ÜBERSETZUNG
      "4": GLEICHWERTIGKEIT
      "5": ZEUGNISBEWERTUNG
      "6": MÜSSEN
      "7": ANPASSUNGSLEHRGANG
      "8": ARBEITEN
      "9": SCHICKE
      "10": GEDULD

  - id: B2
    block: B
    type: single-choice
    title: "Beantragen und prüfen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Anerkennungsstelle sagen, dass du die Anerkennung deines Abschlusses beantragen möchtest. — You want to tell the recognition authority you'd like to apply for recognition of your degree."
        options:
          - { key: a, text: "Anerkennungen interessieren mich nicht." }
          - { key: b, text: "Ich möchte die Anerkennung meines Abschlusses beantragen." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg bei der Beantragung."
      - q: "Du willst wissen, wie lange die Prüfung der Gleichwertigkeit ungefähr dauert. — You want to know roughly how long the equivalence check takes."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Wie lange dauert die Prüfung der Gleichwertigkeit ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig den Zeitrahmen."
      - q: "Du willst der Anerkennungsstelle sagen, wo du deinen Abschluss erworben hast. — You want to tell the recognition authority where you earned your degree."
        options:
          - { key: a, text: "Ich habe meinen Abschluss in Brasilien erworben." }
          - { key: b, text: "Abschlüsse interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Angabe des Herkunftslandes ist bei der Prüfung nötig."
      - q: "Du willst wissen, ob du während der Nachqualifizierung schon in deinem Beruf arbeiten kannst. — You want to know if you can already work in your profession during the bridging course."
        options:
          - { key: a, text: "Berufe interessieren mich nicht." }
          - { key: b, text: "Kann ich während der Nachqualifizierung schon in meinem Beruf arbeiten?" }
          - { key: c, text: "Das ist mir egal, Hauptsache ich habe irgendeine Arbeit." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig die berufliche Situation während dieser Zeit."
      - q: "Du willst wissen, wie lange ein Anpassungslehrgang ungefähr dauert. — You want to know roughly how long an adaptation course takes."
        options:
          - { key: a, text: "Lehrgänge interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie lange dauert so ein Anpassungslehrgang ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig die zeitliche Planung."
      - q: "Du willst dich bei der Sachbearbeiterin für ihre Geduld bedanken. — You want to thank the caseworker for her patience."
        options:
          - { key: a, text: "Vielen Dank für Ihre Geduld." }
          - { key: b, text: "Geduld interessiert mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Ein höflicher Dank passt zum Abschluss eines längeren Prozesses."

  - id: B3
    block: B
    type: order
    title: "Sätze zur Anerkennung bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
