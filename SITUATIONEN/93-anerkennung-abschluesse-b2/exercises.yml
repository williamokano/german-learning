lesson: "SIT/93-anerkennung-abschluesse-b2"
title: "Anerkennung ausländischer Abschlüsse — B2"
topic: "Anerkennung ausländischer Abschlüsse"
category: "Behörden & Formelles"
level: B2
summary: "Die Anerkennung eines ausländischen Abschlusses beantragen, Zeugnisse mit beglaubigter Übersetzung einreichen und die Gleichwertigkeit prüfen lassen — und was tun, wenn der Abschluss nur teilweise anerkannt wird."
intro: >
  Ein ausländischer Abschluss muss oft erst anerkannt werden: den
  Antrag stellen, Zeugnisse mit beglaubigter Übersetzung einreichen
  und die Gleichwertigkeit prüfen lassen. Dieses Set übt genau das —
  einreichen, prüfen, nachqualifizieren, und was zu tun ist, wenn der
  Abschluss nur teilweise anerkannt wird. Grammatik nach Bedarf:
  Modalverben, Perfekt und Futur I. Blocks: A Wortschatz & Redemittel
  → B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

