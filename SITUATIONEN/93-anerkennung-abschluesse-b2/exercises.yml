      - tiles: ["Wie", "lange", "dauert", "die", "Prüfung", "eigentlich", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "W-Frage mit Verb an Position 2"
      - tiles: ["Ich", "habe", "alle", "Unterlagen", "schon", "eingereicht"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur Anerkennung lesen"
    instructions: |
      > **Info — Anerkennung ausländischer Abschlüsse**
      >
      > - **Antrag:** kann man bei der zuständigen
      >   **Anerkennungsstelle** stellen.
      > - **Zeugnisse:** müssen oft **beglaubigt übersetzt** werden.
      > - **Gleichwertigkeit:** wird mit dem **deutschen
      >   Referenzberuf** verglichen.
      > - **Nachqualifizierung:** ist bei **teilweiser
      >   Gleichwertigkeit** oft nötig.
      > - **Bearbeitungszeit:** kann **mehrere Monate** dauern.
      > - **Reglementierte Berufe:** (z. B. Ärztin, Lehrer) brauchen
      >   oft **zwingend** eine Anerkennung.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Anerkennung kann man bei der zuständigen Anerkennungsstelle beantragen. — Recognition can be applied for at the responsible recognition authority."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur Anerkennung."
      - q: "Ausländische Zeugnisse müssen nie übersetzt werden. — Foreign certificates never need to be translated."
        answer: false
        why: "Sie müssen oft beglaubigt übersetzt werden."
      - q: "Die Gleichwertigkeit wird mit einem deutschen Referenzberuf verglichen. — Equivalence is compared with a German reference profession."
        answer: true
        why: "„Gleichwertigkeit: wird mit dem deutschen Referenzberuf verglichen.“"
      - q: "Bei teilweiser Gleichwertigkeit ist eine Nachqualifizierung nie nötig. — When equivalence is only partial, a bridging course is never needed."
        answer: false
        why: "Bei teilweiser Gleichwertigkeit ist eine Nachqualifizierung oft nötig."
      - q: "Die Bearbeitungszeit kann mehrere Monate dauern. — Processing time can take several months."
        answer: true
        why: "„Bearbeitungszeit: kann mehrere Monate dauern.“"
      - q: "Für reglementierte Berufe wie Ärztin oder Lehrer braucht man keine Anerkennung. — For regulated professions like doctor or teacher, no recognition is needed."
        answer: false
        why: "Reglementierte Berufe brauchen oft zwingend eine Anerkennung."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Anerkennung etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ihr Abschluss wird nur teilweise anerkannt. — Your degree is only partially recognized."
        options:
          - { key: a, text: "Den Beruf komplett aufgeben." }
          - { key: b, text: "Sich über die möglichen Wege zur Nachqualifizierung informieren." }
          - { key: c, text: "Den Bescheid einfach ignorieren." }
        answer: b
        why: "Eine Nachqualifizierung ist meist der schnellste Weg zur vollen Anerkennung."
      - q: "Die Anerkennungsstelle fordert fehlende Unterlagen nach. — The recognition authority requests missing documents."
        options:
          - { key: a, text: "Den Antrag einfach zurückziehen." }
          - { key: b, text: "Die Unterlagen nie einreichen." }
          - { key: c, text: "Die fehlenden Unterlagen schnellstmöglich nachreichen." }
        answer: c
        why: "Ein schnelles Nachreichen beschleunigt die weitere Bearbeitung."
      - q: "Die Bearbeitung Ihres Antrags dauert deutlich länger als angekündigt. — Processing your application takes much longer than announced."
        options:
          - { key: a, text: "Höflich nach dem aktuellen Bearbeitungsstand fragen." }
          - { key: b, text: "Einfach nichts mehr unternehmen." }
          - { key: c, text: "Einen komplett neuen Antrag woanders stellen." }
        answer: a
        why: "Eine höfliche Nachfrage klärt schnell den aktuellen Stand."
      - q: "Der passende Anpassungslehrgang ist gerade nicht verfügbar. — The right adaptation course isn't currently available."
        options:
          - { key: a, text: "Ganz auf die Anerkennung verzichten." }
          - { key: b, text: "Nach alternativen Anbietern oder einem späteren Kurstermin fragen." }
          - { key: c, text: "Sich einen falschen Nachweis besorgen." }
        answer: b
        why: "Eine Nachfrage nach Alternativen hält den Weg zur Anerkennung offen."
      - q: "Sie merken, dass die beglaubigte Übersetzung fehlerhaft ist. — You notice the certified translation contains errors."
        options:
          - { key: a, text: "Die fehlerhafte Übersetzung einfach so einreichen." }
          - { key: b, text: "Selbst versuchen, den Fehler zu korrigieren." }
          - { key: c, text: "Eine korrigierte Übersetzung beim Übersetzungsbüro anfordern." }
        answer: c
        why: "Nur eine korrigierte beglaubigte Übersetzung wird von der Behörde akzeptiert."
      - q: "Sie sind mit dem Bescheid der Anerkennungsstelle nicht einverstanden. — You disagree with the recognition authority's decision."
        options:
          - { key: a, text: "Fristgerecht schriftlich Widerspruch einlegen." }
          - { key: b, text: "Den Bescheid einfach akzeptieren, ohne nachzufragen." }
          - { key: c, text: "Der Behörde eine wütende Nachricht schreiben." }
        answer: a
        why: "Ein fristgerechter schriftlicher Widerspruch ist der offizielle Weg zur Klärung."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Mein Abschluss wurde leider nur teilweise {1}. (akzeptiert, Partizip)
      2. Die Anerkennungsstelle hat fehlende Unterlagen {2}. (verlangt, Partizip)
      3. Die Bearbeitung hat deutlich länger {3} als angekündigt. (gebraucht, Partizip)
      4. Der passende Lehrgang war schon {4}. (voll besetzt, Partizip)
      5. Die Übersetzung wurde leider fehlerhaft {5}. (falsch gemacht, Partizip)
      6. Gegen den Bescheid habe ich fristgerecht Widerspruch {6}. (eingereicht, Partizip)
    answers:
      "1": anerkannt
      "2": nachgefordert
      "3": gedauert
      "4": ausgebucht
      "5": angefertigt
      "6": eingelegt

