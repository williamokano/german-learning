lesson: "SIT/32-im-hotel-a2"
title: "Im Hotel — A2"
topic: "Hotelaufenthalt"
category: "Unterwegs"
level: A2
summary: "Einchecken, nach Frühstück und WLAN fragen, ein Problem im Zimmer melden, spät auschecken und die Rechnung prüfen."
intro: >
  Ein Hotelaufenthalt besteht aus drei Gesprächen an derselben
  Rezeption. Beim Einchecken geht es um Reservierung, Ausweis,
  Zimmernummer, Frühstückszeit und WLAN. In der Mitte kommt das, was
  im Zimmer nicht stimmt — die Heizung, der Lärm vom Hof, das fehlende
  Handtuch. Und beim Auschecken um die Rechnung: die Minibar, die man
  nicht angerührt hat, und die Frage, ob man das Gepäck noch ein paar
  Stunden dalassen darf. Grammatik nach Bedarf: Perfekt für das, was
  passiert ist, Wechselpräpositionen im Zimmer, höfliche Bitten mit
  könnten und würden. Blocks: A Wortschatz & Redemittel → B Dialoge →
  C Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Zimmer, Rezeption oder Rechnung?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: zimmer, label: "Im Zimmer" }
      - { key: rezeption, label: "An der Rezeption" }
      - { key: rechnung, label: "Auf der Rechnung" }
    tokens:
      - { text: "das Handtuch", bucket: zimmer }
      - { text: "die Reservierung", bucket: rezeption }
      - { text: "die Kurtaxe", bucket: rechnung }
      - { text: "die Klimaanlage", bucket: zimmer }
      - { text: "die Zimmerkarte", bucket: rezeption }
      - { text: "die Minibar", bucket: rechnung }
      - { text: "der Wasserkocher", bucket: zimmer }
      - { text: "das Gepäckdepot", bucket: rezeption }
      - { text: "der Frühstückspreis", bucket: rechnung }
      - { text: "der Föhn", bucket: zimmer }
      - { text: "der Weckruf", bucket: rezeption }
      - { text: "die Endreinigung", bucket: rechnung }

  - id: A2
    block: A
    type: matching
    title: "Frage und Antwort an der Rezeption"
    instructions: "Ordne jeder Frage eine passende Antwort zu."
    instructionsEn: "Match each question with a fitting answer."
    left:
      - { key: "1", text: "Ich habe eine Reservierung auf den Namen Marchetti." }
      - { key: "2", text: "Wann gibt es Frühstück?" }
      - { key: "3", text: "Wie ist das WLAN-Passwort?" }
      - { key: "4", text: "Bis wann müssen wir auschecken?" }
      - { key: "5", text: "Die Heizung funktioniert nicht." }
      - { key: "6", text: "Können wir das Gepäck hierlassen?" }
      - { key: "7", text: "Ist die Kurtaxe im Preis enthalten?" }
      - { key: "8", text: "Könnten Sie uns um sieben wecken?" }
    right:
      - { key: a, text: "Einen Moment … ja, zwei Nächte, Doppelzimmer. Ihren Ausweis, bitte." }
      - { key: b, text: "Von 6:30 bis 10 Uhr im Raum neben der Lobby." }
      - { key: c, text: "Es steht auf der Rückseite der Zimmerkarte." }
      - { key: d, text: "Bis 11 Uhr, später gegen Aufpreis." }
      - { key: e, text: "Das tut mir leid, ich schicke gleich jemanden hoch." }
      - { key: f, text: "Natürlich, das Depot ist gleich links." }
      - { key: g, text: "Nein, die kommt mit 2,50 € pro Nacht dazu." }
      - { key: h, text: "Mache ich, ich trage den Weckruf ein." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Was ist im Zimmer los? Perfekt"
    instructions: "Ergänze das Hilfsverb oder das Partizip."
    instructionsEn: "Fill in the auxiliary or the participle."
    text: |
      1. Die Heizung {1} die ganze Nacht nicht {2}. (gehen)
      2. Ich {3} aus der Minibar nichts {4}. (nehmen)
      3. Das Fenster {5} sich nicht schließen. (lassen, 3. Person Singular)
      4. Wir {6} wegen des Lärms kaum {7}. (schlafen)
      5. Jemand {8} das Handtuch nicht {9}. (wechseln)
      6. Der Föhn {10} kaputt. (sein, Präteritum)
    answers:
      "1": ist
      "2": gegangen
      "3": habe
      "4": genommen
      "5": lässt
      "6": haben
      "7": geschlafen
      "8": hat
      "9": gewechselt
      "10": war

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Wo im Zimmer? Wechselpräpositionen"
    instructions: "Ergänze die Präposition mit dem Artikel."
    instructionsEn: "Fill in the preposition with the article."
    text: |
      1. Der Föhn liegt {1} Schublade. (in + der — Ort)
      2. Legen Sie die Zimmerkarte bitte {2} Halterung. (in + die — Richtung)
      3. Das Frühstück ist {3} Raum neben der Lobby. (in + dem, kurz)
      4. Ein Handtuch hängt {4} Bad. (in + dem, kurz)
      5. Bitte stellen Sie den Koffer {5} Schrank. (neben + den — Richtung)
      6. Das Gepäckdepot ist {6} Rezeption. (neben + der — Ort)
    answers:
      "1": in der
      "2": in die
      "3": im
      "4": im
      "5": neben den
      "6": neben der

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Einchecken"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Abend, ich habe eine {1} auf den Namen Marchetti.
      — Guten Abend. Einen Moment … ja, zwei Nächte, {2}. Darf ich
      Ihren {3} sehen?
      — Hier, bitte. Ist die {4} im Preis enthalten?
      — Nein, die kommt mit 2,50 € pro Nacht dazu.
      — Alles klar. Wann gibt es {5}?
      — Von 6:30 bis 10 Uhr, im Raum neben der Lobby. Und hier ist Ihre
      {6}, Zimmer 214, zweiter Stock.
      — Danke. Wie ist das {7}-Passwort?
      — Es steht auf der Rückseite der Karte.
      — Und bis wann müssen wir {8}?
      — Bis 11 Uhr. Wenn Sie später wollen, sagen Sie einfach Bescheid,
      das kostet 15 €. Das {9} können Sie danach hier lassen.
      — Sehr gut. Könnten Sie uns morgen um sieben {10}?
      — Mache ich, ich trage den Weckruf ein. Gute Nacht!
    bank: [RESERVIERUNG, DOPPELZIMMER, AUSWEIS, KURTAXE, FRÜHSTÜCK, ZIMMERKARTE, WLAN, AUSCHECKEN, GEPÄCK, WECKEN, MINIBAR, RECHNUNG, SCHLÜSSEL, EINZELZIMMER]
    answers:
      "1": RESERVIERUNG
      "2": DOPPELZIMMER
      "3": AUSWEIS
      "4": KURTAXE
      "5": FRÜHSTÜCK
      "6": ZIMMERKARTE
      "7": WLAN
      "8": AUSCHECKEN
      "9": GEPÄCK
      "10": WECKEN

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du kommst an und willst einchecken. — You arrive and want to check in."
        options:
          - { key: a, text: "Guten Abend, ich habe eine Reservierung auf den Namen Marchetti." }
          - { key: b, text: "Ich habe ein Zimmer." }
          - { key: c, text: "Marchetti." }
        answer: a
        why: "Gruß, das Wort „Reservierung“ und der Name — damit ist der Vorgang sofort gefunden."
      - q: "Die Heizung geht nicht. — The heating isn't working."
        options:
          - { key: a, text: "Es ist kalt." }
          - { key: b, text: "Entschuldigung, in Zimmer 214 geht die Heizung nicht — könnte jemand nachsehen?" }
          - { key: c, text: "Das Zimmer ist schlecht." }
        answer: b
        why: "Zimmernummer, Problem und Bitte — so wird tatsächlich jemand geschickt."
      - q: "Du willst später auschecken. — You want to check out later."
        options:
          - { key: a, text: "Wir bleiben länger." }
          - { key: b, text: "Ich checke um zwei aus." }
          - { key: c, text: "Wäre ein späterer Check-out möglich? Unser Zug geht erst um 15 Uhr." }
        answer: c
        why: "Als Frage plus Grund — dann wird oft kulant entschieden, statt den Aufpreis zu verlangen."
      - q: "Auf der Rechnung steht die Minibar, die du nicht benutzt hast. — The bill lists the minibar you didn't use."
        options:
          - { key: a, text: "Sie haben falsch abgerechnet." }
          - { key: b, text: "Hier steht Minibar 6 € — daraus habe ich nichts genommen. Könnten Sie das bitte prüfen?" }
          - { key: c, text: "Ich zahle das nicht." }
        answer: b
        why: "Auf die Zeile zeigen und um Prüfung bitten: Minibar-Fehler sind häufig und schnell korrigiert."
      - q: "Du brauchst ein zusätzliches Handtuch. — You need an extra towel."
        options:
          - { key: a, text: "Könnten Sie uns bitte noch ein Handtuch aufs Zimmer bringen? 214." }
          - { key: b, text: "Wir haben zu wenig Handtücher." }
          - { key: c, text: "Ich hole mir eins." }
        answer: a
        why: "Bitte plus Zimmernummer — der Rest passiert von selbst."
      - q: "Es ist laut vom Hof und du willst ein anderes Zimmer. — It's noisy from the courtyard and you want another room."
        options:
          - { key: a, text: "Das Zimmer ist unmöglich." }
          - { key: b, text: "Es ist sehr laut zum Hof hin — hätten Sie eventuell ein ruhigeres Zimmer frei?" }
          - { key: c, text: "Ich will ein anderes Zimmer." }
        answer: b
        why: "Grund nennen und höflich fragen — „hätten Sie eventuell“ macht ein Nein für beide leicht."

  - id: B3
    block: B
    type: order
    title: "Sätze im Hotel bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "habe", "eine", "Reservierung", "auf", "den", "Namen", "Marchetti"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "auf + Akkusativ bei Reservierungen"
      - tiles: ["Bis", "wann", "müssen", "wir", "auschecken", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Modalverb an Position 3, Infinitiv am Ende"
      - tiles: ["Die", "Heizung", "ist", "die", "ganze", "Nacht", "nicht", "gegangen"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Perfekt mit sein, Partizip am Ende"
      - tiles: ["Aus", "der", "Minibar", "habe", "ich", "nichts", "genommen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "aus + Dativ; Perfekt mit haben"
      - tiles: ["Könnten", "Sie", "uns", "um", "sieben", "wecken", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Konjunktiv II an Position 1, Infinitiv am Ende"
      - tiles: ["Hätten", "Sie", "eventuell", "ein", "ruhigeres", "Zimmer", "frei", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Komparativ ruhiger + Endung -es bei Neutrum"

  - id: B4
    block: B
    type: true-false
    title: "Die Hotelinformation lesen"
    instructions: |
      > **Hotel Alte Post — Gästeinformation**
      >
      > - **Check-in ab 15 Uhr**, **Check-out bis 11 Uhr**. Später
      >   Check-out bis 14 Uhr **auf Anfrage, 15 €**.
      > - **Frühstück 6:30–10 Uhr** (Sa/So bis 11 Uhr), **14 € pro
      >   Person**, wenn nicht gebucht.
      > - **Kurtaxe 2,50 € pro Person und Nacht**, nicht im
      >   Zimmerpreis enthalten.
      > - **WLAN kostenlos**, Passwort auf der Zimmerkarte.
      > - **Gepäckdepot** neben der Rezeption, auch nach dem
      >   Check-out.
      > - **Zimmerreinigung täglich**; Handtuchwechsel nur, wenn das
      >   Handtuch **im Waschbecken** liegt.
      > - **Parkplatz 12 € pro Nacht**, Anmeldung an der Rezeption
      >   nötig (Kennzeichen).
      > - Stornierung **kostenfrei bis 18 Uhr am Anreisetag**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Sonntags kann man bis 11 Uhr frühstücken. — On Sundays you can have breakfast until 11 am."
        answer: true
        why: "„Sa/So bis 11 Uhr.“"
      - q: "Die Kurtaxe ist schon im Zimmerpreis. — The tourist tax is already in the room price."
        answer: false
        why: "Sie ist ausdrücklich nicht enthalten."
      - q: "Für das WLAN zahlt man extra. — You pay extra for the wi-fi."
        answer: false
        why: "„WLAN kostenlos.“"
      - q: "Nach dem Check-out kann man das Gepäck noch dalassen. — After check-out you can still leave your luggage."
        answer: true
        why: "„Gepäckdepot … auch nach dem Check-out.“"
      - q: "Handtücher werden jeden Tag automatisch gewechselt. — Towels are changed automatically every day."
        answer: false
        why: "Nur, wenn sie im Waschbecken liegen."
      - q: "Für den Parkplatz muss man das Kennzeichen angeben. — For the car park you have to give your number plate."
        answer: true
        why: "„Anmeldung an der Rezeption nötig (Kennzeichen).“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas nicht stimmt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du kommst um 13 Uhr an, Check-in ist ab 15 Uhr. — You arrive at 1 pm, check-in is from 3 pm."
        options:
          - { key: a, text: "Ist das Zimmer vielleicht schon frei? Sonst lasse ich gern das Gepäck hier und komme später." }
          - { key: b, text: "Ich warte hier." }
          - { key: c, text: "Zwei Stunden sind zu lang." }
        answer: a
        why: "Fragen und gleich die Alternative anbieten — oft ist ein Zimmer schon fertig."
      - q: "Das Zimmer ist nicht das, was du gebucht hast. — The room isn't what you booked."
        options:
          - { key: a, text: "Damit leben." }
          - { key: b, text: "Ich hatte ein Doppelzimmer mit Blick zum Park gebucht — hier ist die Bestätigung. Was lässt sich machen?" }
          - { key: c, text: "Das ist eine Frechheit." }
        answer: b
        why: "Buchung, Beleg und offene Frage — so bekommst du entweder ein anderes Zimmer oder eine Anpassung."
      - q: "Nachts ist es sehr laut, es ist zwei Uhr. — It's very loud at 2 am."
        options:
          - { key: a, text: "Selbst an der Nachbartür klopfen." }
          - { key: b, text: "Bis morgen warten." }
          - { key: c, text: "An der Rezeption anrufen — dafür ist der Nachtdienst da." }
        answer: c
        why: "Das Hotel regelt es; selbst zu klopfen macht aus einem Lärmproblem einen Streit."
      - q: "Beim Auschecken stimmt die Summe nicht. — At check-out the total is wrong."
        options:
          - { key: a, text: "Zahlen und später schreiben." }
          - { key: b, text: "Könnten wir das kurz zusammen durchgehen? Ich komme auf einen anderen Betrag." }
          - { key: c, text: "Ich zahle nur die Hälfte." }
        answer: b
        why: "Gemeinsam durchgehen, solange ihr beide davorsteht — später ist es viel mühsamer."
      - q: "Du hast etwas im Zimmer vergessen und bist schon weg. — You left something in the room and have already gone."
        options:
          - { key: a, text: "Sofort anrufen, das Zimmer und den Gegenstand nennen und nach dem Nachsenden fragen." }
          - { key: b, text: "Es abschreiben." }
          - { key: c, text: "Nächstes Mal danach fragen." }
        answer: a
        why: "Je früher, desto eher liegt es noch im Zimmer; Zimmernummer und Beschreibung sind alles, was sie brauchen."
      - q: "Der Weckruf kam nicht. — The wake-up call didn't come."
        options:
          - { key: a, text: "Sie haben mich nicht geweckt!" }
          - { key: b, text: "Der Weckruf für sieben Uhr ist leider nicht gekommen — können Sie schauen, ob er eingetragen war?" }
          - { key: c, text: "Nichts sagen." }
        answer: b
        why: "Sachlich melden und um Prüfung bitten; oft war es ein Eintragungsfehler, den sie sofort sehen."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe eine {1} auf den Namen Marchetti. (gebuchtes Zimmer)
      2. Die {2} kostet 2,50 € pro Nacht extra. (Abgabe für Übernachtungsgäste)
      3. Wir möchten später {3}. (das Zimmer verlassen und zahlen)
      4. Das {4} können wir hierlassen. (die Koffer)
      5. Aus der {5} habe ich nichts genommen. (kleiner Kühlschrank im Zimmer)
      6. Könnten Sie uns um sieben {6}? (aufwecken)
    answers:
      "1": Reservierung
      "2": Kurtaxe
      "3": auschecken
      "4": Gepäck
      "5": Minibar
      "6": wecken

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Ich habe eine {1} auf den Namen … (reservation)
      2. Darf ich Ihren {2} sehen? (ID)
      3. Ist die {3} im Preis enthalten? (tourist tax)
      4. Wann gibt es {4}? (breakfast)
      5. Hier ist Ihre {5}. (room card)
      6. Wie ist das {6}-Passwort? (wi-fi)
      7. Bis wann müssen wir {7}? (check out)
      8. Können wir das {8} hierlassen? (luggage)
      9. Die Heizung ist nicht {9}. (worked — gehen im Perfekt)
      10. Aus der {10} habe ich nichts genommen. (the small fridge in the room)
      11. {11} Sie uns um sieben wecken? (could you)
      12. {12} Sie eventuell ein ruhigeres Zimmer? (would you have)
    answers:
      "1": Reservierung
      "2": Ausweis
      "3": Kurtaxe
      "4": Frühstück
      "5": Zimmerkarte
      "6": WLAN
      "7": auschecken
      "8": Gepäck
      "9": gegangen
      "10": Minibar
      "11": Könnten
      "12": Hätten

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: drei Gespräche an derselben Rezeption"
    prompt: "Schreib drei Szenen: einchecken, ein Problem melden, auschecken. Zusammen 16–20 Sätze."
    stimulus: |
      Du bist zwei Nächte im Hotel Alte Post, Doppelzimmer 214. In der
      ersten Nacht geht die Heizung nicht und es ist laut zum Hof. Beim
      Auschecken steht die Minibar mit 6 € auf der Rechnung, obwohl du
      nichts genommen hast. Dein Zug geht erst um 15 Uhr.

      Szene 1 — einchecken:
      1. dich melden und die Reservierung nennen
      2. nach Frühstück und WLAN fragen
      3. nach der Kurtaxe fragen
      4. einen Weckruf bestellen

      Szene 2 — das Problem:
      5. die Heizung melden — mit Zimmernummer
      6. den Lärm ansprechen und nach einem anderen Zimmer fragen

      Szene 3 — auschecken:
      7. die Minibar auf der Rechnung ansprechen
      8. nach spätem Check-out fragen — mit Grund
      9. das Gepäckdepot klären
      10. dich bedanken
    use:
      - "Sie-Form durchgehend"
      - "Perfekt: `Die Heizung ist nicht gegangen.`"
      - "`Könnten Sie …?` und `Hätten Sie eventuell …?`"
      - "`Aus der Minibar habe ich nichts genommen.`"
    selfCheck:
      - "Steht im Perfekt das Partizip am Satzende?"
      - "Nennst du bei jedem Problem die Zimmernummer?"
      - "Sind die Bitten im Konjunktiv II (könnten, hätten, wäre)?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Szene 1 — einchecken**

      Ich: Guten Abend, ich habe eine Reservierung auf den Namen Marchetti.
      Rezeption: Einen Moment … ja, zwei Nächte, Doppelzimmer. Ihren Ausweis, bitte.
      Ich: Hier. Wann gibt es Frühstück, und wie ist das WLAN-Passwort?
      Rezeption: Frühstück von 6:30 bis 10 Uhr, das Passwort steht auf der Zimmerkarte.
      Ich: Ist die Kurtaxe im Preis enthalten?
      Rezeption: Nein, 2,50 € pro Person und Nacht kommen dazu.
      Ich: Alles klar. Könnten Sie uns morgen um sieben wecken?
      Rezeption: Mache ich, ich trage den Weckruf ein. Zimmer 214, zweiter Stock.

      **Szene 2 — das Problem**

      Ich: Guten Morgen. In Zimmer 214 ist die Heizung die ganze Nacht nicht gegangen.
      Rezeption: Das tut mir leid, ich schicke gleich jemanden hoch.
      Ich: Danke. Und es war sehr laut zum Hof hin — hätten Sie eventuell ein ruhigeres Zimmer frei?
      Rezeption: Zur Straße hin ist heute etwas frei geworden. Ich lasse Ihre Sachen umziehen.
      Ich: Das wäre super, vielen Dank.

      **Szene 3 — auschecken**

      Ich: Guten Morgen, ich möchte auschecken, Zimmer 214.
      Rezeption: Gern, hier ist Ihre Rechnung.
      Ich: Hier steht Minibar 6 € — daraus habe ich nichts genommen. Könnten Sie das bitte prüfen?
      Rezeption: Sie haben recht, das gehört zum Vorgänger. Ich nehme es raus.
      Ich: Danke. Wäre ein späterer Check-out möglich? Unser Zug geht erst um 15 Uhr.
      Rezeption: Bis 14 Uhr für 15 € — oder Sie checken aus und lassen das Gepäck hier.
      Ich: Dann lieber das Depot. Wo ist das?
      Rezeption: Gleich links neben der Rezeption.
      Ich: Perfekt. Vielen Dank für alles!
