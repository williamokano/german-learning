  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Sperrung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mein Handy sofort sperren lassen. (Modalverb, ich-Form)
      2. {2} Sie mir bei der Anzeige helfen? (können, Sie-Form)
      3. Ich {3} schon die SIM-Karte gesperrt. (haben, Perfekt)
      4. {4} ich die IMEI-Nummer angeben? (müssen, ich-Form)
      5. Falls das Handy gestohlen {5}, brauche ich eine Anzeige für die Versicherung. (werden, Präsens Passiv)
      6. Die Polizei {6} mir eine Kopie der Anzeige geben. (werden, Futur I)
      7. Wir {7} schon die Versicherung informiert. (haben, Perfekt)
      8. {8} ich das Handy auch beim Fundbüro melden? (sollen, ich-Form)
    answers:
      "1": muss
      "2": Können
      "3": habe
      "4": Muss
      "5": wird
      "6": wird
      "7": haben
      "8": Soll

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Zuerst lasse ich mein Handy beim Anbieter {1}. (unbenutzbar machen, Infinitiv)
      2. Ohne {2} kann niemand mit meiner Nummer telefonieren. (die Karte mit der Telefonnummer)
      3. Bei der Polizei {3} ich eine Anzeige. (einen Vorfall offiziell melden, ich-Form)
      4. Für die Anzeige brauche ich die {4} meines Handys. (die eindeutige Seriennummer)
      5. Vielleicht wurde das Handy ja gefunden — ich frage im {5} nach. (die Stelle für gefundene Gegenstände)
      6. Zum Glück habe ich eine {6} abgeschlossen. (die Versicherung gegen Verlust oder Diebstahl)
    answers:
      "1": sperren
      "2": SIM-Karte
      "3": erstatte
      "4": IMEI-Nummer
      "5": Fundbüro
      "6": Handyversicherung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beim Anbieter und bei der Polizei"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, ich habe mein Handy verloren und möchte es sofort
      {1} lassen.
      — Kein Problem, ich blockiere gleich Ihre {2}. Haben Sie die
      Rufnummer zur Hand?
      — Ja, hier ist sie. Und was mache ich jetzt wegen des Handys
      selbst?
      — Am besten erstatten Sie eine {3} bei der Polizei, das
      brauchen Sie auch für die Versicherung.
      (bei der Polizei)
      — Guten Tag, ich möchte eine {4} für mein verlorenes Handy
      machen.
      — Kein Problem, haben Sie die {5} zur Hand?
      — Ja, die steht zum Glück noch auf der Verpackung.
      — Gut, dann schreibe ich das gleich auf. Wo genau haben Sie
      es zuletzt gesehen?
      — Im Bus, ich glaube, es ist mir aus der Tasche {6}.
      — Verstehe, ich notiere das als Verlust, nicht als {7}.
      — Bekomme ich eine Kopie für die {8}?
      — Natürlich, die {9} ich Ihnen gleich {10}.
    bank: [SPERREN, SIMKARTE, ANZEIGE, VERLUSTANZEIGE, IMEI, GERUTSCHT, DIEBSTAHL, HANDYVERSICHERUNG, STELLE, AUS, FUNDBÜRO, GARANTIE, RECHNUNG, PASSWORT]
    answers:
      "1": SPERREN
      "2": SIMKARTE
      "3": ANZEIGE
      "4": VERLUSTANZEIGE
      "5": IMEI
      "6": GERUTSCHT
      "7": DIEBSTAHL
      "8": HANDYVERSICHERUNG
      "9": STELLE
      "10": AUS

  - id: B2
    block: B
    type: single-choice
    title: "Sperren und Anzeigen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest dein verlorenes Handy sofort sperren lassen. — You want your lost phone blocked immediately."
        options:
          - { key: a, text: "Handys interessieren mich nicht." }
          - { key: b, text: "Ich möchte mein Handy sofort sperren lassen." }
          - { key: c, text: "Ich warte einfach ab, ob es sich meldet." }
        answer: b
        why: "Ein schnelles Sperren verhindert Missbrauch durch andere."
      - q: "Du möchtest bei der Polizei eine Anzeige für dein verlorenes Handy machen. — You want to file a report with the police for your lost phone."
        options:
          - { key: a, text: "Anzeigen sind mir zu kompliziert." }
          - { key: b, text: "Ich mache mir da keine Gedanken." }
          - { key: c, text: "Ich möchte eine Verlustanzeige für mein Handy machen." }
        answer: c
        why: "Eine klare Aussage ist der übliche Einstieg bei der Polizei."
      - q: "Die Polizei fragt nach der IMEI-Nummer. — The police ask for the IMEI number."
        options:
          - { key: a, text: "Die IMEI-Nummer steht zum Glück noch auf der Verpackung." }
          - { key: b, text: "Nummern interessieren mich nicht." }
          - { key: c, text: "Ich habe keine Ahnung, was das ist." }
        answer: a
        why: "Die Verpackung ist oft die einfachste Quelle für die IMEI-Nummer."
      - q: "Du möchtest wissen, ob es sich um einen Diebstahl oder einen Verlust handelt. — You want to know whether it's theft or simply loss."
        options:
          - { key: a, text: "Ich beschuldige einfach jemanden, ohne sicher zu sein." }
          - { key: b, text: "Ich glaube, es ist mir einfach aus der Tasche gerutscht." }
          - { key: c, text: "Das ist mir egal, Hauptsache neues Handy." }
        answer: b
        why: "Eine ehrliche Einschätzung hilft der Polizei, den richtigen Vorfall zu erfassen."
      - q: "Du möchtest eine Kopie der Anzeige für die Versicherung. — You want a copy of the report for the insurance."
        options:
          - { key: a, text: "Kopien interessieren mich nicht." }
          - { key: b, text: "Versicherungen brauche ich sowieso nicht." }
          - { key: c, text: "Bekomme ich eine Kopie für meine Handyversicherung?" }
        answer: c
        why: "Eine direkte Frage stellt sicher, dass man die Kopie für die Versicherung bekommt."
      - q: "Du möchtest wissen, ob dein Handy vielleicht im Fundbüro abgegeben wurde. — You want to know whether your phone might have been turned in at the lost and found."
        options:
          - { key: a, text: "Könnte mein Handy vielleicht im Fundbüro abgegeben worden sein?" }
          - { key: b, text: "Fundbüros interessieren mich nicht." }
          - { key: c, text: "Ich gebe die Suche direkt auf." }
        answer: a
        why: "Eine Nachfrage beim Fundbüro lohnt sich oft und ist einen Versuch wert."

  - id: B3
    block: B
    type: order
    title: "Sätze zum verlorenen Handy bauen"
