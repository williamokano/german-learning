lesson: "SIT/75-handy-verloren-a2"
title: "Handy verloren: Anzeige bei der Polizei — A2"
topic: "Handy verloren: Anzeige bei der Polizei"
category: "Wenn etwas schiefgeht"
level: A2
summary: "Das Handy sperren lassen, bei der Polizei eine Verlustanzeige machen, die IMEI-Nummer angeben — und was tun, wenn die Versicherung eine Anzeige verlangt oder das Handy doch wieder auftaucht."
intro: >
  Ist das Handy erst mal weg, zählt jede Minute: die SIM-Karte sperren
  lassen, bei der Polizei eine Verlustanzeige machen und die
  IMEI-Nummer bereithalten. Dieses Set übt genau das — das Handy sofort
  sperren lassen, den Vorfall bei der Polizei schildern, und was zu
  tun ist, wenn die Versicherung noch eine Anzeige verlangt oder das
  Handy Tage später doch wieder auftaucht. Grammatik nach Bedarf:
  Perfekt im Bericht, höfliche Fragen, Nebensätze mit falls. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

