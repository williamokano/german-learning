        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum verlorenen Handy lesen"
    instructions: |
      > **Info — Handy verloren**
      >
      > - **Sofortmaßnahme:** SIM-Karte und Handy **innerhalb
      >   weniger Minuten** sperren lassen.
      > - **Anzeige:** bei Diebstahl **immer**, bei einfachem
      >   Verlust **empfohlen**, z. B. für die Versicherung.
      > - **IMEI-Nummer:** steht oft auf der **Originalverpackung**
      >   oder im Kaufbeleg.
      > - **Fundbüro:** lohnt sich nachzufragen, **viele Handys
      >   werden abgegeben**.
      > - **Handyversicherung:** übernimmt oft nur bei
      >   **Diebstahl**, nicht immer bei einfachem Verlust.
      > - **Daten:** viele Anbieter bieten eine
      >   **Fernlöschfunktion** für sensible Daten.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "SIM-Karte und Handy sollten innerhalb weniger Minuten gesperrt werden. — The SIM card and phone should be blocked within a few minutes."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum verlorenen Handy."
      - q: "Bei einfachem Verlust ist eine Anzeige grundsätzlich völlig sinnlos. — For a simple loss, filing a report is completely pointless."
        answer: false
        why: "Sie wird empfohlen, zum Beispiel für die Versicherung, nicht als sinnlos eingestuft."
      - q: "Die IMEI-Nummer steht oft auf der Originalverpackung oder im Kaufbeleg. — The IMEI number is often on the original packaging or the receipt."
        answer: true
        why: "„IMEI-Nummer: steht oft auf der Originalverpackung oder im Kaufbeleg.“"
      - q: "Beim Fundbüro nachzufragen lohnt sich nie. — Asking at the lost and found is never worthwhile."
        answer: false
        why: "Es lohnt sich, da viele Handys dort abgegeben werden."
      - q: "Eine Handyversicherung übernimmt oft nur bei Diebstahl, nicht immer bei einfachem Verlust. — Phone insurance often only covers theft, not always simple loss."
        answer: true
        why: "„Handyversicherung: übernimmt oft nur bei Diebstahl, nicht immer bei einfachem Verlust.“"
      - q: "Es gibt grundsätzlich keine Möglichkeit, Daten auf einem verlorenen Handy aus der Ferne zu löschen. — There's no way at all to remotely erase data on a lost phone."
        answer: false
        why: "Viele Anbieter bieten eine Fernlöschfunktion an."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim verlorenen Handy etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Man erinnert sich nicht mehr genau, wo das Handy verloren ging. — You can't quite remember where the phone was lost."
        options:
          - { key: a, text: "Einfach gar nichts der Polizei sagen." }
          - { key: b, text: "Den vermutlichen Tagesablauf rekonstruieren und der Polizei möglichst genau schildern." }
          - { key: c, text: "Irgendeinen Ort raten, nur damit man etwas sagt." }
        answer: b
        why: "Ein rekonstruierter Tagesablauf hilft der Polizei am meisten weiter."
      - q: "Die Handyversicherung verlangt eine polizeiliche Anzeige, die man noch nicht hat. — The phone insurance requires a police report you don't have yet."
        options:
          - { key: a, text: "Die Erstattung einfach aufgeben." }
          - { key: b, text: "Sich bei der Versicherung beschweren, ohne etwas nachzureichen." }
          - { key: c, text: "Schnellstmöglich die Anzeige nachreichen." }
        answer: c
        why: "Die fehlende Anzeige schnell nachzureichen ist der direkteste Weg zur Erstattung."
      - q: "Auf dem verlorenen Handy waren sensible Daten gespeichert. — Sensitive data was stored on the lost phone."
        options:
          - { key: a, text: "Sofort die Fernlöschfunktion nutzen, falls vorhanden." }
          - { key: b, text: "Sich keine weiteren Gedanken machen." }
          - { key: c, text: "Erst tagelang abwarten, bevor man etwas unternimmt." }
        answer: a
        why: "Eine sofortige Fernlöschung schützt die sensiblen Daten am wirksamsten."
      - q: "Der Anbieter sperrt die SIM-Karte nicht sofort. — The provider doesn't block the SIM card right away."
        options:
          - { key: a, text: "Einfach abwarten, ohne nachzufragen." }
          - { key: b, text: "Höflich, aber bestimmt auf einer schnellen Sperrung bestehen." }
          - { key: c, text: "Den Anbieter komplett wechseln, ohne nachzufragen." }
        answer: b
        why: "Ein bestimmtes Nachfragen beschleunigt die dringend nötige Sperrung."
      - q: "Man findet das Handy Tage später doch noch wieder. — You find the phone again a few days later."
        options:
          - { key: a, text: "Die Anzeige einfach bestehen lassen, ohne etwas zu sagen." }
          - { key: b, text: "Das gefundene Handy einfach weiter benutzen, ohne etwas zu klären." }
          - { key: c, text: "Die Anzeige bei der Polizei zurückziehen und die Sperrung aufheben lassen." }
        answer: c
        why: "Anzeige und Sperrung sollten aufgehoben werden, sobald das Handy wieder da ist."
      - q: "Die Versicherung lehnt die Erstattung ab, weil angeblich Fahrlässigkeit vorlag. — The insurance refuses reimbursement, claiming negligence."
        options:
          - { key: a, text: "Den Sachverhalt schriftlich schildern und Widerspruch einlegen." }
          - { key: b, text: "Die Ablehnung einfach akzeptieren." }
          - { key: c, text: "Sich nur mündlich beschweren, ohne etwas zu schreiben." }
        answer: a
        why: "Ein schriftlicher Widerspruch mit genauer Schilderung ist der wirksamste Weg zur Klärung."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe mich nicht mehr genau {1}, wo das Handy verloren ging. (Partizip reflexiv)
      2. Die Versicherung hat die Anzeige noch nicht {2}. (Partizip)
      3. Wir haben sofort die Fernlöschfunktion {3}. (Partizip)
      4. Der Anbieter hat die SIM-Karte nicht sofort {4}. (Partizip)
      5. Ich habe das Handy Tage später doch noch {5}. (Partizip)
      6. Die Versicherung hat die Erstattung {6}. (Partizip)
    answers:
      "1": erinnert
      "2": bekommen
      "3": genutzt
      "4": gesperrt
      "5": gefunden
      "6": abgelehnt

