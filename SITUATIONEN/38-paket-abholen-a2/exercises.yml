lesson: "SIT/38-paket-abholen-a2"
title: "Paket abholen und zurückschicken — A2"
topic: "Pakete und Retouren"
category: "Einkaufen"
level: A2
summary: "Benachrichtigungskarte, Filiale und Packstation, Vollmacht für Nachbarn, Retoure — und was gilt, wenn das Paket kaputt oder weg ist."
intro: >
  Kaum etwas passiert im deutschen Alltag so oft wie das: Du warst nicht
  da, im Briefkasten liegt eine Benachrichtigungskarte, und jetzt musst
  du herausfinden, wo dein Paket ist — beim Nachbarn, in der Filiale
  oder in der Packstation. Dazu kommt der Rückweg: etwas
  zurückschicken, das Retourenlabel, die Frist. Und die zwei
  Ärgerfälle, die jeder einmal hat: Das Paket ist beschädigt, oder es
  gilt als zugestellt und ist trotzdem nirgends. Grammatik nach Bedarf:
  Perfekt und Passiv, Wechselpräpositionen, Nebensätze mit falls und
  obwohl. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

