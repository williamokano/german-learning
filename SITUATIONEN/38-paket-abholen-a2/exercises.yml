      10. Ich lasse an die {10} liefern. (parcel locker)
      11. {11} das Paket verloren geht, brauche ich den Beleg. (in case)
      12. Ich stelle einen {12}. (tracing request)
    answers:
      "1": abholen
      "2": Benachrichtigungskarte
      "3": Abholfrist
      "4": Werktage
      "5": Vollmacht
      "6": Retourenlabel
      "7": Beleg
      "8": geklingelt
      "9": wurde
      "10": Packstation
      "11": Falls
      "12": Nachforschungsauftrag

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: Filiale und Beschwerde"
    prompt: "Schreib erst das Gespräch in der Filiale (10–12 Sätze), dann die Nachricht an den Händler (6–8 Sätze)."
    stimulus: |
      Im Briefkasten lag eine Benachrichtigungskarte: Sendung
      1Z998877665, abzuholen in der Filiale Lindenweg 22, Abholfrist
      sieben Werktage. Du willst außerdem eine Hose zurückschicken. Eine
      zweite Bestellung gilt seit fünf Tagen als zugestellt, ist aber
      nirgends aufgetaucht.

      Im Gespräch müssen vorkommen:
      1. das Paket abholen und die Karte zeigen
      2. nach der Abholfrist fragen
      3. fragen, ob deine Nachbarin abholen darf
      4. die Rücksendung abgeben
      5. nach dem Beleg fragen und warum man ihn braucht

      In der Nachricht müssen vorkommen:
      6. Bestellnummer und Datum nennen
      7. sagen, dass die Sendung als zugestellt gilt
      8. sagen, was du schon geprüft hast
      9. einen Nachforschungsauftrag und die Zustellbestätigung verlangen
      10. eine Frist setzen
    use:
      - "Sie-Form in der Filiale und in der Nachricht"
      - "Perfekt: `Der Bote hat zweimal geklingelt.`"
      - "Passiv: `Das Paket wurde … abgegeben.`"
      - "`Falls …` mit Verb am Ende"
    selfCheck:
      - "Steht im Perfekt und Passiv das Partizip am Satzende?"
      - "Nennt die Nachricht Bestellnummer UND Datum?"
      - "Sagst du, was du selbst schon geprüft hast?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **In der Filiale**

      Ich: Guten Tag, ich möchte ein Paket abholen. Hier ist die Benachrichtigungskarte.
      Mitarbeiter: Danke, und Ihren Ausweis bitte.
      Ich: Hier. — Sagen Sie, wie lange ist eigentlich die Abholfrist?
      Mitarbeiter: Sieben Werktage, danach geht die Sendung an den Absender zurück.
      Ich: Und wenn ich arbeite — darf meine Nachbarin es abholen?
      Mitarbeiter: Nur mit einer schriftlichen Vollmacht und ihrem Ausweis.
      Ich: Verstehe, das schreibe ich ihr. — Ich hätte noch eine Rücksendung. Diese Hose passt nicht.
      Mitarbeiter: Haben Sie ein Retourenlabel?
      Ich: Ja, ich habe es ausgedruckt.
      Mitarbeiter: Sehr gut. Sie bekommen einen Einlieferungsbeleg.
      Ich: Den brauche ich, falls das Paket unterwegs verloren geht, richtig?
      Mitarbeiter: Genau, heben Sie ihn auf, bis das Geld zurück ist.

      **Die Nachricht an den Händler**

      Betreff: Bestellung 4711-8890 vom 02.06. — als zugestellt gemeldet,
      nicht erhalten

      Sehr geehrte Damen und Herren,

      meine Bestellung 4711-8890 vom 02.06. wird in der Sendungsverfolgung
      seit dem 05.06. als zugestellt geführt. Erhalten habe ich sie nicht.

      Ich habe bei allen Nachbarn im Haus nachgefragt, den Hausflur und
      den Fahrradkeller geprüft und in der Filiale Lindenweg 22
      nachgesehen. Die Sendung ist an keiner dieser Stellen.

      Ich bitte Sie, einen Nachforschungsauftrag zu stellen und mir die
      Zustellbestätigung mit Unterschrift zukommen zu lassen.

      Über eine Rückmeldung bis zum 20.06. würde ich mich freuen.

      Mit freundlichen Grüßen
      C. Marchetti
