  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die Ummeldung planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mich beim Beitragsservice ummelden. (Modalverb, ich-Form)
      2. {2} Sie mir bei der Befreiung helfen? (können, Sie-Form)
      3. Ich {3} schon den Nachweis eingereicht. (haben, Perfekt)
      4. {4} ich eine Befreiung beantragen? (können, ich-Form)
      5. Falls ich eine Mahnung {5}, rufe ich sofort an. (bekommen, Präsens)
      6. Der Beitragsservice {6} sich in ein paar Wochen melden. (werden, Futur I)
