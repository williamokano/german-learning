  - id: D2
    block: D
    type: free-write
    title: "Ummelden, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: euch nach dem Umzug ummelden und eine Befreiung beantragen, ein Problem, weil trotz Nachweis eine Mahnung kommt, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr seid umgezogen und meldet euch beim Beitragsservice um.
      Wegen eures geringen Einkommens beantragt ihr eine Befreiung und
      reicht den Nachweis ein. Trotzdem bekommt ihr wenig später eine
      Mahnung.

      Beim Ummelden müssen vorkommen:
      1. sich beim Beitragsservice ummelden
      2. eine Befreiung beantragen
      3. den Nachweis einreichen

      Beim Problem müssen vorkommen:
      4. trotz Nachweis eine Mahnung bekommen
      5. sofort beim Beitragsservice anrufen
      6. den Fehler erklären

      In der Lösung müssen vorkommen:
      7. den Nachweis noch einmal vorlegen
      8. eine Entschuldigung vom Beitragsservice bekommen
      9. den korrigierten Bescheid erhalten
      10. sich über die endlich geklärte Sache freuen
    use:
      - "höfliche Frage: „Können wir eine Befreiung beantragen?“"
      - "Nebensatz mit falls: „Falls ich eine Mahnung bekomme, …“"
      - "Perfekt: „Wir haben den Nachweis eingereicht.“"
    selfCheck:
      - "Wird die Ummeldung klar beschrieben?"
      - "Klingt die Reaktion auf die Mahnung sachlich und bestimmt?"
      - "Wird der korrigierte Bescheid als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Ummelden**

      Ich: Guten Tag, wir sind kürzlich umgezogen und möchten uns beim Beitragsservice ummelden.
      Beitragsservice: Kein Problem, wie lautet die neue Adresse?
      Ich: Musterstraße 12. Können wir wegen unseres geringen Einkommens auch eine Befreiung beantragen?
      Beitragsservice: Ja, reichen Sie einfach einen Nachweis ein.

      **Das Problem**

      (einige Wochen später)
      Ich: Wir haben eine Mahnung bekommen, obwohl ich den Nachweis doch geschickt habe!
      Freund: Das kannst du nicht so stehen lassen, ruf sofort an.
      Ich: Guten Tag, ich habe trotz eingereichtem Nachweis eine Mahnung bekommen.

      **Die Lösung**

      Beitragsservice: Entschuldigung, das war ein Fehler bei uns, wir korrigieren das sofort.
      Ich: Vielen Dank, das beruhigt mich.
      (eine Woche später)
      Ich: Der korrigierte Bescheid ist angekommen — endlich alles geklärt!
