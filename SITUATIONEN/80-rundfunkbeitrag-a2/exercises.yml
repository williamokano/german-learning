  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Beim Beitragsservice"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, wir sind kürzlich umgezogen und möchten uns beim
      {1} {2}.
      — Kein Problem, wie lautet denn die neue Adresse?
      — Musterstraße 12, dritter Stock.
      — Danke, das trage ich gleich ein. Übrigens, der Beitrag
      gilt pro Wohnung, nicht pro Person, das nur zur Info.
      — Gut zu wissen. Ich habe noch eine Frage: Können wir wegen
      unseres geringen Einkommens eine {3} beantragen?
      — Ja, dafür brauchen Sie nur einen {4} vom Amt.
      — Den reiche ich dann so schnell wie möglich nach.
      — Perfekt, dann warten Sie einfach auf unseren {5}.
      (einige Wochen später)
      — Hey, wir haben eine {6} bekommen, obwohl ich den Nachweis
      doch geschickt habe!
      — Wirklich? Das ist bestimmt ein Fehler, ruf da am besten
      sofort an.
      — Mache ich gleich, das kann ich nicht {7} lassen.
      — Gut, und falls es nicht klappt, können wir ja {8}
      einlegen.
      — Genau, aber ich hoffe, das ist gar nicht {9}.
      — Ich {10} dir Bescheid, sobald ich mehr weiß.
    bank: [BEITRAGSSERVICE, UMMELDEN, BEFREIUNG, NACHWEIS, BESCHEID, MAHNUNG, STEHEN, WIDERSPRUCH, NÖTIG, GEBE, RATENZAHLUNG, LASTSCHRIFT, EINZUG, ANMELDUNG]
    answers:
      "1": BEITRAGSSERVICE
      "2": UMMELDEN
      "3": BEFREIUNG
      "4": NACHWEIS
      "5": BESCHEID
      "6": MAHNUNG
      "7": STEHEN
      "8": WIDERSPRUCH
      "9": NÖTIG
      "10": GEBE

  - id: B2
    block: B
    type: single-choice
    title: "Ummelden und Befreien"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest dich nach dem Umzug beim Beitragsservice ummelden. — You want to re-register with the fee service after moving."
        options:
          - { key: a, text: "Ummeldungen interessieren mich nicht." }
          - { key: b, text: "Wir möchten uns beim Beitragsservice ummelden." }
          - { key: c, text: "Das mache ich sowieso nie." }
        answer: b
        why: "Eine direkte, höfliche Aussage ist der übliche Einstieg bei der Ummeldung."
      - q: "Du möchtest wegen geringen Einkommens eine Befreiung beantragen. — You want to apply for an exemption due to low income."
        options:
          - { key: a, text: "Befreiungen sind mir zu kompliziert." }
          - { key: b, text: "Einkommen geht doch niemanden etwas an." }
          - { key: c, text: "Können wir wegen unseres geringen Einkommens eine Befreiung beantragen?" }
        answer: c
        why: "Eine direkte Frage klärt sofort, ob eine Befreiung möglich ist."
      - q: "Du möchtest wissen, welchen Nachweis du brauchst. — You want to know which proof document you need."
        options:
          - { key: a, text: "Welchen Nachweis brauche ich dafür genau?" }
          - { key: b, text: "Nachweise interessieren mich nicht." }
          - { key: c, text: "Ich reiche einfach irgendwas ein." }
        answer: a
        why: "Eine konkrete Frage klärt, welches Dokument tatsächlich nötig ist."
      - q: "Ihr bekommt trotz eingereichtem Nachweis eine Mahnung. — You receive a reminder despite having submitted proof."
        options:
          - { key: a, text: "Mahnungen sind mir egal." }
          - { key: b, text: "Das kann ich nicht so stehen lassen, ich rufe sofort an." }
          - { key: c, text: "Ich zahle einfach kommentarlos noch mal." }
        answer: b
        why: "Ein sofortiger Anruf klärt den offensichtlichen Fehler am schnellsten."
      - q: "Du möchtest wissen, ob der Beitrag pro Wohnung oder pro Person gilt. — You want to know whether the fee applies per household or per person."
        options:
          - { key: a, text: "Wohnungen interessieren mich nicht." }
          - { key: b, text: "Das ist mir völlig egal." }
          - { key: c, text: "Gilt der Beitrag pro Wohnung oder pro Person?" }
        answer: c
        why: "Eine direkte Frage klärt das wichtige Prinzip der Beitragspflicht."
      - q: "Ihr überlegt, ob ein Widerspruch nötig ist. — You're considering whether an objection is needed."
        options:
          - { key: a, text: "Falls es nicht klappt, können wir ja Widerspruch einlegen." }
          - { key: b, text: "Widerspruch ist mir zu aufwendig." }
          - { key: c, text: "Wir akzeptieren das einfach kommentarlos." }
        answer: a
        why: "Ein Widerspruch als Rückfalloption zeigt eine besonnene, vorausschauende Haltung."

  - id: B3
    block: B
    type: order
    title: "Sätze zum Rundfunkbeitrag bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Wir", "möchten", "uns", "beim", "Beitragsservice", "ummelden"]
