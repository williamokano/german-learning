lesson: "SIT/80-rundfunkbeitrag-a2"
title: "Rundfunkbeitrag — A2"
topic: "Rundfunkbeitrag"
category: "Behörden & Formelles"
level: A2
summary: "Sich nach dem Umzug beim Beitragsservice ummelden, eine Befreiung beantragen, einen Nachweis einreichen — und was tun, wenn trotz allem eine Mahnung kommt."
intro: >
  Der Rundfunkbeitrag betrifft jede Wohnung — nach einem Umzug muss man
  sich ummelden, bei geringem Einkommen kann man eine Befreiung
  beantragen, und ab und zu klärt sich eine unerwartete Mahnung mit
  einem kurzen Anruf. Dieses Set übt genau das: sich beim
  Beitragsservice ummelden, einen Nachweis für die Befreiung
  einreichen, und was zu tun ist, wenn trotzdem eine Mahnung kommt.
  Grammatik nach Bedarf: Perfekt und Passiv im Bericht, Nebensätze mit
  falls. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

