      - { text: "das Probetraining", bucket: training }
      - { text: "die Trainerin", bucket: gruppe }
      - { text: "der Mitgliedsbeitrag", bucket: anmeldung }
      - { text: "die Trainingszeit", bucket: training }
      - { text: "die Mannschaft", bucket: gruppe }
      - { text: "die Satzung", bucket: anmeldung }
      - { text: "die Sporthalle", bucket: training }
      - { text: "sich vorstellen", bucket: gruppe }
      - { text: "unterschreiben", bucket: anmeldung }
      - { text: "das Aufwärmen", bucket: training }
      - { text: "der Teamgeist", bucket: gruppe }

