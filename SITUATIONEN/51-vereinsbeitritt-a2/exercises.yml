  - id: D2
    block: D
    type: free-write
    title: "Probetraining, Anmeldung, Problem"
    prompt: "Schreib drei Teile: das Probetraining, ein kleines Problem und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du gehst zum Probetraining bei einem Volleyball-Verein. Nach dem
      Training merkst du, dass die Trainingszeit sich mit deiner Arbeit
      überschneidet.

      Beim Probetraining müssen vorkommen:
      1. dich kurz vorstellen
      2. sagen, ob du schon Erfahrung hast
      3. dich der Gruppe anschließen

      Nach dem Training müssen vorkommen:
      4. fragen, wie man Mitglied wird
      5. nach dem Mitgliedsbeitrag fragen
      6. merken, dass die Trainingszeit sich mit der Arbeit überschneidet

      In der Lösung müssen vorkommen:
      7. den Trainer nach einer anderen Trainingszeit fragen
      8. eine passende Alternative finden
      9. den Mitgliedsantrag ausfüllen
      10. dich für die Hilfe bedanken
    use:
      - "höfliche Frage: „Darf ich …?“, „Wie werde ich …?“"
      - "seit + Dativ: „Ich spiele seit drei Jahren.“"
      - "Passiv: „Der Beitrag wird abgebucht.“"
    selfCheck:
      - "Ist die Vorstellung kurz und freundlich?"
      - "Stehen die Fragen zu Beitrag und Mitgliedschaft klar formuliert?"
      - "Klingt die Reaktion auf die Terminüberschneidung konstruktiv, nicht genervt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Das Probetraining**

      Ich: Hallo, ich bin heute zum Probetraining hier.
      Trainerin: Schön, dass du da bist! Hast du schon Erfahrung mit Volleyball?
      Ich: Ich habe früher ein paar Jahre gespielt, aber das ist schon eine Weile her.
      Trainerin: Kein Problem, dann machst du einfach mit.

      **Nach dem Training**

      Ich: Das hat richtig Spaß gemacht! Wie werde ich Mitglied?
      Trainerin: Du füllst den Mitgliedsantrag aus und gibst ihn bei der Geschäftsstelle ab.
      Ich: Und wie hoch ist der Beitrag?
      Trainerin: 15 Euro im Monat, wird per Lastschrift abgebucht.
      Ich: Eine Frage noch — das Training ist immer dienstags um 18 Uhr?
      Trainerin: Genau.
      Ich: Das überschneidet sich leider mit meiner Arbeit.

      **Die Lösung**

      Ich: Gibt es vielleicht eine andere Trainingszeit oder Gruppe?
      Trainerin: Ja, mittwochs um 19:30 Uhr trainiert eine andere Gruppe auf ähnlichem Niveau.
      Ich: Das würde bei mir super passen.
      Trainerin: Dann trage ich dich gleich für die Mittwochsgruppe ein.
      Ich: Vielen Dank für die Hilfe, dann fülle ich jetzt den Mitgliedsantrag aus.
