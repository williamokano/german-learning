lesson: "SIT/51-vereinsbeitritt-a2"
title: "Einem Verein beitreten — A2"
topic: "Einem Verein beitreten"
category: "Freizeit & Kultur"
level: A2
summary: "Zum Probetraining gehen, sich der Gruppe vorstellen, den Mitgliedsantrag ausfüllen und den Beitrag klären."
intro: >
  Ein Verein beizutreten fängt fast immer mit einem Probetraining an —
  einmal unverbindlich mitmachen, bevor man sich entscheidet. Dazu
  gehört, sich kurz der Gruppe vorzustellen, den Mitgliedsantrag
  auszufüllen und zu klären, wie hoch der Beitrag ist und wie er bezahlt
  wird. Dieses Set übt genau das, plus das, was danach kommt: eine
  falsche Trainingsgruppe, eine unklare Frage im Formular, eine
  Terminüberschneidung. Grammatik nach Bedarf: Perfekt im Bericht,
  höfliche Fragen mit Konjunktiv II, Nebensätze mit dass/ob. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

