  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Sich vorstellen und anmelden"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} gern beim Probetraining mitmachen. (möchten, ich-Form)
      2. {2} ich mich kurz vorstellen? (dürfen, ich-Form)
      3. Man {3} den Mitgliedsantrag vollständig ausfüllen. (müssen)
      4. Der Beitrag {4} monatlich per Lastschrift abgebucht. (werden, Passiv Präsens)
      5. Ich {5} letzte Woche zum ersten Mal mitgemacht. (haben, Perfekt)
      6. {6} man den Verein jederzeit verlassen? (können)
      7. Ich {7} noch nicht, welche Gruppe zu meinem Niveau passt. (wissen, ich-Form)
      8. Wir {8} uns nach dem Training noch kurz unterhalten. (haben, Perfekt)
    answers:
      "1": möchte
      "2": Darf
      "3": muss
      "4": wird
      "5": habe
      "6": Kann
      "7": weiß
      "8": haben

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Beim {1} kann ich unverbindlich mitmachen, bevor ich mich entscheide. (das erste, unverbindliche Training)
      2. Um Mitglied zu werden, fülle ich den {2} aus. (das Anmeldeformular)
      3. Der monatliche {3} beträgt 15 Euro. (das regelmäßige Geld für die Mitgliedschaft)
      4. In der {4} stehen die Regeln des Vereins. (das Dokument mit den Vereinsregeln)
      5. Unsere {5} spielt jeden Samstag ein Spiel. (die Gruppe, mit der man zusammen spielt)
      6. Wenn ich aufhören möchte, muss ich schriftlich {6}. (die Mitgliedschaft offiziell beenden)
    answers:
      "1": Probetraining
      "2": Mitgliedsantrag
      "3": Mitgliedsbeitrag
      "4": Satzung
      "5": Mannschaft
      "6": kündigen

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am ersten Trainingsabend"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hallo, ich bin heute zum {1} hier.
      — Schön, dass du da bist! Wie heißt du?
      — Ich heiße Lukas und spiele seit ein paar Jahren {2} in
      meiner alten Stadt.
      — Perfekt, dann kannst du gleich bei uns {3}. Ich stelle dich
      kurz der {4} vor.
      (nach dem Training)
      — Das hat richtig Spaß gemacht! Wie {5} ich Mitglied?
      — Du füllst einfach den {6} aus und bringst ihn nächste Woche
      mit.
      — Und wie hoch ist der {7}?
      — 15 Euro im {8}, wird per Lastschrift {9}.
      — Alles klar, das {10} für mich.
    bank: [PROBETRAINING, FUSSBALL, MITMACHEN, MANNSCHAFT, WERDE, MITGLIEDSANTRAG, BEITRAG, MONAT, ABGEBUCHT, PASST, JAHR, TRAINER, SATZUNG, KAPITÄN]
    answers:
      "1": PROBETRAINING
      "2": FUSSBALL
      "3": MITMACHEN
      "4": MANNSCHAFT
      "5": WERDE
      "6": MITGLIEDSANTRAG
      "7": BEITRAG
      "8": MONAT
      "9": ABGEBUCHT
      "10": PASST

  - id: B2
    block: B
    type: single-choice
    title: "Sich der Gruppe vorstellen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du kommst zum ersten Mal zum Probetraining. — You come to the trial session for the first time."
        options:
          - { key: a, text: "Hallo, ich bin heute zum Probetraining hier." }
          - { key: b, text: "Ich bin hier, weil man mir das gesagt hat." }
          - { key: c, text: "Ich schaue nur kurz zu." }
        answer: a
        why: "Eine kurze, freundliche Vorstellung mit Grund ist der übliche Einstieg."
      - q: "Der Trainer fragt, ob du schon Erfahrung hast. — The coach asks if you already have experience."
        options:
          - { key: a, text: "Erfahrung ist mir egal." }
          - { key: b, text: "Ich spiele seit ein paar Jahren, in meiner alten Stadt." }
          - { key: c, text: "Frag mich später." }
        answer: b
        why: "Eine kurze, konkrete Antwort hilft dem Trainer, dich richtig einzuschätzen."
      - q: "Du möchtest wissen, wie man Mitglied wird. — You want to know how to become a member."
        options:
          - { key: a, text: "Mitgliedschaft interessiert mich nicht." }
          - { key: b, text: "Das mache ich schon irgendwie." }
          - { key: c, text: "Wie werde ich Mitglied?" }
        answer: c
        why: "Eine direkte Frage ist der einfachste Weg zu einer klaren Antwort."
      - q: "Du möchtest wissen, wie hoch der Mitgliedsbeitrag ist. — You want to know how much the membership fee is."
        options:
          - { key: a, text: "Und wie hoch ist der Beitrag?" }
          - { key: b, text: "Geld ist mir egal." }
          - { key: c, text: "Ich zahle einfach, was Sie sagen." }
        answer: a
        why: "Nach dem genauen Betrag zu fragen ist völlig normal und vermeidet Missverständnisse."
      - q: "Du kennst noch niemanden in der Gruppe. — You don't know anyone in the group yet."
        options:
          - { key: a, text: "Still in der Ecke stehen." }
          - { key: b, text: "Dich kurz vorstellen und ein bisschen mit den anderen plaudern." }
          - { key: c, text: "Sofort wieder gehen." }
        answer: b
        why: "Sich kurz vorzustellen ist der normale erste Schritt, um in der Gruppe anzukommen."
      - q: "Du möchtest wissen, ob du den Verein jederzeit verlassen kannst. — You want to know if you can leave the club at any time."
        options:
          - { key: a, text: "Das interessiert mich jetzt noch nicht." }
          - { key: b, text: "Ich bleibe sowieso für immer." }
          - { key: c, text: "Kann man den Verein jederzeit verlassen?" }
        answer: c
        why: "Die Kündigungsbedingungen vorher zu klären ist eine sinnvolle, normale Frage."

  - id: B3
    block: B
    type: order
    title: "Sätze am ersten Trainingsabend bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Hallo", ",", "ich", "bin", "heute", "zum", "Probetraining", "hier"]
