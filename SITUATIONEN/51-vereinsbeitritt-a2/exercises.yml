        note: "Passiv Präsens, Partizip am Ende"
      - tiles: ["Ich", "stelle", "dich", "kurz", "der", "Mannschaft", "vor"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "trennbares Verb vorstellen, Präfix am Ende"
      - tiles: ["Kann", "man", "den", "Verein", "jederzeit", "verlassen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
