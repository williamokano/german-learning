      - { key: b, text: "das Formular, mit dem man Mitglied wird" }
      - { key: c, text: "das Geld, das man regelmäßig für die Mitgliedschaft zahlt" }
      - { key: d, text: "die schriftlichen Regeln des Vereins" }
      - { key: e, text: "die Person, die das Training leitet" }
