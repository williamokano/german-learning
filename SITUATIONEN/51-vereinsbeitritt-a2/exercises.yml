      - { key: "2", text: "der Mitgliedsantrag" }
      - { key: "3", text: "der Mitgliedsbeitrag" }
      - { key: "4", text: "die Satzung" }
      - { key: "5", text: "der Trainer" }
      - { key: "6", text: "die Mannschaft" }
      - { key: "7", text: "kündigen" }
      - { key: "8", text: "unverbindlich" }
    right:
