  - id: B4
    block: B
    type: true-false
    title: "Das Vereinsinfoblatt lesen"
    instructions: |
      > **TSV Nordstadt — Infos für neue Mitglieder**
      >
      > - **Probetraining:** bis zu **drei Termine kostenlos** und
      >   unverbindlich.
      > - Danach: **Mitgliedsantrag** ausfüllen und bei der Geschäftsstelle
      >   abgeben.
      > - **Mitgliedsbeitrag:** 15 € pro Monat, **per Lastschrift**
      >   abgebucht.
      > - **Kündigung:** schriftlich, mit **einem Monat Frist** zum
      >   Quartalsende.
      > - Trainingszeiten stehen auf der **Vereinswebseite**, können sich
      >   saisonal ändern.
      > - Ein **Trainingsanzug** ist nicht Pflicht, wird aber empfohlen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Das Probetraining ist bis zu drei Terminen kostenlos. — The trial sessions are free for up to three dates."
        answer: true
        why: "So steht es ausdrücklich im Infoblatt."
      - q: "Man wird automatisch Mitglied, ohne ein Formular auszufüllen. — You automatically become a member without filling out a form."
        answer: false
        why: "Der Mitgliedsantrag muss ausgefüllt und abgegeben werden."
      - q: "Der Mitgliedsbeitrag wird bar bezahlt. — The membership fee is paid in cash."
        answer: false
        why: "Der Beitrag wird per Lastschrift abgebucht."
      - q: "Die Kündigung braucht eine Frist von einem Monat zum Quartalsende. — Cancellation requires one month's notice to the end of the quarter."
        answer: true
        why: "„Kündigung: schriftlich, mit einem Monat Frist zum Quartalsende.“"
      - q: "Die Trainingszeiten ändern sich nie. — Training times never change."
        answer: false
        why: "Sie können sich saisonal ändern."
      - q: "Ein Trainingsanzug ist Pflicht. — A tracksuit is mandatory."
        answer: false
        why: "Er ist nicht Pflicht, wird aber empfohlen."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es nicht ganz nach Plan läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Dein Probetraining wird kurzfristig abgesagt. — Your trial session is cancelled at short notice."
        options:
          - { key: a, text: "Nach einem neuen Termin fragen." }
          - { key: b, text: "Sofort das Interesse am Verein verlieren." }
          - { key: c, text: "Nichts tun und einfach vergessen." }
        answer: a
        why: "Nachzufragen zeigt weiterhin Interesse und findet schnell einen Ersatztermin."
      - q: "Du kennst beim ersten Training noch niemanden und fühlst dich unsicher. — You don't know anyone at the first session and feel unsure."
        options:
          - { key: a, text: "Sofort wieder nach Hause gehen." }
          - { key: b, text: "Dich kurz vorstellen, auch wenn es unangenehm ist." }
          - { key: c, text: "Die ganze Zeit schweigen." }
        answer: b
        why: "Sich vorzustellen ist unangenehm, aber der einzige Weg, in der Gruppe anzukommen."
      - q: "Eine Frage im Mitgliedsantrag ist dir nicht klar. — A question on the membership form isn't clear to you."
        options:
          - { key: a, text: "Irgendetwas eintragen." }
          - { key: b, text: "Das Feld leer lassen, ohne Bescheid zu geben." }
          - { key: c, text: "Beim Trainer oder in der Geschäftsstelle nachfragen." }
        answer: c
        why: "Nachfragen verhindert einen falsch ausgefüllten Antrag."
      - q: "Du merkst, dass die Trainingsgruppe zu fortgeschritten für dich ist. — You realize the training group is too advanced for you."
        options:
          - { key: a, text: "Den Trainer fragen, ob es eine passendere Gruppe gibt." }
          - { key: b, text: "Einfach nicht mehr hingehen." }
          - { key: c, text: "So tun, als wäre alles in Ordnung." }
        answer: a
        why: "Der Trainer kennt die anderen Gruppen und kann eine bessere Lösung vorschlagen."
      - q: "Die Trainingszeit überschneidet sich mit deiner Arbeit. — The training time clashes with your work."
        options:
          - { key: a, text: "Einfach unregelmäßig kommen, ohne etwas zu sagen." }
          - { key: b, text: "Fragen, ob es eine andere Trainingszeit oder Gruppe gibt." }
          - { key: c, text: "Sofort wieder austreten." }
        answer: b
        why: "Viele Vereine bieten mehrere Zeiten an — nachzufragen lohnt sich meistens."
      - q: "Du hast vergessen, den Mitgliedsbeitrag rechtzeitig zu zahlen. — You forgot to pay the membership fee on time."
        options:
          - { key: a, text: "Dich entschuldigen und den Beitrag umgehend nachzahlen." }
          - { key: b, text: "Es einfach ignorieren." }
          - { key: c, text: "Dem Verein die Schuld geben." }
        answer: a
        why: "Eine kurze Entschuldigung mit sofortiger Nachzahlung ist die einfachste Lösung."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Mein Probetraining wurde kurzfristig {1}. (nicht stattfinden, Partizip)
      2. Eine Frage im {2} war mir nicht klar. (das Anmeldeformular)
      3. Die Trainingsgruppe war leider zu {3} für mich. (auf einem höheren Niveau)
      4. Die Trainingszeit {4} sich mit meiner Arbeit. (zeitlich zusammenfallen)
      5. Ich habe vergessen, den {5} rechtzeitig zu zahlen. (das regelmäßige Geld für die Mitgliedschaft)
      6. Ich habe mich beim Trainer nach einer passenderen {6} erkundigt. (die Trainingsgruppe)
    answers:
      "1": abgesagt
      "2": Mitgliedsantrag
      "3": fortgeschritten
      "4": überschneidet
      "5": Mitgliedsbeitrag
      "6": Gruppe

