        note: "Ja/Nein-Frage im Präsens"
      - tiles: ["Wir", "prüfen", "das", "gleich", "in", "unserem", "System"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Aussage, Verb an Position 2"
      - tiles: ["Morgen", "werde", "ich", "Widerspruch", "einlegen"]
