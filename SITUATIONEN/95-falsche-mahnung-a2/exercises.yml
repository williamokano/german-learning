lesson: "SIT/95-falsche-mahnung-a2"
title: "Falsche Mahnung — A2"
topic: "Falsche Mahnung"
category: "Geld & Verträge"
level: A2
summary: "Eine Mahnung genau prüfen, den Zahlungsbeleg vorlegen und schriftlich widersprechen — und was tun, wenn trotz Klärung eine zweite Mahnung kommt oder sich ein Inkassobüro meldet."
intro: >
  Manchmal kommt eine Mahnung, obwohl man längst bezahlt hat: die
  Mahnung genau prüfen, den Zahlungsbeleg heraussuchen und beim
  Unternehmen anrufen oder schriftlich widersprechen. Dieses Set übt
  genau das — prüfen, widersprechen, klären, und was zu tun ist, wenn
  trotz Klärung eine zweite Mahnung kommt oder sich ein Inkassobüro
  meldet. Grammatik nach Bedarf: Modalverben, Perfekt und Futur I.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

