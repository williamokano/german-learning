  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Die falsche Mahnung klären"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} die Rechnung schon vor zwei Wochen bezahlt. (haben, Perfekt)
      2. {2} Sie mir bitte den Zahlungsbeleg schicken? (können, Sie-Form)
      3. Man {3} bei einer falschen Mahnung schriftlich widersprechen. (sollen, Präsens)
      4. {4} die Zahlung schon verbucht worden? (sein, Perfekt Passiv)
      5. Falls die Mahnung falsch {5}, muss ich schnell reagieren. (sein, Präsens)
      6. Das Unternehmen {6} die Zahlung sicher noch einmal prüfen. (werden, Futur I)
      7. Ich {7} schon Widerspruch eingelegt. (haben, Perfekt)
      8. {8} Sie mir bitte die Mahngebühr erklären? (können, Sie-Form)
    answers:
      "1": habe
      "2": Können
      "3": soll
      "4": Ist
      "5": ist
      "6": wird
      "7": habe
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe eine {1} bekommen, obwohl ich schon bezahlt habe. (die schriftliche Erinnerung an eine offene Zahlung)
      2. Ich habe die {2} pünktlich bezahlt. (das Dokument über den zu zahlenden Betrag)
      3. Zum Glück habe ich noch den {3}. (der Nachweis über die Zahlung)
      4. Die {4} habe ich vor drei Wochen gemacht. (das Senden von Geld auf ein anderes Konto)
      5. Ich verstehe nicht, warum ich eine {5} zahlen soll. (die zusätzlichen Kosten für eine Mahnung)
      6. Ich habe schriftlich {6} eingelegt. (der Einspruch gegen eine Forderung)
    answers:
      "1": Mahnung
      "2": Rechnung
      "3": Zahlungsbeleg
      "4": Überweisung
      "5": Mahngebühr
      "6": Widerspruch

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Telefon mit dem Kundenservice"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (am Telefon mit dem Kundenservice)
      — Guten Tag, ich habe eine {1} bekommen, obwohl ich die
      Rechnung schon bezahlt habe.
      — Das tut mir leid. Haben Sie einen {2} zur Hand?
      — Ja, ich habe die {3} vor drei Wochen gemacht.
      — Können Sie mir das genaue Datum nennen?
      — Der 3. Mai.
      — Danke, ich prüfe das gleich in unserem System.
      (kurze Pause)
      — Sie haben recht, die Zahlung ist bei uns eingegangen. Das
      tut mir leid.
      — Muss ich jetzt trotzdem die {4} bezahlen?
      — Nein, die Mahnung war ein Fehler unsererseits, die {5}
      entfällt komplett.
      — Gut zu wissen. Und was ist mit dem {6}, den ich schon
      eingelegt habe?
      — Der ist damit erledigt, das ist kein Problem.
      — Vielen Dank. Ich hätte mir sonst Sorgen wegen eines {7}
      gemacht.
      — Das ist verständlich, aber das wäre bei uns gar nicht so
      weit gekommen.
      — Können Sie mir das bitte schriftlich {8}?
      — Ja, natürlich, ich {9} Ihnen gleich eine Bestätigung per
      E-Mail.
      — Perfekt, vielen Dank für Ihre {10}.
    bank: [MAHNUNG, ZAHLUNGSBELEG, RECHNUNGSNUMMER, ÜBERWEISUNG, KUNDENNUMMER, MAHNGEBÜHR, LASTSCHRIFT, FORDERUNG, KONTOAUSZUG, WIDERSPRUCH, INKASSOBÜROS, BESTÄTIGEN, SCHICKE, HILFE]
    answers:
      "1": MAHNUNG
      "2": ZAHLUNGSBELEG
      "3": ÜBERWEISUNG
      "4": MAHNGEBÜHR
      "5": FORDERUNG
      "6": WIDERSPRUCH
      "7": INKASSOBÜROS
      "8": BESTÄTIGEN
      "9": SCHICKE
      "10": HILFE

  - id: B2
    block: B
    type: single-choice
    title: "Prüfen und klären"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst dem Kundenservice sagen, dass du eine Mahnung bekommen hast, obwohl du schon bezahlt hast. — You want to tell customer service you got a dunning notice even though you already paid."
        options:
          - { key: a, text: "Mahnungen interessieren mich nicht." }
          - { key: b, text: "Ich habe eine Mahnung bekommen, obwohl ich die Rechnung schon bezahlt habe." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg beim Klären einer falschen Mahnung."
      - q: "Du willst wissen, ob du trotzdem die Mahngebühr bezahlen musst. — You want to know if you still have to pay the dunning fee."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Muss ich jetzt trotzdem die Mahngebühr bezahlen?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig, ob zusätzliche Kosten entstehen."
      - q: "Du willst dem Kundenservice das genaue Datum deiner Überweisung nennen. — You want to tell customer service the exact date of your transfer."
        options:
          - { key: a, text: "Ich habe die Überweisung am 3. Mai gemacht." }
          - { key: b, text: "Daten interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine genaue Angabe hilft dem Kundenservice bei der Prüfung."
      - q: "Du willst wissen, ob dein Widerspruch damit erledigt ist. — You want to know if your objection is resolved with this."
        options:
          - { key: a, text: "Widersprüche interessieren mich nicht." }
          - { key: b, text: "Ist mein Widerspruch damit erledigt?" }
          - { key: c, text: "Das ist mir egal, Hauptsache ich zahle nichts mehr." }
        answer: b
        why: "Eine direkte Frage klärt, ob der Vorgang abgeschlossen ist."
      - q: "Du willst wissen, ob du dir wegen eines Inkassobüros Sorgen machen musst. — You want to know if you need to worry about a debt collection agency."
        options:
          - { key: a, text: "Inkassobüros interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Muss ich mir wegen eines Inkassobüros Sorgen machen?" }
        answer: c
        why: "Eine direkte Frage klärt, ob die Angelegenheit weiter eskaliert."
      - q: "Du willst dem Kundenservice für die Hilfe danken. — You want to thank customer service for their help."
        options:
          - { key: a, text: "Vielen Dank für Ihre Hilfe." }
          - { key: b, text: "Hilfe interessiert mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Ein höflicher Dank passt zum Abschluss eines geklärten Missverständnisses."

  - id: B3
    block: B
    type: order
    title: "Sätze zur Mahnung bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "habe", "die", "Rechnung", "schon", "bezahlt"]
