        note: "Futur I, Zeitangabe an Position 1, Verb an Position 2"
      - tiles: ["Wie", "hoch", "ist", "eigentlich", "die", "Mahngebühr", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "W-Frage mit sein"
      - tiles: ["Ich", "habe", "schon", "Widerspruch", "eingelegt"]
        answer: [0, 1, 2, 3, 4]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur falschen Mahnung lesen"
    instructions: |
      > **Info — Falsche Mahnung**
      >
      > - **Mahnung:** sollte man **immer genau prüfen**, bevor man
      >   zahlt.
      > - **Zahlungsbeleg:** sollte man nach jeder Überweisung
      >   **aufbewahren**.
      > - **Widerspruch:** sollte man immer **schriftlich und
      >   fristgerecht** einlegen.
      > - **Mahngebühr:** entfällt oft, wenn die Mahnung ein
      >   **Fehler des Unternehmens** war.
      > - **Inkassobüro:** kann nur bei **tatsächlich offenen
      >   Forderungen** tätig werden.
      > - **Bei Unsicherheit:** sollte man beim Kundenservice
      >   **nachfragen, bevor man zahlt**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Eine Mahnung sollte man immer genau prüfen, bevor man zahlt. — You should always check a dunning notice carefully before paying."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur falschen Mahnung."
      - q: "Einen Zahlungsbeleg braucht man nach der Überweisung nie mehr. — You never need proof of payment again after the transfer."
        answer: false
        why: "Man sollte ihn nach jeder Überweisung aufbewahren."
      - q: "Ein Widerspruch sollte immer schriftlich und fristgerecht erfolgen. — An objection should always be made in writing and within the deadline."
        answer: true
        why: "„Widerspruch: sollte man immer schriftlich und fristgerecht einlegen.“"
      - q: "Eine Mahngebühr muss man immer bezahlen, auch bei einem Fehler des Unternehmens. — You always have to pay a dunning fee, even if the company made the mistake."
        answer: false
        why: "Sie entfällt oft, wenn die Mahnung ein Fehler des Unternehmens war."
      - q: "Ein Inkassobüro darf nur bei tatsächlich offenen Forderungen tätig werden. — A debt collection agency may only act on genuinely outstanding claims."
        answer: true
        why: "„Inkassobüro: kann nur bei tatsächlich offenen Forderungen tätig werden.“"
      - q: "Bei Unsicherheit sollte man einfach sofort zahlen, ohne nachzufragen. — If unsure, you should just pay immediately without asking."
        answer: false
        why: "Man sollte beim Kundenservice nachfragen, bevor man zahlt."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn bei der Mahnung etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Sie finden Ihren Zahlungsbeleg nicht mehr. — You can't find your proof of payment anymore."
        options:
          - { key: a, text: "Die Mahnung einfach bezahlen, obwohl Sie schon bezahlt haben." }
          - { key: b, text: "Den Kontoauszug der Bank als Nachweis nutzen." }
          - { key: c, text: "Die Mahnung komplett ignorieren." }
        answer: b
        why: "Der Kontoauszug zeigt die Zahlung genauso zuverlässig wie der Beleg."
      - q: "Obwohl das Missverständnis geklärt wurde, kommt eine weitere Mahnung. — Even though the misunderstanding was cleared up, another dunning notice arrives."
        options:
          - { key: a, text: "Die neue Mahnung einfach bezahlen." }
          - { key: b, text: "Sich nicht mehr melden." }
          - { key: c, text: "Erneut Kontakt aufnehmen und auf die vorherige Klärung verweisen." }
        answer: c
        why: "Ein Verweis auf die vorherige Klärung löst das Missverständnis schnell auf."
      - q: "Ein Inkassobüro meldet sich wegen der angeblich offenen Rechnung. — A debt collection agency contacts you about the allegedly outstanding bill."
        options:
          - { key: a, text: "Dem Inkassobüro den Zahlungsbeleg zusenden und den Fehler erklären." }
          - { key: b, text: "Die Forderung einfach bezahlen, ohne nachzufragen." }
          - { key: c, text: "Das Schreiben ignorieren." }
        answer: a
        why: "Der Zahlungsbeleg klärt die Sache direkt gegenüber dem Inkassobüro."
      - q: "Die Mahngebühr wird trotz Zusage nicht storniert. — The dunning fee isn't cancelled despite the promise."
        options:
          - { key: a, text: "Die Gebühr einfach bezahlen, um Ruhe zu haben." }
          - { key: b, text: "Noch einmal schriftlich auf die vorherige Zusage hinweisen." }
          - { key: c, text: "Das Unternehmen wechseln, ohne sich zu beschweren." }
        answer: b
        why: "Ein schriftlicher Hinweis auf die Zusage klärt die Sache verbindlich."
      - q: "In der Mahnung steht ein deutlich zu hoher Betrag. — The dunning notice shows a clearly too-high amount."
        options:
          - { key: a, text: "Den falschen Betrag einfach bezahlen." }
          - { key: b, text: "Die Mahnung komplett ignorieren." }
          - { key: c, text: "Den korrekten Betrag mit Belegen nachweisen." }
        answer: c
        why: "Belege beweisen den tatsächlich korrekten Betrag."
      - q: "Die Frist für Ihren Widerspruch läuft bald ab. — The deadline for your objection is about to expire."
        options:
          - { key: a, text: "Sofort schriftlich widersprechen, auch wenn noch nicht alle Unterlagen vollständig sind." }
          - { key: b, text: "Einfach abwarten, bis die Frist verstrichen ist." }
          - { key: c, text: "Den Widerspruch erst nach der Frist einreichen." }
        answer: a
        why: "Ein fristgerechter Widerspruch sichert die eigenen Rechte, auch mit unvollständigen Unterlagen."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Meinen Zahlungsbeleg habe ich leider {1}. (nicht mehr gefunden, Partizip)
      2. Trotz der Klärung habe ich eine weitere Mahnung {2}. (bekommen, Partizip)
      3. Das Inkassobüro hat sich wegen der Rechnung {3}. (in Kontakt getreten, Partizip)
      4. Die Mahngebühr wurde trotz Zusage nicht {4}. (rückgängig gemacht, Partizip)
      5. In der Mahnung war ein viel zu hoher Betrag {5}. (notiert, Partizip)
      6. Die Frist für den Widerspruch ist fast {6}. (fast vorbei, Partizip)
    answers:
      "1": verlegt
      "2": erhalten
      "3": gemeldet
      "4": storniert
      "5": angegeben
      "6": abgelaufen

