  - id: D2
    block: D
    type: free-write
    title: "Bekommen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: eine Mahnung bekommen, obwohl du schon bezahlt hast, ein Problem, weil trotz Klärung eine zweite Mahnung kommt, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du bekommst eine Mahnung für eine Rechnung, die du schon längst
      bezahlt hast. Nach einem klärenden Anruf kommt aber trotzdem
      eine zweite Mahnung.

      Beim Bekommen müssen vorkommen:
      1. die Mahnung öffnen
      2. den Zahlungsbeleg heraussuchen
      3. beim Kundenservice anrufen

      Beim Problem müssen vorkommen:
      4. trotz Klärung eine zweite Mahnung bekommen
      5. sich darüber ärgern
      6. noch einmal Kontakt aufnehmen

      In der Lösung müssen vorkommen:
      7. die vorherige Klärung erwähnen
      8. eine schriftliche Bestätigung bekommen
      9. die Mahngebühr stornieren lassen
      10. sich über die endgültige Klärung freuen
    use:
      - "höfliche Frage: „Können Sie mir das bitte schriftlich bestätigen?“"
      - "Perfekt: „Ich habe die Rechnung schon bezahlt.“"
      - "Futur I: „Ich werde notfalls noch einmal anrufen.“"
    selfCheck:
      - "Wird das Problem klar beschrieben?"
      - "Klingt die Reaktion auf die zweite Mahnung realistisch?"
      - "Wird die schriftliche Bestätigung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Bekommen**

      Ich öffne die Mahnung und suche sofort meinen Zahlungsbeleg heraus.
      Ich rufe beim Kundenservice an: Ich habe die Rechnung schon bezahlt.
      Kundenservice: Sie haben recht, das war ein Fehler von uns.

      **Das Problem**

      Ein paar Tage später kommt trotzdem eine zweite Mahnung.
      Das ärgert mich sehr, also nehme ich noch einmal Kontakt auf.
      Ich: Wir hatten das doch schon geklärt!

      **Die Lösung**

      Kundenservice: Das tut uns leid, wir stornieren die Mahngebühr sofort.
      Ich: Können Sie mir das bitte schriftlich bestätigen?
      Kundenservice: Natürlich, Sie bekommen gleich eine E-Mail.
      Endlich ist alles geklärt, und ich freue mich sehr.
