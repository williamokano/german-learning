lesson: "SIT/74-stromanbieter-wechseln-a2"
title: "Stromanbieter wechseln — A2"
topic: "Stromanbieter wechseln"
category: "Geld & Verträge"
level: A2
summary: "Tarife vergleichen, den Anbieterwechsel beantragen, den Zählerstand übermitteln — und was tun, wenn der alte Anbieter weiter Geld verlangt oder die Kündigungsbestätigung fehlt."
intro: >
  Ein günstigerer Stromtarif lohnt sich oft: Tarife vergleichen, den
  Wechsel beim neuen Anbieter beantragen, die Kündigungsfrist beim
  alten beachten und den Zählerstand rechtzeitig übermitteln. Dieses
  Set übt genau das — Tarife vergleichen, den Wechsel anstoßen, und was
  zu tun ist, wenn der alte Anbieter trotz Kündigung weiter Geld
  verlangt oder die Kündigungsbestätigung ausbleibt. Grammatik nach
  Bedarf: Perfekt im Bericht, höfliche Fragen, Nebensätze mit falls.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

