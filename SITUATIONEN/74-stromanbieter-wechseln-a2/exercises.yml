  - id: B2
    block: B
    type: single-choice
    title: "Vergleichen und Wechseln"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest wissen, ob dein Mitbewohner einen günstigeren Tarif gefunden hat. — You want to know whether your roommate found a cheaper rate."
        options:
          - { key: a, text: "Tarife interessieren mich nicht." }
          - { key: b, text: "Hast du schon einen günstigeren Tarif gefunden?" }
          - { key: c, text: "Ich zahle sowieso, was verlangt wird." }
        answer: b
        why: "Eine direkte Frage klärt sofort, ob es schon einen besseren Tarif gibt."
      - q: "Du möchtest den Arbeitspreis zweier Anbieter vergleichen. — You want to compare the usage price of two providers."
        options:
          - { key: a, text: "Preise sind mir egal." }
          - { key: b, text: "Ich vergleiche sowieso nie." }
          - { key: c, text: "Wie hoch ist der Arbeitspreis pro Kilowattstunde bei Ihnen?" }
        answer: c
        why: "Eine konkrete Frage zum Arbeitspreis ermöglicht einen genauen Vergleich."
      - q: "Du möchtest wissen, ob du die Kündigungsfrist beim alten Anbieter beachten musst. — You want to know whether you need to observe the notice period with the old provider."
        options:
          - { key: a, text: "Müssen wir die Kündigungsfrist beim alten Anbieter beachten?" }
          - { key: b, text: "Fristen interessieren mich nicht." }
          - { key: c, text: "Ich kündige einfach, wann ich will." }
        answer: a
        why: "Eine direkte Frage zur Kündigungsfrist vermeidet spätere Probleme."
      - q: "Du möchtest den aktuellen Zählerstand übermitteln. — You want to submit the current meter reading."
        options:
          - { key: a, text: "Zählerstände interessieren mich nicht." }
          - { key: b, text: "Ich gebe den aktuellen Zählerstand gleich online ein." }
          - { key: c, text: "Den Zählerstand rate ich einfach." }
        answer: b
        why: "Ein genau übermittelter Zählerstand sorgt für eine korrekte Abrechnung."
      - q: "Du möchtest wissen, wann die Kündigungsbestätigung kommt. — You want to know when the cancellation confirmation will arrive."
        options:
          - { key: a, text: "Bestätigungen interessieren mich nicht." }
          - { key: b, text: "Ich warte einfach unbegrenzt." }
          - { key: c, text: "Wann bekommen wir die Kündigungsbestätigung?" }
        answer: c
        why: "Eine direkte Frage klärt, wann man die schriftliche Bestätigung erwarten kann."
      - q: "Der Wechsel ist erfolgreich abgeschlossen. — The switch has been successfully completed."
        options:
          - { key: a, text: "Endlich ein fairer Preis, ich freue mich schon auf die Ersparnis!" }
          - { key: b, text: "Das war doch nichts Besonderes." }
          - { key: c, text: "Ersparnis interessiert mich nicht." }
        answer: a
        why: "Eine erfreute Reaktion passt zum erfolgreichen Abschluss des Anbieterwechsels."

