  - id: D2
    block: D
    type: free-write
    title: "Vergleichen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: Tarife vergleichen und den Wechsel beantragen, ein Problem mit der zu hohen ersten Rechnung, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du vergleichst mit deinem Mitbewohner Stromtarife und beantragt
      den Wechsel zu einem günstigeren Anbieter. Die erste Rechnung
      des neuen Anbieters ist jedoch überraschend viel höher als
      vereinbart.

      Beim Vergleichen müssen vorkommen:
      1. nach einem günstigeren Tarif fragen
      2. den Arbeitspreis vergleichen
      3. die Kündigungsfrist beim alten Anbieter beachten

      Beim Problem müssen vorkommen:
      4. merken, dass die erste Rechnung viel höher ist
      5. den Tarif mit dem ursprünglichen Angebot vergleichen
      6. beim neuen Anbieter nachfragen

      In der Lösung müssen vorkommen:
      7. eine Erklärung vom Anbieter bekommen
      8. eine korrigierte Rechnung erhalten
      9. den Zählerstand noch einmal bestätigen
      10. sich über die endlich niedrigere Rechnung freuen
    use:
      - "höfliche Frage: „Wie hoch ist der Arbeitspreis bei Ihnen?“"
      - "Nebensatz mit falls: „Falls der Wechsel reibungslos verläuft, …“"
      - "Perfekt: „Wir haben den Zählerstand übermittelt.“"
    selfCheck:
      - "Wird der Tarifvergleich klar beschrieben?"
      - "Klingt die Reaktion auf die hohe Rechnung sachlich und bestimmt?"
      - "Wird die korrigierte Rechnung als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Vergleichen**

      Ich: Hast du schon einen günstigeren Tarif gefunden?
      Mitbewohner: Ja, wie hoch ist eigentlich der Arbeitspreis bei unserem alten Anbieter?
      Ich: Viel höher als bei dem neuen. Müssen wir die Kündigungsfrist beachten?
      Mitbewohner: Ja, aber der neue Anbieter kümmert sich um alles.

      **Das Problem**

      (einen Monat später)
      Ich: Die erste Rechnung ist viel höher als vereinbart!
      Mitbewohner: Das sollten wir mit dem ursprünglichen Angebot vergleichen und nachfragen.
      Ich: Gute Idee, ich rufe gleich beim neuen Anbieter an.

      **Die Lösung**

      Anbieter: Da ist uns leider ein Fehler unterlaufen, wir korrigieren die Rechnung sofort.
      Ich: Danke, können Sie noch einmal den Zählerstand bestätigen?
