  - id: B4
    block: B
    type: true-false
    title: "Die Wechsel-Infos lesen"
    instructions: |
      > **Info — Stromanbieter wechseln**
      >
      > - **Kündigungsfrist:** meist **sechs Wochen** zum Ende der
      >   Vertragslaufzeit.
      > - **Anbieterwechsel:** der neue Anbieter kümmert sich meist
      >   **automatisch** um die Kündigung beim alten.
      > - **Zählerstand:** sollte **beim Wechsel selbst** abgelesen
      >   und übermittelt werden.
      > - **Versorgungslücke:** ist gesetzlich **ausgeschlossen**,
      >   der Strom fließt immer weiter.
      > - **Grundversorgung:** greift automatisch, falls **kein
      >   neuer Vertrag** zustande kommt.
      > - **Kündigungsbestätigung:** kommt meist **innerhalb
      >   weniger Tage** per E-Mail oder Post.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Kündigungsfrist beträgt meist sechs Wochen zum Ende der Vertragslaufzeit. — The notice period is usually six weeks before the contract ends."
        answer: true
        why: "So steht es ausdrücklich in den Wechsel-Infos."
      - q: "Man muss die Kündigung beim alten Anbieter immer komplett selbst erledigen. — You must always handle the cancellation with the old provider entirely yourself."
        answer: false
        why: "Der neue Anbieter kümmert sich meist automatisch darum, nicht man selbst komplett."
      - q: "Der Zählerstand sollte beim Wechsel selbst abgelesen und übermittelt werden. — The meter reading should be read and submitted right at the time of the switch."
        answer: true
        why: "„Zählerstand: sollte beim Wechsel selbst abgelesen und übermittelt werden.“"
      - q: "Beim Anbieterwechsel kann es zu einer kompletten Versorgungslücke ohne Strom kommen. — Switching providers can lead to a complete gap in power supply."
        answer: false
        why: "Eine Versorgungslücke ist gesetzlich ausgeschlossen, der Strom fließt immer weiter."
      - q: "Kommt kein neuer Vertrag zustande, greift automatisch die Grundversorgung. — If no new contract is arranged, basic supply kicks in automatically."
        answer: true
        why: "„Grundversorgung: greift automatisch, falls kein neuer Vertrag zustande kommt.“"
      - q: "Die Kündigungsbestätigung kommt normalerweise erst nach mehreren Monaten. — The cancellation confirmation usually only arrives after several months."
        answer: false
        why: "Sie kommt meist innerhalb weniger Tage, nicht erst nach Monaten."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Anbieterwechsel etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Der neue Anbieter kündigt nicht rechtzeitig beim alten. — The new provider doesn't cancel with the old one in time."
        options:
          - { key: a, text: "Einfach abwarten, ohne nachzufragen." }
          - { key: b, text: "Sofort selbst beim alten Anbieter nachfragen und die Kündigung sichern." }
          - { key: c, text: "Den neuen Vertrag sofort wieder kündigen, ohne nachzufragen." }
        answer: b
        why: "Eine eigene Nachfrage stellt sicher, dass die Kündigung tatsächlich erfolgt."
      - q: "Der übermittelte Zählerstand wurde falsch erfasst. — The submitted meter reading was recorded incorrectly."
        options:
          - { key: a, text: "Den falschen Zählerstand einfach akzeptieren." }
          - { key: b, text: "Nichts unternehmen und abwarten." }
          - { key: c, text: "Den Zählerstand mit einem Foto als Beweis nachreichen." }
        answer: c
        why: "Ein Foto als Beweis klärt schnell, welcher Zählerstand korrekt ist."
      - q: "Die erste Rechnung des neuen Anbieters ist viel höher als vereinbart. — The new provider's first bill is much higher than agreed."
        options:
          - { key: a, text: "Den Tarif mit dem ursprünglichen Angebot vergleichen und nachfragen." }
          - { key: b, text: "Die hohe Rechnung kommentarlos bezahlen." }
          - { key: c, text: "Sofort den Vertrag fristlos kündigen, ohne nachzufragen." }
        answer: a
        why: "Ein Vergleich mit dem ursprünglichen Angebot klärt, ob ein Fehler vorliegt."
      - q: "Der alte Anbieter verlangt trotz Kündigung weiter Geld. — The old provider keeps demanding payment despite the cancellation."
        options:
          - { key: a, text: "Einfach weiterzahlen, ohne etwas zu sagen." }
          - { key: b, text: "Die Kündigungsbestätigung als Beweis vorlegen." }
          - { key: c, text: "Den alten Anbieter komplett ignorieren." }
        answer: b
        why: "Die Kündigungsbestätigung ist der eindeutige Beweis, dass der Vertrag beendet ist."
      - q: "Die Kündigungsbestätigung kommt nicht an. — The cancellation confirmation doesn't arrive."
        options:
          - { key: a, text: "Einfach endlos weiter warten, ohne nachzufragen." }
          - { key: b, text: "Den Wechsel für gescheitert erklären." }
          - { key: c, text: "Höflich beim neuen Anbieter nach dem Status nachfragen." }
        answer: c
        why: "Eine Nachfrage beim neuen Anbieter klärt schnell den aktuellen Stand."
      - q: "Man merkt erst nach dem Wechsel, dass der neue Tarif doch nicht günstiger ist. — Only after switching do you notice the new rate isn't actually cheaper."
        options:
          - { key: a, text: "Die Verträge in Ruhe vergleichen und gegebenenfalls innerhalb der Frist erneut wechseln." }
          - { key: b, text: "Sich einfach damit abfinden, ohne zu vergleichen." }
          - { key: c, text: "Sofort kündigen, ohne die Fristen zu prüfen." }
        answer: a
        why: "Ein ruhiger Vergleich zeigt, ob ein erneuter Wechsel innerhalb der Frist sinnvoll ist."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der neue Anbieter hat nicht rechtzeitig {1}. (nicht gekündigt, Partizip)
      2. Der Zählerstand wurde falsch {2}. (aufgenommen, Partizip)
      3. Die erste Rechnung war viel {3} als vereinbart. (mehr kostend)
      4. Der alte Anbieter hat trotz Kündigung weiter Geld {4}. (gefordert, Partizip)
      5. Die Kündigungsbestätigung ist nie {5}. (dort eingetroffen, Partizip)
      6. Wir haben die Verträge noch einmal in Ruhe {6}. (gegenübergestellt, Partizip)
    answers:
      "1": gekündigt
      "2": aufgenommen
      "3": höher
      "4": verlangt
      "5": angekommen
      "6": verglichen

