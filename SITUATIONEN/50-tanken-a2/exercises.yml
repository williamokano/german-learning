lesson: "SIT/50-tanken-a2"
title: "Tanken und E-Auto laden — A2"
topic: "Tanken und E-Auto laden"
category: "Unterwegs"
level: A2
summary: "An der Zapfsäule die richtige Sorte wählen und an der Kasse zahlen, an der Ladesäule das E-Auto laden — und was tun, wenn der Ladepunkt besetzt ist."
intro: >
  Tanken klingt einfach, bis man an der falschen Zapfsäule steht oder
  die Kraftstoffsorte verwechselt. Und wer ein E-Auto lädt, braucht
  eine eigene kleine Sprache: Ladesäule, Ladekarte, Ladestand, und was
  zu tun ist, wenn der Ladepunkt schon besetzt ist. Dieses Set übt
  beides — an der Tankstelle bezahlen und an der Ladesäule laden.
  Grammatik nach Bedarf: Wechselpräpositionen, Zahlen und Mengen,
  höfliche Bitten mit Konjunktiv II. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

