      5. Meine Karte wurde an der Kasse {5}. (nicht akzeptiert)
      6. Nach dem Laden war der {6} kaum höher als vorher. (der Batteriestand)
    answers:
      "1": Kraftstoffsorte
      "2": besetzt
      "3": App
      "4": Fehler
      "5": abgelehnt
      "6": Ladestand

