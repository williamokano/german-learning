  - id: B4
    block: B
    type: true-false
    title: "Die Preistafel und die Ladehinweise lesen"
    instructions: |
      > **Tankstelle Nordring — Preise und Hinweise**
      >
      > - Super: **1,79 €/l** · Diesel: **1,69 €/l**
      > - Zahlung: **Karte oder bar**, direkt an der Kasse.
      > - Falsche Kraftstoffsorte getankt? Bitte **nicht starten** und
      >   sofort das Personal informieren.
      > - **Ladesäule:** 4 Ladepunkte, **150 kW Schnellladung**.
      > - Bezahlung per **App oder Ladekarte**, keine Barzahlung möglich.
      > - Ladezeit für 80 % Akku: **circa 30 Minuten**, je nach
      >   Fahrzeug.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Diesel ist teurer als Super. — Diesel is more expensive than Super."
        answer: false
        why: "Diesel kostet 1,69 €, Super 1,79 € — Diesel ist günstiger."
      - q: "An der Kasse kann man mit Karte oder bar zahlen. — At the register, you can pay by card or cash."
        answer: true
        why: "So steht es ausdrücklich in den Hinweisen."
      - q: "Bei falscher Kraftstoffsorte soll man sofort losfahren. — With the wrong fuel, you should drive off immediately."
        answer: false
        why: "Man soll nicht starten und sofort das Personal informieren."
      - q: "Die Ladesäule hat vier Ladepunkte. — The charging station has four charging points."
        answer: true
        why: "„4 Ladepunkte, 150 kW Schnellladung.“"
      - q: "An der Ladesäule kann man bar bezahlen. — You can pay cash at the charging station."
        answer: false
        why: "Bezahlung nur per App oder Ladekarte, keine Barzahlung möglich."
      - q: "80 % Akku dauern ungefähr 30 Minuten. — Charging to 80% takes about 30 minutes."
        answer: true
        why: "„Ladezeit für 80 % Akku: circa 30 Minuten.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es an der Tankstelle Probleme gibt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du merkst gerade noch rechtzeitig, dass du fast die falsche Kraftstoffsorte tankst. — You just notice in time that you're about to fuel with the wrong type."
        options:
          - { key: a, text: "Sofort aufhören zu tanken und das Personal informieren." }
          - { key: b, text: "Trotzdem weitertanken." }
          - { key: c, text: "Losfahren und hoffen, dass nichts passiert." }
        answer: a
        why: "Sofortiges Aufhören verhindert einen teuren Motorschaden."
      - q: "Der Ladepunkt, den du nutzen wolltest, ist besetzt und niemand ist am Auto. — The charging point you wanted is occupied and no one is at the car."
        options:
          - { key: a, text: "Das fremde Kabel einfach abziehen." }
          - { key: b, text: "Einen anderen freien Ladepunkt suchen oder kurz warten." }
          - { key: c, text: "Laut schimpfen." }
        answer: b
        why: "Ein fremdes Ladekabel abzuziehen ist nicht erlaubt — ausweichen oder warten ist die richtige Lösung."
      - q: "Die App zum Laden funktioniert nicht. — The charging app isn't working."
        options:
          - { key: a, text: "Einfach aufgeben und nach Hause fahren." }
          - { key: b, text: "Das Auto ohne Bezahlung anschließen." }
          - { key: c, text: "Es mit der Ladekarte versuchen oder den Support anrufen." }
        answer: c
        why: "Eine Alternative wie die Ladekarte oder der Support löst das Problem meist schnell."
      - q: "Die Zapfsäule zeigt einen Fehler und tankt nicht. — The pump shows an error and won't dispense fuel."
        options:
          - { key: a, text: "Eine andere Zapfsäule nutzen oder das Personal informieren." }
          - { key: b, text: "Mehrmals fest auf den Hebel drücken." }
          - { key: c, text: "Einfach weiterfahren, ohne zu tanken." }
        answer: a
        why: "Eine andere Säule zu nutzen oder Bescheid zu geben ist der einfachste nächste Schritt."
      - q: "Deine Karte wird an der Kasse abgelehnt. — Your card is declined at the register."
        options:
          - { key: a, text: "Einfach ohne Bezahlung wegfahren." }
          - { key: b, text: "Es noch einmal versuchen oder nach einer anderen Zahlungsart fragen." }
          - { key: c, text: "In Panik geraten." }
        answer: b
        why: "Ein zweiter Versuch oder eine andere Zahlungsart löst das Problem meist unkompliziert."
      - q: "Du merkst nach dem Laden, dass der Akku kaum voller geworden ist. — After charging, you notice the battery barely gained charge."
        options:
          - { key: a, text: "Beim Personal oder Support nachfragen, ob die Ladesäule richtig funktioniert hat." }
          - { key: b, text: "Es einfach hinnehmen." }
          - { key: c, text: "Die Ladesäule beschädigen." }
        answer: a
        why: "Eine Nachfrage klärt, ob ein technisches Problem vorlag und ob eine Korrektur möglich ist."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
