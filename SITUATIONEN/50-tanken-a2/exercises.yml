  - id: B2
    block: B
    type: single-choice
    title: "An der Tankstelle und der Ladesäule sprechen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du hast gerade an Zapfsäule drei getankt. — You've just filled up at pump three."
        options:
          - { key: a, text: "Einmal Super an Zapfsäule drei, bitte." }
          - { key: b, text: "Ich habe getankt, egal wo." }
          - { key: c, text: "Zapfsäule ist mir egal." }
        answer: a
        why: "Die Nummer der Zapfsäule zu nennen ist an der Kasse die übliche, klare Angabe."
      - q: "Du bist unsicher, ob du mit Karte zahlen kannst. — You're unsure whether you can pay by card."
        options:
          - { key: a, text: "Karten interessieren mich nicht." }
          - { key: b, text: "Kann ich mit Karte zahlen?" }
          - { key: c, text: "Ich zahle einfach nicht." }
        answer: b
        why: "Eine kurze Frage klärt sofort, welche Zahlungsarten möglich sind."
      - q: "Du möchtest wissen, wie man an dieser Ladesäule lädt. — You want to know how to charge at this station."
        options:
          - { key: a, text: "Laden ist mir zu kompliziert." }
          - { key: b, text: "Ich stecke einfach irgendetwas ein." }
          - { key: c, text: "Entschuldigung, wie lade ich hier mein Auto?" }
        answer: c
        why: "Eine höfliche Frage nach der Bedienung ist besser, als etwas falsch anzuschließen."
      - q: "Du möchtest wissen, wie lange das Laden ungefähr dauert. — You want to know roughly how long charging takes."
        options:
          - { key: a, text: "Wie lange dauert das ungefähr?" }
          - { key: b, text: "Zeit spielt keine Rolle." }
          - { key: c, text: "Ich warte einfach, ohne zu fragen." }
        answer: a
        why: "Eine konkrete Frage hilft, die Wartezeit besser zu planen."
      - q: "Der Ladepunkt, den du nutzen wolltest, ist schon besetzt. — The charging point you wanted is already occupied."
        options:
          - { key: a, text: "Dich einfach danebenstellen und warten, ohne zu fragen." }
          - { key: b, text: "Höflich fragen, wie lange es noch dauert, oder einen anderen Punkt suchen." }
          - { key: c, text: "Laut hupen." }
        answer: b
        why: "Eine höfliche Nachfrage oder ein anderer Ladepunkt ist die faire Lösung."
      - q: "Die Kassiererin fragt, ob du noch etwas brauchst. — The cashier asks if you need anything else."
        options:
          - { key: a, text: "Nein, danke, das ist alles." }
          - { key: b, text: "Was haben Sie denn alles?" }
          - { key: c, text: "Muss ich etwas brauchen?" }
        answer: a
        why: "Eine kurze, klare Antwort ist an der Kasse die übliche Reaktion."

