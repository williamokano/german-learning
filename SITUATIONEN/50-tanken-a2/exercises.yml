      5. Ohne {5} kann ich an dieser Säule nicht bezahlen. (die Karte fürs Laden)
      6. Der {6} zeigt mir, wie viel Batterie noch da ist. (die Anzeige des Akkustands)
    answers:
      "1": Zapfsäule
      "2": voll
      "3": Kraftstoffsorte
      "4": Ladesäule
      "5": Ladekarte
      "6": Ladestand

