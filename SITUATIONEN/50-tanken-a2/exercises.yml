  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "An der Tankstelle fragen"
    instructions: "Ergänze die richtige Präposition oder das Modalverb."
    instructionsEn: "Fill in the correct preposition or the modal verb."
    text: |
      1. Ich stehe {1} Zapfsäule drei. (Wechselpräposition, Dativ)
      2. Ich fahre {2} das Tankstellengelände, um zu tanken. (Wechselpräposition, Akkusativ)
      3. Bitte einmal Super {3} Zapfsäule drei. (Präposition + Dativ)
      4. {4} ich mit Karte zahlen? (können, ich-Form)
      5. Die Ladesäule steht {5} dem Parkplatz. (Wechselpräposition, Dativ)
      6. Ich {6} das Auto über Nacht laden. (wollen)
      7. {7} Sie mir sagen, wo die nächste Ladesäule ist? (können, Sie-Form)
      8. Der Ladepunkt {8} leider schon besetzt. (sein, Präsens)
    answers:
      "1": an
      "2": auf
      "3": an
      "4": Kann
      "5": auf
      "6": will
      "7": Können
      "8": ist

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
