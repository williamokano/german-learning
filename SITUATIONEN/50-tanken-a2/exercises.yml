  - id: D2
    block: D
    type: free-write
    title: "Tanken, Laden, ein Problem lösen"
    prompt: "Schreib drei Teile: an der Tankstelle bezahlen, ein Problem an der Ladesäule und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du tankst an einer Tankstelle und lädst später am selben Tag dein
      E-Auto an einer öffentlichen Ladesäule. Dort ist der erste
      Ladepunkt besetzt, und die App zum Bezahlen funktioniert nicht
      richtig.

      An der Tankstelle müssen vorkommen:
      1. die Zapfsäulennummer nennen
      2. fragen, ob Kartenzahlung möglich ist
      3. einen Bon erbitten oder ablehnen

      Am ersten Ladepunkt müssen vorkommen:
      4. merken, dass der Ladepunkt besetzt ist
      5. nach einem freien Ladepunkt suchen oder fragen

      Beim Bezahlproblem müssen vorkommen:
      6. merken, dass die App nicht funktioniert
      7. es mit der Ladekarte versuchen
      8. bei Bedarf den Support kontaktieren

      Am Ende müssen vorkommen:
      9. erfolgreich mit dem Laden beginnen
      10. dich für die Hilfe bedanken, falls jemand geholfen hat
    use:
      - "Wechselpräpositionen: „an Zapfsäule drei“, „auf dem Parkplatz“"
      - "höfliche Frage: „Kann ich …?“"
      - "Modalverb: „Ich muss die App öffnen.“"
    selfCheck:
      - "Steht bei den Wechselpräpositionen der richtige Fall?"
      - "Ist die Frage nach der Kartenzahlung höflich formuliert?"
      - "Klingt die Reaktion auf den besetzten Ladepunkt und die App ruhig, nicht genervt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **An der Tankstelle**

      Ich: Einmal Super an Zapfsäule drei, bitte.
      Kassiererin: Zahlen Sie mit Karte oder bar?
      Ich: Mit Karte, bitte. Und einen Bon brauche ich nicht, danke.
      Kassiererin: Alles klar, einen schönen Tag noch.

      **Der besetzte Ladepunkt**

      (An der Ladesäule)
      Ich: Der erste Ladepunkt ist leider schon besetzt.
      Freund: Kein Problem, lass uns den zweiten Punkt nehmen.
      Ich: Gute Idee, der ist ja frei.

      **Das Bezahlproblem**

      Ich: Die App zum Bezahlen lädt einfach nicht.
      Freund: Versuch es doch mit deiner Ladekarte.
      Ich: Guter Tipp, das probiere ich.
      (Es funktioniert immer noch nicht.)
      Ich: Ich rufe kurz beim Support an und frage nach.
      Support: Einen Moment, ich starte den Ladepunkt neu — jetzt sollte es gehen.
      Ich: Super, vielen Dank, jetzt lädt es!
      Freund: Perfekt, dann können wir in der Zwischenzeit einen Kaffee trinken.
      Ich: Gute Idee, in dreißig Minuten sollte es fertig sein.
