  - id: D2
    block: D
    type: free-write
    title: "Besichtigen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: den Gebrauchtwagen besichtigen und über den Preis verhandeln, ein Problem, weil bei der Probefahrt ein Geräusch auffällt, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Ihr besichtigt einen inserierten Gebrauchtwagen und macht eine
      Probefahrt. Dabei fällt euch ein ungewöhnliches Geräusch im
      Motor auf.

      Beim Besichtigen müssen vorkommen:
      1. den Gebrauchtwagen ansehen
      2. eine Probefahrt vereinbaren
      3. nach dem Kilometerstand fragen

      Beim Problem müssen vorkommen:
      4. während der Probefahrt ein Geräusch bemerken
      5. das Geräusch beim Verkäufer ansprechen
      6. einen unabhängigen Prüfer vorschlagen

      In der Lösung müssen vorkommen:
      7. eine Erklärung für das Geräusch bekommen
      8. über den Preis verhandeln
      9. den Kaufvertrag unterschreiben
      10. sich über den gelungenen Kauf freuen
    use:
      - "höfliche Frage: „Können wir eine Probefahrt machen?“"
      - "Nebensatz mit falls: „Falls der Wagen einen Unfallschaden hat, …“"
      - "Perfekt: „Wir haben über den Preis gehandelt.“"
    selfCheck:
      - "Wird die Besichtigung klar beschrieben?"
      - "Klingt die Reaktion auf das Geräusch sachlich und vorsichtig?"
      - "Wird der Kaufvertrag als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Besichtigen**

      Ich: Guten Tag, wir würden uns gerne den Gebrauchtwagen ansehen, den Sie inseriert haben.
      Verkäufer: Gerne, möchten Sie gleich eine Probefahrt machen?
      Ich: Ja, und wie hoch ist eigentlich der Kilometerstand?
      Verkäufer: Etwa 80.000 Kilometer.

      **Das Problem**

      (während der Probefahrt)
      Ich: Hören Sie das Geräusch? Das klingt irgendwie komisch.
      Verkäufer: Stimmt, das sollten wir vor dem Kauf noch prüfen lassen.
      Ich: Können wir dafür einen unabhängigen Prüfer hinzuziehen?

      **Die Lösung**

      Prüfer: Das ist nur eine kleine, harmlose Sache, kein Grund zur Sorge.
      Ich: Gut zu wissen. Können wir dann noch etwas über den Preis verhandeln?
      Verkäufer: Klar, 500 Euro weniger wären in Ordnung.
      Ich: Perfekt, dann unterschreiben wir gleich den Kaufvertrag!
