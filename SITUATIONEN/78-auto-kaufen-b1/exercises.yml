lesson: "SIT/78-auto-kaufen-b1"
title: "Ein Auto kaufen — B1"
topic: "Ein Auto kaufen"
category: "Einkaufen"
level: B1
summary: "Einen Gebrauchtwagen besichtigen, eine Probefahrt machen, über den Preis verhandeln — und was tun, wenn ein Geräusch auffällt oder ein Unfallschaden verschwiegen wurde."
intro: >
  Beim Gebrauchtwagenkauf zählt jedes Detail: eine Probefahrt machen,
  den Kilometerstand mit dem Serviceheft abgleichen, nach dem TÜV und
  möglichen Unfallschäden fragen, und am Ende über den Preis
  verhandeln. Dieses Set übt genau das — den Wagen besichtigen,
  verhandeln, den Kaufvertrag abschließen, und was zu tun ist, wenn bei
  der Probefahrt etwas auffällt oder der Verkäufer einen Schaden
  verschweigt. Grammatik nach Bedarf: Perfekt und Passiv im Bericht,
  Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Besichtigen, verhandeln oder kaufen?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: besichtigen, label: "Besichtigen" }
      - { key: verhandeln, label: "Verhandeln" }
      - { key: kaufen, label: "Kaufen" }
    tokens:
      - { text: "den Gebrauchtwagen begutachten", bucket: besichtigen }
      - { text: "eine Probefahrt machen", bucket: besichtigen }
      - { text: "den Kilometerstand prüfen", bucket: besichtigen }
      - { text: "den TÜV-Bericht ansehen", bucket: besichtigen }
      - { text: "nach dem Preis fragen", bucket: verhandeln }
      - { text: "über den Preis handeln", bucket: verhandeln }
      - { text: "nach Vorschäden fragen", bucket: verhandeln }
      - { text: "sich Bedenkzeit erbitten", bucket: verhandeln }
      - { text: "den Kaufvertrag unterschreiben", bucket: kaufen }
      - { text: "den Kaufpreis überweisen", bucket: kaufen }
      - { text: "die Zulassung beantragen", bucket: kaufen }
      - { text: "die Schlüssel entgegennehmen", bucket: kaufen }

