lesson: "SIT/17-am-tresen-a2"
title: "Am Tresen: Bäckerei und Coffee to go — A2"
topic: "Bestellen am Tresen"
category: "Alltag & Einkaufen"
level: A2
summary: "Zum Hieressen oder zum Mitnehmen, warm machen, noch etwas dazu, Tüte, zahlen — und was du sagst, wenn etwas falsch ist."
intro: >
  Nicht das Restaurant mit Kellner, sondern der Tresen: Bäckerei,
  Coffee-Shop, Imbiss. Die Bedienung stellt hier immer dieselben vier
  oder fünf Fragen — „Zum Hieressen oder zum Mitnehmen?“, „Soll ich es
  Ihnen warm machen?“, „Darf es sonst noch etwas sein?“, „Brauchen Sie
  eine Tüte?“, „Karte oder bar?“ — und du musst sie schnell verstehen
  und kurz beantworten. Dazu: was du sagst, wenn der Kaffee mit Milch
  kommt, obwohl du ihn schwarz wolltest, wenn du ein Teil doch nicht
  willst, oder wenn du merkst, dass du zu viel bezahlt hast. Grammatik
  nach Bedarf: Akkusativ, Mengenangaben, trennbare Verben und höfliche
  Bitten mit hätte und würde. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Was steht wo in der Auslage?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: backen, label: "Aus dem Ofen" }
      - { key: trinken, label: "Zum Trinken" }
      - { key: drumherum, label: "Drumherum" }
    tokens:
      - { text: "das Croissant", bucket: backen }
      - { text: "der Milchkaffee", bucket: trinken }
      - { text: "der Pappbecher", bucket: drumherum }
      - { text: "die Laugenstange", bucket: backen }
      - { text: "der Espresso", bucket: trinken }
      - { text: "die Serviette", bucket: drumherum }
      - { text: "das Käsebrötchen", bucket: backen }
      - { text: "die heiße Schokolade", bucket: trinken }
      - { text: "die Papiertüte", bucket: drumherum }
      - { text: "der Streuselkuchen", bucket: backen }
      - { text: "der Apfelsaft", bucket: trinken }
      - { text: "der Deckel", bucket: drumherum }

  - id: A2
    block: A
    type: matching
    title: "Die Frage und deine Antwort"
    instructions: "Ordne jeder Frage der Bedienung eine passende Antwort zu."
    instructionsEn: "Match each question from the counter with a fitting answer."
    left:
      - { key: "1", text: "Zum Hieressen oder zum Mitnehmen?" }
      - { key: "2", text: "Soll ich es Ihnen warm machen?" }
      - { key: "3", text: "Darf es sonst noch etwas sein?" }
      - { key: "4", text: "Brauchen Sie eine Tüte?" }
      - { key: "5", text: "Karte oder bar?" }
      - { key: "6", text: "Welche Größe darf es sein?" }
      - { key: "7", text: "Mit Hafermilch?" }
      - { key: "8", text: "Haben Sie es vielleicht klein?" }
    right:
      - { key: a, text: "Zum Mitnehmen, bitte." }
      - { key: b, text: "Ja, gern, kurz in den Ofen." }
      - { key: c, text: "Nein danke, das war alles." }
      - { key: d, text: "Nein, ich habe eine dabei." }
      - { key: e, text: "Mit Karte, bitte." }
      - { key: f, text: "Einmal mittel, bitte." }
      - { key: g, text: "Ja, bitte, mit Hafer." }
      - { key: h, text: "Moment, ich schaue mal — nein, nur den Schein." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Einmal, zweimal, ein Stück"
    instructions: "Ergänze die Mengenangabe oder den Artikel im Akkusativ."
    instructionsEn: "Fill in the quantity expression or the accusative article."
    text: |
      1. Ich hätte gern {1} Kaffee, bitte. (der Kaffee → Akkusativ)
      2. Und dazu {2} Croissant. (das Croissant → Akkusativ)
      3. Bitte {3} die Laugenstange. (2 × — am Tresen sagt man …mal)
      4. Ich nehme {4} Stück Streuselkuchen. (das Stück → Akkusativ)
      5. Haben Sie noch {5} Brezel? (die Brezel → Akkusativ)
      6. Geben Sie mir bitte {6} halben Liter Milch. (der Liter → Akkusativ)
      7. Dazu noch {7} Käsebrötchen, bitte. (Zahl 3)
      8. Ich möchte {8} Zucker, danke. (Verneinung von einen)
    answers:
      "1": einen
      "2": ein
      "3": zweimal
      "4": ein
      "5": eine
      "6": einen
      "7": drei
      "8": keinen

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Trennbare Verben am Tresen"
    instructions: "Ergänze das Verb in der richtigen Form. Die Vorsilbe gehört ans Satzende."
    instructionsEn: "Fill in the verb in the correct form. The prefix goes to the end of the clause."
    text: |
      1. Soll ich Ihnen das Brötchen kurz {1}? (aufbacken — Infinitiv nach soll)
      2. Ich {2} das Croissant {3}. (mitnehmen, ich-Form)
      3. Die Bedienung {4} den Kuchen {5}. (einpacken, sie-Form)
      4. Können Sie den Becher bitte {6}? (zumachen — Infinitiv nach können)
      5. Wir {7} das Tablett selbst {8}. (wegräumen, wir-Form)
    answers:
      "1": aufbacken
      "2": nehme
      "3": mit
      "4": packt
      "5": ein
      "6": zumachen
      "7": räumen
      "8": weg

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Bäckerei, kurz vor neun"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Morgen, was darf es {1}?
      — Guten Morgen. Ich hätte gern zwei Käsebrötchen und einen
      Milchkaffee.
      — Soll ich Ihnen die Brötchen kurz warm {2}?
      — Ja, gern.
      — Und der Kaffee — zum Hieressen oder zum {3}?
      — Zum Mitnehmen, bitte.
      — Welche {4} darf es sein?
      — Mittel, bitte. Und mit Hafermilch, wenn Sie haben.
      — Haben wir. Darf es {5} noch etwas sein?
      — Nein danke, das war {6}.
      — Brauchen Sie eine {7}?
      — Nein, ich habe eine {8}.
      — Dann macht das 7,40 €. Karte oder {9}?
      — Mit Karte, bitte.
      — Gern. Der Kaffee kommt gleich, ich rufe Sie {10}.
    bank: [SEIN, MACHEN, MITNEHMEN, GRÖSSE, SONST, ALLES, TÜTE, DABEI, BAR, AUF, TELLER, TASSE, STÜCK, GERN]
    answers:
      "1": SEIN
      "2": MACHEN
      "3": MITNEHMEN
      "4": GRÖSSE
      "5": SONST
      "6": ALLES
      "7": TÜTE
      "8": DABEI
      "9": BAR
      "10": AUF

  - id: B2
    block: B
    type: single-choice
    title: "Was antwortest du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "„Zum Hieressen oder zum Mitnehmen?“ Du willst dich hinsetzen. — You want to sit down."
        options:
          - { key: a, text: "Hier, bitte." }
          - { key: b, text: "Zum Hieressen, bitte." }
          - { key: c, text: "Mir egal." }
        answer: b
        why: "Die Antwort greift ein Wort aus der Frage auf — das ist am Tresen das Übliche."
      - q: "„Darf es sonst noch etwas sein?“ Du willst nichts mehr. — You don't want anything else."
        options:
          - { key: a, text: "Nein danke, das war alles." }
          - { key: b, text: "Nein." }
          - { key: c, text: "Ich weiß nicht." }
        answer: a
        why: "„Das war alles“ ist die Standardformel und schließt die Bestellung sauber ab."
      - q: "Du willst den Kaffee ohne Milch. — You want the coffee without milk."
        options:
          - { key: a, text: "Kein Milch." }
          - { key: b, text: "Nicht Milch, bitte." }
          - { key: c, text: "Schwarz, bitte — ohne Milch." }
        answer: c
        why: "„Schwarz“ ist das Fachwort; nach ohne steht der Akkusativ ohne Artikel."
      - q: "Du willst wissen, ob noch Brezeln da sind. — You want to know whether there are any pretzels left."
        options:
          - { key: a, text: "Haben Sie noch Brezeln?" }
          - { key: b, text: "Gibt es Brezeln?" }
          - { key: c, text: "Wo sind die Brezeln?" }
        answer: a
        why: "Mit „noch“ fragst du nach dem Rest — genau das willst du wissen."
      - q: "Die Bedienung fragt: „Haben Sie es klein?“ Du hast nur einen 50er. — You only have a €50 note."
        options:
          - { key: a, text: "Nein." }
          - { key: b, text: "Ich habe leider nur einen Fünfziger, tut mir leid." }
          - { key: c, text: "Das ist Ihr Problem." }
        answer: b
        why: "Kurz erklären statt nur verneinen — die Bedienung weiß dann, womit sie rechnet."
      - q: "Du hast es eilig und willst nur schnell zahlen. — You're in a hurry and just want to pay."
        options:
          - { key: a, text: "Schnell, bitte!" }
          - { key: b, text: "Zahlen!" }
          - { key: c, text: "Ich zahle mit Karte — geht das kontaktlos?" }
        answer: c
        why: "Sag, wie du zahlen willst; „schnell“ und „zahlen!“ klingen unhöflich."

  - id: B3
    block: B
    type: order
    title: "Sätze am Tresen bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "hätte", "gern", "einen", "Kaffee"]
        answer: [0, 1, 2, 3, 4]
        note: "hätte gern — die Standardformel beim Bestellen"
      - tiles: ["Können", "Sie", "das", "bitte", "warm", "machen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Modalverb an Position 1, Infinitiv am Ende"
      - tiles: ["Zum", "Mitnehmen", ",", "bitte"]
        answer: [0, 1, 2, 3]
        note: "Kurzantwort ohne Verb — am Tresen völlig normal"
      - tiles: ["Ich", "nehme", "das", "Croissant", "doch", "nicht", "mit"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Trennverb mit·nehmen: mit am Satzende, nicht davor"
      - tiles: ["Würden", "Sie", "mir", "bitte", "eine", "Tüte", "geben", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "würden + Infinitiv am Ende — besonders höflich"
      - tiles: ["Entschuldigung", ",", "ich", "glaube", ",", "da", "stimmt", "etwas", "nicht"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Der weiche Einstieg für eine Reklamation"

  - id: B4
    block: B
    type: true-false
    title: "Das Schild am Tresen lesen"
    instructions: |
      > **Bäckerei Sommer — Hinweise**
      >
      > - **Coffee to go:** mit eigenem Becher **30 Cent günstiger**.
      >   Becher bitte sauber und vor der Bestellung abgeben.
      > - Belegte Brötchen backen wir gern auf — bitte **bei der
      >   Bestellung** sagen, nachträglich geht es nicht.
      > - Papiertüten kosten **10 Cent**, Stofftaschen 2,50 €.
      > - **Kartenzahlung ab 5 €.** Darunter bitte bar.
      > - Kuchenbestellungen für Feiern: **zwei Tage vorher**, telefonisch
      >   oder am Tresen.
      > - Tische im Café sind bis 11 Uhr nur für Gäste mit Frühstück.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Mit eigenem Becher zahlt man weniger. — With your own cup you pay less."
        answer: true
        why: "„mit eigenem Becher 30 Cent günstiger“."
      - q: "Man kann das Brötchen auch später noch aufbacken lassen. — You can still have the roll warmed up later."
        answer: false
        why: "„bitte bei der Bestellung sagen, nachträglich geht es nicht“."
      - q: "Die Papiertüte ist kostenlos. — The paper bag is free."
        answer: false
        why: "Sie kostet 10 Cent."
      - q: "Einen Kaffee für 3,20 € kann man nicht mit Karte zahlen. — A €3.20 coffee cannot be paid by card."
        answer: true
        why: "Kartenzahlung gibt es erst ab 5 €."
      - q: "Eine Torte für Samstag bestellt man am besten am Donnerstag. — A cake for Saturday is best ordered on Thursday."
        answer: true
        why: "Zwei Tage vorher — von Samstag aus gerechnet ist das der Donnerstag."
      - q: "Um 10 Uhr darf man sich mit einem Kaffee an einen Tisch setzen. — At 10 am you may sit at a table with just a coffee."
        answer: false
        why: "Bis 11 Uhr sind die Tische nur für Gäste mit Frühstück."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Etwas stimmt nicht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du wolltest den Kaffee schwarz, er kommt mit Milch. — You wanted black coffee, it comes with milk."
        options:
          - { key: a, text: "Das ist falsch." }
          - { key: b, text: "Entschuldigung, ich hatte ihn schwarz bestellt — können Sie ihn noch mal machen?" }
          - { key: c, text: "Egal, ich trinke ihn so." }
        answer: b
        why: "Sagen, was du bestellt hattest, und um die Korrektur bitten — freundlich und eindeutig."
      - q: "Du merkst erst draußen, dass ein Brötchen fehlt. — Outside you notice one roll is missing."
        options:
          - { key: a, text: "Nichts machen." }
          - { key: b, text: "Sie haben mich betrogen." }
          - { key: c, text: "Zurückgehen: „Entschuldigung, ich hatte drei bestellt, in der Tüte sind nur zwei.“" }
        answer: c
        why: "Zahl gegen Zahl — das lässt sich sofort prüfen, ohne dass jemand sich angegriffen fühlt."
      - q: "Du hast bestellt, willst ein Teil aber doch nicht. — You've ordered but don't want one item after all."
        options:
          - { key: a, text: "Können Sie das Croissant bitte wieder rausnehmen? Ich nehme es doch nicht." }
          - { key: b, text: "Nehmen Sie das weg." }
          - { key: c, text: "Ich zahle es einfach nicht." }
        answer: a
        why: "Solange nicht bezahlt ist, ist das völlig normal — kurz sagen und begründen reicht."
      - q: "Das Stück Kuchen sieht alt aus. — The piece of cake looks stale."
        options:
          - { key: a, text: "Der ist ja steinalt!" }
          - { key: b, text: "Ist der von heute? Sonst nehme ich lieber ein Croissant." }
          - { key: c, text: "Nichts sagen und trotzdem nehmen." }
        answer: b
        why: "Eine Frage plus Alternative — du bekommst eine Antwort und niemand verliert das Gesicht."
      - q: "Auf dem Bon steht ein Getränk, das du nicht hattest. — The receipt shows a drink you didn't have."
        options:
          - { key: a, text: "Sie haben falsch gerechnet." }
          - { key: b, text: "Entschuldigung, hier steht ein Saft — den hatte ich nicht. Können Sie das noch mal prüfen?" }
          - { key: c, text: "Ich gehe einfach." }
        answer: b
        why: "Auf die Zeile zeigen und um eine Prüfung bitten, statt einen Vorwurf zu machen."
      - q: "Der Becher ist undicht und du hast dich fast verbrüht. — The cup leaks and you nearly scalded yourself."
        options:
          - { key: a, text: "Das ist gefährlich, ich beschwere mich!" }
          - { key: b, text: "Egal." }
          - { key: c, text: "Der Deckel sitzt nicht richtig, es läuft aus — haben Sie einen anderen Becher?" }
        answer: c
        why: "Problem nennen und die Lösung gleich vorschlagen — so geht es am schnellsten."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Entschuldigung, ich hatte den Kaffee {1} bestellt. (ohne Milch)
      2. In der Tüte {2} ein Brötchen. (es ist nicht da)
      3. Können Sie das bitte noch mal {3}? (kontrollieren)
      4. Ich nehme das Croissant {4} nicht. (ich habe meine Meinung geändert)
      5. Der Deckel {5} nicht richtig. (ist nicht fest drauf)
      6. Auf dem {6} steht ein Getränk zu viel. (der Kassenzettel)
    answers:
      "1": schwarz
      "2": fehlt
      "3": prüfen
      "4": doch
      "5": sitzt
      "6": Bon

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Zum Hieressen oder zum {1}? (to take away)
      2. Soll ich es Ihnen warm {2}? (heat it up)
      3. Darf es sonst noch etwas {3}? (anything else?)
      4. Nein danke, das war {4}. (that was everything)
      5. Brauchen Sie eine {5}? (a bag)
      6. Nein, ich habe eine {6}. (I have got one with me)
      7. Welche {7} darf es sein? (size)
      8. Ich hätte gern einen Kaffee {8} Mitnehmen. (zu + dem)
      9. Karte oder {9}? (cash)
      10. Können Sie das bitte {10}? (wrap it up)
      11. Entschuldigung, da stimmt etwas {11}. (something is wrong)
      12. Ich nehme es {12} nicht, tut mir leid. (after all / on second thought)
    answers:
      "1": Mitnehmen
      "2": machen
      "3": sein
      "4": alles
      "5": Tüte
      "6": dabei
      "7": Größe
      "8": zum
      "9": bar
      "10": einpacken
      "11": nicht
      "12": doch

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: zwei Minuten am Tresen"
    prompt: "Schreib das Gespräch am Tresen. 14–18 Sätze."
    stimulus: |
      Du bist auf dem Weg zur Arbeit und gehst in die Bäckerei. Schreib
      beide Rollen (dich und die Bedienung).

      Diese Momente müssen vorkommen:
      1. begrüßt werden und bestellen
      2. gefragt werden, ob etwas warm gemacht werden soll
      3. sagen, ob du hier isst oder mitnimmst
      4. nach der Größe gefragt werden
      5. etwas dazu bestellen — oder ablehnen
      6. die Frage nach der Tüte beantworten
      7. merken, dass ein Teil nicht stimmt, und es ansprechen
      8. ein Teil doch nicht nehmen
      9. bezahlen und dich verabschieden
    use:
      - "Sie-Form durchgehend"
      - "`Ich hätte gern …`"
      - "`Zum Mitnehmen, bitte.`"
      - "`Nein danke, das war alles.`"
      - "`Entschuldigung, ich hatte … bestellt.`"
    selfCheck:
      - "Sind die Sätze kurz? Am Tresen redet niemand lang."
      - "Steht bei `mitnehmen`, `einpacken`, `aufbacken` die Vorsilbe am Satzende?"
      - "Hast du nach `ohne` und `für` den Akkusativ benutzt?"
      - "Kommen alle 9 Momente vor?"
    model: |
      Bedienung: Guten Morgen, was darf es sein?
      Ich: Guten Morgen. Ich hätte gern zwei Käsebrötchen und einen Milchkaffee.
      Bedienung: Soll ich Ihnen die Brötchen kurz warm machen?
      Ich: Ja, gern.
      Bedienung: Zum Hieressen oder zum Mitnehmen?
      Ich: Zum Mitnehmen, bitte.
      Bedienung: Welche Größe darf der Kaffee sein?
      Ich: Mittel, bitte, und mit Hafermilch, wenn Sie haben.
      Bedienung: Haben wir. Darf es sonst noch etwas sein?
      Ich: Ja, ein Croissant noch.
      Bedienung: Brauchen Sie eine Tüte?
      Ich: Nein danke, ich habe eine dabei.
      Ich: Entschuldigung, ich hatte den Kaffee mit Hafermilch bestellt — der hier ist mit Kuhmilch, oder?
      Bedienung: Oh, das tut mir leid, ich mache Ihnen einen neuen.
      Ich: Danke. Und das Croissant nehme ich doch nicht, tut mir leid.
      Bedienung: Kein Problem, ich nehme es wieder raus. Dann macht das 6,10 €.
      Ich: Mit Karte, bitte. Geht das kontaktlos?
      Bedienung: Klar. So, fertig — schönen Tag noch!
      Ich: Danke, Ihnen auch!
