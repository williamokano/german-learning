      - { key: c, text: "Ja, bitte für diese Woche — mein Arbeitgeber braucht sie." }
      - { key: d, text: "Ich habe Halsschmerzen und Husten." }
      - { key: e, text: "Nein, das ist mein erster Termin hier." }
      - { key: f, text: "Ja, gegen Penizillin." }
      - { key: g, text: "Nur eine Tablette für den Blutdruck." }
