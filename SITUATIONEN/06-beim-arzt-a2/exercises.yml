      - { key: "4", text: "Waren Sie schon einmal bei uns?" }
      - { key: "5", text: "Nehmen Sie regelmäßig Medikamente?" }
      - { key: "6", text: "Brauchen Sie eine Krankschreibung?" }
      - { key: "7", text: "Haben Sie Ihre Versichertenkarte dabei?" }
      - { key: "8", text: "Sind Sie gegen etwas allergisch?" }
    right:
