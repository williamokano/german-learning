lesson: "SIT/06-beim-arzt-a2"
title: "Beim Arzt — A2"
topic: "Beim Arzt"
category: "Sport & Gesundheit"
level: A2
summary: "Einen Termin bekommen, Beschwerden beschreiben, Rezept und Krankschreibung — und weiterkommen, wenn kein Termin frei ist."
intro: >
  Vom Anruf in der Praxis bis zum Rezept in der Hand. Der Kern ist:
  Beschwerden so beschreiben, dass jemand sie einordnen kann — seit wann,
  wo genau, wie stark. Dazu das deutsche System: Hausarzt, Überweisung,
  Facharzt, Krankschreibung für den Arbeitgeber. Grammatik nach Bedarf:
  „seit“ + Dativ, Körperteile mit „tut/tun weh“, Modalverben für
  Empfehlungen. Block C ist der Ernstfall: kein Termin frei, Überweisung
  fehlt, am Wochenende krank. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

