      1. Mein Kopf {1}.
      2. Meine Ohren {2}.
      3. Mein Hals {3}.
      4. Meine Füße {4}.
      5. Mein Rücken {5}.
      6. Meine Augen {6}.
    answers:
      "1": "tut weh"
      "2": "tun weh"
      "3": "tut weh"
      "4": "tun weh"
      "5": "tut weh"
