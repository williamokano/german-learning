  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Das Geschenk vorbereiten"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} noch keine Geschenkidee für meine Schwester. (haben, Präsens)
      2. {2} du das Geschenk schon eingepackt? (haben, Perfekt)
      3. Man {3} den Kassenbon für den Umtausch aufheben. (sollen, Präsens)
      4. {4} Sie mir bitte ein schönes Geschenkpapier zeigen? (können, Sie-Form)
      5. Falls das Geschenk nicht {5}, kann man es umtauschen. (passen, Präsens)
      6. Meine Freundin {6} sich sicher sehr über das Geschenk freuen. (werden, Futur I)
      7. Ich {7} schon eine Grußkarte geschrieben. (haben, Perfekt)
      8. {8} das Geschenk schon eingepackt worden? (sein, Perfekt Passiv)
    answers:
      "1": habe
      "2": Hast
      "3": soll
      "4": Können
      "5": passt
      "6": wird
      "7": habe
      "8": Ist

  - id: A4
    block: A
