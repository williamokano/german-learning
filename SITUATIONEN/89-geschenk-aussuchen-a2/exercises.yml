  - id: D2
    block: D
    type: free-write
    title: "Aussuchen, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: ein Geschenk aussuchen und einpacken, ein Problem beim Einpacken oder Überreichen, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du suchst ein Geschenk für eine gute Freundin, kaufst es und
      packst es zu Hause ein. Beim Einpacken reißt das Geschenkpapier.

      Beim Aussuchen müssen vorkommen:
      1. eine Geschenkidee finden
      2. das Geschenk kaufen
      3. eine Grußkarte dazulegen

      Beim Problem müssen vorkommen:
      4. das Geschenkpapier reißt
      5. sich kurz ärgern
      6. neues Papier holen

      In der Lösung müssen vorkommen:
      7. das Geschenk noch einmal einpacken
      8. das Geschenk überreichen
      9. sich über die Reaktion freuen
      10. den Kassenbon aufheben
    use:
      - "höfliche Frage: „Können Sie mir bitte ein schönes Geschenkpapier zeigen?“"
      - "Perfekt: „Ich habe eine tolle Geschenkidee gefunden.“"
      - "Futur I: „Morgen werde ich das Geschenk überreichen.“"
    selfCheck:
      - "Wird das Aussuchen klar beschrieben?"
      - "Klingt die Reaktion auf das gerissene Papier realistisch?"
      - "Wird das Überreichen als Höhepunkt erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Aussuchen**

      Ich habe endlich eine tolle Geschenkidee für meine Freundin gefunden: ein schönes Buch.
      Ich kaufe das Buch und eine passende Grußkarte dazu.

      **Das Problem**

      Zu Hause packe ich das Geschenk ein, aber das Geschenkpapier reißt plötzlich.
      Ich ärgere mich kurz, aber dann hole ich einfach neues Papier.

      **Die Lösung**

      Ich packe das Geschenk noch einmal sorgfältig ein.
      Am nächsten Tag überreiche ich ihr das Geschenk.
      Sie freut sich riesig über das Buch und die Karte.
      Den Kassenbon hebe ich für alle Fälle trotzdem auf.
