lesson: "SIT/89-geschenk-aussuchen-a2"
title: "Ein Geschenk aussuchen und überreichen — A2"
topic: "Ein Geschenk aussuchen und überreichen"
category: "Soziales"
level: A2
summary: "Eine passende Geschenkidee finden, das Geschenk kaufen und einpacken lassen und es feierlich überreichen — und was tun, wenn das Papier reißt oder das Geschenk nicht gefällt."
intro: >
  Ein gutes Geschenk braucht Vorbereitung: eine passende Geschenkidee
  finden, es im Geschäft einpacken lassen, vielleicht eine Grußkarte
  dazulegen und den Kassenbon für den Fall des Umtauschs aufheben.
  Dieses Set übt genau das — aussuchen, einpacken, überreichen, und
  was zu tun ist, wenn das Geschenkpapier reißt oder das Geschenk
  nicht gefällt. Grammatik nach Bedarf: Modalverben, Perfekt und Futur
  I. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

