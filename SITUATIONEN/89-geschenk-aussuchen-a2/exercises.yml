        note: "Perfekt, reflexiv, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Geschenk lesen"
    instructions: |
      > **Info — Ein Geschenk aussuchen und überreichen**
      >
      > - **Geschenkidee:** am besten die **Interessen der Person**
      >   bedenken, nicht nur den Preis.
      > - **Geschenkpapier:** viele Geschäfte bieten einen
      >   **kostenlosen oder günstigen Einpackservice** an.
      > - **Kassenbon:** sollte man für einen möglichen Umtausch
      >   **gut aufbewahren**.
      > - **Umtausch:** ist meist nur **mit Kassenbon** möglich.
      > - **Geschenkgutschein:** eine gute Alternative, wenn man sich
      >   **unsicher** ist.
      > - **Grußkarte:** eine persönliche Karte macht ein Geschenk
      >   **noch schöner**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Bei einer guten Geschenkidee sollte man vor allem die Interessen der Person bedenken. — When choosing a good gift idea, you should mainly consider the person's interests."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Geschenk."
      - q: "Viele Geschäfte bieten überhaupt keinen Einpackservice an. — Many shops offer no gift-wrapping service at all."
        answer: false
        why: "Viele Geschäfte bieten einen kostenlosen oder günstigen Einpackservice an."
      - q: "Den Kassenbon sollte man für einen möglichen Umtausch gut aufbewahren. — You should keep the receipt safe in case you need to exchange the gift."
        answer: true
        why: "„Kassenbon: sollte man für einen möglichen Umtausch gut aufbewahren.“"
      - q: "Ein Umtausch ist auch ohne Kassenbon immer problemlos möglich. — An exchange is always possible without any problem even without a receipt."
        answer: false
        why: "Ein Umtausch ist meist nur mit Kassenbon möglich."
      - q: "Ein Geschenkgutschein ist eine gute Alternative, wenn man unsicher ist. — A gift voucher is a good alternative when you're unsure."
        answer: true
        why: "„Geschenkgutschein: eine gute Alternative, wenn man sich unsicher ist.“"
      - q: "Eine persönliche Grußkarte macht ein Geschenk nicht schöner. — A personal greeting card doesn't make a gift nicer."
        answer: false
        why: "Eine persönliche Karte macht ein Geschenk noch schöner, nicht weniger schön."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Geschenk etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Sie merken kurz vor der Feier, dass Sie das falsche Geschenk gekauft haben. — You notice shortly before the party that you bought the wrong gift."
        options:
          - { key: a, text: "Einfach nichts sagen und das falsche Geschenk trotzdem geben." }
          - { key: b, text: "Schnell noch umtauschen oder ein passenderes Geschenk besorgen." }
          - { key: c, text: "Die Feier komplett verpassen." }
        answer: b
        why: "Ein schneller Umtausch löst das Problem noch rechtzeitig vor der Feier."
      - q: "Sie haben Ihren Kassenbon verloren und möchten das Geschenk umtauschen. — You've lost your receipt and want to exchange the gift."
        options:
          - { key: a, text: "Das Geschenk einfach wegwerfen." }
          - { key: b, text: "Sich beim Geschäft beschweren, ohne nachzufragen." }
          - { key: c, text: "Höflich nachfragen, ob ein Umtausch auch ohne Bon möglich ist." }
        answer: c
        why: "Manche Geschäfte erlauben einen Umtausch auch ohne Kassenbon, zum Beispiel gegen Gutschrift."
      - q: "Der beschenkten Person gefällt das Geschenk offensichtlich nicht. — The person clearly doesn't like the gift."
        options:
          - { key: a, text: "Ruhig anbieten, es gemeinsam umzutauschen." }
          - { key: b, text: "Beleidigt sein und die Person kritisieren." }
          - { key: c, text: "Das Geschenk sofort zurückverlangen." }
        answer: a
        why: "Ein ruhiges Angebot nimmt der Situation die Peinlichkeit."
      - q: "Beim Einpacken reißt das Geschenkpapier. — The wrapping paper tears while you're wrapping the gift."
        options:
          - { key: a, text: "Das Geschenk einfach ohne Papier überreichen." }
          - { key: b, text: "Neues Geschenkpapier holen und es noch einmal versuchen." }
          - { key: c, text: "Das Geschenk gar nicht mehr überreichen." }
        answer: b
        why: "Neues Papier löst das Problem am einfachsten."
      - q: "Ihr online bestelltes Geschenk kommt erst nach der Feier an. — Your gift ordered online only arrives after the party."
        options:
          - { key: a, text: "Das Geschenk einfach zurückschicken." }
          - { key: b, text: "Nichts sagen und so tun, als gäbe es kein Geschenk." }
          - { key: c, text: "Der Person ehrlich erklären, dass das Geschenk noch unterwegs ist." }
        answer: c
        why: "Eine ehrliche Erklärung wird meist mit Verständnis aufgenommen."
      - q: "Zwei Personen schenken der gleichen Person versehentlich dasselbe Geschenk. — Two people accidentally give the same person the same gift."
        options:
          - { key: a, text: "Gemeinsam überlegen, ob eines umgetauscht werden kann." }
          - { key: b, text: "So tun, als wäre nichts passiert." }
          - { key: c, text: "Sich gegenseitig Vorwürfe machen." }
        answer: a
        why: "Eine gemeinsame Lösung ist entspannter als gegenseitige Vorwürfe."

