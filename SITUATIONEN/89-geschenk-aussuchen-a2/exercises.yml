  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Aussuchen, einpacken, überreichen"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (im Geschäft)
      — Guten Tag, ich suche ein {1} für meine Mutter.
      — Gerne, haben Sie schon eine {2}?
      — Nicht wirklich, sie mag Bücher und Tee.
      — Wie wäre es mit diesem schönen Teeset?
      — Das gefällt mir! Können Sie es mir bitte {3}?
      — Natürlich, welches {4} möchten Sie denn?
      — Das rote, bitte, mit einer Schleife.
      — Gerne. Möchten Sie auch eine {5} dazulegen?
      — Ja, bitte, die mit den Blumen.
      — Bitte sehr. Und hier ist Ihr {6}, falls Sie etwas umtauschen
      möchten.
      — Vielen Dank, den hebe ich gut auf.
      (zu Hause, beim Überreichen)
      — Herzlichen Glückwunsch, Mama! Ich {7} dir dieses kleine
      Geschenk.
      — Oh, wie schön {8}! Vielen Dank!
      — Falls es dir nicht gefällt, kannst du es zum {9}
      zurückbringen.
      — Deine Reaktion macht mir so viel {10}.
    bank: [GESCHENK, GESCHENKIDEE, RABATT, EINPACKEN, GESCHENKPAPIER, GESCHENKGUTSCHEIN, GRUSSKARTE, KASSENBON, VERPACKUNG, ÜBERREICHE, GESCHENKKORB, VERPACKT, UMTAUSCH, FREUDE]
    answers:
      "1": GESCHENK
      "2": GESCHENKIDEE
      "3": EINPACKEN
      "4": GESCHENKPAPIER
      "5": GRUSSKARTE
      "6": KASSENBON
      "7": ÜBERREICHE
      "8": VERPACKT
      "9": UMTAUSCH
      "10": FREUDE

  - id: B2
    block: B
    type: single-choice
    title: "Aussuchen und einpacken"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Verkäuferin sagen, dass du ein Geschenk für deine Mutter suchst. — You want to tell the shop assistant you're looking for a gift for your mother."
        options:
          - { key: a, text: "Geschenke interessieren mich nicht." }
          - { key: b, text: "Ich suche ein Geschenk für meine Mutter." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg beim Kauf eines Geschenks."
      - q: "Du willst wissen, ob du das Geschenk einpacken lassen kannst. — You want to know if you can have the gift wrapped."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Können Sie mir das Geschenk bitte einpacken?" }
        answer: c
        why: "Eine höfliche Frage klärt, ob ein Einpackservice angeboten wird."
      - q: "Du willst der Verkäuferin sagen, welches Geschenkpapier du möchtest. — You want to tell the shop assistant which wrapping paper you want."
        options:
          - { key: a, text: "Das rote Geschenkpapier, bitte, mit einer Schleife." }
          - { key: b, text: "Farben interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Angabe hilft der Verkäuferin beim passenden Einpacken."
      - q: "Du willst wissen, ob du das Geschenk später umtauschen kannst. — You want to know if you can exchange the gift later."
        options:
          - { key: a, text: "Umtausch interessiert mich nicht." }
          - { key: b, text: "Kann ich das Geschenk später umtauschen, falls es nicht gefällt?" }
          - { key: c, text: "Das ist mir egal, Hauptsache es sieht schön aus." }
        answer: b
        why: "Eine direkte Frage klärt frühzeitig die Umtauschmöglichkeiten."
      - q: "Du willst wissen, wie viel das Geschenk ungefähr kostet. — You want to know roughly how much the gift costs."
        options:
          - { key: a, text: "Preise interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie viel kostet das Geschenk eigentlich ungefähr?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig das Budget."
      - q: "Du willst deiner Mutter beim Überreichen alles Gute wünschen. — You want to wish your mother all the best while handing over the gift."
        options:
          - { key: a, text: "Herzlichen Glückwunsch, Mama, ich wünsche dir alles Gute!" }
          - { key: b, text: "Glückwünsche interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine herzliche Formulierung passt zum feierlichen Moment des Überreichens."

