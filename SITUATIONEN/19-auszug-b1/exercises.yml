lesson: "SIT/19-auszug-b1"
title: "Auszug: kündigen, übergeben, Kaution — B1"
topic: "Aus der Wohnung ausziehen"
category: "Wohnen & Nachbarschaft"
level: B1
summary: "Fristgerecht kündigen, den Übergabetermin machen, das Protokoll lesen und die Kaution zurückbekommen."
intro: >
  Ausziehen ist vor allem eine Frage von Fristen und Papier. Du kündigst
  schriftlich, meistens mit drei Monaten Frist zum Monatsende; du machst
  einen Termin für die Übergabe; ihr geht durch die Wohnung und schreibt
  ein Protokoll, in dem steht, was in Ordnung ist und was nicht; und
  danach wartest du auf die Kaution, die die Verwaltung ganz oder
  teilweise zurückzahlt. An genau diesen vier Stellen wird gestritten —
  über Schönheitsreparaturen, über Zählerstände, über die Frist. Grammatik
  nach Bedarf: Passiv, Konjunktiv II für höfliche Forderungen,
  Nebensätze mit damit, falls und sobald. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

