lesson: "SIT/57-wandern-klettern-a2"
title: "Wandern und Klettern — A2"
topic: "Wandern und Klettern"
category: "Freizeit & Kultur"
level: A2
summary: "Den Weg lesen, Ausrüstung leihen, auf einen Wettersturz reagieren — und was tun, wenn man sich verläuft."
intro: >
  Beim Wandern und Klettern lohnt sich Vorbereitung: die Markierungen
  auf dem Weg lesen, passende Ausrüstung leihen, und wissen, was bei
  plötzlichem Wetterumschwung zu tun ist. Dieses Set übt genau das —
  dazu das Gespräch mit anderen Wandernden auf dem Weg und, was zu tun
  ist, wenn man sich verläuft. Grammatik nach Bedarf: Wechselpräpositionen
  bei Richtungsangaben, Nebensätze mit falls, höfliche Bitten mit
  Konjunktiv II. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn
  es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Der Weg, die Ausrüstung oder das Wetter?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: weg, label: "Der Weg" }
      - { key: ausruestung, label: "Die Ausrüstung" }
      - { key: wetter, label: "Das Wetter" }
    tokens:
      - { text: "die Markierung", bucket: weg }
      - { text: "der Klettergurt", bucket: ausruestung }
      - { text: "der Wettersturz", bucket: wetter }
      - { text: "die Wanderkarte", bucket: weg }
      - { text: "die Wanderstiefel", bucket: ausruestung }
      - { text: "das Gewitter", bucket: wetter }
      - { text: "die Abzweigung", bucket: weg }
      - { text: "der Helm", bucket: ausruestung }
      - { text: "der Nebel", bucket: wetter }
      - { text: "die Schutzhütte", bucket: weg }
      - { text: "die Regenjacke", bucket: ausruestung }
      - { text: "die Vorhersage", bucket: wetter }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "die Markierung" }
      - { key: "2", text: "sich verlaufen" }
      - { key: "3", text: "der Klettergurt" }
      - { key: "4", text: "der Wettersturz" }
      - { key: "5", text: "die Schutzhütte" }
      - { key: "6", text: "wasserdicht" }
      - { key: "7", text: "der Notfallkontakt" }
      - { key: "8", text: "die Vorhersage" }
    right:
      - { key: a, text: "das farbige Zeichen, das den Weg zeigt" }
      - { key: b, text: "den richtigen Weg nicht mehr finden" }
      - { key: c, text: "das Gurtsystem für die Sicherung beim Klettern" }
      - { key: d, text: "eine plötzliche, starke Verschlechterung des Wetters" }
      - { key: e, text: "ein kleines Gebäude zum Unterstellen bei schlechtem Wetter" }
      - { key: f, text: "so, dass kein Wasser durchkommt" }
      - { key: g, text: "die Person, die man im Notfall anruft" }
      - { key: h, text: "die Einschätzung, wie das Wetter wird" }
