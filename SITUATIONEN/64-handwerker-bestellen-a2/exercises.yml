lesson: "SIT/64-handwerker-bestellen-a2"
title: "Handwerker bestellen — A2"
topic: "Handwerker bestellen"
category: "Wohnen & Nachbarschaft"
level: A2
summary: "Einen Kostenvoranschlag einholen, die Verfügbarkeit klären, den Auftrag bestätigen — und was tun, wenn ein Betrieb nicht antwortet oder die Kosten plötzlich steigen."
intro: >
  Bevor ein Handwerker vor der Tür steht, muss erst mal jemand gefunden
  werden: mehrere Betriebe anfragen, Kostenvoranschläge vergleichen, die
  Verfügbarkeit klären und den Auftrag am Ende schriftlich bestätigen.
  Dieses Set übt genau das — nach einem Kostenvoranschlag fragen, die
  Dringlichkeit erklären, Bewertungen vergleichen, und was zu tun ist,
  wenn ein Betrieb tagelang nicht antwortet oder plötzlich mehr
  verlangt. Grammatik nach Bedarf: Perfekt im Bericht, höfliche
  Fragen, Nebensätze mit falls. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

