      - { text: "nach Empfehlungen fragen", bucket: suchen }
      - { text: "die Verfügbarkeit prüfen", bucket: suchen }
      - { text: "das Problem genau beschreiben", bucket: anfragen }
      - { text: "Fotos vom Schaden schicken", bucket: anfragen }
      - { text: "nach einem Kostenvoranschlag fragen", bucket: anfragen }
      - { text: "die Dringlichkeit erklären", bucket: anfragen }
      - { text: "den günstigsten Festpreis wählen", bucket: beauftragen }
      - { text: "einen Termin vereinbaren", bucket: beauftragen }
      - { text: "den Auftrag schriftlich bestätigen", bucket: beauftragen }
      - { text: "die Anschrift durchgeben", bucket: beauftragen }

