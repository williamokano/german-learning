      - { key: d, text: "ein Grund, der die eigene Position stützt" }
      - { key: e, text: "der Vergleich des eigenen Gehalts mit dem Markt" }
      - { key: f, text: "die Aufgaben, für die man zuständig ist" }
      - { key: g, text: "der vorgeschlagene neue Betrag" }
      - { key: h, text: "das Gespräch über die genaue Höhe" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Das Gespräch vorbereiten"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} letzte Woche um ein Gespräch gebeten. (haben, Perfekt)
      2. {2} Sie mir bitte kurz Zeit für ein Gespräch geben? (können, Sie-Form)
      3. Man {3} sich vor dem Gespräch gut vorbereiten. (sollen, Präsens)
      4. {4} das Gespräch schon vereinbart worden? (sein, Perfekt Passiv)
      5. Falls das Angebot zu niedrig {5}, kann ich nachverhandeln. (sein, Präsens)
      6. Meine Chefin {6} sich das Angebot sicher noch einmal überlegen. (werden, Futur I)
      7. Ich {7} schon meine Leistungen dokumentiert. (haben, Perfekt)
      8. {8} Sie mir bitte ein konkretes Angebot machen? (können, Sie-Form)
    answers:
      "1": habe
      "2": Können
      "3": soll
      "4": Ist
      "5": ist
      "6": wird
      "7": habe
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte um eine {1} bitten. (mehr Geld für die gleiche Stelle)
      2. Für das {2} habe ich mir extra Zeit genommen. (die Unterhaltung mit der Führungskraft)
      3. Ich habe meine {3} der letzten zwölf Monate zusammengefasst. (das, was man beruflich erreicht hat)
      4. Mein stärkstes {4} ist das neue Projekt. (ein Grund, der die eigene Position stützt)
      5. Ich habe einen {5} mit ähnlichen Positionen gemacht. (der Vergleich mit dem Markt)
      6. In den letzten Monaten habe ich mehr {6} übernommen. (die Aufgaben, für die man zuständig ist)
    answers:
      "1": Gehaltserhöhung
      "2": Gespräch
      "3": Leistung
      "4": Argument
      "5": Marktvergleich
      "6": Verantwortung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Bitten, argumentieren, verhandeln"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (im Büro der Chefin)
      — Guten Tag, vielen Dank, dass Sie sich Zeit für dieses {1}
      nehmen.
      — Gerne, worum geht es?
      — Ich möchte über eine {2} sprechen.
      — Verstehe. Erzählen Sie mir, warum Sie das jetzt ansprechen.
      — In den letzten Monaten habe ich deutlich mehr {3}
      übernommen, zum Beispiel die Leitung des neuen Projekts.
      — Das stimmt, Sie haben sich sehr engagiert.
      — Ich habe außerdem einen {4} gemacht: Für meine Position
      liegt das übliche Gehalt deutlich höher.
      — Interessant, das schaue ich mir gern genauer an.
      — Ich {5} mir eine Erhöhung um zehn Prozent vor.
      — Das muss ich intern noch klären, aber ich {6} Ihnen bis
      nächste Woche ein konkretes {7}.
      — Vielen Dank, das freut mich sehr.
      (eine Woche später)
      — Ich habe mit der Geschäftsführung {8} und wir können Ihnen
      sieben Prozent anbieten.
      — Das ist etwas weniger, als ich mir vorgestellt hatte. Können
      wir noch einmal {9}?
      — Lassen Sie uns einen Kompromiss bei acht Prozent {10}.
      — Das klingt fair, damit bin ich einverstanden.
    bank: [GESPRÄCH, GEHALTSERHÖHUNG, BONUS, VERANTWORTUNG, PRÄMIE, MARKTVERGLEICH, ZEUGNIS, STELLE, BEFÖRDERUNG, GEBE, ANGEBOT, VERHANDELT, VERHANDELN, FINDEN]
    answers:
      "1": GESPRÄCH
      "2": GEHALTSERHÖHUNG
      "3": VERANTWORTUNG
      "4": MARKTVERGLEICH
      "5": STELLE
      "6": GEBE
      "7": ANGEBOT
      "8": VERHANDELT
      "9": VERHANDELN
      "10": FINDEN

  - id: B2
    block: B
    type: single-choice
    title: "Bitten und argumentieren"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Chefin sagen, dass du über eine Gehaltserhöhung sprechen möchtest. — You want to tell your boss you'd like to talk about a raise."
        options:
          - { key: a, text: "Gehälter interessieren mich nicht." }
          - { key: b, text: "Ich möchte über eine Gehaltserhöhung sprechen." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg in dieses Gespräch."
      - q: "Du willst wissen, ob ihr noch einmal über die Höhe verhandeln könnt. — You want to know if you can negotiate the amount once more."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Können wir noch einmal über die Höhe verhandeln?" }
        answer: c
        why: "Eine direkte Frage hält die Verhandlung offen."
      - q: "Du willst der Chefin erklären, dass du in letzter Zeit mehr Verantwortung übernommen hast. — You want to explain to your boss that you've taken on more responsibility recently."
        options:
          - { key: a, text: "In den letzten Monaten habe ich deutlich mehr Verantwortung übernommen." }
          - { key: b, text: "Verantwortung interessiert mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine konkrete Aussage stützt die Bitte um eine Erhöhung."
      - q: "Du willst wissen, ob die Chefin dir ein konkretes Angebot machen kann. — You want to know if your boss can give you a concrete offer."
        options:
          - { key: a, text: "Angebote interessieren mich nicht." }
          - { key: b, text: "Können Sie mir ein konkretes Angebot machen?" }
          - { key: c, text: "Das ist mir egal, Hauptsache ich bekomme irgendwas." }
        answer: b
        why: "Eine direkte Frage klärt die konkreten nächsten Schritte."
      - q: "Du willst wissen, wie hoch die Gehaltserhöhung ungefähr ausfallen könnte. — You want to know roughly how much the raise might be."
        options:
          - { key: a, text: "Zahlen interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie hoch könnte die Gehaltserhöhung ungefähr ausfallen?" }
        answer: c
        why: "Eine direkte Frage klärt frühzeitig die Größenordnung."
      - q: "Du willst dich für die Zeit für das Gespräch bedanken. — You want to thank your boss for the time for this conversation."
        options:
          - { key: a, text: "Vielen Dank, dass Sie sich Zeit für dieses Gespräch nehmen." }
          - { key: b, text: "Gespräche interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Ein höflicher Dank ist der übliche Einstieg in ein solches Gespräch."

  - id: B3
    block: B
    type: order
    title: "Sätze zur Gehaltserhöhung bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "über", "eine", "Gehaltserhöhung", "sprechen"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "höfliche Aussage, Infinitiv am Ende"
      - tiles: ["Können", "Sie", "mir", "ein", "konkretes", "Angebot", "machen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "höfliche Frage mit Modalverb"
      - tiles: ["Wir", "finden", "sicher", "einen", "guten", "Kompromiss"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Aussage, Verb an Position 2"
      - tiles: ["Nächste", "Woche", "werde", "ich", "ein", "Angebot", "bekommen"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Futur I, Zeitangabe an Position 1, Verb an Position 2"
      - tiles: ["Wie", "hoch", "könnte", "die", "Erhöhung", "eigentlich", "sein", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "W-Frage mit Modalverb im Konjunktiv II"
      - tiles: ["Ich", "habe", "meine", "Leistungen", "schon", "dokumentiert"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Infos zur Gehaltserhöhung lesen"
    instructions: |
      > **Info — Um eine Gehaltserhöhung bitten**
      >
      > - **Timing:** am besten **nach einem erfolgreichen Projekt**
      >   oder vor der Jahresplanung fragen.
      > - **Vorbereitung:** **konkrete Erfolge und Zahlen** wirken
      >   überzeugender als allgemeine Aussagen.
      > - **Marktvergleich:** hilft, eine **realistische Zahl** zu
      >   nennen.
      > - **Betrag:** sollte man **selbst konkret nennen**, nicht
      >   der Chefin überlassen.
      > - **Kompromiss:** ist bei Gehaltsverhandlungen oft **das
      >   Ergebnis**.
      > - **Ergebnis:** sollte man sich **schriftlich bestätigen**
      >   lassen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man sollte am besten nach einem erfolgreichen Projekt oder vor der Jahresplanung fragen. — It's best to ask after a successful project or before annual planning."
        answer: true
        why: "So steht es ausdrücklich in den Infos zur Gehaltserhöhung."
      - q: "Allgemeine Aussagen wirken überzeugender als konkrete Erfolge und Zahlen. — General statements are more convincing than concrete achievements and figures."
        answer: false
        why: "Konkrete Erfolge und Zahlen wirken überzeugender als allgemeine Aussagen."
      - q: "Ein Marktvergleich hilft, eine realistische Zahl zu nennen. — A market comparison helps state a realistic figure."
        answer: true
        why: "„Marktvergleich: hilft, eine realistische Zahl zu nennen.“"
      - q: "Den konkreten Betrag sollte man besser komplett der Chefin überlassen. — It's better to leave the exact amount entirely to your boss."
        answer: false
        why: "Den Betrag sollte man selbst konkret nennen, nicht der Chefin überlassen."
      - q: "Ein Kompromiss ist bei Gehaltsverhandlungen oft das Ergebnis. — A compromise is often the outcome of salary negotiations."
        answer: true
        why: "„Kompromiss: ist bei Gehaltsverhandlungen oft das Ergebnis.“"
      - q: "Das Ergebnis muss man sich nie schriftlich bestätigen lassen. — You never need to get the outcome confirmed in writing."
        answer: false
        why: "Man sollte sich das Ergebnis schriftlich bestätigen lassen."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Gehaltsgespräch etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ihr Chef lehnt die Gehaltserhöhung komplett ab. — Your boss completely rejects the raise."
        options:
          - { key: a, text: "Sofort kündigen." }
          - { key: b, text: "Nach konkreten Gründen und möglichen nächsten Schritten fragen." }
          - { key: c, text: "Beleidigt das Gespräch sofort beenden." }
        answer: b
        why: "Eine Nachfrage klärt, welche Schritte für eine spätere Erhöhung nötig sind."
      - q: "Ihr Chef vertröstet Sie immer wieder, ohne einen konkreten Termin zu nennen. — Your boss keeps putting you off without naming a concrete date."
        options:
          - { key: a, text: "Das Thema einfach nie wieder ansprechen." }
          - { key: b, text: "Sofort eine Beschwerde bei der Personalabteilung einreichen." }
          - { key: c, text: "Höflich, aber bestimmt einen konkreten Termin einfordern." }
        answer: c
        why: "Eine bestimmte Nachfrage verhindert, dass das Thema versandet."
      - q: "Das Angebot liegt deutlich unter Ihren Erwartungen. — The offer is well below your expectations."
        options:
          - { key: a, text: "Sachlich erklären, warum ein höherer Betrag angemessen wäre." }
          - { key: b, text: "Das Angebot sofort und wortlos akzeptieren." }
          - { key: c, text: "Aus Enttäuschung sofort kündigen." }
        answer: a
        why: "Eine sachliche Erklärung eröffnet Raum für eine Nachverhandlung."
      - q: "Sie erfahren, dass ein Kollege für die gleiche Arbeit deutlich mehr verdient. — You learn that a colleague earns much more for the same work."
        options:
          - { key: a, text: "Sich beim Kollegen über das Gehalt beschweren." }
          - { key: b, text: "Das Thema sachlich mit der Chefin besprechen." }
          - { key: c, text: "Es einfach so hinnehmen, ohne etwas zu sagen." }
        answer: b
        why: "Ein sachliches Gespräch mit der Führungskraft ist der richtige Weg."
      - q: "Ihr Chef reagiert im Gespräch sichtlich genervt. — Your boss reacts visibly annoyed during the conversation."
        options:
          - { key: a, text: "Genauso gereizt zurückreagieren." }
          - { key: b, text: "Das Gespräch sofort abbrechen." }
          - { key: c, text: "Ruhig bleiben und sachlich bei Ihren Argumenten bleiben." }
        answer: c
        why: "Ruhe und Sachlichkeit wirken auch bei einer gereizten Stimmung überzeugend."
      - q: "Die zugesagte Erhöhung erscheint nicht auf Ihrer nächsten Gehaltsabrechnung. — The promised raise doesn't appear on your next pay slip."
        options:
          - { key: a, text: "Die Chefin höflich darauf ansprechen und um Klärung bitten." }
          - { key: b, text: "Einfach abwarten und hoffen, dass es sich von selbst löst." }
          - { key: c, text: "Sofort öffentlich darüber schimpfen." }
        answer: a
        why: "Eine höfliche Nachfrage klärt schnell, ob es sich um ein Versehen handelt."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Meine Bitte um eine Gehaltserhöhung wurde komplett {1}. (nicht akzeptiert, Partizip)
      2. Mein Chef hat mich immer wieder {2}. (nach hinten geschoben, Partizip)
      3. Das Angebot lag deutlich unter dem, was ich {3} hatte. (angenommen, Partizip)
      4. Mein Kollege wird für die gleiche Arbeit schon länger besser {4}. (entlohnt, Partizip)
      5. Mein Chef hat im Gespräch sichtlich genervt {5}. (sich verhalten, Partizip)
      6. Die zugesagte Erhöhung ist auf der Abrechnung nicht {6}. (nicht sichtbar geworden, Partizip)
    answers:
      "1": abgelehnt
      "2": vertröstet
      "3": erwartet
      "4": bezahlt
      "5": reagiert
      "6": aufgetaucht

