  - id: D2
    block: D
    type: free-write
    title: "Vorbereiten, ein Problem, die Lösung"
    prompt: "Schreib drei Teile: dich auf das Gespräch vorbereiten und um eine Gehaltserhöhung bitten, ein Problem, weil das erste Angebot deutlich zu niedrig ist, und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du bereitest dich auf ein Gespräch mit deiner Chefin vor und
      bittest um eine Gehaltserhöhung. Das erste Angebot ist aber
      deutlich niedriger, als du erwartet hast.

      Bei der Vorbereitung müssen vorkommen:
      1. die eigenen Leistungen dokumentieren
      2. einen Marktvergleich machen
      3. um ein Gespräch bitten

      Beim Problem müssen vorkommen:
      4. ein zu niedriges Angebot bekommen
      5. sich enttäuscht fühlen
      6. sachlich nachfragen

      In der Lösung müssen vorkommen:
      7. weitere Argumente nennen
      8. einen Kompromiss finden
      9. das Ergebnis schriftlich bestätigt bekommen
      10. sich über die Einigung freuen
    use:
      - "höfliche Frage: „Können Sie mir ein konkretes Angebot machen?“"
      - "Perfekt: „Ich habe meine Leistungen dokumentiert.“"
      - "Futur I: „Ich werde weiter sachlich argumentieren.“"
    selfCheck:
      - "Wird die Vorbereitung klar beschrieben?"
      - "Klingt die Reaktion auf das niedrige Angebot professionell?"
      - "Wird der Kompromiss als Lösung erwähnt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Vorbereiten**

      Ich dokumentiere meine Leistungen der letzten zwölf Monate und mache einen Marktvergleich.
      Ich bitte meine Chefin um ein Gespräch.
      Ich: Können Sie mir ein konkretes Angebot machen?

      **Das Problem**

      Chefin: Wir können Ihnen sieben Prozent anbieten.
      Das ist deutlich weniger, als ich erwartet hatte, und ich bin kurz enttäuscht.
      Ich frage sachlich nach: Können wir noch einmal verhandeln?

      **Die Lösung**

      Ich nenne weitere Argumente, zum Beispiel das neue Projekt.
      Wir finden einen Kompromiss bei acht Prozent.
      Ich bekomme das Ergebnis schriftlich bestätigt.
      Ich freue mich sehr über die faire Einigung.
