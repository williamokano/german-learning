      - { key: "2", text: "das Gespräch" }
      - { key: "3", text: "die Leistung" }
      - { key: "4", text: "das Argument" }
      - { key: "5", text: "der Marktvergleich" }
      - { key: "6", text: "die Verantwortung" }
      - { key: "7", text: "das Angebot" }
      - { key: "8", text: "die Verhandlung" }
    right:
      - { key: a, text: "mehr Geld für die gleiche Stelle" }
      - { key: b, text: "die persönliche Unterhaltung mit der Führungskraft" }
