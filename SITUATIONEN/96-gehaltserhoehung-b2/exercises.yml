lesson: "SIT/96-gehaltserhoehung-b2"
title: "Um eine Gehaltserhöhung bitten — B2"
topic: "Um eine Gehaltserhöhung bitten"
category: "Arbeit & Studium"
level: B2
summary: "Ein Gespräch mit der Chefin vorbereiten, die eigenen Leistungen und einen Marktvergleich als Argumente nutzen und über die Höhe verhandeln — und was tun, wenn das erste Angebot zu niedrig ausfällt."
intro: >
  Um eine Gehaltserhöhung zu bitten braucht Vorbereitung: die eigenen
  Leistungen dokumentieren, einen Marktvergleich machen und um ein
  Gespräch bitten. Dieses Set übt genau das — vorbereiten,
  argumentieren, verhandeln, und was zu tun ist, wenn das erste
  Angebot zu niedrig ausfällt oder die Chefin ablehnt. Grammatik nach
  Bedarf: Modalverben, Perfekt und Futur I. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Vorbereiten, argumentieren oder verhandeln?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: vorbereiten, label: "Vorbereiten" }
      - { key: argumentieren, label: "Argumentieren" }
      - { key: verhandeln, label: "Verhandeln" }
    tokens:
      - { text: "einen Termin für das Gespräch vereinbaren", bucket: vorbereiten }
      - { text: "die eigenen Leistungen dokumentieren", bucket: vorbereiten }
      - { text: "einen Marktvergleich recherchieren", bucket: vorbereiten }
      - { text: "die Argumente vorbereiten", bucket: vorbereiten }
      - { text: "die eigene Leistung hervorheben", bucket: argumentieren }
      - { text: "mehr Verantwortung übernommen haben", bucket: argumentieren }
      - { text: "konkrete Erfolge nennen", bucket: argumentieren }
      - { text: "einen realistischen Betrag nennen", bucket: argumentieren }
      - { text: "ein Angebot abwarten", bucket: verhandeln }
      - { text: "über die Höhe verhandeln", bucket: verhandeln }
      - { text: "einen Kompromiss finden", bucket: verhandeln }
      - { text: "das Ergebnis schriftlich festhalten", bucket: verhandeln }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
