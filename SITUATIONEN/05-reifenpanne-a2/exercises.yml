lesson: "SIT/05-reifenpanne-a2"
title: "Reifenpanne und Werkstatt — A2"
topic: "Panne unterwegs"
category: "Unterwegs"
level: A2
summary: "Eine Panne melden, den Standort beschreiben, den ADAC rufen und in der Werkstatt einen Kostenvoranschlag verstehen."
intro: >
  Das Auto steht, und du musst am Telefon erklären, wo du bist und was
  los ist. Genau diese zwei Dinge — Standort und Problem — entscheiden,
  wie schnell Hilfe kommt. Dazu die Werkstatt: Termin, Kostenvoranschlag,
  Abholung. Grammatik nach Bedarf: Präpositionen des Ortes (auf der A9,
  an der Ausfahrt, zwischen … und …), Perfekt für das, was passiert ist,
  und höfliche Bitten. Block C ist der Ernstfall: kein Empfang, die
  Reparatur wird teurer als gesagt, das Auto bleibt über Nacht. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Auto, Panne oder Werkstatt?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: teil, label: "Teil am Auto" }
      - { key: panne, label: "Was kaputtgehen kann" }
      - { key: werkstatt, label: "In der Werkstatt" }
    tokens:
      - { text: "der Reifen", bucket: teil }
      - { text: "die Batterie ist leer", bucket: panne }
      - { text: "der Kostenvoranschlag", bucket: werkstatt }
      - { text: "die Bremse", bucket: teil }
      - { text: "der Motor springt nicht an", bucket: panne }
      - { text: "der Termin", bucket: werkstatt }
      - { text: "der Scheinwerfer", bucket: teil }
      - { text: "der Reifen ist platt", bucket: panne }
      - { text: "das Ersatzteil", bucket: werkstatt }
      - { text: "der Kofferraum", bucket: teil }
      - { text: "das Warndreieck fehlt", bucket: panne }
      - { text: "die Rechnung", bucket: werkstatt }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Wo stehst du? Präpositionen des Ortes"
    instructions: "Ergänze die richtige Präposition."
    instructionsEn: "Fill in the correct preposition."
    text: |
      1. Ich stehe {1} der Autobahn A9, Richtung München.
      2. Ich bin {2} der Ausfahrt Nürnberg-Süd.
      3. Das Auto steht {3} dem Standstreifen.
      4. Ich bin {4} Kilometer 43 und 44.
      5. Wir sind {5} einer Landstraße, ohne Ortsschild.
      6. Ich stehe {6} einer Tankstelle, direkt neben der Luftpumpe.
      7. Das Auto ist {7} einem Parkplatz an der Raststätte.
      8. Ich bin {8} Weg nach Leipzig.
    answers:
      "1": auf
      "2": an
      "3": auf
      "4": zwischen
      "5": auf
      "6": an
      "7": auf
      "8": auf dem
    cues:
      "8": "Präposition + Artikel"

  - id: A3
    block: A
    type: matching
    title: "Frage und Antwort am Pannentelefon"
    instructions: "Ordne jede Frage (1–8) der passenden Antwort (a–h) zu."
    instructionsEn: "Match each question (1–8) with the fitting answer (a–h)."
    left:
      - { key: "1", text: "Wo genau befinden Sie sich?" }
      - { key: "2", text: "Was ist mit dem Fahrzeug?" }
      - { key: "3", text: "Sind Sie in Sicherheit?" }
      - { key: "4", text: "Haben Sie ein Ersatzrad dabei?" }
      - { key: "5", text: "Wie lautet Ihr Kennzeichen?" }
      - { key: "6", text: "Sind Sie ADAC-Mitglied?" }
      - { key: "7", text: "Wie viele Personen sind im Auto?" }
      - { key: "8", text: "Wie lange dauert es ungefähr?" }
    right:
      - { key: a, text: "Ja, wir stehen hinter der Leitplanke." }
      - { key: b, text: "Auf der A9 Richtung München, kurz vor der Ausfahrt Nürnberg-Süd." }
      - { key: c, text: "M-AB 1234." }
      - { key: d, text: "Der vordere linke Reifen ist platt." }
      - { key: e, text: "Nein, nur ein Pannenset." }
      - { key: f, text: "Etwa 45 Minuten, der Wagen ist schon unterwegs." }
      - { key: g, text: "Ja, seit drei Jahren." }
      - { key: h, text: "Zwei Erwachsene und ein Kind." }
    answers:
      "1": b
      "2": d
      "3": a
      "4": e
      "5": c
      "6": g
      "7": h
      "8": f

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Was ist passiert? Perfekt"
    instructions: "Ergänze das Perfekt (haben oder sein + Partizip II)."
    instructionsEn: "Fill in the perfect tense (haben or sein + past participle)."
    text: |
      1. Der Reifen {1} plötzlich {2}. (platzen — sein)
      2. Ich {3} sofort rechts {4}. (anhalten — haben)
      3. Das Warndreieck {5} ich hinter dem Auto {6}. (aufstellen — haben)
      4. Der Motor {7} einfach {8}. (ausgehen — sein)
      5. Wir {9} zwei Stunden {10}. (warten — haben)
    answers:
      "1": ist
      "2": geplatzt
      "3": habe
      "4": angehalten
      "5": habe
      "6": aufgestellt
      "7": ist
      "8": ausgegangen
      "9": haben
      "10": gewartet

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Anruf beim Pannendienst"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — ADAC Pannenhilfe, guten Tag.
      — Guten Tag, ich habe eine {1}.
      — Wo genau {2} Sie sich?
      — Auf der A9 Richtung München, {3} vor der Ausfahrt Nürnberg-Süd.
      — Was ist mit dem {4}?
      — Der vordere linke Reifen ist {5}.
      — Sind Sie in {6}?
      — Ja, wir stehen hinter der {7}.
      — Gut. Wie lautet Ihr {8}?
      — M-AB 1234.
      — Danke. Ein Wagen ist in etwa 45 Minuten bei Ihnen. Bitte {9} Sie
      im Auto und schalten Sie die Warnblinkanlage {10}.
    bank: [PANNE, BEFINDEN, KURZ, FAHRZEUG, PLATT, SICHERHEIT, LEITPLANKE, KENNZEICHEN, BLEIBEN, EIN, WOHER, MOTOR, AUS, FAHREN]
    answers:
      "1": PANNE
      "2": BEFINDEN
      "3": KURZ
      "4": FAHRZEUG
      "5": PLATT
      "6": SICHERHEIT
      "7": LEITPLANKE
      "8": KENNZEICHEN
      "9": BLEIBEN
      "10": EIN

  - id: B2
    block: B
    type: single-choice
    title: "Was machst oder sagst du?"
    instructions: "Wähle die richtige Reaktion."
    instructionsEn: "Choose the right reaction."
    items:
      - q: "Der Reifen platzt auf der Autobahn. Was zuerst? — Your tyre bursts on the motorway. What first?"
        options:
          - { key: a, text: "Sofort stark bremsen." }
          - { key: b, text: "Warnblinkanlage an, langsam auf den Standstreifen, Warnweste anziehen." }
          - { key: c, text: "Den ADAC anrufen, während du weiterfährst." }
        answer: b
        why: 'Erst sicher anhalten und sichtbar werden — telefonieren kommt danach.'
      - q: "Du stehst auf dem Standstreifen. Wo wartest du? — You're on the hard shoulder. Where do you wait?"
        options:
          - { key: a, text: "Hinter der Leitplanke." }
          - { key: b, text: "Im Auto, angeschnallt." }
          - { key: c, text: "Neben dem Auto." }
        answer: a
        why: 'Auf der Autobahn ist der Platz hinter der Leitplanke der sicherste — nicht im Auto und nicht daneben.'
      - q: "Der Mitarbeiter fragt nach dem Standort. — The operator asks for your location."
        options:
          - { key: a, text: "Irgendwo auf der Autobahn." }
          - { key: b, text: "Ich weiß nicht genau." }
          - { key: c, text: "A9 Richtung München, zwischen Kilometer 43 und 44." }
        answer: c
        why: 'Autobahn, Fahrtrichtung und Kilometer — mit diesen drei Angaben wird man gefunden.'
      - q: "Du bist kein ADAC-Mitglied. — You're not an ADAC member."
        options:
          - { key: a, text: "Dann kann ich nicht anrufen." }
          - { key: b, text: "Ich bin kein Mitglied. Was kostet der Einsatz?" }
          - { key: c, text: "Ich sage einfach, dass ich Mitglied bin." }
        answer: b
        why: 'Nichtmitglieder bekommen auch Hilfe — sie zahlen den Einsatz. Also direkt nach dem Preis fragen.'
      - q: "Die Werkstatt fragt, ob sie die Bremsen gleich mitmachen soll. — The garage asks whether to do the brakes as well."
        options:
          - { key: a, text: "Machen Sie einfach alles." }
          - { key: b, text: "Nein, auf keinen Fall." }
          - { key: c, text: "Könnten Sie mir vorher einen Kostenvoranschlag machen?" }
        answer: c
        why: 'Vor der Zusage immer den Kostenvoranschlag verlangen — danach ist der Preis kaum noch verhandelbar.'
      - q: "Das Auto ist fertig und du willst es abholen. — The car is ready and you want to pick it up."
        options:
          - { key: a, text: "Bis wann kann ich den Wagen heute abholen?" }
          - { key: b, text: "Ich komme irgendwann." }
          - { key: c, text: "Bringen Sie es mir." }
        answer: a
        why: 'Konkret nach der Uhrzeit fragen — Werkstätten schließen oft früh.'

  - id: B3
    block: B
    type: order
    title: "Sätze am Telefon bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "habe", "eine", "Panne", "auf", "der", "A9"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Verb an Position 2"
      - tiles: ["Der", "vordere", "linke", "Reifen", "ist", "platt"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Adjektive vor dem Nomen, Verb an Position 2"
      - tiles: ["Könnten", "Sie", "mir", "einen", "Kostenvoranschlag", "machen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Höfliche Bitte: Infinitiv am Ende"
      - tiles: ["Ich", "stehe", "zwischen", "Kilometer", "43", "und", "44"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "zwischen + Dativ"
      - tiles: ["Wie", "lange", "dauert", "die", "Reparatur", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "W-Frage: Fragewort, dann Verb"
      - tiles: ["Der", "Motor", "ist", "einfach", "ausgegangen"]
        answer: [0, 1, 2, 3, 4]
        note: "Perfekt mit sein: ist … ausgegangen"

  - id: B4
    block: B
    type: true-false
    title: "Den Kostenvoranschlag lesen"
    instructions: |
      > **Kfz-Werkstatt Berger — Kostenvoranschlag Nr. 2041**
      > Fahrzeug: VW Golf, Kennzeichen M-AB 1234
      > Datum: 14.06.2026
      >
      > Position 1: Reifen vorne links (Ersatz) — 89,00 €
      > Position 2: Montage und Auswuchten — 35,00 €
      > Position 3: Bremsbeläge vorne (empfohlen) — 145,00 €
      > Position 4: Ölwechsel (empfohlen) — 79,00 €
      >
      > Zwischensumme (Positionen 1–2): 124,00 €
      > Gesamtsumme mit Empfehlungen: 348,00 €
      > Alle Preise inkl. 19 % MwSt.
      >
      > Hinweis: Der Kostenvoranschlag ist 14 Tage gültig. Positionen 3
      > und 4 führen wir nur nach Ihrer ausdrücklichen Zustimmung aus.
      > Abholung: Mo–Fr bis 17:00 Uhr, Sa bis 12:00 Uhr.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Nur der Reifen zu wechseln kostet 124,00 €. — Replacing only the tyre costs €124.00."
        answer: true
        why: "Positionen 1 und 2 zusammen: 89,00 + 35,00 = 124,00 €."
      - q: "Die Bremsbeläge werden auf jeden Fall gewechselt. — The brake pads will definitely be replaced."
        answer: false
        why: "Positionen 3 und 4 nur „nach Ihrer ausdrücklichen Zustimmung“."
      - q: "Zu den Preisen kommt noch die Mehrwertsteuer dazu. — VAT still has to be added to the prices."
        answer: false
        why: "„inkl. 19 % MwSt.“ — sie ist schon drin."
      - q: "Am Samstagnachmittag kann man das Auto abholen. — You can pick the car up on Saturday afternoon."
        answer: false
        why: "Samstag nur bis 12:00 Uhr."
      - q: "Der Kostenvoranschlag gilt bis Ende Juni. — The estimate is valid until the end of June."
        answer: true
        why: "14 Tage ab 14.06. — also bis zum 28.06."
      - q: "Der Ölwechsel ist teurer als der neue Reifen. — The oil change costs more than the new tyre."
        answer: false
        why: "Ölwechsel 79,00 € < Reifen 89,00 €."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Der Ernstfall"
    instructions: "Was machst oder sagst du? Wähle a, b oder c."
    instructionsEn: "What do you do or say? Choose a, b, or c."
    items:
      - q: "Du hast kaum Empfang und das Gespräch bricht ab. — You have almost no signal and the call drops."
        options:
          - { key: a, text: "Sofort noch einmal anrufen und zuerst Standort und Kennzeichen nennen." }
          - { key: b, text: "Warten, bis sie zurückrufen." }
          - { key: c, text: "Zu Fuß zur nächsten Ausfahrt gehen." }
        answer: a
        why: 'Die zwei wichtigsten Angaben zuerst — falls das Gespräch wieder abbricht, reichen sie schon.'
      - q: "Die Werkstatt ruft an: Es wird 120 € teurer als im Kostenvoranschlag. — The garage calls: it will be €120 more than estimated."
        options:
          - { key: a, text: "Sagen Sie einfach ja." }
          - { key: b, text: "Woran liegt das genau? Bitte schicken Sie mir das schriftlich, bevor Sie weitermachen." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: 'Begründung verlangen und schriftlich bestätigen lassen — mündliche Zusagen sind später schwer zu belegen.'
      - q: "Das Auto muss über Nacht bleiben und du musst nach Hause. — The car has to stay overnight and you need to get home."
        options:
          - { key: a, text: "Ich warte einfach hier." }
          - { key: b, text: "Kann ich das Auto morgen abholen? Und gibt es hier einen Bus oder ein Taxi?" }
          - { key: c, text: "Ich nehme das Auto so mit." }
        answer: b
        why: 'Zwei Fragen auf einmal: neuer Abholtermin und wie du wegkommst.'
      - q: "Nach der Reparatur macht der Wagen dasselbe Geräusch wie vorher. — After the repair the car makes the same noise as before."
        options:
          - { key: a, text: "Das Geräusch ist noch da. Ich bringe den Wagen morgen wieder — die Reparatur war doch dafür." }
          - { key: b, text: "Sie haben schlecht gearbeitet." }
          - { key: c, text: "Ich fahre zu einer anderen Werkstatt." }
        answer: a
        why: 'Sachlich sagen, dass das Problem geblieben ist, und auf die bezahlte Reparatur verweisen — dafür gibt es Gewährleistung.'
      - q: "Du bist kein Mitglied und der Einsatz kostet 199 €. — You're not a member and the callout costs €199."
        options:
          - { key: a, text: "Das zahle ich nicht." }
          - { key: b, text: "Bekomme ich eine Rechnung? Meine Versicherung übernimmt vielleicht einen Teil." }
          - { key: c, text: "Zu teuer, ich rufe jemand anderen." }
        answer: b
        why: 'Rechnung verlangen — Schutzbrief oder Kfz-Versicherung erstatten den Einsatz oft.'
      - q: "Du stehst nachts allein auf einer Landstraße. — You're alone on a country road at night."
        options:
          - { key: a, text: "Im dunklen Auto sitzen bleiben." }
          - { key: b, text: "Warnweste anziehen, Warndreieck aufstellen, dann anrufen und den Ort so genau wie möglich beschreiben." }
          - { key: c, text: "Losgehen und Hilfe suchen." }
        answer: b
        why: 'Sichtbar werden, dann telefonieren. Weglaufen macht dich unauffindbar.'

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter fürs Problem"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. Ich habe hier fast keinen {1}. (Handysignal)
      2. Bitte schicken Sie mir das {2}, bevor Sie weitermachen. (nicht mündlich)
      3. Die Reparatur wird {3} als im Kostenvoranschlag. (mehr kosten)
      4. Kann ich den Wagen morgen {4}? (holen kommen)
      5. Das {5} ist immer noch da. (was man hört)
      6. Bekomme ich bitte eine {6}? Meine Versicherung übernimmt das vielleicht. (Beleg über die Kosten)
      7. Ich ziehe zuerst die {7} an. (gelbe Sicherheitskleidung)
      8. Das {8} stelle ich hinter dem Auto auf. (rotes Dreieck)
    answers:
      "1": Empfang
      "2": schriftlich
      "3": teurer
      "4": abholen
      "5": Geräusch
      "6": Rechnung
      "7": Warnweste
      "8": Warndreieck

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    notes: "11+ / 14 → du kommst mit einer Panne klar. Unter 11: Block A und C noch einmal."
    instructions: "Ergänze die Lücken."
    instructionsEn: "Fill in the gaps."
    text: |
      **Standort beschreiben (4 Punkte):**
      1. Ich stehe {1} der A9, Richtung München.
      2. Ich bin {2} der Ausfahrt Nürnberg-Süd.
      3. Ich stehe {3} Kilometer 43 und 44.
      4. Das Auto steht {4} dem Standstreifen.

      **Redemittel (5 Punkte):**
      5. Problem melden: „Ich habe eine {5}.“
      6. Reifen: „Der vordere linke Reifen ist {6}.“
      7. Vor der Reparatur: „Könnten Sie mir einen {7} machen?“
      8. Abholung: „Bis wann kann ich den Wagen heute {8}?“
      9. Kosten belegen: „Bekomme ich bitte eine {9}?“

      **Sicherheit (3 Punkte):**
      10. Zuerst anziehen: die {10}
      11. Hinter dem Auto aufstellen: das {11}
      12. Auf der Autobahn wartet man hinter der {12}.

      **Perfekt (2 Punkte):**
      13. Der Reifen {13} geplatzt. (sein oder haben?)
      14. Ich {14} sofort angehalten. (sein oder haben?)
    answers:
      "1": auf
      "2": an
      "3": zwischen
      "4": auf
      "5": Panne
      "6": platt
      "7": Kostenvoranschlag
      "8": abholen
      "9": Rechnung
      "10": Warnweste
      "11": Warndreieck
      "12": Leitplanke
      "13": ist
      "14": habe

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: Panne melden"
    prompt: "Schreib das Telefonat mit dem Pannendienst und danach die Nachricht an die Werkstatt. 12–16 Sätze."
    stimulus: |
      Deine Situation:

      Du fährst auf der A9 Richtung München. Kurz vor der Ausfahrt
      Nürnberg-Süd, zwischen Kilometer 43 und 44, platzt der vordere
      linke Reifen. Du hältst auf dem Standstreifen. Im Auto sitzen
      du und ein Kind. Kennzeichen: M-AB 1234. Du bist kein Mitglied.

      Teil 1 — das Telefonat mit dem Pannendienst.
      Teil 2 — eine kurze Nachricht an die Werkstatt am nächsten Tag:
      Du fragst nach dem Kostenvoranschlag und bis wann du das Auto
      abholen kannst.
    use:
      - "`Ich habe eine Panne auf …`"
      - "Standort mit Autobahn, Richtung und Kilometer"
      - "`Könnten Sie mir einen Kostenvoranschlag machen?`"
      - "Perfekt für das, was passiert ist"
    selfCheck:
      - "Hast du Autobahn, Fahrtrichtung UND Kilometer genannt?"
      - "Hast du gesagt, wie viele Personen im Auto sind?"
      - "Hast du gefragt, was der Einsatz kostet (du bist kein Mitglied)?"
      - "Steht bei den trennbaren Verben die Vorsilbe am Satzende?"
    model: |
      **Teil 1 — Pannendienst**

      Mitarbeiter: Pannenhilfe, guten Tag.
      Ich: Guten Tag, ich habe eine Panne auf der A9.
      Mitarbeiter: Wo genau befinden Sie sich?
      Ich: Auf der A9 Richtung München, zwischen Kilometer 43 und 44, kurz vor der Ausfahrt Nürnberg-Süd.
      Mitarbeiter: Was ist mit dem Fahrzeug?
      Ich: Der vordere linke Reifen ist geplatzt. Ich habe sofort angehalten und stehe jetzt auf dem Standstreifen.
      Mitarbeiter: Sind Sie in Sicherheit?
      Ich: Ja, wir warten hinter der Leitplanke. Wir sind zu zweit, ich und mein Sohn.
      Mitarbeiter: Wie lautet Ihr Kennzeichen?
      Ich: M-AB 1234. Eine Frage noch: Ich bin kein Mitglied. Was kostet der Einsatz?
      Mitarbeiter: 199 Euro. Sie bekommen eine Rechnung.
      Ich: In Ordnung. Wie lange dauert es ungefähr?
      Mitarbeiter: Etwa 45 Minuten.

      **Teil 2 — Nachricht an die Werkstatt**

      Guten Tag,
      mein Wagen (VW Golf, M-AB 1234) steht seit gestern bei Ihnen.
      Könnten Sie mir bitte einen Kostenvoranschlag schicken, bevor Sie
      mit der Reparatur beginnen? Und bis wann kann ich den Wagen heute
      abholen?
      Vielen Dank und viele Grüße
      A. Yilmaz
