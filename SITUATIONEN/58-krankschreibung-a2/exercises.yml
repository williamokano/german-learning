lesson: "SIT/58-krankschreibung-a2"
title: "Krankschreibung beim Arbeitgeber — A2"
topic: "Krankschreibung beim Arbeitgeber"
category: "Sport & Gesundheit"
level: A2
summary: "Sich morgens rechtzeitig krankmelden, die AU-Bescheinigung fristgerecht einreichen, die Rückkehr ankündigen — und was tun, wenn die Krankheit länger dauert."
intro: >
  Krankmelden klingt einfach — kurz anrufen oder schreiben, bevor die
  Arbeit beginnt — hat aber feste Regeln: die AU-Bescheinigung muss
  rechtzeitig eingereicht werden, und bei längerer Krankheit ändern
  sich die Fristen. Dieses Set übt den Anruf am Morgen, das Einreichen
  der Bescheinigung, die Ankündigung der Rückkehr, und was zu tun ist,
  wenn die Krankheit länger dauert als gedacht. Grammatik nach Bedarf:
  Perfekt im Bericht, Nebensätze mit dass/falls, höfliche Formulierungen
  mit Konjunktiv II. Blocks: A Wortschatz & Redemittel → B Dialoge → C
  Wenn es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

