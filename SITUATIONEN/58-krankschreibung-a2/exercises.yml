    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Morgen, hier ist Lukas. Ich muss mich leider {1}.
      — Oh, das tut mir leid. Was {2} du?
      — Ich habe seit gestern Abend hohes {3}.
      — Warst du schon beim {4}?
      — Ich habe gleich einen Termin, ich {5} dann Bescheid.
      — Gut, gute {6}!
      (später)
      — Ich war beim Arzt, ich bin bis Freitag {7}.
      — Verstanden. Kannst du mir die {8} zuschicken?
      — Klar, ich {9} sie noch heute per E-Mail.
      — Danke, und {10} dich gut.
    bank: [KRANKMELDEN, HAST, FIEBER, ARZT, MELDE, BESSERUNG, KRANKGESCHRIEBEN, BESCHEINIGUNG, SCHICKE, KURIER, ERHOLE, HUSTEN]
    answers:
      "1": KRANKMELDEN
      "2": HAST
      "3": FIEBER
      "4": ARZT
      "5": MELDE
      "6": BESSERUNG
      "7": KRANKGESCHRIEBEN
      "8": BESCHEINIGUNG
      "9": SCHICKE
      "10": ERHOLE

  - id: B2
    block: B
    type: single-choice
    title: "Höflich mit dem Arbeitgeber sprechen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du musst dich morgens krankmelden. — You need to call in sick in the morning."
        options:
          - { key: a, text: "Guten Morgen, ich muss mich leider krankmelden." }
          - { key: b, text: "Ich komme heute nicht, fertig." }
          - { key: c, text: "Ich bin einfach mal weg." }
        answer: a
        why: "Ein kurzer, höflicher Anruf am Morgen ist die übliche und erwartete Form."
      - q: "Der Chef fragt, was dir fehlt. — The boss asks what's wrong."
        options:
          - { key: a, text: "Das geht Sie nichts an." }
          - { key: b, text: "Ich habe seit gestern Abend hohes Fieber." }
          - { key: c, text: "Keine Ahnung, irgendwas eben." }
        answer: b
        why: "Eine kurze, sachliche Angabe der Symptome reicht völlig aus."
      - q: "Du möchtest die Bescheinigung per E-Mail schicken. — You want to send the note by email."
        options:
          - { key: a, text: "Bescheinigungen interessieren mich nicht." }
          - { key: b, text: "Ich schicke einfach irgendwas." }
          - { key: c, text: "Darf ich Ihnen die Bescheinigung per E-Mail schicken?" }
        answer: c
        why: "Eine höfliche Frage klärt den bevorzugten Weg der Übermittlung."
      - q: "Du möchtest wissen, bis wann die Bescheinigung eingereicht werden muss. — You want to know by when the note must be submitted."
        options:
          - { key: a, text: "Können Sie mir sagen, bis wann ich die Bescheinigung einreichen muss?" }
          - { key: b, text: "Fristen sind mir egal." }
          - { key: c, text: "Ich reiche das ein, wann ich Lust habe." }
        answer: a
        why: "Nach der genauen Frist zu fragen verhindert Missverständnisse."
      - q: "Du möchtest deine Rückkehr ankündigen. — You want to announce your return."
        options:
          - { key: a, text: "Vielleicht komme ich, vielleicht nicht." }
          - { key: b, text: "Ich bin am Montag wieder da." }
          - { key: c, text: "Rückkehr ist noch unklar, fragen Sie später." }
        answer: b
        why: "Eine klare Ankündigung der Rückkehr hilft bei der Planung im Team."
      - q: "Der Chef wünscht dir gute Besserung. — The boss wishes you a speedy recovery."
        options:
          - { key: a, text: "Nichts sagen und auflegen." }
          - { key: b, text: "Wünsche sind mir egal." }
          - { key: c, text: "Vielen Dank, das wünsche ich mir auch." }
        answer: c
        why: "Ein kurzer, freundlicher Dank ist die übliche Reaktion auf gute Wünsche."

  - id: B3
    block: B
    type: order
    title: "Sätze beim Krankmelden bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
