  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Sich krankmelden"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mich heute leider krankmelden. (müssen)
      2. Ich {2} seit gestern Abend Fieber. (haben, Präsens)
      3. Der Arzt {3} mich für drei Tage krankgeschrieben. (haben, Perfekt)
      4. {4} ich Ihnen die Bescheinigung per E-Mail schicken? (dürfen, ich-Form)
      5. Ich {5} versuchen, meine dringenden Aufgaben noch zu erklären. (werden, Futur I)
      6. Die Kollegin {6} sich bereit erklärt, mich zu vertreten. (haben, Perfekt)
      7. Ich {7} am Montag wieder da sein. (wollen, ich-Form)
      8. {8} Sie mir sagen, bis wann ich die Bescheinigung einreichen muss? (können, Sie-Form)
    answers:
