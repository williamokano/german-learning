  - id: B4
    block: B
    type: true-false
    title: "Die Regelung im Mitarbeiterhandbuch lesen"
    instructions: |
      > **Mitarbeiterhandbuch — Krankmeldung**
      >
      > - Bitte **vor Arbeitsbeginn** telefonisch krankmelden, nicht nur
      >   per Nachricht.
      > - Die **AU-Bescheinigung** muss spätestens am **dritten
      >   Krankheitstag** vorliegen.
      > - Bei einer Krankheit von **mehr als sechs Wochen** ändert sich
      >   die Zahlung: dann zahlt die Krankenkasse **Krankengeld**.
      > - Die Rückkehr bitte **einen Tag vorher** ankündigen, damit die
      >   Vertretung übergeben werden kann.
      > - Bei **Unsicherheiten zur Diagnose** entscheidet allein der
      >   Arzt, nicht der Arbeitgeber.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man soll sich telefonisch krankmelden, nicht nur per Nachricht. — You should call in sick by phone, not just by message."
        answer: true
        why: "So steht es ausdrücklich im Handbuch."
      - q: "Die AU-Bescheinigung muss erst nach einer Woche vorliegen. — The doctor's note only needs to be submitted after a week."
        answer: false
        why: "Sie muss spätestens am dritten Krankheitstag vorliegen."
      - q: "Nach sechs Wochen zahlt weiterhin nur der Arbeitgeber. — After six weeks, only the employer keeps paying."
        answer: false
        why: "Ab dann zahlt die Krankenkasse Krankengeld."
      - q: "Die Rückkehr soll einen Tag vorher angekündigt werden. — The return should be announced one day in advance."
        answer: true
        why: "„Die Rückkehr bitte einen Tag vorher ankündigen.“"
      - q: "Der Arbeitgeber kann die Diagnose des Arztes anzweifeln. — The employer can question the doctor's diagnosis."
        answer: false
        why: "Bei Unsicherheiten entscheidet allein der Arzt, nicht der Arbeitgeber."
      - q: "Krankmeldungen sollen vor Arbeitsbeginn erfolgen. — Sick notifications should happen before work starts."
        answer: true
        why: "„Bitte vor Arbeitsbeginn telefonisch krankmelden.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn es nicht ganz nach Plan läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Deine Krankheit dauert länger als erwartet. — Your illness lasts longer than expected."
        options:
          - { key: a, text: "Rechtzeitig Bescheid geben und eine neue Bescheinigung nachreichen." }
          - { key: b, text: "Einfach nichts sagen und hoffen, dass es niemand merkt." }
          - { key: c, text: "Erst am letzten Tag Bescheid geben." }
        answer: a
        why: "Frühzeitig informieren und die neue Bescheinigung nachreichen ist der korrekte Weg."
      - q: "Du hast vergessen, die Bescheinigung rechtzeitig einzureichen. — You forgot to submit the note on time."
        options:
          - { key: a, text: "So tun, als hättest du sie schon geschickt." }
          - { key: b, text: "Dich entschuldigen und sie sofort nachreichen." }
          - { key: c, text: "Es einfach ignorieren." }
        answer: b
        why: "Ehrlichkeit und schnelles Nachreichen sind der beste Weg, das Versäumnis zu korrigieren."
      - q: "Der Chef stellt unangenehme Fragen zu deiner Abwesenheit. — Your boss asks uncomfortable questions about your absence."
        options:
          - { key: a, text: "Wütend werden." }
          - { key: b, text: "Detaillierte medizinische Informationen preisgeben, obwohl nicht nötig." }
          - { key: c, text: "Ruhig auf die ärztliche Bescheinigung verweisen." }
        answer: c
        why: "Die Bescheinigung ist der offizielle Nachweis — mehr Details muss man nicht preisgeben."
      - q: "Du fühlst dich schon früher besser, die Bescheinigung gilt aber noch länger. — You feel better early, but the note still covers more days."
        options:
          - { key: a, text: "Beim Arzt nachfragen, ob eine frühere Rückkehr möglich ist." }
          - { key: b, text: "Einfach ohne Rücksprache früher zur Arbeit gehen." }
          - { key: c, text: "Zu Hause bleiben, obwohl es nicht mehr nötig wäre." }
        answer: a
        why: "Der Arzt kann die Bescheinigung anpassen, wenn eine frühere Rückkehr wirklich möglich ist."
      - q: "Eine dringende Aufgabe muss während deiner Krankheit übergeben werden. — An urgent task must be handed off during your illness."
        options:
          - { key: a, text: "Kurz per Nachricht die wichtigsten Punkte an die Vertretung erklären." }
          - { key: b, text: "Die Aufgabe einfach liegen lassen." }
          - { key: c, text: "Trotz Krankheit ins Büro gehen." }
        answer: a
        why: "Eine kurze schriftliche Übergabe ist möglich, ohne die eigene Genesung zu gefährden."
      - q: "Ein Kollege zweifelt öffentlich an, dass du wirklich krank bist. — A colleague publicly doubts that you're really sick."
        options:
          - { key: a, text: "Ruhig bleiben und auf die ärztliche Bescheinigung verweisen." }
          - { key: b, text: "Sich lautstark rechtfertigen." }
          - { key: c, text: "Den Kollegen ignorieren und wütend werden." }
        answer: a
        why: "Die Bescheinigung ist der offizielle Beleg — ruhig darauf zu verweisen beendet die Diskussion meist schnell."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Meine Krankheit hat {1} gedauert, als ich zuerst dachte. (mehr Zeit gebraucht)
      2. Ich habe vergessen, die Bescheinigung rechtzeitig {2}. (bei der Stelle abgeben)
      3. Mein Chef hat unangenehme {3} zu meiner Abwesenheit gestellt. (Nachfragen)
      4. Ich habe mich schon früher wieder {4} gefühlt. (nicht mehr krank)
      5. Eine dringende Aufgabe musste {5} werden. (an jemand anderen weitergegeben)
      6. Ein Kollege hat {6}, dass ich wirklich krank bin. (nicht geglaubt)
    answers:
      "1": länger
      "2": einzureichen
      "3": Fragen
      "4": gesund
      "5": übergeben
      "6": angezweifelt

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Ich {1} mich heute krankmelden. (must)
      2. Ich {2} seit gestern Fieber. (have — Präsens)
      3. Der Arzt {3} mich krankgeschrieben. (has — Perfekt)
      4. {4} ich Ihnen die Bescheinigung schicken? (may — dürfen)
      5. Ich muss mich heute {5}. (report sick — Infinitiv)
      6. Der Arzt stellt mir eine {6} aus. (doctor's note)
      7. Ich muss die Bescheinigung innerhalb der {7} einreichen. (deadline)
      8. Meine {8} übernimmt meine Aufgaben. (stand-in / cover)
      9. Nach der {9} melde ich mich wieder. (recovery)
      10. Meine Krankheit hat {10} gedauert als gedacht. (longer)
      11. Ich habe vergessen, die Bescheinigung {11} einzureichen. (on time)
      12. Ich habe mich schon früher {12} gefühlt. (healthy again)
      13. Eine Aufgabe musste {13} werden. (handed over — Partizip)
      14. Ein Kollege hat es {14}. (doubted — Partizip)
    answers:
      "1": muss
      "2": habe
      "3": hat
      "4": Darf
      "5": krankmelden
      "6": Bescheinigung
      "7": Frist
      "8": Vertretung
      "9": Genesung
      "10": länger
      "11": rechtzeitig
      "12": gesund
      "13": übergeben
      "14": angezweifelt

  - id: D2
    block: D
    type: free-write
    title: "Krankmelden, Bescheinigung, Rückkehr"
    prompt: "Schreib drei Teile: den Anruf am Morgen, das Einreichen der Bescheinigung und die Ankündigung der Rückkehr. Zusammen 16–20 Sätze."
    stimulus: |
      Du wachst mit hohem Fieber auf und musst dich krankmelden. Du
      gehst zum Arzt und bist für drei Tage krankgeschrieben. Am Ende
      kündigst du deine Rückkehr an.

      Beim Anruf müssen vorkommen:
      1. dich krankmelden
      2. deine Symptome kurz nennen
      3. sagen, dass du zum Arzt gehst

      Beim Einreichen müssen vorkommen:
      4. die Dauer der Krankschreibung nennen
      5. anbieten, die Bescheinigung per E-Mail zu schicken
      6. nach der Frist fragen, falls unsicher

      Bei der Rückkehr müssen vorkommen:
      7. deine Rückkehr ankündigen
      8. dich für die Vertretung bedanken
      9. fragen, ob es dringende Aufgaben gibt
      10. dich auf die Arbeit freuen
    use:
      - "reflexives Verb: „Ich muss mich krankmelden.“"
      - "seit + Dativ: „Ich habe seit gestern Fieber.“"
      - "höfliche Frage: „Darf ich …?“"
    selfCheck:
      - "Ist die Krankmeldung kurz und sachlich?"
      - "Wird die Dauer der Krankschreibung klar genannt?"
      - "Klingt die Rückkehrankündigung freundlich und klar?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Der Anruf**

      Ich: Guten Morgen, ich muss mich leider krankmelden.
      Chef: Oh, das tut mir leid. Was hast du?
      Ich: Ich habe seit gestern Abend hohes Fieber. Ich gehe gleich zum Arzt.
      Chef: Gute Besserung, melde dich, wenn du mehr weißt.

      **Das Einreichen**

      (Später)
      Ich: Ich war beim Arzt, ich bin bis Freitag krankgeschrieben.
      Chef: Verstanden. Kannst du mir die Bescheinigung zuschicken?
      Ich: Klar, ich schicke sie noch heute per E-Mail. Muss ich noch etwas beachten?
      Chef: Nein, das reicht, erhol dich gut.

      **Die Rückkehr**

      (Am Sonntag)
      Ich: Ich bin am Montag wieder da. Vielen Dank für die Vertretung in der Zwischenzeit.
      Kollegin: Kein Problem, gut, dass es dir besser geht.
      Ich: Gibt es dringende Aufgaben, um die ich mich als Erstes kümmern sollte?
      Kollegin: Ein paar E-Mails, aber nichts Dringendes.
      Ich: Perfekt, ich freue mich schon, wieder da zu sein.
