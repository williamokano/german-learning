  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Termin vereinbaren"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} gern einen Termin für eine Impfung. (möchten, ich-Form)
      2. {2} ich meinen Impfpass mitbringen? (müssen, ich-Form)
      3. Die Praxis {3} den Termin telefonisch. (bestätigen, Präsens)
      4. Ich {4} letztes Jahr schon einmal geimpft. (werden, Passiv Perfekt — wurde)
      5. {5} ich mit Nebenwirkungen rechnen? (müssen, ich-Form)
      6. Der Arzt {6} mir alle Fragen beantwortet. (haben, Perfekt)
      7. Wir {7} den Termin leider verschieben. (Modalverb, wir-Form)
      8. {8} Sie mir sagen, wann die nächste Vorsorge fällig ist? (können, Sie-Form)
    answers:
      "1": möchte
      "2": Muss
      "3": bestätigt
      "4": wurde
      "5": Muss
      "6": hat
      "7": müssen
      "8": Können

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Alle meine Impfungen stehen in meinem {1}. (das Heft mit den Impfungen)
      2. Vor der Impfung fülle ich den {2} aus. (das Formular mit Fragen vorher)
      3. Manche Impfungen brauchen nach einigen Jahren eine {3}. (eine erneute Impfung)
      4. Häufige {4} sind ein müder Arm oder leichtes Fieber. (unerwünschte Reaktionen)
      5. Die {5} findet auch statt, wenn man keine Beschwerden hat. (die regelmäßige Untersuchung)
      6. Die {6} hilft, eine Krankheit möglichst früh zu entdecken. (das frühe Erkennen einer Krankheit)
    answers:
      "1": Impfpass
      "2": Aufklärungsbogen
      "3": Auffrischung
      "4": Nebenwirkungen
      "5": Vorsorgeuntersuchung
      "6": Früherkennung

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Telefon und in der Praxis"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Praxis Dr. Berger, guten Tag.
      — Guten Tag, ich hätte gern einen {1} für eine Grippeimpfung.
      — Gerne, passt Ihnen {2} um 10 Uhr?
      — Ja, das passt gut. Muss ich meinen {3} mitbringen?
      — Ja, bitte unbedingt.
      (in der Praxis)
      — Bitte füllen Sie noch diesen {4} aus.
      — Natürlich. Muss ich mit {5} rechnen?
      — Manchmal ein müder Arm, das ist ganz {6}.
      — Gut zu wissen. Und wann ist meine nächste {7} fällig?
      — Laut Ihrem Vorsorgeheft {8} nächstes Jahr eine Untersuchung an.
      — Alles klar, dann {9} ich den gleich mit.
      — Perfekt, dann {10} wir Ihnen einen Termin für beides.
    bank: [TERMIN, MORGEN, IMPFPASS, AUFKLÄRUNGSBOGEN, NEBENWIRKUNGEN, NORMAL, VORSORGE, STEHT, BUCHE, GEBEN, ÜBERMORGEN, RECHNUNG, BESTÄTIGEN, PLAN]
    answers:
      "1": TERMIN
      "2": MORGEN
      "3": IMPFPASS
      "4": AUFKLÄRUNGSBOGEN
      "5": NEBENWIRKUNGEN
      "6": NORMAL
      "7": VORSORGE
      "8": STEHT
      "9": BUCHE
      "10": GEBEN

  - id: B2
    block: B
    type: single-choice
    title: "Höflich am Telefon und in der Praxis"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest telefonisch einen Impftermin vereinbaren. — You want to book a vaccination appointment by phone."
        options:
          - { key: a, text: "Ich hätte gern einen Termin für eine Grippeimpfung." }
          - { key: b, text: "Ich brauche jetzt sofort einen Termin." }
          - { key: c, text: "Impfen Sie mich einfach irgendwann." }
        answer: a
        why: "Eine höfliche, konkrete Bitte ist der übliche Einstieg am Telefon."
      - q: "Du bist unsicher, ob du den Impfpass mitbringen musst. — You're unsure whether you need to bring your vaccination record."
        options:
          - { key: a, text: "Impfpässe interessieren mich nicht." }
          - { key: b, text: "Muss ich meinen Impfpass mitbringen?" }
          - { key: c, text: "Ich bringe einfach irgendein Dokument mit." }
        answer: b
        why: "Eine kurze Frage klärt sofort, was mitzubringen ist."
      - q: "Du möchtest wissen, ob es Nebenwirkungen geben kann. — You want to know if there could be side effects."
        options:
          - { key: a, text: "Nebenwirkungen sind mir egal." }
          - { key: b, text: "Ich frage lieber nicht." }
          - { key: c, text: "Muss ich mit Nebenwirkungen rechnen?" }
        answer: c
        why: "Nach möglichen Nebenwirkungen zu fragen ist eine normale, sinnvolle Frage vor einer Impfung."
      - q: "Du möchtest wissen, wann die nächste Vorsorgeuntersuchung fällig ist. — You want to know when your next preventive checkup is due."
        options:
          - { key: a, text: "Wann ist meine nächste Vorsorge fällig?" }
          - { key: b, text: "Vorsorge brauche ich nicht." }
          - { key: c, text: "Das interessiert mich später vielleicht." }
        answer: a
        why: "Eine direkte Frage hilft, die nächste Untersuchung rechtzeitig zu planen."
      - q: "Du hast Angst vor Spritzen und möchtest das dem Arzt sagen. — You're afraid of needles and want to tell the doctor."
        options:
          - { key: a, text: "Sagen Sie besser nichts, sonst wird es schlimmer." }
          - { key: b, text: "Ich habe etwas Angst vor Spritzen, können Sie mir kurz Bescheid geben?" }
          - { key: c, text: "Das verschweige ich lieber." }
        answer: b
        why: "Die Angst offen anzusprechen hilft dem Praxispersonal, besonders rücksichtsvoll vorzugehen."
      - q: "Der Termin, den du wolltest, ist schon vergeben. — The appointment you wanted is already taken."
        options:
          - { key: a, text: "Sofort auflegen." }
          - { key: b, text: "Beleidigt sein." }
          - { key: c, text: "Nach dem nächstmöglichen Termin fragen." }
        answer: c
        why: "Nach einem Alternativtermin zu fragen ist die einfachste, freundliche Lösung."

  - id: B3
    block: B
    type: order
    title: "Sätze am Telefon und in der Praxis bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "hätte", "gern", "einen", "Termin", "für", "eine", "Grippeimpfung"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
