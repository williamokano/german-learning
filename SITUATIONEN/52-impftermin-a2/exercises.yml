lesson: "SIT/52-impftermin-a2"
title: "Impftermin und Vorsorge — A2"
topic: "Impftermin und Vorsorge"
category: "Sport & Gesundheit"
level: A2
summary: "Einen Termin für Impfung oder Vorsorge vereinbaren, den Impfpass mitbringen, den Aufklärungsbogen verstehen und nach Nebenwirkungen fragen."
intro: >
  Ein Impftermin oder eine Vorsorgeuntersuchung ist meist unkompliziert
  — bis man den Impfpass nicht findet oder eine Frage im
  Aufklärungsbogen nicht versteht. Dieses Set übt die Terminvereinbarung
  am Telefon, das Gespräch in der Praxis, das Ausfüllen des Formulars
  und die Frage nach Nebenwirkungen. Grammatik nach Bedarf: Perfekt bei
  Rückfragen, Nebensätze mit ob/wenn, höfliche Fragen mit Konjunktiv II.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Termin, Impfung oder Vorsorge?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: termin, label: "Der Termin" }
      - { key: impfung, label: "Die Impfung" }
      - { key: vorsorge, label: "Die Vorsorge" }
    tokens:
      - { text: "einen Termin vereinbaren", bucket: termin }
      - { text: "der Impfpass", bucket: impfung }
      - { text: "die Vorsorgeuntersuchung", bucket: vorsorge }
      - { text: "die Terminbestätigung", bucket: termin }
      - { text: "die Auffrischung", bucket: impfung }
      - { text: "die Blutuntersuchung", bucket: vorsorge }
      - { text: "verschieben", bucket: termin }
      - { text: "die Nebenwirkung", bucket: impfung }
      - { text: "das Vorsorgeheft", bucket: vorsorge }
      - { text: "die Wartezeit", bucket: termin }
      - { text: "der Aufklärungsbogen", bucket: impfung }
      - { text: "die Früherkennung", bucket: vorsorge }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "der Impfpass" }
      - { key: "2", text: "die Auffrischung" }
      - { key: "3", text: "die Nebenwirkung" }
      - { key: "4", text: "der Aufklärungsbogen" }
      - { key: "5", text: "die Vorsorgeuntersuchung" }
      - { key: "6", text: "die Impfempfehlung" }
      - { key: "7", text: "sich impfen lassen" }
      - { key: "8", text: "die Früherkennung" }
    right:
