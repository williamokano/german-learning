      - tiles: ["Muss", "ich", "meinen", "Impfpass", "mitbringen", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Frage mit Modalverb an Position 1, trennbares Verb am Ende"
      - tiles: ["Bitte", "füllen", "Sie", "noch", "diesen", "Aufklärungsbogen", "aus"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Imperativ mit Sie, trennbares Verb am Ende"
      - tiles: ["Muss", "ich", "mit", "Nebenwirkungen", "rechnen", "?"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "rechnen mit + Dativ"
      - tiles: ["Laut", "Ihrem", "Vorsorgeheft", "steht", "nächstes", "Jahr", "eine", "Untersuchung", "an"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "trennbares Verb anstehen, Präfix am Ende"
      - tiles: ["Wann", "ist", "meine", "nächste", "Vorsorge", "fällig", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Frage mit Fragewort, Verb an Position 2"

  - id: B4
    block: B
    type: true-false
    title: "Den Impfplan lesen"
    instructions: |
      > **Praxis Dr. Berger — Impf- und Vorsorgehinweise**
      >
      > - **Grippeimpfung:** empfohlen jedes Jahr im **Herbst**, meist
      >   Oktober bis Dezember.
      > - **Tetanus-Auffrischung:** alle **10 Jahre**, bei tiefen Wunden
      >   auch früher.
      > - Bitte **immer den Impfpass mitbringen**, auch bei der ersten
      >   Impfung.
      > - **Nebenwirkungen** wie ein müder Arm oder leichtes Fieber sind
      >   normal und meist nach **1–2 Tagen** vorbei.
      > - **Vorsorgeuntersuchungen** für Erwachsene: alle **3 Jahre**,
      >   auch ohne Beschwerden.
      > - Termine bitte **mindestens eine Woche vorher** vereinbaren.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Grippeimpfung wird jeden Frühling empfohlen. — The flu vaccine is recommended every spring."
        answer: false
        why: "Empfohlen ist der Herbst, meist Oktober bis Dezember."
      - q: "Die Tetanus-Auffrischung ist alle zehn Jahre nötig. — The tetanus booster is needed every ten years."
        answer: true
        why: "So steht es ausdrücklich im Impfplan."
      - q: "Man muss den Impfpass nur bei der ersten Impfung mitbringen. — You only need to bring the vaccination record for the first vaccination."
        answer: false
        why: "Der Impfpass soll immer mitgebracht werden, nicht nur beim ersten Mal."
      - q: "Ein müder Arm nach der Impfung ist normal. — A sore arm after vaccination is normal."
        answer: true
        why: "„Nebenwirkungen wie ein müder Arm … sind normal.“"
      - q: "Vorsorgeuntersuchungen für Erwachsene finden jedes Jahr statt. — Checkups for adults happen every year."
        answer: false
        why: "Sie finden alle drei Jahre statt, nicht jährlich."
      - q: "Termine sollen mindestens eine Woche vorher vereinbart werden. — Appointments should be made at least a week in advance."
        answer: true
        why: "„Termine bitte mindestens eine Woche vorher vereinbaren.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas nicht wie geplant läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du findest deinen Impfpass nicht mehr. — You can't find your vaccination record anymore."
        options:
          - { key: a, text: "Die Praxis fragen, ob sie deine Impfungen im System haben oder ein neuer Pass ausgestellt werden kann." }
          - { key: b, text: "Ohne Impfpass zum Termin gehen, ohne etwas zu sagen." }
          - { key: c, text: "Den Termin einfach ausfallen lassen." }
        answer: a
        why: "Die Praxis kann meist helfen, Impfungen im System zu finden oder einen neuen Pass auszustellen."
      - q: "Der Impftermin überschneidet sich mit einem wichtigen Arbeitstermin. — The vaccination appointment clashes with an important work meeting."
        options:
          - { key: a, text: "Einfach nicht zum Impftermin gehen, ohne abzusagen." }
          - { key: b, text: "In der Praxis anrufen und nach einem anderen Termin fragen." }
          - { key: c, text: "Beide Termine gleichzeitig versuchen wahrzunehmen." }
        answer: b
        why: "Rechtzeitig umzubuchen ist fair gegenüber der Praxis und löst den Terminkonflikt."
      - q: "Du machst dir Sorgen wegen möglicher Nebenwirkungen. — You're worried about possible side effects."
        options:
          - { key: a, text: "Die Impfung heimlich ausfallen lassen." }
          - { key: b, text: "Dir stundenlang unsichere Informationen im Internet suchen." }
          - { key: c, text: "Den Arzt direkt nach den häufigsten Nebenwirkungen fragen." }
        answer: c
        why: "Die direkte Frage an den Arzt ist die verlässlichste Informationsquelle."
      - q: "Du hast eine Vorsorgeuntersuchung verpasst. — You've missed a preventive checkup."
        options:
          - { key: a, text: "In der Praxis anrufen und einen neuen Termin vereinbaren." }
          - { key: b, text: "Es einfach vergessen und nichts tun." }
          - { key: c, text: "Bis zum nächsten Jahr warten." }
        answer: a
        why: "Ein neuer Termin ist unkompliziert zu vereinbaren — je früher, desto besser."
      - q: "Du bist unsicher, ob eine bestimmte Impfung für dich sinnvoll ist. — You're unsure whether a specific vaccine makes sense for you."
        options:
          - { key: a, text: "Dich einfach impfen lassen, ohne zu fragen." }
          - { key: b, text: "Ganz auf Impfungen verzichten, ohne Beratung." }
          - { key: c, text: "Den Arzt nach der Impfempfehlung für deine Situation fragen." }
        answer: c
        why: "Der Arzt kann die Impfempfehlung individuell einschätzen."
      - q: "Nach der Impfung fühlst du dich zwei Tage lang schlapp. — After the vaccination you feel run-down for two days."
        options:
          - { key: a, text: "Dich schonen und, falls es länger dauert, in der Praxis nachfragen." }
          - { key: b, text: "Sofort in die Notaufnahme fahren." }
          - { key: c, text: "Es komplett ignorieren und normal weiterarbeiten." }
        answer: a
        why: "Ein bis zwei Tage Schlappheit sind meist normal — bei längerer Dauer lohnt sich eine Nachfrage."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich finde meinen {1} leider nicht mehr. (das Heft mit den Impfungen)
      2. Der Termin {2} sich mit einem wichtigen Arbeitstermin. (zeitlich zusammenfallen)
      3. Ich mache mir Sorgen wegen möglicher {3}. (unerwünschte Reaktionen)
      4. Ich habe eine {4} verpasst. (die regelmäßige Untersuchung)
      5. Ich bin unsicher, ob die Impfung für mich {5} ist. (ratsam, es wert getan zu werden)
      6. Nach der Impfung fühle ich mich zwei Tage lang {6}. (ohne Energie, müde)
    answers:
      "1": Impfpass
      "2": überschneidet
      "3": Nebenwirkungen
      "4": Vorsorgeuntersuchung
      "5": sinnvoll
      "6": schlapp

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /14)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Ich {1} gern einen Termin für eine Impfung. (would like)
      2. {2} ich meinen Impfpass mitbringen? (must — müssen)
      3. {3} ich mit Nebenwirkungen rechnen? (must — müssen)
      4. Alle meine Impfungen stehen in meinem {4}. (vaccination record)
      5. Vor der Impfung fülle ich den {5} aus. (consent form)
      6. Manche Impfungen brauchen eine {6}. (booster)
      7. Häufige {7} sind ein müder Arm. (side effects)
      8. Die {8} findet auch ohne Beschwerden statt. (checkup)
      9. Ich finde meinen Impfpass leider {9} mehr. (no longer)
      10. Der Termin {10} sich mit der Arbeit. (clashes)
      11. Ich mache mir Sorgen wegen der {11}. (side effects)
      12. Ich habe eine Vorsorgeuntersuchung {12}. (missed — Partizip)
      13. Ich bin unsicher, ob die Impfung {13} ist. (advisable)
      14. Nach der Impfung fühle ich mich {14}. (run-down)
    answers:
      "1": möchte
      "2": Muss
      "3": Muss
      "4": Impfpass
      "5": Aufklärungsbogen
      "6": Auffrischung
      "7": Nebenwirkungen
      "8": Vorsorgeuntersuchung
      "9": nicht
      "10": überschneidet
      "11": Nebenwirkungen
      "12": verpasst
      "13": sinnvoll
      "14": schlapp

  - id: D2
    block: D
    type: free-write
    title: "Termin, Praxis, Nachfrage"
    prompt: "Schreib drei Teile: den Anruf zur Terminvereinbarung, das Gespräch in der Praxis und eine Nachfrage danach. Zusammen 16–20 Sätze."
    stimulus: |
      Du rufst in einer Praxis an und vereinbarst einen Termin für eine
      Grippeimpfung. Du machst dir etwas Sorgen wegen Nebenwirkungen und
      hast außerdem eine Vorsorgeuntersuchung verpasst.

      Im Anruf müssen vorkommen:
      1. höflich um einen Termin für die Grippeimpfung bitten
      2. nach dem Impfpass fragen
      3. einen Termin bestätigen

      In der Praxis müssen vorkommen:
      4. den Aufklärungsbogen ausfüllen
      5. nach möglichen Nebenwirkungen fragen
      6. erwähnen, dass du eine Vorsorgeuntersuchung verpasst hast

      In der Nachfrage müssen vorkommen:
      7. einen neuen Termin für die Vorsorge vereinbaren
      8. dich nach zwei Tagen erkundigen, ob die leichte Müdigkeit normal ist
      9. eine beruhigende Antwort bekommen
      10. dich für die Auskunft bedanken
    use:
      - "höfliche Bitte: „Ich hätte gern …“"
      - "rechnen mit + Dativ: „Muss ich mit Nebenwirkungen rechnen?“"
      - "Nebensatz mit ob: „Ich bin unsicher, ob …“"
    selfCheck:
      - "Ist die Bitte um den Termin höflich formuliert?"
      - "Steht „rechnen mit“ wirklich mit dem Dativ?"
      - "Klingt die Nachfrage zur Müdigkeit ruhig, nicht ängstlich übertrieben?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Der Anruf**

      Ich: Guten Tag, ich hätte gern einen Termin für eine Grippeimpfung.
      Praxis: Gerne, passt Ihnen morgen um 10 Uhr?
      Ich: Ja, das passt gut. Muss ich meinen Impfpass mitbringen?
      Praxis: Ja, bitte unbedingt.

      **In der Praxis**

      Praxis: Bitte füllen Sie noch diesen Aufklärungsbogen aus.
      Ich: Natürlich. Muss ich mit Nebenwirkungen rechnen?
      Arzt: Manchmal ein müder Arm, das ist ganz normal.
      Ich: Gut zu wissen. Übrigens, ich glaube, ich habe meine Vorsorgeuntersuchung dieses Jahr verpasst.
      Arzt: Kein Problem, wir können gleich einen neuen Termin dafür vereinbaren.

      **Die Nachfrage**

      (Zwei Tage später, am Telefon)
      Ich: Guten Tag, ich hatte vorgestern die Grippeimpfung und fühle mich seitdem etwas schlapp. Ist das normal?
      Praxis: Ja, das kommt vor und geht meist nach ein bis zwei Tagen vorbei.
      Ich: Das beruhigt mich, vielen Dank für die Auskunft.
      Praxis: Gern geschehen, und bis bald zum Vorsorgetermin.
