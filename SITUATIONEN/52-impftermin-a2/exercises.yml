      - { key: b, text: "eine erneute Impfung, um den Schutz zu erhalten" }
      - { key: c, text: "eine unerwünschte Reaktion des Körpers auf die Impfung" }
      - { key: d, text: "das Formular mit Fragen und Informationen vor der Impfung" }
      - { key: e, text: "eine regelmäßige Untersuchung, auch ohne Beschwerden" }
