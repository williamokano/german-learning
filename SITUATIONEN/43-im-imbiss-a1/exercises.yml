      "3": ohne
      "4": mit
      "5": Bargeld
      "6": Mitnehmen

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Dönerstand"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Der Nächste, bitte!
      — Ich {1} gern einen Döner.
      — Mit {2} oder ohne?
      — Mit Fleisch, {3}.
      — Welche Soße möchten Sie: Knoblauch, Curry oder {4}?
      — Knoblauch, {5}.
      — Mit oder ohne {6}?
      — Ohne, {7}.
      — Scharf?
      — Nein, nicht {8}.
      — Zum Mitnehmen oder {9} essen?
      — Zum {10}, danke.
      — Das macht sechs Euro. Nur Bargeld, bitte.
    bank: [HÄTTE, FLEISCH, DANKE, SCHARF, BITTE, ZWIEBELN, HIER, MITNEHMEN, VEGETARISCH, KAROTTEN, TEUER, KLEIN]
    answers:
      "1": HÄTTE
      "2": FLEISCH
      "3": BITTE
      "4": SCHARF
      "5": BITTE
      "6": ZWIEBELN
      "7": DANKE
      "8": SCHARF
      "9": HIER
      "10": MITNEHMEN

  - id: B2
    block: B
    type: single-choice
    title: "Kurz und klar bestellen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du bist an der Reihe. — It's your turn."
        options:
          - { key: a, text: "Ich hätte gern einen Döner mit Fleisch, bitte." }
          - { key: b, text: "Döner!" }
          - { key: c, text: "Ich weiß noch nicht." }
        answer: a
        why: "Ein kurzer, höflicher Satz reicht völlig — an der Reihe zu sein heißt, jetzt zu bestellen, nicht erst zu überlegen."
      - q: "Die Person fragt, welche Soße. — The person asks which sauce."
        options:
          - { key: a, text: "Egal." }
          - { key: b, text: "Knoblauch, bitte." }
          - { key: c, text: "Was haben Sie denn so?" }
        answer: b
        why: "Eine klare Antwort beschleunigt die Warteschlange — bei Unsicherheit kann man kurz nach den Sorten fragen, aber am Stand selbst reicht meist ein Blick auf die Karte."
      - q: "Du möchtest keine Zwiebeln. — You don't want onions."
        options:
          - { key: a, text: "Ohne Zwiebeln, bitte." }
          - { key: b, text: "Zwiebeln nein." }
          - { key: c, text: "Keine Ahnung von Zwiebeln." }
        answer: a
        why: "„Ohne + Akkusativ“ ist die Standardformel für „ich möchte das nicht dabei haben“."
      - q: "Du isst unterwegs, nicht am Stand. — You'll eat on the way, not at the stand."
        options:
          - { key: a, text: "Zum Mitnehmen, bitte." }
          - { key: b, text: "Ich gehe jetzt." }
          - { key: c, text: "Nicht hier." }
        answer: a
        why: "„Zum Mitnehmen“ ist die feste Formel dafür — direkt und höflich."
      - q: "Du bezahlst mit Karte, siehst aber ein Schild „nur Bargeld“. — You want to pay by card but see a cash-only sign."
        options:
          - { key: a, text: "Trotzdem die Karte hinhalten." }
          - { key: b, text: "Kurz fragen, ob in der Nähe ein Geldautomat ist." }
          - { key: c, text: "Das Essen einfach dalassen und gehen." }
        answer: b
        why: "Nachfragen löst das Problem, ohne die Schlange aufzuhalten oder das Essen zu verschwenden."
      - q: "Eine andere Person in der Schlange fragt, was gut ist. — Someone else in the queue asks what's good."
        options:
          - { key: a, text: "Der Döner mit Knoblauchsauce ist echt gut." }
          - { key: b, text: "Weiß nicht, frag den Verkäufer." }
          - { key: c, text: "Nichts sagen." }
        answer: a
        why: "Ein kurzer freundlicher Tipp ist die normale Reaktion in dieser Situation."

  - id: B3
