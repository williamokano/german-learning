lesson: "SIT/43-im-imbiss-a1"
title: "Im Imbiss und am Dönerstand — A1"
topic: "Im Imbiss"
category: "Essen & Trinken"
level: A1
summary: "Am Dönerstand bestellen: mit/ohne, scharf oder nicht, zum Mitnehmen oder hier essen, und mit bar bezahlen."
intro: >
  Am Imbiss geht alles schnell: bestellen, bezahlen, essen. Genau deshalb
  lohnt sich die Vorbereitung — die Warteschlange ist kein Ort für lange
  Sätze. Dieses Set übt das Nötigste: was man bestellt, mit welchen
  Soßen und Extras, ob mit oder ohne Zwiebeln, scharf oder nicht, zum
  Mitnehmen oder hier essen. Dazu ein kurzer Smalltalk mit jemandem in
  der Schlange. Grammatik nach Bedarf: unbestimmter Artikel im
  Akkusativ (einen/eine/ein), mit/ohne + Akkusativ, einfache
  Präsensformen. Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn
  es schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

