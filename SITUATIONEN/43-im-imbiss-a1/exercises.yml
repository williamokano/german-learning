      2. Und {2} Portion Pommes dazu. (unbestimmter Artikel, feminin)
      3. Mit oder {3} Zwiebeln? (Gegenteil von „mit“)
      4. Scharf oder {4} scharf? (Verneinung)
      5. Zum Mitnehmen oder {5} essen? (an Ort und Stelle)
