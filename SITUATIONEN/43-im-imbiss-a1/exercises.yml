  - id: B4
    block: B
    type: true-false
    title: "Die Preistafel lesen"
    instructions: |
      > **Imbiss Sonne — Preisliste**
      >
      > - Döner (Fleisch) — **5,50 €**
      > - Döner (vegetarisch) — **5,00 €**
      > - Currywurst mit Pommes — **6,00 €**
      > - Portion Pommes — **3,00 €**
      > - Getränk 0,5 l — **2,00 €**
      > - **Geöffnet: Mo–Sa 11–22 Uhr, sonntags geschlossen.**
      > - **Nur Bargeld.**

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein Döner mit Fleisch kostet mehr als der vegetarische. — A meat döner costs more than the vegetarian one."
        answer: true
        why: "5,50 € gegenüber 5,00 €."
      - q: "Eine Portion Pommes kostet zwei Euro. — A portion of fries costs two euros."
        answer: false
        why: "Eine Portion Pommes kostet 3,00 €."
      - q: "Sonntags hat der Imbiss geöffnet. — The stand is open on Sundays."
        answer: false
        why: "„Sonntags geschlossen.“"
      - q: "Man kann dort mit Karte bezahlen. — You can pay by card there."
        answer: false
        why: "„Nur Bargeld.“"
      - q: "Currywurst mit Pommes ist teurer als ein Döner mit Fleisch. — Currywurst with fries costs more than a meat döner."
        answer: true
        why: "6,00 € gegenüber 5,50 €."
      - q: "Am Samstag ist der Imbiss geöffnet. — The stand is open on Saturdays."
        answer: true
        why: "„Geöffnet: Mo–Sa 11–22 Uhr.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas nicht stimmt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du hast „ohne Zwiebeln“ gesagt, aber im Döner sind Zwiebeln. — You said no onions, but there are onions in it."
        options:
          - { key: a, text: "Nichts sagen und die Zwiebeln selbst rausnehmen." }
          - { key: b, text: "Freundlich sagen: „Entschuldigung, ich hatte ohne Zwiebeln bestellt.“" }
          - { key: c, text: "Laut werden." }
        answer: b
        why: "Ein freundlicher, klarer Hinweis führt meist sofort zu einem neuen Döner."
      - q: "Du wollest „nicht scharf“, aber es ist sehr scharf. — You wanted mild, but it's very spicy."
        options:
          - { key: a, text: "Trotzdem alles aufessen." }
          - { key: b, text: "Kurz Bescheid geben und nach Wasser oder einem neuen fragen." }
          - { key: c, text: "Wortlos gehen." }
        answer: b
        why: "Kurz Bescheid geben ist der direkteste Weg zu einer Lösung."
      - q: "Du hast nur eine 50-Euro-Note dabei, das Essen kostet sechs Euro. — You only have a 50-euro note, the meal costs six euros."
        options:
          - { key: a, text: "Fragen: „Können Sie das wechseln?“" }
          - { key: b, text: "Einfach weggehen." }
          - { key: c, text: "Nichts sagen und warten." }
        answer: a
        why: "Kurz nachfragen ist normal — viele Stände können größere Scheine wechseln, manche nicht."
      - q: "Es steht „nur Bargeld“, du hast aber kein Bargeld dabei. — It says cash only, but you have none."
        options:
          - { key: a, text: "Trotzdem bestellen und hoffen." }
          - { key: b, text: "Fragen, ob in der Nähe ein Geldautomat ist, bevor du bestellst." }
          - { key: c, text: "Das Essen mitnehmen, ohne zu bezahlen." }
        answer: b
        why: "Vor der Bestellung fragen spart allen Zeit — nach dem Essen ist es zu spät."
      - q: "Die Schlange ist sehr lang und du hast wenig Zeit. — The queue is very long and you're short on time."
        options:
          - { key: a, text: "Dich vordrängeln." }
          - { key: b, text: "Warten oder kurz fragen, wie lange es ungefähr dauert." }
          - { key: c, text: "Laut rufen, dass es schneller gehen soll." }
        answer: b
        why: "Vordrängeln oder Drängeln sind unhöflich; eine kurze Nachfrage ist die normale Lösung."
      - q: "Der Verkäufer hat dir versehentlich Pommes statt Salat gegeben. — The vendor accidentally gave you fries instead of salad."
        options:
          - { key: a, text: "Freundlich darauf hinweisen: „Ich hatte eigentlich Salat bestellt.“" }
          - { key: b, text: "Die Pommes einfach essen und nichts sagen." }
          - { key: c, text: "Sich beschweren, ohne zu erklären, was falsch ist." }
        answer: a
        why: "Ein konkreter, freundlicher Hinweis lässt sich am schnellsten korrigieren."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Im Döner sind Zwiebeln, obwohl ich {1} Zwiebeln bestellt hatte. (Gegenteil von „mit“)
      2. Der Döner ist viel zu {2}, obwohl ich „nicht scharf“ gesagt habe. (viel Chili)
      3. Ich habe leider nur einen großen {3} dabei. (großer Geldschein)
      4. Gibt es hier einen {4} in der Nähe? (Geldautomat)
      5. Die {5} vor dem Stand ist heute sehr lang. (Reihe von wartenden Leuten)
      6. Ich hatte Salat bestellt, aber ich habe {6} bekommen. (kein Salat, sondern etwas Frittiertes)
    answers:
      "1": ohne
      "2": scharf
      "3": Schein
      "4": Geldautomaten
      "5": Schlange
      "6": Pommes

