  - id: D2
    block: D
    type: free-write
    title: "Bestellen, Problem, Lösung"
    prompt: "Schreib drei Teile: die Bestellung, ein kleines Problem und die Lösung. Zusammen 14–18 Sätze."
    stimulus: |
      Du gehst mit einem Freund / einer Freundin zum Dönerstand. Du
      bestellst einen Döner mit Fleisch, Knoblauchsauce, ohne Zwiebeln,
      nicht scharf, zum Mitnehmen. Als du den Döner bekommst, sind
      Zwiebeln drin.

      In der Bestellung müssen vorkommen:
      1. höflich einen Döner mit Fleisch bestellen
      2. eine Soße wählen
      3. sagen, dass du keine Zwiebeln möchtest
      4. sagen, dass es nicht scharf sein soll
      5. sagen, dass du es mitnimmst

      Im Problem müssen vorkommen:
      6. freundlich sagen, dass Zwiebeln drin sind
      7. daran erinnern, was du bestellt hattest

      In der Lösung müssen vorkommen:
      8. dich für den neuen Döner bedanken
      9. bezahlen (Bargeld)
      10. dich kurz mit deinem Freund / deiner Freundin unterhalten, während ihr wartet
    use:
      - "höfliche Bitte: „Ich hätte gern …“"
      - "mit/ohne + Akkusativ: „ohne Zwiebeln“, „mit Knoblauchsauce“"
      - "kurze Sätze, wie am Imbiss üblich"
    selfCheck:
      - "Sind die Sätze kurz genug für eine Warteschlange?"
      - "Steht „ohne“ wirklich vor dem Akkusativ, nicht vor dem Nominativ?"
      - "Klingt der Hinweis auf das Problem freundlich, nicht vorwurfsvoll?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Die Bestellung**

      Ich: Ich hätte gern einen Döner mit Fleisch, bitte.
      Verkäufer: Welche Soße — Knoblauch, Curry oder scharf?
      Ich: Knoblauch, bitte.
      Verkäufer: Mit oder ohne Zwiebeln?
      Ich: Ohne Zwiebeln, bitte.
      Verkäufer: Scharf?
      Ich: Nein, nicht scharf.
      Verkäufer: Zum Mitnehmen oder hier essen?
      Ich: Zum Mitnehmen, danke.

      **Das Problem**

      (Ich schaue in den Döner.)
      Ich: Entschuldigung, ich glaube, da sind Zwiebeln drin. Ich hatte eigentlich ohne Zwiebeln bestellt.
      Verkäufer: Oh, Entschuldigung, das war ein Fehler. Ich mache Ihnen einen neuen.

      **Die Lösung**

      Verkäufer: So, hier ist der neue Döner, ganz ohne Zwiebeln.
      Ich: Vielen Dank! Was macht das zusammen?
      Verkäufer: Sechs Euro, bitte.
      Ich: Hier bitte, nur bar geht ja bei Ihnen.
      Freund: Riecht super. Lass uns dort drüben essen, an dem Tisch.
      Ich: Gute Idee, ich habe echt Hunger.
