      13. {13} Sie mir die Verspätung bitte bestätigen? (could you)
      14. {14} der Anschluss weg ist, brauche ich einen Ersatzflug. (since — formal)
    answers:
      "1": Verspätung
      "2": Anschluss
      "3": Übergepäck
      "4": Bordkarte
      "5": umgebucht
      "6": Verpflegungsgutscheine
      "7": Anspruch
      "8": Antrag
      "9": Verlustmeldung
      "10": wird
      "11": wann
      "12": ob
      "13": Könnten
      "14": Da

  - id: D2
    block: D
    type: free-write
    title: "Der Tag am Flughafen, dokumentiert"
    prompt: "Schreib erst die Gespräche am Flughafen (10–12 Sätze), dann die Mail an die Airline (8–10 Sätze)."
    stimulus: |
      Flug LH 1234 Berlin–Frankfurt am 14.03., planmäßig 15:20, tatsächlich
      17:35. Dein Anschluss LH 1180 nach Lissabon war damit weg. Du wurdest
      auf 18:40 umgebucht und bist um 21:15 angekommen — drei Stunden
      fünfzig nach der planmäßigen Ankunft. Der Koffer kam nicht mit; du
      hast noch am Flughafen eine Verlustmeldung aufgegeben, PIR-Nummer
      LIS12345.

      In den Gesprächen müssen vorkommen:
      1. die Verspätung ansprechen und nach dem Anschluss fragen
      2. dich umbuchen lassen
      3. nach Betreuungsleistungen fragen
      4. um eine schriftliche Bestätigung bitten
      5. den fehlenden Koffer melden
      6. sagen, was du dringend brauchst

      In der Mail müssen vorkommen:
      7. Flugnummer, Datum und die beiden Zeiten nennen
      8. den Anspruch auf Ausgleichszahlung geltend machen
      9. die PIR-Nummer und den Gepäckstand nennen
      10. eine konkrete Frist setzen
    use:
      - "Sie-Form durchgehend"
      - "indirekte Fragen: `Können Sie mir sagen, wann …?`, `Wissen Sie, ob …?`"
      - "Passiv: `Ich werde auf … umgebucht.`"
      - "`Da der Anschluss weg ist, …`"
      - "`Sehr geehrte Damen und Herren` / `Mit freundlichen Grüßen`"
    selfCheck:
      - "Steht bei jeder indirekten Frage das Verb am Ende?"
      - "Nennt die Mail Flugnummer, Datum und beide Uhrzeiten?"
      - "Hast du eine konkrete Frist gesetzt — nicht nur „bald“?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Am Flughafen**

      Ich: Guten Tag, mein Flug nach Frankfurt hat über zwei Stunden Verspätung. Wissen Sie, ob ich meinen Anschluss nach Lissabon noch schaffe?
      Schalter: Das wird nichts, der geht um 18:05. Ich buche Sie auf 18:40 um.
      Ich: Komme ich damit heute noch an?
