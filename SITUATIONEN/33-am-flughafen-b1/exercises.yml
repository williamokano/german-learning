lesson: "SIT/33-am-flughafen-b1"
title: "Am Flughafen — B1"
topic: "Flugreise"
category: "Unterwegs"
level: B1
summary: "Check-in und Gepäck, Sicherheitskontrolle, Verspätung und verpasster Anschluss, verlorener Koffer und Entschädigung."
intro: >
  Solange alles läuft, braucht man am Flughafen kaum Deutsch. Interessant
  wird es genau dann, wenn etwas schiefgeht: Das Gepäck ist zwei Kilo zu
  schwer, der Flug hat Verspätung, der Anschluss ist weg, der Koffer
  kommt nicht auf dem Band. Dann zählt, ob du die richtigen Wörter
  hast — Umbuchung, Ersatzbeförderung, Verspätungsmeldung, PIR — und ob
  du weißt, worauf du Anspruch hast: Betreuungsleistungen ab bestimmten
  Wartezeiten und eine Ausgleichszahlung ab drei Stunden Ankunftsverspätung.
  Grammatik nach Bedarf: Passiv, indirekte Fragen, Konjunktiv II,
  Nebensätze mit da und sodass. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

