lesson: "SIT/23-vertraege-kuendigen-b1"
title: "Verträge kündigen: Handy, Strom, Abo — B1"
topic: "Verträge kündigen"
category: "Geld & Verträge"
level: B1
summary: "Die Frist finden, richtig kündigen, den Kündigungsbutton nutzen, Rückhalteangebote abwehren und die Bestätigung einfordern."
intro: >
  Handyvertrag, Stromanbieter, Fitness-App, Zeitschriftenabo: Kündigen
  ist in Deutschland selten schwer, aber fast immer formal. Es geht um
  drei Dinge — die Frist (wann musst du spätestens raus sein), die Form
  (Text reicht heute, aber der Nachweis zählt) und die Bestätigung
  (ohne sie hast du nichts in der Hand). Dazu kommen die Sonderfälle:
  Umzug, Preiserhöhung, ein Sonderkündigungsrecht — und der Anruf, in
  dem dir ein besseres Angebot gemacht wird, damit du bleibst.
  Grammatik nach Bedarf: Konjunktiv II, Passiv, Nebensätze mit
  da, sodass und obwohl, feste Formeln im Geschäftsbrief. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

