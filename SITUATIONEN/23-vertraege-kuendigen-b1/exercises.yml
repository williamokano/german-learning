      - { text: "die Kündigungsbestätigung", bucket: folge }
      - { text: "die Mindestlaufzeit", bucket: frist }
      - { text: "das Einschreiben", bucket: form }
      - { text: "die Schlussrechnung", bucket: folge }
      - { text: "die automatische Verlängerung", bucket: frist }
      - { text: "die Textform", bucket: form }
      - { text: "die Rückerstattung", bucket: folge }
      - { text: "der Kündigungstermin", bucket: frist }
      - { text: "die Kundennummer", bucket: form }
      - { text: "der Anbieterwechsel", bucket: folge }

  - id: A2
    block: A
    type: matching
    title: "Begriff und Erklärung"
    instructions: "Ordne jedem Begriff die Erklärung zu."
    instructionsEn: "Match each term with its explanation."
    left:
      - { key: "1", text: "die Mindestlaufzeit" }
      - { key: "2", text: "die Kündigungsfrist" }
      - { key: "3", text: "die automatische Verlängerung" }
      - { key: "4", text: "das Sonderkündigungsrecht" }
      - { key: "5", text: "die Textform" }
      - { key: "6", text: "der Kündigungsbutton" }
      - { key: "7", text: "die Kündigungsbestätigung" }
      - { key: "8", text: "die Schlussrechnung" }
    right:
      - { key: a, text: "die Zeit, in der du auf jeden Fall gebunden bist, oft 24 Monate" }
      - { key: b, text: "wie lange vorher du kündigen musst, meist ein bis drei Monate" }
      - { key: c, text: "der Vertrag läuft weiter, wenn niemand rechtzeitig kündigt" }
      - { key: d, text: "das Recht, sofort zu kündigen, etwa bei Preiserhöhung oder Umzug" }
