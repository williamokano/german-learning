      "2": WIDERRUFEN
      "3": WIDERRUFSFRIST
      "4": RÜCKSENDUNG
      "5": RÜCKSENDEETIKETT
      "6": ERSTATTUNG
      "7": MELDE
      "8": ERREICHBAR
      "9": SENDE
      "10": ZU

  - id: B2
    block: B
    type: single-choice
    title: "Melden und Widerrufen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest ein beschädigtes Paket melden. — You want to report a damaged package."
        options:
          - { key: a, text: "Pakete interessieren mich nicht." }
          - { key: b, text: "Mein Paket ist heute angekommen, aber der Inhalt ist leider beschädigt." }
          - { key: c, text: "Ich öffne Pakete sowieso nie." }
        answer: b
        why: "Eine klare, sachliche Meldung ist der übliche Einstieg beim Kundendienst."
      - q: "Du möchtest wissen, wie lange die Widerrufsfrist ist. — You want to know how long the withdrawal period is."
        options:
          - { key: a, text: "Fristen sind mir egal." }
          - { key: b, text: "Ich warte einfach ab, ohne zu fragen." }
          - { key: c, text: "Wie lange beträgt die Widerrufsfrist genau?" }
        answer: c
        why: "Eine direkte Frage klärt sofort den genauen Zeitrahmen."
      - q: "Du möchtest ein Rücksendeetikett anfordern. — You want to request a return label."
        options:
          - { key: a, text: "Können Sie mir ein kostenloses Rücksendeetikett schicken?" }
          - { key: b, text: "Etiketten drucke ich sowieso selbst." }
          - { key: c, text: "Ich schicke das Paket einfach ohne Etikett zurück." }
        answer: a
        why: "Eine höfliche, konkrete Bitte ist der übliche Weg zu einem kostenlosen Etikett."
      - q: "Du möchtest wissen, wann die Erstattung erfolgt. — You want to know when the refund will be issued."
        options:
          - { key: a, text: "Geld interessiert mich nicht." }
          - { key: b, text: "Wann bekomme ich mein Geld zurück?" }
          - { key: c, text: "Ich warte einfach unbegrenzt auf die Erstattung." }
        answer: b
        why: "Eine direkte Frage zur Erstattung hilft bei der eigenen Planung."
      - q: "Du entscheidest dich, das Produkt einfach zu widerrufen statt zu reklamieren. — You decide to simply withdraw instead of filing a complaint."
        options:
          - { key: a, text: "Widerrufen ist mir zu kompliziert." }
          - { key: b, text: "Ich behalte das Produkt einfach trotzdem." }
          - { key: c, text: "Ich möchte einfach von meinem Widerrufsrecht Gebrauch machen." }
        answer: c
        why: "Eine klare Erklärung des Widerrufs ist der einfachste Weg ohne Diskussion über den Mangel."
      - q: "Du möchtest wissen, ob der Kundendienst gut erreichbar ist. — You want to know whether customer service is easy to reach."
        options:
          - { key: a, text: "Sind Sie auch am Wochenende erreichbar?" }
          - { key: b, text: "Erreichbarkeit interessiert mich nicht." }
          - { key: c, text: "Ich rufe einfach an, wann ich will." }
        answer: a
        why: "Eine konkrete Frage zur Erreichbarkeit hilft bei zukünftigen Anliegen."

