lesson: "SIT/72-widerruf-b1"
title: "Online bestellt, falsch geliefert: Widerruf — B1"
topic: "Online bestellt, falsch geliefert: Widerruf"
category: "Einkaufen"
level: B1
summary: "Ein beschädigtes Paket melden, den Widerruf erklären, das Rücksendeetikett anfordern — und was tun, wenn die Erstattung sich verzögert oder der Händler nicht reagiert."
intro: >
  Kommt eine Online-Bestellung beschädigt an, hilft meist der einfachste
  Weg: innerhalb der Widerrufsfrist widerrufen, ein kostenloses
  Rücksendeetikett anfordern und auf die Erstattung warten. Dieses Set
  übt genau das — den Schaden melden, die Widerrufsfrist erklären, die
  Rücksendung organisieren, und was zu tun ist, wenn der Händler nicht
  reagiert oder die Erstattung sich verzögert. Grammatik nach Bedarf:
  Perfekt und Passiv im Bericht, Nebensätze mit falls. Blocks:
  A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

