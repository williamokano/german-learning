    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Innerhalb von 14 Tagen kann man vom {1} Gebrauch machen. (das Recht, einen Kauf ohne Grund rückgängig zu machen)
      2. Die {2} beträgt bei den meisten Online-Käufen 14 Tage. (der Zeitraum für den Widerruf)
      3. Für die {3} brauchen wir ein passendes Paket. (das Zurückschicken der Ware)
      4. Zum Glück liegt ein {4} bereits im Paket. (das vorgedruckte Label für die kostenlose Rücksendung)
      5. Nach der Rücksendung warten wir auf die {5}. (die Rückzahlung des Kaufpreises)
      6. Weil das Produkt kaputt ankam, {6} wir es sofort. (sich wegen eines Mangels beschweren, wir-Form)
    answers:
      "1": Widerruf
      "2": Widerrufsfrist
      "3": Rücksendung
      "4": Rücksendeetikett
      "5": Erstattung
      "6": reklamieren

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

