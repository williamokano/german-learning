        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "höfliche Aussage, Infinitiv am Ende"
      - tiles: ["Wir", "haben", "schon", "den", "Widerruf", "erklärt"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Widerrufs-Infos lesen"
    instructions: |
      > **Info — Online-Bestellungen widerrufen**
      >
      > - **Widerrufsfrist:** in der Regel **14 Tage** ab Erhalt der
      >   Ware.
      > - **Begründung:** ein Widerruf ist **ohne Angabe von
      >   Gründen** möglich.
      > - **Rücksendekosten:** oft trägt sie der **Händler**,
      >   manchmal aber auch der Kunde.
      > - **Erstattung:** erfolgt spätestens **14 Tage** nach
      >   Eingang der Rücksendung.
      > - **Beschädigte Ware:** sollte **sofort fotografiert** und
      >   gemeldet werden.
      > - **Ausnahmen:** manche Artikel wie **personalisierte
      >   Produkte** sind vom Widerruf ausgeschlossen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Die Widerrufsfrist beträgt in der Regel 14 Tage ab Erhalt der Ware. — The withdrawal period is usually 14 days from receipt of the goods."
        answer: true
        why: "So steht es ausdrücklich in den Widerrufs-Infos."
      - q: "Für einen Widerruf muss man einen ausführlichen Grund angeben. — For a withdrawal, you must give a detailed reason."
        answer: false
        why: "Ein Widerruf ist ohne Angabe von Gründen möglich, nicht mit ausführlicher Begründung."
      - q: "Die Rücksendekosten trägt immer ausschließlich der Kunde. — Return shipping costs are always borne exclusively by the customer."
        answer: false
        why: "Oft trägt sie der Händler, nicht immer der Kunde."
      - q: "Die Erstattung erfolgt spätestens 14 Tage nach Eingang der Rücksendung. — The refund is issued at the latest 14 days after the return arrives."
        answer: true
        why: "„Erstattung: erfolgt spätestens 14 Tage nach Eingang der Rücksendung.“"
      - q: "Beschädigte Ware sollte man sofort fotografieren und melden. — Damaged goods should be photographed and reported immediately."
        answer: true
        why: "„Beschädigte Ware: sollte sofort fotografiert und gemeldet werden.“"
      - q: "Personalisierte Produkte sind grundsätzlich genauso einfach widerrufbar wie alle anderen. — Personalized products can be withdrawn just as easily as any other item."
        answer: false
        why: "Sie sind eine Ausnahme und vom Widerruf ausgeschlossen."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Widerruf etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Der Händler reagiert nicht auf die Widerrufserklärung. — The seller doesn't respond to the withdrawal notice."
        options:
          - { key: a, text: "Einfach abwarten, ohne nachzufassen." }
          - { key: b, text: "Schriftlich nachfassen und eine Frist setzen." }
          - { key: c, text: "Sofort eine schlechte Bewertung schreiben, ohne nachzufragen." }
        answer: b
        why: "Eine schriftliche Nachfrage mit Frist erhöht den Druck sachlich."
      - q: "Das Rücksendeetikett kommt nie an. — The return label never arrives."
        options:
          - { key: a, text: "Das Paket einfach auf eigene Kosten zurückschicken, ohne nachzufragen." }
          - { key: b, text: "Den Widerruf komplett aufgeben." }
          - { key: c, text: "Höflich beim Kundendienst nach einem neuen Etikett fragen." }
        answer: c
        why: "Eine höfliche Nachfrage klärt schnell, warum das Etikett fehlt."
      - q: "Die Erstattung dauert viel länger als die üblichen 14 Tage. — The refund takes much longer than the usual 14 days."
        options:
          - { key: a, text: "Den Zahlungseingang beim Händler nachfragen." }
          - { key: b, text: "Einfach endlos weiter warten, ohne nachzufragen." }
          - { key: c, text: "Sofort eine Anzeige erstatten." }
        answer: a
        why: "Eine Nachfrage zum Zahlungsstand klärt meist schnell, woran es liegt."
      - q: "Der Händler behauptet, die zurückgesendete Ware sei beschädigt angekommen. — The seller claims the returned item arrived damaged."
        options:
          - { key: a, text: "Die Behauptung kommentarlos akzeptieren." }
          - { key: b, text: "Auf Fotos oder den Versandbeleg als Beweis verweisen." }
          - { key: c, text: "Sich laut streiten, ohne Beweise vorzulegen." }
        answer: b
        why: "Fotos und der Versandbeleg sind der beste Beweis gegen eine falsche Behauptung."
      - q: "Eine Bestellung wird als „erhalten“ markiert, obwohl das Paket nie ankam. — An order is marked as “received” although the package never arrived."
        options:
          - { key: a, text: "Die Sache einfach auf sich beruhen lassen." }
          - { key: b, text: "Sofort eine neue Bestellung ohne Nachfrage aufgeben." }
          - { key: c, text: "Beim Versanddienst und Händler gleichzeitig nachforschen." }
        answer: c
        why: "Eine gleichzeitige Nachfrage bei beiden Stellen klärt schnell, wo das Paket blieb."
      - q: "Man ist sich unsicher, ob ein bestimmtes Produkt vom Widerruf ausgeschlossen ist. — You're unsure whether a certain product is excluded from withdrawal."
        options:
          - { key: a, text: "Die Widerrufsbelehrung genau durchlesen oder direkt nachfragen." }
          - { key: b, text: "Einfach raten, ob es geht." }
          - { key: c, text: "Das Produkt ohne Nachzudenken zurückschicken und hoffen." }
        answer: a
        why: "Die Widerrufsbelehrung oder eine direkte Nachfrage klärt die Ausnahmen zuverlässig."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Der Händler hat auf die Widerrufserklärung nicht {1}. (nicht geantwortet, Partizip)
      2. Das Rücksendeetikett ist nie {2}. (dort eingetroffen, Partizip)
      3. Die Erstattung hat sich stark {3}. (später als geplant, Partizip)
      4. Der Händler hat behauptet, die Ware sei beschädigt {4}. (dort eingetroffen, Partizip)
      5. Das Paket wurde als erhalten {5}, obwohl es nie ankam. (im System eingetragen, Partizip)
      6. Wir haben die Widerrufsbelehrung genau {6}. (Wort für Wort gelesen, Partizip)
    answers:
      "1": geantwortet
      "2": angekommen
      "3": verzögert
      "4": angekommen
      "5": markiert
      "6": durchgelesen

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
