    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, mein Paket ist heute angekommen, aber der Inhalt
      ist leider {1}.
      — Das tut mir leid. Möchten Sie das Produkt reklamieren oder
      lieber komplett {2}?
      — Ich glaube, ich möchte einfach widerrufen, das ist doch
      innerhalb von 14 Tagen möglich, oder?
      — Ja genau, die {3} beträgt 14 Tage ab Erhalt der Ware.
      — Gut, wie funktioniert dann die {4}?
      — Ich schicke Ihnen sofort ein kostenloses {5} per E-Mail.
      — Perfekt, danke. Und wann bekomme ich mein Geld zurück?
      — Die {6} erfolgt normalerweise innerhalb von 14 Tagen nach
      Eingang der Ware.
      — Alles klar. Falls etwas nicht klappt, {7} ich mich noch
      einmal beim Kundendienst.
      — Kein Problem, wir sind jederzeit für Sie {8}.
      — Vielen Dank für die schnelle Hilfe!
      — Gerne, ich {9} Ihnen noch eine schriftliche Bestätigung
      {10}.
