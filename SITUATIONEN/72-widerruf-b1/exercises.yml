  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Widerruf planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} die Bestellung innerhalb von 14 Tagen widerrufen. (Modalverb, ich-Form)
      2. {2} Sie mir ein Rücksendeetikett schicken? (können, Sie-Form)
      3. Ich {3} die Ware schon zurückgeschickt. (haben, Perfekt)
      4. {4} wir die Erstattung noch abwarten? (müssen, wir-Form)
      5. Falls das Paket beschädigt {5}, reklamiere ich sofort. (ankommen, Präsens)
      6. Der Kundendienst {6} sich um die Rückerstattung kümmern. (werden, Futur I)
      7. Wir {7} schon den Widerruf erklärt. (haben, Perfekt)
      8. {8} das Geld schon zurücküberwiesen worden? (sein, Perfekt Passiv)
    answers:
      "1": kann
      "2": Können
      "3": habe
      "4": Müssen
      "5": ankommt
      "6": wird
      "7": haben
      "8": Ist

  - id: A4
