        note: "Perfekt, Partizip am Ende"

  - id: B4
    block: B
    type: true-false
    title: "Die Zoo-Infos lesen"
    instructions: |
      > **Info — Zoobesuch**
      >
      > - **Eintritt:** Kinder unter **4 Jahren** zahlen nichts.
      > - **Fütterungszeiten:** Löwen um **14 Uhr**, Pinguine um
      >   **15:30 Uhr**.
      > - **Streichelzoo:** täglich geöffnet, **Hände vorher waschen**
      >   empfohlen.
      > - **Kinderwagen-Verleih:** kostet **3 Euro**, Kaution
      >   **10 Euro**.
      > - **Verlorenes Kind:** am **Treffpunkt vor dem Haupteingang**
      >   warten, Security informieren.
      > - **Fotografieren:** in den meisten Gehegen erlaubt,
      >   **Blitzlicht verboten**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Kinder unter vier Jahren zahlen keinen Eintritt. — Children under four don't pay admission."
        answer: true
        why: "So steht es ausdrücklich in den Zoo-Infos."
      - q: "Die Fütterung der Pinguine ist bereits um 12 Uhr. — The penguins are fed as early as noon."
        answer: false
        why: "Sie ist um 15:30 Uhr, nicht um 12 Uhr."
      - q: "Vor dem Streichelzoo sollte man sich die Hände waschen. — Hands should be washed before the petting zoo."
        answer: true
        why: "„Hände vorher waschen empfohlen.“"
      - q: "Der Kinderwagen-Verleih ist komplett kostenlos. — The stroller rental is completely free."
        answer: false
        why: "Er kostet 3 Euro, plus 10 Euro Kaution."
      - q: "Ein verlorenes Kind sollte man allein durch den ganzen Zoo suchen, ohne die Security zu informieren. — A lost child should be searched for alone, without informing security."
        answer: false
        why: "Man soll am Treffpunkt warten und die Security informieren."
      - q: "Blitzlicht ist beim Fotografieren in den Gehegen verboten. — Flash photography is forbidden in the enclosures."
        answer: true
        why: "„Fotografieren: … Blitzlicht verboten.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Zoobesuch etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ein Kind verläuft sich im Gedränge. — A child gets lost in the crowd."
        options:
          - { key: a, text: "In Panik wild durch den Zoo rennen." }
          - { key: b, text: "Ruhig zum Treffpunkt gehen und dort warten." }
          - { key: c, text: "Einfach den Zoobesuch abbrechen und nach Hause fahren." }
        answer: b
        why: "Der vereinbarte Treffpunkt ist genau für diesen Fall da."
      - q: "Ein Kind wird beim Streicheln von einer Ziege leicht gebissen. — A child gets lightly bitten by a goat while petting it."
        options:
          - { key: a, text: "Die Ziege laut anschreien." }
          - { key: b, text: "Einfach weitermachen, als wäre nichts passiert." }
          - { key: c, text: "Die Wunde kurz ansehen und beim Personal nach Erster Hilfe fragen." }
        answer: c
        why: "Eine kurze Prüfung und Nachfrage beim Personal ist die sichere Reaktion."
      - q: "Es fängt plötzlich stark an zu regnen. — It suddenly starts raining heavily."
        options:
          - { key: a, text: "Sich unter einem überdachten Bereich unterstellen und abwarten." }
          - { key: b, text: "Trotzdem stundenlang im Regen weiterlaufen." }
          - { key: c, text: "Panisch zum Ausgang rennen und alle anschreien." }
        answer: a
        why: "Unterstellen und abwarten ist die entspannteste Lösung bei plötzlichem Regen."
      - q: "Ein Kind will partout nicht mehr laufen und weint. — A child refuses to walk any further and cries."
        options:
          - { key: a, text: "Das Kind einfach stehen lassen." }
          - { key: b, text: "Eine kurze Pause auf einer Bank einlegen und etwas trinken." }
          - { key: c, text: "Laut schimpfen, damit es weiterläuft." }
        answer: b
        why: "Eine kurze Pause hilft dem Kind oft mehr als Druck oder Schimpfen."
      - q: "Die Eintrittskarten sind plötzlich nicht mehr auffindbar. — The tickets have suddenly gone missing."
        options:
          - { key: a, text: "Einfach ohne zu bezahlen hineingehen." }
          - { key: b, text: "Sofort wieder nach Hause fahren." }
          - { key: c, text: "Ruhig an der Kasse nachfragen, ob eine Kopie möglich ist." }
        answer: c
        why: "Eine ruhige Nachfrage an der Kasse löst das Problem meistens schnell."
      - q: "Ein Kind möchte unbedingt zu nah ans Gehege eines Löwen. — A child wants to get too close to the lion enclosure."
        options:
          - { key: a, text: "Das Kind ruhig, aber bestimmt zurückhalten und erklären, warum das gefährlich ist." }
          - { key: b, text: "Das Kind einfach machen lassen." }
          - { key: c, text: "Laut schreien und das Kind erschrecken." }
        answer: a
        why: "Ruhig, aber bestimmt zu reagieren erklärt die Gefahr, ohne das Kind zu erschrecken."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Das Kind hat sich im Gedränge {1}. (den Weg verloren, Partizip reflexiv)
      2. Die Ziege hat das Kind leicht {2}. (mit den Zähnen verletzt, Partizip)
      3. Wir haben uns bei Regen {3}. (Schutz gesucht, Partizip reflexiv)
      4. Das Kind hat eine kurze {4} gebraucht. (Ruhepause)
      5. Die Eintrittskarten waren plötzlich {5}. (nicht mehr zu finden)
      6. Wir haben das Kind vom Gehege {6}. (weggehalten, Partizip)
    answers:
      "1": verlaufen
      "2": gebissen
      "3": untergestellt
      "4": Pause
      "5": verschwunden
      "6": zurückgehalten

