lesson: "SIT/62-im-zoo-a2"
title: "Im Zoo mit Kindern — A2"
topic: "Im Zoo mit Kindern"
category: "Freizeit & Kultur"
level: A2
summary: "Eintrittskarten kaufen, die Fütterungszeiten planen, den Streichelzoo besuchen — und was tun, wenn sich ein Kind im Gedränge verläuft."
intro: >
  Ein Zoobesuch mit Kindern braucht ein bisschen Planung: Eintrittskarten
  kaufen, die Fütterungszeiten im Blick behalten, vielleicht einen
  Kinderwagen ausleihen — und einen kühlen Kopf, falls sich ein Kind im
  Gedränge verläuft. Dieses Set übt genau das: an der Kasse fragen, im
  Streichelzoo Tiere streicheln, einen Treffpunkt vereinbaren, und was zu
  tun ist, wenn etwas schiefgeht. Grammatik nach Bedarf: Perfekt im
  Bericht, höfliche Fragen, Nebensätze mit falls. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

