        note: "Hauptsatz, Verb an Position 2"
      - tiles: ["Falls", "sich", "ein", "Kind", "verläuft", ",", "bleiben", "wir", "ruhig"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Nebensatz mit falls, Hauptsatz mit Verb an Position 2"
      - tiles: ["Dürfen", "wir", "die", "Tiere", "im", "Streichelzoo", "streicheln", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Frage mit dürfen, Infinitiv am Ende"
      - tiles: ["Die", "Kinder", "haben", "die", "Ziegen", "gestreichelt"]
