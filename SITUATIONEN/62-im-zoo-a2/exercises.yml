  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "An der Kasse und ein verlorenes Kind"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Guten Tag, zwei Erwachsene und zwei Kinder, bitte. Wie viel
      kostet der {1}?
      — Das macht zusammen 38 Euro. Hier ist der Lageplan, und die
      {2} der Löwen ist um 14 Uhr.
      — Super, danke! Können wir auch einen {3} ausleihen?
      — Ja, dort links am Schalter, das kostet 3 Euro extra.
      (im Zoo, später)
      — Mama, wo ist Tom? Ich sehe ihn nicht mehr!
      — Bleib ruhig, wir {4} uns am {5} vor dem Haupteingang.
      — Sollen wir zur Security gehen?
      — Ja, die können ihn über {6} ausrufen lassen.
      — Da ist er ja! Er hat sich nur im {7} verlaufen, weil er die
      Ziegen streicheln wollte.
      — Zum Glück! Die {8} hat ihn gleich zu uns zurückgebracht.
      — Jetzt {9} wir uns aber erst mal ein Eis, oder?
      — Gute Idee, das haben wir uns nach dem Schreck echt {10}.
    bank: [EINTRITT, FÜTTERUNGSZEIT, KINDERWAGEN, TREFFEN, TREFFPUNKT, LAUTSPRECHER, STREICHELZOO, TIERPFLEGERIN, GÖNNEN, VERDIENT, AQUARIUM, SPIELPLATZ, SICHERHEITSDIENST, FOTOAPPARAT]
    answers:
      "1": EINTRITT
      "2": FÜTTERUNGSZEIT
      "3": KINDERWAGEN
      "4": TREFFEN
      "5": TREFFPUNKT
      "6": LAUTSPRECHER
      "7": STREICHELZOO
      "8": TIERPFLEGERIN
      "9": GÖNNEN
      "10": VERDIENT

  - id: B2
    block: B
    type: single-choice
    title: "An der Kasse und bei den Tieren"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest an der Kasse den Preis für die Eintrittskarten erfragen. — You want to ask the price at the ticket counter."
        options:
          - { key: a, text: "Wie viel kostet der Eintritt für zwei Erwachsene und zwei Kinder?" }
          - { key: b, text: "Zeigen Sie mir einfach die billigste Karte." }
          - { key: c, text: "Preise sind mir egal." }
        answer: a
        why: "Eine konkrete, höfliche Frage nennt die Personenzahl und ist der übliche Einstieg an der Kasse."
      - q: "Du möchtest wissen, wann die Fütterung der Löwen ist. — You want to know when the lions are fed."
        options:
          - { key: a, text: "Fütterung interessiert mich nicht." }
          - { key: b, text: "Wann ist die Fütterungszeit der Löwen?" }
          - { key: c, text: "Löwen sind mir zu gefährlich." }
        answer: b
        why: "Eine direkte Frage nach der Uhrzeit hilft, den Besuch zu planen."
      - q: "Ein Kind ist plötzlich verschwunden. — A child has suddenly gone missing."
        options:
          - { key: a, text: "Ruhig bleiben und zuerst am vereinbarten Treffpunkt nachsehen." }
          - { key: b, text: "Sofort in Panik laut schreien." }
          - { key: c, text: "Einfach allein weitersuchen und niemandem Bescheid sagen." }
        answer: a
        why: "Ruhe zu bewahren und den vereinbarten Treffpunkt zu prüfen ist der erste sinnvolle Schritt."
      - q: "Du möchtest fragen, ob man die Tiere im Streichelzoo anfassen darf. — You want to ask whether petting the animals is allowed."
        options:
          - { key: a, text: "Anfassen ist bestimmt verboten, ich frage lieber nicht." }
          - { key: b, text: "Ich fasse die Tiere einfach an, ohne zu fragen." }
          - { key: c, text: "Dürfen wir die Tiere im Streichelzoo streicheln?" }
        answer: c
        why: "Eine kurze Nachfrage ist höflich und klärt sicher, was erlaubt ist."
      - q: "Die Tierpflegerin fragt, ob die Kinder Fragen zu den Tieren haben. — The zookeeper asks if the children have questions about the animals."
        options:
          - { key: a, text: "Ja, warum fressen die Elefanten so viel?" }
          - { key: b, text: "Nein, Tiere interessieren uns überhaupt nicht." }
          - { key: c, text: "Fragen stellen wir nie." }
        answer: a
        why: "Eine neugierige Frage nutzt die Gelegenheit, direkt von der Tierpflegerin zu lernen."
      - q: "Du möchtest einen Kinderwagen ausleihen. — You want to rent a stroller."
        options:
          - { key: a, text: "Kinderwagen brauche ich sowieso nicht." }
          - { key: b, text: "Können wir hier einen Kinderwagen ausleihen?" }
          - { key: c, text: "Ich trage das Kind einfach den ganzen Tag." }
        answer: b
        why: "Eine klare Frage an der Kasse ist der übliche Weg, einen Kinderwagen zu bekommen."

  - id: B3
    block: B
    type: order
    title: "Sätze im Zoo bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Wie", "viel", "kostet", "der", "Eintritt", "für", "zwei", "Kinder", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
