  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Zoobesuch planen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Wir {1} noch Eintrittskarten kaufen. (Modalverb, wir-Form)
      2. {2} du mir helfen, den Kinderwagen zu tragen? (können, du-Form)
