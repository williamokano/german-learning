lesson: "SIT/94-arbeitsagentur-jobcenter-b1"
title: "Arbeitsagentur und Jobcenter — B1"
topic: "Arbeitsagentur und Jobcenter"
category: "Behörden & Formelles"
level: B1
summary: "Sich nach einer Kündigung bei der Arbeitsagentur arbeitslos melden, Arbeitslosengeld beantragen und Vermittlungsvorschläge bearbeiten — und was tun, wenn ein Vorschlag nicht passt oder eine Sperrzeit droht."
intro: >
  Nach einer Kündigung führt der Weg oft zur Arbeitsagentur oder zum
  Jobcenter: sich arbeitslos melden, Arbeitslosengeld beantragen und
  Vermittlungsvorschläge bearbeiten. Dieses Set übt genau das —
  melden, beantragen, mitarbeiten, und was zu tun ist, wenn ein
  Vermittlungsvorschlag nicht passt oder eine Sperrzeit droht.
  Grammatik nach Bedarf: Modalverben, Perfekt und Futur I. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Melden, beantragen oder mitarbeiten?"
    instructions: "Sortiere die 12 Wörter."
    instructionsEn: "Sort the 12 words."
    buckets:
      - { key: melden, label: "Melden" }
      - { key: beantragen, label: "Beantragen" }
      - { key: mitarbeiten, label: "Mitarbeiten" }
    tokens:
      - { text: "sich arbeitslos melden", bucket: melden }
      - { text: "sich persönlich bei der Arbeitsagentur vorstellen", bucket: melden }
      - { text: "den Personalausweis mitbringen", bucket: melden }
      - { text: "die Kündigung nachweisen", bucket: melden }
      - { text: "Arbeitslosengeld beantragen", bucket: beantragen }
      - { text: "den Antrag ausfüllen", bucket: beantragen }
      - { text: "Kontoauszüge einreichen", bucket: beantragen }
      - { text: "den Bescheid abwarten", bucket: beantragen }
      - { text: "Vermittlungsvorschläge annehmen", bucket: mitarbeiten }
      - { text: "eine Eingliederungsvereinbarung unterschreiben", bucket: mitarbeiten }
      - { text: "sich regelmäßig bewerben", bucket: mitarbeiten }
      - { text: "Termine wahrnehmen", bucket: mitarbeiten }

  - id: A2
