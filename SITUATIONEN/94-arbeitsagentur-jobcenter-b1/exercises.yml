      - { key: d, text: "die finanzielle Unterstützung bei Arbeitslosigkeit" }
      - { key: e, text: "ein Angebot für eine mögliche Stelle" }
      - { key: f, text: "die schriftliche Absprache über die nächsten Schritte" }
      - { key: g, text: "der offizielle Wunsch, etwas zu bekommen" }
      - { key: h, text: "eine Zeit ohne Zahlung als Sanktion" }
