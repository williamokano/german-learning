lesson: "SIT/45-freibad-a2"
title: "Am See und im Freibad — A2"
topic: "Am See und im Freibad"
category: "Freizeit & Kultur"
level: A2
summary: "Eintritt kaufen, das Schließfach finden, die Badeordnung verstehen und mit anderen auf der Liegewiese ins Gespräch kommen."
intro: >
  Ein Nachmittag im Freibad oder am See klingt einfach, hat aber seine
  eigenen kleinen Regeln: wo man bezahlt, wo das Schließfach ist, wo
  Nichtschwimmer bleiben müssen, und was der Pfiff des Bademeisters
  bedeutet. Dazu der Smalltalk, der dazugehört — jemanden fragen, ob
  der Platz neben ihm frei ist, sich Sonnencreme leihen, kurz auf die
  Sachen von jemandem aufpassen. Grammatik nach Bedarf: Wechselpräpositionen
  (in, auf, an + Dativ/Akkusativ), Imperativ bei Regeln, höfliche Bitten.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

