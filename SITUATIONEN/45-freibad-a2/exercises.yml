  - id: B4
    block: B
    type: true-false
    title: "Die Badeordnung lesen"
    instructions: |
      > **Freibad Seeblick — Badeordnung**
      >
      > - Eintritt: Erwachsene **4 €**, Kinder bis 14 Jahre **2 €**.
      > - Nichtschwimmer bitte **nur im Nichtschwimmerbereich** (bis 1,20 m
      >   Tiefe).
      > - Springen vom Sprungturm **nur mit Erlaubnis** des Bademeisters.
      > - Bei **Gewitter** wird das Becken sofort geräumt, das Freibad
      >   bleibt geschlossen, bis der Bademeister es freigibt.
      > - Schließfächer: **1-Euro-Münze**, wird am Ende zurückerstattet.
      > - Glasflaschen sind auf dem gesamten Gelände **nicht erlaubt**.
      > - Öffnungszeiten: **Mai bis September, 9–20 Uhr**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Kinder bis 14 Jahre zahlen weniger Eintritt als Erwachsene. — Children up to 14 pay less admission than adults."
        answer: true
        why: "Erwachsene 4 €, Kinder 2 €."
      - q: "Man darf ohne Erlaubnis vom Sprungturm springen. — Anyone may jump off the diving tower without permission."
        answer: false
        why: "Springen ist nur mit Erlaubnis des Bademeisters erlaubt."
      - q: "Bei Gewitter bleibt das Becken trotzdem geöffnet. — During a thunderstorm the pool stays open anyway."
        answer: false
        why: "Bei Gewitter wird das Becken sofort geräumt."
      - q: "Für das Schließfach braucht man eine Ein-Euro-Münze. — A one-euro coin is needed for the locker."
        answer: true
        why: "So steht es ausdrücklich in der Badeordnung."
      - q: "Glasflaschen sind überall im Freibad erlaubt. — Glass bottles are allowed everywhere in the pool area."
        answer: false
        why: "Glasflaschen sind auf dem gesamten Gelände nicht erlaubt."
      - q: "Das Freibad hat auch im Winter geöffnet. — The outdoor pool is also open in winter."
        answer: false
        why: "Geöffnet ist nur von Mai bis September."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas nicht nach Plan läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du hast den Schlüssel für das Schließfach verloren. — You've lost the locker key."
        options:
          - { key: a, text: "Einfach nach Hause gehen." }
          - { key: b, text: "Sofort zum Personal gehen und Bescheid geben." }
          - { key: c, text: "Versuchen, das Schließfach selbst aufzubrechen." }
        answer: b
        why: "Das Personal kann helfen, das Fach zu öffnen — eigenständig aufzubrechen ist weder erlaubt noch nötig."
      - q: "Es zieht plötzlich ein Gewitter auf und der Bademeister pfeift alle aus dem Wasser. — A storm suddenly rolls in and the lifeguard whistles everyone out of the water."
        options:
          - { key: a, text: "Trotzdem noch schnell weiterschwimmen." }
          - { key: b, text: "Sofort aus dem Wasser gehen und Anweisungen folgen." }
          - { key: c, text: "Fragen, ob es wirklich nötig ist." }
        answer: b
        why: "Bei Gewitter zählt jede Sekunde — sofortiges Befolgen der Anweisung ist hier die einzig richtige Reaktion."
      - q: "Du hast einen Sonnenbrand bekommen, weil du die Sonnencreme vergessen hast. — You got sunburnt because you forgot sunscreen."
        options:
          - { key: a, text: "In den Schatten gehen und, falls nötig, um Sonnencreme oder ein Kühlgel bitten." }
          - { key: b, text: "Einfach weiter in der Sonne liegen." }
          - { key: c, text: "Nichts tun und hoffen, dass es besser wird." }
        answer: a
        why: "Aus der Sonne gehen und sich um die Haut kümmern ist die naheliegende Reaktion."
      - q: "Als ihr zurückkommt, liegt jemand anderes auf eurer Picknickdecke. — When you come back, someone else is lying on your picnic blanket."
        options:
          - { key: a, text: "Freundlich sagen, dass das eure Decke ist, und höflich bitten aufzustehen." }
          - { key: b, text: "Sich einfach danebenlegen." }
          - { key: c, text: "Laut werden." }
        answer: a
        why: "Ein freundlicher, klarer Hinweis klärt das Missverständnis meist sofort."
      - q: "An der Kasse merkst du, dass du dein Geld vergessen hast. — At the ticket counter you notice you forgot your money."
        options:
          - { key: a, text: "Kurz erklären und fragen, ob du später zahlen oder es holen kannst." }
          - { key: b, text: "Einfach reingehen, ohne zu bezahlen." }
          - { key: c, text: "Wortlos wieder umdrehen." }
        answer: a
        why: "Eine ehrliche, kurze Erklärung ist der einfachste Weg — vielleicht gibt es eine unkomplizierte Lösung."
      - q: "Ein Kind aus einer anderen Familie scheint Hilfe im Nichtschwimmerbereich zu brauchen. — A child from another family seems to need help in the non-swimmer area."
        options:
          - { key: a, text: "Sofort den Bademeister rufen." }
          - { key: b, text: "Selbst versuchen, das Kind ohne Hilfe zu retten." }
          - { key: c, text: "Nichts tun, es ist nicht dein Kind." }
        answer: a
        why: "Der Bademeister ist genau für solche Situationen ausgebildet — sofort rufen ist der richtige erste Schritt."

