  - id: B2
    block: B
    type: single-choice
    title: "Höflich im Freibad"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest fragen, ob der Platz neben jemandem frei ist. — You want to ask if the spot next to someone is free."
        options:
          - { key: a, text: "Entschuldigung, ist hier noch frei?" }
          - { key: b, text: "Ich setze mich einfach hin." }
          - { key: c, text: "Sie müssen mir Platz machen." }
        answer: a
        why: "Eine kurze, höfliche Frage ist auf einer Liegewiese völlig normal, bevor man sich niedersetzt."
      - q: "Du hast keine Sonnencreme dabei und siehst jemanden mit einer Flasche. — You forgot sunscreen and see someone with a bottle."
        options:
          - { key: a, text: "Entschuldigung, könnte ich mir vielleicht etwas Sonnencreme leihen?" }
          - { key: b, text: "Geben Sie mir die Sonnencreme." }
          - { key: c, text: "Einfach nehmen, ohne zu fragen." }
        answer: a
        why: "Eine höfliche Bitte mit Konjunktiv II ist die passende Form, um Fremde um etwas zu bitten."
      - q: "Der Bademeister pfeift in deine Richtung. — The lifeguard whistles in your direction."
        options:
          - { key: a, text: "Ignorieren und weitermachen." }
          - { key: b, text: "Sofort aufhören und schauen, was gemeint ist." }
          - { key: c, text: "Zurückrufen, dass alles in Ordnung ist." }
        answer: b
        why: "Der Pfiff des Bademeisters bedeutet immer, sofort auf ihn zu achten — Sicherheit geht vor."
      - q: "Du möchtest kurz ins Wasser und jemanden bitten, auf deine Sachen aufzupassen. — You want a quick swim and ask someone to watch your things."
        options:
          - { key: a, text: "Könnten Sie kurz auf meine Sachen aufpassen, während ich schwimmen gehe?" }
          - { key: b, text: "Passen Sie auf meine Sachen auf." }
          - { key: c, text: "Die Sachen einfach so liegen lassen." }
        answer: a
        why: "Die höfliche Bitte mit Konjunktiv II ist Standard, wenn man Fremde um einen Gefallen bittet."
      - q: "Es donnert plötzlich in der Ferne. — There's a sudden rumble of thunder in the distance."
        options:
          - { key: a, text: "Weiter im Wasser bleiben." }
          - { key: b, text: "Sofort aus dem Wasser gehen und auf Anweisungen des Bademeisters achten." }
          - { key: c, text: "Abwarten und schauen, ob es näher kommt." }
        answer: b
        why: "Bei Gewitter gilt: sofort raus aus dem Wasser — das ist keine Situation zum Abwarten."
      - q: "Jemand neben dir auf der Wiese spricht dich freundlich an. — Someone next to you on the lawn talks to you in a friendly way."
        options:
          - { key: a, text: "Kurz freundlich antworten und ein bisschen plaudern." }
          - { key: b, text: "So tun, als hättest du nichts gehört." }
          - { key: c, text: "Sofort aufstehen und weggehen." }
        answer: a
        why: "Ein kurzes freundliches Gespräch ist im Freibad ganz normal und gehört zum Alltag dort."

