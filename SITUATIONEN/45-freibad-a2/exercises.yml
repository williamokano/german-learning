  - id: D2
    block: D
    type: free-write
    title: "Ein Nachmittag im Freibad"
    prompt: "Schreib drei Teile: den Eintritt und das Schließfach, ein kleines Problem im Freibad und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du gehst mit einem Freund / einer Freundin ins Freibad. Ihr kauft
      Eintrittskarten und ein Schließfach. Später zieht ein Gewitter auf,
      während ihr im Wasser seid.

      Beim Eintritt müssen vorkommen:
      1. zwei Eintrittskarten kaufen
      2. nach einem Schließfach fragen
      3. fragen, wo der Nichtschwimmerbereich ist

      Im Freibad müssen vorkommen:
      4. jemanden fragen, ob der Platz neben ihm frei ist
      5. dich mit dieser Person kurz unterhalten
      6. den Bademeister pfeifen hören und sofort reagieren

      In der Lösung müssen vorkommen:
      7. gemeinsam schnell aus dem Wasser gehen
      8. eure Sachen aus dem Schließfach holen
      9. euch entscheiden, ob ihr wartet oder nach Hause geht
      10. euch für den nächsten Besuch verabreden
    use:
      - "Wechselpräpositionen: „ins Schließfach“, „im Nichtschwimmerbereich“"
      - "höfliche Bitte: „Könnten Sie …?“"
      - "Imperativ oder Modalverb bei Regeln: „Man muss sofort raus.“"
    selfCheck:
      - "Steht bei den Wechselpräpositionen der richtige Fall (Akkusativ bei Bewegung, Dativ bei Ort)?"
      - "Ist die Bitte um den Platz höflich formuliert?"
      - "Reagiert die Geschichte schnell genug auf das Gewitter?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Der Eintritt und das Schließfach**

      Ich: Guten Tag, zwei Eintrittskarten, bitte.
      Kasse: Für Erwachsene?
      Ich: Ja, zwei Erwachsene.
      Kasse: Das macht acht Euro. Möchten Sie auch ein Schließfach?
      Ich: Ja, gern. Wo finden wir den Nichtschwimmerbereich?
      Kasse: Gleich links, direkt neben dem großen Becken.

      **Im Freibad**

      Ich: Entschuldigung, ist hier noch frei?
      Person: Ja, klar, setzt euch ruhig hin.
      (Wir kommen kurz ins Gespräch.)
      Person: Kommt ihr öfter hierher?
      Ich: Eigentlich zum ersten Mal, aber es gefällt uns gut.
      (Plötzlich pfeift der Bademeister laut.)
      Freund: Das klingt ernst, lass uns sofort raus aus dem Wasser gehen.

      **Die Lösung**

      Ich: Gut, wir holen schnell unsere Sachen aus dem Schließfach.
      Freund: Es donnert schon — ich glaube, wir sollten heute nicht mehr rein.
      Ich: Stimmt, lass uns lieber warten, bis das Gewitter vorbei ist, und dann sehen.
      Freund: Wenn es zu lange dauert, gehen wir einfach nach Hause.
      Ich: Gute Idee. Sollen wir uns nächste Woche wieder hier treffen?
      Freund: Gerne, dann bei besserem Wetter.
