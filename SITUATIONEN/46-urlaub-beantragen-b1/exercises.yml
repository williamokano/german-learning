lesson: "SIT/46-urlaub-beantragen-b1"
title: "Urlaub beantragen — B1"
topic: "Urlaub beantragen"
category: "Arbeit & Studium"
level: B1
summary: "Einen Urlaubsantrag stellen, eine Vertretung organisieren, Brückentage nutzen und mit Kolleginnen und Kollegen die Termine absprechen."
intro: >
  Urlaub zu beantragen klingt nach reiner Formsache, ist es aber selten:
  Zwei Kolleginnen wollen dieselbe Woche, der Resturlaub läuft bald ab,
  und die Chefin sagt vielleicht erst einmal nein. Dieses Set übt den
  ganzen Ablauf — den Antrag stellen, eine Vertretung finden,
  Brückentage klug nutzen, und was zu tun ist, wenn etwas nicht klappt.
  Grammatik nach Bedarf: Perfekt und Präteritum im Bericht, Modalverben
  (müssen, dürfen, können), höfliche Bitten mit Konjunktiv II. Blocks: A
  Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht → D
  Wiederholung. Answers in solutions.md.
exercises:

