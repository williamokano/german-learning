  - id: B4
    block: B
    type: true-false
    title: "Die Urlaubsrichtlinie lesen"
    instructions: |
      > **Interne Richtlinie — Urlaub**
      >
      > - Anträge bitte **mindestens 4 Wochen** vor Urlaubsbeginn stellen.
      > - Zwischen **1. November und 10. Januar** gilt in der
      >   Kundenbetreuung eine **Urlaubssperre**.
      > - Resturlaub kann bis **31. März** des Folgejahres genommen
      >   werden, danach verfällt er.
      > - Bei Überschneidungen mit Kolleginnen und Kollegen gilt: **wer
      >   zuerst beantragt hat**, hat Vorrang — Absprachen untereinander
      >   sind aber willkommen.
      > - Eine Vertretung muss **vor Genehmigung** des Antrags benannt
      >   werden.
      > - Brückentage werden **wie normale Urlaubstage** berechnet.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Der Antrag muss mindestens vier Wochen vorher gestellt werden. — The request must be submitted at least four weeks ahead."
        answer: true
        why: "So steht es ausdrücklich in der Richtlinie."
      - q: "Im August gilt eine Urlaubssperre. — There's a leave freeze in August."
        answer: false
        why: "Die Urlaubssperre gilt zwischen 1. November und 10. Januar."
      - q: "Resturlaub kann bis Ende März des Folgejahres genommen werden. — Remaining leave can be taken until the end of March the following year."
        answer: true
        why: "„Resturlaub kann bis 31. März des Folgejahres genommen werden.“"
      - q: "Bei einer Überschneidung entscheidet immer die Chefin allein. — In case of overlap, the boss always decides alone."
        answer: false
        why: "Wer zuerst beantragt hat, hat Vorrang — Absprachen untereinander sind ebenfalls möglich."
      - q: "Die Vertretung kann auch erst nach der Genehmigung benannt werden. — Cover can also be named only after approval."
        answer: false
        why: "Die Vertretung muss vor der Genehmigung benannt werden."
      - q: "Brückentage zählen als normale Urlaubstage. — Bridge days count as regular leave days."
        answer: true
        why: "„Brückentage werden wie normale Urlaubstage berechnet.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn der Urlaub nicht wie geplant läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Dein Antrag wird wegen der Urlaubssperre abgelehnt. — Your request is rejected due to a leave freeze."
        options:
          - { key: a, text: "Nach alternativen Terminen außerhalb der Sperre fragen." }
          - { key: b, text: "Trotzdem fahren." }
          - { key: c, text: "Sofort kündigen." }
        answer: a
        why: "Eine Alternative außerhalb der Sperrzeit zu finden ist die naheliegende, konstruktive Lösung."
      - q: "Ein Kollege hat für dieselbe Woche schon einen Antrag gestellt. — A colleague already requested the same week."
        options:
          - { key: a, text: "Den eigenen Antrag trotzdem einreichen, ohne etwas zu sagen." }
          - { key: b, text: "Mit ihm sprechen, ob eine Woche verschoben werden kann, oder die Chefin um eine Lösung bitten." }
          - { key: c, text: "Sich beim Kollegen beschweren." }
        answer: b
        why: "Eine offene Absprache oder die Chefin einzubeziehen ist fairer als stillschweigend zu handeln."
      - q: "Du hast den Antrag vergessen und der Urlaub beginnt in zwei Wochen. — You forgot to submit the request and the leave starts in two weeks."
        options:
          - { key: a, text: "Einfach ohne Genehmigung fahren." }
          - { key: b, text: "So tun, als hättest du schon einen Antrag gestellt." }
          - { key: c, text: "Sofort den Antrag nachreichen und ehrlich erklären, dass du es vergessen hast." }
        answer: c
        why: "Ehrlichkeit und schnelles Nachholen sind der beste Weg, das Problem noch zu lösen."
      - q: "Dein Resturlaub verfällt in wenigen Tagen. — Your remaining leave expires in a few days."
        options:
          - { key: a, text: "Fragen, ob eine Verlängerung oder eine Auszahlung möglich ist." }
          - { key: b, text: "Nichts tun und den Urlaub verfallen lassen." }
          - { key: c, text: "Sich bei der Personalabteilung beschweren, ohne konkret zu fragen." }
        answer: a
        why: "Eine konkrete Nachfrage nach Verlängerung oder Auszahlung ist der sinnvolle erste Schritt."
      - q: "Deine Vertretung sagt kurzfristig ab. — Your cover cancels at short notice."
        options:
          - { key: a, text: "Den Urlaub einfach absagen." }
          - { key: b, text: "Schnell eine andere Vertretung suchen und die Chefin informieren." }
          - { key: c, text: "Nichts sagen und hoffen, dass es niemand merkt." }
        answer: b
        why: "Eine neue Lösung zu suchen und offen zu informieren ist professioneller als zu schweigen."
      - q: "Während deines Urlaubs ruft ein Kollege wegen einer dringenden Frage an. — During your leave, a colleague calls with an urgent question."
        options:
          - { key: a, text: "Nie wieder ans Telefon gehen." }
          - { key: b, text: "Sofort zurück ins Büro fahren." }
          - { key: c, text: "Kurz helfen, wenn es wirklich dringend ist, und danach in Ruhe weiter Urlaub machen." }
        answer: c
        why: "Kurze Hilfe bei echten Notfällen ist üblich, ohne dass der ganze Urlaub darunter leiden muss."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Mein Antrag wurde wegen der {1} abgelehnt. (die Zeit ohne Urlaub)
      2. Ein Kollege hatte für dieselbe Woche schon einen {2} gestellt. (das Formular für den Urlaub)
      3. Ich habe den Antrag {3} und muss ihn jetzt schnell nachreichen. (nicht daran gedacht)
      4. Mein {4} verfällt bald, wenn ich ihn nicht bald nehme. (die übrigen Urlaubstage)
      5. Meine {5} hat kurzfristig abgesagt. (die Person, die meine Aufgaben übernimmt)
      6. Während des Urlaubs war ich für einen echten Notfall trotzdem kurz {6}. (per Telefon zu erreichen)
    answers:
      "1": Urlaubssperre
      "2": Urlaubsantrag
      "3": vergessen
      "4": Resturlaub
      "5": Vertretung
      "6": erreichbar

