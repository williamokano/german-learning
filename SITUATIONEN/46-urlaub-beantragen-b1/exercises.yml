  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Antrag stellen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} den Antrag mindestens vier Wochen vorher stellen. (müssen)
      2. Man {2} in der Urlaubssperre keinen Urlaub nehmen. (können, Verneinung)
      3. Meine Chefin {3} den Antrag letzte Woche genehmigt. (haben, Perfekt)
      4. Ich {4} noch eine Vertretung finden, bevor ich frage. (sollen)
      5. Zwei Kollegen {5} dieselbe Woche beantragt. (haben, Perfekt)
      6. {6} ich den Resturlaub ins nächste Jahr übertragen? (dürfen, ich-Form)
      7. Der Antrag {7} letztes Jahr leider abgelehnt. (werden, Passiv Präteritum)
      8. Wir {8} die Übergabe rechtzeitig vorbereiten. (Modalverb, wir-Form)
    answers:
      "1": muss
      "2": kann
      "3": hat
      "4": sollte
      "5": haben
      "6": Darf
      "7": wurde
      "8": müssen

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe noch zehn Tage {1}. (die Urlaubstage, die noch übrig sind)
      2. Mit einem {2} bekommt man aus einem Feiertag eine ganze Woche frei. (der einzelne freie Tag dazwischen)
      3. Meine Kollegin übernimmt während meines Urlaubs meine {3}. (das, was zu meiner Arbeit gehört)
      4. Im Dezember gilt bei uns oft eine {4}, weil dann alle Kunden anrufen. (die Zeit ohne Urlaub)
      5. Lass den Antrag {5}, bevor du in Urlaub fährst. (offiziell zustimmen lassen, Infinitiv)
      6. Ohne {6} an die Kollegin weiß niemand, wo die Unterlagen liegen. (die Weitergabe der Aufgaben)
    answers:
      "1": Resturlaub
      "2": Brückentag
      "3": Aufgaben
      "4": Urlaubssperre
      "5": genehmigen
      "6": Übergabe

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Das Gespräch mit der Chefin"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hätten Sie kurz Zeit? Ich würde gern meinen {1} besprechen.
      — Klar, worum geht es?
      — Ich möchte vom 14. bis zum 25. Juli {2} nehmen.
      — Das ist eine wichtige Zeit für das Projekt. Haben Sie schon an
      eine {3} gedacht?
      — Ja, Frau Berger hat sich {4} erklärt, meine Aufgaben zu
      übernehmen.
      — Gut, das erleichtert die Sache. Ist Frau Berger auch mit den
      {5} vertraut?
      — Ich {6} sie vorher gründlich einarbeiten.
      — Dann sehe ich kein Problem. Ich {7} den Antrag.
      — Vielen Dank, das {8} mir sehr.
      — Reichen Sie das Formular bitte noch offiziell {9}.
      — Mache ich noch {10}.
    bank: [URLAUBSANTRAG, URLAUB, VERTRETUNG, BEREIT, KUNDEN, WERDE, GENEHMIGE, HILFT, EIN, HEUTE, GEHALT, ARBEITSZEIT, KÜNDIGUNG, PROBEZEIT]
    answers:
      "1": URLAUBSANTRAG
      "2": URLAUB
      "3": VERTRETUNG
      "4": BEREIT
      "5": KUNDEN
      "6": WERDE
      "7": GENEHMIGE
      "8": HILFT
      "9": EIN
      "10": HEUTE

  - id: B2
    block: B
    type: single-choice
    title: "Höflich mit Vorgesetzten sprechen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einen Termin für ein Urlaubsgespräch vereinbaren. — You want to arrange a time to discuss your leave."
        options:
          - { key: a, text: "Hätten Sie kurz Zeit, meinen Urlaubsantrag zu besprechen?" }
          - { key: b, text: "Ich brauche jetzt sofort Urlaub." }
          - { key: c, text: "Ich nehme mir einfach die Woche frei." }
        answer: a
        why: "Eine höfliche Frage nach einem Termin ist der übliche erste Schritt vor einem solchen Gespräch."
      - q: "Deine Chefin fragt, ob du eine Vertretung organisiert hast. — Your boss asks if you've arranged cover."
        options:
          - { key: a, text: "Das ist nicht mein Problem." }
          - { key: b, text: "Ja, Frau Berger hat sich bereit erklärt, meine Aufgaben zu übernehmen." }
          - { key: c, text: "Darüber habe ich noch nicht nachgedacht." }
        answer: b
        why: "Eine bereits organisierte Vertretung macht die Zustimmung viel wahrscheinlicher."
      - q: "Du möchtest einen Brückentag vorschlagen. — You want to suggest a bridge day."
        options:
          - { key: a, text: "Könnte ich am Freitag nach Christi Himmelfahrt auch freinehmen?" }
          - { key: b, text: "Freitag komme ich einfach nicht." }
          - { key: c, text: "Der Freitag zählt doch sowieso nicht richtig." }
        answer: a
        why: "Eine höfliche Frage macht deutlich, dass du um Erlaubnis bittest, nicht einfach ankündigst."
      - q: "Ein Kollege hat schon für dieselbe Woche Urlaub beantragt. — A colleague has already requested leave for the same week."
        options:
          - { key: a, text: "Trotzdem den Antrag stellen und abwarten." }
          - { key: b, text: "Kurz mit dem Kollegen sprechen, ob einer von euch die Woche verschieben kann." }
          - { key: c, text: "Sich beim Kollegen beschweren, dass er zu früh war." }
        answer: b
        why: "Eine direkte Absprache untereinander löst das Problem meist schneller als es der Chefin zu überlassen."
      - q: "Dein Resturlaub läuft bald ab. — Your remaining leave is about to expire."
        options:
          - { key: a, text: "Fragen, ob der Resturlaub ins nächste Jahr übertragen werden kann." }
          - { key: b, text: "Den Resturlaub einfach verfallen lassen." }
          - { key: c, text: "Sich beschweren, dass niemand daran erinnert hat." }
        answer: a
        why: "Rechtzeitig nachzufragen ist der übliche Weg, um Resturlaub nicht verfallen zu lassen."
      - q: "Deine Chefin lehnt den Antrag zunächst ab. — Your boss initially rejects the request."
        options:
          - { key: a, text: "Ruhig nach dem Grund fragen und gemeinsam nach einer Alternative suchen." }
          - { key: b, text: "Trotzdem einfach in Urlaub fahren." }
          - { key: c, text: "Sofort kündigen." }
        answer: a
        why: "Eine ruhige Nachfrage nach dem Grund öffnet meist den Weg zu einem Kompromiss."

  - id: B3
    block: B
