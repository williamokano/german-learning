  - id: D2
    block: D
    type: free-write
    title: "Beantragen, Absprechen, Lösen"
    prompt: "Schreib drei Teile: das Gespräch mit der Chefin, das Missverständnis mit einem Kollegen und die Lösung. Zusammen 16–20 Sätze."
    stimulus: |
      Du möchtest vom 14. bis 25. Juli Urlaub nehmen. Du hast Frau
      Berger als Vertretung gefunden. Später merkst du, dass ein
      Kollege für dieselbe Woche schon einen Antrag gestellt hat.

      Im Gespräch mit der Chefin müssen vorkommen:
      1. um einen Termin für das Gespräch bitten
      2. den gewünschten Zeitraum nennen
      3. die Vertretung vorstellen

      Im Missverständnis müssen vorkommen:
      4. merken, dass ein Kollege dieselbe Woche beantragt hat
      5. mit dem Kollegen sprechen, wer zuerst beantragt hat
      6. gemeinsam nach einer Lösung suchen

      In der Lösung müssen vorkommen:
      7. einen Kompromiss vorschlagen (z. B. eine Woche verschieben)
      8. die Chefin über die Lösung informieren
      9. dich für die Genehmigung bedanken
      10. die Übergabe an die Vertretung planen
    use:
      - "höfliche Bitte: „Hätten Sie …?“, „Dürfte ich …?“"
      - "Perfekt bei Rückfragen: „Er hat schon einen Antrag gestellt.“"
      - "Futur I: „Ich werde die Übergabe vorbereiten.“"
    selfCheck:
      - "Ist die Bitte um den Termin höflich formuliert?"
      - "Steht der Zeitraum klar mit von … bis?"
      - "Klingt das Gespräch mit dem Kollegen wie eine Absprache, nicht wie ein Streit?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Das Gespräch mit der Chefin**

      Ich: Hätten Sie kurz Zeit? Ich würde gern meinen Urlaubsantrag besprechen.
      Chefin: Klar, worum geht es?
      Ich: Ich möchte vom 14. bis zum 25. Juli Urlaub nehmen.
      Chefin: Haben Sie schon an eine Vertretung gedacht?
      Ich: Ja, Frau Berger hat sich bereit erklärt, meine Aufgaben zu übernehmen.
      Chefin: Gut, das erleichtert die Sache. Reichen Sie das Formular bitte offiziell ein.

      **Das Missverständnis**

      (Am nächsten Tag)
      Kollege: Hast du schon gehört? Ich habe auch für die zweite Juliwoche Urlaub beantragt.
      Ich: Oh, das wusste ich nicht. Wer von uns hat zuerst beantragt?
      Kollege: Ich glaube, ich war letzte Woche dran, aber sicher bin ich nicht.
      Ich: Lass uns das gemeinsam klären, bevor es zum Problem wird.

      **Die Lösung**

      Kollege: Ich könnte auch eine Woche später fahren, das würde bei mir noch passen.
      Ich: Das wäre super, dann gibt es keine Überschneidung mehr.
      (Ich gehe noch einmal zur Chefin.)
      Ich: Wir haben das untereinander geklärt — er verschiebt seinen Urlaub um eine Woche.
      Chefin: Sehr gut, dann ist alles geregelt. Vielen Dank für die schnelle Lösung.
      Ich: Ich werde die Übergabe an Frau Berger diese Woche noch vorbereiten.
