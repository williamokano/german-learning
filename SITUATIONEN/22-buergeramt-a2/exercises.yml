lesson: "SIT/22-buergeramt-a2"
title: "Beim Bürgeramt: anmelden und ummelden — A2"
topic: "Anmeldung beim Bürgeramt"
category: "Behörden & Formelles"
level: A2
summary: "Einen Termin bekommen, das Formular ausfüllen, am Schalter die Fragen beantworten und die Meldebescheinigung mitnehmen."
intro: >
  Der erste Behördengang in Deutschland ist fast immer derselbe: die
  Anmeldung. Du brauchst einen Termin, ein ausgefülltes Formular, deinen
  Pass und die Wohnungsgeberbestätigung von der Vermieterin. Am Schalter
  dauert es dann zehn Minuten: Name buchstabieren, Adresse bestätigen,
  Familienstand und Religion angeben, unterschreiben — und du gehst mit
  der Meldebescheinigung wieder raus. Grammatik nach Bedarf:
  Buchstabieren und Zahlen, Präpositionen bei Datum und Adresse,
  W-Fragen und höfliche Bitten. Blocks: A Wortschatz & Redemittel →
  B Dialoge → C Wenn es schiefgeht → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
