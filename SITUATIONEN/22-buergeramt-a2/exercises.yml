      "3": Wann
      "4": Wo
      "5": Wo
      "6": Wann
      "7": Wie
      "8": Was

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Schalter"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Nummer 214, Schalter 4. Guten Tag, was kann ich für Sie tun?
      — Guten Tag. Ich möchte mich {1}. Ich bin am 1. September
      eingezogen.
      — Haben Sie das {2} dabei?
      — Ja, hier. Und meinen {3}.
      — Danke. Und die {4} von Ihrer Vermieterin?
      — Auch dabei.
      — Sehr gut. Wie heißen Sie mit Nachnamen?
      — Marchetti. Ich {5}: M-A-R-C-H-E-T-T-I.
      — Danke. Ihr {6}?
      — Der 14. März 1994, in Porto.
      — {7}?
      — Ledig.
      — Und die {8}?
      — Keine.
      — Gut. Bitte hier {9}. — So, das war's. Hier ist Ihre
      {10}. Sie brauchen sie für die Bank und den Arbeitgeber.
      — Vielen Dank!
    bank: [ANMELDEN, ANMELDEFORMULAR, PASS, BESTÄTIGUNG, BUCHSTABIERE, GEBURTSDATUM, FAMILIENSTAND, RELIGION, UNTERSCHREIBEN, MELDEBESCHEINIGUNG, TERMIN, NUMMER, ADRESSE, WOHNUNG]
    answers:
      "1": ANMELDEN
      "2": ANMELDEFORMULAR
      "3": PASS
      "4": BESTÄTIGUNG
      "5": BUCHSTABIERE
      "6": GEBURTSDATUM
      "7": FAMILIENSTAND
      "8": RELIGION
      "9": UNTERSCHREIBEN
      "10": MELDEBESCHEINIGUNG

  - id: B2
    block: B
    type: single-choice
    title: "Was sagst du?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du kommst an den Schalter und sagst, warum du da bist. — You come to the counter and say why you're there."
        options:
          - { key: a, text: "Guten Tag. Ich möchte mich anmelden, ich bin am 1. September eingezogen." }
          - { key: b, text: "Anmeldung." }
          - { key: c, text: "Ich bin neu hier." }
        answer: a
        why: "Anliegen und Einzugsdatum in einem Satz — mehr braucht der Schalter nicht, um anzufangen."
      - q: "Dein Name wird falsch verstanden. — Your name is misunderstood."
        options:
          - { key: a, text: "Nein, anders." }
          - { key: b, text: "Ich buchstabiere: M wie Martha, A wie Anton, R wie Richard …" }
          - { key: c, text: "Steht doch im Pass." }
        answer: b
        why: "Buchstabieren mit Beispielwörtern ist am Schalter Standard und beendet jedes Missverständnis."
      - q: "Du verstehst eine Frage nicht. — You don't understand a question."
        options:
          - { key: a, text: "Was?" }
          - { key: b, text: "Ich spreche kein Deutsch." }
          - { key: c, text: "Entschuldigung, könnten Sie das bitte noch einmal langsamer sagen?" }
        answer: c
        why: "Um Wiederholung bitten, nicht die Sprache aufgeben — der Rest des Gesprächs läuft danach besser."
      - q: "Du weißt nicht, was „Wohnungsgeberbestätigung“ heißt. — You don't know what that word means."
        options:
          - { key: a, text: "Was bedeutet das?" }
          - { key: b, text: "Entschuldigung, was ist eine Wohnungsgeberbestätigung genau?" }
          - { key: c, text: "Das habe ich nicht." }
        answer: b
        why: "Das Wort selbst wiederholen — dann weiß dein Gegenüber genau, was du nicht verstanden hast."
      - q: "Die Sachbearbeiterin fragt nach deiner Religion. — The clerk asks about your religion."
        options:
          - { key: a, text: "Warum wollen Sie das wissen?" }
          - { key: b, text: "Keine." }
          - { key: c, text: "Das geht Sie nichts an." }
        answer: b
        why: "Die Angabe steht im Formular und entscheidet über die Kirchensteuer; „keine“ ist eine ganz normale Antwort."
      - q: "Du brauchst die Bescheinigung zweimal. — You need the certificate twice."
        options:
          - { key: a, text: "Geben Sie mir zwei." }
          - { key: b, text: "Ich brauche noch eine." }
          - { key: c, text: "Könnte ich bitte zwei Meldebescheinigungen bekommen? Eine für die Bank, eine für den Arbeitgeber." }
        answer: c
        why: "Bitte plus Begründung — so ist sofort klar, dass es kein Sonderwunsch ist."

  - id: B3
    block: B
    type: order
    title: "Sätze am Schalter bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Ich", "möchte", "mich", "anmelden"]
        answer: [0, 1, 2, 3]
        note: "sich anmelden — Reflexivpronomen vor dem Infinitiv"
      - tiles: ["Ich", "bin", "am", "1.", "September", "eingezogen"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Perfekt mit sein, Partizip am Ende"
      - tiles: ["Könnten", "Sie", "das", "bitte", "noch", "einmal", "wiederholen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Höfliche Bitte: könnten an Position 1, Infinitiv am Ende"
      - tiles: ["Meine", "letzte", "Adresse", "war", "in", "Porto"]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Präteritum von sein — bei Adressen üblich"
      - tiles: ["Wie", "viele", "Personen", "ziehen", "mit", "ein", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Trennverb mit·einziehen: die Vorsilbe steht am Ende"
      - tiles: ["Brauche", "ich", "dafür", "noch", "einen", "Termin", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Ja/Nein-Frage: Verb an Position 1"

  - id: B4
    block: B
    type: true-false
    title: "Die Terminseite lesen"
    instructions: |
      > **Bürgeramt Mitte — Anmeldung einer Wohnung**
      >
      > - Termine **online** über das Portal. Ohne Termin nur
      >   **dienstags 8–10 Uhr** (offene Sprechstunde, begrenzte Zahl).
      > - Die Anmeldung muss **innerhalb von 14 Tagen** nach Einzug
      >   erfolgen. Bei Verspätung ist ein **Bußgeld** möglich.
      > - **Mitbringen:** ausgefülltes Anmeldeformular, Pass oder
      >   Personalausweis, **Wohnungsgeberbestätigung** (nicht der
      >   Mietvertrag).
      > - Für **Familienangehörige** im selben Haushalt genügt **eine**
      >   Person mit den Ausweisen aller; für Personen ab 16 Jahren
      >   wird eine **Vollmacht** benötigt.
      > - Die **Meldebescheinigung** wird direkt ausgehändigt, weitere
      >   Exemplare kosten **5 €**.
      > - Die Ummeldung innerhalb der Stadt läuft **genauso**.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ohne Termin kommt man nur dienstags früh weiter. — Without an appointment you only get in on Tuesday mornings."
        answer: true
        why: "„Ohne Termin nur dienstags 8–10 Uhr.“"
      - q: "Man hat einen Monat Zeit für die Anmeldung. — You have a month to register."
        answer: false
        why: "Es sind 14 Tage nach Einzug."
      - q: "Der Mietvertrag reicht als Nachweis. — The rental contract is enough as proof."
        answer: false
        why: "Verlangt wird ausdrücklich die Wohnungsgeberbestätigung, nicht der Mietvertrag."
      - q: "Ein Erwachsener kann seinen 17-jährigen Sohn ohne Weiteres mit anmelden. — An adult can simply register their 17-year-old son too."
        answer: false
        why: "Ab 16 Jahren wird eine Vollmacht gebraucht."
      - q: "Die erste Meldebescheinigung ist kostenlos. — The first registration certificate is free."
        answer: true
        why: "Sie wird direkt ausgehändigt; erst weitere Exemplare kosten 5 €."
      - q: "Für einen Umzug innerhalb der Stadt gelten andere Regeln. — Different rules apply for a move within the city."
        answer: false
        why: "„Die Ummeldung innerhalb der Stadt läuft genauso.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas fehlt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Du bist seit fünf Wochen eingezogen und noch nicht angemeldet. — You moved in five weeks ago and still haven't registered."
        options:
          - { key: a, text: "Ein früheres Einzugsdatum angeben." }
          - { key: b, text: "So schnell wie möglich einen Termin machen und am Schalter sagen, dass es später wurde." }
          - { key: c, text: "Warten, bis jemand fragt." }
        answer: b
        why: "Falsche Angaben im Meldeformular sind ein echtes Problem; eine späte Anmeldung meistens keins."
      - q: "Die Wohnungsgeberbestätigung fehlt. — The landlord's confirmation is missing."
        options:
          - { key: a, text: "Ich habe den Mietvertrag dabei, geht das auch?" }
          - { key: b, text: "Kann ich das nachreichen? Meine Vermieterin schickt sie mir morgen." }
          - { key: c, text: "Dann eben nicht." }
        answer: b
        why: "Nach dem Nachreichen fragen und einen Zeitpunkt nennen — oft geht das per Mail oder Post."
      - q: "Beim Vorlesen merkst du, dass dein Geburtsdatum falsch eingetragen ist. — You notice your date of birth was entered wrongly."
        options:
          - { key: a, text: "Entschuldigung, da ist ein Fehler: Ich bin am 14. März geboren, nicht am 4. März." }
          - { key: b, text: "Das stimmt so nicht." }
          - { key: c, text: "Nichts sagen, das fällt schon auf." }
        answer: a
        why: "Falsch und richtig direkt nebeneinander nennen — dann ist es in zehn Sekunden korrigiert."
      - q: "Der Termin ist erst in sechs Wochen, du brauchst die Bescheinigung für die Bank. — The appointment is six weeks away and you need the certificate for the bank."
        options:
          - { key: a, text: "Sechs Wochen warten." }
          - { key: b, text: "Es online noch einmal versuchen und zusätzlich die offene Sprechstunde am Dienstag nutzen." }
          - { key: c, text: "Bei der Bank sagen, dass es nicht geht." }
        answer: b
        why: "Kurzfristig abgesagte Termine erscheinen ständig neu im Portal — und dienstags gibt es die Sprechstunde."
      - q: "Am Schalter wird dir gesagt, du seist im falschen Amt. — At the counter you're told you're at the wrong office."
        options:
          - { key: a, text: "Ich habe hier einen Termin!" }
          - { key: b, text: "Das kann nicht sein." }
          - { key: c, text: "Oh, das tut mir leid. Können Sie mir sagen, wohin ich muss und ob ich dort einen Termin brauche?" }
        answer: c
        why: "Nach dem richtigen Ort UND nach dem Termin fragen — sonst stehst du zweimal umsonst da."
      - q: "Du sollst ein Bußgeld zahlen. — You're told you have to pay a fine."
        options:
          - { key: a, text: "Ich zahle das nicht." }
          - { key: b, text: "Darf ich fragen, wie hoch das ist und ob ich etwas dazu schreiben kann? Ich habe die Bestätigung erst spät bekommen." }
          - { key: c, text: "Das ist ungerecht." }
        answer: b
        why: "Höhe erfragen und den Grund schriftlich nachreichen — oft wird dann abgesehen oder reduziert."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich möchte mich {1}. (sich registrieren lassen)
      2. Ich bin am 1. September {2}. (Perfekt von einziehen)
      3. Meine Vermieterin schickt mir die {3}. (Papier vom Wohnungsgeber)
      4. Kann ich das {4}? (später bringen)
      5. Bei Verspätung droht ein {5}. (Strafe in Geld)
      6. Die {6} brauche ich für die Bank. (Papier über meine Adresse)
    answers:
      "1": anmelden
      "2": eingezogen
      "3": Wohnungsgeberbestätigung
      "4": nachreichen
      "5": Bußgeld
      "6": Meldebescheinigung

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Ich möchte mich {1}. (register)
      2. Ich bin {2} 1. September eingezogen. (on the)
      3. Ich {3}: M-A-R-C-H-E-T-T-I. (I'll spell it)
      4. Mein {4} ist der 14. März 1994. (date of birth)
      5. {5}? — Ledig. (marital status)
      6. Die {6} habe ich von meiner Vermieterin. (landlord's confirmation)
      7. Kann ich das {7}? (hand in later)
      8. Bitte hier {8}. (sign)
      9. Hier ist Ihre {9}. (registration certificate)
      10. Brauche ich dafür einen {10}? (appointment)
      11. Bei Verspätung droht ein {11}. (fine)
      12. Könnten Sie das bitte noch einmal {12}? (repeat)
    answers:
      "1": anmelden
      "2": am
      "3": buchstabiere
      "4": Geburtsdatum
      "5": Familienstand
      "6": Wohnungsgeberbestätigung
      "7": nachreichen
      "8": unterschreiben
      "9": Meldebescheinigung
      "10": Termin
      "11": Bußgeld
      "12": wiederholen

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: Termin und Schalter"
    prompt: "Schreib zwei Szenen: den Anruf beim Bürgeramt und das Gespräch am Schalter. Zusammen 16–20 Sätze."
    stimulus: |
      Du heißt C. Marchetti, geboren am 14.03.1994 in Porto, ledig,
      keine Religionszugehörigkeit, portugiesische Staatsangehörigkeit.
      Du bist am 1. September in den Lindenweg 8 gezogen. Die
      Wohnungsgeberbestätigung kommt erst morgen.

      Szene 1 — Anruf:
      1. dein Anliegen nennen
      2. fragen, wann der nächste Termin frei ist
      3. nach der offenen Sprechstunde fragen
      4. fragen, was du mitbringen musst

      Szene 2 — Schalter:
      5. dich melden und den Grund nennen
      6. den Namen buchstabieren
      7. Geburtsdatum, Geburtsort und Familienstand angeben
      8. sagen, dass eine Unterlage fehlt, und um Nachreichen bitten
      9. einen Fehler im Formular korrigieren
      10. um zwei Meldebescheinigungen bitten und dich bedanken
    use:
      - "Sie-Form durchgehend"
      - "`Ich möchte mich anmelden.`"
      - "`Ich buchstabiere: …`"
      - "`Könnten Sie das bitte noch einmal wiederholen?`"
      - "`Kann ich das nachreichen?`"
    selfCheck:
      - "Hast du das Einzugsdatum mit am genannt (am 1. September)?"
      - "Steht bei `einziehen` und `mitbringen` die Vorsilbe richtig?"
      - "Ist die Korrektur klar — falsch und richtig direkt nebeneinander?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Szene 1 — der Anruf**

      Bürgeramt: Bürgeramt Mitte, Krause, guten Tag.
      Ich: Guten Tag, Marchetti. Ich möchte mich anmelden — ich bin am 1. September eingezogen.
      Bürgeramt: Termine vergeben wir online. Der nächste freie ist in sechs Wochen.
      Ich: Das ist spät. Gibt es auch eine offene Sprechstunde?
      Bürgeramt: Dienstags von 8 bis 10 Uhr, ohne Termin, aber begrenzt.
      Ich: Gut, dann komme ich Dienstag früh. Was muss ich mitbringen?
      Bürgeramt: Das ausgefüllte Anmeldeformular, Ihren Pass und die Wohnungsgeberbestätigung.
      Ich: Vielen Dank, bis Dienstag.

      **Szene 2 — am Schalter**

      Sachbearbeiterin: Nummer 214, Schalter 4. Was kann ich für Sie tun?
      Ich: Guten Tag. Ich möchte mich anmelden, ich bin am 1. September eingezogen.
      Sachbearbeiterin: Wie heißen Sie mit Nachnamen?
      Ich: Marchetti. Ich buchstabiere: M wie Martha, A wie Anton, R wie Richard, C wie Cäsar, H wie Heinrich, E wie Emil, T wie Theodor, T wie Theodor, I wie Ida.
      Sachbearbeiterin: Danke. Geburtsdatum und Geburtsort?
      Ich: Der 14. März 1994, geboren in Porto. Ledig, keine Religionszugehörigkeit.
      Sachbearbeiterin: Und die Wohnungsgeberbestätigung?
      Ich: Die fehlt mir leider noch — meine Vermieterin schickt sie mir morgen. Kann ich das nachreichen?
      Sachbearbeiterin: Ja, per Post oder Mail. Ich lese Ihnen kurz vor: Marchetti, geboren am 4. März 1994 …
      Ich: Entschuldigung, da ist ein Fehler: Ich bin am 14. März geboren, nicht am 4. März.
      Sachbearbeiterin: Danke, ich korrigiere das. Bitte hier unterschreiben.
      Ich: Gern. Könnte ich bitte zwei Meldebescheinigungen bekommen? Eine für die Bank, eine für den Arbeitgeber.
      Sachbearbeiterin: Die zweite kostet 5 €.
      Ich: Kein Problem. Vielen Dank für Ihre Hilfe!
