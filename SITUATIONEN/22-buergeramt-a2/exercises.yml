      - { text: "der Familienstand", bucket: person }
      - { text: "das Bürgeramt", bucket: ort }
      - { text: "die Wohnungsgeberbestätigung", bucket: papier }
      - { text: "das Geburtsdatum", bucket: person }
      - { text: "der Schalter", bucket: ort }
      - { text: "die Meldebescheinigung", bucket: papier }
      - { text: "die Staatsangehörigkeit", bucket: person }
      - { text: "die Wartenummer", bucket: ort }
      - { text: "das Anmeldeformular", bucket: papier }
      - { text: "der Geburtsort", bucket: person }
      - { text: "der Terminkalender", bucket: ort }

