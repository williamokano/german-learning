  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Datum, Adresse, Uhrzeit"
    instructions: "Ergänze die Präposition oder den Artikel."
    instructionsEn: "Fill in the preposition or the article."
    text: |
      1. Ich bin {1} 1. September eingezogen. (Datum: an + dem, kurz)
      2. Ich wohne {2} Lindenweg 8. (Straße)
      3. Mein Termin ist {3} Dienstag {4} 9:30 Uhr. (Wochentag / Uhrzeit)
      4. Ich komme {5} Portugal. (Land ohne Artikel)
      5. Ich bin {6} Porto geboren. (Stadt)
      6. Ich habe erst {7} zwei Wochen einen Termin. (Zeitpunkt in der Zukunft)
      7. Bitte gehen Sie {8} Schalter 4. (Richtung: zu + dem, kurz)
      8. Die Bescheinigung bekommen Sie {9} Ende. (Zeitpunkt: an + dem, kurz)
    answers:
      "1": am
      "2": im
      "3": am
      "4": um
      "5": aus
      "6": in
      "7": in
      "8": zum
      "9": am

