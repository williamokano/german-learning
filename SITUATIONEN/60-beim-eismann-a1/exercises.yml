lesson: "SIT/60-beim-eismann-a1"
title: "Beim Eismann mit Kindern — A1"
topic: "Beim Eismann"
category: "Essen & Trinken"
level: A1
summary: "Eissorten aussuchen, ein Kind entscheiden lassen, bezahlen — und was tun, wenn das Eis tropft oder auf den Boden fällt."
intro: >
  Beim Eisstand mit Kindern geht es meist schnell — bis ein Kind sich
  nicht entscheiden kann oder das Eis auf den Boden fällt. Dieses Set
  übt das Nötigste: Sorten nennen, ein Kind fragen, was es möchte,
  bezahlen, und kurze Sätze für kleine Missgeschicke. Grammatik nach
  Bedarf: unbestimmter Artikel im Akkusativ, einfache Fragen mit
  möchten, Perfekt bei kleinen Pannen. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

