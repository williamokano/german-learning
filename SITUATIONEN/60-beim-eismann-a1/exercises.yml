  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Eisstand"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Der Nächste, bitte! Was {1} ihr?
      — Mama, ich möchte {2}!
      — Nein, ich {3} lieber Schokolade!
      — Also gut, eine Portion Erdbeere und eine {4} Schokolade,
      bitte.
      — In der Waffel oder im {5}?
      — In der Waffel, bitte.
      — Mit {6}?
      — Ja, gern, mit Sahne.
      — Das {7} zusammen fünf Euro.
      — Hier, {8}.
      — Vielen Dank, und {9} Appetit!
      — Danke, einen schönen {10}!
    bank: [MÖCHTET, ERDBEERE, MÖCHTE, KUGEL, BECHER, SAHNE, MACHT, BITTE, GUTEN, TAG, EIS, WAFFEL, KALT, SÜSS]
    answers:
      "1": MÖCHTET
      "2": ERDBEERE
      "3": MÖCHTE
      "4": KUGEL
      "5": BECHER
      "6": SAHNE
      "7": MACHT
      "8": BITTE
      "9": GUTEN
      "10": TAG

  - id: B2
    block: B
    type: single-choice
    title: "Kurz und freundlich sprechen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du fragst dein Kind, welche Sorte es möchte. — You ask your child which flavour they want."
        options:
          - { key: a, text: "Was möchtest du, Schokolade oder Erdbeere?" }
          - { key: b, text: "Entscheide dich schnell!" }
          - { key: c, text: "Sorten sind mir egal." }
        answer: a
        why: "Eine einfache Frage mit zwei Optionen hilft dem Kind, sich leichter zu entscheiden."
      - q: "Du bist an der Reihe und bestellst. — It's your turn and you order."
        options:
          - { key: a, text: "Eis!" }
          - { key: b, text: "Eine Kugel Erdbeere und eine Kugel Schokolade, bitte." }
          - { key: c, text: "Ich weiß noch nicht." }
        answer: b
        why: "Eine klare, kurze Bestellung ist am Eisstand die übliche Form."
      - q: "Der Verkäufer fragt, ob du Sahne möchtest. — The seller asks if you'd like cream."
        options:
          - { key: a, text: "Sahne interessiert mich nicht." }
          - { key: b, text: "Keine Ahnung von Sahne." }
          - { key: c, text: "Ja, gern, mit Sahne." }
        answer: c
        why: "Eine kurze, klare Antwort reicht völlig aus."
      - q: "Du möchtest wissen, was alles zusammen kostet. — You want to know how much everything costs together."
        options:
          - { key: a, text: "Was macht das zusammen?" }
          - { key: b, text: "Preise interessieren mich nicht." }
          - { key: c, text: "Ich zahle einfach irgendwas." }
        answer: a
        why: "Eine kurze Frage nach dem Gesamtpreis ist am Stand völlig normal."
      - q: "Dein Kind kann sich nicht zwischen zwei Sorten entscheiden. — Your child can't decide between two flavours."
        options:
          - { key: a, text: "Entscheide dich sofort, sonst gibt es gar nichts." }
          - { key: b, text: "Nimm doch einfach beide, eine kleine Kugel von jeder." }
          - { key: c, text: "Ich entscheide für dich." }
        answer: b
        why: "Ein einfacher Kompromiss löst die Unentschlossenheit freundlich."
      - q: "Der Verkäufer wünscht dir einen schönen Tag. — The seller wishes you a nice day."
        options:
          - { key: a, text: "Nichts sagen und gehen." }
          - { key: b, text: "Wünsche sind mir egal." }
          - { key: c, text: "Danke, einen schönen Tag auch!" }
        answer: c
        why: "Ein kurzer, freundlicher Gegengruß ist die übliche Reaktion."

