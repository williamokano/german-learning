  - id: D2
    block: D
    type: free-write
    title: "Bestellen, ein Missgeschick, Lösung"
    prompt: "Schreib drei Teile: die Bestellung, ein kleines Missgeschick und die Lösung. Zusammen 12–16 Sätze."
    stimulus: |
      Du gehst mit deinem Kind zum Eisstand. Es kann sich zwischen zwei
      Sorten nicht entscheiden. Später fällt das Eis fast auf den
      Boden.

      Bei der Bestellung müssen vorkommen:
      1. dein Kind fragen, was es möchte
      2. eine Sorte bestellen
      3. fragen, ob es Sahne dazu gibt

      Beim Missgeschick müssen vorkommen:
      4. merken, dass das Eis fast fällt
      5. schnell reagieren
      6. das Kind beruhigen

      In der Lösung müssen vorkommen:
      7. das Eis retten oder ein neues holen
      8. bezahlen
      9. euch für den schönen Nachmittag bedanken
    use:
      - "einfache Frage: „Was möchtest du?“"
      - "möchten + Substantiv: „Ich möchte eine Kugel Schokolade.“"
      - "Präsens von schmelzen: „Das Eis schmilzt.“"
    selfCheck:
      - "Ist die Frage an das Kind einfach und klar?"
      - "Klingt die Reaktion auf das Missgeschick ruhig, nicht dramatisch?"
      - "Kommen alle 9 Punkte vor?"
    model: |
      **Die Bestellung**

      Ich: Was möchtest du, Schokolade oder Erdbeere?
      Kind: Beides!
      Ich: Also gut, eine Kugel Erdbeere und eine Kugel Schokolade, bitte.
      Verkäufer: Mit Sahne?
      Ich: Ja, gern.

      **Das Missgeschick**

      (Das Eis wackelt in der Waffel.)
      Ich: Pass auf, halt es gerade!
      Kind: Oh nein, fast wäre es runtergefallen!
      Ich: Alles gut, es ist noch da.

      **Die Lösung**

      Ich: Wollen wir uns dort in den Schatten setzen?
      Kind: Ja, gute Idee.
      Ich: Das macht zusammen vier Euro fünfzig.
      Verkäufer: Hier bitte, und einen schönen Nachmittag!
      Ich: Danke, dir auch!
