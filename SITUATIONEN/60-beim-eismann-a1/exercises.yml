  - id: B4
    block: B
    type: true-false
    title: "Die Eiskarte lesen"
    instructions: |
      > **Eisdiele Sonnenschein — Preise**
      >
      > - 1 Kugel — **1,20 €**
      > - 2 Kugeln — **2,20 €**
      > - 3 Kugeln — **3,00 €**
      > - Waffel — **kostenlos**, Becher — **kostenlos**
      > - Sahne extra — **0,50 €**
      > - Kindereis (1 Kugel + Waffel) — **1,50 €**
      > - Geöffnet: **täglich 12–19 Uhr**

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Eine Kugel kostet 1,20 Euro. — One scoop costs 1.20 euros."
        answer: true
        why: "So steht es ausdrücklich auf der Eiskarte."
      - q: "Die Waffel kostet extra. — The cone costs extra."
        answer: false
        why: "Waffel und Becher sind kostenlos."
      - q: "Sahne kostet fünfzig Cent extra. — Cream costs fifty cents extra."
        answer: true
        why: "„Sahne extra — 0,50 €.“"
      - q: "Zwei Kugeln kosten genauso viel wie zwei einzelne Kugeln zusammen. — Two scoops cost the same as two single scoops added up."
        answer: false
        why: "Zwei einzelne Kugeln wären 2,40 €, zwei Kugeln zusammen kosten nur 2,20 €."
      - q: "Das Kindereis kostet 1,50 Euro. — The kids' ice cream costs 1.50 euros."
        answer: true
        why: "„Kindereis (1 Kugel + Waffel) — 1,50 €.“"
      - q: "Die Eisdiele hat auch morgens um 9 Uhr geöffnet. — The ice cream parlour is also open at 9 am."
        answer: false
        why: "Geöffnet ist erst ab 12 Uhr, nicht um 9 Uhr."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn etwas nicht nach Plan läuft"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Das Eis fällt deinem Kind auf den Boden. — Your child's ice cream falls on the ground."
        options:
          - { key: a, text: "Das Kind trösten und nach einem neuen Eis fragen." }
          - { key: b, text: "Sagen, dass es kein neues Eis mehr gibt." }
          - { key: c, text: "Böse werden." }
        answer: a
        why: "Trösten und eine praktische Lösung anbieten ist die beste Reaktion auf ein kleines Missgeschick."
      - q: "Dein Kind kann sich einfach nicht entscheiden, und die Schlange wird lang. — Your child just can't decide, and the queue is getting long."
        options:
          - { key: a, text: "Laut werden, damit es schneller geht." }
          - { key: b, text: "Ruhig zwei Sorten vorschlagen und sich schnell entscheiden." }
          - { key: c, text: "Ohne Eis weggehen." }
        answer: b
        why: "Ein einfacher Vorschlag beschleunigt die Entscheidung, ohne unhöflich zu wirken."
      - q: "Du bekommst die falsche Sorte. — You get the wrong flavour."
        options:
          - { key: a, text: "Das falsche Eis einfach essen." }
          - { key: b, text: "Laut schimpfen." }
          - { key: c, text: "Freundlich sagen: „Entschuldigung, ich hatte Erdbeere bestellt.“" }
        answer: c
        why: "Ein freundlicher Hinweis führt meist sofort zur Korrektur."
      - q: "Das Eis schmilzt sehr schnell in der Sonne. — The ice cream is melting very fast in the sun."
        options:
          - { key: a, text: "Schnell einen schattigen Platz suchen." }
          - { key: b, text: "In der Sonne stehen bleiben." }
          - { key: c, text: "Das Eis wegwerfen." }
        answer: a
        why: "Ein schattiger Platz verhindert, dass das Eis noch schneller schmilzt."
      - q: "Du hast nicht genug Kleingeld dabei. — You don't have enough small change."
        options:
          - { key: a, text: "Fragen, ob man mit Karte zahlen kann." }
          - { key: b, text: "Ohne Bezahlung gehen." }
          - { key: c, text: "In Panik geraten." }
        answer: a
        why: "Eine kurze Frage nach einer anderen Zahlungsart löst das Problem meist schnell."
      - q: "Dein Kind bekommt Eis auf die Kleidung. — Your child gets ice cream on their clothes."
        options:
          - { key: a, text: "Ruhig bleiben und die Kleidung mit einem Taschentuch abwischen." }
          - { key: b, text: "Sich aufregen." }
          - { key: c, text: "Das Kind ausschimpfen." }
        answer: a
        why: "Ruhig zu bleiben nimmt dem kleinen Missgeschick die Dramatik."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Das Eis ist meinem Kind auf den {1} gefallen. (der Untergrund unter den Füßen)
      2. Mein Kind konnte sich nicht {2}. (eine Wahl treffen)
      3. Ich habe leider die falsche {3} bekommen. (der Geschmack des Eises)
      4. Das Eis {4} sehr schnell in der Sonne. (flüssig werden)
      5. Ich hatte leider kein {5} dabei. (kleine Münzen)
      6. Mein Kind hat Eis auf die {6} bekommen. (was man anzieht)
    answers:
      "1": Boden
      "2": entscheiden
      "3": Sorte
      "4": schmolz
      "5": Kleingeld
      "6": Kleidung

