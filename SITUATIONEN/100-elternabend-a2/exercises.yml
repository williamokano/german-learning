lesson: "SIT/100-elternabend-a2"
title: "Elternabend — A2"
topic: "Elternabend"
category: "Soziales"
level: A2
summary: "Zu einem Elternabend gehen, der Tagesordnung folgen und sich mit einer Wortmeldung einbringen — und was tun, wenn es ein Missverständnis über den Klassenausflug gibt oder eine Diskussion eskaliert."
intro: >
  Ein Elternabend läuft in klaren Schritten ab: sich anmelden, der
  Tagesordnung folgen und sich mit einer Wortmeldung einbringen, wenn
  man eine Frage hat. Dieses Set übt genau das — vorbereiten,
  teilnehmen, entscheiden, und was zu tun ist, wenn es ein
  Missverständnis über den Klassenausflug gibt oder eine Diskussion
  eskaliert. Grammatik nach Bedarf: Modalverben, Perfekt und Futur I.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es
  schiefgeht → D Wiederholung. Answers in solutions.md.
exercises:

