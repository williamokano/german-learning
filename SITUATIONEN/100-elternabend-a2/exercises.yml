  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Vorbereiten, teilnehmen, entscheiden"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      (im Klassenzimmer beim Elternabend)
      — Guten Abend, schön, dass Sie alle gekommen sind. Fangen wir
      mit der {1} an.
      — Gerne, was steht denn heute alles an?
      — Zuerst möchte ich über die Noten sprechen, dann geht es um
      den {2}.
      — Gute Idee, unsere Kinder freuen sich schon sehr darauf.
      — Genau, dafür brauchen wir übrigens noch Freiwillige aus dem
      {3}.
      — Ich würde mich gerne melden.
      — Super, dann machen wir dazu gleich eine {4}.
      (nach der Abstimmung)
      — Ich habe noch eine {5}, wenn das in Ordnung ist.
      — Natürlich, bitte.
      — Wie sieht es eigentlich mit den Hausaufgaben aus? Manche
      Eltern {6} sich, dass es zu viele sind.
      — Das nehme ich gerne mit und {7} das beim nächsten Mal.
      — Danke, das beruhigt mich.
      — Gibt es sonst noch Fragen? Wenn nicht, {8} ich das
      Protokoll und schicke es Ihnen in den nächsten Tagen zu.
      — Vielen Dank für den informativen Abend.
      — Gerne, ich {9} Ihnen einen schönen Rest des Abends und
      {10} mich schon auf das nächste Treffen.
    bank: [TAGESORDNUNG, KLASSENAUSFLUG, KLASSENFAHRT, ELTERNBEIRAT, ZEUGNIS, ABSTIMMUNG, WORTMELDUNG, HAUSAUFGABEN, ELTERNGESPRÄCH, SORGEN, KLÄRE, SCHREIBE, WÜNSCHE, FREUE]
    answers:
      "1": TAGESORDNUNG
      "2": KLASSENAUSFLUG
      "3": ELTERNBEIRAT
      "4": ABSTIMMUNG
      "5": WORTMELDUNG
      "6": SORGEN
      "7": KLÄRE
      "8": SCHREIBE
      "9": WÜNSCHE
      "10": FREUE

  - id: B2
    block: B
    type: single-choice
    title: "Teilnehmen und mitmachen"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du willst der Lehrerin sagen, dass ihr mit der Tagesordnung anfangen könnt. — You want to tell the teacher you can start with the agenda."
        options:
          - { key: a, text: "Tagesordnungen interessieren mich nicht." }
          - { key: b, text: "Fangen wir mit der Tagesordnung an." }
          - { key: c, text: "Das ist mir egal." }
        answer: b
        why: "Eine klare Aussage ist der übliche Einstieg in den Elternabend."
      - q: "Du willst wissen, was heute alles auf der Tagesordnung steht. — You want to know what's on today's agenda."
        options:
          - { key: a, text: "Das interessiert mich nicht." }
          - { key: b, text: "Ich frage lieber nicht nach." }
          - { key: c, text: "Was steht denn heute alles an?" }
        answer: c
        why: "Eine direkte Frage klärt den Ablauf des Abends."
      - q: "Du willst dich für die Organisation des Klassenausflugs melden. — You want to volunteer to help organize the class trip."
        options:
          - { key: a, text: "Ich würde mich gerne melden." }
          - { key: b, text: "Ausflüge interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Eine klare Aussage zeigt Bereitschaft, mitzuhelfen."
      - q: "Du willst wissen, ob du noch eine Wortmeldung machen kannst. — You want to know if you can still raise a point."
        options:
          - { key: a, text: "Wortmeldungen interessieren mich nicht." }
          - { key: b, text: "Habe ich noch eine Wortmeldung, wenn das in Ordnung ist?" }
          - { key: c, text: "Das ist mir egal, Hauptsache es ist bald vorbei." }
        answer: b
        why: "Eine höfliche Frage klärt, ob noch Raum für eine weitere Frage ist."
      - q: "Du willst wissen, wie es mit den Hausaufgaben aussieht. — You want to know how things stand with the homework."
        options:
          - { key: a, text: "Hausaufgaben interessieren mich nicht." }
          - { key: b, text: "Das ist mir zu kompliziert." }
          - { key: c, text: "Wie sieht es eigentlich mit den Hausaufgaben aus?" }
        answer: c
        why: "Eine direkte Frage bringt das Thema zur Sprache."
      - q: "Du willst dich für den informativen Abend bedanken. — You want to thank everyone for the informative evening."
        options:
          - { key: a, text: "Vielen Dank für den informativen Abend." }
          - { key: b, text: "Abende interessieren mich nicht." }
          - { key: c, text: "Das ist mir völlig egal." }
        answer: a
        why: "Ein höflicher Dank passt zum Abschluss des Elternabends."

