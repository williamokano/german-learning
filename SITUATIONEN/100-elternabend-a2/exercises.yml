  - id: B4
    block: B
    type: true-false
    title: "Die Infos zum Elternabend lesen"
    instructions: |
      > **Info — Elternabend**
      >
      > - **Häufigkeit:** ein Elternabend findet meist **einmal pro
      >   Halbjahr** statt.
      > - **Tagesordnung:** sollte man sich **vorher genau
      >   ansehen**.
      > - **Elternbeirat:** vertritt die **Interessen aller Eltern**
      >   der Klasse.
      > - **Wortmeldung:** ist der übliche Weg, sich **zu Wort zu
      >   melden**.
      > - **Abstimmung:** entscheidet meist **per Handzeichen** über
      >   gemeinsame Themen.
      > - **Protokoll:** fasst die wichtigsten Ergebnisse
      >   **schriftlich** zusammen.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein Elternabend findet meist einmal pro Halbjahr statt. — A parent evening usually takes place once per semester."
        answer: true
        why: "So steht es ausdrücklich in den Infos zum Elternabend."
      - q: "Die Tagesordnung braucht man sich vorher nie anzusehen. — You never need to look at the agenda beforehand."
        answer: false
        why: "Man sollte sich die Tagesordnung vorher genau ansehen."
      - q: "Der Elternbeirat vertritt die Interessen aller Eltern der Klasse. — The parent council represents the interests of all parents in the class."
        answer: true
        why: "„Elternbeirat: vertritt die Interessen aller Eltern der Klasse.“"
      - q: "Eine Wortmeldung ist unhöflich und sollte vermieden werden. — Raising a point is impolite and should be avoided."
        answer: false
        why: "Eine Wortmeldung ist der übliche Weg, sich zu Wort zu melden."
      - q: "Eine Abstimmung entscheidet meist per Handzeichen über gemeinsame Themen. — A vote usually decides shared topics by a show of hands."
        answer: true
        why: "„Abstimmung: entscheidet meist per Handzeichen über gemeinsame Themen.“"
      - q: "Ein Protokoll wird nie schriftlich zusammengefasst. — Minutes are never summarized in writing."
        answer: false
        why: "Das Protokoll fasst die wichtigsten Ergebnisse schriftlich zusammen."

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn beim Elternabend etwas schiefgeht"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Sie haben den Elternabend aus Versehen verpasst. — You accidentally missed the parent evening."
        options:
          - { key: a, text: "Einfach nichts unternehmen." }
          - { key: b, text: "Die Klassenlehrerin um eine kurze Zusammenfassung bitten." }
          - { key: c, text: "Sich bei anderen Eltern beschweren, ohne nachzufragen." }
        answer: b
        why: "Eine kurze Zusammenfassung informiert schnell über das Wichtigste."
      - q: "Es gibt ein Missverständnis über den Termin des Klassenausflugs. — There's a misunderstanding about the class trip date."
        options:
          - { key: a, text: "Einfach den falschen Termin annehmen." }
          - { key: b, text: "Sich gar nicht mehr darum kümmern." }
          - { key: c, text: "Höflich beim Elternbeirat nachfragen und den Termin klären." }
        answer: c
        why: "Eine höfliche Nachfrage klärt den Termin schnell und zuverlässig."
      - q: "Die Diskussion zwischen zwei Eltern eskaliert plötzlich. — A discussion between two parents suddenly escalates."
        options:
          - { key: a, text: "Ruhig um eine sachliche Fortsetzung des Gesprächs bitten." }
          - { key: b, text: "Sich selbst laut einmischen." }
          - { key: c, text: "Sofort den Raum verlassen." }
        answer: a
        why: "Eine ruhige Bitte um Sachlichkeit hilft, die Situation zu beruhigen."
      - q: "Das versprochene Protokoll kommt nicht bei Ihnen an. — The promised minutes don't reach you."
        options:
          - { key: a, text: "Einfach abwarten, ohne nachzufragen." }
          - { key: b, text: "Höflich bei der Klassenlehrerin nachfragen." }
          - { key: c, text: "Sich bei anderen Eltern über die Lehrerin beschweren." }
        answer: b
        why: "Eine höfliche Nachfrage klärt schnell, ob das Protokoll noch kommt."
      - q: "Sie haben vergessen, eine wichtige Frage zu stellen. — You forgot to ask an important question."
        options:
          - { key: a, text: "Die Frage einfach unbeantwortet lassen." }
          - { key: b, text: "Andere Eltern fragen, ob sie es wissen." }
          - { key: c, text: "Die Klassenlehrerin im Nachhinein per E-Mail fragen." }
        answer: c
        why: "Eine Nachfrage per E-Mail klärt die Frage auch nach dem Elternabend."
      - q: "Die Wahl zum Elternbeirat endet unentschieden. — The election for the parent council ends in a tie."
        options:
          - { key: a, text: "Eine zweite Abstimmungsrunde vorschlagen." }
          - { key: b, text: "Einfach eine Person zufällig bestimmen." }
          - { key: c, text: "Die Wahl komplett ausfallen lassen." }
        answer: a
        why: "Eine zweite Abstimmungsrunde klärt das unentschiedene Ergebnis fair."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Ich habe den Elternabend aus Versehen {1}. (nicht wahrgenommen, Partizip)
      2. Es hat ein Missverständnis über den Termin {2}. (bestanden, Partizip)
      3. Die Diskussion zwischen zwei Eltern ist plötzlich {3}. (außer Kontrolle geraten, Partizip)
      4. Das versprochene Protokoll ist bei mir nicht {4}. (nicht eingetroffen, Partizip)
      5. Meine wichtige Frage habe ich leider nicht {5}. (nicht formuliert, Partizip)
      6. Die Wahl zum Elternbeirat ist unentschieden {6}. (nicht klar entschieden, Partizip)
    answers:
      "1": verpasst
      "2": gegeben
      "3": eskaliert
      "4": angekommen
      "5": gestellt
      "6": ausgegangen

