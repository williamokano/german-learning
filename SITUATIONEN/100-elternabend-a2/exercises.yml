  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Den Elternabend vorbereiten"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mich gestern für den Elternabend angemeldet. (haben, Perfekt)
      2. {2} Sie mir bitte die Tagesordnung schicken? (können, Sie-Form)
      3. Man {3} sich rechtzeitig einen Termin freihalten. (sollen, Präsens)
      4. {4} das Protokoll schon verschickt worden? (sein, Perfekt Passiv)
      5. Falls eine Frage {5}, kann man sich einfach melden. (auftauchen, Präsens)
      6. Die Klassenlehrerin {6} uns die wichtigsten Termine mitteilen. (werden, Futur I)
      7. Ich {7} schon eine Wortmeldung gemacht. (haben, Perfekt)
      8. {8} Sie mir bitte den Ablauf erklären? (können, Sie-Form)
    answers:
      "1": habe
      "2": Können
      "3": soll
      "4": Ist
      "5": auftaucht
      "6": wird
      "7": habe
      "8": Können

  - id: A4
