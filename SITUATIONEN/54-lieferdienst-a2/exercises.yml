  - id: B4
    block: B
    type: true-false
    title: "Die FAQ des Lieferdienstes lesen"
    instructions: |
      > **FAQ — Lieferdienst SchnellEssen**
      >
      > - **Fehlender Artikel:** Bitte innerhalb von **48 Stunden** über
      >   den Chat melden, mit Bestellnummer.
      > - **Rückerstattung oder erneute Lieferung:** Sie können frei
      >   wählen; die Rückerstattung erfolgt **innerhalb von 3–5
      >   Werktagen**.
      > - **Trinkgeld:** freiwillig, kann in der App **vor oder nach**
      >   der Lieferung hinzugefügt werden.
      > - **Lieferhinweise:** bitte **vor dem Absenden** der Bestellung
      >   eintragen, spätere Änderungen sind nicht mehr möglich.
      > - Bei **falscher Lieferung** an eine andere Adresse wird
      >   automatisch eine **neue Lieferung** organisiert.

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Ein fehlender Artikel muss sofort gemeldet werden, sonst verfällt der Anspruch nach einer Stunde. — A missing item must be reported immediately, or the claim expires after an hour."
        answer: false
        why: "Die Meldung ist innerhalb von 48 Stunden möglich, nicht nur einer Stunde."
      - q: "Man kann zwischen Rückerstattung und erneuter Lieferung wählen. — You can choose between a refund and a new delivery."
        answer: true
        why: "So steht es ausdrücklich in der FAQ."
      - q: "Eine Rückerstattung dauert immer sofort. — A refund always happens immediately."
        answer: false
        why: "Die Rückerstattung erfolgt innerhalb von 3–5 Werktagen, nicht sofort."
      - q: "Trinkgeld ist verpflichtend. — Tipping is mandatory."
        answer: false
        why: "Trinkgeld ist freiwillig."
      - q: "Lieferhinweise können auch noch nach dem Absenden geändert werden. — Delivery notes can still be changed after submitting the order."
        answer: false
        why: "Spätere Änderungen sind nicht mehr möglich."
      - q: "Bei falscher Lieferung wird automatisch eine neue Lieferung organisiert. — With a misdelivery, a new delivery is organized automatically."
        answer: true
        why: "„Bei falscher Lieferung … wird automatisch eine neue Lieferung organisiert.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Wenn die Lieferung nicht stimmt"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Ein Artikel fehlt in deiner Bestellung. — An item is missing from your order."
        options:
          - { key: a, text: "Beim Support melden und die Bestellnummer angeben." }
          - { key: b, text: "Es einfach hinnehmen." }
          - { key: c, text: "Nie wieder bei diesem Lieferdienst bestellen, ohne etwas zu sagen." }
        answer: a
        why: "Der Support kann nur helfen, wenn man das Problem konkret meldet."
      - q: "Du hast ein ganz anderes Gericht bekommen, als du bestellt hast. — You received a completely different dish than what you ordered."
        options:
          - { key: a, text: "Das falsche Gericht trotzdem essen, ohne etwas zu sagen." }
          - { key: b, text: "Ein Foto machen und den Support kontaktieren." }
          - { key: c, text: "Den Fahrer beschimpfen." }
        answer: b
        why: "Ein Foto als Beleg beschleunigt die Bearbeitung der Reklamation."
      - q: "Das Essen kommt eine Stunde später als angegeben an. — The food arrives an hour later than stated."
        options:
          - { key: a, text: "Die Bestellung stornieren, ohne Bescheid zu geben." }
          - { key: b, text: "Sofort eine schlechte Bewertung schreiben, ohne nachzufragen." }
          - { key: c, text: "Im Chat nachfragen, was los ist." }
        answer: c
        why: "Eine Nachfrage klärt die Verzögerung, bevor man vorschnell reagiert."
      - q: "Der Fahrer liefert an die falsche Adresse. — The driver delivers to the wrong address."
        options:
          - { key: a, text: "Sofort den Support kontaktieren und die korrekte Adresse angeben." }
          - { key: b, text: "Selbst zur falschen Adresse fahren." }
          - { key: c, text: "Warten und hoffen, dass es sich von selbst löst." }
        answer: a
        why: "Der Support kann die Lieferung schnell umleiten oder eine neue organisieren."
      - q: "Niemand öffnet, als du klingelst, weil du der Fahrer bist. — No one answers when you ring, because you're the driver."
        options:
          - { key: a, text: "Sofort wieder wegfahren." }
          - { key: b, text: "Das Essen einfach vor der Tür liegen lassen, ohne Bescheid zu geben." }
          - { key: c, text: "Kurz anrufen oder eine Nachricht schreiben und einen Moment warten." }
        answer: c
        why: "Ein kurzer Anruf oder eine Nachricht gibt der Person die Chance, doch noch zu öffnen."
      - q: "Deine Rückerstattung ist nach einer Woche immer noch nicht angekommen. — Your refund still hasn't arrived after a week."
        options:
          - { key: a, text: "Höflich im Chat nachfragen, wie der Stand ist." }
          - { key: b, text: "Nichts mehr unternehmen." }
          - { key: c, text: "Eine wütende Nachricht ohne Bestellnummer schreiben." }
        answer: a
        why: "Eine höfliche Nachfrage mit Verweis auf die vergangene Zeit ist der nächste sinnvolle Schritt."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. In meiner Bestellung {1} ein Artikel. (nicht dabei sein, Präsens)
      2. Ich habe ein ganz anderes {2} bekommen, als ich bestellt habe. (die Speise)
      3. Das Essen kam eine Stunde {3} an als angegeben. (nach der erwarteten Zeit)
      4. Der Fahrer hat an die falsche {4} geliefert. (der Ort der Lieferung)
      5. Niemand hat {5}, als der Fahrer geklingelt hat. (die Tür aufgemacht)
      6. Meine {6} ist nach einer Woche immer noch nicht angekommen. (das zurückerstattete Geld)
    answers:
      "1": fehlt
      "2": Gericht
      "3": später
      "4": Adresse
      "5": geöffnet
      "6": Rückerstattung

