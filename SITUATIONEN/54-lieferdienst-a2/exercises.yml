      — Danke, ich {4} das gleich nach.
      — Möchten Sie eine {5} oder eine erneute Lieferung?
      — Eine Rückerstattung wäre mir {6}.
      — Kein Problem, das Geld wird Ihnen {7} zurückerstattet.
