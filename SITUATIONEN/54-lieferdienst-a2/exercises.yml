  - id: B2
    block: B
    type: single-choice
    title: "Höflich beim Lieferdienst"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du möchtest einen Hinweis für den Fahrer hinzufügen. — You want to add a note for the driver."
        options:
          - { key: a, text: "Kann ich einen Lieferhinweis hinzufügen?" }
          - { key: b, text: "Der Fahrer soll das selbst herausfinden." }
          - { key: c, text: "Hinweise sind mir egal." }
        answer: a
        why: "Eine kurze Frage klärt, ob und wie man einen Hinweis ergänzen kann."
      - q: "In deiner Bestellung fehlt eine Portion Pommes. — Your order is missing a portion of fries."
        options:
          - { key: a, text: "Das ist eine Frechheit!" }
          - { key: b, text: "Guten Tag, meine Bestellung ist angekommen, aber es fehlt eine Portion Pommes." }
          - { key: c, text: "Ich sage nichts und esse einfach den Rest." }
        answer: b
        why: "Eine sachliche Beschreibung des fehlenden Artikels führt am schnellsten zu einer Lösung."
      - q: "Der Support fragt nach deiner Bestellnummer. — Support asks for your order number."
        options:
          - { key: a, text: "Keine Ahnung, suchen Sie es selbst." }
          - { key: b, text: "Nummern interessieren mich nicht." }
          - { key: c, text: "Ja, die Nummer ist 48213." }
        answer: c
        why: "Die Bestellnummer direkt zu nennen beschleunigt die Bearbeitung."
      - q: "Der Fahrer klingelt, aber du bist gerade beschäftigt. — The driver rings, but you're currently busy."
        options:
          - { key: a, text: "Einen Moment bitte, ich komme gleich!" }
          - { key: b, text: "Einfach nicht öffnen." }
          - { key: c, text: "Den Fahrer warten lassen, ohne etwas zu sagen." }
        answer: a
        why: "Eine kurze Rückmeldung ist höflicher, als den Fahrer schweigend warten zu lassen."
      - q: "Du möchtest wissen, ob du eine Rückerstattung oder eine neue Lieferung bekommst. — You want to know whether you'll get a refund or a new delivery."
        options:
          - { key: a, text: "Das ist mir egal." }
          - { key: b, text: "Möchten Sie mir sagen, welche Optionen ich habe?" }
          - { key: c, text: "Ich entscheide das dann schon irgendwie." }
        answer: b
        why: "Nach den Optionen zu fragen hilft, eine passende Entscheidung zu treffen."
      - q: "Du möchtest dem Fahrer für die schnelle Lieferung danken. — You want to thank the driver for the quick delivery."
        options:
          - { key: a, text: "Nichts sagen und die Tür schließen." }
          - { key: b, text: "Sich beschweren, dass es zu schnell war." }
          - { key: c, text: "Vielen Dank, das ging ja richtig schnell!" }
        answer: c
        why: "Ein kurzer, freundlicher Dank ist die übliche Reaktion beim Übergeben der Bestellung."

