  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Bestellen und liefern lassen"
    instructions: "Ergänze das Modalverb oder die Verbform."
    instructionsEn: "Fill in the modal verb or verb form."
    text: |
      1. Ich {1} mir gern etwas zum Essen bestellen. (möchten, ich-Form)
      2. {2} ich einen Lieferhinweis hinzufügen? (können, ich-Form)
      3. Der Fahrer {3} in etwa dreißig Minuten hier. (sein, Präsens)
      4. Ich {4} vergessen, das Trinkgeld einzugeben. (haben, Perfekt)
      5. In der Tüte {5} eine Portion Pommes. (fehlen, Präteritum)
      6. Der Support {6} mir innerhalb weniger Minuten geantwortet. (haben, Perfekt)
