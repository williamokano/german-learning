lesson: "SIT/54-lieferdienst-a2"
title: "Lieferdienst: falsche Bestellung — A2"
topic: "Lieferdienst"
category: "Essen & Trinken"
level: A2
summary: "Per App bestellen, Lieferhinweise geben, den Fahrer trinkgeldgerecht verabschieden — und was tun, wenn etwas fehlt oder falsch ist."
intro: >
  Über eine App zu bestellen ist schnell erledigt — bis etwas fehlt
  oder ein ganz anderes Gericht ankommt. Dieses Set übt den ganzen
  Ablauf: die Bestellung aufgeben, Lieferhinweise wie Stockwerk und
  Klingel angeben, den Fahrer verabschieden, und beim Support
  reklamieren, wenn etwas nicht stimmt. Grammatik nach Bedarf: Perfekt
  im Bericht, Nebensätze mit dass, höfliche Bitten mit Konjunktiv II.
  Blocks: A Wortschatz & Redemittel → B Dialoge → C Wenn es schiefgeht →
  D Wiederholung. Answers in solutions.md.
exercises:

