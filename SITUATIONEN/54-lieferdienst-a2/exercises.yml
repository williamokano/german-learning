  - id: D2
    block: D
    type: free-write
    title: "Bestellen, Fehler, Reklamation"
    prompt: "Schreib drei Teile: die Bestellung, das Problem und die Reklamation. Zusammen 16–20 Sätze."
    stimulus: |
      Du bestellst per App bei einem Lieferdienst. Als das Essen
      ankommt, fehlt eine Portion Pommes, und der Fahrer klingelt zwar,
      aber du bist gerade beschäftigt.

      Bei der Bestellung müssen vorkommen:
      1. dir etwas zum Essen aussuchen
      2. einen Lieferhinweis hinzufügen
      3. die Bestellbestätigung erwähnen

      Beim Problem müssen vorkommen:
      4. den Fahrer kurz bitten, einen Moment zu warten
      5. merken, dass ein Artikel fehlt
      6. das Trinkgeld trotzdem geben, weil der Fahrer nichts dafür kann

      In der Reklamation müssen vorkommen:
      7. den Support kontaktieren und die Bestellnummer nennen
      8. zwischen Rückerstattung und neuer Lieferung wählen
      9. eine Lösung bekommen
      10. dich für die schnelle Hilfe bedanken
    use:
      - "reflexives Verb: „Ich bestelle mir etwas.“"
      - "höfliche Bitte: „Können Sie …?“"
      - "Nebensatz mit dass: „Ich habe gemerkt, dass ein Artikel fehlt.“"
    selfCheck:
      - "Ist die Bitte um den Lieferhinweis vor der Bestellung klar formuliert?"
      - "Klingt die Reaktion auf den fehlenden Artikel sachlich, nicht wütend?"
      - "Wird die Bestellnummer beim Support genannt?"
      - "Kommen alle 10 Punkte vor?"
    model: |
      **Die Bestellung**

      Ich: Ich möchte mir heute Abend etwas bestellen — vielleicht Pizza.
      (Ich füge einen Lieferhinweis hinzu: „Bitte klingeln, dritter Stock.“)
      Ich: Gut, die Bestellbestätigung ist gerade angekommen, geschätzte Lieferzeit vierzig Minuten.

      **Das Problem**

      (Es klingelt.)
      Ich: Einen Moment bitte, ich komme gleich!
      Fahrer: Kein Problem, ich warte.
      Ich: Vielen Dank fürs Warten — und hier ist etwas Trinkgeld für Sie.
      (Ich packe die Tüte aus.)
      Ich: Moment, hier fehlt eine Portion Pommes.

      **Die Reklamation**

      Ich: Guten Tag, meine Bestellung ist angekommen, aber es fehlt eine Portion Pommes. Die Bestellnummer ist 48213.
      Support: Das tut mir leid! Möchten Sie eine Rückerstattung oder eine erneute Lieferung?
      Ich: Eine Rückerstattung wäre mir lieber.
      Support: Kein Problem, das Geld wird Ihnen innerhalb weniger Tage zurückerstattet.
      Ich: Vielen Dank für die schnelle Hilfe.
