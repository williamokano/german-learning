lesson: "SIT/36-grillen-und-smalltalk-a2"
title: "Grillen im Hof: Smalltalk auf Deutsch — A2"
topic: "Smalltalk beim Grillen"
category: "Soziales"
level: A2
summary: "Ankommen und etwas mitbringen, jemanden kennenlernen, über sicheres Terrain reden, aussteigen und sich verabschieden."
intro: >
  Smalltalk ist die Disziplin, in der Lernende am längsten unsicher
  bleiben — nicht weil die Sätze schwer wären, sondern weil niemand
  sagt, worüber man redet. Beim Grillen im Hof ist das Feld klar
  abgesteckt: Woher kommst du, wie lange bist du schon hier, was machst
  du beruflich, wie gefällt es dir, das Wetter, das Essen, die Wohnung.
  Politik, Gehalt und Krankheiten gehören nicht dazu. Genauso wichtig
  ist der Ausstieg: Wie kommt man höflich aus einem Gespräch heraus,
  ohne unfreundlich zu wirken? Grammatik nach Bedarf: W-Fragen, Perfekt
  für Erlebtes, seit + Dativ, Komparativ. Blocks: A Wortschatz &
  Redemittel → B Dialoge → C Wenn es schiefgeht → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Wortschatz & Redemittel ─────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Worüber redet man — und worüber nicht?"
    instructions: "Sortiere die 12 Themen."
    instructionsEn: "Sort the 12 topics."
    buckets:
      - { key: sicher, label: "Sicheres Thema" }
      - { key: heikel, label: "Eher heikel" }
      - { key: tabu, label: "Besser nicht" }
    tokens:
      - { text: "das Wetter", bucket: sicher }
      - { text: "die Politik", bucket: heikel }
      - { text: "das Gehalt", bucket: tabu }
      - { text: "das Essen", bucket: sicher }
      - { text: "die Religion", bucket: heikel }
      - { text: "die Miete der anderen", bucket: tabu }
      - { text: "der Urlaub", bucket: sicher }
      - { text: "der Streit im Haus", bucket: heikel }
      - { text: "das Gewicht", bucket: tabu }
      - { text: "die Arbeit", bucket: sicher }
      - { text: "die Erziehung fremder Kinder", bucket: heikel }
      - { text: "Krankheiten im Detail", bucket: tabu }

  - id: A2
    block: A
    type: matching
    title: "Frage und Antwort"
    instructions: "Ordne jeder Frage eine passende Antwort zu."
    instructionsEn: "Match each question with a fitting answer."
    left:
      - { key: "1", text: "Und woher kommst du ursprünglich?" }
      - { key: "2", text: "Wie lange bist du schon hier?" }
      - { key: "3", text: "Und was machst du beruflich?" }
      - { key: "4", text: "Wie gefällt es dir in Deutschland?" }
      - { key: "5", text: "Was ist am schwersten an der Sprache?" }
      - { key: "6", text: "Wohnst du auch hier im Haus?" }
      - { key: "7", text: "Soll ich dir etwas mitbringen?" }
      - { key: "8", text: "Kommst du nächstes Mal wieder?" }
    right:
      - { key: a, text: "Aus Porto. Aber ich habe vorher zwei Jahre in Lyon gelebt." }
      - { key: b, text: "Seit drei Jahren — anfangs nur für ein Jahr geplant." }
      - { key: c, text: "Ich bin Physiotherapeutin, in einer Reha-Klinik." }
      - { key: d, text: "Sehr gut inzwischen. Am Anfang war es schwieriger." }
      - { key: e, text: "Ehrlich? Die Artikel. Der, die, das ist die Hölle." }
      - { key: f, text: "Ja, dritter Stock rechts. Seit letztem Sommer." }
      - { key: g, text: "Ich bringe einen Salat mit, das ist einfacher als Fleisch." }
      - { key: h, text: "Sehr gern, sag einfach Bescheid." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f
      "7": g
      "8": h

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "seit, vor, für — die drei Zeitfallen"
    instructions: "Ergänze die Präposition."
    instructionsEn: "Fill in the preposition."
    text: |
      1. Ich wohne {1} drei Jahren in Deutschland. (bis jetzt, dauert an)
      2. Ich bin {2} drei Jahren hergezogen. (der Zeitpunkt in der Vergangenheit)
      3. Ich bleibe erst mal {3} ein Jahr. (die geplante Dauer)
      4. {4} letztem Sommer wohne ich hier im Haus. (Anfangspunkt)
      5. Wir haben uns {5} einer Woche kennengelernt. (Zeitpunkt)
      6. Ich lerne {6} zwei Jahren Deutsch. (dauert an)
    answers:
      "1": seit
      "2": vor
      "3": für
      "4": Seit
      "5": vor
      "6": seit

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Interesse zeigen"
    instructions: "Ergänze das fehlende Wort."
    instructionsEn: "Fill in the missing word."
    text: |
      1. {1} interessant! Und wie bist du darauf gekommen? (Reaktion auf etwas Spannendes)
      2. Ach {2}? Das wusste ich gar nicht. (kurze Rückfrage, zwei Buchstaben)
      3. Das kann ich gut {3}. (nachfühlen)
      4. Wie {4} du das denn gemacht? (Perfekt-Frage: … du das gemacht)
      5. Und was {5} dann? (passieren, Präteritum)
      6. Erzähl {6}! (Aufforderung: mehr davon)
    answers:
      "1": Wie
      "2": so
      "3": verstehen
      "4": hast
      "5": passierte
      "6": weiter

  # ── Block B — Dialoge ─────────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Am Grill"
    instructions: "Fülle die 10 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht. Jedes Wort darf nur einmal verwendet werden."
    instructionsEn: "Fill the 10 gaps with words from the box. Four words are not needed. Each word may be used once."
    text: |
      — Hallo! Wir kennen uns noch nicht, oder? Ich bin Tobias.
      — Hi, ich bin Carla. Ich wohne im dritten {1} rechts.
      — Ah, die neue Nachbarin! Wie lange bist du schon {2}?
      — {3} letztem Sommer. Und du?
      — Ich bin hier geboren, ehrlich gesagt. Und woher kommst du
      {4}?
      — Aus Porto. Ich habe aber vorher zwei Jahre in Lyon
      {5}.
      — Wie {6}! Und was machst du beruflich?
      — Ich bin Physiotherapeutin. Und du?
      — Ich arbeite bei der Stadt. — Sag mal, hast du Hunger? Ich habe
      auch was {7} Fleisch, falls du kein Fleisch isst.
      — Sehr nett. Ich habe einen Salat {8}, der steht drüben.
      — Super. — Oh, ich glaube, ich muss kurz an den Grill. Wir
      {9} später weiter?
      — Gern. Und {10} nächstes Mal etwas mitbringen soll, sag
      einfach Bescheid.
    bank: [STOCK, HIER, SEIT, URSPRÜNGLICH, GELEBT, INTERESSANT, OHNE, MITGEBRACHT, REDEN, WENN, VOR, WOHNUNG, GEGESSEN, SPRECHEN]
    answers:
      "1": STOCK
      "2": HIER
      "3": SEIT
      "4": URSPRÜNGLICH
      "5": GELEBT
      "6": INTERESSANT
      "7": OHNE
      "8": MITGEBRACHT
      "9": REDEN
      "10": WENN

  - id: B2
    block: B
    type: single-choice
    title: "Wie sagst du das?"
    instructions: "Wähle die passende Variante."
    instructionsEn: "Choose the fitting variant."
    items:
      - q: "Du kommst an und kennst fast niemanden. — You arrive and hardly know anyone."
        options:
          - { key: a, text: "Hallo! Wir kennen uns noch nicht, oder? Ich bin Carla, dritter Stock." }
          - { key: b, text: "Hallo." }
          - { key: c, text: "Warten, bis jemand dich anspricht." }
        answer: a
        why: "Name plus ein Detail, an dem sich das Gespräch festmachen kann — mehr braucht ein Einstieg nicht."
      - q: "Jemand fragt, wie es dir in Deutschland gefällt. — Someone asks how you like it in Germany."
        options:
          - { key: a, text: "Ganz gut." }
          - { key: b, text: "Inzwischen sehr gut. Am Anfang war die Sprache schwerer, als ich dachte." }
          - { key: c, text: "Es geht." }
        answer: b
        why: "Eine Bewegung erzählen (vorher/jetzt) statt ein Urteil abgeben — daran kann das Gegenüber anknüpfen."
      - q: "Du willst wissen, ob du etwas mitbringen sollst. — You want to know whether to bring something."
        options:
          - { key: a, text: "Soll ich etwas mitbringen? Ich könnte einen Salat machen." }
          - { key: b, text: "Muss ich was mitbringen?" }
          - { key: c, text: "Ich bringe nichts mit, okay?" }
        answer: a
        why: "Fragen und gleich einen Vorschlag machen — dann muss der Gastgeber nicht überlegen."
      - q: "Das Gespräch gerät auf Politik und du willst da nicht hin. — The talk turns to politics and you'd rather not."
        options:
          - { key: a, text: "Darüber rede ich nicht." }
          - { key: b, text: "Puh, da halte ich mich raus — apropos, weiß jemand, was aus dem Hoffest wird?" }
          - { key: c, text: "Deutlich widersprechen." }
        answer: b
        why: "Freundlich aussteigen und ein neues Thema anbieten; ein blankes „darüber rede ich nicht“ bleibt im Raum stehen."
      - q: "Du willst aus einem Gespräch heraus. — You want to get out of a conversation."
        options:
          - { key: a, text: "Einfach weggehen." }
          - { key: b, text: "Ich muss mal kurz — wir reden später weiter, ja?" }
          - { key: c, text: "Ich finde das Gespräch langweilig." }
        answer: b
        why: "Ein Grund und die Ankündigung, später weiterzureden: der Standardausstieg, den jeder benutzt."
      - q: "Jemand spricht sehr schnell und du verstehst wenig. — Someone speaks very fast and you understand little."
        options:
          - { key: a, text: "Nicken und hoffen." }
          - { key: b, text: "Ich spreche nicht so gut Deutsch." }
          - { key: c, text: "Entschuldigung, könntest du etwas langsamer sprechen? Mein Deutsch ist noch im Aufbau." }
        answer: c
        why: "Die Bitte plus eine kurze Einordnung — die meisten stellen sich sofort darauf ein."

  - id: B3
    block: B
    type: order
    title: "Sätze für den Smalltalk bauen"
    instructions: "Bringe die Wörter in die richtige Reihenfolge."
    instructionsEn: "Put the words in the correct order."
    items:
      - tiles: ["Wir", "kennen", "uns", "noch", "nicht", ",", "oder", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Das angehängte oder? macht daraus eine freundliche Frage"
      - tiles: ["Ich", "wohne", "seit", "drei", "Jahren", "in", "Deutschland"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "seit + Dativ, im Deutschen mit Präsens"
      - tiles: ["Ich", "habe", "vorher", "zwei", "Jahre", "in", "Lyon", "gelebt"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Perfekt: Partizip am Ende"
      - tiles: ["Am", "Anfang", "war", "es", "schwerer", ",", "als", "ich", "dachte"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Vergleich mit als; Präteritum bei dachte"
      - tiles: ["Soll", "ich", "nächstes", "Mal", "etwas", "mitbringen", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Modalverb an Position 1, Infinitiv am Ende"
      - tiles: ["Wir", "reden", "später", "weiter", ",", "ja", "?"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "weiterreden: weiter am Satzende"

  - id: B4
    block: B
    type: true-false
    title: "Den Aushang zum Hoffest lesen"
    instructions: |
      > **Hoffest Lindenweg 8 — Samstag, 14. Juni**
      >
      > - Ab **15 Uhr** Kaffee und Kuchen, ab **18 Uhr** Grill.
      > - **Der Grill wird gestellt.** Fleisch, Gemüse und Getränke
      >   bitte **selbst mitbringen**.
      > - Eine **Liste hängt am Briefkasten**: Bitte eintragen, was ihr
      >   mitbringt, damit wir nicht zehn Nudelsalate haben.
      > - Es gibt einen **vegetarischen Grillbereich** — bitte darauf
      >   achten.
      > - **Bis 22 Uhr** im Hof, danach bitte in die Wohnungen
      >   (Ruhezeit).
      > - **Kinder** sind willkommen; die Aufsicht bleibt bei den
      >   Eltern.
      > - Aufbau **ab 14 Uhr**, Abbau gemeinsam. Wer helfen kann, meldet
      >   sich bei Familie Kern (2. OG).

      Richtig (R) oder falsch (F)?
    instructionsEn: "True (R) or false (F)?"
    items:
      - q: "Man muss keinen eigenen Grill mitbringen. — You don't need to bring your own grill."
        answer: true
        why: "„Der Grill wird gestellt.“"
      - q: "Die Getränke stellt die Hausgemeinschaft. — Drinks are provided by the residents' group."
        answer: false
        why: "Getränke bringt jeder selbst mit."
      - q: "Man soll vorher eintragen, was man mitbringt. — You should write down beforehand what you'll bring."
        answer: true
        why: "„Eine Liste hängt am Briefkasten: Bitte eintragen, was ihr mitbringt.“"
      - q: "Um 23 Uhr darf man noch im Hof sitzen. — At 11 pm you can still sit in the courtyard."
        answer: false
        why: "Nur bis 22 Uhr, danach gilt die Ruhezeit."
      - q: "Für vegetarisches Essen ist ein eigener Bereich vorgesehen. — There's a separate area for vegetarian food."
        answer: true
        why: "„Es gibt einen vegetarischen Grillbereich.“"
      - q: "Die Nachbarn passen gemeinsam auf die Kinder auf. — The neighbours look after the children together."
        answer: false
        why: "„Die Aufsicht bleibt bei den Eltern.“"

  # ── Block C — Wenn es schiefgeht ──────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Unangenehme Momente"
    instructions: "Wähle die beste Reaktion."
    instructionsEn: "Choose the best reaction."
    items:
      - q: "Jemand fragt zum dritten Mal, wo du „wirklich“ herkommst. — Someone asks a third time where you're 'really' from."
        options:
          - { key: a, text: "Aus Porto — und inzwischen aus dem dritten Stock. Wie lange wohnst du schon hier?" }
          - { key: b, text: "Das habe ich doch schon gesagt." }
          - { key: c, text: "Warum fragst du das dauernd?" }
        answer: a
        why: "Kurz antworten und den Ball zurückspielen — das beendet die Schleife, ohne den Abend zu kippen."
      - q: "Du hast den Namen deines Gegenübers vergessen. — You've forgotten the other person's name."
        options:
          - { key: a, text: "Den Namen vermeiden." }
          - { key: b, text: "Entschuldige, wie war noch mal dein Name? Ich bin schlecht mit Namen." }
          - { key: c, text: "Jemand anderen fragen." }
        answer: b
        why: "Direkt fragen ist normal und in fünf Sekunden erledigt; Vermeiden dauert den ganzen Abend."
      - q: "Man lobt dein Deutsch, obwohl du gerade einen Fehler gemacht hast. — Your German is praised right after a mistake."
        options:
          - { key: a, text: "Nein, mein Deutsch ist schlecht." }
          - { key: b, text: "Danke! Es wird — die Artikel machen mir aber immer noch zu schaffen." }
          - { key: c, text: "Ich weiß." }
        answer: b
        why: "Das Lob annehmen und mit einem konkreten Punkt weitermachen — daraus wird oft ein gutes Gespräch."
      - q: "Jemand erzählt sehr lange und du kommst nicht zu Wort. — Someone talks at length and you can't get a word in."
        options:
          - { key: a, text: "Unterbrechen." }
          - { key: b, text: "Beim nächsten Punkt anknüpfen: „Das kenne ich — bei mir war das ähnlich, als …“" }
          - { key: c, text: "Weghören." }
        answer: b
        why: "An etwas Gesagtes anknüpfen ist der natürliche Weg ins Gespräch, ohne jemanden abzuschneiden."
      - q: "Du hast versehentlich etwas Falsches gesagt. — You've accidentally said something wrong."
        options:
          - { key: a, text: "Weiterreden, als wäre nichts." }
          - { key: b, text: "Lange erklären, wie du es gemeint hast." }
          - { key: c, text: "Entschuldige, das kam falsch rüber — ich meinte eigentlich …" }
        answer: c
        why: "Kurz korrigieren und weitergehen; lange Erklärungen machen aus einer Kleinigkeit ein Thema."
      - q: "Du willst gehen, ohne dich von allen zu verabschieden. — You want to leave without saying goodbye to everyone."
        options:
          - { key: a, text: "Beim Gastgeber kurz Bescheid sagen und in die Runde winken." }
          - { key: b, text: "Heimlich verschwinden." }
          - { key: c, text: "Einzeln von allen verabschieden." }
        answer: a
        why: "Beim Gastgeber abmelden ist die Regel; die Runde einzeln durchzugehen erwartet niemand."

  - id: C2
    block: C
    type: gap-text
    listLayout: true
    title: "Die richtigen Wörter"
    instructions: "Ergänze das passende Wort."
    instructionsEn: "Fill in the fitting word."
    text: |
      1. Wir kennen uns noch nicht, {1}? (angehängte Frage)
      2. Entschuldige, wie war noch mal dein {2}? (wie man heißt)
      3. Da halte ich mich {3}. (nicht mitreden)
      4. Das kam falsch {4}. (so ist es angekommen)
      5. Wir reden später {5}. (fortsetzen)
      6. Ich sage kurz beim Gastgeber {6}. (informieren: … sagen)
    answers:
      "1": oder
      "2": Name
      "3": raus
      "4": rüber
      "5": weiter
      "6": Bescheid

  # ── Block D — Wiederholung ────────────────────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Selbsttest (score yourself /12)"
    instructions: "Ergänze aus dem Gedächtnis."
    instructionsEn: "Fill in from memory."
    text: |
      1. Wir kennen uns noch nicht, {1}? (right? / don't we)
      2. Woher kommst du {2}? (originally)
      3. Ich wohne {3} drei Jahren hier. (for — since)
      4. Ich bin {4} drei Jahren hergezogen. (three years ago)
      5. Ich bleibe erst mal {5} ein Jahr. (for — planned duration)
      6. Ich habe vorher in Lyon {6}. (lived — Partizip)
      7. Wie {7}! (how interesting)
      8. Am Anfang war es schwerer, {8} ich dachte. (than)
      9. {9} ich etwas mitbringen? (shall I)
      10. Da halte ich mich {10}. (out of it)
      11. Wir reden später {11}. (carry on)
      12. Ich sage kurz {12}. (let them know)
    answers:
      "1": oder
      "2": ursprünglich
      "3": seit
      "4": vor
      "5": für
      "6": gelebt
      "7": interessant
      "8": als
      "9": Soll
      "10": raus
      "11": weiter
      "12": Bescheid

  - id: D2
    block: D
    type: free-write
    title: "Rollenspiel: ein Abend im Hof"
    prompt: "Schreib die Gespräche eines Hoffestes. 14–18 Sätze."
    stimulus: |
      Du wohnst seit letztem Sommer im dritten Stock. Vorher hast du zwei
      Jahre in Lyon gelebt, ursprünglich kommst du aus Porto. Beim
      Hoffest kennst du fast niemanden.

      Diese Momente müssen vorkommen:
      1. dich jemandem vorstellen
      2. gefragt werden, woher du kommst, und antworten
      3. sagen, seit wann du hier bist
      4. eine Rückfrage stellen, statt nur zu antworten
      5. Interesse zeigen („Wie interessant!“, „Erzähl weiter!“)
      6. nach dem vergessenen Namen fragen
      7. einem heiklen Thema ausweichen
      8. anbieten, nächstes Mal etwas mitzubringen
      9. dich beim Gastgeber abmelden
    use:
      - "du-Form durchgehend"
      - "`seit`, `vor` und `für` je einmal richtig"
      - "Perfekt für das, was vorher war"
      - "`Wir reden später weiter, ja?`"
    selfCheck:
      - "Hast du seit + Präsens, vor + Perfekt/Präteritum und für + Plan unterschieden?"
      - "Stellst du selbst mindestens zwei Fragen zurück?"
      - "Ist der Ausstieg freundlich formuliert?"
      - "Kommen alle 9 Momente vor?"
    model: |
      Ich: Hallo! Wir kennen uns noch nicht, oder? Ich bin Carla, dritter Stock rechts.
      Tobias: Hi, ich bin Tobias, zweiter Stock. Willkommen! Wie lange bist du schon hier?
      Ich: Seit letztem Sommer. Und du?
      Tobias: Ich bin hier praktisch geboren. Und woher kommst du ursprünglich?
      Ich: Aus Porto. Ich habe aber vorher zwei Jahre in Lyon gelebt.
      Tobias: Wie interessant! Und wie bist du nach Deutschland gekommen?
      Ich: Über die Arbeit. Ich bin vor drei Jahren hergezogen, erst mal nur für ein Jahr — daraus sind jetzt drei geworden.
      Tobias: Das kenne ich, das geht vielen so. Und wie gefällt es dir?
      Ich: Inzwischen sehr gut. Am Anfang war die Sprache schwerer, als ich dachte. Die Artikel machen mir immer noch zu schaffen.
      Tobias: Dein Deutsch ist aber richtig gut.
      Ich: Danke! Es wird. — Entschuldige, wie war noch mal dein Name? Ich bin schlecht mit Namen.
      Tobias: Tobias. Kein Problem.
      (später)
      Jemand: Und was sagst du zu der Sache mit der Stadtpolitik?
      Ich: Puh, da halte ich mich raus. Apropos Hof — weiß jemand, ob wir das Fest nächstes Jahr wieder machen?
      Tobias: Auf jeden Fall, das ist Tradition.
      Ich: Dann bringe ich nächstes Mal etwas mit. Soll ich einen Salat machen, oder gibt es davon schon genug?
      Tobias: Salat ist immer gut, trag dich einfach in die Liste ein.
      Ich: Mache ich. — Du, ich sage kurz beim Gastgeber Bescheid, ich muss morgen früh raus. Wir reden beim nächsten Mal weiter, ja?
      Tobias: Klar, schön, dich kennengelernt zu haben!
