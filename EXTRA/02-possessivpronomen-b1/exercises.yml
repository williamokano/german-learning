lesson: "EX/02-possessivpronomen-b1"
title: "Possessivpronomen substantivisch & Genitiv der Possession — B1"
topic: "Possessivpronomen (mein, dein, sein, ihr, unser, euer, Ihr)"
level: B1
intro: >
  Standalone drill set, not tied to any lesson. Two new pieces on top of
  the A1/A2 sets: (1) the possessive used ON ITS OWN, without a noun
  (Ist das dein Buch? — Nein, das ist meins) — this declines like
  dieser, not like ein, so the masculine Nominativ and neuter forms
  differ from the article you already know (meiner, meins/meines —
  feminine and plural stay identical to the article: meine). (2) the
  Genitiv of possession (das Auto meines Vaters), including weak nouns
  that keep their -n even in the Genitiv (meines Nachbarn, not
  meines Nachbars). Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "meiner — die Possessivpronomen-Tabelle (ohne Nomen)"
    instructions: "Ergänze die Tabelle. Anders als der Artikel dekliniert das Possessivpronomen wie dieser."
    instructionsEn: "Complete the table. Unlike the article, the standalone possessive pronoun declines like dieser — note maskulin Nominativ (-er) and neutral (-(e)s), which differ from mein Bruder / mein Kind."
    columns: ["", "maskulin", "feminin", "neutral", "Plural"]
    rows:
      - label: "Nominativ"
        cells:
          - { gap: 1, answer: "meiner" }
          - { gap: 2, answer: "meine" }
          - { gap: 3, answer: ["meins", "meines"] }
          - { gap: 4, answer: "meine" }
      - label: "Akkusativ"
        cells:
          - { gap: 5, answer: "meinen" }
          - { gap: 6, answer: "meine" }
          - { gap: 7, answer: ["meins", "meines"] }
          - { gap: 8, answer: "meine" }
      - label: "Dativ"
        cells:
          - { gap: 9, answer: "meinem" }
          - { gap: 10, answer: "meiner" }
          - { gap: 11, answer: "meinem" }
          - { gap: 12, answer: "meinen" }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Dialoge: wessen ist das?"
    instructions: "Ergänze das substantivische Possessivpronomen (ohne Nomen)."
    instructionsEn: "Fill in the standalone possessive pronoun (no noun follows it)."
    text: |
      1. Ist das dein Buch? — Nein, das ist {1}.
      2. Ist das deine Tasche? — Nein, das ist {2}.
      3. Ist das euer Auto? — Nein, das ist {3}.
      4. Sind das deine Schlüssel? — Nein, das sind {4}.
      5. Ist das sein Hund? — Ja, das ist {5}.
      6. Ist das ihre Wohnung? — Nein, das ist {6}.
    answers:
      "1": meins
      "2": meine
      "3": unseres
      "4": meine
      "5": seiner
      "6": meine

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein Familientreffen (Genitiv)"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten."
    instructionsEn: "Fill the 8 gaps using the words in the box — Genitiv possessive forms."
    text: |
      Am Sonntag treffen wir uns bei meiner Oma. Das Haus {1} Oma ist sehr
      groß. Vor der Tür steht das Auto {2} Vaters — er ist mit dem neuen
      Wagen gekommen. Meine Tante bringt den Kuchen {3} Tochter mit, die
      gestern Geburtstag hatte. Der Hund {4} Bruders läuft im Garten
      herum. Die Spielsachen {5} Kinder liegen überall verteilt — wir
      haben ja alle Kinder mitgebracht. Meine Cousine zeigt uns die Fotos
      {6} Reise nach Italien. Am Ende des Tages nehmen wir die Fotos {7}
      Familie und fahren mit dem Auto {8} Onkels wieder nach Hause.
    bank: [meiner, meines, ihrer, meines, unserer, ihrer, unserer, meines, deiner, seines]
    answers:
      "1": meiner
      "2": meines
      "3": ihrer
      "4": meines
      "5": unserer
      "6": ihrer
      "7": unserer
      "8": meines

  - id: B2
    block: B
    type: single-choice
    title: "Genitiv der Possession"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Das ist das Fahrrad ___ Schwester."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "Genitiv feminin → meiner."
      - q: "Wie heißt der Hund ___ Nachbarn?"
        options: [{ key: a, text: "meines" }, { key: b, text: "meinen" }, { key: c, text: "meiner" }]
        answer: a
        why: "Genitiv maskulin → meines. Nachbar ist ein schwacher Nomen und behält -n auch im Genitiv (meines Nachbarn, nicht meines Nachbars)."
      - q: "Das Büro ___ Chefin ist im dritten Stock."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "Genitiv feminin → meiner."
      - q: "Die Farbe ___ Autos gefällt mir nicht."
        options: [{ key: a, text: "mein" }, { key: b, text: "meines" }, { key: c, text: "meinem" }]
        answer: b
        why: "Genitiv neutrum → meines; das Nomen bekommt zusätzlich -s (Autos)."
      - q: "Das sind die Spielsachen ___ Kinder."
        options: [{ key: a, text: "unsere" }, { key: b, text: "unseren" }, { key: c, text: "unserer" }]
        answer: c
        why: "Genitiv Plural → unserer."
      - q: "Kennst du den Freund ___ Bruders?"
        options: [{ key: a, text: "mein" }, { key: b, text: "meinen" }, { key: c, text: "meines" }]
        answer: c
        why: "Genitiv maskulin → meines."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Wessen ist das?"
    instructions: "Choose the correct word for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Ist das dein Mantel? — Ja, das ist ___."
        options: [{ key: a, text: "mein" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "Substantivisch, maskulin Nominativ → meiner."
      - q: "Sind das eure Fahrräder? — Nein, das sind nicht ___."
        options: [{ key: a, text: "unser" }, { key: b, text: "unsere" }, { key: c, text: "unseren" }]
        answer: b
        why: "Substantivisch, Plural → unsere."
      - q: "Welches Auto ist deins? — Das rote ist ___."
        options: [{ key: a, text: "mein" }, { key: b, text: "meins" }, { key: c, text: "meinen" }]
        answer: b
        why: "Substantivisch, neutral → meins (nicht mein — das Artikel-'mein' braucht ein Nomen)."
      - q: "Das Büro ___ neuen Kollegin ist gleich neben meinem."
        options: [{ key: a, text: "meiner" }, { key: b, text: "meine" }, { key: c, text: "meinen" }]
        answer: a
        why: "Genitiv feminin → meiner."
      - q: "Ich habe meinen Regenschirm vergessen. Kannst du mir ___ leihen?"
        options: [{ key: a, text: "deiner" }, { key: b, text: "deins" }, { key: c, text: "deinen" }]
        answer: c
        why: "Substantivisch, maskulin Akkusativ → deinen (gleiche Form wie der Artikel im Akkusativ)."
      - q: "Wessen Tasche ist das? Ist das ___?"
        options: [{ key: a, text: "dein" }, { key: b, text: "deine" }, { key: c, text: "deinen" }]
        answer: b
        why: "Substantivisch, feminin → deine (gleiche Form wie der Artikel)."
      - q: "Das Restaurant ___ Eltern ist sehr bekannt in der Stadt."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "Genitiv Plural → meiner."
      - q: "Unser Auto ist in der Werkstatt. Können wir ___ benutzen?"
        options: [{ key: a, text: "euer" }, { key: b, text: "eures" }, { key: c, text: "eurem" }]
        answer: b
        why: "Substantivisch, neutral Akkusativ → eures."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Der Flohmarkt (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Auf dem Flohmarkt verkauft jeder seine alten Sachen. Ich verkaufe
      {1} altes Fahrrad — es war {2} seit der Schulzeit. Meine Schwester
      verkauft die Bücher {3} Studiums. Mein Bruder hat einen Stand neben
      {4}. Er verkauft die Spielsachen {5} Kinder, die schon zu groß dafür
      sind. „Ist das dein Stand?", fragt ein Kunde. „Nein", sage ich, „das
      ist {6}." Am Ende des Tages zählen wir das Geld {7} Standes. Meine
      Schwester hat mehr verkauft als ich, aber ich bin trotzdem zufrieden
      mit dem Ergebnis {8} kleinen Marktstands. Wir freuen uns über den
      Erfolg {9} kleinen Marktes und planen schon den nächsten Flohmarkt
      {10} Straße.
    bank: [MEIN, MEINS, IHRES, MEINEM, SEINER, MEINER, MEINES, MEINES, UNSERES, UNSERER, DEINS, IHRER, UNSEREN]
    answers:
      "1": MEIN
      "2": MEINS
      "3": IHRES
      "4": MEINEM
      "5": SEINER
      "6": MEINER
      "7": MEINES
      "8": MEINES
      "9": UNSERES
      "10": UNSERER

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung: substantivisch und Genitiv"
    instructions: "Ergänze das Possessivpronomen — entweder substantivisch (ohne Nomen) oder im Genitiv (vor einem Nomen)."
    instructionsEn: "Fill in the possessive — either standalone (no noun follows) or Genitiv (before a noun)."
    text: |
      1. Ist das dein Handy? — Nein, das ist {1}.
      2. Das Auto {2} Chefs steht vor der Firma.
      3. Wessen Jacke ist das? — Das ist {3}.
      4. Die Meinung {4} Kollegen ist mir wichtig.
      5. Welcher Koffer ist deiner? — {5} ist der blaue.
      6. Das Zimmer {6} Tochter ist im ersten Stock.
    answers:
      "1": meins
      "2": meines
      "3": ihre
      "4": meiner
      "5": Meiner
      "6": meiner
    notes: "Satz 1/3/5: substantivisch (kein Nomen danach). Satz 2/4/6: Genitiv (steht vor einem Nomen)."

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ist das euer Haus? — Ja, das ist ___."
        options: [{ key: a, text: "unser" }, { key: b, text: "unseres" }, { key: c, text: "unserer" }]
        answer: b
        why: "Substantivisch, neutral → unseres."
      - q: "Der Schreibtisch ___ Chefin ist immer aufgeräumt."
        options: [{ key: a, text: "meine" }, { key: b, text: "meiner" }, { key: c, text: "meinen" }]
        answer: b
        why: "Genitiv feminin → meiner."
      - q: "Welche Tasche ist deine? — ___ ist die schwarze."
        options: [{ key: a, text: "Meins" }, { key: b, text: "Meine" }, { key: c, text: "Meiner" }]
        answer: b
        why: "Substantivisch, feminin → Meine."
      - q: "Das ist nicht sein Fehler, das ist ___."
        options: [{ key: a, text: "meiner" }, { key: b, text: "meins" }, { key: c, text: "meine" }]
        answer: a
        why: "der Fehler ist maskulin; substantivisch Nominativ → meiner."
      - q: "Die Fotos ___ Reise sind wunderschön."
        options: [{ key: a, text: "unserer" }, { key: b, text: "unseren" }, { key: c, text: "unsere" }]
        answer: a
        why: "Genitiv feminin → unserer."
      - q: "Ist das dein Schlüssel? — Nein, ich glaube, das ist ___."
        options: [{ key: a, text: "ihre" }, { key: b, text: "ihrer" }, { key: c, text: "ihren" }]
        answer: b
        why: "der Schlüssel ist maskulin; substantivisch Nominativ → ihrer."
    notes: "5–6 von 6 richtig? Die Personalpronomen/Possessivpronomen-Reihe ist damit abgeschlossen — weiter geht's mit der Deklination in allen Fällen."
