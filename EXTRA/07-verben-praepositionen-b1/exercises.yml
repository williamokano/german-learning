lesson: "EX/07-verben-praepositionen-b1"
title: "Erweiterte Verbliste & da-/wo-Komposita — B1"
topic: "Verben mit Kasus und Präpositionen"
level: B1
intro: >
  Standalone drill set, not tied to any lesson. Builds on the A2 set
  with more fixed-preposition verbs — including ones that take a
  Dativ preposition (Angst haben VOR, träumen VON) rather than
  Akkusativ — and the matching da(r)-/wo(r)- compounds: wovor/davor,
  wovon/davon, alongside worüber/darüber and wofür/dafür from before.
  The rule is the same regardless of case: a compound only replaces a
  THING, never a person. Blocks: A Basistraining → B Vertiefung → C
  Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Erweiterte Verbliste"
    instructions: "Ergänze die Präposition (+ Fall) und ein Beispiel."
    instructionsEn: "Fill in the preposition (+ case) and an example."
    columns: ["", "Präposition + Fall", "Beispiel"]
    rows:
      - label: "sich interessieren für"
        cells: [{ gap: 1, answer: "für + Akkusativ" }, { gap: 2, answer: "Ich interessiere mich für Musik." }]
      - label: "sich ärgern über"
        cells: [{ gap: 3, answer: "über + Akkusativ" }, { gap: 4, answer: "Ich ärgere mich über den Fehler." }]
      - label: "Angst haben vor"
        cells: [{ gap: 5, answer: "vor + Dativ" }, { gap: 6, answer: "Ich habe Angst vor Spinnen." }]
      - label: "träumen von"
        cells: [{ gap: 7, answer: "von + Dativ" }, { gap: 8, answer: "Ich träume von einer Reise." }]
      - label: "sich erinnern an"
        cells: [{ gap: 9, answer: "an + Akkusativ" }, { gap: 10, answer: "Ich erinnere mich an den Urlaub." }]
      - label: "teilnehmen an"
        cells: [{ gap: 11, answer: "an + Dativ" }, { gap: 12, answer: "Ich nehme an dem Kurs teil." }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "wovor/davor, wovon/davon"
    instructions: "Ergänze das richtige Fragewort oder da(r)-Kompositum."
    instructionsEn: "Fill in the correct question word or da(r)-compound."
    text: |
      1. Ich habe Angst vor Spinnen. {1} hast du Angst?
      2. Ich träume von einer Reise. {2} träumst du?
      3. Ich interessiere mich für Kunst. Ich interessiere mich {3}.
      4. Ich ärgere mich über den Verkehr. Ich ärgere mich {4}.
      5. Ich habe Angst vor der Prüfung. Ich habe Angst {5}.
      6. Ich träume von einem eigenen Haus. Ich träume {6}.
    answers:
      "1": Wovor
      "2": Wovon
      "3": dafür
      "4": darüber
      "5": davor
      "6": davon

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Mein neues Hobby"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Ich interessiere mich sehr {1} Fotografie. Mein Freund ärgert
      sich manchmal {2} meine vielen Fotos. Ich träume {3} einer
      eigenen Ausstellung. Manchmal habe ich Angst {4} Kritik. Ich
      erinnere mich gut {5} mein erstes Foto. Nächste Woche nehme ich
      {6} einem Fotokurs teil. Ich freue mich schon {7} den Kurs. Der
      Kursleiter interessiert sich auch {8} moderne Kunst.
    bank: [für, über, von, vor, an, an, auf, für, mit, bei]
    answers:
      "1": für
      "2": über
      "3": von
      "4": vor
      "5": an
      "6": an
      "7": auf
      "8": für

  - id: B2
    block: B
    type: single-choice
    title: "Akkusativ- oder Dativ-Kompositum?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Ich denke an meine Ferien. Ich denke ___."
        options: [{ key: a, text: "daran" }, { key: b, text: "davon" }, { key: c, text: "darüber" }]
        answer: a
        why: "denken an → daran."
      - q: "Ich träume von einem Haus. Ich träume ___."
        options: [{ key: a, text: "daran" }, { key: b, text: "davon" }, { key: c, text: "darüber" }]
        answer: b
        why: "träumen von → davon."
      - q: "Ich habe Angst vor der Prüfung. Ich habe Angst ___."
        options: [{ key: a, text: "darüber" }, { key: b, text: "davor" }, { key: c, text: "daran" }]
        answer: b
        why: "Angst haben vor → davor."
      - q: "Wir sprechen über das Wetter. Wir sprechen ___."
        options: [{ key: a, text: "darüber" }, { key: b, text: "davor" }, { key: c, text: "daran" }]
        answer: a
        why: "sprechen über → darüber."
      - q: "Ich interessiere mich für Musik. Ich interessiere mich ___."
        options: [{ key: a, text: "davor" }, { key: b, text: "dafür" }, { key: c, text: "daran" }]
        answer: b
        why: "sich interessieren für → dafür."
      - q: "Ich warte auf die Antwort. Ich warte ___."
        options: [{ key: a, text: "davon" }, { key: b, text: "darauf" }, { key: c, text: "davor" }]
        answer: b
        why: "warten auf → darauf."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Ein neues Hobby"
    instructions: "Choose the correct preposition for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Ich interessiere mich seit Kurzem ___ Yoga."
        options: [{ key: a, text: "für" }, { key: b, text: "an" }, { key: c, text: "über" }]
        answer: a
        why: "sich interessieren für."
      - q: "Meine Familie ärgert sich manchmal ___ meine neue Leidenschaft."
        options: [{ key: a, text: "für" }, { key: b, text: "an" }, { key: c, text: "über" }]
        answer: c
        why: "sich ärgern über."
      - q: "Ich träume schon ___ einem eigenen Yogastudio."
        options: [{ key: a, text: "an" }, { key: b, text: "von" }, { key: c, text: "über" }]
        answer: b
        why: "träumen von."
      - q: "Am Anfang hatte ich Angst ___ den schwierigen Übungen."
        options: [{ key: a, text: "vor" }, { key: b, text: "an" }, { key: c, text: "über" }]
        answer: a
        why: "Angst haben vor."
      - q: "Jetzt erinnere ich mich kaum noch ___ diese Angst."
        options: [{ key: a, text: "an" }, { key: b, text: "von" }, { key: c, text: "vor" }]
        answer: a
        why: "sich erinnern an."
      - q: "Nächsten Monat nehme ich ___ einem Yoga-Retreat teil."
        options: [{ key: a, text: "an" }, { key: b, text: "für" }, { key: c, text: "von" }]
        answer: a
        why: "teilnehmen an."
      - q: "Ich freue mich schon sehr ___ das Retreat."
        options: [{ key: a, text: "auf" }, { key: b, text: "über" }, { key: c, text: "an" }]
        answer: a
        why: "sich freuen auf (Zukunft)."
      - q: "Meine Lehrerin interessiert sich auch ___ Meditation."
        options: [{ key: a, text: "für" }, { key: b, text: "an" }, { key: c, text: "über" }]
        answer: a
        why: "sich interessieren für."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Der Fotokurs (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Ich interessiere mich {1} Fotografie. Mein Kursleiter fragt: „{2}
      interessierst du dich am meisten?" Ich antworte: „Ich
      interessiere mich {3} Naturfotos." Manchmal ärgere ich mich {4}
      meine eigenen Fehler. Ich träume {5} einer professionellen
      Kamera. „{6} träumst du?", fragt mein Freund. Ich erinnere mich
      noch gut {7} meinen ersten Kurs. Ich hatte damals Angst {8} den
      anderen Teilnehmern. „{9} hattest du Angst?", fragt er. Heute
      nehme ich gerne {10} jedem Kurs teil.
    bank: [FÜR, WOFÜR, DAFÜR, ÜBER, VON, WOVON, AN, VOR, WOVOR, AN, MIT, BEI, DAMIT]
    answers:
      "1": FÜR
      "2": WOFÜR
      "3": DAFÜR
      "4": ÜBER
      "5": VON
      "6": WOVON
      "7": AN
      "8": VOR
      "9": WOVOR
      "10": AN

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das richtige Fragewort oder da(r)-Kompositum."
    text: |
      1. Ich habe Angst vor Prüfungen. {1} hast du Angst?
      2. Ich interessiere mich für Sprachen. Ich interessiere mich {2}.
      3. Er träumt von einer Weltreise. Er träumt {3}.
      4. Sie ärgert sich über den Stau. Sie ärgert sich {4}.
      5. Wir nehmen an einem Projekt teil. Wir nehmen {5} teil.
      6. Ich erinnere mich an meine Kindheit. Ich erinnere mich {6}.
    answers:
      "1": Wovor
      "2": dafür
      "3": davon
      "4": darüber
      "5": daran
      "6": daran

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich interessiere mich für Kunst. Ich interessiere mich ___."
        options: [{ key: a, text: "dafür" }, { key: b, text: "davor" }, { key: c, text: "daran" }]
        answer: a
        why: "sich interessieren für → dafür."
      - q: "Sie hat Angst vor Hunden. Sie hat Angst ___."
        options: [{ key: a, text: "daran" }, { key: b, text: "davor" }, { key: c, text: "darüber" }]
        answer: b
        why: "Angst haben vor → davor."
      - q: "Wir träumen von einem Haus am Meer. Wir träumen ___."
        options: [{ key: a, text: "daran" }, { key: b, text: "davon" }, { key: c, text: "darüber" }]
        answer: b
        why: "träumen von → davon."
      - q: "Ich ärgere mich über die Verspätung. Ich ärgere mich ___."
        options: [{ key: a, text: "darüber" }, { key: b, text: "davor" }, { key: c, text: "dafür" }]
        answer: a
        why: "sich ärgern über → darüber."
      - q: "Er nimmt an einem Kurs teil. ___ nimmt er teil?"
        options: [{ key: a, text: "Wovon" }, { key: b, text: "Woran" }, { key: c, text: "Wofür" }]
        answer: b
        why: "teilnehmen an → Woran."
      - q: "Ich erinnere mich an den Tag genau. Ich erinnere mich genau ___."
        options: [{ key: a, text: "daran" }, { key: b, text: "davon" }, { key: c, text: "darüber" }]
        answer: a
        why: "sich erinnern an → daran."
    notes: "5–6 von 6 richtig, und alle Verben-Übungen (A1/A2/B1) sauber gelöst? Dann sitzt die feste Verb-Präposition-Verbindung mit ihren wo-/da-Komposita."
