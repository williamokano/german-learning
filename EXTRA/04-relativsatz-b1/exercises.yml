lesson: "EX/04-relativsatz-b1"
title: "Relativsätze: Dativ, Präpositionen, was/wo — B1"
topic: "Relativsätze und Relativpronomen"
level: B1
intro: >
  Standalone drill set, not tied to any lesson. Builds on the A2 set
  with what's left: the Dativ relative pronoun (note the Plural is
  denen, not den), relative clauses after a preposition (mit dem, bei
  denen, auf die …), and was/wo — was after alles/etwas/nichts/vieles,
  a superlative-as-noun, or a whole preceding clause; wo for places.
  Blocks: A Basistraining → B Vertiefung → C Sprachbausteine → D
  Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "Die Relativpronomen-Tabelle (mit Dativ)"
    instructions: "Ergänze die Tabelle. Achtung: der Dativ Plural ist denen, nicht den."
    instructionsEn: "Complete the table. Note the Dativ Plural is denen, not den."
    columns: ["", "maskulin", "feminin", "neutral", "Plural"]
    rows:
      - label: "Nominativ"
        cells: [{ gap: 1, answer: "der" }, { gap: 2, answer: "die" }, { gap: 3, answer: "das" }, { gap: 4, answer: "die" }]
      - label: "Akkusativ"
        cells: [{ gap: 5, answer: "den" }, { gap: 6, answer: "die" }, { gap: 7, answer: "das" }, { gap: 8, answer: "die" }]
      - label: "Dativ"
        cells: [{ gap: 9, answer: "dem" }, { gap: 10, answer: "der" }, { gap: 11, answer: "dem" }, { gap: 12, answer: "denen" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Dativ und Präpositionen im Relativsatz"
    instructions: "Ergänze das richtige Relativpronomen."
    instructionsEn: "Fill in the correct relative pronoun."
    text: |
      1. Ich habe einen Freund, {1} ich vertraue.
      2. Das ist eine Kollegin, {2} ich sehr dankbar bin.
      3. Ich kenne einen Mann, mit {3} ich früher gearbeitet habe.
      4. Das ist ein Kind, {4} das Spielzeug gehört.
      5. Wir haben Nachbarn, bei {5} wir oft zu Besuch sind.
      6. Ich habe eine Schwester, von {6} ich viel gelernt habe.
    answers:
      "1": dem
      "2": der
      "3": dem
      "4": dem
      "5": denen
      "6": der
    notes: "Satz 5: Plural im Dativ ist denen, nicht den — ein häufiger Fehler."

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Die Ärztin"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Die Ärztin hat viele Patienten, {1} sie gerne hilft. Heute kommt
      ein Mann, {2} sie schon lange vertraut. Er hat Rückenschmerzen, an
      {3} er seit Wochen leidet. Ein Kind, {4} das Spielzeug fehlt,
      weint im Wartezimmer. Die Ärztin hat einen Kollegen, {5} sie sehr
      vertraut. Am Nachmittag kommen weitere Kinder, {6} die
      Untersuchung Angst macht. Die Ärztin, {7} alle vertrauen, arbeitet
      bis spät am Abend. Ihre Praxis, in {8} viele Menschen behandelt
      werden, ist immer voll.
    bank: [denen, dem, denen, dem, dem, denen, der, der, den, die]
    answers:
      "1": denen
      "2": dem
      "3": denen
      "4": dem
      "5": dem
      "6": denen
      "7": der
      "8": der

  - id: B2
    block: B
    type: single-choice
    title: "was oder wo?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Das ist alles, ___ ich weiß."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "wo" }]
        answer: b
        why: "was nach alles."
      - q: "Die Stadt, ___ ich geboren bin, heißt Salvador."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "wo" }]
        answer: c
        why: "wo für einen Ort."
      - q: "Er hat die Prüfung bestanden, ___ mich sehr freut."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was bezieht sich auf den ganzen vorherigen Satz, nicht auf ein einzelnes Nomen."
      - q: "Das ist das Beste, ___ mir je passiert ist."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was nach einem Superlativ als Nomen (das Beste)."
      - q: "Ich komme aus einer kleinen Stadt, ___ es nur eine Schule gibt."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "wo" }]
        answer: c
        why: "wo für einen Ort."
      - q: "Nichts, ___ er sagt, ist wahr."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was nach nichts."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Meine Reise nach Wien"
    instructions: "Choose the correct word for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Ich habe eine Reise gebucht, auf ___ ich mich sehr freue."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "den" }]
        answer: a
        why: "sich freuen auf + Akkusativ feminin → die."
      - q: "Wien ist eine Stadt, ___ ich schon lange besuchen möchte."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "den" }]
        answer: a
        why: "besuchen + Akkusativ feminin → die."
      - q: "Ich habe ein Hotel gefunden, ___ mir sehr gefällt."
        options: [{ key: a, text: "das" }, { key: b, text: "dem" }, { key: c, text: "den" }]
        answer: a
        why: "Subjekt von gefällt (Nominativ neutrum) → das."
      - q: "Das ist alles, ___ ich für die Reise brauche."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was nach alles."
      - q: "Ich freue mich auf die Leute, ___ ich dort treffen werde."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "den" }]
        answer: a
        why: "treffen + Akkusativ Plural → die."
      - q: "Wien, ___ ich schon viel gehört habe, soll wunderschön sein."
        options: [{ key: a, text: "das" }, { key: b, text: "von dem" }, { key: c, text: "der" }]
        answer: b
        why: "hören von + Dativ; Städtenamen sind grammatisch neutrum → von dem."
      - q: "Es gibt ein Museum, ___ ich unbedingt besuchen will."
        options: [{ key: a, text: "das" }, { key: b, text: "dem" }, { key: c, text: "den" }]
        answer: a
        why: "besuchen + Akkusativ neutrum → das."
      - q: "Das ist das Schönste, ___ ich in dieser Stadt gesehen habe."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was nach einem Superlativ als Nomen (das Schönste)."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Reisepläne (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Ich habe einen Freund, {1} ich oft schreibe. Er wohnt in einer
      Stadt, {2} es viele Museen gibt. Letzte Woche hat er mir etwas
      erzählt, {3} mich sehr überrascht hat. Er plant eine Reise, auf
      {4} er sich schon lange freut. Die Person, mit {5} er reisen
      möchte, ist seine Schwester. Sie haben ein Ziel, {6} beide seit
      Jahren besuchen wollen. Das ist das Beste, {7} ihm seit Langem
      passiert ist. Ich wünsche ihm alles Gute, {8} er sich für diese
      Reise wünscht. Die Stadt, {9} sie hinfahren, heißt Lissabon.
      Nichts, {10} ich sage, kann seine Vorfreude bremsen.
    bank: [DEM, WO, WAS, DIE, DER, DAS, WAS, WAS, WO, WAS, DEN, DENEN, DESSEN]
    answers:
      "1": DEM
      "2": WO
      "3": WAS
      "4": DIE
      "5": DER
      "6": DAS
      "7": WAS
      "8": WAS
      "9": WO
      "10": WAS

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das richtige Relativpronomen oder was/wo."
    text: |
      1. Ich habe eine Kollegin, {1} ich sehr vertraue.
      2. Das ist ein Kind, {2} ich geholfen habe.
      3. Die Firma, bei {3} ich arbeite, ist sehr modern.
      4. Ich komme aus einem Dorf, {4} jeder jeden kennt.
      5. Er hat mir etwas gesagt, {5} mich beunruhigt hat.
      6. Das ist das Einzige, {6} mir wichtig ist.
      7. Meine Nachbarn, {7} ich oft helfe, sind sehr dankbar.
    answers:
      "1": der
      "2": dem
      "3": der
      "4": wo
      "5": was
      "6": was
      "7": denen

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich habe einen Chef, ___ ich sehr respektiere."
        options: [{ key: a, text: "den" }, { key: b, text: "dem" }, { key: c, text: "der" }]
        answer: a
        why: "respektieren + Akkusativ → den."
      - q: "Das ist die Firma, bei ___ ich arbeite."
        options: [{ key: a, text: "der" }, { key: b, text: "die" }, { key: c, text: "den" }]
        answer: a
        why: "bei + Dativ feminin → der."
      - q: "Er hat mir etwas erzählt, ___ mich froh gemacht hat."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was nach etwas."
      - q: "Ich komme aus einer Stadt, ___ es viel Kultur gibt."
        options: [{ key: a, text: "die" }, { key: b, text: "der" }, { key: c, text: "wo" }]
        answer: c
        why: "wo für einen Ort."
      - q: "Das sind meine Freunde, ___ ich vertraue."
        options: [{ key: a, text: "die" }, { key: b, text: "denen" }, { key: c, text: "den" }]
        answer: b
        why: "vertrauen + Dativ Plural → denen."
      - q: "Das ist alles, ___ ich brauche."
        options: [{ key: a, text: "das" }, { key: b, text: "was" }, { key: c, text: "die" }]
        answer: b
        why: "was nach alles."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B2-Version (Genitiv-Relativpronomen dessen/deren). Weniger als 5? Schau dir Block A noch einmal an."
