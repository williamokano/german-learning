lesson: "EX/08-perfekt-sein-haben-a1"
title: "Perfekt: sein oder haben? — A1"
topic: "Perfekt: sein oder haben, Partizip II"
level: A1
intro: >
  Standalone drill set, not tied to any lesson. Most verbs take haben in
  the Perfekt — it's the default. sein is the exception, reserved for
  verbs of MOTION (gehen, kommen, fahren) and CHANGE OF STATE (aufstehen,
  einschlafen), plus a short list of exceptions (sein, bleiben, werden,
  passieren). Blocks: A Basistraining (the reference table, then
  auxiliary-only) → B Vertiefung → C Sprachbausteine → D Wiederholung.
  Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: conjugation
    title: "Partizip II und Hilfsverb"
    instructions: "Ergänze das Partizip II und das Hilfsverb (haben oder sein)."
    instructionsEn: "Fill in the Partizip II and the auxiliary (haben or sein)."
    columns: ["", "Partizip II", "Hilfsverb"]
    rows:
      - label: "machen"
        cells: [{ gap: 1, answer: "gemacht" }, { gap: 2, answer: "haben" }]
      - label: "spielen"
        cells: [{ gap: 3, answer: "gespielt" }, { gap: 4, answer: "haben" }]
      - label: "gehen"
        cells: [{ gap: 5, answer: "gegangen" }, { gap: 6, answer: "sein" }]
      - label: "kommen"
        cells: [{ gap: 7, answer: "gekommen" }, { gap: 8, answer: "sein" }]
      - label: "sehen"
        cells: [{ gap: 9, answer: "gesehen" }, { gap: 10, answer: "haben" }]
      - label: "essen"
        cells: [{ gap: 11, answer: "gegessen" }, { gap: 12, answer: "haben" }]
      - label: "trinken"
        cells: [{ gap: 13, answer: "getrunken" }, { gap: 14, answer: "haben" }]
      - label: "fahren"
        cells: [{ gap: 15, answer: "gefahren" }, { gap: 16, answer: "sein" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: conjugation
    title: "haben oder sein? (Partizip ist schon da)"
    instructions: "Ergänze das richtige Hilfsverb."
    instructionsEn: "Fill in the correct auxiliary — the participle is already given."
    text: |
      1. Ich {1} gestern ins Kino gegangen.
      2. Wir {2} einen Film gesehen.
      3. Er {3} spät nach Hause gekommen.
      4. Sie {4} viel Wasser getrunken.
      5. Die Kinder {5} im Park gespielt.
      6. Ich {6} mit dem Bus gefahren.
    answers:
      "1": bin
      "2": haben
      "3": ist
      "4": hat
      "5": haben
      "6": bin

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Mein Tag"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Gestern {1} ich früh aufgestanden. Ich {2} geduscht und dann
      Frühstück gemacht. Danach {3} ich zur Arbeit gefahren. Am Mittag
      {4} ich mit meinen Kollegen gegessen. Nach der Arbeit {5} ich
      einkaufen gegangen. Zu Hause {6} ich Musik gehört. Am Abend {7}
      meine Freunde zu Besuch gekommen. Wir {8} bis spät geredet.
    bank: [bin, habe, bin, habe, bin, habe, sind, haben, ist, hat]
    answers:
      "1": bin
      "2": habe
      "3": bin
      "4": habe
      "5": bin
      "6": habe
      "7": sind
      "8": haben

  - id: B2
    block: B
    type: single-choice
    title: "Welches Hilfsverb passt?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Ich ___ ein neues Buch gekauft."
        options: [{ key: a, text: "bin" }, { key: b, text: "habe" }, { key: c, text: "ist" }]
        answer: b
        why: "kaufen: kein Bewegungsverb → haben."
      - q: "Er ___ nach Berlin gefahren."
        options: [{ key: a, text: "hat" }, { key: b, text: "ist" }, { key: c, text: "habe" }]
        answer: b
        why: "fahren: Bewegungsverb → sein."
      - q: "Wir ___ den ganzen Tag gearbeitet."
        options: [{ key: a, text: "sind" }, { key: b, text: "haben" }, { key: c, text: "hat" }]
        answer: b
        why: "arbeiten: kein Bewegungsverb → haben."
      - q: "Sie ist gestern um sieben Uhr ___."
        options: [{ key: a, text: "aufgewacht" }, { key: b, text: "aufgewachen" }, { key: c, text: "aufwachen" }]
        answer: a
        why: "Partizip II von aufwachen → aufgewacht (schwaches Verb: ge-…-t)."
      - q: "Die Gäste ___ pünktlich gekommen."
        options: [{ key: a, text: "haben" }, { key: b, text: "hat" }, { key: c, text: "sind" }]
        answer: c
        why: "kommen: Bewegungsverb, Plural → sind."
      - q: "Ich ___ das Fenster geöffnet."
        options: [{ key: a, text: "bin" }, { key: b, text: "habe" }, { key: c, text: "ist" }]
        answer: b
        why: "öffnen: kein Bewegungsverb → haben."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Ein Ausflug"
    instructions: "Choose the correct auxiliary for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Am Samstag ___ wir einen Ausflug gemacht."
        options: [{ key: a, text: "haben" }, { key: b, text: "sind" }, { key: c, text: "hat" }]
        answer: a
        why: "machen → haben."
      - q: "Wir ___ mit dem Zug gefahren."
        options: [{ key: a, text: "haben" }, { key: b, text: "sind" }, { key: c, text: "hat" }]
        answer: b
        why: "fahren → sein."
      - q: "In der Stadt ___ wir ein Museum besucht."
        options: [{ key: a, text: "sind" }, { key: b, text: "hat" }, { key: c, text: "haben" }]
        answer: c
        why: "besuchen → haben."
      - q: "Danach ___ ich ein Eis gegessen."
        options: [{ key: a, text: "habe" }, { key: b, text: "bin" }, { key: c, text: "hat" }]
        answer: a
        why: "essen → haben."
      - q: "Meine Schwester ___ Fotos gemacht."
        options: [{ key: a, text: "ist" }, { key: b, text: "haben" }, { key: c, text: "hat" }]
        answer: c
        why: "machen → haben."
      - q: "Am Abend ___ wir müde nach Hause gekommen."
        options: [{ key: a, text: "sind" }, { key: b, text: "haben" }, { key: c, text: "hat" }]
        answer: a
        why: "kommen → sein."
      - q: "Ich ___ sofort eingeschlafen."
        options: [{ key: a, text: "hat" }, { key: b, text: "bin" }, { key: c, text: "habe" }]
        answer: b
        why: "einschlafen: Zustandswechsel → sein."
      - q: "Es ___ ein schöner Tag gewesen."
        options: [{ key: a, text: "hat" }, { key: b, text: "haben" }, { key: c, text: "ist" }]
        answer: c
        why: "sein → sein (Ausnahme, immer sein als Hilfsverb)."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Meine Woche (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Am Montag {1} ich früh aufgestanden. Ich {2} zur Arbeit gefahren.
      Am Dienstag {3} wir ein wichtiges Meeting gehabt. Am Mittwoch {4}
      ich krank geworden. Ich {5} zu Hause geblieben. Am Donnerstag {6}
      es mir besser gegangen. Meine Kollegen {7} mich angerufen. Am
      Freitag {8} ich wieder gearbeitet. Am Wochenende {9} wir Freunde
      besucht. Wir {10} viel gelacht.
    bank: [BIN, BIN, HABEN, BIN, BIN, IST, HABEN, HABE, HABEN, HABEN, BIST, SEID, HAST]
    answers:
      "1": BIN
      "2": BIN
      "3": HABEN
      "4": BIN
      "5": BIN
      "6": IST
      "7": HABEN
      "8": HABE
      "9": HABEN
      "10": HABEN

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das richtige Hilfsverb."
    text: |
      1. Ich {1} heute Morgen spät aufgewacht.
      2. Ich {2} schnell geduscht.
      3. Dann {3} ich zur Schule gegangen.
      4. Wir {4} viel gelernt.
      5. Nach der Schule {5} ich Fußball gespielt.
      6. Am Abend {6} meine Eltern nach Hause gekommen.
      7. Wir {7} zusammen gegessen.
    answers:
      "1": bin
      "2": habe
      "3": bin
      "4": haben
      "5": habe
      "6": sind
      "7": haben

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich ___ ins Kino gegangen."
        options: [{ key: a, text: "bin" }, { key: b, text: "habe" }, { key: c, text: "ist" }]
        answer: a
        why: "gehen → sein."
      - q: "Wir ___ Pizza gegessen."
        options: [{ key: a, text: "sind" }, { key: b, text: "haben" }, { key: c, text: "hat" }]
        answer: b
        why: "essen → haben."
      - q: "Er ___ mit dem Fahrrad gefahren."
        options: [{ key: a, text: "hat" }, { key: b, text: "habe" }, { key: c, text: "ist" }]
        answer: c
        why: "fahren → sein."
      - q: "Sie (Plural) ___ lange geschlafen."
        options: [{ key: a, text: "haben" }, { key: b, text: "sind" }, { key: c, text: "hat" }]
        answer: a
        why: "schlafen: kein Bewegungsverb → haben."
      - q: "Das Kind ___ eingeschlafen."
        options: [{ key: a, text: "hat" }, { key: b, text: "ist" }, { key: c, text: "habe" }]
        answer: b
        why: "einschlafen: Zustandswechsel → sein."
      - q: "Ich ___ meine Hausaufgaben gemacht."
        options: [{ key: a, text: "bin" }, { key: b, text: "ist" }, { key: c, text: "habe" }]
        answer: c
        why: "machen → haben."
    notes: "5–6 von 6 richtig? Weiter geht's mit der A2-Version (mehr unregelmäßige Partizipien). Weniger als 5? Schau dir Block A noch einmal an."
