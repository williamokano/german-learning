  - id: B2
    block: B
    type: single-choice
    title: "Gegenwart, Vergangenheit oder Modalverb?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Wenn ich das gewusst ___, hätte ich anders gehandelt."
        options: [{ key: a, text: "hätte" }, { key: b, text: "wäre" }, { key: c, text: "würde" }]
        answer: a
        why: "Konjunktiv II Vergangenheit → hätte + Partizip II."
      - q: "Wenn ich Zeit hätte, ___ ich kommen."
        options: [{ key: a, text: "hätte" }, { key: b, text: "würde" }, { key: c, text: "wäre" }]
        answer: b
        why: "Konjunktiv II Gegenwart → würde + Infinitiv."
      - q: "Ich ___ das machen sollen, aber ich habe es nicht getan."
        options: [{ key: a, text: "würde" }, { key: b, text: "wäre" }, { key: c, text: "hätte" }]
        answer: c
        why: "Modalverb-Konstruktion (Reue) → hätte … sollen."
      - q: "Wenn er früher losgefahren ___, wäre er nicht zu spät gekommen."
        options: [{ key: a, text: "wäre" }, { key: b, text: "hätte" }, { key: c, text: "würde" }]
        answer: a
        why: "Konjunktiv II Vergangenheit → wäre + Partizip II."
      - q: "Sie ___ die Prüfung bestehen können, wenn sie mehr gelernt hätte."
        options: [{ key: a, text: "wäre" }, { key: b, text: "hätte" }, { key: c, text: "würde" }]
        answer: b
        why: "Modalverb-Konstruktion → hätte … können."
      - q: "Wenn wir das gewusst hätten, ___ wir anders reagiert."
        options: [{ key: a, text: "wären" }, { key: b, text: "würden" }, { key: c, text: "hätten" }]
        answer: c
        why: "Konjunktiv II Vergangenheit → hätten + Partizip II."

