lesson: "EX/14-konjunktiv2-b2"
title: "Konjunktiv II der Vergangenheit — B2"
topic: "Konjunktiv II"
level: B2
intro: >
  Standalone drill set, not tied to any lesson. To talk about the past
  unreal — regrets, missed chances, things that didn't happen —
  Konjunktiv II uses hätte/wäre + Partizip II: Wenn ich das gewusst
  hätte, hätte ich anders gehandelt (but I didn't know, so I didn't).
  Modal verbs join in with a double-infinitive construction: Ich hätte
  das machen sollen (I should have done that, but didn't) / Ich hätte
  kommen können (I could have come, but didn't). Blocks: A Basistraining
  → B Vertiefung → C Sprachbausteine → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "hätte oder wäre + Partizip II"
    instructions: "Ergänze die Konjunktiv-II-Vergangenheit-Form (ich)."
    instructionsEn: "Fill in the Konjunktiv II past form (ich)."
    columns: ["Infinitiv", "Konjunktiv II Vergangenheit (ich)"]
    rows:
      - label: "machen"
        cells: [{ gap: 1, answer: "hätte gemacht" }]
      - label: "gehen"
        cells: [{ gap: 2, answer: "wäre gegangen" }]
      - label: "sehen"
        cells: [{ gap: 3, answer: "hätte gesehen" }]
      - label: "kommen"
        cells: [{ gap: 4, answer: "wäre gekommen" }]
      - label: "kaufen"
        cells: [{ gap: 5, answer: "hätte gekauft" }]
      - label: "bleiben"
        cells: [{ gap: 6, answer: "wäre geblieben" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Reue und verpasste Chancen"
    instructions: "Ergänze hätte oder wäre (bzw. hätten/wären)."
    instructionsEn: "Fill in hätte or wäre (or hätten/wären)."
    text: |
      1. Wenn ich früher aufgestanden wäre, {1} ich den Bus nicht verpasst.
      2. Wenn du mich gefragt hättest, {2} ich dir geholfen.
      3. Wenn wir das gewusst hätten, {3} wir anders reagiert.
      4. Wenn sie mehr gelernt hätte, {4} sie die Prüfung bestanden.
      5. Wenn ich Zeit gehabt hätte, {5} ich dich besucht.
      6. Wenn er nicht so spät losgefahren wäre, {6} er pünktlich angekommen.
    answers:
      "1": hätte
      "2": hätte
      "3": hätten
      "4": hätte
      "5": hätte
      "6": wäre

