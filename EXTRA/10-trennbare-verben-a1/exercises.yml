lesson: "EX/10-trennbare-verben-a1"
title: "Trennbare und untrennbare Verben — A1"
topic: "Trennbare und untrennbare Verben"
level: A1
intro: >
  Standalone drill set, not tied to any lesson. Separable prefixes
  (auf-, an-, aus-, ein-, mit-, zu-, ab-, vor-, weg- …) detach from the
  verb and jump to the END of a main clause: aufstehen -> Ich stehe
  früh AUF. Inseparable prefixes (be-, ge-, er-, ver-, ent-, zer-,
  emp-, miss-) never split: verstehen -> Ich verstehe das. Blocks: A
  Basistraining (sorting, then prefix placement) → B Vertiefung → C
  Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: categorize
    title: "Trennbar oder untrennbar?"
    instructions: "Ordne jedes Verb der richtigen Gruppe zu."
    instructionsEn: "Sort each verb into the correct group."
    buckets:
      - { key: trennbar, label: "trennbar" }
      - { key: untrennbar, label: "untrennbar" }
    tokens:
      - { text: "aufstehen", bucket: trennbar }
      - { text: "verstehen", bucket: untrennbar }
      - { text: "einkaufen", bucket: trennbar }
      - { text: "bezahlen", bucket: untrennbar }
      - { text: "anrufen", bucket: trennbar }
      - { text: "erklären", bucket: untrennbar }
      - { text: "mitkommen", bucket: trennbar }
      - { text: "besuchen", bucket: untrennbar }
      - { text: "aufräumen", bucket: trennbar }
      - { text: "verkaufen", bucket: untrennbar }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: word-order
    title: "Das trennbare Präfix ans Satzende"
    instructions: "Ergänze das richtige Präfix am Satzende."
    instructionsEn: "Fill in the correct separable prefix at the end of the sentence."
    text: |
      1. Ich stehe jeden Tag um sechs Uhr {1}. (aufstehen)
      2. Wir kaufen im Supermarkt {2}. (einkaufen)
      3. Ruf mich bitte heute Abend {3}! (anrufen)
      4. Räumst du dein Zimmer {4}? (aufräumen)
      5. Kommst du heute Abend {5}? (mitkommen)
      6. Wir fahren morgen früh {6}. (losfahren)
    answers:
      "1": auf
      "2": ein
      "3": an
      "4": auf
      "5": mit
      "6": los

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein Tag im Leben"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Jeden Morgen stehe ich früh {1}. Ich mache das Bett und räume
      mein Zimmer {2}. Danach kaufe ich Brötchen {3}. Ich rufe meine
      Oma {4} und erzähle ihr von meinem Tag. Um acht Uhr fahre ich
      los zur Arbeit. Am Nachmittag hole ich meine Kinder von der
      Schule {5}. Am Abend sehe ich gern {6}. Vor dem Schlafen räume
      ich noch die Küche {7}. Dann mache ich das Licht {8}.
    bank: [auf, auf, ein, an, ab, fern, auf, aus, mit, zu]
    answers:
      "1": auf
      "2": auf
      "3": ein
      "4": an
      "5": ab
      "6": fern
      "7": auf
      "8": aus

  - id: B2
    block: B
    type: single-choice
    title: "Wie sagt man richtig?"
    instructions: "Wähle den richtigen Satz (a, b oder c)."
    instructionsEn: "Choose the grammatically correct sentence (a, b, or c)."
    items:
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Ich stehe auf früh." }, { key: b, text: "Ich stehe früh auf." }, { key: c, text: "Ich aufstehe früh." }]
        answer: b
        why: "aufstehen: trennbar → Präfix ans Satzende."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Ich verstehe nicht das." }, { key: b, text: "Ich das nicht verstehe." }, { key: c, text: "Ich verstehe das nicht." }]
        answer: c
        why: "verstehen: untrennbar, bleibt immer zusammen."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Wir kaufen Obst ein." }, { key: b, text: "Wir einkaufen Obst." }, { key: c, text: "Wir kaufen ein Obst." }]
        answer: a
        why: "einkaufen: trennbar → Präfix ans Satzende."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Sie besucht mich morgen." }, { key: b, text: "Sie sucht mich morgen be." }, { key: c, text: "Sie be mich morgen sucht." }]
        answer: a
        why: "besuchen: untrennbar, bleibt immer zusammen."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Ruf an mich bitte!" }, { key: b, text: "Ruf mich bitte an!" }, { key: c, text: "Anruf mich bitte!" }]
        answer: b
        why: "anrufen: trennbar → Präfix ans Satzende."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Er bezahlt die Rechnung." }, { key: b, text: "Er zahlt die Rechnung be." }, { key: c, text: "Er be zahlt die Rechnung." }]
        answer: a
        why: "bezahlen: untrennbar, bleibt immer zusammen."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Trennbare Präfixe"
    instructions: "Choose the correct separable prefix for each gap (a, b, or c)."
    items:
      - q: "Ich mache das Fenster ___."
        options: [{ key: a, text: "auf" }, { key: b, text: "an" }, { key: c, text: "ein" }]
        answer: a
        why: "aufmachen."
      - q: "Wir räumen die Wohnung ___."
        options: [{ key: a, text: "ein" }, { key: b, text: "auf" }, { key: c, text: "an" }]
        answer: b
        why: "aufräumen."
      - q: "Sie kauft frisches Obst ___."
        options: [{ key: a, text: "auf" }, { key: b, text: "ein" }, { key: c, text: "an" }]
        answer: b
        why: "einkaufen."
      - q: "Ruf mich bitte ___, wenn du ankommst!"
        options: [{ key: a, text: "auf" }, { key: b, text: "an" }, { key: c, text: "ein" }]
        answer: b
        why: "anrufen."
      - q: "Wann kommt der Zug ___?"
        options: [{ key: a, text: "an" }, { key: b, text: "auf" }, { key: c, text: "ein" }]
        answer: a
        why: "ankommen."
      - q: "Er holt seine Schwester vom Bahnhof ___."
        options: [{ key: a, text: "an" }, { key: b, text: "auf" }, { key: c, text: "ab" }]
        answer: c
        why: "abholen."
      - q: "Wir sehen jeden Abend ___."
        options: [{ key: a, text: "an" }, { key: b, text: "auf" }, { key: c, text: "fern" }]
        answer: c
        why: "fernsehen."
      - q: "Mach bitte das Licht ___!"
        options: [{ key: a, text: "auf" }, { key: b, text: "an" }, { key: c, text: "aus" }]
        answer: c
        why: "ausmachen."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Ein Samstagmorgen (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Am Samstag stehe ich spät {1}. Ich mache mir Kaffee und schalte
      den Fernseher {2}. Später räume ich die Küche {3}. Meine
      Freundin ruft {4} und lädt mich zum Einkaufen {5}. Wir kaufen im
      Supermarkt frisches Gemüse {6}. Danach hole ich Pakete von der
      Post {7}. Am Nachmittag sehe ich noch etwas {8}. Am Abend mache
      ich alle Lichter {9}. Ich schlafe schnell {10}.
    bank: [AUF, AN, AUF, AN, EIN, EIN, AB, FERN, AUS, EIN, MIT, ZU, WEG]
    answers:
      "1": AUF
      "2": AN
      "3": AUF
      "4": AN
      "5": EIN
      "6": EIN
      "7": AB
      "8": FERN
      "9": AUS
      "10": EIN

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das richtige Präfix."
    text: |
      1. Ich räume mein Zimmer {1}.
      2. Wir kaufen Gemüse {2}.
      3. Sie ruft ihre Mutter {3}.
      4. Kommst du heute Abend {4}?
      5. Er holt die Kinder {5}.
      6. Macht bitte das Fenster {6}!
    answers:
      "1": auf
      "2": ein
      "3": an
      "4": mit
      "5": ab
      "6": zu

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the grammatically correct sentence (a, b, or c). This is your final check for this set."
    items:
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Ich stehe um sechs auf." }, { key: b, text: "Ich aufstehe um sechs." }, { key: c, text: "Ich stehe auf um sechs." }]
        answer: a
        why: "aufstehen: trennbar → Präfix ans Satzende."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Wir besuchen dich morgen be." }, { key: b, text: "Wir besuchen dich morgen." }, { key: c, text: "Wir be dich morgen suchen." }]
        answer: b
        why: "besuchen: untrennbar, bleibt immer zusammen."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Er einkauft Milch." }, { key: b, text: "Er kauft ein Milch." }, { key: c, text: "Er kauft Milch ein." }]
        answer: c
        why: "einkaufen: trennbar → Präfix ans Satzende."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Sie klärt mir die Regel er." }, { key: b, text: "Sie erklärt mir die Regel." }, { key: c, text: "Sie er mir die Regel klärt." }]
        answer: b
        why: "erklären: untrennbar, bleibt immer zusammen."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Zu mach die Tür!" }, { key: b, text: "Machzu die Tür!" }, { key: c, text: "Mach die Tür zu!" }]
        answer: c
        why: "zumachen: trennbar → Präfix ans Satzende."
      - q: "Wie sagt man richtig?"
        options: [{ key: a, text: "Ich verkaufe mein altes Auto." }, { key: b, text: "Ich kaufe mein altes Auto ver." }, { key: c, text: "Ich ver mein altes Auto kaufe." }]
        answer: a
        why: "verkaufen: untrennbar, bleibt immer zusammen."
    notes: "5–6 von 6 richtig? Weiter geht's mit der A2-Version (Perfekt der trennbaren/untrennbaren Verben, Präfixe mit zwei Bedeutungen). Weniger als 5? Schau dir Block A noch einmal an."
