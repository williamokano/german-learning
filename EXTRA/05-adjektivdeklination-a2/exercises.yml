lesson: "EX/05-adjektivdeklination-a2"
title: "Adjektivendungen nach der/ein — A2"
topic: "Adjektivdeklination (schwach, gemischt, stark)"
level: A2
intro: >
  Standalone drill set, not tied to any lesson. After der/die/das (the
  article already shows gender+case), the adjective just adds -e or
  -en — "schwache" endings. After ein/eine/ein (the article is silent
  in maskulin Nominativ and neutral Nominativ/Akkusativ), the adjective
  has to show it instead — "gemischte" endings: ein GUTER Mann, ein
  GUTES Kind. Everywhere else, ein and der behave the same. Blocks: A
  Basistraining (the two tables) → B Vertiefung → C Sprachbausteine →
  D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "Schwache Endung nach dem bestimmten Artikel"
    instructions: "Ergänze die Tabelle mit gut + Mann/Frau/Kind/Leute."
    instructionsEn: "Complete the table with gut + Mann/Frau/Kind/Leute."
    columns: ["", "maskulin", "feminin", "neutral", "Plural"]
    rows:
      - label: "Nom."
        cells: [{ gap: 1, answer: "der gute Mann" }, { gap: 2, answer: "die gute Frau" }, { gap: 3, answer: "das gute Kind" }, { gap: 4, answer: "die guten Leute" }]
      - label: "Akk."
        cells: [{ gap: 5, answer: "den guten Mann" }, { gap: 6, answer: "die gute Frau" }, { gap: 7, answer: "das gute Kind" }, { gap: 8, answer: "die guten Leute" }]
      - label: "Dat."
        cells: [{ gap: 9, answer: "dem guten Mann" }, { gap: 10, answer: "der guten Frau" }, { gap: 11, answer: "dem guten Kind" }, { gap: 12, answer: "den guten Leuten" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Gemischte Endung nach ein"
    instructions: "Ergänze die richtige Endung von gut."
    instructionsEn: "Fill in the correct ending of gut. Watch maskulin Nominativ (-er) and neutral (-es) — that's where ein and der differ."
    text: |
      1. Das ist ein gut{1} Mann.
      2. Ich habe einen gut{2} Mann getroffen.
      3. Ich spreche mit einem gut{3} Mann.
      4. Das ist eine gut{4} Frau.
      5. Das ist ein gut{5} Kind.
      6. Ich helfe einem gut{6} Kind.
    answers:
      "1": er
      "2": en
      "3": en
      "4": e
      "5": es
      "6": en

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Ein neuer Schüler"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten."
    instructionsEn: "Fill the 8 gaps using the words in the box — all forms of neu."
    text: |
      Heute kommt ein {1} Schüler in unsere Klasse. Der {2} Schüler
      heißt Elias. Er hat ein {3} Buch dabei. Ich finde das {4} Buch
      interessant. Die Lehrerin gibt ihm einen {5} Stift. Er nimmt den
      {6} Stift und bedankt sich. Am Ende des Tages hat er schon eine
      {7} Freundin gefunden. Die {8} Freundin heißt Mia.
    bank: [neuer, neue, neues, neue, neuen, neuen, neue, neue]
    answers:
      "1": neuer
      "2": neue
      "3": neues
      "4": neue
      "5": neuen
      "6": neuen
      "7": neue
      "8": neue
    notes: "Der wichtigste Unterschied: (1) ein neuER Schüler vs. (2) der neuE Schüler; (3) ein neuES Buch vs. (4) das neuE Buch."

  - id: B2
    block: B
    type: single-choice
    title: "der oder ein — welche Endung?"
    instructions: "Wähle die richtige Endung (a, b oder c)."
    instructionsEn: "Choose the correct ending (a, b, or c)."
    items:
      - q: "Ich trinke gern einen heiß___ Kaffee."
        options: [{ key: a, text: "en" }, { key: b, text: "er" }, { key: c, text: "e" }]
        answer: a
        why: "gemischt, Akkusativ maskulin → -en."
      - q: "Der heiß___ Kaffee auf dem Tisch ist für dich."
        options: [{ key: a, text: "e" }, { key: b, text: "er" }, { key: c, text: "en" }]
        answer: a
        why: "schwach, Nominativ maskulin → -e (nicht -er wie nach ein)."
      - q: "Ich möchte ein neu___ Auto kaufen."
        options: [{ key: a, text: "es" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: a
        why: "gemischt, neutrum → -es."
      - q: "Das neu___ Auto dort gehört meinem Bruder."
        options: [{ key: a, text: "es" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: b
        why: "schwach, neutrum → -e (nicht -es wie nach ein)."
      - q: "Ein schön___ Tag beginnt."
        options: [{ key: a, text: "er" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: a
        why: "gemischt, Nominativ maskulin → -er."
      - q: "Der schön___ Tag ist schon vorbei."
        options: [{ key: a, text: "er" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: b
        why: "schwach, Nominativ maskulin → -e."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Der neue Kollege"
    instructions: "Choose the correct ending for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Wir haben einen neu___ Kollegen bekommen."
        options: [{ key: a, text: "er" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: c
        why: "gemischt, Akkusativ maskulin → -en."
      - q: "Der neu___ Kollege heißt Marco."
        options: [{ key: a, text: "e" }, { key: b, text: "er" }, { key: c, text: "en" }]
        answer: a
        why: "schwach, Nominativ maskulin → -e."
      - q: "Er hat eine gut___ Idee vorgeschlagen."
        options: [{ key: a, text: "er" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: b
        why: "gemischt, feminin → -e."
      - q: "Die gut___ Idee gefällt allen."
        options: [{ key: a, text: "e" }, { key: b, text: "er" }, { key: c, text: "en" }]
        answer: a
        why: "schwach, feminin → -e."
      - q: "Wir haben ein neu___ Projekt gestartet."
        options: [{ key: a, text: "e" }, { key: b, text: "en" }, { key: c, text: "es" }]
        answer: c
        why: "gemischt, neutrum → -es."
      - q: "Das neu___ Projekt läuft gut."
        options: [{ key: a, text: "e" }, { key: b, text: "es" }, { key: c, text: "en" }]
        answer: a
        why: "schwach, neutrum → -e."
      - q: "Marco arbeitet mit einem klein___ Team zusammen."
        options: [{ key: a, text: "e" }, { key: b, text: "en" }, { key: c, text: "er" }]
        answer: b
        why: "Dativ (alle Genera) → -en."
      - q: "Das klein___ Team ist sehr effizient."
        options: [{ key: a, text: "e" }, { key: b, text: "en" }, { key: c, text: "es" }]
        answer: a
        why: "schwach, neutrum → -e."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Im Restaurant (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Wir gehen in ein {1} Restaurant. Das {2} Restaurant hat gute
      Bewertungen. Der Kellner bringt eine {3} Speisekarte. Ich bestelle
      einen {4} Salat. Der {5} Salat schmeckt hervorragend. Mein Freund
      bestellt ein {6} Steak. Das {7} Steak ist perfekt gebraten. Zum
      Nachtisch teilen wir einen {8} Kuchen. Der {9} Kuchen ist
      hausgemacht. Es war ein {10} Abend.
    bank: [NEUES, NEUE, GROSSE, FRISCHEN, FRISCHE, SAFTIGES, SAFTIGE, LECKEREN, LECKERE, SCHÖNER, SCHÖNE, NEUEN, GUTES]
    answers:
      "1": NEUES
      "2": NEUE
      "3": GROSSE
      "4": FRISCHEN
      "5": FRISCHE
      "6": SAFTIGES
      "7": SAFTIGE
      "8": LECKEREN
      "9": LECKERE
      "10": SCHÖNER

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze die richtige Endung."
    text: |
      1. Ich kaufe einen rot{1} Apfel.
      2. Der rot{2} Apfel schmeckt süß.
      3. Sie trägt ein blau{3} Kleid.
      4. Das blau{4} Kleid steht ihr gut.
      5. Wir besuchen eine alt{5} Stadt.
      6. Die alt{6} Stadt hat viele Touristen.
      7. Ich habe einen klein{7} Hund gesehen.
    answers:
      "1": en
      "2": e
      "3": es
      "4": e
      "5": e
      "6": e
      "7": en

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct ending (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich trinke einen heiß___ Tee."
        options: [{ key: a, text: "er" }, { key: b, text: "e" }, { key: c, text: "en" }]
        answer: c
        why: "gemischt, Akkusativ maskulin → -en."
      - q: "Der heiß___ Tee ist fertig."
        options: [{ key: a, text: "e" }, { key: b, text: "er" }, { key: c, text: "en" }]
        answer: a
        why: "schwach, Nominativ maskulin → -e."
      - q: "Sie hat ein schnell___ Auto."
        options: [{ key: a, text: "e" }, { key: b, text: "en" }, { key: c, text: "es" }]
        answer: c
        why: "gemischt, neutrum → -es."
      - q: "Das schnell___ Auto gehört ihr."
        options: [{ key: a, text: "e" }, { key: b, text: "es" }, { key: c, text: "en" }]
        answer: a
        why: "schwach, neutrum → -e."
      - q: "Wir kaufen eine modern___ Wohnung."
        options: [{ key: a, text: "en" }, { key: b, text: "e" }, { key: c, text: "er" }]
        answer: b
        why: "gemischt, feminin → -e."
      - q: "Ein lang___ Tag liegt vor uns."
        options: [{ key: a, text: "e" }, { key: b, text: "en" }, { key: c, text: "er" }]
        answer: c
        why: "gemischt, Nominativ maskulin → -er."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B1-Version (kein Artikel, Genitiv, mehrere Adjektive). Weniger als 5? Schau dir Block A noch einmal an."
