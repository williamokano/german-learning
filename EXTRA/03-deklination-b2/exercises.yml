lesson: "EX/03-deklination-b2"
title: "Unregelmäßige Nomen, Eigennamen, kein-Wörter & Genitivketten — B2"
topic: "Deklination in allen Fällen (Nominativ, Akkusativ, Dativ, Genitiv)"
level: B2
intro: >
  Standalone drill set, not tied to any lesson. Closes out the
  Deklination topic with what's left after A2/B1: irregular weak nouns
  (der Name -> des Namens, not des Namen; das Herz, a neuter that mixes
  in weak endings in Dativ/Genitiv but stays unchanged in Akkusativ),
  Genitiv of proper names (Peters, Annas, Max' — apostrophe, not -s,
  after a name ending in s/x/z), kein across all cases, and Genitiv
  chains (das Auto des Bruders meiner Freundin). Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "Unregelmäßige Nomen: der Name, das Herz, der Gedanke"
    instructions: "Ergänze die Tabelle."
    instructionsEn: "Complete the table — der Name and der Gedanke take -ns/-ns in the Genitiv (not just -n); das Herz stays unchanged in the Akkusativ but takes weak endings in Dativ/Genitiv."
    columns: ["", "der Name", "das Herz", "der Gedanke"]
    rows:
      - label: "Nom."
        cells: [{ gap: 1, answer: "der Name" }, { gap: 2, answer: "das Herz" }, { gap: 3, answer: "der Gedanke" }]
      - label: "Akk."
        cells: [{ gap: 4, answer: "den Namen" }, { gap: 5, answer: "das Herz" }, { gap: 6, answer: "den Gedanken" }]
      - label: "Dat."
        cells: [{ gap: 7, answer: "dem Namen" }, { gap: 8, answer: "dem Herzen" }, { gap: 9, answer: "dem Gedanken" }]
      - label: "Gen."
        cells: [{ gap: 10, answer: "des Namens" }, { gap: 11, answer: "des Herzens" }, { gap: 12, answer: "des Gedankens" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Genitiv bei Eigennamen"
    instructions: "Ergänze den Genitiv des Eigennamens. Achtung bei Namen auf -s/-x/-z: Apostroph statt -s."
    instructionsEn: "Fill in the Genitiv of the proper name. Names ending in -s/-x/-z take an apostrophe instead of -s."
    text: |
      1. {1} Auto ist neu. (Peter)
      2. Das ist {2} Schwester. (Anna)
      3. {3} Wohnung ist sehr groß. (Thomas)
      4. Kennst du {4} neuen Freund? (Lena)
      5. {5} Bruder wohnt in Berlin. (Max)
      6. Das ist {6} Buch. (Julia)
    answers:
      "1": Peters
      "2": Annas
      "3": "Thomas'"
      "4": Lenas
      "5": "Max'"
      "6": Julias

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Nach dem Umzug (kein in allen Fällen)"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten."
    instructionsEn: "Fill the 8 gaps using the words in the box."
    text: |
      Nach dem Umzug hat Paul {1} Möbel mehr. Er hat {2} Bett, nur eine
      Matratze auf dem Boden. Er kocht mit {3} Töpfen, weil er sie beim
      Umzug verloren hat. Seine Freunde helfen ihm mit {4} Sachen aus
      ihrer eigenen Wohnung. „Ich habe {5} Ahnung, wo meine Kisten
      sind!", sagt er. Zum Glück hat er {6} Probleme mit seinen neuen
      Nachbarn. Er lädt sie zu {7} kleinen Party ein, obwohl er {8}
      Stühle hat — alle müssen auf dem Boden sitzen.
    bank: [keine, kein, keinen, keinen, keine, keine, keiner, keine, keinem]
    answers:
      "1": keine
      "2": kein
      "3": keinen
      "4": keinen
      "5": keine
      "6": keine
      "7": keiner
      "8": keine

  - id: B2
    block: B
    type: single-choice
    title: "Genitivketten"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c) — each Genitiv link agrees with its own noun, no matter how deep the chain."
    items:
      - q: "Das ist das Auto ___ Bruders meiner Freundin."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Bruder ist maskulin → des."
      - q: "Der Name ___ Firma meines Vaters ist bekannt."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Firma ist feminin → der."
      - q: "Die Farbe ___ Autos meines Onkels gefällt mir."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Auto ist neutrum → des."
      - q: "Das Zimmer ___ Tochter unserer Nachbarn ist sehr ordentlich."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Tochter ist feminin → der."
      - q: "Der Chef ___ Firma meines Bruders ist sehr streng."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Firma ist feminin → der."
      - q: "Das Haus ___ Eltern meines besten Freundes ist riesig."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Eltern = Plural → der."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Name und Herz"
    instructions: "Choose the correct word for each gap (a, b, or c)."
    items:
      - q: "___ Name ist mir nicht bekannt."
        options: [{ key: a, text: "Der" }, { key: b, text: "Den" }, { key: c, text: "Des" }]
        answer: a
        why: "Nominativ → Der."
      - q: "Ich kenne ___ Namen nicht."
        options: [{ key: a, text: "der" }, { key: b, text: "den" }, { key: c, text: "dem" }]
        answer: b
        why: "Akkusativ, schwacher Nomen → den Namen."
      - q: "Die Bedeutung ___ Namens ist interessant."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv → des Namens (nicht des Namen)."
      - q: "___ Auto steht vor der Tür."
        options: [{ key: a, text: "Peter" }, { key: b, text: "Peters" }, { key: c, text: "Peteres" }]
        answer: b
        why: "Genitiv bei Eigennamen: -s, kein Apostroph nötig (Peter endet nicht auf s/x/z)."
      - q: "Kennst du ___ Schwester?"
        options: [{ key: a, text: "Anna" }, { key: b, text: "Annas" }, { key: c, text: "Annaes" }]
        answer: b
        why: "Genitiv bei Eigennamen → Annas."
      - q: "___ Herz schlägt schnell."
        options: [{ key: a, text: "Sein" }, { key: b, text: "Seinen" }, { key: c, text: "Seines" }]
        answer: a
        why: "Nominativ neutrum → Sein."
      - q: "Der Arzt untersucht ___ Herz."
        options: [{ key: a, text: "sein" }, { key: b, text: "seinen" }, { key: c, text: "seinem" }]
        answer: a
        why: "Akkusativ; Herz bleibt unverändert (anders als andere schwache Nomen) → sein."
      - q: "Die Ärztin spricht über die Funktion ___ Herzens."
        options: [{ key: a, text: "das" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv → des Herzens."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Familiengeschichte (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Meine Großmutter hieß Erna. {1} Kindheit war in Bayern. {2} Vater,
      mein Urgroßvater, war Bäcker. Ich kenne {3} Namen noch aus alten
      Briefen — leider habe ich {4} Namen nie im Familienbuch gefunden.
      Erna hatte {5} Geschwister, war also ein Einzelkind. {6} Herz
      gehörte immer ihrer Heimatstadt. Nach {7} Tod fanden wir viele
      alte Fotos in {8} Wohnung. {9} Bruder, mein Großonkel, lebt heute
      noch in München. Wir haben {10} Zeit, all diese Geschichten zu
      vergessen.
    bank: [ERNAS, ERNAS, SEINEN, SEINEN, KEINE, IHR, IHREM, IHRER, ERNAS, KEINE, DEREN, KEINEN, IHREN]
    answers:
      "1": ERNAS
      "2": ERNAS
      "3": SEINEN
      "4": SEINEN
      "5": KEINE
      "6": IHR
      "7": IHREM
      "8": IHRER
      "9": ERNAS
      "10": KEINE

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze die richtige Form."
    text: |
      1. {1} Auto ist neu. (Tom)
      2. Ich kenne {2} Namen nicht.
      3. Sie hat {3} Zeit für eine Pause.
      4. Das Herz {4} Patienten schlägt unregelmäßig.
      5. {5} Herz schlägt schnell, wenn er nervös ist.
      6. Ist das Annas Auto oder {6} Auto? (Max)
    answers:
      "1": Toms
      "2": seinen
      "3": keine
      "4": des
      "5": Sein
      "6": "Max'"

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "___ Bruder wohnt in Köln."
        options: [{ key: a, text: "Tom" }, { key: b, text: "Toms" }, { key: c, text: "Tomes" }]
        answer: b
        why: "Genitiv bei Eigennamen → Toms."
      - q: "Ich habe ___ Ahnung, wo er ist."
        options: [{ key: a, text: "kein" }, { key: b, text: "keine" }, { key: c, text: "keinen" }]
        answer: b
        why: "Ahnung ist feminin, Akkusativ → keine."
      - q: "Er hat ___ Namen vergessen."
        options: [{ key: a, text: "sein" }, { key: b, text: "seinen" }, { key: c, text: "seinem" }]
        answer: b
        why: "Akkusativ, schwacher Nomen → seinen Namen."
      - q: "Die Farbe ___ Herzens verändert sich nicht."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv → des Herzens."
      - q: "___ Herz ist aus Gold, sagt man über sie."
        options: [{ key: a, text: "Ihr" }, { key: b, text: "Ihre" }, { key: c, text: "Ihrem" }]
        answer: a
        why: "Nominativ neutrum → Ihr."
      - q: "Das Auto ___ Chefin meines Vaters ist teuer."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Chefin ist feminin, Genitiv → der."
    notes: "5–6 von 6 richtig, und alle Deklinations-Übungen (A2/B1/B2) sauber gelöst? Dann sitzt das ganze Fallsystem."
