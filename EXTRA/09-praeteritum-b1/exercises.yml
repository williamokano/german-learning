lesson: "EX/09-praeteritum-b1"
title: "Präteritum der starken und schwachen Verben — B1"
topic: "Präteritum (die geschriebene Vergangenheit)"
level: B1
intro: >
  Standalone drill set, not tied to any lesson. Präteritum is the
  written/narrative past — the register of stories, news, and books
  (Perfekt is the spoken register for everyday conversation, drilled
  separately in the Perfekt sein/haben set). Schwache Verben just add
  -te + endings (machen -> machte). Starke Verben change their stem
  vowel and take NO ending in ich/er-sie-es (gehen -> ging, not
  gingte) — and the vowel change doesn't follow a rule, so the strong
  forms have to be memorized one by one. A handful of mixed verbs do
  both (denken -> dachte). Blocks: A Basistraining → B Vertiefung → C
  Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: conjugation
    title: "machen (schwach) vs. gehen (stark)"
    instructions: "Ergänze die Tabelle."
    instructionsEn: "Complete the table."
    columns: ["", "machen (schwach)", "gehen (stark)"]
    rows:
      - label: "ich"
        cells: [{ gap: 1, answer: "machte" }, { gap: 2, answer: "ging" }]
      - label: "du"
        cells: [{ gap: 3, answer: "machtest" }, { gap: 4, answer: "gingst" }]
      - label: "er/sie/es"
        cells: [{ gap: 5, answer: "machte" }, { gap: 6, answer: "ging" }]
      - label: "wir"
        cells: [{ gap: 7, answer: "machten" }, { gap: 8, answer: "gingen" }]
      - label: "ihr"
        cells: [{ gap: 9, answer: "machtet" }, { gap: 10, answer: "gingt" }]
      - label: "sie/Sie"
        cells: [{ gap: 11, answer: "machten" }, { gap: 12, answer: "gingen" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: conjugation
    title: "sein, haben, werden im Präteritum"
    instructions: "Ergänze war, hatte oder wurde in der richtigen Form."
    instructionsEn: "Fill in the correct Präteritum form of sein, haben, or werden."
    text: |
      1. Ich {1} gestern sehr müde.
      2. Wir {2} keine Zeit.
      3. Er {3} Arzt.
      4. Die Kinder {4} im Garten.
      5. Du {5} recht.
      6. Das Wetter {6} plötzlich schlecht.
    answers:
      "1": war
      "2": hatten
      "3": wurde
      "4": waren
      "5": hattest
      "6": wurde

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Meine Kindheit"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Als Kind {1} ich oft im Park. Ich {2} viele Freunde. Wir {3}
      zusammen ins Schwimmbad. Meine Mutter {4} immer für uns. Ich {5}
      gern Comics. Mein Bruder {6} lieber draußen. Wir {7} viel über
      die Welt. Manchmal {8} wir spät ins Bett.
    bank: [spielte, hatte, gingen, kochte, las, blieb, dachten, kamen, wurde, war]
    answers:
      "1": spielte
      "2": hatte
      "3": gingen
      "4": kochte
      "5": las
      "6": blieb
      "7": dachten
      "8": kamen

  - id: B2
    block: B
    type: single-choice
    title: "Der Vokalwechsel bei starken Verben"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "fahren → ich ___"
        options: [{ key: a, text: "fuhr" }, { key: b, text: "fahrte" }, { key: c, text: "fahrete" }]
        answer: a
        why: "fahren: starkes Verb → fuhr, kein -te."
      - q: "sehen → du ___"
        options: [{ key: a, text: "sehtest" }, { key: b, text: "sahst" }, { key: c, text: "sehst" }]
        answer: b
        why: "sehen: starkes Verb → sahst."
      - q: "essen → er ___"
        options: [{ key: a, text: "esste" }, { key: b, text: "essete" }, { key: c, text: "aß" }]
        answer: c
        why: "essen: starkes Verb → aß, kein -te und keine Endung in er/sie/es."
      - q: "trinken → wir ___"
        options: [{ key: a, text: "trunken" }, { key: b, text: "tranken" }, { key: c, text: "trinkten" }]
        answer: b
        why: "trinken: starkes Verb → tranken."
      - q: "schreiben → ihr ___"
        options: [{ key: a, text: "schreibtet" }, { key: b, text: "schribt" }, { key: c, text: "schriebt" }]
        answer: c
        why: "schreiben: starkes Verb → schriebt."
      - q: "sprechen → sie (Plural) ___"
        options: [{ key: a, text: "sprechten" }, { key: b, text: "sprachen" }, { key: c, text: "sprochen" }]
        answer: b
        why: "sprechen: starkes Verb → sprachen."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Ein Märchen"
    instructions: "Choose the correct Präteritum form for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Es ___ einmal eine Prinzessin."
        options: [{ key: a, text: "war" }, { key: b, text: "wurde" }, { key: c, text: "hatte" }]
        answer: a
        why: "es war einmal: die klassische Märchenformel."
      - q: "Sie ___ in einem großen Schloss."
        options: [{ key: a, text: "wohnte" }, { key: b, text: "wohnen" }, { key: c, text: "wohnt" }]
        answer: a
        why: "wohnen: schwaches Verb → wohnte."
      - q: "Eines Tages ___ sie in den Wald."
        options: [{ key: a, text: "gehte" }, { key: b, text: "ging" }, { key: c, text: "gang" }]
        answer: b
        why: "gehen: starkes Verb → ging."
      - q: "Dort ___ sie einen Wolf."
        options: [{ key: a, text: "traf" }, { key: b, text: "treffte" }, { key: c, text: "trifte" }]
        answer: a
        why: "treffen: starkes Verb → traf."
      - q: "Der Wolf ___ sehr hungrig."
        options: [{ key: a, text: "hatte" }, { key: b, text: "wurde" }, { key: c, text: "war" }]
        answer: c
        why: "Zustand → war."
      - q: "Die Prinzessin ___ Angst."
        options: [{ key: a, text: "hatte" }, { key: b, text: "war" }, { key: c, text: "wurde" }]
        answer: a
        why: "Angst haben → hatte."
      - q: "Zum Glück ___ ein Jäger vorbei."
        options: [{ key: a, text: "kamte" }, { key: b, text: "kam" }, { key: c, text: "kommte" }]
        answer: b
        why: "kommen: starkes Verb → kam."
      - q: "Am Ende ___ alles gut."
        options: [{ key: a, text: "war" }, { key: b, text: "wurde" }, { key: c, text: "hatte" }]
        answer: b
        why: "es wurde gut: Veränderung/Ergebnis → wurde."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Die Geschichte meiner Großeltern (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Meine Großeltern {1} sich 1960 kennen. Sie {2} beide sehr jung.
      Mein Großvater {3} als Lehrer. Meine Großmutter {4}
      Krankenschwester. Sie {5} drei Kinder. Das Leben {6} nicht immer
      leicht. Sie {7} hart für ihre Familie. Trotzdem {8} sie
      glücklich. Sie {9} nie den Mut. Am Ende {10} sie ein erfülltes
      Leben.
    bank: [LERNTEN, WAREN, ARBEITETE, WURDE, BEKAMEN, WAR, ARBEITETEN, WAREN, VERLOREN, HATTEN, HATTE, WURDEN, GING]
    answers:
      "1": LERNTEN
      "2": WAREN
      "3": ARBEITETE
      "4": WURDE
      "5": BEKAMEN
      "6": WAR
      "7": ARBEITETEN
      "8": WAREN
      "9": VERLOREN
      "10": HATTEN

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze das Verb im Präteritum."
    text: |
      1. Ich {1} letztes Jahr in Italien. (sein)
      2. Wir {2} viel Pasta. (essen)
      3. Das Essen {3} sehr gut. (schmecken)
      4. Wir {4} jeden Tag ans Meer. (fahren)
      5. Ich {5} viele Fotos. (machen)
      6. Am Ende {6} ich traurig, dass es vorbei war. (sein)
      7. Wir {7} bald wiederzukommen. (planen)
    answers:
      "1": war
      "2": aßen
      "3": schmeckte
      "4": fuhren
      "5": machte
      "6": war
      "7": planten

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Gestern ___ ich sehr beschäftigt."
        options: [{ key: a, text: "war" }, { key: b, text: "wurde" }, { key: c, text: "hatte" }]
        answer: a
        why: "Zustand → war."
      - q: "Er ___ mir ein Geschenk."
        options: [{ key: a, text: "gabte" }, { key: b, text: "gab" }, { key: c, text: "gebte" }]
        answer: b
        why: "geben: starkes Verb → gab."
      - q: "Wir ___ lange auf den Bus."
        options: [{ key: a, text: "wartten" }, { key: b, text: "wartet" }, { key: c, text: "warteten" }]
        answer: c
        why: "warten: schwaches Verb → warteten."
      - q: "Sie öffnete das Fenster, weil es ihr zu warm ___."
        options: [{ key: a, text: "wurde" }, { key: b, text: "hatte" }, { key: c, text: "war" }]
        answer: c
        why: "Zustand → war."
      - q: "Ich ___ nicht, was ich sagen sollte."
        options: [{ key: a, text: "wisste" }, { key: b, text: "wusste" }, { key: c, text: "wusstete" }]
        answer: b
        why: "wissen: gemischtes Verb (Vokalwechsel + -te) → wusste."
      - q: "Die Kinder ___ im Garten."
        options: [{ key: a, text: "spielen" }, { key: b, text: "spielt" }, { key: c, text: "spielten" }]
        answer: c
        why: "spielen: schwaches Verb → spielten."
    notes: "5–6 von 6 richtig? Präteritum und Perfekt zusammen sitzen jetzt sicher. Weniger als 5? Schau dir Block A noch einmal an."
