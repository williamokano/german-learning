lesson: "EX/03-deklination-b1"
title: "Genitiv vertieft & die n-Deklination — B1"
topic: "Deklination in allen Fällen (Nominativ, Akkusativ, Dativ, Genitiv)"
level: B1
intro: >
  Standalone drill set, not tied to any lesson. Two pieces on top of the
  A2 set: the n-Deklination (weak masculine nouns like der Junge, der
  Student, der Nachbar — they take -n/-en in EVERY case except
  Nominativ Singular, not just in the Genitiv like normal nouns), and
  the four classic Genitiv prepositions (wegen, trotz, während, statt).
  Blocks: A Basistraining (weak nouns, then Genitiv-Präpositionen) → B
  Vertiefung → C Sprachbausteine → D Wiederholung. Answers in
  solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    skill: case-endings
    title: "Stark vs. schwach: der Mann, der Junge, der Student"
    instructions: "Ergänze die Tabelle. 'der Junge' und 'der Student' sind schwache Nomen."
    instructionsEn: "Complete the table. der Junge and der Student are weak nouns — they add -n/-en in every case except Nominativ Singular."
    columns: ["", "der Mann (stark)", "der Junge (schwach)", "der Student (schwach)"]
    rows:
      - label: "Nom."
        cells: [{ gap: 1, answer: "der Mann" }, { gap: 2, answer: "der Junge" }, { gap: 3, answer: "der Student" }]
      - label: "Akk."
        cells: [{ gap: 4, answer: "den Mann" }, { gap: 5, answer: "den Jungen" }, { gap: 6, answer: "den Studenten" }]
      - label: "Dat."
        cells: [{ gap: 7, answer: "dem Mann" }, { gap: 8, answer: "dem Jungen" }, { gap: 9, answer: "dem Studenten" }]
      - label: "Gen."
        cells: [{ gap: 10, answer: "des Mannes" }, { gap: 11, answer: "des Jungen" }, { gap: 12, answer: "des Studenten" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    skill: case-endings
    title: "Genitiv-Präpositionen: wegen, trotz, während, statt"
    instructions: "Ergänze den richtigen Genitiv-Artikel."
    instructionsEn: "Fill in the correct Genitiv article after the preposition."
    text: |
      1. Trotz {1} Regens gehen wir spazieren.
      2. Er kommt nicht zur Arbeit wegen {2} Kinder.
      3. Während {3} Woche arbeite ich viel.
      4. Statt {4} Autos nehmen wir den Bus.
      5. Trotz {5} schlechten Wetters findet das Fest statt.
      6. Wegen {6} Verspätung fiel der Termin aus.
    answers:
      "1": des
      "2": der
      "3": der
      "4": des
      "5": des
      "6": der

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: schwache Nomen im Alltag"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten."
    instructionsEn: "Fill the 8 gaps using the words in the box."
    text: |
      An der Universität treffe ich oft {1}. Der Professor spricht mit
      {2} über die Prüfung. Ich kenne {3} aus meinem Deutschkurs schon
      lange. Wir helfen {4} bei den Hausaufgaben. Der Verkäufer begrüßt
      {5} freundlich. Er zeigt {6} die neuen Produkte. Meine Nachbarin
      kennt {7} von gegenüber gut. Sie spricht oft mit {8} über die
      Gartenarbeit.
    bank: [einen Studenten, dem Studenten, den Jungen, dem Jungen, den Kunden, dem Kunden, den Nachbarn, dem Nachbarn]
    answers:
      "1": einen Studenten
      "2": dem Studenten
      "3": den Jungen
      "4": dem Jungen
      "5": den Kunden
      "6": dem Kunden
      "7": den Nachbarn
      "8": dem Nachbarn

  - id: B2
    block: B
    type: single-choice
    title: "Welche Präposition passt?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "___ des Streiks fahren keine Züge."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Während" }, { key: c, text: "Statt" }]
        answer: a
        why: "Der Streik ist der Grund → wegen."
      - q: "___ der Ferien bleibt die Schule geschlossen."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Während" }, { key: c, text: "Trotz" }]
        answer: b
        why: "Zeitraum → während."
      - q: "___ des schlechten Wetters spielen wir draußen."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Trotz" }, { key: c, text: "Statt" }]
        answer: b
        why: "Gegensatz (schlechtes Wetter, aber wir spielen trotzdem draußen) → trotz."
      - q: "Ich nehme Tee ___ Kaffees."
        options: [{ key: a, text: "statt" }, { key: b, text: "wegen" }, { key: c, text: "trotz" }]
        answer: a
        why: "Ersatz (Tee anstelle von Kaffee) → statt."
      - q: "___ ihrer Erkältung geht sie nicht zur Arbeit."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Statt" }, { key: c, text: "Trotz" }]
        answer: a
        why: "Grund → wegen."
      - q: "___ des Lärms konnte ich gut schlafen."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Während" }, { key: c, text: "Trotz" }]
        answer: c
        why: "Gegensatz (Lärm, aber ich konnte trotzdem schlafen) → trotz."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Beim Bäcker"
    instructions: "Choose the correct word for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Der Bäcker begrüßt ___ freundlich, als er den Laden betritt."
        options: [{ key: a, text: "der Kunde" }, { key: b, text: "den Kunden" }, { key: c, text: "dem Kunden" }]
        answer: b
        why: "begrüßen + Akkusativ, schwacher Nomen → den Kunden."
      - q: "Er zeigt ___ die frischen Brötchen."
        options: [{ key: a, text: "den Kunden" }, { key: b, text: "dem Kunden" }, { key: c, text: "der Kunde" }]
        answer: b
        why: "zeigen + Dativ, schwacher Nomen → dem Kunden."
      - q: "Trotz ___ Regens kommen viele Kunden."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv maskulin → des."
      - q: "Ein Junge steht auch in der Schlange. Der Bäcker kennt ___ gut."
        options: [{ key: a, text: "der Junge" }, { key: b, text: "den Jungen" }, { key: c, text: "dem Jungen" }]
        answer: b
        why: "kennen + Akkusativ, schwacher Nomen → den Jungen."
      - q: "Er gibt ___ ein kostenloses Brötchen."
        options: [{ key: a, text: "den Jungen" }, { key: b, text: "dem Jungen" }, { key: c, text: "der Junge" }]
        answer: b
        why: "geben + Dativ, schwacher Nomen → dem Jungen."
      - q: "Wegen ___ großen Andrangs muss der Bäcker mehr backen."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: b
        why: "Genitiv maskulin → des."
      - q: "Statt ___ Brötchen kauft eine Kundin heute nur Brot."
        options: [{ key: a, text: "der" }, { key: b, text: "des" }, { key: c, text: "dem" }]
        answer: a
        why: "Genitiv Plural → der."
      - q: "Am Ende des Tages dankt der Bäcker ___ für ihre Treue."
        options: [{ key: a, text: "die Kunden" }, { key: b, text: "den Kunden" }, { key: c, text: "der Kunden" }]
        answer: b
        why: "danken + Dativ Plural, schwacher Nomen → den Kunden."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Der neue Nachbar (Wortbank)"
    instructions: "Fill the 10 gaps. Three words in the box are not needed."
    text: |
      Seit letzter Woche haben wir {1} neuen Nachbarn. Ich habe {2} neuen
      Nachbarn noch nicht persönlich kennengelernt, aber meine Frau hat
      schon mit {3} Nachbarn gesprochen. Wegen {4} Umzugs war viel Lärm
      im Treppenhaus. Trotz {5} lauten Möbelwagen konnten wir kaum
      schlafen. Am nächsten Tag klingelte {6} Nachbar an unserer Tür und
      stellte sich vor. Wir luden {7} Nachbarn zum Kaffee ein. Während
      {8} Gesprächs erfuhren wir, dass er aus Hamburg kommt. Jetzt hilft
      mein Mann {9} Nachbarn manchmal beim Tragen der Kisten. Wegen {10}
      Hilfsbereitschaft mögen wir ihn sehr.
    bank: [EINEN, DEN, DEM, DES, DES, DER, DEN, DES, DEM, DER, EINE, DAS, DIE]
    answers:
      "1": EINEN
      "2": DEN
      "3": DEM
      "4": DES
      "5": DES
      "6": DER
      "7": DEN
      "8": DES
      "9": DEM
      "10": DER

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze den richtigen Artikel (n-Deklination und Genitiv-Präpositionen)."
    text: |
      1. Kennst du {1} neuen Studenten?
      2. Ich spreche mit {2} Studenten über das Seminar.
      3. Trotz {3} Regens gehen wir joggen.
      4. Wegen {4} Verspätung verpassen wir den Zug.
      5. {5} Junge spielt im Park.
      6. Ich habe {6} Jungen schon lange nicht gesehen.
      7. Statt {7} Bus nehmen wir das Fahrrad.
    answers:
      "1": den
      "2": dem
      "3": des
      "4": der
      "5": Der
      "6": den
      "7": des

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Ich kenne ___ Herrn dort drüben."
        options: [{ key: a, text: "der" }, { key: b, text: "den" }, { key: c, text: "dem" }]
        answer: b
        why: "kennen + Akkusativ; Herr ist ein schwacher Nomen → den Herrn."
      - q: "Er spricht mit ___ Kollegen über das Projekt."
        options: [{ key: a, text: "der" }, { key: b, text: "den" }, { key: c, text: "dem" }]
        answer: c
        why: "mit + Dativ, schwacher Nomen → dem Kollegen."
      - q: "___ des Sturms blieben wir zu Hause."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Während" }, { key: c, text: "Statt" }]
        answer: a
        why: "Grund → Wegen."
      - q: "Kennst du ___ neuen Nachbarn?"
        options: [{ key: a, text: "der" }, { key: b, text: "den" }, { key: c, text: "dem" }]
        answer: b
        why: "kennen + Akkusativ, schwacher Nomen → den Nachbarn."
      - q: "___ ihrer Krankheit kam sie trotzdem zur Arbeit."
        options: [{ key: a, text: "Wegen" }, { key: b, text: "Trotz" }, { key: c, text: "Statt" }]
        answer: b
        why: "Gegensatz → Trotz."
      - q: "Ich habe ___ Kunden schon lange nicht gesehen."
        options: [{ key: a, text: "der" }, { key: b, text: "den" }, { key: c, text: "dem" }]
        answer: b
        why: "sehen + Akkusativ, schwacher Nomen → den Kunden."
    notes: "5–6 von 6 richtig? Weiter geht's mit der B2-Version (Genitiv-Attribute, gemischte n-Deklination). Weniger als 5? Schau dir Block A noch einmal an."
