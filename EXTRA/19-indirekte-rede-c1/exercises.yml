lesson: "EX/19-indirekte-rede-c1"
title: "Indirekte Rede: Konjunktiv I vs. Ersatzform — C1"
topic: "Indirekte Rede"
level: C1
intro: >
  Standalone drill set, not tied to any lesson. Konjunktiv I only works
  as a marker of reported speech where it's actually distinct from the
  Indikativ — reliably true for 3rd person singular (er komme, er habe,
  er sei) but not for wir/sie(Pl.), where most verbs' Konjunktiv I form
  is identical to the Indikativ (wir kommen = wir kommen). When that
  happens, German switches to Konjunktiv II instead: sie kämen, sie
  hätten — or, for weak verbs whose Konjunktiv II also collides with
  their own Präteritum, to würde + Infinitiv (sie würden fordern). sein
  is the one verb whose plural Konjunktiv I (seien) stays distinct, so
  no swap is needed there. This set also covers reported yes/no and
  w-questions (ob/wie/wann + verb-final) and reported commands (sollen
  + Infinitiv). Blocks: A Basistraining → B Vertiefung →
  C Sprachbausteine → D Wiederholung. Answers in solutions.md.
exercises:

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Wenn Konjunktiv I = Indikativ: die Ersatzform"
    instructions: "Ergänze die Konjunktiv-II-Ersatzform."
    instructionsEn: "Fill in the Konjunktiv II replacement form."
    columns: ["Direkte Rede (Plural)", "Ersatzform (Konjunktiv II)"]
    rows:
      - label: "Wir haben nichts gesehen."
        cells: [{ gap: 1, answer: "sie hätten nichts gesehen" }]
      - label: "Wir gehen jetzt."
        cells: [{ gap: 2, answer: "sie gingen jetzt" }]
      - label: "Wir kommen später."
        cells: [{ gap: 3, answer: "sie kämen später" }]
      - label: "Wir machen das."
        cells: [{ gap: 4, answer: "sie würden das machen" }]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Konjunktiv I oder Ersatzform?"
    instructions: "Ergänze die richtige Form."
    instructionsEn: "Fill in the correct form."
    text: |
      1. Die Zeugen sagten: "Wir haben nichts gesehen." → Die Zeugen sagten, sie {1} nichts gesehen.
      2. Die Kinder sagten: "Wir gehen jetzt." → Die Kinder sagten, sie {2} jetzt.
      3. Er sagte: "Ich habe recht." → Er sagte, er {3} recht.
      4. Die Nachbarn sagten: "Wir kommen später." → Die Nachbarn sagten, sie {4} später.
      5. Sie sagte: "Ich bin fertig." → Sie sagte, sie {5} fertig.
      6. Die Mitarbeiter sagten: "Wir machen das." → Die Mitarbeiter sagten, sie {6} das machen.
    answers:
      "1": hätten
      "2": gingen
      "3": habe
      "4": kämen
      "5": sei
      "6": würden

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Lückentext: Der Firmensprecher"
    instructions: "Fülle die 8 Lücken mit den Wörtern aus dem Kasten. Zwei Wörter sind nicht nötig."
    instructionsEn: "Fill the 8 gaps using the words in the box. Two words are not needed."
    text: |
      Der Sprecher erklärte, die Firma {1} neue Mitarbeiter einstellen.
      Er sagte, der Gewinn {2} gestiegen. Die Mitarbeiter berichteten,
      sie {3} zufrieden. Sie sagten, sie {4} mehr Geld verdienen. Der
      Sprecher meinte, die Konkurrenz {5} stark. Die Analysten sagten,
      die Aktien {6} steigen. Er fügte hinzu, das Unternehmen {7}
      expandieren. Die Kunden beschwerten sich, dass die Preise {8}
      gestiegen.
    bank: [werde, werde, sei, sei, seien, seien, würden, würden, hätten, wären]
    answers:
      "1": werde
      "2": sei
      "3": seien
      "4": würden
      "5": sei
      "6": würden
      "7": werde
      "8": seien

  - id: B2
    block: B
    type: single-choice
    title: "3. Person Singular oder Plural?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Choose the correct answer (a, b, or c)."
    items:
      - q: "Er sagt: 'Ich habe Zeit.' → Er sagt, er ___ Zeit."
        options: [{ key: a, text: "habe" }, { key: b, text: "hätten" }, { key: c, text: "hat" }]
        answer: a
        why: "3. Person Singular → Konjunktiv I reicht (habe)."
      - q: "Sie sagen: 'Wir haben Zeit.' → Sie sagen, sie ___ Zeit."
        options: [{ key: a, text: "haben" }, { key: b, text: "hätten" }, { key: c, text: "habe" }]
        answer: b
        why: "Plural, identisch mit Indikativ → Ersatzform (hätten)."
      - q: "Er sagt: 'Ich komme morgen.' → Er sagt, er ___ morgen."
        options: [{ key: a, text: "kommt" }, { key: b, text: "kämen" }, { key: c, text: "komme" }]
        answer: c
        why: "3. Person Singular → Konjunktiv I reicht (komme)."
      - q: "Sie sagen: 'Wir kommen morgen.' → Sie sagen, sie ___ morgen."
        options: [{ key: a, text: "kämen" }, { key: b, text: "kommen" }, { key: c, text: "komme" }]
        answer: a
        why: "Plural, identisch mit Indikativ → Ersatzform (kämen)."
      - q: "Sie sagt: 'Ich bin fertig.' → Sie sagt, sie ___ fertig."
        options: [{ key: a, text: "ist" }, { key: b, text: "sei" }, { key: c, text: "wäre" }]
        answer: b
        why: "3. Person Singular → Konjunktiv I reicht (sei)."
      - q: "Sie sagen: 'Wir sind fertig.' → Sie sagen, sie ___ fertig."
        options: [{ key: a, text: "wären" }, { key: b, text: "sind" }, { key: c, text: "seien" }]
        answer: c
        why: "sein hat auch im Plural eine eigene Konjunktiv-I-Form (seien) — keine Ersatzform nötig."

  # ── Block C — Sprachbausteine ─────────────────────────────────────────────

  - id: C1
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1 — Nachrichten: Der Streik"
    instructions: "Choose the correct form for each gap (a, b, or c). The sentences form one short story."
    items:
      - q: "Der Gewerkschaftssprecher erklärte, die Arbeiter ___ höhere Löhne."
        options: [{ key: a, text: "würden fordern" }, { key: b, text: "fordern" }, { key: c, text: "forderten" }]
        answer: a
        why: "Plural, identisch mit Indikativ → würde-Ersatzform."
      - q: "Er sagte, die Verhandlungen ___ schwierig."
        options: [{ key: a, text: "sind" }, { key: b, text: "seien" }, { key: c, text: "wären" }]
        answer: b
        why: "sein hat auch im Plural eine eigene Konjunktiv-I-Form."
      - q: "Ein Journalist fragte, ob es bald eine Lösung ___."
        options: [{ key: a, text: "gibt" }, { key: b, text: "gäbe" }, { key: c, text: "gebe" }]
        answer: c
        why: "3. Person Singular → Konjunktiv I reicht (gebe)."
      - q: "Der Sprecher antwortete, das Unternehmen ___ verhandlungsbereit."
        options: [{ key: a, text: "sei" }, { key: b, text: "ist" }, { key: c, text: "wäre" }]
        answer: a
        why: "3. Person Singular → Konjunktiv I."
      - q: "Die Arbeiter sagten, sie ___ nicht aufgeben."
        options: [{ key: a, text: "geben auf" }, { key: b, text: "würden aufgeben" }, { key: c, text: "gäben auf" }]
        answer: b
        why: "Plural, identisch mit Indikativ → würde-Ersatzform."
      - q: "Man fragte sich, wie lange der Streik ___."
        options: [{ key: a, text: "dauert" }, { key: b, text: "dauerte" }, { key: c, text: "dauere" }]
        answer: c
        why: "3. Person Singular → Konjunktiv I (indirekte Frage, Verb am Ende)."
      - q: "Der Chef sagte, die Mitarbeiter ___ zur Arbeit zurückkehren."
        options: [{ key: a, text: "sollen" }, { key: b, text: "sollten" }, { key: c, text: "würden sollen" }]
        answer: b
        why: "Aufforderung in indirekter Rede → sollen (hier im Konjunktiv II: sollten)."
      - q: "Am Ende berichtete die Presse, der Streik ___ beendet."
        options: [{ key: a, text: "sei" }, { key: b, text: "ist" }, { key: c, text: "wäre" }]
        answer: a
        why: "3. Person Singular → Konjunktiv I."

  - id: C2
    block: C
    type: gap-bank
    title: "Sprachbausteine Teil 2 — Die Rede des Präsidenten (Wortbank)"
    instructions: "Fill the 10 gaps. Two words in the box are not needed."
    text: |
      Der Präsident sagte, die Wirtschaft {1} sich erholen. Er
      erklärte, die Reformen {2} notwendig. Die Minister sagten, sie
      {3} das Gesetz unterstützen. Der Präsident betonte, das Land {4}
      stark. Er sagte, die Bürger {5} Vertrauen haben. Die Opposition
      erklärte, sie {6} dagegen. Ein Reporter fragte, ob es neue Pläne
      {7}. Der Präsident antwortete, die Pläne {8} bald vorgestellt.
      Die Presse berichtete, die Rede {9} gut angekommen. Am Ende
      sagte der Präsident, er {10} zuversichtlich.
    bank: [sei, sei, sei, sei, werde, seien, würden, würden, sollten, gebe, hätten, wären]
    answers:
      "1": werde
      "2": seien
      "3": würden
      "4": sei
      "5": sollten
      "6": sei
      "7": gebe
      "8": würden
      "9": sei
      "10": sei

  # ── Block D — Wiederholung & Selbsttest ───────────────────────────────────

  - id: D1
    block: D
    type: gap-text
    listLayout: true
    title: "Gemischte Wiederholung"
    instructions: "Ergänze die richtige Form."
    text: |
      1. Er sagt, er {1} Zeit.
      2. Sie sagen, sie {2} Zeit.
      3. Sie sagt, sie {3} fertig.
      4. Sie sagen, sie {4} fertig.
      5. Er sagt, er {5} morgen.
      6. Sie sagen, sie {6} morgen.
    answers:
      "1": habe
      "2": hätten
      "3": sei
      "4": seien
      "5": komme
      "6": kämen

  - id: D2
    block: D
    type: single-choice
    title: "Selbsttest"
    instructions: "Choose the correct answer (a, b, or c). This is your final check for this set."
    items:
      - q: "Er sagt: 'Ich bin bereit.' → Er sagt, er ___ bereit."
        options: [{ key: a, text: "sei" }, { key: b, text: "ist" }, { key: c, text: "wäre" }]
        answer: a
        why: "3. Person Singular → Konjunktiv I."
      - q: "Sie sagen: 'Wir sind bereit.' → Sie sagen, sie ___ bereit."
        options: [{ key: a, text: "sind" }, { key: b, text: "seien" }, { key: c, text: "wären" }]
        answer: b
        why: "sein hat auch im Plural eine eigene Konjunktiv-I-Form."
      - q: "Er sagt: 'Ich habe recht.' → Er sagt, er ___ recht."
        options: [{ key: a, text: "hat" }, { key: b, text: "hätte" }, { key: c, text: "habe" }]
        answer: c
        why: "3. Person Singular → Konjunktiv I."
      - q: "Sie sagen: 'Wir haben recht.' → Sie sagen, sie ___ recht."
        options: [{ key: a, text: "hätten" }, { key: b, text: "haben" }, { key: c, text: "habe" }]
        answer: a
        why: "Plural, identisch mit Indikativ → Ersatzform."
      - q: "Er sagt: 'Ich gehe jetzt.' → Er sagt, er ___ jetzt."
        options: [{ key: a, text: "geht" }, { key: b, text: "gehe" }, { key: c, text: "ginge" }]
        answer: b
        why: "3. Person Singular → Konjunktiv I."
      - q: "Sie sagen: 'Wir gehen jetzt.' → Sie sagen, sie ___ jetzt."
        options: [{ key: a, text: "gehen" }, { key: b, text: "gehe" }, { key: c, text: "gingen" }]
        answer: c
        why: "Plural, identisch mit Indikativ → Ersatzform."
    notes: "5–6 von 6 richtig? Konjunktiv I (3. Person Singular, sicher) vs. Konjunktiv-II-Ersatzform (Plural, wenn identisch mit dem Indikativ) sitzen jetzt sicher — inklusive Aufforderungen mit sollen."
