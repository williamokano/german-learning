      - 'Zwei Pro-Argumente (z. B. Sicherheit, Umwelt)'
      - 'Zwei Contra-Argumente (z. B. individuelle Freiheit, Verkehrsfluss)'
      - 'Schlussfolgerung mit begründeter Neubewertung'
      - 'Mindestens drei Konnektorenpaare (einerseits/andererseits, zwar/jedoch, nicht nur/sondern auch)'
      - 'Mindestens zwei Hedging-Mittel (dürfte, vermutlich, deuten darauf hin)'
      - 'Eine unpersönliche Formulierung (Passiv / man / Passiversatz)'
      - 'Mindestens eine Themenführung („Im Folgenden …" / „Abschließend …")'
    selfCheck:
      - 'Steht die These klar in der Einleitung — und ist sie differenziert (weder Ja noch Nein)?'
      - 'Werden Pro UND Contra behandelt — mit gegensätzlichen Konnektorenpaaren?'
      - 'Wiederholt die Schlussfolgerung nur die These oder bewertet sie neu?'
      - 'Sind Hedging-Mittel vorhanden, wo die Aussage unsicher ist?'
      - 'Wurde eine Stelle unpersönlich formuliert?'
      - 'Kann man den Text rückwärts lesen, ohne dass das Auge „springt"? (Kohärenz-Check)'
    model: |
      „Im Folgenden wird die Frage untersucht, ob ein allgemeines Tempolimit von 130 km/h auf deutschen Autobahnen eingeführt werden sollte. Die vorliegende Arbeit vertritt die These, dass ein Tempolimit **dann** sinnvoll sein könnte, **wenn** es mit Maßnahmen zur Verkehrssteuerung kombiniert wird. Einerseits spricht für das Tempolimit, dass schwere Unfälle seltener würden und der CO2-Ausstoß sinken dürfte. Andererseits ist einzuwenden, dass individuelle Freiheit und die Eigenverantwortung der Fahrer\*innen beschnitten würden. **Zwar** zeigen Studien positive Sicherheitseffekte, **jedoch** hängt deren Ausmaß von der konkreten Ausgestaltung ab. **Nicht nur** der Klimaschutz, **sondern auch** die Verkehrssicherheit sprechen **demnach** für eine differenzierte Lösung. Insgesamt zeigt sich, dass die These nur unter Bedingungen aufrechterhalten werden kann — etwa bei flankierender Verkehrslenkung und begleitender Evaluation."

