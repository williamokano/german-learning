  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Erörterung — welche Reihenfolge ist korrekt?'
    optionLayout: block
    instructions: 'Wähle die korrekte Reihenfolge der Bestandteile einer linearen Erörterung.'
    items:
      - q: 'Welche Reihenfolge gehört zu einer linearen Erörterung?'
        options:
          - { key: a, text: 'Einleitung → These → Hauptteil (Pro/Contra) → Schlussfolgerung' }
          - { key: b, text: 'Einleitung → These → Schluss → Hauptteil (Pro/Contra)' }
          - { key: c, text: 'These → Einleitung → Hauptteil → Schluss' }
        answer: a
        why: 'Standard: Einleitung + These → Hauptteil (Pro und Contra) → Schlussfolgerung (Synthese).'
      - q: 'Welche Formulierung gehört in die Schlussfolgerung einer Erörterung?'
        options:
          - { key: a, text: 'Ich finde, KI ist schlecht.' }
          - { key: b, text: 'Insgesamt zeigt sich, dass die These nur bedingt aufrechterhalten werden kann.' }
          - { key: c, text: 'Zum Schluss kann man sagen, dass KI schlecht ist.' }
        answer: b
        why: 'Schlussfolgerung = begründete Neubewertung (Synthese), nicht Wiederholung der Meinung.'
      - q: 'Welche Funktion hat die Einleitung einer Erörterung?'
        options:
          - { key: a, text: 'Sie listet alle Argumente auf.' }
          - { key: b, text: 'Sie formuliert die Schlussfolgerung.' }
          - { key: c, text: 'Sie führt zum Thema hin und nennt die These.' }
        answer: c
        why: 'Einleitung: Hinführung zum Thema + Formulierung der These.'
      - q: 'Welche Aussage beschreibt eine These?'
        options:
          - { key: a, text: 'Eine differenzierte Hauptbehauptung, die im Hauptteil geprüft wird.' }
          - { key: b, text: 'Eine zufällige Behauptung ohne Begründung.' }
          - { key: c, text: 'Eine reine Meinung im Indikativ Präsens.' }
        answer: a
        why: 'Eine These ist eine differenzierte, begründete Hauptbehauptung, die der Hauptteil prüft.'
      - q: 'Welche These ist am differenziertesten formuliert?'
        options:
          - { key: a, text: 'KI ist schlecht.' }
          - { key: b, text: 'KI kann den Präsenzunterricht ergänzen, aber nicht ersetzen — nur unter klaren Bedingungen.' }
          - { key: c, text: 'KI ist gut.' }
        answer: b
        why: 'Differenzierte Thesen nennen Bedingungen, schränken ein und sind weder eindeutig Ja noch eindeutig Nein.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Konnektorenpaare ergänzen'
    instructions: 'Setze das passende Pendant ein. 8 Lücken.'
    text: |
      1. Einerseits spricht für den KI-Einsatz, {1} {2} (Stichprobenvorteil).
      2. {3} birgt der Einsatz Risiken; {4} {5} für die Datensicherheit.
      3. Lernen braucht {6} Wissen, {7} {8} soziale Bindung.
    answers:
      "1": dass
      "2": Schüler individuell gefördert werden können
      "3": Andererseits
      "4": jedoch
      "5": fehlt eine klare Regelung
      "6": nicht
      "7": sondern
      "8": auch

  - id: A3
    block: A
    type: single-choice
    title: 'Zusammenfassung — linear oder selektiv?'
    optionLayout: block
    instructions: 'Wähle die korrekte Antwort (a, b oder c).'
    items:
      - q: 'Was ist der Unterschied zwischen linearer und selektiver Zusammenfassung?'
        options:
          - { key: a, text: 'Linear = in der Reihenfolge des Originals; selektiv = nach Wichtigkeit geordnet.' }
          - { key: b, text: 'Linear = nach Wichtigkeit; selektiv = nach Reihenfolge des Originals.' }
          - { key: c, text: 'Linear = nur Einleitung; selektiv = nur Schluss.' }
        answer: a
        why: 'Linear folgt der Reihenfolge; selektiv sortiert nach Wichtigkeit (für Abstract/Thesenpapier).'
      - q: 'Welche Reduktionsstrategie passt: „Im Schulversuch in Karlsruhe, Bremen und Hamburg" → „Erste Schulversuche deuten darauf hin"?'
        options:
          - { key: a, text: 'Paraphrasieren' }
          - { key: b, text: 'Generalisieren' }
          - { key: c, text: 'Wertung herausfiltern' }
        answer: b
        why: 'Drei konkrete Beispiele werden zu einer allgemeinen Aussage zusammengefasst — Generalisierung.'
      - q: 'Welche Strategie ist es, „Das völlig missglückte Experiment zeigt, dass …" → „Das Experiment zeigt, dass …" umzuwandeln?'
        options:
          - { key: a, text: 'Paraphrasieren' }
          - { key: b, text: 'Generalisieren' }
          - { key: c, text: 'Wertungen herausfiltern' }
        answer: c
        why: 'Die Wertung „völlig missglückt" wird herausgefiltert; nur der neutrale Sachverhalt bleibt.'
      - q: 'Welche Aufgabe hat die Zusammenfassung?'
        options:
          - { key: a, text: 'Den Originaltext reduzieren, ohne ihn zu verfälschen.' }
          - { key: b, text: 'Den Originaltext bewerten.' }
          - { key: c, text: 'Den Originaltext 1:1 mit anderen Worten wiederholen.' }
        answer: a
        why: 'Zusammenfassen = Reduktion (typisch 1/5 bis 1/10 des Originalumfangs).'
      - q: 'Welche Formulierung gehört in eine Zusammenfassung?'
        options:
          - { key: a, text: 'Ich finde den Artikel super.' }
          - { key: b, text: 'Im Mittelpunkt steht die These, dass KI ergänzen, aber nicht ersetzen kann.' }
          - { key: c, text: 'Leider ist der Artikel schlecht.' }
        answer: b
        why: 'Zusammenfassungen berichten neutral; sie bewerten nicht mit „super" oder „schlecht".'

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: 'Stellungnahme: Bausteine einsetzen'
    instructions: 'Setze die passenden Redemittel ein (Position, Begründung, Gegenposition, Schluss). 5 Lücken.'
    text: |
      1. {1} nach sollte KI nicht verboten, sondern curricular eingebettet werden.
      2. Dies lässt sich vor allem {2} begründen, dass Verbote den reflektierten Umgang verhindern.
      3. {3} {4} einzuräumen, dass Datenschutzrisiken bestehen — {5} lässt sich dies durch klare Regeln lösen.
    answers:
      "1": "Meiner Auffassung"
      "2": "damit"
      "3": "Zwar"
      "4": "ist"
      "5": "jedoch"

  - id: A5
    block: A
    type: single-choice
    title: 'Abstract (IMRD) — welcher Baustein fehlt?'
    optionLayout: block
    instructions: 'Welcher IMRD-Baustein passt an der markierten Stelle?'
    items:
      - q: '„Vor dem Hintergrund der wachsenden Verbreitung von KI-Tools an Schulen …" — dies ist der Baustein …'
        options:
          - { key: a, text: 'Ziel.' }
          - { key: b, text: 'Hintergrund.' }
          - { key: c, text: 'Ergebnisse.' }
        answer: b
        why: '„Vor dem Hintergrund von …" leitet den Baustein Hintergrund ein.'
      - q: '„Ziel der vorliegenden Arbeit ist es, zu untersuchen, inwiefern KI-Tutoren die Lernmotivation steigern." — dies ist der Baustein …'
        options:
          - { key: a, text: 'Hintergrund.' }
          - { key: b, text: 'Ziel.' }
          - { key: c, text: 'Schlussfolgerung.' }
        answer: b
        why: '„Ziel der vorliegenden Arbeit ist es …" = Forschungsfrage / Ziel.'
      - q: '„Methodisch stützt sich die Arbeit auf eine Online-Befragung von 200 Studierenden." — dies ist der Baustein …'
        options:
          - { key: a, text: 'Methoden.' }
          - { key: b, text: 'Ergebnisse.' }
          - { key: c, text: 'Schlussfolgerung.' }
        answer: a
        why: 'Stichprobe + Vorgehen = Methoden.'
      - q: '„Die Ergebnisse deuten darauf hin, dass die Nutzung von KI-Tutoren mit gesteigerter Lernmotivation in Zusammenhang steht." — dies ist der Baustein …'
        options:
          - { key: a, text: 'Ziel.' }
          - { key: b, text: 'Methoden.' }
          - { key: c, text: 'Ergebnisse.' }
        answer: c
        why: '„Die Ergebnisse deuten darauf hin …" leitet die Befunde ein.'
      - q: '„Daraus lässt sich der Schluss ziehen, dass KI eine sinnvolle Ergänzung sein kann." — dies ist der Baustein …'
        options:
          - { key: a, text: 'Ergebnisse.' }
          - { key: b, text: 'Methoden.' }
          - { key: c, text: 'Schlussfolgerung.' }
        answer: c
        why: '„Daraus lässt sich der Schluss ziehen …" = Schlussfolgerung.'

  - id: A6
    block: A
    type: gap-bank
    title: 'Abstract: IMRD-Bausteine in der richtigen Reihenfolge'
    instructions: 'Füll die 5 Lücken mit den passenden Bausteinen aus dem Kasten. Sechs Wörter sind zu viel.'
    text: |
      1. Vor dem Hintergrund der wachsenden KI-Verbreitung {1} der Frage nachgegangen, ob
      KI den Unterricht ergänzen kann.
      2. Es {2} zu untersuchen, inwiefern KI-Tutoren die Lernmotivation steigern.
      3. Methodisch {3} die Arbeit auf eine Online-Befragung von 200 Studierenden.
      4. Die Ergebnisse {4} darauf hin, dass die Lernmotivation leicht gesteigert wurde.
      5. Daraus {5} sich der Schluss ziehen, dass weitere Studien nötig sind.
    bank: [wird, ist, stützt, deuten, lässt, Ziel, Hintergrund, Methode, beweisen, sollte, muss]
    answers:
      "1": wird
      "2": ist
      "3": stützt
      "4": deuten
      "5": lässt

