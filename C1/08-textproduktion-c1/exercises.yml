  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: lineare Erörterung (C1-Prüfungsformat)'
    prompt: 'Verfasse eine lineare Erörterung (12–14 Sätze) zu folgender Frage: „Sollte das Wahlalter für Bundestagswahlen auf 16 Jahre gesenkt werden?". Strukturiere klar: Einleitung + These + mindestens zwei Pro-Argumente + mindestens zwei Contra-Argumente + begründete Schlussfolgerung. Verwende mindestens drei doppelt gepaarte Konnektoren, zwei Hedging-Mittel, eine unpersönliche Formulierung und mindestens eine Themenführung sowie einen Rückverweis.'
    use:
      - 'Einleitung mit klarer, differenzierter These'
      - 'Mindestens zwei Pro-Argumente mit Beispielen oder Belegen'
      - 'Mindestens zwei Contra-Argumente mit kurzer Würdigung'
      - 'Schlussfolgerung mit begründeter Neubewertung (keine Wiederholung der These)'
      - 'Mindestens 3 doppelt gepaarte Konnektoren (einerseits/andererseits, zwar/jedoch, nicht nur/sondern auch)'
      - 'Mindestens 2 Hedging-Mittel (dürfte, vermutlich, deuten darauf hin, vermutlich …)'
      - 'Mindestens 1 unpersönliche Formulierung (Passiv / man / Passiversatz)'
      - 'Mindestens 1 Themenführung („Im Folgenden …")'
      - 'Mindestens 1 Rückverweis („wie oben dargelegt", „jener Befund" …)'
    selfCheck:
      - 'Steht die These differenziert in der Einleitung (weder Ja noch Nein)?'
      - 'Werden Pro UND Contra behandelt — mit gegensätzlichen Konnektorenpaaren?'
      - 'Wiederholt die Schlussfolgerung die These oder bewertet sie begründet neu?'
      - 'Sind Hedging-Mittel dort eingesetzt, wo die Aussage unsicher ist?'
      - 'Wurde mindestens eine Stelle unpersönlich formuliert?'
      - 'Wurde mindestens ein Rückverweis und eine Themenführung verwendet?'
      - 'Bleibt der Text durchgehend sachlich und kohärent?'
    model: |
      „Im Folgenden wird die Frage geprüft, ob das Wahlalter für Bundestagswahlen auf 16 Jahre gesenkt werden sollte. Die vorliegende Arbeit vertritt die These, dass eine moderate Senkung **dann** sinnvoll sein könnte, **wenn** eine begleitende politische Bildung sichergestellt wird. Einerseits spricht für die Senkung, dass 16-Jährige bereits jetzt steuerpflichtig sind und viele Lebensbereiche mitverantworten — ihre politische Teilhabe **sollte** dem entsprechen. **Wie oben** dargelegt, **dürfte** eine Senkung zudem das politische Interesse langfristig stärken. Andererseits ist einzuwenden, dass vielen 16-Jährigen die politische Reife **noch** fehlt. **Zwar** zeigen internationale Vergleiche positive Effekte einer Senkung, **jedoch** hängt das Gelingen stark von der politischen Bildung ab. **Nicht nur** die formale Wahlberechtigung, **sondern auch** die curriculare Vorbereitung **sollte** daher **in den Blick genommen** werden. Insgesamt zeigt sich, dass die These nur unter Bedingungen aufrechterhalten werden kann — eine Senkung **sollte** mit einer systematischen Demokratiebildung einhergehen, deren Wirksamkeit **anschließend** zu evaluieren wäre."

