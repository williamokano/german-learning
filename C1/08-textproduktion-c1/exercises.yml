lesson: C1/08
title: 'C1 · Lektion 8 — Übungen (Textproduktion C1)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause. Schreib die Erörterung
  in B8c/C5 von Hand — du lernst dabei mehr als beim reinen Lesen.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Erörterung planen)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Anna hat bereits eine klare, differenzierte These formuliert.'
        answer: true
        why: 'Anna: „KI kann den Präsenzunterricht ergänzen, aber nicht vollständig ersetzen."'
      - q: 'Mia kritisiert, dass Anna die These nicht begründet habe.'
        answer: false
        why: 'Anna nennt drei Argumente; Mia fragt nur nach, ob sie auch begründet — nicht ob sie es nicht tut.'
      - q: 'Lukas rät Anna, auch ein Pro-Argument für den Ersatz aufzunehmen, weil die Erörterung sonst versteckt wirke.'
        answer: true
        why: 'Lukas: „Du brauchst auch ein starkes Pro-Argument für den Ersatz, damit deine Erörterung ausgewogen wirkt."'
      - q: 'Lukas schlägt „Individualisierung" und „Zugang" als Pro-Argumente für den Ersatz vor.'
        answer: true
        why: 'Lukas: „Individualisierung und Zugang. KI-Tutoren können Stoff im eigenen Tempo erklären …"'
      - q: 'Mia sagt, der Schluss dürfe die These weder wiederholen noch ablehnen, sondern solle sie begründet einordnen.'
        answer: true
        why: 'Mia: „Die Schlussfolgerung darf deine These weder wiederholen noch ablehnen — sie soll sie begründet einordnen."'
      - q: 'Lukas betont, dass Kohärenz nicht nötig sei, solange man gute Argumente habe.'
        answer: false
        why: 'Lukas: „Und vergiss die Kohärenz nicht: Einerseits … andererseits; zwar … aber; nicht nur … sondern auch."'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Abstract-Sprechstunde)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Welches Schema empfiehlt Yusuf für den Aufbau des Abstracts?'
        options:
          - { key: a, text: 'IMRD (Hintergrund-Ziel-Methoden-Ergebnisse-Schlussfolgerung)' }
          - { key: b, text: 'Pro-Contra-Schluss' }
          - { key: c, text: 'Zusammenfassung-Bewertung-Empfehlung' }
        answer: a
        why: 'Yusuf: „Dann orientieren wir uns am IMRD-Schema."'
      - q: 'Welches Beispiel nennt Yusuf für Hedging in der Schlussfolgerung?'
        options:
          - { key: a, text: '„Alle Studierenden …"' }
          - { key: b, text: '„Ein Großteil der Studierenden …"' }
          - { key: c, text: '„Kein einziger Studierender …"' }
        answer: b
        why: 'Yusuf: „Statt ‚Alle Studierenden …‘ besser ‚Ein Großteil der Studierenden …‘."'
      - q: 'Was empfiehlt Yusuf zur Wiedergabe früherer Befunde?'
        options:
          - { key: a, text: 'Den Indikativ, um Klarheit zu schaffen.' }
          - { key: b, text: 'Direkte Zitate mit Anführungszeichen und Seitenangabe.' }
          - { key: c, text: 'Den Konjunktiv I, um die fremde Aussage von der eigenen abzugrenzen.' }
        answer: c
        why: 'Yusuf: „Verwenden Sie den Konjunktiv I. … So grenzen Sie die fremde Aussage von Ihrer eigenen ab."'
      - q: 'Welche Kohärenzmittel sind laut Yusuf besonders im Abstract wichtig?'
        options:
          - { key: a, text: 'Themenführungs-Sätze und Rückverweise.' }
          - { key: b, text: 'Metaphern und Wortspiele.' }
          - { key: c, text: 'Übergangswörter wie „und", „dann", „also".' }
        answer: a
        why: 'Yusuf: „Verwenden Sie Themenführungs-Sätze … und Rückverweise."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Schreibwerkstatt Erörterung'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Vier Wörter im Kasten sind zu viel.'
    text: |
      Liebe Teilnehmerinnen und Teilnehmer, willkommen zur Schreibwerkstatt
      „Erörterung leicht gemacht". Heute geht es um drei {1}. Erstens:
      Beginnen Sie jede Erörterung mit einer klaren {2}, die weder ein
      pauschales Ja noch ein pauschales Nein ist. Zweitens: Verwenden Sie
      doppelt gepaarte {3} — „einerseits … andererseits", „zwar … jedoch",
      „nicht nur … sondern auch". Drittens: Schließen Sie mit einer
      begründeten {4}, nicht mit einer Wiederholung Ihrer Eingangsthese.
      Wer diese drei Regeln {5}, wird schnell merken, dass die Erörterung
      kein Buch mit sieben Siegeln ist — sondern eine Frage der {6}.
    bank: [Grundregeln, These, Konnektoren, Neubewertung, beachtet, Übung, Fragen, Beispielen, Wiederholung, Beispiele]
    answers:
      "1": Grundregeln
      "2": These
      "3": Konnektoren
      "4": Neubewertung
      "5": beachtet
      "6": Übung

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter des Schreibzentrums'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter des Schreibzentrums der Humboldt-Universität zu Berlin erreicht. Während der Vorlesungszeit bieten wir persönliche Sprechstunden zu wissenschaftlichem Schreiben dienstags von zehn bis sechzehn Uhr an. Für eine Online-Sprechstunde vereinbaren Sie bitte einen Termin per E-Mail unter schreibzentrum at hu-berlin.de. Bitte beachten Sie: Anmeldungen für den akademischen Schreibkurs „Erörterung und Abstract" sind bis spätestens 15. Juli möglich, spätere Anmeldungen können leider nicht berücksichtigt werden. Weitere Informationen finden Sie auf unserer Internetseite unter dem Menüpunkt Service. Vielen Dank für Ihren Anruf.'
    items:
      - q: 'Welche Einrichtung ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Das International Office der HU Berlin.' }
          - { key: b, text: 'Das Schreibzentrum der Humboldt-Universität.' }
          - { key: c, text: 'Die Bibliothek der HU Berlin.' }
        answer: b
        why: '„Sie haben den Anrufbeantworter des Schreibzentrums der Humboldt-Universität zu Berlin erreicht."'
      - q: 'Wann finden die persönlichen Sprechstunden statt?'
        options:
          - { key: a, text: 'Montags von zehn bis sechzehn Uhr.' }
          - { key: b, text: 'Dienstags von zehn bis sechzehn Uhr.' }
          - { key: c, text: 'Täglich von acht bis achtzehn Uhr.' }
        answer: b
        why: '„persönliche Sprechstunden zu wissenschaftlichem Schreiben dienstags von zehn bis sechzehn Uhr."'
      - q: 'Bis wann ist die Anmeldung für den Schreibkurs möglich?'
        options:
          - { key: a, text: 'Bis 15. Juli.' }
          - { key: b, text: 'Bis 30. September.' }
          - { key: c, text: 'Bis 31. Oktober.' }
        answer: a
        why: '„Anmeldungen … sind bis spätestens 15. Juli möglich."'
      - q: 'Wie bekommt man eine Online-Sprechstunde?'
        options:
          - { key: a, text: 'Man kommt einfach ins Büro.' }
          - { key: b, text: 'Man ruft die Hotline an.' }
          - { key: c, text: 'Man vereinbart einen Termin per E-Mail.' }
        answer: c
        why: '„Für eine Online-Sprechstunde vereinbaren Sie bitte einen Termin per E-Mail."'

