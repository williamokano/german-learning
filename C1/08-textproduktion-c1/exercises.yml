  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: 'Kohärenz: Rückverweise und Themenführungen'
    instructions: 'Setze die passende Form ein (Diese, im Folgenden, wie oben, abschließend, Anschließend). 6 Lücken.'
    text: |
      1. Die {1} genannte Stichprobe umfasste 200 Personen.
      2. {2} wird die Methodik erläutert.
      3. Wie {3} dargelegt wurde, ist die Datenlage noch dünn.
      4. {4} lässt sich festhalten, dass weitere Studien nötig sind.
      5. {5} Befunde werfen eine neue Frage auf.
      6. {6} gilt es, jene Befunde kritisch zu prüfen.
    answers:
      "1": oben
      "2": "Im Folgenden"
      "3": bereits
      "4": Abschließend
      "5": Diese
      "6": "Anschließend"

  - id: A9
    block: A
    type: single-choice
    title: 'Häufige Fehler in der Textproduktion — Korrektur wählen'
    optionLayout: block
    instructions: 'Wähle die wissenschaftlich-register-adäquate Korrektur.'
    items:
      - q: '„Ich finde, KI ist schlecht." — Korrektur:'
        options:
          - { key: a, text: 'Es lässt sich argumentieren, dass KI Risiken birgt, die einer Regulierung bedürfen.' }
          - { key: b, text: 'Ich finde, KI ist doof.' }
          - { key: c, text: 'KI ist echt krass.' }
        answer: a
        why: 'Unpersönliche, vorsichtige Formulierung statt persönlicher Meinungsäußerung.'
      - q: '„Das beweist eindeutig, dass KI den Unterricht verdrängt." — Korrektur:'
        options:
          - { key: a, text: 'Das beweist zu 100 %, dass KI den Unterricht verdrängt.' }
          - { key: b, text: 'Die Ergebnisse deuten darauf hin, dass KI den Unterricht in Zukunft verändern könnte.' }
          - { key: c, text: 'KI verdrängt definitiv den Unterricht.' }
        answer: b
        why: 'Hedging durch „deuten darauf hin" + Modalverb „könnte".'
      - q: '„Schmidt sagt, dass KI alles verändert." — Korrektur:'
        options:
          - { key: a, text: 'Schmidt sagt, dass KI alles verändert.' }
