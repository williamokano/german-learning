lesson: C1/06

entries:
  # ── Konjunktiv und Modalität — 8 nouns ─────────────────────────────────────
  - de: indirekte Rede
    article: die
    plural: null
    en: reported/indirect speech
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
    example: "often uses Konjunktiv I"
  - de: Irrealis
    article: der
    plural: null
    en: the irreal; the unreal (Konjunktiv II for hypothetical/unreal statements)
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Konjunktiv I
    article: der
    plural: null
    en: subjunctive I (verb form for indirect speech and detached reporting)
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Konjunktiv II
    article: der
    plural: null
    en: subjunctive II (verb form for unreal wishes, comparisons, politeness)
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Höflichkeitsform
    article: die
    plural: Höflichkeitsformen
    en: polite form (softened request with Konjunktiv II)
    pos: noun
    tags: [linguistics, grammar, register, abstract]
    core: true
    example: "Ich hätte gern …"
  - de: Vergleich
    article: der
    plural: Vergleiche
    en: comparison (the als ob / als + Konjunktiv II form)
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Distanz
    article: die
    plural: Distanzen
    en: distance (inner/stylistic remove from what is said)
    pos: noun
    tags: [linguistics, register, abstract]
    core: true
  - de: Ersatz
    article: der
    plural: Ersätze
    en: substitute form (würde + infinitive instead of Konjunktiv I)
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true

