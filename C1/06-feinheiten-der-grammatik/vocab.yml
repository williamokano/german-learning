    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true

  # ── es-Konstruktionen — 6 nouns ──────────────────────────────────────────────
  - de: Vorfeld-es
    article: das
    plural: null
    en: 'dummy "es" in the Vorfeld (a placeholder with no meaning of its own)'
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Korrelat-es
    article: das
    plural: null
    en: '"es" as a correlate (standing in for another sentence element)'
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Existenz-es
    article: das
    plural: null
    en: '"es" in the phrase "es gibt" (there is/are)'
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: unpersönliches es
    article: das
    plural: null
    en: 'impersonal "es" (formal subject with impersonal verbs)'
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: formales Subjekt
    article: das
    plural: formale Subjekte
    en: 'formal subject ("es" that only fills the subject slot, without meaning)'
    pos: noun
    tags: [linguistics, grammar, abstract]
    core: true
  - de: Leerstelle
    article: die
    plural: Leerstellen
    en: 'empty slot (the syntactic position that "es" fills)'
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true