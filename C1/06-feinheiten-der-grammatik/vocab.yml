  # ── Wortstellung im Mittelfeld — 5 nouns ────────────────────────────────────
  - de: Wortstellung
    article: die
    plural: null
    en: word order
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Mittelfeld
    article: das
    plural: Mittelfelder
    en: middle field (the area between the finite verb and the sentence end)
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Vorfeld
    article: das
    plural: null
