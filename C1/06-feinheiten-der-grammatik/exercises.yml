          - { gap: 3, answer: 'Konjunktiv I', given: 'Konjunktiv I' }
      - label: 'Tomáš'
        cells:
          - { gap: 4, answer: 'Konjunktiv I ist genauer' }
          - { gap: 5, answer: '„würde" ist Konjunktiv II', given: '„würde" ist Konjunktiv II' }
          - { gap: 6, answer: 'Indirekte Rede', given: 'Indirekte Rede' }
      - label: 'Mia'
        cells:
          - { gap: 7, answer: 'Echte Konjunktiv-I-Form bevorzugt', given: 'Echte Konjunktiv-I-Form bevorzugt' }
          - { gap: 8, answer: 'wo noch unterscheidbar' }
          - { gap: 9, answer: 'Gehobener Stil', given: 'Gehobener Stil' }

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Konjunktiv I — welche Form ist richtig?'
    optionLayout: block
    instructions: 'Wähle die korrekte Konjunktiv-I-Form (a, b oder c).'
    items:
      - q: 'Sie sagt, sie komme morgen. — Welche Form ist das?'
        options:
          - { key: a, text: 'Indikativ Präsens.' }
          - { key: b, text: 'Konjunktiv I.' }
          - { key: c, text: 'Konjunktiv II.' }
        answer: b
        why: '„komme" ist Konjunktiv I von „kommen" — Signal für indirekte Rede.'
      - q: 'Er behauptet, er habe keine Zeit. — „habe" steht für …'
        options:
          - { key: a, text: 'Indikativ Präsens.' }
          - { key: b, text: 'Konjunktiv I von „haben".' }
          - { key: c, text: 'Konjunktiv II von „haben".' }
        answer: b
        why: '„habe" (Konjunktiv I) ≠ „hätte" (Konjunktiv II); Konjunktiv I markiert die indirekte Rede.'
      - q: 'Bei welchem Verb weicht man im 3. Pers. Sg. auf „würde" aus?'
        options:
          - { key: a, text: 'bei „sein"' }
          - { key: b, text: 'bei „haben"' }
          - { key: c, text: 'bei „machen"' }
        answer: c
        why: '„er mache" klingt wie „er macht" → man nimmt „würde machen".'
      - q: 'Welche Form ist die Ersatzform für Konjunktiv I?'
        options:
          - { key: a, text: '„hätte + Infinitiv"' }
          - { key: b, text: '„wäre + Infinitiv"' }
          - { key: c, text: '„würde + Infinitiv"' }
        answer: c
        why: '„würde + Infinitiv" ist die idiomatische Ersatzform.'
      - q: 'Welche Konjunktiv-I-Form bleibt sicher erhalten (klingt nie wie Indikativ)?'
        options:
          - { key: a, text: '„er gebe"' }
          - { key: b, text: '„er sei"' }
          - { key: c, text: '„er mache"' }
        answer: b
        why: '„er sei" ist eindeutig (Indikativ „er ist" klingt anders); „er gebe" und „er mache" sind homophon mit dem Indikativ.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Konjunktiv I bilden'
    instructions: 'Setze die passende Konjunktiv-I-Form ein (oder „würde + Infinitiv" bei Homophonie). 6 Items.'
    text: |
      1. Müller schreibt, die Methode {1} umstritten. (sein)
      2. Weber stellt fest, es {2} keine eindeutigen Belege. (geben)
      3. Schmidt betont, man {3} die Daten neu erheben. (müssen)
      4. Klein sagt, er {4} morgen zur Konferenz. (gehen)
      5. Der Autor behauptet, die Leute {5} sich nicht umgewöhnen. (wollen — Konjunktiv I 3. Pers. Pl.)
      6. Sie sagte, sie {6} krank. (sein)
    answers:
      "1": sei
      "2": gebe
      "3": müsse
      "4": würde gehen
      "5": würden
      "6": sei

  - id: A3
    block: A
    type: single-choice
    title: 'Konjunktiv II — Irrealis oder Höflichkeit?'
    optionLayout: block
    instructions: 'Wähle die korrekte Bedeutung (a, b oder c).'
    items:
      - q: '„Wenn ich Zeit hätte, würde ich mehr lesen." — Das ist …'
        options:
          - { key: a, text: 'eine reale Bedingung.' }
          - { key: b, text: 'ein Irrealis (Gegenwart).' }
          - { key: c, text: 'eine Höflichkeitsbitte.' }
        answer: b
        why: 'Irrealis Gegenwart: Bedingung steht im Konjunktiv II, Folge mit „würde".'
      - q: '„Ich hätte gern eine Tasse Kaffee." — Das ist …'
        options:
          - { key: a, text: 'ein Irrealis.' }
          - { key: b, text: 'eine Höflichkeitsbitte.' }
          - { key: c, text: 'eine Feststellung.' }
        answer: b
        why: 'Konjunktiv II zur Höflichkeit — die Bitte wird abgeschwächt.'
      - q: '„Er tut so, als ob er wüsste, worum es geht." — Das ist …'
        options:
          - { key: a, text: 'ein realer Vergleich.' }
          - { key: b, text: 'eine Höflichkeitsbitte.' }
          - { key: c, text: 'ein irrealer Vergleich.' }
        answer: c
        why: '„als ob + Konjunktiv II" = irrealer Vergleich; die Realität ist das Gegenteil.'
      - q: '„Wenn ich Zeit gehabt hätte, hätte ich mehr gelesen." — Das ist …'
        options:
          - { key: a, text: 'Irrealis Gegenwart.' }
          - { key: b, text: 'Irrealis Vergangenheit.' }
          - { key: c, text: 'Höflichkeitsbitte.' }
        answer: b
        why: '„hätte + Partizip II" (Konjunktiv II Perfekt) = Irrealis Vergangenheit.'
      - q: 'Welche Form ist KEIN Konjunktiv II?'
        options:
          - { key: a, text: '„hätte"' }
          - { key: b, text: '„wäre"' }
          - { key: c, text: '„möchte"' }
        answer: c
        why: '„möchte" ist zwar höflich, aber eine eigene Verbform (Präteritum von „mögen"), nicht Konjunktiv II.'

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: 'Konjunktiv II einsetzen'
    instructions: 'Setze die passende Konjunktiv-II-Form ein. 6 Items.'
    text: |
      1. Wenn ich Zeit {1}, würde ich mehr lesen. (Irrealis Gegenwart)
      2. Ich {2} gern eine Tasse Kaffee. (Höflichkeitsbitte)
      3. Wenn ich Zeit gehabt {3}, hätte ich mehr gelesen. (Irrealis Vergangenheit)
      4. Er tut so, als ob er {4}, worum es geht. (irrealer Vergleich)
      5. Sie verhielt sich, als {5} nichts gewesen. (irrealer Vergleich)
      6. Ich würde Ihnen {6}, den Kurs zu besuchen. (Höflichkeitsvorschlag)
    answers:
      "1": hätte
      "2": hätte
      "3": hätte
      "4": wüsste
      "5": wäre
      "6": empfehlen

  - id: A5
    block: A
    type: single-choice
    title: 'Negation — nicht oder kein?'
    optionLayout: block
    instructions: 'Wähle die korrekte Verneinung (a, b oder c).'
    items:
      - q: 'Ich habe Zeit. — Verneinung:'
        options:
          - { key: a, text: 'Ich habe keine Zeit.' }
          - { key: b, text: 'Ich habe kein Zeit.' }
          - { key: c, text: 'Ich habe nicht Zeit.' }
        answer: a
        why: '„Zeit" ist feminin → „keine" (ersetzt „eine").'
      - q: 'Er hat ein Auto. — Verneinung:'
        options:
          - { key: a, text: 'Er hat nicht ein Auto.' }
          - { key: b, text: 'Er hat kein Auto.' }
          - { key: c, text: 'Er hat keinen Auto.' }
        answer: b
        why: '„kein" ersetzt den unbestimmten Artikel „ein".'
      - q: 'Es gibt einen Ausweg. — Verneinung:'
        options:
          - { key: a, text: 'Es gibt nicht einen Ausweg.' }
          - { key: b, text: 'Es gibt kein Ausweg.' }
          - { key: c, text: 'Es gibt keinen Ausweg.' }
        answer: c
        why: '„Es gibt keinen" — maskulin Akkusativ.'
      - q: 'Das ist wahr. — Verneinung:'
        options:
          - { key: a, text: 'Das ist nicht wahr.' }
          - { key: b, text: 'Das ist kein wahr.' }
          - { key: c, text: 'Das ist kein.' }
        answer: a
        why: '„wahr" ist ein Adjektiv → „nicht", nicht „kein".'
      - q: 'Ich gehe mit. — Verneinung:'
        options:
          - { key: a, text: 'Ich gehe kein.' }
          - { key: b, text: 'Ich gehe nicht mit.' }
          - { key: c, text: 'Ich gehe kein mit.' }
        answer: b
        why: 'Bei Verben: „nicht", nicht „kein".'

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: 'Negation — Korrelate und Verstärkung'
    instructions: 'Setze das passende Wort ein. 6 Items.'
    text: |
      1. {1} der Vater {2} die Mutter wollten umkehren. (Korrelat: „weder" / „noch")
      2. {3} er, {4} auch sie kommt. (Hervorhebung + Ergänzung)
      3. Das darfst du auf {5} Fall tun. (Verstärkung)
      4. Das ist {6} unmöglich. (doppelte Verneinung = Bejahung)
    answers:
      "1": Weder
      "2": noch
      "3": Nicht nur
      "4": sondern
      "5": keinen
      "6": nicht

  - id: A7
    block: A
    type: single-choice
    title: 'Wortstellung im Mittelfeld — Tekamalo'
    optionLayout: block
    instructions: 'Wähle die idiomatische Reihenfolge (a, b oder c).'
    items:
      - q: 'Welche Reihenfolge ist idiomatisch?'
        options:
          - { key: a, text: 'Ich bin gestern wegen des Regens mit dem Auto nach Hause gefahren.' }
          - { key: b, text: 'Ich bin wegen des Regens gestern mit dem Auto nach Hause gefahren.' }
          - { key: c, text: 'Ich bin mit dem Auto nach Hause gestern wegen des Regens gefahren.' }
        answer: a
        why: 'Tekamalo: Temporal > Kausal > Modal > Lokal. (a) entspricht dieser Reihenfolge.'
      - q: 'Wo steht die Modalpartikel „doch"?'
        options:
          - { key: a, text: 'am Satzanfang.' }
          - { key: b, text: 'direkt nach dem finiten Verb.' }
          - { key: c, text: 'am Satzende.' }
        answer: b
        why: 'Modalpartikeln stehen direkt nach dem finiten Verb (Position 2).'
      - q: 'Welche Version klingt idiomatisch (Scrambling)?'
        options:
          - { key: a, text: 'Ich habe gestern den Roman, den ich seit Monaten gesucht habe, gefunden.' }
          - { key: b, text: 'Den Roman, den ich seit Monaten gesucht habe, habe ich gestern gefunden.' }
          - { key: c, text: 'Den Roman habe ich gestern den, den ich seit Monaten gesucht habe, gefunden.' }
        answer: b
        why: 'Schwere Glieder (lange Relativsätze) stehen vorne als Thema; „gestern" + Verb am Ende.'
      - q: 'Welcher Satz nutzt das schwere Glied richtig (rechts)?'
        options:
          - { key: a, text: 'Gestern habe ich das im Jahr 2020 erschienene Buch gelesen.' }
          - { key: b, text: 'Das im Jahr 2020 erschienene Buch habe ich gestern gelesen.' }
          - { key: c, text: 'Ich habe gestern gelesen das im Jahr 2020 erschienene Buch.' }
        answer: b
        why: 'Schwere Glieder (Partizipialattribute) stehen rechts oder als Thema vorne; nicht mittig.'
      - q: 'Welcher Satz ist syntaktisch schief?'
        options:
          - { key: a, text: 'Das ist doch ganz einfach.' }
          - { key: b, text: 'Das ist ja ganz einfach.' }
          - { key: c, text: 'Das ist ganz einfach doch.' }
        answer: c
        why: '„doch" steht direkt nach dem Verb (Position 2), nicht am Satzende.'

  - id: A8
    block: A
    type: single-choice
    title: 'es-Konstruktionen — welcher Typ?'
    optionLayout: block
    instructions: 'Entscheide, welche Funktion das „es" hat (a, b oder c).'
    items:
      - q: '„Es regnet." — Was für ein „es"?'
        options:
          - { key: a, text: 'Vorfeld-es.' }
          - { key: b, text: 'Korrelat-es.' }
          - { key: c, text: 'Existenz-es.' }
        answer: a
        why: 'Vorfeld-es — bloßer Platzhalter, damit das Verb an Position 2 stehen kann.'
      - q: '„Es freut mich, dass Sie da sind." — Was für ein „es"?'
        options:
          - { key: a, text: 'Vorfeld-es.' }
          - { key: b, text: 'Korrelat-es.' }
          - { key: c, text: 'Existenz-es.' }
        answer: b
        why: 'Korrelat-es — vertritt das Subjekt „die Tatsache, dass Sie da sind".'
      - q: '„Es gibt einen Ausweg." — Was für ein „es"?'
        options:
          - { key: a, text: 'Vorfeld-es.' }
          - { key: b, text: 'Korrelat-es.' }
          - { key: c, text: 'Existenz-es.' }
        answer: c
        why: 'Existenz-es — „es gibt" kündigt die Existenz von „einen Ausweg" an.'
      - q: '„Es kommt darauf an, dass wir pünktlich sind." — Was für ein „es"?'
        options:
          - { key: a, text: 'Vorfeld-es.' }
          - { key: b, text: 'Korrelat-es.' }
          - { key: c, text: 'unpersönliches es.' }
        answer: c
        why: 'Unpersönliches es — formelles Subjekt bei „kommen" in der Wendung „es kommt darauf an".'
      - q: 'Welche Version ist stilistisch aktiver (Korrelat-es umbauen)?'
        options:
          - { key: a, text: 'Es ist wichtig, dass wir das schaffen.' }
          - { key: b, text: 'Wichtig ist, dass wir das schaffen.' }
          - { key: c, text: 'Es ist das Wichtige, dass wir das schaffen.' }
        answer: b
        why: 'Adjektiv vorne ziehen + Korrelat-es weglassen → aktiver Stil.'

  - id: A9
    block: A
    type: matching
    title: 'Konjunktiv-Funktion zuordnen'
    instructions: 'Ordne jedem Satz (1–5) die richtige Funktion (a–e) zu.'
    left:
      - { key: '1', text: 'Sie sagt, sie komme morgen.' }
      - { key: '2', text: 'Wenn ich Zeit hätte, würde ich mehr lesen.' }
      - { key: '3', text: 'Ich hätte gern eine Tasse Kaffee.' }
      - { key: '4', text: 'Er tut so, als ob er wüsste, worum es geht.' }
      - { key: '5', text: 'Er behauptet, er würde das morgen machen.' }
    right:
      - { key: a, text: 'Konjunktiv I — indirekte Rede' }
      - { key: b, text: 'Konjunktiv II — Irrealis Gegenwart' }
      - { key: c, text: 'Konjunktiv II — Höflichkeit' }
      - { key: d, text: 'Konjunktiv II — irrealer Vergleich' }
      - { key: e, text: 'würde + Infinitiv — Ersatzform für Konjunktiv I' }
    answers:
      "1": a
      "2": b
      "3": c
