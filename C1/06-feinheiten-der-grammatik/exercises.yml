lesson: C1/06
title: 'C1 · Lektion 6 — Übungen (Feinheiten der Grammatik)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Sprachdebatte)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Lukas liest einen Satz aus dem Feuilleton vor, in dem „verändert habe" steht.'
        answer: true
        why: 'Lukas zitiert den Satz: „die Digitalisierung die Lesegewohnheiten verändert habe".'
      - q: 'Tomáš erklärt, dass „würde" der bevorzugte Konjunktiv für indirekte Rede sei.'
        answer: false
        why: 'Tomáš sagt: „Konjunktiv I ist da eigentlich genauer" — also die echte Form, nicht „würde".'
      - q: 'Mia meint, im gehobenen Stil bleibe man bei der echten Konjunktiv-I-Form, wo sie noch existiere.'
        answer: true
        why: 'Mia: „im gehobenen Stil bleibt man bei der echten Konjunktiv-I-Form, wo sie noch existiert".'
      - q: 'Wenn die Konjunktiv-I-Form mit dem Indikativ zusammenfällt, weicht man auf „würde" aus.'
        answer: true
        why: 'Mia: „Wenn die Form mit dem normalen Präsens identisch ist, weicht man auf ‚würde‘ aus".'
      - q: 'Am Ende bittet Lukas Mia, einen Kaffee zu machen.'
        answer: false
        why: 'Mia bittet Lukas: „mach uns mal einen Kaffee".'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Beratungsgespräch)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Worum geht es im Beratungsgespräch?'
        options:
          - { key: a, text: 'Um einen A2-Kurs.' }
          - { key: b, text: 'Um einen C1-Kurs.' }
          - { key: c, text: 'Um eine Stelle als Lehrer.' }
        answer: b
        why: 'Frau Weber: „unseren C1-Kurs".'
      - q: 'Welche beiden Hauptfunktionen des Konjunktivs II nennt Frau Weber?'
        options:
          - { key: a, text: 'Irrealis und Höflichkeit.' }
          - { key: b, text: 'Indirekte Rede und Wunsch.' }
          - { key: c, text: 'Passiv und Aktiv.' }
        answer: a
        why: 'Frau Weber: „Konjunktiv II für Irrealis … und Konjunktiv II für Höflichkeit".'
      - q: 'Bei welchem Verb weicht man NICHT auf „würde" aus?'
        options:
          - { key: a, text: 'bei „er macht"' }
          - { key: b, text: 'bei „er hat"' }
          - { key: c, text: 'bei „er geht"' }
        answer: b
        why: '„er habe" (Konjunktiv I von „haben") bleibt im gehobenen Stil erhalten — nicht „würde haben".'
      - q: 'Welche vier Funktionen des „es" nennt Frau Weber?'
        options:
          - { key: a, text: 'Vorfeld, Korrelat, Existenz, unpersönlich.' }
          - { key: b, text: 'Subjekt, Objekt, Prädikat, Adverbial.' }
          - { key: c, text: 'Temporal, Kausal, Modal, Lokal.' }
        answer: a
        why: 'Frau Weber nennt die vier „es"-Funktionen explizit: Vorfeld, Korrelat, Existenz, unpersönlich.'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Sprache und Stil'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Vier Wörter im Kasten sind zu viel.'
    text: |
      Liebe Hörerinnen und Hörer, willkommen bei „Sprachzeit". In der
      heutigen Sendung geht es um die Frage, ob das Deutsche eine
      besonders schwierige Grammatik {1}. Der Linguist Professor Berger
      meint, es {2} kaum eine Sprache, in der so viele kleine Werkzeuge
      so viel ausrichten könnten. Weder die englische noch die
      französische Grammatik {3} über ein so differenziertes System von
      Konjunktiven. Der Konjunktiv I erlaube es, fremde Aussagen
      elegant wiederzugeben; der Konjunktiv II {4} einen Raum des
      Irrealen. Nicht nur in der Wissenschaft, sondern auch in der
      Literatur {5} diese Feinheit eine zentrale Rolle. {6} lohne sich,
      so der Professor, diese Werkzeuge bewusst zu üben.
    bank: [habe, gebe, verfüge, eröffne, spiele, Es, ist, gibt, würden, müsse]
    answers:
      "1": habe
      "2": gebe
      "3": verfüge
      "4": eröffne
      "5": spiele
      "6": Es

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter des Sprachinstituts'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter des Sprachinstituts „Lingua Berlin" erreicht. Wir sind telefonisch erreichbar von Montag bis Freitag zwischen neun und siebzehn Uhr. Aktuell bieten wir einen Vorbereitungskurs auf das C1-Zertifikat an. Der Kurs beginnt am 15. September und findet zweimal wöchentlich statt, dienstags und donnerstags von achtzehn bis zwanzig Uhr. Die Anmeldung ist nur online möglich unter www.lingua-berlin.de. Für eine persönliche Beratung vereinbaren Sie bitte einen Termin per E-Mail. Bitte ruf mich zurück, falls weitere Fragen bestehen. Vielen Dank.'
    items:
      - q: 'Welche Einrichtung ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Das Sprachinstitut „Lingua Berlin".' }
          - { key: b, text: 'Das Goethe-Institut.' }
          - { key: c, text: 'Die Humboldt-Universität.' }
        answer: a
        why: '„Sie haben den Anrufbeantworter des Sprachinstituts ‚Lingua Berlin‘ erreicht."'
      - q: 'Wie ist das Institut telefonisch erreichbar?'
        options:
          - { key: a, text: 'Täglich rund um die Uhr.' }
          - { key: b, text: 'Montag bis Freitag von neun bis siebzehn Uhr.' }
          - { key: c, text: 'Nur am Wochenende.' }
        answer: b
        why: '„Wir sind telefonisch erreichbar von Montag bis Freitag zwischen neun und siebzehn Uhr."'
      - q: 'Wann beginnt der C1-Vorbereitungskurs?'
        options:
          - { key: a, text: 'Am 1. September.' }
          - { key: b, text: 'Am 1. Oktober.' }
          - { key: c, text: 'Am 15. September.' }
        answer: c
        why: '„Der Kurs beginnt am 15. September".'
      - q: 'Wie kann man sich anmelden?'
        options:
          - { key: a, text: 'Nur online unter www.lingua-berlin.de.' }
          - { key: b, text: 'Nur persönlich vor Ort.' }
          - { key: c, text: 'Nur telefonisch.' }
        answer: a
        why: '„Die Anmeldung ist nur online möglich unter www.lingua-berlin.de".'

  - id: H5
    block: H
    type: table-fill
    title: 'Tabelle ausfüllen: Dialog A (Sprachdebatte)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A noch einmal und füll die Tabelle aus. In jeder Zeile fehlt eine Information.'
    columns: ['Sprecher', 'Beobachtung', 'Begründung', 'Stichwort']
    rows:
      - label: 'Lukas'
        cells:
          - { gap: 1, answer: 'Frage zum Feuilleton-Satz', given: 'Frage zum Feuilleton-Satz' }
