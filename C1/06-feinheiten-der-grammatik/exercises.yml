  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: grammatisch präzise Stellungnahme'
    prompt: 'Verfasse eine kurze Stellungnahme (10–14 Sätze) zu der Frage: „Brauchen wir den Konjunktiv noch — oder reicht ‚würde + Infinitiv‘?" Argumentiere sachlich und abgewogen. Setze gezielt ein: Konjunktiv I (für indirekte Zitate) und/oder Konjunktiv II (für Irrealis oder Höflichkeit), mindestens eine Negation mit Korrelat (weder … noch, nicht nur … sondern auch), mindestens zwei Modalpartikeln und mindestens ein „es". Schließe mit einer vorsichtigen Folgerung.'
    use:
      - 'Mindestens 2 indirekte Zitate (Konjunktiv I oder „würde + Infinitiv")'
      - 'Mindestens 1 Konjunktiv II (Irrealis oder Höflichkeit)'
      - 'Mindestens 1 Korrelat (weder … noch / nicht nur … sondern auch)'
      - 'Mindestens 2 Modalpartikeln (doch, ja, eben, halt, wohl, schon, mal, eigentlich)'
      - 'Mindestens 1 „es" (Vorfeld, Korrelat, Existenz oder unpersönlich)'
      - 'Hedging-Mittel (dürfte, vermutlich, tendenziell) — siehe C1/05'
    selfCheck:
      - 'Habe ich indirekte Rede wirklich im Konjunktiv I wiedergegeben (oder in den Indikativ gefallen)?'
      - 'Stehen die Modalpartikeln direkt nach dem Verb (nicht am Satzende)?'
      - 'Ist die Wortstellung idiomatisch (Tekamalo, schwere Glieder rechts)?'
      - 'Wird meine eigene Meinung klar von den zitierten Positionen getrennt?'
      - 'Schließt der Text mit einer vorsichtigen, abgewogenen Folgerung?'
    model: |
      „Die Frage, ob wir den Konjunktiv noch brauchen, wird seit Jahren kontrovers diskutiert. Im Alltag hört man tatsächlich fast nur noch ‚würde + Infinitiv‘ — und es wäre verfehrt, diese Ersatzform zu verteufeln. Sie ist idiomatisch, unmissverständlich und in der gesprochenen Sprache oft die bessere Wahl. Andererseits gilt: Wer im gehobenen Register schreibt, kommt am echten Konjunktiv I nicht vorbei. Wer behauptet, die indirekte Rede brauche keinen Konjunktiv mehr, ignoriert, dass die Schriftsprache andere Mittel verlangt als die Umgangssprache. Einer verbreiteten Ansicht zufolge reiche ‚würde + Infinitiv‘ — doch weder die Linguistik noch die literarische Tradition stützen diese These. Nicht nur in der Wissenschaft, sondern auch im Feuilleton spielt der Konjunktiv I eine zentrale Rolle. Es dürfte daher sinnvoller sein, beide Formen zu beherrschen und je nach Situation die passende zu wählen. Abschließend lässt sich der Schluss ziehen, dass der Konjunktiv nicht ersetzt, wohl aber ergänzt werden sollte."

