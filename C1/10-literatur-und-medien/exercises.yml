          - { gap: 3, answer: 'kurz, kontextstiftend, leichtfüßig' }
          - { gap: 3, answer: 'drei bis vier Sätze', given: 'drei bis vier Sätze' }
          - { gap: 3, answer: 'Pointe dem O-Ton überlassen', given: 'Pointe dem O-Ton überlassen' }

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Sprachliche Bilder: welcher Tropus?'
    optionLayout: block
    instructions: 'Wähle die zutreffende Bezeichnung (a, b oder c).'
    items:
      - q: '„Die Stadt schläft."'
        options:
          - { key: a, text: 'Metapher' }
          - { key: b, text: 'Vergleich' }
          - { key: c, text: 'Symbol' }
        answer: a
        why: 'Die Stadt wird ohne „wie" mit dem Schlafen gleichgesetzt — Metapher.'
      - q: '„Ihr Haar glänzte wie schwarze Seide."'
        options:
          - { key: b, text: 'Vergleich' }
          - { key: a, text: 'Metapher' }
          - { key: c, text: 'Personifikation' }
        answer: b
        why: '„wie" markiert den Vergleich; ohne „wie" wäre es eine Metapher.'
      - q: '„Berlin hat entschieden." (für die Regierung)'
        options:
          - { key: a, text: 'Symbol' }
          - { key: b, text: 'Vergleich' }
          - { key: c, text: 'Metonymie' }
        answer: c
        why: '„Berlin" steht für die Bundesregierung — Metonymie (benachbarter Begriff).'
      - q: '„Die Taube schwebte über dem Platz."'
        options:
          - { key: a, text: 'Personifikation' }
          - { key: b, text: 'Symbol' }
          - { key: c, text: 'Metapher' }
        answer: b
        why: 'Die Taube verweist kulturell auf den Frieden — Symbol.'
      - q: '„Der Himmel weint."'
        options:
          - { key: a, text: 'Vergleich' }
          - { key: b, text: 'Metonymie' }
          - { key: c, text: 'Personifikation' }
        answer: c
        why: 'Der Himmel bekommt eine menschliche Eigenschaft (weinen) — Personifikation.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Metapher, Vergleich, Personifikation einsetzen'
    instructions: 'Setze das passende Bildelement ein. 6 Items.'
    text: |
      1. Die Stadt ist ein {1}. (Metapher: Bezug auf Gefahr)
      2. Ihr Haar glänzte {2} schwarze Seide. (Vergleich mit „wie")
      3. Der Himmel {3}. (Personifikation: menschliche Tätigkeit)
      4. Die Nacht {4} die Straßen. (Metapher: menschliches Verb auf Abstraktes)
      5. Die {5} auf dem Dach steht für den Frieden. (Symbol)
      6. „Das Weiße Haus dementierte" — {6} für die US-Regierung. (Metonymie)
    answers:
      "1": Dschungel
      "2": wie
      "3": weint
      "4": verschluckt
      "5": Taube
      "6": Metonymie

  - id: A3
    block: A
    type: matching
    title: 'Erzählperspektive: auktorial, personal, Ich-Erzähler'
    instructions: 'Ordne jeden Romanausschnitt (1–5) der passenden Erzählperspektive (a–c) zu.'
    left:
      - { key: '1', text: '„Ich erzähle heute, wie es anfing — im Herbst 1989."' }
      - { key: '2', text: '„Er ging durch den Park und ahnte nicht, dass sie ihm folgte."' }
      - { key: '3', text: '„Manche Leser glauben, der Autor wisse alles; in Wahrheit weiß nur die Hauptfigur es."' }
      - { key: '4', text: '„Sie öffnete die Tür. Wer dort stand, werden wir später erfahren."' }
      - { key: '5', text: '„Gregor blickte von seinem Bett aus auf die finstere Wohnung."' }
    right:
      - { key: a, text: 'Ich-Erzähler' }
      - { key: b, text: 'personal' }
      - { key: c, text: 'auktorial' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": c
      "5": b

  - id: A4
    block: A
    type: single-choice
    title: 'Konnotation erkennen'
    optionLayout: block
    instructions: 'Welche Konnotation hat das Wort im gegebenen Kontext?'
    items:
      - q: '„Die Stille nach dem Urteil" — welche Konnotation hat „Stille"?'
        options:
          - { key: a, text: 'emotional — Bangigkeit oder Dräuung' }
          - { key: b, text: 'emotional — Geborgenheit' }
          - { key: c, text: 'stilistisch — gehoben' }
        answer: a
        why: 'Im Kontext eines Urteils schwingt Dräuung, Drohung mit — nicht Geborgenheit.'
      - q: '„Stille der Bibliothek" — welche Konnotation hat „Stille"?'
        options:
          - { key: a, text: 'feierlich-bedrohlich' }
          - { key: b, text: 'freundlich, konzentriert' }
          - { key: c, text: 'ideologisch — konservativ' }
        answer: b
        why: 'In der Bibliothek konnotiert „Stille" Konzentration und Ruhe — freundlich.'
      - q: '„Heimat" in einem AfD-Programm — welche Konnotation dominiert?'
        options:
          - { key: a, text: 'kulturell — Nostalgie' }
          - { key: b, text: 'stilistisch — gehoben' }
          - { key: c, text: 'ideologisch — Schutz, Abgrenzung' }
        answer: c
        why: 'In einem AfD-Programm dominiert die ideologische Schutz- und Abgrenzungskonnotation.'
      - q: '„Das Heim der Familie" — welche Konnotation schwingt mit?'
        options:
          - { key: a, text: 'Staatlich-institutionelle Konnotation (Internat, Altenheim)' }
          - { key: b, text: 'Touristische Konnotation' }
          - { key: c, text: 'Wild-ökonomische Konnotation' }
        answer: a
        why: '„Heim" denotiert „Wohnung mit Versorgung" und konnotiert Institution — im Gegensatz zu „Zuhause".'
      - q: '„entschlummern" für „sterben" — welche Konnotation ist beabsichtigt?'
        options:
          - { key: a, text: 'emotional — Trauer' }
          - { key: b, text: 'stilistisch — Euphemismus, gehoben' }
          - { key: c, text: 'ideologisch — politisch' }
        answer: b
        why: '„entschlummern" ist Euphemismus, gehoben — eine Verschleierung des Todes.'

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: 'Rhetorische Figuren einsetzen'
    instructions: 'Setze die passende Figur ein (Anapher, Trikolon, Antithese, Oxymoron, Chiasmus). 6 Items.'
    text: |
      1. Die Stadt {1}. Die Stadt {2}. Die Stadt {3}. (Anapher — gleicher Satzanfang, dreimal dasselbe Verb)
      2. „Ehre, Pflicht, {4}." (Trikolon — das dritte Glied fehlt)
      3. „Die einen für die {5}, die anderen für die Sicherheit." (Antithese — Gegenüberstellung)
      4. „{6} Schweigen." (Oxymoron — widersprüchliche Adjektiv-Substantiv-Verbindung)
      5. „Die Kunst ist lang, und kurz {7} unser Leben." (Chiasmus — spiegelbildliche Verschränkung)
      6. „Er kam, er sah, er {8}." (Trikolon — drittes Glied)
    answers:
      "1": schweigt
      "2": schweigt
      "3": schweigt
      "4": Vaterland
      "5": Freiheit
      "6": Beredtes
      "7": ist
      "8": siegte

  - id: A6
    block: A
    type: matching
    title: 'Rhetorische Figuren: Definition zuordnen'
    instructions: 'Ordne jede Figur (1–5) der passenden Definition (a–e) zu.'
    left:
      - { key: '1', text: 'Anapher' }
      - { key: '2', text: 'Trikolon' }
      - { key: '3', text: 'Antithese' }
      - { key: '4', text: 'Oxymoron' }
      - { key: '5', text: 'Chiasmus' }
    right:
      - { key: a, text: 'Aufzählung in drei Teilen' }
      - { key: b, text: 'widersprüchliche Verbindung zweier Wörter' }
      - { key: c, text: 'Gegenüberstellung zweier Gegensätze' }
      - { key: d, text: 'Wiederholung am Satzanfang' }
      - { key: e, text: 'spiegelbildliche Verschränkung' }
    answers:
      "1": d
      "2": a
      "3": c
      "4": b
      "5": e

  - id: A7
    block: A
    type: single-choice
    title: 'Satirische Mittel: welches Mittel liegt vor?'
    optionLayout: block
    instructions: 'Wähle das passende satirische Mittel (a, b oder c).'
    items:
      - q: '„Das Buch liest sich wie ein Manuskript, das im Random-House-Algorithmus entstanden ist."'
        options:
          - { key: a, text: 'Sarkasmus' }
          - { key: b, text: 'Übertreibung mit ironischem Unterton' }
          - { key: c, text: 'Wortspiel' }
        answer: b
        why: 'Die Vorstellung, ein Buch stamme aus einem Algorithmus, ist **übertrieben** und transportiert eine **ironische** Bewertung.'
      - q: '„Oh, wie großzügig — Sie haben die Hälfte Ihres Vermögens gespendet."'
        options:
          - { key: a, text: 'Übertreibung' }
          - { key: b, text: 'Sarkasmus' }
          - { key: c, text: 'Indirektheit' }
        answer: b
        why: '„Oh, wie großzügig" ist eine **sarkastische** Ironie — mit spitzer Stimme.'
      - q: '„Der bekannte Schwiegersohn der bekannten Partei"'
        options:
          - { key: a, text: 'Wortspiel' }
          - { key: b, text: 'Sarkasmus' }
          - { key: c, text: 'Indirektheit' }
        answer: c
        why: 'Die Person wird nicht namentlich genannt, sondern umschrieben — das ist **Indirektheit**.'
      - q: '„Die Wahl ist wählbar — wenn die Wähler es wählen."'
        options:
          - { key: a, text: 'Wortspiel' }
          - { key: b, text: 'Ironie' }
          - { key: c, text: 'Übertreibung' }
        answer: a
        why: 'Die klangliche Wiederholung („Wahl/wählbar/Wähler/wählen") ist ein **Wortspiel**.'
      - q: '„Diese Stadt hat die dümmste Verwaltung diesseits und jenseits des Atlantiks."'
        options:
          - { key: a, text: 'Wortspiel' }
          - { key: b, text: 'Indirektheit' }
          - { key: c, text: 'Übertreibung (Hyperbel)' }
        answer: c
        why: '„diesseits und jenseits des Atlantiks" ist eine **Übertreibung** — kein konkreter Vergleich, sondern absolute Aufladung.'

  - id: A8
    block: A
    type: gap-bank
    title: 'Hörfunk-Bausteine: passendes Wort einsetzen'
    instructions: 'Füll die 6 Lücken mit dem passenden Wort aus dem Kasten. Drei Wörter sind zu viel.'
    text: |
      Ein Radio-Feature besteht aus mehreren Bausteinen. Den Anfang macht
      die {1}: Sie liefert den Kontext, nennt das Thema und gibt
      eine kleine Spannungsfigur mit. Das Herzstück ist der {2}: die
      wörtliche Originalstimme einer interviewten Person. Die {3} bildet
      die akustische Bühne — Café-Geräusche, Wind, Schritte. Zwischen
      den O-Tönen steht der {4}, der die Szenen verbindet und erklärt.
      Den Abschluss bildet die {5}: ein kurzer Bilanzsatz, oft mit
      einer offenen Frage. Wer diese fünf Bausteine beherrscht, kann
      ein {6} so collagieren, dass es wie eine kleine Hör-Erzählung
      wirkt.
    bank: [Anmoderation, O-Ton, Atmo, Sprecher, Pointe, Reportage, Bericht, Feature, Schluss]
    answers:
      "1": Anmoderation
      "2": O-Ton
      "3": Atmo
      "4": Sprecher
      "5": Pointe
      "6": Feature

  - id: A9
    block: A
    type: single-choice
    title: 'Journalistische Hörfunk-Form erkennen'
    optionLayout: block
    instructions: 'Entscheide, welche journalistische Hörfunk-Form vorliegt (a, b oder c).'
    items:
      - q: '„Um 14 Uhr versammelten sich 200 Personen vor dem Rathaus."'
        options:
          - { key: a, text: 'Bericht' }
          - { key: b, text: 'Reportage' }
          - { key: c, text: 'Feature' }
        answer: a
        why: 'Sachlich, kurz, referierend — das ist ein **Bericht**.'
      - q: '„Ich stehe im Morgengrauen vor der Fabrik. Der Wind weht mir den Pfeffergeruch herüber."'
        options:
          - { key: a, text: 'Bericht' }
          - { key: b, text: 'Reportage' }
          - { key: c, text: 'Feature' }
        answer: b
        why: 'Ich-Perspektive, szenisches Detail, **selbst** gesehen — das ist eine **Reportage**.'
      - q: '[Atmo: Schreibmaschine] — [O-Ton: „Ich schreibe gegen die Wand."] — [Sprecher: „Else Lasker-Schüler, 1933."]'
        options:
          - { key: a, text: 'Bericht' }
          - { key: b, text: 'Reportage' }
          - { key: c, text: 'Feature' }
