        options:
          - { key: a, text: 'Das Feuilleton ist überflüssig.' }
          - { key: b, text: 'Das Feuilleton schuldet Geduld, aber ohne es würde vieles fehlen — sie braucht es.' }
          - { key: c, text: 'Nur das Feuilleton rettet die Literatur.' }
        answer: b
        why: '„das Feuilleton schuldet uns mehr Geduld … ohne das Feuilleton hätte man mich 2018 nicht entdeckt — also: ja, wir brauchen es."'
      - q: 'Welche Position vertritt Bruno (Beitrag 3)?'
        options:
          - { key: a, text: 'Das Feuilleton ist durch den Algorithmus ersetzt; nur eine alte Generation liest noch.' }
          - { key: b, text: 'Das Feuilleton hat zu viel Geduld mit schlechten Texten.' }
          - { key: c, text: 'Bruno will das Feuilleton reformieren.' }
        answer: a
        why: '„Das Feuilleton war einmal. Heute zählt nur noch der Algorithmus. Wer noch liest, ist ohnehin Teil der alten Generation."'
      - q: 'Welche Position vertritt Hannah (Beitrag 4)?'
        options:
          - { key: a, text: 'Das Feuilleton verändert sich gerade zum Besseren (längere Essayform); das sollten wir unterstützen.' }
          - { key: b, text: 'Das Feuilleton ist ein Auslaufmodell.' }
          - { key: c, text: 'Nur die Essayform rettet die Literatur.' }
        answer: a
        why: '„Das Feuilleton verändert sich gerade — von der schnellen Pointe zur längeren Essayform. Diese Entwicklung kommt mir entgegen. Wir sollten sie unterstützen."'

  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: literarisches Feuilleton'
    prompt: 'Verfasse einen kurzen Feuilleton-Beitrag (8–12 Sätze) zu einem Werk deiner Wahl — einem Buch, einem Film oder einer Theaterinszenierung. Beziehe Position (mit Hedging aus C1/05), arbeite mit mindestens **einer** rhetorischen Figur und mindestens **einer** Pointe am Schluss. Schließe mit einer abgewogenen Schlussfolgerung.'
    use:
      - 'Position beziehen — aber **differenziert**, mit Hedging (dürfte, vermutlich, scheint)'
      - 'Mindestens **eine** rhetorische Figur (Anapher, Trikolon, Antithese, Oxymoron, Chiasmus)'
      - 'Mindestens **eine** Pointe am Schluss'
      - 'Mindestens ein **sprachliches Bild**, das nicht klischeehaft ist'
      - 'Strukturwörter: einerseits/andererseits, zwar/aber, zunächst/anschließend/abschließend'
    selfCheck:
      - 'Bezieht der Text eine **Position** oder bleibt er unverbindlich?'
      - 'Wird die Position **differenziert** formuliert (Hedging)?'
      - 'Steckt **eine** rhetorische Figur drin — nicht fünf?'
      - 'Gibt es eine **Pointe** am Schluss?'
      - 'Bleibt das Register **literarisch-feuilletonistisch** (keine Umgangssprache)?'
    model: |
      „Der neue Roman der Schweizer Autorin Lioba Werth — „Stillleben mit Kuckuck" — ist ein leises Buch in einer lauten Zeit. Zwar könnte man ihm vorwerfen, **zu** leise zu sein; dennoch widersteht er der Versuchung, **laut** zu werden, **mit** Bedacht. Werth arbeitet mit einer **lakonischen** Stimme, die ihre Figuren nicht **erklärt**, sondern **zeigt** — und das ist, in einer Epoche der plakativen Charaktere, eine **poetische** Geste. **Einerseits** wirken die Sätze karg, **andererseits** sind sie voll von dem, was sie **auslassen**: Andeutungen, Blicke, kleine Verschiebungen. **Zwar** ist „Stillleben mit Kuckuck" kein Buch, das man an einem Sonntag verschlingt; **aber** es ist ein Buch, das man **liest** und dann **einmal mehr** zur Hand nimmt. **Liest** man es zu Ende, bleibt das Bild eines schiefen Spiegels — und die Frage, ob die Kuckucksuhr die Zeit **misst** oder sie **erklärt**. **Wer** das Buch entdeckt, mag es zu Recht loben. **Wer** über sein Fehlen urteilt, hat es wahrscheinlich nicht **zu Ende** gelesen."

