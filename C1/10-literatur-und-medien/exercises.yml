    title: 'Erzählperspektive: Wirkung beschreiben'
    optionLayout: block
    instructions: 'Wähle die zutreffende Aussage zur Wirkung.'
    items:
      - q: 'Ein Roman wird in Ich-Form erzählt. Welche Wirkung entsteht?'
        options:
          - { key: a, text: 'Überblick und Wertung durch einen allwissenden Erzähler.' }
          - { key: b, text: 'Intimität und manchmal die Möglichkeit, dass der Erzähler sich selbst täuscht.' }
          - { key: c, text: 'Filmische Unmittelbarkeit, aber immer neutral.' }
        answer: b
        why: 'Ich-Erzähler wirken intim; sie können **unzuverlässig** sein.'
      - q: 'Ein Roman wird auktorial erzählt. Welche Wirkung entsteht?'
        options:
          - { key: a, text: 'Wir wissen alles — auch die Gedanken aller Figuren; auktoriales Erzählen wirkt oft klassisch.' }
          - { key: b, text: 'Wir sehen die Welt nur durch eine Hauptfigur.' }
          - { key: c, text: 'Wir verstehen den Text nie, weil er zu kompliziert ist.' }
        answer: a
        why: 'Auktorial = allwissend; kann heute leicht altmodisch wirken, wenn Kommentare zu viel werden.'
      - q: 'Ein Roman wird personal erzählt. Welche Wirkung entsteht?'
        options:
          - { key: a, text: 'Filmische Unmittelbarkeit, aber rätselhaft — der Leser arbeitet mit.' }
          - { key: b, text: 'Wir können jede Figur beurteilen.' }
          - { key: c, text: 'Wir wissen stets, was die Hauptfigur denkt.' }
        answer: a
        why: 'Personal = Kamera auf einer Figur; **anspruchsvoll**, weil der Leser miträtseln muss.'
      - q: 'Welche Perspektive eignet sich besonders für Geheimnisse?'
        options:
          - { key: a, text: 'Auktorial, weil der Erzähler das Geheimnis schon kennt.' }
          - { key: b, text: 'Personal, weil wir nur erfahren, was eine Figur wahrnimmt — Spannung durch Verbergen.' }
          - { key: c, text: 'Nur Ich-Erzähler funktionieren.' }
        answer: b
        why: 'Personal hält Informationen zurück und erzeugt so Spannung.'
      - q: 'Welche Perspektive eignet sich, um mehrere Handlungsstränge parallel zu erzählen?'
        options:
          - { key: a, text: 'Ich-Erzähler mit festem Standpunkt.' }
          - { key: b, text: 'Personal, weil sie nur eine Figur kennt.' }
          - { key: c, text: 'Auktorial, weil sie alle Stränge überblicken kann.' }
        answer: c
        why: 'Auktorial kann mehrere Stränge **parallel** führen.'

