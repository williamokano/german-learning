      > Ich finde, das Feuilleton schuldet uns mehr Geduld. Schnelle Verrisse helfen niemandem. Aber ohne das Feuilleton hätte man mich 2018 nicht entdeckt — also: ja, wir brauchen es.
      >
      > **Beitrag 3 — Bruno_S:**
      > Das Feuilleton war einmal. Heute zählt nur noch der Algorithmus. Wer noch liest, ist ohnehin Teil der alten Generation.
      >
      > **Beitrag 4 — Hannah (Literaturwissenschaftlerin):**
      > Ich widerspreche. Das Feuilleton verändert sich gerade — von der schnellen Pointe zur längeren Essayform. Diese Entwicklung kommt mir entgegen. Wir sollten sie unterstützen, nicht beklagen.

