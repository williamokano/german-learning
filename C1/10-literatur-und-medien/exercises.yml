lesson: C1/10
title: 'C1 · Lektion 10 — Übungen (Literatur und Medien)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Feuilleton-Diskussion)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Anna liest einen Feuilleton-Artikel über einen Roman von Helga Schubert.'
        answer: true
        why: 'Anna: „Habt ihr schon den Artikel von Reichelt in der FAZ gelesen? Über den Schubert-Roman?"'
      - q: 'Mia erklärt, das Wort „entrückt" habe im Feuilleton-Kontext nur eine Bedeutungsschicht.'
        answer: false
        why: 'Bruno: „hat aber noch eine zweite Bedeutungsschicht: leicht entrückt von der Wirklichkeit, also auch ein bisschen entrückt von Gott".'
      - q: 'Mia hält das Bild „Die Sätze fallen wie fallende Blätter" für ein Klischee, das im konkreten Kontext trotzdem funktioniert.'
        answer: true
        why: 'Mia: „ein Klischée ist es — aber hier funktioniert es, weil Schubert selbst in diesem Tonfall schreibt."'
      - q: 'Bruno sagt, Reichelts Spitze gegen den Glavic-Roman sei eine Satire, kein Sachurteil.'
        answer: true
        why: 'Bruno: „Das ist eine Satire, kein Sachurteil."'
      - q: 'Mia zufolge ist Ironie stärker als Direktheit, weil sie den Leser klüger fühlen lässt.'
        answer: true
        why: 'Mia: „Weil Ironie stärker ist als Direktheit — der Leser fühlt sich klug, wenn er die Pointe mitkriegt."'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Literaturkritik und Hörfunk)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Worin sieht Frau Hoffmann den größten Reibungspunkt zwischen Feuilleton und Literaturwissenschaft?'
        options:
          - { key: a, text: 'Darin, dass das Feuilleton Schnelligkeit belohnt, die Wissenschaft aber Differenzierung.' }
          - { key: b, text: 'In der Bezahlung der Kritikerinnen.' }
          - { key: c, text: 'Darin, dass das Feuilleton nie Satire einsetzt.' }
        answer: a
        why: 'Frau Hoffmann: „Das Feuilleton belohnt Schnelligkeit, Pointe und Zuspitzung — die Wissenschaft belohnt Differenzierung."'
      - q: 'Wie unterscheidet Frau Hoffmann Satire von Polemik?'
        options:
          - { key: a, text: 'Satire greift immer Personen an, Polemik immer Institutionen.' }
          - { key: b, text: 'Polemik kann persönlich werden; die deutsche Satiretradition arbeitet mit Übertreibung, gegen plumpe Beleidigung.' }
          - { key: c, text: 'Satire ist immer lustig, Polemik immer traurig.' }
        answer: b
        why: 'Frau Hoffmann: „Die deutsche Satiretradition … arbeitet mit der Übertreibung, gegen die plumpe Beleidigung."'
      - q: 'Welches Problem sieht Yusuf bei Radio-Features zu Satire?'
        options:
          - { key: a, text: 'Dass die O-Töne im Radio nie authentisch klingen.' }
          - { key: b, text: 'Dass das Radio keine Satire senden darf.' }
          - { key: c, text: 'Dass die Auswahl der O-Töne bereits eine Deutung ist.' }
        answer: c
        why: 'Yusuf: „welche O-Töne wähle ich? Eine Auswahl ist bereits eine Deutung."'
      - q: 'Was empfiehlt Frau Hoffmann gegen die sogenannte „Glättung" der Satire?'
        options:
          - { key: a, text: 'Die Ironie in der Stimme sei subtil genug und brauche keine Erklärung; was den Hörer verwirre, sei die schlechte Anmoderation.' }
          - { key: b, text: 'Man solle die Satire im Radio durch Hintergrundmusik überdecken.' }
          - { key: c, text: 'Man solle den satirischen Witz im Radio grundsätzlich erklären.' }
        answer: a
        why: 'Frau Hoffmann: „Ironie in der Stimme eines Schauspielers … ist subtil genug; sie muss nicht erklärt werden."'
      - q: 'Wie sieht laut Frau Hoffmann die ideale Anmoderation für ein Satire-Feature aus?'
        options:
          - { key: a, text: 'Lang, detailliert, mit Biografie der Autorin.' }
          - { key: b, text: 'Kurz, kontextstiftend, leichtfüßig — drei Sätze — und dann den O-Ton das Wort überlassen.' }
          - { key: c, text: 'Reine Inhaltsangabe des Romans.' }
        answer: b
        why: 'Frau Hoffmann: „kurz, kontextstiftend und leichtfüßig — drei Sätze, vielleicht vier."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Ein Radio-Feature zur Gegenwartsliteratur'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Liebe Hörerinnen und Hörer, willkommen zu „Stimmen der Nacht". Drei
      {1} sprechen heute über das Licht in ihren Texten. Mara Lunau aus
      Leipzig sagt, sie schreibe {2} das Vergessen. Helga Schubert aus
      Berlin sagt, sie schreibe die Sätze, die ihr abends in den Sinn
      kommen, {3} mehr und nicht weniger. Leonie Schuller aus München
      sagt, sie schreibe, weil sie das Schweigen nicht {4}. Wir hören
      zuerst Mara Lunau. Sie sitzt in einem Leipziger Café, der Regen
      {5} leise gegen die Scheibe. „Ich glaube, ein Roman kann immer nur
      eine Frage ernst {6}. Alles andere ist Geschwätz."
    bank: [Autorinnen, gegen, nicht, aushalte, klopft, nehmen, Romane, hallte, weckte]
    answers:
      "1": Autorinnen
      "2": gegen
      "3": nicht
      "4": aushalte
      "5": klopft
      "6": nehmen

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter eines Literaturhauses'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter des Literaturhauses Berlin erreicht. Wir sind bis einschließlich Samstag, 16 Uhr, geöffnet. Am Sonntag bleibt das Haus geschlossen. Für die Lesung mit Helga Schubert am Dienstag, 19 Uhr, sind alle Plätze vergriffen — eine Warteliste ist eingerichtet. Bitte rufen Sie uns zurück unter der Nummer 030-5512-0817, oder schreiben Sie uns an lesungen@literaturhaus-berlin.de. Die neue Anthologie „Stimmen der Nacht" liegt an der Kasse zum Preis von zweiundzwanzig Euro bereit. Vielen Dank für Ihren Anruf.'
    items:
      - q: 'Welche Einrichtung spricht auf dem Anrufbeantworter?'
        options:
          - { key: a, text: 'Das Literaturhaus Berlin.' }
          - { key: b, text: 'Eine Buchhandlung mit eigenem Verlagsprogramm.' }
          - { key: c, text: 'Die Stadtbibliothek Berlin.' }
        answer: a
        why: '„Sie haben den Anrufbeantworter desLiteraturhauses Berlin erreicht."'
      - q: 'Bis wann ist das Literaturhaus geöffnet?'
        options:
          - { key: a, text: 'Bis einschließlich Freitag, 18 Uhr.' }
          - { key: b, text: 'Bis einschließlich Samstag, 16 Uhr.' }
          - { key: c, text: 'Täglich bis 20 Uhr.' }
        answer: b
        why: '„Wir sind bis einschließlich Samstag, 16 Uhr, geöffnet."'
      - q: 'Was gilt für die Lesung mit Helga Schubert am Dienstag, 19 Uhr?'
        options:
          - { key: a, text: 'Es gibt noch Karten an der Abendkasse.' }
          - { key: b, text: 'Die Lesung fällt aus.' }
          - { key: c, text: 'Alle Plätze sind vergriffen; eine Warteliste ist eingerichtet.' }
        answer: c
        why: '„sind alle Plätze vergriffen — eine Warteliste ist eingerichtet."'
      - q: 'Wie können Interessierte das Literaturhaus erreichen?'
        options:
          - { key: a, text: 'Per Telefon unter 030-5512-0817 oder per E-Mail.' }
          - { key: b, text: 'Nur persönlich vor Ort.' }
          - { key: c, text: 'Ausschließlich über die Webseite.' }
        answer: a
        why: '„Bitte rufen Sie uns zurück unter der Nummer 030-5512-0817, oder schreiben Sie uns an lesungen@literaturhaus-berlin.de."'

  - id: H5
    block: H
    type: table-fill
    title: 'Tabelle ausfüllen: Dialog B (Satire und Hörfunk)'
