  - id: B8
    block: B
    type: free-write
    title: 'Eine Anmoderation schreiben'
    prompt: 'Verfasse eine kurze Anmoderation (3–4 Sätze) für ein Radio-Feature zu einem satirischen Roman einer fiktiven Autorin. Nenne Werk und Thema in einem Bild, einer rhetorischen Frage oder einem Zitat — aber erkläre den Witz nicht.'
    stimulus: |
      Ausgangslage: Du arbeitest im Kulturprogramm eines Senders. Du sollst ein 20-minütiges Feature zu einem neuen Roman der Schriftstellerin Vera Lessing ankündigen. Der Roman heißt „Die unsichtbare Sitzung" und porträtiert eine Behörde, die beschließt, **nichts** zu beschließen. Es ist eine politische Satire.
    use:
      - 'Erwähne Werk, Autorin und das zentrale Bild des Romans'
      - 'Setze eine rhetorische Frage oder ein Bild als Spannungsfigur'
      - 'Drei bis vier Sätze — keine Inhaltsangabe'
      - 'Erkläre den satirischen Witz nicht — überlasse ihn dem O-Ton'
    selfCheck:
      - 'Bleibt die Anmoderation wirklich bei **drei bis vier** Sätzen?'
      - 'Wird das Werk knapp benannt (Titel, Autorin)?'
      - 'Wird das Bild / die rhetorische Frage **vor** der Pointe gesetzt?'
      - 'Wird der Witz erklärt oder offen gelassen?'
    model: |
      „Willkommen zu „Stimmen der Nacht". In unserer heutigen Folge begegnen wir einer Behörde, die beschlossen hat, **nichts** zu beschließen — und genau daraus macht Vera Lessing einen Roman. „Die unsichtbare Sitzung" liest sich wie das Protokoll einer Sitzung, die nie stattfand — und die trotzdem Folgen hat. Wir hören die Autorin, wir hören ihre schärfste Kritikerin, und wir hören einen Verwaltungsjuristen, der sich fragt, was eigentlich beschlossen wurde. Ich bin Yusuf El-Sayed, ich wünsche Ihnen gute Unterhaltung."

  - id: B9
    block: B
    type: free-write
    title: 'Eine Mini-Satire verfassen'
    prompt: 'Verfasse eine kurze Mini-Satire (5–6 Sätze) zu einem gesellschaftlichen Phänomen deiner Wahl. Wähle ein **klares** Angriffsziel, setze **eine** rhetorische Figur ein und vermeide platte Beleidigungen.'
    stimulus: |
      Ausgangslage: Du bist auf einer literarischen Veranstaltung gebeten worden, eine Mini-Satire beizusteuern. Sie wird im Newsletter eines kleinen Verlags abgedruckt. Wähle ein Phänomen aus dem Alltag — z. B. „Sonntagsreden", „Online-Vorstellungsgespräche", „Konferenz-Sprache", „Zeitungs-App-Bezahlmauern" — und schreibe eine zugespitzte, aber treffsichere Satire.
    use:
      - 'Ein **klares** Angriffsziel (nenne es ruhig beim Namen oder umschreibe es indirekt)'
      - 'Mindestens **eine** rhetorische Figur (Übertreibung, Sarkasmus, Wortspiel, Antithese)'
      - 'Mindestens **eine** Pointe am Schluss'
      - 'Vermeide direkte Beleidigungen — auch im satirischen Register'
      - 'Mindestens eine Wendung mit **Konnotation** (z. B. „beredtes Schweigen", „die übliche Sonntagsrhetorik")'
    selfCheck:
      - 'Ist das Angriffsziel klar?'
      - 'Steckt **eine** rhetorische Figur drin (nicht fünf)?'
      - 'Gibt es eine Pointe — und kommt sie erst am Schluss?'
      - 'Bleibt der Text im **literarisch-feuilletonistischen** Register?'
      - 'Wird niemand **persönlich** beleidigt?'
    model: |
      „Es gibt Reden, die so klingen, als wären sie für ein Publikum geschrieben, das nicht da ist. Sonntagsreden reden so, wie das Wetter **redet** — eigentlich sagt es nichts, aber es klingt wichtig. Wer zuhört, nickt, weil das Nicken **die** Sonntagsgebärde ist; es kostet weniger als Zustimmung. Die Pointe bleibt aus — und das **ist** die Pointe. Wer so redet, hat sein Publikum **nie** ganz verloren, weil er es **nie ganz hatte**. Das Schweigen danach ist das **beredteste** der ganzen Woche."

