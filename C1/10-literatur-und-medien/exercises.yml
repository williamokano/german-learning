        why: 'Übertreibung, Ironie und Sarkasmus sind satirische Mittel; Ballade ist eine literarische Gattung.'
      - items: [O-Ton, Atmo, Anmoderation, Sarkasmus]
        odd: 3
        why: 'O-Ton, Atmo und Anmoderation sind Bausteine eines Features; Sarkasmus gehört zur Satire.'
      - items: [Konnotation, Denotation, Polysemie, Feuilleton]
        odd: 3
        why: 'Konnotation, Denotation und Polysemie sind semantische Begriffe; Feuilleton ist eine Textsorte / ein Zeitungsteil.'
      - items: [Symbol, Metonymie, Personifikation, Konnotation]
        odd: 3
        why: 'Symbol, Metonymie und Personifikation sind Tropen; Konnotation ist ein semantischer Begriff.'

