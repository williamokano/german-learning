# Reviewed from C1/10 lesson.md §4 Wortschatz.
# Note: all 5 tables use German-only paraphrase — no draft to patch, every entry
# hand-derived and hand-translated from source. Two near-verbatim duplicates
# excluded: "Anapher" (identical core definition to C1/09's entry, different but
# equally generic example — no new content); "Ironie" (identical core definition
# to C1/01's entry, no new example given in this lesson's table at all). "Ellipse"
# kept despite overlapping C1/02 — genuinely new framing (rhetorical/suggestive
# effect vs. syntactic theory) with a new example. "Übertreibung" kept even though
# glossed as a synonym of C1/01's "Hyperbel" — it's a headword never previously
# introduced on its own.
#
# Section headers in lesson.md:
#   Sprachliche Bilder — die fünf wichtigsten Tropen  — 5 nouns
#   Rhetorische Figuren                                — 6 nouns (Anapher excluded, dup)
#   Feuilleton und Literaturkritik                      — 18 items (nouns + adjectives)
#   Satire — Mittel und Wirkung                         — 7 nouns (Ironie excluded, dup)
#   Hörfunk — journalistische Formen                    — 8 nouns
lesson: C1/10

entries:
  # ── Sprachliche Bilder — die fünf wichtigsten Tropen — 5 nouns ─────────────
  - de: Metapher
    article: die
    plural: Metaphern
    en: metaphor (an image without a comparison word — the literal is replaced by something else)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Die Stadt ist ein Dschungel."
  - de: Vergleich
    article: der
    plural: Vergleiche
    en: simile (an image WITH a comparison word — wie, als, als ob)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Die Stadt ist wie ein Dschungel."
  - de: Personifikation
    article: die
    plural: Personifikationen
    en: personification (human traits attributed to a thing)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Die Stadt atmet / schläft / beobachtet."
  - de: Symbol
    article: das
    plural: Symbole
    en: symbol (an image pointing beyond itself to a larger context)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Die Taube auf dem Dach steht für die Sehnsucht nach Frieden."
  - de: Metonymie
    article: die
    plural: Metonymien
    en: metonymy (a term standing for a neighboring, not identical, concept)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: '"Berlin hat entschieden" — Berlin steht für die deutsche Bundesregierung.'

  # ── Rhetorische Figuren — 6 nouns (Anapher excluded, dup of C1/09) ────────
  - de: Trikolon
    article: das
    plural: Trikola
    en: tricolon (a list of three parts — rhythmically effective; = Dreierfigur)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Wir kommen, wir sehen, wir siegen."
  - de: Antithese
    article: die
    plural: Antithesen
    en: antithesis (juxtaposing two opposing ideas)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Die einen glauben an Gott, die anderen an gar nichts."
  - de: Oxymoron
    article: das
    plural: Oxymora
    en: oxymoron (combining two contradictory words)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "beredtes Schweigen"
  - de: Chiasmus
    article: der
    plural: Chiasmen
    en: chiasmus (mirror-image structure, A B B A)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Die Kunst ist lang, und kurz ist unser Leben."
  - de: Ellipse
    article: die
    plural: Ellipsen
    en: ellipsis (a sentence missing an expected part — used for suggestive effect)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Nichts. Gar nichts."
  - de: Litotes
    article: die
    plural: null
    en: litotes (double negation as understatement)
    pos: noun
    tags: [literature, rhetoric, abstract]
    core: true
    example: "Das war nicht unbedingt sein bester Abend."

