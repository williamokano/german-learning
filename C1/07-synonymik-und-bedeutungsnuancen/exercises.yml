  - id: A11
    block: A
    type: odd-one-out
    title: 'Odd one out: Synonyme Gruppen'
    instructions: 'Streiche das Wort, das nicht passt, und erkläre warum.'
    groups:
      - items: [untersuchen, erforschen, prüfen, bestehen]
        odd: 3
        why: '„bestehen" ist kein Synonym für „systematisch mit einer Sache umgehen"; die anderen drei sind es.'
      - items: [vermeiden, umgehen, unterbinden, akzeptieren]
        odd: 3
        why: '„akzeptieren" ist das Gegenteil der anderen drei (etwas zulassen statt vermeiden).'
      - items: [Problem, Aufgabe, Herausforderung, Frage]
        odd: 3
        why: '„Frage" beantwortet man; „Problem / Aufgabe / Herausforderung" löst / bearbeitet / meistert man.'
      - items: [Grund, Ursache, Anlass, Zweck]
        odd: 3
        why: '„Zweck" ist eine Absicht (Ziel); die anderen drei sind Auslöser / Erklärungen.'
      - items: [Meinung, Auffassung, Ansicht, Beweis]
        odd: 3
        why: '„Beweis" ist ein Nachweis; die anderen drei sind subjektive Standpunkte.'
      - items: [aktuell, sensibel, eventuell, sorgfältig]
        odd: 3
        why: '„aktuell / sensibel / eventuell" sind klassische falsche Freunde; „sorgfältig" nicht.'

