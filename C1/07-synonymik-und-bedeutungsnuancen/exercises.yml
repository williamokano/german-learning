  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: Synonymik in der Stellungnahme'
    prompt: 'Verfasse eine kurze Stellungnahme (8–12 Sätze) zu der Frage: „Brauchen wir im Deutschen wirklich so viele ‚synonyme‘ Wörter — oder wäre weniger mehr?" Argumentiere sachlich und abwägend. Setze dabei bewusst **drei** nahezu-synonyme Wörter aus dem Unterricht ein (z. B. aus den Gruppen Problem/Aufgabe/Herausforderung/Schwierigkeit oder Meinung/Auffassung/Ansicht/Überzeugung) und erkläre ihre Wirkung. Verwende unpersönliche Formulierungen, Hedging und mindestens einen Verweis. Schließe mit einer abgewogenen Schlussfolgerung.'
    use:
      - 'Mindestens 3 nahezu-synonyme Wörter aus §6.2 (mit Bedeutungsunterschied)'
      - 'Unpersönlicher, sachlicher Stil (Passiv, man, Passiversatz)'
      - 'Hedging an mindestens zwei Stellen (dürfte, deutet darauf hin, vermutlich …)'
      - 'Mindestens 1 Verweis (laut …, einer Studie zufolge …)'
      - 'Strukturwörter: einerseits/andererseits, im Folgenden, abschließend, demnach'
    selfCheck:
      - 'Habe ich die drei synonymen Wörter wirklich im unterschiedlichen Sinn verwendet?'
      - 'Bleibt der Text durchgehend unpersönlich und sachlich?'
      - 'Ist die Argumentation abgewogen (kein „beweist eindeutig")?'
      - 'Habe ich Hedging und einen Verweis eingebaut?'
      - 'Schließt der Text mit einer klaren, aber vorsichtigen Folgerung?'
    model: |
      „Die Frage, ob das Deutsche zu viele ‚synonyme‘ Wörter braucht, wird seit Langem kontrovers diskutiert. Im Folgenden werden die wichtigsten Argumente gegeneinander abgewogen. Einerseits kann eine feine Wortwahl — die bewusste Wahl zwischen ‚Problem‘, ‚Aufgabe‘, ‚Herausforderung‘ und ‚Schwierigkeit‘ — eine Aussage deutlich präziser machen. Andererseits führt eine zu große Auswahl dazu, dass Lernende überfordert werden und im Zweifel das falsche Wort wählen. Einer Untersuchung des Goethe-Instituts zufolge dürfte die bewusste Unterscheidung zwischen ‚Meinung‘, ‚Auffassung‘, ‚Ansicht‘ und ‚Überzeugung‘ für viele Lernende eine besondere Hürde darstellen. Allerdings darf man die Schwierigkeit der Wahl nicht gegen ihren Nutzen ausspielen. Es deutet einiges darauf hin, dass eine bewusste Schulung der Synonymik die sprachliche Präzision erhöht, ohne die Verständlichkeit zu gefährden. Demnach sollte der Wortreichtum des Deutschen nicht reduziert, sondern besser vermittelt werden. Abschließend lässt sich der Schluss ziehen, dass die feinen Unterschiede eine Bereicherung sind — vorausgesetzt, man lernt sie bewusst."

