      - { key: b, text: 'eine Sache auf ihre Eignung kontrollieren' }
      - { key: c, text: 'unter realen Bedingungen erproben' }
      - { key: d, text: 'aktiv stoppen, nicht zulassen' }
      - { key: e, text: 'etwas zugestehen, anerkennen' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e

