      2. Diese Woche steht eine schwere {2} an.
      3. Wir freuen uns auf die {3}, mit einem internationalen Team zu arbeiten.
      4. Beim Umzug gab es einige {4}.
      5. Die {5} ist, dass die Serverlast zu hoch ist.
      6. Das ist ein {6}, das wir schnell lösen müssen.
    answers:
      "1": Problem
      "2": Aufgabe
      "3": Herausforderung
      "4": Schwierigkeiten
      "5": Ursache
      "6": Problem

  - id: A6
    block: A
    type: matching
    title: 'Verben: Bedeutung zuordnen'
    instructions: 'Ordne jedem Verb (1–5) die passende Bedeutung (a–e) zu.'
    left:
      - { key: '1', text: 'erforschen' }
      - { key: '2', text: 'prüfen' }
      - { key: '3', text: 'testen' }
      - { key: '4', text: 'unterbinden' }
      - { key: '5', text: 'einräumen' }
    right:
