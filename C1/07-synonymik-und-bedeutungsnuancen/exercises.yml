lesson: C1/07
title: 'C1 · Lektion 7 — Übungen (Synonymik und Bedeutungsnuancen)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Streit über das richtige Wort)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Anna findet, dass ihre Chefin das Wort „Herausforderung" zu Unrecht benutzt.'
        answer: true
        why: 'Anna sagt: „Aber ehrlich gesagt ist das einfach ein Problem."'
      - q: 'Mia erklärt, „Herausforderung" sei ein Codewort für „Chance".'
        answer: true
        why: 'Mia: „In der Wirtschaftssprache ist ‚Herausforderung‘ ein Codewort für ‚Problem, an dem du wachsen sollst‘."'
      - q: 'Bruno hält „Aufgabe" für das Wort, das die Chefin benutzen würde.'
        answer: false
        why: 'Bruno: „Deine Chefin würde ‚Aufgabe‘ nicht sagen, das klingt ihr zu wenig nach Strategie."'
      - q: 'Anna schlägt am Ende vor, „dringende Aufgabe" zu schreiben.'
        answer: true
        why: 'Anna: „Ich schreib meiner Chefin einfach: ‚Das Tool-Problem ist eine dringende Aufgabe, die wir gemeinsam lösen‘."'
      - q: 'Anna findet, dass man mit dem falschen Wort „defätistisch" klingt.'
        answer: true
        why: 'Anna: „Aber wenn ich in meiner Antwort schreibe ‚Das sehe ich als Problem‘, klingt das defätistisch."'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Lektorin und Autorin)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Welches Wort nennt Frau Steinmeyer-Roth als Erstes als problematisch?'
        options:
          - { key: a, text: '"realisieren"' }
          - { key: b, text: '"aktuell"' }
          - { key: c, text: '"bald"' }
        answer: b
        why: 'Frau Steinmeyer-Roth: „Sie verwenden im Kapitel über Achtsamkeit sehr häufig das Wort ‚aktuell‘."'
      - q: 'Was bedeutet „aktuell" laut Frau Steinmeyer-Roth im Deutschen NICHT?'
        options:
          - { key: a, text: 'Gegenwärtig.' }
          - { key: b, text: 'Neu, top-aktuell.' }
          - { key: c, text: '"actually" (eigentlich).' }
        answer: c
        why: 'Frau Steinmeyer-Roth: „Beides meint nicht actually im Englischen Sinne."'
      - q: 'Welches deutsche Wort schlägt Frau Steinmeyer-Roth als Ersatz für „actually" vor?'
        options:
          - { key: a, text: '"gegenwärtig".' }
          - { key: b, text: '"in Wirklichkeit".' }
          - { key: c, text: '"aktuell".' }
        answer: b
        why: 'Frau Steinmeyer-Roth: „Eigentlich, tatsächlich, in Wirklichkeit — das wäre die deutsche Entsprechung."'
      - q: 'Welches dritte Wort kritisiert Frau Steinmeyer-Roth?'
        options:
          - { key: a, text: '"eventuell".' }
          - { key: b, text: '"sensibel".' }
          - { key: c, text: '"konservativ".' }
        answer: a
        why: 'Frau Steinmeyer-Roth: „Sie schreiben: ‚Das ist eine eventuelle Möglichkeit.‚"'
      - q: 'Warum ist „bald" für ein in sechs Monaten erscheinendes Buch unpassend?'
        options:
          - { key: a, text: 'Weil „bald" im Deutschen „nie" bedeutet.' }
          - { key: b, text: 'Weil „bald" „in wenigen Tagen oder Wochen" heißt.' }
          - { key: c, text: 'Weil „bald" ein falscher Freund aus dem Englischen ist.' }
        answer: b
        why: 'Frau Steinmeyer-Roth: „Bald heißt im Deutschen ‚in kurzer Zeit, in wenigen Tagen oder Wochen‘. Ihr Buch erscheint in sechs Monaten — da ist ‚bald‘ unpassend."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Synonyme im Sprachpodcast'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Liebe Zuhörerinnen und Zuhörer, willkommen zu „Sprachwerkstatt". In
      der heutigen Folge geht es um eine Frage, die uns in der Redaktion
      regelmäßig {1}: Warum gibt es im Deutschen so viele Wörter für ein
      und dieselbe Sache? Wenn ein Kunde uns mitteilt, er habe ein {2},
      dann fragen wir uns: Ist es ein Problem, eine Aufgabe, eine
      {3} oder eine Schwierigkeit? Die Wörter klingen
      ähnlich, sind aber nicht {4}. Ein Problem verlangt eine Lösung,
      eine Aufgabe eine {5}, eine Herausforderung eine Annahme und eine
      Schwierigkeit eine Überwindung. Unsere Empfehlung lautet deshalb:
      Wer im Deutschen schreibt, sollte sich die feinen Unterschiede
      bewusst machen — nicht als pedantische Korrektur, sondern als
      Werkzeug der {6}.
    bank: [beschäftigt, Problem, Herausforderung, austauschbar, Bearbeitung, Präzision, Aufgabe, schwierig, Definition, Korrektur]
    answers:
      "1": beschäftigt
      "2": Problem
      "3": Herausforderung
      "4": austauschbar
      "5": Bearbeitung
      "6": Präzision

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter einer Sprachschule'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter des Sprachzentrums Berlin erreicht. Wir sind erreichbar von Montag bis Freitag, jeweils von zehn bis achtzehn Uhr. Außerhalb dieser Zeiten können Sie uns eine Nachricht hinterlassen — bitte rufen Sie mich zurück, wenn Sie eine persönliche Beratung wünschen. Aktuell bieten wir Kurse auf den Niveaustufen A1 bis C1 an, darunter auch einen Vorbereitungskurs auf das Goethe-Zertifikat C1. Wenn Sie sich für einen Kurs anmelden möchten, schicken Sie uns bitte eine E-Mail mit Ihrem vollständigen Namen, Ihrem aktuellen Sprachniveau und Ihrem Wunschtermin. Vielen Dank für Ihren Anruf.'
    items:
      - q: 'Welche Einrichtung ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Das Sprachzentrum Berlin.' }
          - { key: b, text: 'Das Goethe-Institut Hamburg.' }
          - { key: c, text: 'Eine private Nachhilfeschule.' }
        answer: a
        why: '„Sie haben den Anrufbeantworter des Sprachzentrums Berlin erreicht."'
      - q: 'Wann ist die Sprachschule telefonisch erreichbar?'
        options:
          - { key: a, text: 'Montag bis Freitag, zehn bis achtzehn Uhr.' }
          - { key: b, text: 'Täglich von acht bis zwanzig Uhr.' }
          - { key: c, text: 'Nur am Wochenende.' }
        answer: a
        why: '„Wir sind erreichbar von Montag bis Freitag, jeweils von zehn bis achtzehn Uhr."'
      - q: 'Welches höchste Sprachniveau wird in der Ansage erwähnt?'
        options:
          - { key: a, text: 'A1.' }
          - { key: b, text: 'B2.' }
          - { key: c, text: 'C1.' }
        answer: c
        why: '„Aktuell bieten wir Kurse auf den Niveaustufen A1 bis C1 an."'
      - q: 'Welche Angaben werden für eine Anmeldung per E-Mail verlangt?'
        options:
          - { key: a, text: 'Name und Wunschtermin.' }
          - { key: b, text: 'Name, Sprachniveau und Wunschtermin.' }
          - { key: c, text: 'Nur das aktuelle Sprachniveau.' }
        answer: b
        why: '„Schicken Sie uns bitte eine E-Mail mit Ihrem vollständigen Namen, Ihrem aktuellen Sprachniveau und Ihrem Wunschtermin."'

  - id: H5
    block: H
    type: table-fill
    title: 'Tabelle ausfüllen: Dialog B (Lektorin)'
    audio: dialog1_b.mp3
    instructions: 'Hör Dialog B noch einmal und füll die Tabelle aus. In jeder Zeile fehlt eine Information.'
