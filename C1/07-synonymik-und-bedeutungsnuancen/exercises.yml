          - { gap: 3, answer: 'eventually (= schließlich)', given: 'eventually (= schließlich)' }
          - { gap: 3, answer: 'mögliche / denkbare' }
          - { gap: 3, answer: 'verzerrt die Wahrscheinlichkeit', given: 'verzerrt die Wahrscheinlichkeit' }
      - label: 'bald'
        cells:
          - { gap: 4, answer: 'soon (anytime soon)' }
          - { gap: 4, answer: 'zeitnah / in Kürze', given: 'zeitnah / in Kürze' }
          - { gap: 4, answer: 'unpassend bei Sechs-Monats-Frist', given: 'unpassend bei Sechs-Monats-Frist' }

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Nahezu-synonyme Verben — das richtige Verb wählen'
    optionLayout: block
    instructions: 'Wähle das Verb, das am besten passt (a, b oder c).'
    items:
      - q: 'Was sagt der Richter im Prozess?'
        options:
          - { key: a, text: 'Das Gericht untersucht die Verfassungsmäßigkeit.' }
          - { key: b, text: 'Das Gericht prüft die Verfassungsmäßigkeit.' }
          - { key: c, text: 'Das Gericht testet die Verfassungsmäßigkeit.' }
        answer: b
        why: 'Gerichte „prüfen" — formell, kontrollierend.'
      - q: 'Was sagt der Wissenschaftler über ein neues Thema?'
        options:
          - { key: a, text: 'Wir testen das Verhalten der Wölfe.' }
          - { key: b, text: 'Wir prüfen das Verhalten der Wölfe.' }
          - { key: c, text: 'Wir erforschen das Verhalten der Wölfe.' }
        answer: c
        why: 'Einen neuen Bereich wissenschaftlich erschließen = „erforschen".'
      - q: 'Was macht das IT-Team mit der neuen App?'
        options:
          - { key: a, text: 'Wir testen die App mit zwanzig Nutzern.' }
          - { key: b, text: 'Wir prüfen die App mit zwanzig Nutzern.' }
          - { key: c, text: 'Wir erforschen die App mit zwanzig Nutzern.' }
        answer: a
        why: 'Eine Software „testet" man unter realen Bedingungen.'
      - q: 'Was sagt der Behördenleiter über eine unerlaubte Veranstaltung?'
        options:
          - { key: a, text: 'Wir vermeiden die Veranstaltung.' }
          - { key: b, text: 'Wir unterbinden die Veranstaltung.' }
          - { key: c, text: 'Wir umgehen die Veranstaltung.' }
        answer: b
        why: 'Eine Behörde „unterbindet" — aktiv, obrigkeitlich.'
      - q: 'Welches Verb passt: „Der Pilot versuchte, den Sturm zu ___."'
        options:
          - { key: a, text: 'umgehen' }
          - { key: b, text: 'vermeiden' }
          - { key: c, text: 'unterbinden' }
        answer: b
        why: 'Einen Sturm kann man nicht „unterbinden" (kein Verursacher); man „vermeidet" ihn (bewusst fernbleiben).'

  - id: A2
    block: A
    type: single-choice
    title: 'Nahezu-synonyme Nomen — das richtige Nomen wählen'
    optionLayout: block
    instructions: 'Wähle das Nomen, das am besten passt (a, b oder c).'
    items:
      - q: 'Welches Nomen passt am besten im Satz: „Diese Woche steht eine schwere ___ an."'
        options:
          - { key: a, text: 'Problem' }
          - { key: b, text: 'Aufgabe' }
          - { key: c, text: 'Herausforderung' }
        answer: b
        why: 'Sachlich, zu bearbeiten: „Aufgabe".'
      - q: 'Welches Nomen passt in einem positiven Kontext: „Wir freuen uns auf die ___ mit dem internationalen Team."'
        options:
          - { key: a, text: 'Schwierigkeit' }
          - { key: b, text: 'Problem' }
          - { key: c, text: 'Herausforderung' }
        answer: c
        why: 'Positiv, wertend: „Herausforderung".'
      - q: 'Welches Nomen passt in einem vorsichtigen Kontext: „Beim Umzug gab es einige ___."'
        options:
          - { key: a, text: 'Probleme' }
          - { key: b, text: 'Aufgaben' }
          - { key: c, text: 'Schwierigkeiten' }
        answer: c
        why: 'Vorsichtig, abwägend: „Schwierigkeiten".'
      - q: 'Welches Nomen passt in einem physikalischen Kontext: „Die ___ des Erdbebens ist unklar."'
        options:
          - { key: a, text: 'Gründe' }
          - { key: b, text: 'Ursachen' }
          - { key: c, text: 'Anlässe' }
        answer: b
        why: 'Physischer Auslöser: „Ursache".'
      - q: 'Welches Nomen passt in einem förmlichen Kontext: „Die ___ des Gesetzes liegt zehn Jahre zurück."'
        options:
          - { key: a, text: 'Ursache' }
          - { key: b, text: 'Veranlassung' }
          - { key: c, text: 'Anlass' }
        answer: b
        why: 'Sehr förmlich, amtlich: „Veranlassung".'

  - id: A3
    block: A
    type: single-choice
    title: 'Falsche Freunde — die richtige deutsche Bedeutung'
    optionLayout: block
    instructions: 'Wähle die korrekte deutsche Bedeutung (a, b oder c).'
    items:
      - q: 'Was bedeutet „aktuell" im Deutschen?'
        options:
          - { key: a, text: 'tatsächlich, eigentlich' }
          - { key: b, text: 'gegenwärtig, derzeit' }
          - { key: c, text: 'aktuell im Sinne von „in Mode"' }
        answer: b
        why: '„aktuell" = gegenwärtig, derzeit. NICHT „actually".'
      - q: 'Was bedeutet „eventuell" im Deutschen?'
        options:
          - { key: a, text: 'vielleicht, möglicherweise' }
          - { key: b, text: 'schließlich, am Ende' }
          - { key: c, text: 'gegeben, sicher' }
        answer: a
        why: '„eventuell" = vielleicht. NICHT „eventually".'
      - q: 'Was bedeutet „realisieren" im Deutschen?'
        options:
          - { key: a, text: 'sich bewusst werden' }
          - { key: b, text: 'begreifen, verstehen' }
          - { key: c, text: 'verwirklichen, in die Tat umsetzen' }
        answer: c
        why: '„realisieren" = verwirklichen. NICHT „to realize" (= begreifen).'
      - q: 'Was bedeutet „sympathisieren" im Deutschen?'
        options:
          - { key: a, text: 'mitfühlen, bemitleiden' }
          - { key: b, text: 'sich positiv zeigen für' }
          - { key: c, text: 'jemanden sympathisch finden' }
        answer: b
        why: '„sympathisieren" = sich positiv zeigen für. NICHT „to sympathize" (= mitfühlen).'
      - q: 'Was bedeutet „sensibel" im Deutschen?'
        options:
          - { key: a, text: 'vernünftig' }
          - { key: b, text: 'empfindlich, feinfühlig' }
          - { key: c, text: 'sensationalistisch' }
        answer: b
        why: '„sensibel" = empfindlich. NICHT „sensible" (= vernünftig).'

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: 'Verben einsetzen: untersuchen / erforschen / prüfen / testen'
    instructions: 'Setze das passende Verb ein. 6 Items.'
    text: |
      1. Die Polizei {1} den Unfall.
      2. Ein Forscherteam {2} die Lebensweise einer bisher unbekannten Volksgruppe.
      3. Das Finanzamt {3} die Steuererklärung.
      4. Wir {4} die neue App mit zwanzig Nutzern.
      5. Ein Historiker {5} die Ursachen des Ersten Weltkriegs.
      6. Das Gericht {6} die Verfassungsmäßigkeit des neuen Gesetzes.
    answers:
      "1": untersucht
      "2": erforscht
      "3": prüft
      "4": testen
