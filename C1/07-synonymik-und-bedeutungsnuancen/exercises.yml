      - { key: c, text: 'treffen' }
      - { key: d, text: 'bewältigen' }
      - { key: e, text: 'bearbeiten' }
    answers:
      "1": b
      "2": e
      "3": a
      "4": d
      "5": c

  - id: A8
    block: A
    type: single-choice
    title: 'Konnotation — das richtige Register wählen'
    optionLayout: block
    instructions: 'Wähle die Variante mit der passenden Konnotation für den Kontext.'
    items:
      - q: 'In einer Todesanzeige:'
        options:
          - { key: a, text: 'Er ist verstorben.' }
          - { key: b, text: 'Er hat ins Gras gebissen.' }
          - { key: c, text: 'Er ist abgekratzt.' }
        answer: a
        why: '„verstorben" ist gehoben und passt in eine Todesanzeige.'
      - q: 'Im Geschäftsbrief:'
        options:
          - { key: a, text: 'Das ist doch Quatsch.' }
          - { key: b, text: 'Das ist nicht haltbar.' }
          - { key: c, text: 'Das ist mega daneben.' }
        answer: b
        why: '„nicht haltbar" ist sachlich; „Quatsch" und „mega daneben" sind Registerbrüche.'
      - q: 'Im Smalltalk:'
        options:
          - { key: a, text: 'Ich hege Befürchtungen.' }
          - { key: b, text: 'Ich mache mir Sorgen.' }
          - { key: c, text: 'Ich trage Bedenken.' }
        answer: b
        why: '„Sorgen machen" passt zum Smalltalk; „Befürchtungen hegen" und „Bedenken tragen" sind zu förmlich.'
      - q: 'In einer wissenschaftlichen Hausarbeit:'
        options:
          - { key: a, text: 'Die Daten sind krass.' }
          - { key: b, text: 'Die Daten sind bemerkenswert.' }
          - { key: c, text: 'Die Daten sind der Hammer.' }
        answer: b
        why: '„bemerkenswert" passt ins wissenschaftliche Register.'
      - q: 'In einer Pressemitteilung:'
        options:
          - { key: a, text: 'Das war der totale Triumph.' }
          - { key: b, text: 'Das war ein wichtiger Erfolg.' }
          - { key: c, text: 'Das war ein riesen Sieg.' }
        answer: b
        why: '„wichtiger Erfolg" ist sachlich und angemessen für eine Pressemitteilung.'

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: 'Falsche Freunde korrigieren'
    instructions: 'Setze das richtige deutsche Wort ein. 6 Items.'
    text: |
      1. „Actually, ich habe heute keine Zeit." → {1} habe ich heute keine Zeit.
      2. „Ich realisiere jetzt erst, dass das falsch war." → Ich {2} jetzt erst, dass das falsch war.
      3. „Eventually schaffe ich das." → {3} schaffe ich das.
      4. „Ich sympathisiere mit ihrem Schmerz." → Ich {4} mit ihrem Schmerz.
      5. „Das ist eine sensible Lösung." → Das ist eine {5} Lösung.
      6. „Bald werde ich mein Studium beenden." → {6} werde ich mein Studium beenden.
    answers:
      "1": Eigentlich
      "2": erkenne
      "3": Schließlich
      "4": fühle
      "5": vernünftige
      "6": Irgendwann

  - id: A10
    block: A
    type: single-choice
    title: 'Registergerechte Wortwahl'
    optionLayout: block
    instructions: 'Wähle die angemessene Formulierung für den Kontext (a, b oder c).'
    items:
      - q: 'In einem Geschäftsbrief an einen Kunden:'
        options:
          - { key: a, text: 'Sorry, muss absagen.' }
          - { key: b, text: 'Leider muss ich den Termin absagen.' }
          - { key: c, text: 'Krass stressig gerade, sage ab.' }
        answer: b
        why: '„Leider muss ich den Termin absagen" ist förmlich und passend.'
      - q: 'In einer WhatsApp an einen Freund:'
        options:
          - { key: a, text: 'Ich bedaure, Ihnen mitteilen zu müssen …' }
          - { key: b, text: 'Tut mir leid, aber …' }
