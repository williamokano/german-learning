  - id: B9
    block: B
    type: free-write
    title: 'Eine Stellungnahme mit Bedacht formulieren'
    prompt: 'Eine Bekannte schickt dir eine WhatsApp mit einer sehr saloppen Meinung über eine politische Entscheidung. Formuliere ihre Meinung in drei Registern um: (1) in einer sachlichen E-Mail an einen Kollegen, (2) in einem Leserbrief an eine Zeitung, (3) in einem formellen Brief an eine Behörde. Achte auf Wortwahl, Register und Konnotation.'
    stimulus: |
      WhatsApp von Sara:
      „Ey, ich find das echt krass, dass die Stadt jetzt alle E-Autos verbieten will. Die sollen mal lieber die ganzen SUV-Fahrer in die Schranken weisen, statt auf die kleinen Leute loszugehen. Das ist einfach nur Quatsch."
    use:
      - 'Registergerechte Wortwahl: kein „ey", „echt krass", „Quatsch"'
      - 'Bewusste Wahl: Meinung / Auffassung / Ansicht / Überzeugung'
      - 'Bewusste Wahl: Problem / Aufgabe / Herausforderung / Schwierigkeit'
      - 'Bewusste Wahl: vermeiden / unterbinden / unterlassen'
      - 'Passende Konnotation: förmlich / sachlich / pointiert'
    selfCheck:
      - 'Habe ich in jedem Register das passende Nomen gewählt?'
      - 'Habe ich in jedem Register das passende Verb gewählt?'
      - 'Habe ich in jedem Register den passenden Ausdruck für „Meinung" verwendet?'
      - 'Habe ich in jedem Register auf saloppe Wendungen verzichtet?'
      - 'Passt die Konnotation (Wertung) zum Anlass?'
    model: |
      (1) E-Mail an Kollegen: „Ich vertrete die Auffassung, dass das geplante Verbot von E-Autos in der Innenstadt die falsche Prioritätensetzung ist. Die Einführung einer City-Maut für SUV wäre die sinnvollere Maßnahme."
      (2) Leserbrief: „Es ist nicht hinzunehmen, dass die Stadtverwaltung ausgerechnet die Halterinnen und Halter von E-Autos mit einem Verbot belegt, während SUV-Fahrer unbehelligt bleiben. Hier wird das eigentliche Problem — der überdimensionierte Stadtverkehr — verfehlt."
      (3) Brief an eine Behörde: „Sehr geehrte Damen und Herren, mit Befremden habe ich von der geplanten Maßnahme zur Einschränkung des Elektroautoverkehrs Kenntnis genommen. Ich bin der Auffassung, dass diese Veranlassung die angestrebte Reduktion des Stadtverkehrs verfehlt, da sie an der falschen Zielgruppe ansetzt."

  # ── Block C — Prüfungstraining ───────────────────────────────────────────

  - id: C1
    block: C
    type: gap-text
    listLayout: true
    title: 'Lückentext: Synonymik und Konnotation'
    instructions: 'Füll jede Lücke mit **einem** passenden Wort. 10 Items.'
    text: |
      Auf C1-Niveau braucht man nicht **ein** Wort für eine Sache,
      sondern **mehrere** — und die Wahl ist eine Frage der **Wertung**.
      *Problem* klingt {1} und zu lösen, *Aufgabe* klingt neutral und zu
      {2}, *Herausforderung* klingt {3} und wertend,
      *Schwierigkeit* klingt vorsichtig und zu {4}. Bei den Verben
      gilt: *untersuchen* ist systematisch, *erforschen* ist {5},
      *prüfen* ist formell und *testen* ist praktisch. Wer das
      {6} der Wörter nicht beachtet, klingt im Geschäftsbrief
      {7} oder im Smalltalk pathetisch. Falsche Freunde wie *aktuell*
      oder *{8}* schleichen sich oft ein, wenn man
      unbewusst aus dem {9} übersetzt. Wer Synonyme bewusst wählt,
      schreibt nicht nur korrekt, sondern {10}.
    answers:
      "1": ernst
      "2": bearbeiten
      "3": positiv
      "4": überwinden
      "5": wissenschaftlich
      "6": Register
      "7": salopp
      "8": realisieren
      "9": Englischen
      "10": kultiviert

