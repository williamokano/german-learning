# Reviewed from C1/07 lesson.md §4 Wortschatz.
# Note: all tables use German-only paraphrase — no draft to patch, every entry
# hand-derived and hand-translated from source. 5 of the 10 "Falsche Freunde für
# Fortgeschrittene" (aktuell, sensibel, eventuell, realisieren, genial) duplicate
# headwords already committed in C1/04 — only the 5 genuinely NEW false friends
# are included here (bald, konservativ, liberal, sympathisieren, extravagant).
# 1 of the register-spectrum idioms (den Löffel abgeben) duplicates C1/04's
# Essen/Trinken motivkreis entry — excluded here too.
#
# Section headers in lesson.md:
#   Nahezu-synonyme Verben (4 groups of 4)     — 16 verbs (meaning/context/connotation)
#   Nahezu-synonyme Nomen (4 groups of 4)      — 16 nouns (meaning/collocation/connotation)
#   Falsche Freunde für Fortgeschrittene       — 5 new (5 dup'd with C1/04, excluded)
#   Konnotation und Register                    — 9 register-spectrum items (1 dup'd, excluded)
