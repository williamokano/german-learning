# Reviewed from C1/04 lesson.md §4 Wortschatz.
# Note: all 3 tables use German-only paraphrase — no draft to patch, every entry
# hand-derived and hand-translated from source. Table 2 (Motivkreise) groups
# multiple idioms per row under ONE shared, vague "Bedeutung" — individual glosses
# for each idiom were derived from standard German usage, not copied verbatim from
# the source (the source doesn't gloss them individually). Two idioms overlap
# between table 1 (Daumen drücken, kalte Füße bekommen) and table 2's Körper
# group — captured once, not duplicated.
#
# Section headers in lesson.md:
#   Kernwortschatz: Idiomatik und Kollokationen  — 12 theory nouns + 2 idiom examples
