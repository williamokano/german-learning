  # ── Falsche Freunde — 8 false-friend pairs ─────────────────────────────────
  - de: aktuell
    article: null
    plural: null
    en: current; up to date (NOT "actual")
    pos: adjective
    tags: [false-friend, adjective]
    core: true
    example: "die aktuelle Lage — resembles English 'actual' but means 'current'"
  - de: realisieren
    article: null
    plural: null
    en: to implement; to carry out (NOT "to realize")
    pos: verb
    tags: [false-friend, verb]
    core: true
    example: "einen Plan realisieren"
  - de: sensibel
    article: null
    plural: null
    en: sensitive (NOT "sensible")
    pos: adjective
    tags: [false-friend, adjective]
    core: true
    example: "ein sensibles Thema"
  - de: Sympathisant
    article: der
    plural: Sympathisanten
    en: supporter; fellow traveler (often negative, political) (NOT neutral "sympathizer")
    pos: noun
    tags: [false-friend, person, concrete, n-decl]
    core: true
  - de: eventuell
    article: null
    plural: null
    en: possibly; maybe (NOT "eventually")
    pos: adverb
    tags: [false-friend, adverb]
    core: true
    example: "eventuell komme ich"
  - de: genial
    article: null
    plural: null
    en: brilliant; ingenious (NOT "genial/friendly")
    pos: adjective
    tags: [false-friend, adjective]
    core: true
    example: "eine geniale Idee"
  - de: exponieren
    article: null
    plural: null
    en: to expose oneself; to take a stand; to position oneself (NOT "to expose" photographically)
    pos: verb
    tags: [false-friend, verb, reflexive]
    core: true
    example: "sich exponieren"
  - de: konsequent
    article: null
    plural: null
    en: consistent; resolute (NOT "consequent/following")
    pos: adjective
    tags: [false-friend, adjective]
    core: true
    example: "konsequent handeln"