      "2": 'treffen'
      "3": 'wesentlichen'
      "4": 'Beitrag'
      "5": 'Vergleich'
      "6": 'ziehen'

  - id: A9
    block: A
    type: single-choice
    title: 'Kollokationsbruch: Welche Formulierung passt?'
    instructions: 'Wähle die kollokativ richtige Formulierung (a, b oder c).'
    items:
      - q: 'Welche Formulierung ist kollokativ richtig?'
        options:
          - { key: a, text: 'eine gute Entscheidung machen' }
          - { key: b, text: 'eine fundierte Entscheidung treffen' }
          - { key: c, text: 'eine große Entscheidung geben' }
        answer: b
        why: '„fundierte Entscheidung treffen" ist die korrekte Kollokation.'
      - q: 'Welche Formulierung ist kollokativ richtig?'
        options:
          - { key: a, text: 'einen großen Beitrag geben' }
          - { key: b, text: 'einen wesentlichen Beitrag leisten' }
          - { key: c, text: 'einen guten Beitrag ziehen' }
        answer: b
        why: '„wesentlichen Beitrag leisten" ist die korrekte Kollokation.'
      - q: 'Welche Formulierung ist kollokativ richtig?'
        options:
          - { key: a, text: 'eine scharfe Rolle spielen' }
          - { key: b, text: 'eine wichtige Rolle spielen' }
          - { key: c, text: 'eine starke Rolle ziehen' }
        answer: b
        why: '„wichtige Rolle spielen" ist die korrekte Kollokation.'
      - q: 'Welche Formulierung ist kollokativ richtig?'
        options:
          - { key: a, text: 'eine feste Meinung machen' }
          - { key: b, text: 'eine starke Meinung vertreten' }
          - { key: c, text: 'eine feste Meinung vertreten' }
