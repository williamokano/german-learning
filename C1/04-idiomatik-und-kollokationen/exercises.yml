  - id: A4
    block: A
    type: single-choice
    title: 'Welches Sprichwort passt zur Situation?'
    instructions: 'Wähle das passende Sprichwort (a, b oder c) zur beschriebenen Situation.'
    items:
      - q: 'Jemand beginnt ein neues Projekt und klagt über Schwierigkeiten. Welches Sprichwort passt als Aufmunterung?'
        options:
          - { key: a, text: 'Ende gut, alles gut.' }
          - { key: b, text: 'Aller Anfang ist schwer.' }
          - { key: c, text: 'Viele Köche verderben den Brei.' }
        answer: b
        why: '„Aller Anfang ist schwer" — passt zum Beginn eines neuen Projekts.'
      - q: 'Ein Freund bricht ein Versprechen, das er gegeben hat. Welches Sprichwort passt?'
        options:
          - { key: a, text: 'Übung macht den Meister.' }
          - { key: b, text: 'Wer A sagt, muss auch B sagen.' }
          - { key: c, text: 'Besser spät als nie.' }
        answer: b
        why: '„Wer A sagt, muss auch B sagen" — wer ein Versprechen gibt, muss es halten.'
      - q: 'In einer Familie gibt es Konflikte, aber am Ende hält man zusammen. Welches Sprichwort passt?'
        options:
          - { key: a, text: 'Blut ist dicker als Wasser.' }
          - { key: b, text: 'Kein Rauch ohne Feuer.' }
          - { key: c, text: 'Man ist, was man isst.' }
        answer: a
        why: '„Blut ist dicker als Wasser" — Familie ist wichtiger.'
      - q: 'Ein Verdacht erweist sich als berechtigt. Welches Sprichwort passt?'
        options:
          - { key: a, text: 'Besser spät als nie.' }
          - { key: b, text: 'Wer zuletzt lacht, lacht am besten.' }
          - { key: c, text: 'Kein Rauch ohne Feuer.' }
        answer: c
        why: '„Kein Rauch ohne Feuer" — es gibt keinen Verdacht ohne Grund.'
      - q: 'Ein Schüler hat nach langem Üben endlich Fortschritte gemacht. Welches Sprichwort passt?'
        options:
          - { key: a, text: 'Viele Köche verderben den Brei.' }
          - { key: b, text: 'Übung macht den Meister.' }
          - { key: c, text: 'Aller Anfang ist schwer.' }
        answer: b
        why: '„Übung macht den Meister" — durch Übung wird man besser.'

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: 'Sprichwörter ergänzen'
    instructions: 'Ergänze die Sprichwörter mit dem passenden Wort. 5 Items.'
    text: |
      1. Aller {1} ist schwer. (Beginn)
      2. {2} macht den Meister. (Wiederholtes Tun)
      3. Wer A {3}, muss auch B sagen. (äußern)
      4. {4} ist dicker als Wasser. (Familie)
      5. Viele {5} verderben den Brei. (Mitarbeiter)
    answers:
      "1": Anfang
      "2": Übung
      "3": sagt
      "4": Blut
      "5": Köche

  - id: A6
    block: A
    type: single-choice
    title: 'Falsche Freunde: Was bedeutet das Wort im Deutschen?'
    instructions: 'Wähle die richtige deutsche Bedeutung (a, b oder c).'
    items:
      - q: '„aktuell"'
        options:
          - { key: a, text: 'derzeitig, gegenwärtig' }
          - { key: b, text: 'tatsächlich (like „actually")' }
          - { key: c, text: 'modern, neu' }
        answer: a
        why: '„aktuell" = derzeitig, gegenwärtig. „tatsächlich" = tatsächlich. „modern" = modern.'
      - q: '„realisieren"'
        options:
          - { key: a, text: 'erkennen, begreifen' }
          - { key: b, text: 'verwirklichen, umsetzen' }
          - { key: c, text: 'wiederholen' }
        answer: b
        why: '„realisieren" = verwirklichen, umsetzen. „erkennen" = begreifen.'
      - q: '„sensibel"'
        options:
          - { key: a, text: 'vernünftig' }
          - { key: b, text: 'klug' }
          - { key: c, text: 'empfindlich, heikel' }
        answer: c
        why: '„sensibel" = empfindlich, heikel. „vernünftig" = sinnvoll, durchdacht.'
      - q: '„eventuell"'
        options:
          - { key: a, text: 'möglicherweise, vielleicht' }
          - { key: b, text: 'schließlich' }
          - { key: c, text: 'regelmäßig' }
        answer: a
        why: '„eventuell" = möglicherweise. „schließlich" = letztendlich.'
      - q: '„genial"'
        options:
          - { key: a, text: 'freundlich, herzlich' }
          - { key: b, text: 'großartig, einfallsreich' }
          - { key: c, text: 'genervt' }
        answer: b
        why: '„genial" = großartig, einfallsreich. Das englische „genial" bedeutet dagegen „freundlich, herzlich" (falscher Freund).'

  - id: A7
    block: A
    type: matching
    title: 'Falsche Freunde: Wort — richtige Bedeutung'
