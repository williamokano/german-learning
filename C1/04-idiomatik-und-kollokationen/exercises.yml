lesson: C1/04
title: 'C1 · Lektion 4 — Übungen (Idiomatik und Kollokationen)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Spieleabend)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Tomáš hat in der vergangenen Woche einen Investor für sein Startup gewonnen.'
        answer: false
        why: 'Tomáš: „Der hat kalte Füße bekommen und ist abgesprungen".'
      - q: 'Lukas hatte Ärger mit seinem Chef, weil er angeblich zu langsam arbeitet.'
        answer: true
        why: 'Lukas: „der hat mir die Hölle heiß gemacht, weil ich angeblich zu langsam arbeite".'
      - q: 'Lukas hat sich bei seiner Schwester für etwas entschuldigt.'
        answer: false
        why: 'Lukas: „Da hab ich ihr mal die Meinung gegeigt" — er hat ihr die Meinung gesagt, nicht entschuldigt.'
      - q: 'Mia lobt Tomáš dafür, dass er viele deutsche Sprichwörter benutzt.'
        answer: true
        why: 'Mia: „Du klingst ja schon wie ein richtiger Deutscher mit deinen Sprichwörtern".'
      - q: 'Tomáš erwähnt ein tschechisches Sprichwort, das die gleiche Bedeutung hat wie „Wer zuletzt lacht, lacht am besten".'
        answer: true
        why: 'Tomáš zitiert das tschechische Sprichwort und stellt fest: „Ist doch dasselbe in Grün, oder?".'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Vorstellungsgespräch)'
    audio: dialog1_b.mp3
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    optionLayout: block
    items:
      - q: 'In welcher Branche ist die Kanzlei tätig, in der das Gespräch stattfindet?'
        options:
          - { key: a, text: 'IT-Beratung.' }
          - { key: b, text: 'Unternehmensberatung.' }
          - { key: c, text: 'Rechtsanwaltskanzlei.' }
        answer: b
        why: '„mittelständischen Unternehmensberatung in Frankfurt" — es geht um ein ESG-Projekt.'
      - q: 'Wie viel Zeit hatte das Team in der früheren Krisensituation, um eine Lösung zu finden?'
        options:
          - { key: a, text: '24 Stunden.' }
          - { key: b, text: '48 Stunden.' }
          - { key: c, text: 'Eine Woche.' }
        answer: b
        why: 'Frau Yilmaz: „wir hatten nur 48 Stunden Zeit, um eine Lösung auf die Beine zu stellen".'
      - q: 'Welche Eigenschaft betont Frau Yilmaz im Hinblick auf ihre Zusammenarbeit mit Vorgesetzten?'
        options:
          - { key: a, text: 'Transparente Kommunikation.' }
          - { key: b, text: 'Möglichst wenig Kontakt.' }
          - { key: c, text: 'Unterwürfiges Auftreten.' }
        answer: a
        why: 'Frau Yilmaz: „Ich lege Wert auf transparente Kommunikation".'
      - q: 'Welche Redewendung benutzt Frau Yilmaz, um Konfliktmanagement zu beschreiben?'
        options:
          - { key: a, text: 'die Wogen glätten' }
          - { key: b, text: 'Öl ins Feuer gießen' }
          - { key: c, text: 'die Füße stillhalten' }
        answer: a
        why: 'Frau Yilmaz: „Ich versuche, die Wogen zu glätten, wenn Konflikte im Keim entstehen".'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Investor mit kalten Füßen'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Liebe Hörerinnen und Hörer, in unserer Reihe „Sprache und Wirtschaft"
      sprechen wir heute über ein Phänomen, das in jeder Verhandlung
      vorkommt: den Moment, in dem ein Verhandlungspartner plötzlich
      {1} Füße bekommt. Man hat sich auf einen Vertrag geeinigt —
      und dann, kurz vor der Unterschrift, springt der Investor ab.
      Es war alles unter {2} und Fach, sagten beide Seiten. Wenn
      eine Entscheidung konkret wird, schlägt das Unterbewusstsein
      Alarm. Kein {3} ohne Feuer, sagen die einen. {4} Köche
      verderben den Brei. Wer A sagt, muss auch {5} sagen. Was
      können wir daraus lernen? Besser spät als {6}.
    bank: [kalte, Dach, Rauch, Viele, B, nie, kalten, ohne, schlecht]
    answers:
      "1": kalte
      "2": Dach
      "3": Rauch
      "4": Viele
      "5": B
      "6": nie

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter einer PR-Agentur'
    audio: transcript_ansage1.mp3
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    optionLayout: block
    transcript: 'Guten Tag, Sie haben die PR-Agentur Wortkraft in Hamburg-Altona erreicht. Wir sind heute, am Donnerstag, dem 19. Juni, leider nicht persönlich für Sie da. Aufgrund einer kurzfristigen Klausurtagung der Geschäftsführung ist unser Büro bis einschließlich Freitag nicht besetzt. Für dringende Medienanfragen wenden Sie sich bitte an die Pressehotline 040-89 12 34. Für Anfragen zu laufenden Kundenprojekten hinterlassen Sie bitte Ihren Namen, Ihre Telefonnummer und den Namen des betreuten Unternehmens nach dem Signalton. Wir rufen Sie am darauffolgenden Werktag zurück. Vielen Dank für Ihr Verständnis.'
    items:
      - q: 'Welche Einheit ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Eine PR-Agentur.' }
          - { key: b, text: 'Eine Werbeagentur.' }
          - { key: c, text: 'Eine Rechtsanwaltskanzlei.' }
        answer: a
        why: '„Sie haben die PR-Agentur Wortkraft erreicht".'
      - q: 'Warum ist das Büro nicht besetzt?'
        options:
          - { key: a, text: 'Wegen einer technischen Störung.' }
          - { key: b, text: 'Wegen einer kurzfristigen Klausurtagung der Geschäftsführung.' }
          - { key: c, text: 'Wegen eines Feiertags.' }
        answer: b
        why: '„Aufgrund einer kurzfristigen Klausurtagung der Geschäftsführung ist unser Büro … nicht besetzt".'
      - q: 'Welche Information soll der Anrufer für Kundenprojekte hinterlassen?'
        options:
          - { key: a, text: 'Seinen Namen, seine Telefonnummer und den Namen des betreuten Unternehmens.' }
          - { key: b, text: 'Sein Geburtsdatum und seine Adresse.' }
          - { key: c, text: 'Seine Kreditkartennummer.' }
        answer: a
        why: '„hinterlassen Sie bitte Ihren Namen, Ihre Telefonnummer und den Namen des betreuten Unternehmens".'
      - q: 'Welche Hotline gilt für dringende Medienanfragen?'
        options:
          - { key: a, text: '040-12 34 56.' }
          - { key: b, text: '040-89 12 34.' }
          - { key: c, text: '040-98 76 54.' }
        answer: b
        why: '„Für dringende Medienanfragen wenden Sie sich bitte an die Pressehotline 040-89 12 34".'

