  - id: A8
    block: A
    type: gap-bank
    title: 'Starke Kollokationen: Verb + Nomen'
    instructions: 'Füll die 6 Lücken mit der passenden Kollokation aus dem Kasten. Drei Elemente sind zu viel.'
    text: |
      1. Wir müssen eine {1} Entscheidung {2}.
      2. Sie hat einen {3} {4} zum Projekt geleistet.
      3. Ich möchte einen {5} mit der Situation von 2010 {6}.
