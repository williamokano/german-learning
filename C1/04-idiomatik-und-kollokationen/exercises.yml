  - id: D2
    block: D
    type: odd-one-out
    title: 'Odd one out: Redewendungen und ähnliche Wörter'
    instructions: 'Streiche das Wort, das nicht passt, und erkläre warum.'
    groups:
      - items: [Daumen, Füße, Kopf, Tisch]
        odd: 3
        why: '„Tisch" ist kein Körperteil; die anderen drei sind Motivkreis „Körper".'
      - items: [Fliege, Kater, Schwein, Wolke]
        odd: 3
        why: '„Wolke" gehört zum Motivkreis „Natur/Wetter"; die anderen drei sind „Tiere".'
      - items: [aktuell, realisieren, sensibel, intelligent]
        odd: 3
        why: '„intelligent" ist kein falscher Freund (gleiche Bedeutung im Deutschen und Englischen); die anderen drei sind typische false friends (aktuell ≠ actually, realisieren ≠ to realize, sensibel ≠ sensible).'
      - items: [allerdings, vermutlich, wahrscheinlich, möglicherweise]
        odd: 0
        why: '„allerdings" ist ein einräumendes Konnektoradverb; die anderen drei sind Wahrscheinlichkeitsadverbien (sie drücken eine Vermutung aus).'
      - items: [Blut, Wasser, Feuer, Brei]
        odd: 1
        why: 'Blut, Feuer und Brei stehen jeweils im Zentrum eines eigenen Sprichworts (Blut ist dicker als Wasser, Kein Rauch ohne Feuer, Viele Köche verderben den Brei); „Wasser" kommt nur als Vergleichswort vor.'
      - items: [ziehen, treffen, geben, leisten]
        odd: 2
        why: '„geben" bildet keine starke Kollokation; ziehen (Vergleich ziehen), treffen (Entscheidung treffen) und leisten (Beitrag leisten) sind korrekte Kollokationsverben.'

