  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: Zwei Versionen einer Stellungnahme'
    prompt: 'Verfasse zwei Versionen einer Stellungnahme (5–7 Sätze pro Version) zum gleichen Thema. (1) Eine informelle Version per WhatsApp an eine Freundin / einen Freund (Du-Anrede, kurze Sätze, mindestens 4 Redewendungen). (2) Eine formelle Version als Leserbrief an eine Zeitung (Sie-Anrede, vollständige Sätze, Konjunktiv II, mindestens 4 starke Kollokationen, höchstens 1 Redewendung). Thema: Stellungnahme zur Digitalisierung in Schulen.'
    use:
      - '(1) Informelle Version: Du-Anrede, mindestens 4 Redewendungen (Daumen drücken, kalte Füße, ins Wasser fallen, auf die Palme …)'
      - '(2) Formelle Version: Sie-Anrede, mindestens 4 starke Kollokationen (fundierte Entscheidung, in Frage stellen, Wert auf etwas legen, zur Verfügung stellen …)'
      - '(2) Formelle Version: sachliche Begründung, kein Umgangssprache-Idiom'
      - '(2) Formelle Version: Schlussformel „Mit freundlichen Grüßen"'
    selfCheck:
      - 'Bleibt Version 1 konsequent informell?'
      - 'Bleibt Version 2 konsequent formell?'
      - 'Werden in Version 1 mindestens 4 Redewendungen richtig verwendet?'
      - 'Werden in Version 2 mindestens 4 Kollokationen richtig gebildet?'
      - 'Wird in Version 2 höchstens 1 Redewendung verwendet?'
    model: |
      (1) WhatsApp: „Hey Anna! Sag mal, was hältst du eigentlich von der Digitalisierung an Schulen? Ich hab da so meine Zweifel — die haben das alles ins Wasser fallen lassen, weil keiner mehr Zeit hat. Meiner Schwester haben sie ein Tablet gegeben, aber dann hat keiner gezeigt, wie es geht. Ich hab richtig kalte Füße bekommen, als ich gesehen hab, wie die Kinder damit umgehen. Die Lehrer sind total auf die Palme gebracht. Echt — Daumen drücken für die, die es trotzdem versuchen."
      (2) Leserbrief: „Sehr geehrte Redaktion, mit großem Interesse habe ich Ihren Artikel zur Digitalisierung an Schulen gelesen. Als jemand, der seit Jahren im Bildungsbereich tätig ist, möchte ich einige Aspekte in Frage stellen. Die Einführung digitaler Medien ist eine weitreichende Entscheidung, die nicht ohne fundierte Vorbereitung getroffen werden sollte. Ich lege Wert darauf, dass die Lehrkräfte in die Entscheidungsprozesse einbezogen werden. Bisher wurden digitale Endgeräte zwar zur Verfügung gestellt, eine nachhaltige Schulung des Personals blieb jedoch aus. Es wäre wünschenswert, wenn die Verantwortlichen die Wogen glätten und einen konstruktiven Dialog mit allen Beteiligten führen würden. Mit freundlichen Grüßen, Tomáš Novák."

