  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Was bedeutet die Redewendung?'
    instructions: 'Wähle die Bedeutung (a, b oder c) der jeweiligen Redewendung.'
    items:
      - q: '„Die Daumen drücken"'
        options:
          - { key: a, text: 'jemanden ärgern' }
          - { key: b, text: 'jemandes Glück wünschen' }
          - { key: c, text: 'jemanden umarmen' }
        answer: b
        why: '„Die Daumen drücken" = jemandes Glück wünschen (Bild: Daumen als Glücksbringer).'
      - q: '„Kalte Füße bekommen"'
        options:
          - { key: a, text: 'Angst bekommen' }
          - { key: b, text: 'eine Erkältung bekommen' }
          - { key: c, text: 'sportlich aktiv werden' }
        answer: a
        why: '„Kalte Füße bekommen" = Angst bekommen, zögern.'
      - q: '„Ins Wasser fallen"'
        options:
          - { key: a, text: 'in einen See fallen' }
          - { key: b, text: 'scheitern, nicht zustande kommen' }
          - { key: c, text: 'Schwimmen üben' }
        answer: b
        why: '„Ins Wasser fallen" = scheitern, nicht zustande kommen.'
      - q: '„Jemanden auf die Palme bringen"'
        options:
          - { key: a, text: 'jemanden auf einen Baum setzen' }
          - { key: b, text: 'jemanden überraschen' }
          - { key: c, text: 'jemanden sehr verärgern' }
        answer: c
        why: '„Jemanden auf die Palme bringen" = jemanden sehr verärgern.'
      - q: '„Die Fliege machen"'
        options:
          - { key: a, text: 'Insekten jagen' }
          - { key: b, text: 'schnell verschwinden' }
          - { key: c, text: 'eine Pause machen' }
        answer: b
        why: '„Die Fliege machen" = schnell verschwinden, gehen.'
      - q: '„Jemandem die Meinung geigen"'
        options:
          - { key: a, text: 'jemanden musizieren lassen' }
          - { key: b, text: 'jemanden deutlich kritisieren' }
          - { key: c, text: 'jemandem zustimmen' }
        answer: b
        why: '„Jemandem die Meinung geigen" = jemanden deutlich kritisieren.'
      - q: '„Tomaten auf den Augen haben"'
        options:
          - { key: a, text: 'etwas Offensichtliches nicht sehen' }
          - { key: b, text: 'Gemüse einkaufen' }
          - { key: c, text: 'eine Allergie haben' }
        answer: a
        why: '„Tomaten auf den Augen haben" = etwas Offensichtliches nicht sehen.'
      - q: '„Den Nagel auf den Kopf treffen"'
        options:
          - { key: a, text: 'Handwerker sein' }
          - { key: b, text: 'etwas haargenau richtig sagen' }
          - { key: c, text: 'sich verletzen' }
        answer: b
        why: '„Den Nagel auf den Kopf treffen" = etwas haargenau richtig sagen.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Redewendungen in Sätze einsetzen'
    instructions: 'Setze die passende Redewendung ein. 8 Items.'
    text: |
      1. „Ich {1} dir die Daumen für deine Prüfung!" (Glück wünschen)
      2. „Er hat {2} und den Vertrag nicht unterschrieben." (Angst bekommen)
      3. „Der ganze Plan ist {3} — wir müssen neu anfangen." (gescheitert)
      4. „Sie hat mich {4} mit ihrer ständigen Nörgelei." (verärgert)
      5. „Mach {5}, es ist schon spät!" (verschwinden)
      6. „Ich habe ihm {6} — er soll nie wieder mein Auto nehmen." (deutlich gesagt)
      7. „Du hast ja {7} — die Lösung liegt direkt vor dir!" (etwas Offensichtliches nicht sehen)
      8. „Sie hat mit ihrer Bemerkung {8}." (genau richtig)
    answers:
      "1": drücke
      "2": kalte Füße bekommen
      "3": ins Wasser gefallen
      "4": auf die Palme gebracht
      "5": die Fliege
      "6": die Meinung gegeigt
      "7": Tomaten auf den Augen
      "8": den Nagel auf den Kopf getroffen

