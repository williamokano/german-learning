  # ── Modalpartikeln im Überblick — 8 particles (core lesson content) ────────
  - de: doch
    article: null
    plural: null
    en: after all; really (emphatic confirmation / gentle urging)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Komm doch mit! / Das ist doch Quatsch!"
  - de: ja
    article: null
    plural: null
    en: as you know (shared knowledge marker)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Du weißt ja, wie das ist."
  - de: mal
    article: null
    plural: null
    en: just (softening; casual request)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Schau mal … / Komm mal her."
  - de: halt
    article: null
    plural: null
    en: just; that's just how it is (resignation; justification)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Das ist halt so."
  - de: eben
    article: null
    plural: null
    en: simply; just (resignation; confirmation)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Das ist eben nicht einfach."
  - de: wohl
    article: null
    plural: null
    en: probably (cautious assumption)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Er wird wohl krank sein."
  - de: schon
    article: null
    plural: null
    en: sure; granted (concession, with a limitation to follow)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Das stimmt schon, aber …"
  - de: eigentlich
    article: null
    plural: null
    en: actually (correction; reflection)
    pos: adverb
    tags: [modal-particle]
    core: true
    example: "Eigentlich wollte ich das ja nicht."