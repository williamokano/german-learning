      - label: 'Mandantin'
        cells:
          - { gap: 4, answer: 'Mandantin', given: 'Mandantin' }
          - { gap: 4, answer: 'Auftraggeberin', given: 'Auftraggeberin' }
          - { gap: 4, answer: 'ursprünglich anderer Ton gewünscht' }
          - { gap: 4, answer: 'zu Beginn des Mandats', given: 'zu Beginn des Mandats' }

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Welche Modalpartikel passt zur beschriebenen Wirkung?'
    instructions: 'Wähle die passende Modalpartikel (a, b oder c) zur angegebenen Wirkung.'
    items:
      - q: 'Wirkung: Bekräftigung, sanftes Drängen.'
        options:
          - { key: a, text: 'doch' }
          - { key: b, text: 'eben' }
          - { key: c, text: 'wohl' }
        answer: a
        why: '„Komm doch mit!" — doch drückt Bekräftigung und sanftes Drängen aus.'
      - q: 'Wirkung: gemeinsames Wissen, Bekanntheit.'
        options:
          - { key: a, text: 'halt' }
          - { key: b, text: 'ja' }
          - { key: c, text: 'schon' }
        answer: b
        why: '„Du weißt ja, wie das ist." — ja erinnert an gemeinsames Wissen.'
      - q: 'Wirkung: Resignation, „so ist es eben".'
        options:
          - { key: a, text: 'mal' }
          - { key: b, text: 'schon' }
          - { key: c, text: 'halt' }
        answer: c
        why: '„Das ist halt so." — halt drückt begründende Resignation aus.'
      - q: 'Wirkung: vorsichtige Vermutung.'
        options:
          - { key: a, text: 'wohl' }
          - { key: b, text: 'eigentlich' }
          - { key: c, text: 'mal' }
        answer: a
        why: '„Er wird wohl krank sein." — wohl drückt eine vorsichtige Vermutung aus.'
      - q: 'Wirkung: Auflockerung, sanfte Bitte.'
        options:
          - { key: a, text: 'doch' }
          - { key: b, text: 'ebenso' }
          - { key: c, text: 'mal' }
        answer: c
        why: '„Schau mal her." — mal lockert eine Bitte auf.'
      - q: 'Wirkung: Zugeständnis mit Einschränkung („aber …").'
        options:
          - { key: a, text: 'ja' }
          - { key: b, text: 'schon' }
          - { key: c, text: 'doch' }
        answer: b
        why: '„Das stimmt schon, aber …" — schon leitet ein Zugeständnis ein.'
      - q: 'Wirkung: sachliche Resignation, „so ist die Realität".'
        options:
          - { key: a, text: 'mal' }
          - { key: b, text: 'eben' }
          - { key: c, text: 'eigentlich' }
        answer: b
        why: '„Das ist eben nicht einfach" — eben drückt sachliche Resignation aus.'
      - q: 'Wirkung: Reflexion, Korrektur einer Aussage.'
        options:
          - { key: a, text: 'mal' }
          - { key: b, text: 'schon' }
          - { key: c, text: 'eigentlich' }
        answer: c
        why: '„Eigentlich wollte ich das ja nicht" — eigentlich leitet eine Reflexion ein.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Modalpartikeln in Sätze einsetzen'
    instructions: 'Setze die passende Modalpartikel ein. 8 Items.'
    text: |
      1. „Komm {1} mit ins Kino!" (Bekräftigung, werbend)
      2. „Schau {2} …" (Auflockerung)
      3. „Du weißt {3}, wie das ist." (Bekanntheit)
      4. „Das ist {4} so." (Resignation)
      5. „Es ist {5} nicht einfach." (sachliche Resignation)
      6. „Das stimmt {6}, aber …" (Zugeständnis)
      7. „Er wird {7} krank sein." (Vermutung)
      8. „{8} wollte ich das ja nicht." (Reflexion)
    answers:
      "1": doch
      "2": mal
      "3": ja
      "4": halt
      "5": eben
      "6": schon
      "7": wohl
      "8": Eigentlich

  - id: A3
    block: A
    type: matching
    title: 'Modalpartikel — Bedeutung — Beispielsatz'
    instructions: 'Ordne jeder Modalpartikel (1–6) das passende Beispielsatzpaar (a–f) zu.'
    left:
      - { key: '1', text: 'doch' }
      - { key: '2', text: 'mal' }
      - { key: '3', text: 'wohl' }
      - { key: '4', text: 'schon' }
      - { key: '5', text: 'eigentlich' }
      - { key: '6', text: 'halt' }
    right:
      - { key: a, text: '„Komm ____ mit!" — werbend, bekräftigend.' }
      - { key: b, text: '„Schau ____ her." — sanfte Bitte.' }
      - { key: c, text: '„Er wird ____ krank sein." — vorsichtige Vermutung.' }
      - { key: d, text: '„Das stimmt ____, aber …" — Zugeständnis.' }
      - { key: e, text: '„____ wollte ich das ja nicht." — Reflexion.' }
      - { key: f, text: '„Das ist ____ so." — Resignation.' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: 'Mittelfeld-Stellung der Modalpartikel'
    instructions: 'Setze die Modalpartikel an die richtige Stelle (Mittelfeld). 6 Items.'
    text: |
      1. „Ich würde sagen mal, dass das funktioniert." → „Ich würde {1} sagen, dass …"
      2. „Kannst du herkommen mal?" → „Kannst du {2} herkommen?"
      3. „Ich weiß, dass schon er das gesagt hat." → „Ich weiß, dass er das {3} gesagt hat."
      4. „Du weißt ja, wie das ist." → Position korrekt. Bleibt: „Du weißt {4}, wie das ist."
      5. „Eigentlich, was willst du?" (formell) → „Was wollen Sie {5}?"
      6. „Er wird wohl morgen kommen." → Position korrekt. Bleibt: „Er wird {6} morgen kommen."
    answers:
      "1": mal
      "2": mal
      "3": schon
      "4": ja
      "5": eigentlich
      "6": wohl

  - id: A5
    block: A
    type: matching
    title: 'Modalpartikel, Konjunktion oder Adverb?'
    instructions: 'Ordne jedem Wort (1–6) die passende Wortart zu (a–f).'
    left:
      - { key: '1', text: 'weil' }
      - { key: '2', text: 'wahrscheinlich' }
      - { key: '3', text: 'halt' }
      - { key: '4', text: 'obwohl' }
      - { key: '5', text: 'eigentlich' }
      - { key: '6', text: 'vermutlich' }
    right:
      - { key: a, text: 'Konjunktion (verbindet Sätze)' }
      - { key: b, text: 'Adverb (modifiziert das Verb, eigene Bedeutung)' }
      - { key: c, text: 'Modalpartikel (färbt die Sprechhaltung)' }
      - { key: d, text: 'Konjunktion (verbindet Sätze)' }
      - { key: e, text: 'Modalpartikel (färbt die Sprechhaltung)' }
      - { key: f, text: 'Adverb (modifiziert das Verb, eigene Bedeutung)' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: 'Konjunktiv II + Modalpartikel'
    instructions: 'Forme die direkten Bitten in höfliche Bitten mit Konjunktiv II + Modalpartikel um. 5 Items.'
    text: |
      1. „Haben Sie eine Visitenkarte?" → „{1} Sie {2} eine Visitenkarte?"
      2. „Können Sie das übersetzen?" → „Könnten Sie das {3} übersetzen?"
      3. „Schicken Sie mir die Unterlagen." → „Würden Sie mir die Unterlagen {4} zukommen lassen?"
      4. „Sind Sie einverstanden?" → „Wären Sie {5} einverstanden?"
      5. „Darf ich Sie stören?" → „Dürfte ich Sie {6} kurz stören?"
    answers:
      "1": Hätten
      "2": vielleicht
      "3": mal
      "4": "bis morgen"
      "5": damit
      "6": mal

  - id: A7
    block: A
    type: gap-bank
    title: 'Konjunktiv II + Modalpartikel: Höflichkeitsmuster'
    instructions: 'Füll die 5 Lücken mit der passenden Form aus dem Kasten. Drei Elemente sind zu viel.'
    text: |
      1. „Ich würde {1} vorschlagen, dass wir das Thema vertagen."
      2. „{2} Sie {3} einen Moment Zeit für mich?"
      3. „Könnten wir {4} mal die Karte sehen?"
      4. „Dürfte ich Sie mal kurz was {5}?"
    bank:
      - mal
      - 'Hätten'
      - 'vielleicht doch'
      - fragen
      - stellen
      - 'vielleicht'
      - 'doch'
      - 'endlich'
    answers:
      "1": mal
      "2": 'Hätten'
      "3": 'vielleicht doch'
      "4": 'vielleicht'
      "5": fragen

  - id: A8
    block: A
    type: single-choice
    title: 'Registerbruch: Modalpartikel im falschen Register'
    instructions: 'Welche Variante passt zur angegebenen Situation? Wähle (a), (b) oder (c).'
    items:
      - q: 'In einer formellen E-Mail an den Vorgesetzten:'
        options:
          - { key: a, text: '„Sehr geehrte Frau Weber, ich bin halt der Meinung, dass …""' }
          - { key: b, text: '„Sehr geehrte Frau Weber, ich bin der Meinung, dass …""' }
          - { key: c, text: '„Sehr geehrte Frau Weber, ich bin ja der Meinung, dass …""' }
        answer: b
        why: '„halt" und „ja" sind umgangssprachliche/abtönende Modalpartikeln; im formellen Register weglassen.'
      - q: 'In einer WhatsApp an einen Freund (informell):'
        options:
          - { key: a, text: '„Würden Sie mir bitte das Salz reichen?""' }
          - { key: b, text: '„Kannst du mir mal das Salz reichen?""' }
          - { key: c, text: '„Ich bitte Sie, mir das Salz zu reichen.""' }
        answer: b
        why: '„mal" und „du" passen zur WhatsApp unter Freunden. „Würden Sie" und „ich bitte Sie" sind zu förmlich.'
      - q: 'In einer Bewerbung (gehoben):'
        options:
          - { key: a, text: '„Ich bin halt teamfähig und belastbar.""' }
          - { key: b, text: '„Ich bin teamfähig und belastbar.""' }
          - { key: c, text: '„Ich bin dann mal teamfähig, oder?""' }
        answer: b
        why: 'Im Lebenslauf keine Modalpartikeln. Variante a ist umgangssprachlich, c ist ironisch-schlampig.'
      - q: 'In einem Aufsatz über Goethe (fachsprachlich):'
        options:
          - { key: a, text: '„Goethe war halt ein Genie.""' }
          - { key: b, text: '„Goethe war wohl ein Genie.""' }
          - { key: c, text: '„Goethe war zweifellos eine herausragende Persönlichkeit der deutschen Literaturgeschichte.""' }
        answer: c
        why: 'Im fachsprachlichen Register keine Modalpartikeln — stattdessen Adverbien wie „zweifellos".'
      - q: 'In einer Todesanzeige (Trauerregister):'
        options:
          - { key: a, text: '„Er ist halt gestorben.""' }
          - { key: b, text: '„Er ist gestorben.""' }
          - { key: c, text: '„Er ist verstorben.""' }
        answer: c
        why: '„verstorben" ist das Register der Todesanzeige. „halt" wirkt respektlos; „gestorben" zu direkt.'

  - id: A9
    block: A
    type: order
    title: 'Satzbau: Modalpartikel im Mittelfeld'
    instructions: 'Bring die Wörter in die richtige Reihenfolge. Die Modalpartikel steht direkt nach dem finiten Verb.'
    items:
      - tiles: [Komm, doch, mit, ins, Kino]
        answer: [0, 1, 2, 3, 4]
        note: 'Komm doch mit ins Kino.'
      - tiles: [Du, weißt, ja, wie, das, ist]
        answer: [0, 1, 2, 3, 4, 5]
        note: 'Du weißt ja, wie das ist.'
      - tiles: [Er, wird, wohl, morgen, kommen]
        answer: [0, 1, 2, 3, 4]
        note: 'Er wird wohl morgen kommen.'
      - tiles: [Ich, würde, mal, sagen, dass, das, geht]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: 'Ich würde mal sagen, dass das geht.'

  - id: A10
    block: A
    type: odd-one-out
    title: 'Welche Modalpartikel passt nicht zur Wirkung?'
    instructions: 'Streiche die Modalpartikel, die nicht zur angegebenen Wirkung passt, und erkläre warum.'
    groups:
      - items: [doch, ja, mal, wohl]
        odd: 3
        why: '„wohl" drückt Vermutung aus, nicht Aufforderung. Die anderen drei wirken auffordernd-bekräftigend.'
      - items: [halt, eben, eigentlich, schon]
        odd: 2
        why: '„eigentlich" drückt Reflexion aus, nicht Resignation oder Zugeständnis.'
      - items: [wohl, schon, eigentlich, ja]
        odd: 1
        why: '„schon" drückt Zugeständnis aus, nicht Vermutung. Die anderen drei wirken vorsichtig-zurückhaltend.'
      - items: [halt, schon, eben, doch]
        odd: 3
        why: '„doch" drückt Bekräftigung aus, nicht Resignation oder Zugeständnis.'
      - items: [ja, halt, mal, wohl]
        odd: 0
        why: '„ja" drückt Bekanntheit aus. Die anderen drei sind auffordernd / vermutung.'

  # ── Block B — Vertiefung ─────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: 'Formelle E-Mail mit Modalpartikeln (sparsam!)'
    instructions: 'Füll die 7 Lücken mit der passenden Form aus dem Kasten. Fünf Elemente sind zu viel.'
    text: |
      Sehr geehrte Frau Doktor Hoffmann,
      vielen Dank für Ihre {1}. Ich {2} Ihnen gerne mitteilen,
      dass der Schriftsatz im Wesentlichen fertig ist. Ich {3}
      Ihnen das Manuskript heute Nachmittag {4} lassen — wenn
      das für Sie so {5}. Hätten Sie {6} {7} einen Moment
      Zeit für eine telefonische Rückfrage am Vormittag?
      Mit freundlichen Grüßen,
      Tomáš Novák
    bank:
      - 'Rückmeldung'
      - 'möchte'
      - 'würde'
      - 'zukommen'
      - 'passt'
      - 'vielleicht'
      - 'doch'
      - 'halt'
      - 'sicher'
      - 'selbstverständlich'
      - 'eben'
