          - { gap: 1, answer: 'heute Nachmittag', given: 'heute Nachmittag' }
      - label: 'Frau Hoffmann'
        cells:
          - { gap: 2, answer: 'Frau Hoffmann', given: 'Frau Hoffmann' }
