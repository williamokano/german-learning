lesson: C1/03
title: 'C1 · Lektion 3 — Übungen (Modalpartikeln und Nuancen)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (informell — Teeküche)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Lukas kommt direkt aus einem Meeting mit dem neuen Kunden.'
        answer: true
        why: 'Lukas: „Ich komm ja direkt aus dem Meeting mit dem neuen Kunden".'
      - q: 'Lukas findet, dass der neue Auftrag problemlos laufen wird.'
        answer: false
        why: 'Lukas: „das wird wohl eher schwierig".'
      - q: 'Bruno erklärt, der Kunde wisse nicht, was er wolle.'
        answer: true
        why: 'Bruno: „Die wissen eben nicht, was sie wollen".'
      - q: 'Mia hatte Lukas das neue Layout schon per Slack geschickt.'
        answer: true
        why: 'Mia: „das hatte ich dir doch gestern schon per Slack geschickt".'
      - q: 'Tomáš war in Barcelona und fand die Stadt wunderbar.'
        answer: false
        why: 'Tomáš: „ganz okay, aber halt auch nicht mehr. Wird wohl nicht mein Lieblingsort".'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (formell — Telefonat)'
    audio: dialog1_b.mp3
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    optionLayout: block
    items:
      - q: 'Welche Funktion hat Frau Hoffmann im Dialog?'
        options:
          - { key: a, text: 'Sie ist die Mandantin und fragt nach dem Stand.' }
          - { key: b, text: 'Sie ist die Senior-Partnerin und erkundigt sich nach dem Schriftsatz.' }
          - { key: c, text: 'Sie ist die Assistentin von Tomáš.' }
        answer: b
        why: 'Frau Hoffmann ist Senior-Partnerin der Kanzlei und ruft Tomáš an, um den Stand des Schriftsatzes zu erfahren.'
      - q: 'Wann will Tomáš der Mandantin das Manuskript zukommen lassen?'
        options:
          - { key: a, text: 'Morgen früh.' }
          - { key: b, text: 'Heute Nachmittag.' }
          - { key: c, text: 'Bis Ende der Woche.' }
        answer: b
        why: 'Tomáš: „Ich würde Ihnen das Manuskript gern heute Nachmittag zukommen lassen".'
      - q: 'Was bittet Frau Hoffmann Tomáš, bis 16 Uhr zu mailen?'
        options:
          - { key: a, text: 'Den fertigen Schriftsatz.' }
          - { key: b, text: 'Eine kurze Zusammenfassung mit den Kernthesen.' }
          - { key: c, text: 'Den Lebenslauf der Mandantin.' }
        answer: b
        why: 'Frau Hoffmann: „Könnten Sie mir bis 16 Uhr eine kurze Zusammenfassung mit den Kernthesen mailen?".'
      - q: 'Welche Frage stellt Tomáš am Ende des Gesprächs?'
        options:
          - { key: a, text: 'Ob er den Termin verschieben kann.' }
          - { key: b, text: 'Ob der Ton des Schriftsatzes sachlich oder locker sein soll.' }
          - { key: c, text: 'Ob er Urlaub nehmen kann.' }
        answer: b
        why: 'Tomáš: „Die Mandantin hatte ja ursprünglich einen anderen Ton gewünscht — sollen wir den jetzt beibehalten oder eher zurücknehmen?".'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Ein Podcast über Sprache und Höflichkeit'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Liebe Hörerinnen und Hörer, ich möchte Ihnen heute ein Thema {1}, das im
      Deutschen oft unterschätzt wird: die kleinen Wörter, die unsere Sprache
      weicher {2}, ohne dass wir groß darüber nachdenken. Sie kennen das {3}
      alle: Sie sitzen in einem Meeting, und jemand sagt „Könnten Sie das {4}
      übernehmen?" — und Sie verstehen sofort: Es ist eine Bitte, kein Befehl.
      Wer die acht Modalpartikeln {5}, hat {6} einen großen Schritt gemacht.
    bank: [vorstellen, machen, ja, mal, beherrscht, schon, halt, wohl, eigentlich]
    answers:
      "1": vorstellen
      "2": machen
      "3": ja
      "4": mal
      "5": beherrscht
      "6": schon

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter einer Sprachschule'
    audio: transcript_ansage1.mp3
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    optionLayout: block
    transcript: 'Guten Tag, Sie haben die Sprachschule Lingua Viva in Berlin-Mitte erreicht. Wir sind heute, am Freitag, dem 27. Juni, leider nicht persönlich für Sie da. Aufgrund einer internen Fortbildung ist unsere telefonische Erreichbarkeit derzeit eingeschränkt. Bitte hinterlassen Sie Ihren Namen, Ihre Telefonnummer und das gewünschte Sprachniveau nach dem Signalton. Für Anfragen zu unseren C1-Kursen wenden Sie sich bitte an die Hotline 030-44 55 66. Bitte rufen Sie mich zurück unter dieser Nummer. Vielen Dank für Ihr Interesse und einen schönen Tag.'
    items:
      - q: 'Welche Einheit ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Eine Sprachschule.' }
          - { key: b, text: 'Ein Übersetzungsbüro.' }
          - { key: c, text: 'Ein Kulturzentrum.' }
        answer: a
        why: '„Sie haben die Sprachschule Lingua Viva erreicht".'
      - q: 'Warum ist die telefonische Erreichbarkeit eingeschränkt?'
        options:
          - { key: a, text: 'Wegen einer technischen Störung.' }
          - { key: b, text: 'Wegen einer internen Fortbildung.' }
          - { key: c, text: 'Wegen eines Feiertags.' }
        answer: b
        why: '„Aufgrund einer internen Fortbildung ist unsere telefonische Erreichbarkeit derzeit eingeschränkt".'
      - q: 'Welche Information soll der Anrufer hinterlassen?'
        options:
          - { key: a, text: 'Sein Geburtsdatum und seine Adresse.' }
          - { key: b, text: 'Seinen Namen, seine Telefonnummer und das gewünschte Sprachniveau.' }
          - { key: c, text: 'Seine Kreditkartennummer.' }
        answer: b
        why: '„Bitte hinterlassen Sie Ihren Namen, Ihre Telefonnummer und das gewünschte Sprachniveau".'
      - q: 'Welche Hotline gilt für C1-Kurs-Anfragen?'
        options:
          - { key: a, text: '030-12 34 56.' }
          - { key: b, text: '030-44 55 66.' }
          - { key: c, text: '030-98 76 54.' }
        answer: b
        why: '„Für Anfragen zu unseren C1-Kursen wenden Sie sich bitte an die Hotline 030-44 55 66".'

  - id: H5
    block: H
    type: table-fill
    title: 'Tabelle ausfüllen: Dialog B (Telefonat Schriftsatz)'
    audio: dialog1_b.mp3
    instructions: 'Hör Dialog B noch einmal und füll die Tabelle aus. In jeder Zeile fehlt eine Information.'
    columns: ['Person', 'Rolle', 'Aufgabe / Bitte', 'Zeitpunkt']
    rows:
      - label: 'Tomáš'
