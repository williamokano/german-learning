lesson: C1/05
title: 'C1 · Lektion 5 — Übungen (Wissenschaftssprache)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Hausarbeit)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Annas Professor findet, ihr Abstract klinge zu wissenschaftlich.'
        answer: false
        why: 'Der Professor meint, das Abstract klinge „wie ein Blogeintrag" — also zu wenig wissenschaftlich.'
      - q: 'Mia empfiehlt, das persönliche „ich finde" durch eine unpersönliche Formulierung zu ersetzen.'
        answer: true
        why: 'Mia: „Da heißt es eher: Es lässt sich zeigen, dass die Digitalisierung … verändert."'
      - q: 'Bruno rät Anna, möglichst viele Substantive aneinanderzureihen.'
        answer: false
        why: 'Bruno warnt gerade davor: „übertreib''s nicht mit den Substantiven … Das versteht am Ende keiner mehr."'
      - q: 'Mia erklärt, dass man jede Behauptung mit einer Quelle belegen muss.'
        answer: true
        why: 'Mia: „Jede Behauptung braucht eine Quelle, sonst ist es nur deine Meinung."'
      - q: 'Anna fasst am Ende zusammen: unpersönlich, vorsichtig, mit Quellen — aber nicht übertreiben.'
        answer: true
        why: 'Anna: „Also: unpersönlich, vorsichtig, mit Quellen — aber nicht übertreiben."'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Sprechstunde)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Was kritisiert Yusuf zuerst an Frau Webers Entwurf?'
        options:
          - { key: a, text: 'Den zu starken Ton („beweist eindeutig").' }
          - { key: b, text: 'Die fehlende Gliederung.' }
          - { key: c, text: 'Die Rechtschreibung.' }
        answer: a
        why: 'Yusuf: „Beweisen und eindeutig sind in den Geisteswissenschaften zu stark."'
      - q: 'Welchen Modus soll Frau Weber bei der Wiedergabe fremder Positionen verwenden?'
        options:
          - { key: a, text: 'Den Indikativ.' }
          - { key: b, text: 'Den Konjunktiv.' }
          - { key: c, text: 'Den Imperativ.' }
        answer: b
        why: 'Yusuf: „sollten Sie den Konjunktiv verwenden — der Befund sei nicht belastbar."'
      - q: 'Was sagt Yusuf über Frau Webers Neigung, stark zu nominalisieren?'
        options:
          - { key: a, text: 'Sie solle noch mehr nominalisieren.' }
          - { key: b, text: 'Wo ein Nebensatz klarer ist, solle sie den Nebensatz nehmen.' }
          - { key: c, text: 'Nominalstil sei in der Wissenschaft verboten.' }
        answer: b
        why: 'Yusuf: „Wo ein Nebensatz klarer ist, nehmen Sie den Nebensatz."'
      - q: 'Was sollen die beiden mit dem überarbeiteten Abstract tun?'
        options:
          - { key: a, text: 'Es bei einer Tagung einreichen.' }
          - { key: b, text: 'Es als Buch veröffentlichen.' }
          - { key: c, text: 'Es in der Vorlesung vorlesen.' }
        answer: a
        why: 'Yusuf: „Dann reichen wir das Abstract gemeinsam bei der Tagung ein."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Studie zum Schlaf'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Liebe Hörerinnen und Hörer, willkommen zu „Forschung aktuell". Eine
      neue {1} der Universität Leipzig hat untersucht, wie sich Schlafmangel
      auf die Konzentration auswirkt. Die Ergebnisse {2} darauf hin, dass
      bereits eine einzige durchwachte Nacht die Aufmerksamkeit deutlich
      verringert. Die Forschenden betonen jedoch, die Befunde {3} noch nicht
      verallgemeinert werden, da die {4} klein gewesen sei. Einer der Autoren
      erklärte, weitere Untersuchungen {5} nötig. Es spricht dennoch einiges
      dafür, dass ausreichender Schlaf eine zentrale {6} für die geistige
      Leistungsfähigkeit spielt.
    bank: [Studie, deuten, dürften, Stichprobe, seien, Rolle, Umfrage, beweisen, müssten]
    answers:
      "1": Studie
      "2": deuten
      "3": dürften
      "4": Stichprobe
      "5": seien
      "6": Rolle

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter des Promotionsbüros'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter des Promotionsbüros der Humboldt-Universität zu Berlin erreicht. Unser Büro ist in der vorlesungsfreien Zeit nur dienstags und donnerstags von neun bis zwölf Uhr besetzt. Bitte beachten Sie: Dissertationen für das Wintersemester müssen bis spätestens 30. September elektronisch und in gedruckter Form eingereicht werden. Die Formulare zur Anmeldung des Promotionsverfahrens finden Sie auf unserer Internetseite unter dem Menüpunkt Promotion. Für eine persönliche Beratung vereinbaren Sie bitte einen Termin per E-Mail. Vielen Dank für Ihr Verständnis.'
    items:
      - q: 'Welche Einrichtung ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Das Prüfungsamt für Bachelorstudiengänge.' }
          - { key: b, text: 'Das Promotionsbüro der Humboldt-Universität.' }
          - { key: c, text: 'Die Universitätsbibliothek.' }
        answer: b
        why: '„Sie haben den Anrufbeantworter des Promotionsbüros der Humboldt-Universität zu Berlin erreicht."'
      - q: 'Wann ist das Büro in der vorlesungsfreien Zeit besetzt?'
        options:
          - { key: a, text: 'Montags und mittwochs.' }
          - { key: b, text: 'Dienstags und donnerstags von neun bis zwölf Uhr.' }
          - { key: c, text: 'Täglich von acht bis sechzehn Uhr.' }
        answer: b
        why: '„nur dienstags und donnerstags von neun bis zwölf Uhr besetzt."'
      - q: 'Bis wann müssen Dissertationen für das Wintersemester eingereicht werden?'
        options:
          - { key: a, text: 'Bis spätestens 30. September.' }
          - { key: b, text: 'Bis 31. Oktober.' }
          - { key: c, text: 'Bis 15. August.' }
        answer: a
        why: '„Dissertationen für das Wintersemester müssen bis spätestens 30. September … eingereicht werden."'
      - q: 'Wie bekommt man eine persönliche Beratung?'
        options:
          - { key: a, text: 'Man kommt einfach im Büro vorbei.' }
          - { key: b, text: 'Man ruft eine Hotline an.' }
          - { key: c, text: 'Man vereinbart per E-Mail einen Termin.' }
        answer: c
        why: '„Für eine persönliche Beratung vereinbaren Sie bitte einen Termin per E-Mail."'

  - id: H5
    block: H
    type: table-fill
    title: 'Tabelle ausfüllen: Dialog B (Sprechstunde)'
    audio: dialog1_b.mp3
    instructions: 'Hör Dialog B noch einmal und füll die Tabelle aus. In jeder Zeile fehlt eine Information.'
    columns: ['Thema', 'Problem im Entwurf', 'Empfehlung', 'Stichwort']
    rows:
      - label: 'Ton'
        cells:
          - { gap: 1, answer: 'Ton', given: 'Ton' }
          - { gap: 1, answer: 'zu starke Behauptung', given: 'zu starke Behauptung' }
          - { gap: 1, answer: 'vorsichtiger formulieren' }
          - { gap: 1, answer: 'Hedging', given: 'Hedging' }
      - label: 'Verweise'
        cells:
          - { gap: 2, answer: 'Verweise', given: 'Verweise' }
          - { gap: 2, answer: 'fremde Position im Indikativ' }
          - { gap: 2, answer: 'Konjunktiv I verwenden', given: 'Konjunktiv I verwenden' }
          - { gap: 2, answer: 'Zitieren', given: 'Zitieren' }
      - label: 'Verständlichkeit'
        cells:
          - { gap: 3, answer: 'Verständlichkeit', given: 'Verständlichkeit' }
          - { gap: 3, answer: 'zu viel Nominalstil', given: 'zu viel Nominalstil' }
          - { gap: 3, answer: 'Nebensatz statt Nomen' }
          - { gap: 3, answer: 'Nominalstil', given: 'Nominalstil' }

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Unpersönlich formulieren — welcher Satz ist wissenschaftlich?'
    optionLayout: block
    instructions: 'Wähle die unpersönliche, wissenschaftliche Formulierung (a, b oder c).'
    items:
      - q: 'Welcher Satz passt in eine Hausarbeit?'
        options:
          - { key: a, text: 'Es wurden 200 Personen befragt.' }
          - { key: b, text: 'Ich habe 200 Personen befragt.' }
          - { key: c, text: 'Ich glaube, 200 Leute oder so wurden gefragt.' }
        answer: a
        why: 'Das Passiv „Es wurden … befragt" rückt die Person in den Hintergrund.'
      - q: 'Welcher Satz ist am sachlichsten?'
        options:
          - { key: a, text: 'Man kann das ja wohl kaum bestreiten.' }
          - { key: b, text: 'Das lässt sich nicht eindeutig beantworten.' }
          - { key: c, text: 'Ich finde, das ist total klar.' }
        answer: b
        why: '„Das lässt sich nicht eindeutig beantworten" ist unpersönlich und vorsichtig.'
      - q: 'Welche Formulierung ist im Fachstil korrekt?'
        options:
          - { key: a, text: 'Ich tu in dieser Arbeit untersuchen, ob …' }
          - { key: b, text: 'In dieser Arbeit untersuche ich von mir, ob …' }
          - { key: c, text: 'In dieser Arbeit wird untersucht, ob …' }
        answer: c
        why: 'Im Passiv lässt man den Urheber gerade weg: „wird untersucht".'
      - q: 'Welcher Satz nutzt einen korrekten Passiversatz?'
        options:
          - { key: a, text: 'Die These lässt sich belegen.' }
          - { key: b, text: 'Die These ist sich belegen.' }
          - { key: c, text: 'Die These wird sich belegt.' }
        answer: a
        why: 'Passiversatz: „sich lassen" + Infinitiv → „lässt sich belegen".'
      - q: 'Welcher Satz ist ein korrektes Zustandspassiv?'
        options:
          - { key: a, text: 'Die Auswertung wird abgeschlossen geworden.' }
          - { key: b, text: 'Die Auswertung ist abgeschlossen.' }
          - { key: c, text: 'Die Auswertung hat abgeschlossen.' }
        answer: b
        why: 'Zustandspassiv: „sein" + Partizip II → „ist abgeschlossen".'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Passiv und Passiversatz bilden'
    instructions: 'Setze das fehlende Wort ein (Passiv, Zustandspassiv oder Passiversatz). 8 Items.'
    text: |
      1. Die Hypothese {1} im zweiten Kapitel geprüft. (Vorgangspassiv Präsens)
      2. Die Daten {2} an 200 Personen erhoben. (Vorgangspassiv Präteritum)
      3. Die Studie ist im Frühjahr durchgeführt {3}. (Vorgangspassiv Perfekt)
      4. Die Auswertung {4} bereits abgeschlossen. (Zustandspassiv)
      5. Die These {5} sich mit den Daten belegen. (Passiversatz)
      6. Diese Annahme ist kritisch zu {6}. (Passiversatz)
      7. Das Problem ist mit dieser Methode {7}. (Passiversatz mit -bar)
      8. So {8} man die Daten aus. (man-Form)
    answers:
      "1": wird
      "2": wurden
      "3": worden
      "4": ist
      "5": lässt
      "6": hinterfragen
      "7": lösbar
      "8": wertet

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: 'Passiversatz: drei Alternativen'
    instructions: 'Forme den Passiversatz. Setze das fehlende Wort ein. 6 Items.'
    text: |
      1. „kann belegt werden" → Die These {1} sich belegen.
      2. „kann belegt werden" → Die These ist {2} belegen.
      3. „kann belegt werden" → Die These ist {3}.
      4. „kann gelöst werden" → Das Problem {4} sich lösen.
      5. „kann gelöst werden" → Das Problem ist {5}.
      6. „kann beantwortet werden" → Die Frage ist {6} beantworten.
    answers:
      "1": lässt
      "2": zu
      "3": belegbar
      "4": lässt
      "5": lösbar
      "6": zu

  - id: A4
    block: A
    type: single-choice
    title: 'Nominalstil oder Verbalstil?'
    optionLayout: block
    instructions: 'Wähle die korrekte nominale Entsprechung (a, b oder c).'
    items:
      - q: '„weil die Daten erhoben wurden" — nominal:'
        options:
          - { key: a, text: 'aufgrund der Datenerhebung' }
          - { key: b, text: 'wegen die Daten erheben' }
          - { key: c, text: 'aufgrund dass Daten erhoben' }
        answer: a
        why: '„aufgrund" + Genitiv-Nomen: „aufgrund der Datenerhebung".'
      - q: '„nachdem die Studie durchgeführt wurde" — nominal:'
        options:
          - { key: a, text: 'nach durchführen die Studie' }
          - { key: b, text: 'nach Durchführung der Studie' }
          - { key: c, text: 'nachdem der Durchführung' }
        answer: b
        why: '„nach Durchführung der Studie" verdichtet den Nebensatz.'
      - q: '„obwohl die Stichprobe klein war" — nominal:'
        options:
          - { key: a, text: 'trotz die kleine Stichprobe' }
          - { key: b, text: 'wegen der kleinen Stichprobe' }
          - { key: c, text: 'trotz der kleinen Stichprobe' }
        answer: c
        why: '„trotz" + Genitiv: „trotz der kleinen Stichprobe".'
      - q: '„wenn die Methode angewendet wird" — nominal:'
        options:
          - { key: a, text: 'bei Anwendung der Methode' }
          - { key: b, text: 'bei anwenden die Methode' }
          - { key: c, text: 'wenn der Anwendung' }
        answer: a
        why: '„bei Anwendung der Methode" steht für den wenn-Satz.'
      - q: 'Welcher Satz ist übernominalisiert (zu viele Nomen)?'
        options:
          - { key: a, text: 'Die Daten wurden ausgewertet.' }
          - { key: b, text: 'Die Vornahme der Durchführung der Auswertung der Daten erfolgte.' }
          - { key: c, text: 'Nach der Auswertung zeigt sich, dass …' }
        answer: b
        why: 'Vier gestapelte Nomen sind unlesbar — das ist die C1-Falle.'

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: 'Verbalstil → Nominalstil'
    instructions: 'Forme in den Nominalstil um. Setze das fehlende Wort ein. 5 Items.'
    text: |
      1. weil die Daten erhoben wurden → {1} der Datenerhebung
      2. nachdem die Studie durchgeführt wurde → nach {2} der Studie
      3. während man die Teilnehmer befragte → {3} der Befragung
      4. obwohl die Stichprobe klein war → {4} der kleinen Stichprobe
      5. wenn die Methode angewendet wird → bei {5} der Methode
    answers:
      "1": aufgrund
      "2": Durchführung
      "3": während
      "4": trotz
      "5": Anwendung

  - id: A6
    block: A
    type: single-choice
    title: 'Hedging — welche Formulierung ist vorsichtig?'
    optionLayout: block
    instructions: 'Wähle die wissenschaftlich vorsichtige (abgeschwächte) Formulierung.'
    items:
      - q: 'Welcher Satz formuliert vorsichtig (Hedging)?'
        options:
          - { key: a, text: 'Die Daten deuten darauf hin, dass Schlaf wichtig ist.' }
          - { key: b, text: 'Das beweist eindeutig, dass Schlaf wichtig ist.' }
          - { key: c, text: 'Schlaf ist zu 100 % am wichtigsten.' }
        answer: a
        why: '„deuten darauf hin" schwächt die Aussage angemessen ab.'
      - q: 'Welcher Satz ist angemessen vorsichtig?'
        options:
          - { key: a, text: 'Alle Menschen reagieren gleich.' }
          - { key: b, text: 'Die meisten Menschen reagieren ähnlich.' }
          - { key: c, text: 'Jeder Mensch reagiert garantiert gleich.' }
        answer: b
        why: '„Die meisten" statt „alle" — Hedging durch Quantifizierung.'
      - q: 'Welche Vermutung ist korrekt mit einem Modalverb formuliert?'
        options:
          - { key: a, text: 'Das ist definitiv der Grund.' }
          - { key: b, text: 'Das ist hundertprozentig der Grund.' }
          - { key: c, text: 'Das dürfte ein wesentlicher Grund sein.' }
        answer: c
        why: '„dürfte … sein" drückt eine begründete Vermutung aus.'
      - q: 'Welcher Satz ist NICHT übertrieben gehedgt?'
        options:
          - { key: a, text: 'Das könnte zutreffen.' }
          - { key: b, text: 'Das könnte eventuell vielleicht unter Umständen so sein.' }
          - { key: c, text: 'Das deutet darauf hin, dass es definitiv so ist.' }
        answer: a
        why: 'Ein Hedge genügt: „Das könnte zutreffen." Mehrere widersprechen sich.'
      - q: 'Welche Wendung markiert Distanz zu einer Behauptung?'
        options:
          - { key: a, text: 'Es ist sonnenklar, dass …' }
          - { key: b, text: 'Es spricht einiges dafür, dass …' }
          - { key: c, text: 'Jeder weiß doch, dass …' }
        answer: b
        why: '„Es spricht einiges dafür" ist eine typische Hedging-Wendung.'

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: 'Hedging-Mittel einsetzen'
    instructions: 'Setze das passende Hedging-Mittel ein. 6 Items.'
    text: |
      1. Modalverb der Vermutung: Das {1} zutreffen.
      2. Wendung: Die Daten {2} darauf hin, dass ein Zusammenhang besteht.
      3. Adverb: {3} spielt auch der soziale Hintergrund eine Rolle.
      4. Konjunktiv II: Es {4} verfehlt, daraus allgemeine Schlüsse zu ziehen.
      5. Adverb der Tendenz: Die These trifft {5} zu.
      6. Wendung: Es spricht einiges {6}, dass die Wirkung schwächer ist.
    answers:
      "1": dürfte
      "2": deuten
      "3": Vermutlich
      "4": wäre
      "5": tendenziell
      "6": dafür

  - id: A8
    block: A
    type: matching
    title: 'Verweis-Wendungen — Funktion zuordnen'
    instructions: 'Ordne jeder Wendung (1–5) die passende Erklärung (a–e) zu.'
    left:
      - { key: '1', text: 'laut Schmidt' }
      - { key: '2', text: 'einer Studie zufolge' }
      - { key: '3', text: 'vgl.' }
      - { key: '4', text: 'der Autor schreibt, der Effekt sei gering' }
      - { key: '5', text: 'im Anschluss an Müller' }
    right:
      - { key: a, text: 'nach Schmidts Angaben' }
      - { key: b, text: 'wie eine Studie zeigt' }
      - { key: c, text: 'vergleiche (Verweis auf eine Quelle)' }
      - { key: d, text: 'indirektes Zitat (Konjunktiv I)' }
      - { key: e, text: 'aufbauend auf Müller' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e

  - id: A9
    block: A
    type: single-choice
    title: 'Indirekte Rede: Konjunktiv I'
    optionLayout: block
    instructions: 'Wähle die korrekte indirekte Wiedergabe im Konjunktiv I (a, b oder c).'
    items:
      - q: 'Schmidt: „Die Methode ist umstritten."'
        options:
          - { key: a, text: 'Schmidt schreibt, die Methode ist umstritten.' }
          - { key: b, text: 'Schmidt schreibt, die Methode sei umstritten.' }
          - { key: c, text: 'Schmidt schreibt, die Methode wäre umstritten.' }
        answer: b
        why: 'Redewiedergabe → Konjunktiv I: „sei".'
      - q: 'Müller: „Es gibt keine eindeutigen Belege."'
        options:
          - { key: a, text: 'Müller stellt fest, es gebe keine eindeutigen Belege.' }
          - { key: b, text: 'Müller stellt fest, es gibt keine eindeutigen Belege.' }
          - { key: c, text: 'Müller stellt fest, es gäbe keine eindeutigen Belege.' }
        answer: a
        why: 'Konjunktiv I von „gibt" → „gebe".'
      - q: 'Weber: „Wir müssen die Daten neu erheben."'
        options:
          - { key: a, text: 'Weber betont, man muss die Daten neu erheben.' }
          - { key: b, text: 'Weber betont, man müsse die Daten neu erheben.' }
          - { key: c, text: 'Weber betont, man müsste die Daten neu erheben.' }
        answer: b
        why: 'Konjunktiv I von „muss" → „müsse".'
      - q: 'Der Autor: „Die Studie hat methodische Schwächen."'
        options:
          - { key: a, text: 'Der Autor räumt ein, die Studie hätte Schwächen.' }
          - { key: b, text: 'Der Autor räumt ein, die Studie hat Schwächen.' }
          - { key: c, text: 'Der Autor räumt ein, die Studie habe Schwächen.' }
        answer: c
        why: 'Konjunktiv I von „hat" → „habe".'
      - q: 'Die Forscherin: „Das kann nicht stimmen."'
        options:
          - { key: a, text: 'Die Forscherin meint, das könne nicht stimmen.' }
          - { key: b, text: 'Die Forscherin meint, das kann nicht stimmen.' }
          - { key: c, text: 'Die Forscherin meint, das könnte nicht stimmen.' }
        answer: a
        why: 'Konjunktiv I von „kann" → „könne".'

  - id: A10
    block: A
    type: gap-bank
    title: 'Funktionsverbgefüge der Wissenschaftssprache'
    instructions: 'Füll die 6 Lücken mit dem passenden Wort aus dem Kasten. Drei Wörter sind zu viel.'
    text: |
      1. An 200 Personen wurde eine Studie {1}.
      2. Daraus lässt sich der Schluss {2}.
      3. Diese Annahme muss man in Frage {3}.
      4. Im Folgenden wird Bezug auf Müller {4}.
      5. Der soziale Hintergrund spielt eine wichtige {5}.
      6. Die Methode kommt häufig zur {6}.
    bank: [durchgeführt, ziehen, stellen, genommen, Rolle, Anwendung, formuliert, gelesen, Frage]
    answers:
      "1": durchgeführt
      "2": ziehen
      "3": stellen
      "4": genommen
      "5": Rolle
      "6": Anwendung

  - id: A11
    block: A
    type: matching
    title: 'Abstrakter Wortschatz — Begriff und Definition'
