  - id: D2
    block: D
    type: odd-one-out
    title: 'Odd one out: Wissenschaftssprache'
    instructions: 'Streiche das Wort, das nicht passt, und erkläre warum.'
    groups:
      - items: [Imperativ, Passiv, man, sich lassen]
        odd: 0
        why: 'Passiv, „man" und „sich lassen" sind Mittel der Unpersönlichkeit; der Imperativ gehört nicht dazu.'
      - items: [dürfte, könnte, machte, müsste]
        odd: 2
        why: '„dürfte/könnte/müsste" drücken Vermutung aus (Hedging); „machte" ist ein einfaches Präteritum.'
      - items: [vermutlich, definitiv, offenbar, möglicherweise]
        odd: 1
        why: '„definitiv" ist ein Verstärker; die anderen drei sind Hedging-Adverbien (sie schwächen ab).'
      - items: [Hypothese, These, Beweis, Annahme]
        odd: 2
        why: 'Hypothese, These und Annahme sind noch zu prüfen; ein „Beweis" ist bereits gesichert.'
      - items: [durchführen, ziehen, machen, nehmen]
        odd: 2
        why: 'Studie durchführen, Schluss ziehen, Bezug nehmen sind Funktionsverbgefüge; „machen" bildet hier keines.'
      - items: [laut, obwohl, zufolge, nach Ansicht von]
        odd: 1
        why: '„laut/zufolge/nach Ansicht von" leiten Verweise ein; „obwohl" ist ein konzessiver Konnektor.'

