    title: 'Ein Abstract schreiben'
    prompt: 'Schreibe ein kurzes Abstract (5–7 Sätze) zu einer (auch erfundenen) Studie deiner Wahl. Formuliere unpersönlich, vorsichtig (Hedging) und mit mindestens zwei Funktionsverbgefügen. Belege mindestens eine Behauptung mit einem Verweis.'
