  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: wissenschaftliche Stellungnahme'
    prompt: 'Verfasse eine kurze wissenschaftliche Stellungnahme (8–12 Sätze) zu der Frage: „Sollte Wissenschaft allgemein verständlicher werden?" Argumentiere sachlich und abwägend. Nutze unpersönliche Formulierungen, mindestens drei Funktionsverbgefüge, Hedging und mindestens einen Verweis. Schließe mit einer abgewogenen Schlussfolgerung.'
    use:
      - 'Unpersönlicher, sachlicher Stil (Passiv, man, Passiversatz)'
      - 'Mindestens 3 Funktionsverbgefüge (eine Rolle spielen, in Frage stellen, Bezug nehmen auf …)'
      - 'Hedging an mindestens zwei Stellen (dürfte, deutet darauf hin, tendenziell …)'
      - 'Mindestens 1 Verweis (laut …, einer Studie zufolge …)'
      - 'Strukturwörter: einerseits/andererseits, im Folgenden, abschließend, demnach'
    selfCheck:
      - 'Bleibt der Text durchgehend unpersönlich und sachlich?'
      - 'Sind mindestens drei Funktionsverbgefüge korrekt gebildet?'
      - 'Ist die Argumentation abgewogen (kein „beweist eindeutig")?'
      - 'Gibt es keine Nomen-Ketten mit mehr als drei Attributen?'
      - 'Schließt der Text mit einer klaren, aber vorsichtigen Folgerung?'
    model: |
      „Die Frage, ob Wissenschaft allgemein verständlicher werden sollte, wird seit Jahren kontrovers diskutiert. Im Folgenden werden die wichtigsten Argumente gegeneinander abgewogen. Einerseits spielt die Fachsprache eine wichtige Rolle, da sie Präzision ermöglicht: Ein einziger Fachbegriff kann das ersetzen, wofür sonst mehrere Sätze nötig wären. Andererseits führt eine zu komplexe Sprache dazu, dass Erkenntnisse die Öffentlichkeit nicht erreichen. Einer Studie zufolge dürfte die Bewegung der Wissenschaftskommunikation das Vertrauen in die Forschung sogar stärken. Allerdings darf man die Verständlichkeit nicht gegen die Präzision ausspielen; beides muss in ein Gleichgewicht gebracht werden. Es deutet einiges darauf hin, dass eine doppelte Darstellung — präzise für Fachleute, verständlich für die Öffentlichkeit — der sinnvollste Weg ist. Demnach sollte Wissenschaft nicht einfacher, wohl aber zugänglicher werden. Abschließend lässt sich der Schluss ziehen, dass die Fachsprache ihre Berechtigung behält, eine zusätzliche allgemein verständliche Darstellung jedoch tendenziell wünschenswert ist."

