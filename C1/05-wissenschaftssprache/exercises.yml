    use:
      - 'Unpersönliche Formulierungen (Passiv, man, Passiversatz)'
      - 'Mindestens 2 Funktionsverbgefüge (eine Studie durchführen, zu dem Schluss kommen, Bezug nehmen auf …)'
      - 'Mindestens 1 Hedging-Mittel (dürfte, deutet darauf hin, vermutlich …)'
      - 'Mindestens 1 Verweis (laut …, einer Studie zufolge …)'
    selfCheck:
      - 'Habe ich das persönliche „ich" vermieden?'
      - 'Habe ich vorsichtig formuliert (kein „beweist eindeutig")?'
      - 'Habe ich mindestens zwei Funktionsverbgefüge verwendet?'
      - 'Habe ich keine Nomen-Ketten mit mehr als drei Attributen gebaut?'
    model: |
      „In dieser Arbeit wird untersucht, wie sich die abendliche Smartphone-Nutzung auf die Schlafqualität auswirkt. Zu diesem Zweck wurde eine Online-Befragung an 300 Studierenden durchgeführt. Die Ergebnisse deuten darauf hin, dass eine intensive Nutzung mit einer verringerten Schlafqualität in Zusammenhang stehen dürfte. Einer aktuellen Studie zufolge spielt dabei auch das blaue Bildschirmlicht eine Rolle. Allerdings dürfen die Befunde nicht verallgemeinert werden, da die Stichprobe klein war. Insgesamt lässt sich der Schluss ziehen, dass weitere Untersuchungen nötig wären."

  - id: B9
    block: B
    type: free-write
    title: 'Vom Alltagston in die Wissenschaftssprache'
    prompt: 'Eine Kommilitonin schickt dir per Chat ihre Idee für eine Hausarbeit — sehr locker formuliert. Schreib die drei Sätze in wissenschaftliches Deutsch um (5–6 Sätze): unpersönlich, vorsichtig, mit Beleg, ohne Umgangssprache.'
    stimulus: |
      Chatnachricht von Lena:
      „Also ich glaub ja, dass Social Media uns voll einsam macht. Ich hab da mal ein paar Leute gefragt, und die fanden das auch. Das beweist doch, dass das echt ein riesiges Problem ist, oder?"
    use:
      - 'Unpersönliche Formulierung statt „ich glaub" / „ich hab gefragt"'
      - 'Hedging statt „das beweist doch" und „voll einsam"'
      - 'Ein Verweis oder ein Hinweis auf die (kleine) Datenbasis als Einschränkung'
      - 'Kein umgangssprachliches Wort (voll, echt, riesig …)'
    selfCheck:
      - 'Ist jedes umgangssprachliche Wort ersetzt?'
      - 'Ist die Behauptung abgeschwächt (Hedging) statt „beweist"?'
      - 'Ist die Aussage unpersönlich formuliert?'
      - 'Wird die schwache Datenbasis als Einschränkung genannt?'
    model: |
      „Es wird häufig vermutet, dass die Nutzung sozialer Medien Einsamkeit begünstigen könnte. Eine kleine eigene Befragung deutet darauf hin, dass viele Befragte diesen Eindruck teilen. Einer Studie zufolge steht intensive Mediennutzung tendenziell mit einem stärkeren Einsamkeitsgefühl in Zusammenhang. Aus diesen Hinweisen lässt sich jedoch noch kein allgemeiner Schluss ziehen, da die Stichprobe klein war. Weitere Untersuchungen wären nötig, um den Zusammenhang abzusichern."

