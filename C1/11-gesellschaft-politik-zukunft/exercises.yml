      - 'Ist meine Wortwahl durchgehend sachlich (kein Registerbruch)?'
    model: |
      „Die Frage, ob KI an Schulen erprobt werden sollte, wird in Deutschland kontrovers diskutiert. Einerseits verspricht der Einsatz mehr Individualisierung, andererseits wirft er erhebliche Fragen zum Datenschutz auf. Befürworter argumentieren, KI könne Lehrkräfte entlasten — laut einer Studie des Instituts für Arbeitsmarkt- und Berufsforschung dürften bis 2030 rund 25 Prozent der Tätigkeiten durch KI verändert werden. Kritiker betonen hingegen, dass die Beziehungsarbeit zwischen Lehrkraft und Schüler*innen nicht ersetzbar sei. Zwar lässt sich der Lehrkräftemangel nicht wegdiskutieren, dennoch ist der Datenschutz nicht verhandelbar. Weder ein klares Ja noch ein klares Nein ist angemessen; vielmehr kommt es auf den konkreten Einsatzbereich und auf klare rechtliche Rahmenbedingungen an."

