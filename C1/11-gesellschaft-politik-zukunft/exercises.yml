  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Zweiteilige Konnektoren — welche Form passt?'
    optionLayout: block
    instructions: 'Wähle die Formulierung mit dem passenden zweiteiligen Konnektor.'
    items:
      - q: 'Welcher Satz verwendet „einerseits … andererseits" korrekt?'
        options:
          - { key: a, text: 'Einerseits KI ermöglicht mehr Individualisierung, andererseits verändert sie die Lehrkraft.' }
          - { key: b, text: 'Einerseits ermöglicht KI mehr Individualisierung, andererseits verändert sie die Lehrkraft grundlegend.' }
          - { key: c, text: 'Einerseits ermöglicht KI mehr Individualisierung, die Lehrkraft verändert sich andererseits.' }
        answer: b
        why: 'Nach vorangestelltem „einerseits" muss die Inversion folgen: „ermöglicht KI …".'
      - q: 'Welcher Satz verwendet „zwar … aber/dennoch" korrekt?'
        options:
          - { key: a, text: 'Zwar ist Fachsprache nötig, aber sie ist nicht immer verständlich.' }
          - { key: b, text: 'Zwar Fachsprache ist nötig, aber sie ist nicht verständlich.' }
          - { key: c, text: 'Zwar ist Fachsprache nötig, aber nicht alle versteht sie.' }
        answer: a
        why: '„Zwar" leitet einen normalen Hauptsatz ein; nach „aber" folgt ein neuer Hauptsatz.'
      - q: 'Welcher Satz verwendet „nicht nur … sondern auch" korrekt?'
        options:
          - { key: a, text: 'Lernen ist nicht nur Informationsaufnahme, sondern auch Beziehungsarbeit.' }
          - { key: b, text: 'Lernen ist nicht nur Informationsaufnahme, aber auch Beziehungsarbeit.' }
          - { key: c, text: 'Lernen ist nicht nur Informationsaufnahme, auch Beziehungsarbeit.' }
        answer: a
        why: 'Paarform: „nicht nur … sondern auch" — beides muss parallel stehen.'
      - q: 'Welcher Satz verwendet „sowohl … als auch" korrekt?'
        options:
          - { key: a, text: 'Datenschutz ist sowohl rechtliche Frage und auch pädagogische Frage.' }
          - { key: b, text: 'Datenschutz ist sowohl rechtliche als auch pädagogische Frage.' }
          - { key: c, text: 'Datenschutz ist sowohl rechtliche Frage, als auch pädagogisch.' }
        answer: b
        why: 'Streng paralleler Aufbau: „sowohl … als auch" verbindet gleiche Satzglieder.'
      - q: 'Welcher Satz verwendet „weder … noch" korrekt?'
        options:
          - { key: a, text: 'Weder das eine noch das andere ist richtig; vielmehr kommt es auf den Kontext an.' }
          - { key: b, text: 'Weder das eine noch das andere ist richtig, sondern auf den Kontext kommt es an.' }
          - { key: c, text: 'Weder das eine oder das andere ist richtig; vielmehr kommt es auf den Kontext an.' }
        answer: a
        why: '„Weder … noch" — beides verneint; nach „vielmehr" folgt die eigene Position.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Konjunktiv I für fremde Positionen'
    instructions: 'Setze die Verben in den Konjunktiv I (Wiederholung C1/05). 8 Items.'
    text: |
      1. (sein, Sg.) Der Bundesrechnungshof betont, die Reform {1} unzureichend.
      2. (sein, Pl.) Kritiker bezweifeln, dass diese Grenzen {2} aufrechtzuerhalten.
      3. (haben) Befürworter argumentieren, die KI {3} entlastende Wirkung.
      4. (müssen) Sie sagen, man {4} stärker in Weiterbildung investieren.
      5. (geben) Die Autorin betont, es {5} verlässliche Daten.
      6. (sein, Sg.) Sie meint, der Datenschutz {6} nicht verhandelbar.
      7. (werden) Die Forschenden erklären, das Berufsbild {7} sich verändern.
      8. (können, 3. Pl. — Ersatzform) Sie behaupten, solche Systeme {8} Lehrkräfte nicht ersetzen.
    answers:
      "1": sei
      "2": seien
      "3": habe
      "4": müsse
      "5": gebe
      "6": sei
      "7": werde
      "8": könnten

  - id: A3
    block: A
    type: single-choice
    title: 'Hedging bei Prognosen — welche Formulierung ist vorsichtig?'
    optionLayout: block
    instructions: 'Wähle die vorsichtige Prognose.'
    items:
      - q: 'Wie formuliert man eine Prognose am vorsichtigsten?'
        options:
          - { key: a, text: 'Im Jahr 2040 wird die Zahl um 30 Prozent steigen.' }
          - { key: b, text: 'Die Zahl dürfte bis 2040 um rund 30 Prozent steigen.' }
          - { key: c, text: 'Die Zahl steigt auf jeden Fall um 30 Prozent.' }
        answer: b
        why: '„dürfte" (Modalverb der Vermutung) + „rund" (Bandbreite) + „bis" (Zeithorizont) — drei Hedging-Elemente.'
      - q: 'Welche Formulierung gibt eine Bandbreite an?'
        options:
          - { key: a, text: 'Der Anteil steigt deutlich.' }
          - { key: b, text: 'Der Anteil dürfte zwischen 25 und 30 Prozent liegen.' }
          - { key: c, text: 'Der Anteil beträgt 27 Prozent.' }
        answer: b
        why: '„zwischen 25 und 30 Prozent" gibt eine Bandbreite an.'
      - q: 'Welche Formulierung nennt eine Bedingung?'
        options:
          - { key: a, text: 'Es ist damit zu rechnen, dass die Zahl steigt.' }
          - { key: b, text: 'Die Zahl steigt.' }
          - { key: c, text: 'Sofern die Zuwanderung konstant bleibt, dürfte die Bevölkerungszahl stabil bleiben.' }
        answer: c
        why: '„sofern" leitet eine Bedingung ein; „dürfte" markiert die Vermutung.'
      - q: 'Welche Formulierung unterscheidet Szenarien?'
        options:
          - { key: a, text: 'Die Entwicklung ist ungewiss.' }
          - { key: b, text: 'Im besten Fall stabilisiert sich die Zahl, im schlechtesten Fall halbiert sie sich.' }
          - { key: c, text: 'Die Zahl wird sich verändern.' }
        answer: b
        why: '„im besten Fall …, im schlechtesten Fall …" = zwei Szenarien.'
      - q: 'Welche Formulierung stapelt zu viele Hedges?'
        options:
          - { key: a, text: 'Die Zahl dürfte voraussichtlich vermutlich steigen.' }
          - { key: b, text: 'Die Zahl dürfte vermutlich steigen.' }
          - { key: c, text: 'Die Zahl steigt.' }
        answer: a
        why: 'Mehrere Hedges hintereinander wirken unsicher statt vorsichtig — ein Hedge genügt.'

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: 'Hedging-Mittel einsetzen'
    instructions: 'Setze das passende Hedging-Mittel ein. 6 Items.'
    text: |
      1. Modalverb: Die Zahl {1} bis 2040 um rund 30 Prozent steigen.
      2. Adverb: {2} wird auch der Pflegebedarf zunehmen.
      3. Wendung: Es ist {3} zu rechnen, dass die Kosten steigen.
      4. Bandbreite: Der Anteil {4} zwischen 25 und 30 Prozent liegen.
      5. Bedingung: {5} die Zuwanderung konstant bleibt, dürfte sich die Lage stabilisieren.
      6. Szenario: {6} Fall dürfte der Anteil sinken, im schlechtesten Fall stagnieren.
    answers:
      "1": dürfte
      "2": Voraussichtlich
      "3": damit
      "4": dürfte
      "5": Sofern
      "6": Im besten

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: 'Statistik versprachlichen'
    instructions: 'Setze die passende Präposition (um, auf, von, auf …) oder den passenden Anteil ein. 8 Items.'
    text: |
      1. Die Zahl steigt {1} 5 Prozent. (Veränderung)
      2. Die Zahl steigt {2} 30 Prozent. (neuer Stand)
      3. Die Bevölkerung wuchs von 80 {3} 83 Millionen.
      4. Der Anteil liegt bei {4} Viertel der Bevölkerung.
      5. Nahezu {5} Drittel der Erwerbstätigen arbeitet im Homeoffice.
      6. {6} die Hälfte der Befragten stimmte zu.
      7. Der Anteil hat sich gegenüber 1990 mehr als {7}.
      8. Die Arbeitslosigkeit {8} seit Jahren kontinuierlich.
    answers:
      "1": um
      "2": auf
      "3": auf
      "4": einem
      "5": ein
      "6": Knapp
      "7": verdoppelt
      "8": sinkt

  - id: A6
    block: A
    type: single-choice
    title: 'Register: registergerechte vs. registerunscharfe Lexik'
    optionLayout: block
    instructions: 'Wähle die registergerechte (sachliche) Formulierung.'
    items:
      - q: 'Welche Formulierung passt in einen Sachtext?'
        options:
          - { key: a, text: 'Wir müssen die Zuwanderung steuern.' }
          - { key: b, text: 'Wir müssen die Flüchtlingswelle stoppen.' }
          - { key: c, text: 'Wir müssen die Ausländer draußen halten.' }
        answer: a
        why: '„Zuwanderung steuern" ist sachlich; „Flüchtlingswelle" ist emotional aufgeladen, „Ausländer draußen halten" ist diskreditierend.'
      - q: 'Welche Formulierung passt in einen Kommentar?'
        options:
          - { key: a, text: 'Die Alten kosten zu viel.' }
          - { key: b, text: 'Der Anteil älterer Menschen nimmt weiter zu.' }
          - { key: c, text: 'Die Alten werden immer mehr.' }
        answer: b
        why: '„Anteil … nimmt weiter zu" ist sachliche Statistikversprachlichung; die anderen Varianten sind registerunscharf oder reduktiv.'
      - q: 'Welche Formulierung passt in eine Erörterung?'
        options:
          - { key: a, text: 'Multikulti ist gescheitert.' }
          - { key: b, text: 'Die Multikulti-Träume sind aus.' }
          - { key: c, text: 'Die plurale Gesellschaft steht vor Herausforderungen.' }
        answer: c
        why: '„plurale Gesellschaft" ist registergerecht; „Multikulti" ist umgangssprachlich und oft ironisch.'
      - q: 'Welche Formulierung passt in einen politischen Sachtext?'
        options:
          - { key: a, text: 'Die Migrationspolitik steht vor großen Herausforderungen.' }
          - { key: b, text: 'Wir haben ein Asylantenproblem.' }
          - { key: c, text: 'Die Asylanten überschwemmen das Land.' }
        answer: a
        why: '„Migrationspolitik" ist sachlich; die anderen Varianten sind diskreditierend.'
      - q: 'Welche Formulierung passt in einen wirtschaftspolitischen Text?'
        options:
          - { key: a, text: 'Wir machen jetzt einen Plan gegen den Fachkräftemangel.' }
          - { key: b, text: 'Es wird eine kohärente Strategie zur Bekämpfung des Fachkräftemangels entwickelt.' }
          - { key: c, text: 'Wir tun jetzt was gegen den Personalmangel.' }
        answer: b
        why: '„kohärente Strategie" + Passiv ist registergerecht; die anderen Varianten sind umgangssprachlich.'

