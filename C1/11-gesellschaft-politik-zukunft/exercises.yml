  - id: A9
    block: A
    type: single-choice
    title: 'Konjunktiv II als vorsichtige Distanzierung'
    optionLayout: block
    instructions: 'Wähle die Formulierung mit höflicher Distanzierung.'
    items:
      - q: 'Welche Formulierung signalisiert höfliche Distanz?'
        options:
          - { key: a, text: 'Diese Position wäre zu kurz gegriffen.' }
          - { key: b, text: 'Diese Position ist falsch.' }
          - { key: c, text: 'Diese Position ist Quatsch.' }
        answer: a
        why: '„wäre" (Konjunktiv II) signalisiert Distanz ohne direkte Kritik.'
      - q: 'Welche Formulierung ist ein höflicher Widerspruch?'
        options:
          - { key: a, text: 'Ich muss Ihnen widersprechen.' }
          - { key: b, text: 'Da würde ich widersprechen.' }
          - { key: c, text: 'Das stimmt nicht.' }
        answer: b
        why: '„würde … widersprechen" ist Konjunktiv II als Höflichkeitsform.'
      - q: 'Welche Formulierung drückt eine hypothetische Schlussfolgerung aus?'
        options:
          - { key: a, text: 'Wenn man so argumentiert, hat man recht.' }
          - { key: b, text: 'Wenn man so argumentiert, ist das schlecht.' }
