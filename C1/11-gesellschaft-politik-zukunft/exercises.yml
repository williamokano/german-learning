  - id: D2
    block: D
    type: odd-one-out
    title: 'Odd one out: Diskurssprache'
    instructions: 'Streiche das Wort, das nicht passt, und erkläre warum.'
    groups:
      - items: [Einerseits, Zwar, Weder, Dennoch]
        odd: 2
        why: '„Einerseits" leitet eine Aufzählung ein, „Zwar" und „Dennoch" bilden ein Paar; „Weder" verneint beides.'
      - items: [dürfte, könnte, müsste, ist]
        odd: 3
        why: '„dürfte/könnte/müsste" sind Modalverben der Vermutung; „ist" ist Indikativ (Gewissheit).'
      - items: [Demografie, Migration, Assimilation, Globalisierung]
        odd: 3
        why: 'Demografie, Migration und Assimilation betreffen Bevölkerungsstruktur; Globalisierung betrifft weltweite Vernetzung.'
      - items: [vermutlich, voraussichtlich, tendenziell, definitiv]
        odd: 3
        why: '„vermutlich/voraussichtlich/tendenziell" sind Hedging-Adverbien; „definitiv" ist ein Verstärker.'
      - items: [Zuwanderung, Flüchtlingswelle, plurale Gesellschaft, Integration]
        odd: 1
        why: '„Zuwanderung", „plurale Gesellschaft", „Integration" sind sachlich; „Flüchtlingswelle" ist emotional aufgeladen.'
      - items: [Stellung beziehen, den Wandel gestalten, eine Strategie versachlichen, eine Lösung googeln]
        odd: 3
        why: 'Die ersten drei sind Kollokationen des politischen Diskurses; „googeln" ist umgangssprachlich und passt nicht ins Register.'

