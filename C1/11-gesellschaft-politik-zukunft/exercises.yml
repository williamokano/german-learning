lesson: C1/11
title: 'C1 · Lektion 11 — Übungen (Gesellschaft, Politik, Zukunft)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause. Argumentiere schriftlich mit
  Konjunktiv I und Hedging.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (KI-Debatte)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'In Hessen soll eine KI Lehrkräfte in einem Pilotprojekt vollständig ersetzen.'
        answer: false
        why: 'Im Podcast geht es um Entlastung im Lehrkräftemangel, nicht um vollständigen Ersatz.'
      - q: 'Lukas findet es schwer zu akzeptieren, dass eine KI Lehrkräfte ersetzen soll.'
        answer: true
        why: 'Lukas: „Ich finde das schwer zu akzeptieren … Das kann ein Algorithmus nicht."'
      - q: 'Anna sorgt sich vor allem um den Datenschutz minderjähriger Schüler*innen.'
        answer: true
        why: 'Anna: „was ist mit Datenschutz? Minderjährige Schüler*innen geben Daten in ein System …"'
      - q: 'Mia will die Debatte versachlichen und schlägt vor, den Einsatzbereich differenziert zu betrachten.'
        answer: true
        why: 'Mia: „Es geht nicht um KI vs. Lehrkraft, sondern um den Einsatzbereich."'
      - q: 'Am Ende einigen sich alle drei auf eine klare Pro- oder Contra-Position.'
        answer: false
        why: 'Lukas ordnet am Ende drei Positionen: Mia „bedingt ja", er „eher nein", Anna „mit Bauchschmerzen" — kein Konsens.'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Demografie-Interview)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Was prognostiziert Frau Schäfer für Köln bis 2040?'
        options:
          - { key: a, text: 'Einen Anstieg der über 65-Jährigen um rund 25 Prozent.' }
          - { key: b, text: 'Einen Rückgang der über 65-Jährigen um 25 Prozent.' }
          - { key: c, text: 'Ein Ende des demografischen Wandels.' }
        answer: a
        why: 'Frau Schäfer: „Die Zahl der über 65-Jährigen wird voraussichtlich bis 2040 um rund 25 Prozent steigen."'
      - q: 'Was gehört nach Frau Schäfers Worten zur „doppelten Belastung" der Kommunen?'
        options:
          - { key: a, text: 'Mehr Einnahmen und weniger Ausgaben.' }
          - { key: b, text: 'Weniger Einnahmen und mehr Ausgaben.' }
          - { key: c, text: 'Höhere Steuern und sinkende Mieten.' }
        answer: b
        why: '„Eine doppelte Belastung: weniger Einnahmen, mehr Ausgaben."'
      - q: 'Welche Strategie verfolgt Köln nach Frau Schäfer?'
        options:
          - { key: a, text: 'Stärkung der Zuwanderung ohne Integrationsangebote.' }
          - { key: b, text: 'Nur Pflegeeinrichtungen ausbauen.' }
          - { key: c, text: 'Familien gewinnen UND Integration verbessern.' }
        answer: c
        why: '„Zum einen versuchen wir, Familien zu gewinnen … Zum anderen müssen wir die Integration der Zugewanderten verbessern."'
      - q: 'Was wünscht sich Frau Schäfer von der nächsten Bundesregierung?'
        options:
          - { key: a, text: 'Eine kohärente Demografiepolitik, die Politikfelder verzahnt.' }
          - { key: b, text: 'Eine reine Sparpolitik.' }
          - { key: c, text: 'Höhere Renten ohne Reform.' }
        answer: a
        why: 'Frau Schäfer: „eine kohärente Demografiepolitik … ein Gesamtkonzept, das die verschiedenen Politikfelder miteinander verzahnt."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: KI in der Berufswelt'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Liebe Hörerinnen und Hörer, willkommen zu „Wirtschaft und Gesellschaft".
      Eine neue {1} des Instituts für Arbeitsmarkt- und Berufsforschung hat
      untersucht, wie sich Künstliche Intelligenz auf die Berufswelt auswirkt.
      Den Ergebnissen {2} dürfte sich der Anteil der Tätigkeiten, die durch
      KI ersetzt werden könnten, bis 2030 auf etwa 25 {3} erhöhen. Die
      Forschenden betonen jedoch, dass dies nicht automatisch mit dem
      {4} von Arbeitsplätzen gleichzusetzen sei. Vielmehr {5} sich das
      Berufsbild vieler Menschen grundlegend verändern. Die Autorin der
      Studie erklärte, man {6} daher verstärkt in Weiterbildung investieren.
    bank: [Studie, zufolge, Prozent, Wegfall, werde, müsse, halbieren, wegen, müsste]
    answers:
      "1": Studie
      "2": zufolge
      "3": Prozent
      "4": Wegfall
      "5": werde
      "6": müsse

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter einer Kommunalverwaltung'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter des Bürgeramtes der Stadt Köln erreicht. Unsere Sprechzeiten sind montags bis freitags von acht bis dreizehn Uhr, donnerstags zusätzlich bis achtzehn Uhr. Bitte vereinbaren Sie für Anmeldungen, Ummeldungen und Passangelegenheiten vorab einen Termin online unter www.stadt-koeln.de oder telefonisch unter 0221-1234567. Am Mittwoch, den 15. Oktober, bleibt das Bürgeramt wegen einer internen Schulung geschlossen. Für eilige Anliegen rund um das Thema Wohnsitz wenden Sie sich bitte direkt an die Servicestelle im Erdgeschoss. Bitte beachten Sie: Eine telefonische Beratung zu Sozialleistungen ist nicht möglich. Bitte ruf mich zurück — ich wiederhole: 0221-1234567. Vielen Dank für Ihr Verständnis.'
    items:
      - q: 'Welche Einrichtung ist auf dem Anrufbeantworter zu hören?'
        options:
          - { key: a, text: 'Das Bürgeramt der Stadt Köln.' }
          - { key: b, text: 'Das Finanzamt Bonn.' }
          - { key: c, text: 'Die Universitätsbibliothek.' }
        answer: a
        why: '„Sie haben den Anrufbeantworter des Bürgeramtes der Stadt Köln erreicht."'
      - q: 'Wie sind die regulären Sprechzeiten?'
        options:
          - { key: a, text: 'Täglich von acht bis achtzehn Uhr.' }
          - { key: b, text: 'Montags bis freitags von acht bis dreizehn Uhr, donnerstags bis achtzehn Uhr.' }
          - { key: c, text: 'Nur am Wochenende.' }
        answer: b
        why: '„Unsere Sprechzeiten sind montags bis freitags von acht bis dreizehn Uhr, donnerstags zusätzlich bis achtzehn Uhr."'
      - q: 'Warum ist das Bürgeramt am 15. Oktober geschlossen?'
        options:
          - { key: a, text: 'Wegen einer Demonstration.' }
          - { key: b, text: 'Wegen eines Feiertags.' }
          - { key: c, text: 'Wegen einer internen Schulung.' }
        answer: c
        why: '„Am Mittwoch, den 15. Oktober, bleibt das Bürgeramt wegen einer internen Schulung geschlossen."'
      - q: 'Für welches Anliegen bekommt man KEINE telefonische Beratung?'
        options:
          - { key: a, text: 'Sozialleistungen.' }
          - { key: b, text: 'Wohnsitzanliegen.' }
          - { key: c, text: 'Passangelegenheiten.' }
        answer: a
        why: '„Eine telefonische Beratung zu Sozialleistungen ist nicht möglich."'

