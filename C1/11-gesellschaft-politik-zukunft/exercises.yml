    model: |
      „Die öffentliche Debatte über Zuwanderung ist oft von Polemik geprägt. Sachlich betrachtet, stellt Zuwanderung sowohl eine Herausforderung als auch eine Chance dar. Einerseits erfordert die Integration der Zugewanderten erhebliche Investitionen — etwa in Sprach- und Berufsanerkennungskurse —, andererseits könnte sie langfristig dem Fachkräftemangel entgegenwirken. Zwar lassen sich die Kosten nicht wegdiskutieren, dennoch sollte man auch die positiven Effekte berücksichtigen. Eine kohärente Migrationspolitik, die Integration, Fachkräftesicherung und gesellschaftlichen Zusammenhalt miteinander verzahnt, dürfte wirksamer sein als plakative Forderungen."

