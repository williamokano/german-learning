  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: Erörterung zu gesellschaftspolitischem Thema'
    prompt: 'Verfasse eine lineare Erörterung (10–14 Sätze) zu der Frage: „Sollte KI an Schulen erprobt werden?" Strukturiere mit Einleitung, These, Hauptteil (Pro-Contra) und Schluss. Nutze mindestens drei zweiteilige Konnektoren, Konjunktiv I für mindestens eine fremde Position, Hedging für Prognosen, Statistik-Versprachlichung und registergerechte Lexik. Schließe mit einer abgewogenen Schlussfolgerung.'
    use:
      - 'Struktur: Einleitung → These → Hauptteil (mind. 2 Pro, mind. 2 Contra) → Schlussfolgerung'
      - 'Mindestens 3 zweiteilige Konnektoren'
      - 'Mindestens 1 Konjunktiv I für eine fremde Position'
      - 'Mindestens 1 Hedging-Mittel (dürfte, vermutlich, voraussichtlich)'
      - 'Mindestens 1 Statistik-Versprachlichung (um … Prozent, sich verdoppeln, Anteil)'
      - 'Durchgehend registergerechte Lexik (kein Boulevard-Jargon)'
    selfCheck:
      - 'Hat der Text eine klare Struktur (Einleitung, These, Hauptteil, Schluss)?'
      - 'Werden mindestens drei zweiteilige Konnektoren korrekt verwendet?'
      - 'Wird mindestens eine fremde Position im Konjunktiv I wiedergegeben?'
      - 'Wird mindestens eine Statistik korrekt versprachlicht?'
      - 'Ist die Lexik durchgehend sachlich?'
      - 'Schließt der Text mit einer abgewogenen (nicht platt wertenden) Schlussfolgerung?'
    model: |
      „Die Frage, ob KI an Schulen erprobt werden sollte, wird in Deutschland kontrovers diskutiert. Im Folgenden werden die wichtigsten Pro- und Contra-Argumente gegeneinander abgewogen. These der Erörterung ist, dass KI unter klaren rechtlichen Rahmenbedingungen erprobt werden sollte, jedoch weder als Ersatz für Lehrkräfte noch als kurzfristige Sparmaßnahme.

      Für den Einsatz spricht zunächst, dass KI die Individualisierung des Lernens erheblich verbessern kann. Einer Studie des Instituts für Arbeitsmarkt- und Berufsforschung zufolge dürften bis 2030 rund 25 Prozent der Tätigkeiten durch KI verändert werden. Auch die Entlastung im Lehrkräftemangel ist ein gewichtiges Argument — laut Statistischem Bundesamt fehlen bis 2030 voraussichtlich rund 70 000 Lehrkräfte. Befürworter argumentieren, KI könne Routineaufgaben übernehmen und Lehrkräfte entlasten, sodass diese sich auf die pädagogische Beziehungsarbeit konzentrieren könnten.

      Gegen den Einsatz spricht indessen, dass Datenschutz und Transparenz bisher nicht hinreichend geregelt sind. Minderjährige Schüler*innen geben Daten in Systeme, deren Algorithmen niemand vollständig durchschaut. Kritiker betonen, KI könne die pädagogische Beziehungsarbeit nicht ersetzen, da Lernen nicht nur kognitive Informationsverarbeitung sei, sondern auch soziale Beziehungsarbeit. Zwar ließen sich manche Aufgaben automatisieren, dennoch bleibt die Lehrkraft als Vertrauensperson unverzichtbar.

      Einerseits verspricht KI also mehr Individualisierung, andererseits wirft sie Fragen zum Datenschutz und zur Rolle der Lehrkraft auf. Weder ein vollständiges Ja noch ein klares Nein ist angemessen. Vielmehr sollte eine kohärente Strategie entwickelt werden, die Datenschutz, pädagogische Qualität und gesellschaftliche Verantwortung miteinander verzahnt. KI darf weder Ersatz noch Alibi sein, sondern muss als Ergänzung in einem pädagogisch verantworteten Rahmen dienen."

