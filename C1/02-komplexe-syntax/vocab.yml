  # ── Konnektoren und Klammerer für lange Sätze — 7 two-part connectors ─────
  - de: einerseits … andererseits
    article: null
    plural: null
    en: on the one hand … on the other hand
    pos: phrase
    tags: [connector, contrast, phrase]
    core: true
    example: "zweigliedrige Gegenüberstellung"
  - de: zum einen … zum anderen
    article: null
    plural: null
    en: for one thing … for another
    pos: phrase
    tags: [connector, addition, phrase]
    core: true
    example: "Aufzählung in Begründungen"
  - de: nicht nur … sondern auch
    article: null
    plural: null
    en: not only … but also
    pos: phrase
    tags: [connector, addition, phrase]
    core: true
  - de: sowohl … als auch
    article: null
    plural: null
    en: both … and
    pos: phrase
    tags: [connector, addition, phrase]
    core: true
    example: "gleichzeitige Geltung"
  - de: weder … noch
    article: null
    plural: null
    en: neither … nor
    pos: phrase
    tags: [connector, negation, phrase]
    core: true
    example: "doppelte Negation"
  - de: zwar … aber
    article: null
    plural: null
    en: admittedly … but
    pos: phrase
    tags: [connector, concession, phrase]
    core: true
  - de: was … betrifft
    article: null
    plural: null
    en: as far as … is concerned
    pos: phrase
    tags: [connector, topic, phrase]
    core: true
    example: "Themeneinstieg; also: anbelangt, angeht"