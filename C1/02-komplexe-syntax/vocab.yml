entries:
  # ── Kernwortschatz: Komplexe Syntax — 16 nouns ─────────────────────────────
  - de: Satzperiode
    article: die
    plural: Satzperioden
    en: long sentence period (main clause + several subordinate clauses)
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Hauptsatz
    article: der
    plural: Hauptsätze
    en: main clause
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "Independent clause with finite verb in position 2."
  - de: Nebensatz
    article: der
    plural: Nebensätze
    en: subordinate clause
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "Dependent clause with finite verb at the end."
  - de: Apposition
    article: die
    plural: Appositionen
    en: apposition
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "Hamburg, die Hansestadt."
  - de: Parenthese
    article: die
    plural: Parenthesen
    en: parenthesis; inserted aside
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Attribut
    article: das
    plural: Attribute
    en: attribute; modifier (to a noun)
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Partizipialattribut
    article: das
    plural: Partizipialattribute
    en: participial attribute
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "cf. B2/05"
  - de: Genitivattribut
    article: das
    plural: Genitivattribute
    en: genitive attribute
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "die Stadt Berlins"
  - de: Präpositionalattribut
    article: das
    plural: Präpositionalattribute
    en: prepositional attribute
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "das Haus am Markt"
  - de: Relativsatz
    article: der
    plural: Relativsätze
    en: relative clause
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
    example: "cf. B1/05"
  - de: Ellipse
    article: die
    plural: Ellipsen
    en: ellipsis (deliberate omission)
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Satzklammer
    article: die
    plural: Satzklammern
    en: sentence bracket (verbal frame)
    pos: noun
    tags: [linguistics, syntax, abstract]
    core: true
  - de: Ausklammerung
    article: die
    plural: Ausklammerungen
