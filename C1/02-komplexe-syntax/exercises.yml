  - id: C2
    block: C
    type: single-choice
    title: "Sprachbausteine Teil 1"
    instructions: "Wähle die stilistisch korrekte Option (a, b oder c) für jede Lücke."
    items:
      - q: "Berlin, ____ Hauptstadt Deutschlands, hat 3,6 Millionen Einwohner."
        options:
          - { key: a, text: "die" }
          - { key: b, text: "der" }
          - { key: c, text: "den" }
        answer: a
        why: 'Apposition im Nominativ (gleich wie „Berlin") — „die Hauptstadt" (feminin, Nom. Sg.).'
      - q: "Wir trafen Herrn Schneider, ____ erfahrenen Anwalt."
        options:
          - { key: a, text: "den" }
          - { key: b, text: "der" }
          - { key: c, text: "dem" }
        answer: a
        why: '„Herrn Schneider" steht im Akkusativ — Apposition muss im gleichen Kasus stehen: „den erfahrenen Anwalt" (Akk. Sg. maskulin).'
      - q: "Sein Bruder — ____ stiller Beobachter — bemerkte die Szene."
        options:
          - { key: a, text: "—" }
          - { key: b, text: "(" }
          - { key: c, text: "„ (Gedankenstrich)" }
        answer: b
        why: "Parenthese in Klammern (oder Gedankenstrichen) — hier Klammern geöffnet."
      - q: "Die ____ Krise spitzt sich zu."
        options:
          - { key: a, text: "sich verschärfende" }
          - { key: b, text: "seit Monaten andauernde" }
          - { key: c, text: "von der Regierung ignorierte" }
        answer: b
        why: 'Partizip I (Infinitiv + d), vorangestellt vor dem Nomen — „andauern" → „andauernde". Möglich sind mehrere; (b) ist eine korrekte Variante mit nur einem Attribut.'
      - q: "Der Bürgermeister, ____ wir morgen sprechen, hat noch nicht geantwortet."
        options:
          - { key: a, text: "mit dem" }
          - { key: b, text: "mit der" }
          - { key: c, text: "mit den" }
        answer: a
        why: '„an + Akkusativ" bei Bewegungsrichtung; „Bürgermeister" maskulin → „mit dem".'
      - q: "____ Berlin, er nach München."
        options:
          - { key: a, text: "Sie fährt nach" }
          - { key: b, text: "Sie nach" }
          - { key: c, text: "Sie ging nach" }
        answer: b
        why: 'Ellipse — die finite Verbform „fährt" ist ausgelassen: „Sie [fährt] nach Berlin, [und] er [fährt] nach München".'
      - q: "Es wurde gestern ____ : Der Minister tritt zurück."
        options:
          - { key: a, text: "bekannt" }
          - { key: b, text: "erfahren" }
          - { key: c, text: "gemacht" }
        answer: a
        why: '„Es wurde … bekannt" — feste Wendung mit Doppelpunkt + selbstständigem Satz im Nachfeld (Ausklammerung).'

