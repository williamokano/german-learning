  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out"
    instructions: "Streiche das Wort oder die Konstruktion, die nicht passt, und erkläre warum."
    groups:
      - items: ["Apposition", "Parenthese", "Attribut", "Konjunktiv"]
        odd: 3
        why: "Konjunktiv ist eine Verbform; die anderen drei sind syntaktische Werkzeuge (Beifügungen)."
      - items: ["Partizipialattribut", "Genitivattribut", "Präpositionalattribut", "Konjunktionaladverb"]
        odd: 3
        why: 'Konjunktionaladverb (z. B. „deshalb") ist kein Attribut; die anderen drei sind Beifügungen zum Nomen.'
      - items: ["Gedankenstriche", "Klammern", "Kommas", "Semikolons"]
        odd: 3
        why: "Semikolon verbindet Sätze; die anderen drei markieren Parenthesen / Appositionen."
      - items: ["Sie nach Berlin", "er nach München", "Wir nach Hause", "Sehr geehrte Frau"]
        odd: 3
        why: '„Sehr geehrte Frau" ist eine Anrede, keine Ellipse; die anderen drei sind Verb-Ellipsen.'
      - items: ["vorangestellt", "nachgestellt", "ausgeklammert", "partizipial"]
        odd: 3
        why: '„partizipial" beschreibt die Form (Partizip I oder II); die anderen drei beschreiben die Stellung.'
      - items: ["Satzperiode", "Schachtelsatz", "Nominalstil", "Ellipse"]
        odd: 2
        why: "Nominalstil ist eine Stilebene (vgl. B2/01); die anderen drei sind syntaktische Werkzeuge."

