  - id: B2
    block: B
    type: single-choice
    title: "Apposition im richtigen Kasus?"
    instructions: "Welche Apposition steht im richtigen Kasus? Wähle (a) für den ersten Satz, (b) für den zweiten Satz."
    items:
      - q: '(1) „Ich kenne Herrn Schneider, ein erfahrener Anwalt.“ (2) „Ich kenne Herrn Schneider, einen erfahrenen Anwalt.“'
        options:
          - { key: a, text: "Satz 2 ist richtig (Apposition im Akkusativ)." }
          - { key: b, text: "Satz 1 ist richtig (Apposition im Nominativ)." }
          - { key: c, text: "Beide Sätze sind richtig." }
        answer: a
        why: '„Herrn Schneider" steht im Akkusativ (Bezugswort), also muss die Apposition auch im Akkusativ stehen: „einen erfahrenen Anwalt". „ein erfahrener Anwalt" (Nominativ) wäre falsch.'
      - q: '(1) „Ich arbeite seit Jahren mit Frau Müller, die neue Chefin.“ (2) „Ich arbeite seit Jahren mit Frau Müller, der neuen Chefin.“'
        options:
          - { key: a, text: "Satz 1 ist richtig (Apposition im Nominativ)." }
          - { key: b, text: "Satz 2 ist richtig (Apposition im Dativ)." }
          - { key: c, text: "Beide Sätze sind richtig." }
        answer: b
        why: '„mit Frau Müller" steht im Dativ, also muss die Apposition auch im Dativ stehen: „der neuen Chefin".'
      - q: '(1) „Das Buch, ein spannender Roman, hat mir gefallen.“ (2) „Das Buch, ein spannenden Roman, hat mir gefallen.“'
        options:
          - { key: a, text: "Beide Sätze sind richtig." }
          - { key: b, text: "Satz 2 ist richtig (Apposition im Akkusativ)." }
          - { key: c, text: "Satz 1 ist richtig (Apposition im Nominativ)." }
        answer: c
        why: '„Das Buch" steht im Nominativ (Bezugswort), also muss die Apposition „ein spannender Roman" auch im Nominativ stehen (männlich, Nominativ Singular mit unbestimmtem Artikel: „-er").'
      - q: '(1) „Wir trafen den Direktor, der neuen Leiter der Abteilung.“ (2) „Wir trafen den Direktor, den neuen Leiter der Abteilung.“'
        options:
          - { key: a, text: "Satz 2 ist richtig (Apposition im Akkusativ)." }
          - { key: b, text: "Satz 1 ist richtig (Apposition im Nominativ)." }
          - { key: c, text: "Beide Sätze sind richtig." }
        answer: a
        why: '„den Direktor" steht im Akkusativ, also muss die Apposition „den neuen Leiter" auch im Akkusativ stehen.'

  - id: B3
    block: B
    type: free-write
    title: "Eine Satzperiode planen und schreiben"
    prompt: 'Schreib eine Satzperiode mit folgenden Werkzeugen: (a) ein Hauptsatz, (b) zwei Relativsätze, (c) eine Apposition, (d) eine Parenthese. Thema: „eine bemerkenswerte Begegnung". (8–12 Sätze insgesamt — eine Periode + Erläuterung der Werkzeuge.)'
    stimulus: |
      Ausgangslage: Du triffst eine Person, die dich beeindruckt. Baue die Person in eine Satzperiode ein.
    use:
      - "Hauptsatz mit finitem Verb auf Position 2"
      - "Mindestens zwei Relativsätze (Verb-Endstellung!)"
      - "Eine Apposition im richtigen Kasus"
      - "Eine Parenthese in Gedankenstrichen"
    selfCheck:
      - "Steht jedes finite Verb im Nebensatz am Satzende?"
      - "Steht die Apposition im gleichen Kasus wie das Bezugswort?"
      - "Ist die Parenthese durch zwei Gedankenstriche (oder Klammern) eingegrenzt?"
      - "Wird der Hauptsatz durch die Verschachtelung unleserlich? Wenn ja: kürzen."
    model: |
      Ich traf gestern Frau Hoffmann, die Senior-Partnerin der Kanzlei, deren Buch über Verhandlungstechnik, ein Standardwerk der Branche, inzwischen in der sechsten Auflage erscheint und das — so hört man — jeden angehenden Juristen als Pflichtlektüre begleitet, im Foyer des Verlagshauses, wo sie — für mich überraschend — auf mich zuging und mich nach meinem Manuskript fragte. Werkzeuge: Hauptsatz (Position 2: „trat"), zwei Relativsätze („die Senior-Partnerin …", „das … begleitet"), Apposition („die Senior-Partnerin der Kanzlei"), Parenthese („so hört man"), nachgestellte Attribute („über Verhandlungstechnik", „in der sechsten Auflage", „im Foyer des Verlagshauses").

