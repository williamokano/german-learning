  - id: B8
    block: B
    type: single-choice
    title: "Komma-Setzung: korrekt oder falsch?"
    instructions: "Welche Version ist korrekt? Wähle (a) oder (b)."
    items:
      - q: '„Das Buch, das sie mir empfohlen hatte war ausverkauft.“ vs. „Das Buch, das sie mir empfohlen hatte, war ausverkauft.“'
        options:
          - { key: a, text: "Version 2 (Komma nach dem Relativsatz)." }
          - { key: b, text: "Version 1 (kein Komma nach dem Relativsatz)." }
        answer: a
        why: "Ein Relativsatz wird durch Kommas vom Hauptsatz abgetrennt, wenn er in der Mitte steht."
      - q: '„Berlin die Hauptstadt Deutschlands hat 3,6 Millionen Einwohner.“ vs. „Berlin, die Hauptstadt Deutschlands, hat 3,6 Millionen Einwohner.“'
        options:
          - { key: a, text: "Version 1 (keine Kommas)." }
          - { key: b, text: "Version 2 (Kommas um die Apposition)." }
        answer: b
        why: "Appositionen werden mit Kommas abgetrennt."
      - q: '„Sein Bruder ein stiller Beobachter bemerkte die Szene.“ vs. „Sein Bruder — ein stiller Beobachter — bemerkte die Szene.“'
        options:
          - { key: a, text: "Version 2 (Gedankenstriche)." }
          - { key: b, text: "Version 1 (keine Klammer)." }
        answer: a
        why: "Eine Parenthese muss durch zwei Gedankenstriche oder Klammern abgetrennt sein."
      - q: '„Der Bürgermeister der dies versprochen hatte trat zurück.“ vs. „Der Bürgermeister, der dies versprochen hatte, trat zurück.“'
        options:
          - { key: a, text: "Version 1 (keine Kommas)." }
          - { key: b, text: "Version 2 (Kommas um den Relativsatz)." }
        answer: b
        why: "Relativsätze in der Satzmitte werden durch Kommas abgetrennt."

  - id: B9
    block: B
    type: free-write
    title: "Drei Werkzeuge in einem kurzen Aufsatz"
    prompt: "Schreib einen kurzen Aufsatz (8–10 Sätze) über ein Thema deiner Wahl (z. B. ein Buch, ein Ereignis, eine Person). Verwende dabei mindestens (1) eine Apposition, (2) eine Parenthese, (3) ein vorangestelltes Partizipialattribut, (4) einen nachgestellten Relativsatz und (5) eine Ellipse in einer Zwischenüberschrift oder einem Motto."
    stimulus: |
      Themen-Vorschläge: ein Buch, das dich beeindruckt hat · eine historische Persönlichkeit · ein Erlebnis aus deinem Berufsalltag.
    use:
      - "Apposition im korrekten Kasus"
      - "Parenthese in Gedankenstrichen"
      - "Vorangestelltes Partizipialattribut (max. 3 Attribute)"
      - "Nachgestellter Relativsatz mit Präposition"
      - "Ellipse in einer Zwischenüberschrift"
    selfCheck:
      - "Hast du wirklich alle fünf Werkzeuge verwendet?"
      - "Stimmt der Kasus der Apposition?"
      - "Ist die Parenthese vollständig eingeklammert?"
      - "Steht das finite Verb im Relativsatz am Ende?"
    model: |
      „Lesen — bildet."

      Kürzlich las ich „Die Stunde Null", ein 2020 erschienener Roman, der die Nachkriegszeit aus der Perspektive dreier Schwestern erzählt. Die Autorin — eine promovierte Historikerin — verwebt in diesem Buch, das zu Unrecht wenig Beachtung gefunden hat, biografische Quellen mit fiktionalen Szenen. Die Schwestern, deren Schicksale sich auf engstem Raum kreuzen, stehen stellvertretend für eine ganze Generation. Was mich — und das hat mich überrascht — am meisten beeindruckt hat, ist die Sprache: kurze, klare Sätze, keine Effekthascherei. Die Leser, mit denen ich über das Buch sprach, waren sich einig: Dieses Buch verdient mehr Aufmerksamkeit.

