    type: free-write
    title: "Einen langen Satz in zwei kurze Sätze auflösen"
    prompt: "Löse den folgenden Schachtelsatz in zwei bis drei kürzere, klarere Sätze auf. Achte darauf, dass die Apposition und die Parenthese nicht verloren gehen."
