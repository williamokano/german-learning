          - { gap: 1, answer: 'eröffnen', given: 'eröffnen' }
      - label: 'Wort erteilen'
        cells:
          - { gap: 2, answer: 'Wort erteilen', given: 'Wort erteilen' }
          - { gap: 2, answer: 'Yusuf', given: 'Yusuf' }
          - { gap: 2, answer: 'Ich würde Sie bitten, zu beginnen' }
          - { gap: 2, answer: 'das Wort erteilen', given: 'das Wort erteilen' }
      - label: 'These'
        cells:
          - { gap: 3, answer: 'These', given: 'These' }
