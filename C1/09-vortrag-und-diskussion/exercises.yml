          - { gap: 3, answer: 'Meine These lautet', given: 'Meine These lautet' }
          - { gap: 3, answer: 'eine These aufstellen', given: 'eine These aufstellen' }
      - label: 'Einhaken'
        cells:
          - { gap: 4, answer: 'Einhaken', given: 'Einhaken' }
          - { gap: 4, answer: 'Yusuf', given: 'Yusuf' }
          - { gap: 4, answer: 'Gestatten Sie, dass ich einhake' }
          - { gap: 4, answer: 'steuern', given: 'steuern' }

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: 'Gliederungssignale — welche Phase?'
    optionLayout: block
    instructions: 'Wähle das Signal, das zur genannten Phase des Vortrags passt (a, b oder c).'
    items:
      - q: 'Womit leitet man einen Vortrag EIN?'
        options:
          - { key: a, text: 'Im Folgenden möchte ich drei Punkte ansprechen.' }
          - { key: b, text: 'Zusammenfassend lässt sich sagen …' }
          - { key: c, text: 'Damit komme ich zum Schluss.' }
        answer: a
        why: '„Im Folgenden möchte ich …" eröffnet den Vortrag und kündigt das Vorgehen an.'
      - q: 'Welcher Satz signalisiert eine ÜBERLEITUNG?'
        options:
          - { key: a, text: 'Sehr geehrte Damen und Herren.' }
          - { key: b, text: 'Damit komme ich zu meinem zweiten Punkt.' }
          - { key: c, text: 'Vielen Dank für Ihre Aufmerksamkeit.' }
        answer: b
        why: '„Damit komme ich zu …" führt von einem Teil zum nächsten.'
      - q: 'Welcher Satz gehört zum SCHLUSS?'
        options:
          - { key: a, text: 'Zunächst betrachte ich die Ursachen.' }
          - { key: b, text: 'Gegenstand meines Vortrags ist …' }
          - { key: c, text: 'Zusammenfassend lässt sich festhalten, dass …' }
        answer: c
        why: '„Zusammenfassend lässt sich festhalten …" fasst am Ende zusammen.'
      - q: 'Womit kündigt man die GLIEDERUNG an?'
        options:
          - { key: a, text: 'Zunächst …, anschließend …, abschließend …' }
          - { key: b, text: 'Da würde ich widersprechen.' }
          - { key: c, text: 'Habe ich Sie richtig verstanden?' }
        answer: a
        why: '„Zunächst … anschließend … abschließend …" gliedert den Hauptteil.'
      - q: 'Welcher Satz HEBT etwas HERVOR?'
        options:
          - { key: a, text: 'Kommen wir nun zum nächsten Abschnitt.' }
          - { key: b, text: 'Besonders wichtig erscheint mir dieser Punkt.' }
          - { key: c, text: 'Ich komme zum Schluss.' }
        answer: b
        why: '„Besonders wichtig erscheint mir …" betont eine zentrale Aussage.'

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: 'Inversion: das Verb an Position 2'
    instructions: 'Nach einem vorangestellten Adverbiale steht das Verb an Position 2. Setze die richtige Verbform ein. 8 Items.'
    text: |
      1. Zunächst {1} ich das Thema ein. (eingrenzen, ich)
      2. Im Folgenden {2} ich drei Punkte ansprechen. (werden-Futur)
      3. Damit {3} ich zu meinem zweiten Punkt. (kommen)
      4. Anschließend {4} ich zwei Beispiele vor. (vorstellen)
      5. Abschließend {5} ich ein Fazit. (ziehen)
      6. Besonders wichtig {6} mir dieser Aspekt. (erscheinen)
      7. Zusammenfassend {7} sich festhalten, dass … (sich lassen)
      8. Soweit zu Teil eins; nun {8} wir zu Teil zwei. (kommen, wir)
    answers:
      "1": grenze
      "2": werde
      "3": komme
      "4": stelle
      "5": ziehe
      "6": erscheint
      "7": lässt
      "8": kommen

  - id: A3
    block: A
    type: single-choice
    title: 'Moderieren — höflich formulieren'
    optionLayout: block
    instructions: 'Wähle die höfliche, moderationsgerechte Formulierung (a, b oder c).'
    items:
      - q: 'Du möchtest jemandem das Wort erteilen.'
        options:
          - { key: a, text: 'Reden Sie jetzt!' }
          - { key: b, text: 'Ich würde Sie bitten, zu beginnen.' }
          - { key: c, text: 'Sie sind dran, los.' }
        answer: b
        why: 'Der Konjunktiv II „würde bitten" wirkt höflich und souverän.'
      - q: 'Du musst eine Rednerin unterbrechen.'
        options:
          - { key: a, text: 'Stopp, jetzt rede ich!' }
          - { key: b, text: 'Hören Sie auf.' }
          - { key: c, text: 'Gestatten Sie, dass ich kurz einhake?' }
        answer: c
        why: '„Gestatten Sie, dass ich einhake?" unterbricht höflich.'
      - q: 'Du erinnerst an die begrenzte Redezeit.'
        options:
          - { key: a, text: 'Sie reden viel zu lang!' }
          - { key: b, text: 'Ich müsste Sie bitten, sich kurzzufassen.' }
          - { key: c, text: 'Schluss jetzt.' }
        answer: b
        why: 'Der Konjunktiv II „müsste bitten" mildert die Aufforderung.'
      - q: 'Du willst sichergehen, dass du richtig verstanden hast.'
        options:
          - { key: a, text: 'Habe ich Sie richtig verstanden, dass …?' }
          - { key: b, text: 'Was wollen Sie eigentlich sagen?' }
          - { key: c, text: 'Das war jetzt unklar.' }
        answer: a
        why: '„Habe ich Sie richtig verstanden, dass …?" sichert rück und fasst zusammen.'
      - q: 'Du möchtest zum Thema zurückführen.'
        options:
          - { key: a, text: 'Das gehört doch gar nicht hierher!' }
          - { key: b, text: 'Kommen wir noch einmal auf die Ausgangsfrage zurück.' }
          - { key: c, text: 'Reden Sie nicht so viel Unsinn.' }
        answer: b
        why: '„Kommen wir noch einmal auf … zurück" lenkt sachlich zum Thema.'

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: 'Konjunktiv II der Höflichkeit'
    instructions: 'Setze die höfliche Konjunktiv-II-Form ein (Grundverb in Klammern). 6 Items.'
    text: |
      1. (werden) Ich {1} Sie bitten, zu beginnen.
      2. (dürfen) {2} ich Sie kurz unterbrechen?
      3. (können) {3} Sie das näher erläutern?
      4. (müssen) Ich {4} Sie bitten, zum Schluss zu kommen.
      5. (werden) {5} Sie bitte etwas lauter sprechen?
      6. (haben) Ich {6} da noch eine Nachfrage.
    answers:
      "1": würde
      "2": Dürfte
      "3": Könnten
      "4": müsste
      "5": Würden
      "6": hätte

  - id: A5
    block: A
    type: single-choice
    title: 'Argumentative Konnektoren'
    optionLayout: block
    instructions: 'Wähle den passenden Konnektor (a, b oder c).'
    items:
      - q: 'Forschung sollte zugänglich sein, {…} sie öffentlich finanziert wird. (verstärkter Grund)'
        options:
          - { key: a, text: 'zumal' }
          - { key: b, text: 'sofern' }
          - { key: c, text: 'obwohl' }
        answer: a
        why: '„zumal" verstärkt einen Grund („umso mehr, als").'
      - q: '{…} die Daten stimmen, ist der Schluss berechtigt. (Bedingung)'
        options:
          - { key: a, text: 'Sofern' }
          - { key: b, text: 'Zumal' }
          - { key: c, text: 'Insofern' }
        answer: a
        why: '„sofern" nennt eine Bedingung (= wenn).'
      - q: 'Sie haben recht — {…} stimme ich Ihnen zu. (in dieser Hinsicht)'
        options:
          - { key: a, text: 'sofern' }
          - { key: b, text: 'insofern' }
          - { key: c, text: 'zumal' }
        answer: b
        why: '„insofern" heißt „in dieser Hinsicht".'
      - q: '{…} ist Fachsprache präzise, aber sie schließt viele aus. (Einräumung)'
        options:
          - { key: a, text: 'Zwar' }
          - { key: b, text: 'Sofern' }
          - { key: c, text: 'Insofern' }
        answer: a
        why: '„zwar … aber" räumt ein und stellt dann die Gegenposition.'
      - q: 'Das überzeugt nicht nur inhaltlich, {…} auch rhetorisch.'
        options:
          - { key: a, text: 'aber' }
          - { key: b, text: 'sondern' }
          - { key: c, text: 'dennoch' }
        answer: b
        why: 'Korrelat ist „nicht nur … sondern auch".'

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: 'Konnektoren einsetzen'
    instructions: 'Setze den passenden Konnektor ein (ein Wort). 6 Items.'
    text: |
      1. (verstärkter Grund) Der Vortrag sollte kurz sein, {1} das Publikum müde ist.
      2. (Bedingung = wenn) {2} die Stichprobe groß genug ist, ist das Ergebnis aussagekräftig.
      3. (in dieser Hinsicht) Sie haben recht — {3} teile ich Ihre Einschätzung.
      4. (Gegenposition nach „zwar") Zwar ist es präzise, {4} schwer verständlich.
      5. (zweite Seite) Einerseits braucht es Genauigkeit, {5} Verständlichkeit.
      6. (Korrelat zu „nicht nur") Das gilt nicht nur fachlich, {6} auch öffentlich.
    answers:
      "1": zumal
      "2": Sofern
      "3": insofern
      "4": aber
      "5": andererseits
      "6": sondern

  - id: A7
    block: A
    type: single-choice
    title: 'Diplomatisch widersprechen oder Killerphrase?'
    optionLayout: block
    instructions: 'Wähle die diplomatische, sachliche Formulierung (a, b oder c).'
    items:
      - q: 'Du bist anderer Meinung.'
        options:
          - { key: a, text: 'Das ist doch Unsinn.' }
          - { key: b, text: 'Da würde ich widersprechen.' }
          - { key: c, text: 'So ein Quatsch.' }
        answer: b
        why: '„Da würde ich widersprechen" ist höflich; die anderen sind Killerphrasen.'
      - q: 'Du willst einräumen und dann widersprechen.'
        options:
          - { key: a, text: 'Da haben Sie zwar recht, dennoch sehe ich ein Problem.' }
          - { key: b, text: 'Sie haben überhaupt keine Ahnung.' }
          - { key: c, text: 'Das stimmt einfach nicht.' }
        answer: a
        why: 'Erst einräumen („zwar recht"), dann sachlich widersprechen („dennoch").'
      - q: 'Du möchtest einen Einwand vorsichtig einleiten.'
        options:
          - { key: a, text: 'Jeder weiß doch, dass das falsch ist.' }
          - { key: b, text: 'Man könnte einwenden, dass …' }
          - { key: c, text: 'Das ist mir zu blöd.' }
        answer: b
        why: '„Man könnte einwenden, dass …" federt den Widerspruch ab.'
      - q: 'Du willst nachfragen statt anzugreifen.'
        options:
          - { key: a, text: 'Wie meinen Sie das genau?' }
          - { key: b, text: 'Reden Sie doch nicht so wirr.' }
          - { key: c, text: 'Das ergibt keinen Sinn.' }
        answer: a
        why: '„Wie meinen Sie das genau?" ist eine sachliche Nachfrage.'
      - q: 'Du gibst der anderen Seite ein Stück recht.'
        options:
          - { key: a, text: 'Da ist nichts dran.' }
          - { key: b, text: 'Zugegeben, das klingt überzeugend.' }
          - { key: c, text: 'Das interessiert mich nicht.' }
        answer: b
        why: '„Zugegeben, …" ist eine Konzession (man räumt etwas ein).'

  - id: A8
    block: A
    type: matching
    title: 'Redemittel — Funktion zuordnen'
    instructions: 'Ordne jedem Redemittel (1–5) die passende Funktion (a–e) zu.'
    left:
      - { key: '1', text: 'Im Folgenden möchte ich …' }
      - { key: '2', text: 'Damit komme ich zu meinem zweiten Punkt.' }
      - { key: '3', text: 'Ich würde Sie bitten, zu beginnen.' }
      - { key: '4', text: 'Da würde ich widersprechen.' }
      - { key: '5', text: 'Zusammenfassend lässt sich sagen …' }
    right:
      - { key: a, text: 'Vortrag: einleiten' }
      - { key: b, text: 'Vortrag: überleiten' }
      - { key: c, text: 'Moderation: das Wort erteilen' }
      - { key: d, text: 'Diskussion: diplomatisch widersprechen' }
      - { key: e, text: 'Vortrag: zusammenfassen und schließen' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e

  - id: A9
    block: A
    type: matching
    title: 'Rhetorische Mittel — Beispiel zuordnen'
    instructions: 'Ordne jedem rhetorischen Mittel (1–5) das passende Beispiel (a–e) zu.'
    left:
      - { key: '1', text: 'rhetorische Frage' }
      - { key: '2', text: 'Dreierfigur' }
      - { key: '3', text: 'Anapher' }
      - { key: '4', text: 'Metapher' }
      - { key: '5', text: 'Hyperbel' }
    right:
      - { key: a, text: 'Wer hätte das gedacht?' }
      - { key: b, text: 'kurz, klar, konkret' }
      - { key: c, text: 'Wir forschen, wir prüfen, wir veröffentlichen.' }
      - { key: d, text: 'ein Meer von Daten' }
      - { key: e, text: 'Das habe ich tausendmal gehört.' }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e

  - id: A10
    block: A
    type: gap-bank
    title: 'Redemittel eines Vortrags'
    instructions: 'Füll die 6 Lücken mit dem passenden Wort aus dem Kasten. Drei Wörter sind zu viel.'
    text: |
      1. Zur Begrüßung: „Sehr {1} Damen und Herren."
      2. Zur Gliederung: „Mein Vortrag {2} sich in drei Teile."
      3. Zur Überleitung: „Damit {3} ich zu Punkt zwei."
      4. Zur Hervorhebung: „Lassen Sie mich das {4}."
      5. Zum Schluss: „Zusammenfassend lässt sich {5}, dass …"
      6. Zum Dank: „Vielen Dank für Ihre {6}."
    bank: [geehrte, gliedert, komme, betonen, sagen, Aufmerksamkeit, schreibt, vorliest, Begrüßung]
    answers:
      "1": geehrte
      "2": gliedert
      "3": komme
      "4": betonen
      "5": sagen
