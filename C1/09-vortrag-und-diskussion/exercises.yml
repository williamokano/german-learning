          - { key: b, text: 'Da würde ich widersprechen.' }
          - { key: c, text: 'Quatsch, das stimmt nicht.' }
        answer: b
        why: 'Der Konjunktiv II „würde widersprechen" federt den Widerspruch ab.'

  - id: B3
    block: B
    type: single-choice
    title: 'Diplomatisch reagieren im Kontext'
    optionLayout: block
    instructions: 'Wähle die Reaktion, die im Kontext am besten passt (a, b oder c).'
    items:
      - q: 'Jemand greift deine These scharf an. Wie reagierst du souverän?'
        options:
          - { key: a, text: 'Sie haben ja keine Ahnung.' }
          - { key: b, text: 'Danke für den Einwand — da würde ich allerdings widersprechen.' }
          - { key: c, text: 'Das diskutiere ich nicht.' }
        answer: b
        why: 'Erst bedanken, dann sachlich widersprechen — das wirkt souverän.'
      - q: 'Du gibst zu, dass an einem Gegenargument etwas dran ist, hältst aber an deiner Position fest.'
        options:
          - { key: a, text: 'Da haben Sie zwar recht, dennoch bleibe ich bei meinem Standpunkt.' }
          - { key: b, text: 'Okay, dann haben Sie eben gewonnen.' }
          - { key: c, text: 'Nein, niemals.' }
        answer: a
        why: 'Konzession („zwar recht") + begründetes Festhalten („dennoch").'
      - q: 'Du willst eine Aussage einschränken, statt sie absolut zu behaupten.'
        options:
          - { key: a, text: 'Das gilt immer und überall.' }
          - { key: b, text: 'Das dürfte zumindest in vielen Fällen zutreffen.' }
          - { key: c, text: 'Das ist hundertprozentig so.' }
        answer: b
        why: '„dürfte … zumindest …" schwächt die Aussage angemessen ab (Hedging).'
      - q: 'Du moderierst und willst die Runde freundlich zum Ende bringen.'
        options:
          - { key: a, text: 'So, jetzt ist aber Schluss.' }
          - { key: b, text: 'Damit kommen wir zum Ende. Ich danke Ihnen für die Diskussion.' }
          - { key: c, text: 'Reden Sie endlich nicht mehr.' }
        answer: b
        why: '„Damit kommen wir zum Ende … Ich danke Ihnen" beendet höflich.'
      - q: 'Ein Beitrag schweift vom Thema ab. Wie führst du zurück?'
        options:
          - { key: a, text: 'Kommen wir noch einmal auf die Ausgangsfrage zurück.' }
          - { key: b, text: 'Das interessiert hier keinen.' }
          - { key: c, text: 'Thema verfehlt, setzen.' }
        answer: a
        why: '„Kommen wir noch einmal auf … zurück" lenkt sachlich zurück.'

  - id: B4
    block: B
    type: matching
    title: 'Killerphrase und diplomatische Alternative'
    instructions: 'Ordne jeder Killerphrase (1–5) die diplomatische Entsprechung (a–e) zu.'
    left:
