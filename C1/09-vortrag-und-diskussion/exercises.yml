          - { key: c, text: 'Er liest den Rest schweigend von der Folie ab.' }
        answer: b
        why: 'Ein Vortrag ist Kommunikation: Pausen machen, das Publikum einbeziehen.'
      - q: 'Ablesen: Der Redner liest jede Folie Wort für Wort vor.'
        options:
          - { key: a, text: 'Er spricht frei und nutzt die Folie nur als Stütze.' }
          - { key: b, text: 'Er dreht sich ganz zur Leinwand und liest lauter.' }
          - { key: c, text: 'Er schreibt noch mehr Text auf die Folien.' }
        answer: a
        why: 'Folien sind Stütze, kein Skript — frei sprechen, Blickkontakt halten.'
      - q: 'Unbegründet: „Das ist halt einfach so."'
        options:
          - { key: a, text: 'Das ist eben so, basta.' }
          - { key: b, text: 'Das lässt sich damit begründen, dass …' }
          - { key: c, text: 'Das ist nun mal Fakt.' }
        answer: b
        why: 'Behauptungen begründen statt mit „halt" abzutun.'

  - id: B6
    block: B
    type: gap-text
    listLayout: true
    title: 'Konzession: einräumen und widersprechen'
    instructions: 'Setze das passende Konzessiv-/Adversativwort ein. 6 Items.'
    text: |
      1. {1} ist die Fachsprache präzise, aber sie schließt viele aus. (Einräumung am Satzanfang)
      2. Da haben Sie zwar recht, {2} sehe ich ein anderes Problem.
      3. Ihr Punkt ist nachvollziehbar, {3} würde ich differenzieren. (= trotzdem)
      4. Zugegeben, das klingt überzeugend, {4} bleibt ein Einwand. (gehoben für „dennoch")
      5. {5} braucht es Genauigkeit, andererseits Verständlichkeit.
      6. Einerseits überzeugt das Argument, {6} überzeugt es nicht ganz.
    answers:
