lesson: C1/09
title: 'C1 · Lektion 9 — Übungen (Vortrag und Diskussion)'
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause. Sprich die Redemittel laut mit.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Dialog A (Referat-Probe)'
    audio: dialog1_a.mp3
    instructions: 'Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?'
    items:
      - q: 'Anna hält ihr Referat schon übermorgen.'
        answer: true
        why: 'Anna: „Ich muss übermorgen mein Referat über Wissenschaftskommunikation halten."'
      - q: 'Bruno findet es gut, dass Anna ihren Text vollständig abliest.'
        answer: false
        why: 'Bruno kritisiert gerade das Ablesen: „Du liest ab, ohne ein einziges Mal hochzuschauen."'
      - q: 'Mia rät Anna, am Anfang ihre Gliederung anzukündigen.'
        answer: true
        why: 'Mia: „Sag am Anfang, worum es geht und wie du vorgehst: Zunächst …, anschließend …, abschließend …".'
      - q: 'Bruno schlägt vor, mit einer rhetorischen Frage zu beginnen.'
        answer: true
        why: 'Bruno: „Stell am Anfang eine Frage in den Raum — eine rhetorische Frage."'
      - q: 'Anna soll laut Bruno möglichst schnell sprechen, um Zeit zu sparen.'
        answer: false
        why: 'Bruno rät zum Gegenteil: „langsamer sprechen. Mach Pausen."'

  - id: H1b
    block: H
    type: single-choice
    title: 'Dialog Hör-Check: Dialog B (Podiumsdiskussion)'
    audio: dialog1_b.mp3
    optionLayout: block
    instructions: 'Hör Dialog B und wähle die richtige Antwort (a, b oder c).'
    items:
      - q: 'Welche Rolle hat Yusuf in der Veranstaltung?'
        options:
          - { key: a, text: 'Er ist der Moderator.' }
          - { key: b, text: 'Er ist der Hauptredner.' }
          - { key: c, text: 'Er ist ein Zuschauer.' }
        answer: a
        why: 'Yusuf: „ich darf Sie durch den heutigen Abend führen" — er moderiert.'
      - q: 'Wie lautet Frau Webers These?'
        options:
          - { key: a, text: 'Fachsprache sollte ganz abgeschafft werden.' }
          - { key: b, text: 'Forschung, die niemand versteht, bleibt wirkungslos.' }
          - { key: c, text: 'Wissenschaft braucht keine Öffentlichkeit.' }
        answer: b
        why: 'Frau Weber: „Meine These lautet: Forschung, die niemand versteht, bleibt wirkungslos."'
      - q: 'Wie reagiert Frau Weber auf den Einwand, Vereinfachung sei Verfälschung?'
        options:
          - { key: a, text: 'Sie stimmt sofort zu.' }
          - { key: b, text: 'Sie widerspricht: verständlich heiße nicht ungenau.' }
          - { key: c, text: 'Sie wechselt das Thema.' }
        answer: b
        why: 'Frau Weber: „Da würde ich widersprechen. Verständlich heißt nicht ungenau."'
      - q: 'Warum hakt Yusuf ein?'
        options:
          - { key: a, text: 'Weil die Zeit begrenzt ist.' }
          - { key: b, text: 'Weil er anderer Meinung ist.' }
          - { key: c, text: 'Weil das Mikrofon ausfällt.' }
        answer: a
        why: 'Yusuf: „Gestatten Sie, dass ich an dieser Stelle einhake — unsere Zeit ist leider begrenzt."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Science Slam'
    audio: hoertext.mp3
    instructions: 'Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel.'
    text: |
      Guten Abend und willkommen zu „Kultur am Mittwoch". Gestern fand im
      ausverkauften Stadttheater der diesjährige Science {1} statt. Sechs junge
      {2} hatten jeweils zehn Minuten Zeit, ihre Arbeit so unterhaltsam wie
      möglich zu präsentieren. Den {3} trug eine Biologin davon, die das
      Sozialverhalten von Ameisen mit einer Bürogemeinschaft verglich. Über den
      Gewinner entscheidet beim Science Slam nicht eine Fachjury, sondern der
      {4} der Zuschauer. Die Veranstalter betonen, gerade dieses {5} zeige, dass
      Wissenschaft weder trocken noch unverständlich sein müsse. Der nächste
      Science Slam ist bereits für den {6} geplant.
    bank: [Slam, Forschende, Sieg, Applaus, Format, Herbst, Vortrag, Publikum, Sommer]
    answers:
      "1": Slam
      "2": Forschende
      "3": Sieg
      "4": Applaus
      "5": Format
      "6": Herbst

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anrufbeantworter der Rhetorik-Werkstatt'
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: 'Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest.'
    transcript: 'Guten Tag, Sie haben den Anrufbeantworter der Rhetorik-Werkstatt Berlin erreicht. Vielen Dank für Ihre Anmeldung zu unserem Wochenendkurs „Frei sprechen — überzeugend präsentieren". Der Kurs findet am kommenden Samstag von zehn bis siebzehn Uhr in Raum 204 statt. Bitte bringen Sie ein eigenes Vortragsthema und, wenn möglich, eine kurze Gliederung mit. Sollten Sie verhindert sein, rufen Sie uns bitte bis Freitagmittag zurück, damit wir den Platz weitergeben können. Wir freuen uns auf Sie.'
    items:
      - q: 'Wessen Anrufbeantworter hat man erreicht?'
        options:
          - { key: a, text: 'Den der Universitätsbibliothek.' }
          - { key: b, text: 'Den der Rhetorik-Werkstatt Berlin.' }
          - { key: c, text: 'Den eines Theaters.' }
        answer: b
        why: '„Sie haben den Anrufbeantworter der Rhetorik-Werkstatt Berlin erreicht."'
      - q: 'Worum geht es in der Nachricht?'
        options:
          - { key: a, text: 'Um einen Wochenendkurs zum freien Sprechen und Präsentieren.' }
          - { key: b, text: 'Um die Absage einer Veranstaltung.' }
          - { key: c, text: 'Um eine Rechnung.' }
        answer: a
        why: '„Vielen Dank für Ihre Anmeldung zu unserem Wochenendkurs „Frei sprechen — überzeugend präsentieren"."'
      - q: 'Was sollen die Teilnehmenden mitbringen?'
        options:
          - { key: a, text: 'Einen Laptop und Kopfhörer.' }
          - { key: b, text: 'Ein eigenes Vortragsthema und eine kurze Gliederung.' }
          - { key: c, text: 'Nichts, alles wird gestellt.' }
        answer: b
        why: '„Bitte bringen Sie ein eigenes Vortragsthema und … eine kurze Gliederung mit."'
      - q: 'Was soll man tun, wenn man verhindert ist?'
        options:
          - { key: a, text: 'Bis Freitagmittag zurückrufen.' }
          - { key: b, text: 'Einfach nicht erscheinen.' }
          - { key: c, text: 'Eine E-Mail am Samstag schreiben.' }
        answer: a
        why: '„Sollten Sie verhindert sein, rufen Sie uns bitte bis Freitagmittag zurück."'

  - id: H5
    block: H
    type: table-fill
    title: 'Tabelle ausfüllen: Dialog B (Moderation)'
    audio: dialog1_b.mp3
    instructions: 'Hör Dialog B noch einmal und füll die Tabelle aus. In jeder Zeile fehlt eine Information.'
    columns: ['Moment', 'Wer', 'Redemittel', 'Funktion']
    rows:
      - label: 'Eröffnung'
        cells:
          - { gap: 1, answer: 'Eröffnung', given: 'Eröffnung' }
