      "4": d
      "5": e

  - id: B5
    block: B
    type: single-choice
    title: 'Finde die beste Korrektur'
    optionLayout: block
    instructions: 'Wähle die beste Korrektur des Auftrittsfehlers (a, b oder c).'
    items:
      - q: 'Füllwörter: „Also das ist halt irgendwie so, ähm, schwierig."'
        options:
          - { key: a, text: 'Das ist in der Tat schwierig.' }
          - { key: b, text: 'Das ist halt einfach echt schwierig.' }
          - { key: c, text: 'Das ist so, ähm, ziemlich schwierig.' }
        answer: a
        why: 'Füllwörter („halt", „irgendwie", „ähm") streichen, klar formulieren.'
      - q: 'Registerbruch: „Boah, das ist ja mega kompliziert."'
        options:
          - { key: a, text: 'Das ist voll der Wahnsinn kompliziert.' }
          - { key: b, text: 'Das ist ausgesprochen komplex.' }
          - { key: c, text: 'Das ist echt krass kompliziert.' }
        answer: b
        why: '„ausgesprochen komplex" passt ins sachliche Register.'
      - q: 'Monolog: Der Redner spricht zehn Minuten ohne Pause weiter.'
        options:
          - { key: a, text: 'Er redet einfach noch schneller, um fertig zu werden.' }
