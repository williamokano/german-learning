  - id: B2
    block: B
    type: single-choice
    title: 'Registerbruch in der Diskussion erkennen'
    optionLayout: block
    instructions: 'Wähle die Formulierung, die in eine sachliche Diskussion passt.'
    items:
      - q: 'Du bist anderer Meinung:'
        options:
          - { key: a, text: 'Das sehe ich anders.' }
          - { key: b, text: 'Ey, das ist ja voll daneben.' }
          - { key: c, text: 'So ein Blödsinn.' }
