  - id: C4a
    block: C
    type: true-false
    title: 'Lesen Text 1 (Lesetext: Die Kunst der freien Rede)'
    instructions: |
      > Die Angst, vor anderen zu sprechen, gehört zu den am weitesten verbreiteten Ängsten überhaupt — manche Umfragen nennen sie noch vor der Angst vor dem Tod. Wer einen Vortrag hält, setzt sich aus und steht im Mittelpunkt. Und doch ist die freie Rede eine erlernbare Fähigkeit, keine angeborene Gabe. Schon in der Antike wurde sie systematisch gelehrt; Redner wie Cicero füllten ganze Bücher mit Ratschlägen, die im Kern bis heute gelten.
      >
      > Drei dieser Ratschläge sind besonders zeitlos. Erstens: Struktur schlägt Stoff — ein klar gegliederter Vortrag bleibt im Gedächtnis. Zweitens: Weniger ist mehr — wer das Publikum mit Zahlen und Folien überschüttet, erreicht das Gegenteil von Klarheit. Drittens: Die Pause ist ein Werkzeug — erfahrene Redner setzen die Stille gezielt ein, statt sie mit „ähm" zu füllen.
      >
      > Hinzu kommen die rhetorischen Mittel, die eine Aussage nicht wahrer, aber wirkungsvoller machen. Sie sind weder Trick noch Manipulation, solange sie einem ehrlichen Anliegen dienen; fragwürdig werden sie erst, wenn sie leere Behauptungen schmücken sollen. Genau hier verläuft die Grenze zwischen Rhetorik und Demagogie.
      >
      > Bemerkenswert ist, dass diese alten Einsichten heute eine Renaissance erleben — etwa im Format des TED-Talks oder im Science Slam. Wer Inhalt und Form zusammenbringt, erreicht ein Publikum, das eine klassische Fachvorlesung nie erreicht hätte.

      Richtig (R) oder Falsch (F)?
    items:
      - q: 'Laut Text ist die freie Rede eine angeborene Gabe, die man nicht lernen kann.'
        answer: false
        why: '„… ist die freie Rede eine erlernbare Fähigkeit, keine angeborene Gabe."'
      - q: 'Der Text nennt „Struktur schlägt Stoff" als einen der zeitlosen Ratschläge.'
        answer: true
        why: '„Erstens: Struktur schlägt Stoff — ein klar gegliederter Vortrag bleibt im Gedächtnis."'
      - q: 'Erfahrene Redner füllen jede Pause mit Füllwörtern wie „ähm".'
        answer: false
        why: '„… erfahrene Redner setzen die Stille gezielt ein, statt sie mit „ähm" zu füllen."'
      - q: 'Laut Text werden rhetorische Mittel fragwürdig, wenn sie leere Behauptungen schmücken sollen.'
        answer: true
        why: '„… fragwürdig werden sie erst, wenn sie leere Behauptungen schmücken sollen."'
      - q: 'Der Text behauptet, alte rhetorische Einsichten seien heute völlig bedeutungslos geworden.'
        answer: false
        why: 'Im Gegenteil: Sie erleben „heute eine Renaissance — etwa im Format des TED-Talks oder im Science Slam."'

  - id: C4b
    block: C
    type: single-choice
    title: 'Lesen Text 2 (Forumsdiskussion: Sollte man Reden üben?)'
    optionLayout: block
    instructions: |
      Lies die folgenden Forumsbeiträge und wähle a, b oder c.

      > **Beitrag 1 — Moderation:**
      > Diese Woche diskutieren wir: Sollte freies Reden ein fester Bestandteil von Schule und Studium sein? Bitte begründen Sie Ihre Beiträge sachlich.
      >
      > **Beitrag 2 — Hannah:**
      > Aus meiner Sicht eindeutig ja. Viele kluge Menschen kommen nicht zu Wort, weil sie nie gelernt haben, frei zu sprechen. Rhetorik gibt ihnen dieses Werkzeug — das ist eine Frage der Chancengleichheit.
      >
      > **Beitrag 3 — Tomáš:**
      > Ich stimme im Grundsatz zu, würde aber differenzieren. Es bringt wenig, Techniken zu pauken, wenn man nichts zu sagen hat. Erst der Inhalt, dann die Form.
      >
      > **Beitrag 4 — Pavel:**
      > Beides gehört zusammen. Gerade weil der Inhalt wichtig ist, muss man ihn auch vermitteln können. Ein guter Gedanke, den niemand versteht, bleibt wirkungslos.
    items:
      - q: 'Was ist die Leitfrage der Diskussion?'
        options:
          - { key: a, text: 'Sollte freies Reden fester Bestandteil von Schule und Studium sein?' }
          - { key: b, text: 'Sollte man Rhetorikkurse verbieten?' }
          - { key: c, text: 'Wer hält die besten Vorträge?' }
        answer: a
        why: '„Sollte freies Reden ein fester Bestandteil von Schule und Studium sein?" (Beitrag 1).'
      - q: 'Womit begründet Hannah ihre Zustimmung?'
        options:
          - { key: a, text: 'Mit dem Spaßfaktor.' }
          - { key: b, text: 'Mit der Chancengleichheit — sonst kommen kluge Leute nicht zu Wort.' }
          - { key: c, text: 'Mit niedrigeren Kosten.' }
        answer: b
        why: '„Rhetorik gibt ihnen dieses Werkzeug — das ist eine Frage der Chancengleichheit."'
      - q: 'Wie positioniert sich Tomáš?'
        options:
          - { key: a, text: 'Er lehnt das Reden-Üben völlig ab.' }
          - { key: b, text: 'Er hält Inhalt für unwichtig.' }
          - { key: c, text: 'Er stimmt grundsätzlich zu, betont aber: erst der Inhalt, dann die Form.' }
        answer: c
        why: '„Ich stimme im Grundsatz zu, würde aber differenzieren … Erst der Inhalt, dann die Form."'
      - q: 'Welches Argument bringt Pavel?'
        options:
          - { key: a, text: 'Inhalt und Form gehören zusammen; ein unverständlicher Gedanke bleibt wirkungslos.' }
          - { key: b, text: 'Form ist völlig egal.' }
          - { key: c, text: 'Nur der Inhalt zählt.' }
        answer: a
        why: '„Ein guter Gedanke, den niemand versteht, bleibt wirkungslos."'

  - id: C5
    block: C
    type: free-write
    title: 'Schreiben: argumentative Stellungnahme'
    prompt: 'Verfasse eine argumentative Stellungnahme (10–15 Sätze) zu der Frage: „Sollte Rhetorik ein eigenes Schulfach werden?" Argumentiere abwägend (Pro und Kontra), nimm am Ende klar Stellung. Nutze mindestens drei argumentative Konnektoren, Hedging und eine Konzession.'
    use:
      - 'Eine klare These und einen abwägenden Aufbau (einerseits … andererseits)'
      - 'Mindestens 3 argumentative Konnektoren (zumal, sofern, insofern, zwar … dennoch …)'
      - 'Mindestens eine Konzession (Da ist zwar … recht, dennoch …)'
      - 'Hedging an mindestens zwei Stellen (dürfte, deutet darauf hin, tendenziell)'
      - 'Strukturwörter: zunächst, des Weiteren, abschließend, demnach'
    selfCheck:
      - 'Wäge ich Pro und Kontra ab, bevor ich Stellung nehme?'
      - 'Sind die Konnektoren (zumal, sofern, insofern) korrekt verwendet?'
      - 'Federe ich starke Behauptungen mit Hedging ab?'
      - 'Bleibt der Text durchgehend sachlich, ohne Killerphrasen?'
      - 'Schließe ich mit einer klaren, aber begründeten Position?'
    model: |
      „Die Frage, ob Rhetorik ein eigenes Schulfach werden sollte, wird zunehmend diskutiert. Zunächst lässt sich für ein solches Fach einiges anführen. Wer frei sprechen kann, verschafft sich Gehör — das ist eine Frage der Chancengleichheit, zumal in Beruf und Gesellschaft mündliche Auftritte immer wichtiger werden. Des Weiteren deutet einiges darauf hin, dass strukturiertes Argumentieren auch das Denken schult. Andererseits ist der Einwand ernst zu nehmen, dass Technik allein wenig nützt, sofern man inhaltlich nichts zu sagen hat. Da ist zwar etwas dran, dennoch handelt es sich um keinen echten Gegensatz: Gerade weil der Inhalt zählt, muss man ihn vermitteln können. Insofern ergänzen sich Inhalt und Form. Man könnte einwenden, der Stundenplan sei ohnehin überfüllt; rhetorische Übungen ließen sich jedoch tendenziell in bestehende Fächer integrieren. Demnach spricht vieles dafür, das freie Reden zumindest fest zu verankern — ob als eigenes Fach oder als fester Bestandteil anderer Fächer, dürfte zweitrangig sein. Abschließend lässt sich festhalten, dass die Schule die Kunst der freien Rede nicht dem Zufall überlassen sollte."

