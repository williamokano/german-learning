          - { key: b, text: 'Könnten Sie das näher erläutern?' }
          - { key: c, text: 'Hä, was soll das?' }
        answer: b
        why: '„Könnten Sie das näher erläutern?" ist höflich und sachlich.'
      - q: 'Du willst einen Punkt nicht weiter vertiefen:'
        options:
          - { key: a, text: 'Das ist mir jetzt zu blöd.' }
          - { key: b, text: 'Da hab ich echt null Bock drauf.' }
          - { key: c, text: 'Diesen Punkt möchte ich nicht weiter vertiefen.' }
        answer: c
        why: 'Die dritte Variante bleibt im sachlichen Register.'
      - q: 'Du findest ein Argument schwach:'
        options:
          - { key: a, text: 'Dieses Argument überzeugt mich nicht ganz.' }
          - { key: b, text: 'Das ist doch total an den Haaren herbeigezogen.' }
          - { key: c, text: 'Was für ein Schwachsinn.' }
        answer: a
        why: '„überzeugt mich nicht ganz" ist diplomatisch und sachlich.'
      - q: 'Du widersprichst höflich:'
        options:
