      "4": gleichwohl
      "5": Einerseits
      "6": andererseits

  - id: B7
    block: B
    type: single-choice
    title: 'Korrekt moderieren und argumentieren'
    optionLayout: block
    instructions: 'Wähle die korrekte Form (a, b oder c).'
    items:
      - q: 'Welche höfliche Bitte ist grammatisch korrekt?'
        options:
          - { key: a, text: 'Ich würde Sie bitten, zu beginnen.' }
          - { key: b, text: 'Ich würde Sie bitten zu beginnen Sie.' }
          - { key: c, text: 'Ich würde Sie bitten, beginnen.' }
        answer: a
        why: '„bitten" + Komma + „zu"-Infinitiv: „Ich würde Sie bitten, zu beginnen."'
      - q: 'Welcher Satz nach „zwar" ist korrekt (Inversion)?'
        options:
          - { key: a, text: 'Zwar es ist präzise, aber schwer.' }
          - { key: b, text: 'Zwar ist es präzise, aber schwer.' }
          - { key: c, text: 'Zwar das ist präzise, aber schwer.' }
        answer: b
        why: 'Nach „zwar" steht das Verb an Position 2: „Zwar ist es …".'
      - q: 'Welcher Konnektor ist korrekt verwendet?'
        options:
          - { key: a, text: 'Forschung sollte zugänglich sein, zumal weil sie öffentlich finanziert wird.' }
          - { key: b, text: 'Forschung sollte zugänglich sein, zumal dass sie öffentlich finanziert wird.' }
          - { key: c, text: 'Forschung sollte zugänglich sein, zumal sie öffentlich finanziert wird.' }
        answer: c
        why: '„zumal" ersetzt „weil" — nicht beides zusammen, kein „dass".'
      - q: 'Welcher dass-Satz beim Einhaken ist korrekt?'
        options:
          - { key: a, text: 'Gestatten Sie, dass ich einhake.' }
          - { key: b, text: 'Gestatten Sie, dass ich einhaken.' }
          - { key: c, text: 'Gestatten Sie, dass ich einhaken tue.' }
        answer: a
        why: 'Im dass-Satz steht das Verb am Ende und wird konjugiert: „… dass ich einhake".'
      - q: 'Welche Korrelat-Verbindung ist korrekt?'
        options:
          - { key: a, text: 'nicht nur inhaltlich, aber auch rhetorisch' }
          - { key: b, text: 'nicht nur inhaltlich, sondern auch rhetorisch' }
          - { key: c, text: 'nicht nur inhaltlich, sowie auch rhetorisch' }
        answer: b
        why: 'Das Korrelat lautet „nicht nur … sondern auch".'

  - id: B8
    block: B
    type: free-write
    title: 'Einen Kurzvortrag planen'
    prompt: 'Plane einen Kurzvortrag (6–8 Sätze als ausformulierte Stichpunkte) zu einem Thema deiner Wahl. Skizziere eine Einleitung, drei Gliederungspunkte und einen Schluss. Baue mindestens eine rhetorische Frage und eine Dreierfigur ein.'
    stimulus: |
      Ausgangslage: Du sollst nächste Woche ein zehnminütiges Referat halten. Heute planst du den roten Faden — noch keinen ausformulierten Text, sondern die Struktur und die rhetorischen Höhepunkte.
    use:
      - 'Eine Einleitung mit einer rhetorischen Frage'
      - 'Drei Gliederungssignale (Zunächst …, anschließend …, abschließend …)'
      - 'Mindestens eine Dreierfigur (drei kurze Glieder)'
      - 'Einen Schluss mit Zusammenfassung und Dank'
    selfCheck:
      - 'Kündige ich am Anfang an, wie ich vorgehe (Gliederung)?'
      - 'Steht nach jedem vorangestellten Adverbiale das Verb an Position 2?'
      - 'Habe ich genau eine rhetorische Frage und eine Dreierfigur — nicht zu viele?'
      - 'Schließe ich mit einer Zusammenfassung und einem Dank?'
    model: |
      „Sehr geehrte Damen und Herren, wann haben Sie zuletzt einen Vortrag erlebt, der Sie wirklich gefesselt hat? Im Folgenden möchte ich zeigen, was gute Vorträge ausmacht. Zunächst betrachte ich, warum viele Vorträge langweilen. Anschließend stelle ich drei Mittel vor: eine klare Gliederung, bewusste Pausen und lebendige Beispiele. Abschließend ziehe ich ein Fazit. Gute Rede ist kein Vorlesen, sondern ein Gespräch — kurz, klar und lebendig. Zusammenfassend lässt sich sagen: Wer sein Publikum ernst nimmt, gewinnt es. Vielen Dank für Ihre Aufmerksamkeit."

  - id: B9
    block: B
    type: free-write
    title: 'Diplomatisch auf einen Forenbeitrag antworten'
    prompt: 'In einem Diskussionsforum provoziert jemand mit einer steilen These. Antworte sachlich und diplomatisch (5–6 Sätze): Räume zuerst etwas ein, widersprich dann begründet und ohne Killerphrasen.'
    stimulus: |
      Forenbeitrag von „RedeProfi98":
      „Rhetorik-Kurse sind doch reine Zeitverschwendung. Wer was zu sagen hat, sagt es einfach, und gut ist. Der ganze Quatsch mit Pausen und rhetorischen Fragen ist nur Show. Inhalt zählt, sonst nichts!"
    use:
      - 'Eine Konzession (einräumen: „Da ist etwas dran, …")'
      - 'Einen begründeten Widerspruch mit Konjunktiv II (würde, könnte, ließe)'
      - 'Mindestens einen Konnektor (dennoch, gleichwohl, zumal, einerseits … andererseits)'
      - 'Kein umgangssprachliches Wort und keine Killerphrase'
    selfCheck:
      - 'Räume ich zuerst etwas ein, bevor ich widerspreche?'
      - 'Ist mein Widerspruch begründet und mit Konjunktiv II abgefedert?'
      - 'Habe ich jede Killerphrase und jedes umgangssprachliche Wort vermieden?'
      - 'Bleibt mein Ton durchgehend sachlich?'
    model: |
      „Da ist durchaus etwas dran: Ohne guten Inhalt nützt die schönste Form nichts. Dennoch würde ich widersprechen, dass Rhetorik bloß Show sei. Auch ein starker Gedanke verpufft, wenn ihm niemand folgen kann. Pausen und eine klare Gliederung helfen dem Publikum, dem Inhalt überhaupt zu folgen — insofern dienen sie gerade der Sache. Man könnte einwenden, dass manche Redner die Form übertreiben; das spricht aber nicht gegen Rhetorik, sondern nur gegen ihren übermäßigen Einsatz. Form und Inhalt sind demnach keine Gegensätze, sondern ergänzen einander."

