      - "(1) Informelle Version: kurze Sätze, Umgangssprache, evtl. Interjektionen"
      - "(2) Formelle Version: mindestens 2× Konjunktiv II als Höflichkeitsform"
      - "(2) Formelle Version: mindestens 1 Funktionsverbgefüge (in Frage stellen, in Betracht ziehen, in Kauf nehmen)"
      - "(2) Formelle Version: Schlussformel mit „Mit freundlichen Grüßen“ oder ähnlich"
    selfCheck:
      - "Bleibt Version 1 konsequent informell (du, Modalpartikeln, kurze Sätze)?"
      - "Bleibt Version 2 konsequent formell (Sie, Konjunktiv, FVG, keine Modalpartikel)?"
      - "Wird in Version 1 eine Meinung klar vertreten (nicht neutral)?"
      - "Wird in Version 2 sachlich argumentiert (nicht belehrend)?"
    model: |
      (1) Informell: „Leute, was meint ihr — sollte man in der U-Bahn laute Musik verbieten? Ich sag mal: ja, unbedingt! Ich mein, ich fahr jeden Tag eine Stunde und will halt meine Ruhe haben. Klar, manche Leute hören gern Musik beim Fahren, das ist ja OK. Aber wenn der Sitznachbar dann noch laut mitsingt, geht mir das echt auf den Keks. Was meint ihr? Verbieten, oder einfach Kopfhörer vorschreiben?"
      (2) Formell: „Sehr geehrte Redaktion, ich möchte Sie höflich auf ein Thema aufmerksam machen, das viele Fahrgäste der Berliner Verkehrsbetriebe beschäftigt: das Verhalten einzelner Mitreisender beim Musikhören ohne Kopfhörer. Ich würde vorschlagen, dass die BVG in Betracht zieht, klare Regeln für die Nutzung von Audiogeräten in den Fahrzeugen einzuführen. Selbstverständlich wäre dabei die Verhältnismäßigkeit zu wahren — nicht jede Musikwiedergabe wäre zu unterbinden, sondern nur die unverhältnismäßig laute. Es wäre wünschenswert, wenn die Fahrgäste zu gegenseitiger Rücksichtnahme angehalten würden, etwa durch deutlich sichtbare Hinweise in den Fahrzeugen. Ich würde mich freuen, wenn die Redaktion dieses Thema aufgreifen könnte. Mit freundlichen Grüßen, Anna Becker."

