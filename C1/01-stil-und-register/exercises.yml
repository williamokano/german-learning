      (b) „Ich finde den Vorschlag nicht gut, weil er zu teuer ist."
      (c) „Ich würde den Vorschlag als nicht überzeugend bewerten, da er mit erheblichen Kosten verbunden wäre."
      (d) „Eine Bewertung des Vorschlags erscheint nicht als zielführend, da mit einer signifikanten Kostenintensität zu rechnen ist."

