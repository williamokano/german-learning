    prompt: "Verfasse **zwei** Versionen eines Forumsbeitrags (8–12 Sätze pro Version) zum gleichen Thema. (1) Eine informelle Version an ein Freundesforum (du, Modalpartikeln erlaubt, kurze Sätze). (2) Eine formelle Version an ein offizielles Beschwerdeforum (Sie, Konjunktiv II, vollständige Sätze). Thema: „Sollte in öffentlichen Verkehrsmitteln laute Musik verboten werden?“"
