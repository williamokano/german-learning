  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out"
    instructions: "Streiche das Wort, das nicht passt, und erkläre warum."
    groups:
      - items: [Umgangssprache, Standardsprache, Fachsprache, Jugendsprache]
        odd: 3
        why: "Jugendsprache ist keine eigene Stilebene im engeren Sinn, sondern eine Soziolekt; die anderen drei sind offizielle Registerebenen."
      - items: [halt, mal, schon, ausschließlich]
        odd: 3
        why: "ausschließlich ist keine Modalpartikel; die anderen drei sind."
      - items: [verstorben, Personalabbau, sich trennen, gestorben]
        odd: 3
        why: "gestorben ist direkt; die anderen drei sind Euphemismen."
      - items: ["würden", "möchten", "könnten", "sind"]
        odd: 3
        why: "sind ist Indikativ; die anderen drei sind Konjunktiv-II-Formen, die als Höflichkeitsmarker dienen."
      - items: [in Frage stellen, zur Verfügung stellen, in Kauf nehmen, ankommen]
        odd: 3
        why: "ankommen ist kein FVG (Funktionsverbgefüge); die anderen drei sind feste Verbindungen mit Funktionsverb."
      - items: [Ey, doch, halt, mal]
        odd: 0
        why: "Ey ist eine Interjektion (Anrede / Ausruf), keine Modalpartikel im engeren Sinn; die anderen drei sind Modalpartikeln."

