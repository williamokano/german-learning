  - id: B5
    block: B
    type: single-choice
    title: "Konjunktiv II: nur einer pro Satz"
    instructions: "Welche Sätze stapeln den Konjunktiv II (Registerfehler)? Wähle den Satz mit dem Fehler."
    items:
      - q: "(1) „Würden Sie das machen?“ (2) „Würden Sie das könnten machen?“"
        options:
          - { key: a, text: "Satz 1 ist falsch (Konjunktiv II ohne Hauptverb)." }
          - { key: b, text: "Satz 2 ist falsch (Konjunktiv II gestapelt: würden + könnten)." }
          - { key: c, text: "Beide Sätze sind korrekt." }
        answer: b
        why: "Konjunktiv II wird im Deutschen nicht gestapelt. „Würden + könnten“ zusammen in einem Satz ist falsch."
      - q: "(1) „Könnten Sie mir helfen?“ (2) „Würden Sie mir helfen können?“"
        options:
          - { key: a, text: "Satz 1 ist falsch (Konjunktiv II von können)." }
          - { key: b, text: "Satz 2 ist falsch (würden + Infinitiv mit Endstellung — korrekt, aber Konjunktiv II von „werden“ ist hier nicht nötig)." }
          - { key: c, text: "Beide Sätze sind korrekt." }
        answer: c
        why: "Beide Sätze sind korrekter Konjunktiv II: „könnten + Infinitiv“ oder „würden + Infinitiv“. Nur „würden + könnten“ wäre gestapelt."
      - q: "(1) „Ich würde sagen, dass die Ergebnisse vielversprechend sind.“ (2) „Ich würde Sie bitten, dass Sie das prüfen.“"
        options:
          - { key: a, text: "Satz 1 ist falsch (Konjunktiv + Indikativ im Nebensatz)." }
          - { key: b, text: "Satz 2 ist falsch (würde + bitten + Indikativ im Nebensatz — Mischung)." }
          - { key: c, text: "Beide Sätze sind korrekt." }
        answer: b
        why: "„Ich würde Sie bitten, das zu prüfen“ — der dass-Satz mit Indikativ ist eine Mischung aus Konjunktiv und Indikativ. Besser: „Ich bitte Sie, das zu prüfen“ (ohne würde) oder Infinitivkonstruktion."
      - q: "(1) „Würden Sie bitte Platz nehmen?“ (2) „Würden Sie bitte nehmen Platz?“"
        options:
          - { key: a, text: "Satz 1 ist falsch (Konjunktiv II von werden + Infinitiv)." }
          - { key: b, text: "Satz 2 ist falsch (Wortstellung: trennbares Verb nicht getrennt)." }
          - { key: c, text: "Beide Sätze sind korrekt." }
        answer: b
        why: "„Platz nehmen“ ist ein trennbares Verb und muss im Hauptsatz getrennt werden: „nehmen … Platz“."

