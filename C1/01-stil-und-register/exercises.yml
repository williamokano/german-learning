lesson: C1/01
title: "C1 · Lektion 1 — Übungen (Stil und Register)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell — Mittagspause)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Lukas findet den neuen Chef nach zwei Wochen immer noch schwer einzuschätzen."
        answer: true
        why: 'Lukas: „der ist jetzt zwei Wochen da — und ich kapier immer noch nicht, was der eigentlich will".'
      - q: "Mia verteidigt den neuen Chef ausdrücklich."
        answer: false
        why: 'Mia findet ihn „ganz okay" und „nett" — verteidigt ihn aber nicht ausdrücklich.'
      - q: "Tomáš findet, dass der neue Chef zu viele Schlagwörter benutzt."
        answer: true
        why: |-
          Tomáš sagt im Dialog, dass der neue Chef in Schlagworten wie „Brand purpose“ und „strategische Positionierung“ redet.
      - q: "Tomáš arbeitet in Prag und pendelt nur nach Berlin."
        answer: true
        why: 'Per Persona: Tomáš pendelt von Prag nach Berlin. Im Dialog: „In Prag sagt man das wenigstens gerade heraus".'
      - q: "Mia schlägt am Ende vor, noch einen Kaffee zu trinken."
        answer: true
        why: 'Mia: „Wer will noch Kaffee?".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell — Bewerbungsgespräch)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: "Welche Frage stellt Frau Hoffmann zu Beginn?"
        options:
          - { key: a, text: "Sie fragt nach dem Privatleben des Bewerbers." }
          - { key: b, text: "Sie bittet um eine kurze Selbsteinschätzung." }
          - { key: c, text: "Sie fragt nach dem Gehaltswunsch." }
        answer: b
        why: 'Frau Hoffmann: „möchte ich Sie um eine kurze Selbsteinschätzung bitten".'
      - q: "Was hebt der Bewerber als seine besondere Stärke hervor?"
        options:
          - { key: a, text: "Seine Promotion in Wirtschaftsinformatik." }
          - { key: b, text: "Komplexe Sachverhalte für Laien verständlich zu machen." }
          - { key: c, text: "Seine mehrjährige Erfahrung in der IT-Branche." }
        answer: b
        why: 'Tomáš: „meine Fähigkeit, komplexe Sachverhalte auch einem nicht fachkundigen Publikum zugänglich zu machen".'
      - q: "Welches Beispiel nennt der Bewerber für seine Übersetzungsleistung?"
        options:
          - { key: a, text: "Eine neue Software-Einführung." }
          - { key: b, text: "Eine Sanierung mit misstrauischer Belegschaft." }
          - { key: c, text: "Ein internationales M&A-Projekt." }
        answer: b
        why: 'Tomáš: „Sanierungsmandat … Restrukturierungsmaßnahmen … Belegschaft … Kommunikationsoffensive".'
      - q: "Welchen Punkt spricht Frau Hoffmann am Ende kritisch an?"
        options:
          - { key: a, text: "Die Sprachkenntnisse des Bewerbers." }
          - { key: b, text: "Die Vereinbarkeit von Promotion und Vollzeitstelle." }
          - { key: c, text: "Die fehlende Erfahrung im DACH-Raum." }
        answer: b
        why: 'Frau Hoffmann: „die Vereinbarkeit von Projektarbeit und akademischer Forschung. Sie haben ja Ihre Promotion noch nicht abgeschlossen".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Rede auf der Mitarbeiterversammlung"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Liebe Kolleginnen und Kollegen, ich freue mich, dass Sie so zahlreich {1} sind.
      Bevor ich auf die geplante Umstrukturierung unserer Buchhaltungsabteilung {2}
      komme, möchte ich zunächst einige Worte zum diesjährigen Geschäftsergebnis {3}.
      Das vergangene Jahr war, das kann man ohne {4} sagen, ein außerordentlich
      erfolgreiches Jahr. Der Umsatz konnte um elf Prozent {5} werden. Was die
      geplante Umstrukturierung {6}, so möchte ich Sie um Geduld und Offenheit bitten.
    bank: [erschienen, zu sprechen, verlieren, Übertreibung, gesteigert, anbelangt, erwähnt, geplant, gewachsen]
    answers:
      "1": erschienen
      "2": "zu sprechen"
      "3": verlieren
      "4": Übertreibung
      "5": gesteigert
      "6": anbelangt

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anrufbeantworter einer Behörde"
    audio: transcript_ansage1.mp3
    instructions: "Hör den Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    optionLayout: block
    transcript: 'Guten Tag, Sie haben die Bürgerinformation der Stadt München erreicht. Wir sind heute, am 27. Juni, leider nicht persönlich für Sie da. Aufgrund der aktuellen personellen Engpässe ist unsere telefonische Erreichbarkeit derzeit eingeschränkt. Bitte hinterlassen Sie Ihren Namen, Ihre Telefonnummer und Ihr Anliegen nach dem Signalton. Wir werden Ihr Anliegen schnellstmöglich bearbeiten. Für dringende Angelegenheiten wenden Sie sich bitte an die Hotline 089-12 34 56. Bitte rufen Sie mich zurück unter dieser Nummer. Vielen Dank für Ihr Verständnis.'
    items:
      - q: "Welche Einheit ist auf dem Anrufbeantworter zu hören?"
        options:
          - { key: a, text: "Eine Arztpraxis." }
          - { key: b, text: "Die Bürgerinformation der Stadt München." }
          - { key: c, text: "Eine Versicherungsgesellschaft." }
        answer: b
        why: '„Sie haben die Bürgerinformation der Stadt München erreicht".'
      - q: "Warum ist die telefonische Erreichbarkeit eingeschränkt?"
        options:
          - { key: a, text: "Wegen einer technischen Störung." }
          - { key: b, text: "Wegen personeller Engpässe." }
          - { key: c, text: "Wegen einer Betriebsversammlung." }
        answer: b
        why: '„Aufgrund der aktuellen personellen Engpässe ist unsere telefonische Erreichbarkeit derzeit eingeschränkt".'
      - q: "Welche Information soll der Anrufer hinterlassen?"
        options:
          - { key: a, text: "Sein Geburtsdatum und seine Adresse." }
          - { key: b, text: "Seinen Namen, seine Telefonnummer und sein Anliegen." }
          - { key: c, text: "Seine Versicherungsnummer." }
        answer: b
        why: '„Bitte hinterlassen Sie Ihren Namen, Ihre Telefonnummer und Ihr Anliegen".'
      - q: "Was sollen Anrufer bei dringenden Angelegenheiten tun?"
        options:
          - { key: a, text: "Eine E-Mail schreiben." }
          - { key: b, text: "Die Hotline 089-12 34 56 anrufen." }
          - { key: c, text: "Am nächsten Tag noch einmal anrufen." }
        answer: b
        why: '„Für dringende Angelegenheiten wenden Sie sich bitte an die Hotline 089-12 34 56".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: "Welches Register liegt vor?"
    instructions: "Wähle das passende Register (a, b, c oder d) für jeden Satz."
    items:
      - q: "Ey, hast du Bock auf nen Kaffee?"
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: a
        why: "Anrede du, Modalpartikel / Interjektion „Ey“, Verkürzung „nen“, „Bock“ — alle Marker umgangssprachlich."
      - q: "Könnten Sie mir bitte kurz das Salz reichen?"
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: c
        why: "Anrede Sie, Konjunktiv II „könnten“, Verb „reichen“, keine Modalpartikel — Register: gehoben."
      - q: "Hierzu kann keine valide Aussage getroffen werden."
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: d
        why: "„valid“, „eine Aussage kann getroffen werden“ — fachsprachliche Konstruktion mit nominalem Stil."
      - q: "Kannst du mir mal kurz helfen?"
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: b
        why: "Anrede du, Verb „helfen“, Modalpartikel „mal“ — standardsprachlich mit leichter umgangssprachlicher Färbung (korrekt aber alltagsnah)."
      - q: "Würden Sie mir die Ehre erweisen, mich auf eine Tasse Kaffee zu begleiten?"
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: c
        why: "Konjunktiv II „würden“, „die Ehre erweisen“, „begleiten“ — sehr gehoben, fast ironisch feierlich."
      - q: "Eine diesbezügliche Maßnahme erscheint nicht als zielführend."
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: d
        why: "„Maßnahme“, „erscheint nicht als zielführend“, „diesbezüglich“ — fachsprachlich."
      - q: "Ich finde das nicht so gut."
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: b
        why: "„Ich finde …“, standardsprachliches Verb „finden“ mit Verstärker „nicht so“ — neutral."
      - q: "Es gilt, eine als nicht ausgewogen zu bewertende Sachlage zu konstatieren."
        options:
          - { key: a, text: "Umgangssprachlich" }
          - { key: b, text: "Standardsprachlich" }
          - { key: c, text: "Gehoben" }
          - { key: d, text: "Fachsprachlich" }
        answer: d
        why: "„Sachlage konstatieren“, „als nicht ausgewogen zu bewertende“ — fachsprachlich-verdichtet, Passiv-Ersatz."

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Modalpartikeln einsetzen"
    instructions: "Setze die passende Modalpartikel ein (doch, mal, halt, eben, schon, ja, wohl). 8 Items."
    text: |
      1. „Komm {1} mit ins Kino!" (Aufforderung, bekräftigend)
      2. „Das ist {2} so." (Resignation, Begründung)
      3. „Schau {3} …" (Auflockerung, Einleitung)
      4. „Du weißt {4}, wie das ist." (gemeinsames Wissen)
      5. „Das stimmt {5}, aber …" (Zugeständnis, Einschränkung)
      6. „Es ist {6} nicht einfach." (Resignation)
      7. „Er wird {7} krank sein." (Vermutung)
      8. „Das geht {8}!" (Bekräftigung)
    answers:
      "1": doch
      "2": halt
      "3": mal
      "4": ja
      "5": schon
      "6": eben
      "7": wohl
      "8": doch

  - id: A3
    block: A
    type: matching
    title: "Registermarker zuordnen"
    instructions: "Ordne jedem Satz (1–6) das vorherrschende Register zu (a–f)."
    left:
      - { key: "1", text: "Ey, sag mal, hast du das gesehen?" }
      - { key: "2", text: "Würden Sie mir bitte die Unterlagen zukommen lassen?" }
      - { key: "3", text: "Hierzu liegen mir keine Informationen vor." }
      - { key: "4", text: "Es ist nicht so, dass ich das nicht will." }
      - { key: "5", text: "Da bin ich halt anderer Meinung." }
      - { key: "6", text: "Eine dahingehende Modifikation wäre anzustreben." }
    right:
      - { key: a, text: "Umgangssprachlich (Interjektion, Verkürzung)" }
      - { key: b, text: "Gehoben (Konjunktiv II, förmliche Bitte)" }
      - { key: c, text: "Fachsprachlich (Nominal, keine Person)" }
      - { key: d, text: "Untertreibung / vorsichtig" }
      - { key: e, text: "Umgangssprachlich (Modalpartikel halt)" }
      - { key: f, text: "Fachsprachlich (Kompositum, Passiv-Ersatz)" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Verbwahl: umgangssprachlich → standardsprachlich"
    instructions: "Ersetze das umgangssprachliche Verb durch das standardsprachliche / gehobene Verb. 8 Items."
    text: |
      1. Ich kriege morgen Post. → Ich {1} morgen Post.
      2. Was willst du essen? → Was möchtest du {2}?
      3. Er hat mein Auto geklaut. → Er hat mein Auto {3}.
      4. Hört auf zu labern! → Hört auf zu {4}!
      5. Wir müssen das ändern. → Wir müssen das {5} (gehoben).
      6. Sie knobelt seit Stunden. → Sie {6} seit Stunden.
      7. Wir lehnen den Antrag ab. → Eine {7} des Antrags erfolgt (Nominal).
      8. Das ist Quatsch. → Diese Aussage ist {8}.
    answers:
      "1": erhalte
      "2": frühstücken
      "3": gestohlen
      "4": reden
      "5": modifizieren
      "6": überlegt
      "7": Ablehnung
      "8": "nicht zutreffend"

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Konjunktiv II als Distanzmarker"
    instructions: "Forme die direkten Sätze in höfliche Bitten mit Konjunktiv II um. 6 Items."
    text: |
      1. „Haben Sie Zeit?" → „{1} Sie kurz Zeit?"
      2. „Können Sie das übersetzen?" → „{2} Sie das bitte übersetzen?"
      3. „Ich schlage vor, dass wir das verschieben." → „Ich {3} vorschlagen, dass wir das verschieben."
      4. „Darf ich Sie unterbrechen?" → „{4} ich Sie kurz unterbrechen?"
      5. „Geben Sie mir das bitte." → „{5} Sie mir das bitte geben?"
      6. „Sind Sie damit einverstanden?" → „{6} Sie damit einverstanden?"
    answers:
      "1": Hätten
      "2": Könnten
      "3": würde
      "4": Dürfte
      "5": Würden
      "6": Wären

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "FVG statt einfachem Verb"
    instructions: "Ersetze das einfache Verb durch das passende Funktionsverbgefüge (Infinitiv). 6 Items."
    text: |
      1. Wir müssen das bezweifeln. → Wir müssen das in Frage {1}.
      2. Ich werde das übergeben. → Ich werde das zur Verfügung {2}.
      3. Wir akzeptieren das Risiko. → Wir {3} das Risiko in Kauf.
      4. Das ist wichtig. → Das {4} eine wichtige Rolle.
      5. Wir entscheiden morgen. → Wir {5} morgen eine Entscheidung.
      6. Wir werden das ansprechen. → Wir werden das zur Sprache {6}.
    answers:
      "1": stellen
      "2": stellen
      "3": nehmen
      "4": spielt
      "5": treffen
      "6": bringen

  - id: A7
    block: A
    type: gap-bank
    title: "Register-Umformung: umgangssprachlich → standardsprachlich"
    instructions: "Forme die umgangssprachlichen Sätze in standardsprachliche um. Drei Satzteile sind zu viel."
    text: |
      1. {1} (Er hat das nicht gemacht.)
      2. {2} (Ich krieg das nicht hin.)
      3. {3} (Das ist Quatsch.)
      4. {4} (Die Firma hat 500 Leute gefeuert.)
      5. {5} (Kannst du mir mal helfen?)
    bank:
      - "Er hat das nicht getan."
      - "Es gelingt mir nicht."
      - "Diese Aussage ist nicht zutreffend."
      - "Das Unternehmen hat 500 Mitarbeitende freigestellt."
      - "Könntest du mir bitte helfen?"
      - "Er hat das nicht gemacht."
      - "Ich bekomme das nicht hin."
      - "Das stimmt nicht."
    answers:
      "1": "Er hat das nicht getan."
      "2": "Es gelingt mir nicht."
      "3": "Diese Aussage ist nicht zutreffend."
      "4": "Das Unternehmen hat 500 Mitarbeitende freigestellt."
      "5": "Könntest du mir bitte helfen?"

  - id: A8
    block: A
    type: single-choice
    title: "Registerbruch erkennen"
    instructions: "Welcher Satz hat einen Registerbruch? Wähle (a) für den ersten Satz, (b) für den zweiten Satz, (c) wenn beide korrekt sind."
    items:
      - q: "(1) „Könnten Sie mir mal kurz das Salz reichen?“ (2) „Würden Sie mir bitte das Salz reichen?“"
        options:
          - { key: a, text: "Satz 1 hat einen Registerbruch (Konjunktiv II + Modalpartikel mal)." }
          - { key: b, text: "Satz 2 hat einen Registerbruch (Konjunktiv II + Bitte)." }
          - { key: c, text: "Beide Sätze sind registerkonform." }
        answer: a
        why: "Satz 1 mischt Konjunktiv II (gehoben) mit Modalpartikel „mal“ (umgangssprachlich). Satz 2 bleibt durchgehend im gehobenen Register."
      - q: "(1) „Sehr geehrte Frau Weber, ich wollte dich mal was fragen.“ (2) „Sehr geehrte Frau Weber, ich möchte Sie um eine Auskunft bitten.“"
        options:
          - { key: a, text: "Satz 1 hat einen Registerbruch (förmliche Anrede + du + Modalpartikel)." }
          - { key: b, text: "Satz 2 hat einen Registerbruch (förmliche Anrede + Konjunktiv)." }
          - { key: c, text: "Beide Sätze sind registerkonform." }
        answer: a
        why: "Satz 1 mischt „Sehr geehrte“ + Pronomen „dich“ + „mal“ — drei Registerbrüche. Satz 2 ist registerkonform."
      - q: "(1) „Ich würde sagen, das ist halt Quatsch.“ (2) „Ich würde sagen, das ist nicht ganz zutreffend.“"
        options:
          - { key: a, text: "Satz 1 hat einen Registerbruch (Konjunktiv II + Modalpartikel halt)." }
          - { key: b, text: "Satz 2 hat einen Registerbruch (Konjunktiv II + Untertreibung)." }
          - { key: c, text: "Beide Sätze sind registerkonform." }
        answer: a
        why: "Satz 1: Konjunktiv II „würde“ ist gehoben, „halt“ + „Quatsch“ sind umgangssprachlich. Satz 2 bleibt im gehobenen Register."
      - q: "(1) „Er ist gestorben.“ (in einer Todesanzeige) (2) „Er ist verstorben.“ (in einer Todesanzeige)"
        options:
          - { key: a, text: "Satz 1 hat einen Registerbruch (direkt im Trauerkontext)." }
          - { key: b, text: "Satz 2 hat einen Registerbruch (Euphemismus)." }
          - { key: c, text: "Beide Sätze sind registerkonform." }
        answer: a
        why: "In einer Todesanzeige ist „verstorben“ das erwartete Register; „gestorben“ wirkt dort direkt und unangemessen."
      - q: "(1) „Lass das!“ (in einer WhatsApp an den Partner) (2) „Ich möchte Sie bitten, das zu unterlassen.“ (in einer WhatsApp an den Partner)"
        options:
          - { key: a, text: "Satz 1 hat einen Registerbruch (zu direkt)." }
          - { key: b, text: "Satz 2 hat einen Registerbruch (zu förmlich)." }
          - { key: c, text: "Beide Sätze sind registerkonform." }
        answer: b
        why: "In einer WhatsApp unter Partnern ist „Ich möchte Sie bitten, das zu unterlassen“ zu förmlich — Register passt nicht zur Messenger-Form und zur Du-Anrede."

  - id: A9
    block: A
    type: odd-one-out
    title: "Wortschatz-Check: Welches Wort passt nicht zum Register?"
    instructions: "Streiche das Wort, das nicht in dieselbe Stilebene passt, und erkläre warum."
    groups:
      - items: [erhalten, frühstücken, klauen, einreichen]
        odd: 2
        why: "klauen ist umgangssprachlich (stehlen); die anderen drei sind standardsprachlich bis gehoben."
      - items: [bezweifeln, in Frage stellen, labern, überlegen]
        odd: 2
        why: "labern ist umgangssprachlich; die anderen drei sind standardsprachlich bis gehoben."
      - items: ["zielführend", "valid", "evident", "mega"]
        odd: 3
        why: "mega ist umgangssprachlich (Jugendsprache); die anderen drei sind fachsprachlich."
      - items: [Euphemismus, Hyperbel, Untertreibung, Modalpartikel]
        odd: 3
        why: "Modalpartikel ist eine Wortart; die anderen drei sind Registerstrategien / Stilfiguren."
      - items: [erhalten, bekommen, kriegen, zugestellt bekommen]
        odd: 2
        why: "kriegen ist umgangssprachlich markiert; die anderen drei sind standardsprachlich bis gehoben."

  - id: A10
    block: A
    type: order
    title: "Satzbau: Registeraufbau (Modalpartikel-Position)"
    instructions: "Bring die Wörter in die richtige Reihenfolge. Die Modalpartikel steht typischerweise nach dem finiten Verb oder vor dem Satzende."
    items:
      - tiles: [Komm, doch, mal, mit, ins, Kino]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Komm doch mal mit ins Kino"
      - tiles: [Das, ist, halt, nicht, so, einfach]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Das ist halt nicht so einfach"
      - tiles: [Du, weißt, ja, wie, das, ist]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Du weißt ja, wie das ist"
      - tiles: [Er, wird, wohl, krank, sein]
        answer: [0, 1, 2, 3, 4]
        note: "Er wird wohl krank sein"

  # ── Block B — Vertiefung ─────────────────────────────────────────────────

  - id: B1
    block: B
    type: free-write
    title: "Register-Umformung in vier Stilebenen"
    prompt: "Schreib den folgenden Satz in vier Registern: (a) umgangssprachlich, (b) standardsprachlich, (c) gehoben, (d) fachsprachlich."
    stimulus: "Satz: „Ich finde den Vorschlag nicht gut, weil er zu teuer ist.“ (8–12 Sätze insgesamt)"
    use:
      - "(a) Variante mit Modalpartikel (halt, mal, doch) und kurzem Verb"
      - "(b) Variante standardsprachlich ohne Modalpartikel"
      - "(c) Variante gehoben mit Konjunktiv II oder FVG"
      - "(d) Variante fachsprachlich mit Nominalstil + Passiv-Ersatz"
    selfCheck:
      - "Bleibt jede Variante konsequent auf ihrer Stilebene?"
      - "Sind alle fünf Registermarker (Anrede, Verb, Modalpartikel, Satzbau, Wortschatz) konsistent?"
      - "Wird in Variante (c) der Konjunktiv II korrekt gebildet (nicht gestapelt)?"
      - "Wird in Variante (d) nominalisiert und ggf. Passiv verwendet?"
    model: |
