# Reviewed from B2/07 lesson.md §4 Wortschatz.
# Note: this lesson's tables mix nouns, verbs, AND multi-word connector phrases in
# the same cells (e.g. "voraussetzen / sofern" — a real verb plus an unrelated
# connector, slash-joined). Rather than force the table parser's noun-verb-pair kind
# onto this irregular shape, every entry was hand-derived from the source markdown,
# splitting each row into its distinct lexical items. Table 3 (register/style
# variants: obgleich vs. obwohl) is genuinely reference material about STYLE, but
# the words themselves ARE core B2 vocabulary the lesson explicitly teaches, so
# they're included (unlike A1/12's weekday table, which was pure metadata).
#
# Section headers in lesson.md:
#   Argumentation und Logik (logic relation nouns + their connectors)  — 6 nouns +
#     1 verb (voraussetzen) + 8 connectors + 2 phrase chunks
#   Verben für Planung und Diskussion (planning verbs, mostly separable) — 6 verbs
#     (voraussetzen deduped against table 1)
#   Konzessiv-Wortschatz (gehobener Stil) — 6 formal concessive-connector synonyms
lesson: B2/07

