lesson: B2/07
title: "B2 · Lektion 7 — Übungen (Konnektoren für Profis)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna findet, dass sie immer langsamer vorankommt, je länger sie lernt."
        answer: true
        why: 'Anna: „Je länger ich lerne, desto langsamer komme ich voran".'
      - q: "Bruno sagt, man lerne eine Sprache vor allem durch Vokabellisten."
        answer: false
        why: 'Bruno: „Man lernt eine Sprache, indem man sie benutzt, nicht indem man Listen auswendig lernt".'
      - q: "Anna will am Sprachabend nur sprechen, ohne Deutschbuch."
        answer: true
        why: 'Anna: „Nur sprechen, kein Deutschbuch".'
      - q: "Bruno will kleine Gruppen, sodass niemand nur zuhört."
        answer: true
        why: 'Bruno: „Wir machen kleine Gruppen, sodass niemand nur zuhört".'
      - q: "Bruno sagt den Sprachabend ab, weil er müde ist."
        answer: false
        why: 'Bruno: „Zwar bin ich müde, aber für so einen Abend nehme ich mir die Zeit".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: "Was sagt Frau Yilmaz über den Zeitplan?"
        options:
          - { key: a, text: "Je früher der Bericht fertig ist, desto mehr Zeit bleibt für die Korrektur." }
          - { key: b, text: "Der Zeitplan ist großzügig." }
          - { key: c, text: "Es bleibt keine Zeit für eine Korrektur." }
        answer: a
        why: 'Frau Yilmaz: „Je früher wir den Bericht fertigstellen, desto mehr Zeit bleibt für die Korrektur".'
      - q: "Wie wollen sie den Prozess beschleunigen?"
        options:
          - { key: a, text: "Indem sie die Datenanalyse parallel zur Texterstellung laufen lassen." }
          - { key: b, text: "Indem sie mehr Mitarbeiter einstellen." }
          - { key: c, text: "Indem sie die Korrektur weglassen." }
        answer: a
        why: 'Frau Yilmaz: „Wir können den Prozess beschleunigen, indem wir die Datenanalyse parallel zur Texterstellung laufen lassen".'
      - q: "Warum will Herr Steinmeyer einen Puffer einplanen?"
        options:
          - { key: a, text: "Damit der Bericht länger wird." }
          - { key: b, text: "Sodass sie bei Problemen nicht in Verzug geraten." }
          - { key: c, text: "Weil der Termin nicht wichtig ist." }
        answer: b
        why: 'Herr Steinmeyer: „Wir sollten aber einen Puffer einplanen, sodass wir bei Problemen nicht in Verzug geraten".'
      - q: "Unter welcher Bedingung liefern sie nicht am Freitag?"
        options:
          - { key: a, text: "Wenn die Leitung es so will." }
          - { key: b, text: "Es sei denn, es treten unvorhergesehene Probleme auf." }
          - { key: c, text: "Sie liefern auf jeden Fall am Freitag." }
        answer: b
        why: 'Frau Yilmaz: „Wir liefern also Freitag — es sei denn, es treten unvorhergesehene Probleme auf".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Durchsage zum Sprachcafé"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Liebe Teilnehmerinnen und Teilnehmer, herzlich willkommen zu unserem Sprachcafé.
      Eine kurze Information vorab: {1} mehr Sie heute sprechen, {2} mehr profitieren Sie
      von diesem Abend. Wir bilden gleich kleine Gruppen, {3} wirklich jeder zu Wort kommt.
      Sie verbessern Ihr Deutsch am besten, {4} Sie einfach reden und keine Angst vor Fehlern
      haben. {5} Ihnen ein Wort fehlt, fragen Sie ruhig die anderen. Wir bleiben übrigens bis
      zweiundzwanzig Uhr zusammen, {6}, die Gruppe möchte früher Schluss machen.
      Trotz des vollen Raumes ist für alle ein Platz da. Wir wünschen Ihnen einen schönen Abend.
    bank: [Je, desto, sodass, indem, Falls, "es sei denn", obwohl, weil, sofern]
    answers:
      "1": Je
      "2": desto
      "3": sodass
      "4": indem
      "5": Falls
      "6": "es sei denn"

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage im Sprachzentrum"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    optionLayout: block
    transcript: 'Achtung, eine Durchsage für alle Kursteilnehmer. Der Konversationskurs am Donnerstag fällt heute leider aus, es sei denn, genügend Personen melden sich noch bis vierzehn Uhr an. Je früher Sie sich entscheiden, desto besser können wir planen. Sie können sich anmelden, indem Sie kurz im Sekretariat Bescheid geben. Trotz des Ausfalls bleibt die Bibliothek für alle geöffnet. Sofern Sie Fragen haben, wenden Sie sich bitte an das Sekretariat im ersten Stock. Vielen Dank.'
    items:
      - q: "Was passiert mit dem Konversationskurs am Donnerstag?"
        options:
          - { key: a, text: "Er fällt aus, wenn sich nicht genug Leute anmelden." }
          - { key: b, text: "Er findet auf jeden Fall statt." }
          - { key: c, text: "Er wird auf nächste Woche verschoben." }
        answer: a
        why: '„Der Konversationskurs … fällt heute leider aus, es sei denn, genügend Personen melden sich noch … an".'
      - q: "Warum soll man sich früh entscheiden?"
        options:
          - { key: a, text: "Weil der Kurs teurer wird." }
          - { key: b, text: "Je früher man sich entscheidet, desto besser kann das Zentrum planen." }
          - { key: c, text: "Weil danach niemand mehr da ist." }
        answer: b
        why: '„Je früher Sie sich entscheiden, desto besser können wir planen".'
      - q: "Wie meldet man sich an?"
        options:
          - { key: a, text: "Indem man im Sekretariat Bescheid gibt." }
          - { key: b, text: "Indem man eine E-Mail schreibt." }
          - { key: c, text: "Indem man anruft." }
        answer: a
        why: '„Sie können sich anmelden, indem Sie kurz im Sekretariat Bescheid geben".'
      - q: "Was gilt trotz des Ausfalls?"
        options:
          - { key: a, text: "Die Bibliothek bleibt geöffnet." }
          - { key: b, text: "Das ganze Zentrum bleibt geschlossen." }
          - { key: c, text: "Alle Kurse fallen aus." }
        answer: a
        why: '„Trotz des Ausfalls bleibt die Bibliothek für alle geöffnet".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "je … desto: Komparativ einsetzen"
    instructions: "Setz den Komparativ des Adjektivs in Klammern ein. 8 Items."
    text: |
      1. Je mehr du übst, desto {1} (gut) wirst du.
      2. Je länger ich lerne, desto {2} (langsam) komme ich voran.
      3. Je höher das Niveau wird, desto {3} (klein) werden die Fortschritte.
      4. Je mehr Leute kommen, umso {4} (lebendig) wird der Abend.
      5. Je früher wir anfangen, desto {5} (viel) Zeit bleibt uns.
      6. Je öfter man spricht, desto {6} (sicher) fühlt man sich.
      7. Je weniger ich schlafe, desto {7} (unkonzentriert) bin ich.
      8. Je kürzer der Text ist, desto {8} (klar) ist er.
    answers:
      "1": besser
      "2": langsamer
      "3": kleiner
      "4": lebendiger
      "5": mehr
      "6": sicherer
      "7": unkonzentrierter
      "8": klarer

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "je … desto: Verbposition vervollständigen"
    instructions: "Setz das Verb aus der Klammer an die richtige Stelle. ⚠️ je-Teil: Verb am Ende; desto-Teil: Verb direkt nach dem Komparativ. 6 Items."
    text: |
      1. Je mehr Kaffee ich trinke, desto schlechter {1} (schlafen) ich.
      2. Je genauer die Daten vorliegen, umso schneller {2} (arbeiten) wir.
      3. Je schwieriger die Aufgabe {3} (sein), desto wichtiger wird die Vorbereitung.
      4. Je klarer die Aufgaben aufgeteilt sind, desto weniger Konflikte {4} (geben) es.
      5. Je länger der Abend {5} (dauern), desto entspannter wurde die Stimmung.
      6. Je mehr man liest, desto größer {6} (werden) der Wortschatz.
    answers:
      "1": schlafe
      "2": arbeiten
      "3": ist
      "4": gibt
      "5": dauerte
      "6": wird

  - id: A3
    block: A
    type: single-choice
    title: "indem oder sodass?"
    instructions: "Wähle den passenden Konnektor (a, b oder c)."
    items:
      - q: "Man lernt eine Sprache, ____ man sie benutzt. (Mittel)"
        options:
          - { key: a, text: "indem" }
          - { key: b, text: "sodass" }
          - { key: c, text: "obwohl" }
        answer: a
        why: "Mittel/Methode (Wie?) → indem."
      - q: "Die Gruppen sind klein, ____ jeder zu Wort kommt. (Folge)"
        options:
          - { key: a, text: "indem" }
          - { key: b, text: "sodass" }
          - { key: c, text: "falls" }
        answer: b
        why: "Folge/Ergebnis (Was folgt daraus?) → sodass."
      - q: "Wir sparen Zeit, ____ wir die Aufgaben klar aufteilen. (Mittel)"
        options:
          - { key: a, text: "sodass" }
          - { key: b, text: "indem" }
          - { key: c, text: "sofern" }
        answer: b
        why: "Mittel → indem."
      - q: "Der Termin ist eng, ____ wir sofort anfangen müssen. (Folge)"
        options:
          - { key: a, text: "indem" }
          - { key: b, text: "sodass" }
          - { key: c, text: "zwar" }
        answer: b
        why: "Folge → sodass."
      - q: "Sie verbesserte ihr Deutsch, ____ sie jeden Tag las. (Mittel)"
        options:
          - { key: a, text: "indem" }
          - { key: b, text: "sodass" }
          - { key: c, text: "obwohl" }
        answer: a
        why: "Mittel → indem."
      - q: "Es war ____ kalt, dass niemand rausgehen wollte."
        options:
          - { key: a, text: "sodass" }
          - { key: b, text: "so" }
          - { key: c, text: "indem" }
        answer: b
        why: "Bei „… Adjektiv …, dass“ steht im Hauptsatz „so“ + Adjektiv (so … dass), nicht „sodass“."

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "indem / sodass: Verb am Ende"
    instructions: "Setz das Verb aus der Klammer ans Ende des Nebensatzes. 6 Items."
    text: |
      1. Wir beschleunigen den Prozess, indem wir parallel {1} (arbeiten).
      2. Man verbessert die Aussprache, indem man laut {2} (lesen).
      3. Wir planen einen Puffer ein, sodass wir nicht in Verzug {3} (geraten).
      4. Es regnete stark, sodass wir zu Hause {4} (bleiben — Präteritum).
      5. Du sparst Zeit, indem du die Aufgaben klar {5} (aufteilen).
      6. Sie erklärte es so gut, dass alle es {6} (verstehen — Präteritum).
    answers:
      "1": arbeiten
      "2": liest
      "3": geraten
      "4": blieben
      "5": aufteilst
      "6": verstanden

  - id: A5
    block: A
    type: single-choice
    title: "falls, sofern oder es sei denn?"
    instructions: "Wähle den passenden Konnektor (a, b oder c)."
    items:
      - q: "____ zu viele Leute kommen, teilen wir auf. (Bedingung)"
        options:
          - { key: a, text: "Falls" }
          - { key: b, text: "Es sei denn" }
          - { key: c, text: "Sodass" }
        answer: a
        why: "Sachliche Bedingung am Satzanfang → Falls (= wenn)."
      - q: "____ Mia ihr Wohnzimmer anbietet, haben wir genug Platz. (vorausgesetzt, dass)"
        options:
          - { key: a, text: "Es sei denn" }
          - { key: b, text: "Sofern" }
          - { key: c, text: "Indem" }
        answer: b
        why: "„vorausgesetzt, dass“ → sofern."
      - q: "Wir gehen spazieren, ____, es regnet. (einzige Ausnahme)"
        options:
          - { key: a, text: "falls" }
          - { key: b, text: "sofern" }
          - { key: c, text: "es sei denn" }
        answer: c
        why: "Einzige Ausnahme (= außer wenn) → es sei denn."
      - q: "Du bekommst das Zertifikat, ____ du die Prüfung bestehst. (Bedingung, formell)"
        options:
          - { key: a, text: "sofern" }
          - { key: b, text: "es sei denn" }
          - { key: c, text: "sodass" }
        answer: a
        why: "Bedingung „unter der Voraussetzung, dass“ → sofern."
      - q: "Ich komme mit, ____, ich muss länger arbeiten. (Ausnahme)"
        options:
          - { key: a, text: "falls" }
          - { key: b, text: "es sei denn" }
          - { key: c, text: "sofern" }
        answer: b
        why: "Ausnahme → es sei denn."

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Bedingung: Verbposition"
    instructions: "Setz das Verb aus der Klammer an die richtige Stelle. ⚠️ falls/sofern: Verb am Ende; nach „es sei denn“ ohne „dass“: Verb in Position 2. 6 Items."
    text: |
      1. Falls die Daten rechtzeitig {1} (vorliegen), schaffen wir es bis Freitag.
      2. Sofern keine Änderungen mehr {2} (kommen), reicht eine Korrekturschleife.
      3. Du darfst den Wagen nehmen, sofern du vorsichtig {3} (fahren).
      4. Wir liefern Freitag, es sei denn, es {4} (auftreten — Präsens) Probleme auf.
      5. Ich rufe dich an, falls sich etwas {5} (ändern).
      6. Niemand sieht ins Buch, es sei denn, dass jemand schnell ein Wort {6} (brauchen).
    answers:
      "1": vorliegen
      "2": kommen
      "3": fährst
      "4": treten
      "5": ändert
      "6": braucht

  - id: A7
    block: A
    type: single-choice
    title: "Konzessiv: welche Klasse, welche Wortstellung?"
    instructions: "Wähle die korrekte Form (a, b oder c)."
    items:
      - q: "____ der Termin ehrgeizig ist, halte ich ihn für realistisch. (Nebensatz, Verb am Ende)"
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Trotzdem" }
          - { key: c, text: "Dennoch" }
        answer: a
        why: "Nebensatz mit Verb am Ende braucht eine Subjunktion → obwohl."
      - q: "Der Termin ist ehrgeizig. ____ halte ich ihn für realistisch. (Hauptsatz, Inversion)"
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Trotzdem" }
          - { key: c, text: "Weil" }
        answer: b
        why: "Position 1 im Hauptsatz + Inversion → Konjunktionaladverb trotzdem."
      - q: "____ bin ich müde, aber für diesen Abend nehme ich mir Zeit."
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Zwar" }
          - { key: c, text: "Trotz" }
        answer: b
        why: "Korrelat-Paar zwar … aber."
      - q: "____ des Zeitdrucks vernachlässigen wir die Qualität nicht. (+ Genitiv)"
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Trotzdem" }
          - { key: c, text: "Trotz" }
        answer: c
        why: "Vor einem Nomen im Genitiv (des Zeitdrucks) → Präposition trotz."
      - q: "____ er müde war, kam er zum Sprachabend. (gehoben, = obwohl)"
        options:
          - { key: a, text: "Wenngleich" }
          - { key: b, text: "Dennoch" }
          - { key: c, text: "Gleichwohl" }
        answer: a
        why: "Subjunktion (Nebensatz, Verb am Ende), gehobene Variante von obwohl → wenngleich."

  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "Konzessiv: Verbposition"
    instructions: "Setz das Verb aus der Klammer an die richtige Stelle. ⚠️ obwohl/obgleich/wenngleich: Verb am Ende; trotzdem/dennoch/gleichwohl in Position 1: Inversion. 6 Items."
    text: |
      1. Obwohl der Termin ehrgeizig {1} (sein), halte ich ihn für realistisch.
      2. Obgleich die Kosten stiegen, {2} (machen — Präteritum) die Firma Gewinn.
      3. Wir müssen schnell arbeiten. Dennoch {3} (dürfen) die Qualität nicht leiden.
      4. Die Aufgabe war schwer. Gleichwohl {4} (lösen — Präteritum) sie alle Teilnehmer.
      5. Wenngleich er müde war, {5} (kommen — Präteritum) er zum Sprachabend.
      6. Der Termin ist ehrgeizig. Trotzdem {6} (halten) ich ihn für realistisch.
    answers:
      "1": ist
      "2": machte
      "3": darf
      "4": lösten
      "5": kam
      "6": halte

  - id: A9
    block: A
    type: matching
    title: "Konnektor und logische Beziehung verbinden"
    instructions: "Ordne jedem Konnektor (1–6) die passende Funktion (a–f) zu."
    left:
      - { key: "1", text: "indem" }
      - { key: "2", text: "sodass" }
      - { key: "3", text: "je … desto" }
      - { key: "4", text: "falls / sofern" }
      - { key: "5", text: "es sei denn" }
      - { key: "6", text: "obwohl" }
    right:
      - { key: a, text: "Folge / Ergebnis" }
      - { key: b, text: "Mittel / Methode" }
      - { key: c, text: "Konzession (Gegensatz trotz Erwartung)" }
      - { key: d, text: "einzige Ausnahme (= außer wenn)" }
      - { key: e, text: "Proportionalität (zwei Größen wachsen zusammen)" }
      - { key: f, text: "Bedingung" }
    answers:
      "1": b
      "2": a
      "3": e
      "4": f
      "5": d
      "6": c

  - id: A10
    block: A
    type: categorize
    title: "Welche Konnektor-Klasse?"
    instructions: "Ordne jeden Konnektor seiner Wortstellungs-Klasse zu."
    buckets:
      - { key: subjunktion, label: "Subjunktion (Verb am Ende)" }
      - { key: adverb, label: "Konjunktionaladverb (Inversion)" }
      - { key: konjunktion, label: "Koordinierende Konjunktion (Position 0)" }
    tokens:
      - { text: "obwohl", bucket: subjunktion }
      - { text: "indem", bucket: subjunktion }
      - { text: "sodass", bucket: subjunktion }
      - { text: "falls", bucket: subjunktion }
      - { text: "sofern", bucket: subjunktion }
      - { text: "trotzdem", bucket: adverb }
      - { text: "dennoch", bucket: adverb }
      - { text: "gleichwohl", bucket: adverb }
      - { text: "aber", bucket: konjunktion }
      - { text: "denn", bucket: konjunktion }

  - id: A11
    block: A
    type: order
    title: "Satzbau: je … desto richtig stellen"
    instructions: "Bring die Wörter in die richtige Reihenfolge. ⚠️ je-Teil: Verb am Ende; desto-Teil: Verb direkt nach dem Komparativ."
    items:
      - tiles: [Je, mehr, du, übst, desto, besser, wirst, du]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Je mehr du übst, desto besser wirst du"
      - tiles: [Je, länger, ich, lerne, desto, langsamer, komme, ich, voran]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Je länger ich lerne, desto langsamer komme ich voran"
      - tiles: [Je, mehr, Leute, kommen, umso, lebendiger, wird, der, Abend]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Je mehr Leute kommen, umso lebendiger wird der Abend"
      - tiles: [Je, kürzer, der, Text, ist, desto, klarer, ist, er]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Je kürzer der Text ist, desto klarer ist er"

  - id: A12
    block: A
    type: order
    title: "Satzbau: Konnektor-Nebensatz und Hauptsatz"
    instructions: "Bring die Wörter in die richtige Reihenfolge. Im Nebensatz steht das Verb am Ende; nach einem Adverb in Position 1 folgt Inversion."
    items:
      - tiles: [indem, man, eine, Sprache, benutzt]
        answer: [0, 1, 2, 3, 4]
        note: "indem man eine Sprache benutzt"
      - tiles: [sodass, jeder, zu, Wort, kommt]
        answer: [0, 1, 2, 3, 4]
        note: "sodass jeder zu Wort kommt"
      - tiles: [Falls, zu, viele, Leute, kommen, teilen, wir, auf]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Falls zu viele Leute kommen, teilen wir auf"
      - tiles: [Trotzdem, halte, ich, ihn, für, realistisch]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Trotzdem halte ich ihn für realistisch"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: free-write
    title: "Sätze verbinden: je … desto"
    prompt: "Verbinde die beiden Aussagen zu einem je … desto-Satz."
    stimulus: |
      1. Ich trinke viel Kaffee. + Ich schlafe schlecht.
      2. Der Text ist kurz. + Er ist klar.
      3. Man übt oft. + Man wird sicher.
      4. Die Gruppe ist groß. + Der Abend ist lebendig.
      5. Wir fangen früh an. + Wir haben viel Zeit.
      6. Das Niveau ist hoch. + Die Fortschritte sind klein.
    model: |
