# Reviewed from B2/09 lesson.md §4 Wortschatz.
# Note: tables 1+2 (Vorsilben/Präfixe, Nachsilben/Suffixe) are morphology reference
# material, not headword vocabulary — the lesson teaches the PATTERN each affix
# carries (ver- = change, zer- = separation, -ung = verbal noun, -bar = possibility),
# not a closed list of specific words to memorize. Same convention as A1/12's
# excluded weekday table and B1/11's excluded CV-section-names table. The affix
# tables' own "Beispiele" columns list ~74 real German words, but these are
# illustrations of the pattern (mostly already-known basics: verändern, bezahlen,
# erlauben, Erfahrung, ...), not this lesson's new vocabulary target. Table 3 (Nomen
# mit fester Form) IS standard vocabulary — the terminology for talking ABOUT word
# formation — and is fully included below.
#
# Section headers in lesson.md:
#   Die wichtigsten Vorsilben (Präfixe)   — EXCLUDED (morphology reference)
#   Wichtige Nachsilben (Suffixe)          — EXCLUDED (morphology reference)
#   Nomen mit fester Form (Artikel + Plural) — 14 nouns (all included)
