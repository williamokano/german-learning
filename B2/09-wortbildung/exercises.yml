  - id: B9
    block: B
    type: free-write
    title: "Forenbeitrag: Mein Trick beim Vokabellernen"
    prompt: 'Schreib einen kurzen Forenbeitrag (5–6 Sätze) als Antwort auf den Beitrag unten. Erklär deinen eigenen Trick, wie du dir lange oder neue deutsche Wörter merkst oder erschließt.'
    stimulus: |
      **Forenbeitrag** von Lernfuchs88:
      > Hallo zusammen! Ich verzweifle an den langen deutschen Wörtern. Jedes Mal,
      > wenn ich einen Zeitungsartikel lese, schlage ich zwanzig Wörter nach und
      > vergesse sie sofort wieder. Habt ihr einen Tipp, wie man das besser macht?
    use:
      - "mindestens 2 Sätze über das Zerlegen in Bausteine (Präfix, Stamm, Suffix)"
      - 'mindestens 1 Satz über das Lesen von Komposita „von hinten“ (Grundwort)'
      - "mindestens 1 selbst gebildetes Beispielwort mit seiner Bedeutung"
      - "eine freundliche Schlussformel (Viele Grüße! / Viel Erfolg!)"
    selfCheck:
      - "Habe ich bei Nomen-Suffixen das richtige Genus benutzt (die Freiheit, der Lehrling, das Eigentum)?"
      - "Steht das Verb in Hauptsätzen an Position 2?"
      - "Habe ich mindestens ein konkretes Beispielwort mit Bedeutung genannt?"
    model: |
      Hallo Lernfuchs88! Mir ging es genauso, aber ein Trick hat alles verändert:
      Ich schlage Wörter nicht mehr nach, sondern zerlege sie in ihre Bausteine.
      Vorne steht oft ein Präfix, in der Mitte der Stamm, hinten ein Suffix. So
      wird aus „un-bewohn-bar" sofort klar: „man kann nicht darin wohnen". Lange
      zusammengesetzte Wörter lese ich von hinten — das letzte Wort, das Grundwort,
      verrät Bedeutung und Artikel. „Die Sonneneinstrahlung" ist eine Einstrahlung,
      also „die". Probier es aus, es spart enorm viel Zeit. Viele Grüße und viel Erfolg!

