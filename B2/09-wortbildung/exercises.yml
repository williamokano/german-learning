lesson: B2/09
title: "B2 · Lektion 9 — Übungen (Wortbildung)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna liest gerade einen Zeitungsartikel mit unbekannten Wörtern."
        answer: true
        why: 'Anna: „ich lese gerade einen Zeitungsartikel und ständig kommen mir Wörter vor, die ich nie gelernt habe".'
      - q: "Laut Bruno sind alle unbekannten Wörter Komposita."
        answer: false
        why: 'Bruno: „das sind alles Wörter, die man zusammensetzt oder ableitet" — also beides.'
      - q: "Beim Kompositum steht der Grundbegriff immer rechts."
        answer: true
        why: 'Bruno: „Beim Kompositum steht der Grundbegriff immer rechts, der Bestimmbegriff links".'
      - q: "Verträglichkeit ist laut Bruno ein Beispiel für ein Kompositum."
        answer: false
        why: 'Verträglichkeit ist ein abgeleitetes Wort (von vertragen mit Suffix -keit), nicht ein Kompositum.'
      - q: "Anna will am Abend mit dem Wort Missverständnis anfangen."
        answer: true
        why: 'Anna: „ich fange heute Abend mit Missverständnis an".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: "In welchen Leserbriefen sehen Frau Yilmaz und Herr Steinmeyer ein neues Thema?"
        options:
          - { key: a, text: "Zum Thema Verkehrswende." }
          - { key: b, text: "Zum Thema Mietpreise." }
          - { key: c, text: "Zum Thema Digitalisierung." }
        answer: a
        why: 'Frau Yilmaz: „in den letzten Wochen erreichen uns immer mehr Leserbriefe zum Thema Verkehrswende".'
      - q: "Welche Vorsilben verwechseln laut Herr Steinmeyer viele Leser?"
        options:
          - { key: a, text: "ver- und zer-." }
          - { key: b, text: "um- und un-." }
          - { key: c, text: "er- und ent-." }
        answer: b
        why: 'Herr Steinmeyer: „Viele Leser verwechseln umleitbar und unleugbar" — also die Vorsilben um- und un-.'
      - q: "Was bedeutet Bezahlbarkeit von Wohnraum schlicht?"
        options:
          - { key: a, text: "Wohnungen, die bezahlt werden müssen." }
          - { key: b, text: "Die Frage, ob sich die Menschen das noch leisten können." }
          - { key: c, text: "Eine staatliche Förderung." }
        answer: b
        why: 'Herr Steinmeyer: „das meint schlicht: Können sich die Menschen das noch leisten?"'
      - q: "Welche Wortbildungs-Kategorie ist Wende in Verkehrswende?"
        options:
          - { key: a, text: "Vorsilbe." }
          - { key: b, text: "Grundbegriff des Kompositums." }
          - { key: c, text: "Nachsilbe." }
        answer: b
        why: 'Herr Steinmeyer: „Wende ist hier ein Grundbegriff mit der Bedeutung grundlegende Veränderung".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Annas Erklärung im Sprachkurs"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 7 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Guten Morgen zusammen. Heute möchte ich euch zeigen, wie ihr unbekannte Wörter
      im Deutschen selbst {1} könnt. Das Zauberwort heißt Wortbildung. Schaut euch das
      Wort Entscheidungsträgerin an. Wir zerlegen es in drei Teile: {2} kommt vom Verb
      entscheiden, mit der Nachsilbe -ung. Träger ist jemand, der etwas trägt — also
      hier: jemand, der eine {3} fällt. Und die {4} -in zeigt: es ist eine Frau. Also:
      eine Frau, die Entscheidungen fällt. {5} ist noch einfacher: Klima + Schutz —
      der Schutz des Klimas. Und {6} von Wohnraum: bezahlbar heißt „kann bezahlt
      werden", und {7} macht daraus ein Nomen. Wer diese Bausteine kennt, hat das
      System in der Hand.
    bank: [entschlüsseln, Entscheidung, Kompositum, Klimaschutz, Bezahlbarkeit, Endung, Vorsilbe, Missverständnis, Verständnis]
    answers:
      "1": entschlüsseln
      "2": Entscheidung
      "3": Entscheidung
      "4": Endung
      "5": Klimaschutz
      "6": Bezahlbarkeit
      "7": Vorsilbe

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Ansage aus dem Sprachzentrum"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Ansage. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    optionLayout: block
    transcript: 'Guten Morgen, hier ist das Sprachzentrum Berlin. Wir möchten Sie auf unseren neuen Wortbildungs-Workshop aufmerksam machen. Im Workshop lernen Sie, unbekannte Wörter selbst zu entschlüsseln: mit Vorsilben wie ver-, zer-, ent- und miss-, mit Nachsilben wie -ung, -heit, -keit und -bar und mit Komposita wie Verkehrswende oder Umweltverträglichkeit. Der Workshop findet nächsten Samstag von zehn bis vier Uhr statt. Die Teilnahme ist kostenlos, eine Anmeldung ist nicht erforderlich. Für Rückfragen erreichen Sie uns unter der Nummer null drei null, zweiundzwanzig, fünfzehn, null. Bitte rufen Sie uns kurz zurück, falls Sie Fragen haben.'
    items:
      - q: "Worum geht es in der Ansage?"
        options:
          - { key: a, text: "Um einen neuen Grammatik-Kurs." }
          - { key: b, text: "Um einen Wortbildungs-Workshop." }
          - { key: c, text: "Um eine Konferenz zur Verkehrswende." }
        answer: b
        why: '„Wir möchten Sie auf unseren neuen Wortbildungs-Workshop aufmerksam machen".'
      - q: "Was lernen die Teilnehmenden im Workshop?"
        options:
          - { key: a, text: "Nur neue Vokabeln auswendig lernen." }
          - { key: b, text: "Unbekannte Wörter über Vorsilben, Nachsilben und Komposita entschlüsseln." }
          - { key: c, text: "Aussprache und Hörtraining." }
        answer: b
        why: '„unbekannte Wörter selbst zu entschlüsseln: mit Vorsilben …, mit Nachsilben … und mit Komposita".'
      - q: "Wann findet der Workshop statt?"
        options:
          - { key: a, text: "Nächsten Samstag von 10 bis 16 Uhr." }
          - { key: b, text: "Diesen Samstag von 10 bis 12 Uhr." }
          - { key: c, text: "Nächsten Sonntag von 8 bis 14 Uhr." }
        answer: a
        why: '„Der Workshop findet nächsten Samstag von zehn bis vier Uhr statt".'
      - q: "Ist eine Anmeldung erforderlich?"
        options:
          - { key: a, text: "Ja, man muss sich vorher anmelden." }
          - { key: b, text: "Nein, die Teilnahme ist kostenlos und ohne Anmeldung." }
          - { key: c, text: "Ja, und sie kostet fünfzig Euro." }
        answer: b
        why: '„Die Teilnahme ist kostenlos, eine Anmeldung ist nicht erforderlich".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Die richtige Vorsilbe"
    instructions: "Setze die passende Vorsilbe ein (ver-, zer-, ent-, miss-, be-, er-, emp-). Achtung: 8 Lücken, 9 Kandidaten — eine Vorsilbe bleibt übrig. 8 Items."
    text: |
      1. {1}stehen (sich entwickeln)
      2. {2}brechen (in Stücke brechen)
      3. {3}finden (wahrnehmen)
      4. {4}verstehen (falsch verstehen)
      5. {5}zahlen (bezahlen)
      6. {6}lauben (erlauben)
      7. {7}raten (empfehlen)
      8. {8}schuldigen (um Verzeihung bitten)
    answers:
      "1": ent
      "2": zer
      "3": emp
      "4": miss
      "5": be
      "6": er
      "7": emp
      "8": ent

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Vorsilbe → Bedeutung"
    instructions: "Nenne die typische Bedeutung der Vorsilbe (Veränderung / Trennung / Entfernung / negativ / transitiv / Anfang). 6 Items."
    text: |
      1. ver- = {1}
      2. zer- = {2}
      3. ent- = {3}
      4. miss- = {4}
      5. be- = {5}
      6. er- = {6}
    answers:
      "1": Veränderung
      "2": Trennung
      "3": Entfernung
      "4": negativ
      "5": transitiv
      "6": Anfang

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Das richtige Suffix"
    instructions: "Setze das passende Suffix ein (-ung, -heit, -keit, -bar, -los, -haft, -tion). 8 Items."
    text: |
      1. die Entscheid{1} (Nomen: das Entscheiden)
      2. die Frei{2} (Nomen: das Freisein)
      3. die Verträglich{3} (Nomen: verträglich sein)
      4. bezahl{4} (Adjektiv: kann bezahlt werden)
      5. arbeit{5} (Adjektiv: ohne Arbeit)
      6. fehler{6} (Adjektiv: mit Fehlern)
      7. die Informa{7} (Nomen: das Informieren)
      8. die Sicher{8} (Nomen: das Sichersein)
    answers:
      "1": "-ung"
      "2": "-heit"
      "3": "-keit"
      "4": "-bar"
      "5": "-los"
      "6": "-haft"
      "7": "-tion"
      "8": "-heit"

  - id: A4
    block: A
    type: single-choice
    title: "Welche Wortart entsteht?"
    instructions: "Wähle die richtige Wortart, die mit dem Suffix entsteht. 6 Items."
    items:
      - q: "Verb + -ung → …"
        options:
          - { key: a, text: "Adjektiv" }
          - { key: b, text: "Nomen (feminin)" }
          - { key: c, text: "Adverb" }
        answer: b
        why: "*-ung* macht aus einem Verb ein feminines Nomen: die Lösung, die Entscheidung, die Bezahlung."
      - q: "Adjektiv + -heit → …"
        options:
          - { key: a, text: "Nomen (feminin)" }
          - { key: b, text: "Verb" }
          - { key: c, text: "Adjektiv" }
        answer: a
        why: "*-heit* macht aus einem Adjektiv ein feminines Nomen: die Freiheit, die Sicherheit."
      - q: "Verb + -bar → …"
        options:
          - { key: a, text: "Adjektiv (Möglichkeit)" }
          - { key: b, text: "Nomen" }
          - { key: c, text: "Adverb" }
        answer: a
        why: "*-bar* macht aus einem Verb ein Adjektiv mit passiver Bedeutung: bezahlbar (= kann bezahlt werden)."
      - q: "Nomen + -los → …"
        options:
          - { key: a, text: "Adjektiv (Fehlen)" }
          - { key: b, text: "Verb" }
          - { key: c, text: "Pronomen" }
        answer: a
        why: "*-los* macht aus einem Nomen ein Adjektiv, das das Fehlen ausdrückt: arbeitslos, sprachlos."
      - q: "Verb + -er → …"
        options:
          - { key: a, text: "Adjektiv" }
          - { key: b, text: "Adverb" }
          - { key: c, text: "Person-Nomen" }
        answer: c
        why: "*-er* macht aus einem Verb ein Nomen für die Person: der Fahrer, der Leser."
      - q: "Adjektiv + -isch → …"
        options:
          - { key: a, text: "Nomen" }
          - { key: b, text: "Adjektiv (oft negativ)" }
          - { key: c, text: "Verb" }
        answer: b
        why: "*-isch* macht aus einem Nomen oft ein Adjektiv mit wertender Bedeutung: kindisch, egoistisch, touristisch."

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Kompositum: Bestimmbegriff + Grundbegriff"
    instructions: "Setze das fehlende Wort ein (Bestimmbegriff oder Grundbegriff). Lese das Kompositum von rechts nach links. 6 Items."
    text: |
      1. Verkehrs{1} = der Verkehr + die Wende
      2. Klima{2} = das Klima + der Schutz
      3. {3}träger = die Entscheidung + der Träger
      4. Umwelt{4} = die Umwelt + die Verträglichkeit
      5. {5}ministerium = der Bund + das Umweltministerium
      6. Sprach{6}lerin = die Sprache + die Wissenschaftlerin
    answers:
      "1": wende
      "2": schutz
      "3": Entscheidungs
      "4": verträglichkeit
      "5": Bundesumwelt
      "6": wissent

  - id: A6
    block: A
    type: matching
    title: "Vorsilbe und ihre Bedeutung verbinden"
    instructions: "Ordne jeder Vorsilbe (1–6) ihre typische Bedeutung (a–f) zu."
    left:
      - { key: "1", text: "ver-" }
      - { key: "2", text: "zer-" }
      - { key: "3", text: "ent-" }
      - { key: "4", text: "miss-" }
      - { key: "5", text: "be-" }
      - { key: "6", text: "er-" }
    right:
      - { key: a, text: "Anfang / Ergebnis" }
      - { key: b, text: "Veränderung / Abschluss" }
      - { key: c, text: "Trennung" }
      - { key: d, text: "transitiv machen" }
      - { key: e, text: "Entfernung / Umkehr" }
      - { key: f, text: "negativ / falsch" }
    answers:
      "1": b
      "2": c
      "3": e
      "4": f
      "5": d
      "6": a

  - id: A7
    block: A
    type: gap-bank
    title: "Fugenelement oder nicht?"
    instructions: "Füll die Lücken mit dem passenden Fugenelement (-s-, -n-, -en-, -er-). Achtung: nicht überall ist ein Fugenelement nötig! 6 Items."
    text: |
      1. Verkehr{1}wende
      2. Klima{2}schutz
      3. Hochgeschwindigkeit{3}zug
      4. Liebe{4}brief
      5. Bundes{5}umweltministerium
      6. Bundeskanzler{6}amt
    bank: ["-s-", "-n-", "-en-", "-er-", "—", "—"]
    answers:
      "1": "-s-"
      "2": "-s-"
      "3": "-s-"
      "4": "-s-"
      "5": "-s-"
      "6": "-s-"

  - id: A8
    block: A
    type: categorize
    title: "Vorsilbe oder Nachsilbe?"
    instructions: "Ordne jeden Baustein der richtigen Kategorie zu."
    buckets:
      - { key: prefix, label: "Vorsilbe (Präfix) — kommt vor dem Stamm" }
      - { key: suffix, label: "Nachsilbe (Suffix) — kommt nach dem Stamm" }
    tokens:
      - { text: "ver-", bucket: prefix }
      - { text: "zer-", bucket: prefix }
      - { text: "miss-", bucket: prefix }
      - { text: "emp-", bucket: prefix }
      - { text: "-ung", bucket: suffix }
      - { text: "-bar", bucket: suffix }
      - { text: "-keit", bucket: suffix }
      - { text: "-haft", bucket: suffix }

  - id: A9
    block: A
    type: order
    title: "Satzbau: Kompositum im Satz"
    instructions: "Bring die Wörter in die richtige Reihenfolge. Das Verb steht auf Position 2."
    items:
      - tiles: [Die, Regierung, beschließt, eine, Verkehrswende]
        answer: [0, 1, 2, 3, 4]
        note: "Die Regierung beschließt eine Verkehrswende"
      - tiles: [Die, Bezahlbarkeit, von, Wohnraum, ist, gefährdet]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Die Bezahlbarkeit von Wohnraum ist gefährdet"
      - tiles: [Wir, analysieren, die, Umweltverträglichkeit, des, Projekts]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Wir analysieren die Umweltverträglichkeit des Projekts"
      - tiles: [Die, Entscheidungsträgerin, hat, das, letzte, Wort]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Die Entscheidungsträgerin hat das letzte Wort"

  - id: A10
    block: A
    type: true-false
    title: "Vorsilben richtig trennen?"
    instructions: "Achtung: Manche Verben mit Vorsilbe sind trennbar, andere untrennbar. Entscheide: Ist die Vorsilbe hier trennbar (T) oder untrennbar (U)?"
    items:
      - q: "verreisen — *ver-* ist trennbar."
        answer: true
        why: "verreisen = ich verreise, bin verreist. Die Vorsilbe ver- ist hier trennbar (Betonung auf verreisen)."
      - q: "verbieten — *ver-* ist trennbar."
        answer: false
        why: "verbieten = er verbietet (untrennbar). ver- ist hier untrennbar (Betonung auf -bie-)."
      - q: "zerstören — *zer-* ist trennbar."
        answer: false
        why: "zerstören = er zerstört (untrennbar). zer- ist immer untrennbar (Betonung auf -stö-)."
      - q: "entwickeln — *ent-* ist trennbar."
        answer: false
        why: "entwickeln = er entwickelt (untrennbar). ent- ist immer untrennbar (Betonung auf -wik-)."
      - q: "umsteigen — *um-* ist trennbar."
        answer: true
        why: "umsteigen = ich steige um (trennbar). um- ist hier trennbar (Betonung auf -stei-)."
      - q: "missverstehen — *miss-* ist trennbar."
        answer: false
        why: "missverstehen = er missversteht (untrennbar). miss- ist immer untrennbar (Betonung auf -ver-)."

  - id: A11
    block: A
    type: gap-text
    listLayout: true
    title: "Wortfamilie: Stamm + Ableitung"
    instructions: "Bilde aus dem Stamm das genannte Wort. 6 Items."
    text: |
      Stamm: entscheid-
      1. Nomen mit -ung: {1}
      2. Person mit -erin: {2}
      3. Adjektiv (Partizip I): {3}

      Stamm: fahr-
      4. Nomen ohne Suffix: {4}
      5. Person mit -er: {5}
      6. Nomen mit Erfahr- (Kompositum): {6}
    answers:
      "1": Entscheidung
      "2": Entscheiderin
      "3": entscheidend
      "4": Fahrt
      "5": Fahrer
      "6": Erfahrung

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: free-write
    title: "Bedeutung erschließen: Vorsilben raten"
    prompt: "Erschließe die Bedeutung dieser unbekannten Verben über die Vorsilbe und schreib einen kurzen Beispielsatz."
    stimulus: |
      1. zerkochen
      2. entstauben
      3. missglücken
      4. bearbeiten
      5. erfinden
      6. empfinden
    model: |
      1. zerkochen — durch Kochen in Stücke / weich kochen (zer- = Trennung): Die Nudeln sind völlig zerkocht.
      2. entstauben — Staub entfernen (ent- = weg): Wir müssen das Regal entstauben.
      3. missglücken — schiefgehen, nicht gelingen (miss- = falsch): Der Kuchen ist missglückt.
      4. bearbeiten — an etwas arbeiten (be- = transitiv): Er bearbeitet gerade den Antrag.
      5. erfinden — etwas Neues schaffen (er- = Anfang): Sie hat ein neues Gerät erfunden.
      6. empfinden — fühlen, wahrnehmen (emp- wie ent-): Ich empfinde große Freude.

  - id: B2
    block: B
    type: free-write
    title: "Suffixe produktiv nutzen: Verb → Nomen/Adjektiv"
    prompt: "Bilde aus dem Verb jeweils das Nomen auf -ung und das Adjektiv auf -bar. Achtung: Manche Verben ergeben kein beides."
    stimulus: |
      1. lösen
      2. entscheiden
      3. bezahlen
      4. erfahren
      5. vergleichen
      6. tragen
    model: |
      1. lösen — die Lösung; lösbar
      2. entscheiden — die Entscheidung; (entscheidbar ist selten) — Hauptsache: die Entscheidung
      3. bezahlen — die Bezahlung; bezahlbar
      4. erfahren — die Erfahrung; erfahrbar
      5. vergleichen — der Vergleich (Suffix -ich, nicht -ung — möglich: Vergleichung, aber unüblich); vergleichbar
      6. tragen — die Tragung (selten) / die Last; tragbar

  - id: B3
    block: B
    type: free-write
    title: "Finde den Fehler: Wortbildung"
    prompt: "Jeder Satz hat genau einen Fehler in der Wortbildung (falsche Vorsilbe, falsches Suffix oder falsches Kompositum). Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Wir haben das Problem zerstört.
      2. Sie hat eine Entscheide getroffen.
      3. Das ist ein bezahlbarer Preis.
      4. Er hat die Verträglichkeit von der Umwelt geprüft.
      5. Die Verständnis ist gestört.
      6. Ich brauche eine Erlaubnis.
    model: |
      1. Wir haben das Problem gelöst. (zerstören = kaputt machen — nicht passend für Problem; oder: Wir haben das Problem zerlegt / analysiert).
      2. Sie hat eine Entscheidung getroffen. (Suffix -ung, nicht -e).
      3. Das ist ein bezahlbarer Preis. (korrekt!) — oder besser: Der Preis ist bezahlbar.
      4. Er hat die Umweltverträglichkeit geprüft. (Kompositum, Grundbegriff Verträglichkeit steht rechts, Bestimmbegriff Umwelt links).
      5. Das Verständnis ist gestört. (Nomen Verständnis ist neutrum: das Verständnis).
      6. Ich brauche eine Erlaubnis. (korrekt!) — oder: Ich brauche Erlaubnis (ohne Artikel).

  - id: B4
    block: B
    type: matching
    title: "Kompositum: Bestimmbegriff + Grundbegriff"
    instructions: "Ordne jedem Kompositum (1–6) seine Zerlegung (a–f) zu."
    left:
      - { key: "1", text: "Verkehrswende" }
      - { key: "2", text: "Entscheidungsträger" }
      - { key: "3", text: "Umweltverträglichkeit" }
      - { key: "4", text: "Klimaschutz" }
      - { key: "5", text: "Hochgeschwindigkeitszug" }
      - { key: "6", text: "Bundesumweltministerium" }
    right:
      - { key: a, text: "Klima + Schutz" }
      - { key: b, text: "Verkehr + Wende" }
      - { key: c, text: "Bund + Umwelt + Ministerium" }
      - { key: d, text: "Umwelt + Verträglichkeit" }
      - { key: e, text: "Entscheidung + Träger" }
      - { key: f, text: "Hochgeschwindigkeit + Zug" }
    answers:
      "1": b
      "2": e
      "3": d
      "4": a
      "5": f
      "6": c

  - id: B5
    block: B
    type: gap-bank
    title: "Wortfamilien ergänzen"
