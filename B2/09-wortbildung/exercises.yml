lesson: B2/09
title: "B2 · Lektion 9 — Übungen (Wortbildung)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: 'Anna versteht das Wort „unverwüstlich“ zuerst nicht.'
        answer: true
        why: 'Anna: „Was bedeutet ‚unverwüstlich‘? Das steht in keinem meiner Wörterbücher".'
      - q: "Bruno rät Anna, das Wort in seine Bausteine zu zerlegen."
        answer: true
        why: 'Bruno: „Dann zerleg es doch einfach. Nimm das Wort auseinander".'
      - q: 'Laut Bruno bedeutet das Präfix „ver-“ oft „falsch“ oder „kaputt“.'
        answer: true
        why: 'Bruno: „‚ver-‘ zum Beispiel bedeutet oft ‚falsch‘ oder ‚kaputt‘".'
      - q: "Bruno sagt, man solle lange Wörter von vorne lesen."
        answer: false
        why: 'Bruno: „Lies von hinten. Das letzte Wort ist das wichtigste, das Grundwort".'
      - q: "Das Grundwort bestimmt laut Bruno den Artikel des ganzen Wortes."
        answer: true
        why: 'Bruno: „Das Grundwort gewinnt immer" — es liefert den Artikel.'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: 'Warum schreibt Herr Steinmeyer lieber „Zusammenarbeit“ als „Kooperation“?'
        options:
          - { key: a, text: "Weil es kürzer ist." }
          - { key: b, text: "Weil es deutscher und klarer wirkt." }
          - { key: c, text: "Weil es ein Fugenelement hat." }
        answer: b
        why: 'Herr Steinmeyer: „‚die Zusammenarbeit‘ ist mir lieber als ‚die Kooperation‘. Das wirkt deutscher und klarer".'
      - q: 'Wie ist das Wort „die Unzuverlässigkeit“ aufgebaut?'
        options:
          - { key: a, text: "verlassen → zuverlässig → die Zuverlässigkeit → un-." }
          - { key: b, text: "Es ist ein Kompositum aus zwei Nomen." }
          - { key: c, text: "Es hat gar keine Bausteine." }
        answer: a
        why: 'Herr Steinmeyer: „‚verlassen‘ wird zu ‚zuverlässig‘, daraus ‚die Zuverlässigkeit‘ mit ‚-keit‘, und ‚un-‘ dreht die Bedeutung um".'
      - q: 'Welches Genus haben laut den beiden alle Wörter auf „-heit“ und „-keit“?'
        options:
          - { key: a, text: "Maskulin (der)." }
          - { key: b, text: "Neutral (das)." }
          - { key: c, text: "Feminin (die)." }
        answer: c
        why: 'Frau Yilmaz: „alle Wörter auf ‚-heit‘ und ‚-keit‘ sind feminin".'
      - q: 'Was ist das „s“ in „die Mannschaftsleistung“?'
        options:
          - { key: a, text: "Ein Fugenelement, das das Wort leichter aussprechbar macht." }
          - { key: b, text: "Ein Tippfehler." }
          - { key: c, text: "Ein Präfix." }
        answer: a
        why: 'Herr Steinmeyer: „das ist ein Fugenelement. … Das ‚s‘ macht das Wort nur leichter aussprechbar".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Durchsage in der Sprachschule"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Achtung, eine Durchsage für alle Kursteilnehmer im zweiten Stock. Heute Nachmittag
      findet ein {1} zur Wortbildung statt. In diesem Workshop lernen Sie, wie Sie unbekannte
      Wörter durch ihre {2} erschließen. Wir behandeln zuerst die wichtigsten {3}, danach die
      Endungen und schließlich die {4} langer Wörter. Die Teilnahme ist {5}, eine vorherige
      {6} ist jedoch erforderlich.
    bank: [Sonderworkshop, Bausteine, Vorsilben, Zusammensetzung, kostenlos, Anmeldung, Kontrolle, sinnlos, Bedeutung]
    answers:
      "1": Sonderworkshop
      "2": Bausteine
      "3": Vorsilben
      "4": Zusammensetzung
      "5": kostenlos
      "6": Anmeldung

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anrufbeantworter der Sprachschule"
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    transcript: 'Guten Tag, hier ist der Anrufbeantworter der Sprachschule Lingua. Sie hören diese Nachricht, weil unser Sekretariat heute geschlossen ist. Der angekündigte Workshop zur Wortbildung muss leider verschoben werden. Der neue Termin ist nächsten Montag um vierzehn Uhr im Raum zwölf. Die Teilnahme bleibt kostenlos, aber die Anmeldung ist weiterhin erforderlich. Bitte rufen Sie morgen zwischen neun und zwölf Uhr zurück, um sich anzumelden. Vielen Dank und auf Wiederhören.'
    items:
      - q: "Warum hört man diese Nachricht?"
        options:
          - { key: a, text: "Weil das Sekretariat heute geschlossen ist." }
          - { key: b, text: "Weil der Workshop ausfällt und nie stattfindet." }
          - { key: c, text: "Weil die Sprachschule umgezogen ist." }
        answer: a
        why: '„Sie hören diese Nachricht, weil unser Sekretariat heute geschlossen ist".'
      - q: "Was passiert mit dem Workshop zur Wortbildung?"
        options:
          - { key: a, text: "Er wird abgesagt." }
          - { key: b, text: "Er wird auf nächsten Montag verschoben." }
          - { key: c, text: "Er findet wie geplant heute statt." }
        answer: b
        why: '„Der neue Termin ist nächsten Montag um vierzehn Uhr im Raum zwölf".'
      - q: "Was gilt weiterhin für die Teilnahme?"
        options:
          - { key: a, text: "Sie kostet jetzt Geld." }
          - { key: b, text: "Sie ist kostenlos, aber eine Anmeldung ist nötig." }
          - { key: c, text: "Man braucht keine Anmeldung mehr." }
        answer: b
        why: '„Die Teilnahme bleibt kostenlos, aber die Anmeldung ist weiterhin erforderlich".'
      - q: "Was soll man tun, um sich anzumelden?"
        options:
          - { key: a, text: "Eine E-Mail schreiben." }
          - { key: b, text: "Morgen zwischen neun und zwölf Uhr zurückrufen." }
          - { key: c, text: "Heute Nachmittag vorbeikommen." }
        answer: b
        why: '„Bitte rufen Sie morgen zwischen neun und zwölf Uhr zurück, um sich anzumelden".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Präfix-Bedeutung erkennen"
    instructions: "Setz das passende Präfix ein (ver-, zer-, ent-, miss-, be-, er-). 8 Items."
    text: |
      1. Das Glas ist gefallen und {1}brochen. (kaputt → in Stücke)
      2. Bitte {2}fernen Sie das alte Plakat von der Wand. (weg)
      3. Ich habe dich wohl {3}verstanden. (falsch)
      4. Kannst du bitte meine Frage {4}antworten? (macht transitiv)
      5. Wir haben uns im Wald {5}laufen. (sich verirren)
      6. Sie {6}traut dem neuen Kollegen. (negativ)
      7. Ich habe mir dieses Wissen selbst {7}arbeitet. (Ergebnis durch Mühe)
      8. Er hat den Brief wütend {8}rissen. (in Stücke)
    answers:
      "1": zer
      "2": ent
      "3": miss
      "4": be
      "5": ver
      "6": miss
      "7": er
      "8": zer

  - id: A2
    block: A
    type: matching
    title: "Präfix und Bedeutung verbinden"
    instructions: "Ordne jedem Präfix (1–6) seine typische Bedeutung (a–f) zu."
    left:
      - { key: "1", text: "ver-" }
      - { key: "2", text: "zer-" }
      - { key: "3", text: "ent-" }
      - { key: "4", text: "miss-" }
      - { key: "5", text: "be-" }
      - { key: "6", text: "er-" }
    right:
      - { key: a, text: "in Stücke, kaputt" }
      - { key: b, text: "weg / Gegenteil" }
      - { key: c, text: "falsch / negativ" }
      - { key: d, text: "macht ein Verb transitiv" }
      - { key: e, text: "Ergebnis / Beginn" }
      - { key: f, text: "falsch / weg / Veränderung" }
    answers:
      "1": f
      "2": a
      "3": b
      "4": c
      "5": d
      "6": e

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Nomen-Suffixe: das richtige Genus"
    instructions: "Setz den richtigen Artikel ein (der, die oder das). 8 Items."
    text: |
      1. {1} Freiheit (-heit)
      2. {2} Möglichkeit (-keit)
      3. {3} Freundschaft (-schaft)
      4. {4} Eigentum (-tum)
      5. {5} Lehrling (-ling)
      6. {6} Hoffnung (-ung)
      7. {7} Wachstum (-tum)
      8. {8} Frühling (-ling)
    answers:
      "1": die
      "2": die
      "3": die
      "4": das
      "5": der
      "6": die
      "7": das
      "8": der

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Nomen bilden: Adjektiv/Verb → Nomen"
    instructions: "Bilde das Nomen mit dem passenden Suffix (-ung, -heit, -keit oder -schaft). Schreib das Nomen mit Artikel. 6 Items."
    text: |
      1. krank → {1}
      2. schön → {2}
      3. höflich → {3}
      4. der Freund → {4}
      5. bilden → {5}
      6. möglich → {6}
    answers:
      "1": die Krankheit
      "2": die Schönheit
      "3": die Höflichkeit
      "4": die Freundschaft
      "5": die Bildung
      "6": die Möglichkeit

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Adjektiv-Suffixe: -bar, -los, -voll"
    instructions: "Setz das passende Suffix ein (-bar, -los oder -voll). 6 Items."
    text: |
      1. Man kann es essen. → ess{1}
      2. Ohne Arbeit. → arbeits{2}
      3. Mit viel Wert. → wert{3}
      4. Man kann es lesen. → les{4}
      5. Ohne Sinn. → sinn{5}
      6. Mit viel Sinn. → sinn{6}
    answers:
      "1": bar
      "2": los
      "3": voll
      "4": bar
      "5": los
      "6": voll

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Komposita: Genus des Grundworts"
    instructions: "Setz den richtigen Artikel des ganzen Kompositums ein. Tipp: Das letzte Wort (Grundwort) bestimmt den Artikel. 6 Items."
    text: |
      1. {1} Sonnenschein (die Sonne + der Schein)
      2. {2} Arbeitsplatz (die Arbeit + der Platz)
      3. {3} Kindergarten (das Kind + der Garten)
      4. {4} Mannschaftsleistung (die Mannschaft + die Leistung)
      5. {5} Familienfest (die Familie + das Fest)
      6. {6} Haustür (das Haus + die Tür)
    answers:
      "1": der
      "2": der
      "3": der
      "4": die
      "5": das
      "6": die

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "Fugenelemente einsetzen"
    instructions: "Setz das richtige Fugenelement ein (-s-, -n-, -er- oder -es-). 6 Items."
    text: |
      1. die Arbeit + der Platz → der Arbeit{1}platz
      2. die Sonne + der Schein → der Sonne{2}schein
      3. das Kind + der Garten → der Kind{3}garten
      4. die Mannschaft + die Leistung → die Mannschaft{4}leistung
      5. die Familie + das Fest → das Familie{5}fest
      6. das Meer + der Spiegel → der Meer{6}spiegel
    answers:
      "1": s
      "2": n
      "3": er
      "4": s
      "5": n
      "6": es

  - id: A8
    block: A
    type: matching
    title: "Suffix und Genus verbinden"
    instructions: "Ordne jedem Suffix (1–6) das richtige Genus (a–c) zu. Ein Genus passt zu mehreren Suffixen."
    left:
      - { key: "1", text: "-ung" }
      - { key: "2", text: "-ling" }
      - { key: "3", text: "-tum" }
      - { key: "4", text: "-keit" }
      - { key: "5", text: "-schaft" }
      - { key: "6", text: "-heit" }
    right:
