      - { key: b, text: "der (maskulin)" }
      - { key: c, text: "das (neutral)" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": a
      "5": a
      "6": a

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Bedeutung aus dem Präfix erschließen"
    instructions: "Erkläre die Bedeutung in einem Wort oder kurz. Tipp: Achte auf das Präfix. 6 Items."
    text: |
      1. „zerschneiden" — in {1} schneiden.
      2. „entladen" — die Ladung {2}nehmen.
      3. „missbrauchen" — etwas {3} benutzen.
      4. „verbessern" — etwas {4} machen.
      5. „beantworten" — auf eine Frage {5}.
      6. „erreichen" — ein {6} schaffen.
    answers:
      "1": Stücke
      "2": weg
      "3": falsch
      "4": besser
      "5": antworten
      "6": Ziel

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "-heit oder -keit?"
    instructions: "Setz die richtige Endung ein. Tipp: Nach -ig, -lich, -bar steht meist -keit, sonst -heit. 6 Items."
    text: |
      1. frei → die Frei{1}
      2. möglich → die Möglich{2}
      3. krank → die Krank{3}
      4. höflich → die Höflich{4}
      5. schön → die Schön{5}
      6. tätig → die Tätig{6}
    answers:
      "1": heit
      "2": keit
      "3": heit
      "4": keit
      "5": heit
      "6": keit

  - id: A11
    block: A
    type: order
    title: "Kompositum von hinten zerlegen"
    prompt: "Bring die Bausteine in die richtige Reihenfolge zum fertigen Kompositum (Bestimmungswort zuerst, Grundwort zuletzt)."
    stimulus: |
      Tipp: Das Grundwort steht hinten und bestimmt den Artikel.
    items:
      - tiles: [Wort, Schatz]
        answer: [0, 1]
        note: "Wortschatz"
      - tiles: [Haus, Tür]
        answer: [0, 1]
        note: "Haustür"
      - tiles: [Land, Karte]
        answer: [0, 1]
        note: "Landkarte"
      - tiles: [Sonnen, brille]
        answer: [0, 1]
        note: "Sonnenbrille"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Text ergänzen: Anna zerlegt ein Wort"
    instructions: "Füll die 8 Lücken mit den passenden Wörtern aus dem Kasten. Zwei Wörter sind zu viel."
    text: |
      Anna las ein langes Wort und {1} es in seine Teile. In der Mitte fand sie den
      {2} „wohnen". Das {3} „be-" machte daraus „bewohnen". Die {4} „-bar" bedeutete
      „kann man tun". Das „un-" {5} die Bedeutung um. Und die Endung „-keit" machte
      aus dem Adjektiv ein {6}, immer {7}. So verstand sie das Wort ganz ohne
      {8}.
    bank: [zerlegte, Stamm, Präfix, Endung, drehte, Nomen, feminin, Wörterbuch, Grundwort, maskulin]
    answers:
      "1": zerlegte
      "2": Stamm
      "3": Präfix
      "4": Endung
      "5": drehte
      "6": Nomen
      "7": feminin
      "8": Wörterbuch

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: 'Jeder Satz enthält genau einen Wortbildungsfehler (Genus, Präfix, Suffix oder Fugenelement). Finde ihn und schreib den Satz korrekt.'
    stimulus: |
      1. Die Sonnenschein war heute sehr stark.
      2. Ich habe deine Frage geantwortet.
      3. Das Kind ist sehr kindisch und unschuldig.
      4. Er ist seit einem Jahr arbeitlos.
      5. Das Eigentum gehört meiner Mutter. (korrekt?)
      6. Wir gehen jeden Tag in den Kindgarten.
      7. Das Glas hat gebrochen.
      8. Die Lehrling lernt einen Beruf.
    model: |
      1. Der Sonnenschein war heute sehr stark. (Genus vom Grundwort „der Schein")
      2. Ich habe deine Frage beantwortet. (be- macht transitiv: eine Frage beantworten)
      3. Das Kind ist sehr kindlich und unschuldig. (-lich = unschuldig; kindisch = albern)
      4. Er ist seit einem Jahr arbeitslos. (Fugen-s: Arbeit-s-los)
      5. Das Eigentum gehört meiner Mutter. (korrekt — -tum ist neutral)
      6. Wir gehen jeden Tag in den Kindergarten. (Fugenelement -er-: Kind-er-garten)
      7. Das Glas ist zerbrochen. (zer- = in Stücke, mit sein)
      8. Der Lehrling lernt einen Beruf. (-ling ist maskulin)

  - id: B3
    block: B
    type: matching
    title: "Kompositum und Grundwort-Genus"
    instructions: "Ordne jedem Kompositum (1–6) den richtigen Artikel (a–c) zu. Tipp: Genus vom Grundwort."
    left:
      - { key: "1", text: "___ Arbeitsplatz (der Platz)" }
      - { key: "2", text: "___ Haustür (die Tür)" }
      - { key: "3", text: "___ Familienfest (das Fest)" }
      - { key: "4", text: "___ Kindergarten (der Garten)" }
      - { key: "5", text: "___ Mannschaftsleistung (die Leistung)" }
      - { key: "6", text: "___ Tagebuch (das Buch)" }
    right:
      - { key: a, text: "der" }
      - { key: b, text: "die" }
      - { key: c, text: "das" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": a
      "5": b
      "6": c

  - id: B4
    block: B
    type: free-write
    title: "Wörter erschließen: Was bedeutet das?"
    prompt: "Erschließe die Bedeutung der folgenden Wörter aus ihren Bausteinen und erkläre sie kurz auf Deutsch."
    stimulus: |
      1. unbezahlbar (un- + bezahlen + -bar)
      2. hoffnungslos (die Hoffnung + -los)
      3. die Unzuverlässigkeit (un- + zuverlässig + -keit)
      4. zerstören (zer- + …)
      5. die Krankenversicherung (krank + Versicherung)
    model: |
      1. unbezahlbar = man kann es nicht bezahlen (un- = nicht, -bar = kann man).
      2. hoffnungslos = ohne Hoffnung (-los = ohne).
      3. die Unzuverlässigkeit = die Eigenschaft, nicht zuverlässig zu sein (un- dreht um, -keit macht ein feminines Nomen).
      4. zerstören = etwas völlig kaputtmachen (zer- = in Stücke / kaputt).
      5. die Krankenversicherung = eine Versicherung für den Krankheitsfall; Grundwort „die Versicherung" → die.

  - id: B5
    block: B
    type: odd-one-out
    title: "Was passt nicht? (Wortbildung)"
    instructions: "Streich das Wort durch, das nicht in die Gruppe passt, und erklär warum."
    groups:
      - items: [die Freiheit, die Krankheit, die Schönheit, der Reichtum]
        odd: 3
        why: "der Reichtum hat das Suffix -tum (maskuline Ausnahme); die anderen haben -heit und sind feminin."
      - items: [zerbrechen, zerreißen, zerstören, beantworten]
        odd: 3
        why: "beantworten hat das Präfix be- (transitiv); die anderen haben zer- (kaputt/in Stücke)."
      - items: [essbar, lesbar, machbar, sinnlos]
        odd: 3
        why: "sinnlos hat das Suffix -los (ohne); die anderen haben -bar (kann man tun)."
      - items: [der Lehrling, der Frühling, der Flüchtling, die Wohnung]
        odd: 3
        why: "die Wohnung hat -ung (feminin); die anderen haben -ling (maskulin)."

  - id: B6
    block: B
    type: gap-text
    listLayout: true
    title: "Präfix-Verben im Satz"
    instructions: "Setz das passende Präfix-Verb in der richtigen Form ein. 6 Items."
    text: |
      1. Vorsicht, das Glas fällt gleich und {1}! (zerbrechen — Präsens, es …)
      2. Bitte {2} Sie das alte Foto von der Wand. (entfernen — Sie-Imperativ)
      3. Ich glaube, ich habe die Aufgabe {3}. (missverstehen — Perfekt-Partizip)
      4. Hast du meine E-Mail schon {4}? (beantworten — Perfekt-Partizip)
      5. Wir müssen den Lkw noch {5}. (entladen — Infinitiv)
      6. Sie hat sich dieses Wissen selbst {6}. (sich erarbeiten — Perfekt-Partizip)
    answers:
      "1": zerbricht
      "2": entfernen
      "3": missverstanden
      "4": beantwortet
      "5": entladen
      "6": erarbeitet

  - id: B7
    block: B
    type: order
    title: "Satzbau: Wortbildung erklären"
    prompt: "Bring die Wörter in die richtige Reihenfolge zu einem korrekten Satz."
    stimulus: |
      Tipp: Achte auf die Verbposition.
    items:
      - tiles: [das, Grundwort, bestimmt, den, Artikel]
        answer: [0, 1, 2, 3, 4]
        note: "Das Grundwort bestimmt den Artikel."
      - tiles: [alle, Wörter, auf, "-keit", sind, feminin]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Alle Wörter auf -keit sind feminin."
      - tiles: [man, liest, lange, Wörter, von, hinten]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Man liest lange Wörter von hinten."
      - tiles: [das, Präfix, "zer-", bedeutet, kaputt]
        answer: [0, 1, 2, 3, 4]
        note: "Das Präfix zer- bedeutet kaputt."

  - id: B8
    block: B
