    instructions: 'Löse das Partizip-II-Attribut als Relativsatz auf — mit „wurde/wurden" (passiv) oder „ist/sind" (sein-Verben). 6 Items.'
    text: |
      1. das gekochte Ei → das Ei, {1}
      2. die gegründete Firma → die Firma, {2}
      3. die renovierte Galerie → die Galerie, {3}
