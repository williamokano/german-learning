      - q: "Ein ____ Hund störte uns. (bellen, Nom. m)"
        options:
          - { key: a, text: "bellender" }
          - { key: b, text: "bellende" }
        answer: a
        why: "Unbestimmter Artikel, maskulin, Nominativ → -er: ein bellender Hund."
      - q: "Die Galerie zeigt die ____ Werke. (verkaufen, Akk. Pl.)"
        options:
          - { key: a, text: "verkauften" }
          - { key: b, text: "verkaufte" }
        answer: a
        why: "Plural → -en: die verkauften Werke."
      - q: "Sie half dem ____ Baby. (schreien, Dativ n)"
        options:
