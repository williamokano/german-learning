  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Museumsbroschüre ergänzen"
    instructions: "Fülle die 8 Lücken mit dem passenden Partizipialattribut (richtige Form). Vier Wörter bleiben übrig."
    text: |
      Die {1} Stadtgalerie zeigt eine besondere Sammlung. Die {2}
      Sonderausstellung im Erdgeschoss präsentiert vor allem im 19. Jahrhundert
      {3} Gemälde. Im ersten Stock hängt ein berühmtes Bild mit {4}
      Kindern. Die {5} Skulptur im Innenhof ist erst ab morgen wieder zu sehen.
      Der 2018 {6} Maler hat viele dieser Werke geschaffen. Wegen der seit Jahren
      {7} Nachfrage wurde die Galerie erweitert. Besucher mit einem heute {8}
      Ticket dürfen morgen kostenlos wiederkommen.
    bank: [renovierte, eröffnete, entstandenen, spielenden, restaurierte, verstorbene, steigenden, gekauften, lachende, gegründete, gekochte, schlafende]
    answers:
