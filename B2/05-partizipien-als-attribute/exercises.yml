lesson: B2/05
title: "B2 · Lektion 5 — Übungen (Partizipien als Attribute)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Lösungen in solutions.md.
  Tipp: Verteile die Blöcke über mehrere Tage — H und A an Tag 1, B an Tag 2,
  C an Tag 3, D an Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna und Bruno sind in einem Museum."
        answer: true
        why: 'Anna liest aus der Ausstellungsbroschüre vor.'
      - q: '„Die entstandenen Werke" ist laut Bruno ein Partizip II.'
        answer: true
        why: 'Bruno: „Die entstandenen Werke — das ist Partizip II".'
      - q: '„Die lachenden Kinder" ist ein Partizip II.'
        answer: false
        why: 'Bruno: „Das ist Partizip I, also Infinitiv plus d".'
      - q: "Bruno sagt, das Partizip bekomme eine ganz normale Adjektivendung."
        answer: true
        why: 'Bruno: „Weil das Partizip eine ganz normale Adjektivendung bekommt".'
      - q: "Anna findet das Thema am Ende sehr schwer und gibt auf."
        answer: false
        why: 'Anna: „Dann ist das eigentlich gar nicht so schwer".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Was kritisiert Frau Yilmaz an der Pressemitteilung?"
        options:
          - { key: a, text: "Den Inhalt." }
          - { key: b, text: "Dass zwei Relativsätze hintereinanderstehen." }
          - { key: c, text: "Die Rechtschreibung." }
        answer: b
        why: 'Frau Yilmaz: „Das sind zwei Relativsätze hintereinander … zu lang".'
      - q: 'Wie soll Herr Steinmeyer „die Ausstellung, die im Mai eröffnet wurde" umformen?'
        options:
          - { key: a, text: "die im Mai eröffnende Ausstellung" }
          - { key: b, text: "die im Mai eröffnete Ausstellung" }
          - { key: c, text: "die Ausstellung im Mai eröffnet" }
        answer: b
        why: 'Die Ausstellung wurde eröffnet → passiv → Partizip II: „die im Mai eröffnete Ausstellung".'
      - q: 'Warum soll „die viele Besucher angezogen hat" ein Relativsatz bleiben?'
        options:
          - { key: a, text: "Weil es aktiv ist und ein Partizip I schwer lesbar wäre." }
          - { key: b, text: "Weil es passiv ist." }
          - { key: c, text: "Weil es kein Verb enthält." }
        answer: a
        why: 'Frau Yilmaz: „denn das ist aktiv … Ein Partizip I wäre … korrekt, aber schwer lesbar".'
      - q: 'Wie wird aus „der Künstler, der 2018 verstarb" ein Attribut?'
        options:
          - { key: a, text: "der 2018 versterbende Künstler" }
          - { key: b, text: "der 2018 verstorbene Künstler" }
          - { key: c, text: "der Künstler 2018 verstorben" }
        answer: b
        why: '„sterben" bildet das Perfekt mit „sein", also Partizip II: „der 2018 verstorbene Künstler".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Durchsage im Museum"
    audio: hoertext.mp3
    instructions: "Hör die Durchsage und fülle die 6 Lücken. Drei Wörter im Kasten bleiben übrig."
    text: |
      Achtung, eine Durchsage für alle Besucher der Stadtgalerie. Die im Erdgeschoss
      {1} Sonderausstellung schließt heute bereits um 17 Uhr. Die im 19. Jahrhundert
      {2} Gemälde im ersten Stock sind weiterhin bis 20 Uhr zu sehen. Die gerade
      {3} Skulptur im Innenhof ist ab morgen wieder geöffnet. Besucher mit einem heute
      {4} Ticket können morgen kostenlos {5}. Wir danken Ihnen für Ihren Besuch und Ihr
      {6}.
    bank: [gezeigte, entstandenen, restaurierte, gekauften, wiederkommen, Verständnis, eröffnete, steigende, schlafende]
    answers:
      "1": gezeigte
      "2": entstandenen
      "3": restaurierte
      "4": gekauften
      "5": wiederkommen
      "6": Verständnis

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht von der Galerie"
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: "Hör die Sprachnachricht. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    transcript: 'Hallo Bruno, hier ist Anna. Ich stehe gerade vor der renovierten Stadtgalerie und wollte dir kurz Bescheid sagen. Die im Mai eröffnete Sonderausstellung über die im 19. Jahrhundert entstandenen Gemälde ist wirklich beeindruckend. Es gibt sogar ein 1872 gemaltes Bild mit spielenden Kindern, das du unbedingt sehen musst. Die gerade restaurierte Skulptur im Innenhof ist leider noch geschlossen. Komm doch morgen mit, dann zeige ich dir alles. Bitte ruf mich zurück. Bis bald!'
    items:
      - q: "Wo steht Anna gerade?"
        options:
          - { key: a, text: "Vor der renovierten Stadtgalerie." }
          - { key: b, text: "In einem Café." }
          - { key: c, text: "Zu Hause." }
        answer: a
        why: '„Ich stehe gerade vor der renovierten Stadtgalerie".'
      - q: "Worüber ist die im Mai eröffnete Sonderausstellung?"
        options:
          - { key: a, text: "Über moderne Skulpturen." }
          - { key: b, text: "Über die im 19. Jahrhundert entstandenen Gemälde." }
          - { key: c, text: "Über Fotografie." }
        answer: b
        why: '„die im Mai eröffnete Sonderausstellung über die im 19. Jahrhundert entstandenen Gemälde".'
      - q: "Was ist mit der restaurierten Skulptur im Innenhof?"
        options:
          - { key: a, text: "Sie wurde verkauft." }
          - { key: b, text: "Sie ist noch geschlossen." }
          - { key: c, text: "Sie ist das schönste Werk." }
        answer: b
        why: '„Die gerade restaurierte Skulptur im Innenhof ist leider noch geschlossen".'
      - q: "Was soll Bruno tun?"
        options:
          - { key: a, text: "Anna zurückrufen und morgen mitkommen." }
          - { key: b, text: "Ein Ticket kaufen." }
          - { key: c, text: "Die Galerie anrufen." }
        answer: a
        why: '„Komm doch morgen mit … Bitte ruf mich zurück".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Partizip I bilden (Infinitiv + d)"
    instructions: "Bilde das Partizip I (ohne Endung). 8 Items."
    text: |
      1. lachen → {1}
      2. kochen → {2}
      3. schlafen → {3}
      4. steigen → {4}
      5. spielen → {5}
      6. wachsen → {6}
      7. weinen → {7}
      8. brennen → {8}
    answers:
      "1": lachend
      "2": kochend
      "3": schlafend
      "4": steigend
      "5": spielend
      "6": wachsend
      "7": weinend
      "8": brennend

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Partizip II bilden"
    instructions: "Bilde das Partizip II. ⚠️ Achte auf unregelmäßige Formen. 8 Items."
    text: |
      1. kochen → {1}
      2. gründen → {2}
      3. eröffnen → {3}
      4. malen → {4}
      5. schreiben → {5}
      6. entstehen → {6}
      7. ankommen → {7}
      8. versterben → {8}
    answers:
      "1": gekocht
      "2": gegründet
      "3": eröffnet
      "4": gemalt
      "5": geschrieben
      "6": entstanden
      "7": angekommen
      "8": verstorben

  - id: A3
    block: A
    type: single-choice
    title: "Partizip I oder Partizip II?"
    instructions: "Aktiv (Partizip I) oder passiv/abgeschlossen (Partizip II)? Wähle das richtige Attribut. 6 Items."
    items:
      - q: "das Kind, das lacht → das ____ Kind"
        options:
          - { key: a, text: "lachende" }
          - { key: b, text: "gelachte" }
        answer: a
        why: "Das Kind lacht selbst → aktiv → Partizip I: das lachende Kind."
      - q: "das Ei, das gekocht wurde → das ____ Ei"
        options:
          - { key: a, text: "kochende" }
          - { key: b, text: "gekochte" }
        answer: b
        why: "Das Ei wurde gekocht → passiv → Partizip II: das gekochte Ei."
      - q: "die Firma, die 1990 gegründet wurde → die 1990 ____ Firma"
        options:
          - { key: a, text: "gründende" }
          - { key: b, text: "gegründete" }
        answer: b
        why: "Die Firma wurde gegründet → passiv → Partizip II."
      - q: "die Nachfrage, die steigt → die ____ Nachfrage"
        options:
          - { key: a, text: "steigende" }
          - { key: b, text: "gestiegene" }
        answer: a
        why: "Die Nachfrage steigt selbst, gerade jetzt → aktiv → Partizip I."
      - q: "der Zug, der angekommen ist → der ____ Zug"
        options:
          - { key: a, text: "ankommende" }
          - { key: b, text: "angekommene" }
        answer: b
        why: 'Abgeschlossen, „sein"-Perfekt → Partizip II: der angekommene Zug.'
      - q: "die Ausstellung, die im Mai eröffnet wurde → die im Mai ____ Ausstellung"
        options:
          - { key: a, text: "eröffnende" }
          - { key: b, text: "eröffnete" }
        answer: b
        why: "Sie wurde eröffnet → passiv → Partizip II."

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Partizip I als Attribut → Relativsatz"
    instructions: "Löse das Partizip-I-Attribut als Relativsatz im Aktiv auf. Schreib nur das Relativpronomen + Verb. 6 Items."
    text: |
      1. das lachende Kind → das Kind, {1}
      2. die steigenden Preise → die Preise, {2}
      3. der schlafende Hund → der Hund, {3}
      4. die spielenden Kinder → die Kinder, {4}
      5. die wachsende Stadt → die Stadt, {5}
      6. das brennende Haus → das Haus, {6}
    answers:
