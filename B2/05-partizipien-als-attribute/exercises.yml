    listLayout: true
    title: "Erweitertes Partizipialattribut → Relativsatz"
    instructions: "Löse das Partizipialattribut in einen Relativsatz auf. Schreib den ganzen Relativsatz (Nomen + Komma + Relativsatz). 5 Items."
    text: |
      1. die im 19. Jahrhundert entstandenen Werke → die Werke, {1}
