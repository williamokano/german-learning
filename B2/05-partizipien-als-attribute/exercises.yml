    instructions: "Form den Relativsatz in ein erweitertes Partizipialattribut um. Schreib die ganze Nominalphrase. 5 Items."
    text: |
      1. die Galerie, die 2020 renoviert wurde → {1}
      2. die Preise, die seit Monaten steigen → {2}
      3. der Gast, der gerade angekommen ist → {3}
