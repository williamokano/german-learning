      "3": "das gerade vorbeifährt"
      "4": "die vom Museum gekauft wurden"
      "5": "die im Mai eröffnet wurde"

  - id: A11
    block: A
    type: single-choice
    title: "Welche Endung ist richtig?"
    instructions: "Wähle die korrekte Adjektivendung am Partizip. 5 Items."
    items:
