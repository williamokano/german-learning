# Reviewed from B2/12 lesson.md §4 Wortschatz.
# Note: all 3 tables use German paraphrase (Bedeutung), not English glosses —
# every gloss below is a hand-written English translation.
#
# Section headers in lesson.md:
#   Das Vokabular der Argumentation (argumentation structure)  — 8 nouns
#   Position, Haltung und Meinung (opinion vocabulary)          — 8 nouns
#   Pro und Contra ausdrücken (agree/disagree pairs)            — 2 nouns + 8 verbs
lesson: B2/12

entries:
