  # Ordered per the lesson's argumentation chain: These → Argument → Beleg →
  # Beispiel → Schlussfolgerung → Fazit.
  - de: These
    article: die
    plural: Thesen
    en: thesis
    pos: noun
    tags: [logic, argument, abstract]
    core: true
  - de: Argument
    article: das
    plural: Argumente
    en: argument
    pos: noun
    tags: [logic, argument, abstract]
    core: true
  - de: Beleg
    article: der
