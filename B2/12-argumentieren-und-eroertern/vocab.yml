    tags: [logic, argument, abstract]
    core: true
  - de: Widerlegung
    article: die
    plural: Widerlegungen
    en: refutation
    pos: noun
    tags: [logic, argument, abstract]
    core: true
  - de: Schlussfolgerung
    article: die
