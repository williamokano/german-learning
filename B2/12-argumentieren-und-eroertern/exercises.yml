  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out"
    instructions: "Streiche das Wort, das nicht passt, und erkläre warum."
    groups:
      - items: [These, Argument, Beleg, Dekoration]
        odd: 3
        why: "Dekoration gehört nicht in eine Erörterung; These, Argument und Beleg sind die drei Säulen."
      - items: [Ich bin der Ansicht, Meiner Meinung nach, Meines Erachtens, Zusammenfassend]
        odd: 3
        why: '"Zusammenfassend" leitet das Fazit ein, kein Position-Redemittel; die anderen drei beziehen Position.'
      - items: [Einleitung, Hauptteil, Schluss, Überschrift]
        odd: 3
        why: "Überschrift ist kein Architektur-Teil; die anderen drei sind die Hauptteile einer Erörterung."
      - items: [Meines Erachtens, Meiner Meinung nach, Meiner Auffassung nach, Meines Eracht]
        odd: 3
        why: '"Meines Eracht" ist eine falsche Form; korrekt ist „meines Erachtens" (Genitiv Singular von „die Ansicht").'
      - items: [sowohl … als auch, nicht nur … sondern auch, weder … noch, zwar … aber mit und]
        odd: 3
        why: '„Zwar … aber mit und" bricht die Wortpaar-Regel; die anderen drei sind feste Paare.'
      - items: [Es spricht für, Es spricht gegen, Dafür spricht, Mir spricht]
        odd: 3
        why: '"Mir spricht" gibt es in dieser Redemittel-Klasse nicht; die anderen drei sind Standard-Formeln für Pro/Contra.'

