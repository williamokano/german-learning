    prompt: 'Schreib eine vollständige Erörterung (180–220 Wörter) zum Thema „Sollte es in deutschen Städten ein Tempolimit von 130 km/h auf Autobahnen geben?". Halte dich an die dreiteilige Architektur: Einleitung mit These, Hauptteil mit Pro-Argumenten + wichtigstem Contra + Widerlegung, Schluss mit Fazit.'
    use:
      - "1 klare These in der Einleitung"
      - "mindestens 2 Pro-Argumente mit Beleg oder Beispiel"
      - '1 wichtigstes Contra-Argument mit Widerlegung („Diesem Argument ist entgegenzuhalten, dass …")'
      - '1 Fazit im Schluss („Zusammenfassend lässt sich sagen, dass …")'
      - "(B1/10) mindestens 1 zweiteiliger Konnektor (nicht nur … sondern auch / zwar … aber / weder … noch …)"
      - "(B2/07) mindestens 1 Konnektor aus B2/07 (obwohl / dennoch / je … desto / indem / sofern)"
      - '(B2/08) mindestens 1 Funktionsverbgefüge (z. B. „in Betracht ziehen", „Kritik üben an", „Bezug nehmen auf")'
    selfCheck:
      - "Steht eine klare These am Anfang der Einleitung?"
      - "Hat jedes Argument einen Beleg oder ein konkretes Beispiel?"
      - "Habe ich das wichtigste Contra-Argument nicht nur genannt, sondern auch widerlegt?"
      - "Bringe ich im Schluss keine neuen Argumente mehr?"
      - "Stimmen alle Konnektoren-Paare (zweiteilige Konnektoren vollständig, Konnektoren-Klasse richtig)?"
    model: |
      Die Frage, ob es auf deutschen Autobahnen ein Tempolimit von 130 km/h geben sollte,
      wird seit Jahren kontrovers diskutiert. Befürworter verweisen auf die sinkende Zahl
      der Unfälle, Gegner auf die Tradition der freien Fahrt. Ich bin der Ansicht, dass ein
      generelles Tempolimit sinnvoll ist, sofern es europäisch koordiniert eingeführt wird.
      Für das Tempolimit spricht vor allem die messbar bessere Verkehrssicherheit. Als
      Beleg dient eine Studie des ADAC aus dem Jahr 2023, die einen Rückgang schwerer
      Unfälle um 15 Prozent auf Tempolimit-Strecken zeigt. Ein weiteres Argument betrifft
      die Umwelt: Ein gleichmäßigerer Verkehrsfluss reduziert den CO2-Ausstoß.
      Das wichtigste Gegenargument ist der Eingriff in die persönliche Freiheit. Diesem
      Argument ist jedoch entgegenzuhalten, dass die freie Fahrt bereits heute durch viele
      Regeln eingeschränkt ist. Zwar empfinden einige Autofahrer ein Limit als Bevormundung,
      aber die Sicherheit aller Verkehrsteilnehmer sollte Vorrang haben.
      Zusammenfassend lässt sich sagen, dass die Vorteile eines Tempolimits überwiegen,
      sofern die Einführung gut kommuniziert wird.

