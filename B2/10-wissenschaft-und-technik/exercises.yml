  - id: B9
    block: B
    type: free-write
    title: "Forenbeitrag: Wissenschaft verständlicher machen"
    prompt: 'Schreib einen Forenbeitrag (5–6 Sätze) zu der Frage: „Sollten Forscher ihre Studien verständlicher schreiben?" Begründe deine Meinung.'
    stimulus: |
      **Forenbeitrag** — In einem Wissenschaftsforum schreibt jemand:
      > „Ich habe gestern eine Studie gelesen und kein Wort verstanden. Lauter
      > Passiv und endlose Nomen. Muss das wirklich sein? Was meint ihr?"
    use:
      - 'mindestens 1 Satz mit man + Aktiv (z. B. „Man kann …")'
      - "mindestens 1 Satz mit sich lassen oder einem -bar-Adjektiv"
      - "mindestens 1 Beispiel aus dem Wortschatz (Studie, Passiv, Nominalstil, verständlich …)"
      - "eine klare Meinung am Anfang und ein kurzes Fazit am Ende"
    selfCheck:
      - "Steht das konjugierte Verb in meinen Hauptsätzen auf Platz 2?"
      - 'Habe ich „lässt sich" mit Reflexivpronomen „sich" geschrieben?'
      - "Sind meine -bar-Adjektive aus dem Verbstamm gebildet (lösbar, nicht lösenbar)?"
    model: |
      Meiner Meinung nach sollten Forscher ihre Studien viel verständlicher
      schreiben. Eine Erkenntnis, die niemand versteht, nützt niemandem. Oft
      lässt sich ein komplizierter Passivsatz ganz leicht auflösen: Statt „es
      wird angenommen" kann man einfach „Forscher nehmen an" sagen. Auch der
      Nominalstil ist meist vermeidbar. Natürlich braucht Wissenschaft eine
      präzise Sprache — aber präzise und verständlich sind kein Widerspruch.
      Fazit: Wer klar schreibt, hat seine Idee wirklich verstanden.

