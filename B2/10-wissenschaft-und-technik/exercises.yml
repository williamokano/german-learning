lesson: B2/10
title: "B2 · Lektion 10 — Übungen (Wissenschaft und Technik)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Lösungen in solutions.md.
  Schwerpunkt: Passiv und seine Ersatzformen (B2/02) sowie Nominalstil (B2/01)
  im Kontext von Wissenschaft und Technik — keine neue Grammatik, sondern Anwendung.
  Tipp: Verteile die Blöcke über mehrere Tage — H und A an Tag 1, B an Tag 2,
  C an Tag 3, D an Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia hat den Artikel über die KI-Studie vollständig gelesen."
        answer: false
        why: 'Mia: „Ich bin nach dem zweiten Absatz ausgestiegen."'
      - q: 'Anna stört, dass man im Passivsatz nicht erfährt, wer etwas annimmt.'
        answer: true
        why: 'Anna: „wer nimmt denn da was an? Man erfährt es nie."'
      - q: 'Laut Bruno wird ein Passivsatz klarer, wenn man ihn auflöst.'
        answer: true
        why: 'Bruno: „Wenn du das Passiv auflöst, wird alles sofort klarer."'
      - q: "Das KI-Modell aus der Studie braucht mehr Daten als bisher."
        answer: false
        why: 'Bruno: „Das Modell lässt sich mit weniger Daten trainieren."'
      - q: 'Anna findet „lässt sich trainieren" angenehmer als „kann trainiert werden".'
        answer: true
        why: 'Anna: „lässt sich trainieren ist viel angenehmer als kann trainiert werden."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Woran wird in Frau Webers Labor geforscht?"
        options:
          - { key: a, text: "An einem neuen Material für Batterien." }
          - { key: b, text: "An einem neuen KI-Algorithmus." }
          - { key: c, text: "An einem Messgerät für Proben." }
        answer: a
        why: 'Frau Weber: „Bei uns wird ein neues Material für Batterien entwickelt."'
      - q: "Wie wird die Eigenschaft des Materials nachgewiesen?"
        options:
          - { key: a, text: "Der Versuch wird einmal durchgeführt." }
          - { key: b, text: "Proben werden getestet und der Versuch mehrfach wiederholt." }
          - { key: c, text: "Das Material wird direkt in der Industrie eingesetzt." }
        answer: b
        why: 'Frau Weber: „der Versuch muss mehrfach wiederholt werden, damit er als belegt gilt."'
      - q: "Ist das Material schon einsetzbar?"
        options:
          - { key: a, text: "Ja, es ist bereits im Einsatz." }
          - { key: b, text: "Nein, die Hypothese ist noch nicht vollständig zu beweisen." }
          - { key: c, text: "Ja, ab nächstem Monat." }
        answer: b
        why: 'Frau Weber: „sie ist noch nicht vollständig zu beweisen."'
      - q: "Was muss bei einer Veröffentlichung beachtet werden?"
        options:
          - { key: a, text: "Nur das Ergebnis muss genannt werden." }
          - { key: b, text: "Alle Quellen sind anzugeben und die Daten offenzulegen." }
          - { key: c, text: "Die Namen der Forscher dürfen nicht genannt werden." }
        answer: b
        why: 'Frau Weber: „Alle Quellen sind anzugeben, und die Daten müssen offengelegt werden."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Durchsage im Forschungszentrum"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und fülle die 7 Lücken. **Drei Wörter werden nicht gebraucht.**"
    text: |
      Liebe Kolleginnen und Kollegen, eine kurze Mitteilung aus dem Labor. Ab Montag wird ein neues
      Messverfahren {1}, mit dem sich die Reinheit der Proben genauer {2} lässt. Alle
      Proben sind vorher zu {3} und im Kühlraum zu {4}. Die Ergebnisse werden wie immer
      automatisch {5} und in der Datenbank {6}. Bitte beachten Sie: Vor jeder Messung
      muss das Gerät {7} werden. Bei Fragen wenden Sie sich bitte an die technische Leitung.
    bank: [eingeführt, bestimmen, beschriften, lagern, ausgewertet, gespeichert, kalibriert, entwickelt, gemessen, dokumentiert]
    answers:
      "1": eingeführt
      "2": bestimmen
      "3": beschriften
      "4": lagern
      "5": ausgewertet
      "6": gespeichert
      "7": kalibriert

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht der Projektleiterin"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör erst einmal zu, bevor du das Transkript unten liest."
    transcript: 'Hallo Bruno, hier ist Frau Weber aus dem Labor. Ich rufe wegen der Auswertung der Proben an. Die Daten sind inzwischen vollständig ausgewertet worden, und das Ergebnis ist sehr vielversprechend. Die Reinheit lässt sich mit dem neuen Verfahren tatsächlich genauer messen. Bevor wir die Studie veröffentlichen, müssen aber noch alle Quellen angegeben werden. Könntest du den Bericht bis Freitag fertigstellen? Bitte ruf mich zurück, wenn du Fragen hast. Vielen Dank und bis bald.'
    items:
      - q: "Warum ruft Frau Weber an?"
        options:
          - { key: a, text: "Wegen der Auswertung der Proben." }
          - { key: b, text: "Wegen eines neuen Experiments." }
          - { key: c, text: "Wegen eines Termins im Labor." }
        answer: a
        why: '„Ich rufe wegen der Auswertung der Proben an."'
      - q: "Wie ist das Ergebnis der Auswertung?"
        options:
          - { key: a, text: "Enttäuschend." }
          - { key: b, text: "Sehr vielversprechend." }
          - { key: c, text: "Noch unklar." }
        answer: b
        why: '„das Ergebnis ist sehr vielversprechend."'
      - q: "Was muss vor der Veröffentlichung noch passieren?"
        options:
          - { key: a, text: "Die Proben müssen neu getestet werden." }
          - { key: b, text: "Alle Quellen müssen angegeben werden." }
          - { key: c, text: "Das Verfahren muss kalibriert werden." }
        answer: b
        why: '„müssen aber noch alle Quellen angegeben werden."'
      - q: "Was soll Bruno bis Freitag tun?"
        options:
          - { key: a, text: "Die Proben kühlen." }
          - { key: b, text: "Das Labor öffnen." }
          - { key: c, text: "Den Bericht fertigstellen." }
        answer: c
        why: '„Könntest du den Bericht bis Freitag fertigstellen?"'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Vorgangspassiv bilden (Präsens)"
    instructions: "Setze das Verb in Klammern ins Vorgangspassiv Präsens (werden + Partizip II). 8 Items."
    text: |
      1. Die Proben {1} im Labor {2}. (untersuchen)
      2. Die Daten {3} automatisch {4}. (auswerten)
      3. Ein neues Verfahren {5} {6}. (entwickeln)
      4. Die Hypothese {7} im Experiment {8}. (überprüfen)
      5. Die Ergebnisse {9} in der Datenbank {10}. (speichern)
      6. Das Material {11} auf seine Eigenschaften hin {12}. (testen)
      7. Die Quellen {13} am Ende {14}. (angeben)
      8. Der Versuch {15} mehrfach {16}. (wiederholen)
    answers:
      "1": werden
      "2": untersucht
      "3": werden
      "4": ausgewertet
      "5": wird
      "6": entwickelt
      "7": wird
      "8": überprüft
      "9": werden
      "10": gespeichert
      "11": wird
      "12": getestet
      "13": werden
      "14": angegeben
      "15": wird
      "16": wiederholt

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv mit Modalverb"
    instructions: "Setze ins Passiv mit Modalverb (… muss/kann + Partizip II + werden). 6 Items."
    text: |
      1. Der Versuch {1} mehrfach {2} {3}. (müssen — wiederholen)
      2. Die Genauigkeit {4} deutlich {5} {6}. (können — steigern)
      3. Die Quellen {7} unbedingt {8} {9}. (müssen — angeben)
      4. Das Material {10} vollständig {11} {12}. (können — recyceln)
      5. Die Proben {13} sofort {14} {15}. (müssen — kühlen)
      6. Das Ergebnis {16} unterschiedlich {17} {18}. (können — deuten)
    answers:
      "1": muss
      "2": wiederholt
      "3": werden
      "4": kann
      "5": gesteigert
      "6": werden
      "7": müssen
      "8": angegeben
      "9": werden
      "10": kann
      "11": recycelt
      "12": werden
      "13": müssen
      "14": gekühlt
      "15": werden
      "16": kann
      "17": gedeutet
      "18": werden

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Passiversatz mit man"
    instructions: "Formuliere den Passivsatz mit man + Aktiv um. Schreib das Verb in der richtigen Form (3. Person Singular). 6 Items."
    text: |
      1. Die Daten werden ausgewertet. → Man {1} die Daten {2}.
      2. Ein Verfahren wird entwickelt. → Man {3} ein Verfahren.
      3. Die Hypothese wird überprüft. → Man {4} die Hypothese.
      4. Die Proben werden untersucht. → Man {5} die Proben.
      5. Das Ergebnis wird veröffentlicht. → Man {6} das Ergebnis.
      6. Die Genauigkeit kann gesteigert werden. → Man {7} die Genauigkeit {8}.
    answers:
      "1": wertet
      "2": aus
      "3": entwickelt
      "4": überprüft
      "5": untersucht
      "6": veröffentlicht
      "7": kann
      "8": steigern

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Passiversatz mit sich lassen"
    instructions: "Formuliere mit sich lassen + Infinitiv um (= kann … werden). Achte auf Singular/Plural von lassen. 6 Items."
    text: |
      1. Das Problem kann gelöst werden. → Das Problem {1} sich {2}.
      2. Die Genauigkeit kann gesteigert werden. → Die Genauigkeit {3} sich {4}.
      3. Das Material kann recycelt werden. → Das Material {5} sich {6}.
      4. Die Daten können gespeichert werden. → Die Daten {7} sich {8}.
      5. Der Versuch kann wiederholt werden. → Der Versuch {9} sich {10}.
      6. Die Reinheit kann gemessen werden. → Die Reinheit {11} sich {12}.
    answers:
      "1": lässt
      "2": lösen
      "3": lässt
      "4": steigern
      "5": lässt
      "6": recyceln
      "7": lassen
      "8": speichern
      "9": lässt
      "10": wiederholen
      "11": lässt
      "12": messen

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Passiversatz mit -bar"
    instructions: "Bilde aus dem Verb ein Adjektiv auf -bar (Verbstamm + bar). 6 Items."
    text: |
      1. lösen → Das Problem ist {1}.
      2. messen → Der Unterschied ist kaum {2}.
      3. recyceln → Das Material ist {3}.
      4. anwenden → Die Methode ist gut {4}.
      5. wiederholen → Der Versuch ist beliebig oft {5}.
      6. nachweisen → Die Wirkung ist klar {6}.
    answers:
      "1": lösbar
      "2": messbar
      "3": recycelbar
      "4": anwendbar
      "5": wiederholbar
      "6": nachweisbar

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Passiversatz mit sein + zu + Infinitiv"
    instructions: "Formuliere mit sein + zu + Infinitiv um. Achte bei trennbaren Verben auf an-zu-…, ein-zu-…. 6 Items."
    text: |
      1. Die Quellen müssen angegeben werden. → Die Quellen {1} {2}.
      2. Der Antrag muss eingereicht werden. → Der Antrag {3} {4}.
      3. Die Frist muss eingehalten werden. → Die Frist {5} {6}.
      4. Das Problem kann leicht gelöst werden. → Das Problem {7} leicht {8}.
      5. Die Hypothese kann kaum bewiesen werden. → Die Hypothese {9} kaum {10}.
      6. Die Proben müssen gekühlt werden. → Die Proben {11} {12}.
    answers:
      "1": sind
      "2": anzugeben
      "3": ist
      "4": einzureichen
      "5": ist
      "6": einzuhalten
      "7": ist
      "8": zu lösen
      "9": ist
      "10": zu beweisen
      "11": sind
      "12": zu kühlen

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "Nominalstil → Verbalstil: Nomen entpacken"
    instructions: "Finde das Verb im Nomen und schreib das passende Verb (Infinitiv). 6 Items."
    text: |
      1. die Auswertung der Daten → die Daten {1}
      2. die Entwicklung eines Verfahrens → ein Verfahren {2}
      3. die Steigerung der Genauigkeit → die Genauigkeit {3}
      4. die Veröffentlichung der Studie → die Studie {4}
      5. die Speicherung der Daten → die Daten {5}
      6. die Untersuchung der Proben → die Proben {6}
    answers:
      "1": auswerten
      "2": entwickeln
      "3": steigern
      "4": veröffentlichen
      "5": speichern
      "6": untersuchen

  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "Präposition + Nomen → Nebensatz (die acht Brücken)"
    instructions: "Wähle den passenden Konnektor für den Nebensatz. 6 Items."
    text: |
      1. wegen des hohen Verbrauchs → {1} der Verbrauch hoch ist
      2. zur Verbesserung der Erkennung → {2} die Erkennung zu verbessern
      3. nach der Prüfung der Proben → {3} man die Proben geprüft hat
      4. bei der Anwendung des Algorithmus → {4} man den Algorithmus anwendet
      5. durch den Einsatz von KI → {5} man KI einsetzt
      6. trotz der hohen Kosten → {6} die Kosten hoch sind
    answers:
      "1": weil
      "2": um
      "3": nachdem
      "4": wenn
      "5": indem
      "6": obwohl

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Wortschatz: Forschung und Technik"
    instructions: "Setze das passende Nomen mit Artikel ein (Nominativ). 6 Items."
    text: |
      1. Eine wissenschaftliche Vermutung, die man beweisen will, ist {1} (Hypothese).
      2. Das, was am Ende einer Studie herauskommt, ist {2} (Ergebnis).
      3. Eine kleine Menge eines Stoffes, die man testet, ist {3} (Probe).
      4. Künstliche Intelligenz arbeitet mit {4} (Algorithmus, Singular).
      5. Die Umwandlung der Welt ins Digitale heißt {5} (Digitalisierung).
      6. Wenn ein Produkt schonend für die Umwelt ist, spricht man von {6} (Nachhaltigkeit).
    answers:
      "1": die Hypothese
      "2": das Ergebnis
      "3": die Probe
      "4": dem Algorithmus
      "5": die Digitalisierung
      "6": der Nachhaltigkeit

  - id: A10
    block: A
    type: free-write
    title: "Vier Ersatzformen für einen Satz"
    prompt: "Formuliere den Passivsatz auf alle vier Arten um (man / sich lassen / -bar / sein + zu)."
    stimulus: |
      Grundsatz: „Das Problem kann gelöst werden."

      Schreib jetzt:
      1. mit man: ______________________
      2. mit sich lassen: ______________________
      3. mit -bar: ______________________
      4. mit sein + zu: ______________________

      Mach dasselbe mit: „Die Genauigkeit kann gemessen werden."
    model: |
      „Das Problem kann gelöst werden":
      1. Man kann das Problem lösen.
      2. Das Problem lässt sich lösen.
      3. Das Problem ist lösbar.
      4. Das Problem ist (leicht) zu lösen.

      „Die Genauigkeit kann gemessen werden":
      1. Man kann die Genauigkeit messen.
      2. Die Genauigkeit lässt sich messen.
      3. Die Genauigkeit ist messbar.
      4. Die Genauigkeit ist zu messen.

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Fachtext ergänzen: Eine Studie zur KI"
    instructions: "Fülle die 10 Lücken mit der passenden Form (Passiv oder Ersatzform, wie der Kontext verlangt). **Zwei Wörter werden nicht gebraucht.**"
    text: |
      In dieser Studie {1} ein neues KI-Modell untersucht. Die Daten {2}
      automatisch ausgewertet. Es zeigte sich: Die Genauigkeit {3} sich
      deutlich steigern. Das Modell ist außerdem mit weniger Daten {4} —
      ein klarer Vorteil. Vor einer Veröffentlichung {5} jedoch alle Quellen
      anzugeben. Die Ergebnisse {6} mehrfach überprüft werden, damit sie als
      belegt gelten. „Man {7} aus den Zahlen schließen, dass das Verfahren
      funktioniert", sagt die Forscherin. Eine baldige Anwendung {8} sich
      aber noch nicht sagen. Das Modell {9} erst, nachdem weitere Tests
      {10} worden sind.
    bank: [wird, werden, lässt, trainierbar, sind, müssen, kann, lässt, einsetzbar, durchgeführt, wurde, gemacht]
    answers:
      "1": wird
      "2": werden
      "3": lässt
      "4": trainierbar
      "5": sind
      "6": müssen
      "7": kann
      "8": lässt
      "9": einsetzbar
      "10": durchgeführt

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz enthält genau einen Fehler (Passiv, Passiversatz oder Nominalstil). Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Das Problem lässt lösen.
      2. Die Quellen sind angeben.
      3. Das Material ist recycelnbar.
      4. Man werden die Daten ausgewertet.
      5. Das Ergebnis ist gestern veröffentlicht.
      6. die Auswertung von den Daten
      7. wegen dem hohen Verbrauch
      8. Die Daten lässt sich speichern.
    model: |
      1. Das Problem lässt sich lösen. (Reflexivpronomen „sich" fehlt)
      2. Die Quellen sind anzugeben. („zu" fehlt: an-zu-geben)
      3. Das Material ist recycelbar. (Verbstamm + bar, nicht Infinitiv + bar)
      4. Man wertet die Daten aus. (man + Aktiv, nicht man + Passiv)
      5. Das Ergebnis ist gestern veröffentlicht worden. (Passiv Perfekt braucht „worden")
      6. die Auswertung der Daten (Genitiv nach dem Nomen, nicht „von den")
      7. wegen des hohen Verbrauchs („wegen" + Genitiv)
      8. Die Daten lassen sich speichern. (Plural-Subjekt → „lassen")

  - id: B3
    block: B
    type: matching
    title: "Passivsatz und Ersatzform verbinden"
    instructions: "Ordne jedem Passivsatz (1–6) die bedeutungsgleiche Ersatzform (a–f) zu."
    left:
      - { key: "1", text: "Das Problem kann gelöst werden." }
      - { key: "2", text: "Die Quellen müssen angegeben werden." }
      - { key: "3", text: "Die Daten werden automatisch ausgewertet." }
      - { key: "4", text: "Das Material kann recycelt werden." }
      - { key: "5", text: "Die Genauigkeit kann gesteigert werden." }
      - { key: "6", text: "Die Hypothese kann kaum bewiesen werden." }
    right:
      - { key: a, text: "Die Quellen sind anzugeben." }
      - { key: b, text: "Man wertet die Daten automatisch aus." }
      - { key: c, text: "Das Problem lässt sich lösen." }
      - { key: d, text: "Die Hypothese ist kaum zu beweisen." }
      - { key: e, text: "Das Material ist recycelbar." }
      - { key: f, text: "Die Genauigkeit lässt sich steigern." }
    answers:
      "1": c
      "2": a
      "3": b
      "4": e
      "5": f
      "6": d

  - id: B4
    block: B
    type: free-write
    title: "Nominalstil → Verbalstil umformen"
    prompt: "Mach aus jeder Nominalphrase einen Nebensatz oder Verbalsatz."
    stimulus: |
      1. wegen des hohen Energieverbrauchs
      2. zur Verbesserung der Erkennung
      3. nach der Auswertung der Daten
      4. bei der Anwendung des Verfahrens
      5. durch den Einsatz von KI
      6. trotz der hohen Kosten
    model: |
      1. weil der Energieverbrauch hoch ist
      2. um die Erkennung zu verbessern
      3. nachdem man die Daten ausgewertet hat
      4. wenn man das Verfahren anwendet
      5. indem man KI einsetzt
      6. obwohl die Kosten hoch sind

  - id: B5
    block: B
    type: free-write
    title: "Verbalstil → Nominalstil umformen"
    prompt: "Mach aus jedem Nebensatz eine Präposition + Nomen (Nominalstil)."
    stimulus: |
      1. Weil die Nachfrage gestiegen ist, …
      2. Um die Daten zu schützen, …
      3. Nachdem man den Antrag geprüft hatte, …
      4. Obwohl die Kosten hoch waren, …
      5. Wenn man sich anmeldet, …
      6. Indem man das Verfahren änderte, …
    model: |
      1. Wegen der gestiegenen Nachfrage …
      2. Zum Schutz der Daten …
      3. Nach der Prüfung des Antrags …
      4. Trotz der hohen Kosten …
      5. Bei der Anmeldung …
      6. Durch die Änderung des Verfahrens …

  - id: B6
    block: B
    type: free-write
    title: "Fachsatz zusammenfassen (Passiv + Nominalstil auflösen)"
    prompt: "Fasse jeden dichten Fachsatz in einem klaren, verbalen Satz zusammen (mit man oder Aktiv)."
    stimulus: |
      1. Es wird angenommen, dass die Effizienz gesteigert werden kann.
      2. Durch den Einsatz von KI wird die Erkennung von Mustern verbessert.
      3. Zur Überprüfung der Hypothese werden Versuche durchgeführt.
      4. Nach der Auswertung der Daten wurde das Ergebnis veröffentlicht.
      5. Wegen der hohen Kosten ist eine baldige Markteinführung nicht zu erwarten.
    model: |
      1. Man nimmt an, dass man die Effizienz steigern kann.
      2. Indem man KI einsetzt, verbessert man die Mustererkennung.
      3. Um die Hypothese zu überprüfen, führt man Versuche durch.
      4. Nachdem man die Daten ausgewertet hatte, veröffentlichte man das Ergebnis.
      5. Weil die Kosten hoch sind, kann man nicht mit einer baldigen Markteinführung rechnen.

  - id: B7
    block: B
    type: order
    title: "Satzbau: Passiv und Ersatzformen ordnen"
    prompt: "Bring die Wörter in die richtige Reihenfolge. Achte auf die Verbstellung."
    stimulus: |
      1. die / Daten / werden / automatisch / ausgewertet
      2. das / Material / lässt / sich / leicht / recyceln
      3. die / Quellen / sind / im / Text / anzugeben
