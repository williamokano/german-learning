  - id: B9
    block: B
    type: free-write
    title: "E-Mail: Stellungnahme zu einer Forschungsveröffentlichung"
    prompt: 'Eine Kollegin schickt dir diese Chatnachricht zu einem aktuellen Forschungsartikel. Antworte ihr in 5–6 Sätzen per E-Mail und formuliere bewusst formell mit Passiv und Nominalstil.'
    stimulus: |
      **Chatnachricht von Frau Yilmaz:**
      > Hallo, ich habe gerade den Artikel über die neue KI-Studie aus Heidelberg gelesen.
      > Können Sie mir kurz Ihre fachliche Meinung schreiben? Ist die Methodik wirklich sauber?
      > Und sind die Ergebnisse auf andere Bereiche übertragbar?
    use:
      - 'mindestens 3 Passiv-Konstruktionen (z. B. „die Studie wurde … durchgeführt", „die Daten wurden … erhoben")'
      - 'mindestens 1 nominalisierter Ausdruck (z. B. „die Durchführung der Studie", „die Erhebung der Daten")'
      - 'mindestens 2 FVG der Wissenschaft (z. B. „in Frage stellen", „zur Verfügung stellen", „eine Rolle spielen")'
      - '(B2/08) die Schlussformel „Für Rückfragen stehe ich Ihnen gern zur Verfügung"'
    selfCheck:
      - "Steht die finite Verbform im Passiv an Position 2?"
      - "Steht das Partizip II am Satzende?"
      - "Steht beim nominalisierten Verb ein Genitivattribut (die Durchführung der Studie)?"
      - "Habe ich die FVG der Wissenschaft korrekt mit festem Verb verwendet?"
    model: |
      Sehr geehrte Frau Yilmaz, vielen Dank für Ihre Nachricht. Ich möchte kurz auf
      den Artikel Bezug nehmen: Die Durchführung der Studie wurde im Methodenteil
      ausführlich beschrieben, und die Erhebung der Daten folgte einem klaren
      Protokoll. Trotzdem sollte die Größe der Stichprobe kritisch in Frage gestellt
      werden, denn sie spielt für die Übertragbarkeit der Ergebnisse eine zentrale
      Rolle. Ich gehe davon aus, dass die Folgestudie diese Einschränkung berücksichtigen
      wird. Sämtliche Originaldaten werden Open Access zur Verfügung gestellt, was
      eine unabhängige Überprüfung ermöglicht. Für Rückfragen stehe ich Ihnen gern
      zur Verfügung. Mit freundlichen Grüßen

  # ── Block C — Prüfungstraining ───────────────────────────────────────────

  - id: C1
    block: C
    type: gap-text
    listLayout: true
    title: "Lückentext: Wie ein Forschungsartikel entsteht (Lesetext)"
    instructions: "Füll jede Lücke mit einem Wort (Verb, Nomen oder Präposition). 10 Items."
    text: |
      Ein Forschungsartikel durchläuft einen strengen Prozess. Am Anfang steht eine
      Fragestellung: Was soll (1) {1} werden? Aus dieser Frage wird eine Hypothese
      abgeleitet — eine Annahme, die durch Versuche (2) {2} oder widerlegt werden
      kann. Dann wird die Methodik festgelegt: Wie viele Probanden werden (3) {3}
      die Studie einbezogen? Wie werden die Daten (4) {4}? Welche Verfahren werden
      angewendet, um Verzerrungen zu vermeiden? Nach der Durchführung der Versuche
      werden die Daten (5) {5}. Die Auswertung erfolgt heute fast immer
      computergestützt, oft (6) {6} Algorithmen der Künstlichen Intelligenz.
      Anschließend werden die Ergebnisse in einem Fachjournal zur Veröffentlichung
      (7) {7}. Vor der Veröffentlichung wird der Artikel von anderen Forschern
      geprüft. Diese Begutachtung (auf Englisch *peer review*) ist das Herzstück
      der wissenschaftlichen (8) {8}. Erst nach der Annahme des Manuskripts wird
      die Studie offiziell (9) {9}. Eine Hypothese gilt erst dann als gesichert,
      wenn sie durch mehrere unabhängige Studien (10) {10} wurde.
    answers:
      "1": untersucht
      "2": bestätigt
      "3": in
      "4": erhoben
      "5": ausgewertet
      "6": durch
      "7": eingereicht
      "8": Qualitätssicherung
      "9": veröffentlicht
      "10": bestätigt

