  - id: C5
    block: C
    type: free-write
    title: "Schreiben: Eine Studie zusammenfassen"
    prompt: "Fasse die folgende Mini-Studie in 6–8 Sätzen in klarer, verständlicher Sprache zusammen. Löse Passiv und Nominalstil so weit wie möglich auf."
    stimulus: |
