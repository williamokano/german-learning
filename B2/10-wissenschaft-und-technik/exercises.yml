      Studie (2) {2}. Die Daten (3) {3} über ein Jahr hinweg an 5 000 Probanden
      erhoben. Die Hypothese, dass KI die Diagnostik verbessern kann, (4) {4}
      durch die Ergebnisse bestätigt. Die Methodik (5) {5} von drei Gutachtern
      geprüft. Die Resultate (6) {6} anschließend in *Nature* veröffentlicht.
