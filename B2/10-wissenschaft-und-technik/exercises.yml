  - id: B5
    block: B
    type: gap-bank
    title: "Pressemitteilung ergänzen: Passiv und FVG"
    instructions: "Füll die 8 Lücken mit dem passenden Wort (finite Verbform oder Partizip II). Zwei Wörter sind zu viel."
    text: |
