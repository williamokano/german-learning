lesson: B2/10
title: "B2 · Lektion 10 — Übungen (Wissenschaft und Technik)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Die neue KI-Studie kommt laut Anna aus Heidelberg."
        answer: true
        why: 'Anna: „Über die neue KI-Studie aus Heidelberg".'
      - q: "Die Studie wurde laut Dialog von einem einzelnen Wissenschaftler durchgeführt."
        answer: false
        why: 'Anna: „von einem Team der Universität Heidelberg durchgeführt".'
      - q: "Die Daten wurden an über 10 000 Nutzern erhoben."
        answer: true
        why: 'Bruno: „dass die Daten an über 10 000 Nutzern erhoben wurden".'
      - q: "Bruno findet, dass eine einzelne Studie schon viel beweist."
        answer: false
        why: 'Bruno: „Eine einzelne Studie beweist noch lange nichts".'
      - q: "Anna findet es gut, dass die Studie Open Access zur Verfügung gestellt wird."
        answer: true
        why: 'Anna: „ich finde es gut, dass die Studie auch zur Verfügung gestellt wird, also Open Access".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: "Womit beschäftigt sich die Studie von Herrn Dr. Steinmeyer?"
        options:
          - { key: a, text: "Mit KI-gestützter Diagnostik." }
          - { key: b, text: "Mit klassischer Schulmedizin." }
          - { key: c, text: "Mit einer neuen App für Patienten." }
        answer: a
        why: 'Moderatorin: „In Ihrer Studie wurde die Wirksamkeit von KI-gestützter Diagnostik untersucht".'
      - q: "Wie viele Versuchsreihen wurden gemacht?"
        options:
          - { key: a, text: "Zwei." }
          - { key: b, text: "Drei." }
          - { key: c, text: "Fünf." }
        answer: b
        why: 'Dr. Steinmeyer: „Es wurden drei Versuchsreihen gemacht".'
      - q: "Welche Kritik wurde an der Studie geübt?"
        options:
          - { key: a, text: "Die Ergebnisse seien uninteressant." }
          - { key: b, text: "Die Stichprobe sei zu klein." }
          - { key: c, text: "Das Team sei zu groß." }
        answer: b
        why: 'Dr. Steinmeyer: „Vor allem an der Größe der Stichprobe".'
      - q: "Was wird mit den Originaldaten gemacht?"
        options:
          - { key: a, text: "Sie werden gelöscht." }
          - { key: b, text: "Sie werden Open Access zur Verfügung gestellt." }
          - { key: c, text: "Sie werden geheim gehalten." }
        answer: b
        why: 'Dr. Steinmeyer: „Sämtliche Daten werden dann wieder Open Access zur Verfügung gestellt".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Kurzinterview mit dem Forschungsleiter"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 7 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Guten Tag, Herr Dr. Steinmeyer. Sie sind Forschungsleiter am Institut für
      Digitalisierung. Können Sie uns kurz erklären, wie Ihre neue {1} durchgeführt
      wurde? Die Untersuchung wurde über ein Jahr hinweg an zweitausend {2}
      durchgeführt. Die {3} wurden in drei verschiedenen Kliniken erhoben und
      anschließend von zwei unabhängigen Teams ausgewertet. Die Ergebnisse wurden
      kürzlich in einem internationalen Fachjournal {4}. Wir gehen davon aus, dass
      die Folgestudie bis Ende des nächsten Jahres {5} wird. Sämtliche Originaldaten
      werden Open Access zur {6} gestellt. Vielen Dank für das Gespräch.
    bank: [Studie, Probanden, Daten, veröffentlicht, publiziert, Verfügung, Hypothese, Erkenntnis, Versuchsreihe]
    answers:
      "1": Studie
      "2": Probanden
      "3": Daten
      "4": veröffentlicht
      "5": publiziert
      "6": Verfügung

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage im Forschungskongress"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    optionLayout: block
    transcript: 'Achtung, eine Durchsage. Hier spricht die Kongressleitung. Wir möchten Sie darauf hinweisen, dass der Vortrag von Frau Professor Berger zum Thema „Anwendung von KI in der Krebsforschung" von Raum 201 in den größeren Hörsaal 304 verlegt wurde. Die Veröffentlichung der Kongressbeiträge wird heute Nachmittag um 15 Uhr Open Access zur Verfügung gestellt. Bitte beachten Sie, dass die Teilnehmerzahl begrenzt ist und eine Anmeldung erforderlich bleibt. Bei Rückfragen wenden Sie sich bitte an das Informationsbüro im Erdgeschoss. Vielen Dank für Ihre Aufmerksamkeit.'
    items:
      - q: "Worum geht es in der Durchsage?"
        options:
          - { key: a, text: "Um eine Verlegung eines Vortrags." }
          - { key: b, text: "Um eine Kongressabsage." }
          - { key: c, text: "Um eine neue Anmeldefrist." }
        answer: a
        why: '„der Vortrag von Frau Professor Berger … von Raum 201 in den größeren Hörsaal 304 verlegt wurde".'
      - q: "Wohin wurde der Vortrag verlegt?"
        options:
          - { key: a, text: "In den Hörsaal 201." }
          - { key: b, text: "In den Hörsaal 304." }
          - { key: c, text: "Ins Kongresszentrum nebenan." }
        answer: b
        why: '„von Raum 201 in den größeren Hörsaal 304 verlegt wurde".'
      - q: "Wann werden die Kongressbeiträge veröffentlicht?"
        options:
          - { key: a, text: "Morgen früh." }
          - { key: b, text: "Heute Nachmittag um 15 Uhr." }
          - { key: c, text: "Erst nächste Woche." }
        answer: b
        why: '„Die Veröffentlichung der Kongressbeiträge wird heute Nachmittag um 15 Uhr Open Access zur Verfügung gestellt".'
      - q: "Was müssen interessierte Teilnehmer tun?"
        options:
          - { key: a, text: "Sie müssen sich anmelden." }
          - { key: b, text: "Sie müssen eine Gebühr zahlen." }
          - { key: c, text: "Sie müssen den Vortrag vorbereiten." }
        answer: a
        why: '„eine Anmeldung erforderlich bleibt".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv Präsens: Verb → Passiv"
    instructions: "Schreib den Satz im Passiv Präsens (werden + Partizip II). 8 Items."
    text: |
      1. Jemand führt die Studie durch. → Die Studie {1} durchgeführt.
      2. Man erhebt die Daten. → Die Daten {2} erhoben.
      3. Jemand überprüft die Hypothese. → Die Hypothese {3} überprüft.
      4. Man wertet die Proben aus. → Die Proben {4} ausgewertet.
      5. Jemand veröffentlicht die Ergebnisse. → Die Ergebnisse {5} veröffentlicht.
      6. Man stellt die Daten zur Verfügung. → Die Daten {6} zur Verfügung gestellt.
      7. Jemand stellt die Hypothese in Frage. → Die Hypothese {7} in Frage gestellt.
      8. Man entwickelt ein neues Modell. → Ein neues Modell {8} entwickelt.
    answers:
      "1": wird
      "2": werden
      "3": wird
      "4": werden
      "5": werden
      "6": werden
      "7": wird
      "8": wird

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv Präteritum: Verb → Passiv"
    instructions: "Schreib den Satz im Passiv Präteritum (wurde/wurden + Partizip II). 8 Items."
    text: |
      1. Jemand führte die Studie durch. → Die Studie {1} durchgeführt.
      2. Man erhob die Daten. → Die Daten {2} erhoben.
      3. Jemand überprüfte die Hypothese. → Die Hypothese {3} überprüft.
      4. Man wertete die Proben aus. → Die Proben {4} ausgewertet.
      5. Jemand veröffentlichte die Ergebnisse. → Die Ergebnisse {5} veröffentlicht.
      6. Man stellte die Daten zur Verfügung. → Die Daten {6} zur Verfügung gestellt.
      7. Jemand stellte die Hypothese in Frage. → Die Hypothese {7} in Frage gestellt.
      8. Man entwickelte ein neues Modell. → Ein neues Modell {8} entwickelt.
    answers:
      "1": wurde
      "2": wurden
      "3": wurde
      "4": wurden
      "5": wurden
      "6": wurden
      "7": wurde
      "8": wurde

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv Perfekt: Verb → Passiv"
    instructions: "Schreib den Satz im Passiv Perfekt (ist/sind + Partizip II + worden). 8 Items."
    text: |
      1. Jemand hat die Studie durchgeführt. → Die Studie {1} durchgeführt worden.
      2. Man hat die Daten erhoben. → Die Daten {2} erhoben worden.
      3. Jemand hat die Hypothese überprüft. → Die Hypothese {3} überprüft worden.
      4. Man hat die Proben ausgewertet. → Die Proben {4} ausgewertet worden.
      5. Jemand hat die Ergebnisse veröffentlicht. → Die Ergebnisse {5} veröffentlicht worden.
      6. Man hat die Daten zur Verfügung gestellt. → Die Daten {6} zur Verfügung gestellt worden.
      7. Jemand hat die Hypothese in Frage gestellt. → Die Hypothese {7} in Frage gestellt worden.
      8. Man hat ein neues Modell entwickelt. → Ein neues Modell {8} entwickelt worden.
    answers:
      "1": ist
      "2": sind
      "3": ist
      "4": sind
      "5": sind
      "6": sind
      "7": ist
      "8": ist

  - id: A4
    block: A
    type: single-choice
    title: "Welche Zeitform passt?"
    instructions: "Wähle die passende Passivform (a, b oder c)."
    items:
      - q: "Die Studie ____ gerade durchgeführt."
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "wurde" }
          - { key: c, text: "ist … worden" }
        answer: a
        why: "Präsens: läuft gerade → wird durchgeführt."
      - q: "Die Daten ____ über ein Jahr hinweg erhoben."
        options:
          - { key: a, text: "werden" }
          - { key: b, text: "wurden" }
          - { key: c, text: "sind … worden" }
        answer: b
        why: "Präteritum: Bericht über die Vergangenheit → wurden erhoben."
      - q: "Die Ergebnisse ____ in *Nature* veröffentlicht worden."
        options:
          - { key: a, text: "sind" }
          - { key: b, text: "wurden" }
          - { key: c, text: "werden" }
        answer: a
        why: "Perfekt: sind + veröffentlicht + worden."
      - q: "Die Hypothese ____ in der nächsten Studie überprüft."
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "wurde" }
          - { key: c, text: "ist … worden" }
        answer: a
        why: "Präsens: zukünftiger Vorgang (Vorgangspassiv) → wird überprüft."
      - q: "Die Proben ____ im Labor ausgewertet."
        options:
          - { key: a, text: "wurden" }
          - { key: b, text: "sind … worden" }
          - { key: c, text: "werden" }
        answer: a
        why: "Präteritum: Bericht → wurden ausgewertet."
      - q: "Die Daten ____ Open Access zur Verfügung gestellt."
        options:
          - { key: a, text: "sind … worden" }
          - { key: b, text: "wurden" }
          - { key: c, text: "werden" }
        answer: b
        why: "Präteritum: Bericht über abgeschlossene Handlung → wurden gestellt."

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Verb → Nomen"
    instructions: "Schreib das passende Nomen (mit Artikel) zum Verb. 8 Items."
    text: |
      1. veröffentlichen → die {1}
      2. durchführen → die {2}
      3. untersuchen → die {3}
      4. auswerten → die {4}
      5. erheben (Daten) → die {5}
      6. überprüfen → die {6}
      7. widerlegen → die {7}
      8. bestätigen → die {8}
    answers:
      "1": Veröffentlichung
      "2": Durchführung
      "3": Untersuchung
      "4": Auswertung
      "5": Erhebung
      "6": Überprüfung
      "7": Widerlegung
      "8": Bestätigung

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Nominalstil mit Genitiv"
    instructions: "Ergänze das fehlende Nomen + Genitivattribut. ⚠️ Genitiv! 6 Items."
    text: |
      1. Die {1} (die Studie) wurde beschrieben.
      2. Die {2} (die Daten) dauerte ein Jahr.
      3. Die {3} (die Hypothese) ergab ein neues Resultat.
      4. Die {4} (die Ergebnisse) erfolgte im Juni.
      5. Die {5} (das Modell) verlief erfolgreich.
      6. Der {6} (die Wirksamkeit) gilt als erbracht.
    answers:
      "1": Durchführung der Studie
      "2": Erhebung der Daten
      "3": Überprüfung der Hypothese
      "4": Veröffentlichung der Ergebnisse
      "5": Test des Modells
      "6": Nachweis der Wirksamkeit

  - id: A7
    block: A
    type: gap-bank
    title: "Verb → Nomen → Passiv"
    instructions: "Füll die 6 Lücken mit der passenden Passivform. Zwei Wörter sind zu viel."
    text: |
      Die Studie (1) {1} von einem Heidelberger Team durchgeführt. Die Daten (2) {2}
      an über 10 000 Nutzern erhoben. Die Hypothese (3) {3} durch die Ergebnisse
      bestätigt. Die Ergebnisse (4) {4} in *Nature* veröffentlicht. Die Methodik
      (5) {5} von anderen Forschern in Frage gestellt. Die Originaldaten (6) {6}
      Open Access zur Verfügung gestellt.
    bank: [wurde, wurden, wurde, wurde, werden, wurden, sind, ist, wird]
    answers:
      "1": wurde
      "2": wurden
      "3": wurde
      "4": wurden
      "5": wurde
      "6": wurden

  - id: A8
    block: A
    type: matching
    title: "Verb und Nominalisierung verbinden"
    instructions: "Ordne jedem Verb (1–6) die passende Nominalisierung (a–f) zu."
    left:
      - { key: "1", text: "veröffentlichen" }
      - { key: "2", text: "durchführen" }
      - { key: "3", text: "widerlegen" }
      - { key: "4", text: "nachweisen" }
      - { key: "5", text: "patentieren" }
      - { key: "6", text: "auswerten" }
    right:
      - { key: a, text: "die Patentierung" }
      - { key: b, text: "die Veröffentlichung" }
      - { key: c, text: "die Auswertung" }
      - { key: d, text: "der Nachweis" }
      - { key: e, text: "die Widerlegung" }
      - { key: f, text: "die Durchführung" }
    answers:
      "1": b
      "2": f
      "3": e
      "4": d
      "5": a
      "6": c

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "von oder durch?"
    instructions: "Setze von oder durch ein. ⚠️ Personen/Institutionen → von + Dat.; Mittel/Ursachen → durch + Akk. 8 Items."
    text: |
      1. Die Studie wurde {1} einem Team durchgeführt.
      2. Die Daten wurden {2} ein automatisiertes Verfahren erhoben.
      3. Die Methodik wurde {3} drei Gutachtern geprüft.
      4. Die Schäden wurden {4} das Erdbeben verursacht.
      5. Die Forschung wird {5} das Bundesministerium gefördert.
      6. Das Ergebnis wurde {6} eine zweite Studie bestätigt.
      7. Die Hypothese wurde {7} vielen Forschern in Frage gestellt.
      8. Die Erkenntnis wurde {8} ein Experiment gewonnen.
    answers:
      "1": von
      "2": durch
      "3": von
      "4": durch
      "5": von
      "6": durch
      "7": von
      "8": durch

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "FVG im Satz (Wissenschaft)"
    instructions: "Setze das passende Funktionsverb ein (Infinitiv): durchführen, machen, stellen, gewinnen, erbringen, ziehen. 6 Items."
    text: |
      1. eine Studie {1} (nicht: machen)
      2. einen Versuch {2}
      3. eine Hypothese in Frage {3}
      4. eine Erkenntnis {4}
      5. einen Nachweis {5}
      6. etwas in Betracht {6}
    answers:
      "1": durchführen
      "2": machen
      "3": stellen
      "4": gewinnen
      "5": erbringen
      "6": ziehen

  - id: A11
    block: A
    type: order
    title: "Satzbau: Passiv im Hauptsatz"
    instructions: "Bring die Wörter in die richtige Reihenfolge. Im Passiv-Satz steht die finite Verbform (wurden/wurde) in Position 2."
    items:
      - tiles: [Die, Daten, wurden, über, ein, Jahr, hinweg, erhoben]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Die Daten wurden über ein Jahr hinweg erhoben"
      - tiles: [Die, Hypothese, wurde, durch, die, Studie, bestätigt]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Die Hypothese wurde durch die Studie bestätigt"
      - tiles: [Die, Originaldaten, wurden, Open, Access, zur, Verfügung, gestellt]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Die Originaldaten wurden Open Access zur Verfügung gestellt"
      - tiles: [Eine, neue, Studie, wurde, angekündigt]
        answer: [0, 1, 2, 3, 4]
        note: "Eine neue Studie wurde angekündigt"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: free-write
    title: "Aktiv → Passiv umformen"
    prompt: "Schreib jeden Satz im Passiv (Präteritum). Achtung: finite Form in Position 2, Partizip II am Satzende."
    stimulus: |
      1. Jemand hat die Studie durchgeführt.
      2. Man hat die Daten erhoben.
      3. Das Team hat die Hypothese überprüft.
      4. Die Forscher haben die Ergebnisse veröffentlicht.
      5. Andere Forscher haben die Methodik kritisiert.
      6. Man hat die Daten Open Access zur Verfügung gestellt.
    model: |
      1. Die Studie wurde durchgeführt.
      2. Die Daten wurden erhoben.
      3. Die Hypothese wurde von dem Team überprüft.
      4. Die Ergebnisse wurden von den Forschern veröffentlicht.
      5. Die Methodik wurde von anderen Forschern kritisiert.
      6. Die Daten wurden Open Access zur Verfügung gestellt.

  - id: B2
    block: B
    type: free-write
    title: "Aktiv → Passiv + Nominalstil umformen"
    prompt: "Schreib jeden Satz als Nominalstil + Passiv. Aus dem Verb wird ein Nomen mit Genitiv-Attribut."
    stimulus: |
      1. Man hat die Studie durchgeführt.
      2. Man hat die Daten erhoben.
      3. Man hat die Hypothese überprüft.
      4. Man hat die Ergebnisse veröffentlicht.
      5. Man hat das Modell getestet.
      6. Man hat die Wirksamkeit nachgewiesen.
    model: |
      1. Die Durchführung der Studie wurde beschrieben.
      2. Die Erhebung der Daten dauerte ein Jahr.
      3. Die Überprüfung der Hypothese ergab ein neues Resultat.
      4. Die Veröffentlichung der Ergebnisse erfolgte im Juni.
      5. Der Test des Modells verlief erfolgreich.
      6. Der Nachweis der Wirksamkeit gilt als erbracht.

  - id: B3
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz hat genau einen Fehler (Passiv, Genitiv, von/durch oder FVG). Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Die Daten wurden erhoben worden.
      2. Die Studie wurde durch der Universität Heidelberg durchgeführt.
      3. Die Durchführung von der Studie wurde beschrieben.
      4. Eine Studie wurde gemacht.
      5. Die Hypothese wurde in Frage gestellt von das Team.
      6. Die Daten wurden zu der Verfügung gestellt.
    model: |
      1. Die Daten wurden erhoben. (Präteritum Passiv: wurde/wurden + Partizip II — kein „worden")
      2. Die Studie wurde von der Universität Heidelberg durchgeführt. (Institution → von + Dat.)
      3. Die Durchführung der Studie wurde beschrieben. (Genitiv, nicht „von der")
      4. Eine Studie wurde durchgeführt. (festes Verb: durchführen, nicht machen)
      5. Die Hypothese wurde von dem Team in Frage gestellt. (von + Dat. mit Verschmelzung „vom")
      6. Die Daten wurden zur Verfügung gestellt. (feste Verschmelzung „zur Verfügung")

  - id: B4
    block: B
    type: single-choice
    title: "FVG der Wissenschaft"
    instructions: "Wähle das richtige feste Funktionsverb (a, b oder c). ⚠️ Nicht alles, was im Englischen mit „make“ geht, geht im Deutschen mit „machen“."
    items:
      - q: "eine Studie …"
        options:
          - { key: a, text: "machen" }
          - { key: b, text: "durchführen" }
          - { key: c, text: "nehmen" }
        answer: b
        why: "eine Studie durchführen (festes Verb)."
      - q: "einen Versuch …"
        options:
          - { key: a, text: "durchführen" }
          - { key: b, text: "machen" }
          - { key: c, text: "nehmen" }
        answer: b
        why: "einen Versuch machen (feste Verbindung)."
      - q: "eine Hypothese in Frage …"
        options:
          - { key: a, text: "machen" }
          - { key: b, text: "bringen" }
          - { key: c, text: "stellen" }
        answer: c
        why: "in Frage stellen (festes Verb)."
      - q: "einen Nachweis …"
        options:
          - { key: a, text: "machen" }
          - { key: b, text: "erbringen" }
          - { key: c, text: "nehmen" }
        answer: b
        why: "einen Nachweis erbringen (festes Verb)."
      - q: "Daten zur Verfügung …"
        options:
          - { key: a, text: "machen" }
          - { key: b, text: "bringen" }
          - { key: c, text: "stellen" }
