    bank: [wurde, durchgeführt, wurden, wurde, wurde, wurden, gestellt, gewonnen, publiziert]
    answers:
      "1": wurde
      "2": durchgeführt
      "3": wurden
      "4": wurde
      "5": wurde
      "6": wurden
      "7": wurden
      "8": gestellt

