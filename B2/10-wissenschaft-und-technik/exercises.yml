      - items: [veröffentlichen, durchführen, erheben, passen]
        odd: 3
        why: "passen ist kein typisches Forschungsverb; die anderen drei beschreiben wissenschaftliche Vorgänge."
      - items: [die Forschung, die Wissenschaft, die Studie, das Wetter]
        odd: 3
        why: "das Wetter ist kein Forschungsgebiet; die anderen drei sind Kernbegriffe der Wissenschaft."
      - items: [die Hypothese, das Ergebnis, die Erkenntnis, die Verfasserin]
        odd: 3
        why: "die Verfasserin ist eine Person, kein Forschungsbegriff."
      - items: [von + Dativ, durch + Akkusativ, aus + Dativ, mit + Dativ]
        odd: 2
        why: "aus + Dativ kennzeichnet Herkunft, nicht den Agenten im Passiv."
      - items: [die Hypothese in Frage stellen, die Daten zur Verfügung stellen, eine Studie durchführen, das Ergebnis bekommen]
