  - id: B9
    block: B
    type: free-write
    title: "Forenbeitrag: Wissenschaftssprache — zu kompliziert?"
    prompt: 'Schreib einen kurzen Forenbeitrag (5–6 Sätze) als Antwort auf den unten stehenden Beitrag. Sag deine Meinung dazu, ob Wissenschaftssprache zu kompliziert ist.'
    stimulus: |
      **Forenbeitrag** *(Forenbeitrag)*:
      > Nutzer „klartext87" schreibt: „Ich verstehe diese Forschungsberichte
      > einfach nicht mehr! Ständig „es wird angenommen", „die Probe wurde
      > untersucht". Warum schreibt niemand mehr klar und verständlich?
      > Müsste das nicht einfacher gehen?"
    use:
      - "mindestens 1 Satz mit sich lassen + Infinitiv (… lässt sich …)"
      - "mindestens 1 -bar- oder -lich-Adjektiv (verständlich, machbar, lösbar …)"
      - "mindestens 1 man-Satz (man kann/sollte …)"
      - "eine höfliche Schlussformel (Viele Grüße / Beste Grüße)"
    selfCheck:
      - "Steht bei `sich lassen` das `sich` und der Infinitiv am Satzende?"
      - "Hat mein -bar-Adjektiv den Verbstamm + bar (nicht den Infinitiv)?"
      - "Steht das Verb im man-Satz in der 3. Person Singular?"
    model: |
      Hallo klartext87, ich verstehe dein Problem gut. Vieles in der
      Wissenschaftssprache lässt sich tatsächlich einfacher sagen — statt
      „die Probe wurde untersucht" kann man auch „man hat die Probe
      untersucht" schreiben. Trotzdem ist diese Sprache nicht völlig
      unnötig: Sie macht Ergebnisse neutral und überprüfbar. Ein guter Text
      ist beides, präzise und verständlich. Man sollte also nicht das Passiv
      abschaffen, sondern es klüger einsetzen. Viele Grüße!

