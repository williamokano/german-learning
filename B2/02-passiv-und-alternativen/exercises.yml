lesson: B2/02
title: "B2 · Lektion 2 — Übungen (Passiv und seine Alternativen)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Lösungen in solutions.md.
  Tipp: Verteile die Blöcke über mehrere Tage — H und A an Tag 1, B an Tag 2,
  C an Tag 3, D an Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna hat den ganzen Vortrag problemlos verstanden."
        answer: false
        why: 'Anna: „Ich habe die Hälfte nicht verstanden, ehrlich gesagt."'
      - q: 'Lukas stört sich an Formulierungen wie „es wird angenommen“.'
        answer: true
        why: 'Lukas: „Ständig „es wird angenommen" … man erfährt nie, wer etwas annimmt."'
      - q: 'Bruno schlägt vor, „die Daten werden ausgewertet" durch „man wertet die Daten aus" zu ersetzen.'
        answer: true
        why: 'Bruno: „könnte man doch einfach sagen: „man wertet die Daten aus.""'
      - q: 'Laut Lukas bedeuten „lässt sich lösen", „ist lösbar" und „kann gelöst werden" dasselbe.'
        answer: true
        why: 'Lukas: „Drei Wege, eine Bedeutung."'
      - q: "Der neue Algorithmus lässt sich laut Lukas in zwei Wochen umsetzen."
        answer: false
        why: 'Lukas: „er ist nicht in zwei Wochen umzusetzen."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Was kritisiert Yusuf an Hannahs Entwurf?"
        options:
          - { key: a, text: "Er enthält fachliche Fehler." }
          - { key: b, text: "Er ist wegen zu vieler Passivformen schwer verständlich." }
          - { key: c, text: "Er ist zu kurz." }
        answer: b
        why: 'Yusuf: „Vor allem an der Häufung des Passivs … schwerfällig."'
      - q: 'Welche Form empfiehlt er für eine Vorschrift („etwas, das getan werden muss")?'
        options:
          - { key: a, text: "sich lassen + Infinitiv" }
          - { key: b, text: "ein -bar-Adjektiv" }
          - { key: c, text: "sein + zu + Infinitiv" }
        answer: c
        why: '„Dann bietet sich „sein + zu + Infinitiv" an: „die Quellen sind anzugeben"."'
      - q: 'Was ist der Unterschied zwischen „wird veröffentlicht" und „ist veröffentlicht"?'
        options:
          - { key: a, text: '„Wird“ ist der Vorgang, „ist“ das Ergebnis.' }
          - { key: b, text: "Beides bedeutet genau dasselbe." }
          - { key: c, text: '„Ist veröffentlicht“ ist grammatisch falsch.' }
        answer: a
        why: '„„Wird veröffentlicht" beschreibt den Vorgang … „ist veröffentlicht" beschreibt das Ergebnis."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 7 Lücken. **Drei Wörter werden nicht gebraucht.**"
    text: |
      Und nun zu den Wissenschaftsnachrichten. In einer neuen Studie ist
      {1} worden, wie sich Mikroplastik im Trinkwasser nachweisen {2}.
      Die Ergebnisse wurden gestern in einer Fachzeitschrift {3}.
      Nach Angaben der Forscher ist die neue Methode deutlich genauer und
      dazu leicht {4}. Kleinste Mengen, die früher kaum {5} waren,
      sind nun zuverlässig {6}. Die Proben sind dafür nur kurz
      aufzubereiten. Ob das Verfahren bald flächendeckend eingesetzt wird,
      ist allerdings noch offen — eine {7} der Behörden steht noch aus.
    bank: [untersucht, lässt, veröffentlicht, anzuwenden, messbar, erkennbar, Genehmigung, lösbar, wird, Vorschrift]
    answers:
      "1": untersucht
      "2": lässt
      "3": veröffentlicht
      "4": anzuwenden
      "5": messbar
      "6": erkennbar
      "7": Genehmigung

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage im Forschungszentrum"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Durchsage. Wähl dann die richtige Antwort (a, b oder c). Hör erst einmal, bevor du das Transkript liest."
    optionLayout: block
    transcript: 'Achtung, eine Durchsage für alle Mitarbeiterinnen und Mitarbeiter des Forschungszentrums. Das Hauptlabor wird heute zwischen 14 und 16 Uhr gereinigt und ist während dieser Zeit gesperrt. Laufende Versuche sind bis 13 Uhr zu beenden, alle Proben sind vorher sicher zu lagern. Der Zutritt ist erst ab 16 Uhr wieder gestattet. Bitte beachten Sie: Die neue Sicherheitsvorschrift ist ab Montag verbindlich. Vielen Dank.'
    items:
      - q: "Warum ist das Hauptlabor heute Nachmittag gesperrt?"
        options:
          - { key: a, text: "Weil es gereinigt wird." }
          - { key: b, text: "Weil ein Versuch durchgeführt wird." }
          - { key: c, text: "Weil die Heizung repariert wird." }
        answer: a
        why: '„Das Hauptlabor wird heute zwischen 14 und 16 Uhr gereinigt."'
      - q: "Was ist mit den Proben zu tun?"
        options:
          - { key: a, text: "Sie sind zu entsorgen." }
          - { key: b, text: "Sie sind vorher sicher zu lagern." }
          - { key: c, text: "Sie sind ins Hauptlabor zu bringen." }
        answer: b
        why: '„alle Proben sind vorher sicher zu lagern."'
      - q: "Ab wann ist der Zutritt wieder erlaubt?"
        options:
          - { key: a, text: "Ab 13 Uhr." }
          - { key: b, text: "Ab 14 Uhr." }
          - { key: c, text: "Ab 16 Uhr." }
        answer: c
        why: '„Der Zutritt ist erst ab 16 Uhr wieder gestattet."'
      - q: "Was gilt ab Montag?"
        options:
          - { key: a, text: "Eine neue Sicherheitsvorschrift." }
          - { key: b, text: "Neue Öffnungszeiten." }
          - { key: c, text: "Ein Rauchverbot." }
        answer: a
        why: '„Die neue Sicherheitsvorschrift ist ab Montag verbindlich."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv → man + Aktiv"
    instructions: "Schreib den Passivsatz mit `man` + Aktiv um. Trag die fehlende Verbform ein. 6 Items."
    text: |
      1. Die Daten werden ausgewertet. → Man {1} die Daten aus. (auswerten)
      2. Hier wird viel diskutiert. → Hier {2} man viel. (diskutieren)
      3. Das darf nicht vergessen werden. → Das {3} man nicht vergessen. (dürfen)
      4. Die Probe wird untersucht. → Man {4} die Probe. (untersuchen)
      5. Der Antrag muss eingereicht werden. → Den Antrag {5} man einreichen. (müssen)
      6. Diese Methode wird kaum noch angewendet. → Diese Methode {6} man kaum noch an. (anwenden)
    answers:
      "1": wertet
      "2": diskutiert
      "3": darf
      "4": untersucht
      "5": muss
      "6": wendet

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "sich lassen + Infinitiv"
    instructions: "Form die Sätze mit `sich lassen` um. Trag die richtige Form von `lassen` + Reflexivpronomen ein. 6 Items."
    text: |
      1. Das Problem kann gelöst werden. → Das Problem {1} sich lösen.
      2. Die Daten können gespeichert werden. → Die Daten {2} sich speichern. (Plural!)
      3. Die Frage konnte nicht beantwortet werden. → Die Frage {3} sich nicht beantworten. (Präteritum)
      4. Der Fehler kann schnell gefunden werden. → Der Fehler {4} sich schnell finden.
      5. Die Hypothese konnte nicht bestätigt werden. → Die Hypothese {5} sich nicht bestätigen. (Präteritum)
      6. Solche Ergebnisse können kaum verglichen werden. → Solche Ergebnisse {6} sich kaum vergleichen. (Plural!)
    answers:
      "1": lässt
      "2": lassen
      "3": ließ
      "4": lässt
      "5": ließ
      "6": lassen

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "-bar-Adjektive bilden"
    instructions: "Bilde aus dem Verb in Klammern ein `-bar`-Adjektiv (prädikativ, ohne Endung). 6 Items."
    text: |
      1. Die Aufgabe ist {1}. (lösen)
      2. Das Ziel ist durchaus {2}. (machen)
      3. Diese Pilze sind nicht {3}. (essen)
      4. Der Unterschied ist kaum {4}. (messen)
      5. Der Fehler war von Anfang an {5}. (erkennen)
      6. Das Ergebnis ist klar {6}. (belegen)
    answers:
      "1": lösbar
      "2": machbar
      "3": essbar
      "4": messbar
      "5": erkennbar
      "6": belegbar

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "sein + zu + Infinitiv"
    instructions: "Form mit `sein + zu + Infinitiv` um. Achte auf trennbare Verben (Vorsilbe + zu + Stamm). 6 Items."
    text: |
      1. Die Quellen müssen angegeben werden. → Die Quellen sind {1}. (angeben)
      2. Der Antrag muss eingereicht werden. → Der Antrag ist {2}. (einreichen)
      3. Diese Vorschrift muss beachtet werden. → Diese Vorschrift ist {3}. (beachten)
      4. Das Problem kann leicht gelöst werden. → Das Problem ist leicht {4}. (lösen)
      5. Die Hypothese kann kaum bewiesen werden. → Die Hypothese ist kaum {5}. (beweisen)
      6. Die Frist muss eingehalten werden. → Die Frist ist {6}. (einhalten)
    answers:
      "1": anzugeben
      "2": einzureichen
      "3": zu beachten
      "4": zu lösen
      "5": zu beweisen
      "6": einzuhalten

  - id: A5
    block: A
    type: single-choice
    title: "Vorgang oder Zustand? wird oder ist"
    instructions: "Vorgang (werden) oder Zustand (sein)? Wähl die passende Form."
    items:
      - q: "Achtung, das Tor (1) ____ jetzt geschlossen! (Handlung läuft gerade)"
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "ist" }
        answer: a
        why: "Die Handlung läuft gerade ab → Vorgangspassiv (werden)."
      - q: "Komm rein, die Tür (2) ____ schon geöffnet. (Resultat)"
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "ist" }
        answer: b
        why: "Fertiger Zustand → Zustandspassiv (sein)."
      - q: "Die Probe (3) ____ gerade analysiert. (es passiert jetzt)"
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "ist" }
        answer: a
        why: "Handlung läuft → Vorgangspassiv."
      - q: "Der Antrag (4) ____ schon genehmigt, du kannst loslegen. (Ergebnis)"
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "ist" }
        answer: b
        why: "Fertiges Ergebnis → Zustandspassiv."
      - q: "Vorsicht, der Boden (5) ____ gerade gewischt. (Handlung)"
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "ist" }
        answer: a
        why: "Handlung läuft → Vorgangspassiv."
      - q: "Schau, das Fenster (6) ____ jetzt sauber, es ist schon geputzt. (Zustand)"
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "ist" }
        answer: b
        why: "Resultat → Zustandspassiv (hier sogar nur Kopula + Adjektiv/Partizip)."

  - id: A6
    block: A
    type: matching
    title: "Passiversatz: gleiche Bedeutung verbinden"
    instructions: "Verbinde jeden Passivsatz (1–6) mit der bedeutungsgleichen Ersatzform (a–h). Zwei Antworten bleiben übrig."
    left:
      - { key: "1", text: "Das Problem kann gelöst werden." }
      - { key: "2", text: "Die Quellen müssen angegeben werden." }
      - { key: "3", text: "Die Daten werden ausgewertet." }
      - { key: "4", text: "Der Text kann gut verstanden werden." }
      - { key: "5", text: "Der Versuch kann wiederholt werden." }
      - { key: "6", text: "Der Antrag muss eingereicht werden." }
    right:
      - { key: a, text: "Das Problem ist lösbar." }
      - { key: b, text: "Die Quellen sind anzugeben." }
      - { key: c, text: "Man wertet die Daten aus." }
      - { key: d, text: "Der Text ist gut verständlich." }
      - { key: e, text: "Der Versuch lässt sich wiederholen." }
      - { key: f, text: "Der Antrag ist einzureichen." }
      - { key: g, text: "Das Problem ist unlösbar." }
      - { key: h, text: "Die Daten sind verloren." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "man-Sätze: 3. Person Singular"
    instructions: "Trag die richtige Form ein. ⚠️ `man` steht immer in der 3. Person Singular. 6 Items."
    text: |
      1. In der Schweiz {1} (sprechen) man vier Sprachen.
      2. Wie {2} (schreiben) man dieses Wort?
      3. Bei der Behörde {3} (müssen) man lange warten.
      4. Aus den Zahlen {4} (können) man schließen, dass die Methode funktioniert.
      5. In diesem Labor {5} (untersuchen) man Proben.
      6. Sonntags {6} (arbeiten) man in Deutschland normalerweise nicht.
    answers:
      "1": spricht
      "2": schreibt
      "3": muss
      "4": kann
      "5": untersucht
      "6": arbeitet

  - id: A8
    block: A
    type: order
    title: "Satzbau: sich lassen und sein + zu"
    prompt: "Ordne die Wörter zu einem korrekten Satz."
    stimulus: |
      1. das / Problem / sich / lässt / leicht / lösen
      2. die / Quellen / sind / anzugeben
      3. der / Versuch / lässt / sich / wiederholen
      4. der / Antrag / ist / bis / Freitag / einzureichen
    items:
      - tiles: [Das, Problem, lässt, sich, leicht, lösen]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Das Problem lässt sich leicht lösen."
      - tiles: [Die, Quellen, sind, anzugeben]
        answer: [0, 1, 2, 3]
        note: "Die Quellen sind anzugeben."
      - tiles: [Der, Versuch, lässt, sich, wiederholen]
        answer: [0, 1, 2, 3, 4]
        note: "Der Versuch lässt sich wiederholen."
      - tiles: [Der, Antrag, ist, bis, Freitag, einzureichen]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Der Antrag ist bis Freitag einzureichen."

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "-bar-Adjektive attributiv (mit Endung)"
    instructions: "Setz das `-bar`-Adjektiv vor das Nomen — mit der richtigen Endung. 5 Items."
    text: |
      1. eine {1} Aufgabe (lösbar, Nom. fem.)
      2. ein gut {2} Bericht (lesbar, Nom. mask.)
      3. ein kaum {3} Unterschied (messbar, Nom. mask.)
      4. eine deutlich {4} Veränderung (erkennbar, Nom. fem.)
      5. eine {5} Methode (anwendbar, Nom. fem.)
    answers:
      "1": lösbare
      "2": lesbarer
      "3": messbarer
      "4": erkennbare
      "5": anwendbare

  - id: A10
    block: A
    type: free-write
    title: "Vier Wege, eine Bedeutung"
    prompt: "Schreib für jeden Passivsatz drei Ersatzformen: mit man, mit sich lassen und mit -bar."
    stimulus: |
      Beispiel: „Das Problem kann gelöst werden."
      → Man kann das Problem lösen. / Das Problem lässt sich lösen. / Das Problem ist lösbar.

      Jetzt du:
      1. „Die Aufgabe kann gemacht werden."
      2. „Der Fehler kann erkannt werden."
    model: |
      1. Man kann die Aufgabe machen. / Die Aufgabe lässt sich machen. /
         Die Aufgabe ist machbar.
      2. Man kann den Fehler erkennen. / Der Fehler lässt sich erkennen. /
         Der Fehler ist erkennbar.

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Wissenschaftstext ergänzen"
    instructions: "Füll die 8 Lücken mit der passenden Form aus dem Wortkasten. **Zwei Wörter werden nicht gebraucht.**"
    text: |
      Im Labor {1} jeden Tag viele Versuche durchgeführt. Anschließend
      {2} man die Daten aus. Erst wenn die Ergebnisse überprüfbar sind,
      {3} sich ein Fachartikel schreiben. Alle Quellen {4} anzugeben,
      und jede Behauptung ist zu {5}. Bevor der Artikel veröffentlicht
      {6}, prüfen Fachleute, ob die Schlüsse {7} sind. Eine gute Studie
      muss vor allem {8} sein.
    bank: [werden, wertet, lässt, sind, belegen, wird, nachvollziehbar, verständlich, machbar, müssen]
    answers:
      "1": werden
      "2": wertet
      "3": lässt
      "4": sind
      "5": belegen
      "6": wird
      "7": nachvollziehbar
      "8": verständlich

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz enthält genau einen Fehler. Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Das Problem lässt leicht lösen.
      2. Man machen das in Deutschland anders.
      3. Die Aufgabe ist lösenbar.
      4. Die Quellen sind angeben.
      5. Die Tür ist gerade geschlossen. (gemeint: die Handlung läuft jetzt)
      6. Die Daten lässt sich speichern.
      7. Der Antrag ist zu einreichen.
      8. Die Studie ist gestern veröffentlicht.
    model: |
      1. Das Problem lässt SICH leicht lösen. (Reflexivpronomen `sich` fehlt)
      2. Man MACHT das in Deutschland anders. (man + 3. Pers. Sg.)
      3. Die Aufgabe ist LÖSBAR. (Verbstamm + bar, nicht Infinitiv + bar)
      4. Die Quellen sind ANZUGEBEN. (sein + zu + Infinitiv: an-zu-geben)
      5. Die Tür WIRD gerade geschlossen. (Vorgang → werden, nicht sein)
      6. Die Daten LASSEN sich speichern. (Plural-Subjekt → lassen)
      7. Der Antrag ist EINZUREICHEN. (zu rutscht in die Mitte: ein-zu-reichen)
      8. Die Studie ist gestern veröffentlicht WORDEN. (Passiv Perfekt braucht `worden`)

  - id: B3
    block: B
    type: matching
    title: "sein + zu: müssen oder können?"
    instructions: "Ordne jedem Satz (1–6) die richtige Bedeutung zu (a oder b). Jede Bedeutung kommt mehrmals vor."
    left:
      - { key: "1", text: "Die Quellen sind anzugeben." }
      - { key: "2", text: "Das Problem ist leicht zu lösen." }
      - { key: "3", text: "Der Antrag ist bis Freitag einzureichen." }
      - { key: "4", text: "Die Hypothese ist kaum zu beweisen." }
      - { key: "5", text: "Diese Vorschrift ist unbedingt zu beachten." }
      - { key: "6", text: "Die Folgen sind noch nicht abzuschätzen." }
    right:
      - { key: a, text: "= muss/müssen … werden (Notwendigkeit)" }
      - { key: b, text: "= kann/können … werden (Möglichkeit)" }
    answers:
      "1": a
      "2": b
      "3": a
      "4": b
      "5": a
      "6": b

  - id: B4
    block: B
    type: free-write
    title: "Passiv ↔ Ersatzform umformen"
    prompt: "Form jeden Satz in die in Klammern genannte Ersatzform um."
    stimulus: |
      1. Hier wird nicht geraucht. (→ mit man)
      2. Der Versuch kann wiederholt werden. (→ mit sich lassen)
      3. Die Aufgabe kann gemacht werden. (→ mit -bar)
      4. Die Frist muss eingehalten werden. (→ mit sein + zu)
      5. Man kann das Ergebnis messen. (→ ins Passiv mit Modalverb)
      6. Das lässt sich nicht beweisen. (→ mit -bar, verneint)
    model: |
      1. Hier raucht man nicht.
      2. Der Versuch lässt sich wiederholen.
      3. Die Aufgabe ist machbar.
      4. Die Frist ist einzuhalten.
      5. Das Ergebnis kann gemessen werden.
      6. Das ist nicht beweisbar.

  - id: B5
    block: B
    type: gap-text
    listLayout: true
    title: "Vorgang vs. Zustand im Kontext"
    instructions: "Setz `wird`/`werden` (Vorgang) oder `ist`/`sind` (Zustand) ein. 6 Items."
    text: |
      1. Bitte warten Sie — der Bericht {1} gerade geprüft. (Handlung)
      2. Der Bericht {2} schon fertig; er {3} bereits genehmigt. (Zustand, 2×)
      3. Das Labor {4} jeden Morgen um 8 Uhr geöffnet. (Vorgang, regelmäßig)
      4. Vorsicht, die Proben {5} gerade analysiert. (Handlung, Plural)
      5. Die Tür {6} schon geschlossen, wir kommen nicht mehr rein. (Zustand)
    answers:
      "1": wird
      "2": ist
      "3": ist
      "4": wird
      "5": werden
      "6": ist

  - id: B6
    block: B
    type: odd-one-out
    title: "Was passt nicht?"
    instructions: "Streiche das Wort, das nicht passt, und erkläre warum."
    groups:
      - items: [lösbar, machbar, dankbar, messbar]
        odd: 2
        why: 'dankbar ist kein Passiversatz (≠ „kann gedankt werden“); die anderen bedeuten „kann ge…t werden“.'
      - items: [Forschung, Untersuchung, Auswertung, Genehmigung]
        odd: 3
        why: "Genehmigung gehört zur Amts-/Vorschriftensprache; die anderen drei zur Forschung."
      - items: [Vorschrift, Pflicht, Verbot, Beweis]
        odd: 3
        why: "Beweis gehört zur Forschung; die anderen drei zur Vorschriften-/Amtssprache."
      - items: [lässt sich lösen, ist lösbar, kann gelöst werden, ist gelöst]
        odd: 3
        why: '„ist gelöst“ ist Zustandspassiv (Ergebnis); die anderen drei drücken Möglichkeit (können + Passiv) aus.'

  - id: B7
    block: B
    type: gap-text
    listLayout: true
    title: "Nominalstil → Verbalstil (Wdh. B2/01) mit Passiversatz"
    instructions: "Wandle die Nominalphrase in einen Verbalstil-Satz um, indem du die Lücke füllst. 5 Items."
    text: |
