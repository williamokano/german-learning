# Reviewed from B2/02 lesson.md §4 Wortschatz.
# Note: V3's noun-verb-pair table kind correctly extracted both noun+verb members
# of every row. One parser hiccup found (not yet fixed, hand-corrected here): when
# the verb cell carries a trailing "⚠️ (sep.)" or "⚠️ (bewies, bewiesen)" annotation,
# the annotation's paren gets misread as the verb's own English gloss ("sep.",
# "bewies, bewiesen") INSTEAD of falling through to the real English column — since
# the noun-verb-pair fallback only applies the shared meaning cell when `en` is
# still empty, and the annotation paren is (wrongly) treated as non-empty content.
# All such glosses replaced with the correct English translation by hand below.
#
# Section headers in lesson.md:
#   Wissenschaft und Forschung (research)         — 10 verb+noun pairs (20 entries)
#   Nachrichten und Vorschriften (regulations)    — 7 verb+noun pairs (14) + 1 solo noun
#   Adjektive der Möglichkeit (Passiversatz)      — 7 adjectives (können + Passiv shorthand)
