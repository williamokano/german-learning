    model: |
      Stellungnahme zum Vorschlag der neuen Arbeitszeitregelung.
      Zunächst möchte ich Bezug auf den letzten Bericht der Personalabteilung nehmen.
      Inhaltlich überzeugt der Vorschlag, dennoch möchte ich an einem Punkt Kritik üben:
      Die kurze Übergangsfrist kommt für viele Abteilungen kaum in Frage. Die
      Geschäftsführung sollte deshalb eine längere Frist in Betracht ziehen. Auch der
      Schulungsbedarf spielt eine große Rolle und darf nicht in Frage gestellt werden.
      Höhere Anfangskosten würden wir dafür in Kauf nehmen. Bevor wir am Freitag eine
      endgültige Entscheidung treffen, sollten alle Unterlagen den Beteiligten zur
      Verfügung stehen. Meine Empfehlung: Wir sollten die Regelung schrittweise einführen,
      weil das den Mitarbeitern mehr Zeit gibt und die Akzeptanz erhöht. Für Rückfragen
      stehe ich Ihnen gern zur Verfügung.

