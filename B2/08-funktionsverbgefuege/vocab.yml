# Reviewed from B2/08 lesson.md §4 Wortschatz.
# Note: table 1 (Funktionsverbgefüge | feste Präposition/Kasus | = Vollverb) lists
# fixed support-verb constructions. Per the lesson's own Lerntipp ("Lern ein FVG
# NIEMALS als einzelnes Wort, sondern immer als GANZEN BLOCK"), the whole phrase is
# the vocabulary unit — captured as core:true phrase entries, with the equivalent
# simple verb + fixed preposition noted in `example:` rather than split into
# separate headwords. Table 2 (German Erklärung) hand-translated.
#
# Section headers in lesson.md:
#   Funktionsverben und ihre Nomen   — 11 fixed FVG phrases
#   Nomen mit fester Form            — 10 nouns (2 are FVG-only: Betracht, Verfügung)
lesson: B2/08

entries:
