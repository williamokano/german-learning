      - { key: b, text: "nachdem die Sitzung zu Ende war" }
      - { key: c, text: "weil ein Sturm kam" }
      - { key: d, text: "um sich auf die Prüfung vorzubereiten" }
      - { key: e, text: "wenn man sich anmeldet" }
      - { key: f, text: "indem man trainierte" }
    answers:
      "1": c
      "2": a
      "3": e
      "4": b
      "5": f
      "6": d

  - id: B5
    block: B
    type: gap-bank
    title: "Bericht ergänzen: Nominalstil"
    instructions: "Füll die 8 Lücken mit der passenden Präposition. Zwei Wörter sind zu viel."
    text: |
      Bericht des Projektteams: {1} der Analyse des Marktes hat das Team mehrere Probleme
