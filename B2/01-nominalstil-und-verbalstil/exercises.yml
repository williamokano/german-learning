    type: free-write
    title: "E-Mail: Einen Amtssatz für einen Freund übersetzen"
    prompt: 'Ein Freund schickt dir diese WhatsApp und versteht den Satz vom Amt nicht. Antworte ihm in 5–6 Sätzen und erkläre den Satz in einfachem Deutsch (Verbalstil).'
    stimulus: |
      **WhatsApp-Nachricht von Tomáš:**
      > Hey, ich hab einen Brief vom Amt bekommen und versteh ihn nicht. Da steht:
      > „Bei Nichtvorlage der erforderlichen Unterlagen bis zum Fristende erfolgt eine
      > Ablehnung des Antrags." Kannst du mir das auf normales Deutsch übersetzen?
    use:
      - "mindestens 2 Sätze, die den Amtssatz im Verbalstil erklären (mit wenn/weil + Nebensatz)"
      - "mindestens 1 Satz mit dem versteckten Verb (vorlegen, ablehnen)"
      - '1 freundlicher Tipp, wie man Behördendeutsch knackt (z. B. „such das Verb im Nomen")'
      - "eine freundliche Schlussformel (Liebe Grüße / Bis bald)"
    selfCheck:
      - "Steht das Verb in jedem Nebensatz (wenn, weil) am Ende?"
      - "Habe ich aus den Nomen (Vorlage, Ablehnung) wieder Verben gemacht?"
      - "Ist meine Erklärung wirklich im Verbalstil (Verben statt Nomen)?"
    model: |
      Hey Tomáš! Kein Problem, das ist nur Behördendeutsch. Der Satz heißt eigentlich
      einfach: Wenn du die nötigen Unterlagen nicht bis zum Fristende vorlegst, dann
      lehnt das Amt deinen Antrag ab. „Die Vorlage" kommt von „vorlegen" und „die
      Ablehnung" von „ablehnen" — du musst nur das versteckte Verb im Nomen suchen,
      dann wird der Satz sofort klar. Mein Tipp: Lies jeden Amtssatz so, als müsstest
      du ihn einem Kind erklären. Liebe Grüße und melde dich, wenn noch was unklar ist!

