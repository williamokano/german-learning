      "2": Wegen
      "3": Trotz
      "4": Nach
      "5": Durch
      "6": Zur
      "7": Nach
      "8": Während

  - id: B6
    block: B
    type: order
    title: "Satzbau: Nominal-Hauptsatz richtig stellen"
    instructions: "Bring die Wörter in die richtige Reihenfolge. Die Nominalphrase steht in Position 1, das Verb in Position 2."
    items:
      - tiles: [Wegen, des, Regens, fiel, das, Spiel, aus]
