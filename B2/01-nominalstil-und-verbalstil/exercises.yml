lesson: B2/01
title: "B2 · Lektion 1 — Übungen (Nominalstil und Verbalstil)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna hat einen Brief vom Bürgeramt bekommen."
        answer: true
        why: 'Anna: „Ich habe einen Brief vom Bürgeramt bekommen".'
      - q: "Bruno sagt, der Brief sei in einfacher Sprache geschrieben."
        answer: false
        why: 'Bruno: „typisches Behördendeutsch" — also gerade nicht einfach.'
      - q: "Bruno erklärt, dass Ämter den Nominalstil lieben."
        answer: true
        why: 'Bruno: „Weil Ämter den Nominalstil lieben. Sie machen aus Verben Nomen".'
      - q: "Brunos Trick ist, das versteckte Verb im Nomen zu suchen."
        answer: true
        why: 'Bruno: „Such immer das versteckte Verb, dann wird der Satz sofort klarer".'
      - q: 'Anna versteht am Ende den Satz „Nach Prüfung Ihres Antrags" immer noch nicht.'
        answer: false
        why: 'Bruno übersetzt ihn, und Anna sagt: „Das ist eigentlich ein guter Trick".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: "Wie findet Frau Yilmaz den Bericht von Herrn Steinmeyer?"
        options:
          - { key: a, text: "Inhaltlich schlecht, aber stilistisch gut." }
          - { key: b, text: "Inhaltlich überzeugend, aber stilistisch noch nicht fertig." }
          - { key: c, text: "Komplett fertig." }
        answer: b
        why: 'Frau Yilmaz: „Inhaltlich überzeugend, aber stilistisch noch nicht ganz fertig".'
      - q: "Was soll Herr Steinmeyer ändern?"
        options:
          - { key: a, text: "Er soll nominaler und kompakter formulieren." }
          - { key: b, text: 'Er soll mehr Nebensätze mit „weil" schreiben.' }
          - { key: c, text: "Er soll den Bericht kürzer machen." }
        answer: a
        why: 'Frau Yilmaz schlägt vor: „Durch die Veränderung des Verfahrens konnten die Kosten gesenkt werden" — also Nominalstil.'
      - q: 'Was wird aus „obwohl die Nachfrage gestiegen ist"?'
        options:
          - { key: a, text: "wegen steigender Nachfrage" }
          - { key: b, text: "trotz steigender Nachfrage" }
          - { key: c, text: "während steigender Nachfrage" }
        answer: b
        why: 'Frau Yilmaz: „daraus machen Sie besser „trotz steigender Nachfrage" — obwohl ↔ trotz.'
      - q: "Welchen Stil empfiehlt Frau Yilmaz am Ende?"
        options:
          - { key: a, text: "Nur Nominalstil im ganzen Bericht." }
          - { key: b, text: "Nur Verbalstil im ganzen Bericht." }
          - { key: c, text: "Eine Mischung: Bericht nominal, Empfehlung verbal." }
        answer: c
        why: 'Frau Yilmaz: „Eine Mischung ist ideal: der Bericht nominal und dicht, die Empfehlung verbal und klar".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Durchsage auf dem Amt"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 6 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Achtung, eine Durchsage für alle Wartenden im Bürgeramt. {1} eines technischen Defekts
      kommt es heute zu längeren Wartezeiten. {2} der Abgabe Ihrer Unterlagen achten Sie bitte
      auf die Vollständigkeit der Dokumente. {3} der Verzögerung werden alle Anträge heute
      noch bearbeitet. {4} der Prüfung Ihrer Unterlagen erhalten Sie eine Wartenummer für den
      Schalter. {5} Vermeidung von Fehlern kontrollieren Sie bitte vorher Ihre {6}. Wir
      danken Ihnen für Ihr Verständnis und Ihre Geduld.
    bank: [Wegen, Bei, Trotz, Nach, Zur, Angaben, Während, Durch, Frist]
    answers:
      "1": Wegen
      "2": Bei
      "3": Trotz
      "4": Nach
      "5": Zur
      "6": Angaben

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht vom Finanzamt"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    optionLayout: block
    transcript: 'Guten Tag, hier ist das Finanzamt Berlin-Mitte, Frau Brandt am Apparat. Es geht um Ihre Steuererklärung. Nach der Prüfung Ihrer Unterlagen fehlt uns leider noch ein Dokument: die Bescheinigung Ihres Arbeitgebers. Bei Nichtvorlage dieser Bescheinigung bis zum 30. des Monats können wir Ihren Antrag nicht bearbeiten. Zur Klärung der Sache rufen Sie mich bitte zurück. Bitte rufen Sie mich zurück unter der Nummer 030 / 12 34 56. Vielen Dank.'
    items:
      - q: "Wer ruft an?"
        options:
          - { key: a, text: "Das Bürgeramt." }
          - { key: b, text: "Das Finanzamt Berlin-Mitte." }
          - { key: c, text: "Der Arbeitgeber." }
        answer: b
        why: '„Hier ist das Finanzamt Berlin-Mitte".'
      - q: "Welches Dokument fehlt noch?"
        options:
          - { key: a, text: "Die Bescheinigung des Arbeitgebers." }
          - { key: b, text: "Der Personalausweis." }
          - { key: c, text: "Die Steuererklärung selbst." }
        answer: a
        why: '„Es fehlt uns leider noch ein Dokument: die Bescheinigung Ihres Arbeitgebers".'
      - q: 'Was passiert „bei Nichtvorlage" des Dokuments bis zum 30.?'
        options:
          - { key: a, text: "Der Antrag wird sofort genehmigt." }
          - { key: b, text: "Der Antrag kann nicht bearbeitet werden." }
          - { key: c, text: "Es passiert nichts." }
        answer: b
        why: '„Bei Nichtvorlage dieser Bescheinigung … können wir Ihren Antrag nicht bearbeiten" (= wenn Sie sie nicht vorlegen).'
      - q: "Was soll der Hörer tun?"
        options:
          - { key: a, text: "Zum Amt kommen." }
          - { key: b, text: "Eine E-Mail schreiben." }
          - { key: c, text: "Zurückrufen." }
        answer: c
        why: '„Zur Klärung der Sache rufen Sie mich bitte zurück".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Nominalisierung: Verb → Nomen (-ung)"
    instructions: "Bilde das passende Nomen auf -ung (mit Artikel). 8 Items."
    text: |
      1. prüfen → {1}
      2. verbessern → {2}
      3. entscheiden → {3}
      4. ablehnen → {4}
      5. genehmigen → {5}
      6. anmelden → {6}
      7. einhalten → {7}
      8. ändern → {8}
    answers:
      "1": die Prüfung
      "2": die Verbesserung
      "3": die Entscheidung
      "4": die Ablehnung
      "5": die Genehmigung
      "6": die Anmeldung
      "7": die Einhaltung
      "8": die Änderung

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Nominalisierung mit Genitiv-Objekt"
    instructions: "Mach aus dem Verbalsatz eine Nominalphrase. Das Objekt wird zum Genitiv. 6 Items."
    text: |
      1. den Antrag prüfen → die Prüfung {1}
      2. die Kosten senken → die Senkung {2}
      3. die Qualität verbessern → die Verbesserung {3}
      4. das Verfahren ändern → die Änderung {4}
      5. die Frist einhalten → die Einhaltung {5}
      6. den Bescheid lesen → das Lesen {6}
    answers:
      "1": "des Antrags"
      "2": "der Kosten"
      "3": "der Qualität"
      "4": "des Verfahrens"
      "5": "der Frist"
      "6": "des Bescheids"

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Verbalisierung: Nomen → Verb"
    instructions: "Schreib das versteckte Verb (Infinitiv). 8 Items."
    text: |
      1. die Prüfung → {1}
      2. die Anmeldung → {2}
      3. die Ablehnung → {3}
      4. die Reaktion → {4}
      5. die Entscheidung → {5}
      6. das Lesen → {6}
      7. die Genehmigung → {7}
      8. die Einhaltung → {8}
    answers:
      "1": prüfen
      "2": anmelden
      "3": ablehnen
      "4": reagieren
      "5": entscheiden
      "6": lesen
      "7": genehmigen
      "8": einhalten

  - id: A4
    block: A
    type: single-choice
    title: "Welche Präposition passt zu welchem Konnektor?"
    instructions: "Wähle den richtigen Konnektor (a, b oder c) für die Präposition."
    items:
      - q: "wegen → ?"
        options:
          - { key: a, text: "obwohl" }
          - { key: b, text: "weil" }
          - { key: c, text: "wenn" }
        answer: b
        why: "wegen ist kausal → weil."
      - q: "trotz → ?"
        options:
          - { key: a, text: "obwohl" }
          - { key: b, text: "weil" }
          - { key: c, text: "nachdem" }
        answer: a
        why: "trotz ist konzessiv → obwohl."
      - q: "bei → ?"
        options:
          - { key: a, text: "weil" }
          - { key: b, text: "wenn" }
          - { key: c, text: "obwohl" }
        answer: b
        why: "bei ist temporal/konditional → wenn (oder als)."
      - q: "nach → ?"
        options:
          - { key: a, text: "bevor" }
          - { key: b, text: "nachdem" }
          - { key: c, text: "während" }
        answer: b
        why: "nach + Nomen → nachdem."
      - q: "zur / zum → ?"
        options:
          - { key: a, text: "um … zu / damit" }
          - { key: b, text: "indem" }
          - { key: c, text: "weil" }
        answer: a
        why: "zu/zum ist final → um … zu / damit."
      - q: "durch → ?"
        options:
          - { key: a, text: "obwohl" }
          - { key: b, text: "indem / dadurch, dass" }
          - { key: c, text: "bevor" }
        answer: b
        why: "durch ist modal (Mittel/Methode) → indem / dadurch, dass."

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Nominal → Verbal: Konnektor einsetzen"
    instructions: "Ersetze die Präposition durch den passenden Konnektor (weil, obwohl, wenn, bevor, nachdem, während). 6 Items."
    text: |
      1. Wegen des Regens → {1} es regnet
      2. Trotz der Kälte → {2} es kalt ist
      3. Bei der Anmeldung → {3} man sich anmeldet
      4. Vor dem Essen → {4} man isst
      5. Nach der Prüfung → {5} man geprüft hat
      6. Während der Sitzung → {6} die Sitzung läuft
    answers:
      "1": weil
      "2": obwohl
      "3": wenn
      "4": bevor
      "5": nachdem
      "6": während

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Verbal → Nominal: Präposition einsetzen"
    instructions: "Ersetze den Konnektor durch die passende Präposition (wegen, trotz, bei, vor, nach, während). 6 Items."
    text: |
      1. Weil es regnet → {1} des Regens
      2. Obwohl es kalt ist → {2} der Kälte
      3. Wenn man sich anmeldet → {3} der Anmeldung
      4. Bevor man isst → {4} dem Essen
      5. Nachdem man geprüft hat → {5} der Prüfung
      6. Während die Sitzung läuft → {6} der Sitzung
    answers:
      "1": Wegen
      "2": Trotz
      "3": Bei
      "4": Vor
      "5": Nach
      "6": Während

  - id: A7
    block: A
    type: gap-bank
    title: "durch und zu/zum richtig zuordnen"
    instructions: "Füll die Lücken mit der passenden Präposition oder dem passenden Konnektor. Zwei Wörter sind zu viel."
    text: |
      1. {1} die Änderung des Verfahrens sanken die Kosten.
      2. {2} man das Verfahren änderte, sanken die Kosten.
      3. {3} Verbesserung der Qualität investiert die Firma.
      4. {4} die Qualität zu verbessern, investiert die Firma.
      5. {5} Schutz der Daten verschlüsselt man sie.
      6. {6} die Daten geschützt sind, verschlüsselt man sie.
    bank: [Durch, Indem, Zur, Um, Zum, Damit, Bei, Weil]
    answers:
      "1": Durch
      "2": Indem
      "3": Zur
      "4": Um
      "5": Zum
      "6": Damit

  - id: A8
    block: A
    type: matching
    title: "Verb und Nomen verbinden"
    instructions: "Ordne jedem Verb (1–6) das passende Nomen (a–f) zu."
    left:
      - { key: "1", text: "beantragen" }
      - { key: "2", text: "entscheiden" }
      - { key: "3", text: "reagieren" }
      - { key: "4", text: "anmelden" }
      - { key: "5", text: "verbessern" }
      - { key: "6", text: "ablehnen" }
    right:
      - { key: a, text: "die Entscheidung" }
      - { key: b, text: "die Anmeldung" }
      - { key: c, text: "der Antrag" }
      - { key: d, text: "die Ablehnung" }
      - { key: e, text: "die Reaktion" }
      - { key: f, text: "die Verbesserung" }
    answers:
      "1": c
      "2": a
      "3": e
      "4": b
      "5": f
      "6": d

  - id: A9
    block: A
    type: categorize
    title: "Nominalstil oder Verbalstil?"
    instructions: "Ordne jeden Ausdruck dem richtigen Stil zu."
    buckets:
      - { key: nominal, label: "Nominalstil" }
      - { key: verbal, label: "Verbalstil" }
    tokens:
      - { text: "wegen der Verspätung", bucket: nominal }
      - { text: "weil der Zug Verspätung hatte", bucket: verbal }
      - { text: "die Prüfung des Antrags", bucket: nominal }
      - { text: "man prüft den Antrag", bucket: verbal }
      - { text: "nach der Anmeldung", bucket: nominal }
      - { text: "nachdem man sich angemeldet hat", bucket: verbal }
      - { text: "zur Verbesserung der Qualität", bucket: nominal }
      - { text: "um die Qualität zu verbessern", bucket: verbal }

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Fall-Check: Genitiv, Dativ oder Akkusativ?"
    instructions: "Ergänze den richtigen Artikel nach der Präposition. ⚠️ wegen/trotz/während → Genitiv; bei/vor/nach → Dativ; durch → Akkusativ. 6 Items."
    text: |
      1. wegen {1} (der Regen, m.)
      2. trotz {2} (die Kälte, f.)
      3. bei {3} (die Anmeldung, f.)
      4. nach {4} (das Essen, n.)
      5. durch {5} (die Änderung, f.)
      6. während {6} (die Sitzung, f.)
    answers:
      "1": "des Regens"
      "2": "der Kälte"
      "3": "der Anmeldung"
      "4": "dem Essen"
      "5": "die Änderung"
      "6": "der Sitzung"

  - id: A11
    block: A
    type: order
    title: "Satzbau: Nebensatz richtig stellen"
    instructions: "Bring die Wörter in die richtige Reihenfolge. Das Verb steht im Nebensatz am Ende."
    items:
      - tiles: [weil, die, Nachfrage, hoch, ist]
        answer: [0, 1, 2, 3, 4]
        note: "weil die Nachfrage hoch ist"
      - tiles: [obwohl, der, Zug, Verspätung, hatte]
        answer: [0, 1, 2, 3, 4]
        note: "obwohl der Zug Verspätung hatte"
      - tiles: [nachdem, man, den, Antrag, geprüft, hat]
        answer: [0, 1, 2, 3, 4, 5]
        note: "nachdem man den Antrag geprüft hat"
      - tiles: [indem, man, das, Verfahren, änderte]
        answer: [0, 1, 2, 3, 4]
        note: "indem man das Verfahren änderte"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: free-write
    title: "Nominalstil → Verbalstil umformen"
    prompt: "Schreib jeden Satz vom Nominalstil in den Verbalstil um (mit Konnektor + Nebensatz)."
    stimulus: |
      1. Wegen der hohen Kosten wurde das Projekt gestoppt.
      2. Trotz der Verspätung kam der Chef pünktlich.
      3. Bei der Abgabe der Unterlagen braucht man einen Ausweis.
      4. Nach der Prüfung des Antrags kommt der Bescheid.
      5. Durch die Änderung des Verfahrens sanken die Kosten.
      6. Zur Verbesserung der Qualität investiert die Firma.
    model: |
      1. Weil die Kosten hoch waren, wurde das Projekt gestoppt.
      2. Obwohl es Verspätung gab, kam der Chef pünktlich.
      3. Wenn man die Unterlagen abgibt, braucht man einen Ausweis.
      4. Nachdem man den Antrag geprüft hat, kommt der Bescheid.
      5. Indem man das Verfahren änderte, sanken die Kosten. (oder: Dadurch, dass …)
      6. Um die Qualität zu verbessern, investiert die Firma. (oder: Damit die Qualität besser wird, …)

  - id: B2
    block: B
    type: free-write
    title: "Verbalstil → Nominalstil umformen"
    prompt: "Schreib jeden Satz vom Verbalstil in den Nominalstil um (Präposition + Nomen)."
    stimulus: |
      1. Weil das Wetter schlecht war, fiel das Spiel aus.
      2. Obwohl die Nachfrage stieg, blieben die Preise gleich.
      3. Wenn man sich anmeldet, zeigt man seinen Ausweis.
      4. Bevor man das Formular abgibt, prüft man es.
      5. Nachdem man die Kosten gesenkt hatte, stieg der Gewinn.
      6. Um die Daten zu schützen, verschlüsselt man sie.
    model: |
      1. Wegen des schlechten Wetters fiel das Spiel aus.
      2. Trotz der steigenden Nachfrage blieben die Preise gleich.
      3. Bei der Anmeldung zeigt man seinen Ausweis.
      4. Vor der Abgabe des Formulars prüft man es.
      5. Nach der Senkung der Kosten stieg der Gewinn.
      6. Zum Schutz der Daten verschlüsselt man sie.

  - id: B3
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz hat genau einen Fehler (Fall, fehlendes Nomen oder falscher Konnektor). Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Wegen die Nachfrage stiegen die Preise.
      2. Trotz es teuer war, kauften sie das Auto.
      3. Nach man den Antrag geprüft hat, kommt der Bescheid.
      4. Die Prüfung den Antrags dauert zwei Wochen.
      5. Durch ich das Verfahren änderte, sanken die Kosten.
      6. Wegen der Frist eingehalten wurde, wurde der Antrag genehmigt.
    model: |
      1. Wegen der Nachfrage stiegen die Preise. (wegen + Genitiv: der Nachfrage)
      2. Obwohl es teuer war, kauften sie das Auto. (Nebensatz braucht Konnektor obwohl, nicht trotz + Satz)
      3. Nach der Prüfung des Antrags kommt der Bescheid. (nach braucht ein Nomen, kein Verb) — oder: Nachdem man den Antrag geprüft hat, …
      4. Die Prüfung des Antrags dauert zwei Wochen. (Objekt → Genitiv: des Antrags)
      5. Indem ich das Verfahren änderte, sanken die Kosten. (durch braucht ein Nomen; mit Verb → indem)
      6. Weil die Frist eingehalten wurde, wurde der Antrag genehmigt. (Nebensatz mit Verb → weil, nicht wegen)

  - id: B4
    block: B
    type: matching
    title: "Nominalphrase und Nebensatz verbinden"
    instructions: "Ordne jeder Nominalphrase (1–6) den passenden Nebensatz (a–f) zu."
    left:
      - { key: "1", text: "wegen des Sturms" }
      - { key: "2", text: "trotz der Müdigkeit" }
      - { key: "3", text: "bei der Anmeldung" }
