  # ── Datenverben (Tendenz und Wert) — 10 verbs ──────────────────────────────
  - de: steigen
    article: null
    plural: null
    en: to rise; to go up
    pos: verb
    tags: [verb, data-trend, strong]
    core: true
    example: "Die Nutzung steigt seit 2020."
  - de: sinken
    article: null
    plural: null
    en: to fall; to go down
    pos: verb
    tags: [verb, data-trend, strong]
    core: true
    example: "Der Anteil sinkt leicht."
  - de: zunehmen
    article: null
    plural: null
    en: to increase; to grow
    pos: verb
    tags: [verb, data-trend, separable, strong]
    core: true
    example: "Die Bedeutung nimmt zu."
  - de: abnehmen
    article: null
    plural: null
    en: to decrease; to decline
    pos: verb
    tags: [verb, data-trend, separable, strong]
    core: true
    example: "Die Zahl nimmt ab."
  - de: stagnieren
    article: null
    plural: null
    en: to stagnate; to remain flat
    pos: verb
    tags: [verb, data-trend]
    core: true
    example: "Die Kurve stagniert seit zwei Jahren."
  - de: verdoppeln
    article: null
    plural: null
    en: to double
    pos: verb
    tags: [verb, data-trend, reflexive]
    core: true
    example: "Die Nutzung hat sich verdoppelt. (× 2)"
  - de: halbieren
    article: null
    plural: null
    en: to halve
    pos: verb
    tags: [verb, data-trend, reflexive]
    core: true
    example: "Der Wert hat sich halbiert. (÷ 2)"
  - de: betragen
    article: null
    plural: null
    en: to amount to; to total
    pos: verb
    tags: [verb, data-trend, strong]
    core: true
    example: "Der Anteil beträgt 32 Prozent."
  - de: ausmachen
    article: null
    plural: null
    en: to constitute; to make up (a share)
    pos: verb
    tags: [verb, data-trend, separable]
    core: true
    example: "Der Anteil macht 32 Prozent aus."
  - de: liegen bei
    article: null
    plural: null
    en: to be around; to be approximately
    pos: phrase
    tags: [data-trend, phrase]
    core: true
    example: "Die Werte liegen bei rund 12 Prozent."

