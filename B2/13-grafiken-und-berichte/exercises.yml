  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out"
    instructions: "Streiche das Wort oder den Ausdruck, der nicht passt, und erkläre warum."
    groups:
      - items: [steigen, sinken, stagnieren, meinen]
        odd: 3
        why: "meinen ist kein Datenverb — die anderen drei beschreiben eine Tendenz."
      - items: [sich verdoppeln, sich halbieren, sich entschuldigen, betragen]
        odd: 3
        why: "sich entschuldigen ist reflexiv, aber kein Datenverb — die anderen drei sind Werte/Faktoren."
      - items: [im Zeitraum von, zwischen, seit, anstatt]
        odd: 3
        why: "anstatt ist kein temporaler Ausdruck für Daten — die anderen drei sind Zeitausdrücke."
      - items: [im Vergleich zu, gegenüber, im Durchschnitt, wegen]
        odd: 3
        why: "wegen ist kausal — die anderen drei sind Vergleichs- bzw. Mittelwertsausdrücke."
      - items: [ergibt sich, zeigt sich, lässt sich ablesen, kommt zurück]
        odd: 3
        why: 'kommt zurück ist kein reflexives Ableitungsverb — die anderen drei folgen dem Muster „sich + Verb".'
      - items: [Höchststand, Tiefststand, Durchschnitt, Tiefpunkt]
        odd: 3
        why: "Tiefpunkt ist die allgemeine Form (auch für Stimmung, Verlauf etc.); für Datenberichte ist Tiefststand der fachliche Standardbegriff."

