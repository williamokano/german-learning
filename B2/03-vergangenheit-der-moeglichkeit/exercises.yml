      "2": hätte
      "3": gekauft hätte
      "4": wären
      "5": gemeldet hätte
      "6": hätten
      "7": gefragt hättest
      "8": hätte

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Doppelinfinitiv: hätte … + Vollverb + Modalverb"
    instructions: "Ergänze den Doppelinfinitiv (z. B. anrufen sollen). 6 Lücken."
    text: |
      1. Du hättest früher {1} (buchen + sollen).
      2. Ich hätte das einfach {2} (machen + können).
      3. Wir hätten den Kunden früher {3} (kontaktieren + müssen).
      4. Sie hätte das Team um Hilfe {4} (bitten + sollen).
      5. Das hättest du {5} (wissen + müssen).
      6. Er hätte vorsichtiger {6} (sein + müssen).
    answers:
