      "2": machen können
      "3": kontaktieren müssen
      "4": bitten sollen
      "5": wissen müssen
      "6": sein müssen

  - id: A6
    block: A
    type: single-choice
    title: "als ob / als — Wortstellung erkennen"
    instructions: "Wähle die richtige Form (a, b oder c)."
    items:
      - q: "Er tat, als ob er nichts ____."
        options:
          - { key: a, text: "gewusst hätte" }
          - { key: b, text: "hätte gewusst" }
          - { key: c, text: "gewusst hat" }
        answer: a
        why: 'Nach „als ob" steht das Verb am Ende: „gewusst hätte".'
      - q: "Sie sah aus, als ____ sie geweint."
        options:
          - { key: a, text: "ob hätte" }
          - { key: b, text: "hätte" }
          - { key: c, text: "sie hätte" }
        answer: b
        why: 'Nach „als" (ohne „ob") folgt sofort das Verb: „als hätte sie geweint".'
      - q: "Es klang, als ____ alles geplant gewesen."
        options:
          - { key: a, text: "ob wäre" }
          - { key: b, text: "wäre" }
          - { key: c, text: "war" }
        answer: b
        why: '„als wäre alles geplant gewesen" — Konjunktiv II, Verb direkt nach „als".'

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "als ob: Verb ans Ende"
    instructions: "Ergänze das Verb im Konjunktiv II der Vergangenheit am Satzende. 6 Lücken."
    text: |
      1. Mia tat, als ob sie nichts {1} (wissen).
      2. Du redest, als ob du alles besser {2} (wissen).
      3. Es sieht aus, als ob er die ganze Nacht nicht {3} (schlafen).
      4. Sie lächelte, als ob nichts {4} (geschehen).
      5. Es klingt, als ob er es absichtlich {5} (machen).
      6. Anna tat, als ob sie es nicht {6} (hören).
    answers:
      "1": gewusst hätte
      "2": gewusst hättest
      "3": geschlafen hätte
      "4": geschehen wäre
      "5": gemacht hätte
      "6": gehört hätte

  - id: A8
