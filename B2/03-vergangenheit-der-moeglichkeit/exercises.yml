lesson: B2/03
title: "B2 · Lektion 3 — Übungen (Vergangenheit der Möglichkeit)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Lösungen in solutions.md.
  Tipp: Verteile die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Bruno und seine Begleitung sind ins Konzert gekommen."
        answer: false
        why: 'Bruno: „Wir sind nicht reingekommen. Die Tickets waren ausverkauft".'
      - q: "Anna hatte Bruno geraten, die Tickets früher zu kaufen."
        answer: true
        why: 'Anna: „Aber ich habe dir doch geschrieben, du sollst die Tickets früher kaufen!"'
      - q: "Bruno findet, dass er früher hätte buchen sollen."
        answer: true
        why: 'Bruno: „Hätte ich bloß auf dich gehört" und Anna bestätigt den Vorwurf.'
      - q: "Mia hat wirklich nichts von dem Plan gewusst."
        answer: false
        why: 'Bruno: „Ach, sie wusste es schon. Sie hat nur so getan, als wäre alles meine Schuld".'
      - q: "Anna übernimmt nächstes Mal die Tickets."
        answer: true
        why: 'Anna: „nächstes Mal kümmere ich mich um die Tickets".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Worüber sprechen Frau Yilmaz und Frau Kowalski?"
        options:
          - { key: a, text: "Über ein Projekt, das schiefgelaufen ist." }
          - { key: b, text: "Über eine Gehaltserhöhung." }
          - { key: c, text: "Über einen neuen Kunden." }
        answer: a
        why: 'Frau Yilmaz: „über das Projekt sprechen, das letzte Woche schiefgelaufen ist".'
      - q: "Was hätte man laut Frau Yilmaz anders machen müssen?"
        options:
          - { key: a, text: "Den Kunden früher kontaktieren." }
          - { key: b, text: "Mehr Geld ausgeben." }
          - { key: c, text: "Das Projekt absagen." }
        answer: a
        why: 'Frau Yilmaz: „Wir hätten ihn früher kontaktieren müssen".'
      - q: "Was hätte Anna selbst früher tun sollen?"
        options:
          - { key: a, text: "Den Kunden anrufen." }
          - { key: b, text: "Das Team um Hilfe bitten." }
          - { key: c, text: "Den Zeitplan ignorieren." }
        answer: b
        why: 'Anna: „Ich hätte außerdem das Team früher um Hilfe bitten sollen".'
      - q: "Was wird ab jetzt eingeführt?"
        options:
          - { key: a, text: "Ein wöchentliches Gespräch." }
          - { key: b, text: "Eine neue Software." }
          - { key: c, text: "Mehr Pausen." }
        answer: a
        why: 'Anna schlägt „ein kurzes wöchentliches Gespräch" vor, Frau Yilmaz: „Genau das führen wir ab jetzt ein".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und fülle die 7 Lücken. **Drei Wörter werden nicht gebraucht.**"
    text: |
      Hey Bruno, ich bin's, Anna. Du, ich muss dir was erzählen — ich ärgere mich
      gerade so über mich selbst. Ich {1} heute fast meinen Traumjob bekommen,
      aber ich habe im Vorstellungsgespräch viel zu wenig gesagt. Wenn ich
      selbstbewusster {2} {3}, hätte ich den Job wahrscheinlich gekriegt. Die
      Chefin tat zwar freundlich, aber sie sah mich an, {4} ob sie schon
      entschieden {5}. Ich hätte mich besser vorbereiten {6}. Na ja. {7} hätte
      es geklappt. Ruf mich zurück, wenn du Zeit hast.
    bank: [hätte, gewesen, wäre, als, hätte, sollen, Beinahe, müssen, würde, wenn]
    answers:
      "1": hätte
      "2": gewesen
      "3": wäre
      "4": als
      "5": hätte
      "6": sollen
      "7": Beinahe

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anrufbeantworter"
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    transcript: 'Hallo, hier ist die Mailbox von Tom. Mensch, Anna, ich ärgere mich so! Ich hätte dich gestern unbedingt zurückrufen sollen, aber ich habe es total vergessen. Wenn ich gewusst hätte, dass dein Vorstellungsgespräch heute war, hätte ich dir natürlich vorher noch viel Glück gewünscht. Beinahe hätte ich es sogar in den Kalender eingetragen — aber eben nur beinahe. Es tut mir wirklich leid. Bitte ruf mich zurück, dann erzählst du mir alles. Bis gleich!'
    items:
      - q: "Warum entschuldigt sich Tom?"
        options:
          - { key: a, text: "Weil er Anna nicht zurückgerufen hat." }
          - { key: b, text: "Weil er das Gespräch verschoben hat." }
          - { key: c, text: "Weil er zu spät gekommen ist." }
        answer: a
        why: '„Ich hätte dich gestern unbedingt zurückrufen sollen, aber ich habe es total vergessen".'
      - q: "Was hätte Tom getan, wenn er vom Gespräch gewusst hätte?"
        options:
          - { key: a, text: "Er wäre mitgekommen." }
          - { key: b, text: "Er hätte Anna viel Glück gewünscht." }
          - { key: c, text: "Er hätte abgesagt." }
        answer: b
        why: '„hätte ich dir natürlich vorher noch viel Glück gewünscht".'
      - q: "Was hat Tom NICHT getan?"
        options:
          - { key: a, text: "Den Termin in den Kalender eingetragen." }
          - { key: b, text: "Anna eine Nachricht hinterlassen." }
          - { key: c, text: "Sich entschuldigt." }
        answer: a
        why: '„Beinahe hätte ich es sogar in den Kalender eingetragen — aber eben nur beinahe".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Konjunktiv II der Vergangenheit: hätte / wäre"
    instructions: "Ergänze die Formen von hätte (machen) und wäre (kommen). 12 Lücken."
    columns: ["mit haben: … gemacht", "mit sein: … gekommen"]
    rows:
      - label: "ich"
        cells: [ {gap: 1, answer: "hätte gemacht"}, {gap: 2, answer: "wäre gekommen"} ]
      - label: "du"
        cells: [ {gap: 3, answer: "hättest gemacht"}, {gap: 4, answer: "wärst gekommen"} ]
      - label: "er/sie/es"
        cells: [ {gap: 5, answer: "hätte gemacht"}, {gap: 6, answer: "wäre gekommen"} ]
      - label: "wir"
        cells: [ {gap: 7, answer: "hätten gemacht"}, {gap: 8, answer: "wären gekommen"} ]
      - label: "ihr"
        cells: [ {gap: 9, answer: "hättet gemacht"}, {gap: 10, answer: "wärt gekommen"} ]
      - label: "sie/Sie"
        cells: [ {gap: 11, answer: "hätten gemacht"}, {gap: 12, answer: "wären gekommen"} ]

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "hätte oder wäre? (Hilfsverb wählen)"
    instructions: "Ergänze das richtige Hilfsverb im Konjunktiv II (hätte/hättest/… oder wäre/wärst/…). 8 Lücken."
    text: |
      1. Ich {1} den Brief fast vergessen. (vergessen)
      2. Du {2} pünktlich gekommen. (kommen)
      3. Wir {3} den Fehler vermieden. (vermeiden)
      4. Sie (sie) {4} beinahe zu spät gewesen. (sein)
      5. Er {5} mehr gesagt. (sagen)
      6. Ich {6} sofort losgelaufen. (laufen)
      7. Ihr {7} das geahnt. (ahnen)
      8. Anna {8} fast den Zug verpasst. (verpassen)
    answers:
      "1": hätte
      "2": wärst
      "3": hätten
      "4": wäre
      "5": hätte
      "6": wäre
      "7": hättet
      "8": hätte

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Vom Perfekt zum Konjunktiv II der Vergangenheit"
    instructions: "Schreib die Form um: Perfekt → Konjunktiv II der Vergangenheit (z. B. ich habe gemacht → ich hätte gemacht). 6 Lücken."
    text: |
      1. Ich habe gelernt. → Ich {1} gelernt.
      2. Wir sind gegangen. → Wir {2} gegangen.
      3. Du hast geholfen. → Du {3} geholfen.
      4. Sie ist geblieben. → Sie {4} geblieben.
      5. Er hat angerufen. → Er {5} angerufen.
      6. Ihr seid gekommen. → Ihr {6} gekommen.
    answers:
      "1": hätte
      "2": wären
      "3": hättest
      "4": wäre
      "5": hätte
      "6": wärt

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Irreale Bedingungssätze der Vergangenheit"
    instructions: "Ergänze die Verbformen im Konjunktiv II der Vergangenheit. 8 Lücken."
    text: |
      1. Wenn ich früher {1} (aufstehen), {2} ich den Zug erreicht.
      2. Wenn Bruno die Tickets {3} (kaufen), {4} sie ins Konzert gekommen.
      3. Wenn ich die Verzögerung {5} (melden), {6} wir eine Lösung gefunden.
      4. Wenn du mich {7} (fragen), {8} ich dir geholfen.
    answers:
