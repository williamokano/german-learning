  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "wäre oder hätte beim Doppelinfinitiv?"
    instructions: "⚠️ Beim Modalverb immer hätte! Ergänze die richtige Form. 6 Lücken."
    text: |
      1. Ich {1} früher gehen können. (können)
      2. Du {2} mir das sagen sollen. (sollen)
      3. Wir {3} pünktlich sein müssen. (müssen)
      4. Sie {4} mitkommen können. (können)
      5. Ihr {5} vorsichtiger sein müssen. (müssen)
      6. Er {6} das nicht tun dürfen. (dürfen)
    answers:
      "1": hätte
      "2": hättest
      "3": hätten
      "4": hätte
      "5": hättet
      "6": hätte

  - id: A11
    block: A
    type: free-write
    title: 'Fünf Sätze mit „Ich hätte … sollen/können/müssen“'
    prompt: "Schreib 5 Vorwürfe an dich selbst über die letzte Woche. Verwende jeweils einen Doppelinfinitiv (hätte + Vollverb + Modalverb)."
    stimulus: |
      Beispiel: Ich hätte früher ins Bett gehen sollen. Ich hätte mehr lernen müssen.

      Schreib jetzt deine eigenen 5 Sätze. Verwende mindestens dreimal "sollen"
      und zweimal "können" oder "müssen".
    model: |
      (Beispiel)
      1. Ich hätte am Montag mehr Wasser trinken sollen.
      2. Ich hätte meine Mutter früher anrufen sollen.
      3. Ich hätte die E-Mail sofort beantworten können.
      4. Ich hätte besser schlafen müssen.
      5. Ich hätte das Treffen nicht absagen sollen.

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Dialog ergänzen: Das verpasste Konzert"
    instructions: "Fülle die 10 Lücken mit der richtigen Form. **Zwei Wörter werden nicht gebraucht.**"
    text: |
      — Mensch, hätte ich bloß früher {1}! Dann {2} wir jetzt im Konzert.
      — Du {3} wirklich früher buchen {4}. Ich habe es dir gesagt.
      — Ich weiß. Wenn ich auf dich {5} {6}, {7} es nicht so weit gekommen.
      — Na ja. An deiner Stelle {8} ich es auch vergessen.
      — Hätten wir einfach einen Film {9}, {10} der Abend schöner gewesen.
    bank: [gebucht, wären, hättest, sollen, gehört, hätte, wäre, hätte, geschaut, wäre, gekauft, würde]
    answers:
      "1": gebucht
      "2": wären
      "3": hättest
      "4": sollen
      "5": gehört
      "6": hätte
      "7": wäre
      "8": hätte
      "9": geschaut
      "10": wäre

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz enthält genau einen Fehler. Finde ihn und schreib den korrigierten Satz."
    stimulus: |
      1. Ich würde gestern nach Hause gegangen sein.
      2. Ich hätte nach Hause gegangen.
      3. Du hättest angerufen sollen.
      4. Wenn ich das wusste, hätte ich anders reagiert.
      5. Ich wäre gehen können.
      6. Er tat, als ob er nichts gewusst hat.
      7. Sie sah aus, als sie geweint hätte.
      8. Wir hätten ihn früher informieren gemusst.
    model: |
      1. Ich wäre gestern nach Hause gegangen. (kein „würde … gewesen sein"; Bewegungsverb → wäre)
      2. Ich wäre nach Hause gegangen. (Bewegungsverb → wäre, nicht hätte)
      3. Du hättest anrufen sollen. (Doppelinfinitiv: Vollverb bleibt Infinitiv „anrufen", kein Partizip „angerufen")
      4. Wenn ich das gewusst hätte, hätte ich anders reagiert. (Konjunktiv II Vergangenheit, nicht Präteritum „wusste")
      5. Ich hätte gehen können. (Modalverb → immer hätte, nicht wäre)
      6. Er tat, als ob er nichts gewusst hätte. (Konjunktiv, nicht Indikativ „gewusst hat")
      7. Sie sah aus, als hätte sie geweint. (nach „als" sofort das Verb — oder: als ob sie geweint hätte)
      8. Wir hätten ihn früher informieren müssen. (Modal bleibt Infinitiv „müssen", nicht „gemusst")

  - id: B3
    block: B
    type: matching
    title: "Vorwurf und Reaktion verbinden"
    instructions: "Verbinde jeden Vorwurf (1–6) mit der passenden Reaktion (a–f)."
    left:
      - { key: "1", text: "Du hättest mir Bescheid sagen sollen!" }
      - { key: "2", text: "Wir hätten den Kunden früher informieren müssen." }
      - { key: "3", text: "Hättest du früher gebucht, wären wir reingekommen." }
      - { key: "4", text: "Du tust, als ob du nichts gewusst hättest." }
      - { key: "5", text: "Ich hätte mich besser vorbereiten sollen." }
      - { key: "6", text: "Beinahe hätte ich den Job bekommen." }
    right:
      - { key: a, text: "Stimmt, das war mein Fehler — ich habe es vergessen." }
      - { key: b, text: "Ja, dann hätten wir gemeinsam eine Lösung gefunden." }
      - { key: c, text: "Ich weiß, ich hätte einfach klicken müssen." }
      - { key: d, text: "Doch, ich wusste es — ich wollte nur nichts sagen." }
      - { key: e, text: "Nächstes Mal lernst du sicher mehr." }
      - { key: f, text: "Schade! Aber fast ist auch schon gut." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: B4
    block: B
    type: free-write
    title: "Satzbau: irreale Bedingungssätze der Vergangenheit"
    prompt: "Bilde aus den zwei realen Aussagen einen irrealen Bedingungssatz der Vergangenheit (Wenn …, hätte/wäre …)."
    stimulus: |
      1. Ich habe nicht gelernt. Ich habe die Prüfung nicht bestanden.
      2. Du bist nicht gekommen. Wir haben nicht gefeiert.
      3. Sie hat sich nicht beschwert. Niemand hat etwas gemerkt.
      4. Wir haben keine Zeit eingeplant. Der Druck war groß.
    model: |
      1. Wenn ich gelernt hätte, hätte ich die Prüfung bestanden.
      2. Wenn du gekommen wärst, hätten wir gefeiert.
      3. Wenn sie sich beschwert hätte, hätte jemand etwas gemerkt.
      4. Wenn wir Zeit eingeplant hätten, wäre der Druck nicht so groß gewesen.

  - id: B5
    block: B
    type: free-write
    title: "Umformen: als ob ↔ als"
    prompt: 'Schreib jeden Satz in der anderen Variante um (von „als ob“ zu „als“ oder umgekehrt). Die Bedeutung bleibt gleich.'
    stimulus: |
      1. Er tat, als ob er nichts gewusst hätte. → (mit „als")
      2. Sie sah aus, als hätte sie geweint. → (mit „als ob")
      3. Es klang, als wäre alles geplant gewesen. → (mit „als ob")
      4. Du redest, als ob du dabei gewesen wärst. → (mit „als")
    model: |
      1. Er tat, als hätte er nichts gewusst.
      2. Sie sah aus, als ob sie geweint hätte.
      3. Es klang, als ob alles geplant gewesen wäre.
      4. Du redest, als wärst du dabei gewesen.

  - id: B6
    block: B
    type: free-write
    title: "Übersetzen (EN → DE) — Konjunktiv II der Vergangenheit"
    prompt: "Übersetze ins Deutsche. Verwende den Konjunktiv II der Vergangenheit."
    stimulus: |
      1. I should have called you. (anrufen)
      2. We could have avoided that mistake. (vermeiden)
      3. If I had known that, I would have stayed home.
