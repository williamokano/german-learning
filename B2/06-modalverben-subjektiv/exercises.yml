    prompt: "Schreib einen kurzen Text (8–10 Sätze): Eine Person aus deinem Umfeld (real oder erfunden) verhält sich seit Tagen seltsam. Spekuliere über die möglichen Gründe und stuf deine Vermutungen ab."
