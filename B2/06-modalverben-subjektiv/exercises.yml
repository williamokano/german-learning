lesson: B2/06
title: "B2 · Lektion 6 — Übungen (Modalverben: subjektive Bedeutung)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Lösungen in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A an Tag 1, B an Tag 2,
  C an Tag 3, D an Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia ist sich sicher, dass der neue Nachbar reich ist."
        answer: true
        why: 'Mia: „Der muss steinreich sein" — subjektives müssen = fast sicher.'
      - q: "Bruno hält den Sportwagen für einen sicheren Beweis von Reichtum."
        answer: false
        why: 'Bruno: „Der Wagen könnte auch geleast sein" — er bleibt skeptisch.'
      - q: "Laut Hausverwaltung soll der Nachbar Investmentbanker sein."
        answer: true
        why: 'Anna: „er soll Investmentbanker sein" — Gerücht mit sollen.'
      - q: "Der Nachbar behauptet selbst, früher Profisportler gewesen zu sein."
        answer: true
        why: 'Anna: „Er selbst will früher Profisportler gewesen sein" — Selbstbehauptung mit wollen.'
      - q: "Am Ende beschließen sie, weiter über den Nachbarn zu spekulieren."
        answer: false
        why: 'Bruno schlägt vor: „Lass uns einfach mal Hallo sagen, statt zu spekulieren".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Wie schätzt Frau Yilmaz den Bewerber zuerst ein?"
        options:
          - { key: a, text: "Auf dem Papier dürfte er gut passen." }
          - { key: b, text: "Er passt sicher nicht zur Firma." }
          - { key: c, text: "Er muss sofort eingestellt werden." }
        answer: a
        why: 'Frau Yilmaz: „Auf dem Papier dürfte er gut zu uns passen" — wahrscheinlich, nicht sicher.'
      - q: "Wie erklärt Herr Steinmeyer die Lücke im Lebenslauf?"
        options:
          - { key: a, text: "Er ist sicher, dass der Bewerber gelogen hat." }
          - { key: b, text: "Da muss etwas passiert sein, das der Bewerber nicht erwähnt." }
          - { key: c, text: "Die Lücke ist ein Druckfehler." }
        answer: b
        why: 'Herr Steinmeyer: „Da muss etwas passiert sein, das er nicht erwähnt" — starke Vermutung.'
      - q: "Was behauptet der Bewerber laut Frau Yilmaz über sich selbst?"
        options:
          - { key: a, text: "Er will das ganze Team geführt haben." }
          - { key: b, text: "Er soll arbeitslos gewesen sein." }
          - { key: c, text: "Er will nie im Ausland gewesen sein." }
        answer: a
        why: 'Frau Yilmaz: „Er will das ganze Team geführt haben" — Selbstbehauptung mit wollen.'
      - q: "Wie bewerten beide das Gerücht über den letzten Arbeitgeber?"
        options:
          - { key: a, text: "Sie glauben es sofort." }
          - { key: b, text: "Sie wollen es nicht überbewerten." }
          - { key: c, text: "Sie lehnen den Bewerber deshalb ab." }
        answer: b
        why: 'Herr Steinmeyer: „Solche Gerüchte dürfen wir nicht überbewerten".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Radiomeldung"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und fülle die 6 Lücken. Drei Wörter im Kasten werden nicht gebraucht."
    text: |
      Und nun zu den Klatschnachrichten des Tages. Ein bekanntes Schauspielerpaar
      {1} sich angeblich getrennt haben — das berichtet zumindest ein Boulevardblatt
      unter Berufung auf eine anonyme {2}. Die beiden sollen seit Wochen getrennt
      wohnen. Das Management der Stars {3} die Gerüchte allerdings entschieden:
      Die Schauspielerin {4} von einer Trennung nichts wissen und spricht von reiner
      {5}. Ihr Partner {6} derzeit ohnehin im Ausland sein, wo er einen
      Film dreht.
    bank: [soll, Quelle, dementiert, will, Spekulation, dürfte, muss, Schlagzeile, behauptet]
    answers:
      "1": soll
      "2": Quelle
      "3": dementiert
      "4": will
      "5": Spekulation
      "6": dürfte

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht auf dem Anrufbeantworter"
    audio: transcript_ansage1.mp3
    optionLayout: block
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript liest."
    transcript: 'Hallo Anna, hier ist Mia. Du, ich habe gerade gehört, der neue Nachbar soll doch gar kein Banker sein! Die Frau aus dem zweiten Stock sagt, er soll in Wirklichkeit Schauspieler sein. Und der Sportwagen — der dürfte tatsächlich nur geliehen sein, für einen Dreh. Verrückt, oder? Bruno hatte wohl recht: Das war alles nur Gerede. Ruf mich bitte zurück, dann erzähle ich dir mehr. Tschüss!'
    items:
      - q: "Was hat Mia über den Beruf des Nachbarn neu gehört?"
        options:
          - { key: a, text: "Er soll Banker sein." }
          - { key: b, text: "Er soll in Wirklichkeit Schauspieler sein." }
          - { key: c, text: "Er soll Profisportler sein." }
        answer: b
        why: '„Die Frau aus dem zweiten Stock sagt, er soll in Wirklichkeit Schauspieler sein".'
      - q: "Was vermutet Mia jetzt über den Sportwagen?"
        options:
          - { key: a, text: "Er dürfte nur geliehen sein, für einen Dreh." }
          - { key: b, text: "Er muss gekauft worden sein." }
          - { key: c, text: "Er kann nicht echt sein." }
        answer: a
        why: '„Der dürfte tatsächlich nur geliehen sein, für einen Dreh".'
      - q: "Wie bewertet Mia jetzt das frühere Gerede?"
        options:
          - { key: a, text: "Es war alles wahr." }
          - { key: b, text: "Bruno hatte recht: Es war alles nur Gerede." }
          - { key: c, text: "Niemand hatte etwas gesagt." }
        answer: b
        why: '„Bruno hatte wohl recht: Das war alles nur Gerede".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: single-choice
    title: "Objektiv oder subjektiv?"
    instructions: "Bestimme, ob das Modalverb objektiv (Tatsache) oder subjektiv (Vermutung/Einschätzung) gemeint ist. 6 Items."
    items:
      - q: "Er muss jeden Tag um 6 Uhr aufstehen."
        options:
          - { key: a, text: "objektiv (Pflicht)" }
          - { key: b, text: "subjektiv (Vermutung)" }
        answer: a
        why: "Handlungsverb aufstehen + Pflicht → objektiv."
      - q: "Bei dem Licht muss er zu Hause sein."
        options:
          - { key: a, text: "objektiv (Pflicht)" }
          - { key: b, text: "subjektiv (Vermutung)" }
        answer: b
        why: "Zustand (zu Hause sein) + Schluss aus Indizien → subjektiv."
      - q: "Du darfst hier nicht rauchen."
        options:
          - { key: a, text: "objektiv (Erlaubnis/Verbot)" }
          - { key: b, text: "subjektiv (Vermutung)" }
        answer: a
        why: "Verbot → objektiv."
      - q: "Sie dürfte um die vierzig sein."
        options:
          - { key: a, text: "objektiv (Erlaubnis)" }
          - { key: b, text: "subjektiv (Vermutung)" }
        answer: b
        why: "dürfte (Konj. II) + Schätzung → subjektiv."
      - q: "Er will ein neues Auto kaufen."
        options:
          - { key: a, text: "objektiv (Wunsch/Absicht)" }
          - { key: b, text: "subjektiv (Selbstbehauptung)" }
        answer: a
        why: "Absicht/Wunsch + Handlungsverb kaufen → objektiv."
      - q: "Er will den Minister persönlich kennen."
        options:
          - { key: a, text: "objektiv (Wunsch/Absicht)" }
          - { key: b, text: "subjektiv (Selbstbehauptung)" }
        answer: b
        why: "Behauptung über sich selbst (kennen = Zustand) → subjektiv."

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Sicherheitsskala einsetzen"
    instructions: "Setz das passende Modalverb ein (muss / dürfte / könnte / kann nicht). 6 Items."
    text: |
      1. Das Licht brennt und das Auto steht da — er {1} zu Hause sein. (fast sicher)
      2. Ich habe ihn gerade in Berlin gesehen — er {2} jetzt in München sein. (ausgeschlossen)
      3. Das Paket ist schon unterwegs — es {3} morgen ankommen. (wahrscheinlich)
      4. Vielleicht hat er den Termin vergessen — das {4} sein. (möglich)
      5. Bei dem Stau {5} sie sich verspäten, anders geht es nicht. (fast sicher)
      6. Sie ist erst 25 — sie {6} schon Professorin sein. (ausgeschlossen)
    answers:
      "1": muss
      "2": "kann nicht"
      "3": dürfte
      "4": könnte
      "5": muss
      "6": "kann nicht"

  - id: A3
    block: A
    type: single-choice
    title: "sollen oder wollen?"
    instructions: "Gerücht (man sagt) → sollen. Selbstbehauptung (er/sie sagt von sich) → wollen. Wähle die richtige Form. 6 Items."
    items:
      - q: "(Man sagt es:) Das neue Restaurant ____ ausgezeichnet sein."
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "will" }
        answer: a
        why: "Gerücht / man sagt → sollen."
      - q: "(Er sagt von sich:) Der Zeuge ____ alles genau gesehen haben."
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "will" }
        answer: b
        why: "Selbstbehauptung → wollen."
      - q: "(Man sagt es:) Die Firma ____ bald schließen."
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "will" }
        answer: a
        why: "Gerücht → sollen."
      - q: "(Sie sagt von sich:) Sie ____ von nichts gewusst haben."
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "will" }
        answer: b
        why: "Selbstbehauptung → wollen."
      - q: "(Die Leute erzählen:) Er ____ sehr reich sein."
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "will" }
        answer: a
        why: "Hörensagen → sollen."
      - q: "(Er behauptet selbst:) Er ____ den Star persönlich kennen."
        options:
          - { key: a, text: "soll" }
          - { key: b, text: "will" }
        answer: b
        why: "Behauptung über sich selbst → wollen."

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Gegenwart → Vergangenheit (Infinitiv Perfekt)"
    instructions: "Setz die Vermutung in die Vergangenheit. Schreib das zweite Verb als Infinitiv Perfekt (Partizip II + sein/haben). 6 Items."
    text: |
      1. Er muss reich sein. → Er muss reich {1}. (gewesen + sein/haben?)
      2. Sie dürfte den Termin vergessen. → Sie dürfte den Termin {2}. (vergessen + ?)
      3. Er soll dort sein. → Er soll dort {3}.
      4. Er will alles sehen. → Er will alles {4}.
      5. Das kann ein Irrtum sein. → Das kann ein Irrtum {5}.
      6. Sie soll viel reisen. → Sie soll viel {6}.
    answers:
      "1": "gewesen sein"
      "2": "vergessen haben"
      "3": "gewesen sein"
      "4": "gesehen haben"
      "5": "gewesen sein"
      "6": "gereist sein"

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "sein oder haben im Infinitiv Perfekt?"
    instructions: "Ergänze den Infinitiv Perfekt mit dem richtigen Hilfsverb (sein oder haben). 6 Items."
    text: |
      1. Bei dem Wetter kann er nicht zu Fuß {1} (gehen).
      2. Sie dürfte den Schlüssel {2} (verlieren).
      3. Er muss schon früher {3} (gehen), niemand hat ihn gesehen.
      4. Angeblich soll der Manager das Geld selbst {4} (nehmen).
      5. Sie soll früher in Paris {5} (leben).
      6. Bei dem Lärm kann sie unmöglich {6} (schlafen).
    answers:
      "1": "gegangen sein"
      "2": "verloren haben"
      "3": "gegangen sein"
      "4": "genommen haben"
      "5": "gelebt haben"
      "6": "geschlafen haben"

  - id: A6
    block: A
    type: matching
    title: "Sicherheitsgrad zuordnen"
    instructions: "Ordne jeder Aussage (1–6) den passenden Sicherheitsgrad (a–f) zu."
    left:
      - { key: "1", text: "Das muss stimmen." }
      - { key: "2", text: "Das dürfte stimmen." }
      - { key: "3", text: "Das könnte stimmen." }
      - { key: "4", text: "Das kann nicht stimmen." }
      - { key: "5", text: "Das mag stimmen, aber …" }
      - { key: "6", text: "Das müsste eigentlich stimmen." }
    right:
      - { key: a, text: "fast sicher (≈ 95 %)" }
      - { key: b, text: "wahrscheinlich (≈ 75 %)" }
      - { key: c, text: "möglich (≈ 50 %)" }
      - { key: d, text: "ausgeschlossen" }
      - { key: e, text: "Zugeständnis mit Einwand" }
      - { key: f, text: "begründete Erwartung" }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "mögen als Zugeständnis"
    instructions: "Ergänze mit mögen (mag) und einem passenden Gegensatz mit aber/trotzdem/doch. 4 Items."
    text: |
      1. Das {1} stimmen, aber es ändert nichts an der Sache.
      2. Er {2} ein Experte sein, trotzdem irrt er sich hier.
      3. Sie {3} recht haben — beweisen kann sie es aber nicht.
      4. Das Argument {4} überzeugend klingen, doch die Zahlen fehlen.
    answers:
      "1": mag
      "2": mag
      "3": mag
      "4": mag

  - id: A8
    block: A
    type: order
    title: "Satzbau: Vermutung über die Vergangenheit"
    prompt: "Bring die Wörter in die richtige Reihenfolge. Der Infinitiv Perfekt steht am Satzende."
    instructions: "Ordne die Wörter zu einem korrekten Satz."
    items:
      - tiles: [er, muss, sehr, reich, gewesen, sein]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Er muss sehr reich gewesen sein."
      - tiles: [sie, dürfte, den, Termin, vergessen, haben]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Sie dürfte den Termin vergessen haben."
      - tiles: [der, Zeuge, will, alles, gesehen, haben]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Der Zeuge will alles gesehen haben."
      - tiles: [er, soll, früher, viel, gereist, sein]
        answer: [0, 1, 2, 3, 4, 5]
        note: "Er soll früher viel gereist sein."

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "dürfte vs. darf"
    instructions: "Vermutung → dürfte (Konj. II). Erlaubnis → darf. Setz die richtige Form ein. 5 Items."
    text: |
      1. Du {1} hier nicht parken, das ist verboten. (Erlaubnis/Verbot)
      2. Sie {2} schon zu Hause sein, es ist spät. (Vermutung)
      3. Der Brief {3} morgen ankommen. (Vermutung)
      4. Kinder {4} diesen Film nicht sehen. (Erlaubnis/Verbot)
      5. Er {5} um die fünfzig sein, schätze ich. (Vermutung)
    answers:
      "1": darf
      "2": dürfte
      "3": dürfte
      "4": dürfen
      "5": dürfte

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Modalverb passend zum Sicherheitsgrad"
    instructions: "Wähle muss / dürfte / könnte / kann nicht / soll / will je nach Kontext in Klammern. 6 Items."
    text: |
      1. Alles spricht dafür: Sie {1} die neue Chefin sein. (fast sicher)
      2. Man erzählt sich, er {2} im Lotto gewonnen haben. (Gerücht, Vergangenheit)
      3. Er behauptet, er {3} den Unfall gesehen haben. (Selbstbehauptung, Vergangenheit)
      4. Vielleicht ist es ein Missverständnis — das {4} sein. (möglich)
      5. Ich habe ihn gerade gesehen, er {5} schon weg sein. (ausgeschlossen)
      6. Das Paket ist unterwegs, es {6} bald da sein. (wahrscheinlich)
    answers:
      "1": muss
      "2": soll
      "3": will
      "4": könnte
      "5": "kann nicht"
      "6": dürfte

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Dialog ergänzen: Wer ist die neue Kollegin?"
    instructions: "Fülle die 8 Lücken mit dem passenden Modalverb. Zwei Wörter werden nicht gebraucht."
    text: |
      — Hast du die neue Kollegin gesehen? Die {1} eine echte Expertin sein, so sicher wie sie auftritt.
      — Vorsicht, das ist nur dein Eindruck. Sie {2} auch einfach selbstbewusst sein, das heißt noch nichts.
      — Man sagt, sie {3} früher bei Google gearbeitet haben.
      — „Man sagt" — wer denn? Sie selbst {4} bei drei großen Firmen gewesen sein, behauptet sie zumindest.
      — Na ja, das {5} ja stimmen, aber überprüft hat es niemand.
      — Genau. Bei der Lücke im Lebenslauf {6} etwas passiert sein, das sie verschweigt.
      — Oder sie {7} im Ausland gewesen sein. Das steht oft nicht im CV.
      — Du hast recht, wir {8} sie einfach fragen, statt zu raten.
    bank: [muss, könnte, soll, will, mag, muss, könnte, sollten, dürfte, darf]
    answers:
      "1": muss
      "2": könnte
      "3": soll
      "4": will
      "5": mag
      "6": muss
      "7": könnte
      "8": sollten

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: 'Jeder Satz enthält genau einen Fehler. Finde ihn und schreib den Satz korrekt.'
    stimulus: |
      1. Er muss reich zu sein.
      2. Er will sehr reich sein. (gemeint: man sagt es / Gerücht)
      3. Vielleicht muss er der Chef sein.
      4. Sie dürfte den Termin vergessen sein.
      5. Er musste reich gewesen sein. (gemeint: Vermutung über die Vergangenheit)
      6. Das mag stimmen, und es ändert alles.
      7. Er soll dort gewesen. (Infinitiv fehlt)
      8. Er darf um die vierzig sein. (gemeint: Vermutung)
    model: |
      1. Er muss reich sein. (Modalverb + Infinitiv ohne „zu")
      2. Er soll sehr reich sein. (Gerücht → sollen, nicht wollen)
      3. Er muss der Chef sein. (subjektives müssen ist schon fast sicher — kein „vielleicht"; oder: Vielleicht ist er der Chef.)
      4. Sie dürfte den Termin vergessen haben. („vergessen" mit haben, nicht sein)
      5. Er muss reich gewesen sein. (Vermutung → Modalverb im Präsens + Infinitiv Perfekt, nicht „musste")
      6. Das mag stimmen, aber es ändert nichts. (mögen braucht den Gegensatz „aber")
      7. Er soll dort gewesen sein. (Infinitiv „sein" ergänzen)
      8. Er dürfte um die vierzig sein. (Vermutung → dürfte, nicht darf)

  - id: B3
    block: B
    type: free-write
    title: "Umschreiben: Vermutung → Modalverb"
    prompt: "Schreib jeden Satz mit einem subjektiven Modalverb (muss / dürfte / könnte / kann nicht) so um, dass der Sicherheitsgrad erhalten bleibt."
    stimulus: |
      1. Ich bin fast sicher, dass er krank ist. → Er ____.
      2. Wahrscheinlich ist sie schon zu Hause. → Sie ____.
      3. Es ist gut möglich, dass es ein Irrtum ist. → Das ____.
      4. Es ist ausgeschlossen, dass er das gesagt hat. → Er ____.
      5. Wahrscheinlich hat sie den Bus verpasst. → Sie ____.
      6. Es ist fast sicher, dass er schon gegangen ist. → Er ____.
    model: |
      1. Er muss krank sein.
      2. Sie dürfte schon zu Hause sein.
      3. Das könnte ein Irrtum sein.
      4. Er kann das nicht gesagt haben.
      5. Sie dürfte den Bus verpasst haben.
      6. Er muss schon gegangen sein.

  - id: B4
    block: B
    type: free-write
    title: "Umschreiben: Gerücht & Selbstbehauptung"
    prompt: "Gib jede Information einmal als Gerücht (sollen) und einmal als Selbstbehauptung (wollen) wieder."
    stimulus: |
      Beispiel: Diese Person hat in Harvard studiert.
      → Gerücht: Sie soll in Harvard studiert haben.
      → Selbstbehauptung: Sie will in Harvard studiert haben.

      1. Der Nachbar war früher Profisportler.
      2. Die Politikerin hat von der Affäre nichts gewusst.
      3. Der Manager hat das Projekt allein geleitet.
    model: |
      1. Gerücht: Der Nachbar soll früher Profisportler gewesen sein.
         Selbstbehauptung: Der Nachbar will früher Profisportler gewesen sein.
      2. Gerücht: Die Politikerin soll von der Affäre nichts gewusst haben.
         Selbstbehauptung: Die Politikerin will von der Affäre nichts gewusst haben.
      3. Gerücht: Der Manager soll das Projekt allein geleitet haben.
         Selbstbehauptung: Der Manager will das Projekt allein geleitet haben.

  - id: B5
    block: B
    type: matching
    title: "Aussage und Bedeutung verbinden"
    instructions: "Ordne jeder Modalverb-Aussage (1–6) die richtige Bedeutung (a–f) zu."
    left:
      - { key: "1", text: "Er soll reich sein." }
      - { key: "2", text: "Er will reich sein." }
      - { key: "3", text: "Er muss reich sein." }
      - { key: "4", text: "Er dürfte reich sein." }
      - { key: "5", text: "Er kann nicht reich sein." }
      - { key: "6", text: "Er mag reich sein, aber …" }
    right:
      - { key: a, text: "Man sagt es (Gerücht)." }
      - { key: b, text: "Er behauptet es selbst (mit Zweifel)." }
      - { key: c, text: "Der Sprecher ist fast sicher." }
      - { key: d, text: "Der Sprecher hält es für wahrscheinlich." }
      - { key: e, text: "Der Sprecher schließt es aus." }
      - { key: f, text: "Der Sprecher gibt es zu, hat aber einen Einwand." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d
      "5": e
      "6": f

  - id: B6
    block: B
    type: order
