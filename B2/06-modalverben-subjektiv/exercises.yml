    model: |
      Mein Kollege Tom verhält sich seit Tagen seltsam. Er kommt zu spät und ist
      sehr still — er muss große Sorgen haben, anders kann ich mir das nicht
      erklären. Vielleicht hat es mit seiner Familie zu tun; das könnte sein,
      sicher weiß ich es nicht. Man sagt, er soll Streit mit dem Chef gehabt
      haben, aber das ist nur Gerede. Er selbst will von keinem Problem wissen
      und behauptet, alles sei in Ordnung. Das mag stimmen, aber sein Gesicht
      sagt etwas anderes. Er dürfte schlecht geschlafen haben, so müde wie er
      aussieht. Eines ist klar: So entspannt wie früher kann er im Moment nicht
      sein. Ich werde ihn einfach fragen, statt weiter zu raten.

