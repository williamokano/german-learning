  - id: B3
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz hat genau einen Fehler (falscher Begriff, falsche Präposition oder falscher Kasus). Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Der Umsatz ist mit 8 % gestiegen.
      2. Wir wachsen auf den asiatischen Markt.
      3. Die GmbH ist eine Aktiengesellschaft.
      4. Der Vorstand hat dem Vorschlag zugestimmt (im Geschäftsbericht).
      5. Bei Zahlung in 10 Tagen geben wir 2 % Skonto.
      6. Sehr geehrte Frau Yilmaz ohne Komma.
    model: |
      1. Der Umsatz ist um 8 % gestiegen. (statische Mengenangabe mit um, nicht mit)
      2. Wir wachsen in den asiatischen Markt. (Richtung mit in + Akkusativ)
      3. Die AG ist eine Aktiengesellschaft. (AG = Aktiengesellschaft, GmbH = Gesellschaft mit beschränkter Haftung)
      4. Der Vorstand habe dem Vorschlag zugestimmt. (im Geschäftsbericht: Konjunktiv I = Wiedergabe)
      5. Bei Zahlung innerhalb von 10 Tagen geben wir 2 % Skonto. (feste Wendung: innerhalb von + Dativ)
      6. Sehr geehrte Frau Yilmaz, vielen Dank für Ihre Nachricht. (Anrede: Komma nach dem Namen)

