  - id: A4
    block: A
    type: single-choice
    title: "Umsatz, Gewinn oder Verlust?"
    instructions: "Wähle den passenden Begriff (a, b oder c)."
    items:
      - q: "Was sind die gesamten Einnahmen eines Unternehmens in einer Periode?"
        options:
          - { key: a, text: "der Gewinn" }
          - { key: b, text: "der Umsatz" }
          - { key: c, text: "die Bilanz" }
        answer: b
        why: "Der Umsatz = gesamte Einnahmen (ohne Abzug der Kosten)."
      - q: "Was bleibt nach Abzug aller Kosten übrig?"
        options:
          - { key: a, text: "der Umsatz" }
          - { key: b, text: "der Verlust" }
          - { key: c, text: "der Gewinn" }
        answer: c
        why: "Der Gewinn = Umsatz minus Kosten."
      - q: "Wie nennt man einen negativen Gewinn?"
        options:
          - { key: a, text: "den Verlust" }
          - { key: b, text: "die Investition" }
          - { key: c, text: "die Bilanz" }
        answer: a
        why: "Verlust = negativer Gewinn (rote Zahlen)."
      - q: "Was zeigt die Bilanz?"
        options:
          - { key: a, text: "nur das Vermögen" }
          - { key: b, text: "nur die Schulden" }
          - { key: c, text: "Vermögen und Schulden gegenüber" }
        answer: c
        why: "Die Bilanz = Gegenüberstellung von Vermögen und Schulden."
      - q: 'Was bedeutet „wir investieren in neue Maschinen"?'
        options:
          - { key: a, text: "Wir geben Geld für Werbung aus." }
          - { key: b, text: "Wir tätigen eine langfristige Geldausgabe für Werte." }
          - { key: c, text: "Wir kaufen Büromaterial." }
        answer: b
        why: "Investition = langfristige Geldausgabe für Werte (Maschinen, Gebäude, Standorte)."

