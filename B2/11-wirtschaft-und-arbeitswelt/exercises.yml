lesson: B2/11
title: "B2 · Lektion 11 — Übungen (Wirtschaft und Arbeitswelt)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Lösungen in solutions.md.
  Tipp: Verteile die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D nach einer Pause am Tag 4.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Der Umsatz ist im letzten Quartal um zwölf Prozent gestiegen."
        answer: true
        why: 'Anna: „Unser Umsatz ist um zwölf Prozent gestiegen."'
      - q: "Der Gewinn ist genauso stark gestiegen wie der Umsatz."
        answer: false
        why: 'Anna: „Der Gewinn auch, aber nicht so stark", weil die Kosten gestiegen sind.'
      - q: "Anna hat ein Meeting mit Frau Yilmaz."
        answer: true
        why: 'Anna: „Ja, gleich um zehn." (Meeting mit Frau Yilmaz)'
      - q: "Bruno rät Anna, im Konjunktiv zu sprechen, um diplomatischer zu klingen."
        answer: true
        why: 'Bruno: „Sag … ‚Ich würde vorschlagen, dass wir …‘. Mit dem Konjunktiv klingst du diplomatischer."'
      - q: 'Bruno empfiehlt, direkt „Das ist zu teuer“ zu sagen.'
        answer: false
        why: 'Bruno empfiehlt das Gegenteil: „Wäre da noch ein bisschen Spielraum?" wirkt besser.'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Welchen Vorschlag macht Anna?"
        options:
          - { key: a, text: "Fünf Prozent Rabatt bei längerer Vertragslaufzeit." }
          - { key: b, text: "Zehn Prozent Rabatt ohne Bedingung." }
          - { key: c, text: "Gar keinen Rabatt." }
        answer: a
        why: 'Anna: „einen Rabatt von fünf Prozent anbieten, dafür aber eine längere Vertragslaufzeit verlangen".'
      - q: "Was ist Frau Yilmaz' Einwand?"
        options:
          - { key: a, text: "Der Kunde ist nicht zuverlässig." }
          - { key: b, text: "Ein Rabatt würde den Gewinn verringern." }
          - { key: c, text: "Die Vertragslaufzeit ist zu kurz." }
        answer: b
        why: 'Frau Yilmaz: „Allerdings würde ein Rabatt unseren Gewinn spürbar verringern."'
      - q: "Bis wann will Anna die Kalkulation schicken?"
        options:
          - { key: a, text: "Bis Montag." }
          - { key: b, text: "Bis Donnerstag." }
          - { key: c, text: "Bis nächste Woche." }
        answer: b
        why: 'Anna: „Ich würde Ihnen die Zahlen gern bis Donnerstag schicken."'
      - q: "Was soll am Freitag passieren?"
        options:
          - { key: a, text: "Der Kunde unterschreibt den Vertrag." }
          - { key: b, text: "Der Vorschlag wird der Geschäftsführung vorgelegt." }
          - { key: c, text: "Die Abteilung macht Betriebsausflug." }
        answer: b
        why: 'Frau Yilmaz: „dass wir den Vorschlag am Freitag der Geschäftsführung vorlegen".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Wirtschaftsnachrichten"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und fülle die 7 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Und nun zu den Wirtschaftsnachrichten. Der Autohersteller Nordwerk hat heute seine
      Quartalszahlen vorgelegt. Das Unternehmen teilte mit, der {1} sei im Vergleich
      zum Vorjahr um acht Prozent {2}. Der {3} habe sich sogar verdoppelt. Wegen
      der starken {4} nach Elektroautos sollen im Werk Leipzig fünfhundert neue
      {5} geschaffen werden. Die Gewerkschaft begrüßte die Pläne, forderte aber
      zugleich höhere {6}. Ein Sprecher erklärte, die Mitarbeiter {7} in den letzten
      Jahren auf vieles verzichtet.
    bank: [Umsatz, gestiegen, Gewinn, Nachfrage, Stellen, Löhne, hätten, Verlust, gesunken, Kosten]
    answers:
      "1": Umsatz
      "2": gestiegen
      "3": Gewinn
      "4": Nachfrage
      "5": Stellen
      "6": Löhne
      "7": hätten

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht von Frau Yilmaz"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript liest."
    optionLayout: block
    transcript: 'Guten Tag, Frau Kowalski, hier ist Yilmaz. Ich rufe wegen des Hamburger Angebots an. Die Geschäftsführung hat sich Ihren Vorschlag angesehen und ist grundsätzlich einverstanden. Allerdings möchte sie den Rabatt auf vier Prozent begrenzen. Könnten Sie die Kalkulation bitte entsprechend anpassen und mir bis morgen Mittag zur Verfügung stellen? Für Rückfragen bin ich den ganzen Nachmittag erreichbar. Bitte rufen Sie mich kurz zurück. Vielen Dank und auf Wiederhören.'
    items:
      - q: "Warum ruft Frau Yilmaz an?"
        options:
          - { key: a, text: "Wegen einer Kündigung." }
          - { key: b, text: "Wegen des Hamburger Angebots." }
          - { key: c, text: "Wegen eines Vorstellungsgesprächs." }
        answer: b
        why: '„Ich rufe wegen des Hamburger Angebots an."'
      - q: "Was möchte die Geschäftsführung ändern?"
        options:
          - { key: a, text: "Den Rabatt auf vier Prozent begrenzen." }
          - { key: b, text: "Die Vertragslaufzeit verkürzen." }
          - { key: c, text: "Das ganze Angebot ablehnen." }
        answer: a
        why: '„sie möchte den Rabatt auf vier Prozent begrenzen".'
      - q: "Bis wann soll Anna die Kalkulation liefern?"
        options:
          - { key: a, text: "Bis heute Abend." }
          - { key: b, text: "Bis morgen Mittag." }
          - { key: c, text: "Bis Freitag." }
        answer: b
        why: '„mir bis morgen Mittag zur Verfügung stellen".'
      - q: "Was soll Anna tun?"
        options:
          - { key: a, text: "Eine E-Mail an den Kunden schreiben." }
          - { key: b, text: "Frau Yilmaz kurz zurückrufen." }
          - { key: c, text: "Den Vertrag sofort unterschreiben." }
        answer: b
        why: '„Bitte rufen Sie mich kurz zurück."'

