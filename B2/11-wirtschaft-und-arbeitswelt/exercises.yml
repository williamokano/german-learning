  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Direkt → höflich (Verhandeln)"
    instructions: "Formuliere die direkte Aussage höflich um. Ergänze die fehlende Konjunktiv-Form. 6 Items."
    text: |
      1. (Direkt: Geben Sie uns einen Rabatt.) → {1} (können) Sie uns beim Preis entgegenkommen?
      2. (Direkt: Das ist zu teuer.) → {2} (sein) da noch Spielraum?
      3. (Direkt: Ich will mehr Gehalt.) → Ich {3} (werden) mir gern ein höheres Gehalt wünschen.
      4. (Direkt: Helfen Sie mir.) → Es {4} (sein) super, wenn Sie mir helfen könnten.
      5. (Direkt: Schicken Sie die Kalkulation.) → {5} (können) Sie mir die Kalkulation schicken?
      6. (Direkt: Ich schlage einen Mittelweg vor.) → Ich {6} (werden) einen Mittelweg vorschlagen.
    answers:
      "1": Könnten
      "2": Wäre
      "3": würde
      "4": wäre
      "5": Könnten
      "6": würde

