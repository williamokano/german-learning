      2. Der Gewinn ist trotzdem um 2 % {2}.
      3. Wir {3} in den asiatischen Markt.
      4. Die Konkurrenz {4} — zwei Anbieter haben aufgegeben.
      5. Die Investition {5} sich nach drei Jahren.
      6. Die Nachfrage {6} seit Monaten stark an.
      7. Die Kosten {7} nach der Krise plötzlich ein.
      8. Die Nachfrage ist leicht {8}.
    answers:
      "1": gestiegen
      "2": gesunken
      "3": wachsen
      "4": schrumpft
      "5": amortisiert
      "6": zieht
      "7": eingebrochen
      "8": gesunken

  - id: A3
    block: A
