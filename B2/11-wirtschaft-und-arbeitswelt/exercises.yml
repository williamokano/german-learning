  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Indirekte Rede in Nachrichten (Wiederholung B2/04)"
    instructions: "Gib die direkte Aussage indirekt wieder (Konjunktiv I). 5 Items."
    text: |
      1. „Der Umsatz ist gestiegen." → Das Unternehmen erklärte, der Umsatz {1} gestiegen.
      2. „Wir schaffen neue Stellen." → Der Konzern teilte mit, man {2} neue Stellen schaffen.
      3. „Die Löhne sind zu niedrig." → Die Gewerkschaft sagte, die Löhne {3} zu niedrig.
      4. „Wir können nicht mehr zahlen." → Die Firma betonte, sie {4} nicht mehr zahlen.
      5. „Der Gewinn hat sich verdoppelt." → Der Sprecher sagte, der Gewinn {5} sich verdoppelt.
    answers:
      "1": sei
      "2": werde
      "3": seien
      "4": könne
      "5": habe

  - id: A11
    block: A
    type: categorize
    title: "Redemittel sortieren: zustimmen, widersprechen, vorschlagen"
    instructions: "Ordne jede Wendung der richtigen Funktion zu."
    buckets:
      - { key: vorschlag, label: "Vorschlag machen" }
      - { key: zustimmen, label: "Zustimmen" }
      - { key: widersprechen, label: "Widersprechen" }
    tokens:
      - { text: "Ich würde vorschlagen, dass wir …", bucket: vorschlag }
      - { text: "Wie wäre es, wenn wir …?", bucket: vorschlag }
      - { text: "Man könnte auch …", bucket: vorschlag }
      - { text: "Dem kann ich nur zustimmen.", bucket: zustimmen }
      - { text: "Das sehe ich genauso.", bucket: zustimmen }
      - { text: "Da haben Sie völlig recht.", bucket: zustimmen }
      - { text: "Das sehe ich etwas anders.", bucket: widersprechen }
      - { text: "Das ist ein berechtigter Einwand, dennoch …", bucket: widersprechen }
      - { text: "Ich bin da anderer Meinung.", bucket: widersprechen }

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Verhandlungsdialog ergänzen"
    instructions: "Ergänze die 8 Lücken mit dem passenden Wort aus dem Kasten. Drei Wörter sind zu viel."
    text: |
      — Guten Tag. Sie wollten einen {1} zum Angebot machen?
      — Ja, gern. Ich {2} vorschlagen, dass wir Ihnen einen {3} von fünf Prozent geben.
      — Ein interessanter Gedanke. Allerdings {4} das unseren Gewinn verringern.
      — Das ist ein berechtigter {5}. Aber bei längerer {6} bleibt der Gewinn stabil.
      — Gut. {7} Sie mir bis Freitag eine Kalkulation zur Verfügung stellen?
      — Selbstverständlich. Für {8} stehe ich Ihnen jederzeit zur Verfügung.
    bank: [Vorschlag, würde, Rabatt, würde, Einwand, Vertragslaufzeit, Könnten, Rückfragen, Gewinn, Verlust, treffen]
    answers:
      "1": Vorschlag
      "2": würde
      "3": Rabatt
      "4": würde
      "5": Einwand
      "6": Vertragslaufzeit
      "7": Könnten
      "8": Rückfragen

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Jeder Satz enthält genau einen Fehler. Finde ihn und schreib den Satz korrekt."
    stimulus: |
      1. Wir haben gestern eine Entscheidung gemacht.
      2. Der Umsatz hat um zwölf Prozent gestiegen.
      3. Ich würde möchten einen Rabatt von fünf Prozent.
      4. Er sagte, der Gewinn ist gestiegen.
      5. Im Werk werden 500 neue Stellen schaffen.
      6. Das Werk wurde letztes Jahr geschlossen worden.
      7. Der Preis spielt eine wichtige Sache.
      8. Das wäret für uns keine Option.
    model: |
      1. Wir haben gestern eine Entscheidung getroffen. (festes FVG: eine Entscheidung treffen, nicht machen)
      2. Der Umsatz ist um zwölf Prozent gestiegen. (steigen bildet das Perfekt mit sein)
      3. Ich möchte einen Rabatt von fünf Prozent. / Ich würde gern … (nicht würde + möchten stapeln)
      4. Er sagte, der Gewinn sei gestiegen. (indirekte Rede → Konjunktiv I sei)
      5. Im Werk werden 500 neue Stellen geschaffen. (Passiv braucht das Partizip II)
      6. Das Werk wurde letztes Jahr geschlossen. (Präteritum Passiv: ein worden zu viel)
      7. Der Preis spielt eine wichtige Rolle. (festes Nomen: eine Rolle spielen)
      8. Das wäre für uns keine Option. (Konjunktiv-II-Form von sein ist wäre, nicht wäret)

  - id: B3
    block: B
    type: matching
    title: "Frage und Reaktion im Meeting verbinden"
    instructions: "Ordne jeder Aussage (1–6) die passende Reaktion (a–f) zu."
    left:
      - { key: "1", text: "Ich würde vorschlagen, den Termin zu verschieben." }
      - { key: "2", text: "Der Preis ist für uns zu hoch." }
      - { key: "3", text: "Könnten Sie das genauer erläutern?" }
      - { key: "4", text: "Wir sollten in neue Märkte investieren." }
      - { key: "5", text: "Halten wir also fest, was wir beschlossen haben?" }
      - { key: "6", text: "Gibt es dazu noch Fragen?" }
    right:
      - { key: a, text: "Gern. Ich erkläre es Ihnen anhand der Zahlen." }
      - { key: b, text: "Wäre da noch ein bisschen Spielraum?" }
      - { key: c, text: "Nein, vielen Dank, das war alles." }
      - { key: d, text: "Ja: fünf Prozent Rabatt bei zwei Jahren Laufzeit." }
      - { key: e, text: "Dem kann ich nur zustimmen, der Termin passt sonst nicht." }
      - { key: f, text: "Das ist ein berechtigter Einwand, dennoch sehe ich ein Risiko." }
    answers:
      "1": e
      "2": b
      "3": a
      "4": f
      "5": d
      "6": c

  - id: B4
    block: B
    type: free-write
    title: "Höflich widersprechen"
    prompt: 'Widersprich jeder Aussage höflich nach dem Muster „erst zustimmen, dann eigener Punkt“ (Da haben Sie recht, allerdings …). Schreib je einen Satz.'
    stimulus: |
      1. „Wir sollten den Preis sofort senken."
      2. „Der neue Kunde ist nicht wichtig."
      3. „Wir brauchen keine längere Vertragslaufzeit."
      4. „Die Kosten spielen keine Rolle."
    model: |
      1. Da haben Sie recht, der Preis ist ein Argument. Allerdings würde ich vorschlagen, ihn nur bei längerer Laufzeit zu senken.
      2. Das ist ein berechtigter Einwand, dennoch sehe ich beim neuen Kunden ein großes Potenzial.
      3. Im Prinzip ja, allerdings gibt eine längere Laufzeit uns mehr Planungssicherheit.
      4. Da ist etwas dran, aber gerade bei diesem Projekt spielen die Kosten eine zentrale Rolle.

  - id: B5
    block: B
    type: free-write
    title: "Berichtssätze bilden (Nominalstil + FVG)"
    prompt: "Wandle jeden gesprochenen Satz in einen Berichtssatz um (Nominalstil oder Funktionsverbgefüge)."
    stimulus: |
      1. Der Umsatz ist stark gestiegen.
      2. Die Kosten sind gesunken.
      3. Wir haben entschieden, zu investieren.
