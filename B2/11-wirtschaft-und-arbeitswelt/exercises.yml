      "2": Rückgang
      "3": Entscheidung
      "4": Entwicklung
      "5": Wachstum

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Passiv in Nachrichten (Wiederholung B1/04)"
    instructions: "Bilde das Passiv mit werden + Partizip II. 5 Items."
    text: |
      1. Im Werk {1} (schaffen — Präsens Passiv) 500 neue Stellen.
      2. Letztes Jahr {2} (schließen — Präteritum Passiv) die Filiale in München.
      3. Die Preise müssen {3} (erhöhen — Passiv mit Modalverb).
      4. Der Vertrag ist gestern {4} (unterschreiben — Perfekt Passiv).
      5. Tausend Stellen {5} (abbauen — Präsens Passiv).
    answers:
