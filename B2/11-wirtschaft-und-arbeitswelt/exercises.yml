  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "Vom Verbalstil zum Nominalstil (Wiederholung B2/01)"
    instructions: "Ergänze das passende Nomen zum Verb. 5 Items."
    text: |
      1. Der Umsatz ist gestiegen. → der {1} des Umsatzes (steigen)
      2. Die Kosten sind gesunken. → der {2} der Kosten (sinken)
      3. Die Firma hat entschieden. → die {3} der Firma (entscheiden)
      4. Das Unternehmen hat sich entwickelt. → die {4} des Unternehmens (entwickeln)
      5. Die Nachfrage ist gewachsen. → das {5} der Nachfrage (wachsen)
    answers:
