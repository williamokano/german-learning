  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: free-write
    title: "Geschäftszahlen in Sätzen versprachlichen"
    prompt: "Schreib zu jeder Zahlensituation einen klaren Satz mit passendem Verb."
    stimulus: |
      1. Der Umsatz der Müller AG ist im 2. Quartal um 6 % gestiegen.
      2. Der Gewinn ist um 4 % gesunken.
      3. Die Kosten sind um eine Million Euro gestiegen.
      4. Die Nachfrage in der Baubranche geht leicht zurück.
      5. Wir wachsen in den asiatischen Markt.
      6. Die Investition amortisiert sich nach drei Jahren.
    model: |
      1. Der Umsatz der Müller AG ist im zweiten Quartal um 6 % gestiegen.
      2. Der Gewinn ist im Vergleich zum Vorjahresquartal um 4 % gesunken.
      3. Die Kosten sind um eine Million Euro gestiegen.
      4. Die Nachfrage in der Baubranche geht leicht zurück.
      5. Wir wachsen in den asiatischen Markt.
      6. Die Investition amortisiert sich nach drei Jahren.

