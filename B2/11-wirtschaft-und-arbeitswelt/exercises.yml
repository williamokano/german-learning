    listLayout: true
    title: "Zahlen versprachlichen (steigen / sinken / bleiben)"
    instructions: "Ergänze das passende Verb im Perfekt oder Partizip. 6 Items."
    text: |
      1. Der Umsatz ist um 12 % {1} (steigen).
      2. Der Gewinn ist um 5 % {2} (sinken / zurückgehen — wähle: gesunken).
