lesson: B2/11
title: "B2 · Lektion 11 — Übungen (Wirtschaft und Arbeitswelt)"
intro: >
  Blöcke: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Die Lösungen findest du in solutions.md.
  Tipp: Verteil die Blöcke über mehrere Tage — H und A am Tag 1, B am Tag 2,
  C am Tag 3, D am Tag 4 nach einer Pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell — Flur-Gespräch)"
    audio: dialog1_a.mp3
    instructions: "Hör Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia berichtet, dass der Umsatz im ersten Quartal gestiegen ist."
        answer: true
        why: 'Mia: „Der Umsatz ist im ersten Quartal um acht Prozent gestiegen".'
      - q: "Lukas sagt, dass der Gewinn gestiegen ist."
        answer: false
        why: 'Lukas erklärt, dass der Gewinn trotz der Umsatzsteigerung „natürlich auf den Gewinn drückt" — also gesunken ist.'
      - q: "Die Firma hat unter anderem in neue Maschinen investiert."
        answer: true
        why: 'Lukas: „Wir haben kräftig investiert — neue Maschinen, zwei neue Standorte".'
      - q: "Mia schlägt einen Rabatt von drei Prozent bei Zahlung innerhalb von zehn Tagen vor."
        answer: true
        why: 'Mia: „Können wir denen nicht einen Rabatt von drei Prozent anbieten, wenn sie innerhalb von zehn Tagen zahlen?"'
      - q: "Mia möchte, dass Lukas auch die Konditionen für den Großkunden aus Hamburg prüft."
        answer: true
        why: 'Mia: „frag bitte auch nach, ob die Konditionen für unseren Großkunden aus Hamburg noch stimmen".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell — Lieferantenverhandlung)"
    audio: dialog1_b.mp3
    instructions: "Hör Dialog B und wähle die richtige Antwort (a, b oder c)."
    optionLayout: block
    items:
      - q: "Worauf möchte Frau Yilmaz zu Beginn Bezug nehmen?"
        options:
          - { key: a, text: "Auf das Angebot vom letzten Donnerstag." }
          - { key: b, text: "Auf einen alten Vertrag." }
          - { key: c, text: "Auf eine Mahnung." }
        answer: a
        why: 'Frau Yilmaz: „Ich darf noch einmal auf das Angebot vom letzten Donnerstag Bezug nehmen".'
      - q: "Welche Lieferzeit verlangt Frau Yilmaz?"
        options:
          - { key: a, text: "Acht Wochen." }
          - { key: b, text: "Sechs Wochen." }
          - { key: c, text: "Vier Wochen." }
        answer: b
        why: 'Frau Yilmaz: „Wir brauchen die Ware spätestens nach sechs Wochen".'
      - q: "Wie viel Skonto verlangt Frau Yilmaz bei Zahlung binnen zehn Tagen?"
        options:
          - { key: a, text: "Ein Prozent." }
          - { key: b, text: "Zwei Prozent." }
          - { key: c, text: "Fünf Prozent." }
        answer: b
        why: 'Frau Yilmaz: „Bei Zahlung innerhalb von zehn Tagen erwarten wir zwei Prozent Skonto".'
      - q: "Welche Vertragsstrafe schlägt Herr Steinmeyer vor?"
        options:
          - { key: a, text: "0,5 % pro Woche Verspätung." }
          - { key: b, text: "1 % pro Woche, maximal 5 % der Auftragssumme." }
          - { key: c, text: "10 % pauschal." }
        answer: b
        why: 'Herr Steinmeyer: „Eine Vertragsstrafe von einem Prozent pro Woche Verspätung, maximal fünf Prozent der Auftragssumme".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Nachricht aus dem Sekretariat"
    audio: hoertext.mp3
    instructions: "Hör den Hörtext und füll die 7 Lücken. Drei Wörter im Kasten sind zu viel."
    text: |
      Guten Tag, Herr Steinmeyer, hier ist das Sekretariat der Müller AG. Es geht um das
      {1} vom letzten Donnerstag. Die Geschäftsführung hat den Vorschlag geprüft und
      möchte zum {2} bringen, dass der Preis in der vorgeschlagenen Höhe nicht in {3}
      kommt. Wir bitten Sie, das Angebot zu überarbeiten und uns bis spätestens
      Donnerstag, 18 Uhr, ein neues Angebot zukommen zu lassen. Bei Zahlung innerhalb
      von zehn Tagen können wir zwei Prozent {4} gewähren. Eine {5} bei verspäteter
      Lieferung ist für uns selbstverständlich. Für {6} stehe ich Ihnen den ganzen Tag
      zur {7}. Bitte rufen Sie mich kurz zurück.
    bank: [Angebot, Ausdruck, Frage, Skonto, Vertragsstrafe, Rückfragen, Verfügung, Betracht, Kauf, Mahnung]
    answers:
      "1": Angebot
      "2": Ausdruck
      "3": Frage
      "4": Skonto
      "5": Vertragsstrafe
      "6": Rückfragen
      "7": Verfügung

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Nachricht auf dem Anrufbeantworter"
    audio: transcript_ansage1.mp3
    instructions: "Hör die Nachricht auf dem Anrufbeantworter. Wähle dann die richtige Antwort (a, b oder c). Hör einmal, bevor du das Transkript unten liest."
    optionLayout: block
    transcript: 'Guten Tag, Frau Berger, hier ist die Buchhaltung der Hartmann GmbH. Es geht um Ihre Rechnung vom 15. Mai, die seit vier Wochen überfällig ist. Wir möchten Sie darauf hinweisen, dass bei Zahlung innerhalb der nächsten sieben Tagen noch zwei Prozent Skonto gewährt werden. Andernfalls müssen wir eine Mahnung mit Verzugszinsen verschicken. Bitte rufen Sie mich kurz zurück. Vielen Dank und auf Wiederhören.'
    items:
      - q: "Worum geht es in der Nachricht?"
        options:
          - { key: a, text: "Um eine seit vier Wochen überfällige Rechnung." }
          - { key: b, text: "Um eine neue Lieferung." }
          - { key: c, text: "Um einen Vertragsabschluss." }
        answer: a
        why: '„Es geht um Ihre Rechnung vom 15. Mai, die seit vier Wochen überfällig ist".'
      - q: "Welche Vergünstigung wird angeboten?"
        options:
          - { key: a, text: "Drei Prozent Rabatt." }
          - { key: b, text: "Zwei Prozent Skonto bei Zahlung in den nächsten sieben Tagen." }
          - { key: c, text: "Verzugszinsen in Höhe von fünf Prozent." }
        answer: b
        why: '„bei Zahlung innerhalb der nächsten sieben Tagen noch zwei Prozent Skonto gewährt".'
      - q: "Was passiert, wenn nicht gezahlt wird?"
        options:
          - { key: a, text: "Eine Mahnung mit Verzugszinsen." }
          - { key: b, text: "Eine kostenlose Verlängerung." }
          - { key: c, text: "Eine neue Lieferung." }
        answer: a
        why: '„müssen wir eine Mahnung mit Verzugszinsen verschicken".'
      - q: "Wie soll Frau Berger reagieren?"
        options:
          - { key: a, text: "Sie soll sofort überweisen." }
          - { key: b, text: "Sie soll zurückrufen." }
          - { key: c, text: "Sie soll einen neuen Vertrag unterschreiben." }
        answer: b
        why: '„Bitte rufen Sie mich kurz zurück".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

