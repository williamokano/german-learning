  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Konjunktiv II der Höflichkeit"
    instructions: "Setze das Verb in den Konjunktiv II (Höflichkeitsform). 6 Items."
    text: |
      1. {1} (sein) da noch ein bisschen Spielraum beim Preis?
      2. {2} (können) Sie mir die Zahlen bis Freitag schicken?
      3. Eine Frage {3} (haben) ich noch.
      4. Ich {4} (werden) gern einen Kompromiss vorschlagen.
      5. Das {5} (sein) für uns leider keine Option.
      6. {6} (können) wir Ihnen entgegenkommen, wenn Sie länger unterschreiben.
