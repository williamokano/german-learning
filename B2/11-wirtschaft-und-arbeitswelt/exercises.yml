    block: A
    type: gap-text
    listLayout: true
    title: "Wirtschaftsbegriffe zuordnen"
    instructions: "Setze das passende Wort ein (Umsatz, Gewinn, Verlust, Bilanz, Investition, Kosten, Personal, Steuer). 8 Items."
    text: |
      1. Der {1} ist die gesamten Einnahmen einer Periode.
      2. Der {2} ist das, was nach allen Kosten übrig bleibt.
      3. Der {3} ist ein negativer Gewinn.
      4. Die {4} zeigt Vermögen und Schulden eines Unternehmens.
      5. Eine {5} ist eine langfristige Geldausgabe für Werte.
      6. Die {6} für Produktion und Betrieb sind gestiegen.
      7. Das {7} eines Unternehmens umfasst alle Mitarbeiter.
      8. Die {8} ist eine Abgabe an den Staat.
    answers:
      "1": Umsatz
      "2": Gewinn
      "3": Verlust
      "4": Bilanz
      "5": Investition
      "6": Kosten
      "7": Personal
      "8": Steuer

