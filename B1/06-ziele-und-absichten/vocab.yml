# Reviewed from B1/06 lesson.md §4 Wortschatz.
# Note: V2 parser captured most entries. Paren-trusted plurals (`die Vorsätze`,
# `die Anträge`, `die Lebensläufe`, `die Projektanträge`) bled into `en`. 12 verb+zu
# entries were tagged `pos: phrase` instead of `verb`; their 3rd-person forms
# (`vergisst`, `empfiehlt`, `bittet`, `schlägt vor`) leaked as English glosses.
# `Vorhaben`/`Anschreiben` falsely umlauted (no-pl. → `plural: null`). All hand-fixed.
#
# Section headers in lesson.md:
#   Ziele und Pläne (goals and plans)                — 14 nouns
#   Verben mit Infinitiv mit zu                       — 12 verbs (zu-infinitiv pattern)
#   Bewerbung und Beruf (application and job)         — 12 nouns
