  # ── Verben mit Infinitiv mit zu — 12 verbs ────────────────────────────────
  # These all take a `zu`-infinitive complement. Lesson Lerntipp: separable verbs
  # put the `zu` in the middle (anzufangen, aufzuhören, vorzuhaben).
  - de: versuchen
    article: null
    plural: null
    en: to try to …
    pos: verb
    tags: [verb, zu-infinitiv]
    core: true
    example: "Ich versuche, pünktlich zu kommen."
  - de: anfangen
    article: null
    plural: null
    en: to begin to …; to start …
    pos: verb
    tags: [verb, zu-infinitiv, separable, strong]
    core: true
    example: "Ich fange an, Deutsch zu lernen."
  - de: aufhören
    article: null
    plural: null
    en: to stop …; to quit …
    pos: verb
    tags: [verb, zu-infinitiv, separable]
    core: true
    example: "Hör auf, so laut zu sprechen!"
  - de: vergessen
    article: null
    plural: null
    en: to forget to …
    pos: verb
    tags: [verb, zu-infinitiv, strong]
    core: true
    example: "Vergiss nicht, das Buch mitzubringen."
  - de: hoffen
    article: null
    plural: null
    en: to hope to …
    pos: verb
    tags: [verb, zu-infinitiv]
    core: true
    example: "Ich hoffe, dich bald zu sehen."
  - de: planen
    article: null
    plural: null
    en: to plan to …
    pos: verb
    tags: [verb, zu-infinitiv]
    core: true
  - de: vorhaben
    article: null
    plural: null
    en: to intend to …; to plan to …
    pos: verb
    tags: [verb, zu-infinitiv, separable, strong]
    core: true
    example: "Ich habe vor, morgen zu kommen."
  - de: empfehlen
    article: null
    plural: null
    en: to recommend …
    pos: verb
    tags: [verb, zu-infinitiv, strong]
    core: true
    example: "Ich empfehle, das Buch zu lesen."
  - de: bitten
    article: null
    plural: null
    en: to ask (someone) to …
    pos: verb
    tags: [verb, zu-infinitiv, strong]
    core: true
    example: "Ich bitte dich, mir zu helfen."
  - de: vorschlagen
    article: null
    plural: null
    en: to suggest …
    pos: verb
    tags: [verb, zu-infinitiv, separable, strong]
    core: true
    example: "Ich schlage vor, morgen zu gehen."
  - de: beschließen
    article: null
    plural: null
    en: to decide to …
    pos: verb
    tags: [verb, zu-infinitiv, strong]
    core: true
    example: "Ich habe beschlossen, zu bleiben."
  - de: vornehmen
    article: null
    plural: null
    en: to resolve to …; to set out to …
    pos: verb
    tags: [verb, zu-infinitiv, separable, strong, reflexive]
    core: true
    example: "Ich nehme mir vor, mehr Sport zu machen."

