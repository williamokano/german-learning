  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "`um … zu + Infinitiv` — Grundübung (reguläre Verben)"
    instructions: "Complete each sentence with `um … zu` + the verb in brackets. 8 items."
    text: |
      1. Ich lerne Deutsch, um in Berlin {1}. (arbeiten)
      2. Sie macht Sport, um fit {2}. (bleiben)
      3. Er spart Geld, um eine Wohnung {3}. (kaufen)
      4. Wir machen eine Pause, um Kaffee {4}. (trinken)
      5. Anna schreibt eine E-Mail, um den Termin {5}. (bestätigen)
      6. Pavel besucht die Meisterschaft, um neue Kontakte {6}. (knüpfen)
      7. Tomáš fährt nach Berlin, um das Pilotgebiet {7}. (besichtigen)
      8. Bruno liest jeden Tag, um seinen Wortschatz {8}. (erweitern)
    answers:
      "1": zu arbeiten
      "2": zu bleiben
      "3": zu kaufen
      "4": zu trinken
      "5": zu bestätigen
      "6": zu knüpfen
      "7": zu besichtigen
      "8": zu erweitern

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "`um … zu` mit trennbaren Verben"
    instructions: "Complete with `um … zu` + separable verb. Remember: prefix + zu + stem = one word! 6 items."
    text: |
      1. Er geht früh ins Bett, um früh {1}. (aufstehen)
      2. Ich mache eine Pause, um Pavel {2}. (anrufen)
      3. Sie geht in die Stadt, um Lebensmittel {3}. (einkaufen)
      4. Bruno schreibt eine Liste, um richtig {4}. (anfangen)
      5. Er hält inne, um die Situation besser {5}. (einschätzen)
      6. Anna setzt sich hin, um die E-Mails {6}. (auswerten)
    answers:
      "1": aufzustehen
      "2": anzurufen
      "3": einzukaufen
      "4": anzufangen
      "5": einzuschätzen
      "6": auszuwerten

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "`damit` — Zwecksatz mit anderem Subjekt"
    instructions: "Complete each sentence with `damit` and the correct verb form. The subject changes! 8 items."
    text: |
      1. Ich erkläre es langsam, damit du es {1}. (verstehen)
      2. Anna schickt die Unterlagen, damit Frau Weber sie {2}. (lesen)
      3. Pavel erklärt den Prozess, damit die Kunden ihn {3}. (verstehen)
      4. Tomáš schreibt eine E-Mail, damit sein Team informiert {4}. (sein)
      5. Wir machen eine Präsentation, damit alle Kollegen zustimmen {5}. (können)
      6. Ich spreche laut, damit alle mich {6}. (hören)
      7. Bruno schickt die Aufgabe ab, damit der Chef sie {7}. (prüfen)
      8. Sie macht eine Umfrage, damit das Team die Daten {8}. (auswerten können)
    answers:
      "1": verstehst
      "2": lesen kann
      "3": verstehen
      "4": ist
      "5": können
      "6": hören
      "7": prüfen kann
      "8": auswerten kann

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "`um … zu` oder `damit`? — richtig wählen"
    instructions: "Fill in the blank with either `um … zu + Infinitiv` or `damit + Satz`. Watch for the subject! 6 items."
    text: |
      1. Ich lerne Deutsch, {1} (arbeiten — same subject: ich)
      2. Ich erkläre die Regel, {2} (du / verstehen — different subject)
      3. Pavel macht den Kurs, {3} (er / mehr wissen — same subject: Pavel)
      4. Frau Weber schickt den Bericht, {4} (das Team / vorbereitet sein — different subject)
      5. Bruno spart, {5} (reisen — same subject: Bruno)
      6. Tomáš schreibt auf, {6} (Pavel / es nicht vergessen — different subject)
    answers:
      "1": um zu arbeiten
      "2": damit du verstehst
      "3": um mehr zu wissen
      "4": damit das Team vorbereitet ist
      "5": um zu reisen
      "6": damit Pavel es nicht vergisst

