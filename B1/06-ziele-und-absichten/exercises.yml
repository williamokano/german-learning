        options:
          - { key: a, text: "Im Oktober." }
          - { key: b, text: "Im August." }
          - { key: c, text: "Im September." }
        answer: c
        why: '"Der Kurs beginnt im September."'
      - q: "Warum versucht Pavel, sein Deutsch zu verbessern?"
