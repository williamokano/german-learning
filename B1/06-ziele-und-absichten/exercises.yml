  - id: D2
    block: D
    type: odd-one-out
    title: "Wortschatz-Check: Das passt nicht!"
    instructions: "Circle the word that does not belong. 6 groups."
    groups:
      - items: ["versuchen", "hoffen", "planen", "obwohl"]
        odd: 3
        why: "obwohl is a connector (Konjunktion), not a verb that takes zu-Infinitive."
      - items: ["das Ziel", "die Absicht", "der Vorsatz", "das Angebot"]
        odd: 3
        why: "das Angebot (supply/offer) is not a goal/intention word."
      - items: ["anfangen", "aufhören", "vorhaben", "können"]
        odd: 3
        why: "können is a modal verb and never takes zu. The others take Infinitiv mit zu."
      - items: ["um … zu", "damit", "weil", "um … zu"]
        odd: 2
        why: "weil expresses reason (Grund), not purpose (Zweck). um … zu and damit express purpose."
      - items: ["die Bewerbung", "der Antrag", "der Lebenslauf", "die Meisterschaft"]
        odd: 3
        why: "die Meisterschaft (championship) is not an application/job-search document."
      - items: ["aufzustehen", "einzukaufen", "anzufangen", "zu lernen"]
        odd: 3
        why: "zu lernen is a regular verb form (nicht trennbar). The others are separable verbs with zu between prefix and stem."

