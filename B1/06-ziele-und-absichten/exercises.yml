    title: "Kurze Ansage: Voicemail von Pavel an seine Mutter"
    audio: transcript_ansage1.mp3
    instructions: "Listen to Pavel's voice message to his mother. Then choose the correct answer (a, b, or c)."
    transcript: "Hallo Mama, hier ist Pavel. Ich wollte dir kurz erklären, warum ich mich jetzt für einen Rösterkurs anmelde. Ich habe vor, meine Ausbildung zu erweitern, um eines Tages einen eigenen Röstbetrieb zu gründen. Der Kurs beginnt im September, damit ich noch in diesem Jahr anfangen kann. Ich versuche auch, mein Deutsch zu verbessern, weil der Kurs komplett auf Deutsch ist. Ich hoffe natürlich, die Aufnahmeprüfung zu bestehen. Bitte ruf mich zurück, wenn du Zeit hast. Ich liebe euch!"
