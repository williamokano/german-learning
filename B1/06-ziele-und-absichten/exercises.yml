  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "Antworten mit `um … zu` — Warum-Kette"
    instructions: 'Answer each question with `um … zu`. Example: "Warum lernst du Deutsch?" → "Ich lerne Deutsch, um in Berlin zu arbeiten." 6 items.'
    text: |
      1. Warum geht Pavel in die Akademie? (die Ausbildung machen)
         → Pavel geht in die Akademie, um {1}.
      2. Warum macht Anna eine Umfrage? (die Zielgruppe kennenlernen)
         → Anna macht eine Umfrage, um {2}.
      3. Warum spart Tomáš? (das Startup finanzieren)
         → Tomáš spart, um {3}.
      4. Warum liest Bruno jeden Tag? (seinen Wortschatz verbessern)
         → Bruno liest jeden Tag, um {4}.
      5. Warum schreibt Anna einen Projektantrag? (das Projekt genehmigen lassen)
         → Anna schreibt einen Projektantrag, um das Projekt {5}.
      6. Warum besucht Pavel die Meisterschaft? (neue Kontakte knüpfen)
         → Pavel besucht die Meisterschaft, um {6}.
    answers:
      "1": die Ausbildung zu machen
      "2": die Zielgruppe kennenzulernen
      "3": das Startup zu finanzieren
      "4": seinen Wortschatz zu verbessern
      "5": genehmigen zu lassen
      "6": neue Kontakte zu knüpfen

  - id: A9
    block: A
    type: true-false
    title: "Grammatik-Check: `zu`-Infinitiv richtig gebildet?"
    instructions: "Is the zu-Infinitive formed correctly? Answer R (richtig) oder F (falsch). If F, explain the error."
    items:
      - q: "Ich versuche, pünktlich zu kommen."
        answer: true
        why: "Correct: zu + Infinitive of a regular verb."
      - q: "Er fängt an, zu anfangen."
        answer: false
        why: "Error: anfangen is separable. The Infinitiv mit zu form is anzufangen, not zu anfangen."
      - q: "Ich kann zu kommen."
        answer: false
        why: "Error: modal verbs NEVER take zu. Correct: Ich kann kommen."
      - q: "Sie hofft, bald fertig zu sein."
        answer: true
        why: "Correct: hoffen + zu + Infinitive of sein."
      - q: "Bruno versucht, pünktlich aufzustehen."
        answer: true
        why: "Correct: aufstehen is separable → auf + zu + stehen = aufzustehen."

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Gemischt: Zweckstruktur aus dem Kontext wählen"
    instructions: "Fill in the correct purpose structure (`um … zu` or `damit + Satz`). 6 items."
    text: |
      1. Tomáš schreibt E-Mails auf Deutsch, {1}. (sein Team / lesen können)
      2. Pavel liest Fachbücher, {2}. (mehr über Kaffee lernen — same subj.)
      3. Frau Weber schickt den Plan, {3}. (Anna / vorbereiten können)
      4. Bruno stellt Fragen, {4}. (besser verstehen — same subj.)
      5. Anna macht eine Liste, {5}. (nichts vergessen — same subj.)
      6. Wir erklären den Prozess langsam, {6}. (alle / folgen können)
    answers:
      "1": damit sein Team sie lesen kann
      "2": um mehr über Kaffee zu lernen
      "3": damit Anna sich vorbereiten kann
      "4": um besser zu verstehen
      "5": um nichts zu vergessen
      "6": damit alle folgen können

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: false
    title: "Dialog ergänzen: Bewerbungsgespräch"
    instructions: "Fill in the 8 blanks with the correct structures (`um … zu`, `damit`, or Infinitiv mit `zu`). Context: a job interview."
    text: |
      — Warum möchten Sie bei uns arbeiten?
      — Ich bewerbe mich, {1} (meine Fähigkeiten einsetzen — same subj.).
      — Was planen Sie in den ersten drei Monaten?
      — Ich plane, das Team {2} (kennenlernen). Außerdem möchte ich eine
        Strategie entwickeln, {3} (wir / effektiver arbeiten können).
      — Welche Fähigkeiten bringen Sie mit?
      — Ich habe angefangen, {4} (Data-Analyse-Kurse belegen). Ich versuche immer,
        aktuelle Trends {5} (verfolgen — same subj.).
      — Was erwarten Sie von uns?
      — Ich hoffe, {6} (regelmäßiges Feedback bekommen). Es wäre wichtig, dass Sie
        mir Projekte geben, {7} (ich / selbstständig arbeiten können).
      — Haben Sie noch Fragen?
      — Ja — ich bitte Sie, mir {8} (den Einarbeitungsplan erklären).
    answers:
      "1": um meine Fähigkeiten einzusetzen
      "2": kennenzulernen
      "3": damit wir effektiver arbeiten können
      "4": Data-Analyse-Kurse zu belegen
      "5": zu verfolgen
      "6": regelmäßiges Feedback zu bekommen
      "7": damit ich selbstständig arbeiten kann
      "8": den Einarbeitungsplan zu erklären

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler — `um … zu`, `damit`, Infinitiv mit `zu`"
    prompt: "Each sentence contains exactly one error. Find it and write the corrected sentence. 6 items."
    stimulus: |
      1. Er versucht, pünktlich zu anfangen.
      2. Ich lerne Deutsch, damit ich besser arbeite. (same subject)
      3. Sie plant, neue Kontakte zu knüpfen damit.
      4. Ich kann zu kommen morgen früh.
      5. Pavel fängt an, anzufangen die Ausbildung.
      6. Ich habe vor morgen früh aufzustehen.
    model: |
      1. Er versucht, pünktlich anzufangen. (separable: an+zu+fangen = anzufangen, not zu anfangen)
      2. Ich lerne Deutsch, um besser zu arbeiten. (same subject → um … zu, not damit)
      3. Sie plant, neue Kontakte zu knüpfen. (damit is misplaced; remove it)
      4. Ich kann morgen früh kommen. (modal verbs never take zu)
      5. Pavel fängt an, die Ausbildung zu machen. (correct infinitive phrase after anfangen)
      6. Ich habe vor, morgen früh aufzustehen. (comma required before the zu-Infinitive phrase)

  - id: B3
    block: B
    type: single-choice
    title: "Richtigen Ausdruck wählen"
    instructions: "Choose the correct option (a, b, or c) for each gap."
    items:
      - q: "Ich lerne Deutsch, ______ in Berlin arbeiten zu können."
        options:
          - { key: a, text: "damit" }
          - { key: b, text: "um" }
          - { key: c, text: "weil" }
        answer: b
        why: "um … zu with same subject (ich). damit would require a full subordinate clause with different subject."
      - q: "Anna schickt den Plan, ______ das Team ihn lesen kann."
        options:
          - { key: a, text: "um" }
          - { key: b, text: "damit" }
          - { key: c, text: "obwohl" }
        answer: b
        why: "damit: different subjects (Anna sends; the team reads). um … zu only works with same subject."
      - q: "Er ______ vergessen, den Termin zu bestätigen."
        options:
          - { key: a, text: "hat" }
          - { key: b, text: "ist" }
          - { key: c, text: "wird" }
        answer: a
        why: "vergessen takes haben in the Perfekt: Er hat vergessen."
      - q: "Ich ______ vor, nächste Woche die Prüfung abzulegen."
        options:
          - { key: a, text: "bin" }
          - { key: b, text: "mache" }
          - { key: c, text: "habe" }
        answer: c
        why: "vorhaben conjugates with haben: ich habe vor. The prefix vor goes to the end."
      - q: "Sie fängt an, Deutsch ______."
        options:
          - { key: a, text: "lernen" }
          - { key: b, text: "zu lernen" }
          - { key: c, text: "zu lernend" }
        answer: b
        why: "anfangen takes zu + Infinitive: zu lernen."
      - q: "Er geht früh schlafen, um früh ______."
        options:
          - { key: a, text: "zu aufstehen" }
          - { key: b, text: "aufzustehen" }
          - { key: c, text: "aufstehen" }
        answer: b
        why: "Separable verb aufstehen: prefix + zu + stem = aufzustehen (one word)."

