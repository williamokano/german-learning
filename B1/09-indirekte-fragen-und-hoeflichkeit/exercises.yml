  - id: D2
    block: D
    type: odd-one-out
    title: "Wortschatz-Check: Das passt nicht!"
    instructions: "Circle the word that does not belong. 6 groups."
    groups:
      - items: ["ob", "wann", "wie", "weil"]
        odd: 3
        why: "`weil` introduces a reason clause, not an indirect question. ob/wann/wie all introduce indirect questions."
      - items: ["Könnten Sie", "Würden Sie", "Dürfte ich", "Müssen Sie"]
        odd: 3
        why: '`Müssen Sie` is a direct demand, not a polite Konjunktiv II form. The others are polite.'
      - items: ["Auf Wiederhören", "Auf Wiedersehen", "Tschüss", "Hier spricht"]
        odd: 3
        why: '`Hier spricht` is a greeting formula (beginning of a call), not a farewell.'
      - items: ["hätte gern", "wäre", "könnte", "muss"]
        odd: 3
        why: '`muss` is Präsens Indikativ, not Konjunktiv II. The others (hätte, wäre, könnte) are Konjunktiv II.'
      - items: ["das Bürgeramt", "der Antrag", "das Dokument", "das Fahrrad"]
        odd: 3
        why: '`das Fahrrad` (bicycle) does not belong with official-office vocabulary.'
      - items: ["erklären", "wiederholen", "buchstabieren", "schlafen"]
        odd: 3
        why: '`schlafen` (to sleep) is not a communication verb. The others are all used in polite communication.'

