  - id: A10
    block: A
    type: true-false
    title: "Grammatik-Check: Richtig oder falsch?"
    instructions: "Is the Konjunktiv II form used correctly? Answer R (richtig) oder F (falsch)."
    items:
      - q: "Wenn ich frei wäre, würde ich reisen."
        answer: true
        why: "Correct: wäre in the wenn-clause (strong form); würde reisen in the main clause."
      - q: "Wenn ich würde frei sein, würde ich reisen."
        answer: false
        why: "Error: double würde trap. The wenn-clause must use the strong form: Wenn ich frei wäre, würde ich reisen."
      - q: "Ich wünschte, ich hätte mehr Zeit."
        answer: true
        why: "Correct: hätte is the strong Konjunktiv II of haben."
      - q: "Ich würde haben mehr Zeit, wenn ich wollte."
        answer: false
        why: "Error: würde haben is unnatural. Use: Ich hätte mehr Zeit, wenn ich wollte."
      - q: "An deiner Stelle würde ich das sofort machen."
        answer: true
        why: "Correct advice structure: An deiner Stelle + würde + subject + infinitive at end."

