    title: "Leseverstehen: Lesetext (Was ich mir für die Zukunft wünsche)"
    instructions: |
      > Das ist ein Blogbeitrag von Anna Kowalski.
      >
      > Manchmal frage ich mich, was ich anders machen würde, wenn ich noch einmal von vorne anfangen könnte. Ich wünschte, ich hätte schon früher Deutsch gelernt — nicht erst mit 22, sondern schon als Teenager. Wenn ich damals geahnt hätte, wie sehr mir die Sprache nützt, hätte ich viel früher angefangen. Aber das ist natürlich leicht gesagt.
      >
      > Was wünsche ich mir für die Zukunft? Wenn ich komplett frei wäre, würde ich ein Jahr lang durch Europa reisen — Berlin, Lissabon, Budapest, Kopenhagen. Ich würde in kleinen Cafés sitzen, schreiben und Sprachen lernen. Natürlich weiß ich, dass das nicht einfach zu organisieren wäre. Aber ein bisschen träumen darf man doch.
      >
      > Am meisten wünsche ich mir, mutiger zu sein. Wenn ich daran denke, wie viele Chancen ich nicht ergriffen habe, weil ich Angst hatte zu scheitern — das ist mein größtes Bedauern. An meiner Stelle hätte vielleicht jemand anderes einfach gewagt. Ich wünschte mir deshalb vor allem eines: mehr Mut. Wenn ich den hätte, würde ich vieles anders angehen.
      >
      > Vielleicht ist das der wichtigste Wunsch: nicht warten, bis alles perfekt ist. Denn wenn man immer auf den richtigen Moment wartet, würde man am Ende nie etwas machen.

      Wähle a, b oder c.
    items:
      - q: "Was wünscht sich Anna, wenn es um Sprachen geht?"
        options:
          - { key: a, text: "Sie wünschte, sie hätte früher Deutsch gelernt." }
          - { key: b, text: "Sie wünschte, sie hätte früher Portugiesisch gelernt." }
          - { key: c, text: "Sie wünschte, sie hätte Japanisch gelernt." }
        answer: a
        why: '"Ich wünschte, ich hätte schon früher Deutsch gelernt — nicht erst mit 22."'
      - q: "Was würde Anna tun, wenn sie komplett frei wäre?"
        options:
          - { key: a, text: "In einem Café arbeiten." }
          - { key: b, text: "Ein Jahr durch Europa reisen." }
          - { key: c, text: "Nach Lissabon ziehen." }
        answer: b
        why: '"Wenn ich komplett frei wäre, würde ich ein Jahr lang durch Europa reisen."'
      - q: "Was ist Annas größtes Bedauern?"
        options:
          - { key: a, text: "Dass sie zu früh angefangen hat zu reisen." }
          - { key: b, text: "Dass sie zu viele Chancen genommen hat." }
          - { key: c, text: "Dass sie viele Chancen nicht ergriffen hat, weil sie Angst hatte." }
        answer: c
        why: '"wie viele Chancen ich nicht ergriffen habe, weil ich Angst hatte zu scheitern — das ist mein größtes Bedauern"'
      - q: "Was ist der wichtigste Wunsch, den Anna am Ende nennt?"
        options:
          - { key: a, text: "Nicht zu warten, bis alles perfekt ist." }
          - { key: b, text: "Mehr Geld zu haben." }
          - { key: c, text: "Einen neuen Job zu finden." }
        answer: a
        why: '"Vielleicht ist das der wichtigste Wunsch: nicht warten, bis alles perfekt ist."'

