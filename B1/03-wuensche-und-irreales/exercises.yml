intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia fragt, wohin Anna und Bruno ziehen würden, wenn sie könnten."
        answer: true
        why: 'Mia fragt: "Wenn ihr morgen kündigen und irgendwo auf der Welt neu anfangen könntet — wo wärt ihr?"'
      - q: "Anna würde nach Tokio ziehen."
        answer: false
        why: 'Anna sagt, sie würde nach Lissabon ziehen. Bruno möchte nach Tokio.'
      - q: "Bruno würde gern als Fotograf arbeiten."
        answer: true
        why: 'Bruno: "Wenn ich könnte, würde ich eher als Fotograf arbeiten."'
      - q: "Mia glaubt, man sollte warten, bis die Bedingungen perfekt sind."
        answer: false
        why: 'Mia sagt: "Wenn man auf alles wartet, bis die Bedingungen perfekt sind, würde man nie etwas machen."'
      - q: "Bruno würde sofort mit einem Fotokurs beginnen, wenn er weniger arbeiten müsste."
        answer: true
        why: 'Bruno: "Wenn ich nächsten Monat nicht so viel arbeiten müsste, würde ich sofort mit einem Fotokurs beginnen."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was wünscht sich Anna im Gespräch mit Herr Steinmeyer?"
        options:
          - { key: a, text: "Mehr Praxiserfahrung im Studium." }
          - { key: b, text: "Mehr Urlaub." }
          - { key: c, text: "Eine neue Stelle." }
        answer: a
        why: 'Anna: "Ich wünschte, ich hätte schon im Studium mehr Praxiserfahrung gesammelt."'
      - q: "Was empfiehlt Herr Steinmeyer als ersten Schritt?"
        options:
          - { key: a, text: "Sofort kündigen und in die Forschung gehen." }
          - { key: b, text: "Prüfen, ob das Unternehmen Mobilitätsprogramme anbietet." }
          - { key: c, text: "Ein Auslandspraktikum sofort absolvieren." }
        answer: b
        why: 'Herr Steinmeyer: "An Ihrer Stelle würde ich zunächst prüfen, ob Ihr Unternehmen interne Mobilitätsprogramme anbietet."'
      - q: "Was würde Anna machen, wenn sie von vorne anfangen könnte?"
        options:
          - { key: a, text: "Marketing studieren." }
          - { key: b, text: "Nach Lissabon ziehen." }
          - { key: c, text: "In die Forschung gehen." }
        answer: c
        why: 'Anna: "Wenn ich von vorne anfangen könnte, würde ich vielleicht eher in die Forschung gehen."'
      - q: "Was sagt Herr Steinmeyer über Karrierewege?"
        options:
          - { key: a, text: "Jeder Karriereweg hat Umwege." }
          - { key: b, text: "Jeder Karriereweg ist gerade und ohne Umwege." }
          - { key: c, text: "Man sollte den Karriereweg nie wechseln." }
        answer: a
        why: 'Herr Steinmeyer: "Jeder Karriereweg hat Umwege. Die Frage ist, was man daraus lernt."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Bruno's call to Yuki) and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Hallo Yuki, hier ist Bruno! Ich hoffe, du bist gut angekommen. Ich wollte
      dich mal fragen: Wenn du für immer irgendwo auf der Welt leben {1} —
      würdest du in Osaka {2} oder woanders hinziehen? Ich frage, weil ich
      gerade selbst darüber nachdenke. Wenn ich könnte, {3} ich nach Tokio
      gehen — ich wünschte, ich hätte das früher {4}. Stell dir vor,
      wir {5} Nachbarn in Tokio! Das wäre wirklich {6}. Na ja, vielleicht
      eines Tages. Ruf mich zurück, wenn du Zeit hast!
    bank: [könntest, bleiben, würde, ausprobiert, wären, schön, dürftest, gehen, versucht]
    answers:
      "1": könntest
      "2": bleiben
      "3": würde
      "4": ausprobiert
      "5": wären
      "6": schön

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Voicemail von Anna an Mia"
    audio: transcript_ansage1.mp3
    instructions: "Listen to Anna's voice message to Mia. Then choose the correct answer (a, b, or c)."
    transcript: 'Hallo Mia, hier ist Anna. Ich wollte dir kurz sagen, dass ich es leider nicht zu eurem Wochenendausflug nach Leipzig schaffen kann. Wenn ich nicht so viel Arbeit hätte, würde ich sofort mitkommen — ich wünschte wirklich, ich könnte dabei sein. Ich bereue es sehr. Wenn ihr das nächste Mal plant, würde ich gern früher Bescheid wissen, damit ich mir den Termin freinehmen kann. Ich drücke euch die Daumen für das Wetter! Bitte ruf mich zurück, wenn ihr wieder da seid.'
    items:
      - q: "Warum ruft Anna an?"
        options:
          - { key: a, text: "Um zu sagen, dass sie nicht mitkommen kann." }
          - { key: b, text: "Um zu fragen, ob sie mitkommen darf." }
          - { key: c, text: "Um den Ausflug abzusagen." }
        answer: a
        why: '"Ich kann es leider nicht zu eurem Wochenendausflug nach Leipzig schaffen."'
      - q: "Warum kann Anna nicht mitfahren?"
        options:
          - { key: a, text: "Weil sie krank ist." }
          - { key: b, text: "Weil sie zu viel Arbeit hat." }
          - { key: c, text: "Weil sie kein Ticket hat." }
        answer: b
        why: '"Wenn ich nicht so viel Arbeit hätte, würde ich sofort mitkommen."'
      - q: "Was wünscht sich Anna für das nächste Mal?"
        options:
          - { key: a, text: "Dass Mia ihr einen anderen Termin schickt." }
          - { key: b, text: "Dass der Ausflug nach München geht." }
          - { key: c, text: "Früher Bescheid zu bekommen, damit sie sich freinehmen kann." }
        answer: c
        why: '"würde ich gern früher Bescheid wissen, damit ich mir den Termin freinehmen kann"'
      - q: "Was soll Mia tun?"
        options:
          - { key: a, text: "Anna zurückrufen, wenn sie wieder da ist." }
          - { key: b, text: "Den Ausflug verschieben." }
          - { key: c, text: "Anna eine E-Mail schicken." }
        answer: a
        why: '"Bitte ruf mich zurück, wenn ihr wieder da seid."'

