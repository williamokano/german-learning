  - id: D2
    block: D
    type: odd-one-out
    title: "Welches Wort passt nicht?"
    instructions: "Cross out the word that does not fit and explain why."
    groups:
      - items: [wäre, hätte, würde, könnte]
        odd: 2
        why: "würde is the helper verb (like an auxiliary); the others are all standalone strong KII forms of sein/haben/können."
      - items: [solltest, müsstest, dürftest, wärst]
        odd: 3
        why: "wärst is the KII of sein (existential/state); the others are all KII modal verb forms."
      - items: [der Traum, die Hoffnung, der Mut, das Bedauern]
        odd: 2
        why: "der Mut (courage) refers to a personal quality; the others are all emotional states or wishful concepts."
      - items: [bereuen, wünschen, sich vorstellen, empfehlen]
        odd: 3
        why: "empfehlen (to recommend) is about giving advice; the others are all about inner imaginative/regret processes."
      - items: [An deiner Stelle, Du solltest, Wenn ich könntest, Ich würde empfehlen]
        odd: 2
        why: "'Wenn ich könntest' is grammatically wrong (wrong person — should be könnte); the others are all correct advice structures."
      - items: [mutig, realistisch, utopisch, konkret]
        odd: 2
        why: "utopisch is unrealistic/imaginary; the others describe real, grounded qualities."

