  - id: B3
    block: B
    type: single-choice
    title: "Richtige Form wählen: `würde` oder starke Form?"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Wenn ich ______ Lissabon, würde ich Portugiesisch lernen."
        options:
          - { key: a, text: "in würde sein" }
          - { key: b, text: "wäre in" }
          - { key: c, text: "in wäre" }
        answer: c
        why: "wäre is the strong KII of sein; it goes to the end of the wenn-clause: Wenn ich in Lissabon wäre, …"
      - q: "Ich wünschte, ich ______ mehr Erfahrung."
        options:
          - { key: a, text: "würde haben" }
          - { key: b, text: "hätte" }
          - { key: c, text: "habe" }
        answer: b
        why: "hätte is the strong KII of haben. würde haben is unnatural in German."
      - q: "Wenn wir nicht so viel arbeiten ______, würden wir öfter reisen."
        options:
          - { key: a, text: "müssten" }
