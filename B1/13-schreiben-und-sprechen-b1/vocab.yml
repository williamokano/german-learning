# `Großstadt` lost their plurals — the lesson spells the plural as a full second word
# after the comma (`die Großstadt, die Großstädte`) rather than a suffix code, same
# gap as B1/11's Lebenslauf. `Anliegen` false-umlauted. The "Konnektoren für Schreiben
# und Sprechen" table (3-col: Konnektor | Funktion | Beispiel) was dropped entirely —
