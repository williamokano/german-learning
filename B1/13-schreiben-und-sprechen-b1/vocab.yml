  # ── Konnektoren für Schreiben und Sprechen — 8 connectors ──────────────────
  - de: zum einen … zum anderen
    article: null
    plural: null
    en: on the one hand … on the other hand
    pos: phrase
    tags: [connector, argument]
    core: true
    example: "Zum einen ist es praktisch, zum anderen ist es teuer."
  - de: einerseits … andererseits
    article: null
    plural: null
    en: on the one hand … on the other hand
    pos: phrase
    tags: [connector, argument]
    core: true
    example: "Einerseits bietet die Stadt Jobs, andererseits sind die Mieten hoch."
  - de: außerdem
    article: null
    plural: null
    en: furthermore; besides
    pos: conjunction
    tags: [connector, addition]
    core: true
    example: "Außerdem gibt es viele Kulturangebote."
  - de: allerdings
    article: null
    plural: null
    en: however; though
    pos: conjunction
    tags: [connector, concession]
    core: true
    example: "Allerdings ist der Lärm ein Problem."
  - de: insgesamt
    article: null
    plural: null
    en: overall; in summary
    pos: adverb
    tags: [connector, summary]
    core: true
    example: "Insgesamt denke ich, dass …"
  - de: abschließend
    article: null
    plural: null
    en: in conclusion
    pos: adverb
    tags: [connector, summary]
    core: true
    example: "Abschließend möchte ich sagen, dass …"
  - de: zwar … aber
    article: null
    plural: null
    en: admittedly … but
    pos: phrase
    tags: [connector, concession]
    core: false
    example: "Das Leben ist zwar teuer, aber interessant."
  - de: sowohl … als auch
    article: null
    plural: null
    en: both … and
    pos: phrase
    tags: [connector, addition]
    core: false
    example: "Sowohl Vorteile als auch Nachteile gibt es."

