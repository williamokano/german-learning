  - id: A7
    block: A
    type: true-false
    title: "E-Mail-Regeln: Richtig oder Falsch?"
    instructions: "Is each statement about formal email conventions correct? Answer R (richtig) oder F (falsch)."
    items:
      - q: "In einer formellen E-Mail schreibt man immer einen Betreff."
        answer: true
        why: "Correct — the Betreff is mandatory in German formal emails."
      - q: 'Man kann eine formelle E-Mail mit „Hallo!" beginnen.'
        answer: false
        why: '"Hallo!" is too informal. Use "Sehr geehrte/r …" or "Sehr geehrte Damen und Herren,".'
      - q: 'Die Grußformel „Mit freundlichen Grüßen" steht am Ende einer formellen Mail.'
        answer: true
        why: "Correct — this is the standard formal closing formula in German."
      - q: 'In einer informellen Nachricht kann man „Liebe Anna," als Anrede benutzen.'
        answer: true
        why: "Correct — Liebe/r + Vorname is standard for informal messages."
      - q: "Den vollen Namen schreibt man nach der Grußformel nicht, wenn man die Person gut kennt."
        answer: false
        why: "In formal correspondence, always write your full name after the closing formula."
      - q: 'Wenn man den Namen nicht kennt, schreibt man „Sehr geehrte Damen und Herren,".'
        answer: true
        why: "Correct — this is the standard anonymous formal salutation."

  - id: A8
    block: A
    type: single-choice
    title: "Anrede wählen: Welche Anrede ist korrekt?"
    instructions: "Choose the correct salutation for each situation (a, b, or c). 5 items."
    items:
      - q: "Du schreibst eine formelle Beschwerde an ein Hotel, kennst aber keinen Namen."
        options:
          - { key: a, text: "Hallo zusammen!" }
          - { key: b, text: "Sehr geehrte Damen und Herren," }
          - { key: c, text: "Liebe Hotelleitung," }
        answer: b
        why: "When no name is known, the standard formal opening is: Sehr geehrte Damen und Herren,"
      - q: "Du schreibst eine informelle Nachricht an deine Freundin Mia."
        options:
          - { key: a, text: "Sehr geehrte Frau Becker," }
          - { key: b, text: "Liebe Mia," }
          - { key: c, text: "Guten Tag, Mia Becker," }
        answer: b
        why: '"Liebe Mia," is the standard informal salutation for a female friend.'
      - q: "Du schreibst an Herrn Steinmeyer, den du nicht persönlich kennst."
        options:
          - { key: a, text: "Hey, Herr Steinmeyer," }
          - { key: b, text: "Lieber Friedrich," }
          - { key: c, text: "Sehr geehrter Herr Steinmeyer," }
        answer: c
        why: '"Sehr geehrter Herr [Nachname]," is the correct formal salutation for a male addressee.'
      - q: "Du schreibst an deine Lehrerin Frau Weber, die du gut kennst, aber im Unterricht siezen."
        options:
          - { key: a, text: "Liebe Frau Weber," }
          - { key: b, text: "Hey Frau Weber!" }
          - { key: c, text: "Sehr geehrte Frau Weber," }
        answer: a
        why: '"Liebe Frau Weber," is semi-formal — correct when you know the person but maintain Sie.'
      - q: "Du schreibst eine Anfrage an eine Firma und kennst den Namen der Ansprechperson."
        options:
          - { key: a, text: "Guten Tag, Frau Müller," }
          - { key: b, text: "Sehr geehrte Frau Müller," }
          - { key: c, text: "Liebe Frau Müller," }
        answer: b
        why: '"Sehr geehrte Frau [Name]," is the standard formal greeting for a known female contact.'

