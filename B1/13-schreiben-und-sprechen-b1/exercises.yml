  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Sprachkurs-Anmeldung"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the telephone message. Then choose the correct answer (a, b, or c)."
    transcript: "Hallo, hier spricht Jana vom Goethe-Institut Berlin — ich rufe wegen des B1-Schreibkurses an. Die Anmeldung ist noch bis Freitag, den 20. Juni möglich. Der Kurs beginnt am Montag, den 23. Juni, und findet dienstags und donnerstags von 18 bis 20 Uhr statt. Die Kursgebühr beträgt 180 Euro. Bitte bring beim ersten Termin deinen Ausweis und einen Stift mit. Bei Fragen ruf mich bitte zurück unter 030 259 06-0. Wir freuen uns auf dich! Tschüss!"
    items:
      - q: "Bis wann kann man sich für den Kurs anmelden?"
        options:
          - { key: a, text: "Bis Donnerstag, den 19. Juni." }
          - { key: b, text: "Bis Freitag, den 20. Juni." }
          - { key: c, text: "Bis Montag, den 23. Juni." }
        answer: b
        why: '"die Anmeldung … noch bis Freitag, den 20. Juni möglich ist."'
      - q: "An welchen Tagen findet der Kurs statt?"
        options:
          - { key: a, text: "Montags und mittwochs." }
          - { key: b, text: "Dienstags und donnerstags." }
          - { key: c, text: "Montags und freitags." }
        answer: b
        why: '"findet jeweils dienstags und donnerstags … statt."'
      - q: "Was soll man zum ersten Termin mitbringen?"
        options:
          - { key: a, text: "Einen Laptop und ein Heft." }
          - { key: b, text: "Einen Ausweis und einen Stift." }
          - { key: c, text: "Ein Wörterbuch und Papier." }
        answer: b
        why: '"Bitte bring beim ersten Termin deinen Ausweis und einen Stift mit."'
      - q: "Wie hoch ist die Kursgebühr?"
        options:
          - { key: a, text: "150 Euro." }
          - { key: b, text: "200 Euro." }
          - { key: c, text: "180 Euro." }
        answer: c
        why: '"Die Kursgebühr beträgt 180 Euro."'

