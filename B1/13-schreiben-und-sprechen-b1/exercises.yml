lesson: B1/13
title: "B1 · Lektion 13 — Übungen: Schreiben und Sprechen B1"
intro: >
  Blocks: H Hören → A Basistraining (formelle/informelle E-Mail) →
  B Vertiefung (Forenbeiträge & informelles Schreiben) →
  C Prüfungstraining (Sprechen + Lesen + Schreiben) →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: H+A on day 1, B on day 2, C on day 3, D on day 4.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (Pavel übt die Präsentation)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Pavels Präsentationsthema ist Großstädte."
        answer: true
        why: 'Pavel: "ich möchte über das Thema Großstädte sprechen."'
      - q: "Bruno empfiehlt Pavel, keinen konkreten Grund für die Wichtigkeit des Themas zu nennen."
        answer: false
        why: "Bruno says the opposite: 'dann nenn einen konkreten Grund.'"
      - q: 'Pavel benutzt den Konnektor „einerseits … andererseits".'
        answer: true
        why: 'Pavel: "Einerseits gibt es dort viele Unternehmen … andererseits ist die Konkurrenz auch stärker."'
      - q: "Pavel vergisst in seiner Präsentation den Schluss / das Fazit."
        answer: false
        why: 'Pavel says: "Insgesamt denke ich, dass Großstädte viele Chancen bieten …" — the Fazit is there.'
      - q: 'Tomáš empfiehlt am Ende den Satz: „Vielen Dank für Ihre Aufmerksamkeit."'
        answer: true
        why: 'Tomáš: "Am Ende sagst du besser „Vielen Dank für Ihre Aufmerksamkeit" — das klingt formeller in der Prüfung."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (Annas Beschwerdemail)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "An wen hat Anna die Beschwerdemail geschrieben?"
        options:
          - { key: a, text: "An Frau Weber." }
          - { key: b, text: "An das Hotel Zentral." }
          - { key: c, text: "An die Sprachschule." }
        answer: b
        why: 'Anna: "Ich habe eine Beschwerdemail an das Hotel Zentral geschrieben."'
      - q: "Was war das Problem mit Annas ursprünglicher Mail?"
        options:
          - { key: a, text: "Sie war zu lang." }
          - { key: b, text: "Die Sprache war zu informell." }
          - { key: c, text: "Der Betreff fehlte, aber die Anrede war korrekt." }
        answer: b
        why: 'Frau Weber: "Das ist eine sehr informelle Sprache. In einer formellen Beschwerdemail schreibt man ganz anders."'
      - q: "Welche Anrede empfiehlt Frau Weber, wenn man den Namen nicht kennt?"
        options:
          - { key: a, text: "Hallo!" }
          - { key: b, text: "Liebe Damen und Herren," }
          - { key: c, text: "Sehr geehrte Damen und Herren," }
        answer: c
        why: 'Frau Weber: "Man schreibt: „Sehr geehrte Damen und Herren," wenn man den Namen nicht kennt."'
      - q: "Wie lautet der korrekte Schluss einer formellen Mail laut Frau Weber?"
        options:
          - { key: a, text: "Tschüss, Anna." }
          - { key: b, text: "Viele Grüße, Anna." }
          - { key: c, text: "Mit freundlichen Grüßen, Anna Kowalski." }
        answer: c
        why: 'Frau Weber: "Der Standardschluss … lautet: … Mit freundlichen Grüßen, Anna Kowalski."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Mias Workshop-Tipps"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Mia gibt Ratschläge fürs Schreiben) and fill in the 5 missing words. Three words in the box are not needed."
    text: |
      Mia bereitet einen {1} über formelles Schreiben vor. Sie erklärt, dass eine
      formelle E-Mail immer einen {2} haben muss. Die Anrede lautet
      „Sehr geehrte Damen und Herren," wenn man den {3} nicht kennt. Im
      Hauptteil soll man {4} und höflich formulieren. Zum Schluss schreibt man
      „Mit freundlichen Grüßen" und dann den vollen {5}.
