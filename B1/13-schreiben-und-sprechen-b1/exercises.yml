  - id: B2
    block: B
    type: single-choice
    title: "Finde den Fehler — Register und Struktur"
    instructions: "Each sentence contains one error. Choose the correct version (a, b, or c)."
    items:
      - q: 'Fehler: „Ich bin der Überzeugung, das Großstädte besser sind."'
        options:
          - { key: a, text: "Ich bin der Überzeugung, dass Großstädte besser sind." }
          - { key: b, text: "Ich bin der Überzeugung, Großstädte sind besser." }
          - { key: c, text: "Ich bin der Überzeugung, Großstädte besser sind." }
        answer: a
        why: "After 'dass' the verb goes to the end: dass Großstädte besser sind. Also 'dass' not 'das'."
      - q: 'Fehler: „Mit freundliche Grüßen,"'
        options:
          - { key: a, text: "Mit freundlicher Grüßen," }
          - { key: b, text: "Mit freundlichen Grüßen," }
          - { key: c, text: "Mit freundlich Grüßen," }
        answer: b
        why: "Dative plural after 'mit': freundlichen Grüßen. This formula is fixed — memorise it."
      - q: 'Fehler: „Ich schreibe Sie bezüglich meiner Frage."'
        options:
          - { key: a, text: "Ich schreibe Ihnen bezüglich meiner Frage." }
          - { key: b, text: "Ich schreibe an Sie bezüglich meiner Frage." }
          - { key: c, text: "Ich schreibe Ihr bezüglich meiner Frage." }
        answer: a
        why: "'schreiben' takes Dative for the recipient: 'Ich schreibe Ihnen.' Not 'Ich schreibe Sie.'"
      - q: 'Fehler: „Abschließend ich möchte sagen, dass Großstädte wichtig sind."'
        options:
          - { key: a, text: "Abschließend möchte ich sagen, dass Großstädte wichtig sind." }
          - { key: b, text: "Abschließend ich möchte, dass Großstädte wichtig sind." }
          - { key: c, text: "Abschließend sagen ich möchte, dass Großstädte wichtig sind." }
        answer: a
        why: "When an adverb (Abschließend) starts the sentence, the verb comes second: möchte → ich (inversion)."
      - q: 'Fehler: „Ein Nachteil ist, der Lärm in der Stadt."'
        options:
          - { key: a, text: "Ein Nachteil ist, dass der Lärm in der Stadt laut ist." }
          - { key: b, text: "Ein Nachteil ist der Lärm in der Stadt." }
          - { key: c, text: "Ein Nachteil ist: der Lärm in der Stadt laut." }
        answer: b
        why: "'Ein Nachteil ist [Nomen].' — no 'dass' needed when followed directly by a noun phrase."

