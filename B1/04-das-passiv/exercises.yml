lesson: B1/04
title: "B1 · Lektion 4 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Lukas arbeitet als Software-Entwickler in der IT-Branche."
        answer: true
        why: "Anna sagt direkt: Lukas, du arbeitest in der IT."
      - q: "Bruno findet, dass KI keine Auswirkung auf seinen Job hat."
        answer: false
        why: "Bruno sagt, dass in seiner Firma viele Reports automatisch generiert werden."
      - q: "Lukas denkt, dass Schulungen wichtig sind bei der Einführung neuer Technologien."
        answer: true
        why: 'Lukas: "Deshalb muss mehr in Schulungen investiert werden."'
      - q: "Bei Bruno wurde das neue Tool ohne Probleme eingeführt."
        answer: false
        why: 'Bruno: "am Anfang war das Chaos. Nichts wurde erklärt, die Mitarbeiter wurden nicht vorbereitet."'
      - q: "Anna schlägt vor, dass mehr über die Menschen hinter der KI kommuniziert werden sollte."
        answer: true
        why: 'Anna: "Vielleicht sollte das öfter kommuniziert werden."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was ändert sich ab nächsten Monat im Büro?"
        options:
          - { key: a, text: "Alle monatlichen Berichte werden automatisch erstellt." }
          - { key: b, text: "Die Mitarbeiter bekommen neue Computer." }
          - { key: c, text: "Anna bekommt eine neue Aufgabe in einer anderen Abteilung." }
        answer: a
        why: 'Frau Weber: "Ab nächsten Monat werden alle monatlichen Berichte automatisch erstellt."'
      - q: "Was muss Anna überprüfen?"
        options:
          - { key: a, text: "Die Struktur des CRM-Systems." }
          - { key: b, text: "Alle Zahlen im Bericht vor der Freigabe." }
          - { key: c, text: "Die Vorlagen für die nächste Woche." }
        answer: b
        why: 'Frau Weber: "Alle Zahlen müssen vorher von Ihnen überprüft werden."'
      - q: "Bis wann muss der Bericht abgeschlossen sein?"
        options:
          - { key: a, text: "Bis zum 1. jedes Monats." }
          - { key: b, text: "Bis zum 10. jedes Monats." }
          - { key: c, text: "Bis zum 5. jedes Monats." }
        answer: c
        why: 'Frau Weber: "Er muss bis zum 5. jedes Monats abgeschlossen ... werden."'
      - q: "Wurden die anderen Abteilungen schon informiert?"
        options:
          - { key: a, text: "Ja, alle Teams sind bereits benachrichtigt worden." }
          - { key: b, text: "Nein, noch nicht." }
          - { key: c, text: "Nur die Marketingabteilung wurde informiert." }
        answer: a
        why: 'Frau Weber: "Ja, alle Teams sind bereits benachrichtigt worden."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the radio news bulletin and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Hier sind die Berliner Nachrichten vom 15. Juni. Das neue Kulturzentrum in Mitte
      ist heute Morgen offiziell {1} worden. Das Gebäude wurde 2021 {2} und
      vor drei Jahren von einem internationalen Architekturbüro {3}. Die
      Eröffnung wurde ursprünglich für letztes Jahr geplant, musste aber wegen
      Lieferproblemen {4} werden. Ab sofort können Eintrittskarten online
      {5} werden. Außerdem wurde heute bekannt gegeben, dass die Fahrradwege im
      Bezirk Mitte bis Ende des Jahres ausgebaut werden {6}.
    bank: [eröffnet, geplant, entworfen, verschoben, gebucht, sollen, gebaut, verlegt, renoviert]
    answers:
      "1": eröffnet
      "2": geplant
      "3": entworfen
      "4": verschoben
      "5": gebucht
      "6": sollen

  - id: H4
    block: H
    type: single-choice
    optionLayout: block
    title: "Kurze Ansage: Bahnhofsdurchsage"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the PA announcement at the train station. Then choose the correct answer (a, b, or c)."
    transcript: "Achtung, eine Durchsage. Die Abfahrt des ICE 743 nach München wird um 15 Minuten verschoben. Der Zug wird jetzt auf Gleis 7 bereitgestellt. Bitte beachten Sie: Gleis 5 wird wegen Bauarbeiten gesperrt und kann heute nicht benutzt werden. Reisende nach Frankfurt werden gebeten, auf den IC 280 umzusteigen. Der IC 280 fährt planmäßig ab Gleis 3 um 14:42 Uhr. Wir entschuldigen uns für die Unannehmlichkeiten."
    items:
      - q: "Warum wird der ICE 743 nach München verspätet?"
        options:
          - { key: a, text: "Die Abfahrt wird um 15 Minuten verschoben." }
          - { key: b, text: "Wegen eines technischen Problems am Zug." }
          - { key: c, text: "Der Zug fällt heute aus." }
        answer: a
        why: '"Die Abfahrt des ICE 743 nach München wird um 15 Minuten verschoben."'
      - q: "Auf welchem Gleis wird der ICE 743 bereitgestellt?"
        options:
          - { key: a, text: "Auf Gleis 5." }
          - { key: b, text: "Auf Gleis 7." }
          - { key: c, text: "Auf Gleis 3." }
        answer: b
        why: '"Der Zug wird jetzt auf Gleis 7 bereitgestellt."'
      - q: "Warum kann Gleis 5 heute nicht benutzt werden?"
        options:
          - { key: a, text: "Ein Zug steht dort und blockiert das Gleis." }
          - { key: b, text: "Gleis 5 ist für ICE-Züge reserviert." }
          - { key: c, text: "Gleis 5 wird wegen Bauarbeiten gesperrt." }
        answer: c
        why: '"Gleis 5 wird wegen Bauarbeiten gesperrt."'
      - q: "Was sollen Reisende nach Frankfurt tun?"
        options:
          - { key: a, text: "Auf den IC 280 umsteigen." }
          - { key: b, text: "Auf den ICE 743 warten." }
          - { key: c, text: "Einen anderen Bahnhof aufsuchen." }
        answer: a
        why: '"Reisende nach Frankfurt werden gebeten, auf den IC 280 umzusteigen."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Passiv Präsens — Konjugationstabelle"
    instructions: "Fill in the Passiv Präsens conjugation table for three verbs. The Partizip II is given."
    columns: ["Pronomen", "machen → gemacht", "bauen → gebaut", "prüfen → geprüft"]
    rows:
      - label: "ich"
        cells:
          - { gap: 1, answer: "werde gemacht" }
          - { gap: 2, answer: "werde gebaut" }
          - { gap: 3, answer: "werde geprüft" }
      - label: "du"
        cells:
          - { gap: 4, answer: "wirst gemacht" }
          - { gap: 5, answer: "wirst gebaut" }
          - { gap: 6, answer: "wirst geprüft" }
      - label: "er/sie/es"
        cells:
          - { gap: 7, answer: "wird gemacht" }
          - { gap: 8, answer: "wird gebaut" }
          - { gap: 9, answer: "wird geprüft" }
      - label: "wir"
        cells:
          - { gap: 10, answer: "werden gemacht" }
          - { gap: 11, answer: "werden gebaut" }
          - { gap: 12, answer: "werden geprüft" }
      - label: "ihr"
        cells:
          - { gap: 13, answer: "werdet gemacht" }
          - { gap: 14, answer: "werdet gebaut" }
          - { gap: 15, answer: "werdet geprüft" }
      - label: "sie/Sie"
        cells:
          - { gap: 16, answer: "werden gemacht" }
          - { gap: 17, answer: "werden gebaut" }
          - { gap: 18, answer: "werden geprüft" }

  - id: A2
    block: A
    type: gap-text
    layout: list
    title: "Passiv Präsens — Lücken füllen"
    instructions: "Fill each gap with the correct Passiv Präsens form (werden + Partizip II). 8 items."
    text: |
      1. Die Daten {1} täglich gesichert. (werden)
      2. Der Bericht {2} von der Software erstellt. (wird)
      3. Alle Mitarbeiter {3} über die neue Regelung informiert. (werden)
      4. Das Produkt {4} in Deutschland hergestellt. (wird)
      5. Die Qualität {5} von Technikern überprüft. (wird)
      6. Du {6} vom Chef persönlich begrüßt. (wirst)
      7. Wir {7} täglich mit neuen Aufgaben konfrontiert. (werden)
      8. Die Fehler {8} sofort korrigiert. (werden)
    answers:
      "1": werden
      "2": wird
      "3": werden
      "4": wird
      "5": wird
      "6": wirst
      "7": werden
      "8": werden

  - id: A3
    block: A
    type: gap-text
    layout: list
    title: "Aktiv → Passiv Präsens"
    instructions: "Transform the active sentence into the Passiv Präsens. The object becomes the subject. Fill in the passive form. 8 items."
    text: |
      1. Die Firma prüft den Bericht. → Der Bericht {1} (von der Firma) geprüft.
      2. Ein Roboter baut das Auto. → Das Auto {2} von einem Roboter gebaut.
      3. Man verarbeitet die Rohstoffe. → Die Rohstoffe {3} verarbeitet.
      4. Die Techniker kontrollieren die Bauteile. → Die Bauteile {4} von den Technikern kontrolliert.
      5. Die Software erstellt den Report. → Der Report {5} von der Software erstellt.
      6. Das Team entwickelt das Programm. → Das Programm {6} von dem Team entwickelt.
      7. Man genehmigt den Antrag. → Der Antrag {7} genehmigt.
      8. Die Schulen unterrichten die Kinder. → Die Kinder {8} von den Schulen unterrichtet.
    answers:
      "1": wird
      "2": wird
      "3": werden
      "4": werden
      "5": wird
      "6": wird
      "7": wird
      "8": werden

  - id: A4
    block: A
    type: gap-text
    layout: list
    title: "Passiv Präteritum — wurde + Partizip II"
    instructions: "Fill each gap with the correct Passiv Präteritum form (wurde/wurden + Partizip II). 6 items."
    text: |
      1. Das Gesetz {1} 2019 geändert.
      2. Die ersten Elektroautos {2} in den 1990er Jahren hergestellt.
      3. Die Mitarbeiter {3} nicht rechtzeitig informiert.
      4. Das Gebäude {4} 2018 von einem bekannten Architekten entworfen.
      5. Das neue System {5} ohne Schulung eingeführt.
      6. Viele Fehler {6} in dem alten Bericht gefunden.
    answers:
      "1": wurde
      "2": wurden
      "3": wurden
      "4": wurde
      "5": wurde
      "6": wurden

  - id: A5
    block: A
    type: gap-text
    layout: list
    title: "Passiv Perfekt — ist … worden"
    instructions: "Fill each gap with the correct Passiv Perfekt form (sein + Partizip II + worden). Write the complete verb group. 6 items."
    text: |
      1. Das neue Kulturzentrum {1} heute eröffnet worden.
      2. Alle Teammitglieder {2} bereits benachrichtigt worden.
      3. Die Batteriekapazität {3} erheblich gesteigert worden.
      4. Der Fehler {4} sofort gemeldet worden.
      5. Die Schulungen {5} letzte Woche durchgeführt worden.
      6. Das Gesetz {6} noch nicht verabschiedet worden.
    answers:
      "1": ist
      "2": sind
      "3": ist
      "4": ist
      "5": sind
      "6": ist

  - id: A6
    block: A
    type: gap-text
    layout: list
    title: "Passiv mit Modalverben"
    instructions: "Fill each gap with the correct Modal + Passiv construction. The modal verb is given. 6 items."
    text: |
      1. Der Bericht _______ vorher überprüft werden. (müssen → muss)
      → Der Bericht {1} vorher überprüft werden.
      2. Die Daten _______ automatisch gespeichert werden. (können → können)
      → Die Daten {2} automatisch gespeichert werden.
      3. Alle Fehler _______ sofort gemeldet werden. (sollen → sollen)
      → Alle Fehler {3} sofort gemeldet werden.
      4. Das Gebäude _______ nicht betreten werden. (dürfen → darf)
      → Das Gebäude {4} nicht betreten werden.
      5. Die Genehmigung _______ beantragt werden. (müssen → muss)
      → Die Genehmigung {5} beantragt werden.
      6. Das System _______ bis Freitag aktualisiert werden. (sollen → soll)
      → Das System {6} bis Freitag aktualisiert werden.
    answers:
      "1": muss
      "2": können
      "3": sollen
      "4": darf
      "5": muss
      "6": soll

  - id: A7
    block: A
    type: gap-text
    layout: list
    title: "Gemischte Passivformen — richtigen Zeitform wählen"
    instructions: "Choose the correct passive form from context (Präsens / Präteritum / Perfekt / Modal). 6 items."
    text: |
      1. Jeden Tag [Präsens — current ongoing process] die Produkte von Robotern zusammengesetzt.
      → Die Produkte {1} von Robotern zusammengesetzt.
      2. Letztes Jahr [Präteritum — past event] das neue Gesetz verabschiedet.
      → Das neue Gesetz {2} verabschiedet.
      3. Bisher [Perfekt — up to now] alle Berichte manuell erstellt worden.
      → Alle Berichte {3} bisher manuell erstellt worden.
      4. In diesem Bereich [Modal Präsens — rule] nicht geraucht werden.
      → In diesem Bereich {4} nicht geraucht werden.
      5. Gestern [Präteritum — past] die Mitarbeiter über die neuen Regeln informiert.
      → Die Mitarbeiter {5} über die neuen Regeln informiert.
      6. Die Qualität [Modal Präsens — obligation] täglich überprüft werden.
      → Die Qualität {6} täglich überprüft werden.
    answers:
      "1": werden
      "2": wurde
      "3": sind
      "4": darf
      "5": wurden
      "6": muss

  - id: A8
    block: A
    type: order
    title: "Satzbau — Passiv-Sätze rekonstruieren"
    instructions: "Put the words in the correct order to build a passive sentence."
    items:
      - tiles: ["wird", "das", "Auto", "von", "Robotern", "gebaut"]
        answer: [1, 2, 0, 3, 4, 5]
        note: "Das Auto wird von Robotern gebaut."
      - tiles: ["wurden", "die", "Mitarbeiter", "nicht", "informiert"]
        answer: [1, 2, 0, 3, 4]
        note: "Die Mitarbeiter wurden nicht informiert."
      - tiles: ["muss", "der", "Fehler", "sofort", "gemeldet", "werden"]
        answer: [1, 2, 0, 3, 4, 5]
        note: "Der Fehler muss sofort gemeldet werden."
      - tiles: ["ist", "das", "Gesetz", "bereits", "geändert", "worden"]
        answer: [1, 2, 0, 3, 4, 5]
        note: "Das Gesetz ist bereits geändert worden."

  - id: A9
    block: A
    type: true-false
    title: "Passivformen überprüfen — richtig oder falsch?"
    instructions: "Is the passive form correct? Decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Das Buch ist geschrieben geworden."
        answer: false
        why: "Passiv Perfekt uses worden, not geworden. Correct: Das Buch ist geschrieben worden."
      - q: "Die Daten werden täglich gesichert."
        answer: true
        why: "Passiv Präsens: werden + Partizip II. Correct form."
      - q: "Das Gebäude ist 2020 gebaut worden."
        answer: true
        why: "Passiv Perfekt: ist + Partizip II + worden. Correct."
      - q: "Die Mitarbeiter wurden informiert geworden."
        answer: false
        why: "Passiv Präteritum does not use geworden. Correct: Die Mitarbeiter wurden informiert."
      - q: "Der Fehler muss gemeldet werden."
        answer: true
        why: "Modal + Partizip II + werden (infinitive). Correct structure."

  - id: A10
    block: A
    type: gap-text
    layout: list
    title: "Agentphrase — von + Dativ"
    instructions: "Add the agent phrase (von + Dativ) to each passive sentence. Use the cue in brackets. 6 items."
    text: |
      1. Das Auto wird ___ gebaut. (die Roboter)
      → Das Auto wird {1} gebaut.
      2. Der Bericht wird ___ überprüft. (die Controllerin)
      → Der Bericht wird {2} überprüft.
      3. Das System wurde ___ entwickelt. (ein kleines Team)
      → Das System wurde {3} entwickelt.
      4. Die Genehmigung wird ___ erteilt. (das Amt)
      → Die Genehmigung wird {4} erteilt.
      5. Die Schulung wurde ___ durchgeführt. (ein externer Trainer)
      → Die Schulung wurde {5} durchgeführt.
      6. Das Gebäude ist ___ entworfen worden. (eine bekannte Architektin)
      → Das Gebäude ist {6} entworfen worden.
    answers:
      "1": von den Robotern
      "2": von der Controllerin
      "3": von einem kleinen Team
      "4": vom Amt
      "5": von einem externen Trainer
      "6": von einer bekannten Architektin

  # ── Block B — Vertiefung ─────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    layout: list
    title: "Dialoglücken: Büroprozess beschreiben"
    instructions: "Complete the dialogue about a new office process. Fill in the correct passive form."
    text: |
      Frau Weber erklärt den neuen Prozess:
      1. Ab nächsten Monat {1} alle Berichte automatisch erstellt. (Passiv Präsens)
      2. Die Daten {2} aus dem CRM-System gezogen. (Passiv Präsens)
      3. Früher {3} alles manuell gemacht. (Passiv Präteritum)
      4. Jetzt {4} die Arbeitszeit durch das neue System reduziert worden. (Passiv Perfekt)
      5. Alle Fehler {5} sofort gemeldet werden. (müssen + Passiv)
      6. Der Bericht {6} bis zum 5. abgeschlossen werden. (muss + Passiv — already has muss)
    answers:
      "1": werden
      "2": werden
      "3": wurde
      "4": ist
      "5": müssen
      "6": muss

  - id: B2
    block: B
    type: gap-text
    layout: list
    title: "Finde den Fehler — Passivformen korrigieren"
    instructions: "Each sentence contains one error. Write the corrected sentence (or just the corrected word/phrase)."
    text: |
      1. Das Buch ist geschrieben geworden. → {1}
      2. Die Mitarbeiter wurden informiert geworden. → {2}
      3. Das System wird von dem Firma entwickelt. → {3}
      4. Der Fehler muss gemeldet sein. → {4}
      5. Das Gebäude wurde entworfen worden. → {5}
      6. Die Daten wirst jeden Tag gesichert. → {6}
    answers:
      "1": Das Buch ist geschrieben worden.
      "2": Die Mitarbeiter wurden informiert.
      "3": Das System wird von der Firma entwickelt.
      "4": Der Fehler muss gemeldet werden.
      "5": Das Gebäude wurde entworfen.
      "6": Die Daten werden jeden Tag gesichert.

  - id: B3
    block: B
    type: single-choice
    title: "Richtige Passivstruktur wählen"
    instructions: "Choose the correct passive structure (a, b, or c)."
    items:
      - q: "Das Gesetz ___ letztes Jahr ___."
        options:
          - { key: a, text: "ist … geändert worden" }
          - { key: b, text: "wurde … geändert" }
          - { key: c, text: "wird … geändert worden" }
        answer: b
        why: "Letztes Jahr = Präteritum context → Passiv Präteritum: wurde + Partizip II."
      - q: "Die Genehmigung ___ beantragt ___."
        options:
          - { key: a, text: "muss … werden" }
          - { key: b, text: "muss … sein" }
          - { key: c, text: "muss … geworden" }
        answer: a
        why: "Modal + Passiv = Modal + Partizip II + werden (infinitive)."
      - q: "Der Bericht ___ bereits ___."
        options:
          - { key: a, text: "wurde … abgeschlossen worden" }
          - { key: b, text: "ist … abgeschlossen worden" }
          - { key: c, text: "ist … abgeschlossen geworden" }
        answer: b
        why: "Passiv Perfekt = ist + Partizip II + worden (NOT geworden)."
      - q: "Täglich ___ die Qualität von Technikern ___."
        options:
          - { key: a, text: "wurde … überprüft" }
          - { key: b, text: "wird … überprüft" }
          - { key: c, text: "ist … überprüft worden" }
        answer: b
        why: "Täglich = ongoing, present → Passiv Präsens: wird + Partizip II."
      - q: "Das Gebäude ___ 2019 von einer Architektin ___."
        options:
          - { key: a, text: "ist … entworfen" }
          - { key: b, text: "wird … entworfen" }
          - { key: c, text: "wurde … entworfen" }
        answer: c
        why: "2019 = past date → Passiv Präteritum: wurde + Partizip II."
      - q: "Fehler ___ in diesem Schritt nicht ___ ___."
        options:
          - { key: a, text: "dürfen … übersehen … werden" }
          - { key: b, text: "dürfen … übersehen … sein" }
          - { key: c, text: "müssen … übersehen … werden" }
        answer: a
        why: "dürfen nicht + Passiv = dürfen + Partizip II + werden. müssen would mean the opposite."

  - id: B4
    block: B
    type: matching
    title: "Aktiv- und Passivsätze verbinden"
    instructions: "Match each active sentence (left) with its correct passive equivalent (right)."
    left:
      - { key: "1", text: "Die Firma baut das Auto." }
      - { key: "2", text: "Man hat den Fehler gefunden." }
      - { key: "3", text: "Ein Team entwickelte das Programm." }
      - { key: "4", text: "Die Schulen müssen die Kinder unterrichten." }
    right:
      - { key: a, text: "Das Auto wird von der Firma gebaut." }
      - { key: b, text: "Der Fehler ist gefunden worden." }
      - { key: c, text: "Das Programm wurde von einem Team entwickelt." }
      - { key: d, text: "Die Kinder müssen von den Schulen unterrichtet werden." }
      - { key: e, text: "Das Auto ist von der Firma gebaut worden." }
    answers:
      "1": a
      "2": b
      "3": c
      "4": d

  - id: B5
    block: B
    type: order
    title: "Passiv-Wortstellung: Sätze ordnen"
    instructions: "Put the words in the correct order to form grammatically correct passive sentences."
    items:
      - tiles: ["Die", "Rohstoffe", "werden", "aus", "mehreren", "Ländern", "importiert"]
        answer: [0, 1, 2, 3, 4, 5, 6]
        note: "Die Rohstoffe werden aus mehreren Ländern importiert."
      - tiles: ["Das", "Programm", "ist", "von", "einem", "kleinen", "Team", "entwickelt", "worden"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7, 8]
        note: "Das Programm ist von einem kleinen Team entwickelt worden."
      - tiles: ["kann", "Die", "Produktion", "schnell", "gesteigert", "werden"]
        answer: [1, 2, 0, 3, 4, 5]
        note: "Die Produktion kann schnell gesteigert werden."
      - tiles: ["wurden", "Alle", "Mitarbeiter", "über", "die", "neue", "Regelung", "informiert"]
        answer: [1, 2, 0, 3, 4, 5, 6, 7]
        note: "Alle Mitarbeiter wurden über die neue Regelung informiert."

  - id: B6
    block: B
    type: gap-text
    layout: list
    title: "Nachrichtensprache — Passivsätze vervollständigen"
