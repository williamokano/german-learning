  - id: D2
    block: D
    type: odd-one-out
    title: "Wortschatz-Check: Welches Wort passt nicht?"
    groups:
      - { items: ["herstellen", "produzieren", "verarbeiten", "ankündigen"], odd: 3, why: "ankündigen = to announce (news language); the others are production verbs." }
      - { items: ["wurde", "wird", "worden", "geworden"], odd: 3, why: "geworden is the Partizip II of werden as a full verb (to become — er ist Arzt geworden) — it does NOT appear in passive constructions. The others (wurde, wird, worden) are all auxiliary forms of werden used in Passiv." }
      - { items: ["der Rohstoff", "die Fabrik", "die Anlage", "die Meldung"], odd: 3, why: "die Meldung = news item (news language); the others are production/manufacturing vocabulary." }
      - { items: ["müssen", "können", "sollen", "werden"], odd: 3, why: "werden is not a modal verb — it is the auxiliary for Passiv and Futur. The others are modal verbs." }
      - { items: ["prüfen", "überprüfen", "kontrollieren", "beschließen"], odd: 3, why: "beschließen = to decide; the others all mean to check/inspect." }
      - { items: ["die Genehmigung", "der Bericht", "die Schulung", "der Rohstoff"], odd: 3, why: "der Rohstoff = raw material (production); the others are workplace/process documents and activities." }

