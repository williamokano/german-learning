lesson: B1/07
title: "B1 · Lektion 7 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: H+A on day 1, B on day 2, C on day 3, D on day 4.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Layla hat das Fahrrad bei einem Berliner Laden gefunden."
        answer: false
        why: 'Sie hat es auf eBay Kleinanzeigen gefunden.'
      - q: "Der Name des Verkäufers ist Björn Koch."
        answer: true
        why: 'Layla liest: „Der Name des Verkäufers ist Björn Koch."'
      - q: "Das Fahrrad kostet dreihundert Euro."
        answer: false
        why: 'Layla sagt: „Zweihundert Euro."'
      - q: "Der Verkäufer verkauft das Fahrrad wegen seines Umzugs nach München."
        answer: true
        why: 'Layla liest die Anzeige vor: „Ich verkaufe es wegen meines Umzugs nach München."'
      - q: "Hannah möchte den Zustand des Fahrrads prüfen, bevor sie kaufen."
        answer: true
        why: 'Hannah: „nur, wenn wir den Zustand des Fahrrads vorher prüfen."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Warum kritisiert Herr Steinmeyer die Formulierung 'wegen dem globalen Wandel'?"
        options:
          - { key: a, text: "Weil das Wort 'Wandel' falsch geschrieben ist." }
          - { key: b, text: "Weil 'wegen' im Schriftdeutschen den Genitiv regiert." }
          - { key: c, text: "Weil der Satz keinen Sinn ergibt." }
        answer: b
        why: 'Herr Steinmeyer: „Im Schriftdeutschen regiert wegen den Genitiv."'
      - q: "Welche der folgenden Korrekturen nennt Herr Steinmeyer?"
        options:
          - { key: a, text: "'trotz dem Druck' → 'trotz des Drucks'" }
          - { key: b, text: "'trotz des Drucks' → 'trotz dem Druck'" }
          - { key: c, text: "'wegen des Wandels' → 'wegen dem Wandel'" }
        answer: a
        why: 'Herr Steinmeyer korrigiert „trotz dem wachsenden Druck" zu „trotz des wachsenden Drucks".'
      - q: "Was sagt Herr Steinmeyer über 'die Theorie von einem Kollegen'?"
        options:
          - { key: a, text: "Diese Form ist im Akademischen verboten." }
          - { key: b, text: "Beide Formen sind korrekt, aber Genitiv ist im akademischen Journal besser." }
          - { key: c, text: "Die Form ist nur im Mündlichen akzeptabel." }
        answer: b
        why: 'Herr Steinmeyer: „Beides ist korrekt, aber für ein akademisches Journal empfehle ich eindeutig den Genitiv."'
      - q: "Was macht Yusuf am Ende des Gesprächs?"
        options:
          - { key: a, text: "Er schickt das Abstract sofort ab." }
          - { key: b, text: "Er bittet Herr Steinmeyer um eine weitere Prüfung." }
          - { key: c, text: "Er verspricht, das Abstract noch heute zu überarbeiten." }
        answer: c
        why: 'Yusuf: „Ich überarbeite das Abstract noch heute."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to Hannah's phone message and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Guten Morgen, mein Name ist Hannah El-Sayed, ich bin die Mutter Layla El-Sayeds,
      Schülerin der Klasse 10b. Ich rufe an, um Ihnen mitzuteilen, dass Layla heute
      wegen einer starken {1} nicht am Unterricht teilnehmen kann. Trotz ihres {2},
      dennoch in die Schule zu gehen, habe ich ihr geraten, zu Hause zu bleiben.
      {3} des heutigen Schultages wird sie die verpassten Aufgaben zu Hause bearbeiten.
      {4} der persönlichen Abgabe werde ich die Hausaufgaben meiner Tochter morgen
      früh beim Sekretariat abgeben. Bitte entschuldigen Sie das {5} meiner Tochter.
      Auf {6}.
    bank: [Erkältung, Wunsches, Während, Statt, Fehlen, Wiederhören, Trotz, Urlaubs, Hoffnung]
    answers:
      "1": Erkältung
      "2": Wunsches
      "3": Während
      "4": Statt
      "5": Fehlen
      "6": Wiederhören

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Universitätsdurchsage"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the PA announcement. Then choose the correct answer (a, b, or c)."
    transcript: 'Achtung, eine Durchsage. Wegen der Wartungsarbeiten des Aufzugs ist das Hauptgebäude der Universität morgen, Dienstag, nur über den Seiteneingang zugänglich. Trotz des laufenden Vorlesungsbetriebs bitten wir alle Studierenden und Mitarbeitenden um Verständnis. Während der Wartungszeit stehen die Bibliothek des zweiten Stocks sowie die Seminarräume des Erdgeschosses wie gewohnt zur Verfügung. Statt des Haupteingangs nutzen Sie bitte den Eingang der Lindenstraße. Wir danken für Ihr Verständnis.'
    items:
      - q: "Warum ist der Haupteingang morgen geschlossen?"
        options:
          - { key: a, text: "Wegen einer Veranstaltung im Hauptgebäude." }
          - { key: b, text: "Wegen der Wartungsarbeiten des Aufzugs." }
          - { key: c, text: "Wegen einer Sicherheitskontrolle." }
        answer: b
        why: '"Wegen der Wartungsarbeiten des Aufzugs ist das Hauptgebäude … nur über den Seiteneingang zugänglich."'
      - q: "Was steht während der Wartungszeit zur Verfügung?"
        options:
          - { key: a, text: "Nur das Erdgeschoss ist geöffnet." }
          - { key: b, text: "Die Bibliothek und die Seminarräume sind zugänglich." }
          - { key: c, text: "Das gesamte Gebäude ist gesperrt." }
        answer: b
        why: '"die Bibliothek des zweiten Stocks sowie die Seminarräume des Erdgeschosses stehen wie gewohnt zur Verfügung."'
      - q: "Welchen Eingang sollen die Studierenden benutzen?"
        options:
          - { key: a, text: "Den Eingang am Parkplatz." }
          - { key: b, text: "Den Haupteingang wie immer." }
          - { key: c, text: "Den Eingang der Lindenstraße." }
        answer: c
        why: '"Statt des Haupteingangs nutzen Sie bitte den Eingang der Lindenstraße."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
    title: "Die vier Fälle — vollständige Artikeltabelle (Genitiv ergänzen)"
    instructions: "Complete the full 4-case table. The Nominativ/Akkusativ/Dativ rows are given; fill in all Genitiv cells and the noun endings."
    columns: ["", "maskulin", "feminin", "neutral", "Plural"]
    rows:
      - label: "Nom."
        cells:
          - { gap: 1, answer: "der/ein Mann" }
          - { gap: 2, answer: "die/eine Frau" }
          - { gap: 3, answer: "das/ein Kind" }
          - { gap: 4, answer: "die/– Leute" }
      - label: "Akk."
        cells:
          - { gap: 5, answer: "den/einen Mann" }
          - { gap: 6, answer: "die/eine Frau" }
          - { gap: 7, answer: "das/ein Kind" }
          - { gap: 8, answer: "die/– Leute" }
      - label: "Dat."
        cells:
          - { gap: 9, answer: "dem/einem Mann" }
          - { gap: 10, answer: "der/einer Frau" }
          - { gap: 11, answer: "dem/einem Kind" }
          - { gap: 12, answer: "den/– Leuten" }
      - label: "Gen."
        cells:
          - { gap: 13, answer: "des/eines Mannes" }
          - { gap: 14, answer: "der/einer Frau" }
          - { gap: 15, answer: "des/eines Kindes" }
          - { gap: 16, answer: "der/– Leute" }

  - id: A2
    block: A
    type: gap-text
    layout: list
    title: "Genitivartikel einsetzen (des/der/eines/einer/keines/keiner)"
    instructions: "Fill each gap with the correct Genitiv article. Pay attention to gender."
    text: |
      1. Das ist das Büro {1} Professors. (maskulin)
      2. Der Titel {2} Studie ist sehr lang. (feminin)
      3. Ich kenne den Namen {3} Kollegen nicht. (maskulin, n-Dekl.)
      4. Das ist das Auto {4} Direktors. (maskulin)
      5. Hast du die Ergebnisse {5} Experiments gesehen? (neutral)
      6. Die Meinung {6} Mehrheit ist wichtig. (feminin)
      7. Ich habe das Fahrrad {7} Studenten repariert. (maskulin, n-Dekl.)
      8. Wegen {8} schlechten Wetters bleiben wir drinnen. (neutral)
    answers:
      "1": des
      "2": der
      "3": des
      "4": des
      "5": des
      "6": der
      "7": des
      "8": des

  - id: A3
    block: A
    type: gap-text
    layout: list
    title: "Nominalendung im Genitiv: -es oder -s?"
    instructions: "Add the correct Genitiv ending to each noun in bold. Write the complete Genitiv form."
    text: |
      1. der Name des **Vater**{1}
      2. der Preis des **Haus**{2}
      3. das Büro des **Kollege**{3} (n-Deklination!)
      4. die Farbe des **Kind**{4}
      5. die Meinung des **Mensch**{5} (n-Deklination!)
      6. der Autor des **Artikel**{6}
      7. die Pflicht des **Mieter**{7}
