  - id: A4
    block: A
    type: gap-text
    layout: list
    title: "Genitivpräpositionen: wegen / trotz / während / statt"
    instructions: "Fill each gap with the correct preposition and Genitiv article."
    text: |
      1. _______ {1} Regens blieben wir zu Hause. (because of — der Regen)
      2. _______ {2} starken Lärms konnte ich nicht schlafen. (despite — der Lärm)
      3. _______ {3} Vorlesung darf man nicht telefonieren. (during — die Vorlesung)
      4. _______ {4} Tees trank er Kaffee. (instead of — der Tee)
      5. _______ {5} Umbaus ist die Mensa geschlossen. (because of — der Umbau)
      6. _______ {6} Erkältung ging er trotzdem ins Büro. (despite — die Erkältung)
    answers:
      "1": "Wegen des"
      "2": "Trotz des"
      "3": "Während der"
      "4": "Statt des"
      "5": "Wegen des"
      "6": "Trotz der"

  - id: A5
    block: A
    type: gap-text
    layout: list
    title: "n-Deklination im Genitiv"
    instructions: "Fill each gap with the correct Genitiv form of the n-Deklination noun in parentheses."
    text: |
      1. Die Arbeit {1} ist sehr interessant. (der Journalist)
      2. Das Büro {2} liegt im zweiten Stock. (der Kollege)
      3. Ich kenne den Namen {3} nicht. (der Student)
      4. Die Rede {4} war überzeugend. (der Präsident)
      5. Das ist die Theorie {5}. (der Philosoph)
      6. Wegen {6} müssen wir eine Lösung finden. (der Mensch, Plural)
    answers:
      "1": "des Journalisten"
      "2": "des Kollegen"
      "3": "des Studenten"
      "4": "des Präsidenten"
      "5": "des Philosophen"
      "6": "der Menschen"

  - id: A6
    block: A
    type: gap-text
    layout: list
    title: "Eigennamen im Genitiv"
    instructions: "Write the correct Genitive form of the name in parentheses."
    text: |
      1. Das ist {1} Buch. (Anna)
      2. Wir haben {2} Auto gesehen. (Paul)
      3. Ich lese {3} Artikel. (Yusuf)
      4. Das ist {4} Buch. (Hans — name ending in s!)
      5. Das ist {5} Idee. (Max — name ending in x!)
      6. {6} Fahrrad ist neu. (Layla)
    answers:
      "1": "Annas"
      "2": "Pauls"
      "3": "Yusufs"
      "4": "Hans'"
      "5": "Max'"
      "6": "Laylas"

  - id: A7
    block: A
    type: gap-text
    layout: list
    title: "von + Dativ ↔ Genitiv: beide Formen"
    instructions: "Transform each sentence into both forms: (a) Genitiv, (b) von + Dativ."
    text: |
      1a. Das ist das Auto _____ (mein Vater — Genitiv). {1}
      1b. Das ist das Auto _____ (mein Vater — von + Dativ). {2}
      2a. Wir kennen die Meinung _____ (der Professor — Genitiv). {3}
      2b. Wir kennen die Meinung _____ (der Professor — von + Dativ). {4}
      3a. Das ist die Theorie _____ (ein Kollege — Genitiv). {5}
      3b. Das ist die Theorie _____ (ein Kollege — von + Dativ). {6}
    answers:
      "1": "meines Vaters"
      "2": "von meinem Vater"
      "3": "des Professors"
      "4": "vom Professor"
      "5": "eines Kollegen"
      "6": "von einem Kollegen"

  - id: A8
    block: A
    type: order
    title: "Genitivphrasen zusammensetzen"
    instructions: "Reconstruct each Genitiv noun phrase from the scrambled words."
    items:
      - { tiles: ["des", "der", "Name", "Verkäufers"], answer: [2, 0, 3, 1] }
      - { tiles: ["Zustand", "Fahrrads", "des", "Der"], answer: [3, 0, 2, 1] }
      - { tiles: ["Umzugs", "seines", "wegen"], answer: [2, 1, 0] }
      - { tiles: ["Symposiums", "des", "Während"], answer: [2, 1, 0] }

  - id: A9
    block: A
    type: true-false
    title: "Ist die Genitivform richtig? (Richtig / Falsch)"
    instructions: "Decide whether the underlined Genitiv form is correct (R) or wrong (F). If wrong, the correct form is in the solution."
    items:
      - q: "wegen **des Regens** blieben wir zu Hause"
        answer: true
        why: "Korrekt: wegen + Genitiv; der Regen → des Regens."
      - q: "die Meinung **dem Professor**"
        answer: false
        why: "Falsch: Dativ statt Genitiv. Korrekt: die Meinung des Professors."
      - q: "das Büro **des Kollegen**"
        answer: true
        why: "Korrekt: n-Deklination, der Kollege → des Kollegen."
      - q: "trotz **der Müdigkeit**"
        answer: true
        why: "Korrekt: trotz + Genitiv; die Müdigkeit → der Müdigkeit."
      - q: "während **dem Unterricht**"
        answer: false
        why: "Falsch: Dativ statt Genitiv. Korrekt: während des Unterrichts."

  - id: A10
    block: A
    type: gap-text
    layout: list
    title: "Gemischte Genitivübung — formelle Sätze"
    instructions: "Fill each gap with the correct Genitiv form (article + noun ending where needed)."
    text: |
      1. Der Autor {1} ist ein bekannter Philosoph. (das Buch)
      2. Wegen {2} konnte die Veranstaltung nicht stattfinden. (der Streik)
      3. Die Ergebnisse {3} werden morgen veröffentlicht. (die Studie)
      4. Trotz {4} hat er das Referat gehalten. (die Grippe)
      5. Das ist die Aufgabe {5}. (der Mieter)
      6. Während {6} sind alle Fenster geschlossen. (die Heizperiode)
    answers:
      "1": "des Buches"
      "2": "des Streiks"
      "3": "der Studie"
      "4": "der Grippe"
      "5": "des Mieters"
      "6": "der Heizperiode"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    title: "Lückendialog — akademisches Gespräch"
    instructions: "Fill in the gaps in this formal academic exchange. Choose from the options in brackets."
    text: |
      Herr Steinmeyer: Haben Sie die Ergebnisse {1} (der Studie / dem Studie / des Studie) bereits ausgewertet?
      Yusuf: Ja, die Daten {2} (des Experiments / dem Experiment / der Experiments) sind sehr aufschlussreich.
      Herr Steinmeyer: Und die Meinung {3} (des Kollegen / dem Kollegen / der Kollegen) aus Wien — kennen Sie sie?
      Yusuf: Ja, wegen {4} (des Symposiums / dem Symposium / der Symposium) im April habe ich ihn kennengelernt.
      Herr Steinmeyer: Trotz {5} (der kurzen Zeit / dem kurzen Zeit / des kurzen Zeit) haben Sie viel erreicht.
      Yusuf: Danke. Statt {6} (einer langen Einleitung / einer langen Einführung / einem langen) möchte ich direkt mit den Ergebnissen beginnen.
    answers:
      "1": "der Studie"
      "2": "des Experiments"
      "3": "des Kollegen"
      "4": "des Symposiums"
      "5": "der kurzen Zeit"
      "6": "einer langen Einleitung"

  - id: B2
    block: B
    type: gap-text
    layout: list
    title: "Finde den Fehler — Dativ statt Genitiv"
    instructions: "Each sentence contains a Genitiv error (Dativ used instead of Genitiv, or wrong noun ending). Write the corrected sentence."
    text: |
      1. Das ist das Auto von dem Professor. (formal → Genitiv) {1}
      2. wegen dem schlechten Wetter blieben wir zu Hause {2}
      3. die Meinung dem Studenten ist interessant {3}
      4. trotz dem Lärm hat er geschlafen {4}
      5. das Büro von dem Kollegen liegt im dritten Stock {5}
      6. während dem Unterricht darf man nicht essen {6}
    answers:
      "1": "Das ist das Auto des Professors."
      "2": "Wegen des schlechten Wetters blieben wir zu Hause."
      "3": "Die Meinung des Studenten ist interessant."
      "4": "Trotz des Lärms hat er geschlafen."
      "5": "Das Büro des Kollegen liegt im dritten Stock."
      "6": "Während des Unterrichts darf man nicht essen."

  - id: B3
    block: B
    type: single-choice
    title: "Die richtige Genitivform wählen"
    instructions: "Wähle die richtige Antwort (a, b oder c)."
    items:
      - q: "Das ist die Theorie ______."
        options:
          - { key: a, text: "des Philosophen" }
          - { key: b, text: "dem Philosophen" }
          - { key: c, text: "der Philosophen" }
        answer: a
        why: "Genitiv maskulin n-Deklination: des Philosophen."
      - q: "Wegen ______ kommt er nicht."
        options:
          - { key: a, text: "der Grippe" }
          - { key: b, text: "die Grippe" }
          - { key: c, text: "dem Grippe" }
        answer: a
        why: "wegen + Genitiv; die Grippe → der Grippe."
      - q: "Statt ______ nehmen wir den Bus."
        options:
          - { key: a, text: "des Zuges" }
          - { key: b, text: "dem Zug" }
          - { key: c, text: "den Zug" }
        answer: a
        why: "statt + Genitiv; der Zug → des Zuges."
      - q: "Die Ergebnisse ______ werden veröffentlicht."
        options:
          - { key: a, text: "der Forschung" }
          - { key: b, text: "die Forschung" }
          - { key: c, text: "dem Forschung" }
        answer: a
        why: "Genitiv feminin: die Forschung → der Forschung."
      - q: "Während ______ ist Ruhe Pflicht."
        options:
          - { key: a, text: "des Konzerts" }
          - { key: b, text: "dem Konzert" }
          - { key: c, text: "das Konzert" }
        answer: a
        why: "während + Genitiv; das Konzert → des Konzerts."
      - q: "Das ist ______ Buch. (Hans)"
        options:
          - { key: a, text: "Hansens" }
          - { key: b, text: "Hans'" }
          - { key: c, text: "Hans's" }
        answer: b
        why: "Namen auf -s: Apostrophe, kein zusätzliches -s."

  - id: B4
    block: B
    type: matching
    title: "Genitivpräposition zum richtigen Kontext"
