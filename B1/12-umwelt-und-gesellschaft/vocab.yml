# Reviewed from B1/12 lesson.md §4 Wortschatz.
# Note: V2 parser's umlaut heuristic misfired on 8 entries whose plural code is a bare
# `–` (en dash = "no plural", same convention as B1/01's `der Wandel, –`) — V2 treats
# any `–`-prefixed code as an umlaut signal and force-umlauted the FIRST vowel even
# with no suffix (Klimawandel → Klimäwandel, Luftverschmutzung → Lüftverschmutzung,
# etc.). All 8 restored to `plural: null`. 3 entries use the lesson's own explicit
# umlaut spelling `-ä-e` (CO₂-Ausstoß, Rückgang, Verbrauch, Mindestlohn) which V2
# doesn't parse at all (non-standard code shape); derived by hand from German
# morphology. 2 attributive-adjective+noun phrases (`erneuerbare Energien`, `soziale
# Gerechtigkeit`) kept as non-core phrases. 4 verb entries mistyped `pos: phrase`
# (2 separable + `überarbeiten`); re-typed.
#
# Section headers in lesson.md:
#   Umwelt und Klimawandel         — 16 nouns (2 phrases: erneuerbare Energien)
#   Gesellschaft und Sozialpolitik — 11 nouns (1 phrase: soziale Gerechtigkeit)
