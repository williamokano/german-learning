  - id: A11
    block: A
    type: order
    title: "Satzbau: Nominalstil-Sätze richtig ordnen"
    instructions: "Put the words in the correct order to form a Nominalstil sentence."
    items:
      - tiles: ["Der", "Schutz", "der", "Umwelt", "ist", "eine", "gesamtgesellschaftliche", "Aufgabe"]
        answer: [0, 1, 2, 3, 4, 5, 6, 7]
        note: "Der Schutz der Umwelt ist eine gesamtgesellschaftliche Aufgabe."
