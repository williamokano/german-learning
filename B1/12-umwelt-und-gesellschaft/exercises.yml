  - id: A9
    block: A
    type: gap-text
    layout: list
    title: "Passiv mit Modalverben — Umwelt und Gesellschaft"
    instructions: "Fill in the Passiv-mit-Modal form (modal + Partizip II + werden). 6 items."
    text: |
      1. Die Emissionen {1}. (müssen / reduzieren)
      2. Neue Gesetze {2}. (sollen / einführen)
      3. Der ÖPNV {3}. (muss / ausbauen)
      4. Plastikverpackungen {4}. (sollen / verbieten)
      5. Mehr Solaranlagen {5}. (müssen / installieren)
      6. Die Förderung {6}. (muss / erhöhen)
    answers:
