  - id: A8
    block: A
    type: gap-text
    layout: list
    title: "Passiv im Umweltkontext — Präsens"
    instructions: "Fill in the correct Präsens Passiv form (wird/werden + Partizip II). 6 items."
    text: |
      1. Jährlich {1} Millionen Tonnen CO₂ ausgestoßen. (ausstoßen)
      2. Erneuerbare Energien {2} zunehmend genutzt. (nutzen)
      3. Eine Citymaut {3} eingeführt. (einführen)
