  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    layout: list
    title: "Dialog ergänzen: Diskussion über die Citymaut"
    instructions: "Fill in the 8 blanks. Use Nominalisierungen, opinion phrases, or Passiv as indicated."
    text: |
      — Lukas, was denkst du über die neue Citymaut?
      — Ich bin {1}, dass die Einführung der Citymaut überfällig ist. (der Ansicht)
      — Und du, Mia? Wie findest du das?
      — Einerseits ist {2} der Luftqualität wichtig, andererseits trifft es
        kleine Betriebe. (die Verbesserung)
      — Stimmt. Nicht nur die Luft, {3} auch der Lärm soll abnehmen. (sondern)
      — Was passiert mit den Einnahmen? {4} sie zweckgebunden? (werden)
      — Ja, sie {5} in den Ausbau des ÖPNV investiert werden. (sollen)
      — {6} des öffentlichen Nahverkehrs ist natürlich sinnvoll. (der Ausbau)
      — Zwar sind die ökologischen Vorteile klar, {7} darf die soziale
        Gerechtigkeit nicht vergessen werden. (aber)
      — Ich halte es {8}, alle Gesellschaftsgruppen einzubeziehen. (für wichtig)
    answers:
      "1": der Ansicht
      "2": die Verbesserung
      "3": sondern
      "4": Werden
      "5": sollen
      "6": Der Ausbau
      "7": aber
      "8": für wichtig

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler — Nominalisierung und Passiv"
    prompt: "Each sentence contains exactly one error. Find it and write the corrected sentence. 6 items."
    stimulus: |
      1. Das Heizen ist teuer. Deshalb die Kosten werden reduziert. (Passiv word order)
      2. Die Möglichung eines Verbots wird diskutiert. (wrong suffix)
      3. Das Recyclen von Plastik spart Ressourcen. (spelling of Gerundium)
      4. Die Wichtigheit der Maßnahmen ist klar. (wrong suffix)
      5. Durch das Energiesparen wird der CO₂-Ausstoß sinken. (Passiv tense mix)
      6. Die Einführen der Citymaut ist geplant. (verb used instead of -ung noun)
    model: |
      1. Deshalb werden die Kosten reduziert. (Verb in position 2 in Passiv main clause)
      2. Die Möglichkeit eines Verbots wird diskutiert. (möglich → -keit, not -ung)
      3. Das Recyceln von Plastik spart Ressourcen. (Gerundium: recyceln → das Recyceln)
      4. Die Wichtigkeit der Maßnahmen ist klar. (wichtig → -keit, not -heit)
      5. Durch das Energiesparen sinkt der CO₂-Ausstoß. (no Passiv needed — Aktiv with sinken)
      6. Die Einführung der Citymaut ist geplant. (verb einführen → die Einführung)

  - id: B3
    block: B
    type: single-choice
    title: "Richtigen Ausdruck wählen: Nominalstil und Meinung"
    instructions: "Choose the correct option (a, b, or c)."
    items:
      - q: "______ der Luftqualität ist das wichtigste Ziel der Stadtpolitik."
        options:
          - { key: a, text: "Das Verbessern" }
          - { key: b, text: "Die Verbesserung" }
          - { key: c, text: "Verbessert" }
        answer: b
        why: "As a subject noun, -ung form is standard here: die Verbesserung. Das Verbessern (Gerundium) is also possible but less common in formal written German for this structure."
      - q: "Jährlich ______ Millionen Tonnen CO₂ ausgestoßen."
        options:
          - { key: a, text: "wird" }
          - { key: b, text: "werden" }
          - { key: c, text: "ist" }
        answer: b
        why: "Plural subject (Millionen Tonnen) → werden (not wird)."
      - q: "Ich bin der ______, dass erneuerbare Energien die Zukunft sind."
        options:
          - { key: a, text: "Ansicht" }
          - { key: b, text: "Meinung" }
          - { key: c, text: "Idee" }
        answer: a
        why: '"Ich bin der Ansicht, dass …" is the standard opinion formula. "Ich bin der Meinung" also works (accept both in free writing, but here only a is listed).'
      - q: "Neue Maßnahmen ______ eingeführt werden."
        options:
          - { key: a, text: "sollen" }
          - { key: b, text: "haben" }
          - { key: c, text: "sind" }
        answer: a
        why: "Passiv mit Modal: sollen + Partizip II + werden."
      - q: "______ des Handelns ist unbestreitbar."
        options:
          - { key: a, text: "Die Notwendigkeit" }
          - { key: b, text: "Der Notwendig" }
          - { key: c, text: "Das Notwendigsein" }
        answer: a
        why: "notwendig → die Notwendigkeit (Adjektiv + -keit suffix, feminine)."
      - q: "Nicht nur die Luft, ______ auch der Lärm soll abnehmen."
        options:
          - { key: a, text: "aber" }
          - { key: b, text: "sondern" }
          - { key: c, text: "trotzdem" }
        answer: b
        why: '"nicht nur … sondern auch" is the fixed two-part connector (B1/10).'

  - id: B4
    block: B
    type: matching
    title: "Meinung und Argument verbinden"
    instructions: "Match each sentence opener (1–6) with the correct continuation (a–g). One continuation is not needed."
    left:
      - { key: "1", text: "Meiner Meinung nach" }
      - { key: "2", text: "Einerseits … andererseits" }
      - { key: "3", text: "Zwar sind die Vorteile klar," }
      - { key: "4", text: "Nicht nur der Nahverkehr," }
      - { key: "5", text: "Zusammenfassend lässt sich sagen," }
      - { key: "6", text: "Dafür spricht, dass" }
    right:
      - { key: a, text: "ist die Einführung der Citymaut ein richtiger Schritt." }
      - { key: b, text: "ist die Verbesserung der Luft wichtig, aber die Kosten treffen kleine Betriebe." }
      - { key: c, text: "aber die sofortige Belastung ist real." }
      - { key: d, text: "sondern auch das Radwegenetz muss ausgebaut werden." }
      - { key: e, text: "die Emissionen in anderen Städten deutlich gesunken sind." }
      - { key: f, text: "dass die Maßnahmen sofort wirken." }
      - { key: g, text: "obwohl niemand die Details kennt." }
