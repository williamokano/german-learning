lesson: B1/12
title: "B1 · Lektion 12 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: H+A on day 1, B on day 2, C on day 3, D on day 4.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Lukas ist gegen die Einführung der Citymaut."
        answer: false
        why: 'Lukas says "Endlich!" and argues for the congestion charge.'
      - q: "Pavel macht sich Sorgen um Handwerker und kleine Betriebe."
        answer: true
        why: 'Pavel asks: "Was ist mit Handwerkern, die Werkzeug transportieren müssen?"'
      - q: "Mia ist vollständig überzeugt, dass die Citymaut gut ist."
        answer: false
        why: "Mia presents a balanced view — she acknowledges both sides and calls for real alternatives."
      - q: "Lukas sagt, dass die Einnahmen aus der Citymaut in den ÖPNV investiert werden sollen."
        answer: true
        why: 'Lukas: "ein Teil der Einnahmen soll in den Ausbau des ÖPNV investiert werden."'
      - q: "Pavel kommt aus Österreich und kennt ähnliche Erfahrungen."
        answer: false
        why: "Pavel comes from the Czech Republic (er kommt aus Tschechien), not Austria."

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (Yusuf und Hannah)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was macht Yusuf am Anfang des Dialogs?"
        options:
          - { key: a, text: "Er liest einen fertigen Artikel vor." }
          - { key: b, text: "Er liest Hannah seinen Entwurf vor." }
          - { key: c, text: "Er schreibt zum ersten Mal." }
        answer: b
        why: 'Yusuf: "Ich lese dir meinen ersten Entwurf vor."'
      - q: "Was kritisiert Hannah an Yusufs erstem Satz?"
        options:
          - { key: a, text: "Er ist zu lang." }
          - { key: b, text: "Er klingt zu journalistisch und anklagend." }
          - { key: c, text: "Er enthält einen Grammatikfehler." }
        answer: b
        why: 'Hannah: "er klingt journalistisch, fast anklagend."'
      - q: "Welches Grammatikgeschlecht haben nominalisierte Verben (Gerundium)?"
        options:
          - { key: a, text: "Maskulinum (der)" }
          - { key: b, text: "Femininum (die)" }
          - { key: c, text: "Neutrum (das)" }
        answer: c
        why: 'Hannah: "alle nominalisierten Verben sind Neutrum: das Recyceln, das Heizen, das Fliegen."'
      - q: 'Wie bildet man aus dem Adjektiv „möglich" ein Nomen?'
        options:
          - { key: a, text: "die Möglichung" }
          - { key: b, text: "die Möglichkeit" }
          - { key: c, text: "das Möglich" }
        answer: b
        why: 'Hannah: "möglich → die Möglichkeit" — Adjektive + -keit/-heit.'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Anna und Bruno im Supermarkt) and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Anna und Bruno diskutieren im Supermarkt über das neue Plastikverbot.
      Anna findet, die {1} von Plastikverpackungen hätte schon lange verboten werden
      müssen. Bruno versteht das Argument, aber er findet, dass die {2} für Verbraucher
      größer geworden ist, weil Alternativen teurer sind. Anna antwortet, der {3}
      des Plastikmülls zeige, dass die Maßnahme wirkt. Bruno gibt zu, dass die
      {4} von Mehrwegverpackungen sich allmählich durchsetzt. Beide sind sich einig:
      Die {5} des Recycelns ist unbestreitbar, aber die {6} von Alternativen
      muss weiter verstärkt werden.
    bank: [Verwendung, Belastung, Rückgang, Nutzung, Notwendigkeit, Förderung, Einführung, Entwicklung, Verbesserung]
    answers:
      "1": Verwendung
      "2": Belastung
      "3": Rückgang
      "4": Nutzung
      "5": Notwendigkeit
      "6": Förderung

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Radiobeitrag über Berliner Klimapaket"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the radio news clip. Then choose the correct answer (a, b, or c)."
    transcript: "Hier ist der Deutschlandfunk mit einer Kurzmeldung. Das Berliner Abgeordnetenhaus hat heute ein neues Klimapaket verabschiedet. Darin werden mehrere Maßnahmen festgelegt: Erstens soll der öffentliche Nahverkehr bis 2028 vollständig elektrifiziert werden. Zweitens wird eine Citymaut für Pkw ab dem S-Bahn-Ring eingeführt. Drittens sollen Solaranlagen auf allen öffentlichen Gebäuden installiert werden. Umweltsenatorin Müller erklärte, die Reduzierung der Emissionen sei das oberste Ziel. Kritiker warnen jedoch vor einer zusätzlichen Belastung für Geringverdiener. Das war die Kurzmeldung des Tages."
    items:
      - q: "Was wurde heute im Abgeordnetenhaus verabschiedet?"
        options:
          - { key: a, text: "Ein neues Verkehrsgesetz." }
          - { key: b, text: "Ein neues Klimapaket." }
          - { key: c, text: "Ein Stadtentwicklungsplan." }
        answer: b
        why: '"Das Berliner Abgeordnetenhaus hat heute ein neues Klimapaket verabschiedet."'
      - q: "Bis wann soll der ÖPNV vollständig elektrifiziert werden?"
        options:
          - { key: a, text: "Bis 2025." }
          - { key: b, text: "Bis 2030." }
          - { key: c, text: "Bis 2028." }
        answer: c
        why: '"der öffentliche Nahverkehr soll bis 2028 vollständig elektrifiziert werden."'
      - q: "Was warnen Kritiker?"
        options:
          - { key: a, text: "Dass die Maßnahmen nicht wirken." }
          - { key: b, text: "Dass Geringverdiener zusätzlich belastet werden." }
          - { key: c, text: "Dass Solaranlagen zu teuer sind." }
        answer: b
        why: '"Kritiker warnen jedoch vor einer zusätzlichen Belastung für Geringverdiener."'
      - q: "Was ist laut Umweltsenatorin das oberste Ziel?"
        options:
          - { key: a, text: "Die Förderung des Fahrrads." }
          - { key: b, text: "Die Reduzierung der Emissionen." }
          - { key: c, text: "Die Einführung von Elektroautos." }
        answer: b
        why: '"die Reduzierung der Emissionen sei das oberste Ziel."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    layout: list
    title: "Nominalisierung: Verb → Nomen mit -ung"
    instructions: "Form the -ung noun from each verb. Write the noun with its article (always feminine: die). 8 items."
    text: |
      1. verbessern → {1}
      2. einführen → {2}
      3. entwickeln → {3}
      4. nutzen → {4}
      5. reduzieren → {5}
      6. fördern → {6}
      7. verwenden → {7}
      8. erhöhen → {8}
    answers:
      "1": die Verbesserung
      "2": die Einführung
      "3": die Entwicklung
      "4": die Nutzung
      "5": die Reduzierung
      "6": die Förderung
      "7": die Verwendung
      "8": die Erhöhung

  - id: A2
    block: A
    type: gap-text
    layout: list
    title: "Nominalisierung: Verb → Gerundium (Neutrum)"
    instructions: "Write the nominalized verb (Gerundium) with article `das`. 7 items."
    text: |
      1. recyceln → {1}
      2. heizen → {2}
      3. fliegen → {3}
      4. autofahren → {4}
      5. sparen → {5}
      6. schützen → {6}
      7. konsumieren → {7}
    answers:
      "1": das Recyceln
      "2": das Heizen
      "3": das Fliegen
      "4": das Autofahren
      "5": das Sparen
      "6": das Schützen
      "7": das Konsumieren

  - id: A3
    block: A
    type: gap-text
    layout: list
    title: "Nominalisierung: Adjektiv → Nomen mit -keit / -heit"
    instructions: "Form the abstract noun from each adjective. Write with article `die`. 6 items."
    text: |
      1. wichtig → {1}
      2. möglich → {2}
      3. notwendig → {3}
      4. sicher → {4}
      5. schwierig → {5}
      6. ehrlich → {6}
    answers:
      "1": die Wichtigkeit
      "2": die Möglichkeit
      "3": die Notwendigkeit
      "4": die Sicherheit
      "5": die Schwierigkeit
      "6": die Ehrlichkeit

  - id: A4
    block: A
    type: gap-text
    layout: list
    title: "Verbalstil → Nominalstil: Sätze umformulieren"
    instructions: "Rewrite each Verbalstil sentence in Nominalstil using the cue. 6 items."
    text: |
      1. Wir müssen die Umwelt schützen.
         → {1} der Umwelt ist notwendig. (der Schutz)
      2. Die Mieten steigen.
         → {2} der Mietpreise ist ein Problem. (der Anstieg)
      3. Man nutzt erneuerbare Energie.
         → {3} erneuerbarer Energien nimmt zu. (die Nutzung)
      4. Wenn man Energie spart, sinkt der CO₂-Ausstoß.
         → Durch {4} sinkt der CO₂-Ausstoß. (das Energiesparen)
      5. Man verbessert die Luftqualität.
         → {5} der Luftqualität ist das Ziel. (die Verbesserung)
      6. Man führt neue Maßnahmen ein.
         → {6} neuer Maßnahmen ist geplant. (die Einführung)
    answers:
      "1": Der Schutz
      "2": Der Anstieg
      "3": Die Nutzung
      "4": das Energiesparen
      "5": Die Verbesserung
      "6": Die Einführung

  - id: A5
    block: A
    type: gap-text
    layout: list
    title: "Nominalstil → Verbalstil: rück-transformieren"
    instructions: "Rewrite each Nominalstil phrase as a full Verbalstil sentence using the cue. 6 items."
    text: |
      1. Die Reduzierung der Emissionen ist dringend notwendig.
         → Man muss die Emissionen {1}.
      2. Der Ausbau des ÖPNV soll schneller erfolgen.
         → Der ÖPNV soll schneller {2}.
      3. Die Einführung der Citymaut wird diskutiert.
         → Man diskutiert, ob man die Citymaut {3}.
      4. Durch das Recyceln von Plastik spart man Ressourcen.
         → Wenn man Plastik {4}, spart man Ressourcen.
      5. Die Förderung erneuerbarer Energien muss zunehmen.
         → Erneuerbare Energien müssen stärker {5}.
      6. Die Notwendigkeit des Handelns ist klar.
         → Es ist klar, dass man {6} muss.
    answers:
      "1": reduzieren
      "2": ausgebaut werden
      "3": einführt
      "4": recycelt
      "5": gefördert werden
      "6": handeln

  - id: A6
    block: A
    type: true-false
    title: "Grammatik-Check: Nominalstil richtig gebildet?"
    instructions: "Is the nominalization correct? Answer R (richtig) oder F (falsch). If F, explain the error."
    items:
      - q: "Das Recyceln von Plastik ist sinnvoll. (nominalized verb, neuter)"
        answer: true
        why: "Correct: Gerundium — nominalized infinitive, always neuter: das Recyceln."
      - q: "Die Heizen ist teuer. (nominalized verb)"
        answer: false
        why: "Error: nominalized verbs are neuter, not feminine. Correct: Das Heizen ist teuer."
      - q: "Die Möglichkeit eines Verbots wird diskutiert. (Adjektiv → Nomen)"
        answer: true
        why: "Correct: möglich → die Möglichkeit (feminine, -keit suffix)."
      - q: "Die Wichtigheit der Maßnahmen ist klar."
        answer: false
        why: 'Error: the suffix is -keit not -heit for "wichtig". Correct: die Wichtigkeit.'
      - q: "Der Schutz der Umwelt ist notwendig. (Nominalstil for: Wir müssen die Umwelt schützen.)"
        answer: true
        why: "Correct Nominalstil transformation: schützen → der Schutz (masculine, no -ung)."

