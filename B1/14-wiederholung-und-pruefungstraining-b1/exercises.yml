      nicht nur Vokabeln auswendig kennt. Allerdings stimmt es, dass man auch
      ohne Zertifikat gut Deutsch lernen kann. Insgesamt denke ich, dass die
      Prüfung eine wertvolle Motivation ist. Hast du schon einmal an einer
      offiziellen Prüfung teilgenommen?

