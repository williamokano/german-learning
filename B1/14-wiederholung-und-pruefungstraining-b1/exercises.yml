lesson: B1/14
title: 'B1 · Lektion 14 — Übungen: Wiederholung & Prüfungstraining B1'
intro: >
  Willkommen zum Abschluss des B1-Kurses! This is a full mock exam sitting.
  Blocks: H Hören → A Lesen (exam simulation) → B Sprachbausteine (grammar
  review per topic) → C Schreiben (exam simulation) → D Selbsttest &
  Wiederholung. Answers in solutions.md.
  Tip: H on day 1, A on day 2, B on day 3, C+D on day 4. Aim for 80 %+ on D4
  before moving to B2.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: 'Dialog Hör-Check: Wiedersehen im Café (Cast Reunion)'
    audio: dialog1.mp3
    instructions: 'Lies den Dialog in lesson.md §1, dann höre ihn. Decide: Richtig (R) oder Falsch (F)?'
    items:
      - q: "Pavel sagt, der Hörteil war am Anfang etwas schwierig."
        answer: true
        why: 'Pavel: "obwohl der Hörteil am Anfang etwas schwierig war."'
      - q: "Tomáš nennt Pavel einen typischen Pessimisten."
        answer: false
        why: 'Tomáš says "typischen Optimismus" — optimism, not pessimism.'
      - q: "Anna empfiehlt, Texte einmal für die Hauptidee und einmal für die Details zu lesen."
        answer: true
        why: 'Anna: "einmal für die Hauptidee, einmal für die Details."'
      - q: "Bruno sagt, man muss jedes Wort verstehen."
        answer: false
        why: 'Bruno says the opposite: "Man muss nicht jedes Wort verstehen, sondern nach dem Kontext suchen."'
      - q: "Pavel hat für den Schreibteil zuerst eine Gliederung gemacht."
        answer: true
        why: 'Pavel: "Ich habe zuerst eine Gliederung geschrieben."'
      - q: 'Mia sagt: "Das Sprechen kommt durch Warten."'
        answer: false
        why: 'Mia says: "Das Sprechen kommt durch Sprechen. Nicht durch Warten."'

  - id: H3
    block: H
    type: gap-bank
    title: 'Hörtext-Lückentext: Durchsage im Goethe-Institut'
    audio: hoertext.mp3
    instructions: 'Listen to the announcement (Durchsage) and fill in the 6 missing words. Three words in the box are not needed.'
    text: |
      Achtung, eine {1} für alle Prüfungsteilnehmerinnen und
      Prüfungsteilnehmer des Goethe-Zertifikats B1. Bitte begeben Sie sich
      jetzt in den Prüfungssaal im ersten {2}. Mobiltelefone müssen
      {3} und in der Tasche verstaut sein. Elektronische {4} sind
      nicht erlaubt. Bitte halten Sie Ihren {5} bereit. Die Prüfung
      beginnt in {6} Minuten.
    bank:
      - Durchsage
      - Obergeschoss
      - ausgeschaltet
      - Hilfsmittel
      - Lichtbildausweis
      - fünf
      - Pause
      - Untergeschoss
      - eingeschaltet
    answers:
      '1': Durchsage
      '2': Obergeschoss
      '3': ausgeschaltet
      '4': Hilfsmittel
      '5': Lichtbildausweis
      '6': fünf

  - id: H4
    block: H
    type: single-choice
    title: 'Kurze Ansage: Anmeldung Goethe B1 — Prüfungsinformation'
    audio: transcript_ansage1.mp3
    instructions: 'Listen to the telephone message from the Goethe-Institut. Then choose the correct answer (a, b, or c).'
    transcript: "Guten Tag, hier ist das Goethe-Institut Berlin, Abteilung Prüfungen. Ich rufe an, um Sie über Ihren Prüfungstermin zu informieren. Ihre Goethe B1-Prüfung findet am Samstag, dem 28. Juni 2026, um 9 Uhr statt. Bitte erscheinen Sie mindestens 15 Minuten vorher. Bringen Sie bitte Ihren Personalausweis oder Reisepass mit — andere Dokumente werden nicht akzeptiert. Elektronische Geräte müssen ausgeschaltet bleiben. Bei Fragen erreichen Sie uns unter 030 25906-500. Bitte rufen Sie uns zurück, wenn Sie Ihre Anmeldebestätigung noch nicht erhalten haben. Wir wünschen Ihnen viel Erfolg!"
    items:
      - q: "Wann findet die Prüfung statt?"
        options:
          - { key: a, text: "Am Freitag, dem 27. Juni um 9 Uhr." }
          - { key: b, text: "Am Samstag, dem 28. Juni um 9 Uhr." }
          - { key: c, text: "Am Sonntag, dem 29. Juni um 10 Uhr." }
        answer: b
        why: '"Ihre Goethe B1-Prüfung findet am Samstag, dem 28. Juni 2026, um 9 Uhr statt."'
      - q: "Wie früh soll man erscheinen?"
        options:
          - { key: a, text: "30 Minuten vorher." }
          - { key: b, text: "Pünktlich um 9 Uhr." }
          - { key: c, text: "Mindestens 15 Minuten vorher." }
        answer: c
        why: '"Bitte erscheinen Sie mindestens 15 Minuten vorher."'
      - q: "Welches Dokument muss man mitbringen?"
        options:
          - { key: a, text: "Einen Führerschein oder eine Kundenkarte." }
          - { key: b, text: "Einen Personalausweis oder Reisepass." }
          - { key: c, text: "Nur eine Prüfungsanmeldung ist nötig." }
        answer: b
        why: '"Bringen Sie bitte Ihren Personalausweis oder Reisepass mit — andere Dokumente werden nicht akzeptiert."'
      - q: "Warum soll man zurückrufen?"
        options:
          - { key: a, text: "Um einen neuen Termin zu vereinbaren." }
          - { key: b, text: "Wenn man die Anmeldebestätigung noch nicht erhalten hat." }
          - { key: c, text: "Um das Testergebnis zu erfragen." }
        answer: b
        why: '"Bitte rufen Sie uns zurück, wenn Sie Ihre Anmeldebestätigung noch nicht erhalten haben."'

  # ── Block A — Lesen (Exam Simulation) ────────────────────────────────────

  - id: A1
    block: A
    type: true-false
    title: 'Lesen Teil 1 — Stellenanzeige (Text 1): Richtig / Falsch / Nicht im Text'
    instructions: >
      Read Text 1 (Stellenanzeige, lesson.md §5) and decide for each statement:
      Richtig (R), Falsch (F), oder Nicht im Text (N)?
      Use "true" for R, "false" for F, "not stated" answers are marked false
      here — check solutions.md for the full key.
    items:
      - q: "Die Stelle bei TechStart GmbH ist in Berlin-Mitte."
        answer: true
        why: '"TechStart GmbH, Berlin-Mitte" — stated in the job ad.'
      - q: "Man muss für die Stelle mindestens 3 Jahre Berufserfahrung haben."
        answer: false
        why: 'The ad asks for "Teamfähigkeit und eigenverantwortliches Arbeiten" but no specific years of experience are mentioned.'
      - q: "Das Gehalt beträgt zwischen 2.800 und 3.200 Euro brutto im Monat."
        answer: true
        why: '"Attraktives Gehalt (2.800–3.200 € brutto/Monat)"'
      - q: "Man darf zwei Tage pro Woche im Homeoffice arbeiten."
        answer: true
        why: '"Flexibles Homeoffice-Modell (2 Tage/Woche)"'
      - q: "Die Bewerbungsunterlagen müssen per Post geschickt werden."
        answer: false
        why: 'The ad says "per E-Mail an bewerbung@techstart-berlin.de" — not by post.'
      - q: "Die Stelle erfordert Kenntnisse in Grafikdesign."
        answer: false
        why: 'Grafikdesign is not mentioned in the ad. Only Office-Programme (Word, Excel, PowerPoint) are listed.'

  - id: A2
    block: A
    type: single-choice
    title: 'Lesen Teil 1 — Stellenanzeige: Leseverstehen'
    instructions: 'Choose the correct answer (a, b, or c) based on Text 1 (Stellenanzeige).'
    items:
      - q: "Welche Sprachkenntnisse werden für die Stelle mindestens verlangt?"
        options:
          - { key: a, text: "Englisch B1 und Deutsch B1." }
          - { key: b, text: "Deutsch mindestens B2 und gute Englischkenntnisse." }
          - { key: c, text: "Nur sehr gute Deutschkenntnisse, kein Englisch nötig." }
        answer: b
        why: '"Sehr gute Deutschkenntnisse (mindestens B2), gute Englischkenntnisse"'
      - q: "Was muss man mit der Bewerbung einschicken?"
        options:
          - { key: a, text: "Nur einen Lebenslauf." }
          - { key: b, text: "Anschreiben, Lebenslauf und Zeugnisse." }
          - { key: c, text: "Ein Motivationsschreiben und Fotos." }
        answer: b
        why: '"vollständigen Unterlagen (Anschreiben + Lebenslauf + Zeugnisse)"'
      - q: "Bis wann muss die Bewerbung eingereicht werden?"
        options:
          - { key: a, text: "Bis zum 20. Juni 2026." }
          - { key: b, text: "Bis zum 30. Juli 2026." }
          - { key: c, text: "Bis zum 30. Juni 2026." }
        answer: c
        why: '"bis zum 30. Juni 2026"'

  - id: A3
    block: A
    type: true-false
    title: 'Lesen Teil 2 — Zeitungsartikel (Text 2): Richtig / Falsch'
    instructions: 'Read Text 2 (Zeitungsartikel, lesson.md §5) and decide: Richtig (R) oder Falsch (F)?'
    items:
      - q: "Im Jahr 2025 haben mehr als 200.000 Menschen weltweit ein Deutschzertifikat abgelegt."
        answer: true
        why: '"über 200.000 Menschen weltweit ein Deutschzertifikat abgelegt — ein neuer Rekord."'
      - q: "Das B2-Zertifikat ist das am häufigsten abgelegte Niveau."
        answer: false
        why: '"Das B1-Zertifikat ist dabei das am häufigsten abgelegte Niveau."'
      - q: "Ein Goethe B1-Test kostet überall auf der Welt gleich viel."
        answer: false
        why: '"kostet je nach Land zwischen 100 und 250 Euro" — the price varies by country.'
      - q: "Das Goethe-Institut plant, die Bearbeitungszeit ab 2027 auf zwei Wochen zu verkürzen."
        answer: true
        why: '"Das Goethe-Institut hat versprochen, die Bearbeitungszeit ab 2027 auf zwei Wochen zu verkürzen."'
      - q: "Derzeit dauert die Ergebnisbekanntgabe vier bis sechs Wochen."
        answer: true
        why: '"Derzeit dauert es vier bis sechs Wochen, bis Kandidatinnen und Kandidaten ihr offizielles Zeugnis erhalten."'

  - id: A4
    block: A
    type: single-choice
    title: 'Lesen Teil 2 — Zeitungsartikel: Leseverstehen'
    instructions: 'Choose the correct answer (a, b, or c) based on Text 2 (Zeitungsartikel).'
    items:
      - q: "Was sagt Dr. Hilde Bauer über das B1-Zertifikat?"
        options:
          - { key: a, text: "Es ist zu schwer für die meisten Lernenden." }
          - { key: b, text: 'Es ist "der Schlüssel zur gesellschaftlichen Teilhabe."' }
          - { key: c, text: "Es ist nur für Studierende geeignet." }
        answer: b
        why: '"Es ist der Schlüssel zur gesellschaftlichen Teilhabe." — Zitat von Dr. Hilde Bauer.'
      - q: "Warum bereiten sich viele Lernende mit Online-Kursen vor?"
        options:
          - { key: a, text: "Weil Online-Kurse qualitativ besser sind." }
          - { key: b, text: "Weil Online-Kurse günstiger sind als Präsenzkurse." }
          - { key: c, text: "Weil es keine Präsenzkurse mehr gibt." }
        answer: b
        why: '"weil diese günstiger sind als Präsenzkurse."'
      - q: "Was kritisieren Sprachschulen laut dem Artikel?"
        options:
          - { key: a, text: "Die Prüfungen sind zu schwer." }
          - { key: b, text: "Die Kursgebühren sind zu hoch." }
          - { key: c, text: "Die Ergebnisbekanntgabe dauert zu lange." }
        answer: c
        why: '"Mehrere Sprachschulen fordern deshalb schnellere digitale Verfahren."'

  - id: A5
    block: A
    type: true-false
    title: 'Lesen Teil 3 — Persönliche E-Mail (Text 3): Richtig / Falsch'
    instructions: 'Read Text 3 (Persönliche E-Mail, lesson.md §5) and decide: Richtig (R) oder Falsch (F)?'
    items:
      - q: "Anna hat diese E-Mail an Bruno geschrieben."
        answer: false
        why: 'The email is from Anna to Mia (mia.becker@gmail.com), not to Bruno.'
      - q: "Pavel fand den Hörteil schwierig, weil die Sprecher sehr schnell gesprochen haben."
        answer: true
        why: '"der Hörteil für ihn der schwierigste Teil war, weil die Sprecher sehr schnell gesprochen haben."'
      - q: "Pavel fand den Leseteil insgesamt sehr schwierig."
        answer: false
        why: '"Den Leseteil fand er dagegen gut machbar" — machbar means manageable, not very difficult.'
      - q: "Tomáš schlägt vor, dass alle zusammen feiern gehen."
        answer: true
        why: '"Tomáš schlägt vor, dass wir alle zusammen feiern gehen."'
      - q: "Anna schreibt, dass Pavels Erfolg Zufall war."
        answer: false
        why: 'Anna writes that it is "ein gutes Beispiel dafür, dass regelmäßiges Üben und Vorbereitung den Unterschied machen" — the opposite of chance.'

  - id: A6
    block: A
    type: single-choice
    title: 'Lesen Teil 3 — Persönliche E-Mail: Leseverstehen'
    instructions: 'Choose the correct answer (a, b, or c) based on Text 3 (E-Mail).'
    items:
      - q: "Wie klingt Pavel laut Anna bei dem Telefongespräch?"
        options:
          - { key: a, text: "Sehr nervös und unsicher." }
          - { key: b, text: "Erleichtert." }
          - { key: c, text: "Traurig, weil er nicht bestanden hat." }
        answer: b
        why: '"er klang wirklich erleichtert!"'
      - q: "Was hat Pavel beim Schreiben nicht tun müssen?"
        options:
          - { key: a, text: "Eine Gliederung machen." }
          - { key: b, text: "Über den Aufbau nachdenken." }
          - { key: c, text: "Den Betreff schreiben." }
        answer: b
        why: '"Er hatte schon eine klare Struktur im Kopf und musste keine Zeit damit verschwenden, über den Aufbau nachzudenken."'
      - q: "Warum war ein Text im Leseteil schwierig?"
        options:
          - { key: a, text: "Er war zu lang." }
          - { key: b, text: "Er war sehr fachsprachlich." }
          - { key: c, text: "Die Fragen waren unklar." }
        answer: b
        why: '"obwohl ein Text über Stadtplanung sehr fachsprachlich war."'

  - id: A7
    block: A
    type: gap-text
    title: 'Lesen — Wortschatz erschließen (Zeitungsartikel)'
    instructions: 'Find the correct word from the article (Text 2) for each definition. 5 items.'
    layout: list
    text: |
      1. Das Ergebnis einer Prüfung = das {1}
      2. Der höchste je erreichte Wert = der {2}
      3. Ein offizielles Dokument über eine bestandene Prüfung = das {3}
      4. Die Möglichkeit, an der Gesellschaft teilzunehmen = die gesellschaftliche {4}
      5. Ein Kurs, der im Kursraum stattfindet (Gegenteil von Online-Kurs) = der {5}
    answers:
      '1': Ergebnis
      '2': Rekord
      '3': Zeugnis
      '4': Teilhabe
      '5': Präsenzkurs

  - id: A8
    block: A
    type: matching
    title: 'Lesen — Drei Texte und ihre Textsorte'
    instructions: 'Match each text (1–3) to its text type (a–d). One text type is not needed.'
    left:
      - { key: '1', text: 'Text 1 (lesson.md §5, erster Text)' }
      - { key: '2', text: 'Text 2 (lesson.md §5, zweiter Text)' }
      - { key: '3', text: 'Text 3 (lesson.md §5, dritter Text)' }
    right:
      - { key: a, text: 'Zeitungsartikel / Pressebericht' }
      - { key: b, text: 'Persönliche E-Mail' }
      - { key: c, text: 'Stellenanzeige / Jobanzeige' }
      - { key: d, text: 'Formelle Beschwerde' }
    answers:
      '1': c
      '2': a
      '3': b

  # ── Block B — Sprachbausteine (Grammar Review per Topic) ─────────────────

  - id: B1
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/01 Präteritum'
    instructions: 'Fill in the Präteritum form of each verb in brackets. 6 items.'
    text: |
      1. Als Pavel ein Kind {1}, {2} er oft in den Park. (sein / gehen)
      2. Die Lehrerin {3} die Aufgaben an die Tafel. (schreiben)
      3. Wir {4} lange auf die Ergebnisse. (warten)
      4. Tomáš {5} früh auf und {6} um 7 Uhr los. (aufstehen / fahren)
    answers:
      '1': war
      '2': ging
      '3': schrieb
      '4': warteten
      '5': stand
      '6': fuhr

  - id: B2
    block: B
    type: single-choice
    title: 'Sprachbausteine — B1/02 obwohl / trotzdem'
    instructions: 'Choose the correct connector (a, b, or c) for each gap. 4 items.'
    items:
      - q: "Pavel war nervös, ______ er sich gut vorbereitet hatte."
        options:
          - { key: a, text: "trotzdem" }
          - { key: b, text: "obwohl" }
          - { key: c, text: "deshalb" }
        answer: b
        why: "'obwohl' (although) introduces a subordinate clause — verb goes to the end."
      - q: "Er hatte wenig geschlafen. ______ war er konzentriert."
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Weil" }
          - { key: c, text: "Trotzdem" }
        answer: c
        why: "'Trotzdem' (nevertheless) is an adverb — triggers subject-verb inversion."
      - q: "______ die Aufgabe schwer war, löste Bruno sie richtig."
        options:
          - { key: a, text: "Trotzdem" }
          - { key: b, text: "Obwohl" }
          - { key: c, text: "Darum" }
        answer: b
        why: "'Obwohl' starts a subordinate clause (verb at end)."
      - q: "Anna hatte Lampenfieber. ______ sprach sie sehr fließend."
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Trotzdem" }
          - { key: c, text: "Weil" }
        answer: b
        why: "'Trotzdem' (nevertheless) connects two main clauses as an adverb."

  - id: B3
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/03 Konjunktiv II'
    instructions: 'Fill in the Konjunktiv II form (würde/hätte/wäre). 6 items.'
    text: |
      1. Wenn ich mehr Zeit {1}, {2} ich jeden Tag Vokabeln lernen. (haben / lernen)
      2. Wenn Pavel nicht so nervös {3}, {4} er noch besser sprechen. (sein / können)
      3. Anna {5} gerne nach Wien fahren, wenn sie Urlaub {6}. (fahren/wünschen — würde-Form / haben)
    answers:
      '1': hätte
      '2': würde
      '3': wäre
      '4': könnte
      '5': würde
      '6': hätte

  - id: B4
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/04 Passiv'
    instructions: 'Rewrite each active sentence in Passiv Präsens or Präteritum as indicated. 5 items.'
    text: |
      1. Man spielt den Hörtext zweimal ab. (Passiv Präsens) → Der Hörtext {1} zweimal {2}. (abspielen)
      2. Die Lehrerin korrigierte die Aufgaben. (Passiv Präteritum) → Die Aufgaben {3} von der Lehrerin {4}. (korrigieren)
      3. Man gibt die Ergebnisse nach vier Wochen bekannt. (Passiv Präsens) → Die Ergebnisse {5} nach vier Wochen {6}. (bekanntgeben)
    answers:
      '1': wird
      '2': abgespielt
      '3': wurden
      '4': korrigiert
      '5': werden
      '6': bekanntgegeben

  - id: B5
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/05 Relativsätze'
    instructions: 'Fill in the correct relative pronoun (der/die/das/dem/den/dessen/deren). 5 items.'
    text: |
      1. Der Prüfer, {1} Pavel sehr sympathisch fand, sprach langsam und deutlich.
      2. Das Zertifikat, {2} Pavel heute bekommen hat, ist international anerkannt.
      3. Die Kandidaten, {3} die Prüfung bestanden haben, bekommen ein Zeugnis.
      4. Das ist die Technik, mit {4} Bruno die Prüfung bestanden hat.
      5. Der Sprachkurs, {5} Gebühr 180 Euro beträgt, beginnt nächste Woche.
    answers:
      '1': den
      '2': das
      '3': die
      '4': der
      '5': dessen

  - id: B6
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/06 um … zu / damit'
    instructions: 'Fill in "um", "zu", or "damit" in each gap. 7 items.'
    text: |
      1. Pavel lernt Deutsch, {1} in Deutschland arbeiten {2} können.
      2. Der Lehrer spricht langsamer, {3} alle Lernenden ihn verstehen.
      3. Anna macht eine Gliederung, {4} keine Zeit {5} verschwenden.
      4. Der Prüfer wiederholt die Aufgabe, {6} Pavel sie besser versteht.
      5. Tomáš lernt Deutsch, {7} Geschäftsgespräche auf Deutsch führen zu können.
    answers:
      '1': um
      '2': zu
      '3': damit
      '4': um
      '5': zu
      '6': damit
      '7': um

  - id: B7
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/07 Genitiv'
    instructions: 'Fill in the correct Genitiv form (article or preposition). 6 items.'
    text: |
      1. Die Ergebnisse {1} Prüfung kommen nach vier Wochen. (die Prüfung — f.)
      2. Wegen {2} hohen Kosten bereiten sich viele online vor. (die Kosten — Pl.)
      3. Trotz {3} Nervosität bestand Pavel die Prüfung. (die Nervosität — f.)
      4. Das Niveau {4} Zertifikats ist international anerkannt. (das Zertifikat — n.)
      5. Während {5} Prüfung darf man nicht sprechen. (die Prüfung — f.)
      6. Die Bearbeitungszeit {6} Tests beträgt vier bis sechs Wochen. (der Test — m.)
    answers:
      '1': der
      '2': der
      '3': der
      '4': des
      '5': der
      '6': des

  - id: B8
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/08 Pronominaladverbien'
    instructions: 'Fill in the correct Pronominaladverb (da(r)- + Präposition) or question form (wo(r)- + Präposition). 5 items.'
    text: |
      1. Ich freue mich sehr {1} meine bestandene Prüfung. (auf → da- + auf)
      2. Pavel denkt oft {2} die Zeit zurück, als er anfing, Deutsch zu lernen. (an → da- + an)
      3. {3} sprechen Anna und Mia gerade? — Über die Prüfungsergebnisse. (worüber)
      4. Das Zeugnis? Ich warte schon lange {4}. (darauf)
      5. {5} ist Pavel zufrieden? — Mit dem Ergebnis. (womit)
    answers:
      '1': darauf
      '2': daran
      '3': Worüber
      '4': darauf
      '5': Womit

  - id: B9
    block: B
    type: gap-text
    layout: list
    title: 'Sprachbausteine — B1/09 Indirekte Fragen'
    instructions: 'Rewrite each direct question as an indirect question. Fill in the missing word(s). 5 items.'
    text: |
      1. Wann fängt die Prüfung an? → Können Sie mir sagen, {1} die Prüfung {2}?
      2. Wo ist der Prüfungssaal? → Ich würde gerne wissen, {3} der Prüfungssaal {4}.
      3. Hat Pavel bestanden? → Ich möchte wissen, {5} Pavel bestanden {6}.
      4. Wie lange dauert die Prüfung? → Könnten Sie mir erklären, wie lange die Prüfung {7}?
      5. Was muss man mitbringen? → Dürfte ich fragen, {8} man mitbringen {9}?
    answers:
      '1': wann
      '2': anfängt
      '3': wo
      '4': ist
      '5': ob
      '6': hat
      '7': dauert
      '8': was
      '9': muss

  - id: B10
    block: B
    type: single-choice
    title: 'Sprachbausteine — B1/10 Zweiteilige Konnektoren'
    instructions: 'Choose the correct pair of connectors (a, b, or c). 5 items.'
    items:
      - q: "Das Zertifikat ist ______ nützlich für die Arbeit ______ für das Studium."
        options:
          - { key: a, text: "entweder … oder" }
          - { key: b, text: "sowohl … als auch" }
          - { key: c, text: "weder … noch" }
        answer: b
        why: "'sowohl … als auch' (both … and) expresses that both options are true simultaneously."
      - q: "Ich habe ______ Zeit zum Lernen ______ Geld für einen Kurs. (negative both)"
        options:
          - { key: a, text: "nicht nur … sondern auch" }
          - { key: b, text: "sowohl … als auch" }
          - { key: c, text: "weder … noch" }
        answer: c
        why: "'weder … noch' (neither … nor) negates both elements."
      - q: "Die Prüfung war ______ schwer, ______ ich habe gut abgeschnitten. (concession)"
        options:
          - { key: a, text: "zwar … aber" }
          - { key: b, text: "entweder … oder" }
          - { key: c, text: "sowohl … als auch" }
        answer: a
        why: "'zwar … aber' (admittedly … but) expresses concession."
      - q: "Man kann das Zertifikat ______ persönlich ablegen ______ online machen."
        options:
          - { key: a, text: "weder … noch" }
          - { key: b, text: "entweder … oder" }
          - { key: c, text: "sowohl … als auch" }
        answer: b
        why: "'entweder … oder' (either … or) presents two alternatives."
      - q: "Das war ______ anstrengend ______ sehr lehrreich."
        options:
          - { key: a, text: "nicht nur … sondern auch" }
          - { key: b, text: "weder … noch" }
          - { key: c, text: "entweder … oder" }
        answer: a
        why: "'nicht nur … sondern auch' (not only … but also) adds emphasis to the second element."

