  - id: D2
    block: D
    type: odd-one-out
    title: 'Wortschatz-Check: Das passt nicht! (B1-Wiederholung)'
    instructions: 'Circle the word that does not belong in each group. 6 groups.'
    groups:
      - items:
          - 'das Zertifikat'
          - 'die Prüfung'
          - 'das Ergebnis'
          - 'die Miete'
        odd: 3
        why: '"die Miete" (rent) is a housing term, not an exam/language learning term.'
      - items:
          - 'Sehr geehrte Damen und Herren,'
          - 'Mit freundlichen Grüßen'
          - 'Ich schreibe Ihnen bezüglich …'
          - 'Hey, wie geht es dir?'
        odd: 3
        why: '"Hey, wie geht es dir?" is informal — all others are formal email phrases.'
      - items:
          - 'obwohl'
          - 'trotzdem'
          - 'weil'
          - 'zwar … aber'
        odd: 2
        why: '"weil" (because) expresses cause; the others (obwohl, trotzdem, zwar…aber) all express concession or contrast.'
      - items:
          - 'darauf'
          - 'daran'
          - 'womit'
          - 'darüber'
        odd: 2
        why: '"womit" is an interrogative Pronominaladverb (wo-form); the others are da-forms used in statements.'
      - items:
          - 'das Lernen'
          - 'die Bewerbung'
          - 'die Bekanntgabe'
          - 'das Passiv'
        odd: 3
        why: '"das Passiv" is a grammar term; the others are nominalizations derived from verbs.'
      - items:
          - 'sowohl … als auch'
          - 'entweder … oder'
          - 'nicht nur … sondern auch'
          - 'wegen … trotz'
        odd: 3
        why: '"wegen … trotz" is not a pair of correlative connectors; the others are genuine zweiteilige Konnektoren.'

