  - id: B8
    block: B
    type: odd-one-out
    title: "Wortschatz: Was passt nicht?"
    instructions: "Cross out the word that does not fit and explain why."
    groups:
      - items: [Kindheit, Jugend, Alter, Studium]
        odd: 2
        why: "Alter is a neutral noun for age; the others are all life stages/phases."
      - items: [Beruf, Arbeit, Stelle, Ferien]
        odd: 3
        why: "Ferien is holidays; the others are all work-related."
      - items: [Miete, Lohn, Gehalt, Verdienst]
        odd: 0
        why: "Miete is rent (cost); the others are all forms of income."
