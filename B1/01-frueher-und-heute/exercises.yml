  - id: A6
    block: A
    type: free-write
    track: vergangenheit
    title: "Mini-Story: 5 Sätze im Präteritum"
    prompt: "Write a short 5-sentence story about something that happened to you in the past. Use Präteritum throughout."
    stimulus: |
      Example: Als ich 18 war, wohnte ich noch in meiner Heimatstadt. Ich ging jeden Tag zur Schule. Nach dem Abschluss arbeitete ich ein Jahr in einem Café. Dann zog ich nach Berlin. Heute bin ich sehr glücklich hier.

      Now write your own 5-sentence story. Use at least 3 of: war, hatte, ging, machte, kam, wurde, wusste, konnte, musste.
    model: |
      (sample) Als ich 16 war, lebte ich noch bei meinen Eltern. Ich ging auf
      ein Gymnasium und hatte viele Freunde. Nach dem Schulabschluss
      wusste ich nicht, was ich studieren sollte. Dann machte ich ein
