  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    track: vergangenheit
    title: "Dialog ergänzen: Erinnerungen an das Studium"
    instructions: "Fill in the 10 blanks with the correct verb form (Präteritum or Präsens as context requires)."
    text: |
      — Weißt du noch, wie das {1} (sein) damals im Studium?
      — Ja, wir {2} (haben) kaum Geld und {3} (müssen) jeden Tag
        in der Mensa essen.
      — Ich {4} (wohnen) in einer WG mit drei anderen Leuten.
      — Und wir {5} (können) uns nie ein Auto {6} (leisten).
      — Stimmt. Aber wir {7} (sein) trotzdem glücklich.
      — Damals {8} (wissen) wir nicht, wie gut wir es {9} (haben).
      — Heute {10} (verstehen) ich das.
    bank: [war, hatten, mussten, wohnte, konnten, leisten, waren, wussten, hatten, verstehe]
    answers:
