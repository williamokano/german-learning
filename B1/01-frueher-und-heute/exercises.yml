    text: |
      1. Ich {1} in einer kleinen Wohnung in Neukölln. (wohnen)
      2. Wir {2} damals in Lissabon. (leben)
      3. Anna {3} als Kind in Jaroslawl. (leben)
      4. Bruno {4} jeden Tag mit dem Bus zur Arbeit. (fahren — ⚠️ a → ä in present, but in Präteritum no change)
      5. Lukas und Mia {5} in einer Wohnung in Kreuzberg. (wohnen)
      6. Ihr {6} im letzten Jahr in Barcelona. (leben)
      7. Du {7} 2018 nach Berlin. (kommen)
      8. Sie {8} 500 Euro Miete pro Monat. (zahlen)
    answers:
