        odd: 0
        why: "Miete is rent (cost); the others are all forms of income."
      - items: [wohnen, leben, arbeiten, sich erinnern]
        odd: 3
        why: "sich erinnern takes a reflexive prepositional object (an + Akk); the others don't take an object."
      - items: [zuerst, dann, danach, immer]
        odd: 3
        why: "immer means 'always'; the others are all time connectors for sequencing past events."
      - items: [war, hatte, ging, schön]
        odd: 3
        why: "schön is an adjective; the others are all Präteritum forms of verbs."
      - items: [vergangen, früher, damals, heutzutage]
        odd: 0
        why: "vergangen is an adjective form; the others are all time adverbs."

