lesson: B1/01
title: "B1 · Lektion 1 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informal)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia und Lukas geben eine Dinnerparty."
        answer: true
        why: 'Mia sagt: „Schön, dass ihr da seid!" — sie sind die Gastgeber.'
      - q: "Anna bestellt Wein."
        answer: true
        why: 'Anna sagt: „für mich bitte Wein, wenn du hast".'
      - q: "Mia ist 2014 nach Berlin gekommen."
        answer: true
        why: 'Mia: „Als ich 2014 hierherkam".'
      - q: "Lukas fährt heute noch mit dem Auto zur Arbeit."
        answer: false
        why: 'Lukas: „Heute fahre ich fast überall mit dem Fahrrad".'
      - q: "Bruno sagt, er habe heute noch ein eigenes Büro."
        answer: false
        why: 'Bruno: „Heute arbeite ich komplett remote".'

  - id: H2
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formal)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Wo war Bruno von 2018 bis 2023?"
        options:
          - { key: a, text: "Bei der Firma Schmidt AG." }
          - { key: b, text: "Bei der Firma Yilmaz." }
          - { key: c, text: "An der Universität." }
        answer: a
        why: 'Frau Yilmaz: „Sie waren von 2018 bis 2023 bei der Firma Schmidt AG, richtig?" — und Bruno bestätigt.'
      - q: "Was hat sich laut Bruno in der Branche verändert?"
        options:
          - { key: a, text: "Weniger Kundenbesuche vor Ort." }
          - { key: b, text: "Mehr Kundenbesuche vor Ort." }
          - { key: c, text: "KI ist verschwunden." }
        answer: a
        why: 'Bruno: „Heute machen wir fast alles remote" — also weniger vor-Ort-Besuche.'
      - q: "Welche Fähigkeit war früher wichtig, ist es heute weniger?"
        options:
          - { key: a, text: "Kommunikation mit dem Kunden." }
          - { key: b, text: "Schnelle Lösung technischer Probleme." }
          - { key: c, text: "KI-Kenntnisse." }
        answer: b
        why: 'Bruno: „Früher war es wichtig, dass man technische Probleme schnell lösen konnte."'
      - q: "Was ist heute laut Bruno in der Branche wichtig?"
        options:
          - { key: a, text: "Schnell tippen." }
          - { key: b, text: "Remote arbeiten können." }
          - { key: c, text: "Dem Kunden erklären können, was man macht." }
        answer: c
        why: 'Bruno: „Heute ist die Kommunikation mit dem Kunden viel wichtiger. Man muss auch erklären können, was man macht".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Hallo Lukas, ich bin's, Mutti. Ich wollte dir kurz erzählen, wie es bei uns im
      Dorf aussieht. Du weißt ja, dass unser Hof am Dorfrand liegt. {1} hatten
      wir viele Nachbarn, aber in den letzten zehn Jahren sind viele Familien
      weggezogen. {2} gab es hier noch zwei kleine Läden und eine Schule. Heute
      ist alles geschlossen. Die Kinder müssen jetzt mit dem Bus in die nächste Stadt
      fahren. Wir {3} die alten Zeiten.

      Aber es hat sich auch Positives verändert. {4} sie vor zwei Jahren das
      schnelle Internet bekommen hatten, konnten die jüngeren Leute endlich von
      zu Hause aus arbeiten. {5} das Internet kam, {6} viele gezwungen, in
      die Stadt zu ziehen. Jetzt bleiben sie hier. Das ist schön.
    bank: [Früher, Damals, vermissen, Nachdem, Bevor, waren, Heute, Später, wollte]
    answers:
      "1": Früher
      "2": Damals
      "3": vermissen
      "4": Nachdem
      "5": Bevor
      "6": waren

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Lukas' Erinnerungen"
    audio: transcript_ansage1.mp3
    instructions: "Listen to Lukas's voice message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Hallo Mia, hier ist Lukas. Ich bin gerade auf dem Weg nach Hause und habe im Auto mein altes Fotoalbum gefunden. Erinnerst du dich noch an unseren ersten Abend bei dir, als wir uns kennengelernt haben? Das war 2019, im Mai. Ich hatte damals gerade meine alte Stelle in Moabit aufgegeben und du hast mir zum ersten Mal von Barcelona erzählt. Ich glaube, das war der Moment, in dem ich wusste: Diese Frau ist etwas Besonderes. Bis gleich, Schatz. Ich freue mich auf dich.'
    items:
      - q: "Wann haben Mia und Lukas sich kennengelernt?"
        options:
          - { key: a, text: "Im Mai 2019." }
          - { key: b, text: "Im Mai 2018." }
          - { key: c, text: "Im Mai 2020." }
        answer: a
        why: '„Das war 2019, im Mai".'
      - q: "Was hat Lukas gerade gefunden?"
        options:
          - { key: a, text: "Sein altes Handy." }
          - { key: b, text: "Sein altes Fotoalbum." }
          - { key: c, text: "Seinen alten Wohnungsschlüssel." }
        answer: b
        why: '„Ich habe im Auto mein altes Fotoalbum gefunden".'
      - q: "Was hatte Lukas kurz vor dem Kennenlernen gemacht?"
        options:
          - { key: a, text: "Er war nach Barcelona gezogen." }
          - { key: b, text: "Er hatte geheiratet." }
          - { key: c, text: "Er hatte seine Stelle in Moabit aufgegeben." }
        answer: c
        why: '„Ich hatte damals gerade meine alte Stelle in Moabit aufgegeben".'
      - q: "Was hat Lukas bei ihrem ersten Treffen sofort gewusst?"
        options:
          - { key: a, text: "Dass Mia etwas Besonderes ist." }
          - { key: b, text: "Dass Mia in Barcelona bleiben würde." }
          - { key: c, text: "Dass Mia nach Berlin zurückkommen würde." }
        answer: a
        why: '„Das war der Moment, in dem ich wusste: Diese Frau ist etwas Besonderes".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

