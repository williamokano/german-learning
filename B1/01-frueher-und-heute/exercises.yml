  - id: B2
    block: B
    type: free-write
    track: vergangenheit
    title: "Finde den Fehler"
    prompt: 'Not every sentence has a mistake. Find the sentences that are wrong and rewrite them correctly. If a sentence is already correct, write "richtig".'
    stimulus: |
      1. Ich war gestern in Berlin gewesen.
      2. Wir haben dort eine schöne Wohnung gehabt.
      3. Er hatte kein Geld, weil er arbeitslos war.
      4. Sie ist 2018 nach Barcelona gegangen.
      5. Ich bin in Berlin geboren, weil meine Familie dort lebte.
      6. Wir konnten am Wochenende nicht kommen, weil wir arbeiten mussten.
      7. Bevor ich den Job gefundet hatte, war ich Student.
      8. Nachdem sie angekommen war, hat sie mich angerufen.
    model: |
      Nicht jeder Satz hat einen Fehler — nur 1 und 7 sind grammatisch falsch.
      1. Falsch → „Ich war gestern in Berlin." (Plusquamperfekt „war … gewesen" ist hier überflüssig; das Präteritum „war" reicht.)
      2. Besser im Präteritum → „Wir hatten dort eine schöne Wohnung." (Das Perfekt „haben … gehabt" ist nicht falsch, klingt in einer Erzählung aber unnatürlich.)
      3. Richtig.
      4. Richtig.
      5. Richtig.
      6. Richtig.
      7. Falsch → „Bevor ich den Job gefunden hatte, war ich Student." (Partizip II: „gefundet" → „gefunden".)
      8. Richtig. (Plusquamperfekt im nachdem-Satz + Perfekt im Hauptsatz ist korrekt; rein erzählend wäre „… rief sie mich an".)

