lesson: B1/11
title: "B1 · Lektion 11 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: H+A on day 1, B on day 2, C on day 3, D on day 4.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Bruno arbeitet zurzeit als IT-Consultant in Berlin."
        answer: true
        why: 'Bruno: "Also… ich bin IT-Consultant und … arbeite seit 2024 hier in Berlin."'
      - q: "Pavel hat sich nie für einen Job beworben."
        answer: false
        why: 'Pavel says: "Das dachte ich auch, als ich mich für meinen Barista-Job beworben habe."'
      - q: 'Mia empfiehlt Bruno, seine Ausbildung als „Bachelor of Science" zu nennen.'
        answer: true
        why: 'Mia: sag „Bachelor of Science in Informatik" — klingt professioneller.'
      - q: "Bruno nennt als Schwäche, dass er zu schnell arbeitet."
        answer: false
        why: "Bruno says he spends too much time perfecting things — too slow, not too fast."
      - q: "Für die Gehaltsvorstellung empfiehlt Mia den Konjunktiv II."
        answer: true
        why: 'Mia: "Meiner Vorstellung nach läge das Gehalt … — Konjunktiv II klingt höflich und professionell."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Wofür bewirbt sich Anna?"
        options:
          - { key: a, text: "Für eine Stelle als Projektkoordinatorin." }
          - { key: b, text: "Für eine Stelle als Marketing-Managerin." }
          - { key: c, text: "Für eine Stelle als IT-Consultant." }
        answer: a
        why: "Scene description of Dialog B states Anna applies for a Projektkoordinatorin role; the position is also confirmed by Annas Anschreiben (Lesetext §7: 'Bewerbung als Projektkoordinatorin')."
      - q: "Was war Annas letzte Stelle?"
        options:
          - { key: a, text: "Projektkoordinatorin." }
          - { key: b, text: "Junior Marketing-Managerin." }
          - { key: c, text: "Abteilungsleiterin." }
        answer: b
        why: 'Anna: "Zuletzt war ich als Junior Marketing-Managerin tätig."'
      - q: "Welche Gehaltsvorstellung nennt Anna?"
        options:
          - { key: a, text: "45.000 bis 50.000 Euro brutto." }
          - { key: b, text: "60.000 bis 65.000 Euro brutto." }
          - { key: c, text: "52.000 bis 58.000 Euro brutto." }
        answer: c
        why: 'Anna: "Meiner Vorstellung nach läge das Gehalt bei etwa 52.000 bis 58.000 Euro brutto jährlich."'
      - q: "Welche Frage stellt Anna am Ende des Gesprächs?"
        options:
          - { key: a, text: "Wie ist die Einarbeitung bei Ihnen strukturiert?" }
          - { key: b, text: "Wie hoch ist das Gehalt genau?" }
          - { key: c, text: "Kann ich sofort anfangen?" }
        answer: a
        why: 'Anna: "wie die Einarbeitung neuer Projektkoordinatorinnen bei Ihnen strukturiert ist."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Bruno prepares his CV) and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Bruno sitzt am Schreibtisch und bereitet seinen {1} vor. Er hat seinen
      Bachelor-Abschluss in Informatik an der Universidade Federal de Santa Catarina
      gemacht. Danach hat er zwei Jahre als Junior-{2} bei einer IT-Firma in
      Blumenau gearbeitet. Seit 2024 ist er als IT-Consultant in Berlin {3}.
      Unter Kenntnisse trägt er ein: Python, JavaScript und Englisch auf {4}-Niveau.
      Als Interesse nennt er {5} und Open-Source-Projekte. Er ist ziemlich {6}
      auf seinen Lebenslauf.
    bank: [Lebenslauf, Entwickler, tätig, C1, Fotografie, stolz, Anschreiben, Barista, B2]
    answers:
      "1": Lebenslauf
      "2": Entwickler
      "3": tätig
      "4": C1
      "5": Fotografie
      "6": stolz

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anruf von Frau Weber bei einer Agentur"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the voicemail left by Frau Weber. Then choose the correct answer (a, b, or c)."
    transcript: "Guten Tag, hier ist Sabine Weber von TechVentures GmbH. Ich rufe an, weil wir gerade eine Stelle als Projektkoordinatorin ausgeschrieben haben. Wir suchen eine Person, die Erfahrung in der Teamkoordination mitbringt. Die Stelle ist ab dem 1. Oktober zu besetzen. Die Bewerbungsfrist endet am 30. Juni. Bitte ruf mich zurück, wenn Sie Kandidatinnen empfehlen können. Sie erreichen mich unter 030 456 78 90. Vielen Dank!"
    items:
      - q: "Welche Stelle wird gesucht?"
        options:
          - { key: a, text: "Eine Projektkoordinatorin." }
          - { key: b, text: "Eine IT-Consultant-Stelle." }
          - { key: c, text: "Eine Abteilungsleiterin." }
        answer: a
        why: '"wir gerade eine Stelle als Projektkoordinatorin ausgeschrieben haben."'
      - q: "Ab wann ist die Stelle zu besetzen?"
        options:
          - { key: a, text: "Ab dem 1. August." }
          - { key: b, text: "Ab dem 1. Oktober." }
          - { key: c, text: "Ab dem 1. November." }
        answer: b
        why: '"Die Stelle ist ab dem 1. Oktober zu besetzen."'
      - q: "Wann endet die Bewerbungsfrist?"
        options:
          - { key: a, text: "Am 30. Juli." }
          - { key: b, text: "Am 15. Juni." }
          - { key: c, text: "Am 30. Juni." }
        answer: c
        why: '"Die Bewerbungsfrist endet am 30. Juni."'
      - q: "Warum ruft Frau Weber an?"
        options:
          - { key: a, text: "Um Kandidatinnen-Empfehlungen zu erbitten." }
          - { key: b, text: "Um eine Bewerberin einzuladen." }
          - { key: c, text: "Um eine Absage zu erteilen." }
        answer: a
        why: '"Bitte ruf mich zurück, wenn Sie Kandidatinnen empfehlen können."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    layout: list
    title: "Anschreiben-Phrasen: Lückentext"
    instructions: "Complete each formal phrase from the cover letter with the missing word. 8 items."
    text: |
      1. {1} bewerbe ich mich um die Stelle als Projektkoordinatorin.
      2. Ihr Stellenangebot hat mich sehr {2}, weil Ihr Unternehmen innovativ ist.
      3. Ich {3} über drei Jahre Berufserfahrung im Projektmanagement.
      4. Während meiner {4} als Junior Marketing-Managerin koordinierte ich drei Projekte.
      5. Die Qualität meiner Arbeit {5} sich in den positiven Kundenbewertungen wider.
      6. Ich würde mich sehr {6}, Sie in einem persönlichen Gespräch zu überzeugen.
      7. Ich bitte Sie um eine Einladung zum {7}.
      8. Mit freundlichen {8},
    answers:
      "1": Hiermit
      "2": angesprochen
      "3": verfüge
      "4": Tätigkeit
      "5": spiegelt
      "6": freuen
      "7": Vorstellungsgespräch
      "8": Grüßen

  - id: A2
    block: A
    type: gap-text
    layout: list
    title: "Passiv im Stellenangebot (B1/04 — Wiederholung)"
    instructions: "Rewrite each active sentence in the Passiv Präsens. 6 items."
    text: |
      1. Das Unternehmen sucht eine Projektkoordinatorin.
         → Eine Projektkoordinatorin {1}.
      2. Das Team koordiniert alle Projekte.
         → Alle Projekte {2}.
      3. Die Firma bietet flexible Arbeitszeiten an.
         → Flexible Arbeitszeiten {3}.
      4. Die Abteilung setzt moderne Technologien ein.
         → Moderne Technologien {4}.
      5. Das HR-Team prüft alle Bewerbungen sorgfältig.
         → Alle Bewerbungen {5}.
      6. Das Unternehmen erwartet Erfahrung in der Teamleitung.
         → Erfahrung in der Teamleitung {6}.
    answers:
      "1": wird gesucht
      "2": werden koordiniert
      "3": werden angeboten
      "4": werden eingesetzt
      "5": werden sorgfältig geprüft
      "6": wird erwartet

  - id: A3
    block: A
    type: gap-text
    layout: list
    title: "Relativsätze im Stellenangebot (B1/05 — Wiederholung)"
    instructions: "Fill in the correct Relativpronomen (der/die/das/den/dem/denen + Präposition if needed). 8 items."
    text: |
      1. Wir suchen eine Person, {1} motiviert und teamfähig ist.
      2. Das ist ein Job, {2} gut bezahlt ist.
      3. Wir bieten eine Stelle, {3} viele Entwicklungsmöglichkeiten bietet.
      4. Wir suchen jemanden, {4} wir sofort einarbeiten können.
      5. Das Unternehmen, {5} ich mich bewerbe, ist sehr bekannt.
      6. Die Projekte, {6} ich gearbeitet habe, waren sehr komplex.
      7. Die Kolleginnen, {7} ich zusammenarbeite, sind sehr nett.
      8. Das Team, {8} Arbeit ich schätze, ist sehr professionell.
    answers:
      "1": die
      "2": der
      "3": die
      "4": den
      "5": bei dem
      "6": an denen
      "7": mit denen
      "8": dessen

  - id: A4
    block: A
    type: gap-text
    layout: list
    title: "Konjunktiv II im Vorstellungsgespräch (B1/03 — Wiederholung)"
    instructions: "Rewrite each blunt statement as a polite Konjunktiv II phrase. 6 items."
    text: |
      1. Ich will 60.000 Euro.
         → Meiner Vorstellung nach {1} das Gehalt bei 60.000 Euro.
      2. Ich fange am 1. Oktober an.
         → Ich {2} frühestens am 1. Oktober anfangen.
      3. Ich brauche flexible Arbeitszeiten.
         → Es {3} mir wichtig, flexible Arbeitszeiten zu haben.
      4. Ich will mehr Verantwortung.
         → Ich {4} gerne mehr Verantwortung übernehmen.
      5. Wann treffen wir uns noch mal?
         → {5} Sie nächste Woche noch einen Termin haben?
      6. Das ist zu wenig Geld.
         → Das {6} für mich etwas wenig.
    answers:
      "1": läge
      "2": könnte
      "3": wäre
      "4": würde
      "5": Würden
      "6": wäre

  - id: A5
    block: A
    type: gap-text
    layout: list
    title: "Genitiv im Anschreiben (B1/07 — Wiederholung)"
    instructions: "Fill in the correct Genitiv form (article + noun OR Genitivpräposition phrase). 8 items."
    text: |
      1. Der Schlüssel _____ Erfolgs liegt in der Kommunikation.
         → Der Schlüssel {1} Erfolgs liegt in der Kommunikation.
      2. Die Qualität _____ Arbeit war sehr hoch.
         → Die Qualität {2} Arbeit war sehr hoch.
      3. Während _____ Tätigkeit habe ich viel gelernt.
         → Während {3} Tätigkeit habe ich viel gelernt.
      4. Trotz _____ kurzen Einarbeitungszeit war ich schnell produktiv.
         → Trotz {4} kurzen Einarbeitungszeit war ich schnell produktiv.
      5. Aufgrund _____ Kenntnisse in Python bin ich gut geeignet.
         → Aufgrund {5} Kenntnisse in Python bin ich gut geeignet.
      6. Die Stärke _____ Bewerbung liegt in der internationalen Erfahrung.
         → Die Stärke {6} Bewerbung liegt in der internationalen Erfahrung.
      7. Wegen _____ Kündigungsfrist kann ich erst im Oktober beginnen.
         → Wegen {7} Kündigungsfrist kann ich erst im Oktober beginnen.
      8. Die Meinung _____ Teams ist sehr wichtig.
         → Die Meinung {8} Teams ist sehr wichtig.
    answers:
      "1": des
      "2": meiner
      "3": meiner
      "4": der
      "5": meiner
      "6": meiner
      "7": meiner
      "8": des

  - id: A6
    block: A
    type: gap-text
    layout: list
    title: "`um … zu` im Anschreiben (B1/06 — Wiederholung)"
    instructions: "Complete each cover-letter sentence with `um … zu + Infinitiv`. 6 items."
    text: |
      1. Ich bewerbe mich, um meine Erfahrungen {1}. (einsetzen)
      2. Ich habe Projektmanagement studiert, um Teams besser {2}. (koordinieren)
      3. Ich schreibe Ihnen, um mich für die Stelle {3}. (bewerben)
      4. Ich möchte die Gelegenheit nutzen, um mich beruflich {4}. (weiterentwickeln)
      5. Ich sende Ihnen meine Unterlagen, um mein Profil {5}. (vorstellen)
      6. Ich bitte Sie um ein Gespräch, um mehr über die Stelle {6}. (erfahren)
    answers:
      "1": einzusetzen
      "2": koordinieren zu können
      "3": zu bewerben
      "4": weiterzuentwickeln
      "5": vorzustellen
      "6": zu erfahren

  - id: A7
    block: A
    type: categorize
    title: "Lebenslauf-Abschnitte zuordnen"
    instructions: "Sort each item into the correct CV section."
    buckets:
      - { key: pd, label: "Persönliche Daten" }
      - { key: be, label: "Berufserfahrung" }
      - { key: au, label: "Ausbildung" }
      - { key: kf, label: "Kenntnisse & Fähigkeiten" }
    tokens:
      - { text: "Geburtsdatum: 3. März 1998", bucket: pd }
      - { text: "Junior Marketing-Managerin bei StartUpX, 2023–2025", bucket: be }
      - { text: "Bachelor of Science in Informatik, TU Berlin, 2020", bucket: au }
      - { text: "Python (Fortgeschritten)", bucket: kf }
      - { text: "Adresse: Musterstraße 12, Berlin", bucket: pd }
      - { text: "IT-Consultant bei ConsultCo, seit 2024", bucket: be }
      - { text: "Englisch: C1", bucket: kf }
      - { text: "Masterstudium Betriebswirtschaft, HU Berlin, 2022", bucket: au }
      - { text: "Telefon: 0176 123 456", bucket: pd }
      - { text: "Führerschein Klasse B", bucket: kf }

  - id: A8
    block: A
    type: matching
    title: "Vorstellungsgespräch-Fragen und Antworten verbinden"
    instructions: "Match each interview question (1–6) with the correct answer (a–g). One answer is not needed."
    left:
      - { key: "1", text: "Erzählen Sie uns etwas über sich." }
      - { key: "2", text: "Was sind Ihre Stärken?" }
      - { key: "3", text: "Was sind Ihre Schwächen?" }
      - { key: "4", text: "Warum möchten Sie bei uns arbeiten?" }
      - { key: "5", text: "Welche Gehaltsvorstellungen haben Sie?" }
      - { key: "6", text: "Wann könnten Sie anfangen?" }
    right:
      - { key: a, text: "Meiner Vorstellung nach läge das Gehalt bei 55.000 Euro brutto jährlich." }
      - { key: b, text: "Ihr Stellenangebot hat mich angesprochen, weil Ihr Unternehmen innovativ ist." }
      - { key: c, text: "Ich tendiere dazu, sehr detailorientiert zu sein. Ich arbeite daran." }
      - { key: d, text: "Ich könnte frühestens zum 1. Oktober einsteigen." }
      - { key: e, text: "Mein Name ist Anna Kowalski. Ich verfüge über drei Jahre Erfahrung." }
      - { key: f, text: "Meine größte Stärke ist die Fähigkeit, Teams zu koordinieren." }
      - { key: g, text: "Ich kündige sofort, wenn das Gehalt nicht stimmt." }
    answers:
      "1": e
      "2": f
      "3": c
      "4": b
      "5": a
      "6": d

  - id: A9
    block: A
    type: true-false
    title: "Formell oder informell? — Register erkennen"
    instructions: "Is each phrase suitable for a formal cover letter or job interview? Answer F (formell/geeignet) oder I (informell/nicht geeignet)."
    items:
      - q: "Hiermit bewerbe ich mich um die ausgeschriebene Stelle."
        answer: true
        why: "Correct formal opening phrase for an Anschreiben."
      - q: "Hey, ich find den Job voll cool und will unbedingt dabei sein!"
        answer: false
        why: "Too informal — completely unsuitable for a cover letter or interview."
      - q: "Ich verfüge über drei Jahre Berufserfahrung im Projektmanagement."
        answer: true
        why: "Correct formal phrasing: verfügen über is standard in formal applications."
      - q: "Meiner Vorstellung nach läge das Gehalt bei 55.000 Euro brutto."
        answer: true
        why: "Correct — Konjunktiv II makes the salary request sound polished and professional."
      - q: "Ich will mindestens 60.000 Euro, sonst mache ich das nicht."
        answer: false
        why: "Way too blunt. Use Konjunktiv II: Meiner Vorstellung nach läge das Gehalt bei …"
      - q: "Mit freundlichen Grüßen"
        answer: true
        why: "Correct standard closing for a formal letter."

  - id: A10
    block: A
    type: single-choice
    title: "Stellenanzeige lesen: Wähle die richtige Antwort"
    instructions: "Read the job posting text below and choose the correct answer (a, b, or c). 5 items."
    text: |
      **Stellenanzeige — TechVentures GmbH, Berlin**

      Wir suchen eine Projektkoordinatorin / einen Projektkoordinator (m/w/d),
      die/der Erfahrung in der Teamleitung mitbringt. Von den Bewerberinnen und
      Bewerbern werden mindestens zwei Jahre Berufserfahrung erwartet. Englisch-
      kenntnisse auf B2-Niveau werden vorausgesetzt. Die Stelle wird ab dem
      1. Oktober besetzt. Überstunden werden nach Vereinbarung bezahlt.
      Bewerbungen werden bis zum 30. Juni entgegengenommen.
    items:
      - q: "Welche Erfahrung wird erwartet?"
        options:
          - { key: a, text: "Mindestens zwei Jahre." }
          - { key: b, text: "Mindestens fünf Jahre." }
          - { key: c, text: "Keine Erfahrung nötig." }
        answer: a
        why: '"Von den Bewerberinnen und Bewerbern werden mindestens zwei Jahre Berufserfahrung erwartet."'
      - q: "Welches Englischniveau wird vorausgesetzt?"
        options:
          - { key: a, text: "C1." }
          - { key: b, text: "B2." }
          - { key: c, text: "A2." }
        answer: b
        why: '"Englischkenntnisse auf B2-Niveau werden vorausgesetzt."'
      - q: "Ab wann ist die Stelle zu besetzen?"
        options:
          - { key: a, text: "Ab sofort." }
          - { key: b, text: "Ab dem 1. Januar." }
          - { key: c, text: "Ab dem 1. Oktober." }
        answer: c
        why: '"Die Stelle wird ab dem 1. Oktober besetzt."'
      - q: 'Welche Funktion hat das Verb „werden" in den Sätzen der Anzeige, die „werden" enthalten?'
        options:
          - { key: a, text: "Es ist das Passiv-Hilfsverb." }
          - { key: b, text: "Es ist ein Futur I." }
          - { key: c, text: "Es ist das Modalverb wollen." }
        answer: a
        why: "In job ads, werden + Partizip II = Passiv (e.g. werden erwartet, werden vorausgesetzt)."
      - q: "Bis wann muss man sich bewerben?"
        options:
          - { key: a, text: "Bis zum 15. Juli." }
          - { key: b, text: "Bis zum 30. Juni." }
          - { key: c, text: "Bis zum 1. Oktober." }
        answer: b
        why: '"Bewerbungen werden bis zum 30. Juni entgegengenommen."'

  - id: A11
    block: A
    type: gap-text
    layout: list
    title: "Arbeitswelt-Wortschatz: Definitionen ergänzen"
    instructions: "Complete each definition with the correct word from the list. 6 items. (der Lebenslauf, die Kündigung, die Überstunden, die Einarbeitung, die Gehaltserhöhung, das Stellenangebot)"
    text: |
      1. Ein Dokument, das die Ausbildung und Berufserfahrung einer Person zeigt, heißt {1}.
      2. Wenn ein Arbeitnehmer oder eine Arbeitgeberin das Arbeitsverhältnis beendet, spricht man von einer {2}.
      3. Wenn man mehr arbeitet als vertraglich vereinbart, macht man {3}.
      4. Ein Text, der eine freie Stelle und die Anforderungen beschreibt, ist ein {4}.
      5. Wenn ein neuer Mitarbeiter im Unternehmen eingeführt wird, nennt man das die {5}.
      6. Wenn man nach einer Verhandlung mehr Geld bekommt, hat man eine {6} bekommen.
    answers:
      "1": der Lebenslauf
      "2": Kündigung
      "3": Überstunden
      "4": Stellenangebot
      "5": Einarbeitung
      "6": Gehaltserhöhung

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    layout: list
    title: "Dialog B ergänzen: Vorstellungsgespräch"
    instructions: "Fill in the 8 blanks in this job interview extract with the correct word or phrase."
    text: |
      Frau Weber: Guten Morgen, Frau Kowalski. Erzählen Sie uns etwas über {1}.
      Anna: Sehr gerne. Ich {2} über drei Jahre Berufserfahrung im Projektmanagement.
      Frau Weber: Was {3} Sie als Ihre größte Stärke bezeichnen?
      Anna: Meine größte Stärke ist die {4}, komplexe Projekte zu strukturieren.
      Frau Weber: Warum {5} Sie sich bei uns?
      Anna: Ihr Stellenangebot hat mich sehr {6}, weil TechVentures für innovative Projekte bekannt ist.
      Frau Weber: Welche {7} haben Sie?
      Anna: Meiner Vorstellung nach {8} das Gehalt bei etwa 55.000 Euro brutto jährlich.
    answers:
      "1": sich
      "2": verfüge
      "3": würden
      "4": Fähigkeit
      "5": bewerben
      "6": angesprochen
      "7": Gehaltsvorstellungen
      "8": läge

  - id: B2
    block: B
    type: single-choice
    title: "Finde den Fehler — Anschreiben und Interview"
    instructions: "Each sentence contains one error. Choose the correct version (a, b, or c)."
    items:
      - q: 'Fehler: „Hiermit bewerbe mich ich um die Stelle als Koordinatorin."'
        options:
          - { key: a, text: "Hiermit bewerbe ich mich um die Stelle als Koordinatorin." }
          - { key: b, text: "Hiermit ich bewerbe mich um die Stelle als Koordinatorin." }
          - { key: c, text: "Hiermit bewerbe mich ich um die Stelle." }
        answer: a
        why: "Correct word order: Hiermit (position 1) → bewerbe (verb, position 2) → ich (subject)."
      - q: 'Fehler: „Ich verfüge über drei Jahre Erfahrungen im Projektmanagement."'
        options:
          - { key: a, text: "Ich verfüge über drei Jahre Erfahrungen im Projektmanagement." }
          - { key: b, text: "Ich verfüge über drei Jahre Erfahrung im Projektmanagement." }
          - { key: c, text: "Ich verfüge drei Jahre Erfahrung über im Projektmanagement." }
        answer: b
        why: "die Erfahrung used with a number of years stays singular: drei Jahre Erfahrung (not Erfahrungen)."
      - q: 'Fehler: „Während meine Tätigkeit habe ich viel gelernt."'
        options:
          - { key: a, text: "Während meine Tätigkeit habe ich viel gelernt." }
          - { key: b, text: "Während meiner Tätigkeit habe ich viel gelernt." }
          - { key: c, text: "Während meinen Tätigkeit habe ich viel gelernt." }
        answer: b
        why: "während takes Genitiv: während meiner Tätigkeit (not meine/meinen)."
      - q: 'Fehler: „Mit freundliche Grüßen,"'
