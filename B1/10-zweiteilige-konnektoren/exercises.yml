          - { key: b, text: "Addition with emphasis: both matter, but the second is highlighted." }
          - { key: c, text: "Concession: admitting a problem before contrasting." }
        answer: b
        why: "`nicht nur … sondern auch` is additive + emphatic — both knowledge and critical thinking are included, with emphasis on the second."
