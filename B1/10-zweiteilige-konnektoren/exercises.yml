  - id: A6
    block: A
    type: single-choice
    title: "Welcher Konnektor passt? — Typ bestimmen"
    instructions: "Choose the correct two-part connector (a, b, or c) for each gap."
    items:
      - q: "Er hat ______ Zeit ______ Geld für dieses Projekt."
        options:
          - { key: a, text: "sowohl … als auch" }
          - { key: b, text: "weder … noch" }
          - { key: c, text: "nicht nur … sondern auch" }
        answer: b
        why: "Negative meaning (neither … nor) requires `weder … noch`."
      - q: "Das Konzept ist ______ innovativ, ______ es braucht noch mehr Arbeit."
        options:
          - { key: a, text: "zwar … aber" }
          - { key: b, text: "entweder … oder" }
          - { key: c, text: "weder … noch" }
        answer: a
        why: "Concession (admittedly … but) = `zwar … aber`."
      - q: "______ Hannah ______ Yusuf hat das Problem bemerkt."
        options:
          - { key: a, text: "Entweder … oder" }
          - { key: b, text: "Sowohl … als auch" }
          - { key: c, text: "Weder … noch" }
        answer: b
        why: "Both people noticed it — additive = `sowohl … als auch`."
      - q: "______ komme ich morgen, ______ ich schicke dir die Unterlagen per E-Mail."
        options:
          - { key: a, text: "Sowohl … als auch" }
          - { key: b, text: "Nicht nur … sondern auch" }
          - { key: c, text: "Entweder … oder" }
        answer: c
        why: "Exclusive choice between two options = `entweder … oder`."
      - q: "Diese Strategie fördert ______ die Qualität, ______ die Effizienz."
        options:
          - { key: a, text: "weder … noch" }
          - { key: b, text: "nicht nur … sondern auch" }
          - { key: c, text: "entweder … oder" }
        answer: b
        why: "Adding emphasis: promotes not only quality but also efficiency = `nicht nur … sondern auch`."
      - q: "Der Entwurf ist ______ vollständig, ______ er zeigt eine gute Grundidee."
        options:
          - { key: a, text: "sowohl … als auch" }
          - { key: b, text: "entweder … oder" }
          - { key: c, text: "zwar … aber" }
        answer: c
        why: "Concession: admittedly not complete, but shows a good idea = `zwar … aber`."

