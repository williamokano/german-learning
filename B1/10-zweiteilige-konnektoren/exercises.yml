  - id: A8
    block: A
    type: true-false
    title: "Grammatik-Check: Konnektoren richtig gebildet?"
    instructions: "Is the connector used correctly? Richtig (R) oder Falsch (F)? If F, explain the error."
    items:
      - q: "Er hat weder nicht Zeit noch Geld."
        answer: false
        why: "`weder … noch` is already negative. Remove `nicht`: Er hat weder Zeit noch Geld."
      - q: "Sowohl Anna wie auch Bruno kommen aus dem Ausland."
        answer: false
        why: "The fixed form is `als auch`, not `wie auch`. Correct: Sowohl Anna als auch Bruno …"
      - q: "Das Angebot ist zwar günstig, aber die Qualität fehlt."
        answer: true
        why: "Correct: `zwar` mid-sentence (no inversion needed), `aber` introduces the contrast."
      - q: "Nicht nur spricht er Deutsch, sondern er lernt auch Arabisch."
        answer: true
        why: "Correct: `nicht nur` sentence-initial triggers inversion (spricht er), `sondern … auch` in the second clause."
      - q: "Entweder wir bleiben hier, oder wir ziehen um."
        answer: false
        why: "`Entweder` is sentence-initial, so inversion is required. Correct: Entweder bleiben wir hier, oder wir ziehen um."
      - q: "Er hat sowohl die Vorteile als auch aber die Nachteile gesehen."
        answer: false
        why: '`aber` does not belong here. `sowohl … als auch` is the complete connector. Remove `aber`.'

