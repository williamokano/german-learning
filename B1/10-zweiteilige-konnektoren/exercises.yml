          - { key: c, text: "Concessive: admitting a shortcoming before highlighting a strength." }
        answer: c
        why: "`zwar … aber` is concessive — Steinmeyer grants it is not complete, then pivots to the positive."
      - q: '„Entweder wir streben nach Breite und verlieren an Tiefe, oder wir wählen Tiefe und gewinnen echtes Verständnis."'
        options:
