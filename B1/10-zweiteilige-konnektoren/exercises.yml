  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia sagt, Berlin hat sie sowohl fasziniert als auch erschöpft."
        answer: true
        why: 'Mia: "Berlin hat mich sowohl fasziniert als auch erschöpft — gleichzeitig."'
      - q: "Lukas schlägt vor, sowohl in Berlin zu bleiben als auch umzuziehen."
        answer: false
        why: "Lukas presents it as an either/or choice: either stay and accept the rents, or move."
      - q: "Yusuf sagt, er spricht nicht nur als Berliner, sondern auch als jemand, der in Kairo gelebt hat."
        answer: true
        why: 'Yusuf: "Ich sage das nicht nur als Berliner, sondern auch als jemand, der mal in Kairo gelebt hat."'
      - q: "Mia ist bereit, ihr Netzwerk aufzugeben, wenn die Mieten weiter steigen."
        answer: false
        why: 'Mia: "Ich bin weder bereit, mein Netzwerk aufzugeben, noch will ich von vorne anfangen."'
      - q: "Yusuf empfiehlt, sowohl rationale als auch emotionale Argumente aufzuschreiben."
        answer: true
        why: 'Yusuf + Lukas: "Wir sollten sowohl die rationalen als auch die emotionalen Argumente aufschreiben."'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was ist Hannahs Hauptziel für den neuen Lehrplan?"
        options:
          - { key: a, text: "Mehr Unterrichtsstunden zu bekommen." }
          - { key: b, text: "Nicht nur Fachwissen, sondern auch kritisches Denken zu fördern." }
          - { key: c, text: "Nur Primärquellen im Unterricht zu verwenden." }
        answer: b
        why: 'Hannah: "Mein Lehrplan zielt nicht nur auf die Vermittlung von Fachwissen ab, sondern auch auf die Entwicklung kritischen Denkens."'
      - q: "In welchen Fächern arbeitet Hannah mit Primärquellen?"
        options:
          - { key: a, text: "Nur im Deutschunterricht." }
          - { key: b, text: "Nur im Geschichtsunterricht." }
          - { key: c, text: "Sowohl im Deutsch- als auch im Geschichtsunterricht." }
        answer: c
        why: 'Hannah: "Sowohl im Deutschunterricht als auch im Geschichtsunterricht arbeite ich mit Primärquellen."'
      - q: "Wie sieht Hannah das Verhältnis von Breite und Tiefe im Unterricht?"
        options:
          - { key: a, text: "Sie bevorzugt Breite, weil es mehr Stoff abdeckt." }
          - { key: b, text: "Entweder man strebt nach Breite und verliert Tiefe, oder man wählt Tiefe und gewinnt Verständnis." }
          - { key: c, text: "Sie findet, dass weder Breite noch Tiefe wichtig ist." }
        answer: b
        why: 'Hannah: "Entweder wir streben nach Breite und verlieren an Tiefe, oder wir wählen Tiefe und gewinnen echtes Verständnis."'
      - q: "Was sagt Herr Steinmeyer am Ende über Hannahs Entwurf?"
        options:
          - { key: a, text: "Der Entwurf ist vollständig und kann sofort umgesetzt werden." }
          - { key: b, text: "Der Entwurf ist zwar noch nicht vollständig, aber er zeigt eine überzeugende Grundlogik." }
          - { key: c, text: "Er lehnt den Entwurf wegen zu wenig empirischer Belege ab." }
        answer: b
        why: 'Herr Steinmeyer: "Der Entwurf ist zwar noch nicht vollständig, aber er zeigt eine überzeugende Grundlogik."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Yusuf auf einer Akademikerkonferenz"
    audio: hoertext.mp3
    instructions: "Listen to Yusuf's short conference presentation and fill in the 7 missing words. Three words in the box are not needed."
    text: |
      Guten Tag, ich bin Dr. Yusuf El-Sayed von der FU Berlin. In meinem heutigen
      Kurzvortrag möchte ich zwei Thesen zur Stadtentwicklung vorstellen. These eins:
      Großstädte bieten nicht nur wirtschaftliche Chancen, {1} auch soziale
      Ungleichheit. These zwei: Weder staatliche Investitionen {2} private
      Initiativen allein können dieses Problem lösen — wir brauchen {3}
      politischen Willen als auch gesellschaftliches Engagement. Zwar gibt es in
      Berlin bereits interessante Modellprojekte, aber {4} die Finanzierung {5}
      die politische Koordination ist gesichert. Mein Vorschlag: {6} wir entwickeln
      eine gemeinsame Strategie bis Ende des Jahres, oder wir verlieren das Zeitfenster
      für echte {7}. Vielen Dank.
    bank: [sondern, noch, noch, sowohl, weder, Entweder, Veränderung, als, aber, jedoch]
    answers:
      "1": sondern
      "2": noch
      "3": sowohl
      "4": weder
      "5": noch
      "6": Entweder
      "7": Veränderung

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Ansage bei einer Podiumsdiskussion"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the event announcement. Then choose the correct answer (a, b, or c)."
    transcript: "Achtung, eine Durchsage. Wir laden herzlich zur morgigen Podiumsdiskussion ein: Großstadt oder Kleinstadt — wo lebt man besser? Die Veranstaltung beginnt nicht um 18 Uhr, sondern um 19 Uhr. Es werden sowohl Wissenschaftler als auch Bürgerinnen und Bürger auf dem Podium sein. Weder eine Anmeldung noch ein Eintrittsgeld ist nötig — der Eintritt ist frei. Entweder Sie kommen persönlich, oder Sie verfolgen die Diskussion per Livestream. Weitere Informationen finden Sie auf unserer Webseite. Wir freuen uns auf Sie."
    items:
      - q: "Um wie viel Uhr beginnt die Podiumsdiskussion?"
        options:
          - { key: a, text: "Um 18 Uhr." }
          - { key: b, text: "Um 19 Uhr." }
          - { key: c, text: "Um 20 Uhr." }
        answer: b
        why: '"Die Veranstaltung beginnt nicht um 18 Uhr, sondern um 19 Uhr."'
      - q: "Wer nimmt an der Diskussion teil?"
        options:
          - { key: a, text: "Nur Wissenschaftler." }
          - { key: b, text: "Nur Bürgerinnen und Bürger." }
          - { key: c, text: "Sowohl Wissenschaftler als auch Bürgerinnen und Bürger." }
        answer: c
        why: '"Es werden sowohl Wissenschaftler als auch Bürgerinnen und Bürger auf dem Podium sein."'
      - q: "Was braucht man, um teilzunehmen?"
        options:
          - { key: a, text: "Eine Anmeldung und ein Eintrittsgeld." }
          - { key: b, text: "Nur eine Anmeldung." }
          - { key: c, text: "Weder eine Anmeldung noch ein Eintrittsgeld." }
        answer: c
        why: '"Weder eine Anmeldung noch ein Eintrittsgeld ist nötig."'
      - q: "Wie kann man die Veranstaltung verfolgen?"
        options:
          - { key: a, text: "Nur persönlich vor Ort." }
          - { key: b, text: "Entweder persönlich oder per Livestream." }
          - { key: c, text: "Nur per Livestream, weil die Plätze begrenzt sind." }
        answer: b
        why: '"Entweder Sie kommen persönlich, oder Sie verfolgen die Diskussion per Livestream."'

