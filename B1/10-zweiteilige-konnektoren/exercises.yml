  - id: A11
    block: A
    type: gap-text
    layout: list
    title: "Satzanfang mit Inversion — `weder`, `entweder`, `nicht nur`, `zwar`"
    instructions: "Rewrite each sentence so it starts with the given connector. Apply inversion correctly. 6 items."
    text: |
      1. Er hat nicht angerufen. Er hat auch nicht geschrieben.
         → {1} hat er angerufen, noch hat er geschrieben.
      2. Wir bleiben hier, oder wir ziehen um.
         → {2} bleiben wir hier, oder wir ziehen um.
      3. Das Konzept ist gut, aber die Umsetzung fehlt.
         → {3} ist das Konzept gut, aber die Umsetzung fehlt.
      4. Er spricht Deutsch. Er spricht auch Arabisch.
         → {4} spricht er Deutsch, sondern er spricht auch Arabisch.
      5. Die Finanzierung ist nicht gesichert. Die Koordination ist auch nicht gesichert.
         → {5} ist die Finanzierung gesichert, noch ist die Koordination gesichert.
      6. Das Angebot ist billig, aber die Qualität ist schlecht.
         → {6} ist das Angebot billig, aber die Qualität ist schlecht.
    answers:
      "1": Weder
      "2": Entweder
      "3": Zwar
      "4": Nicht nur
      "5": Weder
      "6": Zwar

