  - id: A9
    block: A
    type: true-false
    title: "Grammatik-Check: Richtig oder falsch?"
    instructions: "Is the German sentence grammatically correct? Answer R (richtig) or F (falsch). If F, identify the error."
    items:
      - q: "Er bleibt in Berlin, obwohl er Prag liebt."
        answer: true
        why: "Correct: obwohl + verb-final (liebt)."
      - q: "Obwohl er müde ist, kommt trotzdem er."
        answer: false
        why: "Error: after the obwohl-clause (inversion trigger), the verb must come before the subject. Correct: Obwohl er müde ist, kommt er trotzdem."
      - q: "Deshalb er kommt nicht."
        answer: false
        why: "Error: deshalb in position 1 requires V2 inversion. Correct: Deshalb kommt er nicht."
      - q: "Das Startup ist zwar jung, aber es hat schon viele Kunden."
        answer: true
        why: "Correct: zwar after verb, aber starts second clause."
      - q: "Trotzdem bleibt er in Prag."
        answer: true
        why: "Correct: trotzdem in position 1, verb (bleibt) in position 2."

