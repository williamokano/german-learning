  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler — Wortstellung"
    prompt: "Five of these six sentences contain exactly one word-order error; one sentence is already correct. Find and correct each error, and identify the sentence that is already correct. 6 items."
    stimulus: |
      1. Obwohl er kennt Berlin gut, bleibt er in Prag.
      2. Er ist müde. Trotzdem er geht ins Büro.
      3. Die Kosten sind hoch. Deshalb er investiert nicht mehr.
      4. Das Startup ist zwar jung aber, es ist schon erfolgreich.
      5. Obwohl der Markt besetzt ist, trotzdem expandiert er.
      6. Die Nachfrage ist groß. Darum wächst das Startup sehr schnell.
    model: |
      1. Obwohl er Berlin gut kennt, bleibt er in Prag. (verb to end in obwohl-clause: kennt)
      2. Er ist müde. Trotzdem geht er ins Büro. (trotzdem pos. 1 → V2 inversion)
      3. Die Kosten sind hoch. Deshalb investiert er nicht mehr. (deshalb pos. 1 → V2)
      4. Das Startup ist zwar jung, aber es ist schon erfolgreich. (comma before aber)
      5. Obwohl der Markt besetzt ist, expandiert er. (trotzdem is redundant after obwohl-clause)
      6. Die Nachfrage ist groß. Darum wächst das Startup sehr schnell. (correct — no error)

  - id: B3
    block: B
    type: single-choice
    title: "Richtigen Konnektor wählen"
    instructions: "Choose the correct connector (a, b, or c) for each gap."
    items:
      - q: "Er bleibt in Prag, ______ er Berlin liebt."
        options:
          - { key: a, text: "trotzdem" }
          - { key: b, text: "obwohl" }
          - { key: c, text: "deshalb" }
        answer: b
        why: "obwohl introduces a subordinate clause (verb-final). trotzdem would need a new main clause."
      - q: "Das Startup ist jung. ______ hat es schon viele Kunden."
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Weil" }
          - { key: c, text: "Trotzdem" }
        answer: c
        why: "trotzdem (adverb) connects two main clauses expressing contrast. obwohl would need a Nebensatz."
      - q: "Pavel liebt Berlin. ______ ist er geblieben."
        options:
          - { key: a, text: "Deshalb" }
          - { key: b, text: "Obwohl" }
          - { key: c, text: "Zwar" }
        answer: a
        why: "deshalb introduces a consequence. The previous sentence gives the reason."
      - q: "Die Kosten sind ______ hoch, ______ die Qualität ist ausgezeichnet."
        options:
          - { key: a, text: "zwar … aber" }
          - { key: b, text: "obwohl … trotzdem" }
          - { key: c, text: "deshalb … weil" }
        answer: a
        why: "zwar ... aber is the two-part concession structure."
      - q: "Er hat keine Genehmigung. ______ gibt er nicht auf."
        options:
          - { key: a, text: "Weil" }
          - { key: b, text: "Dennoch" }
          - { key: c, text: "Obwohl" }
        answer: b
        why: "dennoch (= trotzdem, more formal) contrasts the obstacle with the determined action."
      - q: "Die Nachfrage in Randbezirken ist groß. ______ expandiert das Startup dorthin."
        options:
          - { key: a, text: "Obwohl" }
          - { key: b, text: "Trotzdem" }
          - { key: c, text: "Deswegen" }
        answer: c
