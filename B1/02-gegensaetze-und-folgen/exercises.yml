  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Pavel's phone call) and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Hallo Mama, ich bin's, Pavel. Ich wollte kurz anrufen und erklären, warum ich
      auch dieses Jahr nicht zurückkomme. Ich weiß, Brünn ist meine Heimat, und ich
      vermisse euch sehr. {1} fühle ich mich in Berlin inzwischen sehr wohl.
      {2} die Stadt manchmal hektisch ist, gibt es hier einfach Möglichkeiten, die
      ich in Brünn nicht hätte. Der Kaffeebetrieb, wo ich arbeite, bietet mir wirklich
      etwas Besonderes. {3} habe ich beschlossen, noch mindestens ein Jahr zu
      bleiben. Mama, ich komme {4} nicht zu Weihnachten, aber ich buche dieses Mal
      {5} Ostern. Das {6} ich dir. Bis dann, ich liebe euch!
    bank: [Trotzdem, Obwohl, Deshalb, zwar, definitiv, verspreche, Darum, wünsche, Jedoch]
    answers:
      "1": Trotzdem
      "2": Obwohl
      "3": Deshalb
      "4": zwar
      "5": definitiv
      "6": verspreche

