    instructions: "Complete each sentence with `obwohl`. Put the verb at the end of the obwohl-clause. 8 items."
    text: |
      1. Er geht ins Büro, obwohl er krank {1}. (sein)
      2. Obwohl das Wetter schlecht {2}, fahren wir in den Park. (sein)
      3. Sie kauft das Buch, obwohl es sehr teuer {3}. (sein)
      4. Obwohl Berlin viele Anbieter {4}, expandiert Tomáš dorthin. (haben)
      5. Wir bleiben hier, obwohl wir eigentlich nach Hause {5}. (wollen)
      6. Obwohl die Bürokratie kompliziert {6}, gibt er nicht auf. (sein)
      7. Pavel genießt Berlin, obwohl er seine Familie {7}. (vermissen)
      8. Obwohl Frau Weber noch Fragen {8}, ist sie grundsätzlich überzeugt. (haben)
    answers:
