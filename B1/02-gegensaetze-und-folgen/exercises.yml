      - items: [widersprechen, zustimmen, scheitern, argumentieren]
        odd: 2
        why: "scheitern means to fail; the others are all verbs about communicating arguments."
      - items: [die Nachfrage, das Angebot, der Markt, die Einschränkung]
        odd: 3
        why: "die Einschränkung is a restriction/qualification; the others are all economic/market terms."
      - items: [zwar, aber, dennoch, dafür]
        odd: 2
        why: "dennoch is a standalone adverb (nevertheless); the others often appear in the zwar…aber or dafür constructions as paired elements."

