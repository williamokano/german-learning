  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "`trotzdem` — Inversion (V2)"
    instructions: "Rewrite the second sentence using `trotzdem` in position 1. Watch the word order! 8 items."
    text: |
      1. Es regnet. Ich gehe spazieren. → Es regnet. Trotzdem {1} ich spazieren.
      2. Das Startup ist jung. Es hat viele Kunden. → Das Startup ist jung. Trotzdem {2} es viele Kunden.
      3. Berlin ist teuer. Pavel bleibt dort. → Berlin ist teuer. Trotzdem {3} Pavel dort.
      4. Ich bin müde. Ich gehe ins Büro. → Ich bin müde. Trotzdem {4} ich ins Büro.
      5. Der Markt ist besetzt. Tomáš expandiert. → Der Markt ist besetzt. Trotzdem {5} Tomáš.
      6. Die Bürokratie ist schwierig. Wir machen weiter. → Die Bürokratie ist schwierig. Trotzdem {6} wir weiter.
      7. Sie hat keine Zeit. Sie hilft uns. → Sie hat keine Zeit. Trotzdem {7} sie uns.
      8. Das Risiko ist hoch. Er investiert. → Das Risiko ist hoch. Trotzdem {8} er.
    answers:
      "1": gehe
      "2": hat
      "3": bleibt
      "4": gehe
      "5": expandiert
      "6": machen
      "7": hilft
      "8": investiert

