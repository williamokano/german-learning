# Reviewed from B1/02 lesson.md §4 Wortschatz.
# Note: V2-parser draft sent a footnote ("`widersprechen` takes Dativ: *Ich widerspreche
# dir / Ihnen.*") through the textBlock join → emitted as 2 noise phrase entries. The
# `, -ä-e` plural code gave correct paren-trusted plurals for Gegensatz/Einwand/Markt
# but the parser reused those paren strings as the English gloss (`en: "die
# Gegensätze"`). Three Dativ verbs (`widersprechen`, `zustimmen`, `sich unterscheiden
# von`) were parsed as `pos: phrase` because they carry preposition annotations. Several
# `A → Ä` best-effort umlauts (Anbieter → Änbieter) were wrong (no umlaut). All hand-fixed.
#
# Section headers in lesson.md:
#   Konnektoren und Logik (connectors and logic)        — 2-col noun-english
#   Diskussionsvokabular (discussion vocabulary)        — 2-col verb-english, 3 Dativ-taking
#   Mobilität und Startup                                — 2-col noun-english, 1 m/f pair
lesson: B1/02

entries:
