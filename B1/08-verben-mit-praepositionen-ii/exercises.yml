  - id: B2
    block: B
    type: single-choice
    title: "Person oder Sache? Richtige Form wählen"
    instructions: "Choose the correct form (a, b, or c)."
    items:
      - q: "_____ wartest du? — Auf meinen Bruder."
        options:
          - { key: a, text: "Worauf" }
          - { key: b, text: "Auf wen" }
          - { key: c, text: "Auf was" }
        answer: b
        why: "Person (Bruder) → Auf wen? Not worauf (things only)."
      - q: "_____ wartest du? — Auf den nächsten Zug."
        options:
          - { key: a, text: "Auf wen" }
          - { key: b, text: "Worauf" }
          - { key: c, text: "Was" }
        answer: b
        why: "Thing (Zug) → Worauf? Not auf wen (persons only)."
      - q: "Ich denke an meine Mutter. → Ich denke _____."
        options:
          - { key: a, text: "daran" }
          - { key: b, text: "an sie" }
          - { key: c, text: "daran sie" }
        answer: b
        why: "Person (Mutter) → Präp + Pronomen: an sie. Daran is for things."
      - q: "Ich denke an den Urlaub. → Ich denke _____."
        options:
          - { key: a, text: "an es" }
          - { key: b, text: "an ihn" }
          - { key: c, text: "daran" }
        answer: c
        why: "Thing (Urlaub) → Pronominaladverb: daran."
      - q: "_____ sprichst du mit Frau Weber? (mit wem oder womit?)"
        options:
          - { key: a, text: "Womit" }
          - { key: b, text: "Mit wem" }
          - { key: c, text: "Worüber" }
        answer: b
        why: "Frau Weber is a person → Mit wem? Womit = with what (thing)."
      - q: "_____ beschäftigst du dich? — Mit dem Bericht."
        options:
          - { key: a, text: "Mit wem" }
          - { key: b, text: "Womit" }
          - { key: c, text: "Worum" }
        answer: b
        why: "Thing (Bericht) → Womit? Mit wem = with whom (person)."

  - id: B3
    block: B
    type: gap-text
    layout: list
    title: "Finde den Fehler — Pronominaladverbien"
    instructions: "Each sentence contains exactly one error. Find it and write the corrected sentence. 6 items."
    text: |
      1. Ich denke daran ihm. (Pavel ist eine Person!)
         Korrektur: {1}
      2. Worauf wartest du? — Auf Mia.
         Korrektur: {2}
      3. Ich bin davon überzeugt, Pavel recht hat.
         Korrektur: {3}
      4. Ich freue mich auf das Konzert gestern. (gestern = Vergangenheit!)
         Korrektur: {4}
      5. Womit redest du? — Mit Anna.
         Korrektur: {5}
      6. Es hängt darauf ab, wie viel Zeit wir haben. (abhängen von)
         Korrektur: {6}
    answers:
