    type: gap-text
    layout: list
    title: "Verben mit Präpositionen — richtige Präposition wählen"
    instructions: "Fill in the correct preposition. Choose from: an, auf, für, mit, über, um, von, vor, zu. 10 items."
    text: |
      1. Ich denke oft {1} meinen Urlaub.
      2. Sie wartet schon lange {2} eine Antwort.
      3. Er interessiert sich sehr {3} Fotografie.
      4. Wir sprechen gerade {4} das neue Projekt.
      5. Ich kümmere mich {5} die Reservierung.
      6. Sie träumt {6} einer langen Reise.
      7. Ich fürchte mich {7} Prüfungen.
      8. Er beschäftigt sich den ganzen Tag {8} dem Bericht.
      9. Die Maßnahme trägt {9} einer besseren Kommunikation bei.
      10. Anna bedankt sich herzlich {10} die Einladung.
    answers:
      "1": an
      "2": auf
      "3": für
      "4": über
      "5": um
      "6": von
      "7": vor
      "8": mit
      "9": zu
      "10": für

