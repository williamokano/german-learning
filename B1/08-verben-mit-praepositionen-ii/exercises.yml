  - id: A6
    block: A
    type: true-false
    title: "Person oder Sache? Richtig oder Falsch?"
    instructions: "Is the pronoun/Pronominaladverb used correctly? Answer Richtig (R) oder Falsch (F)."
    items:
      - q: "Ich denke daran, dass Pavel kommt. (Pavel = person → daran)"
        answer: false
        why: "Pavel is a person. For persons use: Ich denke an ihn. 'Daran' is for things/ideas."
      - q: "Ich denke daran, den Film zu sehen. (den Film = thing → daran)"
        answer: true
        why: "Den Film is a thing/idea — daran is correct."
      - q: "Auf wen wartest du? — Auf Pavel. (person → auf wen)"
        answer: true
        why: "Correct: for persons, use Präp + wen/wem, not wo(r)-."
      - q: "Worauf wartest du? — Auf Pavel."
        answer: false
        why: "Pavel is a person, not a thing. Correct: Auf wen wartest du? → Auf Pavel."
      - q: "Sie ärgert sich darüber, dass es regnet. (es regnet = idea → darüber)"
        answer: true
        why: "Correct: dass-clause is an idea/concept — darüber as anticipatory Korrelat."
      - q: "Ich verlasse mich darauf ihn. (ihn = person)"
        answer: false
        why: "For persons: Ich verlasse mich auf ihn. Not 'darauf ihn' — darauf replaces the whole phrase."

  - id: A7
    block: A
    type: gap-text
    layout: list
    title: "Anticipatory `da(r)-` + `dass`-Satz"
    instructions: "Fill in the correct Pronominaladverb before the dass-clause. 8 items."
    text: |
      1. Ich freue mich _____, dass du kommst. (sich freuen über)
         → Ich freue mich {1}, dass du kommst.
      2. Ich ärgere mich _____, dass der Zug Verspätung hat. (sich ärgern über)
         → Ich ärgere mich {2}, dass der Zug Verspätung hat.
      3. Ich bin _____ überzeugt, dass sie recht hat. (überzeugt sein von)
         → Ich bin {3} überzeugt, dass sie recht hat.
      4. Es kommt _____ an, dass man pünktlich ist. (ankommen auf)
         → Es kommt {4} an, dass man pünktlich ist.
      5. Ich warne dich _____, dass das gefährlich ist. (warnen vor)
         → Ich warne dich {5}, dass das gefährlich ist.
      6. Er achtet _____, dass alle informiert sind. (achten auf)
         → Er achtet {6}, dass alle informiert sind.
      7. Ich freue mich _____, dass Pavel den Kurs macht. (sich freuen über)
         → Ich freue mich {7}, dass Pavel den Kurs macht.
      8. Es hängt _____ ab, wie viel Zeit wir haben. (abhängen von)
         → Es hängt {8} ab, wie viel Zeit wir haben.
    answers:
      "1": darüber
      "2": darüber
      "3": davon
      "4": darauf
      "5": davor
      "6": darauf
      "7": darüber
      "8": davon

