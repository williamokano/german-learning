exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Mia interessiert sich normalerweise sehr für Dramen."
        answer: false
        why: 'Mia says: "Ich interessiere mich eigentlich nicht so sehr für Dramen."'
      - q: "Tomáš hat den ganzen Abend an die Hauptfigur des Films gedacht."
        answer: true
        why: 'Tomáš: "Ich habe schon den ganzen Abend daran gedacht."'
      - q: "Pavel hat sich darüber gefreut, dass das Ende des Films offen war."
        answer: false
        why: 'Pavel: "Ich habe mich ehrlich gesagt ein bisschen darüber geärgert, dass das Ende so offen war."'
      - q: "Pavel kümmert sich in der Gruppe oft darum, Filme vorzuschlagen."
        answer: false
        why: 'Pavel says he never takes care of suggesting films: "Ich kümmere mich nie darum."'
      - q: "Mia besteht am Ende darauf, noch Wein zu trinken."
        answer: true
        why: 'Mia: "Ich bestehe darauf!"'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Wofür interessiert sich Anna laut Dialog B?"
        options:
          - { key: a, text: "Für Finanzprojekte und Buchhaltung." }
          - { key: b, text: "Für digitales Projektmanagement und internationale Teamarbeit." }
          - { key: c, text: "Für Marketing und Social Media." }
        answer: b
        why: 'Anna: "Ich interessiere mich sehr für digitales Projektmanagement und für internationale Teamarbeit."'
      - q: "Worauf verlässt sich Anna, wenn sie unter Druck arbeitet?"
        options:
          - { key: a, text: "Auf ihr Netzwerk und ihre Kontakte." }
          - { key: b, text: "Auf klare Strukturen und frühe Prioritätensetzung." }
          - { key: c, text: "Auf ihre Erfahrung in der Buchhaltung." }
        answer: b
        why: 'Anna: "Ich verlasse mich darauf, klare Strukturen zu haben. Ich achte immer darauf, Prioritäten früh zu setzen."'
      - q: "Wovon hängt laut Anna der Erfolg eines Projekts ab?"
        options:
          - { key: a, text: "Von einem großen Budget." }
          - { key: b, text: "Von den technischen Werkzeugen." }
          - { key: c, text: "Davon, wie gut sich die Teammitglieder aufeinander verlassen können." }
        answer: c
        why: 'Anna: "Der Erfolg hängt vor allem davon ab, wie gut sich die Teammitglieder aufeinander verlassen können."'
      - q: "Warum hatte Anna sich früher nicht um die ähnliche Stelle bewerben können?"
        options:
          - { key: a, text: "Weil sie keine Erfahrung hatte." }
          - { key: b, text: "Weil sie sich um einen Umzug kümmern musste." }
          - { key: c, text: "Weil die Stelle bereits besetzt war." }
        answer: b
        why: 'Anna: "ich musste mich damals um einen Umzug kümmern."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Pavel's call to Mia) and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Pavel ruft Mia an, um ihr von einem neuen Kurs zu erzählen. Er beschäftigt
      sich schon seit Wochen {1}, die richtige Ausbildung zu finden. Er freut sich
      sehr {2}, endlich anzufangen. Er interessiert sich besonders {3}, wie man
      Röstprofile entwickelt. Allerdings warnt er Mia {4}, zu erwarten, dass er
      jetzt weniger Zeit für Freunde hat — er achtet {5}, dass Arbeit und Freizeit
      in Balance bleiben. Mia freut sich {6}, dass Pavel so begeistert ist.
    bank: [damit, darauf, dafür, davor, darauf, darüber, dagegen, dabei, daran]
    answers:
      "1": damit
      "2": darauf
      "3": dafür
      "4": davor
      "5": darauf
      "6": darüber

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Voicemail von Tomáš an Pavel"
    audio: transcript_ansage1.mp3
    instructions: "Listen to Tomáš's voicemail to Pavel. Then choose the correct answer (a, b, or c)."
    transcript: "Hey Pavel, hier ist Tomáš. Ich rufe an, weil ich mich darum kümmern möchte, unser nächstes Treffen zu organisieren. Ich freue mich sehr darauf, wieder nach Berlin zu kommen. Ich denke oft daran, was wir beim letzten Filmabend besprochen haben — besonders worüber wir uns gefreut haben. Ich interessiere mich übrigens sehr für den neuen tschechischen Film, der nächsten Monat rauskommt. Ich bin davon überzeugt, dass er uns gefällt. Bitte ruf mich zurück, wenn du Zeit hast. Tschau!"
    items:
      - q: "Warum ruft Tomáš an?"
        options:
          - { key: a, text: "Weil er einen Film empfehlen möchte." }
          - { key: b, text: "Weil er sich um das nächste Treffen kümmern möchte." }
          - { key: c, text: "Weil er eine Frage zu Pavels Kurs hat." }
        answer: b
        why: '"Ich rufe an, weil ich mich darum kümmern möchte, unser nächstes Treffen zu organisieren."'
      - q: "Worüber denkt Tomáš oft nach?"
        options:
          - { key: a, text: "Über seinen nächsten Job." }
          - { key: b, text: "Über das Gespräch beim letzten Filmabend." }
          - { key: c, text: "Über seinen Urlaub in Prag." }
        answer: b
        why: '"Ich denke oft daran, was wir beim letzten Filmabend besprochen haben."'
      - q: "Wofür interessiert sich Tomáš?"
        options:
          - { key: a, text: "Für ein deutsches Theaterstück." }
          - { key: b, text: "Für einen neuen tschechischen Film." }
          - { key: c, text: "Für ein Musikkonzert." }
        answer: b
        why: '"Ich interessiere mich übrigens sehr für den neuen tschechischen Film."'
      - q: "Wovon ist Tomáš überzeugt?"
        options:
          - { key: a, text: "Dass Pavel zu viel arbeitet." }
          - { key: b, text: "Dass der Film ihnen gefallen wird." }
          - { key: c, text: "Dass Mia nicht kommen kann." }
        answer: b
        why: '"Ich bin davon überzeugt, dass er uns gefällt."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
