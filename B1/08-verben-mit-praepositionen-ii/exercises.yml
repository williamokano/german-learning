  - id: D2
    block: D
    type: odd-one-out
    title: "Wortschatz-Check: Das passt nicht!"
    instructions: "Circle the word or phrase that does not belong. 6 groups."
    groups:
      - items: ["denken an", "träumen von", "warten auf", "schlafen"]
        odd: 3
        why: "schlafen is a simple verb with no fixed preposition. The others are all verbs with fixed prepositions."
      - items: ["daran", "darüber", "darauf", "daher"]
        odd: 3
        why: "daher means 'therefore / from there' — it is not a Pronominaladverb replacing a prepositional phrase."
      - items: ["worauf", "womit", "worüber", "warum"]
        odd: 3
        why: "warum means 'why' (reason question) — it is not a wo(r)- Pronominaladverb."
      - items: ["sich freuen auf", "sich freuen über", "sich ärgern über", "sich freuen an"]
        odd: 3
        why: "sich freuen an does not exist in standard German. The correct forms are auf (future) and über (past/present)."
      - items: ["sich kümmern um", "abhängen von", "bestehen auf", "kommen auf"]
        odd: 3
        why: "kommen auf is not a standard fixed-preposition verb in this set. bestehen auf (= insist on) is the correct form."
      - items: ["Ich denke daran.", "Ich warte darauf.", "Ich freue mich darüber.", "Ich denke daran ihn."]
        odd: 3
        why: "Pronominaladverbien replace the whole Präp + Pronomen — you never combine daran + ihn. For persons: Ich denke an ihn."

