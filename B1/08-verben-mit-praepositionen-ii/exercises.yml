    layout: list
    title: "Anticipatory `da(r)-` + `zu`-Infinitiv"
    instructions: "Fill in the correct Pronominaladverb before the zu-Infinitive phrase. 6 items."
    text: |
      1. Ich freue mich _____, dich wiederzusehen. (sich freuen auf)
         → Ich freue mich {1}, dich wiederzusehen.
      2. Ich warne dich _____, das allein zu machen. (warnen vor)
         → Ich warne dich {2}, das allein zu machen.
      3. Er achtet _____, pünktlich zu sein. (achten auf)
         → Er achtet {3}, pünktlich zu sein.
      4. Ich verlasse mich _____, rechtzeitig eine Antwort zu bekommen. (verlassen auf)
         → Ich verlasse mich {4}, rechtzeitig eine Antwort zu bekommen.
      5. Sie freut sich _____, den Film zu sehen. (sich freuen auf)
         → Sie freut sich {5}, den Film zu sehen.
      6. Er träumt _____, sein eigenes Unternehmen zu gründen. (träumen von)
         → Er träumt {6}, sein eigenes Unternehmen zu gründen.
    answers:
      "1": darauf
      "2": davor
      "3": darauf
      "4": darauf
      "5": darauf
      "6": davon

