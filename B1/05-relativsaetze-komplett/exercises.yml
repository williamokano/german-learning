  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext: Mias Traumwohnung"
    audio: hoertext.mp3
    instructions: "Listen to the Hörtext (Mia describes her ideal apartment) and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Ich suche seit Monaten eine Wohnung, in {1} ich wirklich zur Ruhe kommen kann.
      Das Wichtigste, {2} ich mir wünsche, ist ein ruhiges Zimmer, in {3} ich abends
      lesen und arbeiten kann. Ich brauche auch eine Küche, mit {4} ich richtig kochen
