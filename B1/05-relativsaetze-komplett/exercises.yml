lesson: B1/05
title: "B1 · Lektion 5 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Tomáš braucht einen Text für die Startseite seiner Website."
        answer: true
        why: 'Tomáš sagt: "Ich brauche dringend einen guten Text für die Startseite."'
      - q: "Mia schlägt vor, mit einem Superlativ anzufangen."
        answer: false
        why: 'Mia schlägt eine Definition vor: "Fang doch einfach mit einer Definition an."'
      - q: "Pavel schlägt vor zu schreiben, dass man mit der App Scooter finden kann."
        answer: true
        why: '"Das ist eine App, mit der man in Randbezirken E-Scooter finden und mieten kann."'
      - q: "Mia formuliert einen Satz über das Stadtgebiet mit einem Relativsatz im Dativ."
        answer: true
