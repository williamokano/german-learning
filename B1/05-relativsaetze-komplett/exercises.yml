  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Relativpronomen Dativ — NEU"
    instructions: "Fülle die Lücken mit dem richtigen Relativpronomen im Dativ. 8 Sätze."
    text: |
      1. Das ist der Kollege, {1} ich vertraue. (der Kollege — Dat.: dem)
      2. Das ist die Mitarbeiterin, {2} ich danke. (die Mitarbeiterin — Dat.: der)
      3. Das ist das Team, {3} alles zu verdanken ist. (das Team — Dat.: dem)
      4. Das sind die Kunden, {4} wir helfen. (die Kunden — Dat.: denen)
      5. Das ist ein Ort, {5} man gut arbeiten kann. (ein Ort — Dat.: dem, after an dem)
      6. Das ist die Person, {6} ich am meisten vertraue. (die Person — Dat.: der)
      7. Das sind Freunde, {7} ich alles erzählen kann. (Freunde — Dat.: denen)
      8. Das ist das Projekt, {8} wir viel Zeit gewidmet haben. (das Projekt — Dat.: dem)
    answers:
