  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was hat Herr Steinmeyer bereits gelesen?"
        options:
          - { key: a, text: "Annas Bewerbung für eine neue Stelle." }
          - { key: b, text: "Das Empfehlungsschreiben, das Anna ihm geschickt hat." }
          - { key: c, text: "Annas Lebenslauf." }
