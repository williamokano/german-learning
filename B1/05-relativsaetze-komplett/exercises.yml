  - id: D2
    block: D
    type: odd-one-out
    title: "Welches Wort passt nicht?"
    instructions: "Streiche das Wort durch, das nicht passt, und erkläre warum."
    groups:
      - items: [der, die, das, denen]
        odd: 3
        why: "denen is the Dativ plural form; der/die/das are Nominativ/Akkusativ forms (denen does not appear in Nom. or Akk.)."
      - items: [alles, etwas, nichts, das Auto]
        odd: 3
        why: "das Auto is a specific neuter noun (→ relative pronoun das); alles/etwas/nichts all trigger was."
      - items: [mit der, in dem, über das, worüber]
        odd: 3
        why: "worüber is a Pronominaladverb (B1/08 topic); the others are preposition + relative pronoun (the B1/05 form)."
      - items: [der Ort, die Stadt, das Land, die Nachfrage]
        odd: 3
        why: "die Nachfrage is not a place noun; der Ort / die Stadt / das Land all take `wo` as a relative pronoun."
      - items: [sich kümmern um, abhängen von, bestehen aus, gefallen]
        odd: 3
        why: "gefallen takes Dativ but no preposition; the other three verbs all take a preposition that appears in relative clauses."
      - items: [die Formulierung, der Hinweis, das Merkmal, denen]
        odd: 3
        why: "denen is a relative pronoun; die Formulierung / der Hinweis / das Merkmal are nouns (Wortschatz from this lesson)."

