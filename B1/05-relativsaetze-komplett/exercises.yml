      4. Das sind die Nutzer, {4} früh aufstehen. (die Nutzer — Nom.)
      5. Das ist eine Stadt, {5} viele Möglichkeiten bietet. (die Stadt — Nom.)
      6. Das ist ein Ergebnis, {6} uns alle überrascht hat. (das Ergebnis — Nom.)
      7. Das sind Leute, {7} immer pünktlich sind. (die Leute — Nom.)
      8. Das ist der Barista, {8} den besten Kaffee macht. (der Barista — Nom.)
    answers:
      "1": die
      "2": der
      "3": das
      "4": die
      "5": die
      "6": das
      "7": die
      "8": der

