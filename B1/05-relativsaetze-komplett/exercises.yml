          - { gap: 2, answer: die }
          - { gap: 3, answer: das }
          - { gap: 4, answer: die }
      - label: "Akkusativ"
        cells:
          - { gap: 5, answer: den }
          - { gap: 6, answer: die }
          - { gap: 7, answer: das }
          - { gap: 8, answer: die }
      - label: "Dativ"
        cells:
          - { gap: 9, answer: dem }
          - { gap: 10, answer: der }
          - { gap: 11, answer: dem }
          - { gap: 12, answer: denen }

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Relativpronomen Nominativ — Wiederholung (A2/13)"
    instructions: "Fülle die Lücken mit dem richtigen Relativpronomen im Nominativ. 8 Sätze."
    text: |
      1. Das ist die App, {1} Pendlern hilft. (die App — Nom.)
      2. Das ist ein Kollege, {2} sehr zuverlässig ist. (der Kollege — Nom.)
