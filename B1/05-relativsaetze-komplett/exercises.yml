      "2": was
      "3": dem
      "4": der
      "5": wo
      "6": denen

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Voicemail von Pavel an Anna"
    audio: transcript_ansage1.mp3
    instructions: "Listen to Pavel's voice message. Then choose the correct answer (a, b, or c)."
    transcript: 'Hallo Anna, hier ist Pavel. Ich wollte dir kurz einen Tipp geben. In unserem Kiez gibt es jetzt ein neues Café, das du unbedingt kennen musst. Es heißt Kaffeewerkstatt und liegt in der Müllerstraße — das ist eine Straße, in der es früher kaum gute Cafés gab. Die Barista, die dort arbeitet, ist unglaublich gut — sie kennt jede Methode, über die man in der Specialty-Kaffeewelt spricht. Das Beste, was sie macht, ist ein Filterkaffee aus Äthiopien. Das ist genau das, was du nach einem langen Arbeitstag brauchst. Bitte ruf mich zurück, wenn du hingehst — ich komme gern mit!'
    items:
      - q: "Warum ruft Pavel an?"
        options:
          - { key: a, text: "Um Anna zu einer Konferenz einzuladen." }
          - { key: b, text: "Um Anna ein neues Café zu empfehlen." }
          - { key: c, text: "Um Anna nach einem Rezept zu fragen." }
        answer: b
        why: '"Ich wollte dir kurz einen Tipp geben. In unserem Kiez gibt es jetzt ein neues Café, das du unbedingt kennen musst."'
      - q: "Was sagt Pavel über die Barista?"
        options:
          - { key: a, text: "Sie arbeitet schon seit Jahren dort." }
          - { key: b, text: "Sie ist unglaublich gut und kennt viele Methoden." }
          - { key: c, text: "Sie kommt aus Äthiopien." }
        answer: b
        why: '"Die Barista, die dort arbeitet, ist unglaublich gut — sie kennt jede Methode, über die man in der Specialty-Kaffeewelt spricht."'
      - q: "Was ist laut Pavel das Beste, was die Barista macht?"
        options:
          - { key: a, text: "Ein Espresso aus Brasilien." }
          - { key: b, text: "Ein Filterkaffee aus Äthiopien." }
          - { key: c, text: "Ein Cappuccino aus Berlin." }
        answer: b
        why: '"Das Beste, was sie macht, ist ein Filterkaffee aus Äthiopien."'
      - q: "Was soll Anna tun?"
        options:
          - { key: a, text: "Eine Reservierung machen." }
          - { key: b, text: "Pavel zurückrufen, wenn sie hingeht." }
          - { key: c, text: "Das Café alleine besuchen." }
        answer: b
        why: '"Bitte ruf mich zurück, wenn du hingehst — ich komme gern mit!"'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: table-fill
