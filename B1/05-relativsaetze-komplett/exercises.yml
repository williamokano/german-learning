  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Zwei Sätze verbinden — Relativsatz bilden"
    instructions: "Verbinde die zwei Sätze zu einem Satz mit Relativsatz. Schreib das Ergebnis in die Lücke. 6 Sätze."
    text: |
      1. Das ist eine App. Mit der App kann man Scooter finden.
         → Das ist eine App, {1} man Scooter finden kann.
      2. Das ist ein Kollege. Ich vertraue dem Kollegen sehr.
         → Das ist ein Kollege, {2} ich sehr vertraue.
      3. Das sind Leute. Auf die Leute kann man sich verlassen.
         → Das sind Leute, {3} man sich verlassen kann.
      4. Das ist das Stadtgebiet. In dem Stadtgebiet ist die Nachfrage hoch.
         → Das ist das Stadtgebiet, {4} die Nachfrage hoch ist.
      5. Das ist alles. Wir brauchen alles für den Start.
         → Das ist alles, {5} wir für den Start brauchen.
      6. Das ist Berlin. Pavel lebt seit drei Jahren in Berlin.
         → Das ist Berlin, {6} Pavel seit drei Jahren lebt.
    answers:
      "1": mit der
      "2": dem
      "3": auf die
      "4": in dem
      "5": was
      "6": wo

  - id: A10
    block: A
    type: true-false
    title: "Grammatik-Check — ist das Relativpronomen korrekt?"
    instructions: "Ist das Relativpronomen korrekt? Richtig (R) oder Falsch (F)? Bei F: erkläre den Fehler."
    items:
      - q: "Das ist die App, die ich empfehle."
        answer: true
        why: "Correct: die App (f.) as direct object → Akkusativ → die."
      - q: "Alles, das wir brauchen, ist hier."
        answer: false
        why: 'Error: after `alles` use `was`, not `das`. Correct: Alles, was wir brauchen, ist hier.'
      - q: "Das sind Kunden, denen wir helfen."
        answer: true
        why: "Correct: Kunden (pl.) with dative verb `helfen` → denen."
      - q: "Die Stadt, wo Pavel wohnt, ist Berlin."
        answer: true
        why: "Correct: `wo` as relative pronoun after place noun `Stadt`."
      - q: "Das ist der Kollege, der ich vertraue."
        answer: false
        why: 'Error: `vertrauen` takes Dativ, so the pronoun must be `dem` (not `der`). Correct: der Kollege, dem ich vertraue.'

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: false
    title: "Dialog ergänzen — Produktbeschreibung mit Relativsätzen"
    instructions: "Fill in the blanks with the correct relative pronoun or preposition + pronoun combination. 8 gaps."
    text: |
      — Ich schreibe gerade den Text für unsere neue Website. Kannst du helfen?
      — Natürlich! Fang mit einer Definition an. „Das ist ein Service, {1} du in Minuten buchen kannst." (mit + dem)
      — Gut. Und dann: „Das sind die Stadtteile, {2} unsere Kunden am meisten wohnen." (in + denen)
      — Genau. Und für das Team: „Das sind Menschen, {3} du wirklich vertrauen kannst." (denen)
      — Toll. Was sagst du zu: „Das Beste, {4} unsere App bietet, ist Zuverlässigkeit."? (was)
      — Super! Noch ein Satz: „Das ist das Ziel, {5} wir jeden Tag arbeiten." (für + das)
      — Und am Ende: „Das ist alles, {6} du brauchst." (was)
      — Perfekt. Der Text, {7} wir jetzt haben, klingt wirklich professionell. (den)
      — Ja! Und das ist genau die Art von Sprache, {8} man auf guten Websites findet. (die)
    answers:
      "1": mit dem
      "2": in denen
      "3": denen
      "4": was
      "5": für das
      "6": was
      "7": den
      "8": die

  - id: B2
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler — falsche Relativpronomen"
    instructions: "Jeder Satz enthält einen Fehler mit dem Relativpronomen. Schreib den korrekten Satz. 6 Sätze."
    text: |
      1. Alles, das ich brauche, ist hier. → Alles, {1} ich brauche, ist hier.
      2. Das ist der Kollege, der ich vertraue. → Das ist der Kollege, {2} ich vertraue.
      3. Das sind Kunden, die wir helfen. → Das sind Kunden, {3} wir helfen.
      4. Das ist die App, womit man Scooter mietet. → Das ist die App, {4} man Scooter mietet.
      5. Das ist das Stadtgebiet, in der die Nachfrage hoch ist. → Das ist das Stadtgebiet, {5} die Nachfrage hoch ist.
      6. Das Beste, das sie macht, ist ihr Filterkaffee. → Das Beste, {6} sie macht, ist ihr Filterkaffee.
    answers:
      "1": was
      "2": dem
      "3": denen
      "4": mit der
      "5": in dem
      "6": was
    why: '1: alles → was; 2: vertrauen + Dat. → dem; 3: helfen + Dat. → denen; 4: womit = B1/08 topic — use mit der; 5: in + das Stadtgebiet (n.) → in dem; 6: das Beste → was.'

  - id: B3
    block: B
    type: single-choice
    title: "Richtiges Relativpronomen wählen"
    instructions: "Wähle das richtige Relativpronomen (a, b oder c)."
    items:
      - q: "Das ist die App, ______ ich täglich nutze."
        options:
          - { key: a, text: "die" }
          - { key: b, text: "das" }
          - { key: c, text: "den" }
        answer: a
        why: "die App (f.) as direct object → Akkusativ feminine → die."
      - q: "Das sind Leute, ______ wir wirklich helfen können."
        options:
          - { key: a, text: "die" }
          - { key: b, text: "denen" }
          - { key: c, text: "dem" }
        answer: b
        why: "Leute (pl.) with dative verb helfen → Dativ plural → denen."
      - q: "Das ist das Stadtgebiet, ______ die Nachfrage am größten ist."
        options:
          - { key: a, text: "in der" }
          - { key: b, text: "in dem" }
          - { key: c, text: "in den" }
        answer: b
        why: "das Stadtgebiet (n.) + preposition in → Dativ → in dem."
      - q: "Das Wichtigste, ______ wir brauchen, ist Ausdauer."
        options:
          - { key: a, text: "das" }
          - { key: b, text: "was" }
          - { key: c, text: "die" }
        answer: b
        why: "das Wichtigste is a neuter superlative → relative pronoun is was."
      - q: "Das ist die Stadt, ______ Pavel seit drei Jahren lebt."
        options:
          - { key: a, text: "die" }
          - { key: b, text: "wo" }
          - { key: c, text: "dem" }
        answer: b
        why: "wo is the standard relative pronoun after place nouns (Stadt, Ort, Land…)."
      - q: "Das ist der Grund, ______ wir expandieren."
        options:
          - { key: a, text: "für dem" }
          - { key: b, text: "für den" }
          - { key: c, text: "für die" }
        answer: b
        why: "der Grund (m.) + für (Akkusativ) → für den."

