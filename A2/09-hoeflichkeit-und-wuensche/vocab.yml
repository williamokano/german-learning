# Reviewed from A2/09 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
#
# Section headers in lesson.md:
#   Im Restaurant (at the restaurant)  — 14 nouns (incl. Nachspeise plural Nachspeisen
#                                        restored from the lesson's "-n" plural form
#                                        which the parser flagged needsReview)
#   Im Geschäft (at the shop)         — 7 nouns (commercial / complaint vocabulary)
#   Einladungen (invitations)          — 5 nouns (social / correspondence)
#   Wichtige Verben (important verbs)  — 8 verbs (3 separable, 1 reflexive,
#                                        1 e→ie vowel change, 3 regular -ieren verbs)
#
# Konjunktiv II politeness forms (würde, könnte, hätte, wäre) are GRAMMAR (§6) and
# not lemmas, so they don't appear here. Same for the modal particles (doch, mal, ja) —
# they live in §3 Redemittel rather than §4 Wortschatz and are out of scope for this
# vocab file. K II forms will get their own grammar-anchored vocab entries in a later
# iteration if needed (likely B1, not A2 — Konjunktiv II unreal past is B1 scope).
lesson: A2/09

