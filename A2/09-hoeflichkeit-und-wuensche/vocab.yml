  # ── Wichtige Verben ─────────────────────────────────────────────────────────
  # empfehlen has e→ie vowel change in present: er empfiehlt. Not separable.
  - de: empfehlen
    article: null
    plural: null
    en: to recommend (er empfiehlt; e→ie)
    pos: verb
    tags: [verb]
    core: true
    example: "Was würden Sie empfehlen?"
  # Regular weak verb.
  - de: bestellen
    article: null
    plural: null
    en: to order (food, drink, item)
    pos: verb
    tags: [verb]
    core: true
    example: "Ich möchte einen Kaffee bestellen."
  # Regular -ieren verb; always weak.
  - de: reservieren
    article: null
    plural: null
    en: to reserve; to book
    pos: verb
    tags: [verb]
    core: true
    example: "Wir würden gern einen Tisch reservieren."
  # Regular -ieren verb; always weak.
  - de: reklamieren
    article: null
    plural: null
    en: to make a formal complaint
    pos: verb
    tags: [verb]
    core: true
    example: "Ich möchte die Jacke reklamieren."
  # Separable verb: prefix "ab" moves to the end. Ich lehne die Einladung ab.
  - de: ab|lehnen
    article: null
    plural: null
    en: to decline; to refuse (separable)
    pos: verb
    tags: [verb, separable]
    core: true
    example: "Ich muss die Einladung leider ablehnen."
  # Separable verb with e→ie change: er nimmt an. Ich nehme das Angebot an.
  - de: an|nehmen
    article: null
    plural: null
    en: to accept (separable; er nimmt an; e→ie)
    pos: verb
    tags: [verb, separable]
    core: true
    example: "Ich nehme die Einladung gern an."
  # Separable verb with e→i umlaut: er lädt ein. Ich lade dich ein.
  - de: ein|laden
    article: null
    plural: null
    en: to invite (separable; er lädt ein; e→i umlaut)
    pos: verb
    tags: [verb, separable]
    core: true
    example: "Anna lädt Bruno ins Konzert ein."
  # Reflexive verb — always used with "sich" (Akk).
  - de: entschuldigen
    article: null
    plural: null
    en: "to apologise (reflexive: sich entschuldigen)"
    pos: verb
    tags: [verb, reflexive]
    core: true
    example: "Ich möchte mich für den Fehler entschuldigen."