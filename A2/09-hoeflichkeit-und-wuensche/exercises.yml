  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out"
    instructions: "Cross out the word that doesn't fit."
    groups:
      - items: [würde, könnte, hätte, wollte]
        odd: 3
        why: "wollte is Präteritum of wollen; the others are Konjunktiv II."
      - items: [Speisekarte, Tagesgericht, Fensterplatz, Kellner]
        odd: 2
        why: "Fensterplatz is the only noun that describes a seat, not food/service role."
      - items: [wäre, wäre, wären, wäret]
        odd: 3
        why: "wäret is an archaic/rare form of `wäre`; standard forms are wäre, wären, wärt."
      - items: [bestellen, reservieren, reklamieren, wünschen]
        odd: 3
        why: "wünschen is more general; the others are specific restaurant actions."
      - items: [Einladung, Absage, Zusage, Bestellung]
        odd: 3
        why: "Bestellung is the only one not about invitations; the others are."
      - items: [könntest, würdest, hättest, wolltest]
        odd: 3
        why: "wolltest is Präteritum of wollen; the others are Konjunktiv II."

