  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: free-write
    title: "Two nouns: Dativ before Akkusativ"
    prompt: "Build a sentence from the cues. Put the Dativ noun (recipient) before the Akkusativ noun (thing)."
    stimulus: |
      Example: ich / schenken / meine Schwester / ein Buch → Ich schenke meiner Schwester ein Buch.

      1. ich / schenken / mein Bruder / ein Buch →
      2. er / geben / der Mann / der Schlüssel →
      3. Anna / schicken / ihre Freundin / eine Karte →
      4. wir / erklären / die Schüler / die Regel →
      5. du / schreiben / dein Vater / ein Brief →
      6. ich / empfehlen / meine Kollegen / ein Restaurant →
      7. sie / zeigen / der Lehrer / das Buch →
      8. wir / wünschen / unsere Freunde / alles Gute →
      9. ich / bringen / meine Gäste / Getränke →
      10. du / leihen / dein Bruder / das Auto →
    model: |
      1. Ich schenke meinem Bruder ein Buch.
      2. Er gibt dem Mann den Schlüssel.
      3. Anna schickt ihrer Freundin eine Karte.
      4. Wir erklären den Schülern die Regel.
      5. Du schreibst deinem Vater einen Brief.
      6. Ich empfehle meinen Kollegen ein Restaurant.
      7. Sie zeigt dem Lehrer das Buch.
      8. Wir wünschen unseren Freunden alles Gute.
      9. Ich bringe meinen Gästen Getränke.
      10. Du leihst deinem Bruder das Auto.

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Fill in the correct dative ending"
    instructions: "Vervollständige die Dativ-Nominalphrase (das indirekte Objekt — die Person). 10 Aufgaben."
    instructionsEn: "Complete the dative noun phrase (the indirect object — the person). 10 items."
    text: |
      1. Ich schenke mein{1} Schwester ein Buch.
      2. Er gibt dem{2} Kind einen Apfel.
      3. Anna schickt ihr{3} Freundin eine Karte.
      4. Wir erklären d{4} Schülern die Regel.
      5. Du schreibst dein{5} Vater einen Brief.
      6. Ich empfehle mein{6} Kollegen ein Restaurant.
      7. Sie zeigt d{7} Lehrer das Buch.
      8. Wir wünschen unser{8} Freunden alles Gute.
      9. Ich bringe mein{9} Gästen Getränke.
      10. Du leihst dein{10} Bruder das Auto.
    answers:
      "1": er
      "2": ""
      "3": er
      "4": en
      "5": em
      "6": en
      "7": em
      "8": en
      "9": en
      "10": em

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Substitution: replace the dative noun with a dative pronoun"
    instructions: "Ersetze das Dativ-Nomen durch das richtige Dativ-Pronomen. Das Akkusativ-Nomen bleibt, wo es ist. 10 Aufgaben."
    instructionsEn: "Replace the dative noun with the correct dative pronoun. Keep the accusative noun where it is. 10 items."
    text: |
      1. Ich schenke meiner Schwester ein Buch. → Ich schenke {1} ein Buch.
      2. Er gibt dem Kind einen Apfel. → Er gibt {2} einen Apfel.
      3. Anna schickt ihrer Freundin eine Karte. → Anna schickt {3} eine Karte.
      4. Wir erklären den Schülern die Regel. → Wir erklären {4} die Regel.
      5. Du schreibst deinem Vater einen Brief. → Du schreibst {5} einen Brief.
      6. Ich empfehle meinen Kollegen ein Restaurant. → Ich empfehle {6} ein Restaurant.
      7. Sie zeigt dem Lehrer das Buch. → Sie zeigt {7} das Buch.
      8. Wir wünschen unseren Freunden alles Gute. → Wir wünschen {8} alles Gute.
      9. Ich bringe meinen Gästen Getränke. → Ich bringe {9} Getränke.
      10. Du leihst deinem Bruder das Auto. → Du leihst {10} das Auto.
    answers:
      "1": ihr
      "2": ihm
      "3": ihr
      "4": ihnen
      "5": ihm
      "6": ihnen
      "7": ihm
      "8": ihnen
      "9": ihnen
      "10": ihm

  - id: A4
    block: A
    type: free-write
    title: "Two pronouns: write out the full sentence"
    prompt: "Put the cues in the right order. Akkusativ pronoun comes before Dativ pronoun."
    stimulus: |
      Example: schenken / ich / es / ihr → Ich schenke es ihr.

      1. schenken / ich / es / ihr →
      2. geben / er / es / ihm →
      3. schicken / Anna / sie / ihr →
      4. erklären / wir / es / ihnen →
      5. schreiben / du / es / ihm →
      6. empfehlen / ich / sie / ihnen →
      7. zeigen / sie / es / ihm →
      8. bringen / wir / sie / dir →
      9. leihen / du / es / mir →
      10. geben / ich / es / Ihnen →
    model: |
      1. Ich schenke es ihr.
      2. Er gibt es ihm.
      3. Anna schickt sie ihr.
      4. Wir erklären es ihnen.
      5. Du schreibst es ihm.
      6. Ich empfehle sie ihnen.
      7. Sie zeigt es ihm.
      8. Wir bringen sie dir.
      9. Du leihst es mir.
      10. Ich gebe es Ihnen.

