  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: 'Each sentence has exactly one mistake (sometimes two). Find it and write the corrected sentence.'
    stimulus: |
      1. Ich schenke ein Buch meiner Schwester.
      2. Ich schenke ihr es.
      3. Er schickt eine Karte seinem Bruder.
      4. Ich leihst dein Bruder das Auto.
      5. Er schenkt mir das Buch. (Richtig oder Fehler?)
