lesson: A2/11
title: "A2 · Lektion 11 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Höre Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Bruno sucht ein Geschenk für seinen Bruder."
        answer: false
        why: 'Bruno sucht ein Geschenk für seine Mutter, nicht seinen Bruder.'
      - q: "Annas Tante liest gern Krimis."
        answer: true
        why: 'Anna: „Ich schenke meiner Tante immer Krimis".'
      - q: 'Anna empfiehlt Bruno den Roman „Der stille Patient".'
        answer: true
        why: 'Anna: „habe ich ihr den Roman „Der stille Patient" geschenkt".'
      - q: "Bruno schenkt seiner Mutter eine CD mit Mozart."
        answer: true
        why: 'Bruno: „Und eine CD mit Mozart schenke ich ihr auch".'
      - q: "Bruno bringt das Geschenk am Samstag zu seiner Mutter."
        answer: false
        why: 'Bruno bringt alles am Sonntag zu ihr, nicht am Samstag.'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Höre Dialog B und wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was schenkt Frau Weber Herrn Steinmeyer?"
        options:
          - { key: a, text: "Eine CD" }
          - { key: b, text: "Ein Buch" }
          - { key: c, text: "Eine Karte" }
        answer: b
        why: 'Frau Weber: „Darf ich Ihnen dieses Buch geben?".'
      - q: "Wie heißt das Buch?"
        options:
          - { key: a, text: '„Schachnovelle"' }
          - { key: b, text: '„Der stille Patient"' }
          - { key: c, text: '„Die Verwandlung"' }
        answer: a
        why: 'Herr Steinmeyer: „Das ist ja „Schachnovelle" von Stefan Zweig".'
      - q: "Wohin fährt Herr Steinmeyer?"
        options:
          - { key: a, text: "Nach Salzburg" }
          - { key: b, text: "Nach Berlin" }
          - { key: c, text: "Nach Wien" }
        answer: c
        why: 'Frau Weber: „Es passt gut zu Ihrem neuen Job in Wien".'
      - q: "Was will Herr Steinmeyer aus Wien schicken?"
        options:
          - { key: a, text: "Ein Paket" }
          - { key: b, text: "Eine Karte" }
          - { key: c, text: "Ein Foto" }
        answer: b
        why: 'Herr Steinmeyer: „Ich schreibe Ihnen aus Wien eine Karte".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre und ergänze die 6 fehlenden Wörter. Drei Wörter im Kasten werden nicht gebraucht."
    instructionsEn: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Heute ist Yuki auf dem Weihnachtsmarkt am Alexanderplatz. Sie möchte
      ihrer Familie in Japan etwas {1}. Ein freundlicher Verkäufer
      {2} ihr ein schönes Buch und einen warmen Schal. Yuki {3}
      das Buch für ihre Schwester und den Schal für ihren Bruder. Der
      Verkäufer {4} alles schön in Geschenkpapier ein und schenkt
      ihr noch eine Karte {5}. Yuki schreibt ihren Eltern eine
      Nachricht: „Ich {6} euch die Geschenke nächste Woche."
    bank: [schenken, empfiehlt, kauft, packt, dazu, schicke, gibt, bringe, empfehle]
    answers:
      "1": schenken
      "2": empfiehlt
      "3": kauft
      "4": packt
      "5": dazu
      "6": schicke

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage im Kaufhaus"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript unten liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Achtung, eine Durchsage. Liebe Kundinnen und Kunden, unser Kaufhaus schließt heute um zwanzig Uhr. Wir möchten Sie daran erinnern, dass unsere Geschenk-Werkstatt im dritten Stock noch bis achtzehn Uhr geöffnet hat. Unsere Mitarbeiter packen Ihre Geschenke kostenlos in schönes Papier ein und schreiben eine Karte für Sie. Bitte bringen Sie Ihre Einkäufe bis spätestens siebzehn Uhr dreißig in die Geschenk-Werkstatt. Vielen Dank für Ihren Besuch.'
    items:
      - q: "Wie spät schließt das Kaufhaus heute?"
        options:
          - { key: a, text: "Um achtzehn Uhr." }
          - { key: b, text: "Um neunzehn Uhr." }
          - { key: c, text: "Um zwanzig Uhr." }
        answer: c
        why: '„unser Kaufhaus schließt heute um zwanzig Uhr".'
      - q: "Wo befindet sich die Geschenk-Werkstatt?"
        options:
          - { key: a, text: "Im ersten Stock." }
          - { key: b, text: "Im zweiten Stock." }
          - { key: c, text: "Im dritten Stock." }
        answer: c
        why: '„unsere Geschenk-Werkstatt im dritten Stock".'
      - q: "Bis wann kann man Geschenke in die Werkstatt bringen?"
        options:
          - { key: a, text: "Bis siebzehn Uhr." }
          - { key: b, text: "Bis siebzehn Uhr dreißig." }
          - { key: c, text: "Bis achtzehn Uhr." }
        answer: b
        why: '„Bitte bringen Sie Ihre Einkäufe bis spätestens siebzehn Uhr dreißig".'
      - q: "Was macht die Geschenk-Werkstatt kostenlos?"
        options:
          - { key: a, text: "Sie verpackt Geschenke und schreibt eine Karte." }
          - { key: b, text: "Sie liefert Geschenke nach Hause." }
          - { key: c, text: "Sie repariert alte Geschenke." }
        answer: a
        why: '„Unsere Mitarbeiter packen Ihre Geschenke kostenlos in schönes Papier ein und schreiben eine Karte".'

