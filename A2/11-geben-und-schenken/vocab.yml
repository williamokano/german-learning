  # ── Personen (people — frequently the Dativobjekt / recipient) ─────────────
  # All nouns here are typically the *recipient* (Dativ) of schenken/geben etc.
  # Empfänger / Kollege / Nachbar are weak nouns (n-declension); Beschenkte /
  # Verwandte are adjective-declined.
  - de: Empfänger
    article: der
    plural: Empfänger
    en: recipient
    pos: noun
    tags: [person, concrete]
    core: true
    example: "Der Empfänger des Pakets ist meine Schwester."
