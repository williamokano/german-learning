  # ── Verben (verbs) ─────────────────────────────────────────────────────────
  # Every verb here is a giving / communication verb, all of them tagged `giving`.
  # `two-object` marks the verbs that take Dativ + Akkusativ (the lesson's
  # grammatical heart). `kaufen` is intentionally NOT two-object — it takes
  # `für + Akk`, called out explicitly in §6.1.
  - de: schenken
    article: null
    plural: null
    en: to give (as a gift)
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Ich schenke meiner Mutter ein Buch."
  - de: geben
    article: null
    plural: null
    en: to give
    pos: verb
    tags: [verb, giving, two-object, strong]
    core: true
    example: "Er gibt dem Kind einen Apfel."
  - de: schicken
    article: null
    plural: null
    en: to send
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Ich schicke meiner Freundin eine Karte."
  - de: bringen
    article: null
    plural: null
    en: to bring
    pos: verb
    tags: [verb, giving, two-object, strong]
    core: true
    example: "Bruno bringt das Geschenk zu seiner Mutter."
  - de: zeigen
    article: null
    plural: null
    en: to show
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Ich zeige meinem Bruder das Foto."
  - de: erklären
    article: null
    plural: null
    en: to explain
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Ich erkläre es den Schülern."
  - de: sagen
    article: null
    plural: null
    en: to say
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Er sagt ihr die Wahrheit."
  - de: schreiben
    article: null
    plural: null
    en: to write
    pos: verb
    tags: [verb, giving, two-object, strong]
    core: true
    example: "Anna schreibt ihrer Freundin eine Karte."
  - de: wünschen
    article: null
    plural: null
    en: to wish
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Ich wünsche dir alles Gute!"
  - de: empfehlen
    article: null
    plural: null
    en: to recommend
    pos: verb
    tags: [verb, giving, two-object, strong]
    core: true
    example: "Kannst du mir ein Buch empfehlen?"
  - de: leihen
    article: null
    plural: null
    en: to lend
    pos: verb
    tags: [verb, giving, two-object, strong]
    core: true
    example: "Ich leihe ihr mein Buch."
  - de: kaufen
    article: null
    plural: null
    en: to buy (recipient uses `für + Akk`, NOT dative)
    pos: verb
    tags: [verb, giving]
    core: true
    example: "Ich kaufe für meinen Bruder ein Geschenk."
  - de: schmücken
    article: null
    plural: null
    en: to decorate
    pos: verb
    tags: [verb, giving]
    core: true
    example: "Wir schmücken den Tisch."
  - de: einpacken
    article: null
    plural: null
    en: "to wrap (up) — separable: er packt ein"
    pos: verb
    tags: [verb, giving, separable]
    core: true
    example: "Anna packt das Buch schön ein."
  - de: überreichen
    article: null
    plural: null
    en: to present, hand over (formal)
    pos: verb
    tags: [verb, giving, two-object]
    core: true
    example: "Sie überreichen Frau Weber das Geschenk."
  - de: sich bedanken
    article: null
    plural: null
    en: "to say thank you (reflexive: sich bei + Dat bedanken)"
    pos: verb
    tags: [verb, giving, reflexive]
    core: true
    example: "Ich bedanke mich bei dir für das Geschenk."

