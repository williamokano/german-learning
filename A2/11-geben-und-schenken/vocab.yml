# Reviewed from A2/11 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts (V2).
# Lesson anchor: verbs with dative + accusative object, position of objects, pronoun order.
# Tag taxonomy mirrors the A1/03 pilot + A1/01/A1/02 vocab (issue #337).
#
# Parser artefact fixes (V2 captured 43 entries with 11 needsReview; review pass):
#   - Person split: "Kollegen (pl.) der Kollege" was collapsed by the parser into one
#     row with a confused plural; split back into Kollege + Kollegin.
#   - Person split: Nachbar — added the feminine Nachbarin (also in source).
#   - Person split: Empfänger — added the feminine Empfängerin (also in source).
#   - Plurals: Verwandten (plural-only → plural: null), Beschenkte (adj. declension →
#     plural: Beschenkten), Empfänger (n-declension weak → plural: Empfänger),
#     Kollege (n-declension → plural: Kollegen), Nachbar (n-declension → plural: Nachbarn).
#   - Verb glosses: schmücken had `en: regular` (parser picked up the grammar note
#     instead of the meaning); corrected to `to decorate`.
#   - Verb glosses: bedanken, sich → re-classified from `phrase` to `verb` (it IS a
#     reflexive verb, not a set phrase); cleaned to `sich bedanken` with a
#     `reflexive` tag.
#   - Phrases: "Bitte schön / Gern geschehen." was joined on one line; split into two
#     standalone phrases (they ARE two idioms, both meaning "You're welcome").
#   - Phrases: "ist eine Überraschung!" was wrongly routed as a noun by the parser
#     (it grabbed the noun article `das`); corrected to the full phrase "Das ist
#     eine Überraschung!".
#   - All reviewNote hints removed on commit (per CommittedVocabSet invariant).
lesson: A2/11

