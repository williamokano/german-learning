# Reviewed from A2/13 lesson.md §4 Wortschatz.
# Bootstrapped with build/import-vocab.ts (V2-parser draft). The parser
# extracted all 59 entries across the four §4 tables (Aussehen / Charakter /
# Familie / Verben), but flag-by-flag cleanup was needed:
#
#   1. Adjectives (22): parser still emits a stale reviewNote
#      "adjective — confirm pos / fill gloss" when the gloss happens to be
#      filled in. That note is a V2 working-note for the human reviewer;
#      once needsReview is false, the note must go (CommittedVocabSet invariant).
#   2. `offen` / `schüchtern`: parsed as `verb` because they end in "-en".
#      Both are predicative adjectives (used after *sein*).
#   3. `aussehen`: parser read the "sieht … aus" footnote as the English gloss.
#      Correct gloss is "to look (like)"; tags: verb, separable (trennbar),
#      strong (e→ie).
#   4. `erzählen` / `kennenlernen` / `meinen` / `vorstellen`: parser picked the
#      "Perfekt" column header value (e.g. "hat erzählt") as the gloss instead
#      of the "Meaning" column. Correct glosses from the table's middle column.
#   5. `sich (Dat) anfreunden`: parser left the (Dat) annotation glued to the
#      lemma. Cleaned to `sich anfreunden`, changed pos from `phrase` → `verb`,
#      added `reflexive` tag.
#   6. `Verwandten`: parser flagged the missing plural with "check plural", but
#      *die Verwandten* is a Plural-tantum (the lesson explicitly marks "(pl.)"
#      in the lemma cell). `plural: null` is correct, no review needed.
#
# Tag taxonomy mirrors the A1/02 + A1/03 gold standards (issue #337):
#   - all body / family nouns tagged `[<domain>, concrete]`
#   - adjectives tagged `[adjective]`
#   - verbs tagged `[verb]` ± `[separable]` / `[reflexive]` / `[strong]`
#
# Section headers in lesson.md:
#   Aussehen (appearance)                 — 10 body nouns
#   Charaktereigenschaften (personality) — 22 adjectives
#   Familie (family)                      — 19 nouns (incl. 1 Plural-tantum)
#   Verben (verbs)                        — 8 verbs (1 reflexive)
lesson: A2/13

