      - items: [mögen, kennen, beschreiben, obwohl]
        odd: 3
        why: "obwohl is a conjunction (Konnektor), not a verb like the others."
      - items: [der, die, das, welch-]
        odd: 3
        why: "welch- is a question word (which?), not a relative pronoun."
      - items: [hilfsbereit, zuverlässig, eingebildet, fleißig]
        odd: 2
        why: "eingebildet is the only negative trait; all others are positive."

