lesson: A2/13
title: "A2 · Lektion 13 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna erzählt Bruno von ihrem neuen Nachbarn."
        answer: false
        why: 'Anna erzählt von ihrem neuen Kollegen, nicht ihrem Nachbarn.'
      - q: "Marko ist 32 Jahre alt."
        answer: true
        why: 'Anna: „Er heißt Marko und ist 32 Jahre alt".'
      - q: "Marko hat braune Augen."
        answer: false
        why: 'Marko hat grüne Augen, nicht braune.'
      - q: "Marko hilft Anna oft bei der Arbeit."
        answer: true
        why: 'Anna: „Er hilft mir oft bei der Arbeit".'
      - q: "Anna und Marko gehen am Wochenende ins Kino."
        answer: false
        why: 'Sie gehen nächsten Freitag ins Kino, nicht am Wochenende.'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Wie lange wohnt Klaus schon im Haus?"
        options:
          - { key: a, text: "Seit drei Wochen." }
          - { key: b, text: "Seit einer Woche." }
          - { key: c, text: "Seit einem Monat." }
        answer: b
        why: 'Herr Steinmeyer: „Er ist vor einer Woche eingezogen".'
      - q: "Was ist Klaus von Beruf?"
        options:
          - { key: a, text: "Er ist Lehrer." }
          - { key: b, text: "Er ist Arzt." }
          - { key: c, text: "Er ist Architekt." }
        answer: c
        why: 'Herr Steinmeyer: „Er ist Architekt".'
      - q: "Woher kommt Klaus' Frau?"
        options:
          - { key: a, text: "Aus Berlin." }
          - { key: b, text: "Aus Wien." }
          - { key: c, text: "Aus Hamburg." }
        answer: b
        why: 'Herr Steinmeyer: „Seine Frau kommt aus Wien".'
      - q: "Was sagt Frau Weber am Ende des Gesprächs?"
        options:
          - { key: a, text: "Sie möchte die Familie nicht kennenlernen." }
          - { key: b, text: "Sie freut sich auf eine gute Nachbarschaft." }
          - { key: c, text: "Sie findet die Familie nicht sympathisch." }
        answer: b
        why: 'Frau Weber: „Freuen wir uns auf gute Nachbarschaft!".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Meine Freundin Lena wohnt in {1}. Sie ist {2} Jahre alt
      und studiert {3}. Sie hat lange {4} Haare und blaue
      Augen, die sehr {5} aussehen. Sie ist genau die Freundin, die
      immer {6} für mich hat.
    bank: [Berlin, "27", Medizin, blonde, freundlich, Zeit, mag, Physik, "30", lustig]
    answers:
      "1": Berlin
      "2": "27"
      "3": Medizin
      "4": blonde
      "5": freundlich
      "6": Zeit

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Wer soll ich abholen?"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the voice message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Hallo Bruno, hier ist Anna. Ich komme leider ein bisschen später zum Bahnhof. Kannst du bitte meinen Bruder Sergej abholen? Er ist 28 Jahre alt, groß und schlank und hat kurze dunkle Haare. Er trägt heute eine rote Jacke und eine schwarze Tasche. Bitte ruf mich zurück, wenn du ihn gefunden hast! Bis später!'
    items:
      - q: "Warum ruft Anna an?"
        options:
          - { key: a, text: "Sie kann Bruno nicht vom Bahnhof abholen." }
          - { key: b, text: "Sie kommt ein bisschen später als geplant." }
          - { key: c, text: "Sie hat Brunos Bruder am Bahnhof getroffen." }
        answer: b
        why: 'Anna: „Ich komme leider ein bisschen später zum Bahnhof".'
      - q: "Wen soll Bruno abholen?"
        options:
          - { key: a, text: "Einen Kollegen von Anna." }
          - { key: b, text: "Annas Freund Marko." }
          - { key: c, text: "Annas Bruder Sergej." }
        answer: c
        why: 'Anna: „Kannst du bitte meinen Bruder Sergej abholen?".'
      - q: "Welche Beschreibung passt zu Sergej?"
        options:
          - { key: a, text: "Klein, kräftig, lange blonde Haare, blaue Jacke." }
          - { key: b, text: "Groß, schlank, kurze dunkle Haare, rote Jacke." }
          - { key: c, text: "Mittelgroß, braune Haare, schwarze Jacke." }
        answer: b
        why: 'Anna: „Er ist … groß und schlank … kurze dunkle Haare … eine rote Jacke".'
      - q: "Was soll Bruno tun, wenn er Sergej gefunden hat?"
        options:
          - { key: a, text: "Er soll Anna eine SMS schreiben." }
          - { key: b, text: "Er soll Anna anrufen." }
          - { key: c, text: "Er soll am Ausgang warten." }
        answer: b
        why: 'Anna: „Bitte ruf mich zurück, wenn du ihn gefunden hast!".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Relativpronomen: Tabelle"
    instructions: "Fill in all eight relative pronoun forms (Nominativ and Akkusativ)."
    text: |
      **Nominativ:** maskulin: {1} · feminin: {2} · neutrum: {3} · Plural: {4}
      **Akkusativ:** maskulin: {5} · feminin: {6} · neutrum: {7} · Plural: {8}
    answers:
      "1": der
      "2": die
      "3": das
      "4": die
      "5": den
      "6": die
      "7": das
      "8": die

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Relativsatz: Nominativ"
    instructions: "Fill in the correct relative pronoun (Nominativ: der / die / das / die). 6 items."
    text: |
      1. Das ist der Mann, {1} neben Anna arbeitet.
      2. Ich habe eine Freundin, {2} sehr klug ist.
      3. Das ist das Kind, {3} auf dem Spielplatz spielt.
      4. Die Leute, {4} dort sitzen, sind unsere Nachbarn.
      5. Er ist der Typ, {5} immer pünktlich ist.
      6. Sie ist die Frau, {6} die beste Pasta kocht.
    answers:
      "1": der
      "2": die
      "3": das
      "4": die
      "5": der
      "6": die

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Relativsatz: Akkusativ"
    instructions: "Fill in the correct relative pronoun (Akkusativ: den / die / das / die). 6 items."
    text: |
      1. Das ist der Film, {1} ich sehr gerne mag.
      2. Ich kenne die Frau, {2} du meinst.
      3. Das ist das Buch, {3} Bruno mir empfohlen hat.
      4. Die Kollegen, {4} ich kenne, sind alle nett.
      5. Er ist der Mensch, {5} ich am meisten mag.
      6. Das ist die Kollegin, {6} ich jeden Tag treffe.
    answers:
      "1": den
      "2": die
      "3": das
      "4": die
      "5": den
      "6": die

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Nominativ oder Akkusativ?"
    instructions: "First decide: is the noun in the relative clause the subject (→ Nominativ) or the object (→ Akkusativ)? 8 items."
    text: |
      1. Das ist der Kollege, {1} immer hilfsbereit ist. (subject of *ist*)
      2. Das ist der Kollege, {2} alle im Team mögen. (object of *mögen*)
      3. Das ist die Frau, {3} neben mir wohnt. (subject of *wohnt*)
      4. Das ist die Frau, {4} ich gestern getroffen habe. (object of *treffen*)
      5. Das ist das Kind, {5} sehr lustig ist. (subject of *ist*)
      6. Das ist das Kind, {6} wir im Park gesehen haben. (object of *sehen*)
      7. Das sind die Leute, {7} hier wohnen. (subject of *wohnen*)
      8. Das sind die Leute, {8} ich kenne. (object of *kennen*)
    answers:
      "1": der
      "2": den
      "3": die
      "4": die
      "5": das
      "6": das
      "7": die
      "8": die

  - id: A5
    block: A
    type: free-write
    title: "Sätze verbinden: Relativsatz bilden (Nominativ)"
    prompt: "Combine the two sentences into one sentence using a Nominativ relative clause."
    stimulus: |
      1. Der Mann heißt Klaus. Er wohnt im dritten Stock. →
      2. Die Frau kommt aus Wien. Sie spricht perfekt Deutsch. →
      3. Das Mädchen heißt Lena. Es studiert Medizin. →
      4. Die Kollegen sind sehr nett. Sie arbeiten im dritten Stock. →
    model: |
      1. Der Mann, der im dritten Stock wohnt, heißt Klaus.
      2. Die Frau, die perfekt Deutsch spricht, kommt aus Wien.
      3. Das Mädchen, das Medizin studiert, heißt Lena.
      4. Die Kollegen, die im dritten Stock arbeiten, sind sehr nett.

  - id: A6
    block: A
    type: free-write
    title: "Sätze verbinden: Relativsatz bilden (Akkusativ)"
    prompt: "Combine the two sentences into one sentence using an Akkusativ relative clause."
    stimulus: |
      1. Das ist der Mann. Ich kenne ihn gut. →
      2. Das ist die Frau. Alle mögen sie. →
      3. Das ist das Buch. Bruno hat es mir empfohlen. →
      4. Das sind die Kollegen. Anna trifft sie jeden Tag. →
    model: |
      1. Das ist der Mann, den ich gut kenne.
      2. Das ist die Frau, die alle mögen.
      3. Das ist das Buch, das Bruno mir empfohlen hat.
      4. Das sind die Kollegen, die Anna jeden Tag trifft.

  - id: A7
    block: A
    type: free-write
    title: "Relativsatz einbauen"
    prompt: "Complete the sentence by turning the cue in brackets into a relative clause. Write the full completed sentence."
    stimulus: |
      1. Das ist der Freund, ___ (Er hilft mir immer.)
      2. Das ist die Lehrerin, ___ (Sie ist sehr geduldig.)
      3. Das ist das Restaurant, ___ (Es hat das beste Essen.)
      4. Das sind die Nachbarn, ___ (Sie sind sehr nett.)
      5. Das ist der Film, ___ (Ich habe ihn gerne gesehen.)
      6. Das ist die Jacke, ___ (Ich mag sie sehr.)
    model: |
      1. Das ist der Freund, der mir immer hilft.
      2. Das ist die Lehrerin, die sehr geduldig ist.
      3. Das ist das Restaurant, das das beste Essen hat.
      4. Das sind die Nachbarn, die sehr nett sind.
      5. Das ist der Film, den ich gerne gesehen habe.
      6. Das ist die Jacke, die ich sehr mag.

  - id: A8
    block: A
    type: free-write
    title: "Verb ans Ende: Wortstellung"
    prompt: "Put the words in brackets in the correct order to complete the relative clause. Remember: the conjugated verb goes last."
    stimulus: |
      1. Das ist der Mann, [neben / wohnt / mir / der]. →
      2. Das ist das Kind, [sehr / das / lustig / ist]. →
      3. Ich kenne die Frau, [du / die / meinst]. →
      4. Das sind die Leute, [kennengelernt / habe / die / ich / gestern]. →
      5. Er ist der Kollege, [alle / den / mögen]. →
    model: |
      1. Das ist der Mann, der neben mir wohnt.
      2. Das ist das Kind, das sehr lustig ist.
      3. Ich kenne die Frau, die du meinst.
      4. Das sind die Leute, die ich gestern kennengelernt habe.
      5. Er ist der Kollege, den alle mögen.

  - id: A9
    block: A
    type: free-write
    title: "Perfekt im Relativsatz"
    prompt: "Fill in the relative pronoun AND the Perfekt form. The Partizip II is given. Write the full completed sentence."
    stimulus: |
      1. Das ist das Buch, ___ ich ___ habe. (gelesen)
      2. Das ist die Frau, ___ ich ___ habe. (kennengelernt)
      3. Das ist der Film, ___ Bruno mir ___ hat. (empfohlen)
      4. Das sind die Leute, ___ Anna ___ hat. (eingeladen)
    model: |
      1. Das ist das Buch, das ich gelesen habe.
      2. Das ist die Frau, die ich kennengelernt habe.
      3. Das ist der Film, den Bruno mir empfohlen hat.
      4. Das sind die Leute, die Anna eingeladen hat.

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Mini-Lückentext: Relativpronomen im Kontext"
    instructions: "Fill in the correct relative pronoun (der / die / das / den). 4 items."
    text: |
      Mein Kollege Marko ist der Mensch, (1) {1} immer gute Laune hat.
      Er ist der Typ, (2) {2} ich sehr sympathisch finde.
      Er hat eine Schwester, (3) {3} noch in seiner Heimatstadt wohnt.
      Das ist das Café, (4) {4} er am liebsten besucht.
    answers:
      "1": der
      "2": den
      "3": die
      "4": das

  - id: A11
    block: A
    type: free-write
    title: "Adjektiv + Relativsatz kombinieren"
    prompt: "Fill in the correct relative pronoun and the adjective ending. Write the full completed sentence."
    stimulus: |
      1. Das ist der Mann, ___ sehr kurz___ Haare und grüne Augen hat.
      2. Das ist die Frau, ___ eine Brille trägt, ___ ihr sehr gut steht.
      3. Das ist das Kind, ___ immer fröhlich___ ist.
      4. Das sind die Kollegen, ___ ich sehr fleißig___ finde.
    model: |
      1. Das ist der Mann, der sehr kurze Haare und grüne Augen hat.
      2. Das ist die Frau, die eine Brille trägt, die ihr sehr gut steht.
      3. Das ist das Kind, das immer fröhlich ist.
      4. Das sind die Kollegen, die ich sehr fleißig finde.

  - id: A12
    block: A
    type: gap-text
    listLayout: true
    title: "Gesamtübung: Nom und Akk gemischt"
    instructions: "First decide: Nominativ or Akkusativ? 8 items."
    text: |
      1. Ich mag die Kollegin, {1} immer lustig ist.
      2. Das ist der Freund, {2} mir gestern geholfen hat.
      3. Das ist die Stadt, {3} ich am liebsten besuche.
      4. Das sind die Fotos, {4} ich dir zeigen wollte.
      5. Er ist der Mensch, {5} alle im Büro kennen.
      6. Sie hat ein Auto, {6} sehr schnell ist.
      7. Das ist die Jacke, {7} ich im Kaufhaus gesehen habe.
      8. Das ist das Buch, {8} mich sehr interessiert.
    answers:
      "1": die
      "2": der
      "3": die
      "4": die
      "5": den
      "6": das
      "7": die
      "8": das

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen: Relativpronomen einsetzen"
    instructions: "Fill in the correct relative pronoun. 4 items."
    text: |
      — Wer ist der Mann, (1) {1} dort neben Frau Weber steht?
      — Das ist Klaus, der neue Nachbar.
      — Ach, der Mann, (2) {2} im dritten Stock wohnt?
      — Genau! Und das ist seine Frau, (3) {3} aus Wien kommt.
      — Die Dame, (4) {4} wir gestern im Treppenhaus gesehen haben?
      — Ja, genau die!
    answers:
      "1": der
      "2": der
      "3": die
      "4": die

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: "Each sentence contains exactly one grammar mistake. Find it and write the corrected sentence."
    stimulus: |
      1. Das ist der Mann, die neben mir arbeitet.
      2. Das ist die Frau, den ich kenne.
      3. Ich kenne das Kind, der im Park spielt.
      4. Das sind die Leute, den ich gestern getroffen habe.
      5. Er ist der Typ, der ich sehr mag.
      6. Das ist die Kollegin, der alle mögen.
    model: |
      1. Das ist der Mann, der neben mir arbeitet. (der Mann is masculine → Nom. = der)
      2. Das ist die Frau, die ich kenne. (die Frau is feminine → Akk. = die, same as Nom.)
      3. Ich kenne das Kind, das im Park spielt. (das Kind is neuter → Nom. = das)
      4. Das sind die Leute, die ich gestern getroffen habe. (die Leute is plural → Akk. = die)
      5. Er ist der Typ, den ich sehr mag. (der Typ is the object of mag → Akk. mask. = den)
      6. Das ist die Kollegin, die alle mögen. (die Kollegin is feminine → Akk. = die)

  - id: B3
    block: B
    type: free-write
    title: "Umformulieren: Relativsatz statt Adjektiv"
    prompt: "Rewrite the sentence. Replace the attributive adjective with a relative clause. Write the full completed sentence."
    stimulus: |
      Example: Ich habe einen netten Kollegen. → Ich habe einen Kollegen, der nett ist.

      1. Das ist eine fleißige Studentin. →
      2. Wir haben ein altes Haus. →
      3. Ich kenne interessante Leute. →
      4. Er hat eine zuverlässige Kollegin. →
    model: |
      1. Das ist eine Studentin, die fleißig ist.
      2. Wir haben ein Haus, das alt ist.
      3. Ich kenne Leute, die interessant sind.
      4. Er hat eine Kollegin, die zuverlässig ist.

  - id: B4
    block: B
    type: matching
    title: "Zuordnen: Was passt zusammen?"
    instructions: "Match each sentence beginning (1–4) to the correct relative clause (a–d)."
    left:
      - { key: "1", text: "Das ist die Dame, ___" }
      - { key: "2", text: "Das ist der Chef, ___" }
      - { key: "3", text: "Das ist das Kind, ___" }
      - { key: "4", text: "Das ist die Kollegin, ___" }
    right:
      - { key: a, text: "den alle im Team respektieren." }
      - { key: b, text: "die aus Wien kommt." }
      - { key: c, text: "die immer freundlich lächelt." }
      - { key: d, text: "das im Garten spielt." }
    answers:
      "1": b
      "2": a
      "3": d
      "4": c

  - id: B5
    block: B
    type: free-write
    title: "Aus zwei mach einen"
    prompt: "Combine each pair into one sentence with a relative clause. Write the full completed sentence."
    stimulus: |
      1. Ich mag den Kollegen. Der Kollege ist immer lustig. →
      2. Wir treffen die Frau. Alle kennen die Frau. →
      3. Er kauft das Buch. Das Buch hat viele Bilder. →
      4. Sie besucht ihre Freunde. Sie hat die Freunde in Berlin kennengelernt. →
      5. Ich lese den Brief. Marko hat den Brief geschrieben. →
    model: |
      1. Ich mag den Kollegen, der immer lustig ist.
      2. Wir treffen die Frau, die alle kennen.
      3. Er kauft das Buch, das viele Bilder hat.
      4. Sie besucht ihre Freunde, die sie in Berlin kennengelernt hat.
      5. Ich lese den Brief, den Marko geschrieben hat.

  - id: B6
    block: B
    type: free-write
    title: "Frage und Antwort"
    prompt: "Answer each question with a full sentence using a relative clause. Use the information in brackets. Write the full completed sentence."
    stimulus: |
      1. Wer ist Marko? (ein Kollege / alle mögen ihn) →
      2. Wer ist Lena? (eine Freundin / sie hat immer Zeit für mich) →
      3. Was ist das? (ein Restaurant / Bruno hat es mir empfohlen) →
      4. Wer sind das? (Kollegen / ich kenne sie gut) →
    model: |
      1. Er ist der Kollege, den alle mögen.
      2. Sie ist die Freundin, die immer Zeit für mich hat.
      3. Das ist das Restaurant, das Bruno mir empfohlen hat.
      4. Das sind Kollegen, die ich gut kenne.

  - id: B7
    block: B
    type: matching
    title: "Wortschatz: Charakter und Aussehen"
    instructions: "Match each German adjective (1–6) to its English meaning (a–f)."
    left:
      - { key: "1", text: "hilfsbereit" }
      - { key: "2", text: "zuverlässig" }
      - { key: "3", text: "schüchtern" }
      - { key: "4", text: "stur" }
      - { key: "5", text: "eingebildet" }
      - { key: "6", text: "fleißig" }
    right:
      - { key: a, text: "stubborn" }
      - { key: b, text: "helpful" }
      - { key: c, text: "reliable" }
      - { key: d, text: "shy" }
      - { key: e, text: "conceited" }
      - { key: f, text: "hard-working" }
    answers:
      "1": b
      "2": c
      "3": d
      "4": a
      "5": e
      "6": f

  - id: B8
    block: B
    type: free-write
    title: "Satzstellung: Verb ans Ende"
    prompt: 'Rewrite each sentence so the relative clause has the verb in the last position. Write the full completed sentence.'
    stimulus: |
      1. Das ist die Frau, [die / Deutsch / perfekt / spricht]. →
      2. Er mag den Kollegen, [der / ihm / immer / hilft]. →
      3. Wir kennen die Dame, [die / wir / gestern / getroffen haben]. →
      4. Das ist das Kind, [das / im / spielt / Park]. →
    model: |
      1. Das ist die Frau, die perfekt Deutsch spricht.
      2. Er mag den Kollegen, der ihm immer hilft.
      3. Wir kennen die Dame, die wir gestern getroffen haben.
      4. Das ist das Kind, das im Park spielt.

  - id: B9
    block: B
    type: free-write
    title: "Beschreib den neuen Praktikanten: WhatsApp an deine Kollegin"
    prompt: "Schreib Sara eine WhatsApp in 4–5 Sätzen. Beschreib den Praktikanten (den du heute Morgen kurz im Büro gesehen hast) so, dass sie ihn am Flughafen wiedererkennen würde."
    use:
      - "at least 2 sentences about appearance (Aussehen) — with adjective+noun"
      - "at least 1 sentence about character (Charakter) — with sein + adjective"
      - "at least 2 relative clauses (one Nominativ: der/die/das …, one Akkusativ: den/die/das …)"
    selfCheck:
      - "Did I use a comma before each relative clause?"
      - "Is the verb at the end of each relative clause?"
      - "Did I use der/die/das (Nom) vs. den/die/das (Akk) correctly?"
    model: |
      Hi Sara, klar, mache ich! Der Praktikant heißt Marko und ist circa
      25 Jahre alt. Er ist groß und schlank, hat kurze dunkle Haare und
      trägt eine schwarze Brille. Er ist ein netter Mann, der immer
      freundlich lächelt. Du erkennst ihn bestimmt an dem schwarzen
      Pullover, den er heute im Büro getragen hat. Bis später!

  # ── Block C — Prüfungstraining ───────────────────────────────────────────

  - id: C1
    block: C
    type: gap-text
    listLayout: true
    title: "Lückentext"
    instructions: "Read the text and fill in one suitable word in each gap. 10 items."
    text: |
      Mein neuer Kollege heißt Jan. Er ist 30 Jahre alt und kommt aus
      Hamburg. Er ist groß und (1) {1}, hat kurze (2) {2} Haare
      und braune Augen. Er trägt eine Brille, (3) {3} ihm sehr gut
      steht. Jan ist sehr (4) {4} — er hilft allen Menschen gern. Er
      ist genau der Kollege, (5) {5} immer gute Laune hat. In seiner
      Freizeit liest er gern Bücher, (6) {6} er in der Bibliothek
