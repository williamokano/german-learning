  - id: D2
    block: D
    type: odd-one-out
    title: "Odd-one-out"
    instructions: "In each group of four, circle the word that does NOT belong."
    groups:
      - items: [hilfsbereit, freundlich, faul, nett]
        odd: 2
        why: "faul is the only negative character trait; all others are positive."
      - items: [Bruder, Schwester, Tante, Brille]
        odd: 3
        why: "Brille is not a family term; all others are family members."
      - items: [Augen, Haare, Bart, Charakter]
