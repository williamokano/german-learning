# Reviewed from A2/06 lesson.md §4 Wortschatz and §6.1 verb+preposition chunks.
# Note: the V2-parser draft had 45 entries — 3 of those were parser garbage
# (the separable-verb footnote ⚠️ text and a stray example sentence got
# emitted as `pos: phrase` entries). All three were dropped here.
#
# Tags:
#   - [phone], [email] for communication channels
#   - [media, concrete] for tangible media devices & content
#   - [media] for abstract media concepts (no concrete item to picture)
#   - [verb] for the 13 standalone Verben in §4
#   - [verb-prep] for the 10 verb+fixed-preposition chunks in §6.1
#     (`core: false` so they don't double-count the headword)
#
# §4 lists "Nachricht" twice (once in Kommunikationsmittel as "message; news
# (item)", once in Medien as "news item; message") — same lemma, kept once.
lesson: A2/06

