lesson: A2/06
title: "A2 · Lektion 6 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - { q: "Anna wartet auf eine Nachricht von Bruno.", answer: true, why: "Anna has been waiting for Bruno's message for an hour." }
      - { q: "Bruno ärgert sich über das schlechte Wetter.", answer: false, why: "Bruno is annoyed about his internet connection, not the weather." }
      - { q: "Bruno freut sich über Videoanrufe mit seiner Familie.", answer: true, why: "Bruno says he genuinely enjoys video calls." }
      - { q: 'Anna schaut gerade die Serie „Dark".', answer: true, why: 'Anna confirms she is watching „Dark" right now.' }

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Frau Weber wartet auf …"
        options:
          - { key: a, text: "einen Anruf von Herrn Steinmeyer." }
          - { key: b, text: "Herrn Steinmeyers Antwort zur Präsentation." }
          - { key: c, text: "eine neue E-Mail-Adresse." }
        answer: b
        why: "Frau Weber wartet auf Herrn Steinmeyers Antwort zur Präsentation."
      - q: "Warum hat Frau Weber Herrn Steinmeyers E-Mail nicht bekommen?"
        options:
          - { key: a, text: "Weil Herr Steinmeyer sie noch nicht geschickt hat." }
          - { key: b, text: "Das ist unklar — sie hat nichts erhalten." }
          - { key: c, text: "Weil sie das falsche Postfach geprüft hat." }
        answer: b
        why: "She did not receive anything; the reason is unclear."
      - q: "Worüber spricht Frau Webers Team gerade viel?"
        options:
          - { key: a, text: "Über neue Streaming-Plattformen." }
          - { key: b, text: "Über digitale Kommunikation im Büro." }
          - { key: c, text: "Über Termine und Präsentationen." }
        answer: b
        why: "Über digitale Kommunikation im Büro."
      - q: "Was schlägt Herr Steinmeyer am Ende vor?"
        options:
          - { key: a, text: "Er schreibt eine neue E-Mail und schlägt einen Termin vor." }
          - { key: b, text: "Er ruft Frau Weber sofort an." }
          - { key: c, text: "Er fragt nach einem anderen Projekt." }
        answer: a
        why: "Er schreibt eine neue E-Mail und schlägt einen Termin vor."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Yuki wohnt in München und {1} sich sehr für japanische und deutsche Podcasts. Heute {2} sie auf eine wichtige {3} von ihrer Universität. Sie hat gestern nach dem Termin für ihre {4} gefragt und {5} auf eine schnelle Antwort. Während sie wartet, {6} sie an ihre Freundin in Osaka und erzählt ihr von ihrem Alltag in Deutschland.
    bank: [interessiert, wartet, Prüfung, Antwort, schreibt, freut, E-Mail, gefragt, Energie, hofft]
    answers:
      "1": interessiert
      "2": wartet
      "3": E-Mail
      "4": Prüfung
      "5": hofft
      "6": schreibt

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Neue Audio-App im Stadtmuseum"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: "Achtung, eine Durchsage. Liebe Besucherinnen und Besucher, das Stadtmuseum bietet ab heute eine neue Audio-App an. Sie können die App kostenlos in unserem Eingangsbereich herunterladen. Mit der App hören Sie spannende Geschichten zu über fünfzig Exponaten. Die App funktioniert in vier Sprachen: Deutsch, Englisch, Französisch und Spanisch. Bitte bringen Sie Ihre eigenen Kopfhörer mit. Wir wünschen Ihnen einen angenehmen Besuch."
    items:
      - q: "Was bietet das Stadtmuseum ab heute an?"
        options:
          - { key: a, text: "Eine neue Audio-App." }
          - { key: b, text: "Eine Sonderausstellung." }
          - { key: c, text: "Eine Rabattaktion." }
        answer: a
        why: '„das Stadtmuseum bietet ab heute eine neue Audio-App an."'
      - q: "Wo kann man die App herunterladen?"
        options:
          - { key: a, text: "Im Museumsshop." }
          - { key: b, text: "Im Eingangsbereich." }
          - { key: c, text: "Im ersten Stock." }
        answer: b
        why: '„Sie können die App kostenlos in unserem Eingangsbereich herunterladen."'
      - q: "In wie vielen Sprachen funktioniert die App?"
        options:
          - { key: a, text: "In zwei Sprachen." }
          - { key: b, text: "In drei Sprachen." }
          - { key: c, text: "In vier Sprachen." }
        answer: c
        why: '„Die App funktioniert in vier Sprachen: Deutsch, Englisch, Französisch und Spanisch."'
      - q: "Was soll man mitbringen?"
        options:
          - { key: a, text: "Eine Kamera." }
          - { key: b, text: "Einen Reiseführer." }
          - { key: c, text: "Kopfhörer." }
        answer: c
        why: '„Bitte bringen Sie Ihre eigenen Kopfhörer mit."'

