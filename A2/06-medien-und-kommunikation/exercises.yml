  - id: B5
    block: B
    type: free-write
    title: "Fragen schreiben"
    prompt: "Write a question using the `wo-` compound (Worauf? Worüber? Woran? Wofür?) or `auf wen?`/`an wen?` when the answer is a person."
    stimulus: |
      1. — Ich warte auf den nächsten Zug. → Worauf wartest du?
      2. — Wir sprechen über das neue Filmprogramm.
      3. — Ich interessiere mich für Dokumentationen.
      4. — Er wartet auf seine Freundin. (person!)
