      "2": Akkusativ
      "3": über
      "4": Akkusativ
      "5": auf
      "6": Akkusativ
      "7": an
      "8": Akkusativ
      "9": über
      "10": Akkusativ
      "11": nach
      "12": Dativ
      "13": auf
      "14": Akkusativ
      "15": für
      "16": Akkusativ
      "17": über
      "18": Akkusativ
