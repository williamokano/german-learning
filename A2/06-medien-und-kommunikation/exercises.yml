  - id: A3
    block: A
    type: single-choice
    title: "Akkusativ oder Dativ nach der Präposition?"
    instructions: "Choose the correct article form. Remember: fragen nach takes Dativ, all others take Akkusativ."
    items:
      - q: "Ich warte auf ____ Bus. (der Bus, m)"
        options:
          - { key: a, text: "den" }
          - { key: b, text: "dem" }
          - { key: c, text: "der" }
        answer: a
        why: "m Akkusativ: der → den."
      - q: "Sie denkt an ____ Familie. (die Familie, f)"
        options:
          - { key: a, text: "die" }
          - { key: b, text: "der" }
          - { key: c, text: "den" }
        answer: a
        why: "f Akkusativ: die → die (unchanged)."
      - q: "Er fragt nach ____ Weg. (der Weg, m)"
        options:
          - { key: a, text: "den" }
          - { key: b, text: "dem" }
          - { key: c, text: "der" }
        answer: b
        why: "m Dativ: der → dem (fragen nach takes Dativ)."
      - q: "Wir sprechen über ____ Problem. (das Problem, n)"
        options:
          - { key: a, text: "das" }
          - { key: b, text: "dem" }
          - { key: c, text: "des" }
        answer: a
        why: "n Akkusativ: das → das (unchanged)."
      - q: "Ich schreibe an ____ Freund. (ein Freund, m)"
        options:
          - { key: a, text: "ein" }
          - { key: b, text: "einen" }
          - { key: c, text: "einem" }
        answer: b
        why: "m Akkusativ indef: ein → einen."
      - q: "Sie fragt nach ____ Adresse. (die Adresse, f)"
        options:
          - { key: a, text: "der" }
          - { key: b, text: "die" }
          - { key: c, text: "den" }
        answer: a
        why: "f Dativ: die → der."
      - q: "Bruno freut sich auf ____ Wochenende. (das Wochenende, n)"
        options:
          - { key: a, text: "dem" }
          - { key: b, text: "das" }
          - { key: c, text: "den" }
        answer: b
        why: "n Akkusativ: das → das (sich freuen auf takes Akk)."
      - q: "Ich ärgere mich über ____ Verbindung. (die Verbindung, f)"
        options:
          - { key: a, text: "der" }
          - { key: b, text: "die" }
          - { key: c, text: "den" }
        answer: b
        why: "f Akkusativ: die → die (unchanged)."

