      "2": N
      "3": R
      "4": N
      "5": R
      "6": R
      "7": R
      "8": N

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen"
    instructions: "Fill in the blanks with the correct reflexive form (Akkusativ or Dativ). 10 gaps."
    text: |
      — Hey Bruno, wie geht es dir?
      — Ehrlich gesagt fühle ich {1} gerade nicht so toll. Ich habe {2}
      erkältet und muss {3} jetzt wirklich ausruhen.
      — Oh nein! Hast du {4} schon etwas aus der Apotheke geholt?
      — Ja, ich habe {5} Hustensaft gekauft. Die Apothekerin hat mir gesagt,
        ich soll {6} warm anziehen und viel Tee trinken.
      — Gute Idee. Ich wünsche {7} gute Besserung!
      — Danke! Ich freue {8} schon darauf, wenn ich {9} wieder besser
        fühle.
      — Ja, ruh {10} gut aus!
    answers:
      "1": mich
      "2": mich
      "3": mich
      "4": dir
      "5": mir
      "6": mich
      "7": mir
      "8": mich
      "9": mich
      "10": dich

  - id: B2
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
    instructions: "Each item has exactly one mistake. The wrong word is shown as a gap — write the correct form (the full corrected word or phrase)."
    text: |
      1. Ich fühle {1} heute nicht gut. (sich → ?)
      2. Anna ruht {2} nach der Arbeit aus. (mich → ?)
      3. Wir freuen {3} auf den Urlaub. (euch → ?)
      4. Er wäscht sich die Hände — er wäscht {4} die Hände. (dir → ?)
      5. Zuerst ärgert Bruno {5} über den Stress. (sich → ?)
      6. Ich kaufe {6} einen neuen Sportschuhe. (mir → ?)
      7. …, weil ich mich nicht gut fühle {7}. (sich → ?)
      8. {8} Sie sich aus! (Ruh → ?)
      9. Sie wünscht sich mehr Energie — Sie wünscht {9} mehr Energie. (mich → ?)
      10. Die Kinder waschen sich die Zähne {10}. (putzen → ?)
    answers:
      "1": mich
      "2": sich
      "3": uns
      "4": sich
      "5": sich
      "6": mir
      "7": "sich entfernen (weglassen)"
      "8": Ruhen
      "9": sich
      "10": putzen

