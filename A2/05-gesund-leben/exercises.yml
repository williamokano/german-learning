    block: A
    type: gap-text
    listLayout: true
    title: "Reflexivpronomen (Akkusativ): Tabelle"
    instructions: "Fill in the Akkusativ reflexive pronoun. Each row has two gaps (subject + pronoun)."
    text: |
      1. {1} — Ich fühle {2} müde.
      2. {3} — Fühlst du {4} besser?
      3. {5} — Er ruht {6} aus.
      4. {7} — Wir freuen {8}!
      5. {9} — Habt ihr {10} erkältet?
      6. {11} — Sie waschen {12}.
    answers:
      "1": ich
      "2": mich
      "3": du
      "4": dich
      "5":
        - er
        - sie
        - es
      "6": sich
      "7": wir
      "8": uns
      "9": ihr
      "10": euch
      "11":
        - sie
        - Sie
      "12": sich

