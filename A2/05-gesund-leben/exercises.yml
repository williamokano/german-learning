  - id: B6
    block: B
    type: free-write
    title: "Körperpflege: Dativ `sich`"
    prompt: "Translate into German using a Dativ reflexive pronoun."
    stimulus: |
      1. I brush my teeth twice a day.
      2. He buys himself vitamins at the pharmacy.
      3. She wishes herself (= wishes for herself) more free time.
      4. We imagine (for ourselves) that we are on holiday.
      5. Do you (du) wash your hands before eating?
      6. Remember this! (du-imperative, `sich merken`)
    model: |
      1. Ich putze mir zweimal täglich die Zähne.
      2. Er kauft sich Vitamine in der Apotheke.
      3. Sie wünscht sich mehr Freizeit.
      4. Wir stellen uns vor, dass wir im Urlaub sind.
      5. Wäschst du dir die Hände vor dem Essen?
      6. Merk dir das!

  - id: B7
    block: B
    type: free-write
    title: "Übersetzen (EN → DE)"
    prompt: "Translate each English sentence into German. Use reflexive verbs (sich fühlen, sich ausruhen, sich ärgern, sich freuen, sich vorstellen, sich anziehen, sich die Zähne putzen, sich entspannen)."
    stimulus: |
