      2. sich setzen (Sie)
      3. sich anziehen (ihr)
      4. sich entspannen (du)
      5. sich waschen (ihr)
      6. sich die Zähne putzen (du)
      7. sich ausruhen (Sie)
      8. sich bewegen (ihr)
    model: |
