    title: "Schreiben: Gesunde Routine an Lena"
    prompt: 'Your language-exchange partner Lena has asked: „Wie lebst du gesund? Hast du Routinen, die dir wirklich helfen?" Write a reply (60–80 words) describing your real or imagined daily health routine and giving her a tip.'
    use:
