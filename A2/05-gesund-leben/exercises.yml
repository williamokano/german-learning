  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Akkusativ oder Dativ? Einsetzen"
    instructions: "Fill in the correct reflexive pronoun (Akkusativ or Dativ)."
    text: |
      1. Anna wäscht {1} jeden Morgen. (Akk)
      2. Bruno kauft {2} neue Laufschuhe. (Dat)
      3. Wir fühlen {3} heute sehr müde. (Akk)
      4. Ich putze {4} zweimal täglich die Zähne. (Dat)
      5. Ihr ruht {5} am Wochenende aus. (Akk)
      6. Er stellt {6} vor, dass er gesünder lebt. (Dat)
      7. Zieht ihr {7} warm an? (Akk)
      8. Sie (she) wünscht {8} mehr Freizeit. (Dat)
      9. Beeilt {9} bitte! (ihr-form, Akk)
      10. Ich merke {10} das für später. (Dat)
    answers:
      "1": sich
      "2": sich
      "3": uns
      "4": mir
      "5": euch
      "6": sich
      "7": euch
      "8": sich
      "9": euch
      "10": mir

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "`sich fühlen`: Konjugation und Sätze"
    instructions: "Conjugate `sich fühlen` and complete the example sentence. The gap is the conjugated form (verb + reflexive pronoun)."
    text: |
      1. ich: Ich {1} heute sehr müde.
      2. du: Wie {2} du dich?
      3. er: Er {3} nicht wohl.
      4. wir: Wir {4} nach dem Urlaub besser.
      5. ihr: {5} ihr euch heute fit?
      6. sie: Sie {6} erschöpft.
    answers:
      "1": "fühle mich"
      "2": "fühlst dich"
      "3": "fühlt sich"
      "4": "fühlen uns"
      "5": "Fühlt euch"
      "6": "fühlen sich"

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "`sich ausruhen`, `sich ärgern`, `sich freuen`: Einsetzen"
    instructions: "Fill in the correct form of the reflexive verb."
    text: |
      1. Anna {1} nach der langen Arbeitswoche. (sich ausruhen)
      2. Bruno {2} oft über den vollen Terminkalender. (sich ärgern)
      3. Ich {3} auf den Yogakurs am Dienstag. (sich freuen — auf)
      4. {4} du dich nach der Schicht {5}? (sich ausruhen, du-form)
      5. Wir {6} {7} immer, wenn wir keine Zeit für Sport haben. (sich ärgern)
      6. {8} ihr {9} auf das Wochenende? (sich freuen — auf, ihr-form)
      7. Er {10} über die Warteschlange in der Apotheke. (sich ärgern)
      8. Sie (she) {11} endlich richtig {12} — sie schläft lange. (sich ausruhen)
    answers:
      "1": "ruht sich aus"
      "2": "ärgert sich"
      "3": "freue mich"
      "4": "Ruhst"
      "5": aus
      "6": "ärgern"
      "7": uns
      "8": Freut
      "9": euch
      "10": "ärgert sich"
      "11": "ruht sich"
      "12": "aus"

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "`sich waschen`, `sich anziehen`, `sich ausziehen`: Morgenroutine"
    instructions: "Fill in the correct form. Watch for Akkusativ vs. Dativ `sich`."
    text: |
      1. Ich {1} jeden Morgen kalt. (sich waschen)
      2. {2} du {3} schon für die Schule? (sich anziehen)
      3. Er {4} {5} nach dem Sport. (sich ausziehen)
      4. Wir {6} {7} schnell — wir haben keine Zeit. (sich anziehen)
      5. Ich wasche {8} die Hände vor dem Essen. (Dat)
      6. Bruno {9} {10} die Hände nach dem Kochen. (sich waschen, Dat)
      7. {11} ihr {12} warm {13}? Es ist kalt draußen. (sich anziehen)
      8. Anna {14} {15} einen Schal {16} — es ist Winter. (sich anziehen — Dat)
    answers:
      "1": "wasche mich"
      "2": "Ziehst du dich"
      "3": "schon"
      "4": "zieht sich"
      "5": "aus"
      "6": "ziehen uns"
      "7": "an"
      "8": "mir"
      "9": "wäscht sich"
      "10": "die Hände nach dem Kochen"
      "11": "Zieht ihr euch"
      "12": "warm"
      "13": "an"
      "14": "zieht sich"
      "15": "einen Schal"
      "16": "an"

  - id: A7
    block: A
    type: free-write
    title: "Satzstellung: Position von `sich`"
    prompt: "Build correct German sentences with the given elements. The first word is given. Place `sich` in the correct position."
    stimulus: |
      1. [Ich] — fühle – mich – nicht – gut
      2. [Heute] — ärgert – sich – Bruno – über – den – Stress
      3. [Anna] — ruht – sich – am – Wochenende – aus
      4. [Wir] — freuen – uns – auf – den – Urlaub
      5. [Morgens] — wäscht – sich – er – kalt
      6. [Ihr] — beeilt – euch – bitte
    model: |
      1. Ich fühle mich nicht gut.
      2. Heute ärgert sich Bruno über den Stress.
      3. Anna ruht sich am Wochenende aus.
      4. Wir freuen uns auf den Urlaub.
      5. Morgens wäscht er sich kalt.
      6. Ihr beeilt euch bitte.

  - id: A8
    block: A
    type: free-write
    title: "Nebensatz: `sich` im Nebensatz"
    prompt: "Combine the sentences using `weil`. Watch where `sich` goes."
    stimulus: |
      1. Anna freut sich. Sie hat einen neuen Yogakurs gefunden.
      2. Bruno ärgert sich. Er hat keine Zeit für Sport.
      3. Ich fühle mich nicht gut. Ich habe mich nicht ausgeruht.
      4. Wir entspannen uns. Wir kochen zusammen.
      5. Er zieht sich warm an. Es ist sehr kalt.
    model: |
      1. Anna freut sich, weil sie einen neuen Yogakurs gefunden hat.
      2. Bruno ärgert sich, weil er keine Zeit für Sport hat.
      3. Ich fühle mich nicht gut, weil ich mich nicht ausgeruht habe.
      4. Wir entspannen uns, weil wir zusammen kochen.
      5. Er zieht sich warm an, weil es sehr kalt ist.

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "`sich etwas wünschen` und `sich etwas vorstellen`"
    instructions: "Fill in: mir, dir, sich, uns, euch (Dativ). The reflexive pronoun is in Dativ because there's a separate Akkusativ object (e.g. mehr Energie, das)."
    text: |
      1. Ich wünsche {1} mehr Energie.
      2. Was wünschst du {2}?
      3. Er kann {3} das nicht vorstellen.
      4. Wir stellen {4} vor, dass wir am Strand liegen.
      5. Stellt ihr {5} das wirklich vor?
      6. Sie (pl.) wünschen {6} ein ruhiges Wochenende.
    answers:
      "1": mir
      "2": dir
      "3": sich
      "4": uns
      "5": euch
      "6": sich

  - id: A10
    block: A
    type: free-write
    title: "Imperativ reflexiver Verben"
    prompt: "Write the imperative for the given person. Each item is a reflexive verb in the imperative form."
    stimulus: |
