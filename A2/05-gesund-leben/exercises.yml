  - id: A11
    block: A
    type: gap-text
    listLayout: true
    title: "Reflexiv oder nicht? Entscheiden"
    instructions: "Mark R (reflexiv) or N (nicht reflexiv). The gap is R or N."
    text: |
      1. Ich wasche {1}. (mich / das Auto)
      2. Ich wasche {2}. (mich / das Auto) — second variant
      3. Er zieht {3} an. (sich / die Jacke)
      4. Er zieht {4} an. (sich / die Jacke)
      5. Anna freut {5} über das Geschenk. (sich / die Jacke)
      6. Anna kauft {6} ein neues Fahrrad. (sich / die Tasche)
      7. Wir sehen {7} morgen. (uns / den Film)
      8. Wir sehen {8} morgen. (uns / den Film) — variant
    answers:
