      "2": g
      "3": b
      "4": e
      "5": f
      "6": a
      "7": h
      "8": d

  - id: B4
    block: B
    type: order
    title: "Satzbau: Reflexivverben"
    instructions: "Put the words in the right order."
    items:
      - tiles: [uns, Heute, sehr, wir, fühlen, gut]
        answer: [1, 4, 3, 0, 2, 5]
