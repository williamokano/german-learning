      2. {3} — Was wünschst du {4}?
      3. {5} — Er kauft {6} Vitamintabletten.
      4. {7} — Wir kaufen {8} ein Fahrrad.
      5. {9} — Kauft ihr {10} Sportschuhe?
      6. {11} — Sie putzen {12} die Zähne.
    answers:
