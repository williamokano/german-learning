lesson: A2/05
title: "A2 · Lektion 5 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - { q: "Bruno fühlt sich diese Woche nicht gut.", answer: true, why: 'Bruno sagt: „Ich fühle mich nicht so toll."' }
      - { q: "Anna ärgert sich über ihren Yogakurs.", answer: false, why: "Anna freut sich über ihren Yogakurs; sie ärgert sich nicht darüber." }
      - { q: "Anna ernährt sich ausgewogen und isst wenig Zucker.", answer: true, why: "Anna sagt: viel Gemüse, wenig Zucker." }
      - { q: "Bruno hat vor, morgen früh joggen zu gehen.", answer: true, why: "Bruno sagt: Ich ziehe mich morgen früh zum Joggen an." }

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Herr Steinmeyer fühlt sich müde, weil …"
        options:
          - { key: a, text: "er sich nicht ausreichend bewegt hat." }
          - { key: b, text: "er sich bei der Arbeit sehr gestresst fühlt." }
          - { key: c, text: "er sich erkältet hat." }
        answer: b
        why: "Er fühlt sich bei der Arbeit sehr gestresst."
      - q: "Was empfiehlt die Apothekerin gegen den Stress?"
        options:
          - { key: a, text: "Dreimal täglich eine Tablette nehmen." }
          - { key: b, text: "Mehr Wasser trinken und Sport machen." }
          - { key: c, text: "Ein Magnesiumpräparat nehmen und sich jeden Abend entspannen." }
        answer: c
        why: "Magnesiumpräparat + 15 Min. ohne Bildschirm."
      - q: "Wie lange hat Herr Steinmeyer die Beschwerden schon?"
        options:
          - { key: a, text: "Seit einer Woche." }
          - { key: b, text: "Seit drei Tagen." }
          - { key: c, text: "Seit zwei Wochen." }
        answer: b
        why: "Seit drei Tagen."
      - q: "Was sagt die Apothekerin über Bildschirme?"
        options:
          - { key: a, text: "Herr Steinmeyer soll mehr fernsehen, um sich zu entspannen." }
          - { key: b, text: "Er soll sich abends ohne Bildschirm entspannen." }
          - { key: c, text: "Er soll sich nur noch eine Stunde pro Tag mit dem Bildschirm beschäftigen." }
        answer: b
        why: "Sich abends ohne Bildschirm entspannen."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 7 missing words. Three words in the box are not needed."
    text: |
      Yuki wohnt in München und fühlt sich gerade nicht so gut. Sie hat sich letzte Woche {1} und muss sich jetzt {2}. Am Dienstag ist sie in die Apotheke gegangen und hat sich ein {3} gegen Husten geholt. Die Apothekerin hat ihr geraten, sich viel Tee zu trinken und sich {4} anzuziehen. Yuki {5} sich, dass sie sich bald wieder besser fühlt — sie {6} sich schon auf ihren nächsten {7}.
    bank: [erkältet, ausruhen, Medikament, Sportkurs, freut, wünscht, warm, kalt, anziehen, erholt]
    answers:
      "1": erkältet
      "2": ausruhen
      "3": Medikament
      "4": warm
      "5": wünscht
      "6": freut
      "7": Sportkurs

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anrufbeantworter Arztpraxis"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the answerphone message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: "Guten Tag, Sie haben den Anrufbeantworter der Praxis Dr. Berger erreicht. Sie haben einen Termin für eine Vorsorgeuntersuchung am Donnerstag, dem zwölften Juni, um neun Uhr dreißig. Bitte bringen Sie Ihre Versichertenkarte und den Impfpass mit. Falls Sie den Termin nicht wahrnehmen können, sagen Sie bitte mindestens vierundzwanzig Stunden vorher ab. Bitte rufen Sie uns bis Donnerstag zurück, wenn Sie den Termin verschieben möchten. Vielen Dank und bis Donnerstag!"
    items:
      - q: "Wo arbeitet Dr. Berger?"
        options:
          - { key: a, text: "In einer Apotheke." }
          - { key: b, text: "In einer Arztpraxis." }
          - { key: c, text: "In einem Krankenhaus." }
        answer: b
        why: '„Sie haben den Anrufbeantworter der Praxis Dr. Berger erreicht."'
      - q: "Wann ist der Termin?"
        options:
          - { key: a, text: "Am Donnerstag, dem zwölften Juni." }
          - { key: b, text: "Am Dienstag, dem zehnten Juni." }
          - { key: c, text: "Am Freitag, dem dreizehnten Juni." }
        answer: a
        why: "Donnerstag, dem zwölften Juni."
      - q: "Was soll man mitbringen?"
        options:
          - { key: a, text: "Einen Ausweis und Bargeld." }
          - { key: b, text: "Die Versichertenkarte und den Impfpass." }
          - { key: c, text: "Nur den Personalausweis." }
        answer: b
        why: "Versichertenkarte und Impfpass."
      - q: "Wie viele Stunden vorher muss man absagen?"
        options:
          - { key: a, text: "Zwölf Stunden." }
          - { key: b, text: "Vierundzwanzig Stunden." }
          - { key: c, text: "Achtundvierzig Stunden." }
        answer: b
        why: "Vierundzwanzig Stunden."

