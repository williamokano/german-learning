      > Hallo! Ich bin Katja, 30 Jahre alt, und ich lebe seit zwei Jahren in Hamburg. Früher habe ich mich nie um meine Gesundheit gekümmert — ich habe mich immer gestresst gefühlt und wenig geschlafen. Dann habe ich angefangen, mich regelmäßig zu bewegen. Ich gehe jetzt dreimal pro Woche schwimmen. Ich fühle mich seitdem viel besser und ärgere mich weniger über Kleinigkeiten. Ich ernähre mich auch bewusster: Ich kaufe mir frische Lebensmittel auf dem Markt und koche selbst. Ich wünsche mir, dass ich das noch lange so mache. Habt ihr ähnliche Erfahrungen gemacht?

