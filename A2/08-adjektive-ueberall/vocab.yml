# Reviewed from A2/08 lesson.md §4 Wortschatz.
# Bootstrapped with build/import-vocab.ts; the parser captured 48 entries.
#
# Parser gap findings (lesson-specific):
#   - The lesson's three Wortschatz tables all use a bilingual header
#     (`| Noun (article + plural) | English |` for clothing,
#      `| German | English |` for colors/patterns, and the descriptive-adjective
#     table is also bilingual). They parse correctly as `noun-english` /
#     `bilingual`, BUT:
#       • colors and descriptive adjectives that the parser routes as "bare
#         lowercase single word" get a stale `reviewNote` of
#         "adjective — confirm pos / fill gloss" even when the gloss IS filled
#         (the bilingual-table path doesn't carry a gloss into the bare-lowercase
#         fallback the way noun-english does).
#       • Four adjectives were misclassified as `pos: verb` by the bare-lowercase
#         fallback path: `braun`, `grün`, `schön`, `dünn`. None of them are verbs
#         — they're all adjective lemmas from the colors/descriptive tables.
#         Hand-passed back to `pos: adjective`.
#       • Two "double entries" cells — `dunkelblau / hellblau` and `lila / violett`
#         — were captured as one `pos: phrase` row with a double-space artefact
#         ("dunkelblau  hellblau"). Split into two adjective entries each.
#       • `die Stiefel (pl.) / der Stiefel` — the clothing-table cell starts with
#         "die Stiefel (pl.)" (the plural-first listing the lesson uses), but the
#         singular masculine "der Stiefel" is the lemma form learners actually
#         need. Hand-corrected to `der Stiefel, Stiefel` (matching the A1/09
#         convention: singular masculine, plural = singular).
#       • `der Schal` was captured with `plural: null` + `needsReview: true` +
#         "check plural" because the lesson uses `der Schal, -s / -e` (either
#         plural acceptable). Set to `Schals` (matches A1/09).
#
# Section structure in lesson.md:
#   Kleidungsstücke (clothing items)        — 16 nouns from §4.1
#   Farben und Muster (colors & patterns)   — 16 adjective lemmas from §4.2
#                                             (2 split cells → 18 entries)
#   Beschreibende Adjektive (descriptive)   — 16 adjective lemmas from §4.3
lesson: A2/08

