lesson: A2/08
title: "A2 · Lektion 8 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - { q: "Anna möchte eine schwarze Jacke kaufen.", answer: true, why: "Anna möchte eine schwarze Jacke kaufen." }
      - { q: "Die Jacke, die Anna sieht, hat einen blauen Kragen.", answer: false, why: "Die Jacke hat einen roten Kragen, nicht einen blauen." }
      - { q: "Bruno findet den grünen Schal passend zur Jacke.", answer: true, why: "Bruno findet den grünen Schal passend." }
      - { q: "Am Ende kauft Anna nur die Jacke, aber nicht den Schal.", answer: false, why: "Anna kauft sowohl die Jacke als auch den Schal." }

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Frau Weber sucht ein Geschenk für …"
        options:
          - { key: a, text: "ihre Tochter" }
          - { key: b, text: "ihren Mann" }
          - { key: c, text: "ihren Sohn" }
        answer: b
        why: "ihren Mann."
      - q: "Welche Farbe bevorzugt Frau Webers Mann?"
        options:
          - { key: a, text: "Helle Farben wie Weiß und Gelb" }
          - { key: b, text: "Dunkle Farben wie Marineblau und Schwarz" }
          - { key: c, text: "Bunte Farben wie Rot und Grün" }
        answer: b
        why: "Dunkle Farben wie Marineblau und Schwarz."
      - q: "Was empfiehlt Herr Steinmeyer zuerst?"
        options:
          - { key: a, text: "Ein weißes Hemd" }
          - { key: b, text: "Einen marineblauen Anzug" }
          - { key: c, text: "Einen marineblauen Pullover" }
        answer: c
        why: "Einen marineblauen Pullover."
      - q: "Was nimmt Frau Weber am Ende?"
        options:
          - { key: a, text: "Nur den Pullover" }
          - { key: b, text: "Den Pullover und das Hemd" }
          - { key: c, text: "Den Pullover und eine Krawatte" }
        answer: b
        why: "Den Pullover und das Hemd."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 7 missing words. Three words in the box are not needed."
    text: |
      Yuki wohnt in München und hat heute einen {1} Termin. Sie zieht sich sorgfältig an. Zuerst wählt sie ein {2} Hemd und eine {3} Hose. Dann sucht sie eine passende Jacke — sie findet eine {4} {5} Jacke im Schrank. Mit dem neuen Outfit fühlt sie sich {6}. Schließlich nimmt sie noch eine {7} schwarze Tasche und verlässt die Wohnung.
    bank: [wichtigen, weißes, dunkle, elegante, graue, selbstbewusst, kleine, nervös, bunte, schwarze]
    answers:
      "1": wichtigen
      "2": weißes
      "3": dunkle
      "4": elegante
      "5": graue
      "6": selbstbewusst
      "7": kleine

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Modenschau im Modehaus"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Achtung, eine Durchsage. Liebe Kundinnen und Kunden, unser Modehaus „Stilvoll" lädt Sie herzlich zur neuen Frühjahrskollektion ein. Ab fünfzehn Uhr gibt es eine exklusive Modenschau im ersten Stock. Außerdem bieten wir heute zwanzig Prozent Rabatt auf alle Sommermäntel und elegante Blusen. Die Aktion gilt nur bis achtzehn Uhr und nur heute. Wir freuen uns auf Ihren Besuch.'
    items:
      - q: 'Wozu lädt das Modehaus „Stilvoll" ein?'
        options:
          - { key: a, text: "Zu einer Modenschau." }
          - { key: b, text: "Zur neuen Frühjahrskollektion und einer Modenschau." }
          - { key: c, text: "Zu einem großen Sale." }
        answer: b
        why: "Zur neuen Frühjahrskollektion und einer Modenschau."
      - q: "Wann beginnt die Modenschau?"
        options:
          - { key: a, text: "Um vierzehn Uhr." }
          - { key: b, text: "Um fünfzehn Uhr." }
          - { key: c, text: "Um sechzehn Uhr." }
        answer: b
        why: "Ab fünfzehn Uhr."
      - q: "Wie viel Rabatt gibt es auf Sommermäntel?"
        options:
          - { key: a, text: "Zehn Prozent." }
          - { key: b, text: "Fünfzehn Prozent." }
          - { key: c, text: "Zwanzig Prozent." }
        answer: c
        why: "Zwanzig Prozent."
      - q: "Bis wann gilt die Rabattaktion?"
        options:
          - { key: a, text: "Nur bis heute achtzehn Uhr." }
          - { key: b, text: "Bis morgen." }
          - { key: c, text: "Bis Ende der Woche." }
        answer: a
        why: "Nur bis achtzehn Uhr und nur heute."

