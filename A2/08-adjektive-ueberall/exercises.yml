  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen"
    instructions: "Fill in the blanks with the adjective in the correct form. 12 gaps."
    text: |
      — Entschuldigung, ich suche eine Jacke für meinen Bruder. Er mag {1} (dunkel) Farben.
      — Sehr gut. Wir haben diesen {2} (schwarz) Mantel hier — er ist sehr {3} (elegant).
      — Hm, der {4} (schwarz) Mantel ist sehr schön, aber etwas zu groß. Haben Sie einen {5} (klein) ?
      — Ja, hier ist ein {6} (ähnlich) Modell in einer {7} (klein) Größe. Und dieser {8} (grau) Mantel ist auch eine gute Alternative.
      — Ich finde den {9} (grau) Mantel besser. Haben Sie auch ein {10} (passend) Hemd dazu?
      — Natürlich! Dieses {11} (weiß) Hemd passt sehr gut zum {12} (grau) Mantel.
      — Perfekt, ich nehme beides.
    answers:
      "1": dunkle
      "2": schwarzen
      "3": elegant
      "4": schwarze
      "5": kleineren
      "6": ähnliches
      "7": kleineren
      "8": graue
      "9": grauen
      "10": passendes
      "11": weiße
      "12": grauen

