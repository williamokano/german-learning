      2. Ich kaufe den rot{2} Schal. (Akk Mask def. → ?)
      3. Sie trägt eine elegant{3} Bluse. (Akk Fem indef. → ?)
      4. Er sucht ein neu{4} Hemd. (Akk Neut indef. → ?)
      5. Das ist der schön{5} Abend! *(indefinite article intended)* (Nom Mask indef. → ?)
      6. Er kommt mit dem neu{6} Freund. (Dat Mask def. → ?)
      7. Das sind keine alt{7} Schuhe. (Pl → ?)
      8. Sie mag das schwarz{8} Kleid. (Akk Neut def. → ?)
      9. Er trägt ein elegant{9} Anzug. (m → article + ending)
      10. Mit der blau{10} Jacke siehst du toll aus. (Dat Fem def. → ?)
    answers:
      "1": er
      "2": en
      "3": e
      "4": es
      "5": er
      "6": en
      "7": en
      "8": e
      "9": "en (and article should be einen)"
      "10": en

