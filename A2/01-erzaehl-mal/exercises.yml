  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Präteritum der Modalverben: Sätze"
    instructions: "Fill in the correct Präteritum form."
    text: |-
      1. Ich {1} (müssen) gestern früh aufstehen.
      2. Er {2} (wollen) nach Hamburg fahren.
      3. Wir {3} (können) kein Taxi finden.
      4. Du {4} (dürfen) nicht fotografieren.
      5. Sie (she) {5} (sollen) um acht ankommen.
      6. Ihr {6} (müssen) lange warten.
      7. Ich {7} (wollen) schon immer nach Wien reisen.
      8. Er {8} (können) das nicht verstehen.
      9. Wir {9} (dürfen) das Museum nicht betreten.
      10. {10} (sollen) sie heute arbeiten?
    answers:
      "1": musste
      "2": wollte
      "3": konnten
      "4": durftest
      "5": sollte
      "6": musstet
      "7": wollte
      "8": konnte
      "9": durften
      "10": Sollten

  - id: A7
    block: A
    type: order
    title: "Zeitkonnektoren: Sätze ordnen"
    instructions: "Reorder the words to make a correct sentence. The time connector starts each sentence."
    items:
      - tiles: [zuerst, haben, wir, "das Museum", besucht]
        answer: [0, 1, 2, 3, 4]
        note: "Zuerst haben wir das Museum besucht."
      - tiles: [dann, sind, "in die Oper", wir, gegangen]
        answer: [0, 1, 3, 2, 4]
        note: "Dann sind wir in die Oper gegangen."
      - tiles: [danach, hat, "ein Stück Kuchen", Anna, gegessen]
        answer: [0, 1, 3, 2, 4]
        note: "Danach hat Anna ein Stück Kuchen gegessen."
      - tiles: [schließlich, sind, wir, "nach Hause", gefahren]
        answer: [0, 1, 2, 3, 4]
        note: "Schließlich sind wir nach Hause gefahren."
      - tiles: ["am Ende", war, er, "sehr müde"]
        answer: [0, 1, 2, 3]
        note: "Am Ende war er sehr müde."
      - tiles: [dann, habe, ich, "meine Mutter", angerufen]
        answer: [0, 1, 2, 3, 4]
        note: "Dann habe ich meine Mutter angerufen."

  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "haben oder sein? (Perfekt)"
    instructions: "Choose the correct auxiliary."
    text: |-
      1. Bruno {1} nach Hamburg gefahren.
      2. Anna {2} ein Buch gelesen.
      3. Wir {3} ins Restaurant gegangen.
      4. Ich {4} meinen Cousin besucht.
      5. Er {5} um acht aufgestanden.
      6. Sie (they) {6} die Stadt besichtigt.
      7. Das Konzert {7} um acht begonnen.
      8. Ich {8} nach Berlin umgezogen.
      9. Du {9} die Karten reserviert.
      10. Wann {10} du angekommen?
    answers:
      "1": ist
      "2": hat
      "3": sind
      "4": habe
      "5": ist
      "6": haben
      "7": hat
      "8": bin
      "9": hast
      "10": bist

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Gemischte Perfekt-Formen"
    instructions: "Write the complete Perfekt form (subject + auxiliary + Partizip II)."
    text: |-
      1. ich / fotografieren → {1}
      2. du / vergessen / den Termin → {2}
      3. er / besuchen / die Stadt → {3}
      4. wir / aussteigen → {4}
      5. ihr / studieren / in Wien → {5}
      6. sie (she) / umziehen → {6}
      7. Sie / bekommen / den Brief → {7}
      8. ich / anrufen / meine Freundin → {8}
    answers:
      "1": "Ich habe fotografiert."
      "2": "Du hast den Termin vergessen."
      "3": "Er hat die Stadt besucht."
      "4": "Wir sind ausgestiegen."
      "5": "Ihr habt in Wien studiert."
      "6": "Sie ist umgezogen."
      "7": "Sie haben den Brief bekommen."
      "8": "Ich habe meine Freundin angerufen."

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Zeitkonnektoren: Lücken füllen"
    instructions: "Fill in: `zuerst`, `dann`, `danach`, `schließlich`, `am Ende`."
    text: |-
      Gestern war ein langer Tag! {1} habe ich um sechs Uhr gefrühstückt.
      {2} bin ich mit dem Zug nach Hamburg gefahren — das hat drei Stunden
      gedauert. {3} habe ich meinen Freund am Bahnhof getroffen und wir
      haben die Stadt besichtigt. {4} sind wir in ein Restaurant gegangen
      und haben Fisch gegessen. {5} war ich sehr satt und müde, aber es
      hat mir sehr gut gefallen!
    answers:
      "1": Zuerst
      "2": Dann
      "3": Danach
      "4": Schließlich
      "5": "Am Ende"

  - id: A11
    block: A
    type: gap-text
    listLayout: true
    title: "Präteritum statt Perfekt (Modalverben)"
    instructions: "Rewrite these Perfekt modal forms as natural Präteritum forms."
    text: |-
      1. Ich habe kommen müssen. → {1}
      2. Er hat nicht gehen wollen. → {2}
      3. Wir haben nicht bleiben dürfen. → {3}
      4. Sie hat früher aufstehen müssen. → {4}
      5. Habt ihr wirklich warten müssen? → {5}
    answers:
      "1": "Ich musste kommen."
      "2": "Er wollte nicht gehen."
      "3": "Wir durften nicht bleiben."
      "4": "Sie musste früher aufstehen."
      "5": "Musstet ihr wirklich warten?"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen"
    instructions: "Fill in the blanks with the correct form (Perfekt or Präteritum modal)."
    text: |-
      — Hey Anna! Wie war dein Wochenende?
      — Super! Ich {1} (besuchen) eine Ausstellung im Museum.
      — Echt? Was für eine Ausstellung?
      — Über russische Kunst. Zuerst {2} ich lange in der Schlange (warten) —
        das {3} (sein) ein bisschen langweilig. Dann {4} wir endlich
        (reinkommen / hineinkommen).
      — Und wie war es?
      — Wirklich toll! Ich {5} alles (fotografieren) — oder {6} du, dass
        man da nicht fotografieren (dürfen — Präteritum)?
      — Stimmt! Man {7} nicht fotografieren (dürfen — Präteritum).
        {8} du trotzdem Fotos (machen)?
      — Nein natürlich nicht! Am Ende {9} ich ein Buch über die Ausstellung
        (kaufen). Es war wirklich schön!
    answers:
      "1": habe
      "2": musste
      "3": war
      "4":
        - konnten
        - sind
      "5": habe
      "6": wusstest
      "7": durfte
      "8": Hast
      "9": habe

  - id: B2
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
    instructions: "Each sentence has exactly **one** mistake. Write the corrected sentence."
    text: |-
      1. Ich habe meine Freundin begesucht. → {1}
      2. Wir haben in Paris gestudiert. → {2}
      3. Er ist nach Berlin geumgezogen. → {3}
      4. Ich musste früh aufstanden. → {4}
      5. Zuerst wir sind in die Stadt gegangen. → {5}
      6. Sie hat das Restaurant reservert. → {6}
      7. Ich habe kein Taxi gefunden können. → {7}
      8. Das Glas hat zergebrochen. → {8}
      9. Wolltest du nach Wien gefahren? → {9}
      10. Er hat alles vergessen — er ist einen schlechten Tag gehabt. (Hint: *vergessen* is fine; find the error in the other clause.) → {10}
    answers:
      "1": "Ich habe meine Freundin besucht."
      "2": "Wir haben in Paris studiert."
      "3": "Er ist nach Berlin umgezogen."
      "4": "Ich musste früh aufstehen."
      "5": "Zuerst sind wir in die Stadt gegangen."
      "6": "Sie hat das Restaurant reserviert."
      "7": "Ich konnte kein Taxi finden."
      "8": "Das Glas ist zerbrochen."
      "9": "Wolltest du nach Wien fahren?"
      "10": "Er hat alles vergessen — er hat einen schlechten Tag gehabt."

