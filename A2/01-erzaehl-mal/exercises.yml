      - { key: b, text: "Nein, ich musste arbeiten." }
      - { key: c, text: "Ich habe meine Eltern besucht." }
      - { key: d, text: "Was ist passiert?" }
      - { key: e, text: "Sehr schön — es hat mir gut gefallen!" }
      - { key: f, text: "Nein, leider nicht — ich musste früh aufstehen." }
      - { key: g, text: "Vor zwei Jahren, im Oktober." }
      - { key: h, text: "Ja, wirklich sehr! Ich wollte schon lange dahin." }
    answers:
      "1": c
      "2": e
      "3": a
      "4": b
      "5": d
      "6": f
      "7": g
      "8": h

