lesson: A2/01
title: "A2 · Lektion 1 — Übungen"
intro: >
  Blocks: **H** Hören → **A** Basistraining → **B** Vertiefung → **C** Prüfungstraining →
  **D** Wiederholung & Selbsttest. Answers in `solutions.md`.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: **Richtig (R)** oder **Falsch (F)**?"
    items:
      - q: "Bruno hat sein Wochenende in Hamburg verbracht."
        answer: true
        why: 'Bruno erzählt von seinem Wochenende in Hamburg.'
      - q: "Er ist mit dem Flugzeug nach Hamburg gefahren."
        answer: false
        why: 'Er ist mit dem Zug gefahren, nicht mit dem Flugzeug.'
      - q: "Bruno und sein Cousin haben den Hafen besichtigt."
        answer: true
        why: 'Sie haben am Samstag den Hafen besichtigt.'
      - q: "Am Ende hat Bruno im Restaurant übernachtet."
        answer: false
        why: "Am Ende ist Bruno nach Berlin zurückgefahren; er hat nicht im Restaurant übernachtet."

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Herr Steinmeyer war im Urlaub in …"
        options:
          - { key: a, text: "Salzburg" }
          - { key: b, text: "Wien" }
          - { key: c, text: "Berlin" }
        answer: b
        why: "Herr Steinmeyer war im Urlaub in Wien."
      - q: "Was haben Herr und Frau Steinmeyer zuerst gemacht?"
        options:
          - { key: a, text: "Sie sind in die Oper gegangen." }
          - { key: b, text: "Sie haben das Kunsthistorische Museum besucht." }
          - { key: c, text: "Sie haben im Café gefrühstückt." }
        answer: b
        why: "Zuerst haben sie das Kunsthistorische Museum besucht."
      - q: "Was hat die Tochter gemacht, während die Eltern in der Oper waren?"
        options:
          - { key: a, text: "Sie ist ins Hotel gegangen und hat einen Film geschaut." }
          - { key: b, text: "Sie hat im Café gewartet." }
          - { key: c, text: "Sie hat auch die Oper besucht." }
        answer: a
        why: "Die Tochter ist ins Hotel gegangen und hat einen Film geschaut."
      - q: "Wie lange waren sie in Wien?"
        options:
          - { key: a, text: "drei Tage" }
          - { key: b, text: "eine Woche" }
          - { key: c, text: "zwei Wochen" }
        answer: b
        why: "Sie waren eine Woche in Wien."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 8 missing words. **Three words in the box are not needed.**"
    text: |-
      Anna hat gestern einen interessanten Tag {1}. Zuerst hat sie eine
      E-Mail von ihrer Freundin in Russland {2}. Dann hat sie zwei Stunden
      lang {3} — das hat sehr gut getan. Danach ist sie in die Stadt
      {4} und hat ein Buch über deutsche Geschichte {5}. Schließlich
      hat sie das Buch im Park {6} und einen Kaffee {7}. Am Ende
      war sie sehr {8}, aber glücklich.
    bank: [bekommen, gelesen, gekauft, telefoniert, getrunken, geschrieben, gegangen, erlebt, müde, glücklich, schläfrig]
    answers:
      "1": erlebt
      "2": bekommen
      "3": telefoniert
      "4": gegangen
      "5": gekauft
      "6": gelesen
      "7": getrunken
      "8": müde

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Lisas Kurztrip nach Dresden"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the voice message. Then choose the correct answer (a, b, or c). Listen **once** before reading the transcript below."
    transcript: "Hallo Anna, hier ist Lisa. Ich rufe an wegen meinem Kurztrip nach Dresden. Ich bin am Freitag mit dem Zug gefahren und habe dort zwei Tage verbracht. Am Samstag habe ich die Frauenkirche besucht und bin dann durch die Altstadt spaziert. Abends habe ich in einem kleinen Restaurant gegessen. Am Sonntag habe ich das Grüne Gewölbe besucht — das Museum war fantastisch! Bitte ruf mich zurück, damit ich dir alles genauer erzählen kann! Bis bald!"
    items:
      - q: "Wohin ist Lisa gefahren?"
        options:
          - { key: a, text: "Nach Dresden." }
          - { key: b, text: "Nach Hamburg." }
          - { key: c, text: "Nach Leipzig." }
        answer: a
        why: '„Ich rufe an wegen meinem Kurztrip nach Dresden."'
      - q: "Wie lange ist Lisa geblieben?"
        options:
          - { key: a, text: "Einen Tag." }
          - { key: b, text: "Zwei Tage." }
          - { key: c, text: "Drei Tage." }
        answer: b
        why: '„Ich bin am Freitag mit dem Zug gefahren und habe dort zwei Tage verbracht."'
      - q: "Was hat Lisa am Samstag besucht?"
        options:
          - { key: a, text: "Die Frauenkirche." }
          - { key: b, text: "Die Semperoper." }
          - { key: c, text: "Das Museum." }
        answer: a
        why: '„Am Samstag habe ich die Frauenkirche besucht."'
      - q: "Was hat Lisa am Samstagabend gemacht?"
        options:
          - { key: a, text: "Sie ist im Hotel geblieben." }
          - { key: b, text: "Sie hat in einem Restaurant gegessen." }
          - { key: c, text: "Sie hat ein Konzert besucht." }
        answer: b
        why: '„Abends habe ich in einem kleinen Restaurant gegessen."'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Partizip II: ge- oder nicht?"
    instructions: "Write the Partizip II for each verb. Mark ✓ (has ge-) or ✗ (no ge-) in the brackets."
    text: |-
      1. machen → {1} ( )  2. besuchen → {2} ( )  3. studieren → {3} ( )
      4. fahren → {4} ( )  5. vergessen → {5} ( )  6. kaufen → {6} ( )
      7. telefonieren → {7} ( )  8. aufstehen → {8} ( )  9. bekommen → {9} ( )
      10. reservieren → {10} ( )  11. gehen → {11} ( )  12. erklären → {12} ( )
    answers:
      "1": gemacht
      "2": besucht
      "3": studiert
      "4": gefahren
      "5": vergessen
      "6": gekauft
      "7": telefoniert
      "8": aufgestanden
      "9": bekommen
      "10": reserviert
      "11": gegangen
      "12": erklärt

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Inseparable verbs: Partizip II"
    instructions: "Fill in the correct Partizip II. All verbs here are inseparable."
    text: |-
      1. Ich habe alles {1} (verstehen).
      2. Wann hast du das {2} (entscheiden)?
      3. Sie hat den Brief {3} (bekommen).
      4. Er hat den Termin {4} (vergessen).
      5. Wir haben die Tour {5} (beginnen).
      6. Hast du die Frage {6} (beantworten)?
      7. Das Glas ist {7} (zerbrechen).
      8. Der Lehrer hat die Regel {8} (erklären).
      9. Ich habe eine neue Stelle {9} (bekommen).
      10. Das Konzert hat um acht Uhr {10} (beginnen).
    answers:
      "1": verstanden
      "2": entschieden
      "3": bekommen
      "4": vergessen
      "5": begonnen
      "6": beantwortet
      "7": zerbrochen
      "8": erklärt
      "9": bekommen
      "10": begonnen

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "-ieren verbs: Perfekt sentence"
    instructions: "Form the Perfekt sentence."
    text: |-
      1. ich / studieren / in Berlin → {1}
      2. er / telefonieren / eine Stunde / lang → {2}
      3. wir / reservieren / ein Tisch → {3}
      4. sie (she) / fotografieren / die Stadt → {4}
      5. was / passieren / mit dir? → {5}
      6. ich / reservieren / zwei Karten → {6}
    answers:
      "1": "Ich habe in Berlin studiert."
      "2": "Er hat eine Stunde lang telefoniert."
      "3": "Wir haben einen Tisch reserviert."
      "4": "Sie hat die Stadt fotografiert."
      "5": "Was ist dir passiert?"
      "6": "Ich habe zwei Karten reserviert."

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Separable verbs: Partizip II"
    instructions: "Form the Partizip II, then use it in a sentence."
    text: |-
      1. aufstehen → {1}  Ich bin früh {2}.
      2. anrufen → {3}  Hast du deine Mutter {4}?
      3. einkaufen → {5}  Wir haben im Supermarkt {6}.
      4. ausgehen → {7}  Seid ihr gestern {8}?
      5. umziehen → {9}  Er ist nach Berlin {10}.
      6. einladen → {11}  Ich habe alle {12}.
      7. abholen → {13}  Sie hat mich vom Bahnhof {14}.
      8. anfangen → {15}  Wann hat der Kurs {16}?
    answers:
      "1": aufgestanden
      "2": aufgestanden
      "3": angerufen
      "4": angerufen
      "5": eingekauft
      "6": eingekauft
      "7": ausgegangen
      "8": ausgegangen
      "9": umgezogen
      "10": umgezogen
      "11": eingeladen
      "12": eingeladen
      "13": abgeholt
      "14": abgeholt
      "15": angefangen
      "16": angefangen

