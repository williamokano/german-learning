# Reviewed from A2/01 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
# All 38 entries extracted, 5 still flagged `needsReview` — every one resolved here.
#
# Parser gaps surfaced and fixed by hand:
#   1. findEnglishCellIndex (shortest non-capitalised non-lemma cell) is fooled by the
#      3-col verb table when the Perfekt column is shorter than the Meaning column:
#      "hat erzählt" beat "to tell, narrate"; "hat erlebt" beat "to experience";
#      "hat bekommen" beat "to receive, get"; "hat studiert" beat "to study (at university)";
#      "hat reserviert" beat "to reserve, book"; "hat telefoniert" beat "to telephone, call".
#      All six glosses corrected to the infinitive-style English from the lesson's
#      Meaning column.
#   2. Bare lowercase single words route to `pos: adjective` — but in this lesson
#      "früher", "damals", "irgendwann", "plötzlich", "endlich" are temporal adverbs
#      (time connectors), not adjectives. Re-tagged to `pos: adverb, tags: [time]`.
#   3. `gestern` and `vorgestern` route to `pos: verb` because the lowercase-stem regex
#      `^[a-zäöü][a-zäöüß]*(en|n)$` matches their `…n` ending. Re-tagged to
#      `pos: adverb, tags: [time]`.
#   4. `Studium` plural — lesson cell "das Studium, Studien" gave the code "," (empty
#      suffix code) + paren "(university) studies" which is English, so the plural
#      resolver returned null + needsReview. Fixed to plural: "Studien".
#   5. The 4 multi-word time phrases (letzte Woche, letzten Monat, letztes Jahr,
#      vor drei Jahren) carry filled en but the phrase path of parseToken still
#      flags needsReview. All four now needReview: false.
#
# Section headers in lesson.md:
#   Lebensgeschichte und Lebensphasen (life story and stages)  — 12 nouns
#   Verben für Geschichten (story verbs)                        — 15 verbs
#   Zeitausdrücke (time expressions)                            — 11 adverbs/phrases
lesson: A2/01

