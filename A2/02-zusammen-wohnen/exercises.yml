lesson: A2/02
title: "A2 · Lektion 2 — Übungen"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Höre Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen to Dialog A and decide: True (R) or False (F)?"
    items:
      - { q: "Anna hat eine neue WG gefunden.", answer: true, why: 'Anna sagt: „Ich habe endlich eine neue Wohngemeinschaft gefunden!"' }
      - { q: "Vier Leute wohnen in der neuen WG.", answer: true, why: 'Anna sagt: „Vier — ich und drei andere Studenten."' }
      - { q: "Anna stellt den Tisch ans Fenster.", answer: true, why: 'Anna sagt: „Den Tisch … stelle ich ihn ans Fenster."' }
      - { q: "Das Bücherregal steht zwischen dem Fenster und der Tür.", answer: true, why: '„Es steht zwischen dem Fenster und der Tür."' }

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Höre Dialog B und wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Die neue Wohnung der Familie Steinmeyer befindet sich …"
        options:
          - { key: a, text: "im Erdgeschoss" }
          - { key: b, text: "im dritten Stock" }
          - { key: c, text: "im zweiten Stock" }
        answer: b
        why: '„Die Wohnung ist im dritten Stock."'
      - q: "Wo steht das Sofa jetzt?"
        options:
          - { key: a, text: "Neben dem Fernseher" }
          - { key: b, text: "Hinter dem Fernseher" }
          - { key: c, text: "Vor dem Fernseher" }
        answer: c
        why: '„Das Sofa steht jetzt vor dem Fernseher."'
      - q: "Wo schläft die Tochter?"
        options:
          - { key: a, text: "Das Bett steht unter dem Fenster." }
          - { key: b, text: "Das Bett steht neben der Tür." }
          - { key: c, text: "Das Bett steht vor dem Schrank." }
        answer: a
        why: '„Das Bett steht unter dem Fenster."'
      - q: "Was hat Frau Steinmeyer gemacht?"
        options:
          - { key: a, text: "Sie hat Möbel gekauft." }
          - { key: b, text: "Sie hat die Bilder an die Wand gehängt." }
          - { key: c, text: "Sie hat die Kisten ausgepackt." }
        answer: b
        why: '„Meine Frau hat die Bilder an die Wand gehängt."'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre und fülle die 8 fehlenden Wörter ein. Drei Wörter im Kasten werden nicht gebraucht."
    instructionsEn: "Listen and fill in the 8 missing words. Three words in the box are not needed."
    text: |
      Bruno sucht eine neue Wohnung in Berlin. Er hat heute drei Wohnungen {1}.
      Die erste Wohnung war sehr {2} — das Bett {3} fast vor der Tür.
      In der zweiten Wohnung {4} ein riesiger Teppich mitten im Zimmer, und
      die {5} standen überall. Die dritte Wohnung hat ihm am besten gefallen:
      Das Schlafzimmer ist {6}, der {7} steht am Fenster, und die Küche
      ist direkt neben dem Wohnzimmer. Bruno hat dem {8} sofort eine Nachricht
      geschrieben.
    bank: [besichtigt, geschrieben, stand, lag, groß, hell, klein, dunkel, Schreibtisch, Möbel, Vermieter]
    answers:
      "1": besichtigt
      "2": klein
      "3": stand
      "4": lag
      "5": Möbel
      "6": hell
      "7": Schreibtisch
      "8": Vermieter

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anruf vom Vermieter"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Telefonnachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript unten liest."
    instructionsEn: "Listen to the phone message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: "Guten Tag, hier ist Herr Krause, der Vermieter. Ich rufe an wegen der Wohnungsbesichtigung am Samstag. Die Wohnung in der Lindenallee 14 ist noch frei. Sie können am Samstag um elf Uhr zur Besichtigung kommen. Die Wohnung hat zwei Zimmer, eine kleine Küche und ein Bad mit Badewanne. Bitte bringen Sie eine Mietschuldenfreiheitsbescheinigung und Ihren Personalausweis mit. Bitte rufen Sie mich bis morgen Abend zurück, um den Termin zu bestätigen. Vielen Dank!"
    items:
      - q: "Wann ist die Besichtigung?"
        options:
          - { key: a, text: "Am Freitag um elf Uhr." }
          - { key: b, text: "Am Samstag um elf Uhr." }
          - { key: c, text: "Am Samstag um zehn Uhr." }
        answer: b
        why: '„Sie können am Samstag um elf Uhr zur Besichtigung kommen."'
      - q: "Wo ist die Wohnung?"
        options:
          - { key: a, text: "In der Lindenallee 14." }
          - { key: b, text: "In der Lindenstraße 14." }
          - { key: c, text: "In der Schillerstraße 14." }
        answer: a
        why: '„Die Wohnung in der Lindenallee 14 ist noch frei."'
      - q: "Was soll man mitbringen?"
        options:
          - { key: a, text: "Eine Mietschuldenfreiheitsbescheinigung und den Personalausweis." }
          - { key: b, text: "Nur den Personalausweis." }
          - { key: c, text: "Eine Bürgschaft." }
        answer: a
        why: '„Bitte bringen Sie eine Mietschuldenfreiheitsbescheinigung und Ihren Personalausweis mit."'
      - q: "Bis wann soll man den Termin bestätigen?"
        options:
          - { key: a, text: "Bis heute Abend." }
          - { key: b, text: "Bis morgen Abend." }
          - { key: c, text: "Bis nächste Woche." }
        answer: b
        why: '„Bitte rufen Sie mich bis morgen Abend zurück, um den Termin zu bestätigen."'

