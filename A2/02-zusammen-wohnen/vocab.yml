# Reviewed from A2/02 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
#
# Parser gaps (consistent with V2 findings across A1):
#   1. "die Decke" appears in two tables (§4.1 blanket / §4.2 ceiling) — parser kept
#      both, producing a duplicate entry that the schema rejects. Hand pass keeps one
#      entry with the polysemy captured in the gloss (the lesson gloss §4.1 already
#      says "blanket; also: ceiling").
#   2. "der Stock / Stockwerk, -e" — the forward slash is stripped by DECORATION
#      so the parser produced one mangled entry `de: "Stock Stockwerk"`. Hand pass
#      splits into Stock (der, regional) and Stockwerk (das, standard).
#   3. "der Mitbewohner, - / die Mitbewohnerin, -nen" — parser extracted only the
#      masculine lemma. Hand pass adds the feminine Mitbewohnerin (parallel to A1/02
#      family table which split Maskulin/Feminin into two entries each).
#   4. "der Vermieter, - / die Vermieterin, -nen" — same pattern as #3; split.
#   5. Verb table (Verb | Meaning | Perfekt) — the `findEnglishCellIndex` heuristic
#      picked whichever cell was shorter. For verbs whose Meaning is longer than the
#      Perfekt (stellen, stehen, legen, liegen, hängen, einrichten), the Perfekt
#      leaked into `en`. Hand pass writes the correct Meaning column.
#   6. "hängen bleiben" — parser routed the multi-word token to `pos: phrase`
#      because the space wasn't the | pipe typography. Linguistically this is a
#      separable verb (trennbares Verb); hand pass retags to pos: verb + separable.
#   7. "die Wohngemeinschaft, -en (WG)" — parser put `plural: "WG"` (the
#      abbreviation in parentheses). Hand pass corrects plural to
#      "Wohngemeinschaften"; the WG abbreviation is captured in the gloss.
#
# All `needsReview` flags and `reviewNote` hints are cleared.
