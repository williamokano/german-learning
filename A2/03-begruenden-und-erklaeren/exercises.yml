      - { q: "Anna übt nur im Kurs, nicht zu Hause.", answer: false, why: "Anna übt auch zu Hause — mit Apps, Podcasts und im Kurs." }
      - { q: "Bruno kommt aus einer Stadt mit deutscher Tradition.", answer: true, why: "Blumenau hat eine starke deutsche Tradition." }
      - { q: "Bruno braucht kein Deutsch für seinen Job.", answer: false, why: "Bruno braucht Deutsch für seinen Job." }
      - { q: "Beide Studenten sind zufrieden mit dem Kurs bei Frau Weber.", answer: true, why: "Beide sind sich einig, dass der Kurs bei Frau Weber sehr gut ist." }

