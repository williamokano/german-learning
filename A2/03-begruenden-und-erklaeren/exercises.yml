      - q: "Was sagt Herr Steinmeyer über den Kurs?"
        options:
          - { key: a, text: "Er findet, dass der Kurs ihm sehr geholfen hat." }
          - { key: b, text: "Er glaubt, dass der Kurs zu lang war." }
