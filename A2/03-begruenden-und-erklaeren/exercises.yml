    instructions: "Höre Dialog B und wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Warum verlässt Herr Steinmeyer den Kurs?"
