  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Verb-Endstellung mit `weil`: Regel verstehen"
    instructions: "Schau dir das Muster an und ergänze dann die Regel."
    instructionsEn: "Look at the pattern. Then complete the rule."
    text: |
      1. Er kommt nicht, weil er krank {1}.
      2. Sie lernt viel, weil sie eine Prüfung {2}.
      3. Wir fahren mit dem Bus, weil das Auto kaputt {3}.
      4. Rule: In a `weil`-clause, the conjugated verb goes to the {4} of the clause.
    answers:
      "1": ist
      "2": hat
      "3": ist
      "4": end

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "`weil`-Sätze: Verb ans Ende"
    instructions: "Verbinde die zwei Sätze mit „weil\". Setze das Verb an das Ende des Nebensatzes. Jede Aufgabe hat eine Lücke für das Verb am Ende."
    instructionsEn: "Join the two sentences using `weil`. Put the verb at the end of the second clause. Each item has a single gap for the final verb."
    text: |
      1. Anna kommt zu spät. → Anna kommt zu spät, weil sie den Bus {1}.
      2. Bruno lernt Deutsch. → Bruno lernt Deutsch, weil er in Berlin {2}.
      3. Wir bleiben zu Hause. → Wir bleiben zu Hause, weil es {3}.
      4. Er kauft ein neues Buch. → Er kauft ein neues Buch, weil er sich für Geschichte {4}.
      5. Ich trinke keinen Kaffee. → Ich trinke keinen Kaffee, weil ich Kaffee nicht {5}.
      6. Sie geht früh schlafen. → Sie geht früh schlafen, weil sie sehr müde {6}.
      7. Herr Steinmeyer verlässt den Kurs. → Herr Steinmeyer verlässt den Kurs, weil er nach Wien {7}.
      8. Wir nehmen den Zug. → Wir nehmen den Zug, weil das Auto zu teuer {8}.
      9. Ich esse kein Fleisch. → Ich esse kein Fleisch, weil ich Vegetarier {9}.
      10. Der Kurs macht Spaß. → Der Kurs macht Spaß, weil Frau Weber alles gut {10}.
    answers:
      "1": "verpasst hat"
      "2": wohnt
      "3": regnet
      "4": interessiert
      "5": mag
      "6": ist
      "7": zieht
      "8": ist
      "9": bin
      "10": erklärt

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "`weil` mit Perfekt (Verb ans Ende!)"
    instructions: "Verbinde mit „weil\". Achte auf die Verbstellung im Perfekt (Partizip II + Hilfsverb)."
    instructionsEn: "Join using `weil`. Watch the Perfekt verb order (Partizip II + auxiliary)."
    text: |
      1. Bruno ist zu spät. → Bruno ist zu spät, weil der Wecker nicht {1}.
      2. Anna ist froh. → Anna ist froh, weil sie einen netten Mitbewohner {2}.
      3. Er ist erschöpft. → Er ist erschöpft, weil er früh {3}.
      4. Sie kennt Berlin gut. → Sie kennt Berlin gut, weil sie dort zwei Jahre {4}.
      5. Wir sind glücklich. → Wir sind glücklich, weil wir die Prüfung {5}.
      6. Ich verstehe den Text. → Ich verstehe den Text, weil ich ihn zweimal {6}.
      7. Er hat kein Geld. → Er hat kein Geld, weil er zu viel {7}.
      8. Sie bleibt in München. → Sie bleibt in München, weil sie dort Arbeit {8}.
    answers:
      "1": "geklingelt hat"
      "2": "gefunden hat"
      "3": "aufgestanden ist"
      "4": "gelebt hat"
      "5": "bestanden haben"
      "6": "gelesen habe"
      "7": "ausgegeben hat"
      "8": "gefunden hat"

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "`weil` mit Modalverb (Infinitiv + Modal ans Ende!)"
    instructions: "Verbinde mit „weil\". Achte auf die Reihenfolge: Infinitiv + Modalverb am Ende."
    instructionsEn: "Join using `weil`. Watch the order: Infinitiv + Modalverb at the end."
    text: |
      1. Er lernt jeden Tag. → Er lernt jeden Tag, weil er die Prüfung bestehen {1}.
      2. Sie geht nicht aus. → Sie geht nicht aus, weil sie zu Hause bleiben {2}.
      3. Wir fahren mit dem Zug. → Wir fahren mit dem Zug, weil wir kein Auto fahren {3}.
      4. Anna ist zu Hause. → Anna ist zu Hause, weil sie kochen {4}.
      5. Ich rufe an. → Ich rufe an, weil ich etwas fragen {5}.
      6. Er nimmt das Taxi. → Er nimmt das Taxi, weil er schnell ankommen {6}.
    answers:
      "1": will
      "2": muss
      "3": dürfen
      "4": soll
      "5": möchte
      "6": muss

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "`dass`-Sätze bilden"
    instructions: "Ergänze mit „dass\". Setze das Verb an das Ende."
    instructionsEn: "Complete using `dass`. Put the verb at the end."
    text: |
      1. Ich denke, dass Deutsch schwierig {1}.
      2. Sie sagt, dass sie um drei Uhr {2}.
      3. Wir finden, dass der Kurs sehr gut {3}.
      4. Er weiß, dass Anna in Berlin {4}.
      5. Ich hoffe, dass du bald gesund {5}.
      6. Bruno meint, dass Pünktlichkeit wichtig {6}.
      7. Frau Weber sagt, dass wir morgen eine Prüfung {7}.
      8. Ich bin sicher, dass wir das {8}.
      9. Sie glaubt, dass er Recht {9}.
      10. Ich verstehe, dass du müde {10}.
    answers:
      "1": ist
      "2": kommt
      "3": ist
      "4": wohnt
      "5": bist
      "6": ist
      "7": haben
      "8": schaffen
      "9": hat
      "10": bist

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "`dass` mit Perfekt und Modalverb"
    instructions: "Bilde den dass-Satz. Die Lücke enthält die Verbphrase am Ende."
    instructionsEn: "Form the `dass`-clause. The gap is the verb phrase at the end."
    text: |
      1. Ich weiß, dass er das vergessen {1}.
      2. Sie sagt, dass sie das Buch schon gelesen {2}.
      3. Er meint, dass wir mehr üben {3}.
      4. Ich glaube, dass sie nach Hause gegangen {4}.
      5. Wir hoffen, dass es zu regnen aufgehört {5}.
      6. Ich finde, dass du mehr schlafen {6}.
    answers:
      "1": hat
      "2": hat
      "3": müssen
      "4": ist
      "5": hat
      "6":
        - solltest
        - sollst

  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "`deshalb` / `darum` / `deswegen`: Inversion!"
    instructions: "Verbinde die Sätze mit dem angegebenen Konnektor. Die Lücke ist das Verb (es steht nach dem Konnektor, vor dem Subjekt)."
    instructionsEn: "Combine the sentences using the given connector. The gap is the verb (it comes before the subject after the connector)."
    text: |
      1. Ich bin müde. (deshalb) → Deshalb {1} ich früh schlafen.
      2. Anna hat eine Prüfung. (darum) → Darum {2} sie heute Abend.
      3. Der Bus kommt nicht. (deswegen) → Deswegen {3} wir ein Taxi.
      4. Er mag keinen Fisch. (deshalb) → Deshalb {4} er das Hähnchen.
      5. Die WG-Miete ist günstig. (darum) → Darum {5} wir dort ein.
      6. Ich spreche Deutsch. (deswegen) → Deswegen {6} ich die Arbeit leichter.
      7. Frau Weber ist eine gute Lehrerin. (deshalb) → Deshalb {7} die Studenten den Kurs.
      8. Es hat geschneit. (darum) → Darum {8} der Zug zu spät.
    answers:
      "1": gehe
      "2": lernt
      "3": nehmen
      "4": bestellt
      "5": ziehen
      "6": finde
      "7": mögen
      "8": kommt

  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "`weil` vs. `deshalb`: Der große Kontrast"
    instructions: "Diese Satzpaare drücken denselben Gedanken aus. Ergänze das Verb am Ende des „weil\"-Satzes und dann das Verb auf Position 2 des „deshalb\"-Satzes."
    instructionsEn: "These sentence pairs express the same idea. Fill in the verb at the end of the `weil`-clause, then the verb in position 2 of the `deshalb`-clause."
    text: |
      1. a) Ich lerne Deutsch, weil ich in Berlin {1} (wohnen).
         b) Ich wohne in Berlin. Deshalb {2} ich Deutsch (lernen).
      2. a) Er bleibt zu Hause, weil er krank {3} (sein).
         b) Er ist krank. Darum {4} er zu Hause (bleiben).
      3. a) Wir nehmen den Zug, weil das Auto kaputt {5} (sein).
         b) Das Auto ist kaputt. Deswegen {6} wir den Zug (nehmen).
      4. a) Sie geht früh schlafen, weil sie morgen früh aufstehen {7} (müssen).
         b) Sie muss morgen früh aufstehen. Deshalb {8} sie früh schlafen (schlafen gehen).
    answers:
      "1": wohne
      "2": lerne
      "3": ist
      "4": bleibt
      "5": ist
      "6": nehmen
      "7": muss
      "8": geht

  - id: A9
    block: A
    type: true-false
    title: "Wortstellung im `weil`-Satz: Richtig oder falsch?"
    instructions: "Markiere jeden Satz mit R (richtig) oder F (falsch)."
    instructionsEn: "Mark each sentence R (richtig) or F (falsch)."
    items:
      - { q: "Ich komme nicht, weil ich habe keine Zeit.", answer: false, why: 'Ich komme nicht, weil ich keine Zeit **habe**. (verb must go to end)' }
      - { q: "Er ist müde, weil er viel gearbeitet hat.", answer: true, why: "Correct word order." }
      - { q: "Wir bleiben hier, weil es regnet.", answer: true, why: "Correct word order." }
      - { q: "Sie lernt Deutsch, weil sie mag die Sprache.", answer: false, why: 'Sie lernt Deutsch, weil sie die Sprache **mag**. (verb must go to end)' }
      - { q: "Ich kaufe das Buch, weil es interessant ist.", answer: true, why: "Correct word order." }
      - { q: "Er kommt zu spät, weil er muss früh aufstehen.", answer: false, why: 'Er kommt zu spät, weil er früh aufstehen **muss**. (infinitive before modal, both at end)' }
      - { q: "Anna freut sich, weil sie hat eine gute Note bekommen.", answer: false, why: 'Anna freut sich, weil sie eine gute Note bekommen **hat**. (Partizip II before auxiliary)' }
      - { q: "Wir fahren mit dem Bus, weil das Auto ist kaputt.", answer: false, why: 'Wir fahren mit dem Bus, weil das Auto kaputt **ist**. (verb must go to end)' }

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "Satzanfang: Nebensatz zuerst (inversion im Hauptsatz)"
    instructions: "Schreibe den Satz so um, dass der „weil\"-Satz ZUERST kommt. Die Lücke ist das Verb des Hauptsatzes (es steht direkt nach dem Komma, vor dem Subjekt)."
    instructionsEn: "Rewrite the sentence so the `weil`-clause comes FIRST. The gap is the main-clause verb (which comes immediately after the comma, before the subject)."
    text: |
      1. Anna kommt zu spät, weil sie den Bus verpasst hat. → Weil sie den Bus verpasst hat, {1} Anna zu spät.
      2. Wir bleiben zu Hause, weil es regnet. → Weil es regnet, {2} wir zu Hause.
      3. Er lernt viel, weil er die Prüfung bestehen will. → Weil er die Prüfung bestehen will, {3} er viel.
      4. Sie ruft an, weil sie eine Frage hat. → Weil sie eine Frage hat, {4} sie an.
      5. Ich trinke keinen Alkohol, weil ich Auto fahren muss. → Weil ich Auto fahren muss, {5} ich keinen Alkohol.
    answers:
      "1": kommt
      "2": bleiben
      "3": lernt
      "4": ruft
      "5": trinke

  - id: A11
    block: A
    type: gap-text
    listLayout: true
    title: "Tabelle vervollständigen: `weil` / `deshalb`"
    instructions: "Ergänze die Tabelle: zwei Formulierungen derselben Idee. Jede Zeile hat zwei Lücken."
    instructionsEn: "Complete the table — two expressions of the same idea. Each row has two gaps."
    text: |
      1. weil: Ich trinke Wasser, weil ich Durst {1}.  |  deshalb: Ich habe Durst. Deshalb {2} ich Wasser.
      2. weil: Er kauft das Auto, weil er ein Auto {3}.  |  darum: Er braucht ein Auto. Darum {4} er es.
      3. weil: Wir kommen nicht, weil wir eine Veranstaltung {5}.  |  deswegen: Wir haben eine Veranstaltung. Deswegen {6} wir nicht.
      4. weil: Sie lernt, weil sie morgen eine Prüfung {7}.  |  deshalb: Sie hat morgen eine Prüfung. Deshalb {8} sie.
    answers:
      "1": habe
      "2": trinke
      "3": braucht
      "4": kauft
      "5": haben
      "6": kommen
      "7": hat
      "8": lernt

  - id: A12
    block: A
    type: gap-text
    listLayout: true
    title: "Meinung ausdrücken: `ich finde / glaube / denke, dass…`"
    instructions: "Forme jede Aussage in einen Meinungssatz mit dem Verb in Klammern um. Die Lücke enthält das Verb am Ende des dass-Satzes."
    instructionsEn: "Turn each statement into an opinion sentence using the verb in brackets. The gap is the final verb in the `dass`-clause."
    text: |
      1. Der Kurs ist interessant. (finden) → Ich finde, dass der Kurs interessant {1}.
      2. Anna hat Recht. (glauben) → Ich glaube, dass Anna Recht {2}.
      3. Pünktlichkeit ist wichtig. (denken) → Ich denke, dass Pünktlichkeit wichtig {3}.
      4. Das Essen ist lecker. (finden) → Ich finde, dass das Essen lecker {4}.
      5. Er kommt morgen. (hoffen) → Ich hoffe, dass er morgen {5}.
      6. Wir müssen mehr üben. (meinen) → Ich meine, dass wir mehr üben {6}.
      7. Die Prüfung ist nicht schwer. (glauben) → Ich glaube, dass die Prüfung nicht schwer {7}.
      8. Der Film war gut. (finden) → Ich finde, dass der Film gut {8}.
    answers:
      "1": ist
      "2": hat
      "3": ist
      "4": ist
      "5": kommt
      "6": müssen
      "7": ist
      "8": war

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen"
    instructions: "Ergänze die Lücken mit der passenden Form. Wähle aus: „weil\", „dass\", „deshalb\", „darum\", „deswegen\" oder eine Verbform."
    instructionsEn: "Fill in the blanks with the appropriate form. Choose from: `weil`, `dass`, `deshalb`, `darum`, `deswegen`, or a verb form."
    text: |
      — Warum lernst du Deutsch, Sofia?
      — Ich lerne Deutsch, {1} ich in Deutschland arbeiten möchte.
      — Ah, interessant! Und findest du, {2} Deutsch schwierig ist?
      — Ja, die Grammatik ist manchmal kompliziert. {3} übe ich jeden Tag.
      — Das verstehe ich. Ich lerne auch, {4} mir das für meinen Job hilft.
      — Ich denke, {5} man eine Sprache nur lernen kann, wenn man sie benutzt.
      — Du hast völlig Recht. {6} spreche ich auch außerhalb des Kurses Deutsch!
    answers:
      "1": weil
      "2": dass
      "3":
        - Deshalb
        - Darum
        - Deswegen
      "4": weil
      "5": dass
      "6":
        - Deshalb
        - Darum
        - Deswegen

  - id: B2
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
