      - q: "Warum geht Herr Steinmeyer nach Wien?"
        options:
          - { key: a, text: "Weil die Stadt schöner ist als Berlin." }
          - { key: b, text: "Weil seine Familie dort lebt und das Angebot gut ist." }
          - { key: c, text: "Weil Frau Weber das empfohlen hat." }
        answer: b
