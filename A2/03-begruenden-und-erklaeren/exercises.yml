    text: |
      Yuki wohnt in München und lernt dort Deutsch. Sie hat heute einen Brief von ihrer Mutter aus Osaka {1}. Ihre Mutter fragt, warum Yuki nicht nach Japan {2}. Yuki {3} zurück, dass sie in München bleiben möchte, weil sie hier viele Freunde {4} hat. Sie erklärt auch, dass ihr Job in München sehr gut ist. Deswegen hat sie {5}, noch ein Jahr zu bleiben. Ihre Mutter ist {6}, aber sie versteht es.
    bank: [bekommen, bleiben, entschieden, erklärt, gefunden, schreibt, traurig, verstehen, zurückkommt]
