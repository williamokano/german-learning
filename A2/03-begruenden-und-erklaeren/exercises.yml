  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Verspätung der U-Bahn"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Durchsage. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript unten liest."
    instructionsEn: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: "Achtung, eine Durchsage. Liebe Fahrgäste, die U-Bahn-Linie U 3 hat heute zwischen Hauptbahnhof und Stadtmitte eine Verspätung von ungefähr fünfzehn Minuten. Grund dafür ist eine technische Störung am Gleis. Wir bitten um Ihr Verständnis, weil unsere Techniker den Schaden jetzt reparieren. Bitte weichen Sie, wenn möglich, auf die Linie U 6 aus. Wir informieren Sie, sobald die Störung behoben ist. Vielen Dank für Ihre Geduld."
    items:
      - q: "Welche U-Bahn-Linie hat Verspätung?"
        options:
          - { key: a, text: "Die U 3." }
          - { key: b, text: "Die U 6." }
          - { key: c, text: "Die U 9." }
        answer: a
        why: '„die U-Bahn-Linie U 3 hat heute zwischen Hauptbahnhof und Stadtmitte eine Verspätung."'
      - q: "Wie viel Verspätung gibt es?"
        options:
          - { key: a, text: "Ungefähr fünf Minuten." }
          - { key: b, text: "Ungefähr zehn Minuten." }
          - { key: c, text: "Ungefähr fünfzehn Minuten." }
        answer: c
        why: '„eine Verspätung von ungefähr fünfzehn Minuten."'
      - q: "Was ist der Grund für die Verspätung?"
        options:
          - { key: a, text: "Eine Demonstration." }
          - { key: b, text: "Eine technische Störung am Gleis." }
          - { key: c, text: "Ein Streik." }
        answer: b
        why: '„Grund dafür ist eine technische Störung am Gleis."'
      - q: "Auf welche Linie soll man ausweichen?"
        options:
          - { key: a, text: "Auf die U 4." }
          - { key: b, text: "Auf die U 5." }
          - { key: c, text: "Auf die U 6." }
        answer: c
        why: '„Bitte weichen Sie, wenn möglich, auf die Linie U 6 aus."'

