# Reviewed from A2/03 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
#
# Section headers in lesson.md:
#   Meinungen und Gefühle (opinions and feelings) — 10 abstract nouns
#   Verben zum Thema (topic verbs)                — 12 verbs (incl. 1 prepositional)
#   Nützliche Adjektive (useful adjectives)       — 10 rows → 13 entries (3 slash-pairs split)
#
# Parser gaps hit by this lesson:
#   1. The `Adjective | English` table header doesn't match any of the parser's known
#      table kinds ("Adjektiv" / "Comparative" / "Superlative" are required for
#      `adj-english`; "Deutsch" / "English" for `bilingual`). The whole adjectives
#      table was skipped with a warning → all 10 rows were added by hand.
#   2. The verb table `Verb | English | Perfekt` is classified `verb-english`, but the
#      English detector picked the *shortest* non-capitalised cell — which is the
#      Perfekt column ("hat begründet", "hat gemeint", "hat geglaubt", "hat widersprochen")
#      whenever the English gloss is longer than the Perfekt form. Affected entries
#      were corrected by hand. (Same Perfekt-vs-English confusion the V2 parser spec
#      called out as a future fix; V2 did not add a Perfekt-column detector.)
#   3. The connector / glue words for the lesson (weil, dass, deshalb, darum, deswegen)
#      live in §3 Redemittel and §6 Grammatik, not in the §4 Wortschatz table, so they
#      are intentionally not included here.
lesson: A2/03

entries:
