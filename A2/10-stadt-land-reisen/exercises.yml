  - id: A7
    block: A
    type: gap-text
    listLayout: true
    title: "Konjugations-Tabelle: reisen (Präsens)"
    instructions: "Fill in the complete Präsens table for reisen."
    text: |
      1. ich: {1}
      2. du: {2}
      3. er/sie/es: {3}
      4. wir: {4}
      5. ihr: {5}
      6. sie/Sie: {6}
    answers:
      "1": reise
      "2": reist
      "3": reist
      "4": reisen
      "5": reist
      "6": reisen

  - id: A8
    block: A
    type: gap-text
    listLayout: true
    title: "Die neun Wechselpräpositionen: Lückentest"
    instructions: "Fill in the correct preposition. Use the contracted form when possible. 8 items."
    text: |
      1. Das Hotel liegt direkt {1} Hafen. (location: an dem = ?)
      2. Ich stelle den Koffer {2} Tisch. (direction: Wohin? = Akkusativ)
      3. Wir wohnen {3} einer kleinen Pension. (location)
      4. Das Restaurant ist direkt {4} dem Hotel, auf der anderen Straßenseite.
      5. Das Bild hängt {5} der Tür. (location: above the door)
      6. Die Katze sitzt {6} dem Bett. (location: under the bed)
      7. Der Schlüssel liegt {7} dem Sofa. (location: behind the sofa)
      8. Sie geht {8} Post und bleibt dort. (direction: to the post office)
    answers:
      "1": am
      "2": "auf den"
      "3": in
      "4": gegenüber
      "5": über
      "6": unter
      "7": hinter
      "8": zur

  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "aus oder von?"
    instructions: "Choose aus or von. 8 items."
    text: |
      1. Ich komme {1} dem Supermarkt.
      2. Er kommt {2} Brasilien.
      3. Sie kommt {3} ihrer Schwester.
      4. Wir kommen {4} dem Konzert.
      5. Anna kommt {5} Osaka.
      6. Der Brief kommt {6} meiner Freundin.
      7. Wir fahren {7} hier aus morgen los.
      8. Er kommt gerade {8} Arzt.
    answers:
      "1": "aus dem"
      "2": "aus"
      "3": "von"
      "4": "vom"
      "5": "aus"
      "6": "von"
      "7": "von"
      "8": "vom"

  - id: A10
    block: A
    type: free-write
    title: "Reise-Sätze bilden"
    prompt: "Build a sentence from the cues."
    stimulus: |
      Example: ich / fahren / nach Wien → Ich fahre nach Wien.

      1. wir / fliegen / morgen / nach Italien →
      2. Anna / buchen / ein Hotel / in Berlin →
      3. der Zug / abfahren / um 10 Uhr / von Gleis 3 →
      4. ich / möchte / reservieren / ein Zimmer →
      5. wir / ankommen / in Salzburg / am Abend →
      6. er / wohnen / jetzt / in der Schweiz →
    model: |
      1. Wir fliegen morgen nach Italien.
      2. Anna hat ein Hotel in Berlin gebucht.
      3. Der Zug fährt um 10 Uhr von Gleis 3 ab.
      4. Ich möchte ein Zimmer reservieren.
      5. Wir kommen am Abend in Salzburg an.
      6. Er wohnt jetzt in der Schweiz.

  - id: A11
    block: A
    type: gap-text
    listLayout: true
    title: "Wegbeschreibung: Imperativ (Sie)"
    instructions: "Write the Sie-form imperative for each direction. 6 items."
    text: |
      1. (geradeaus gehen) {1}
      2. (links abbiegen) {2}
      3. (die zweite Straße rechts nehmen) {3}
      4. (bis zur Ampel gehen) {4}
      5. (den Bus nehmen) {5}
      6. (über die Brücke gehen) {6}
    answers:
      "1": "Gehen Sie geradeaus."
      "2": "Biegen Sie links ab."
      "3": "Nehmen Sie die zweite Straße rechts."
      "4": "Gehen Sie bis zur Ampel."
      "5": "Nehmen Sie den Bus."
      "6": "Gehen Sie über die Brücke."

  - id: A12
    block: A
    type: gap-text
    listLayout: true
    title: "Gemischte Übung: Wo? / Wohin? / Woher?"
    instructions: "Fill in the correct preposition. Use the contracted form when possible. 8 items."
    text: |
      1. Das Restaurant liegt {1} dem Bahnhof. (location: Wo?)
      2. Wir fahren morgen {2} die Alpen. (direction: Wohin?)
      3. Er wohnt {3} seiner Tante in Hamburg. (location: Wo?)
      4. Sie kommt gerade {4} dem Arzt. (origin: Woher?)
      5. Ich stelle die Tasche {5} den Stuhl. (direction: Wohin?)
      6. Das Hotel liegt direkt {6} Meer. (location: Wo?)
      7. Wir fahren {7} Hause. (direction: Wohin? — Wohin from where you are)
      8. Er kommt {8} Salzburg. (origin: Woher?)
    answers:
      "1": gegenüber
      "2": "in die"
      "3": bei
      "4": "vom"
      "5": "auf den"
      "6": "am"
      "7": "nach"
      "8": "aus"

  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Dialog ergänzen: Im Hotel anrufen"
    instructions: "Fill in the 12 blanks with the correct form. Three words in the box are not needed."
    text: |
      — Guten Tag! Ich möchte bitte ein Zimmer {1}.
      — Für wie viele Personen und {2} (für wann)?
      — Für eine Person, {3} fünften bis {4} achten Juli.
      — Wir haben noch ein Einzelzimmer {5}. {6} das recht?
      — Ja, sehr gut. Und {7} liegt das Hotel genau?
      — Wir liegen direkt {8} vom Bahnhof. {9} Bahnhof aus gehen Sie
      einfach geradeaus.
      — Ausgezeichnet. Und {10} komme ich vom Hotel aus in die Altstadt?
      — Nehmen Sie die Linie 4 bis zur Haltestelle „Marktplatz". Die Straßenbahn
      fährt direkt {11} dem Hotel {12}.
      — Vielen Dank!
      — Auf Wiederhören!
    bank: [reservieren, wann, vom, zum, frei, Wäre, wo, gegenüber, Vom, wie, vor, ab, Wann, frei, vom]
    answers:
      "1": reservieren
      "2": wann
      "3": vom
      "4": zum
      "5": frei
      "6": Wäre
      "7": wo
      "8": gegenüber
      "9": Vom
      "10": wie
      "11": vor
      "12": ab

  - id: B2
    block: B
    type: free-write
    title: "Finde den Fehler"
    prompt: 'Each sentence has exactly one mistake. Find it and write the corrected sentence.'
    stimulus: |
      1. Ich fahre in die Schweiz seit zwei Jahren.
      2. Wir fliegen nach den Irak nächste Woche.
      3. Sie kommt aus die Türkei.
      4. Ich gehe in dem Bahnhof.
      5. Er wohnt in eine kleine Wohnung.
      6. Das Hotel liegt zwischen der Park und das Museum.
      7. Wir fahren ans Meer in den Sommer.
      8. Anna kommt von Osaka.
    model: |
      1. Ich wohne in der Schweiz seit zwei Jahren. (seit = location = Wo? = in + Dat)
      2. Wir fliegen in den Irak nächste Woche. (Irak has article → in + Akk, not nach)
      3. Sie kommt aus der Türkei. (Türkei is feminine → aus + Dat)
      4. Ich gehe in den Bahnhof. (gehen = motion = Wohin? = Akkusativ)
      5. Er wohnt in einer kleinen Wohnung. (wohnen = location = Wo? = Dativ)
      6. Das Hotel liegt zwischen dem Park und dem Museum. (zwischen = location = Dativ on both)
      7. Wir fahren ans Meer im Sommer. (seasons take im = in dem)
      8. Anna kommt aus Osaka. (cities take aus, not von)

  - id: B3
    block: B
    type: matching
    title: "Frage und Antwort verbinden"
    instructions: "Match each question (1–6) with the correct answer (a–f)."
    left:
      - { key: "1", text: "Wohin fährst du im Urlaub?" }
      - { key: "2", text: "Wo wohnst du in Wien?" }
      - { key: "3", text: "Wo liegt das Hotel?" }
      - { key: "4", text: "Wie komme ich zum Bahnhof?" }
      - { key: "5", text: "Wann fährt der Zug ab?" }
      - { key: "6", text: "Wie war der Urlaub?" }
    right:
      - { key: a, text: "Direkt am Hafen, neben dem Fischmarkt." }
      - { key: b, text: "Nach Spanien, ans Meer!" }
      - { key: c, text: 'Im Hotel „Zum goldenen Hirsch".' }
      - { key: d, text: "Mit dem Zug, dann zu Fuß." }
      - { key: e, text: "Es war wunderschön!" }
      - { key: f, text: "Um 14:30 Uhr, von Gleis 3." }
    answers:
      "1": b
      "2": c
      "3": a
      "4": d
      "5": f
      "6": e

  - id: B4
    block: B
    type: free-write
    title: "Satzbau: Wegbeschreibung"
    prompt: "Reorder the words to make a correct imperative sentence. Write the full sentence."
    stimulus: |
      1. geradeaus / gehen / bitte / Sie →
      2. die erste Straße / nehmen / links / Sie →
      3. gegenüber / ist / der Bahnhof / das Hotel / vom →
      4. die Straßenbahn / bitte / nehmen / Sie →
    model: |
      1. Gehen Sie bitte geradeaus.
      2. Nehmen Sie die erste Straße links.
      3. Das Hotel ist gegenüber vom Bahnhof.
      4. Nehmen Sie bitte die Straßenbahn.

  - id: B5
    block: B
    type: categorize
    title: "Kategorien: Länder mit und ohne Artikel"
    instructions: "Sort these 10 countries into two groups. Each token is labeled (a–j) and the bucket is the category."
    buckets:
      - { key: ohne_artikel, label: 'Länder ohne Artikel (mit „nach")' }
      - { key: mit_artikel, label: 'Länder mit Artikel (mit „in + Akk")' }
    tokens:
      - { text: "Brasilien", bucket: ohne_artikel }
      - { text: "Schweiz", bucket: mit_artikel }
      - { text: "Japan", bucket: ohne_artikel }
      - { text: "Türkei", bucket: mit_artikel }
      - { text: "USA", bucket: mit_artikel }
      - { text: "Irak", bucket: mit_artikel }
      - { text: "Russland", bucket: ohne_artikel }
      - { text: "Niederlande", bucket: mit_artikel }
      - { text: "Deutschland", bucket: ohne_artikel }
      - { text: "Iran", bucket: mit_artikel }

  - id: B6
    block: B
    type: free-write
    title: "Übersetzen (EN → DE)"
    prompt: "Translate into German."
    stimulus: |
      1. I'm going to Switzerland.
      2. She's coming from Berlin.
      3. The hotel is next to the train station.
      4. We're flying to Japan tomorrow.
      5. Where is the market square?
      6. The train departs at 9:30.
      7. I would like to book a room.
      8. He lives in Vienna.
    model: |
      1. Ich fahre in die Schweiz.
      2. Sie kommt aus Berlin.
      3. Das Hotel liegt neben dem Bahnhof.
      4. Wir fliegen morgen nach Japan.
      5. Wo ist der Marktplatz?
      6. Der Zug fährt um 9:30 ab.
      7. Ich möchte ein Zimmer reservieren.
      8. Er wohnt in Wien.

  - id: B7
    block: B
    type: free-write
    title: "Den Weg beschreiben"
    prompt: "Beschreibe den Weg vom Bahnhof zum Hotel. Benutze mindestens 5 der folgenden Ausdrücke: geradeaus, links, rechts, gegenüber, zwischen, neben, bis zur, abbiegen."
    use:
      - "at least 5 of: geradeaus, links, rechts, gegenüber, zwischen, neben, bis zur, abbiegen"
    stimulus: |
      Bahnhof → Straße → erste Ampel (links) → geradeaus → zweite Ampel →
      Marktplatz (rechts) → geradeaus → Hotel „Zur Post" (links, neben dem Museum)
    model: |
      Vom Bahnhof gehen Sie geradeaus bis zur ersten Ampel. Dann biegen Sie
      links ab und gehen geradeaus weiter bis zur zweiten Ampel. Dort ist
      der Marktplatz — biegen Sie rechts ab. Das Hotel „Zur Post" ist dann
      gleich links, neben dem Museum.

  - id: B8
    block: B
    type: free-write
    title: "Antworten mit Hinweisen"
    prompt: "Answer in a complete sentence, using the cue in brackets."
    stimulus: |
