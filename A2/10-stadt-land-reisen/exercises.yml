        odd: 3
        why: "auf den Tisch is the only non-travel destination; the others are all travel destinations."
      - items: [übernachten, ankommen, abfahren, umsteigen]
        odd: 0
        why: "übernachten is the only verb that takes haben in the Perfekt; the others are motion verbs that take sein."

