lesson: A2/10
title: "A2 · Lektion 10 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna und Bruno planen einen Ausflug nach Berlin."
        answer: false
        why: 'Sie planen einen Kurztrip nach Hamburg, nicht nach Berlin.'
      - q: "Bruno möchte ans Meer fahren."
        answer: true
        why: 'Bruno: „ich wäre gerne am Meer".'
      - q: "Bruno hat ein Hotel über das Internet gefunden."
        answer: false
        why: 'Bruno sagt nur „Ich habe ein günstiges Hotel gefunden" — wie er es gefunden hat, wird nicht erwähnt.'
      - q: "Das Hotel liegt direkt am Hafen."
        answer: true
        why: 'Bruno: „direkt am Hafen, neben dem Fischmarkt".'
      - q: "Sie fahren mit dem Zug nach Hamburg."
        answer: true
        why: 'Bruno: „Mit dem Zug von Berlin nach Hamburg".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Frau Weber möchte …"
        options:
          - { key: a, text: "ein Doppelzimmer reservieren" }
          - { key: b, text: "ein Einzelzimmer reservieren" }
          - { key: c, text: "ein Restaurant reservieren" }
        answer: b
        why: 'Frau Weber: „Für eine Person".'
      - q: "Das Zimmer liegt im …"
        options:
          - { key: a, text: "zweiten Stock" }
          - { key: b, text: "dritten Stock" }
          - { key: c, text: "vierten Stock" }
        answer: b
        why: 'Rezeptionistin: „im dritten Stock, über dem Restaurant".'
      - q: "Das Hotel liegt …"
        options:
          - { key: a, text: "gegenüber dem Bahnhof" }
          - { key: b, text: "direkt am Hafen" }
          - { key: c, text: "im Stadtzentrum" }
        answer: a
        why: 'Rezeptionistin: „Wir liegen direkt gegenüber vom Bahnhof".'
      - q: "Frau Weber kommt …"
        options:
          - { key: a, text: "mit dem Auto" }
          - { key: b, text: "mit dem Flugzeug" }
          - { key: c, text: "mit dem Zug" }
        answer: c
        why: 'Frau Weber: „Ich komme mit dem Zug an".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Yuki ist heute von München {1} Salzburg gefahren. Sie ist mit
      dem Zug gefahren und {2} Hauptbahnhof angekommen. {3} Bahnhof
      aus ist sie zu Fuß in die Altstadt gegangen. Dort hat sie den
      Marktplatz besucht und ist {4} die Festung Hohensalzburg
      gestiegen. Die Festung liegt hoch oben {5} der Stadt. Von oben
      konnte man weit {6} Tal sehen. Am Abend ist Yuki mit dem Zug
      zurück nach München gefahren.
    bank: [nach, am, vom, auf, über, ins, in, zu, aus]
    answers:
      "1": nach
      "2": am
      "3": vom
      "4": auf
      "5": über
      "6": ins

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Durchsage am Flughafen"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the announcement. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Achtung, eine Durchsage. Der Flug LH 401 von Berlin nach Lissabon hat eine Verspätung von zwei Stunden. Der neue Abflug ist um sechzehn Uhr dreißig, nicht wie geplant um vierzehn Uhr dreißig. Passagiere dieses Fluges finden Sie am Gate B 17. Wir bitten Sie, zum Gate zu gehen, sobald Sie die Boarding-Karten haben. Vielen Dank für Ihre Aufmerksamkeit.'
    items:
      - q: "Welcher Flug hat Verspätung?"
        options:
          - { key: a, text: "LH 401 von Berlin nach München." }
          - { key: b, text: "LH 401 von Berlin nach Lissabon." }
          - { key: c, text: "LH 410 von Berlin nach Wien." }
        answer: b
        why: '„Der Flug LH 401 von Berlin nach Lissabon hat eine Verspätung".'
      - q: "Wie viel Verspätung hat der Flug?"
        options:
          - { key: a, text: "Eine Stunde." }
          - { key: b, text: "Zwei Stunden." }
          - { key: c, text: "Drei Stunden." }
        answer: b
        why: '„hat eine Verspätung von zwei Stunden".'
      - q: "Wann ist der neue Abflug?"
        options:
          - { key: a, text: "Um vierzehn Uhr dreißig." }
          - { key: b, text: "Um fünfzehn Uhr dreißig." }
          - { key: c, text: "Um sechzehn Uhr dreißig." }
        answer: c
        why: '„Der neue Abflug ist um sechzehn Uhr dreißig".'
      - q: "An welchem Gate sollen die Passagiere sein?"
        options:
          - { key: a, text: "Gate B 14." }
          - { key: b, text: "Gate B 17." }
          - { key: c, text: "Gate B 41." }
        answer: b
        why: '„Passagiere dieses Fluges finden Sie am Gate B 17".'

  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "Wo? oder Wohin? (Dativ oder Akkusativ)"
    instructions: "For each preposition, write the correct article form for Wo? (location) and Wohin? (direction). 10 gaps."
    text: |
      1. in — Wo?: {1} · Wohin?: {2}
      2. an — Wo?: {3} · Wohin?: {4}
      3. auf — Wo?: {5} · Wohin?: {6}
      4. in (Stadt) — Wo?: {7} · Wohin?: {8}
      5. an (Fluss) — Wo?: {9} · Wohin?: {10}
    answers:
      "1": im
      "2": ins
      "3": am
      "4": ans
      "5": "auf dem"
      "6": "auf das"
      "7": "in der"
      "8": "in die"
      "9": am
      "10": "an den"

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "Lückentest: Wo? / Wohin? / Woher?"
    instructions: "Fill in Wo?, Wohin?, or Woher? for each sentence. 8 items."
    text: |
      1. „{1} fährst du im Urlaub?" — „Nach Spanien."
      2. „{2} wohnst du in Berlin?" — „In einer kleinen Wohnung in Kreuzberg."
      3. „{3} kommst du gerade?" — „Aus dem Supermarkt."
      4. „{4} liegt das Hotel?" — „Direkt am Hafen."
      5. „{5} gehst du am Samstag?" — „In die Stadt."
      6. „{6} ist Anna?" — „Sie ist in der Bibliothek."
      7. „{7} fliegt ihr im August?" — „Nach Griechenland."
      8. „{8} lernst du Deutsch?" — „In der Volkshochschule."
    answers:
      "1": Wohin
      "2": Wo
      "3": Woher
      "4": Wo
      "5": Wohin
      "6": Wo
      "7": Wohin
      "8": Wo

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "Städte und Länder: nach / in + Akk / aus + Dat"
    instructions: "Fill in the correct preposition (nach / in / in die / in den / in der / aus / zum). 10 items."
    text: |
      1. Ich fahre {1} Berlin.
      2. Sie kommt {2} Wien.
      3. Wir fliegen {3} Japan.
      4. Er wohnt {4} Paris.
      5. Anna ist {5} Russland gekommen.
      6. Fährst du {6} die Schweiz in den Urlaub?
      7. Die Touristen kommen {7} den USA.
      8. Ich gehe {8} den Bahnhof.
      9. Sie wohnt jetzt {9} der Türkei.
      10. Wir fliegen morgen {10} den Iran.
    answers:
      "1": nach
      "2": aus
      "3": nach
      "4": in
      "5": aus
      "6": "in"
      "7": aus
      "8": "zum"
      "9": "in"
      "10": "in"

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "Länder mit Artikel: in / aus + den / die / das"
    instructions: "Fill in the correct preposition + article. Choose from in die / in der / in den / im / aus der / aus den / aus dem. 8 items."
    text: |
      1. Ich fahre {1} Schweiz.
      2. Sie kommt {2} USA.
      3. Wir wohnen {3} Türkei.
      4. Er kommt {4} Irak.
      5. Fliegt ihr bald {5} Niederlande?
      6. Anna war letztes Jahr {6} Iran.
      7. Ich komme {7} Ukraine.
      8. Sie wohnt seit drei Jahren {8} Schweiz.
    answers:
      "1": "in die"
      "2": "aus den"
      "3": "in der"
      "4": "aus dem"
      "5": "in die"
      "6": "im"
      "7": "aus der"
      "8": "in der"

  - id: A5
    block: A
    type: gap-text
    listLayout: true
    title: "Reiseverben: Partizip II"
    instructions: "Write the Partizip II for each verb. Mark ✓ (with ge-) or ✗ (no ge-). 10 items."
    text: |
      1. reisen → {1} ( )
      2. buchen → {2} ( )
      3. reservieren → {3} ( )
      4. ankommen → {4} ( )
      5. abfahren → {5} ( )
      6. umsteigen → {6} ( )
      7. besichtigen → {7} ( )
      8. empfehlen → {8} ( )
      9. übernachten → {9} ( )
      10. abbiegen → {10} ( )
    answers:
      "1": gereist
      "2": gebucht
      "3": reserviert
      "4": angekommen
      "5": abgefahren
      "6": umgestiegen
      "7": besichtigt
      "8": empfohlen
      "9": übernachtet
      "10": abgebogen

  - id: A6
    block: A
    type: gap-text
    listLayout: true
    title: "Perfekt mit sein oder haben?"
    instructions: "Choose the correct auxiliary. 10 items."
    text: |
      1. Wir {1} nach Hamburg gefahren.
      2. Anna {2} ein Hotel gebucht.
      3. Der Zug {3} um 9 Uhr angekommen.
      4. Ich {4} im Hotel übernachtet.
      5. Sie {5} den Dom besichtigt.
      6. Wir {6} in Wien umgestiegen.
      7. Er {7} das Museum empfohlen.
      8. Die Straßenbahn {8} um 10 Uhr abgefahren.
      9. Ich {9} nach links abgebogen.
      10. Wir {10} ein Zimmer reserviert.
    answers:
