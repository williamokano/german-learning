# Reviewed from A2/10 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
#
# The parser captured 50 entries; the human review pass fixes:
#   - all `tags: []` → taxonomy (travel / transport / place + concrete)
#   - Museum plural (parser dropped "Museen", only the lemma hit) → Museen
#   - Berge plural — the source table gives "die Berge (pl.)" which is the plural
#     form itself (no singular); plural stays null
#   - 5 verb glosses where the parser latched onto the third table column
#     (Perfekt column) instead of the English column:
#       umsteigen → "to change (transport)"
#       besichtigen → "to visit (a sight)"
#       übernachten → "to spend the night"
#       abbiegen → "to turn (direction)"
#       weitergehen → "to continue (on foot)"
#   - Haltestelle gloss "(bus/tram) stop" — reworded to "stop (bus/tram)"
#   - all `reviewNote` fields removed (CommittedVocabSet refuses them)
#
# Sections in lesson.md:
#   Reise und Transport (travel and transport) — 20 nouns split across the
#     travel (Reise, Urlaub, Unterkunft, Buchung, Ticket, Gepäck, Koffer, Rucksack…)
#     and transport (Zug, Bus, Straßenbahn, U-Bahn) sub-flavours, plus three place
#     nouns (Bahnhof, Flughafen, Haltestelle)
#   Stadtleben und Orientierung (city life and orientation) — 17 nouns (Stadt,
#     Altstadt, Kirche, Museum, Schloss, Strand, Meer, Berge, Tal…)
#   Verben (verbs) — 12 verbs: 7 trennbare (ankommen, abfahren, umsteigen,
#     empfehlen, abbiegen, weitergehen, besichtigen) + 5 regular (reisen, buchen,
#     reservieren, übernachten, stornieren)
