    listLayout: true
    title: "`als` + Berufsbezeichnung"
    instructions: "Fill in the correct profession noun (no article!) after `als`."
    text: |
      1. Er hat fünf Jahre als {1} in einem Restaurant gearbeitet.
      2. Sie ist als {2} bei einer Softwarefirma tätig.
      3. Ich bin als {3} eingeschrieben — ich studiere Informatik.
      4. Bruno möchte als IT-Assistent arbeiten. Frau Weber arbeitet als {4}.
      5. Er fährt Autos und arbeitet als {5}.
      6. Sie unterrichtet Deutsch und arbeitet als {6}.
