lesson: A2/04
title: "A2 · Lektion 4 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - { q: "Bruno sucht einen neuen Job.", answer: true, why: "Bruno sucht einen neuen Job." }
      - { q: "Bruno hat noch keine Bewerbungen geschickt.", answer: false, why: "He says he has already sent three applications." }
      - { q: "Bruno möchte als IT-Assistent arbeiten.", answer: true, why: "He mentions working as an IT-Assistent." }
      - { q: "Bruno wartet bis Montag auf eine Antwort.", answer: false, why: "He will write again if he hears nothing by Freitag, not Monday." }

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Frau Weber möchte sich für welche Stelle bewerben?"
        options:
          - { key: a, text: "als Projektleiterin" }
          - { key: b, text: "als Koordinatorin" }
          - { key: c, text: "als Managerin" }
        answer: a
        why: "Frau Weber möchte sich als Projektleiterin bewerben."
      - q: "Wie lange hat Frau Weber als Koordinatorin gearbeitet?"
        options:
          - { key: a, text: "zwei Jahre" }
          - { key: b, text: "drei Jahre" }
          - { key: c, text: "fünf Jahre" }
        answer: b
        why: "drei Jahre als Koordinatorin."
      - q: "Was soll Frau Weber tun, um einen Termin zu bekommen?"
        options:
          - { key: a, text: "anrufen" }
          - { key: b, text: "eine E-Mail schreiben" }
          - { key: c, text: "Unterlagen einreichen" }
        answer: c
        why: "Unterlagen einreichen."
      - q: "Bis wann soll Frau Weber die Unterlagen schicken?"
        options:
          - { key: a, text: "bis Montag" }
          - { key: b, text: "bis Samstag" }
          - { key: c, text: "bis Freitag" }
        answer: a
        why: "Bis Montag."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Yuki arbeitet seit drei Monaten als {1} in einem {2} in München. Wenn sie früh {3}, beginnt ihr Tag um sechs Uhr {4}. Sie macht eine {5}, wenn es ruhig ist. Nach der Arbeit lernt sie Deutsch in einem {6}.
    bank: [anfängt, Kellnerin, Abendkurs, müde, Pause, versteht, schläfrig, Café, morgens]
    answers:
      "1": Kellnerin
      "2": Café
      "3": anfängt
      "4": morgens
      "5": Pause
      "6": Abendkurs

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Anruf von der Personalagentur"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the phone message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Guten Tag, hier ist Frau Schäfer von der Personalagentur „Jobwelt". Ich rufe an wegen Ihrer Bewerbung als IT-Assistent. Wir hätten nächste Woche einen freien Termin für ein Vorstellungsgespräch. Das Gespräch findet am Mittwoch, dem achtzehnten Juni, um zehn Uhr in unserem Büro in der Friedrichstraße statt. Bitte bringen Sie Ihren Lebenslauf und Ihre Zeugnisse mit. Bitte rufen Sie uns bis Freitag an, um den Termin zu bestätigen. Vielen Dank und bis bald!'
    items:
      - q: "Von welcher Firma ruft Frau Schäfer an?"
        options:
          - { key: a, text: 'Von der Personalagentur „Jobwelt".' }
          - { key: b, text: 'Von der Firma „Jobfinder".' }
          - { key: c, text: 'Vom IT-Unternehmen „Future".' }
        answer: a
        why: '„hier ist Frau Schäfer von der Personalagentur „Jobwelt"."'
      - q: "Für welche Stelle hat sich der Bewerber beworben?"
        options:
          - { key: a, text: "Als Kellner." }
          - { key: b, text: "Als Projektleiter." }
          - { key: c, text: "Als IT-Assistent." }
        answer: c
        why: "Bewerbung als IT-Assistent."
      - q: "Wann findet das Vorstellungsgespräch statt?"
        options:
          - { key: a, text: "Am Mittwoch, dem achtzehnten Juni, um zehn Uhr." }
          - { key: b, text: "Am Mittwoch, dem elften Juni, um zehn Uhr." }
          - { key: c, text: "Am Donnerstag, dem neunzehnten Juni, um vierzehn Uhr." }
        answer: a
        why: "Mittwoch, dem achtzehnten Juni, um zehn Uhr."
      - q: "Bis wann soll man anrufen, um den Termin zu bestätigen?"
        options:
          - { key: a, text: "Bis Donnerstag." }
          - { key: b, text: "Bis Freitag." }
          - { key: c, text: "Bis Samstag." }
        answer: b
        why: "Bis Freitag."

