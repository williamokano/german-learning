      "2": fängt
      "3": "bewerbe mich"
      "4": verdient
      "5": vereinbaren
      "6": stellt
      "7": reicht

  - id: A10
    block: A
    type: gap-text
    listLayout: true
    title: "`wenn` oder `weil`?"
    instructions: "Wähle „wenn\" oder „weil\" und ergänze die Lücke mit dem Verb (Infinitiv + Modalverb oder finites Verb, am Ende des Satzes)."
    instructionsEn: "Choose `wenn` or `weil` and complete the gap with the verb (infinitive + modal or finite verb, at the end of the clause)."
    text: |
      1. Er lernt viel, {1} er die Prüfung bestehen {2} (bestehen wollen).
      2. Ich bin glücklich, {3} meine Arbeit interessant {4} (sein).
      3. Bruno sucht einen Job, {5} er Geld {6} (brauchen).
      4. {7} du Zeit {8} (haben), können wir einen Kaffee trinken.
      5. Sie kommt zu spät, {9} der Bus Verspätung {10} (haben).
      6. Er schreibt eine E-Mail, {11} er keine Antwort {12} (bekommen).
      7. Wir bleiben im Büro, {13} die Besprechung so lange {14} (dauern).
      8. {15} man viel übt, lernt man schnell.
    answers:
