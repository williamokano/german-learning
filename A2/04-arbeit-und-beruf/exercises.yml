  - id: A6
    block: A
    type: true-false
    title: "`als` mit Verb: richtig oder falsch?"
    instructions: "Mark each sentence R (richtig) or F (falsch)."
    items:
      - { q: "Ich arbeite als eine Ärztin.", answer: false, why: 'Ich arbeite als **Ärztin** (no article after `als` with profession).' }
      - { q: "Er hat als Journalist gearbeitet.", answer: true, why: "Correct." }
      - { q: "Sie ist als die Managerin angestellt.", answer: false, why: 'Sie ist als **Managerin** angestellt (no definite article after `als`).' }
      - { q: "Wir arbeiten als Kollegen zusammen.", answer: true, why: '`als Kollegen` = as colleagues (plural noun, no article needed).' }
      - { q: "Er war als ein Koch tätig.", answer: false, why: 'Er war als **Koch** tätig (no article after `als`).' }
      - { q: "Anna möchte als Lehrerin arbeiten.", answer: true, why: "Correct." }

