  - id: A9
    block: A
    type: gap-text
    listLayout: true
    title: "Konjugation: Verben zur Arbeit"
    instructions: "Schreibe die richtige Verbform."
    instructionsEn: "Write the correct verb form."
    text: |
      1. Er {1} (arbeiten) seit drei Jahren als Ingenieur.
      2. Wann {2} (anfangen) dein Arbeitstag?
      3. Ich {3} (sich bewerben) für die Stelle als Buchhalter.
