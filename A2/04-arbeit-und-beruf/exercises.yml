  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-bank
    title: "Dialog ergänzen"
    instructions: "Fülle die 7 Lücken mit Wörtern aus dem Kasten. Vier Wörter werden nicht gebraucht."
    instructionsEn: "Fill in the 7 gaps with words from the box. Four words are not needed."
    text: |
      — Entschuldigung, ich interessiere mich für die {1} als Buchhalter.
      — Ja, bitte. Haben Sie schon {2} in diesem Bereich?
      — Ja, ich habe zwei Jahre {3} Buchhalter bei einer kleinen Firma gearbeitet.
      — Sehr gut. Wann können Sie Ihre {4} schicken?
      — {5} es Ihnen recht ist, schicke ich alles bis morgen.
      — Das wäre ideal. {6} die {7} da sind, melden wir uns.
    bank: [wenn, als, weil, Stelle, Bewerbung, Unterlagen, Erfahrung, ob, Gehalt, wenn, Unterlagen]
    answers:
