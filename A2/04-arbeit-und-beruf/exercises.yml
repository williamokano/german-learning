  # ── Block A — Basistraining ───────────────────────────────────────────────

  - id: A1
    block: A
    type: gap-text
    listLayout: true
    title: "`wenn`-Sätze: Verben ans Ende"
    instructions: "Move the verb to the correct position in the `wenn`-clause. Write the final verb."
    text: |
      1. Er ruft an. → Er ruft an, wenn er fertig {1}.
      2. Wir fangen an. → Wir fangen an, wenn alle da {2}.
      3. Ich schreibe noch mal. → Ich schreibe noch mal, wenn ich keine Antwort {3}.
      4. Sie ist glücklich. → Sie ist glücklich, wenn die Arbeit interessant {4}.
      5. Herr Keller hilft. → Herr Keller hilft, wenn man Fragen {5}.
      6. Bruno geht in die Kantine. → Bruno geht in die Kantine, wenn er Hunger {6}.
    answers:
      "1": ist
      "2": sind
      "3": bekomme
      "4": ist
      "5": hat
      "6": hat

  - id: A2
    block: A
    type: gap-text
    listLayout: true
    title: "`wenn`-Satz vorne: Inversion"
    instructions: "Rewrite each sentence with the `wenn`-clause first. The gap is the main-clause verb (which comes immediately after the comma)."
    text: |
      1. Bruno ist pünktlich, wenn der Zug kommt. → Wenn der Zug kommt, {1} Bruno pünktlich.
      2. Sie lernt schnell, wenn sie jeden Tag übt. → Wenn sie jeden Tag übt, {2} sie schnell.
      3. Herr Steinmeyer vereinbart einen Termin, wenn die Unterlagen da sind. → Wenn die Unterlagen da sind, {3} Herr Steinmeyer einen Termin.
      4. Anna hilft Bruno, wenn er Probleme hat. → Wenn er Probleme hat, {4} Anna Bruno.
      5. Ich verdiene mehr, wenn ich Vollzeit arbeite. → Wenn ich Vollzeit arbeite, {5} ich mehr.
      6. Man versteht viel, wenn man aufmerksam zuhört. → Wenn man aufmerksam zuhört, {6} man viel.
    answers:
      "1": ist
      "2": lernt
      "3": vereinbart
      "4": hilft
      "5": verdiene
      "6": versteht

  - id: A3
    block: A
    type: gap-text
    listLayout: true
    title: "`wenn`-Satz mit Modalverb"
    instructions: "Complete the `wenn`-clause with the correct form of the modal verb (infinitive before modal, both at the end)."
    text: |
      1. Wenn ich früher aufhören {1} (aufhören können), komme ich pünktlich.
      2. Wenn man einen Termin {2} (vereinbaren wollen), muss man anrufen.
      3. Wenn er die Stelle {3} (bekommen wollen), muss er sich bewerben.
      4. Wenn wir morgen nicht {4} (arbeiten müssen), gehen wir ins Café.
      5. Wenn du mir {5} (helfen können), wäre das super.
    answers:
      "1": kann
      "2": will
      "3": will
      "4": müssen
      "5": kannst

  - id: A4
    block: A
    type: gap-text
    listLayout: true
    title: "`wenn`-Satz mit Perfekt"
    instructions: "Complete the `wenn`-clause using the Perfekt. Each item has two gaps (Partizip II + auxiliary)."
    text: |
      1. Wenn Bruno die E-Mail {1} {2}, wartet er auf eine Antwort.
      2. Wenn Frau Weber die Unterlagen {3} {4}, vereinbaren wir einen Termin.
      3. Wenn ich den Lebenslauf {5} {6}, rufe ich an.
      4. Wenn er sich {7} {8}, braucht er Informationen über die Firma.
      5. Wenn der Kurs {9} {10}, kaufe ich ein neues Buch.
    answers:
      "1": geschickt
      "2": hat
      "3": eingereicht
      "4": hat
      "5": gelesen
      "6": habe
      "7": beworben
      "8": hat
      "9": angefangen
      "10": hat

  - id: A5
    block: A
