      "2": Erfahrung
      "3": als
      "4": Unterlagen
      "5": wenn
      "6": wenn
      "7": Unterlagen

  - id: B2
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
    instructions: "Jeder Satz hat genau einen Fehler. Das falsche Wort oder die falsche Position steht als Lücke — schreibe die richtige Form."
    instructionsEn: "Each sentence has exactly one mistake. The wrong word/position is shown as a gap — write the correct form."
    text: |
      1. Wenn er fertig ist, {1} sofort. (er kommt → ?)
      2. Ich arbeite als {2} Ärztin in Hamburg. (eine → ?)
      3. Wenn ich keine Arbeit finde, {3} die Miete nicht zahlen. (ich kann → ?)
      4. Sie hat sich {4} für die neue Stelle. (bewerben → ?)
      5. Er macht Überstunden, wenn viele Gäste {5} (da sein → ?).
      6. Wir vereinbaren einen Termin, wenn die Unterlagen {6}. (sind da → ?)
      7. Ich habe drei {7} als Lehrer gearbeitet. (Jahr → ?)
      8. Als Student {8} ich kein Geld verdienen. (bin → ?)
    answers:
      "1": "kommt er"
      "2": "Ärztin"
      "3": "kann ich"
      "4": "beworben"
      "5": "sind"
      "6": "da sind"
      "7": "Jahre"
      "8": "verdiene"

  - id: B3
    block: B
    type: gap-text
    listLayout: true
    title: "Sätze verbinden: `wenn`, `weil`, `deshalb`"
    instructions: "Verbinde mit dem angegebenen Konnektor. Die Lücke ist der Konnektor (und ggf. das Verb am Ende des wenn-Satzes)."
    instructionsEn: "Combine using the connector given. The gap is the connector (and any required verb at the end of the wenn-clause)."
    text: |
      1. Ich habe viel Erfahrung. → {1} ich viel Erfahrung habe, bekomme ich die Stelle.
      2. Er braucht Geld. → Er arbeitet viel, {2} er Geld braucht.
      3. Sie hat eine gute Bewerbung geschrieben. → {3} bekommt sie das Vorstellungsgespräch.
      4. Du lernst viel. → {4} du viel lernst, sprichst du bald gut Deutsch.
      5. Der Bus kommt zu spät. → Ich bin nicht pünktlich, {5} der Bus zu spät kommt.
      6. Herr Steinmeyer bekommt die Unterlagen bis Montag. → {6} er die Unterlagen bis Montag bekommt, vereinbart er einen Termin.
    answers:
      "1": Wenn
      "2": weil
      "3": Deshalb
      "4": Wenn
      "5": weil
      "6": Wenn

