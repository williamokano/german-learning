    instructions: "Jede Aufgabe hat zwei Lücken: das konjugierte Verb (Position 2) und die trennbare Vorsilbe (am Satzende)."
    instructionsEn: "Each item has two gaps: the conjugated verb (position 2) and the separable prefix (end of clause)."
    text: |
