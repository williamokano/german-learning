# Reviewed from A2/04 lesson.md §4 Wortschatz.
# The V2 parser captured 51 entries from the three tables (Berufe m/f pairs,
# Arbeitswelt nouns, Verben). Hand-review findings:
#   - Spurious phrase entry: the n-Deklination footnote paragraph ("`der Journalist`
#     and `der Student` are n-Deklination nouns…") was scraped as a single `phrase`
#     entry. Deleted.
#   - Missing feminine forms: the parser does not split cells with the slash
#     notation `der Kollege, -n / die Kollegin, -nen`. Hand-added Kollegin and
#     Chefin (both appear in §1 dialogs and §7 reading text).
#   - Plural needsReview false alarms: Firma→Firmen, Kollege→Kollegen, Chef→Chefs.
#     All are listed in §4 with the correct plural; just not what the parser
#     guessed (null).
#   - Verb English gloss: the parser captured Perfekt forms (e.g. "hat gekündigt")
#     or parenthetical uses (e.g. "als + job", "sich") instead of the English
#     column. Hand-fixed all 10 verbs from the third column.
#   - n-Deklination flag: Journalist and Student get an extra `weak-noun` tag
#     so downstream cards can highlight the genitive/dative -en ending
#     (fully taught at B1).
#
# Section headers in lesson.md:
#   Berufe (m/f pairs, 12 + 12)           — 24 entries
#   Arbeitswelt (workplace, 14 nouns + 2 split-form rows) — 16 entries
#   Verben zur Arbeit                      — 10 entries
#                                        Total: 50 entries
