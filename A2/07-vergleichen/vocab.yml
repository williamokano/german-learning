# Reviewed from A2/07 lesson.md §4 Wortschatz. Bootstrapped with build/import-vocab.ts.
# Tag taxonomy mirrors the A1/02 (adjectives) and A1/03 (nouns) gold standards.
#
# Note: the parser dropped several things — fixed below:
#   1. The §4.1 adjective table is `| Adjektiv | English | Comparative | Superlative |`
#      (4-col). The parser captured `de` + the shortest English cell correctly, but
#      the comparative/superlative forms had nowhere to live. Stored in `example:`
#      per the F1 review convention.
#   2. `findEnglishCellIndex` heuristics picked the comparative as the gloss for
#      rows where the base-form English cell was longer than the comparative
#      ("teuer / teurer", "leicht / leichter", …). Fixed per lemma.
#   3. `günstig / billig` were merged into one phrase entry with double space
#      (the parser strips `/` from cells). Split into two lemma entries.
#   4. The descriptive prose line beginning "Umlaut changes: many one-syllable
#      adjectives add an umlaut in comparative and superlative (…)" was
#      captured as a single `pos: phrase` entry with empty gloss. Deleted —
#      it's grammar commentary, not vocab. The umlaut pairs themselves are
#      preserved as `example:` notes on each umlaut-taking lemma.
#   5. Several adjectives ending in single `-n` (klein, modern, schön, gern)
#      got `tags: [verb]` from the parser's regex `/^[a-zäöü][a-zäöüß]*(en|n)$/`.
#      Fixed to `tags: [adjective]` (gern also gets `comparative` for its
#      irregular lieber/am liebsten forms).
#   6. The verb table's "Notes" column carried Perfekt forms ("ist gestiegen",
#      "hat übertreffen") as the English gloss. Replaced with proper to-infinitives.
#
# Section headers in lesson.md:
#   Adjektive für Vergleiche (adjectives for comparing) — 21 rows; the
#     günstig/billig synonym pair counts as two.
#   Nomen für Statistiken und Einkaufen — 14 nouns.
#   Verben und Ausdrücke (verbs and expressions) — 5 verbs + 1 phrase.
