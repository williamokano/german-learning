  - id: B6
    block: B
    type: free-write
    title: "Übersetzen (EN → DE)"
    prompt: "Translate each English sentence into German. Use the correct comparative or superlative form."
    stimulus: |
      1. Berlin is bigger than Vienna.
      2. Munich is as expensive as Zurich.
      3. This laptop is the cheapest in the shop.
      4. She speaks German better than I do.
      5. I prefer (like best) pizza.
      6. Which hotel is the quietest?
