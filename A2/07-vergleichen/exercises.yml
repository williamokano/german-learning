  # ── Block B — Vertiefung ──────────────────────────────────────────────────

  - id: B1
    block: B
    type: gap-text
    listLayout: true
    title: "Dialog ergänzen"
    instructions: "Fill in the blanks with the correct comparative or superlative form. 8 gaps."
    text: |
      — Anna, welches Café gefällt dir {1} (gut)?
      — Das hier ist das {2} (gemütlich, attr. n) Café in der Straße, finde ich.
      — Stimmt! Und der Kaffee hier ist {3} (gut) als im Café Stern.
      — Ja, aber Café Stern ist {4} (billig). Der Kaffee dort kostet fast
        halb so viel {5} hier.
      — Hm, Qualität ist mir {6} (wichtig) als der Preis. Ich zahle gerne
        ein bisschen {7} (viel).
      — Du hast recht. Und die Stühle hier sind viel {8} (bequem) als dort!
    answers:
      "1": "am besten"
      "2": gemütlichste
      "3": besser
      "4": billiger
      "5": wie
      "6": wichtiger
      "7": mehr
      "8": bequemer

  - id: B2
    block: B
    type: gap-text
    listLayout: true
    title: "Finde den Fehler"
    instructions: "Each sentence has exactly one mistake. Write the corrected word/phrase in the gap."
    text: |
      1. Berlin ist größer {1} Wien. (wie → ?)
      2. Das ist der schnellst{2} Zug in Deutschland. (missing ending)
      3. München ist so groß {3} Berlin. (als → ?)
      4. Das blaue Kleid ist eleganter{4} als das rote. (extra ending)
      5. Er ist älter {5} ich. (wie → ?)
      6. Das ist {6} besten Ergebnis in der Klasse. (wrong article form)
      7. Sie singt {7} als ihr Bruder. (gern → comparative needed)
      8. Hoch → Superlativ: der hochst{8} Berg. (missing umlaut)
      9. Dieses Modell kostet mehr {9} das andere. (wie → ?)
      10. Am kältest{10} Monat ist der Januar. (article wrong / missing -e-)
    answers:
      "1": als
      "2": "schnellste (-e ending for m Nom.)"
      "3": wie
      "4": "eleganter (-er only, no extra -e)"
      "5": als
      "6": "das beste"
      "7": lieber
      "8": "höchste (umlaut)"
      "9": als
      "10": "Der kälteste"

