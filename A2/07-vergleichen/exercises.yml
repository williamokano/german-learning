  - id: D2
    block: D
    type: odd-one-out
    title: "Odd one out"
    instructions: "Cross out the word that doesn't fit."
    groups:
      - items: [größer, besser, mehr, schneller, neueren]
        odd: 4
        why: "neueren is an attributive adjective form — doesn't belong with the predicative comparative group."
      - items: [am besten, am liebsten, am meisten, am schöneren]
        odd: 3
        why: "am schöneren is an invalid form — superlatives use -sten, not -eren."
      - items: [als, wie, genauso, obwohl]
        odd: 3
        why: "obwohl is a concessive conjunction — not a comparison word."
      - items: [teuer, günstig, billig, modern, mehr]
        odd: 4
        why: "mehr is a quantity word — not a quality adjective describing a property."
      - items: [Preis, Einwohner, Vergleich, Unterschied, lieber]
        odd: 4
        why: "lieber is an adverb/comparative — not a noun; all others are nouns."
      - items: [steigen, sinken, vergleichen, schnellste]
        odd: 3
        why: "schnellste is an adjective form — all others are verbs."

