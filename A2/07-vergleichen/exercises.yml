lesson: A2/07
title: "A2 · Lektion 7 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - { q: "Anna und Bruno sind in einem Kaufhaus.", answer: true, why: "Anna and Bruno are in a shop / department store." }
      - { q: "Das rote Kleid ist teurer als das blaue.", answer: false, why: "The blue dress is more expensive than the red one." }
      - { q: "Bruno findet das blaue Kleid schöner.", answer: true, why: "Bruno says the blue one is schöner." }
      - { q: "Am Ende kauft Anna das rote Kleid.", answer: false, why: "Anna buys the blue dress in the end." }

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Was sucht Frau Weber?"
        options:
          - { key: a, text: "Ein Kleid" }
          - { key: b, text: "Einen Laptop" }
          - { key: c, text: "Ein Smartphone" }
        answer: b
        why: "Einen Laptop."
      - q: "Welcher Laptop ist am günstigsten?"
        options:
          - { key: a, text: "Der schwarze" }
          - { key: b, text: "Der graue" }
          - { key: c, text: "Der mit 449 Euro" }
        answer: c
        why: "Der mit 449 Euro."
      - q: "Was ist besser beim schwarzen Laptop?"
        options:
          - { key: a, text: "Das Design" }
          - { key: b, text: "Der Akku" }
          - { key: c, text: "Der Preis" }
        answer: b
        why: "Der Akku (sechs Stunden länger)."
      - q: "Was kauft Frau Weber am Ende?"
        options:
          - { key: a, text: "Den günstigsten Laptop" }
          - { key: b, text: "Den schwarzen Laptop" }
          - { key: c, text: "Keinen Laptop" }
        answer: b
        why: "Den schwarzen Laptop."

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Listen and fill in the 7 missing words. Two words in the box are not needed."
    text: |
      Yuki wohnt in München und macht gerade einen Deutschkurs. Gestern hat sie mit
      ihrer Freundin Hana über Smartphones {1}. Yukis Handy ist {2} als
      Hanas Handy, aber es {3} noch gut. Hanas neues Modell ist {4} und
      hat einen {5} Akku. Es kostet aber fast {6} so viel wie Yukis Handy.
      Am Ende hat Yuki {7}: Sie kauft vorerst kein neues Handy — ihr altes ist gut genug!
    bank: [älter, besseren, billiger, dreimal, entschieden, funktioniert, gesprochen, neueres, schneller]
    answers:
      "1": gesprochen
      "2": älter
      "3": funktioniert
      "4": schneller
      "5": besseren
      "6": dreimal
      "7": entschieden

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Tom braucht einen Rat"
    audio: transcript_ansage1.mp3
    instructions: "Listen to the voice message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: "Hallo Anna, hier ist Tom. Ich rufe an wegen meinem neuen Auto. Ich habe zwei Modelle gefunden: einen blauen Kleinwagen für neuntausend Euro und einen größeren silbernen Wagen für zwölftausend Euro. Der blaue ist günstiger und sparsamer, aber der silberne ist schneller und bequemer. Er hat auch einen stärkeren Motor. Ich kann mich nicht entscheiden. Bitte ruf mich zurück und sag mir, was du denkst. Vielen Dank!"
    items:
      - q: "Worüber ruft Tom an?"
        options:
          - { key: a, text: "Wegen seiner alten Wohnung." }
          - { key: b, text: "Wegen seinem neuen Auto." }
          - { key: c, text: "Wegen seinem neuen Job." }
        answer: b
        why: "Wegen meinem neuen Auto."
      - q: "Wie viel kostet der silberne Wagen?"
        options:
          - { key: a, text: "Neuntausend Euro." }
          - { key: b, text: "Zwölftausend Euro." }
          - { key: c, text: "Fünfzehntausend Euro." }
        answer: b
        why: "Zwölftausend Euro."
      - q: "Welcher Wagen ist sparsamer?"
        options:
          - { key: a, text: "Der blaue." }
          - { key: b, text: "Der silberne." }
          - { key: c, text: "Beide gleich." }
        answer: a
        why: "Der blaue ist günstiger und sparsamer."
      - q: "Was soll Anna tun?"
        options:
          - { key: a, text: "Zurückrufen und ihre Meinung sagen." }
          - { key: b, text: "Eine E-Mail schicken." }
          - { key: c, text: "Den Wagen für Tom kaufen." }
        answer: a
        why: "Bitte ruf mich zurück und sag mir, was du denkst."

