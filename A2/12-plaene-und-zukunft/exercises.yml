lesson: A2/12
title: "A2 · Lektion 12 — Übungen (Exercises)"
intro: >
  Blocks: H Hören → A Basistraining → B Vertiefung → C Prüfungstraining →
  D Wiederholung & Selbsttest. Answers in solutions.md.
  Tip: spread the blocks over several days — H and A on day 1, B on day 2,
  C on day 3, D on the day 4 after a pause.
exam: null

exercises:

  # ── Block H — Hören ──────────────────────────────────────────────────────

  - id: H1a
    block: H
    type: true-false
    title: "Dialog Hör-Check: Dialog A (informell)"
    audio: dialog1_a.mp3
    instructions: "Höre Dialog A und entscheide: Richtig (R) oder Falsch (F)?"
    instructionsEn: "Listen to Dialog A and decide: Richtig (R) oder Falsch (F)?"
    items:
      - q: "Anna und Bruno sprechen über Pläne für das neue Jahr."
        answer: true
        why: 'Anna: „Bruno, hast du schon Pläne für dieses Jahr?".'
      - q: "Bruno wird dreimal pro Woche joggen."
        answer: true
        why: 'Bruno: „Ich werde mehr Sport machen — dreimal pro Woche joggen".'
      - q: "Bruno wird sofort mit dem Sport anfangen."
        answer: false
        why: 'Bruno: „Wenn das Wetter besser wird" — he will start later, not immediately.'
      - q: "Anna wird im Juli nach Brasilien fliegen."
        answer: true
        why: 'Anna: „Ich werde im Sommer nach Brasilien fliegen … Im Juli".'
      - q: "Anna und Bruno werden sich im Februar zum Lernen treffen."
        answer: true
        why: 'Anna: „Wir werden uns im Februar das erste Mal treffen".'

  - id: H1b
    block: H
    type: single-choice
    title: "Dialog Hör-Check: Dialog B (formell)"
    audio: dialog1_b.mp3
    instructions: "Höre Dialog B und wähle die richtige Antwort (a, b oder c)."
    instructionsEn: "Listen to Dialog B and choose the correct answer (a, b, or c)."
    items:
      - q: "Worüber möchte Frau Yilmaz mit Herrn Steinmeyer sprechen?"
        options:
          - { key: a, text: "Über das Projekt im März" }
          - { key: b, text: "Über den Urlaub im Sommer" }
          - { key: c, text: "Über das Catering" }
        answer: a
        why: 'Frau Yilmaz: „Ich möchte mit Ihnen über das Projekt im März sprechen".'
      - q: "Wann wird Frau Yilmaz das Konzept fertig haben?"
        options:
          - { key: a, text: "Bis Ende dieser Woche" }
          - { key: b, text: "Bis Ende nächster Woche" }
          - { key: c, text: "Bis Ende März" }
        answer: b
        why: 'Frau Yilmaz: „Ich werde es bis Ende nächster Woche fertig haben".'
      - q: "Wann wird die Präsentation stattfinden?"
        options:
          - { key: a, text: "Am ersten März" }
          - { key: b, text: "Am zehnten März" }
          - { key: c, text: "Am fünfzehnten März" }
        answer: c
        why: 'Frau Yilmaz: „Ich werde sie am fünfzehnten März halten".'
      - q: "Was werden sie tun, wenn das Wetter schlecht ist?"
        options:
          - { key: a, text: "Die Veranstaltung absagen" }
          - { key: b, text: "Die Veranstaltung in den Konferenzraum verlegen" }
          - { key: c, text: "Einen anderen Tag wählen" }
        answer: b
        why: 'Frau Yilmaz: „Wenn es regnet, werden wir die Veranstaltung in den Konferenzraum verlegen".'

  - id: H3
    block: H
    type: gap-bank
    title: "Hörtext-Lückentext"
    audio: hoertext.mp3
    instructions: "Höre und ergänze die 6 fehlenden Wörter. Drei Wörter im Kasten werden nicht gebraucht."
    instructionsEn: "Listen and fill in the 6 missing words. Three words in the box are not needed."
    text: |
      Guten Abend und willkommen zur Wettervorhersage für Berlin und Umgebung.
      {1}, am Dienstag, wird es den ganzen Tag sonnig, die
      Temperatur wird 24 Grad sein. Am Mittwoch wird es wärmer — {2}
      zu 28 Grad. Am Donnerstag wird es leider {3}, und am
      Freitag wird es Gewitter {4}. Am Wochenende wird das Wetter
      wieder {5}: Sonne, 25 Grad, schwacher Wind. {6} Sie Ausflüge
      planen — Samstag und Sonntag sind die besten Tage.
    bank: [Morgen, bis, regnen, geben, Wenn, besser, wird, werden, Gewitter]
    answers:
      "1": Morgen
      "2": bis
      "3": regnen
      "4": geben
      "5": besser
      "6": Wenn

  - id: H4
    block: H
    type: single-choice
    title: "Kurze Ansage: Ein Anruf aus Lissabon"
    audio: transcript_ansage1.mp3
    instructions: "Höre die Sprachnachricht. Wähle dann die richtige Antwort (a, b oder c). Höre einmal, bevor du das Transkript unten liest."
    instructionsEn: "Listen to the voice message. Then choose the correct answer (a, b, or c). Listen once before reading the transcript below."
    transcript: 'Hallo Anna, hier ist Lisa. Ich bin gerade am Flughafen in Lissabon gelandet. Mein Flug nach Berlin am Sonntag wurde gestrichen — ich werde erst am Dienstag zurückfliegen. Die Airline wird mir ein Hotel für zwei Nächte bezahlen. Ich werde am Dienstag um achtzehn Uhr in Berlin landen. Bitte ruf mich zurück, wenn du mich am Flughafen abholen kannst! Tschüss!'
    items:
      - q: "Wo ist Lisa gerade?"
        options:
          - { key: a, text: "Am Flughafen in Berlin." }
          - { key: b, text: "Am Flughafen in Lissabon." }
          - { key: c, text: "Am Flughafen in Wien." }
        answer: b
        why: '„Ich bin gerade am Flughafen in Lissabon gelandet".'
      - q: "Warum wird Lisa erst am Dienstag zurückfliegen?"
        options:
          - { key: a, text: "Weil sie länger Urlaub machen will." }
          - { key: b, text: "Weil ihr Flug am Sonntag gestrichen wurde." }
          - { key: c, text: "Weil die Airline keine Plätze mehr hat." }
        answer: b
        why: '„Mein Flug nach Berlin am Sonntag wurde gestrichen".'
      - q: "Was wird die Airline für Lisa tun?"
        options:
          - { key: a, text: "Sie wird ihr ein Hotel für zwei Nächte bezahlen." }
          - { key: b, text: "Sie wird ihr ein neues Flugticket schenken." }
          - { key: c, text: "Sie wird sie mit dem Bus nach Hause bringen." }
        answer: a
        why: '„Die Airline wird mir ein Hotel für zwei Nächte bezahlen".'
      - q: "Wann wird Lisa in Berlin landen?"
        options:
          - { key: a, text: "Am Sonntag um achtzehn Uhr." }
          - { key: b, text: "Am Dienstag um achtzehn Uhr." }
          - { key: c, text: "Am Mittwoch um achtzehn Uhr." }
        answer: b
        why: '„Ich werde am Dienstag um achtzehn Uhr in Berlin landen".'

